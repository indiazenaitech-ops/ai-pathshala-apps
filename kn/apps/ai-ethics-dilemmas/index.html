  <style>
    .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
    [dir="rtl"] .flip { display: inline-block; transform: scaleX(-1); }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .nav-row { gap: 10px; }
    .nav-group { display: flex; gap: 8px; flex: 1 1 420px; min-width: 0; }
    .nav-group select { flex: 1 1 auto; min-width: 0; width: 100%; font-weight: 600; min-height: 44px; }
    .nav-group .btn { flex: 0 0 auto; gap: 8px; }
    .tool-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .nav-row .btn { min-height: 44px; }
    @media (max-width: 560px) {
      .nav-lbl { display: none; }
      .nav-group .btn { min-width: 46px; padding-inline: 12px; }
      .tool-group .btn { flex: 1 1 auto; padding-inline: 10px; }
    }
    .prog-row { gap: 12px; }
    .prog-row .progress { flex: 1 1 160px; height: 12px; }
    .prog-row .progress > span { background: var(--success); }
    .prog-text { font-weight: 600; color: var(--muted); font-size: .9rem; }

    /* ---------- board ---------- */
    .board { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); align-items: start; }
    @media (max-width: 920px) { .board { grid-template-columns: minmax(0, 1fr); } }
    .side { display: grid; gap: 16px; min-width: 0; }

    .scene-head { display: flex; gap: 14px; align-items: flex-start; }
    .scene-icon { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 16px; background: var(--accent-soft); display: grid; place-items: center; font-size: 2.2rem; line-height: 1; }
    /* z-index: Nastaliq (Urdu) glyph boxes of the big title reach above the h2 and used to swallow taps on "Read aloud" */
    .scene-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; z-index: 1; }
    .scene-meta .btn-sm { min-height: 40px; }
    .scene-title { font-size: clamp(1.3rem, 2.6vw, 1.85rem); margin: 6px 0 0; }
    :root[lang="ur"] .scene-title { line-height: 1.75; }
    .scene.enter { animation: scene-in .28s ease-out; }
    @keyframes scene-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .pchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 12px; }
    .pchips-label { font-size: .82rem; font-weight: 700; color: var(--muted); margin-inline-end: 4px; }
    .pchip { --pc: var(--c1); display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 4px 12px; border-radius: 999px; font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; color: var(--text); border: 1px solid color-mix(in srgb, var(--pc) 50%, var(--border)); background: color-mix(in srgb, var(--pc) 13%, var(--surface)); }
    .pchip:hover { background: color-mix(in srgb, var(--pc) 22%, var(--surface)); }

    .story { font-size: 1.1rem; line-height: 1.75; margin: 0 0 18px; padding: 14px 16px; background: var(--surface-2); border-radius: var(--radius-sm); border-inline-start: 5px solid var(--accent); }
    :root[lang="ur"] .story { line-height: 2.1; }

    .step { display: flex; align-items: center; gap: 10px; font-size: 1.12rem; margin: 0 0 6px; }
    .step::before { content: attr(data-step); flex: 0 0 auto; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-size: .95rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; line-height: 1; }
    .step-hint { margin: 0 0 12px; }

    /* ---------- vote options (each row is also a bar of the chart) ---------- */
    .opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .opt { --oc: var(--c1); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "num text ctl" "num bar ctl"; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); transition: border-color .2s, box-shadow .2s; }
    .opt.lead { border-color: var(--oc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--oc) 35%, transparent); }
    .opt-num { grid-area: num; width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--oc); color: var(--surface); font-weight: 800; font-size: 1.1rem; display: grid; place-items: center; align-self: start; font-family: "Noto Sans", system-ui, sans-serif; line-height: 1; }
    .opt-text { grid-area: text; font-weight: 500; align-self: end; }
    .opt.other .opt-text { font-style: italic; color: var(--muted); }
    .opt-bar { grid-area: bar; align-self: start; min-width: 0; }
    .bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--oc); border-radius: inherit; transition: width .3s ease; }
    .bar-meta { font-size: .8rem; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .opt-ctl { grid-area: ctl; display: flex; align-items: center; gap: 6px; }
    .vbtn { width: 44px; height: 44px; border-radius: 12px; font: inherit; font-family: "Noto Sans", system-ui, sans-serif; font-size: 1.45rem; font-weight: 800; line-height: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; touch-action: manipulation; display: grid; place-items: center; padding: 0; }
    .vbtn:hover { background: var(--surface-2); }
    .vbtn:disabled { opacity: .45; cursor: default; }
    .vbtn.plus { width: 54px; background: var(--oc); border-color: var(--oc); color: var(--surface); }
    .vbtn.plus:hover { filter: brightness(1.08); background: var(--oc); }
    .vbtn:active { transform: scale(.95); }
    .vcount { min-width: 2.4ch; text-align: center; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    @media (max-width: 560px) {
      .opt { grid-template-areas: "num text text" "bar bar ctl"; gap: 8px 10px; }
      .opt-bar { align-self: center; }
      .vbtn { width: 42px; height: 42px; }
      .vbtn.plus { width: 50px; }
      .vcount { font-size: 1.4rem; }
    }
    .vote-foot { margin-top: 12px; gap: 8px 12px; }
    .vote-sum { font-weight: 700; margin: 0; }
    .vote-foot .btn-sm { min-height: 40px; }

    /* ---------- discussion + timer ---------- */
    .qlist { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 8px; }
    .qlist li { padding-inline-start: 4px; }
    .timer { margin-top: 14px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; }
    .timer-head { gap: 8px; }
    .timer-head h4 { margin: 0; font-size: 1rem; }
    .timer .seg button { min-height: 40px; min-width: 64px; }
    .timer-big { font-size: clamp(2.6rem, 6vw, 3.6rem); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.15; margin: 8px 0; font-family: "Noto Sans", system-ui, sans-serif; direction: ltr; }
    .timer.ending .timer-big { color: var(--warning); }
    .timer.done .timer-big { color: var(--danger); animation: pulse 1s ease-in-out 3; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .timer .progress > span { background: var(--accent); }
    .timer-btns { margin-top: 10px; }
    .timer-msg { margin: 10px 0 0; }

    .consider-list { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .consider-list li { background: var(--warning-soft); border-inline-start: 4px solid var(--warning); border-radius: var(--radius-sm); padding: 9px 12px; }
    .consider-btns { margin-top: 12px; }
    #discussedBtn[aria-pressed="true"] { background: var(--success-soft); border-color: var(--success); color: var(--text); }

    /* ---------- principles + all cards ---------- */
    .below { display: grid; gap: 16px; margin-top: 16px; }
    .ptiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin-top: 12px; }
    .ptile { --pc: var(--c1); text-align: start; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); border-top: 4px solid var(--pc); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .ptile:hover { background: var(--surface-2); }
    .ptile .pt-icon { font-size: 1.5rem; grid-row: span 3; line-height: 1.2; }
    .ptile .pt-name { font-weight: 800; }
    .ptile .pt-def { font-size: .88rem; color: var(--muted); }
    .ptile .pt-count { font-size: .8rem; font-weight: 700; color: var(--primary); }
    .filters { gap: 6px; margin: 4px 0 12px; }
    .filters .chip { min-height: 40px; }
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
    .tile { position: relative; text-align: start; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; min-height: 84px; }
    .tile:hover { background: var(--surface-2); }
    .tile[aria-current="true"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .tile .t-icon { font-size: 1.8rem; line-height: 1.2; }
    .tile .t-no { font-size: .78rem; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tile .t-title { font-weight: 700; display: block; line-height: 1.3; margin-top: 2px; }
    .tile .t-p { display: block; margin-top: 4px; font-size: .95rem; letter-spacing: 2px; }
    .tile.done { background: color-mix(in srgb, var(--success) 7%, var(--surface)); }
    .t-done { color: var(--success); font-weight: 800; }
    .empty { padding: 12px; }

    details#howto summary { cursor: pointer; font-size: 1.05rem; }
    details#howto[open] summary { margin-bottom: 10px; }
    .help-list { padding-inline-start: 1.3em; display: grid; gap: 6px; margin: 0 0 12px; }

    /* ---------- presenting (projector / smartboard) ---------- */
    /* the exit button sits in the toolbar flow, so long labels (ta, ml) never cover Random / Next */
    .present-exit[hidden] { display: none !important; }
    .presenting .edu-top, .presenting .edu-foot, .presenting .edu-intro, .presenting .below,
    .presenting .tool-extra, .presenting .prog-row, .presenting .step-hint { display: none !important; }
    .presenting .edu-main { max-width: none; padding: 14px 22px 22px; }
    .presenting .toolbar { padding: 10px 12px; margin-bottom: 12px; }
    .presenting .story { font-size: clamp(1.15rem, 1.9vw, 1.7rem); }
    .presenting .scene-title { font-size: clamp(1.5rem, 3vw, 2.6rem); }
    .presenting .opt-text { font-size: clamp(1.02rem, 1.5vw, 1.35rem); }
    .presenting .qlist { font-size: clamp(1rem, 1.4vw, 1.25rem); }
    .presenting .timer-big { font-size: clamp(3rem, 6.5vw, 5.5rem); }

    /* ---------- printing ---------- */
    /* compact enough that every card (also the Tamil / Malayalam teacher copy with answer lines) fits one A4 page */
    #printArea .p-head { border-bottom: 2px solid #333; margin-bottom: 4mm; padding-bottom: 2mm; }
    #printArea .p-head h1 { font-size: 14pt; margin: 0 0 1mm; }
    #printArea .p-head strong { font-size: 10pt; }

    #printArea .p-rules li + li::before { content: " · "; }

    #printArea.lines .pcard { margin-bottom: 0; break-after: page; page-break-after: always; }
    #printArea.lines .pcard:last-child { break-after: auto; page-break-after: auto; }
    #printArea .pc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5mm; }
    #printArea .pc-num { width: 9mm; height: 9mm; border-radius: 50%; border: 2px solid #000; display: grid; place-items: center; font-weight: 800; flex: 0 0 auto; font-family: "Noto Sans", sans-serif; }
    #printArea .pc-head h2 { font-size: 15pt; margin: 0; }
    #printArea .pc-icon { font-size: 18pt; }
    #printArea .pc-prin { font-size: 9.5pt; margin: 0 0 2mm; }
    #printArea .pc-story { font-size: 11pt; line-height: 1.45; margin: 0 0 2mm; }
    #printArea h3 { font-size: 11pt; margin: 2.5mm 0 1mm; }
    #printArea .pc-opts { list-style: none; padding: 0; margin: 0; font-size: 10.5pt; line-height: 1.4; }
    #printArea .pc-opts li { margin: 0 0 1mm; display: flex; gap: 6px; }
    #printArea .box { flex: 0 0 auto; width: 4.2mm; height: 4.2mm; border: 1.5px solid #000; border-radius: 2px; margin-top: .8mm; }
    #printArea .pc-qs { margin: 0; padding-inline-start: 1.3em; font-size: 10.5pt; line-height: 1.4; }
    #printArea .pc-answer p { margin: 2mm 0 0; font-weight: 700; font-size: 10.5pt; }
    #printArea .pc-line { border-bottom: 1px solid #666; height: 8mm; }
    #printArea .pc-consider { margin-top: 2.5mm; padding: 1.5mm 3mm; border: 1px dashed #666; border-radius: 6px; font-size: 9.5pt; line-height: 1.4; }
    #printArea .pc-consider ul { margin: 0; padding-inline-start: 1.2em; }
    #printArea .pc-foot { font-size: 8pt; color: #444; margin: 2mm 0 0; text-align: end; }
    :root[lang="ur"] #printArea .pc-story, :root[lang="ur"] #printArea .pc-opts, :root[lang="ur"] #printArea .pc-qs,
    :root[lang="ur"] #printArea .pc-consider, :root[lang="ur"] #printArea .pc-prin, :root[lang="ur"] #printArea .p-head { line-height: 2; }

      #app > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
      .present-exit { display: none !important; }
      @page { margin: 12mm; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card toolbar" id="toolbar">
      <div class="row nav-row">
        <div class="nav-group">
          <button class="btn" id="prevBtn" type="button" data-i18n-aria-label="previous"><span class="flip" aria-hidden="true">◀</span><span class="nav-lbl" data-i18n="previous" aria-hidden="true"></span></button>
          <label class="sr-only" for="jump" data-i18n="choose_card"></label>
          <select id="jump"></select>
          <button class="btn" id="nextBtn" type="button" data-i18n-aria-label="next"><span class="nav-lbl" data-i18n="next" aria-hidden="true"></span><span class="flip" aria-hidden="true">▶</span></button>
        </div>
        <div class="tool-group">
          <button class="btn btn-accent" id="randomBtn" type="button" data-i18n-title="random_hint"><span aria-hidden="true">🎲</span> <span data-i18n="random_card"></span></button>
          <button class="btn tool-extra" id="presentBtn" type="button"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          <button class="btn tool-extra" id="printBtn" type="button"><span aria-hidden="true">🖨️</span> <span data-i18n="print"></span></button>
          <button class="btn btn-danger tool-extra" id="resetBtn" type="button" data-i18n="reset"></button>
          <button class="btn btn-primary present-exit" id="exitPresentBtn" type="button" hidden><span aria-hidden="true">✕</span> <span data-i18n="exit_present"></span></button>
        </div>
      </div>
      <div class="row prog-row">
        <div class="progress" role="progressbar" id="progBarWrap" aria-valuemin="0" aria-valuemax="12" aria-labelledby="progText"><span id="progBar"></span></div>
        <span class="prog-text" id="progText"></span>
      </div>
    </section>

    <div class="board">
      <article class="card scene" id="scene">
        <div class="scene-head">
          <div class="scene-icon" id="sceneIcon" aria-hidden="true"></div>
          <div class="grow">
            <div class="scene-meta">
              <span class="badge primary" id="cardNo"></span>
              <button class="btn btn-sm btn-ghost" id="readBtn" type="button" aria-pressed="false"><span aria-hidden="true" id="readIcon">🔊</span> <span id="readLabel"></span></button>
            </div>
            <h2 class="scene-title" id="sceneTitle"></h2>
          </div>
        </div>
        <div class="pchips" id="sceneChips"></div>
        <p class="story" id="story"></p>

        <h3 class="step" data-step="1" data-i18n="vote_title"></h3>
        <p class="muted small step-hint" data-i18n="vote_hint"></p>
        <ol class="opts" id="opts"></ol>
        <div class="row spread vote-foot">
          <p class="vote-sum" id="voteSum" aria-live="polite"></p>
          <button class="btn btn-sm btn-danger" id="clearVotesBtn" type="button" data-i18n="clear_votes"></button>
        </div>
      </article>

      <div class="side">
        <section class="card" id="discussCard">
          <h3 class="step" data-step="2" data-i18n="discuss_title"></h3>
          <ol class="qlist" id="questions"></ol>
          <div class="timer" id="timer">
            <div class="row spread timer-head">
              <h4 data-i18n="timer_title"></h4>
              <div class="seg" id="timerSeg" role="group"></div>
            </div>
            <div class="timer-big" id="timerDisplay" role="timer" data-i18n-aria-label="time_left">03:00</div>
            <div class="progress"><span id="timerBar" style="width:100%"></span></div>
            <div class="row timer-btns">
              <button class="btn btn-primary" id="timerStart" type="button"><span aria-hidden="true" id="timerStartIcon">▶</span> <span id="timerStartLabel"></span></button>
              <button class="btn" id="timerReset" type="button"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
            </div>
            <p class="timer-msg callout accent" id="timerMsg" aria-live="assertive" hidden></p>
          </div>
        </section>

        <section class="card" id="considerCard">
          <h3 class="step" data-step="3" data-i18n="consider_title"></h3>
          <p class="muted small step-hint" data-i18n="consider_hint"></p>
          <div class="row consider-btns">
            <button class="btn btn-primary" id="revealBtn" type="button" aria-expanded="false" aria-controls="considerList"><span aria-hidden="true">💡</span> <span id="revealLabel"></span></button>
            <button class="btn" id="discussedBtn" type="button" aria-pressed="false"><span aria-hidden="true">✓</span> <span id="discussedLabel"></span></button>
          </div>
          <ul class="consider-list" id="considerList" aria-live="polite" hidden></ul>
        </section>
      </div>
    </div>

    <div class="below">
      <section class="card" id="principlesCard">
        <h2 data-i18n="principles_title"></h2>
        <div class="callout">
          <strong data-i18n="inside_title"></strong>
          <span data-i18n="inside_text"></span>
        </div>
        <div class="ptiles" id="ptiles"></div>
      </section>

      <section class="card" id="cardsCard">
        <h2 data-i18n="all_cards"></h2>
        <div class="row filters" id="filters" role="group" data-i18n-aria-label="show_about"></div>
        <div class="tiles" id="tiles"></div>
      </section>

      <details class="card" id="howto">
        <summary><strong data-i18n="help_title"></strong></summary>
        <ol class="help-list">
          <li data-i18n="help_1"></li>
          <li data-i18n="help_2"></li>
          <li data-i18n="help_3"></li>
          <li data-i18n="help_4"></li>
          <li data-i18n="help_5"></li>
          <li data-i18n="help_6"></li>
        </ol>
        <h3 data-i18n="rules_title"></h3>
        <ul class="help-list">
          <li data-i18n="rule_1"></li>
          <li data-i18n="rule_2"></li>
          <li data-i18n="rule_3"></li>
          <li data-i18n="rule_4"></li>
        </ul>
        <p class="small muted mb0" data-i18n="keys_hint"></p>
      </details>
    </div>

    <div id="printArea" class="print-only"></div>
  </main>
  <script src="../../../apps/ai-ethics-dilemmas/../../shared/edu.js"></script>
  <script src="../../../apps/ai-ethics-dilemmas/strings.js"></script>
  <script src="../../../apps/ai-ethics-dilemmas/content.js"></script>
  <script src="../../../apps/ai-ethics-dilemmas/app.js"></script>
</body>
</html>
