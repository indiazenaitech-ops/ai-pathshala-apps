  <style>
    .help summary { cursor: pointer; min-height: 32px; padding: 4px 0; }
    .tips { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .tips li + li { margin-top: 6px; }
    .seg button { min-height: 40px; }
    .ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .ctl .field { gap: 4px; }
    .flabel { font-weight: 600; font-size: .88rem; }
    .lv-desc { margin: 8px 0 0; }

    .play { display: grid; gap: 18px; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; margin-top: 16px; }
    @media (max-width: 860px) { .play { grid-template-columns: minmax(0, 1fr); } }
    .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .bar .badge { font-size: .85rem; padding: 4px 10px; }
    .clock { margin-inline-start: auto; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .bwrap { position: relative; container-type: inline-size; width: min(100%, 560px); }
    .board { --n: 9; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
      aspect-ratio: 1 / 1; width: 100%; border: 3px solid var(--text); border-radius: 10px; overflow: hidden; background: var(--surface);
      user-select: none; -webkit-user-select: none; touch-action: manipulation; font-family: "Noto Sans", system-ui, sans-serif; }
    .cell { appearance: none; border: 0; margin: 0; padding: 0; min-width: 0; min-height: 0; position: relative; display: grid; place-items: center;
      background: var(--surface); color: var(--primary); cursor: pointer; font: inherit; font-weight: 600; line-height: 1;
      font-size: 1.4rem; font-size: calc(100cqw / var(--n) * .6);
      border-inline-end: 1px solid var(--border); border-bottom: 1px solid var(--border); -webkit-tap-highlight-color: transparent; }
    .cell.br { border-inline-end: 3px solid var(--text); }
    .cell.bb { border-bottom: 3px solid var(--text); }
    .cell.lc { border-inline-end: 0; }
    .cell.lr { border-bottom: 0; }
    .cell.given { color: var(--text); font-weight: 800; }
    .cell.hl { background: var(--primary-soft); }
    .cell.same { background: color-mix(in srgb, var(--primary) 30%, var(--surface)); }
    .cell.sel { background: color-mix(in srgb, var(--accent) 34%, var(--surface)); }
    .cell.bad { color: var(--danger); background: var(--danger-soft); }
    .cell.sel.bad { background: color-mix(in srgb, var(--danger) 30%, var(--surface)); }
    .cell.clash::after { content: ""; position: absolute; inset: 3px; border: 2px dashed var(--danger); border-radius: 6px; pointer-events: none; }
    .cell.hint-src { box-shadow: inset 0 0 0 3px var(--warning); }
    .cell.hinted { animation: pop .5s ease-out; box-shadow: inset 0 0 0 3px var(--success); }
    .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
    @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: none; } }
    .nts { display: grid; grid-template-columns: repeat(var(--nc), 1fr); width: 100%; height: 100%; padding: 1px; color: var(--muted);
      font-size: .6rem; font-size: calc(100cqw / var(--n) * var(--nf)); font-weight: 600; line-height: 1; }
    .nts span { display: grid; place-items: center; }
    .nts span.on { color: var(--accent); font-weight: 800; }
    .board.paused .cell, .board.busy .cell { color: transparent !important; }
    .board.paused .nts, .board.busy .nts { visibility: hidden; }
    .cover { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center;
      background: color-mix(in srgb, var(--surface) 82%, transparent); border-radius: 10px; font-weight: 700; font-size: 1.2rem; }

    .side > * + * { margin-top: 12px; }
    .pad { display: grid; grid-template-columns: repeat(var(--pc, 5), minmax(0, 1fr)); gap: 6px; }
    .pk { min-height: 56px; padding: 4px 2px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); border-radius: 12px;
      font: inherit; font-family: "Noto Sans", system-ui, sans-serif; font-size: 1.6rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; line-height: 1.05; box-shadow: var(--shadow); }
    .pk:hover { background: var(--surface-2); }
    .pk .rem { font-size: .7rem; font-weight: 600; color: var(--muted); }
    .pk.out { opacity: .4; }
    .pk.erase { font-size: 1.3rem; color: var(--danger); }
    .pad.notes .pk:not(.erase) { color: var(--accent); font-size: 1.15rem; font-weight: 600; }
    .acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .act { min-height: 58px; padding: 6px 2px; flex-direction: column; gap: 2px; font-size: .8rem; text-align: center; white-space: normal; line-height: 1.15; }
    .act .ic { font-size: 1.25rem; line-height: 1; }
    .act[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .more { display: flex; flex-wrap: wrap; gap: 8px; }
    .more .btn { flex: 1 1 auto; }
    .hintbox { min-height: 0; }
    .hintbox:empty { display: none; }
    .hintbox ol { margin: 6px 0 0; padding-inline-start: 1.3em; }
    .hintbox li + li { margin-top: 4px; }
    .hintbox p { margin: 0; }
    .done h2 { margin-bottom: 6px; }
    .done .big { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .lower { margin-top: 18px; }
    .stats td.num, .stats th.num { text-align: end; font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) { .stats th, .stats td { padding: 6px 4px; font-size: .82rem; } .stats td:first-child { min-width: 5.5em; } }
    .opts2 { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opts2 select { width: 100%; }
    :root[lang="ur"] .act, :root[lang="ur"] .pk .rem { line-height: 1.6; }

    /* ---------- print: puzzles on A4, answer keys on their own page ---------- */
    #print-area { display: none; }
    @media print {
      @page { size: A4; margin: 12mm; }
      .edu-intro { display: none !important; }
      #print-area { display: block !important; color: #000; }
      .pp-page { break-after: page; page-break-after: always; }
      .pp-page:last-child { break-after: auto; page-break-after: auto; }
      .pp-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5pt solid #000; padding-bottom: 2mm; margin-bottom: 5mm; font-size: 11pt; }
      .pp-head strong { font-size: 15pt; }
      .pp-list { display: grid; gap: 7mm 8mm; justify-items: center; }
      .per-1 .pp-list { grid-template-columns: 1fr; }
      .per-2 .pp-list { grid-template-columns: 1fr; }
      .per-4 .pp-list { grid-template-columns: 1fr 1fr; }
      .pp-key .pp-list { grid-template-columns: repeat(3, 1fr); gap: 6mm; }
      .pp-item { break-inside: avoid; }
      .pp-cap { font-size: 10.5pt; font-weight: 700; margin-bottom: 1.5mm; }
      .pp-grid { border-collapse: collapse; border: 2.2pt solid #000; font-family: "Noto Sans", Arial, sans-serif; }
      .pp-grid td { width: var(--cs); height: var(--cs); border: .6pt solid #555; text-align: center; vertical-align: middle; padding: 0;
        font-size: calc(var(--cs) * .58); font-weight: 700; line-height: 1; }
      .pp-grid td.br { border-right: 2.2pt solid #000; }
      .pp-grid td.bb { border-bottom: 2.2pt solid #000; }
      .pp-key .pp-grid td { font-weight: 500; }
      .pp-key .pp-grid td.g { font-weight: 800; }
      .pp-foot { margin-top: 5mm; font-size: 9pt; color: #333; text-align: center; }
      .pp-name { display: flex; gap: 10mm; font-size: 11pt; margin-bottom: 4mm; }
      .pp-name span { flex: 1; border-bottom: .8pt solid #000; min-height: 6mm; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro no-print" data-i18n="intro"></p>
    <details class="card no-print help">
      <summary><strong data-i18n="how_h"></strong></summary>
      <ul class="tips">
        <li data-i18n="tip_rules"></li><li data-i18n="tip_singles"></li><li data-i18n="tip_notes"></li>
        <li data-i18n="tip_pairs"></li><li data-i18n="tip_class"></li><li data-i18n="tip_print"></li>
      </ul>
      <p class="small muted mb0" style="margin-top:10px" data-i18n="kb_tip"></p>
    </details>

    <section class="card no-print" style="margin-top:14px" aria-labelledby="new-h">
      <h2 id="new-h" class="edu-sr" data-i18n="new_h"></h2>
      <div class="ctl">
        <div class="field">
          <span class="flabel" id="lbl-size" data-i18n="size_label"></span>
          <div class="seg" id="seg-size" role="group" aria-labelledby="lbl-size">
            <button type="button" data-n="9">9×9</button><button type="button" data-n="6">6×6</button><button type="button" data-n="4">4×4</button>
          </div>
        </div>
        <div class="field">
          <span class="flabel" id="lbl-level" data-i18n="level_label"></span>
          <div class="seg" id="seg-level" role="group" aria-labelledby="lbl-level">
            <button type="button" data-lv="easy" data-i18n="lv_easy"></button><button type="button" data-lv="medium" data-i18n="lv_medium"></button><button type="button" data-lv="hard" data-i18n="lv_hard"></button><button type="button" data-lv="expert" data-i18n="lv_expert"></button>
          </div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" id="btn-new"><span aria-hidden="true">↻</span> <span data-i18n="btn_new"></span></button>
          <button type="button" class="btn btn-accent" id="btn-daily"><span aria-hidden="true">📅</span> <span data-i18n="btn_daily"></span></button>
        </div>
      </div>
      <p class="small muted lv-desc" id="lv-desc"></p>
    </section>

    <div class="play no-print">
      <section aria-labelledby="board-h">
        <h2 id="board-h" class="edu-sr" data-i18n="board_aria"></h2>
        <div class="bar">
          <span class="badge primary" id="badge"></span>
          <span class="badge" id="kidbadge" hidden></span>
          <span class="clock" id="clock" role="timer" data-i18n-aria-label="timer_aria">00:00</span>
          <button type="button" class="btn btn-sm" id="btn-pause"></button>
        </div>
        <div class="bwrap">
          <div class="board" id="board" role="grid" data-i18n-aria-label="board_aria" dir="ltr"></div>
          <div class="cover" id="cover" hidden>
            <span id="cover-txt"></span>
            <button type="button" class="btn btn-primary" id="btn-resume" data-i18n="resume"></button>
          </div>
        </div>
      </section>

      <section class="side" aria-labelledby="side-h">
        <h2 id="side-h" class="edu-sr" data-i18n="controls_h"></h2>
        <div id="controls">
          <div class="pad" id="pad" dir="ltr"></div>
          <div class="acts" style="margin-top:10px">
            <button type="button" class="btn act" id="btn-notes" aria-pressed="false"><span class="ic" aria-hidden="true">✎</span><span data-i18n="notes"></span></button>
            <button type="button" class="btn act" id="btn-undo"><span class="ic" aria-hidden="true">↶</span><span data-i18n="undo"></span></button>
            <button type="button" class="btn act" id="btn-redo"><span class="ic" aria-hidden="true">↷</span><span data-i18n="redo"></span></button>
            <button type="button" class="btn act" id="btn-hint"><span class="ic" aria-hidden="true">💡</span><span data-i18n="hint"></span></button>
          </div>
          <div class="more" style="margin-top:10px">
            <button type="button" class="btn btn-sm" id="btn-check" data-i18n="check"></button>
            <button type="button" class="btn btn-sm" id="btn-fill" data-i18n="fill_notes"></button>
            <button type="button" class="btn btn-sm" id="btn-reveal" data-i18n="reveal_cell"></button>
            <button type="button" class="btn btn-sm btn-danger" id="btn-solve" data-i18n="reveal_all"></button>
          </div>
          <label class="check" style="margin-top:10px"><input type="checkbox" id="opt-mistakes"> <span data-i18n="show_mistakes"></span></label>
        </div>
        <div class="callout done" id="done" hidden tabindex="-1">
          <h2 id="done-title"></h2>
          <div class="big" id="done-time"></div>
          <p id="done-line" class="mb0"></p>
          <p id="done-extra" class="small mb0"></p>
          <div class="row" style="margin-top:10px">
            <button type="button" class="btn btn-primary" id="btn-again" data-i18n="btn_again"></button>
            <button type="button" class="btn" id="btn-print-this" data-i18n="print_this"></button>
          </div>
        </div>
        <div class="callout hintbox" id="hintbox" aria-live="polite"></div>
        <p class="tiny muted mb0" id="status" aria-live="polite"></p>
      </section>
    </div>

    <div class="grid-2 lower no-print">
      <section class="card" aria-labelledby="stats-h">
        <h2 id="stats-h" data-i18n="stats_h"></h2>
        <p class="small" id="streak"></p>
        <div class="scroll-x"><table class="table stats" id="stats"></table></div>
        <div class="row spread" style="margin-top:12px">
          <span class="tiny muted" data-i18n="saved_local"></span>
          <button type="button" class="btn btn-danger btn-sm" id="btn-reset" data-i18n="reset_stats"></button>
        </div>
      </section>
      <section class="card stack" aria-labelledby="print-h">
        <h2 id="print-h" data-i18n="print_h"></h2>
        <p class="small muted mb0" data-i18n="print_intro"></p>
        <div class="opts2">
          <div class="field"><label for="pr-size" data-i18n="size_label"></label>
            <select id="pr-size"><option value="9">9×9</option><option value="6">6×6</option><option value="4">4×4</option></select></div>
          <div class="field"><label for="pr-level" data-i18n="level_label"></label><select id="pr-level"></select></div>
          <div class="field"><label for="pr-per" data-i18n="print_per"></label>
            <select id="pr-per"><option value="1">1</option><option value="2">2</option><option value="4">4</option></select></div>
          <div class="field"><label for="pr-pages" data-i18n="print_pages"></label>
            <select id="pr-pages"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        </div>
        <label class="check"><input type="checkbox" id="pr-big"> <span data-i18n="print_big"></span></label>
        <label class="check"><input type="checkbox" id="pr-key"> <span data-i18n="print_key"></span></label>
        <div class="row">
          <button type="button" class="btn btn-primary" id="btn-print"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <span class="small muted" id="pr-status" aria-live="polite"></span>
        </div>
      </section>
    </div>

    <div id="print-area" class="print-only" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/sudoku/../../shared/edu.js"></script>
  <script src="../../../apps/sudoku/strings.js"></script>
  <script src="../../../apps/sudoku/engine.js"></script>
  <script src="../../../apps/sudoku/app.js"></script>
</body>
</html>
