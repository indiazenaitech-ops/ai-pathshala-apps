  <style>
    /* ---------- toolbar ---------- */

    .stats { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 640px) { .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stat-eq { grid-column: 1 / -1; } }

    .concept { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; }
    .concept h3 { font-size: 1rem; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
    .concept h3 .ico { font-size: 1.3rem; }
    .concept p { margin: 0; font-size: .93rem; }
    .formula { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); }

    /* ---------- table ---------- */
    .tbl-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card lr-toolbar no-print" aria-labelledby="ds-label">
      <div class="ds-wrap">
        <div class="ds-list" id="ds-list" role="group" aria-labelledby="ds-label"></div>
        <p class="ds-about"><b id="ds-label" data-i18n="data_label"></b> · <span id="ds-about"></span></p>
      </div>
      <div class="tb-actions">
        <span class="badge primary" id="pt-count" data-value="0"></span>
        <button class="btn btn-sm" id="restore" type="button" data-i18n="restore"></button>
        <button class="btn btn-sm" id="paste-btn" type="button" data-i18n="paste_btn"></button>
        <button class="btn btn-sm" id="print-btn" type="button" data-i18n="print"></button>
        <button class="btn btn-sm" id="fs-btn" type="button" data-i18n="fullscreen"></button>
        <button class="btn btn-sm btn-danger" id="reset-all" type="button" data-i18n="reset"></button>
      </div>
    </section>

    <h2 class="print-only" id="print-title"></h2>

    <div class="lr-lab" id="lab">
      <section class="card lr-graph">
        <div class="stage plot-stage"><canvas id="plot" role="img"></canvas></div>
        <div class="show-row no-print" role="group" aria-labelledby="show-lbl">
          <span class="lbl" id="show-lbl" data-i18n="show_label"></span>
          <button class="chip" id="show-res" type="button" aria-pressed="true"><span class="sw sw-res" aria-hidden="true"></span><span data-i18n="show_res"></span></button>
          <button class="chip" id="show-sq" type="button" aria-pressed="false"><span class="sw sw-sq" aria-hidden="true"></span><span data-i18n="show_sq"></span></button>
          <button class="chip" id="show-best" type="button" aria-pressed="false"><span class="sw sw-best" aria-hidden="true"></span><span data-i18n="show_best"></span></button>
          <button class="chip fs-exit" id="fs-exit" type="button" aria-pressed="true"><span aria-hidden="true">✕</span><span data-i18n="fullscreen"></span></button>
        </div>
        <p class="canvas-hint no-print" id="canvas-hint"></p>
        <div class="stats">
          <div class="stat stat-eq">
            <div class="lbl" data-i18n="eq_label"></div>
            <div class="eq" id="equation" data-m="0" data-c="0"></div>
            <div class="eq-words" id="eq-words"></div>
          </div>
          <div class="stat">
            <div class="lbl" data-i18n="loss_label"></div>
            <div class="num" id="mse" data-value="0"></div>
            <div class="sub" id="miss"></div>
          </div>
          <div class="stat">
            <div class="lbl" data-i18n="closeness"></div>
            <div class="num" id="close" data-value="0"></div>
            <div class="progress" aria-hidden="true"><span id="close-bar" style="width:0"></span></div>
          </div>
        </div>
        <p class="slope-meaning" id="slope-meaning"></p>
      </section>

      <section class="card lr-side no-print">
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-manual" aria-controls="panel-manual" aria-selected="true" type="button" data-i18n="tab_manual"></button>
          <button role="tab" id="tab-auto" aria-controls="panel-auto" aria-selected="false" type="button" data-i18n="tab_auto"></button>
          <button role="tab" id="tab-predict" aria-controls="panel-predict" aria-selected="false" type="button" data-i18n="tab_predict"></button>
        </div>

        <!-- 1. fit by hand -->
        <div id="panel-manual" role="tabpanel" aria-labelledby="tab-manual" class="stack">
          <p class="hint mt0" data-i18n="manual_hint"></p>
          <div class="field">
            <label for="m-range" data-i18n="slope"></label>
            <div class="sl-row">
              <input type="range" id="m-range" min="-1" max="1" step="0.001">
              <input type="number" id="m-num" step="any" data-i18n-aria-label="slope">
            </div>
            <span class="hint" data-i18n="slope_hint"></span>
          </div>
          <div class="field">
            <label for="c-range" data-i18n="intercept"></label>
            <div class="sl-row">
              <input type="range" id="c-range" min="-1" max="1" step="0.001">
              <input type="number" id="c-num" step="any" data-i18n-aria-label="intercept">
            </div>
            <span class="hint" data-i18n="intercept_hint"></span>
          </div>
          <div class="row">
            <button class="btn btn-sm" id="reset-line" type="button" data-i18n="reset_line"></button>
          </div>
          <p class="callout coach" id="coach-manual" aria-live="polite" data-code=""><span class="ico" aria-hidden="true"></span><span class="txt"></span></p>
        </div>

        <!-- 2. let AI learn -->
        <div id="panel-auto" role="tabpanel" aria-labelledby="tab-auto" class="stack" hidden>
          <div>
            <h3 data-i18n="exact_title"></h3>
            <p class="hint mt0" data-i18n="exact_hint"></p>
          </div>
          <div class="row">
            <button class="btn btn-accent" id="fit-exact" type="button" data-i18n="exact_btn"></button>
          </div>
          <label class="check"><input type="checkbox" id="follow"> <span data-i18n="follow"></span></label>
          <details class="math" id="math">
            <summary data-i18n="show_math"></summary>
            <div class="math-body" id="math-body"></div>
          </details>

          <div class="block stack">
            <div>
              <h3 data-i18n="gd_title"></h3>
              <p class="hint mt0" data-i18n="gd_hint"></p>
            </div>
            <div class="field">
              <label for="lr" data-i18n="lr_label"></label>
              <div class="sl-row">
                <input type="range" id="lr" min="0" max="7" step="1" value="4">
                <output class="lr-val" id="lr-out" for="lr"></output>
              </div>
              <span class="hint" id="lr-desc"></span>
            </div>
            <div class="gd-opts">
              <div class="field">
                <label for="epochs" data-i18n="epochs_label"></label>
                <select id="epochs"></select>
              </div>
              <div class="field">
                <span class="lbl-like" id="speed-lbl" data-i18n="speed_label"></span>
                <div class="seg" id="speed" role="group" aria-labelledby="speed-lbl">
                  <button type="button" data-speed="slow" data-i18n="speed_slow"></button>
                  <button type="button" data-speed="normal" data-i18n="speed_normal"></button>
                  <button type="button" data-speed="fast" data-i18n="speed_fast"></button>
                </div>
              </div>
            </div>
            <div class="gd-btns">
              <button class="btn" id="gd-step" type="button" data-i18n="gd_step"></button>
              <button class="btn btn-primary" id="gd-run" type="button" aria-pressed="false"></button>
              <button class="btn" id="gd-restart" type="button" data-i18n="gd_restart"></button>
            </div>
            <div class="gd-read" aria-live="off">
              <span><span data-i18n="epoch_label"></span>: <b id="epoch" data-value="0">0</b></span>
              <span><span data-i18n="loss_label"></span>: <b id="gd-loss" data-value="0"></b></span>
              <span><span data-i18n="best_possible"></span>: <b id="gd-best" data-value="0"></b></span>
            </div>
            <div>
              <div class="small muted" data-i18n="loss_chart"></div>
              <div class="stage loss-stage"><canvas id="loss-chart" role="img"></canvas></div>
            </div>
            <p class="callout coach" id="coach-auto" aria-live="polite" data-code=""><span class="ico" aria-hidden="true"></span><span class="txt"></span></p>
          </div>
        </div>

        <!-- 3. predict -->
        <div id="panel-predict" role="tabpanel" aria-labelledby="tab-predict" class="stack" hidden>
          <div>
            <h3 data-i18n="pred_title"></h3>
            <p class="hint mt0" data-i18n="pred_hint"></p>
          </div>
          <div class="pred-box">
            <div class="field">
              <label for="pred-x" id="pred-x-label"></label>
              <input type="number" id="pred-x" step="any">
            </div>
          </div>
          <input type="range" id="pred-range" data-i18n-aria-label="pred_title">
          <div class="pred-out">
            <div class="lbl" data-i18n="pred_answer"></div>
            <div id="pred-y" data-value="0" aria-live="polite"></div>
          </div>
          <p class="pred-sentence" id="pred-sentence"></p>
          <p class="callout warning" id="pred-warn" hidden></p>
          <p class="callout" id="pred-tip" hidden data-i18n="pred_tip_best"></p>
        </div>
      </section>
    </div>

    <section class="card section no-print" id="explain-card">
      <h2 data-i18n="explain_title"></h2>
      <h3 class="small muted" data-i18n="exp_title"></h3>
      <div class="exp-row">
        <button class="btn" id="exp-outlier" type="button" data-i18n="exp_outlier"></button>
        <button class="btn" id="exp-small" type="button" data-i18n="exp_small"></button>
        <button class="btn" id="exp-right" type="button" data-i18n="exp_right"></button>
        <button class="btn" id="exp-big" type="button" data-i18n="exp_big"></button>
      </div>
      <p class="callout accent" id="exp-msg" aria-live="polite" hidden style="margin-top:10px"></p>
      <div class="concepts" id="concepts"></div>
    </section>

    <section class="card section" id="table-card">
      <div class="tbl-head">
        <h2 data-i18n="table_title"></h2>
        <div class="row no-print">
          <button class="btn btn-sm" id="add-row" type="button" data-i18n="add_row"></button>
          <button class="btn btn-sm" id="dl-csv" type="button" data-i18n="dl_csv"></button>
        </div>
      </div>
      <div class="tbl-wrap scroll-x">
        <table class="table data-table" id="data-table">
          <thead id="t-head"></thead>
          <tbody id="t-body"></tbody>
        </table>
      </div>
      <p class="mse-line" id="mse-line"></p>
    </section>

    <section class="print-only worksheet section">
      <h2 data-i18n="ws_title"></h2>
      <p data-i18n="ws_name"></p>
      <ol>
        <li><span data-i18n="ws_q1"></span><div class="ws-line"></div></li>
        <li><span data-i18n="ws_q2"></span><div class="ws-line"></div><div class="ws-line"></div></li>
        <li><span id="ws-q3"></span><div class="ws-line"></div><div class="ws-line"></div></li>
        <li><span data-i18n="ws_q4"></span><div class="ws-line"></div><div class="ws-line"></div></li>
        <li><span data-i18n="ws_q5"></span><div class="ws-line"></div><div class="ws-line"></div></li>
      </ol>
    </section>

    <details class="card section no-print">
      <summary><b data-i18n="howto"></b></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/linear-regression-lab/../../shared/edu.js"></script>
  <script src="../../../apps/linear-regression-lab/strings.js"></script>
  <script src="../../../apps/linear-regression-lab/content.js"></script>
  <script src="../../../apps/linear-regression-lab/app.js"></script>
</body>
</html>
