  <style>
    #app { --hp-fs: 15px; }
    /* code must show every character as typed: no font ligatures (e.g. <!-- turning into an arrow) */
    #app textarea, #app code, #app pre, .hp-con-list, .hp-con-in input, .hp-keys { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }

    /* ---------- top bar: template, project name, actions ---------- */
    .hp-top { margin-bottom: 14px; }
    .hp-top > * + * { margin-top: 12px; }
    .hp-top-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .hp-top-row .field { flex: 1 1 220px; }
    .hp-top-row select, .hp-top-row input { width: 100%; }
    .hp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .hp-actions .btn { min-height: 40px; }
    .hp-ico { font-size: 1.05em; line-height: 1; }
    .hp-tips { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .hp-tips ul { margin: 0; padding-inline-start: 1.2em; flex: 1 1 320px; min-width: 0; }
    .hp-tips li { margin: 2px 0; }

    /* ---------- work area ---------- */
    .hp-work { display: grid; gap: 0 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .hp-tabs { grid-column: 1; grid-row: 1; display: flex; gap: 4px; margin: 0; border: 0; overflow-x: auto; align-items: flex-end; }
    .hp-tabs button {
      border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted);
      font: inherit; font-weight: 700; padding: 8px 14px; min-height: 42px; cursor: pointer; white-space: nowrap;
      border-start-start-radius: 10px; border-start-end-radius: 10px; display: inline-flex; align-items: center; gap: 6px;
    }
    .hp-tabs button:hover { color: var(--text); background: var(--surface-2); }
    .hp-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: inset 0 3px 0 var(--accent); position: relative; z-index: 1; margin-bottom: -1px; }
    .hp-tabs small { font-weight: 500; color: var(--muted); font-size: .78rem; }
    .hp-dot { min-width: 20px; height: 20px; border-radius: 999px; padding: 0 6px; font-size: .72rem; font-weight: 800; display: inline-grid; place-items: center; line-height: 1; }
    .hp-dot.err { background: var(--danger); color: #fff; }
    .hp-dot.warn { background: var(--warning); color: #fff; }
    .hp-code { grid-column: 1; grid-row: 2; border-start-start-radius: 0; display: flex; flex-direction: column; gap: 10px; }
    .hp-out { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 10px; }
    .hp-head { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: space-between; }
    .hp-head h2 { margin: 0; font-size: 1.15rem; }
    .hp-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .hp-tools .check { font-size: .88rem; min-height: 36px; }
    .hp-hint { margin: 0; }
    /* touch targets of at least 40 px (phones, smartboards) */
    .hp-tools .btn-sm, .hp-tools .seg button, .hp-con-head .btn, .hp-cheat-tools .btn, .hp-cheat-tools .seg button, .hp-cheat-item .btn { min-height: 40px; min-width: 40px; }

    /* ---------- editor ---------- */
    .hp-editor { display: flex; direction: ltr; position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); font-family: var(--mono); font-size: var(--hp-fs); line-height: 1.5; }
    .hp-editor:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
    .hp-gutter { flex: 0 0 auto; position: relative; overflow: hidden; background: var(--surface-2); color: var(--muted); border-inline-end: 1px solid var(--border); user-select: none; width: calc(var(--hp-gw, 2) * 1ch + 20px); }
    .hp-gutter-in { position: absolute; top: 0; inset-inline: 0; padding: 10px 8px 10px 4px; text-align: right; will-change: transform; }
    .hp-gutter-in div { padding: 0 3px; border-radius: 4px; }
    .hp-gutter-in .hp-m-err { background: var(--danger); color: #fff; font-weight: 700; }
    .hp-gutter-in .hp-m-warn { background: var(--warning); color: #fff; font-weight: 700; }
    .hp-editor textarea {
      flex: 1 1 auto; min-width: 0; display: block; border: 0; border-radius: 0; margin: 0;
      height: clamp(300px, 58vh, 760px); min-height: 160px; padding: 10px 12px;
      font: inherit; line-height: inherit; color: var(--text); background: transparent;
      white-space: pre; overflow-wrap: normal; overflow: auto; resize: vertical; tab-size: 2; -moz-tab-size: 2;
    }
    .hp-editor textarea:focus { outline: none; }
    /* edu.css gives Urdu textareas line-height 2; code must keep the gutter's line height */
    :root[lang="ur"] .hp-editor textarea, :root[lang="ur"] .hp-con-in input { line-height: inherit; }
    .hp-wrap .hp-editor textarea { white-space: pre-wrap; overflow-wrap: break-word; overflow-x: hidden; }
    .hp-mirror { position: absolute; top: 0; inset-inline-start: 0; visibility: hidden; pointer-events: none; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 2; -moz-tab-size: 2; font: inherit; line-height: inherit; }
    .hp-keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; direction: ltr; }
    .hp-keys button { font-family: var(--mono); min-width: 0; min-height: 40px; padding: 4px 6px; font-size: 1rem; }
    .hp-under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
    .hp-pos { font-variant-numeric: tabular-nums; }

    /* ---------- preview + console ---------- */
    .hp-frame-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0; overflow: hidden; display: flex; justify-content: center; }
    .hp-frame-wrap.phone { padding: 12px 0; }
    .hp-frame-wrap { flex: 1 1 auto; min-height: 260px; }
    .hp-frame { display: block; width: 100%; height: auto; min-height: 260px; border: 0; background: #fff; color-scheme: light; }
    .hp-frame-wrap.phone .hp-frame { width: 360px; max-width: 100%; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    .hp-run.hp-stale::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-inline-start: 4px; }

    .hp-console { border: 1px solid #22404c; border-radius: var(--radius-sm); background: #10212a; color: #e6f0f2; overflow: hidden; }
    .hp-con-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; background: #162d38; border-bottom: 1px solid #22404c; }
    .hp-con-head h3 { margin: 0; font-size: .95rem; color: #e6f0f2; flex: 1 1 auto; }
    .hp-con-head .btn { color: #e6f0f2; }
    .hp-con-head .btn:hover { background: #22404c; }
    .hp-con-list { font-family: var(--mono); font-size: max(13px, calc(var(--hp-fs) - 1px)); line-height: 1.45; height: clamp(120px, 20vh, 260px); overflow: auto; padding: 4px 0; direction: ltr; text-align: left; }
    .hp-con-empty { color: #a8bcc3; padding: 8px 12px; font-family: var(--font); unicode-bidi: plaintext; }
    .hp-con-row { display: flex; gap: 8px; padding: 4px 12px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
    .hp-con-ico { flex: 0 0 1.2em; text-align: center; opacity: .85; }
    .hp-con-body { flex: 1 1 auto; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hp-con-msg { font-family: var(--font); unicode-bidi: plaintext; }
    .hp-con-msg + .hp-con-text { margin-inline-start: 6px; }
    .hp-con-row.error { color: #ffb4ab; background: rgba(255, 80, 60, .10); }
    .hp-con-row.warn { color: #ffd98a; background: rgba(255, 200, 0, .07); }
    .hp-con-row.info { color: #9edcff; }
    .hp-con-row.res { color: #b9f6ca; }
    .hp-con-row.cmd { color: #a8bcc3; }
    .hp-con-hint { display: block; margin-top: 2px; color: #e6f0f2; opacity: .85; font-family: var(--font); unicode-bidi: plaintext; }
    .hp-loc { background: none; border: 0; padding: 0 2px; margin-inline-start: 8px; color: #8fd8ff; text-decoration: underline; font: inherit; font-family: var(--font); cursor: pointer; min-height: 0; }
    .hp-loc:hover { color: #fff; }
    .hp-con-in { display: flex; align-items: center; gap: 6px; border-top: 1px solid #22404c; padding: 2px 10px; direction: ltr; }
    .hp-con-in span { color: #8fd8ff; font-family: var(--mono); font-weight: 700; }
    .hp-con-in input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; color: #e6f0f2; font-family: var(--mono); font-size: max(14px, calc(var(--hp-fs) - 1px)); min-height: 40px; padding: 4px; }
    .hp-con-in input::placeholder { color: #8aa2aa; font-family: var(--font); }
    .hp-con-in input:focus { outline: 2px solid #5cc0cf; outline-offset: 0; border-radius: 6px; }
    .hp-con-badge { font-size: .76rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .hp-con-badge.err { background: #f87171; color: #10212a; }
    .hp-con-badge.warn { background: #fbbf24; color: #10212a; }

    #hpOut:fullscreen { background: var(--bg); padding: 14px; overflow: auto; }
    #hpOut:fullscreen .hp-frame { height: calc(100vh - 120px); }
    #hpOut:fullscreen .hp-console { display: none; }

    /* ---------- cheat sheet + help ---------- */
    details.card { margin-top: 16px; }
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.1rem; min-height: 40px; padding-block: 4px; }
    .hp-cheat-tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 12px 0 6px; }
    .hp-cheat-tools input { flex: 1 1 200px; min-width: 0; }
    .hp-cheat-h { margin: 14px 0 8px; font-size: 1rem; }
    .hp-cheat-group.hp-solo .hp-cheat-h { display: none; }
    .hp-cheat-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .hp-cheat-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); min-width: 0; }
    .hp-cheat-item code { font-size: .95rem; font-weight: 700; color: var(--primary); white-space: pre-wrap; overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; text-align: start; }
    .hp-cheat-item p { margin: 0; flex: 1 1 auto; }
    .hp-cheat-item .btn { align-self: flex-start; }
    .hp-help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .hp-help li { margin-bottom: 6px; }

    .hp-print-area { display: none; }

    @media (min-width: 980px) { .hp-narrow-only { display: none !important; } }
    @media (max-width: 979px) {
      .hp-work { display: block; }
      .hp-tabs { border-bottom: 1px solid var(--border); margin-bottom: 10px; }
      .hp-tabs button[aria-selected="true"] { margin-bottom: -1px; }
      .hp-code { border-start-start-radius: var(--radius); }
      .hp-work[data-view="preview"] .hp-code { display: none; }
      .hp-work:not([data-view="preview"]) .hp-out { display: none; }
      .hp-editor textarea { height: clamp(260px, 52vh, 640px); }

      .hp-frame { height: clamp(300px, 58vh, 720px); }

      .hp-tabs { flex-wrap: nowrap; overflow-x: auto; gap: 2px; }
      .hp-tabs button { padding: 8px 10px; }
      .hp-tabs small { display: none; }
      .hp-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

      .hp-actions #hpSave { grid-column: 1 / -1; }

    @media print {
      body:not(.hp-pc) #app > :not(.hp-print-area) { display: none !important; }
      body:not(.hp-pc) .hp-print-area { display: block !important; }

      body.hp-pc #hpCheat { display: block !important; border: 0; padding: 0; }

      body.hp-pc .hp-cheat-item[hidden] { display: flex !important; }
      body.hp-pc .hp-cheat-group .hp-cheat-h { display: block !important; }
      body.hp-pc #hpCheat > summary { list-style: none; }
      body.hp-pc #hpCheat > summary::-webkit-details-marker { display: none; }
      .hp-cheat-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .hp-cheat-item { break-inside: avoid; padding: 6px 8px; }
      .hp-cheat-item code { color: #000; }
      .hp-print-pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 9.5pt; line-height: 1.4; border: 1px solid #999; border-radius: 6px; padding: 8px 10px; margin: 0 0 14px; direction: ltr; text-align: left; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card hp-top no-print" aria-labelledby="hpTplLbl">
      <div class="hp-top-row">
        <div class="field">
          <label id="hpTplLbl" for="hpTpl" data-i18n="tpl_label"></label>
          <select id="hpTpl"></select>
        </div>
        <div class="field">
          <label for="hpName" data-i18n="project_name"></label>
          <input id="hpName" type="text" maxlength="60" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="hp-actions">
        <button type="button" class="btn btn-primary" id="hpSave" data-i18n-title="save_title"><span class="hp-ico" aria-hidden="true">💾</span> <span data-i18n="save_project"></span></button>
        <button type="button" class="btn" id="hpProjects"><span class="hp-ico" aria-hidden="true">📁</span> <span data-i18n="my_projects"></span> <span class="badge" id="hpProjCount">0</span></button>
        <button type="button" class="btn" id="hpOpen"><span class="hp-ico" aria-hidden="true">📂</span> <span data-i18n="open_html"></span></button>
        <button type="button" class="btn" id="hpDownload"><span class="hp-ico" aria-hidden="true">⬇</span> <span data-i18n="download_html"></span></button>
        <button type="button" class="btn" id="hpShare"><span class="hp-ico" aria-hidden="true">🔗</span> <span data-i18n="share_link"></span></button>
        <button type="button" class="btn" id="hpPrint"><span class="hp-ico" aria-hidden="true">🖨</span> <span data-i18n="print_code"></span></button>
        <button type="button" class="btn btn-danger" id="hpReset"><span class="hp-ico" aria-hidden="true">↺</span> <span data-i18n="reset_work"></span></button>
      </div>
      <div class="callout accent hp-tips small" id="hpTips" hidden>
        <strong><span aria-hidden="true">🎯</span> <span data-i18n="try_this"></span></strong>
        <ul id="hpTipList"></ul>
      </div>
    </section>

    <div class="hp-work" id="hpWork" data-view="html">
      <div class="hp-tabs no-print" role="tablist" id="hpTabs" data-i18n-aria-label="files_label">
        <button type="button" role="tab" id="hpTab-html" data-view="html" aria-controls="hpCode" aria-selected="true">HTML <small class="no-i18n">index.html</small> <span class="hp-dot" id="hpDot-html" hidden></span></button>
        <button type="button" role="tab" id="hpTab-css" data-view="css" aria-controls="hpCode" aria-selected="false" tabindex="-1">CSS <small class="no-i18n">style.css</small></button>
        <button type="button" role="tab" id="hpTab-js" data-view="js" aria-controls="hpCode" aria-selected="false" tabindex="-1">JS <small class="no-i18n">script.js</small> <span class="hp-dot" id="hpDot-js" hidden></span></button>
        <button type="button" role="tab" id="hpTab-preview" data-view="preview" aria-controls="hpOut" aria-selected="false" tabindex="-1" class="hp-narrow-only"><span aria-hidden="true">👁</span> <span data-i18n="tab_preview"></span> <span class="hp-dot" id="hpDot-preview" hidden></span></button>
      </div>

      <section class="card hp-code" id="hpCode" role="tabpanel">
        <div class="hp-head">
          <p class="muted small hp-hint" data-i18n="files_hint"></p>
          <div class="hp-tools no-print">
            <button type="button" class="btn btn-sm" dir="ltr" id="hpFsDown" data-i18n-title="font_smaller" data-i18n-aria-label="font_smaller">A−</button>
            <button type="button" class="btn btn-sm" dir="ltr" id="hpFsUp" data-i18n-title="font_bigger" data-i18n-aria-label="font_bigger">A+</button>
            <label class="check"><input type="checkbox" id="hpWrap"> <span data-i18n="wrap_lines"></span></label>
            <label class="check"><input type="checkbox" id="hpClose"> <span data-i18n="auto_close"></span></label>
            <button type="button" class="btn btn-sm btn-primary hp-narrow-only" id="hpRun2"><span aria-hidden="true">▶</span> <span data-i18n="run"></span></button>
          </div>
        </div>
        <div class="hp-editor no-i18n" id="hpEd-html">
          <div class="hp-gutter" aria-hidden="true"><div class="hp-gutter-in"></div></div>
          <textarea id="hpHtml" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" dir="ltr"></textarea>
        </div>
        <div class="hp-editor no-i18n" id="hpEd-css" hidden>
          <div class="hp-gutter" aria-hidden="true"><div class="hp-gutter-in"></div></div>
          <textarea id="hpCss" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" dir="ltr"></textarea>
        </div>
        <div class="hp-editor no-i18n" id="hpEd-js" hidden>
          <div class="hp-gutter" aria-hidden="true"><div class="hp-gutter-in"></div></div>
          <textarea id="hpJs" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" dir="ltr"></textarea>
        </div>
        <div class="hp-keys no-print" id="hpKeys" role="toolbar" data-i18n-aria-label="keys_label">
          <button type="button" class="btn btn-sm" data-k="tab" data-i18n-title="key_tab" data-i18n-aria-label="key_tab">⇥</button>
          <button type="button" class="btn btn-sm" data-ins="&lt;">&lt;</button>
          <button type="button" class="btn btn-sm" data-ins="&gt;">&gt;</button>
          <button type="button" class="btn btn-sm" data-ins="/">/</button>
          <button type="button" class="btn btn-sm" data-ins="=">=</button>
          <button type="button" class="btn btn-sm" data-ins="&quot;">"</button>
          <button type="button" class="btn btn-sm" data-ins="{">{</button>
          <button type="button" class="btn btn-sm" data-ins="}">}</button>
          <button type="button" class="btn btn-sm" data-ins="(">(</button>
          <button type="button" class="btn btn-sm" data-ins=")">)</button>
          <button type="button" class="btn btn-sm" data-ins=";">;</button>
          <button type="button" class="btn btn-sm" data-ins=":">:</button>
          <button type="button" class="btn btn-sm" data-ins="#">#</button>
          <button type="button" class="btn btn-sm" data-k="undo" data-i18n-title="undo" data-i18n-aria-label="undo">↶</button>
          <button type="button" class="btn btn-sm" data-k="redo" data-i18n-title="redo" data-i18n-aria-label="redo">↷</button>
        </div>
        <div class="hp-under tiny muted">
          <span class="hp-pos" id="hpPos" aria-live="off"></span>
          <span id="hpSaved"></span>
        </div>
        <p class="tiny muted hp-hint" data-i18n="esc_hint"></p>
      </section>

      <section class="card hp-out" id="hpOut" role="tabpanel" aria-labelledby="hpOutH">
        <div class="hp-head">
          <h2 id="hpOutH"><span aria-hidden="true">👁</span> <span data-i18n="preview_h"></span></h2>
          <div class="hp-tools no-print">
            <button type="button" class="btn btn-primary hp-run" id="hpRun" data-i18n-title="run_title"><span aria-hidden="true">▶</span> <span data-i18n="run"></span></button>
            <label class="check"><input type="checkbox" id="hpAuto"> <span data-i18n="auto_update"></span></label>
            <div class="seg" role="group">
              <button type="button" id="hpW100" aria-pressed="true" data-i18n-title="width_full" data-i18n-aria-label="width_full">💻</button>
              <button type="button" id="hpW360" aria-pressed="false" data-i18n-title="width_phone" data-i18n-aria-label="width_phone">📱</button>
            </div>
            <button type="button" class="btn btn-sm" id="hpFs" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
          </div>
        </div>
        <div class="hp-frame-wrap" id="hpFrameWrap">
          <iframe id="hpFrame" class="hp-frame" sandbox="allow-scripts allow-modals allow-forms" data-i18n-title="preview_title"></iframe>
        </div>
        <div class="hp-console" id="hpConsole">
          <div class="hp-con-head">
            <h3 data-i18n="console"></h3>
            <span class="hp-con-badge err" id="hpErrCount" hidden></span>
            <span class="hp-con-badge warn" id="hpWarnCount" hidden></span>
            <button type="button" class="btn btn-sm btn-ghost" id="hpConClear" data-i18n="clear"></button>
          </div>
          <div class="hp-con-list" id="hpConList" role="log" aria-live="polite"></div>
          <form class="hp-con-in" id="hpConForm" autocomplete="off">
            <span aria-hidden="true">›</span>
            <input type="text" id="hpConInput" dir="ltr" spellcheck="false" autocapitalize="off" autocorrect="off" data-i18n-placeholder="console_ph" data-i18n-aria-label="console_input_label">
          </form>
        </div>
      </section>
    </div>

    <details class="card hp-cheat" id="hpCheat">
      <summary><span aria-hidden="true">📘</span> <span data-i18n="cheat_title"></span></summary>
      <p class="muted small" data-i18n="cheat_intro"></p>
      <div class="hp-cheat-tools">
        <div class="seg" role="group" id="hpCheatSeg" data-i18n-aria-label="files_label">
          <button type="button" data-g="html" aria-pressed="true">HTML</button>
          <button type="button" data-g="css" aria-pressed="false">CSS</button>
          <button type="button" data-g="js" aria-pressed="false">JS</button>
        </div>
        <input type="search" id="hpCheatQ" data-i18n-placeholder="cheat_search" data-i18n-aria-label="cheat_search">
        <button type="button" class="btn btn-sm" id="hpPrintCheat"><span aria-hidden="true">🖨</span> <span data-i18n="print_cheat"></span></button>
      </div>
      <div id="hpCheatList"></div>
      <p class="muted" id="hpCheatNone" data-i18n="no_match" hidden></p>
    </details>

    <details class="card hp-help no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <section class="hp-print-area" id="hpPrintArea" aria-hidden="true"></section>
  </main>
  <script src="../../../apps/html-playground/../../shared/edu.js"></script>
  <script src="../../../apps/html-playground/strings.js"></script>
  <script src="../../../apps/html-playground/content.js"></script>
  <script src="../../../apps/html-playground/data.js"></script>
  <script src="../../../apps/html-playground/app.js"></script>
</body>
</html>
