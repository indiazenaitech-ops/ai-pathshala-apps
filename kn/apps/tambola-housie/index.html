    .tk-c {
      position: relative; aspect-ratio: 1 / 1; min-width: 0; padding: 0; margin: 0; display: grid; place-items: center;
      border: 0; border-right: 1px solid var(--border); border-top: 1px solid var(--border); border-radius: 0;

    }

    .rules .r-party { font-size: 1.15rem; overflow-wrap: anywhere; }
    .rules .r-title { font-size: 1.25rem; margin: 12px 0 8px; }
    .rules .r-rules { margin: 0 0 10px; padding-inline-start: 1.4em; display: grid; gap: 6px; }
    .rules .r-sub { font-size: 1.05rem; margin: 14px 0 6px; }
    .rules .r-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .rules .r-table th, .rules .r-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: start; vertical-align: top; }
    .rules .r-table th { background: var(--surface-2); }
    .rules .r-notes { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; border-inline-start: 4px solid var(--accent); padding-inline-start: 10px; }

    /* ---------- play on phone ---------- */
    .play-form { align-items: flex-end; }
    .play-form .field { flex: 1 1 9rem; }
    .play-form .btn { flex: 1 1 auto; }
    .play-list { display: grid; gap: 14px; margin-top: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
    .play-card .row { justify-content: space-between; }
    .play-status { font-weight: 700; margin: 0; }
    .play-done { margin: 0; }
    .play-done.callout { font-weight: 700; }

    /* ---------- help, footer row ---------- */
    .help { margin-top: 16px; }
    .help summary, .order summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; gap: 8px; list-style: none; }
    .help summary::-webkit-details-marker, .order summary::-webkit-details-marker { display: none; }
    .help summary::after, .order summary::after { content: "▾"; margin-inline-start: auto; color: var(--muted); transition: transform .2s; }
    .help[open] > summary::after, .order[open] > summary::after { transform: rotate(180deg); }
    #srcSeg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #srcSeg button { min-height: 44px; line-height: 1.25; }
    #srcSeg button + button { border-inline-start: 1px solid var(--border); }
    .help ul { margin: 10px 0 4px; padding-inline-start: 1.3em; display: grid; gap: 8px; }
    .reset-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }

    /* ---------- printing ---------- */
    #print-root { display: none; }
    @page { size: A4 portrait; margin: 8mm; }
    @media print {
      body.tb-printing #app { display: none !important; }
      body.tb-printing { display: block; min-height: 0; background: #fff !important; }
      body.tb-printing #print-root { display: block; }
      body:not(.tb-printing) .tb-tabs, body:not(.tb-printing) .help, body:not(.tb-printing) .reset-row, body:not(.tb-printing) .edu-intro { display: none !important; }
      body:not(.tb-printing) #callerCard .cl-btns, body:not(.tb-printing) #callerCard .cl-settings, body:not(.tb-printing) #nextBtn, body:not(.tb-printing) #fsBtn { display: none !important; }
      #print-root { color: #000; }
      #print-root .sheet { break-after: page; page-break-after: always; }
      #print-root .sheet:last-child { break-after: auto; page-break-after: auto; }
      #print-root .sh-head { border-bottom: .5mm solid #000; padding-bottom: 1.4mm; margin-bottom: 2.4mm; }
      #print-root .sh-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
      #print-root .sh-party { font-size: 15pt; font-weight: 800; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
      #print-root .sh-meta { font-size: 9pt; white-space: nowrap; }
      #print-root .sh-prizes { font-size: 8.5pt; margin-top: .8mm; line-height: 1.3; }
      :root[lang="ur"] #print-root .sh-party, :root[lang="ur"] #print-root .sh-prizes, :root[lang="ur"] #print-root .pt-head { line-height: 1.85; }
      #print-root .p-grid { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); border-top: .3mm dashed #555; border-left: .3mm dashed #555; }
      #print-root .sheet-12 .p-grid { --cols: 2; }
      #print-root .p-slot { position: relative; border-right: .3mm dashed #555; border-bottom: .3mm dashed #555; padding: 2mm 2.5mm; break-inside: avoid; page-break-inside: avoid; }
      #print-root .p-slot::before { content: "✂"; position: absolute; top: -2.2mm; left: 3mm; font-size: 8pt; line-height: 1; background: #fff; padding: 0 .6mm; color: #333; }
      #print-root .pt { border: .6mm solid #000; }
      #print-root .pt-head { display: flex; justify-content: space-between; gap: 3mm; padding: .5mm 2mm; border-bottom: .4mm solid #000; font-size: 8.5pt; line-height: 1.35; }
      #print-root .pt-party { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      #print-root .pt-no { font-weight: 800; white-space: nowrap; }
      #print-root .pt-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); }
      #print-root .pt-c { height: 12mm; display: flex; align-items: center; justify-content: center; border-right: .3mm solid #000; border-top: .3mm solid #000; font: 800 19pt/1 var(--numfont); color: #000; }
      #print-root .pt-grid > .pt-c:nth-child(9n) { border-right: 0; }
      #print-root .pt-grid > .pt-c:nth-child(-n+9) { border-top: 0; }
      #print-root .pt-c.e { background: #e3e3e3; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #print-root .sheet-12 .pt-c { height: 9.6mm; font-size: 13.5pt; }
      #print-root .sheet-12 .pt-head { font-size: 7.5pt; padding: .4mm 1.5mm; }
      #print-root .rules { font-size: 11pt; line-height: 1.5; }
      #print-root .rules .r-head { border-bottom: .5mm solid #000; }
      #print-root .rules .r-party { font-size: 16pt; }
      #print-root .rules .r-title { font-size: 19pt; }
      #print-root .rules .r-table th, #print-root .rules .r-table td { border: .3mm solid #000; }
      #print-root .rules .r-table th { background: #eee; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #print-root .rules .r-notes { border-inline-start-color: #000; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tb-tabs" role="tablist" id="tabs" data-i18n-aria-label="app_title">
      <button type="button" role="tab" id="tab-tickets" data-tab="tickets" aria-controls="panel-tickets" aria-selected="true"><span class="ic" aria-hidden="true">🎟️</span><span data-i18n="tab_tickets"></span></button>
      <button type="button" role="tab" id="tab-caller" data-tab="caller" aria-controls="panel-caller" aria-selected="false" tabindex="-1"><span class="ic" aria-hidden="true">📢</span><span data-i18n="tab_caller"></span></button>
      <button type="button" role="tab" id="tab-check" data-tab="check" aria-controls="panel-check" aria-selected="false" tabindex="-1"><span class="ic" aria-hidden="true">✅</span><span data-i18n="tab_check"></span></button>
      <button type="button" role="tab" id="tab-prizes" data-tab="prizes" aria-controls="panel-prizes" aria-selected="false" tabindex="-1"><span class="ic" aria-hidden="true">🏆</span><span data-i18n="tab_prizes"></span></button>
      <button type="button" role="tab" id="tab-play" data-tab="play" aria-controls="panel-play" aria-selected="false" tabindex="-1"><span class="ic" aria-hidden="true">📱</span><span data-i18n="tab_play"></span></button>
    </div>

    <!-- ===================== TICKETS ===================== -->
    <section id="panel-tickets" role="tabpanel" aria-labelledby="tab-tickets">
      <div class="tk-layout">
        <div class="stack">
          <div class="card stack">
            <h2 data-i18n="h_make"></h2>
            <div class="field">
              <label for="party" data-i18n="f_party"></label>
              <input type="text" id="party" class="no-i18n" maxlength="80" autocomplete="off">
            </div>
            <div class="two">
              <div class="field">
                <label for="pdate" data-i18n="f_date"></label>
                <input type="date" id="pdate">
              </div>
              <div class="field">
                <label for="code" data-i18n="f_code"></label>
                <input type="text" id="code" class="no-i18n code-in" maxlength="16" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-describedby="codeHint">
              </div>
            </div>
            <div><button type="button" class="btn btn-sm" id="newCode"><span aria-hidden="true">🎲</span><span data-i18n="new_code"></span></button></div>
            <p class="hint" id="codeHint" data-i18n="code_hint"></p>
            <p class="callout danger small mb0" id="codeErr" role="alert" hidden data-i18n="code_bad"></p>
            <div class="field">
              <label for="count" data-i18n="f_count"></label>
              <div class="row count-row">
                <input type="number" id="count" min="1" max="600" step="1" inputmode="numeric">
                <div class="chips" id="countChips"></div>
              </div>
              <span class="hint" data-i18n="count_hint"></span>
            </div>
            <label class="check"><input type="checkbox" id="strips"> <span data-i18n="f_strips"></span></label>
            <div class="field">
              <label for="start" data-i18n="f_start"></label>
              <input type="number" id="start" class="w-num" min="1" max="99996" step="1" inputmode="numeric">
              <span class="hint" data-i18n="start_hint"></span>
            </div>
            <div class="field">
              <span class="lbl" id="ppLbl" data-i18n="f_perpage"></span>
              <div class="seg" role="group" aria-labelledby="ppLbl" id="perPage">
                <button type="button" data-pp="6" aria-pressed="true" data-i18n="pp_6"></button>
                <button type="button" data-pp="12" aria-pressed="false" data-i18n="pp_12"></button>
              </div>
            </div>
            <div class="sum" id="tkSummary" aria-live="polite"></div>
            <div class="row">
              <button type="button" class="btn btn-primary btn-lg" id="printTk"><span aria-hidden="true">🖨</span><span data-i18n="btn_print_tk"></span></button>
              <button type="button" class="btn" id="csvTk"><span aria-hidden="true">⬇</span><span data-i18n="btn_csv"></span></button>
            </div>
            <p class="tiny muted mb0" data-i18n="print_tip"></p>
          </div>

          <div class="card stack">
            <h2 class="h-sm" data-i18n="h_send"></h2>
            <p class="hint" data-i18n="send_hint"></p>
            <div class="row send-row">
              <div class="field">
                <label for="sendNo" data-i18n="f_ticket"></label>
                <input type="number" id="sendNo" min="1" max="99996" step="1" inputmode="numeric">
              </div>
              <a class="btn btn-wa" id="sendWa" href="#" target="_blank" rel="noopener"><span aria-hidden="true">💬</span><span data-i18n="btn_wa_ticket"></span></a>
              <button type="button" class="btn" id="sendCopy"><span aria-hidden="true">🔗</span><span data-i18n="btn_copy_link"></span></button>
            </div>
          </div>
        </div>

        <div class="card stack" id="previewCard">
          <div class="row spread">
            <h2 class="mb0" data-i18n="h_preview"></h2>
            <div class="pg-nav">
              <button type="button" class="btn btn-sm" id="pgPrev" data-i18n-aria-label="previous" data-i18n-title="previous"><span class="flip" aria-hidden="true">◀</span></button>
              <span id="pgLbl" class="pg-lbl" aria-live="polite"></span>
              <button type="button" class="btn btn-sm" id="pgNext" data-i18n-aria-label="next" data-i18n-title="next"><span class="flip" aria-hidden="true">▶</span></button>
            </div>
          </div>
          <div class="tk-list" id="tkList"></div>
          <p class="hint" data-i18n="preview_hint"></p>
        </div>
      </div>
    </section>

    <!-- ===================== CALLER ===================== -->
    <section id="panel-caller" role="tabpanel" aria-labelledby="tab-caller" hidden>
      <div class="card" id="callerCard">
        <div class="cl-top">
          <div class="cl-head">
            <h2 class="cl-title no-i18n mb0" id="clTitle"></h2>
            <span class="badge accent" id="clCode"></span>
          </div>
          <button type="button" class="btn btn-sm" id="fsBtn" aria-pressed="false"><span aria-hidden="true">⛶</span><span id="fsLbl"></span></button>
        </div>
        <div class="cl-main">
          <div class="cl-left">
            <div class="cl-now" id="nowBox" aria-live="polite" aria-atomic="true">
              <div class="ball idle" id="ball"><span class="ball-num" id="ballNum">?</span></div>
              <p class="cl-info" id="callInfo"></p>
            </div>
            <div class="cl-last" id="lastWrap">
              <span class="lbl small" data-i18n="h_last"></span>
              <div class="coins" id="last5" dir="ltr"></div>
            </div>
            <button type="button" class="btn btn-primary btn-lg cl-next" id="nextBtn"><span aria-hidden="true">🎱</span><span data-i18n="btn_next"></span></button>
            <div class="cl-btns">
              <button type="button" class="btn" id="autoBtn" aria-pressed="false"><span aria-hidden="true" id="autoIc">▶</span><span id="autoLbl"></span></button>
              <button type="button" class="btn" id="undoBtn"><span aria-hidden="true">↶</span><span data-i18n="btn_undo"></span></button>
              <button type="button" class="btn" id="repeatBtn"><span aria-hidden="true">🔊</span><span data-i18n="btn_repeat"></span></button>
            </div>
            <div class="progress auto-bar" id="autoBar" hidden><span id="autoFill" style="width:0"></span></div>
            <div class="cl-counts"><span id="calledN"></span><span id="leftN"></span></div>
            <div class="progress"><span id="callBar" style="width:0"></span></div>
            <button type="button" class="btn btn-accent" id="claimBtn"><span aria-hidden="true">🙋</span><span data-i18n="btn_claim"></span></button>
          </div>
          <div class="cl-right">
            <div class="board" id="board" dir="ltr" role="group" data-i18n-aria-label="board_label"></div>
            <p class="small muted" id="manualHint" data-i18n="manual_hint" hidden></p>
            <div class="won" id="wonMini" aria-live="polite"></div>
            <details class="order no-print-fs">
              <summary data-i18n="h_order"></summary>
              <p class="order-list mb0" id="orderList" dir="ltr"></p>
            </details>
          </div>
        </div>
        <div class="cl-settings" id="clSettings">
          <div class="set-grid">
            <div class="field"><label for="every" data-i18n="f_every"></label><select id="every"></select></div>
            <div class="field"><label for="vlang" data-i18n="f_vlang"></label><select id="vlang"></select></div>
          </div>
          <div class="checks">
            <label class="check"><input type="checkbox" id="voice"> <span data-i18n="f_voice"></span></label>
            <label class="check"><input type="checkbox" id="digits"> <span data-i18n="f_digits"></span></label>
            <label class="check"><input type="checkbox" id="slow"> <span data-i18n="f_slow"></span></label>
            <label class="check"><input type="checkbox" id="manual"> <span data-i18n="f_manual"></span></label>
          </div>
          <p class="callout warning small mb0" id="voiceNote" hidden></p>
          <p class="tiny muted mb0" data-i18n="keys_tip"></p>
          <button type="button" class="btn btn-danger" id="newGameBtn"><span aria-hidden="true">🔄</span><span data-i18n="btn_new_game"></span></button>
        </div>
      </div>
    </section>

    <!-- ===================== CHECK A CLAIM ===================== -->
    <section id="panel-check" role="tabpanel" aria-labelledby="tab-check" hidden>
      <div class="split ck-split">
        <div class="card stack">
          <h2 data-i18n="h_check"></h2>
          <div class="seg" role="group" id="srcSeg" data-i18n-aria-label="h_check">
            <button type="button" data-src="game" aria-pressed="true" data-i18n="src_game"></button>
            <button type="button" data-src="typed" aria-pressed="false" data-i18n="src_typed"></button>
          </div>
          <div class="two" id="srcGame">
            <div class="field">
              <label for="chkCode" data-i18n="f_code"></label>
              <input type="text" id="chkCode" class="no-i18n code-in" maxlength="16" autocomplete="off" spellcheck="false" autocapitalize="characters">
            </div>
            <div class="field">
              <label for="chkNo" data-i18n="f_ticket"></label>
              <input type="number" id="chkNo" min="1" max="99996" step="1" inputmode="numeric">
            </div>
          </div>
          <div class="field" id="srcTyped" hidden>
            <label for="typed" data-i18n="f_typed"></label>
            <textarea id="typed" class="no-i18n" rows="3" spellcheck="false" placeholder="4 23 37 61 85&#10;9 15 42 56 77&#10;18 29 49 68 90"></textarea>
            <span class="hint" data-i18n="typed_hint"></span>
          </div>
          <div class="field">
            <label for="claim" data-i18n="f_claim"></label>
            <select id="claim"></select>
            <span class="hint" id="claimDesc"></span>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg" id="checkBtn"><span aria-hidden="true">🔍</span><span data-i18n="btn_check"></span></button>
            <button type="button" class="btn" id="findBtn"><span aria-hidden="true">🔎</span><span data-i18n="btn_find"></span></button>
          </div>
        </div>
        <div class="card stack" id="checkOut" aria-live="polite"></div>
      </div>
      <div class="card stack" style="margin-top:16px">
        <h2 class="h-sm" data-i18n="h_winners"></h2>
        <ul class="winners" id="winners"></ul>
      </div>
    </section>

    <!-- ===================== PRIZES & RULES ===================== -->
    <section id="panel-prizes" role="tabpanel" aria-labelledby="tab-prizes" hidden>
      <div class="grid-2">
        <div class="card stack">
          <h2 data-i18n="h_prizes"></h2>
          <p class="hint" data-i18n="prizes_hint"></p>
          <div class="pz-head" aria-hidden="true"><span data-i18n="col_play"></span><span data-i18n="col_name"></span><span data-i18n="col_win"></span></div>
          <div class="pz-list" id="prizeList"></div>
          <div class="field">
            <label for="notes" data-i18n="f_notes"></label>
            <textarea id="notes" class="no-i18n" rows="3" maxlength="1000" data-i18n-placeholder="notes_ph"></textarea>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary" id="printRules"><span aria-hidden="true">🖨</span><span data-i18n="btn_print_rules"></span></button>
            <button type="button" class="btn btn-ghost" id="defPrizes"><span aria-hidden="true">↺</span><span data-i18n="btn_default_prizes"></span></button>
          </div>
        </div>
        <div class="card stack">
          <h2 data-i18n="h_rules"></h2>
          <div class="rules-paper" id="rulesPreview"></div>
        </div>
      </div>
    </section>

    <!-- ===================== PLAY ON PHONE ===================== -->
    <section id="panel-play" role="tabpanel" aria-labelledby="tab-play" hidden>
      <div class="card stack">
        <h2 data-i18n="h_play"></h2>
        <p class="hint" data-i18n="play_hint"></p>
        <div class="row play-form">
          <div class="field">
            <label for="playCode" data-i18n="f_code"></label>
            <input type="text" id="playCode" class="no-i18n code-in" maxlength="16" autocomplete="off" spellcheck="false" autocapitalize="characters" data-i18n-placeholder="code_ph">
          </div>
          <div class="field">
            <label for="playNo" data-i18n="f_ticket"></label>
            <input type="number" id="playNo" min="1" max="99996" step="1" inputmode="numeric">
          </div>
          <button type="button" class="btn btn-primary" id="openBtn"><span aria-hidden="true">🎟️</span><span data-i18n="btn_open"></span></button>
        </div>
        <p class="callout danger small mb0" id="playErr" role="alert" hidden></p>
      </div>
      <div class="play-list" id="playList"></div>
    </section>

    <details class="card help">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <div class="reset-row">
      <button type="button" class="btn btn-danger btn-sm" id="resetAll"><span aria-hidden="true">🗑</span><span data-i18n="reset"></span></button>
      <span class="tiny muted"><span aria-hidden="true">🔒 </span><span data-i18n="saved_local"></span></span>
    </div>
  </main>
  <div id="print-root" aria-hidden="true"></div>

  <script src="../../../apps/tambola-housie/../../shared/edu.js"></script>
  <script src="../../../apps/tambola-housie/strings.js"></script>
  <script src="../../../apps/tambola-housie/engine.js"></script>
  <script src="../../../apps/tambola-housie/app.js"></script>
</body>
</html>
