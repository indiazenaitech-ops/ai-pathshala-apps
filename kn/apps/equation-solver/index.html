  <style>
    /* ---------- general ---------- */
    .m { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif; }
    .lbl { font-weight: 700; font-size: .95rem; }
    .mb0 { margin-bottom: 0; }
    .wp.card { padding: 14px 16px; }
    .check { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
    .solve-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
    @media (max-width: 900px) { .solve-grid { grid-template-columns: minmax(0, 1fr); } }
    .eq-row { display: flex; gap: 8px; align-items: stretch; }
    .eq-input { flex: 1 1 auto; min-width: 0; font-size: 1.25rem; min-height: 52px; text-align: start; }
    .eq-row .btn { min-height: 52px; flex: none; }
    .eq-input.bad { border-color: var(--danger); }
    .syntax { font-size: .84rem; color: var(--muted); margin: 0; }
    .keys { display: flex; flex-wrap: wrap; gap: 6px; }
    .keys button { min-width: 42px; min-height: 40px; padding: 4px 10px; font-size: 1.05rem; border-radius: 9px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; }
    .examples .chip { min-height: 40px; font-weight: 600; }
    .examples .chip .m { font-weight: 600; }
    .solve-btn { min-width: 10rem; }
    .method-block { display: flex; flex-direction: column; gap: 6px; }
    .seg button { min-height: 40px; }
    .boxes { display: grid; grid-template-columns: 4.2rem auto 4.2rem auto 4.6rem; gap: 6px 4px; align-items: center; }
    .boxes input { width: 100%; min-width: 0; text-align: center; padding-inline: 4px; }
    .boxes .m { font-weight: 700; text-align: center; }
    .boxes .eqn { font-size: .8rem; color: var(--muted); grid-column: 1 / -1; }

    /* ---------- result ---------- */
    .result-card { min-height: 120px; }
    .result-empty { color: var(--muted); padding: 24px 8px; text-align: center; font-size: 1.05rem; }
    .answer-box { background: var(--primary-soft); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
    .answer-box .ans-label { font-weight: 700; color: var(--muted); font-size: .9rem; }
    .answer-box .ans-big { font-size: clamp(1.35rem, 3.4vw, 1.9rem); font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .answer-box .ans-note { flex-basis: 100%; font-size: .92rem; margin: 0; }
    .answer-box.kind-none { background: var(--warning-soft); }
    .answer-box.kind-identity, .answer-box.kind-infinite { background: var(--info-soft); }
    .steps { list-style: none; padding: 0; margin: 0; counter-reset: st; display: grid; gap: 8px; }
    .step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--surface-2); counter-increment: st; }
    .step::before { content: counter(st); display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-weight: 800; font-size: .85rem; grid-row: 1 / span 2; margin-top: 2px; font-family: "Noto Sans", system-ui, sans-serif; }
    .step-note { font-size: .93rem; color: var(--text); line-height: 1.45; }
    .step-math { display: grid; gap: 2px; }
    .step-math .m { font-size: 1.08rem; font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; }
    .step[data-key="step_check"], .step[data-key="step_pair_check"], .step[data-key="step_quad_check"] { background: var(--success-soft); }
    .step[data-key="step_check"]::before, .step[data-key="step_pair_check"]::before, .step[data-key="step_quad_check"]::before { background: var(--success); color: #fff; }
    .step[data-key="step_identity"], .step[data-key="step_no_solution"], .step[data-key="step_pair_none"], .step[data-key="step_pair_infinite"], .step[data-key="step_quad_nature_none"] { background: var(--warning-soft); }
    .step[data-key="step_split_tried"] .m { font-size: .98rem; font-weight: 500; }
    .err { margin: 0; }
    .err p { margin: 0 0 8px; }
    .err .m { font-weight: 700; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .nature { display: inline-flex; align-items: center; gap: 6px; }
    .consist { padding: 10px 14px; border-radius: var(--radius-sm); }
    .consist.k-unique { background: var(--success-soft); }
    .consist.k-infinite { background: var(--info-soft); }
    .consist.k-none { background: var(--warning-soft); }
    .consist p { margin: 0; }
    .consist .m { display: block; margin-top: 4px; font-weight: 600; }

    /* cross-multiplication layout */
    .cross { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: center; direction: ltr; }
    .cross-block { display: grid; place-items: center; }
    .cross-block svg { width: 118px; height: 92px; overflow: visible; }
    .cross-block text { font-weight: 700; font-size: 16px; fill: var(--text); font-family: "Noto Sans", system-ui, sans-serif; }
    .cross-block .hd { fill: var(--primary); font-size: 17px; }
    .cross-block line { stroke: var(--accent); stroke-width: 2; }
    .cross-block .lab { font-size: 11px; font-weight: 600; fill: var(--muted); }

    /* graphs */
    .graph-wrap { max-width: 520px; margin: 0 auto; }
    .graph-wrap svg { width: 100%; height: auto; display: block; direction: ltr; }
    .graph-wrap text { font-family: "Noto Sans", system-ui, sans-serif; fill: var(--text); }
    .graph-wrap .tick { font-size: 10px; fill: var(--muted); }
    .graph-wrap .ax { stroke: var(--text); stroke-width: 1.3; }
    .graph-wrap .gr { stroke: var(--border); stroke-width: 1; }
    .graph-wrap .l1 { stroke: var(--c1); stroke-width: 2.6; fill: none; }
    .graph-wrap .l2 { stroke: var(--c2); stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; }
    .graph-wrap .l2.solid { stroke-dasharray: none; }
    .graph-wrap .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
    .graph-wrap .vx { fill: var(--c3); stroke: var(--surface); stroke-width: 2; }
    .graph-wrap .ptl { font-size: 12px; font-weight: 700; }
    .graph-wrap .para { stroke: var(--c1); stroke-width: 2.6; fill: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: .9rem; margin-top: 6px; }
    .legend .sw { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--c1); vertical-align: middle; margin-inline-end: 6px; }
    .legend .sw.two { border-top-style: dashed; border-color: var(--c2); }
    .legend .sw.pt { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--accent); }
    .legend .sw.vx { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--c3); }

    /* ---------- word problems ---------- */
    .wp-list { display: grid; gap: 12px; }
    .wp { display: grid; gap: 8px; }
    .wp-head { display: flex; gap: 10px; align-items: flex-start; }
    .wp-num { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; }
    .wp-q { margin: 0; font-size: 1.02rem; line-height: 1.5; }
    .wp-hint { border-inline-start: 4px solid var(--info); background: var(--info-soft); padding: 8px 12px; border-radius: var(--radius-sm); }
    .wp-hint p { margin: 0 0 4px; }
    .wp-hint .m { font-weight: 700; font-size: 1.05rem; }
    .wp-ans { border-inline-start: 4px solid var(--success); background: var(--success-soft); padding: 8px 12px; border-radius: var(--radius-sm); margin: 0; font-weight: 600; }

    /* ---------- practice ---------- */
    .pr-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
    @media (max-width: 900px) { .pr-grid { grid-template-columns: minmax(0, 1fr); } }
    .pr-problem { background: var(--surface-2); border-radius: var(--radius-sm); padding: 16px; text-align: center; min-height: 86px; display: grid; place-items: center; gap: 4px; }
    .pr-problem .m { font-size: clamp(1.35rem, 4vw, 2rem); font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .ans-row label { display: inline-flex; align-items: center; gap: 6px; }
    .ans-row input { width: 7.5rem; font-size: 1.1rem; }
    .pr-fb { font-weight: 700; margin: 0; min-height: 1.6em; }
    .pr-fb.ok { color: var(--success); } .pr-fb.bad { color: var(--danger); }
    .pr-stats { display: flex; flex-wrap: wrap; gap: 6px; }
    .pr-stats .badge { font-size: .86rem; padding: 4px 10px; }

    /* ---------- worksheet (print only) ---------- */
    #worksheet { display: none; }
    .ws-table { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
    .ws-table th, .ws-table td { border: 1px solid #888; padding: 8px; text-align: start; vertical-align: top; }
    .ws-table th:first-child, .ws-table td:first-child { width: 8%; }
    .ws-q td.eq { font-size: 13pt; font-weight: 700; width: 38%; }
    .ws-q td.work { height: 64px; }
    .ws-k td.ans { font-weight: 700; }
    .ws-key { break-before: page; padding-top: 3mm; }

    /* ---------- words to know ---------- */
    .words dl { margin: 10px 0 0; display: grid; gap: 8px; }
    .words dt { font-weight: 700; }
    .words dd { margin: 0 0 4px; color: var(--text); }
    @media (min-width: 700px) { .words dl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; } }

    /* Urdu Nastaliq needs taller lines */
    :root[lang="ur"] .step-note, :root[lang="ur"] .wp-q, :root[lang="ur"] .consist p, :root[lang="ur"] .words dd { line-height: 2.1; }

    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    @media print {
      @page { size: A4; margin: 12mm; }

        --warning-soft: #fef0c7; --info: #0b69a3; --info-soft: #e0f2fe; --c1: #0b7285; --c2: #e8590c; --c3: #5f3dc4; --surface-2: #f2f2f2;

          <div class="examples no-i18n" id="pair-examples"></div>
          <div class="method-block">
            <span class="lbl" id="lbl-pm" data-i18n="method_label"></span>
            <div class="seg" role="group" aria-labelledby="lbl-pm" id="pair-method">
              <button type="button" data-v="substitution" id="pm-substitution" data-i18n="m_substitution"></button>
              <button type="button" data-v="elimination" id="pm-elimination" data-i18n="m_elimination"></button>
              <button type="button" data-v="cross" id="pm-cross" data-i18n="m_cross"></button>
            </div>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg solve-btn" id="pair-solve">🧮 <span data-i18n="solve"></span></button>
          </div>
        </div>
        <div class="stack">
          <div class="card stack result-card" id="pair-result" aria-live="polite" data-status="none-yet"></div>
          <div class="card" id="pair-graph-card" hidden>
            <h3 data-i18n="graph_title"></h3>
            <div class="graph-wrap" id="pair-graph"></div>
            <div class="legend" id="pair-legend"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== QUADRATIC ===================== -->
    <section id="panel-quad" role="tabpanel" aria-labelledby="tab-quad" hidden>
      <div class="solve-grid">
        <div class="card stack no-print">
          <label for="quad-eq" class="lbl" data-i18n="quad_label"></label>
          <div class="eq-row">
            <input id="quad-eq" class="eq-input no-i18n" type="text" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120" data-i18n-placeholder="quad_ph">
            <button type="button" class="btn btn-ghost" id="quad-clear" data-i18n-aria-label="clear_aria" data-i18n-title="clear_aria">✕</button>
          </div>
          <p class="syntax" data-i18n="syntax_hint_quad"></p>
          <div class="keys no-i18n" data-target="quad-eq"></div>
          <p class="muted small mb0" data-i18n="examples"></p>
          <div class="examples no-i18n" id="quad-examples"></div>
          <div class="method-block">
            <span class="lbl" id="lbl-qm" data-i18n="method_label"></span>
            <div class="seg" role="group" aria-labelledby="lbl-qm" id="quad-method">
              <button type="button" data-v="factor" id="qm-factor" data-i18n="m_factor"></button>
              <button type="button" data-v="square" id="qm-square" data-i18n="m_square"></button>
              <button type="button" data-v="formula" id="qm-formula" data-i18n="m_formula"></button>
            </div>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg solve-btn" id="quad-solve">🧮 <span data-i18n="solve"></span></button>
          </div>
        </div>
        <div class="stack">
          <div class="card stack result-card" id="quad-result" aria-live="polite" data-status="none-yet"></div>
          <div class="card" id="quad-graph-card" hidden>
            <h3 data-i18n="parabola_title"></h3>
            <div class="graph-wrap" id="quad-graph"></div>
            <div class="legend" id="quad-legend"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== WORD PROBLEMS ===================== -->
    <section id="panel-word" role="tabpanel" aria-labelledby="tab-word" hidden>
      <div class="card stack">
        <div class="row spread">
          <div class="method-block">
            <span class="lbl" id="lbl-wm" data-i18n="word_pick"></span>
            <div class="seg" role="group" aria-labelledby="lbl-wm" id="word-mode">
              <button type="button" data-v="linear" id="wm-linear" data-i18n="mode_linear"></button>
              <button type="button" data-v="pair" id="wm-pair" data-i18n="mode_pair"></button>
              <button type="button" data-v="quad" id="wm-quad" data-i18n="mode_quad"></button>
            </div>
          </div>
          <button type="button" class="btn no-print" id="word-print">🖨️ <span data-i18n="print"></span></button>
        </div>
        <p class="muted small" data-i18n="word_intro"></p>
        <div class="wp-list" id="word-list"></div>
      </div>
    </section>

    <!-- ===================== PRACTICE ===================== -->
    <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="pr-grid">
        <div class="card stack">
          <div class="pr-problem no-i18n" id="pr-problem" dir="ltr"></div>
          <div class="ans-row no-print" id="pr-answers"></div>
          <div class="row no-print">
            <button type="button" class="btn btn-primary" id="pr-check">✔ <span data-i18n="check_answer"></span></button>
            <button type="button" class="btn" id="pr-steps">🧮 <span data-i18n="show_steps"></span></button>
            <button type="button" class="btn btn-accent" id="pr-new">🎲 <span data-i18n="new_problem"></span></button>
          </div>
          <p class="pr-fb" id="pr-feedback" aria-live="polite" data-ok=""></p>
          <div class="pr-stats" id="pr-stats"></div>
        </div>
        <div class="card stack no-print">
          <div class="method-block">
            <span class="lbl" id="lbl-prm" data-i18n="word_pick"></span>
            <div class="seg" role="group" aria-labelledby="lbl-prm" id="pr-mode">
              <button type="button" data-v="linear" id="prm-linear" data-i18n="mode_linear"></button>
              <button type="button" data-v="pair" id="prm-pair" data-i18n="mode_pair"></button>
              <button type="button" data-v="quad" id="prm-quad" data-i18n="mode_quad"></button>
            </div>
          </div>
          <div class="method-block">
            <span class="lbl" id="lbl-prl" data-i18n="level_label"></span>
            <div class="seg" role="group" aria-labelledby="lbl-prl" id="pr-level">
              <button type="button" data-v="easy" id="lv-easy" data-i18n="lv_easy"></button>
              <button type="button" data-v="medium" id="lv-medium" data-i18n="lv_medium"></button>
              <button type="button" data-v="hard" id="lv-hard" data-i18n="lv_hard"></button>
            </div>
          </div>
          <p class="muted small mb0" data-i18n="worksheet_hint"></p>
          <button type="button" class="btn" id="pr-worksheet">🖨️ <span data-i18n="print_worksheet"></span></button>
          <p class="callout small mb0" data-i18n="practice_tip"></p>
        </div>
      </div>
    </section>

    <section id="worksheet" aria-hidden="true"></section>

    <details class="card words" id="words" style="margin-top:18px">
      <summary><strong data-i18n="words_title"></strong></summary>
      <dl>
        <dt data-i18n="w1_t"></dt><dd data-i18n="w1_d"></dd>
        <dt data-i18n="w2_t"></dt><dd data-i18n="w2_d"></dd>
        <dt data-i18n="w3_t"></dt><dd data-i18n="w3_d"></dd>
        <dt data-i18n="w4_t"></dt><dd data-i18n="w4_d"></dd>
        <dt data-i18n="w5_t"></dt><dd data-i18n="w5_d"></dd>
        <dt data-i18n="w6_t"></dt><dd data-i18n="w6_d"></dd>
        <dt data-i18n="w7_t"></dt><dd data-i18n="w7_d"></dd>
        <dt data-i18n="w8_t"></dt><dd data-i18n="w8_d"></dd>
      </dl>
    </details>

    <details class="card" id="howto" style="margin-top:12px">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
        <li data-i18n="how6"></li>
      </ul>
    </details>

    <div class="row no-print" id="reset-row" style="margin-top:14px">
      <button type="button" class="btn btn-danger" id="reset">↺ <span data-i18n="reset"></span></button>
      <span class="muted small" data-i18n="saved_local"></span>
    </div>
  </main>
  <script src="../../../apps/equation-solver/../../shared/edu.js"></script>
  <script src="../../../apps/equation-solver/strings.js"></script>
  <script src="../../../apps/equation-solver/content.js"></script>
  <script src="../../../apps/equation-solver/engine.js"></script>
  <script src="../../../apps/equation-solver/app.js"></script>
</body>
</html>
