    .sh-qrbox { flex: none; text-align: center; font-size: 8.5px; width: 104px; line-height: 1.3; }
    .sh-qr { display: block; margin: 0 auto 2px; }
    .sh-upi { font-weight: 700; overflow-wrap: anywhere; }
    .sh-terms { white-space: pre-line; overflow-wrap: anywhere; font-size: 10px; }
    .sh-sign { text-align: right; margin-top: 8px; }
    .sh-sign img { max-width: 170px; max-height: 60px; object-fit: contain; display: inline-block; }
    .sh-sign .sp { height: 48px; }
    .sh-sign .who { font-weight: 700; overflow-wrap: anywhere; }
    .sh-decl { border: 1px dashed var(--ink); padding: 4px 8px; margin-top: 8px; font-weight: 700; font-size: 10.5px; }
    .sh-foot { margin-top: 10px; text-align: center; color: var(--soft); font-size: 9px; }
    .sh-rc { font-size: 13px; line-height: 1.7; margin: 14px 0; }
    .sh-rc .amt { font-size: 22px; font-weight: 800; color: var(--acc); }

    /* saved documents */
    .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
    .stat .v { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; }
    .stat .k { font-size: .8rem; color: var(--muted); }
    .doc-table td, .doc-table th { white-space: nowrap; }
    .doc-table td.cust { white-space: normal; min-width: 140px; overflow-wrap: anywhere; }
    .doc-table td.num { text-align: end; font-variant-numeric: tabular-nums; }
    .doc-table .row { gap: 4px; flex-wrap: nowrap; }
    .doc-table tr.cur td { background: var(--primary-soft); }
    .empty { text-align: center; padding: 18px; border: 2px dashed var(--border); border-radius: var(--radius-sm); color: var(--muted); margin: 0; }
    .m-table td { vertical-align: middle; }
    .m-table td.nm { min-width: 120px; overflow-wrap: anywhere; white-space: normal; }
    .m-table .acts-cell { width: 1%; }
    .m-acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; min-width: 84px; }
    @media (max-width: 520px) { .m-table td { padding: 8px 4px; } .m-acts { width: 84px; } }
    .m-table td.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .m-list { max-height: 420px; overflow: auto; }
    .imgbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .imgbox .thumb { width: 120px; height: 64px; border: 1px dashed var(--border); border-radius: 8px; display: grid; place-items: center; background: #fff; overflow: hidden; }
    .imgbox .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .pref-grid { display: grid; gap: 8px 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .pref-grid input { width: 100%; }
    .tip-list li + li { margin-top: 6px; }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .sh-rc .lc { display: block; font-size: .9em; }
    #printRoot { display: none; }
    @page { size: A4; margin: 10mm; }
    @media print {
      #app > *:not(#printRoot) { display: none !important; }
      #printRoot { display: block !important; }
      .measure-wrap { position: absolute; }
      #printRoot .sheet { width: auto; min-height: 1039px; padding: 0; box-shadow: none; transform: none; break-after: page; page-break-after: always; break-inside: avoid; }
      #printRoot .copyset:last-child .sheet:last-child { break-after: auto; page-break-after: auto; }
      #printRoot .pg-foot { left: 0; right: 0; bottom: 0; }
      #printRoot .sh-items thead { display: table-header-group; }
      body { background: #fff; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="gi-privacy"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>
    <p class="gi-disc small muted" data-i18n="disclaimer"></p>

    <div id="sampleBanner" class="callout accent row spread no-print" hidden>
      <span class="grow" data-i18n="sample_banner"></span>
      <button class="btn btn-sm btn-primary" id="goProfile" type="button" data-i18n="go_profile"></button>
    </div>

    <nav class="gi-tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-make" data-tab="make" aria-controls="p-make"><span class="ic" aria-hidden="true">🧾</span><span data-i18n="tab_make"></span></button>
      <button type="button" role="tab" id="tab-docs" data-tab="docs" aria-controls="p-docs"><span class="ic" aria-hidden="true">📂</span><span data-i18n="tab_docs"></span><span class="badge" id="docCount"></span></button>
      <button type="button" role="tab" id="tab-masters" data-tab="masters" aria-controls="p-masters"><span class="ic" aria-hidden="true">👥</span><span data-i18n="tab_masters"></span></button>
      <button type="button" role="tab" id="tab-profile" data-tab="profile" aria-controls="p-profile"><span class="ic" aria-hidden="true">🏪</span><span data-i18n="tab_profile"></span></button>
    </nav>

    <!-- ================= CREATE ================= -->
    <section id="p-make" role="tabpanel" aria-labelledby="tab-make" class="stack" hidden>
      <div class="mk-grid">
        <div class="mk-form stack">
          <section class="card stack" id="docCard">
            <div class="types" role="group" id="typeSeg" data-i18n-aria-label="doc_type">
              <button type="button" data-type="inv" id="type-inv" data-i18n="dt_inv"></button>
              <button type="button" data-type="bos" id="type-bos" data-i18n="dt_bos"></button>
              <button type="button" data-type="qtn" id="type-qtn" data-i18n="dt_qtn"></button>
              <button type="button" data-type="pi" id="type-pi" data-i18n="dt_pi"></button>
              <button type="button" data-type="dc" id="type-dc" data-i18n="dt_dc"></button>
              <button type="button" data-type="rcpt" id="type-rcpt" data-i18n="dt_rcpt"></button>
            </div>
            <div class="fgrid">
              <label class="field"><span data-i18n="doc_no"></span><input type="text" id="docNo" class="mono-in" dir="ltr" maxlength="40" autocomplete="off" spellcheck="false"></label>
              <label class="field"><span data-i18n="doc_date"></span><input type="date" id="docDate"></label>
              <label class="field" id="dueField"><span id="dueLabel"></span><input type="date" id="docDue"></label>
              <label class="field" id="refField"><span data-i18n="ref_no"></span><input type="text" id="docRef" dir="auto" maxlength="60" autocomplete="off"></label>
            </div>
            <p class="msg" id="noMsg" aria-live="polite"></p>
            <div class="fgrid" id="supplyRow">
              <label class="field"><span data-i18n="pos"></span><select id="docPos"></select></label>
              <label class="field"><span data-i18n="supply_type"></span>
                <select id="docSupply">
                  <option value="normal" data-i18n="sup_normal"></option>
                  <option value="lut" data-i18n="sup_lut"></option>
                  <option value="igst" data-i18n="sup_igst"></option>
                </select>
              </label>
              <label class="check" id="rcmField"><input type="checkbox" id="docRcm"> <span data-i18n="rcm"></span></label>
            </div>
          </section>

          <section class="card stack" id="partyCard">
            <h2 class="h-sec" data-i18n="bill_to"></h2>
            <div class="fgrid">
              <label class="field wide"><span data-i18n="cust_name"></span><input type="text" id="custName" list="custList" dir="auto" maxlength="120" autocomplete="off"></label>
              <label class="field"><span data-i18n="gstin"></span><input type="text" id="custGstin" class="mono-in up" dir="ltr" maxlength="15" autocomplete="off" spellcheck="false"></label>
              <label class="field"><span data-i18n="state"></span><select id="custState"></select></label>
              <label class="field"><span data-i18n="phone"></span><input type="tel" id="custPhone" dir="ltr" maxlength="20" autocomplete="off"></label>
              <label class="field"><span data-i18n="email"></span><input type="email" id="custEmail" dir="ltr" maxlength="80" autocomplete="off"></label>
              <label class="field wide"><span data-i18n="address"></span><textarea id="custAddr" rows="2" dir="auto" maxlength="300"></textarea></label>
            </div>
            <p class="msg" id="custGstinMsg" aria-live="polite"></p>
            <label class="check"><input type="checkbox" id="shipOn"> <span data-i18n="ship_diff"></span></label>
            <div class="fgrid" id="shipBox" hidden>
              <label class="field"><span data-i18n="ship_name"></span><input type="text" id="shipName" dir="auto" maxlength="120" autocomplete="off"></label>
              <label class="field"><span data-i18n="state"></span><select id="shipState"></select></label>
              <label class="field wide"><span data-i18n="address"></span><textarea id="shipAddr" rows="2" dir="auto" maxlength="300"></textarea></label>
            </div>
          </section>

          <section class="card stack" id="itemsCard">
            <div class="ln-tools">
              <h2 class="h-sec" data-i18n="items"></h2>
              <div class="chkrow">
                <label class="check"><input type="checkbox" id="optIncl"> <span data-i18n="incl_tax"></span></label>
                <label class="check"><input type="checkbox" id="optCess"> <span data-i18n="show_cess"></span></label>
              </div>
            </div>
            <div class="lines-wrap"><div class="lines" id="lines"></div></div>
            <div class="ln-tools">
              <button class="btn" id="addLine" type="button"><span aria-hidden="true">＋</span> <span data-i18n="add_line"></span></button>
              <span class="tiny muted" data-i18n="keys_hint"></span>
            </div>
            <p class="tiny muted mb0" data-i18n="disc_hint"></p>
          </section>

          <section class="card stack" id="rcptCard" hidden>
            <h2 class="h-sec" data-i18n="rc_title"></h2>
            <div class="fgrid">
              <label class="field"><span data-i18n="rc_amount"></span><input type="text" id="rcAmount" inputmode="decimal" dir="ltr" class="tnum" autocomplete="off"></label>
              <label class="field"><span data-i18n="rc_mode"></span>
                <select id="rcMode">
                  <option value="upi" data-i18n="mode_upi"></option>
                  <option value="cash" data-i18n="mode_cash"></option>
                  <option value="bank" data-i18n="mode_bank"></option>
                  <option value="cheque" data-i18n="mode_cheque"></option>
                  <option value="card" data-i18n="mode_card"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="rc_ref"></span><input type="text" id="rcRef" dir="ltr" maxlength="40" autocomplete="off"></label>
              <label class="field"><span data-i18n="rc_against"></span><input type="text" id="rcAgainst" list="invList" dir="ltr" maxlength="40" autocomplete="off"></label>
            </div>
          </section>

          <section class="card stack" id="extraCard">
            <div class="grid-2">
              <label class="field"><span data-i18n="notes"></span><textarea id="docNotes" rows="2" dir="auto" maxlength="600" data-i18n-placeholder="notes_ph"></textarea></label>
              <label class="field"><span data-i18n="terms"></span><textarea id="docTerms" rows="3" dir="auto" maxlength="1200"></textarea></label>
            </div>
            <details id="moreBox">
              <summary data-i18n="more_details"></summary>
              <div class="fgrid" style="margin-top:10px">
                <label class="field"><span data-i18n="vehicle"></span><input type="text" id="trVehicle" class="up" dir="ltr" maxlength="20" autocomplete="off"></label>
                <label class="field"><span data-i18n="transporter"></span><input type="text" id="trName" dir="auto" maxlength="80" autocomplete="off"></label>
                <label class="field"><span data-i18n="ewb"></span><input type="text" id="trEwb" dir="ltr" inputmode="numeric" maxlength="14" autocomplete="off"></label>
              </div>
            </details>
          </section>
        </div>

        <aside class="mk-side" aria-labelledby="sumHead">
          <section class="card stack" id="sumCard">
            <div class="row spread">
              <h2 class="h-sec" id="sumHead"></h2>
              <span class="savestate" id="saveState" aria-live="polite"></span>
            </div>
            <span class="badge primary modeb" id="modeBadge"></span>
            <table class="sumt" id="sumTable">
              <tbody>
                <tr id="rowTaxable"><th data-i18n="taxable"></th><td id="sumTaxable"></td></tr>
                <tr id="rowCgst"><th data-i18n="cgst"></th><td id="sumCgst"></td></tr>
                <tr id="rowSgst"><th data-i18n="sgst"></th><td id="sumSgst"></td></tr>
                <tr id="rowIgst"><th data-i18n="igst"></th><td id="sumIgst"></td></tr>
                <tr id="rowCess"><th data-i18n="cess"></th><td id="sumCess"></td></tr>
                <tr id="rowRound"><th data-i18n="round_off"></th><td id="sumRound"></td></tr>
              </tbody>
            </table>
            <div class="total-big"><span data-i18n="grand_total"></span><span class="big" id="sumTotal"></span></div>
            <p class="words en no-i18n" id="wordsEn"></p>
            <p class="words" id="wordsLocal"></p>
            <p class="callout warning small mb0" id="rcmNote" hidden></p>
            <div class="stack" id="optBox">
              <label class="check"><input type="checkbox" id="optRound"> <span data-i18n="opt_round"></span></label>
              <label class="check"><input type="checkbox" id="optUpi"> <span data-i18n="opt_upi"></span></label>
              <label class="check"><input type="checkbox" id="optBank"> <span data-i18n="opt_bank"></span></label>
            </div>
            <div class="acts">
              <button class="btn btn-primary full" id="saveDoc" type="button"><span aria-hidden="true">💾</span> <span data-i18n="save"></span></button>
              <button class="btn btn-accent" id="printDoc" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print_pdf"></span></button>
              <a class="btn btn-wa" id="waDoc" target="_blank" rel="noopener"><span aria-hidden="true">💬</span> <span data-i18n="whatsapp"></span></a>
              <button class="btn" id="copyDoc" type="button" data-i18n="copy_text"></button>
              <button class="btn" id="newDoc" type="button"><span aria-hidden="true">＋</span> <span data-i18n="new_doc"></span></button>
              <button class="btn" id="dupDoc" type="button" data-i18n="dup_doc"></button>
              <button class="btn" id="toInvoice" type="button" data-i18n="to_invoice"></button>
              <button class="btn" id="toReceipt" type="button" data-i18n="to_receipt"></button>
            </div>
            <details id="checksBox" open>
              <summary><strong data-i18n="checks"></strong> <span class="badge" id="checksCount"></span></summary>
              <ul class="checks" id="checks" aria-live="polite"></ul>
            </details>
          </section>
        </aside>
      </div>

      <section class="card stack" id="pvCard">
        <div class="row spread">
          <div class="row"><h2 class="h-sec" data-i18n="preview"></h2>
            <button class="btn btn-sm" id="pvZoom" type="button" aria-pressed="false"><span aria-hidden="true">🔍</span> <span id="pvZoomLbl"></span></button></div>
          <div class="copies" id="copyChecks" role="group" data-i18n-aria-label="copies"></div>
        </div>
        <div class="pv-wrap" id="pvWrap" dir="ltr"><div class="pages no-i18n" id="sheet"></div></div>
      </section>
    </section>

    <!-- ================= SAVED DOCUMENTS ================= -->
    <section id="p-docs" role="tabpanel" aria-labelledby="tab-docs" class="stack" hidden>
      <div class="card stack">
        <h2 class="h-sec" data-i18n="docs_title"></h2>
        <div class="fgrid">
          <label class="field"><span data-i18n="doc_type"></span><select id="fType"></select></label>
          <label class="field"><span data-i18n="fy"></span><select id="fFy" class="no-i18n"></select></label>
          <label class="field"><span data-i18n="month"></span><select id="fMonth"></select></label>
          <label class="field"><span data-i18n="search"></span><input type="search" id="fSearch" dir="auto" data-i18n-placeholder="search_docs" autocomplete="off"></label>
        </div>
        <div class="stats" id="docStats" aria-live="polite"></div>
        <div class="scroll-x">
          <table class="table doc-table" id="docTable">
            <thead><tr>
              <th data-i18n="doc_no"></th><th data-i18n="doc_date"></th><th data-i18n="col_customer"></th><th data-i18n="doc_type"></th>
              <th class="num" data-i18n="grand_total"></th><th data-i18n="col_status"></th><th><span class="sr" data-i18n="col_actions"></span></th>
            </tr></thead>
            <tbody id="docBody"></tbody>
          </table>
        </div>
        <p class="empty" id="noDocs" data-i18n="no_docs" hidden></p>
      </div>
      <div class="grid-2">
        <div class="card stack">
          <h2 class="h-sec" data-i18n="register_csv"></h2>
          <p class="small muted mb0" data-i18n="register_hint"></p>
          <div class="row"><button class="btn btn-primary" id="regCsv" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="register_csv"></span></button></div>
        </div>
        <div class="card stack">
          <h2 class="h-sec" data-i18n="backup_title"></h2>
          <p class="small muted mb0" data-i18n="backup_hint"></p>
          <div class="row">
            <button class="btn" id="backupJson" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="backup"></span></button>
            <button class="btn" id="restoreJson" type="button"><span aria-hidden="true">📂</span> <span data-i18n="restore"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= CUSTOMERS & ITEMS ================= -->
    <section id="p-masters" role="tabpanel" aria-labelledby="tab-masters" class="stack" hidden>
      <label class="check card"><input type="checkbox" id="remember"> <span data-i18n="remember"></span></label>
      <div class="grid-2">
        <div class="card stack" id="custCard">
          <h2 class="h-sec" data-i18n="customers"></h2>
          <div class="fgrid">
            <label class="field wide"><span data-i18n="cust_name"></span><input type="text" id="mcName" dir="auto" maxlength="120" autocomplete="off"></label>
            <label class="field"><span data-i18n="gstin"></span><input type="text" id="mcGstin" class="mono-in up" dir="ltr" maxlength="15" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="state"></span><select id="mcState"></select></label>
            <label class="field"><span data-i18n="phone"></span><input type="tel" id="mcPhone" dir="ltr" maxlength="20" autocomplete="off"></label>
            <label class="field"><span data-i18n="email"></span><input type="email" id="mcEmail" dir="ltr" maxlength="80" autocomplete="off"></label>
            <label class="field wide"><span data-i18n="address"></span><textarea id="mcAddr" rows="2" dir="auto" maxlength="300"></textarea></label>
          </div>
          <p class="msg" id="mcMsg" aria-live="polite"></p>
          <div class="row">
            <button class="btn btn-primary" id="mcSave" type="button" data-i18n="save_customer"></button>
            <button class="btn btn-ghost" id="mcClear" type="button" data-i18n="clear"></button>
          </div>
          <div class="m-list scroll-x"><table class="table m-table"><tbody id="custBody"></tbody></table></div>
          <p class="empty" id="noCust" data-i18n="no_customers" hidden></p>
          <div class="row">
            <button class="btn btn-sm" id="mcImport" type="button" data-i18n="import_csv"></button>
            <button class="btn btn-sm" id="mcExport" type="button" data-i18n="export_csv"></button>
          </div>
          <p class="tiny muted mb0" data-i18n="csv_cust_hint"></p>
        </div>
        <div class="card stack" id="itemCard">
          <h2 class="h-sec" data-i18n="saved_items"></h2>
          <div class="fgrid">
            <label class="field wide"><span data-i18n="item_name"></span><input type="text" id="miName" dir="auto" maxlength="160" autocomplete="off"></label>
            <label class="field"><span data-i18n="col_hsn"></span><input type="text" id="miHsn" dir="ltr" inputmode="numeric" maxlength="8" autocomplete="off"></label>
            <label class="field"><span data-i18n="col_unit"></span><input type="text" id="miUnit" class="up" list="uqcList" dir="ltr" maxlength="3" autocomplete="off"></label>
            <label class="field"><span data-i18n="col_rate"></span><input type="text" id="miRate" dir="ltr" inputmode="decimal" autocomplete="off"></label>
            <label class="field"><span data-i18n="col_gst"></span><input type="text" id="miGst" list="rateList" dir="ltr" inputmode="decimal" autocomplete="off"></label>
            <label class="field"><span data-i18n="col_cess"></span><input type="text" id="miCess" dir="ltr" inputmode="decimal" autocomplete="off"></label>
          </div>
          <p class="msg" id="miMsg" aria-live="polite"></p>
          <div class="row">
            <button class="btn btn-primary" id="miSave" type="button" data-i18n="save_item"></button>
            <button class="btn btn-ghost" id="miClear" type="button" data-i18n="clear"></button>
          </div>
          <div class="m-list scroll-x"><table class="table m-table"><tbody id="itemBody"></tbody></table></div>
          <p class="empty" id="noItems" data-i18n="no_items" hidden></p>
          <div class="row">
            <button class="btn btn-sm" id="miImport" type="button" data-i18n="import_csv"></button>
            <button class="btn btn-sm" id="miExport" type="button" data-i18n="export_csv"></button>
          </div>
          <p class="tiny muted mb0" data-i18n="csv_items_hint"></p>
        </div>
      </div>
    </section>

    <!-- ================= MY BUSINESS ================= -->
    <section id="p-profile" role="tabpanel" aria-labelledby="tab-profile" class="stack" hidden>
      <div class="grid-2">
        <div class="card stack">
          <h2 class="h-sec" data-i18n="biz_title"></h2>
          <div class="fgrid">
            <label class="field wide"><span data-i18n="biz_name"></span><input type="text" id="pfName" data-p="name" dir="auto" maxlength="120" autocomplete="organization"></label>
            <label class="field"><span data-i18n="gstin"></span><input type="text" id="pfGstin" data-p="gstin" class="mono-in up" dir="ltr" maxlength="15" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="state"></span><select id="pfState" data-p="state"></select></label>
            <label class="field"><span data-i18n="pan"></span><input type="text" id="pfPan" data-p="pan" class="mono-in up" dir="ltr" maxlength="10" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="phone"></span><input type="tel" id="pfPhone" data-p="phone" dir="ltr" maxlength="40" autocomplete="off"></label>
            <label class="field"><span data-i18n="email"></span><input type="email" id="pfEmail" data-p="email" dir="ltr" maxlength="80" autocomplete="off"></label>
            <label class="field wide"><span data-i18n="address"></span><textarea id="pfAddr" data-p="address" rows="3" dir="auto" maxlength="300"></textarea></label>
          </div>
          <p class="msg" id="pfGstinMsg" aria-live="polite"></p>
          <label class="check"><input type="checkbox" id="pfCompo" data-p="composition"> <span data-i18n="composition"></span></label>
          <label class="field"><span data-i18n="lut_arn"></span><input type="text" id="pfLut" data-p="lut" class="mono-in up" dir="ltr" maxlength="20" autocomplete="off"></label>
        </div>
        <div class="card stack">
          <h2 class="h-sec" data-i18n="bank_title"></h2>
          <div class="fgrid">
            <label class="field wide"><span data-i18n="bank_name"></span><input type="text" id="pfBank" data-p="bankName" dir="auto" maxlength="80" autocomplete="off"></label>
            <label class="field"><span data-i18n="acc_name"></span><input type="text" id="pfAccName" data-p="accName" dir="auto" maxlength="80" autocomplete="off"></label>
            <label class="field"><span data-i18n="acc_no"></span><input type="text" id="pfAccNo" data-p="accNo" class="mono-in" dir="ltr" inputmode="numeric" maxlength="20" autocomplete="off"></label>
            <label class="field"><span data-i18n="ifsc"></span><input type="text" id="pfIfsc" data-p="ifsc" class="mono-in up" dir="ltr" maxlength="11" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="upi_id"></span><input type="text" id="pfUpi" data-p="upi" dir="ltr" maxlength="60" autocomplete="off" spellcheck="false"></label>
          </div>
          <p class="msg" id="pfBankMsg" aria-live="polite"></p>
          <div class="field"><span data-i18n="logo"></span>
            <div class="imgbox"><div class="thumb" id="logoThumb"></div>
              <button class="btn btn-sm" id="logoPick" type="button" data-i18n="pick_image"></button>
              <button class="btn btn-sm btn-ghost" id="logoDel" type="button" data-i18n="remove"></button></div>
          </div>
          <div class="field"><span data-i18n="signature"></span>
            <div class="imgbox"><div class="thumb" id="signThumb"></div>
              <button class="btn btn-sm" id="signPick" type="button" data-i18n="pick_image"></button>
              <button class="btn btn-sm btn-ghost" id="signDel" type="button" data-i18n="remove"></button></div>
          </div>
          <p class="tiny muted mb0" data-i18n="img_hint"></p>
        </div>
      </div>
      <div class="card stack">
        <h2 class="h-sec" data-i18n="doc_settings"></h2>
        <div class="field"><span data-i18n="prefixes"></span>
          <div class="pref-grid" id="prefGrid"></div>
          <span class="tiny muted" data-i18n="fy_hint"></span>
        </div>
        <div class="fgrid">
          <label class="field"><span data-i18n="doc_lang"></span><select id="docLang"></select></label>
        </div>
        <label class="field"><span data-i18n="def_terms"></span><textarea id="pfTerms" data-p="terms" rows="4" dir="auto" maxlength="1200"></textarea></label>
      </div>
      <div class="card row spread">
        <span class="small muted"><span aria-hidden="true">🔒</span> <span data-i18n="saved_local"></span></span>
        <button class="btn btn-danger" id="resetAll" type="button" data-i18n="reset_all"></button>
      </div>
    </section>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="tip-list" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="callout warning small mb0" data-i18n="disclaimer"></p>
    </details>

    <datalist id="custList"></datalist>
    <datalist id="itemList"></datalist>
    <datalist id="uqcList"></datalist>
    <datalist id="rateList"></datalist>
    <datalist id="invList"></datalist>
    <div id="printRoot" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/gst-invoice-maker/../../shared/edu.js"></script>
  <script src="../../../apps/gst-invoice-maker/strings.js"></script>
  <script src="../../../apps/gst-invoice-maker/words.js"></script>
  <script src="../../../apps/gst-invoice-maker/qr.js"></script>
  <script src="../../../apps/gst-invoice-maker/app.js"></script>
</body>
</html>
