          <div class="ad-chips" id="nChips" role="group" data-i18n-aria-label="quick_pick">
            <button type="button" class="chip" data-n="15">15</button>
            <button type="button" class="chip" data-n="30">30</button>
            <button type="button" class="chip" data-n="45">45</button>
            <button type="button" class="chip" data-n="60">60</button>
            <button type="button" class="chip" data-n="90">90</button>
          </div>
          <div class="field">
            <span class="ad-lbl" id="nModeLbl" data-i18n="n_mode"></span>
            <div class="seg ad-seg-full" id="nMode" role="group" aria-labelledby="nModeLbl">
              <button type="button" data-v="cal" data-i18n="n_mode_cal"></button>
              <button type="button" data-v="work" data-i18n="n_mode_work"></button>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="nDay1"> <span data-i18n="n_day1"></span></label>
          <p class="tiny muted mb0" data-i18n="n_help"></p>
        </div>
        <div class="card" id="noticeRes" aria-live="polite"></div>
      </div>
    </section>

    <!-- ============================================================ COUNTDOWN -->
    <section id="p-count" class="ad-panel" role="tabpanel" aria-labelledby="tab-count" hidden>
      <div class="ad-split ad-flow">
        <div class="ad-col">
          <div class="card ad-form o1">
            <h2 data-i18n="count_title"></h2>
            <div class="field">
              <label for="cName" data-i18n="c_name"></label>
              <input type="text" id="cName" class="no-i18n" maxlength="60" data-i18n-placeholder="c_name_ph" autocomplete="off">
            </div>
            <div class="field">
              <label for="cDate" data-i18n="c_date"></label>
              <input type="date" id="cDate" min="0001-01-01" max="9999-12-31">
              <span class="ad-hint" id="cDateHint"></span>
            </div>
            <button type="button" class="btn btn-primary" id="cAdd" data-i18n="c_add"></button>
          </div>
          <div class="card o3">
            <h2 data-i18n="c_list"></h2>
            <ul class="ad-list no-i18n" id="cList"></ul>
          </div>
        </div>
        <div class="card o2" id="countRes" aria-live="polite"></div>
      </div>
    </section>

    <!-- shared working-day settings (difference, add/subtract, notice) -->
    <div class="card ad-form" id="workCard">
      <h2 data-i18n="w_title"></h2>
      <div class="field">
        <span class="ad-lbl" id="wkLbl" data-i18n="wk_label"></span>
        <div class="seg ad-seg-full" id="wkMode" role="group" aria-labelledby="wkLbl">
          <button type="button" data-v="satsun" data-i18n="wk_satsun"></button>
          <button type="button" data-v="sun" data-i18n="wk_sun"></button>
          <button type="button" data-v="bank" data-i18n="wk_bank"></button>
        </div>
      </div>
      <div class="field">
        <label for="holidays" data-i18n="hol_label"></label>
        <textarea id="holidays" class="ad-hol no-i18n" data-i18n-placeholder="hol_ph" spellcheck="false"></textarea>
        <span class="ad-hint" id="holHint"></span>
      </div>
    </div>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="small muted" style="margin-top:12px" data-i18n="feb29_note"></p>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/age-date-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/age-date-calculator/strings.js"></script>
  <script src="../../../apps/age-date-calculator/app.js"></script>
</body>
</html>
