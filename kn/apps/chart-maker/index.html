<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="cm-privacy"><span aria-hidden="true">🔒</span><span data-i18n="privacy"></span></p>

    <details class="card cm-help no-print">
      <summary data-i18n="howto"></summary>
      <ul>
        <li data-i18n="tip_1"></li>
        <li data-i18n="tip_2"></li>
        <li data-i18n="tip_3"></li>
        <li data-i18n="tip_4"></li>
        <li data-i18n="tip_5"></li>
        <li data-i18n="tip_6"></li>
      </ul>
      <h3 data-i18n="words_title"></h3>
      <dl class="cm-words">
        <div><dt data-i18n="w_category"></dt><dd data-i18n="w_category_d"></dd></div>
        <div><dt data-i18n="w_series"></dt><dd data-i18n="w_series_d"></dd></div>
        <div><dt data-i18n="w_axis"></dt><dd data-i18n="w_axis_d"></dd></div>
        <div><dt data-i18n="w_legend"></dt><dd data-i18n="w_legend_d"></dd></div>
        <div><dt data-i18n="w_hist"></dt><dd data-i18n="w_hist_d"></dd></div>
        <div><dt data-i18n="w_trunc"></dt><dd data-i18n="w_trunc_d"></dd></div>
      </dl>
    </details>

    <div class="cm-layout">
      <div class="cm-main">
        <section class="card stack" aria-labelledby="h-chart">
          <h2 id="h-chart" class="sr-only" data-i18n="chart_title"></h2>
          <div class="cm-types" id="types" role="group" data-i18n-aria-label="chart_type"></div>
          <div class="cm-stage" id="stage" role="img" aria-live="polite"></div>
          <div class="cm-warn" id="warn" aria-live="polite"></div>
          <div class="row cm-export">
            <div class="seg" id="size" role="group" data-i18n-aria-label="size_label">
              <button type="button" data-size="wide" data-i18n="size_wide"></button>
              <button type="button" data-size="square" data-i18n="size_square"></button>
            </div>
            <button type="button" class="btn btn-primary" id="png" data-i18n="dl_png"></button>
            <button type="button" class="btn" id="svg" data-i18n="dl_svg"></button>
          </div>
        </section>
        <section class="card stack cm-helper" aria-labelledby="h-helper">
          <h2 id="h-helper" class="mb0" data-i18n="helper_title"></h2>
          <div class="row">
            <label class="sr-only" for="goal" data-i18n="helper_title"></label>
            <select id="goal">
              <option value="compare" data-i18n="goal_compare"></option>
              <option value="time" data-i18n="goal_time"></option>
              <option value="part" data-i18n="goal_part"></option>
              <option value="relation" data-i18n="goal_relation"></option>
              <option value="spread" data-i18n="goal_spread"></option>
            </select>
            <button type="button" class="btn" id="goal-use" data-i18n="helper_use"></button>
          </div>
          <p class="callout mb0" id="goal-tip"></p>
        </section>
      </div>

      <div class="cm-side">
        <section class="card stack cm-drop" id="data-card" aria-labelledby="h-data">
          <div class="row spread">
            <h2 id="h-data" class="mb0" data-i18n="data_title"></h2>
            <button type="button" class="btn btn-sm btn-danger" id="reset" data-i18n="reset"></button>
          </div>
          <div class="row cm-samples">
            <span class="muted small" data-i18n="samples"></span>
            <button type="button" class="chip" data-sample="sales" data-i18n="sample_sales"></button>
            <button type="button" class="chip" data-sample="fruit" data-i18n="sample_fruit"></button>
            <button type="button" class="chip" data-sample="hw" data-i18n="sample_hw"></button>
            <button type="button" class="chip" data-sample="marks" data-i18n="sample_marks"></button>
          </div>
          <p class="muted small mb0" data-i18n="grid_hint"></p>
          <div class="cm-gridwrap"><table class="cm-grid" id="grid"></table></div>
          <div class="row">
            <button type="button" class="btn btn-sm" id="add-row" data-i18n="add_row"></button>
            <button type="button" class="btn btn-sm" id="add-col" data-i18n="add_col"></button>
            <button type="button" class="btn btn-sm" id="clear-grid" data-i18n="clear_grid"></button>
          </div>
          <details>
            <summary class="small" style="cursor:pointer;font-weight:700" data-i18n="paste_title"></summary>
            <div class="stack" style="margin-top:8px">
              <label for="paste" class="small" data-i18n="paste_label"></label>
              <textarea id="paste" class="no-i18n" rows="5" spellcheck="false" data-i18n-placeholder="paste_ph"></textarea>
              <div class="row">
                <button type="button" class="btn btn-sm btn-primary" id="paste-use" data-i18n="paste_use"></button>
                <button type="button" class="btn btn-sm" id="open" data-i18n="open_csv"></button>
              </div>
              <p class="muted tiny mb0" data-i18n="excel_hint"></p>
            </div>
          </details>
        </section>

        <section class="card stack" aria-labelledby="h-opts">
          <h2 id="h-opts" class="mb0" data-i18n="opts_title"></h2>
          <div class="cm-opts">
            <div class="field wide"><label for="o-title" data-i18n="o_title"></label><input id="o-title" type="text" class="no-i18n" autocomplete="off"></div>
            <div class="field"><label for="o-x" data-i18n="o_x"></label><input id="o-x" type="text" class="no-i18n" autocomplete="off"></div>
            <div class="field"><label for="o-y" data-i18n="o_y"></label><input id="o-y" type="text" class="no-i18n" autocomplete="off"></div>
            <div class="field"><label for="o-sort" data-i18n="o_sort"></label>
              <select id="o-sort"><option value="none" data-i18n="sort_none"></option><option value="desc" data-i18n="sort_desc"></option><option value="asc" data-i18n="sort_asc"></option><option value="az" data-i18n="sort_az"></option></select></div>
            <div class="field"><label for="o-fmt" data-i18n="o_fmt"></label>
              <select id="o-fmt"><option value="plain" data-i18n="fmt_plain"></option><option value="inr" data-i18n="fmt_inr"></option><option value="pct" data-i18n="fmt_pct"></option><option value="lakh" data-i18n="fmt_lakh"></option></select></div>
            <div class="field"><label for="o-pal" data-i18n="o_pal"></label>
              <select id="o-pal"><option value="default" data-i18n="pal_default"></option><option value="cb" data-i18n="pal_cb"></option><option value="warm" data-i18n="pal_warm"></option><option value="cool" data-i18n="pal_cool"></option><option value="mono" data-i18n="pal_mono"></option></select></div>
            <div class="field"><label for="o-bins" data-i18n="o_bins"></label><input id="o-bins" type="number" min="0" max="50" step="1" inputmode="numeric" data-i18n-placeholder="bins_auto"></div>
            <div class="cm-checks wide">
              <label class="check"><input type="checkbox" id="o-legend"><span data-i18n="o_legend"></span></label>
              <label class="check"><input type="checkbox" id="o-labels"><span data-i18n="o_labels"></span></label>
              <label class="check"><input type="checkbox" id="o-zero"><span data-i18n="o_zero"></span></label>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
