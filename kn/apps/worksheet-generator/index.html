  <style>
    /* ---------- layout ---------- */
    .ws-layout { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); }
    @media (max-width: 860px) { .ws-layout { grid-template-columns: minmax(0, 1fr); } .from-link .ws-controls { order: 2; } }
    .help summary { cursor: pointer; padding: 4px 0; min-height: 32px; }
    .tips { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .tips li + li { margin-top: 6px; }
    .ws-controls h2 { font-size: 1.15rem; margin-bottom: 0; }
    .flabel { font-weight: 600; font-size: .92rem; }
    .hint { color: var(--muted); font-size: .84rem; margin: 0; }
    .seg button { min-height: 40px; }
    .tgrp { margin-top: 10px; }
    .tgrp-h { font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .tchips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tchips .chip { min-height: 40px; padding: 6px 11px; font-size: .86rem; text-align: start; }
    .chip .cls { font-size: .7rem; opacity: .75; font-weight: 600; white-space: nowrap; }
    .opts { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; }
    .jump { display: none; }
    @media (max-width: 860px) { .jump { display: inline-flex; } }
    .opts > .full { grid-column: 1 / -1; }
    .tables-row { display: flex; align-items: center; gap: 8px; }
    .tables-row select { flex: 1 1 0; min-width: 0; }
    .actions .btn { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: center; }
    #score { display: block; }
    #score[hidden] { display: none; }
    #score-num { font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    #score .progress { margin: 8px 0; }
    #score-msg { margin: 0; }

    /* ---------- the sheet ---------- */
    .paper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); }
    .paper.big { font-size: 1.22em; }
    .ws-head { border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 8px; }
    .ws-school { text-align: center; font-weight: 800; font-size: 1.15em; letter-spacing: .02em; overflow-wrap: anywhere; }
    .ws-title { text-align: center; font-size: 1.45em; margin: 2px 0 0; overflow-wrap: anywhere; }
    .ws-meta { text-align: center; color: var(--muted); font-size: .9em; margin-bottom: 12px; }
    .ws-fields { display: flex; flex-wrap: wrap; gap: 10px 18px; }
    .fld { display: flex; align-items: flex-end; gap: 6px; flex: 1 1 120px; min-width: max-content; }
    .fld-name { flex: 3 1 240px; }
    .fld > span:first-child { white-space: nowrap; font-weight: 600; }
    .fld > span:first-child::after { content: ':'; }
    .line { flex: 1 1 auto; border-bottom: 1.5px solid var(--text); min-width: 40px; height: 1.3em; }
    .line.short { flex: 0 0 46px; }
    .sec-h { font-size: 1.12em; margin: 20px 0 0; color: var(--primary); }
    .sec-i { font-weight: 600; margin: 8px 0 10px; }
    /* up to --c columns, but never narrower than the widest question (--qw, measured by app.js) + its padding */
    .ws-grid { --gx: 20px; --pad: 30px; display: grid; gap: 14px var(--gx); grid-template-columns: repeat(var(--c), minmax(0, 1fr));
      grid-template-columns: repeat(auto-fill, minmax(min(100%, max(calc(var(--qw, 0em) + var(--pad)), calc((100% - (var(--c) - 1) * var(--gx)) / var(--c) - 1px))), 1fr)); }
    .ws-grid.measure { grid-template-columns: repeat(var(--c), max-content); }
    @media (max-width: 620px) {
      .paper { padding: 14px 12px; }
      .ws-grid { --gx: 12px; gap: 10px var(--gx); grid-template-columns: repeat(var(--cm), minmax(0, 1fr));
        grid-template-columns: repeat(auto-fill, minmax(min(100%, max(calc(var(--qw, 0em) + var(--pad)), calc((100% - (var(--cm) - 1) * var(--gx)) / var(--cm) - 1px))), 1fr)); }
      .ws-grid.measure { grid-template-columns: repeat(var(--cm), max-content); }
    }
    .q { display: flex; gap: 6px; align-items: flex-start; padding: 8px 8px 8px 4px; padding-inline-end: 26px; border-radius: 10px; position: relative; min-width: 0; }
    .qn { font-weight: 700; color: var(--muted); min-width: 1.9em; padding-top: .35em; font-variant-numeric: tabular-nums; }
    .qb { flex: 1 1 auto; min-width: 0; font-size: 1.12em; }
    .mark { position: absolute; inset-inline-end: 6px; top: 6px; font-weight: 800; font-size: 1.2em; }
    .q.ok { background: var(--success-soft); }
    .q.ok .mark { color: var(--success); }
    .q.bad { background: var(--danger-soft); }
    .q.bad .mark { color: var(--danger); }
    .expr { line-height: 2.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .post { line-height: 2.3; }
    .qt { line-height: 1.9; }
    .m { font-weight: 700; }
    .op { padding: 0 .08em; }
    .var { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; }
    .unit { font-weight: 700; padding: 0 2px; }
    .pair { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; vertical-align: middle; }
    input.ans, select.ans { width: calc(var(--w, 4ch) + 20px); min-height: 38px; padding: 3px 6px; font-family: var(--mono); font-size: 1em;
      text-align: center; border: 2px solid var(--border); border-radius: 8px; background: var(--surface-2); vertical-align: middle; }
    input.ans:focus, select.ans:focus { background: var(--surface); }
    select.ans.cmpbox { width: 3.4em; padding: 2px 4px; text-align: center; font-weight: 800; }
    input.ans::placeholder { color: var(--muted); opacity: .6; font-size: .8em; }
    .wide-ans { margin-top: 6px; }
    input.ans.wide-in { width: 100%; text-align: start; }
    /* column (vertical) sums */
    .vsum { display: inline-grid; grid-template-columns: auto auto; column-gap: .3em; font-family: var(--mono); font-size: 1.25em;
      line-height: 1.35; letter-spacing: .14em; margin-inline-start: .4em; }
    .vn { text-align: end; padding-inline-end: 4px; }
    .vop { text-align: center; }
    .vline { grid-column: 1 / -1; border-top: 2.5px solid currentColor; margin: 3px 0 5px; }
    .vans { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
    .vsum input.ans { width: calc(var(--cw) * (1ch + .14em) + 14px); text-align: end; letter-spacing: .14em; padding-inline: 2px; }
    .q.vq .qb { display: flex; justify-content: center; }
    .vwork, .vline2 { display: none; }
    /* long division */
    .ldwrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .ld { display: inline-flex; font-family: var(--mono); font-size: 1.25em; letter-spacing: .1em; }
    .ld-dv { padding: .25em .3em 0 0; }
    .ld-dd { border-top: 2.5px solid currentColor; border-inline-start: 2.5px solid currentColor; border-start-start-radius: 12px; padding: .25em .5em 0 .5em; }
    .ld-work { display: none; }
    /* fractions */
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.12; margin: 0 .12em; }
    .frac .fn { border-bottom: 2px solid currentColor; padding: 0 .25em; }
    .frac .fd { padding: 0 .25em; }
    .mixed { display: inline-flex; align-items: center; gap: .08em; vertical-align: middle; }
    .expr .frac, .qt .frac { font-size: .95em; }
    /* word problems */
    .q.word .qb { font-size: 1.04em; }
    .wp { margin: 0 0 8px; line-height: 1.65; }
    :root[lang="ur"] .wp { line-height: 2.1; }
    .wans { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lbl { font-weight: 600; color: var(--muted); }
    .ws-foot { margin-top: 18px; text-align: center; border-top: 1px dashed var(--border); padding-top: 8px; color: var(--muted); font-size: .8em; }
    /* answer key */
    .ws-key { margin-top: 16px; }
    .key-h { font-size: 1.1em; }
    .key-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 4px 18px; }
    .key-list li { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px dotted var(--border); min-width: 0; }
    .kn { color: var(--muted); font-weight: 700; min-width: 2em; }
    .kv { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    /* smartboard full screen */
    #sheet-area:fullscreen { background: var(--bg); overflow: auto; padding: 20px; }
    #sheet-area:fullscreen .paper { font-size: 1.3em; }

    @media print {
      @page { size: A4; margin: 12mm; }
      .edu-intro { display: none !important; }
      .ws-layout { display: block; }
      #sheet-area > * + * { margin-top: 0; }
      .paper { border: 0; box-shadow: none; padding: 0; background: #fff; color: #000; font-size: 12.5pt; border-radius: 0; }
      .paper.big { font-size: 15.5pt; }
      .ws-head, .line, .ld-dd, .vline { border-color: #000; }
      .sec-h, .lbl, .qn, .ws-meta, .ws-foot { color: #000; }
      .q { padding: 3px 2px; break-inside: avoid; background: none !important; }
      .ws-grid { --pad: 4px; }
      .q, .q.ok, .q.bad { color: #000 !important; }        /* on-screen ✓/✗ colours never reach the paper */
      .sec-h, .sec-i { break-after: avoid; page-break-after: avoid; }
      .ws-foot { break-before: avoid; page-break-before: avoid; margin-top: 10px; }   /* never a page with only the footer */
      .mark { display: none; }
      input.ans, select.ans { border: 0; border-bottom: 1.5px solid #000; border-radius: 0; background: transparent !important;
        color: transparent !important; -webkit-text-fill-color: transparent; }
      input.ans::placeholder { color: transparent; }
      input.ans, select.ans, input.ans:focus, select.ans:focus { outline: none !important; box-shadow: none !important; border-color: #000 !important; }
      input.ans { width: calc(var(--w, 4ch) + 4px); padding: 2px; }
      select.ans.cmpbox { border: 1.5px solid #000; -webkit-appearance: none; appearance: none; height: 1.7em; min-height: 0; width: 2.4em; }
      .vsum input.ans { border: 0 !important; min-height: 1.6em; }
      .vwork { display: block; grid-column: 1 / -1; height: calc(var(--rows) * 1.45em); }
      .vline2 { display: block; }
      .ld-work { display: block; height: 4.2em; }
      .ws-key { display: none !important; }
      .ws-key.print-on { display: block !important; break-before: page; border: 0; box-shadow: none; padding: 1em 0 0; background: #fff; color: #000; }
      .key-list li { border-color: #999; }
    }
  </style>

        </div>
        <div class="row spread">
          <span class="tiny muted" data-i18n="saved_local"></span>
          <button type="button" class="btn btn-danger btn-sm" id="btn-reset" data-i18n="reset"></button>
        </div>
      </aside>

      <section class="stack" id="sheet-area">
        <div class="row actions no-print">
          <button type="button" class="btn btn-primary" id="btn-print"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <button type="button" class="btn btn-accent" id="btn-new"><span aria-hidden="true">↻</span> <span data-i18n="btn_new"></span></button>
          <button type="button" class="btn" id="btn-check"><span aria-hidden="true">✓</span> <span data-i18n="btn_check"></span></button>
          <button type="button" class="btn" id="btn-key" aria-pressed="false"></button>
          <button type="button" class="btn btn-ghost" id="btn-clear" data-i18n="btn_clear"></button>
          <button type="button" class="btn btn-ghost" id="btn-share" data-i18n="btn_share"></button>
          <button type="button" class="btn btn-ghost" id="btn-full" data-i18n="fullscreen"></button>
        </div>
        <p class="callout small no-print mb0" data-i18n="practice_hint"></p>
        <div class="no-print" aria-live="polite">
          <div id="score" class="callout" hidden>
            <div class="row spread"><strong id="score-line"></strong><span id="score-num"></span></div>
            <div class="progress"><span id="score-bar" style="width:0"></span></div>
            <p id="score-msg" class="small"></p>
          </div>
        </div>
        <article class="paper" id="paper">
          <header class="ws-head">
            <div class="ws-school" id="ws-school"></div>
            <h2 class="ws-title" id="ws-title"></h2>
            <div class="ws-meta" id="ws-meta"></div>
            <div class="ws-fields">
              <div class="fld fld-name"><span data-i18n="h_name"></span><span class="line"></span></div>
              <div class="fld"><span data-i18n="h_class"></span><span class="line"></span></div>
              <div class="fld"><span data-i18n="h_roll"></span><span class="line"></span></div>
              <div class="fld"><span data-i18n="h_date"></span><span class="line"></span></div>
              <div class="fld"><span data-i18n="h_marks"></span><span class="line short"></span><span>/&nbsp;<span id="ws-total"></span></span></div>
            </div>
          </header>
          <div id="ws-body"></div>
          <footer class="ws-foot" id="ws-foot"></footer>
        </article>
        <section class="paper ws-key" id="ws-key" hidden></section>
      </section>
    </div>
  </main>
  <script src="../../../apps/worksheet-generator/../../shared/edu.js"></script>
  <script src="../../../apps/worksheet-generator/strings.js"></script>
  <script src="../../../apps/worksheet-generator/content.js"></script>
  <script src="../../../apps/worksheet-generator/gen.js"></script>
  <script src="../../../apps/worksheet-generator/app.js"></script>
</body>
</html>
