              </div>
              <label class="f"><span class="lbl" data-i18n="tenant"></span><input type="text" id="tenant" data-k="tenant" maxlength="90" autocomplete="off" dir="auto" data-i18n-placeholder="s_tenant"></label>
              <label class="f"><span class="lbl" data-i18n="landlord"></span><input type="text" id="landlord" data-k="landlord" maxlength="90" autocomplete="off" dir="auto" data-i18n-placeholder="s_landlord"></label>
              <label class="f"><span class="lbl" data-i18n="pan"></span><input type="text" id="pan" data-k="pan" maxlength="12" autocomplete="off" class="mono-in no-i18n" placeholder="ABCDE1234F" spellcheck="false"></label>

                <button type="button" class="btn" id="setSave"><span aria-hidden="true">💾</span> <span data-i18n="save_set"></span></button>
                <span class="muted small" data-i18n="saved_local"></span>
              </div>
            </div>

            <div class="grp">
              <h2 data-i18n="sec_period"></h2>
              <label class="f"><span class="lbl" data-i18n="tax_year"></span><select id="ty"></select></label>
              <div class="two">
                <label class="f"><span class="lbl" data-i18n="from_month"></span><select id="fromM"></select></label>
                <label class="f"><span class="lbl" data-i18n="to_month"></span><select id="toM"></select></label>
              </div>
              <label class="f"><span class="lbl" data-i18n="rent"></span><input type="text" id="rent" inputmode="numeric" autocomplete="off" class="num-in" data-i18n-placeholder="rent_ph"></label>

              <button type="button" class="btn btn-sm" id="addChange">＋ <span data-i18n="add_change"></span></button>

            </div>

            <div class="grp">

                  <button type="button" data-mode="upi" data-i18n="mode_upi"></button>
                  <button type="button" data-mode="bank" data-i18n="mode_bank"></button>
                  <button type="button" data-mode="cheque" data-i18n="mode_cheque"></button>

                <div class="seg full" role="group" aria-labelledby="stLbl">

                  <button type="button" data-stamp="all" data-i18n="stamp_all"></button>
                  <button type="button" data-stamp="none" data-i18n="stamp_none"></button>

              </div>
              <span class="hint" data-i18n="rlang_hint"></span>

              <button type="button" class="btn btn-danger" id="resetBtn" data-i18n="reset_all"></button>
            </div>
            <span class="hint" data-i18n="print_hint"></span>
          </section>
        </div>

        <div class="pv-col" id="preview">
          <h2 class="small muted" style="margin:0 0 6px" data-i18n="preview_title"></h2>
          <div class="pv-wrap" id="pvWrap"><div class="pages no-i18n" id="pages"></div></div>
        </div>
      </div>
    </section>

    <!-- ================= HRA CALCULATOR ================= -->
    <section id="p-hra" role="tabpanel" aria-labelledby="tab-hra" hidden>
      <div class="hra-grid">
        <section class="card form stack">
          <h2 data-i18n="tab_hra"></h2>
          <p class="muted small mb0" data-i18n="h_intro"></p>
          <label class="f"><span class="lbl" data-i18n="h_basic"></span><input type="text" id="hBasic" inputmode="numeric" autocomplete="off" class="num-in"></label>
          <span class="hint" data-i18n="h_basic_hint"></span>
          <label class="f"><span class="lbl" data-i18n="h_hra"></span><input type="text" id="hHra" inputmode="numeric" autocomplete="off" class="num-in"></label>
          <label class="f"><span class="lbl" data-i18n="h_rent"></span><input type="text" id="hRent" inputmode="numeric" autocomplete="off" class="num-in"></label>
          <button type="button" class="btn btn-sm" id="hUseRec"><span aria-hidden="true">🧾</span> <span data-i18n="h_use_rec"></span></button>
          <label class="f"><span class="lbl" data-i18n="h_city"></span><select id="hCity"></select></label>
        </section>
        <section class="card hra-res stack" aria-live="polite">
          <div><span class="muted" data-i18n="h_exempt"></span><div class="big" id="hExempt"></div></div>
          <p class="tax mb0" id="hTaxable"></p>
          <p class="small mb0" data-i18n="h_work"></p>
          <div class="scroll-x"><table class="work"><tbody id="hWork"></tbody></table></div>
          <div class="callout warning small" id="hNone" hidden data-i18n="h_none"></div>
        </section>
      </div>
    </section>

    <!-- ================= RULES ================= -->
    <section class="card rules no-print" style="margin-top:16px" id="rules">
      <h2 id="rulesTitle"></h2>
      <ul>
        <li data-i18n="rule_regime"></li>
        <li id="rulePan"></li>
        <li data-i18n="rule_metro"></li>
        <li data-i18n="rule_family"></li>
        <li data-i18n="rule_form"></li>
        <li id="ruleStamp"></li>
      </ul>
      <p class="small muted src" id="ruleSrc"></p>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary><strong data-i18n="help"></strong></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li>
      </ul>
    </details>

    <div id="printRoot" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/rent-receipt-maker/../../shared/edu.js"></script>
  <script src="../../../apps/rent-receipt-maker/strings.js"></script>
  <script src="../../../apps/rent-receipt-maker/data.js"></script>
  <script src="../../../apps/rent-receipt-maker/words.js"></script>
  <script src="../../../apps/rent-receipt-maker/app.js"></script>
</body>
</html>
