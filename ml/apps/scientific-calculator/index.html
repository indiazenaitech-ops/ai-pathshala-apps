      .sc-hitem { break-inside: avoid; }
      .sc-eq-grid > .card, .sc-st-grid > .card { margin-bottom: 12px; }
      .sc-steps > li { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="sc-top">
      <div class="tabs sc-tabs" role="tablist" data-i18n-aria-label="tabs_label">
        <button type="button" role="tab" id="tab-calc" aria-controls="pane-calc" aria-selected="true" data-i18n="tab_calc"></button>
        <button type="button" role="tab" id="tab-eq" aria-controls="pane-eq" aria-selected="false" data-i18n="tab_eq"></button>
        <button type="button" role="tab" id="tab-stats" aria-controls="pane-stats" aria-selected="false" data-i18n="tab_stats"></button>
      </div>
      <button type="button" class="btn btn-ghost sc-fs" id="fs-btn" data-i18n-title="fs_t" data-i18n-aria-label="fs_t">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <!-- ===================== calculator ===================== -->
    <section id="pane-calc" role="tabpanel" aria-labelledby="tab-calc">
      <div class="sc-wrap">
        <div class="card sc-calc" id="calc">
          <div class="sc-display">
            <div class="sc-status sc-ltr">
              <button type="button" class="sc-mini mode" id="angle-btn"></button>
              <button type="button" class="sc-mini mode" id="note-btn"></button>
              <span class="sc-mflag" id="mem-flag" hidden></span>
              <span class="grow"></span>
              <button type="button" class="sc-mini" id="frac-btn" aria-pressed="false" data-i18n-title="k_frac" data-i18n-aria-label="k_frac">a/b</button>
              <button type="button" class="sc-mini" id="dms-btn" aria-pressed="false" data-i18n-title="k_dmsview" data-i18n-aria-label="k_dmsview">°′″</button>
              <button type="button" class="sc-mini" id="copy-btn" data-i18n-title="k_copy" data-i18n-aria-label="k_copy">
                <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 5.5v-.3A1.7 1.7 0 0 0 13.8 3.5H5.2A1.7 1.7 0 0 0 3.5 5.2v8.6a1.7 1.7 0 0 0 1.7 1.7h.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              </button>
            </div>
            <label class="edu-sr" for="expr" data-i18n="expr_label"></label>
            <input id="expr" class="sc-expr no-i18n" type="text" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="400" data-i18n-placeholder="expr_ph">
            <div class="sc-out sc-ltr">
              <div class="sc-preview no-i18n" id="preview" aria-hidden="true"></div>
              <div class="sc-result" id="result" role="status" aria-live="polite"></div>
            </div>
            <div class="sc-note" id="disp-note"></div>
          </div>
          <div class="sc-keys sc-sci no-i18n" id="keys-sci" role="group" data-i18n-aria-label="keys_sci"></div>
          <div class="sc-keys sc-memk no-i18n" id="keys-mem" role="group" data-i18n-aria-label="keys_mem"></div>
          <div class="sc-keys sc-num no-i18n" id="keys-num" role="group" data-i18n-aria-label="keys_num"></div>
          <div class="sc-foot">
            <label><span data-i18n="group_label"></span>
              <select id="group-sel">
                <option value="in" data-i18n="grp_in"></option>
                <option value="intl" data-i18n="grp_intl"></option>
                <option value="off" data-i18n="grp_off"></option>
              </select>
            </label>
            <button type="button" class="btn btn-sm btn-danger" id="reset-btn" data-i18n="reset"></button>
          </div>
        </div>

        <section class="card sc-hist" aria-labelledby="hist-h">
          <div class="sc-hhead">
            <h2 id="hist-h" data-i18n="hist_h"></h2>
            <button type="button" class="btn btn-sm" id="hist-clear" data-i18n="hist_clear"></button>
          </div>
          <div id="hist-empty">
            <p class="sc-empty" data-i18n="hist_empty"></p>
            <div class="sc-tries" id="tries"></div>
          </div>
          <ol class="sc-hlist" id="hist-list"></ol>
        </section>
      </div>
    </section>

    <!-- ===================== equations ===================== -->
    <section id="pane-eq" role="tabpanel" aria-labelledby="tab-eq" hidden>
      <div class="sc-eq-grid">
        <section class="card sc-eq" aria-labelledby="eq-h">
          <h2 id="eq-h" data-i18n="eq_h"></h2>
          <div class="seg" role="group" data-i18n-aria-label="eq_type">
            <button type="button" id="eqt-quad" aria-pressed="true" data-i18n="eqt_quad"></button>
            <button type="button" id="eqt-lin2" aria-pressed="false" data-i18n="eqt_lin2"></button>
            <button type="button" id="eqt-lin3" aria-pressed="false" data-i18n="eqt_lin3"></button>
          </div>
          <p class="small muted" id="eq-form-hint"></p>
          <div class="sc-eqrows no-i18n" id="eq-rows"></div>
          <p class="sc-eqerr" id="eq-err" role="alert"></p>
          <div class="sc-eqprev sc-math no-i18n" id="eq-prev"></div>
          <p class="tiny muted" style="margin-top:8px" data-i18n="eq_input_hint"></p>
          <h3 class="sc-ex-h" data-i18n="examples_h"></h3>
          <div class="chips" id="eq-examples"></div>
        </section>
        <section class="card sc-eq" aria-labelledby="sol-h">
          <div class="sc-hhead">
            <h2 id="sol-h" data-i18n="sol_h"></h2>
            <button type="button" class="btn btn-sm no-print" id="eq-print" data-i18n="print"></button>
          </div>
          <div id="eq-out" aria-live="polite">
            <div class="sc-answer" id="eq-answer"></div>
            <p class="sc-verdict" id="eq-verdict"></p>
            <h3 class="sc-steps-h" data-i18n="steps_h"></h3>
            <ol class="sc-steps" id="eq-steps"></ol>
          </div>
        </section>
      </div>
    </section>

    <!-- ===================== statistics ===================== -->
    <section id="pane-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
      <div class="sc-st-grid">
        <section class="card sc-st" aria-labelledby="st-h">
          <h2 id="st-h" data-i18n="st_h" style="margin-bottom:10px"></h2>
          <label class="field"><span data-i18n="st_label"></span>
            <textarea id="st-in" class="no-i18n" spellcheck="false" rows="5"></textarea>
          </label>
          <p class="sc-stbad" id="st-bad"></p>
          <div class="row">
            <button type="button" class="btn" id="st-example" data-i18n="st_example"></button>
            <button type="button" class="btn" id="st-clear" data-i18n="clear"></button>
          </div>
          <p class="small muted" style="margin-top:10px" data-i18n="st_note"></p>
        </section>
        <section class="card sc-st" aria-labelledby="st-res-h">
          <div class="sc-hhead">
            <h2 id="st-res-h" data-i18n="st_res_h"></h2>
            <button type="button" class="btn btn-sm no-print" id="st-copy" data-i18n="st_copy"></button>
          </div>
          <div aria-live="polite" id="st-out">
            <div class="scroll-x"><table class="table" id="st-table"><tbody id="st-body"></tbody></table></div>
            <p class="sc-sorted sc-math" id="st-sorted"></p>
          </div>
        </section>
      </div>
    </section>

    <details class="card">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="tiny muted mb0" style="margin-top:10px" data-i18n="saved_local"></p>
    </details>
  </main>
  <script src="../../../apps/scientific-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/scientific-calculator/strings.js"></script>
  <script src="../../../apps/scientific-calculator/calc.js"></script>
  <script src="../../../apps/scientific-calculator/eqstats.js"></script>
  <script src="../../../apps/scientific-calculator/app.js"></script>
</body>
</html>
