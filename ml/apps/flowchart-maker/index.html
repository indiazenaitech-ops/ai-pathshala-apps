        <section id="panel-python" role="tabpanel" aria-labelledby="tab-python" hidden>
          <h3 class="print-h" data-i18n="pr_python"></h3>
          <div class="code-tools"><button type="button" class="btn btn-sm" id="copy-python">📋 <span data-i18n="copy_code"></span></button></div>
          <div class="code no-i18n" id="python" dir="ltr" aria-live="off"></div>
        </section>
      </section>
      </div>

      <!-- ===== run / dry run ===== -->
      <section class="card fc-run stack no-print" id="run-card" aria-labelledby="run-title">
        <h2 class="h-sec" id="run-title" data-i18n="run_title"></h2>
        <div class="row run-btns">
          <button type="button" class="btn btn-primary" id="btn-run">▶ <span data-i18n="btn_run"></span></button>
          <button type="button" class="btn" id="btn-step">⏭ <span data-i18n="btn_step"></span></button>
          <button type="button" class="btn" id="btn-pause">⏸ <span data-i18n="btn_pause"></span></button>
          <button type="button" class="btn btn-ghost" id="btn-restart">↺ <span data-i18n="btn_restart"></span></button>
          <div class="field" style="margin-inline-start:auto">
            <label for="speed" class="small" data-i18n="speed"></label>
            <select id="speed">
              <option value="slow" data-i18n="sp_slow"></option>
              <option value="normal" data-i18n="sp_normal"></option>
              <option value="fast" data-i18n="sp_fast"></option>
              <option value="instant" data-i18n="sp_instant"></option>
            </select>
          </div>
        </div>
        <p class="status" id="run-status" aria-live="polite" data-status="ready"></p>
        <div class="callout danger err-box" id="run-error" hidden aria-live="assertive"></div>
        <div class="callout accent in-panel" id="in-panel" hidden>
          <label for="in-val" id="in-label" class="no-i18n"></label>
          <input type="text" id="in-val" class="no-i18n" dir="ltr" autocomplete="off" inputmode="text">
          <button type="button" class="btn btn-primary" id="in-ok" data-i18n="in_ok"></button>
        </div>
        <div class="field">
          <label for="inputs-pre" data-i18n="inputs_label"></label>
          <textarea id="inputs-pre" class="no-i18n" rows="2" spellcheck="false"></textarea>
          <span class="hint" data-i18n="inputs_hint"></span>
        </div>
        <div class="grid-2">
          <div>
            <h3 class="h-sec" data-i18n="console_title"></h3>
            <div class="console no-i18n" id="console" role="log" aria-live="polite" aria-atomic="false"></div>
          </div>
          <div>
            <h3 class="h-sec" data-i18n="vars_title"></h3>
            <div class="vars-wrap scroll-x">
              <table class="table" id="vars">
                <thead><tr><th data-i18n="var_name"></th><th data-i18n="var_value"></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section class="card fc-dry stack empty" id="dry-card" aria-labelledby="dry-title">
        <div class="dry-head">
          <h2 class="h-sec mb0" id="dry-title" data-i18n="dr_title"></h2>
          <button type="button" class="btn btn-sm" id="btn-csv">📊 <span data-i18n="dr_csv"></span></button>
        </div>
        <p class="muted small mb0" id="dry-note"></p>
        <div class="dry-wrap scroll-x">
          <table class="table" id="dry"><thead></thead><tbody></tbody></table>
        </div>
      </section>
    </div>

    <details class="card" id="words" style="margin-top:16px">
      <summary><strong data-i18n="wk_title"></strong></summary>
      <dl class="wk">
        <div><dt data-i18n="wk_algorithm"></dt><dd data-i18n="wk_algorithm_d"></dd></div>
        <div><dt data-i18n="wk_flowchart"></dt><dd data-i18n="wk_flowchart_d"></dd></div>
        <div><dt data-i18n="wk_pseudocode"></dt><dd data-i18n="wk_pseudocode_d"></dd></div>
        <div><dt data-i18n="wk_variable"></dt><dd data-i18n="wk_variable_d"></dd></div>
        <div><dt data-i18n="wk_condition"></dt><dd data-i18n="wk_condition_d"></dd></div>
        <div><dt data-i18n="wk_loop"></dt><dd data-i18n="wk_loop_d"></dd></div>
        <div><dt data-i18n="wk_dryrun"></dt><dd data-i18n="wk_dryrun_d"></dd></div>
        <div><dt data-i18n="wk_decomp"></dt><dd data-i18n="wk_decomp_d"></dd></div>
      </dl>
    </details>

    <details class="card" id="howto" style="margin-top:16px">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
        <li data-i18n="how6"></li>
      </ul>
    </details>
    <p class="muted tiny no-print" style="margin-top:12px">🔒 <span data-i18n="saved_local"></span></p>
  </main>
  <script src="../../../apps/flowchart-maker/../../shared/edu.js"></script>
  <script src="../../../apps/flowchart-maker/strings.js"></script>
  <script src="../../../apps/flowchart-maker/content.js"></script>
  <script src="../../../apps/flowchart-maker/examples.js"></script>
  <script src="../../../apps/flowchart-maker/engine.js"></script>
  <script src="../../../apps/flowchart-maker/app.js"></script>
</body>
</html>
