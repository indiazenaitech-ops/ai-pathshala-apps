    .st-circle .bead.on.sam { fill: var(--accent); stroke: var(--accent); }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="muted small st-privacy" id="st-privacy" data-i18n="privacy"></p>

    <!-- Quick strip: one tap for tanpura or taal -->
    <section class="card st-quick" aria-labelledby="st-quick-h">
      <h2 class="mb0 small muted" id="st-quick-h" data-i18n="quick_title" style="margin-bottom:8px"></h2>

        <label class="field">
          <span data-i18n="sa_label"></span>
          <select id="st-sa" class="no-i18n"></select>

        <button class="btn btn-accent btn-lg st-bigbtn" id="st-taal" aria-pressed="false"><span aria-hidden="true">▶ </span><span id="st-taal-txt" data-i18n="taal_play"></span></button>
        <label class="field st-vol">
          <span data-i18n="volume"></span>
          <input type="range" id="st-vol" min="0" max="100" step="1" value="70">

        <span class="st-beatpill badge" id="st-beatpill" hidden aria-live="off"><span class="st-dot"></span><span id="st-beatpill-txt"></span></span>
      </div>
    </section>

    <div class="tabs st-tabs" role="tablist" id="st-tabs">
      <button role="tab" id="st-tab-sur" aria-selected="true" aria-controls="st-pane-sur" data-tab="sur" data-i18n="tab_sur"></button>
      <button role="tab" id="st-tab-sargam" aria-selected="false" aria-controls="st-pane-sargam" data-tab="sargam" tabindex="-1" data-i18n="tab_sargam"></button>

    <!-- ============ SUR METER ============ -->

        <div class="st-judge" id="st-judge" data-zone="" aria-live="polite"></div>
        <div class="st-sub muted small">
          <span><span data-i18n="western_note"></span>: <b class="no-i18n" id="st-note">—</b></span>

          <span><span data-i18n="cents_label"></span>: <b class="no-i18n" id="st-cents">—</b></span>
        </div>
      </div>
      <div class="stack">
        <div class="card st-mic-wrap">

          <p class="muted small mb0" data-i18n="sing_hint"></p>
          <div class="callout danger small st-msg" id="st-msg" role="alert"></div>
          <div class="callout warning small st-tip" id="st-tip-head" data-i18n="headphone_tip"></div>
          <p class="muted small mb0" data-i18n="privacy"></p>
        </div>
        <div class="card stack">
          <div class="field">
            <span data-i18n="noise_label"></span>

              <button type="button" data-v="noisy" aria-pressed="false" data-i18n="noise_noisy"></button>

          <label class="field grow">

            <select id="st-alk"></select>

            </div>
          </div>
        </div>
        <div class="st-seq" id="st-seq" aria-live="off"></div>

          <span id="st-alk-verdict" class="st-judge"></span>
          <span class="badge" id="st-alk-best"></span>
        </div>
        <div class="st-mic-wrap">
          <button class="btn st-mic" data-mic="idle"><span class="st-mic-txt" data-i18n="mic_start"></span></button>
          <div class="callout danger small st-msg st-msg2" role="alert"></div>
        </div>
      </div>
      <div class="card stack">
        <h2 class="mb0" data-i18n="hold_title"></h2>
        <p class="muted small mb0" data-i18n="hold_desc"></p>
        <div class="row">
          <label class="field grow">
            <span data-i18n="hold_target"></span>
            <select id="st-hold-sel" class="no-i18n"></select>
          </label>
          <button class="btn" id="st-hold-hear" data-i18n="hold_play"></button>
        </div>
        <div class="progress st-hold-bar" id="st-hold-bar" data-done="0" aria-hidden="true"><span></span></div>
        <p class="st-judge mb0" id="st-hold-status" aria-live="polite"></p>
        <p class="muted small mb0" id="st-hold-best"></p>
      </div>
    </section>

    <!-- ============ TAAL ============ -->
    <section class="st-pane st-two" id="st-pane-taal" role="tabpanel" aria-labelledby="st-tab-taal" hidden>
      <div class="card stack" style="text-align:center">
        <svg class="st-circle" id="st-circle" viewBox="0 0 360 360" role="img" aria-labelledby="st-circle-title" data-beat="0" data-cycle="0"><title id="st-circle-title" data-i18n="beat_circle"></title></svg>
        <div class="st-bols" id="st-bols"></div>
        <p class="muted small mb0" id="st-beat-txt" aria-live="off"></p>
        <div class="row" style="justify-content:center">
          <button class="btn btn-accent btn-lg st-bigbtn" id="st-taal2" aria-pressed="false"><span aria-hidden="true">▶ </span><span id="st-taal2-txt" data-i18n="taal_play"></span></button>
        </div>
      </div>
      <div class="card stack">
        <label class="field">
          <span data-i18n="taal_label"></span>
          <select id="st-taalsel">
            <option value="teentaal" data-i18n="taal_teentaal"></option>
            <option value="keherwa" data-i18n="taal_keherwa"></option>
            <option value="dadra" data-i18n="taal_dadra"></option>
            <option value="rupak" data-i18n="taal_rupak"></option>
            <option value="jhaptaal" data-i18n="taal_jhaptaal"></option>
            <option value="ektaal" data-i18n="taal_ektaal"></option>
          </select>
        </label>
        <div class="field">
          <span><span data-i18n="tempo"></span>: <b class="no-i18n" id="st-bpm-val"></b> <span class="muted small" id="st-laya"></span></span>
          <div class="st-tempo">
            <button class="btn" id="st-bpm-minus" aria-label="−5" data-i18n-aria-label="tempo_down">−</button>
            <input type="range" id="st-bpm" min="40" max="200" step="1" value="80" data-i18n-aria-label="tempo">
            <button class="btn" id="st-bpm-plus" aria-label="+5" data-i18n-aria-label="tempo_up">+</button>
          </div>
        </div>
        <div class="st-legend small">
          <span><b class="no-i18n">×</b> <span data-i18n="legend_sam"></span></span>
          <span><b class="no-i18n">2 3 4</b> <span data-i18n="legend_tali"></span></span>
          <span><b class="no-i18n">0</b> <span data-i18n="legend_khali"></span></span>
        </div>
        <p class="muted small mb0" data-i18n="taal_hint"></p>
      </div>
    </section>

    <!-- ============ TUNER ============ -->
    <section class="st-pane st-two" id="st-pane-tuner" role="tabpanel" aria-labelledby="st-tab-tuner" hidden>
      <div class="card st-stage" id="st-tstage" data-zone="">
        <div class="st-swar no-i18n" id="st-tnote" aria-live="polite" data-empty="1">—</div>
        <svg class="st-meter" id="st-tmeter" viewBox="0 0 520 110" role="img" aria-labelledby="st-tmeter-title"><title id="st-tmeter-title" data-i18n="cents_meter"></title></svg>
        <div class="st-judge" id="st-tjudge" data-zone="" aria-live="polite"></div>
        <div class="st-sub muted small">
          <span><b class="no-i18n" id="st-thz">—</b></span>
          <span><span data-i18n="cents_label"></span>: <b class="no-i18n" id="st-tcents">—</b></span>
          <span><span data-i18n="nearest"></span>: <b class="no-i18n" id="st-tnear">—</b></span>
        </div>
      </div>
      <div class="stack">
        <div class="card stack">
          <div class="field">
            <span data-i18n="instrument"></span>
            <div class="seg" id="st-inst" role="group">
              <button type="button" data-v="guitar" aria-pressed="true" data-i18n="inst_guitar"></button>
              <button type="button" data-v="ukulele" aria-pressed="false" data-i18n="inst_ukulele"></button>
              <button type="button" data-v="violin" aria-pressed="false" data-i18n="inst_violin"></button>
              <button type="button" data-v="any" aria-pressed="false" data-i18n="inst_any"></button>
            </div>
          </div>
          <div class="st-strings" id="st-strings"></div>
          <p class="muted small mb0" data-i18n="tuner_hint"></p>
          <label class="field">
            <span data-i18n="a4_label"></span>
            <div class="row nowrap"><input type="number" id="st-a4" class="st-a4" min="415" max="466" step="1" value="440"> <span class="muted small">Hz</span></div>
          </label>
        </div>
        <div class="card st-mic-wrap">
          <button class="btn btn-primary btn-lg st-mic" data-mic="idle"><span class="st-mic-txt" data-i18n="mic_start"></span></button>
          <div class="callout danger small st-msg st-msg2" role="alert"></div>
          <p class="muted small mb0" data-i18n="privacy"></p>
        </div>
      </div>
    </section>

    <!-- ============ HELP ============ -->
    <details class="card st-help">
      <summary data-i18n="how_title"></summary>
      <ol>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
      </ol>
    </details>
    <details class="card st-help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip_1"></li>
        <li data-i18n="tip_2"></li>
        <li data-i18n="tip_3"></li>
        <li data-i18n="tip_4"></li>
        <li data-i18n="tip_5"></li>
        <li data-i18n="tip_6"></li>
      </ul>
      <p class="small muted st-kbd" data-i18n-html="kbd_hint"></p>
      <p><button class="btn btn-sm btn-ghost" id="st-reset" data-i18n="reset_all"></button></p>
    </details>
  </main>
  <script src="../../../apps/sur-taal-trainer/../../shared/edu.js"></script>
  <script src="../../../apps/sur-taal-trainer/strings.js"></script>
  <script src="../../../apps/sur-taal-trainer/content.js"></script>
  <script src="../../../apps/sur-taal-trainer/app.js"></script>
</body>
</html>
