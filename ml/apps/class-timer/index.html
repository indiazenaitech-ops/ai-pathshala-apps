      <button type="button" role="tab" id="tab-stopwatch" data-tab="stopwatch" aria-controls="panel-stopwatch" aria-selected="false" tabindex="-1"><span class="ct-tab-ico" aria-hidden="true">⏱️</span><span data-i18n="tab_stopwatch"></span></button>
      <button type="button" role="tab" id="tab-pomodoro" data-tab="pomodoro" aria-controls="panel-pomodoro" aria-selected="false" tabindex="-1"><span class="ct-tab-ico" aria-hidden="true">🍅</span><span data-i18n="tab_pomodoro"></span></button>
      <button type="button" role="tab" id="tab-signs" data-tab="signs" aria-controls="panel-signs" aria-selected="false" tabindex="-1"><span class="ct-tab-ico" aria-hidden="true">✋</span><span data-i18n="tab_signs"></span></button>
    </div>

    <!-- ============ COUNTDOWN ============ -->
    <section id="panel-countdown" role="tabpanel" aria-labelledby="tab-countdown">
      <div class="ct-layout">
        <div class="card ct-stage" id="cd-stage">
          <input type="text" class="ct-activity" id="cd-activity" maxlength="80" autocomplete="off" data-i18n-placeholder="activity_ph" data-i18n-aria-label="activity_label">
          <div class="ct-ring" id="cd-ring">
            <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle class="trk" cx="100" cy="100" r="90"/><circle class="bar" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg>
            <div class="ct-face">
              <div class="ct-digits" id="cd-digits" role="timer" aria-atomic="true">05:00</div>
              <div class="ct-status" id="cd-status" aria-live="polite"></div>
              <div class="ct-over" id="cd-over"></div>
            </div>
          </div>
          <div class="ct-controls">
            <button type="button" class="btn btn-primary btn-lg ct-main" id="cd-toggle"></button>
            <button type="button" class="btn btn-lg" id="cd-plus"><span data-ico="plus"></span><span data-i18n="add_minute"></span></button>
            <button type="button" class="btn btn-lg" id="cd-reset"><span data-ico="reset"></span><span data-i18n="reset"></span></button>
            <button type="button" class="btn btn-lg ct-fs" data-stage="cd-stage"></button>
          </div>
        </div>

        <div class="card stack ct-side no-print">
          <h2 data-i18n="quick_times"></h2>
          <div class="ct-presets" id="cd-presets"></div>
          <h2 data-i18n="custom_time"></h2>
          <form class="ct-custom" id="cd-custom" novalidate>
            <label class="field"><span data-i18n="hours"></span><input type="number" id="cd-h" min="0" max="23" step="1" inputmode="numeric" value="0"></label>
            <label class="field"><span data-i18n="minutes"></span><input type="number" id="cd-m" min="0" step="1" inputmode="numeric" value="5"></label>
            <label class="field"><span data-i18n="seconds"></span><input type="number" id="cd-s" min="0" step="1" inputmode="numeric" value="0"></label>
            <button type="submit" class="btn btn-accent" id="cd-set" data-i18n="set_time"></button>
          </form>
          <div class="ct-sound-row">
            <label class="field"><span data-i18n="sound"></span>
              <select class="ct-sound" id="cd-sound">
                <option value="bell" data-i18n="sound_bell"></option>
                <option value="beeps" data-i18n="sound_beeps"></option>
                <option value="gong" data-i18n="sound_gong"></option>
                <option value="off" data-i18n="sound_off"></option>
              </select>
            </label>
            <button type="button" class="btn ct-test"><span data-ico="sound"></span><span data-i18n="test_sound"></span></button>
          </div>
          <label class="check"><input type="checkbox" id="cd-warn"> <span data-i18n="warn_minute"></span></label>
          <p class="hint ct-keys" data-i18n-html="keys_cd"></p>
        </div>
      </div>
    </section>

    <!-- ============ STOPWATCH ============ -->
    <section id="panel-stopwatch" role="tabpanel" aria-labelledby="tab-stopwatch" hidden>
      <div class="ct-layout">
        <div class="card ct-stage" id="sw-stage">
          <div class="ct-ring" id="sw-ring">
            <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle class="trk" cx="100" cy="100" r="90"/><circle class="bar" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="565.49"/></svg>
            <div class="ct-face">
              <div class="ct-digits sw" id="sw-digits" role="timer" aria-atomic="true"><span id="sw-main">00:00</span><small id="sw-cs">.00</small></div>
              <div class="ct-status" id="sw-status" aria-live="polite"></div>
            </div>
          </div>
          <div class="sw-last" id="sw-last"></div>
          <div class="ct-controls">
            <button type="button" class="btn btn-primary btn-lg ct-main" id="sw-toggle"></button>
            <button type="button" class="btn btn-lg" id="sw-lap"><span data-ico="flag"></span><span data-i18n="lap"></span></button>
            <button type="button" class="btn btn-lg" id="sw-reset"><span data-ico="reset"></span><span data-i18n="reset"></span></button>
            <button type="button" class="btn btn-lg ct-fs" data-stage="sw-stage"></button>
          </div>
        </div>

        <div class="card stack ct-side">
          <h2 data-i18n="laps"></h2>
          <p class="hint" id="sw-empty" data-i18n="no_laps"></p>
          <div class="sw-summary" id="sw-summary" aria-live="polite"></div>
          <div class="sw-wrap" id="sw-wrap">
            <table class="table" id="sw-table">
              <thead><tr><th data-i18n="lap"></th><th class="num" data-i18n="lap_time"></th><th class="num" data-i18n="total_time"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="row no-print">
            <button type="button" class="btn" id="sw-csv"><span data-ico="download"></span><span data-i18n="download_csv"></span></button>
          </div>
          <p class="hint ct-keys no-print" data-i18n-html="keys_sw"></p>
        </div>
      </div>
    </section>

    <!-- ============ POMODORO ============ -->
    <section id="panel-pomodoro" role="tabpanel" aria-labelledby="tab-pomodoro" hidden>
      <div class="ct-layout">
        <div class="card ct-stage po-stage" id="po-stage">
          <div class="po-phase" id="po-phase" aria-live="polite"></div>
          <div class="ct-ring" id="po-ring">
            <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle class="trk" cx="100" cy="100" r="90"/><circle class="bar" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg>
            <div class="ct-face">
              <div class="ct-digits" id="po-digits" role="timer" aria-atomic="true">25:00</div>
              <div class="ct-status" id="po-status"></div>
            </div>
          </div>
          <div class="po-dots" id="po-dots" aria-hidden="true"></div>
          <div class="po-session" id="po-session"></div>
          <div class="ct-controls">
            <button type="button" class="btn btn-primary btn-lg ct-main" id="po-toggle"></button>
            <button type="button" class="btn btn-lg" id="po-skip"><span data-ico="skip"></span><span data-i18n="skip"></span></button>
            <button type="button" class="btn btn-lg" id="po-reset"><span data-ico="reset"></span><span data-i18n="reset"></span></button>
            <button type="button" class="btn btn-lg ct-fs" data-stage="po-stage"></button>
          </div>
        </div>

        <div class="card stack ct-side no-print">
          <p class="callout small mb0" data-i18n="po_what"></p>
          <h2 data-i18n="plans"></h2>
          <div class="po-plans" id="po-plans"></div>
          <h2 data-i18n="po_settings"></h2>
          <div class="po-fields">
            <label class="field"><span data-i18n="work_len"></span><input type="number" id="po-work" min="1" max="180" step="1" inputmode="numeric"></label>
            <label class="field"><span data-i18n="short_len"></span><input type="number" id="po-short" min="1" max="60" step="1" inputmode="numeric"></label>
            <label class="field"><span data-i18n="long_len"></span><input type="number" id="po-long" min="1" max="120" step="1" inputmode="numeric"></label>
            <label class="field"><span data-i18n="long_every"></span><input type="number" id="po-every" min="1" max="12" step="1" inputmode="numeric"></label>
          </div>
          <label class="check"><input type="checkbox" id="po-auto"> <span data-i18n="auto_next"></span></label>
          <div class="ct-sound-row">
            <label class="field"><span data-i18n="sound"></span>
              <select class="ct-sound" id="po-sound">
                <option value="bell" data-i18n="sound_bell"></option>
                <option value="beeps" data-i18n="sound_beeps"></option>
                <option value="gong" data-i18n="sound_gong"></option>
                <option value="off" data-i18n="sound_off"></option>
              </select>
            </label>
            <button type="button" class="btn ct-test"><span data-ico="sound"></span><span data-i18n="test_sound"></span></button>
          </div>
          <p class="po-stats" id="po-stats" aria-live="polite"></p>
          <p class="hint ct-keys" data-i18n-html="keys_cd"></p>
        </div>
      </div>
    </section>

    <!-- ============ WORK-MODE SIGNS ============ -->
    <section id="panel-signs" role="tabpanel" aria-labelledby="tab-signs" hidden>
      <div class="ct-layout">
        <div class="card ct-stage" id="sg-stage">
          <div class="sg-board" id="sg-board">
            <div class="sg-icon" id="sg-icon" aria-hidden="true"></div>
            <div class="sg-title" id="sg-title" aria-live="polite"></div>
            <p class="sg-desc" id="sg-desc"></p>
            <div class="sg-voice" id="sg-voice"><span class="sg-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sg-voice-txt"></span></div>
            <div class="sg-timer" id="sg-timer" hidden></div>
          </div>
          <div class="ct-controls">
            <button type="button" class="btn btn-lg ct-fs" data-stage="sg-stage"></button>
            <button type="button" class="btn btn-lg no-print" id="sg-print"><span data-ico="print"></span><span data-i18n="print_sign"></span></button>
          </div>
        </div>

        <div class="card stack ct-side no-print">
          <h2 data-i18n="choose_sign"></h2>
          <div class="sg-grid" id="sg-grid"></div>
          <div class="row">
            <button type="button" class="btn" id="sg-print-all"><span data-ico="print"></span><span data-i18n="print_all"></span></button>
          </div>
          <p class="hint ct-keys" data-i18n-html="keys_sg"></p>
        </div>
      </div>
    </section>

    <details class="card ct-help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>

    <div id="ct-print" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/class-timer/../../shared/edu.js"></script>
  <script src="../../../apps/class-timer/strings.js"></script>
  <script src="../../../apps/class-timer/app.js"></script>
</body>
</html>
