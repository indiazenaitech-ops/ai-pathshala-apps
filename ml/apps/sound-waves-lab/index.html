<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout warning swl-warn">
      <p>🎧 <span data-i18n="headphones_warn"></span></p>
      <p class="small">🔒 <span data-i18n="privacy"></span></p>
    </div>

    <div class="tabs swl-tabs" role="tablist" aria-label="Sound lab sections" data-i18n-aria-label="tabs_label">
      <button type="button" role="tab" id="tab-tone" data-tab="tone" aria-controls="pane-tone" aria-selected="true" data-i18n="tab_tone"></button>
      <button type="button" role="tab" id="tab-beats" data-tab="beats" aria-controls="pane-beats" aria-selected="false" data-i18n="tab_beats"></button>
      <button type="button" role="tab" id="tab-echo" data-tab="echo" aria-controls="pane-echo" aria-selected="false" data-i18n="tab_echo"></button>
      <button type="button" role="tab" id="tab-harm" data-tab="harm" aria-controls="pane-harm" aria-selected="false" data-i18n="tab_harm"></button>
      <button type="button" role="tab" id="tab-hear" data-tab="hear" aria-controls="pane-hear" aria-selected="false" data-i18n="tab_hear"></button>
      <button type="button" role="tab" id="tab-mic" data-tab="mic" aria-controls="pane-mic" aria-selected="false" data-i18n="tab_mic"></button>
      <button type="button" role="tab" id="tab-quiz" data-tab="quiz" aria-controls="pane-quiz" aria-selected="false" data-i18n="tab_quiz"></button>
    </div>

    <!-- ===================== Tone generator ===================== -->
    <section id="pane-tone" class="swl-pane" role="tabpanel" aria-labelledby="tab-tone">
      <div class="swl-lab">
        <div class="card" id="tone-ctrl">
          <h2 data-i18n="tone_title"></h2>
          <button type="button" class="btn btn-primary swl-play" id="tone-play" aria-pressed="false">▶ <span id="tone-play-txt"></span></button>
          <div class="swl-sl">
            <label class="lbl-t" for="freq-range" data-i18n="frequency"></label>
            <div class="swl-sl-row">
              <input type="range" id="freq-range" min="0" max="1000" step="1" value="440">
              <input type="number" class="swl-num" id="freq-num" min="20" max="20000" step="1" inputmode="numeric" aria-label="Frequency in hertz" data-i18n-aria-label="frequency">
              <span class="swl-unit no-i18n">Hz</span>
            </div>
          </div>
          <div class="swl-sl">
            <label class="lbl-t" for="amp-range" data-i18n="amplitude"></label>
            <div class="swl-sl-row two">
              <input type="range" id="amp-range" min="0" max="100" step="1" value="60">
              <span class="swl-val num" id="amp-val"></span>
            </div>
          </div>
          <div class="swl-sl">
            <span class="lbl-t" id="wave-lbl" data-i18n="waveform"></span>
            <div class="seg" id="wave-seg" role="group" aria-labelledby="wave-lbl">
              <button type="button" data-wave="sine" aria-pressed="true" data-i18n="wave_sine"></button>
              <button type="button" data-wave="square" aria-pressed="false" data-i18n="wave_square"></button>
              <button type="button" data-wave="triangle" aria-pressed="false" data-i18n="wave_triangle"></button>
              <button type="button" data-wave="sawtooth" aria-pressed="false" data-i18n="wave_saw"></button>
            </div>
          </div>
          <div class="swl-sl">
            <span class="lbl-t" data-i18n="quick_picks"></span>
            <div class="row" id="tone-presets">
              <button type="button" class="chip" data-f="100" data-i18n="preset_low"></button>
              <button type="button" class="chip" data-f="440" data-i18n="preset_a4"></button>
              <button type="button" class="chip" data-f="1000" data-i18n="preset_mid"></button>
              <button type="button" class="chip" data-f="4000" data-i18n="preset_high"></button>
            </div>
          </div>
          <div class="swl-sl">
            <label class="lbl-t" for="medium" data-i18n="medium"></label>
            <select id="medium" class="swl-num" style="text-align:start">
              <option value="343" data-i18n="medium_air"></option>
              <option value="1498" data-i18n="medium_water"></option>
              <option value="5960" data-i18n="medium_steel"></option>
            </select>
          </div>
          <div class="swl-stats" aria-live="polite">
            <div class="swl-stat"><span class="k" data-i18n="wavelength"></span><span class="v num" id="r-wavelength"></span></div>
            <div class="swl-stat"><span class="k" data-i18n="period"></span><span class="v num" id="r-period"></span></div>
            <div class="swl-stat"><span class="k" data-i18n="nearest_note"></span><span class="v num" id="r-note"></span></div>
          </div>
          <p class="small muted" style="margin:10px 0 0" data-i18n="pitch_hint"></p>
        </div>
        <div class="card swl-stage" id="tone-stage">
          <div class="swl-row-top">
            <span class="badge" id="tone-status"></span>
            <button type="button" class="btn btn-sm btn-ghost" id="tone-fs" data-i18n="fullscreen"></button>
          </div>
          <p class="cap"><b data-i18n="scope_title"></b><span class="muted small" id="scope-note"></span></p>
          <canvas id="cv-scope" width="800" height="300" role="img" aria-label="Oscilloscope" data-i18n-aria-label="scope_title"></canvas>
          <p class="cap"><b data-i18n="spectrum_title"></b><span class="muted small" data-i18n="spectrum_note"></span></p>
          <canvas id="cv-spec" width="800" height="220" role="img" aria-label="Spectrum" data-i18n-aria-label="spectrum_title"></canvas>
          <div class="callout" style="margin-top:12px"><p class="small" style="margin:0" data-i18n="wave_facts"></p></div>
        </div>
      </div>
    </section>

    <!-- ===================== Beats ===================== -->
    <section id="pane-beats" class="swl-pane" role="tabpanel" aria-labelledby="tab-beats" hidden>
      <div class="swl-lab">
        <div class="card">
          <h2 data-i18n="beats_title"></h2>
          <button type="button" class="btn btn-primary swl-play" id="beats-play" aria-pressed="false">▶ <span id="beats-play-txt"></span></button>
          <div class="swl-sl">
            <label class="lbl-t" for="b1-range" data-i18n="tone1"></label>
            <div class="swl-sl-row">
              <input type="range" id="b1-range" min="100" max="1000" step="1" value="440">
              <input type="number" class="swl-num" id="b1-num" min="20" max="5000" step="1" inputmode="numeric" aria-label="Tone 1" data-i18n-aria-label="tone1">
              <span class="swl-unit no-i18n">Hz</span>
            </div>
          </div>
          <div class="swl-sl">
            <label class="lbl-t" for="b2-range" data-i18n="tone2"></label>
            <div class="swl-sl-row">
              <input type="range" id="b2-range" min="100" max="1000" step="1" value="444">
              <input type="number" class="swl-num" id="b2-num" min="20" max="5000" step="1" inputmode="numeric" aria-label="Tone 2" data-i18n-aria-label="tone2">
              <span class="swl-unit no-i18n">Hz</span>
            </div>
          </div>
          <div class="swl-big" aria-live="polite">
            <span class="big-number num" id="beats-val"></span>
            <span data-i18n="beats_per_sec"></span>
          </div>
          <p class="small muted" style="margin:6px 0 0"><span class="no-i18n" dir="ltr">f<sub>beat</sub> = |f₁ − f₂|</span></p>
          <p class="small" id="beats-msg" style="margin:8px 0 0"></p>
          <p class="small muted" style="margin:10px 0 0" data-i18n="beats_hint"></p>
        </div>
        <div class="card swl-stage">
          <p class="cap"><b data-i18n="beats_canvas"></b><span class="muted small" data-i18n="beats_canvas_note"></span></p>
          <canvas id="cv-beats" width="800" height="320" role="img" aria-label="Beats" data-i18n-aria-label="beats_canvas"></canvas>
        </div>
      </div>
    </section>

    <!-- ===================== Echo ===================== -->
    <section id="pane-echo" class="swl-pane" role="tabpanel" aria-labelledby="tab-echo" hidden>
      <div class="swl-lab">
        <div class="card">
          <h2 data-i18n="echo_title"></h2>
          <div class="swl-sl">
            <label class="lbl-t" for="echo-range" data-i18n="distance"></label>
            <div class="swl-sl-row">
              <input type="range" id="echo-range" min="1" max="500" step="1" value="50">
              <input type="number" class="swl-num" id="echo-num" min="1" max="5000" step="1" inputmode="numeric" aria-label="Distance" data-i18n-aria-label="distance">
              <span class="swl-unit no-i18n">m</span>
            </div>
          </div>
          <div class="swl-big" aria-live="polite">
            <span class="big-number num" id="echo-time"></span>
            <span data-i18n="echo_after"></span>
          </div>
          <p class="small muted" style="margin:6px 0 0"><span class="no-i18n" dir="ltr">t = 2d / v,&nbsp; v = 343 m/s</span></p>
          <p class="small" id="echo-msg" style="margin:8px 0 0"></p>
          <button type="button" class="btn btn-accent swl-play" id="echo-clap" style="margin-top:12px">👏 <span data-i18n="clap"></span></button>
          <p class="small muted" style="margin:10px 0 0" data-i18n="echo_hint"></p>
        </div>
        <div class="card swl-stage">
          <p class="cap"><b data-i18n="echo_canvas"></b><span class="muted small" id="echo-slow"></span></p>
          <canvas id="cv-echo" width="800" height="300" role="img" aria-label="Echo" data-i18n-aria-label="echo_canvas"></canvas>
          <div class="callout accent" style="margin-top:12px"><p class="small" style="margin:0" data-i18n="echo_facts"></p></div>
        </div>
      </div>
    </section>

    <!-- ===================== Harmonics ===================== -->
    <section id="pane-harm" class="swl-pane" role="tabpanel" aria-labelledby="tab-harm" hidden>
      <div class="swl-lab">
        <div class="card">
          <h2 data-i18n="harm_title"></h2>
          <span class="lbl-t" id="harm-type-lbl" data-i18n="harm_type"></span>
          <div class="seg" id="harm-seg" role="group" aria-labelledby="harm-type-lbl">
            <button type="button" data-type="string" aria-pressed="true" data-i18n="type_string"></button>
            <button type="button" data-type="open" aria-pressed="false" data-i18n="type_open"></button>
            <button type="button" data-type="closed" aria-pressed="false" data-i18n="type_closed"></button>
          </div>
          <div class="swl-sl">
            <label class="lbl-t" for="f0-range" data-i18n="fundamental"></label>
            <div class="swl-sl-row">
              <input type="range" id="f0-range" min="60" max="600" step="1" value="220">
              <input type="number" class="swl-num" id="f0-num" min="20" max="2000" step="1" inputmode="numeric" aria-label="Fundamental" data-i18n-aria-label="fundamental">
              <span class="swl-unit no-i18n">Hz</span>
            </div>
          </div>
          <p class="small muted" id="harm-hint" style="margin:10px 0 0"></p>
          <span class="lbl-t" style="margin-top:12px" data-i18n="harm_pick"></span>
          <div class="swl-harm" id="harm-list" role="group" aria-label="Harmonics" data-i18n-aria-label="harm_pick"></div>
          <button type="button" class="btn btn-danger" id="harm-stop" style="margin-top:10px" data-i18n="stop"></button>
        </div>
        <div class="card swl-stage">
          <p class="cap"><b data-i18n="harm_canvas"></b><span class="muted small" id="harm-canvas-note"></span></p>
          <canvas id="cv-harm" width="800" height="300" role="img" aria-label="Standing wave" data-i18n-aria-label="harm_canvas"></canvas>
          <div class="callout" style="margin-top:12px"><p class="small" style="margin:0" data-i18n="harm_facts"></p></div>
        </div>
      </div>
    </section>

    <!-- ===================== Hearing range ===================== -->
    <section id="pane-hear" class="swl-pane" role="tabpanel" aria-labelledby="tab-hear" hidden>
      <div class="swl-lab">
        <div class="card">
          <h2 data-i18n="hear_title"></h2>
          <p class="small" data-i18n="hear_intro"></p>
          <div class="callout warning" style="margin:10px 0"><p class="small" style="margin:0" data-i18n="hear_safety"></p></div>
          <div id="hear-idle">
            <button type="button" class="btn btn-primary swl-play" id="hear-start">▶ <span data-i18n="hear_start"></span></button>
          </div>
          <div id="hear-run" hidden>
            <p class="muted small" id="hear-step" style="margin:0"></p>
            <p class="swl-hear-now num" id="hear-now" aria-live="polite"></p>
            <div class="swl-hear-btns">
              <button type="button" class="btn btn-primary" id="hear-yes">✅ <span data-i18n="hear_yes"></span></button>
              <button type="button" class="btn" id="hear-no">🙉 <span data-i18n="hear_no"></span></button>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="hear-stop" style="margin-top:10px" data-i18n="stop"></button>
          </div>
          <div id="hear-done" hidden aria-live="polite">
            <p class="swl-hear-now" id="hear-result"></p>
            <div class="swl-scale" id="hear-scale"><div class="fill" id="hear-fill"></div></div>
            <div class="swl-scale-lbl no-i18n"><span>20 Hz</span><span>200</span><span>2 kHz</span><span>20 kHz</span></div>
            <button type="button" class="btn" id="hear-again" style="margin-top:12px" data-i18n="try_again"></button>
          </div>
          <p class="small muted" style="margin:12px 0 0" data-i18n="hear_note"></p>
        </div>
        <div class="card">
          <h2 data-i18n="hear_facts_title"></h2>
          <ul class="small" style="margin:0; padding-inline-start:20px">
            <li data-i18n="hear_fact1"></li>
            <li data-i18n="hear_fact2"></li>
            <li data-i18n="hear_fact3"></li>
            <li data-i18n="hear_fact4"></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ===================== Microphone ===================== -->
    <section id="pane-mic" class="swl-pane" role="tabpanel" aria-labelledby="tab-mic" hidden>
      <div class="swl-lab">
        <div class="card">
          <h2 data-i18n="mic_title"></h2>
          <p class="small" data-i18n="mic_intro"></p>
          <button type="button" class="btn btn-primary swl-play" id="mic-btn" aria-pressed="false">🎤 <span id="mic-txt"></span></button>
          <p class="small" id="mic-msg" style="margin:8px 0 0" aria-live="polite"></p>
          <div class="swl-stats" aria-live="polite">
            <div class="swl-stat"><span class="k" data-i18n="mic_peak"></span><span class="v num" id="mic-peak">—</span></div>
            <div class="swl-stat"><span class="k" data-i18n="mic_level"></span><span class="v num" id="mic-level">—</span></div>
            <div class="swl-stat"><span class="k" data-i18n="nearest_note"></span><span class="v num" id="mic-note">—</span></div>
          </div>
          <p class="small muted" style="margin:10px 0 0" data-i18n="mic_hint"></p>
          <p class="small muted" style="margin:6px 0 0">🔒 <span data-i18n="privacy"></span></p>
        </div>
        <div class="card swl-stage" id="mic-stage">
          <p class="cap"><b data-i18n="scope_title"></b><span class="badge" id="mic-status"></span></p>
          <canvas id="cv-mic-scope" width="800" height="260" role="img" aria-label="Oscilloscope" data-i18n-aria-label="scope_title"></canvas>
          <p class="cap"><b data-i18n="spectrum_title"></b></p>
          <canvas id="cv-mic-spec" width="800" height="220" role="img" aria-label="Spectrum" data-i18n-aria-label="spectrum_title"></canvas>
        </div>
      </div>
    </section>

    <!-- ===================== Quiz ===================== -->
    <section id="pane-quiz" class="swl-pane" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="card" id="quiz-box" style="max-width:760px">
        <div class="swl-row-top">
          <h2 style="margin:0" data-i18n="quiz_title"></h2>
          <span class="badge primary" id="quiz-best"></span>
        </div>
        <div id="quiz-run">
          <p class="muted small" id="quiz-prog" style="margin:0"></p>
          <p class="swl-q" id="quiz-q"></p>
          <div class="swl-opts" id="quiz-opts" role="group"></div>
          <p class="small" id="quiz-why" style="margin:10px 0 0" aria-live="polite"></p>
          <button type="button" class="btn btn-primary" id="quiz-next" style="margin-top:12px" hidden data-i18n="next"></button>
        </div>
        <div id="quiz-done" hidden aria-live="polite">
          <p class="swl-hear-now" id="quiz-score"></p>
          <p class="small" id="quiz-remark"></p>
          <button type="button" class="btn btn-primary" id="quiz-restart" data-i18n="try_again"></button>
        </div>
      </div>
    </section>

    <details class="card swl-help" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>

    <div class="swl-foot">
      <span class="tiny muted" data-i18n="saved_local"></span>
      <button type="button" class="btn btn-sm btn-ghost" id="reset-all" data-i18n="reset"></button>
    </div>
  </main>
  <script src="../../../apps/sound-waves-lab/../../shared/edu.js"></script>
  <script src="../../../apps/sound-waves-lab/strings.js"></script>
  <script src="../../../apps/sound-waves-lab/content.js"></script>
  <script src="../../../apps/sound-waves-lab/app.js"></script>
</body>
</html>
