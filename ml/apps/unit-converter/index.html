<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs uc-tabs" role="tablist">
      <button type="button" role="tab" id="tab-convert" aria-controls="pane-convert" aria-selected="true" data-i18n="tab_convert"></button>
      <button type="button" role="tab" id="tab-numbers" aria-controls="pane-numbers" aria-selected="false" data-i18n="tab_numbers"></button>
      <button type="button" role="tab" id="tab-practice" aria-controls="pane-practice" aria-selected="false" data-i18n="tab_practice"></button>
    </div>

    <!-- ===================== converter ===================== -->
    <section id="pane-convert" role="tabpanel" aria-labelledby="tab-convert">
      <div class="card uc-cats-card">
        <h2 class="uc-h" id="cats-h" data-i18n="choose_quantity"></h2>
        <div class="uc-cats" id="cats" role="group" aria-labelledby="cats-h"></div>
      </div>

      <div class="uc-main">
        <div class="uc-col">
          <section class="card uc-conv" aria-labelledby="cat-title">
            <h2 id="cat-title"></h2>
            <div class="uc-io">
              <div class="uc-side">
                <label for="in-a" data-i18n="from_label"></label>
                <div class="uc-inrow">
                  <input type="text" id="in-a" inputmode="decimal" autocomplete="off" spellcheck="false">
                  <button type="button" class="btn uc-pm" id="pm-a" data-i18n-title="plus_minus" data-i18n-aria-label="plus_minus" hidden>±</button>
                </div>
                <select id="unit-a" data-i18n-aria-label="from_unit"></select>
              </div>
              <button type="button" class="btn uc-swap" id="swap" data-i18n-title="swap" data-i18n-aria-label="swap">⇄</button>
              <div class="uc-side">
                <label for="in-b" data-i18n="to_label"></label>
                <div class="uc-inrow">
                  <input type="text" id="in-b" inputmode="decimal" autocomplete="off" spellcheck="false">
                  <button type="button" class="btn uc-pm" id="pm-b" data-i18n-title="plus_minus" data-i18n-aria-label="plus_minus" hidden>±</button>
                </div>
                <select id="unit-b" data-i18n-aria-label="to_unit"></select>
              </div>
            </div>
            <p class="uc-err" id="err" role="alert"></p>
            <div class="uc-result" id="result" aria-live="polite"></div>
            <div class="uc-factor">
              <h3 data-i18n="factor_title"></h3>
              <div id="factor"></div>
            </div>
            <div class="row uc-actions">
              <button type="button" class="btn" id="copy-res" data-i18n="copy"></button>
              <button type="button" class="btn" id="print-btn" data-i18n="print"></button>
              <button type="button" class="btn" id="fs-btn" data-i18n="fullscreen"></button>
              <button type="button" class="btn btn-danger" id="reset-btn" data-i18n="reset"></button>
            </div>
          </section>

          <section class="card uc-try">
            <h2 class="uc-h uc-try-title" data-i18n="try_title"></h2>
            <div class="uc-ex" id="examples"></div>
            <div class="callout">
              <h3 class="uc-h mb0" data-i18n="did_you_know"></h3>
              <p class="mb0" id="note"></p>
            </div>
          </section>
        </div>

        <div class="uc-col">
          <section class="card uc-stepcard" aria-labelledby="steps-h">
            <h2 class="uc-h" id="steps-h" data-i18n="steps_title"></h2>
            <ol class="uc-steps" id="steps" aria-live="polite"></ol>
            <p class="muted uc-hint" id="hint"></p>
            <div class="uc-callouts uc-gap" id="special"></div>
          </section>

          <section class="card uc-allcard">
            <h2 class="uc-h" data-i18n="all_units_title"></h2>
            <p class="muted small no-print" data-i18n="all_units_hint"></p>
            <div class="scroll-x">
              <table class="table uc-all" id="all-units">
                <thead><tr><th data-i18n="unit_col"></th><th data-i18n="value_col"></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </section>

    <!-- ===================== numbers ===================== -->
    <section id="pane-numbers" role="tabpanel" aria-labelledby="tab-numbers" hidden>
      <div class="card uc-num-ctrl">
        <div class="uc-num-in">
          <div class="field grow">
            <label for="num-in" data-i18n="num_label"></label>
            <input type="text" id="num-in" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="24" data-i18n-placeholder="num_placeholder">
          </div>
          <div class="field">
            <label for="num-digits" data-i18n="digits_label"></label>
            <select id="num-digits"></select>
          </div>
          <button type="button" class="btn btn-primary" id="num-rand" data-i18n="random_btn"></button>
        </div>
        <p class="uc-err" id="num-err" role="alert"></p>
        <div class="row uc-gap">
          <span class="muted small" data-i18n="num_examples"></span>
          <div class="row" id="num-examples"></div>
        </div>
        <div class="row uc-gap">
          <label class="check"><input type="checkbox" id="quiz"> <span data-i18n="quiz_mode"></span></label>
          <button type="button" class="btn btn-sm" id="num-print" data-i18n="print"></button>
        </div>
      </div>

      <div id="num-out">
        <p class="callout warning uc-gap" id="quiz-note" hidden data-i18n="quiz_hidden"></p>
        <div class="grid-2 uc-gap">
          <section class="card uc-sys">
            <h2 data-i18n="indian_title"></h2>
            <div class="uc-ans">
              <div class="uc-big uc-ltr" id="in-group"></div>
              <p class="muted small mb0" data-i18n="rule_in"></p>
              <h3 data-i18n="short_title"></h3>
              <p class="uc-words" id="in-short"></p>
              <h3 data-i18n="words_en"></h3>
              <div class="uc-wrow"><p class="uc-words no-i18n" id="in-en" lang="en"></p><button type="button" class="btn btn-sm say" data-say="in-en" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button></div>
              <h3 data-i18n="words_hi"></h3>
              <div class="uc-wrow"><p class="uc-words hi no-i18n" id="in-hi" lang="hi"></p><button type="button" class="btn btn-sm say" data-say="in-hi" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button></div>
            </div>
          </section>
          <section class="card uc-sys intl">
            <h2 data-i18n="intl_title"></h2>
            <div class="uc-ans">
              <div class="uc-big uc-ltr" id="intl-group"></div>
              <p class="muted small mb0" data-i18n="rule_intl"></p>
              <h3 data-i18n="short_title"></h3>
              <p class="uc-words" id="intl-short"></p>
              <h3 data-i18n="words_en"></h3>
              <div class="uc-wrow"><p class="uc-words no-i18n" id="intl-en" lang="en"></p><button type="button" class="btn btn-sm say" data-say="intl-en" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button></div>
            </div>
          </section>
        </div>
        <button type="button" class="btn btn-accent btn-lg uc-reveal" id="reveal" hidden data-i18n="show_answer"></button>

        <section class="card uc-gap">
          <h2 class="uc-h" data-i18n="pv_title"></h2>
          <p class="muted small" id="digits-count"></p>
          <div class="uc-ans">
            <p class="uc-pv-cap" data-i18n="indian_title"></p>
            <div class="scroll-x uc-pv-wrap"><table class="table uc-pv" id="pv-in"></table></div>
            <p class="uc-pv-cap" data-i18n="intl_title"></p>
            <div class="scroll-x uc-pv-wrap"><table class="table uc-pv" id="pv-intl"></table></div>
            <p class="callout small uc-gap" id="pv-big" hidden data-i18n="pv_big"></p>
            <h3 class="uc-h uc-gap" data-i18n="expanded_title"></h3>
            <p class="uc-exp math" id="expanded"></p>
            <p class="uc-exp math muted" id="expanded-pow"></p>
          </div>
        </section>

        <section class="card uc-gap">
          <h2 class="uc-h" data-i18n="compare_title"></h2>
          <p class="muted small no-print" data-i18n="compare_hint"></p>
          <div class="scroll-x">
            <table class="table uc-cmp" id="cmp">
              <thead><tr><th data-i18n="col_indian"></th><th data-i18n="col_intl"></th><th data-i18n="col_zeros"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <!-- ===================== practice ===================== -->
    <section id="pane-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="card uc-pr-ctrl no-print">
        <div class="uc-pr-opts">
          <div class="field">
            <label for="pr-topic" data-i18n="pr_topic"></label>
            <select id="pr-topic"></select>
          </div>
          <div class="field">
            <span class="uc-lbl" id="pr-level-lbl" data-i18n="pr_level"></span>
            <div class="seg uc-seg" role="group" aria-labelledby="pr-level-lbl">
              <button type="button" id="pr-easy" data-level="easy" aria-pressed="true" data-i18n="pr_easy"></button>
              <button type="button" id="pr-hard" data-level="hard" aria-pressed="false" data-i18n="pr_hard"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="uc-pr-grid uc-gap">
        <section class="card uc-pr-quiz no-print" aria-labelledby="pr-qno">
          <div class="row spread">
            <h2 class="uc-h mb0" id="pr-qno"></h2>
            <span class="badge primary uc-score" id="pr-score"></span>
          </div>
          <p class="muted small uc-pr-intro" data-i18n="pr_intro"></p>
          <div class="uc-pr-q" id="pr-q"></div>
          <form id="pr-form" class="uc-pr-form" autocomplete="off">
            <label for="pr-ans" id="pr-ans-lbl"></label>
            <div class="uc-inrow">
              <input type="text" id="pr-ans" inputmode="decimal" autocomplete="off" spellcheck="false">
              <button type="button" class="btn uc-pm" id="pr-pm" data-i18n-title="plus_minus" data-i18n-aria-label="plus_minus" hidden>±</button>
              <button type="submit" class="btn btn-primary btn-lg" id="pr-check" data-i18n="pr_check"></button>
            </div>
          </form>
          <div class="uc-pr-fb" id="pr-fb" aria-live="polite"></div>
          <ol class="uc-steps uc-gap" id="pr-steps" hidden></ol>
          <div class="row uc-actions">
            <button type="button" class="btn btn-accent" id="pr-next" data-i18n="pr_next"></button>
            <button type="button" class="btn btn-ghost" id="pr-reset" data-i18n="pr_reset_score"></button>
          </div>
          <p class="muted small mb0 uc-gap" id="pr-streak"></p>
        </section>

        <section class="card uc-ws" id="ws" aria-labelledby="ws-h">
          <h2 class="uc-h" id="ws-h" data-i18n="ws_title"></h2>
          <p class="muted small no-print" data-i18n="ws_hint"></p>
          <p class="print-only uc-ws-ptitle" data-i18n="app_title"></p>
          <p class="uc-ws-sub" id="ws-sub"></p>
          <div class="print-only uc-ws-name">
            <span><span data-i18n="ws_name"></span>: ____________________</span>
            <span><span data-i18n="ws_class"></span>: ________</span>
            <span><span data-i18n="ws_date"></span>: ____________</span>
          </div>
          <ol class="uc-ws-list" id="ws-list"></ol>
          <div class="row no-print uc-gap">
            <button type="button" class="btn" id="ws-new" data-i18n="ws_new"></button>
            <label class="check"><input type="checkbox" id="ws-show"> <span data-i18n="ws_show"></span></label>
            <button type="button" class="btn btn-primary" id="ws-print" data-i18n="print"></button>
          </div>
        </section>
      </div>
    </section>

    <details class="card uc-gap">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/unit-converter/../../shared/edu.js"></script>
  <script src="../../../apps/unit-converter/strings.js"></script>
  <script src="../../../apps/unit-converter/units.js"></script>
  <script src="../../../apps/unit-converter/numwords.js"></script>
  <script src="../../../apps/unit-converter/app.js"></script>
</body>
</html>
