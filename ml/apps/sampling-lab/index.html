<body>
  <main id="app">
    <p class="edu-intro sl-hide-present" data-i18n="intro"></p>

    <section class="card" aria-labelledby="set-h">
      <h2 id="set-h" class="sl-hide-present" data-i18n="set_h"></h2>
      <div class="sl-set">
        <div>
          <span class="sl-lbl" id="pop-lbl" data-i18n="pop_label"></span>
          <div class="sl-pops" role="group" aria-labelledby="pop-lbl">
            <button type="button" id="pop-heights" data-pop="heights"><span class="ic" aria-hidden="true">📏</span><span data-i18n="pop_heights"></span></button>
            <button type="button" id="pop-income" data-pop="income"><span class="ic" aria-hidden="true">💰</span><span data-i18n="pop_income"></span></button>
            <button type="button" id="pop-dice" data-pop="dice"><span class="ic" aria-hidden="true">🎲</span><span data-i18n="pop_dice"></span></button>
          </div>
          <p class="muted small" id="pop-note" style="margin:6px 0 0"></p>
        </div>
        <div>
          <label class="sl-lbl" for="n-range" data-i18n="n_label"></label>
          <div class="sl-n">
            <input type="range" id="n-range" min="1" max="200" step="1">
            <output id="n-out" class="sl-num" for="n-range"></output>
          </div>
          <div class="sl-chips" role="group" data-i18n-aria-label="n_label">
            <button class="chip sl-num" type="button" data-n="1">1</button>
            <button class="chip sl-num" type="button" data-n="5">5</button>
            <button class="chip sl-num" type="button" data-n="30">30</button>
            <button class="chip sl-num" type="button" data-n="100">100</button>
            <button class="chip sl-num" type="button" data-n="200">200</button>
          </div>
        </div>
        <div>
          <label class="sl-lbl" for="seed" data-i18n="seed_label"></label>
          <div class="sl-seed">
            <input id="seed" type="text" inputmode="numeric" class="sl-num" autocomplete="off">
            <button class="btn btn-sm" type="button" id="new-seed" data-i18n="new_seed"></button>
          </div>
          <p class="muted small" style="margin:6px 0 0" data-i18n="seed_note"></p>
          <div class="row" style="margin-top:10px">
            <button class="btn btn-sm" type="button" id="present" data-i18n="projector"></button>
            <button class="btn btn-sm btn-danger" type="button" id="reset" data-i18n="reset"></button>
          </div>
        </div>
      </div>
    </section>

    <div class="tabs sl-tabs" role="tablist" data-i18n-aria-label="tabs_label">
      <button role="tab" type="button" id="tab-clt" aria-controls="p-clt" data-tab="clt" data-i18n="tab_clt"></button>
      <button role="tab" type="button" id="tab-ci" aria-controls="p-ci" data-tab="ci" data-i18n="tab_ci"></button>
      <button role="tab" type="button" id="tab-bias" aria-controls="p-bias" data-tab="bias" data-i18n="tab_bias"></button>
      <button role="tab" type="button" id="tab-mm" aria-controls="p-mm" data-tab="mm" data-i18n="tab_mm"></button>
      <button role="tab" type="button" id="tab-quiz" aria-controls="p-quiz" data-tab="quiz" data-i18n="tab_quiz"></button>
    </div>

    <!-- 1. samples and the central limit theorem -->
    <section class="card sl-panel" id="p-clt" role="tabpanel" aria-labelledby="tab-clt">
      <p class="muted sl-hide-present" data-i18n="clt_intro"></p>
      <div class="sl-tiles" aria-live="polite">
        <div class="sl-tile mu"><span class="k" data-i18n="t_mu"></span><span class="v" id="v-mu"></span></div>
        <div class="sl-tile"><span class="k" data-i18n="t_sigma"></span><span class="v" id="v-sigma"></span></div>
        <div class="sl-tile xb"><span class="k" data-i18n="t_xbar"></span><span class="v" id="v-xbar"></span></div>
        <div class="sl-tile"><span class="k" data-i18n="t_count"></span><span class="v sl-num" id="v-count"></span></div>
        <div class="sl-tile"><span class="k" data-i18n="t_meanmeans"></span><span class="v" id="v-mm"></span></div>
        <div class="sl-tile"><span class="k" data-i18n="t_sdmeans"></span><span class="v" id="v-sdm"></span></div>
        <div class="sl-tile hl"><span class="k" data-i18n="t_se"></span><span class="v" id="v-se"></span></div>
      </div>
      <div class="sl-btns">
        <button class="btn btn-primary" type="button" id="take1" data-i18n="take_1"></button>
        <button class="btn btn-accent" type="button" id="take100" data-i18n="take_100"></button>
        <button class="btn" type="button" id="take1000" data-i18n="take_1000"></button>
        <button class="btn btn-ghost" type="button" id="clt-clear" data-i18n="clear"></button>
        <label class="check"><input type="checkbox" id="bell" checked> <span data-i18n="show_bell"></span></label>
      </div>
      <div>
        <div class="sl-cap"><h3 data-i18n="pop_chart_h"></h3>
          <div class="sl-legend"><span><i style="--sw: var(--c1)"></i><span data-i18n="leg_mu"></span></span><span><i class="dot" style="--sw: var(--c2)"></i><span data-i18n="leg_sample"></span></span></div></div>
        <div class="stage sl-stage"><canvas id="c-pop" role="img" data-i18n-aria-label="pop_chart_h"></canvas></div>
      </div>
      <div>
        <div class="sl-cap"><h3 data-i18n="dist_chart_h"></h3>
          <div class="sl-legend"><span><i style="--sw: var(--c2)"></i><span data-i18n="leg_means"></span></span><span><i style="--sw: var(--c3)"></i><span data-i18n="leg_bell"></span></span></div></div>
        <div class="stage sl-stage"><canvas id="c-dist" role="img" data-i18n-aria-label="dist_chart_h"></canvas></div>
      </div>
      <p class="callout" id="clt-hint" aria-live="polite"></p>
    </section>

    <!-- 2. confidence intervals -->
    <section class="card sl-panel" id="p-ci" role="tabpanel" aria-labelledby="tab-ci" hidden>
      <p class="muted sl-hide-present" data-i18n="ci_intro"></p>
      <div class="sl-btns">
        <span class="sl-lbl" id="conf-lbl" style="margin:0" data-i18n="conf_label"></span>
        <div class="seg" role="group" aria-labelledby="conf-lbl">
          <button type="button" id="conf-90" class="sl-num">90%</button>
          <button type="button" id="conf-95" class="sl-num">95%</button>
          <button type="button" id="conf-99" class="sl-num">99%</button>
        </div>
      </div>
      <div class="sl-btns">
        <button class="btn btn-primary" type="button" id="ci1" data-i18n="ci_draw1"></button>
        <button class="btn btn-accent" type="button" id="ci100" data-i18n="ci_draw100"></button>
        <button class="btn btn-ghost" type="button" id="ci-clear" data-i18n="clear"></button>
      </div>
      <p class="callout warning sl-msg" id="ci-msg"></p>
      <p class="sl-big" id="ci-count" aria-live="polite"></p>
      <div>
        <div class="sl-legend" style="margin-bottom:6px"><span><i style="--sw: var(--c1)"></i><span data-i18n="leg_mu"></span></span><span><i style="--sw: var(--success)"></i><span data-i18n="leg_hit"></span></span><span><i style="--sw: var(--danger)"></i><span data-i18n="leg_miss"></span></span></div>
        <div class="stage sl-stage tall"><canvas id="c-ci" role="img" data-i18n-aria-label="ci_chart_aria"></canvas></div>
      </div>
      <p class="muted" id="ci-formula"></p>
    </section>

    <!-- 3. sampling bias -->
    <section class="card sl-panel" id="p-bias" role="tabpanel" aria-labelledby="tab-bias" hidden>
      <p class="muted sl-hide-present" data-i18n="bias_intro"></p>
      <div class="sl-btns">
        <span class="sl-lbl" id="bn-lbl" style="margin:0" data-i18n="bias_n_label"></span>
        <div class="seg" role="group" aria-labelledby="bn-lbl">
          <button type="button" id="bn-20" class="sl-num">20</button>
          <button type="button" id="bn-100" class="sl-num">100</button>
          <button type="button" id="bn-500" class="sl-num">500</button>
        </div>
        <button class="btn btn-primary" type="button" id="bias-run" data-i18n="bias_run"></button>
      </div>
      <div class="scroll-x">
        <table class="table sl-bias-tbl" aria-live="polite">
          <thead><tr><th data-i18n="bias_col_method"></th><th class="v" data-i18n="bias_col_avg"></th><th class="v" data-i18n="bias_col_err"></th></tr></thead>
          <tbody id="bias-body"></tbody>
        </table>
      </div>
      <div class="stage sl-stage"><canvas id="c-bias" role="img" data-i18n-aria-label="bias_chart_aria"></canvas></div>
      <p class="callout" id="bias-note"></p>
    </section>

    <!-- 4. mean vs median -->
    <section class="card sl-panel" id="p-mm" role="tabpanel" aria-labelledby="tab-mm" hidden>
      <p class="muted sl-hide-present" data-i18n="mm_intro"></p>
      <label class="field"><span data-i18n="mm_list_label"></span>
        <textarea id="mm-list" class="no-i18n sl-num" spellcheck="false"></textarea></label>
      <p class="callout danger sl-msg" id="mm-msg"></p>
      <div class="sl-btns">
        <button class="btn btn-accent" type="button" id="mm-rich" aria-pressed="false"></button>
        <button class="btn btn-ghost" type="button" id="mm-sample" data-i18n="mm_sample"></button>
      </div>
      <div class="sl-tiles" aria-live="polite">
        <div class="sl-tile"><span class="k" data-i18n="mm_mean_before"></span><span class="v sl-num" id="mm-m0"></span></div>
        <div class="sl-tile"><span class="k" data-i18n="mm_median_before"></span><span class="v sl-num" id="mm-d0"></span></div>

      <div class="stage sl-stage"><canvas id="c-mm" role="img" data-i18n-aria-label="mm_chart_aria"></canvas></div>
