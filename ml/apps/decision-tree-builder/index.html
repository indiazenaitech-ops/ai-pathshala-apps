  <style>
    .topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }

    @media (max-width: 560px) { .tabs button { flex: 1 1 0; white-space: normal; padding: 8px 6px; font-size: .9rem; line-height: 1.25; } }
    .h-sm { font-size: 1.05rem; margin-bottom: 8px; }

    /* ---------- build tab layout ---------- */
    .lab { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1200px) {
      .lab { grid-template-columns: minmax(0, 1fr) 320px; }

      .builder { padding: 12px; }
      .tree-scroll { min-height: 420px; }
    }
    .below { margin-top: 16px; }
    .b-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .target { font-size: 1.2rem; margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .toolbar .push { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; }
    .mode-seg button { min-height: 42px; font-size: .98rem; }
    .depth-seg button { min-width: 42px; min-height: 40px; }
    .ctl { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ctl > span { font-weight: 700; font-size: .9rem; color: var(--muted); }
    .walk { min-height: 1.7em; margin: 6px 0 4px; padding: 6px 0; font-weight: 700; font-size: 1rem; background: var(--surface); }
    /* sticky only while an example walks down the tree (a long tip must not cover the tree on phones) */
    .walk.live { position: sticky; top: var(--hdr, 60px); z-index: 6; }
    .edu-fullscreen-on .walk.live { top: 0; }
    .ins-card, .tree-scroll { scroll-margin-top: calc(var(--hdr, 60px) + 10px); }
    .walk.ok { color: var(--success); } .walk.bad { color: var(--danger); }

    /* ---------- the tree ---------- */
    .tree-scroll {
      border: 1px dashed var(--border); border-radius: var(--radius-sm); min-height: 180px;
      background-color: var(--surface-2);
      background-image: radial-gradient(color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1px);
      background-size: 18px 18px; overscroll-behavior-x: contain;
    }
    .tree-canvas { position: relative; }
    /* Positions are physical pixels computed in JS (mirrored for RTL), so these anchors stay physical. */
    .tree-edges { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
    .tree-edges path { fill: none; stroke: var(--muted); stroke-width: 2.2; opacity: .55; }
    .tree-edges path.onpath { stroke: var(--accent); stroke-width: 5; opacity: 1; }
    .tnode {
      position: absolute; top: 0; left: 0; display: flex; flex-direction: column; gap: 6px;
      padding: 8px 9px 7px; text-align: start; background: var(--surface); color: var(--text);
      border: 2px solid var(--border); border-top: 6px solid var(--k, var(--border)); border-radius: 12px;
      font: inherit; font-size: .84rem; line-height: 1.3; cursor: pointer; box-shadow: var(--shadow); align-items: stretch;
      transition: box-shadow .15s, border-color .15s, background .15s;
    }
    .tnode:hover { border-color: var(--primary); }
    .tnode.split { border-top-color: var(--primary); background: color-mix(in srgb, var(--primary-soft) 70%, var(--surface)); }
    .tnode.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
    .tnode.onpath { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow); }
    .tnode.hit-ok { box-shadow: 0 0 0 6px color-mix(in srgb, var(--success) 60%, transparent); }
    .tnode.hit-bad { box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 60%, transparent); }
    .tnode.new { animation: dt-pop .35s ease-out; }
    @keyframes dt-pop { from { opacity: 0; } to { opacity: 1; } }
    .tn-q { font-weight: 800; font-size: .92rem; }
    .tn-q::before { content: "❓ "; }

    .ichip {
      display: inline-flex; align-items: center; gap: 1px; font-size: 1.02rem; line-height: 1; padding: 3px;
      border-radius: 7px; background: color-mix(in srgb, var(--k) 24%, transparent);
    }
    .ichip b { font-size: .7rem; font-weight: 800; padding-inline-end: 1px; }
    .tn-more { font-size: .75rem; font-weight: 700; color: var(--muted); align-self: center; }
    .ans {
      display: inline-flex; align-items: center; gap: 6px; font-weight: 800; padding: 2px 9px 2px 6px; border-radius: 12px; line-height: 1.25;
      background: color-mix(in srgb, var(--k) 20%, var(--surface)); border: 1.5px solid var(--k); color: var(--text); width: fit-content; max-width: 100%;
    }
    .ans::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--k); flex: none; }
    .tie { font-weight: 600; color: var(--muted); font-size: .78rem; }
    .cbar { display: flex; width: 100%; flex: none; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-3); }
    .cbar i { display: block; height: 100%; }
    .cbar.big { height: 14px; }
    .tn-meta { display: flex; justify-content: space-between; gap: 2px 6px; flex-wrap: wrap; color: var(--muted); font-size: .76rem; font-weight: 600; }
    .elabel {
      position: absolute; top: 0; left: 0; padding: 1px 9px; border-radius: 99px; background: var(--surface);
      border: 1.5px solid var(--border); font-weight: 800; font-size: .8rem; white-space: nowrap; max-width: 150px;
      overflow: hidden; text-overflow: ellipsis; pointer-events: none; color: var(--text);
    }
    .elabel.onpath { border-color: var(--accent); background: var(--accent-soft); }
    .token {
      position: absolute; top: 0; left: 0; z-index: 5; font-size: 2rem; line-height: 1; pointer-events: none;
      transition: transform .45s ease; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
    }
    .edu-fullscreen-on .tnode { font-size: .95rem; }
    .tree-canvas.narrow .tnode { font-size: .8rem; padding: 7px 7px 6px; }
    .tree-canvas.narrow .tn-q { font-size: .86rem; }

    /* stats under the tree */
    .statline { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; align-items: flex-end; }
    .stat { display: flex; flex-direction: column; min-width: 0; }

    .warn-line { margin-top: 10px; }

    .crumbs { color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .mix { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

    .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
    .icard {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 9px; font-size: .86rem; font-weight: 600;
      background: color-mix(in srgb, var(--k) 14%, var(--surface)); border-inline-start: 4px solid var(--k); min-width: 0;
    }
    .icard .em { font-size: 1.25rem; line-height: 1; flex: none; }
    .icard .nm { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }

    .opt {
      display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: start; width: 100%;

      color: var(--text); font: inherit; cursor: pointer; min-height: 44px;

    .opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }

    .gtable tr.chosen td { background: var(--success-soft); font-weight: 700; }

    /* test + compare */

    .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .dtable td.nmcol { white-space: normal; min-width: 130px; }
    .dcards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .dcard { border: 1px solid var(--border); border-top: 5px solid var(--k); border-radius: 12px; padding: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; break-inside: avoid; }
    .dcard .big { font-size: 2rem; line-height: 1.1; }
    .dcard.noisy { background: var(--warning-soft); }
    .dcard ul { margin: 0; padding-inline-start: 0; list-style: none; font-size: .84rem; }

    .dcard li span { color: var(--muted); }

    .pcol { display: none; }

    .formula .gx-names, .formula .gx-f { display: block; }
    .formula .gx-names { font-family: var(--font); font-weight: 600; text-align: start; margin-bottom: 2px; }

    .cg { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; }

    .bar { width: 30px; border-radius: 6px 6px 0 0; position: relative; min-height: 2px; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="topbar">
      <span class="lbl" id="ds-lbl" data-i18n="ds_label"></span>
      <div class="seg ds-seg" role="group" aria-labelledby="ds-lbl">
        <button type="button" id="ds-animals" aria-pressed="true"><span aria-hidden="true">🐾 </span><span class="ds-name"></span></button>
        <button type="button" id="ds-cricket" aria-pressed="false"><span aria-hidden="true">🏏 </span><span class="ds-name"></span></button>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-build" aria-controls="pane-build" data-i18n="tab_build"></button>
      <button type="button" role="tab" id="tab-data" aria-controls="pane-data" data-i18n="tab_data"></button>
      <button type="button" role="tab" id="tab-learn" aria-controls="pane-learn" data-i18n="tab_learn"></button>
    </div>

    <!-- ================= BUILD & TEST ================= -->
    <section id="pane-build" role="tabpanel" aria-labelledby="tab-build">
      <div class="lab">
        <div class="card builder">
          <div class="b-head">
            <h2 class="target" id="target"></h2>
            <div class="seg mode-seg" role="group" id="mode-seg">
              <button type="button" id="mode-mine" data-i18n="mode_mine"></button>
              <button type="button" id="mode-auto" data-i18n="mode_auto"></button>
            </div>
          </div>
          <div class="toolbar">
            <span class="ctl mine-only">
              <button type="button" class="btn btn-sm" id="undo" data-i18n="undo"></button>
              <button type="button" class="btn btn-sm btn-danger" id="clear-tree" data-i18n="clear_tree"></button>
              <label class="check small"><input type="checkbox" id="hints"> <span data-i18n="hints"></span></label>
            </span>
            <span class="ctl auto-only">
              <span id="depth-lbl" data-i18n="max_depth"></span>
              <span class="seg depth-seg" role="group" aria-labelledby="depth-lbl" id="depth-seg"></span>
            </span>
            <span class="ctl auto-only">
              <button type="button" class="btn btn-sm" id="step-start" data-i18n="step_start"></button>
              <button type="button" class="btn btn-sm btn-primary" id="step-next" data-i18n="step_next"></button>
              <button type="button" class="btn btn-sm" id="step-all" data-i18n="step_all"></button>
              <span class="small muted" id="step-label" aria-live="polite"></span>
            </span>
            <span class="push">
              <button type="button" class="btn btn-sm" id="fs" data-i18n="fullscreen"></button>
              <button type="button" class="btn btn-sm" id="print-tree" data-i18n="print_tree"></button>
            </span>
          </div>
          <p class="walk" id="walk" aria-live="polite"></p>
          <div class="tree-scroll scroll-x" id="tree-scroll" role="region" data-i18n-aria-label="tree_label" tabindex="-1">
            <div class="tree-canvas" id="tree"></div>
          </div>
          <div class="statline" id="stats" aria-live="polite"></div>
          <div id="warn-line"></div>
        </div>
        <aside class="card ins-card" id="ins" aria-live="polite"></aside>
      </div>

      <div class="grid-2 below">
        <section class="card" id="testcard">
          <h2 class="h-sm" id="test-h"></h2>
          <p class="muted small" data-i18n="test_p"></p>
          <div class="row">
            <button type="button" class="btn btn-accent" id="run-test" data-i18n="run_test"></button>
            <button type="button" class="btn" id="skip-test" data-i18n="skip" hidden></button>
          </div>
          <div class="scroll-x" style="margin-top:10px">
            <table class="table ttable" id="test-table"></table>
          </div>
          <p class="mb0" id="test-summary" aria-live="polite" style="margin-top:10px"></p>
        </section>
        <section class="card" id="compare">
          <h2 class="h-sm" data-i18n="cmp_h"></h2>
          <div class="scroll-x"><table class="table cmp" id="cmp-table"></table></div>
          <p class="mb0" id="cmp-note" style="margin-top:10px"></p>
        </section>
      </div>
    </section>

    <!-- ================= DATA ================= -->
    <section id="pane-data" role="tabpanel" aria-labelledby="tab-data" hidden>
      <div class="card stack">
        <div class="row spread no-print">
          <div class="seg" role="group" id="view-seg">
            <button type="button" id="view-table" data-i18n="view_table"></button>
            <button type="button" id="view-cards" data-i18n="view_cards"></button>
          </div>
          <button type="button" class="btn" id="print-sheet" data-i18n="print_sheet"></button>
        </div>
        <div class="print-only">
          <h2 id="sheet-title"></h2>
          <p data-i18n="sheet_name"></p>
          <p class="mb0"><b id="sheet-target"></b></p>
        </div>
        <div class="legend" id="legend"></div>
        <div id="data-note" class="callout accent small"></div>
        <h3 class="h-sm" id="train-h"></h3>
        <div id="train-view"></div>
        <h3 class="h-sm" id="testdata-h"></h3>
        <div id="test-view"></div>
        <div class="print-only">
          <h3 class="h-sm" data-i18n="sheet_draw"></h3>
          <div class="sheet-box"></div>
        </div>
      </div>
    </section>

    <!-- ================= HOW IT WORKS ================= -->
    <section id="pane-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
      <div class="grid-2">
        <div class="card stack">
          <h2 class="h-sm" data-i18n="what_h"></h2>
          <p data-i18n-html="what_p"></p>
          <p class="mb0" data-i18n-html="what_p2"></p>
        </div>
        <div class="card stack">
          <h2 class="h-sm" data-i18n="gini_h"></h2>
          <p data-i18n-html="gini_p"></p>
          <p class="mb0 small"><b data-i18n="gini_ex"></b></p>
          <code class="formula" id="gini-ex" dir="ltr"></code>
          <p class="small mb0" data-i18n-html="split_p"></p>
        </div>
        <div class="card stack">
          <h2 class="h-sm" data-i18n="basket_h"></h2>
          <div class="row">
            <span class="stepper"><span data-i18n="apples"></span>
              <button type="button" class="btn btn-sm" id="apple-minus" data-i18n-aria-label="minus_one">−</button><b id="apple-n"></b>
              <button type="button" class="btn btn-sm" id="apple-plus" data-i18n-aria-label="plus_one">+</button></span>
            <span class="stepper"><span data-i18n="mangoes"></span>
              <button type="button" class="btn btn-sm" id="mango-minus" data-i18n-aria-label="minus_one">−</button><b id="mango-n"></b>
              <button type="button" class="btn btn-sm" id="mango-plus" data-i18n-aria-label="plus_one">+</button></span>
          </div>
          <div class="basket" id="basket" aria-hidden="true"></div>
          <code class="formula" id="basket-f" dir="ltr"></code>
          <p class="mb0" id="basket-res" aria-live="polite"></p>
        </div>
        <div class="card stack">
          <h2 class="h-sm" data-i18n="greedy_h"></h2>
          <p class="mb0" data-i18n="greedy_p"></p>
        </div>
      </div>
      <div class="card stack below">
        <h2 class="h-sm" data-i18n="overfit_h"></h2>
        <p data-i18n-html="overfit_p"></p>
        <h3 class="h-sm" id="chart-h"></h3>
        <div class="row small"><span class="key"><i style="background:var(--c1)"></i><span data-i18n="chart_train"></span></span><span class="key"><i style="background:var(--c2)"></i><span data-i18n="chart_test"></span></span></div>
        <div id="chart"></div>
        <p class="callout mb0" id="chart-note"></p>
      </div>
      <div class="card stack below">
        <h2 class="h-sm" data-i18n="real_h"></h2>
        <ul class="uses">
          <li data-i18n="real1"></li>
          <li data-i18n="real2"></li>
          <li data-i18n="real3"></li>
          <li data-i18n="real4"></li>
          <li data-i18n="real5"></li>
        </ul>
      </div>
    </section>

    <details class="card help no-print">
      <summary data-i18n="help_h"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/decision-tree-builder/../../shared/edu.js"></script>
  <script src="../../../apps/decision-tree-builder/strings.js"></script>
  <script src="../../../apps/decision-tree-builder/content.js"></script>
  <script src="../../../apps/decision-tree-builder/app.js"></script>
</body>
</html>
