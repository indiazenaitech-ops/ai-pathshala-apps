  <style>
    :root {
      --sq-light: #efe0c6; --sq-dark: #6b968f; --sq-last: rgba(247, 200, 60, .55); --sq-sel: rgba(255, 170, 40, .65);
      --sq-hint: #d9501c; --sq-dot: rgba(20, 40, 45, .32); --sq-cur: #d9501c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --sq-light: #cdbd9f; --sq-dark: #4f7570; --sq-last: rgba(240, 190, 50, .5); --sq-dot: rgba(10, 20, 25, .42); --sq-hint: #ff7a45; --sq-cur: #ff9a6a; }
    }
    :root[data-theme="dark"] { --sq-light: #cdbd9f; --sq-dark: #4f7570; --sq-last: rgba(240, 190, 50, .5); --sq-dot: rgba(10, 20, 25, .42); --sq-hint: #ff7a45; --sq-cur: #ff9a6a; }

    .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    .ch-tabs button { min-height: 44px; font-size: 1rem; }
    .lbl { font-size: .85rem; color: var(--muted); font-weight: 700; margin: 0 0 4px; display: block; }

    /* ---------- layout ---------- */
    .play-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 940px) { .play-grid { grid-template-columns: minmax(0, 620px) minmax(300px, 1fr); } }
    .board-card { display: flex; flex-direction: column; gap: 8px; }
    .board-card:fullscreen { background: var(--bg); padding: 12px; justify-content: center; align-items: center; }
    .board-card:fullscreen .board-wrap, .board-card:fullscreen .pbar, .board-card:fullscreen .ctrl { width: min(94vh - 170px, 100%); max-width: none; }
    .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    /* ---------- board ---------- */
    .board-wrap { position: relative; width: 100%; max-width: 620px; margin: 0 auto; direction: ltr; }
    .cb-svg { display: block; width: 100%; height: auto; border-radius: 8px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .cb-svg:focus { outline: none; }
    .cb-svg:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .cb-svg .sqL { fill: var(--sq-light); } .cb-svg .sqD { fill: var(--sq-dark); }
    .cb-svg .pieces use, .cb-svg .hl, .cb-svg .dots, .cb-svg .coords, .cb-svg .ghost, .cb-svg .arrows { pointer-events: none; }
    .cb-svg .pieces use.lift { opacity: .3; }
    .cb-svg .pieces use.anim { transition: transform .16s ease-out; }
    .cb-svg .coords text { font: 700 19px "Noto Sans", system-ui, sans-serif; }
    .cb-svg .cL { fill: var(--sq-dark); } .cb-svg .cD { fill: var(--sq-light); }
    @media (prefers-reduced-motion: reduce) { .cb-svg .pieces use.anim { transition: none; } }

    /* ---------- player bars, clocks, captured ---------- */
    .pbar { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 620px; margin: 0 auto; min-height: 44px; }
    .pbar .who { font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .pbar .who .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text); flex: none; }
    .pbar .who .dot.w { background: #fbfaf7; } .pbar .who .dot.b { background: #2f3236; }
    .pbar .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pbar .caps { display: flex; align-items: center; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; gap: 0; direction: ltr; }
    .pbar .caps svg { width: 21px; height: 21px; margin-inline-end: -3px; }
    .pbar .caps .adv { font-weight: 800; color: var(--muted); margin-inline-start: 8px; font-size: .9rem; font-family: "Noto Sans", system-ui, sans-serif; }
    .clock { font: 800 1.25rem/1 "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 8px 10px; min-width: 5.2em; text-align: center; flex: none; border: 1px solid var(--border); direction: ltr; }
    .clock.run { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .clock.low.run { background: var(--danger); border-color: var(--danger); color: #fff; }
    .clock[hidden] { display: none; }

    /* ---------- controls ---------- */
    .ctrl { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; max-width: 620px; margin: 0 auto; }
    .ctrl .btn { flex: 1 1 auto; padding-inline: 10px; }
    .status { margin: 0; font-weight: 700; min-height: 2.9em; display: flex; align-items: center; width: 100%; max-width: 620px; margin-inline: auto; }
    .status[data-kind="over"] { border-color: var(--accent); background: var(--accent-soft); }
    .status[data-kind="check"] { border-color: var(--danger); background: var(--danger-soft); }
    .status[data-kind="good"] { border-color: var(--success); background: var(--success-soft); }
    .seg.full { display: flex; width: 100%; }
    .seg.full button { flex: 1 1 0; min-height: 42px; padding-inline: 6px; }
    .lv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .lv-grid .chip { justify-content: center; min-height: 42px; border-radius: 10px; padding: 6px; text-align: center; }
    .opts { display: flex; flex-direction: column; gap: 4px; }
    .opts .check { min-height: 40px; }
    .hint-txt { color: var(--muted); font-size: .84rem; margin: 6px 0 0; }
    .typed { display: flex; gap: 6px; }
    .typed input { flex: 1 1 auto; min-width: 0; }

    /* ---------- move list ---------- */
    .mlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 2.6em 1fr 1fr; gap: 2px 4px; max-height: 260px; overflow-y: auto; direction: ltr; font-family: "Noto Sans", system-ui, sans-serif; }
    .mlist .n { color: var(--muted); padding: 6px 2px; font-size: .9rem; text-align: end; }
    .mlist button { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; text-align: start; padding: 6px 8px; border-radius: 6px; cursor: pointer; min-height: 34px; }
    .mlist button:hover { background: var(--surface-2); }
    .mlist button[aria-current="true"] { background: var(--primary-soft); color: var(--text); outline: 1px solid var(--primary); }
    .nav-row { display: flex; gap: 6px; }
    .nav-row .btn { flex: 1 1 0; font-size: 1.05rem; }
    .pgn-box textarea { min-height: 84px; font-family: var(--mono); font-size: .86rem; direction: ltr; }
    .rules-note { margin: 0; }

    /* ---------- promotion chooser ---------- */
    .promo { position: absolute; inset: 0; background: rgba(5, 15, 20, .5); display: grid; place-items: center; z-index: 5; border-radius: 8px; }
    .promo-box { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: var(--shadow-lg); text-align: center; max-width: 92%; }
    .promo-box p { margin: 0 0 8px; font-weight: 700; }
    .promo-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .promo-row button { width: 68px; height: 68px; border-radius: 10px; border: 2px solid var(--border); background: var(--sq-light); cursor: pointer; padding: 4px; }
    .promo-row button:hover, .promo-row button:focus-visible { border-color: var(--accent); }
    .promo-row svg { width: 100%; height: 100%; }

    /* ---------- puzzles ---------- */
    .pz-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
    .pz-list button { min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; position: relative; font-family: "Noto Sans", system-ui, sans-serif; }
    .pz-list button.m2 { border-style: dashed; }
    .pz-list button[aria-current="true"] { border-color: var(--primary); outline: 2px solid var(--primary); }
    .pz-list button.solved { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .pz-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
    .pz-task { font-size: 1.15rem; margin: 0; }
    .badge.big { font-size: .85rem; padding: 4px 10px; }

    /* ---------- learn ---------- */
    .learn-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 860px) { .learn-grid { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); } }
    .pc-pick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    .pc-pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 64px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font: inherit; font-size: .78rem; font-weight: 700; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
    .pc-pick button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); outline: 2px solid var(--primary); }
    .pc-pick svg { width: 34px; height: 34px; }
    .mini .board-wrap { max-width: 440px; }
    .sp-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
    .sp-card .board-wrap { max-width: 340px; }
    .sp-card h3 { margin: 0; }
    .end-list { margin: 0; padding-inline-start: 1.2em; }
    .end-list li { margin-bottom: 6px; }
    .help summary { cursor: pointer; font-weight: 700; padding-block: 8px; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 6px; }
    .page-sec { margin-top: 16px; }

    /* game over box (inside EDU.modal) */
    .over-box { text-align: center; }
    .over-box .big { font-size: 1.3rem; font-weight: 800; margin: 4px 0 8px; }
    .over-box .row { justify-content: center; margin-top: 12px; }

    @media (max-width: 560px) {
      .board-card.card, .side .card { padding: 10px; }
      .clock { font-size: 1.1rem; min-width: 4.6em; padding: 7px 8px; }
      .ctrl .btn { font-size: .9rem; padding-inline: 8px; }
      .pc-pick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    :root[lang="ur"] .mlist, :root[lang="ur"] .clock { line-height: 1.4; }

    @media print {
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) { --sq-light: #f2f2f2; --sq-dark: #b9b9b9; --primary: #0b4f5c; --accent: #d9501c; }

      .board-wrap { max-width: 12cm; }

      .cb-svg { box-shadow: none; border: 1px solid #999; }

  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs ch-tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tabbtn-play" aria-controls="tab-play" data-tab="play"><span aria-hidden="true">♟</span> <span data-i18n="tab_play"></span></button>
      <button type="button" role="tab" id="tabbtn-puzzles" aria-controls="tab-puzzles" data-tab="puzzles"><span aria-hidden="true">🧩</span> <span data-i18n="tab_puzzles"></span></button>
      <button type="button" role="tab" id="tabbtn-learn" aria-controls="tab-learn" data-tab="learn"><span aria-hidden="true">📘</span> <span data-i18n="tab_learn"></span></button>
    </div>

    <!-- ===================================================== PLAY -->
    <section id="tab-play" role="tabpanel" aria-labelledby="tabbtn-play">
      <div class="play-grid">
        <div class="card board-card" id="board-card">
          <div class="pbar" id="bar-top"></div>
          <div class="board-wrap" id="play-board"></div>
          <div class="pbar" id="bar-bot"></div>
          <p class="callout status" id="status" aria-live="polite"></p>
          <div class="ctrl no-print">
            <button type="button" class="btn" id="undo"><span aria-hidden="true">↶</span> <span data-i18n="undo"></span></button>
            <button type="button" class="btn" id="hint"><span aria-hidden="true">💡</span> <span data-i18n="hint"></span></button>
            <button type="button" class="btn" id="flip"><span aria-hidden="true">⇅</span> <span data-i18n="flip"></span></button>
            <button type="button" class="btn" id="draw"><span aria-hidden="true">½</span> <span data-i18n="offer_draw"></span></button>
            <button type="button" class="btn" id="claim" hidden><span aria-hidden="true">½</span> <span data-i18n="claim_draw"></span></button>
            <button type="button" class="btn btn-danger" id="resign"><span aria-hidden="true">🏳</span> <span data-i18n="resign"></span></button>
            <button type="button" class="btn" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          </div>
        </div>

        <aside class="side">
          <section class="card stack settings no-print" aria-labelledby="ng-h">
            <h2 id="ng-h" class="mb0" data-i18n="new_game_h"></h2>
            <div>
              <span class="lbl" id="mode-lbl" data-i18n="mode_label"></span>
              <div class="seg full" role="group" aria-labelledby="mode-lbl">
                <button type="button" id="mode-cpu" data-mode="cpu"><span aria-hidden="true">🤖</span> <span data-i18n="mode_cpu"></span></button>
                <button type="button" id="mode-human" data-mode="human"><span aria-hidden="true">👥</span> <span data-i18n="mode_human"></span></button>
              </div>
            </div>
            <div id="cpu-opts">
              <span class="lbl" id="lv-lbl" data-i18n="level_label"></span>
              <div class="lv-grid" role="group" aria-labelledby="lv-lbl" id="levels">
                <button type="button" class="chip" data-lv="1" id="lv-1" data-i18n="lv1"></button>
                <button type="button" class="chip" data-lv="2" id="lv-2" data-i18n="lv2"></button>
                <button type="button" class="chip" data-lv="3" id="lv-3" data-i18n="lv3"></button>
                <button type="button" class="chip" data-lv="4" id="lv-4" data-i18n="lv4"></button>
                <button type="button" class="chip" data-lv="5" id="lv-5" data-i18n="lv5"></button>
                <button type="button" class="chip" data-lv="6" id="lv-6" data-i18n="lv6"></button>
              </div>
              <p class="hint-txt" data-i18n="level_hint"></p>
              <span class="lbl" id="col-lbl" data-i18n="color_label" style="margin-top:10px"></span>
              <div class="seg full" role="group" aria-labelledby="col-lbl">
                <button type="button" id="col-w" data-col="w" data-i18n="white"></button>
                <button type="button" id="col-b" data-col="b" data-i18n="black"></button>
                <button type="button" id="col-r" data-col="r" data-i18n="col_random"></button>
              </div>
            </div>
            <div>
              <span class="lbl" id="clk-lbl" data-i18n="clock_label"></span>
              <div class="seg full" role="group" aria-labelledby="clk-lbl">
                <button type="button" id="clk-none" data-clk="none" data-i18n="clk_none"></button>
                <button type="button" id="clk-3" data-clk="3+2" dir="ltr">3 + 2</button>
                <button type="button" id="clk-5" data-clk="5+0" dir="ltr">5 + 0</button>
                <button type="button" id="clk-10" data-clk="10+5" dir="ltr">10 + 5</button>
              </div>
              <p class="hint-txt" data-i18n="clock_hint"></p>
            </div>
            <button type="button" class="btn btn-primary btn-lg w100" id="new-game"><span aria-hidden="true">▶</span> <span data-i18n="new_game"></span></button>
            <div class="opts">
              <label class="check" id="autoflip-row"><input type="checkbox" id="autoflip"> <span data-i18n="autoflip"></span></label>
              <label class="check"><input type="checkbox" id="showdots"> <span data-i18n="showdots"></span></label>
              <label class="check"><input type="checkbox" id="autodraw"> <span data-i18n="autodraw"></span></label>
              <label class="check"><input type="checkbox" id="sound"> <span data-i18n="sound"></span></label>
            </div>
            <p class="muted tiny mb0"><span aria-hidden="true">💾</span> <span data-i18n="saved_note"></span></p>
          </section>

          <section class="card stack" aria-labelledby="mv-h">
            <h2 id="mv-h" class="mb0" data-i18n="moves_h"></h2>
            <p class="muted small mb0" id="no-moves" data-i18n="no_moves"></p>
            <ol class="mlist no-i18n" id="mlist"></ol>
            <div class="nav-row no-print">
              <button type="button" class="btn btn-sm" id="nav-first" data-i18n-aria-label="nav_first" data-i18n-title="nav_first">⏮</button>
              <button type="button" class="btn btn-sm" id="nav-prev" data-i18n-aria-label="nav_prev" data-i18n-title="nav_prev">◀</button>
              <button type="button" class="btn btn-sm" id="nav-next" data-i18n-aria-label="nav_next" data-i18n-title="nav_next">▶</button>
              <button type="button" class="btn btn-sm" id="nav-last" data-i18n-aria-label="nav_last" data-i18n-title="nav_last">⏭</button>
            </div>
            <div class="typed no-print">
              <label class="vh" for="type-move" data-i18n="type_move_label"></label>
              <input type="text" id="type-move" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="type_move_ph">
              <button type="button" class="btn" id="type-btn" data-i18n="type_move_btn"></button>
            </div>
          </section>

          <section class="card stack pgn-box no-print" aria-labelledby="pgn-h">
            <h2 id="pgn-h" class="mb0" data-i18n="pgn_h"></h2>
            <div class="row">
              <button type="button" class="btn btn-sm" id="copy-pgn"><span aria-hidden="true">📋</span> <span data-i18n="copy_pgn"></span></button>
              <button type="button" class="btn btn-sm" id="dl-pgn"><span aria-hidden="true">⬇</span> <span data-i18n="download_pgn"></span></button>
              <button type="button" class="btn btn-sm" id="copy-fen"><span aria-hidden="true">📋</span> <span data-i18n="copy_fen"></span></button>
              <button type="button" class="btn btn-sm" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
            </div>
            <label class="field" for="load-text"><span data-i18n="load_label"></span>
              <textarea id="load-text" class="no-i18n" spellcheck="false"></textarea>
            </label>
            <div class="row">
              <button type="button" class="btn" id="load-btn"><span aria-hidden="true">📥</span> <span data-i18n="load_btn"></span></button>
              <button type="button" class="btn btn-sm" id="load-file"><span aria-hidden="true">📂</span> <span data-i18n="load_file"></span></button>
            </div>
            <p class="muted small mb0" id="load-msg" aria-live="polite"></p>
          </section>
        </aside>
      </div>
      <p class="muted small rules-note page-sec" data-i18n="rules_note"></p>
    </section>

    <!-- ===================================================== PUZZLES -->
    <section id="tab-puzzles" role="tabpanel" aria-labelledby="tabbtn-puzzles" hidden>
      <div class="play-grid">
        <div class="card board-card">
          <div class="pz-head">
            <h2 class="pz-task" id="pz-task"></h2>
            <span class="badge big" id="pz-theme"></span>
          </div>
          <div class="board-wrap" id="pz-board"></div>
          <p class="callout status" id="pz-msg" aria-live="polite"></p>
          <div class="ctrl no-print">
            <button type="button" class="btn" id="pz-hint"><span aria-hidden="true">💡</span> <span data-i18n="hint"></span></button>
            <button type="button" class="btn" id="pz-retry"><span aria-hidden="true">↺</span> <span data-i18n="pz_retry"></span></button>
            <button type="button" class="btn" id="pz-show"><span aria-hidden="true">👁</span> <span data-i18n="pz_show"></span></button>
            <button type="button" class="btn btn-primary" id="pz-next"><span data-i18n="pz_next"></span> <span aria-hidden="true">→</span></button>
          </div>
        </div>
        <aside class="side">
          <section class="card stack" aria-labelledby="pz-h">
            <h2 id="pz-h" class="mb0" data-i18n="pz_h"></h2>
            <p class="mb0 small" data-i18n="pz_intro"></p>
            <p class="mb0" id="pz-count"></p>
            <div class="progress" aria-hidden="true"><span id="pz-bar" style="width:0%"></span></div>
            <span class="lbl" data-i18n="pz_list"></span>
            <div class="pz-list" id="pz-list"></div>
            <p class="hint-txt mb0" data-i18n="pz_legend"></p>
            <button type="button" class="btn btn-sm btn-danger" id="pz-reset"><span aria-hidden="true">↺</span> <span data-i18n="pz_reset"></span></button>
          </section>
        </aside>
      </div>
    </section>

    <!-- ===================================================== LEARN -->
    <section id="tab-learn" role="tabpanel" aria-labelledby="tabbtn-learn" hidden>
      <div class="learn-grid">
        <div class="card stack mini">
          <h2 class="mb0" data-i18n="learn_h"></h2>
          <p class="mb0 small" data-i18n="learn_intro"></p>
          <div class="pc-pick" id="pc-pick" role="group" data-i18n-aria-label="learn_h"></div>
          <div class="board-wrap" id="learn-board"></div>
          <p class="callout status" id="learn-msg" aria-live="polite"></p>
          <div class="row no-print"><button type="button" class="btn" id="learn-reset"><span aria-hidden="true">↺</span> <span data-i18n="lesson_reset"></span></button></div>
        </div>
        <div class="card stack">
          <h2 class="mb0" id="pc-name"></h2>
          <p class="mb0" id="pc-move"></p>
          <p class="mb0 muted" id="pc-val"></p>
          <hr class="divider">
          <h3 class="mb0" data-i18n="end_h"></h3>
          <ul class="end-list">
            <li data-i18n="end_check"></li>
            <li data-i18n="end_mate"></li>
            <li data-i18n="end_stale"></li>
            <li data-i18n="end_draws"></li>
          </ul>
          <div class="callout accent">
            <h3 class="mb0" data-i18n="history_h"></h3>
            <p class="small" data-i18n="history_p"></p>
            <p class="small mb0" data-i18n="history_p2"></p>
          </div>
        </div>
      </div>

      <h2 class="page-sec" data-i18n="special_h"></h2>
      <div class="sp-grid">
        <div class="card stack sp-card" id="sp-castle">
          <h3 data-i18n="sp_castle_t"></h3>
          <p class="small mb0" data-i18n="sp_castle"></p>
          <div class="board-wrap" id="sp-castle-board"></div>
          <p class="callout status" id="sp-castle-msg" aria-live="polite"></p>
          <button type="button" class="btn btn-sm no-print" id="sp-castle-again"><span aria-hidden="true">↺</span> <span data-i18n="sp_again"></span></button>
        </div>
        <div class="card stack sp-card" id="sp-ep">
          <h3 data-i18n="sp_ep_t"></h3>
          <p class="small mb0" data-i18n="sp_ep"></p>
          <div class="board-wrap" id="sp-ep-board"></div>
          <p class="callout status" id="sp-ep-msg" aria-live="polite"></p>
          <button type="button" class="btn btn-sm no-print" id="sp-ep-again"><span aria-hidden="true">↺</span> <span data-i18n="sp_again"></span></button>
        </div>
        <div class="card stack sp-card" id="sp-promo">
          <h3 data-i18n="sp_promo_t"></h3>
          <p class="small mb0" data-i18n="sp_promo"></p>
          <div class="board-wrap" id="sp-promo-board"></div>
          <p class="callout status" id="sp-promo-msg" aria-live="polite"></p>
          <button type="button" class="btn btn-sm no-print" id="sp-promo-again"><span aria-hidden="true">↺</span> <span data-i18n="sp_again"></span></button>
        </div>
      </div>
    </section>

    <details class="card help page-sec no-print">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/chess/../../shared/edu.js"></script>
  <script src="../../../apps/chess/strings.js"></script>
  <script src="../../../apps/chess/engine.js"></script>
  <script src="../../../apps/chess/pieces.js"></script>
  <script src="../../../apps/chess/puzzles.js"></script>
  <script src="../../../apps/chess/app.js"></script>
</body>
</html>
