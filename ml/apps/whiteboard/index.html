  <style>
    /* ---------- board frame ---------- */
    .wb { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .wb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .wb-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
    .wb-ib { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      min-width: 44px; min-height: 44px; padding: 4px 6px; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--text); font: inherit; cursor: pointer; line-height: 1.1; }
    .wb-ib:hover { background: var(--surface); border-color: var(--border); }
    .wb-ib[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .wb-ib:disabled { opacity: .38; cursor: not-allowed; background: transparent; border-color: transparent; }
    .wb-ib svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wb-lbl { font-size: .7rem; font-weight: 600; max-width: 6.5rem; text-align: center; overflow-wrap: anywhere; }
    :root[lang="ur"] .wb-lbl { line-height: 1.6; }
    [dir="rtl"] .flip-rtl { transform: scaleX(-1); }
    .wb-danger { color: var(--danger); }

    .wb-sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border);
      cursor: pointer; padding: 0; margin: 3px; position: relative; }
    .wb-sw::after, .wb-board-sw::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45); pointer-events: none; }
    .wb-sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .wb-custom { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; margin: 0; cursor: pointer;
      border-radius: 50%; background: conic-gradient(#ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444); }
    .wb-custom[data-on="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .wb-custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
    .wb-custom i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; }
    .wb-dot { display: block; border-radius: 50%; background: currentColor; }
    .wb-board-sw { position: relative; width: 40px; height: 40px; border-radius: 9px; border: 2px solid var(--border); cursor: pointer; padding: 0; }
    .wb-seg2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 34rem; }
    .wb-seg2 button { min-height: 44px; line-height: 1.3; }
    :root[lang="ur"] .wb-seg2 button { line-height: 1.8; }
    :root[lang="ur"] .wb-settings h2, :root[lang="ur"] details.card summary, :root[lang="ur"] details.card h3 { line-height: 2; }
    :root[lang="ur"] .wb-settings label { display: block; line-height: 2; }
    .wb-board-sw[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
    .wb-bgsel { min-height: 42px; max-width: 13.5rem; font-weight: 600; }

    /* ---------- stage + canvases ---------- */
    .wb-stage { position: relative; display: flex; align-items: flex-start; justify-content: center; min-width: 0; }
    .wb-cwrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); background: #fff; max-width: 100%; }
    .wb-cwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    #wb-live { cursor: crosshair; }
    .wb[data-tool="text"] #wb-live { cursor: text; }
    .wb[data-tool="eraser"] #wb-live { cursor: none; }
    .wb-text { position: absolute; z-index: 3; margin: 0; padding: 0 2px; min-height: 0; border: 2px dashed #3b82f6; border-radius: 4px;
      background: rgba(255, 255, 255, .06); resize: none; overflow: hidden; white-space: pre; outline: none;
      text-align: left;   /* the board is never mirrored: Urdu text stays where it was tapped, as on the canvas */
      font-family: "Noto Sans", "Nirmala UI", "Noto Sans Devanagari", "Noto Nastaliq Urdu", system-ui, sans-serif; font-weight: 500; }
    .wb-show { position: absolute; top: 6px; inset-inline-end: 6px; z-index: 4; box-shadow: var(--shadow); }
    .wb.wb-notools .wb-bar { display: none; }

    /* ---------- page bar ---------- */
    .wb-pages { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .wb-pageno { font-weight: 700; min-width: 6.5rem; text-align: center; font-variant-numeric: tabular-nums; }
    .wb-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; flex: 1 1 260px; min-width: 0; -webkit-overflow-scrolling: touch; }
    .wb-thumb { position: relative; flex: none; padding: 0; border: 2px solid var(--border); border-radius: 8px; background: var(--surface-2); cursor: pointer; overflow: hidden; line-height: 0; }
    .wb-thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .wb-thumb canvas { display: block; height: 58px; width: auto; }
    .wb-thumb b { position: absolute; bottom: 2px; inset-inline-start: 2px; background: var(--text); color: var(--bg); border-radius: 6px;
      font-size: .7rem; line-height: 1.4; padding: 0 5px; font-family: "Noto Sans", system-ui, sans-serif; }

    /* ---------- full screen / maximised ---------- */
    .wb:fullscreen, .wb.wb-max { border-radius: 0; border: 0; padding: 8px; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg); }
    .wb:-webkit-full-screen { border-radius: 0; border: 0; padding: 8px; height: 100vh; width: 100vw; overflow: hidden; background: var(--bg); }
    .wb.wb-max { position: fixed; inset: 0; z-index: 800; }
    .wb.wb-full .wb-stage { flex: 1 1 auto; min-height: 0; align-items: center; }
    .wb.wb-full .wb-thumbs { display: none; }
    @media (min-width: 761px) {           /* bigger buttons for a smartboard; phones keep their compact bar */
      .wb.wb-full .wb-ib { min-width: 50px; min-height: 50px; }
      .wb.wb-full .wb-ib svg { width: 26px; height: 26px; }
    }

    /* ---------- phones ---------- */
    @media (max-width: 760px) {
      .wb { padding: 6px; border-radius: 12px; }
      .wb-lbl { display: none; }
      .wb-bar { gap: 5px; }
      .wb-group { gap: 2px; padding: 2px; }
      .wb-ib { min-width: 40px; min-height: 40px; padding: 3px; }
      .wb-sw { width: 28px; height: 28px; margin: 3px 2px; border-width: 2px; }
      .wb-sw::before { content: ""; position: absolute; inset: -8px -4px; }   /* 40 px tall touch target */
      .wb-custom { width: 32px; height: 32px; }
      .wb-custom i { width: 14px; height: 14px; }
      .wb-bgsel { max-width: 10.5rem; font-size: .88rem; }
      .wb-thumb canvas { height: 46px; }
      .wb-pageno { min-width: 5.5rem; font-size: .9rem; }
    }
    @media (max-width: 374px) {           /* 360 px phones: keep all 8 tools on one row (no lone Text button) */
      #wb-tools .wb-ib { min-width: 36px; padding: 3px 1px; }
    }

    .wb-settings .row > .field { flex: 1 1 220px; }
    .wb-actions .btn { flex: 1 1 auto; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 1.2rem; }
    details.card li { margin-bottom: 6px; }
    .wb-sc { margin: 4px 0; }

    /* ---------- print: every page as a picture ---------- */
    .wb-print figure { margin: 0 0 8mm; break-inside: avoid; page-break-inside: avoid; }
    .wb-print figure + figure { break-before: page; page-break-before: always; }
    .wb-print img, .wb-print canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: 235mm;
      max-height: min(235mm, 86vh); margin: 0 auto; border: 1px solid #999; }   /* one sheet per page, with its caption, portrait or landscape */
    .wb-print figcaption { font-size: 12pt; font-weight: 700; margin-top: 2mm; }
    @media print {
      .wb, .wb-settings, details.card, .edu-intro { display: none !important; }
      .wb-print { display: block !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="wb" id="wb" data-tool="pen">
      <div class="wb-bar no-print" id="wb-bar" role="toolbar" data-i18n-aria-label="grp_tools">
        <div class="wb-group" id="wb-tools" role="group" data-i18n-aria-label="grp_tools"></div>
        <div class="wb-group" id="wb-colors" role="group" data-i18n-aria-label="grp_colors"></div>
        <div class="wb-group" id="wb-sizes" role="group" data-i18n-aria-label="grp_size"></div>
        <div class="wb-group" id="wb-bgs" role="group" data-i18n-aria-label="background">
          <select id="wb-bg" class="wb-bgsel" data-i18n-aria-label="background" data-i18n-title="background"></select>
          <span id="wb-boards" class="row" style="gap:4px" role="group" data-i18n-aria-label="board_colour"></span>
        </div>
        <div class="wb-group" id="wb-actions"></div>
      </div>

      <div class="wb-stage" id="wb-stage">
        <div class="wb-cwrap" id="wb-cwrap" dir="ltr">
          <canvas id="wb-base" aria-hidden="true"></canvas>
          <canvas id="wb-live" role="img" data-i18n-aria-label="app_title"></canvas>
          <textarea id="wb-text" class="wb-text no-i18n" rows="1" spellcheck="false" dir="auto" hidden data-i18n-placeholder="text_ph" data-i18n-aria-label="tool_text"></textarea>
        </div>
        <button type="button" class="btn btn-sm wb-show" id="wb-show" hidden data-i18n="show_tools"></button>
      </div>

      <div class="wb-pages no-print" id="wb-pagebar">
        <button type="button" class="wb-ib" id="wb-prev" data-i18n-aria-label="prev_page" data-i18n-title="prev_page"></button>
        <span class="wb-pageno" id="wb-pageno" aria-live="polite"></span>
        <button type="button" class="wb-ib" id="wb-next" data-i18n-aria-label="next_page" data-i18n-title="next_page"></button>
        <button type="button" class="wb-ib" id="wb-add" data-i18n-aria-label="add_page" data-i18n-title="add_page"></button>
        <div class="wb-thumbs" id="wb-thumbs" role="group" data-i18n-aria-label="pages"></div>
        <button type="button" class="wb-ib wb-danger" id="wb-del" data-i18n-aria-label="del_page" data-i18n-title="del_page"></button>
      </div>
    </section>

    <section class="card wb-settings stack no-print" style="margin-top:16px">
      <h2 data-i18n="settings_title"></h2>
      <div class="row">
        <div class="field">
          <label id="lbl-shape" data-i18n="page_shape"></label>
          <div class="seg wb-seg2" id="wb-shape" role="group" aria-labelledby="lbl-shape">
            <button type="button" data-shape="wide" data-i18n="shape_wide"></button>
            <button type="button" data-shape="tall" data-i18n="shape_tall"></button>
          </div>
        </div>
      </div>
      <div class="row wb-actions">
        <button type="button" class="btn" id="wb-print-btn" data-i18n="print_all"></button>
        <button type="button" class="btn" id="wb-export" data-i18n="dl_board"></button>
        <button type="button" class="btn" id="wb-import" data-i18n="open_board"></button>
        <button type="button" class="btn btn-danger" id="wb-new" data-i18n="new_board"></button>
      </div>
      <p class="muted small mb0"><b data-i18n="saved_local"></b> · <span data-i18n="file_note"></span></p>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 data-i18n="shortcuts" style="margin-top:12px"></h3>
      <p class="small wb-sc" data-i18n="sc_tools"></p>
      <p class="small wb-sc" data-i18n="sc_keys"></p>
      <p class="small wb-sc mb0" data-i18n="sc_shift"></p>
    </details>

    <div class="wb-print print-only" id="wb-print"></div>
  </main>
  <script src="../../../apps/whiteboard/../../shared/edu.js"></script>
  <script src="../../../apps/whiteboard/strings.js"></script>
  <script src="../../../apps/whiteboard/board.js"></script>
  <script src="../../../apps/whiteboard/app.js"></script>
</body>
