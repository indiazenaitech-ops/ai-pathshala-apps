    .tc { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tc" id="tc">
      <div class="tc-col tc-col-a">
        <!-- challenges -->
        <section class="card tc-chal" aria-labelledby="chal-h">
          <div class="tc-head">
            <h2 id="chal-h" data-i18n="challenges_h"></h2>
            <span class="small muted" id="ch-progress"></span>
          </div>
          <div class="tc-chips" id="ch-list" role="group" data-i18n-aria-label="challenges_h"></div>
          <div id="ch-panel"></div>
        </section>

        <!-- program editor -->
        <section class="card tc-editor" id="editor" aria-labelledby="prog-h">
          <div class="tc-head">
            <h2 id="prog-h" data-i18n="program_h"></h2>
            <div class="tabs tc-tabs" role="tablist">
              <button type="button" role="tab" id="tab-blocks" aria-selected="true" aria-controls="pane-blocks" data-i18n="tab_blocks"></button>
              <button type="button" role="tab" id="tab-code" aria-selected="false" aria-controls="pane-code" data-i18n="tab_code"></button>
            </div>
          </div>
          <div class="tc-edbar">
            <button type="button" class="btn btn-sm btn-primary" id="run2">▶ <span data-i18n="run"></span></button>
            <button type="button" class="btn btn-sm" id="undo">↶ <span data-i18n="undo"></span></button>
            <button type="button" class="btn btn-sm btn-danger" id="new-prog" data-i18n="new_program"></button>
            <span class="badge" id="blk-count"></span>
          </div>

          <div id="pane-blocks" role="tabpanel" aria-labelledby="tab-blocks">
            <div class="tc-ed">
              <div class="tc-prog-col">
                <div class="tc-target-note small" id="target-note" aria-live="polite"></div>
                <div class="tc-prog" id="prog"></div>
              </div>
              <div class="tc-pal-col">
                <h3 data-i18n="palette_h"></h3>
                <p class="tiny muted" data-i18n="palette_tip"></p>
                <div class="tc-pal" id="pal" role="group" data-i18n-aria-label="palette_h"></div>
              </div>
            </div>
          </div>

          <div id="pane-code" role="tabpanel" aria-labelledby="tab-code" hidden>
            <p class="small muted" data-i18n="code_tip"></p>
            <textarea id="code" class="no-i18n" dir="ltr" spellcheck="false" autocapitalize="off" autocomplete="off" rows="12" data-i18n-aria-label="tab_code"></textarea>
            <div class="row" style="margin-top:8px">
              <button type="button" class="btn btn-primary" id="apply-code" data-i18n="apply_code"></button>
              <button type="button" class="btn" id="copy-code" data-i18n="copy"></button>
              <button type="button" class="btn" id="dl-code" data-i18n="download"></button>
              <button type="button" class="btn" id="open-file" data-i18n="import"></button>
            </div>
            <p class="tc-codemsg" id="code-msg" aria-live="polite"></p>
            <details class="tc-cmds">
              <summary data-i18n="cmds_h"></summary>
              <div class="scroll-x"><table class="table" id="cmd-table"></table></div>
            </details>
          </div>
        </section>

        <!-- saved programs -->
        <section class="card tc-saved" aria-labelledby="saved-h">
          <h2 id="saved-h" data-i18n="saved_h" style="margin-bottom:10px"></h2>
          <div class="tc-saveform">
            <label class="field"><span data-i18n="name_label"></span>
              <input type="text" id="save-name" maxlength="60" data-i18n-placeholder="name_ph"></label>
            <button type="button" class="btn btn-primary" id="save-btn" data-i18n="save"></button>
            <button type="button" class="btn" id="share-btn" data-i18n="copy_link"></button>
          </div>
          <ul class="tc-savedlist" id="saved-list"></ul>
          <p class="tiny muted mb0" style="margin-top:8px" data-i18n="saved_local"></p>
        </section>

        <!-- angle helper -->
        <section class="card tc-angles" aria-labelledby="ang-h">
          <h2 id="ang-h" data-i18n="angles_h" style="margin-bottom:8px"></h2>
          <p class="small" data-i18n="angles_tip"></p>
          <div class="tc-angs" id="ang-list"></div>
        </section>
      </div>

      <div class="tc-col tc-col-b">
        <!-- drawing -->
        <section class="card tc-stage" id="stage" aria-labelledby="stage-h">
          <h2 id="stage-h" class="print-only" data-i18n="app_title"></h2>
          <div class="tc-runbar">
            <button type="button" class="btn btn-primary btn-lg" id="run">▶ <span data-i18n="run"></span></button>
            <button type="button" class="btn btn-lg" id="step">⏯ <span data-i18n="step"></span></button>
            <button type="button" class="btn btn-lg btn-danger" id="stop" disabled>■ <span data-i18n="stop"></span></button>
            <label class="tc-speed"><span data-i18n="speed"></span>
              <span class="tiny" data-i18n="slow"></span><input type="range" id="speed" min="1" max="10" step="1"><span class="tiny" data-i18n="fast"></span></label>
          </div>
          <div class="stage tc-wrap" id="cv-wrap">
            <canvas id="cv" width="440" height="440" role="img" data-i18n-aria-label="canvas_label"></canvas>
          </div>
          <div class="tc-under">
            <p class="tc-readout" id="readout"></p>
            <span class="small muted" id="stepcount"></span>
          </div>
          <p class="tc-status" id="status" role="status" aria-live="polite"></p>
          <div class="tc-tools">
            <label class="check"><input type="checkbox" id="grid"> <span data-i18n="grid"></span></label>
            <button type="button" class="btn btn-sm" id="save-png" data-i18n="save_png"></button>
            <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
            <button type="button" class="btn btn-sm" id="fs-btn" data-i18n="fullscreen"></button>
          </div>
          <div class="print-only" id="print-extra">
            <div id="print-code" class="no-i18n"></div>
          </div>
        </section>
      </div>

      <details class="card tc-help">
        <summary data-i18n="help_h"></summary>
        <ul>
          <li data-i18n-html="help_1"></li>
          <li data-i18n-html="help_2"></li>
          <li data-i18n-html="help_3"></li>
          <li data-i18n-html="help_4"></li>
          <li data-i18n-html="help_5"></li>
          <li data-i18n-html="help_6"></li>
        </ul>
        <div class="row" style="margin-top:12px">
          <button type="button" class="btn btn-sm btn-danger" id="reset-all" data-i18n="reset"></button>
        </div>
      </details>
    </div>
  </main>
  <script src="../../../apps/turtle-coding/../../shared/edu.js"></script>
  <script src="../../../apps/turtle-coding/strings.js"></script>
  <script src="../../../apps/turtle-coding/content.js"></script>
  <script src="../../../apps/turtle-coding/engine.js"></script>
  <script src="../../../apps/turtle-coding/app.js"></script>
</body>
</html>
