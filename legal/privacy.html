  Protection Act 2023 and the DPDP Rules) before relying on it. Points for the reviewer: the operator is named only
  as "the AI Pathshala team" (no legal entity or postal address yet); the grievance contact is an email address;
  the 30-day deletion depends on the teacher reopening the app while the project is on the free Spark plan (no TTL);
  the optional email updates list (section #updates, added 2026-10-04) is adults-only, opt-in with an unticked consent box,
  kept until unsubscribe and deleted within 30 days of a request;

  The visible text lives in privacy-strings.js (12 languages); this file only holds the structure.
