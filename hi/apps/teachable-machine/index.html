  <style>
    /* ---------- model status ---------- */
    #modelState { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    #modelState .ms-txt { flex: 1 1 220px; min-width: 0; }
    .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--primary); animation: tm-spin .8s linear infinite; flex: 0 0 auto; }
    @keyframes tm-spin { to { transform: rotate(360deg); } }

    /* ---------- lab layout ---------- */
    /* phone: camera, classes, test stacked · tablet: camera+test | classes · laptop/smartboard: camera | classes | test */
    .lab { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr); grid-template-areas: "cam" "teach" "test"; }
    .cam-card { grid-area: cam; }
    .teach-card { grid-area: teach; }
    .test-card { grid-area: test; }
    @media (min-width: 760px) {
      .lab { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "cam teach" "test teach"; }
      .classes { grid-template-columns: minmax(0, 1fr); }
    }
    @media (min-width: 1100px) {
      .lab { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "cam teach test"; }
    }
    .step { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; }
    .step .num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: .95rem; flex: 0 0 auto; }

    /* ---------- camera ---------- */
    .cam-box { position: relative; width: 100%; max-width: 440px; margin-inline: auto; aspect-ratio: 1 / 1; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
    .cam-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
    .cam-box video.mirror { transform: scaleX(-1); }
    .cam-off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; text-align: center; }
    .cam-off .big-ico { font-size: 3rem; line-height: 1; }
    .cam-label { position: absolute; inset-inline: 10px; bottom: 10px; display: flex; justify-content: center; pointer-events: none; }
    .cam-label span { background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--text); border: 2px solid var(--cc, var(--primary)); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 1.05rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec-dot { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--danger); color: #fff; font-weight: 700; font-size: .85rem; border-radius: 999px; padding: 3px 10px; display: flex; align-items: center; gap: 6px; }
    .rec-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: tm-blink 1s steps(2) infinite; }
    @keyframes tm-blink { 50% { opacity: .2; } }
    .cam-tools { justify-content: center; margin-top: 12px; }
    /* phone: while the camera is on, the camera card stays pinned under the header in a compact
       side-by-side layout (picture | buttons) so the class cards below still have room */
    @media (max-width: 759px) {
      .cam-card.sticky { position: sticky; top: var(--hdr, 0px); z-index: 20; box-shadow: var(--shadow-lg); padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .cam-card.sticky .step, .cam-card.sticky .cam-hint { display: none; }
      .cam-card.sticky .cam-box { flex: 0 0 auto; width: min(26vh, 58%); max-width: none; margin: 0; }
      .cam-card.sticky .cam-tools { flex: 1 1 0; min-width: 0; flex-direction: column; align-items: stretch; margin-top: 0; gap: 8px; }
      .cam-card.sticky .cam-tools .btn { white-space: normal; padding-inline: 8px; }
      .cam-card.sticky #camMsg { flex-basis: 100%; }
      .cam-card.sticky .cam-label { inset-inline: 4px; bottom: 6px; }
      .cam-card.sticky .cam-label span { font-size: .8rem; padding: 2px 8px; border-width: 2px; }
      .cam-card.sticky .rec-dot { top: 6px; inset-inline-start: 6px; font-size: .75rem; padding: 2px 8px; }
      #lab:fullscreen .cam-card.sticky { top: 0; }   /* no page header in full screen */
    }
    /* laptop / smartboard: camera and result columns stay in view while you scroll down to class 4 or 5 */
    @media (min-width: 1100px) and (min-height: 700px) {
      .cam-card, .test-card { position: sticky; top: calc(var(--hdr, 60px) + 12px); }
      #lab:fullscreen .cam-card, #lab:fullscreen .test-card { top: 0; }
    }

    /* ---------- classes ---------- */
    .teach-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .teach-head .step { margin: 0; }
    .teach-head .step { flex: 1 1 auto; min-width: 0; }
    .teach-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 300px; min-width: 0; max-width: 100%; justify-content: flex-end; }
    .teach-tools select { flex: 1 1 180px; width: 100%; max-width: 420px; min-width: 0; text-overflow: ellipsis; }
    .teach-tools .btn { flex: 0 0 auto; }
    .classes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
    .cls { border: 2px solid var(--border); border-inline-start: 6px solid var(--cc); border-radius: var(--radius); padding: 12px; background: var(--surface); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .cls.rec { border-color: var(--cc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc) 30%, transparent); }
    .cls-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
    .cls-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cc); flex: 0 0 auto; }
    .cls-name { flex: 1 1 150px; min-width: 0; width: 100%; font-weight: 700; }
    .cls-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .cls-count.has { background: color-mix(in srgb, var(--cc) 18%, var(--surface)); color: var(--text); border-color: var(--cc); }
    .thumbs { display: flex; gap: 4px; overflow-x: auto; min-height: 48px; align-items: center; padding-bottom: 2px; }
    .thumbs img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; border: 1px solid var(--border); }
    .thumbs .empty { color: var(--muted); font-size: .85rem; }
    .cls-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hold { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; flex: 1 1 160px; }
    .hold.active { background: var(--danger); border-color: var(--danger); color: #fff; }
    .hold .ico { font-size: 1.1em; }
    .cls-more { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ---------- prediction ---------- */
    .winner-box { text-align: center; padding: 14px 10px; border-radius: var(--radius); background: var(--surface-2); border: 2px solid var(--cc, var(--border)); margin-bottom: 14px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .winner-cap { color: var(--muted); font-size: .9rem; }
    .winner { font-size: clamp(1.6rem, 2.7vw, 2.6rem); font-weight: 800; line-height: 1.2; color: var(--cc, var(--text)); overflow-wrap: break-word; hyphens: auto; }
    @media (max-width: 759px) { .winner { font-size: clamp(1.6rem, 8vw, 2.4rem); } }
    .winner.idle { font-size: 1.05rem; font-weight: 600; color: var(--muted); }
    .winner-sub { font-weight: 700; font-variant-numeric: tabular-nums; }
    .bars { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
    .bar-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-pct { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: end; }
    .bar-track { grid-column: 1 / -1; height: 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: var(--cc); border-radius: inherit; transition: width .18s ease-out; }
    .test-prev { display: flex; gap: 10px; align-items: center; }
    .test-prev img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }

    /* Urdu Nastaliq needs taller lines, otherwise words overlap or get clipped */
    :root[lang="ur"] .winner { line-height: 1.75; }
    :root[lang="ur"] .winner.idle { line-height: 2; }
    :root[lang="ur"] .bar-name, :root[lang="ur"] .cam-label span, :root[lang="ur"] .step { line-height: 2; }
    /* .bar-name clips (ellipsis): the stroke of a first ک (کچھ نہیں) rises above the line box and past the start edge */
    :root[lang="ur"] .bar-name { padding-top: .5em; padding-inline-start: .6em; }
    :root[lang="ur"] .cls-name { min-height: 46px; text-indent: .4em; line-height: 2.2; }   /* else the first ک of کچھ نہیں is cut */
    /* shell workaround: the header title has overflow:hidden, and the stroke of the first Nastaliq letter
       (ک of کمپیوٹر) reaches past the start edge, so it was cut off. Give it room inside the clip box. */
    :root[lang="ur"] .edu-title { padding-inline-start: .5em; }

    /* ---------- inside the AI ---------- */
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.08rem; list-style-position: inside; }
    details.card[open] > summary { margin-bottom: 12px; }
    .inside-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
    .inside-grid h3 { font-size: 1rem; margin-bottom: .35em; }
    .inside-grid p { margin: 0; }
    .fp-wrap { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px; }
    #fp { width: 100%; height: auto; display: block; border-radius: 6px; image-rendering: pixelated; }
    .tips li { margin-bottom: 8px; }
    .tm-bottom { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }

    /* ---------- worksheet ---------- */
    .ws-table td { height: 2.4em; }
    .ws-lines { border-bottom: 1px solid var(--border); height: 2em; }
    .ws-head-line { display: flex; flex-wrap: wrap; gap: 6px 24px; }

    /* ---------- full screen (smartboard) ---------- */
    #lab:fullscreen { background: var(--bg); padding: 18px; overflow: auto; }
    #lab:fullscreen .cam-box { max-width: min(70vh, 640px); }
    #lab:fullscreen .winner { font-size: clamp(2.2rem, 6vw, 4rem); }
    #lab:fullscreen .winner.msg { font-size: 1.3rem; }

    @media print {
      #lab, #modelState, .tm-bottom, .edu-intro, #helpBox, #insideBox .fp-wrap, #insideBox .field, #kNote { display: none !important; }
      details.card > summary { list-style: none; }
      #wsBox > summary { display: none; }
      #wsBox { border: 0; padding: 0; }
      .ws-table td { height: 3em; }
      body.print-ws .edu-main > :not(#wsBox) { display: none !important; }
      .ws-table th, .ws-table td { border: 1px solid #888 !important; }
      .ws-lines { border-bottom: 1px solid #888; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="modelState" class="callout" data-state="loading" aria-live="polite">
      <span class="spin" id="msSpin" aria-hidden="true"></span>
      <span class="ms-txt" id="msText"></span>
      <button class="btn btn-sm" id="msRetry" type="button" data-i18n="try_again" hidden></button>
    </div>

    <section id="lab" class="lab">
      <!-- 1. camera -->
      <div class="card cam-card" id="camCard">
        <h2 class="step"><span class="num">1</span><span data-i18n="step_camera"></span></h2>
        <div class="cam-box" id="camBox">
          <video id="video" playsinline muted autoplay hidden></video>
          <div class="cam-off" id="camOff">
            <div class="big-ico" aria-hidden="true">📷</div>
            <p class="mb0" id="camOffMsg" data-i18n="cam_off_msg"></p>
            <button class="btn btn-primary btn-lg" id="camStart" type="button" data-i18n="cam_start"></button>
          </div>
          <div class="rec-dot" id="recDot" hidden><span data-i18n="recording"></span></div>
          <div class="cam-label" id="camLabel" hidden><span class="no-i18n" id="camLabelTxt"></span></div>
        </div>
        <div class="callout warning small" id="camMsg" role="alert" hidden></div>
        <div class="row cam-tools">
          <button class="btn" id="camStop" type="button" data-i18n="cam_stop" hidden></button>
          <button class="btn" id="camFlip" type="button" hidden><span aria-hidden="true">🔄</span> <span data-i18n="cam_flip"></span></button>
          <button class="btn" id="fsBtn" type="button" aria-pressed="false"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
        </div>
        <p class="muted small center cam-hint mb0" style="margin-top:10px" data-i18n="record_hint"></p>
      </div>

      <!-- 2. teach -->
      <div class="card teach-card" id="teachCard">
        <div class="teach-head">
          <h2 class="step"><span class="num">2</span><span data-i18n="step_teach"></span></h2>
          <div class="teach-tools">
            <label class="sr-only" for="preset" data-i18n="preset_label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></label>
            <select id="preset"></select>
            <button class="btn btn-accent" id="addClass" type="button"><span aria-hidden="true">＋</span> <span data-i18n="add_class"></span></button>
          </div>
        </div>
        <div class="classes" id="classes"></div>
      </div>
      <!-- 3. test -->
      <div class="card test-card" id="testCard">
        <h2 class="step"><span class="num">3</span><span data-i18n="step_test"></span></h2>
        <div class="winner-box" id="winnerBox">
          <div class="winner-cap" id="winnerCap" data-i18n="winner_cap" hidden></div>
          <div class="winner idle" id="winner" aria-live="polite"></div>
          <div class="winner-sub" id="winnerSub"></div>
        </div>
        <div class="bars" id="bars"></div>
        <p class="muted small" id="votesNote" style="margin-top:12px"></p>
        <div class="test-prev" id="testPrev" hidden>
          <img id="testImg" alt="">
          <button class="btn btn-sm" id="backLive" type="button" data-i18n="back_live"></button>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="testPhoto" type="button"><span aria-hidden="true">🖼️</span> <span data-i18n="test_photo"></span></button>
          <label class="check"><input type="checkbox" id="speakChk"> <span data-i18n="speak_result"></span></label>
        </div>
      </div>

    </section>

    <div class="tm-bottom">
      <button class="btn" id="saveModel" type="button"><span aria-hidden="true">💾</span> <span data-i18n="save_model"></span></button>
      <button class="btn" id="openModel" type="button"><span aria-hidden="true">📂</span> <span data-i18n="open_model"></span></button>
      <button class="btn btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      <span class="muted small grow" data-i18n="saved_note"></span>
    </div>

    <details class="card" id="insideBox" style="margin-top:16px">
      <summary data-i18n="inside_title"></summary>
      <div class="inside-grid">
        <div>
          <h3 data-i18n="in1_h"></h3>
          <p data-i18n="in1"></p>
          <div class="fp-wrap" style="margin-top:10px">
            <canvas id="fp" width="640" height="200" aria-hidden="true"></canvas>
            <p class="tiny muted mb0" style="margin-top:6px" data-i18n="fp_caption"></p>
          </div>
        </div>
        <div><h3 data-i18n="in2_h"></h3><p data-i18n="in2"></p></div>
        <div>
          <h3 data-i18n="in3_h"></h3><p data-i18n="in3"></p>
          <label class="field" style="margin-top:10px"><span id="kLabel"></span>
            <input type="range" id="kRange" min="1" max="20" step="1" value="10">
          </label>
          <p class="tiny muted mb0" id="kNote" hidden></p>
        </div>
        <div><h3 data-i18n="in4_h"></h3><p data-i18n="in4"></p></div>
        <div class="callout warning"><h3 data-i18n="in5_h"></h3><p data-i18n="in5"></p></div>
      </div>
    </details>

    <details class="card" id="helpBox" style="margin-top:16px">
      <summary data-i18n="help_ideas"></summary>
      <ul class="tips">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li><strong data-i18n="act_h"></strong> <span data-i18n="act1"></span></li>
        <li><strong data-i18n="act2_h"></strong> <span data-i18n="act2"></span></li>
      </ul>
    </details>

    <details class="card" id="wsBox" style="margin-top:16px">
      <summary data-i18n="ws_title"></summary>
      <div class="stack">
