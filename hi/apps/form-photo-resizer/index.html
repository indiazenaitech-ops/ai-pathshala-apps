  <style>
    .fpr-privacy { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
    .fpr-privacy .ic { font-size: 1.6rem; line-height: 1; flex: none; }
    .fpr-privacy strong { display: block; font-size: 1.05rem; }
    .fpr-privacy p { margin: 2px 0 0; font-size: .92rem; }

    /* two columns on wide screens; one column (setup → picture → adjust → result) on phones */
    .fpr-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); align-items: start; }
    .fpr-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 900px) {
      .fpr-layout { grid-template-columns: minmax(0, 1fr); }
      .fpr-col { display: contents; }
      #setupCard { order: 1; } #editCard { order: 2; } #adjustCard { order: 3; } #resultCard { order: 4; }
    }
    .fpr-step { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; margin: 0 0 10px; }
    .fpr-step .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); font-size: .9rem; font-weight: 800; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }

    .fpr-types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .fpr-types button {
      font: inherit; font-size: .92rem; font-weight: 700; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; min-height: 64px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; line-height: 1.2;
    }
    .fpr-types button .ic { font-size: 1.35rem; flex: none; }
    .fpr-types button > span:last-child { overflow-wrap: break-word; min-width: 0; }
    .fpr-types button:hover { background: var(--surface-2); }
    .fpr-types button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    :root[lang="ur"] .fpr-types button { line-height: 1.7; }
    #preset { width: 100%; }

    .fpr-spec { display: flex; flex-wrap: wrap; gap: 6px; }
    .fpr-spec .chip { cursor: default; font-variant-numeric: tabular-nums; }
    .fpr-spec .chip.main { background: var(--primary-soft); border-color: transparent; color: var(--text); }
    .fpr-note { font-size: .86rem; }
    .fpr-edit { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }
    .fpr-edit .full { grid-column: 1 / -1; }
    .fpr-edit input[type="number"], .fpr-edit select { width: 100%; }
    .fpr-wh { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: end; }
    .fpr-lock { min-width: 40px; height: 40px; padding: 0; font-size: 1.05rem; }

    /* picture area */
    .fpr-drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center; background: var(--surface-2); transition: border-color .15s, background .15s; }
    .fpr-drop.over, .fpr-stage.over { border-color: var(--accent); background: var(--accent-soft); }
    .fpr-drop .big { font-size: 2.4rem; line-height: 1; margin-bottom: 8px; }
    .fpr-drop .row { justify-content: center; margin-top: 12px; }
    .fpr-stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); }
    #editor { display: block; width: 100%; height: 440px; touch-action: none; cursor: grab; }
    #editor:active { cursor: grabbing; }
    #editor:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    @media (max-width: 560px) { #editor { height: 360px; } }
    .fpr-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .fpr-tools .edu-iconbtn { width: 42px; height: 42px; font-size: 1.15rem; }
    .fpr-slider { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 0; }
    .fpr-slider label, .fpr-slider > span:first-child { white-space: nowrap; font-size: .86rem; font-weight: 600; }
    .fpr-slider input { flex: 1 1 auto; min-width: 60px; }
    .fpr-slider output { min-width: 3.6em; text-align: end; font-variant-numeric: tabular-nums; font-size: .86rem; color: var(--muted); font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .fpr-range { display: grid; gap: 4px; }
    .fpr-range .top { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; font-weight: 600; }
    .fpr-range output { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .fpr-help { font-size: .84rem; color: var(--muted); margin: 0; }

    /* result */
    .fpr-result-img { display: grid; place-items: center; padding: 14px; border-radius: var(--radius-sm); min-height: 150px;
      background-color: var(--surface-2);
      background-image: linear-gradient(45deg, var(--surface-3) 25%, transparent 25%), linear-gradient(-45deg, var(--surface-3) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--surface-3) 75%), linear-gradient(-45deg, transparent 75%, var(--surface-3) 75%);
      background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
    #outImg { display: block; max-width: 100%; height: auto; box-shadow: 0 0 0 1px rgba(0,0,0,.25), var(--shadow); background: transparent; }
    .fpr-stats { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .fpr-stats th, .fpr-stats td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }
    .fpr-stats th { font-weight: 600; color: var(--muted); width: 38%; }
    .fpr-stats td { font-weight: 700; font-variant-numeric: tabular-nums; }
    .fpr-stats td bdi { unicode-bidi: isolate; }
    .fpr-ok { color: var(--success); }
    .fpr-bad { color: var(--danger); }
    #download { width: 100%; }
    #downloadTxt { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: .45em; row-gap: 2px; }
    #download .fname { font-family: var(--mono); font-size: .85em; font-weight: 600; overflow-wrap: anywhere; }
    .field > .seg { align-self: flex-start; }
    .fpr-empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 2px dashed var(--border); border-radius: var(--radius-sm); }
    .fpr-busy { opacity: .55; transition: opacity .15s; }

    /* print sheet: copies at true size */
    #printArea { color: #000; background: #fff; }
    .pr-sheet { display: flex; flex-wrap: wrap; gap: 4mm; align-content: flex-start; padding: 2mm; }
    .pr-sheet img { display: block; outline: .2mm dashed #888; outline-offset: 1mm; }
    @media print {
      @page { size: A4; margin: 10mm; }
      #app > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success fpr-privacy" role="note">
      <span class="ic" aria-hidden="true">🔒</span>
      <div><strong data-i18n="privacy_head"></strong><p data-i18n="privacy_body"></p></div>
    </div>

    <div class="fpr-layout">
      <div class="fpr-col">
        <!-- 1 + 2: what and which form -->
        <section class="card stack" id="setupCard">
          <h2 class="fpr-step"><span class="num">1</span><span data-i18n="step_type"></span></h2>
          <div class="fpr-types" role="group" id="types" data-i18n-aria-label="step_type">
            <button type="button" id="type-photo" data-type="photo"><span class="ic" aria-hidden="true">🧑</span><span data-i18n="type_photo"></span></button>
            <button type="button" id="type-sign" data-type="sign"><span class="ic" aria-hidden="true">✍️</span><span data-i18n="type_sign"></span></button>
            <button type="button" id="type-thumb" data-type="thumb"><span class="ic" aria-hidden="true">👍</span><span data-i18n="type_thumb"></span></button>
            <button type="button" id="type-decl" data-type="decl"><span class="ic" aria-hidden="true">📝</span><span data-i18n="type_decl"></span></button>
          </div>

          <label class="field">
            <span class="fpr-step mb0" style="font-size:1.02rem;color:var(--text);font-weight:700"><span class="num">2</span><span data-i18n="step_form"></span></span>
            <select id="preset" class="no-i18n"></select>
          </label>

          <div class="panel stack" id="specBox" aria-live="polite">
            <div class="row spread">
              <strong data-i18n="req_title"></strong>
              <span class="badge accent" id="editedBadge" data-i18n="edited_badge" hidden></span>
            </div>
            <div class="fpr-spec" id="specChips"></div>
            <p class="fpr-note mb0" id="specNote" hidden></p>
            <p class="tiny muted mb0" id="specChecked"></p>
            <div class="row">
              <button class="btn btn-sm" type="button" id="editToggle" aria-expanded="false" aria-controls="editBox"><span aria-hidden="true">⚙️</span> <span data-i18n="edit_spec"></span></button>
              <button class="btn btn-sm btn-ghost" type="button" id="restore" data-i18n="restore" hidden></button>
            </div>
          </div>

          <div class="fpr-edit" id="editBox" hidden>
            <div class="field full">
              <span data-i18n="units"></span>
              <div class="seg" role="group" id="unitSeg" data-i18n-aria-label="units">
                <button type="button" data-unit="px" id="unit-px" data-i18n="unit_px"></button>
                <button type="button" data-unit="cm" id="unit-cm" data-i18n="unit_cm"></button>
              </div>
            </div>
            <div class="fpr-wh full">
              <label class="field"><span data-i18n="width"></span><input type="number" id="inW" min="1" step="1" inputmode="decimal"></label>
              <button class="btn fpr-lock" type="button" id="lockBtn" aria-pressed="true" data-i18n-aria-label="lock_ratio" data-i18n-title="lock_ratio">🔗</button>
              <label class="field"><span data-i18n="height"></span><input type="number" id="inH" min="1" step="1" inputmode="decimal"></label>
            </div>
            <label class="field"><span data-i18n="dpi_label"></span>
              <select id="inDpi" class="no-i18n">
                <option value="72">72</option><option value="96">96</option><option value="100">100</option><option value="150">150</option>
                <option value="200">200</option><option value="240">240</option><option value="300">300</option><option value="600">600</option>
              </select>
            </label>
            <label class="field"><span data-i18n="format"></span>
              <select id="inFmt" class="no-i18n"><option value="jpg">JPG</option><option value="png">PNG</option></select>
            </label>
            <label class="field"><span data-i18n="min_kb"></span><input type="number" id="inMin" min="0" step="any" inputmode="decimal"></label>
            <label class="field"><span data-i18n="max_kb"></span><input type="number" id="inMax" min="0" step="any" inputmode="decimal"></label>
            <label class="check full"><input type="checkbox" id="inFlex"> <span data-i18n="allow_smaller"></span></label>
            <p class="callout danger small mb0 full" id="specErr" role="alert" hidden></p>
          </div>
        </section>

        <!-- 5: result -->
        <section class="card stack" id="resultCard">
          <h2 class="fpr-step"><span class="num">5</span><span data-i18n="step_result"></span></h2>
          <div class="fpr-empty" id="resultEmpty" data-i18n="result_empty"></div>
          <div id="result" class="stack" hidden>
            <div class="fpr-result-img"><img id="outImg" alt="" data-i18n-alt="result_alt"></div>
            <div aria-live="polite" id="resultLive">
              <table class="fpr-stats">
                <tbody>
                  <tr><th scope="row" data-i18n="r_pixels"></th><td id="rPx"></td></tr>
                  <tr><th scope="row" data-i18n="r_print"></th><td id="rPrint"></td></tr>
                  <tr><th scope="row" data-i18n="r_file"></th><td id="rFile"></td></tr>
                  <tr id="rQualRow"><th scope="row" data-i18n="r_quality"></th><td id="rQual"></td></tr>
                </tbody>
              </table>
              <p class="callout small mb0" id="status" style="margin-top:10px"></p>
            </div>
            <button class="btn btn-primary btn-lg" type="button" id="download"><span id="downloadTxt"></span></button>
            <p class="tiny muted mb0" data-i18n="kb_note"></p>
            <details>
              <summary data-i18n="print_title"></summary>
              <div class="stack" style="margin-top:10px">
                <p class="small muted mb0" id="printNote"></p>
                <div class="row">
                  <label class="field" style="flex:1 1 140px"><span data-i18n="copies"></span>
                    <select id="copies" class="no-i18n"><option>1</option><option>2</option><option>4</option><option>6</option><option selected>8</option><option>12</option><option>16</option><option>24</option></select>
                  </label>
                  <button class="btn" type="button" id="printBtn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
                </div>
              </div>
            </details>
          </div>
        </section>
      </div>

      <div class="fpr-col">
        <!-- 3: picture + crop -->
        <section class="card stack" id="editCard">
          <div class="row spread">
            <h2 class="fpr-step mb0"><span class="num">3</span><span data-i18n="step_add"></span></h2>
            <button class="btn btn-sm" type="button" id="changePic" hidden><span aria-hidden="true">🔄</span> <span data-i18n="change_pic"></span></button>
          </div>
          <div class="fpr-drop" id="drop">
            <div class="big" aria-hidden="true">🖼️</div>
            <p class="mb0" style="font-weight:700" data-i18n="drop_hint"></p>
            <p class="small muted mb0" data-i18n="formats_hint"></p>
            <div class="row">
              <button class="btn btn-primary" type="button" id="pickBtn"><span aria-hidden="true">📁</span> <span data-i18n="choose_file"></span></button>
              <button class="btn" type="button" id="camBtn"><span aria-hidden="true">📷</span> <span data-i18n="take_photo"></span></button>
              <button class="btn" type="button" id="pasteBtn"><span aria-hidden="true">📋</span> <span data-i18n="paste"></span></button>
              <button class="btn btn-ghost" type="button" id="sample"><span aria-hidden="true">✨</span> <span data-i18n="try_sample"></span></button>
            </div>
          </div>
          <input type="file" id="fileIn" accept="image/*" hidden>
          <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
          <p class="callout danger small mb0" id="loadErr" role="alert" hidden></p>

          <div id="editWrap" class="stack" hidden>
            <p class="small muted mb0" id="loadInfo" aria-live="polite"></p>
            <div class="fpr-stage" id="stage">
              <canvas id="editor" tabindex="0" role="img" data-i18n-aria-label="editor_label"></canvas>
            </div>
            <p class="fpr-help" id="cropHelp"></p>
            <div class="fpr-tools">
              <button class="edu-iconbtn" type="button" id="rotL" data-i18n-aria-label="rotate_left" data-i18n-title="rotate_left">⟲</button>
              <button class="edu-iconbtn" type="button" id="rotR" data-i18n-aria-label="rotate_right" data-i18n-title="rotate_right">⟳</button>
              <div class="fpr-slider">
                <label for="straighten" data-i18n="straighten"></label>
                <input type="range" id="straighten" min="-15" max="15" step="0.5" value="0">
                <output id="straightenOut" for="straighten" dir="ltr">0°</output>
              </div>
            </div>
            <div class="fpr-tools">
              <button class="edu-iconbtn" type="button" id="zoomOut" data-i18n-aria-label="zoom_out" data-i18n-title="zoom_out">−</button>
              <div class="fpr-slider">
                <label for="zoom" data-i18n="zoom"></label>
                <input type="range" id="zoom" min="0" max="1000" step="1" value="300">
              </div>
              <button class="edu-iconbtn" type="button" id="zoomIn" data-i18n-aria-label="zoom_in" data-i18n-title="zoom_in">+</button>
              <button class="btn btn-sm" type="button" id="fillBtn" data-i18n="fill"></button>
              <button class="btn btn-sm" type="button" id="fitBtn" data-i18n="fit"></button>
              <button class="btn btn-sm btn-accent" type="button" id="autoCrop" hidden><span aria-hidden="true">✂️</span> <span data-i18n="autocrop"></span></button>
            </div>
          </div>
        </section>

        <!-- 4: adjust -->
        <section class="card stack" id="adjustCard">
          <h2 class="fpr-step"><span class="num">4</span><span data-i18n="step_adjust"></span></h2>
          <div class="grid-2">
            <div class="fpr-range">
              <div class="top"><label for="bright" data-i18n="brightness"></label><output id="brightOut" for="bright" dir="ltr">0</output></div>
              <input type="range" id="bright" min="-50" max="50" step="1" value="0">
            </div>
            <div class="fpr-range">
              <div class="top"><label for="contrast" data-i18n="contrast"></label><output id="contrastOut" for="contrast" dir="ltr">0</output></div>
              <input type="range" id="contrast" min="-50" max="50" step="1" value="0">
            </div>
          </div>

          <div id="photoTools" class="stack">
            <div class="fpr-range">
              <div class="top"><label for="whiten" data-i18n="whiten_bg"></label><output id="whitenOut" for="whiten" dir="ltr">0</output></div>
              <input type="range" id="whiten" min="0" max="100" step="1" value="0">
              <p class="fpr-help" data-i18n="whiten_help"></p>
            </div>
            <label class="check"><input type="checkbox" id="faceGuide" checked> <span data-i18n="face_guide"></span></label>
            <div class="panel stack">
              <label class="check"><input type="checkbox" id="stripOn"> <span data-i18n="strip_on"></span></label>
              <p class="fpr-help" data-i18n="strip_help"></p>
              <div class="grid-2" id="stripFields">
                <label class="field"><span data-i18n="strip_name"></span><input type="text" id="stripName" maxlength="40" dir="auto" autocomplete="name" data-i18n-placeholder="strip_name_ph"></label>
                <label class="field"><span data-i18n="strip_date"></span><input type="date" id="stripDate"></label>
              </div>
            </div>
          </div>

          <div id="paperTools" class="stack" hidden>
            <label class="check"><input type="checkbox" id="shadow" checked> <span data-i18n="remove_shadow"></span></label>
            <label class="check"><input type="checkbox" id="clean" checked> <span data-i18n="clean_ink"></span></label>
            <div class="fpr-range" id="thickWrap">
              <div class="top"><label for="thick" data-i18n="ink_thick"></label><output id="thickOut" for="thick" dir="ltr">50</output></div>
              <input type="range" id="thick" min="0" max="100" step="1" value="50">
            </div>
            <div class="field" id="inkWrap">
              <span data-i18n="ink_colour"></span>
              <div class="seg" role="group" id="inkSeg" data-i18n-aria-label="ink_colour">
                <button type="button" data-ink="auto" id="ink-auto" data-i18n="ink_auto"></button>
                <button type="button" data-ink="black" id="ink-black" data-i18n="ink_black"></button>
                <button type="button" data-ink="blue" id="ink-blue" data-i18n="ink_blue"></button>
              </div>
            </div>
            <label class="check" id="transWrap"><input type="checkbox" id="transparent"> <span data-i18n="transparent"></span></label>
            <p class="fpr-help" id="transHelp" data-i18n="transparent_help"></p>
          </div>
        </section>
      </div>
    </div>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>

    <div id="printArea" class="print-only"></div>
  </main>
  <script src="../../../apps/form-photo-resizer/../../shared/edu.js"></script>
  <script src="../../../apps/form-photo-resizer/strings.js"></script>
  <script src="../../../apps/form-photo-resizer/data.js"></script>
  <script src="../../../apps/form-photo-resizer/app.js"></script>
</body>
</html>
