                <div class="field"><span data-i18n="photo_shape"></span>
                  <div class="seg" id="shapeSeg" role="group" data-i18n-aria-label="photo_shape">
                    <button type="button" data-shape="circle" data-i18n="shape_circle"></button>
                    <button type="button" data-shape="arch" data-i18n="shape_arch"></button>
                    <button type="button" data-shape="round" data-i18n="shape_round"></button>
                  </div>
                </div>
                <label class="field"><span data-i18n="photo_zoom"></span><input type="range" id="photoZoom" min="1" max="3" step="0.05" value="1"></label>
                <p class="tiny muted mb0" data-i18n="photo_hint"></p>
              </div>
            </div>
          </div>
          <p class="callout warning small mb0" id="photoWarn" hidden></p>
        </section>

        <section class="card stack" aria-labelledby="qrH">
          <h2 class="mb0" id="qrH" data-i18n="qr_title"></h2>
          <div class="seg" id="qrSeg" role="group" data-i18n-aria-label="qr_title">
            <button type="button" data-qr="none" data-i18n="qr_none"></button>
            <button type="button" data-qr="upi" data-i18n="qr_upi"></button>
            <button type="button" data-qr="wa" data-i18n="qr_wa"></button>
            <button type="button" data-qr="link" data-i18n="qr_link"></button>
          </div>
          <label class="field" id="upiField" hidden><span data-i18n="upi_label"></span><input type="text" id="upiId" dir="ltr" maxlength="80" placeholder="yourshop@oksbi" autocomplete="off" spellcheck="false" autocapitalize="off" class="no-i18n"></label>
          <label class="field" id="linkField" hidden><span data-i18n="link_label"></span><input type="url" id="linkUrl" dir="ltr" maxlength="300" placeholder="https://" autocomplete="off" spellcheck="false" class="no-i18n"></label>
          <p class="small mb0" id="qrMsg" aria-live="polite"></p>
          <p class="tiny muted mb0" id="qrCheck" data-i18n="qr_check" hidden></p>
        </section>

        <section class="card stack" aria-labelledby="styleH">
          <h2 class="mb0" id="styleH" data-i18n="style_title"></h2>
          <div class="field"><span data-i18n="colours"></span><div class="row" id="palSwatches" role="group" data-i18n-aria-label="colours"></div></div>
          <div class="field"><span data-i18n="font_label"></span>
            <div class="seg" id="fontSeg" role="group" data-i18n-aria-label="font_label">
              <button type="button" data-font="simple" data-i18n="font_simple"></button>
              <button type="button" data-font="festive" data-i18n="font_festive"></button>
            </div>
            <p class="tiny muted mb0" data-i18n="font_note"></p>
          </div>
          <div class="row"><button class="btn" id="shuffleBtn" type="button"><span aria-hidden="true">🎲</span> <span data-i18n="shuffle"></span></button></div>
        </section>
      </div>
    </div>

    <details class="card no-print" id="helpBox">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>

    <div id="printArea" class="print-only"><img id="printImg" alt=""></div>
  </main>
  <script src="../../../apps/festival-poster-maker/../../shared/edu.js"></script>
  <script src="../../../apps/festival-poster-maker/strings.js"></script>
  <script src="../../../apps/festival-poster-maker/content.js"></script>
  <script src="../../../apps/festival-poster-maker/data.js"></script>
  <script src="../../../apps/festival-poster-maker/qr.js"></script>
  <script src="../../../apps/festival-poster-maker/art.js"></script>
  <script src="../../../apps/festival-poster-maker/app.js"></script>
</body>
</html>
