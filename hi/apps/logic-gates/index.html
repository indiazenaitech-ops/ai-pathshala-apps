  <style>
    :root { --wire-on: var(--success); --wire-off: #a3adb1; --led: #ffc21a; --led-ink: #3a2a00; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wire-off: #4d6169; } }
    :root[data-theme="dark"] { --wire-off: #4d6169; }

    /* tab bar + tools */
    .lg-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .lg-bar .tabs { border-bottom: 0; margin-bottom: 0; flex: 1 1 auto; }
    .tabs button { min-height: 46px; font-size: 1.02rem; }
    .lg-tools { display: flex; gap: 6px; padding-bottom: 6px; margin-inline-start: auto; }
    @media (max-width: 560px) {
      .lg-bar .tabs { flex-basis: 100%; }
      .tabs button { flex: 1 1 40%; white-space: normal; padding: 8px 6px; line-height: 1.25; }
      .lg-tools { padding-block: 4px 8px; }
    }
    section[role="tabpanel"] { margin-bottom: 16px; }
    h2.panel-h { font-size: 1.3rem; margin: 0; }
    h3 { margin-bottom: .35em; }

    /* gate picker */
    .pick-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .pick-lbl { font-weight: 700; color: var(--muted); min-width: 4.5rem; }
    .gchips { gap: 8px; }
    .gchip { min-height: 46px; min-width: 70px; justify-content: center; font-size: 1.02rem; letter-spacing: .03em; font-family: var(--mono); font-weight: 800; }
    .seg button { min-height: 42px; }

    .gx-grid, .ad-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .gx-grid, .ad-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
    .gx-svg .lg-svg { max-width: 640px; margin-inline: auto; }
    .gx-read { font-size: 1.2rem; font-weight: 800; text-align: center; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
    #gx-name { font-size: 1.3rem; margin-bottom: 4px; }

    /* Boolean expressions with an overbar for NOT (NCERT style) */
    .expr-big { font-size: clamp(1.35rem, 3.4vw, 2rem); font-weight: 700; font-family: "Cambria Math", "STIX Two Math", "Noto Sans Math", var(--mono); line-height: 1.6; overflow-wrap: anywhere; unicode-bidi: isolate; }
    .ov { display: inline-block; border-top: 2px solid currentColor; padding-top: 2px; line-height: 1.15; margin-inline: 1px; }
    .eq-p { min-height: 1.6em; font-family: "Cambria Math", "STIX Two Math", var(--mono); font-size: 1.15rem; color: var(--muted); overflow-wrap: anywhere; }

    /* SVG drawings */
    .lg-svg { display: block; width: 100%; height: auto; direction: ltr; font-family: var(--font); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .lg-svg text { text-anchor: middle; }
    :root[lang="ur"] .lg-svg { font-family: "Noto Sans", system-ui, sans-serif; }
    .g-body { fill: var(--surface); stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; }
    .g-line { fill: none; stroke: var(--text); stroke-width: 2.5; }
    .g-lbl { fill: var(--muted); font-weight: 800; letter-spacing: .03em; }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .w.off { stroke: var(--wire-off); }
    .w.on { stroke: var(--wire-on); stroke-width: 4.5; }
    .w.plain { stroke: var(--text); stroke-width: 2.5; }
    .jd.on { fill: var(--wire-on); } .jd.off { fill: var(--wire-off); }
    .sw, .pill:not(.const) { cursor: pointer; outline: none; }
    .sw-hit { fill: transparent; stroke: none; }
    .sw:hover .sw-hit, .pill:not(.const):hover .pill-b { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
    .sw:focus-visible .sw-hit { stroke: var(--accent); stroke-width: 3; }
    .sw-l { fill: var(--text); font-weight: 800; font-size: 22px; }
    .sw-track { fill: var(--surface-3); stroke: var(--wire-off); stroke-width: 1.5; }
    .sw.on .sw-track { fill: var(--wire-on); stroke: var(--wire-on); }
    .sw-knob { fill: #fff; stroke: rgba(0, 0, 0, .3); stroke-width: 1; }
    .sw-v { fill: #1b2a30; font-weight: 800; font-size: 15px; }
    .led-b { stroke: var(--text); stroke-width: 2; }
    .led.off .led-b { fill: var(--surface-3); }
    .led.on .led-b { fill: var(--led); }
    .led-glow { fill: var(--led); opacity: 0; }
    .led.on .led-glow { opacity: .35; }
    .led-v { font-weight: 800; }
    .led.on .led-v { fill: var(--led-ink); } .led.off .led-v { fill: var(--muted); }
    .led-l { fill: var(--text); font-weight: 800; font-size: 18px; }
    .pill-b { fill: var(--surface-2); stroke: var(--text); stroke-width: 1.5; }
    .pill.on .pill-b { fill: var(--wire-on); stroke: var(--wire-on); }
    .pill:not(.const):hover .pill-b { stroke: var(--accent); }
    .pill:focus-visible .pill-b { stroke: var(--accent); stroke-width: 3.5; }
    .pill-t { fill: var(--text); font-weight: 800; font-size: 16px; }
    .pill.on .pill-t { fill: var(--surface); }
    .pill.const .pill-b { stroke-dasharray: 4 3; }
    .val { font-size: 12px; font-weight: 800; text-anchor: start !important; }
    .val.on { fill: var(--wire-on); } .val.off { fill: var(--muted); }
    .sym-l { fill: var(--text); font-weight: 800; font-size: 16px; }
    .circ-wrap { border: 1px solid var(--border); border-radius: 12px; padding: 8px; background: var(--surface); }
    .circ-wrap .lg-svg { max-width: 100%; margin-inline: auto; }
    .ad-svg .lg-svg { max-width: 680px; margin-inline: auto; }

    /* truth tables */
    .tt { width: auto; min-width: 150px; font-variant-numeric: tabular-nums; }
    .tt th, .tt td { text-align: center; padding: 6px 14px; vertical-align: middle; }
    .tt th { white-space: nowrap; font-family: "Cambria Math", "STIX Two Math", var(--mono); font-size: 1rem; }
    .tt td { font-size: 1.08rem; font-family: var(--mono); }
    .tt td.zero { color: var(--muted); }
    .tt td.one { font-weight: 800; color: var(--text); }
    .tt th.o, .tt td.o { background: var(--primary-soft); border-inline-start: 2px solid var(--primary); }
    .tt th.o + th.o, .tt td.o + td.o { border-inline-start: 1px solid var(--border); }
    .tt td.o.one { color: var(--primary); }
    .tt th.s, .tt td.s { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
    .tt th.txt { font-family: var(--font); font-size: .9rem; }
    .tt .idx { color: var(--muted); font-size: .8rem; padding-inline: 8px; }
    /* truth tables read left to right in every language: their scroll box is LTR, so a wide table starts at
       column A (not cut off on the left in Urdu), and in RTL a narrow table still sits on the right */
    :root[dir="rtl"] .tt-wrap > table { margin-left: auto; }
    .tt.clickable tbody tr { cursor: pointer; }
    .tt.clickable tbody tr:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .tt tbody tr.cur td { background: var(--accent-soft); }
    .tt tbody tr.cur td:first-child { box-shadow: inset 5px 0 0 var(--accent); }
    .tt tbody tr.cur td.o { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
    .tt tbody tr.diff td { background: var(--danger-soft); }
    .tt td.mark { font-weight: 800; font-size: 1.1rem; }
    .tt td.mark.ok { color: var(--success); } .tt td.mark.bad { color: var(--danger); }

    /* expression lab */
    .expr-in { width: 100%; font-size: 1.35rem; font-family: var(--mono); letter-spacing: .02em; min-height: 50px; }
    .expr-in[aria-invalid="true"] { border-color: var(--danger); outline-color: var(--danger); }
    .x-label { font-size: 1.05rem; }
    .x-keys { gap: 6px; }
    .x-keys button { min-width: 46px; min-height: 44px; font-size: 1.15rem; font-family: var(--mono); padding: 6px 10px; }
    .x-ex { gap: 8px; align-items: center; }
    .x-ex .chip { font-size: .95rem; min-height: 40px; }
    .x-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1000px) { .x-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
    .bit-t { min-width: 76px; font-family: var(--mono); font-size: 1.05rem; }
    .bit-t[aria-pressed="true"] { background: var(--wire-on); border-color: var(--wire-on); color: var(--surface); }
    #eq-laws { gap: 8px; }
    #eq-laws .chip { min-height: 40px; }
    .eq-big { display: block; font-size: 1.15rem; }
    .result-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }

    /* adders */
    .eqs { font-family: "Cambria Math", "STIX Two Math", var(--mono); font-size: 1.25rem; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
    .add-eq { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; font-variant-numeric: tabular-nums; }
    .four-wrap { overflow-x: auto; padding-block: 4px; }
    .four-grid { --fb: 52px; display: grid; grid-template-columns: minmax(48px, 88px) repeat(5, var(--fb)) minmax(64px, auto); gap: 6px; align-items: center; width: max-content; max-width: 100%; margin-inline: auto; }
    @media (max-width: 440px) {
      .four-grid { --fb: 40px; gap: 4px; grid-template-columns: 50px repeat(5, var(--fb)) minmax(46px, auto); }
      .four-grid .f-dec { font-size: 1.05rem; padding-inline-start: 2px; }
      .four-grid .f-big { font-size: 1.15rem; }
      .four-grid .f-bit, .four-grid .f-sum { font-size: 1.2rem; border-radius: 10px; }
      .four-grid .f-sum { border-radius: 50%; }
    }
    @media (max-width: 370px) { .four-grid { --fb: 34px; grid-template-columns: 44px repeat(5, var(--fb)) minmax(42px, auto); } }
    .f-cell { text-align: center; min-width: 0; }
    .f-lbl { text-align: end; padding-inline-end: 4px; font-weight: 700; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; }
    .f-lbl.tiny { font-size: .72rem; }
    .f-big { font-size: 1.35rem; font-family: var(--mono); }
    .f-pv { font-size: .85rem; font-family: var(--mono); }
    .f-carry { font-weight: 800; font-family: var(--mono); font-size: 1.05rem; }
    .f-carry.on { color: var(--accent); } .f-carry.off { color: var(--muted); opacity: .55; }
    .f-bit { width: var(--fb); height: var(--fb); border-radius: 12px; border: 2px solid var(--border); background: var(--surface-2); font: inherit; font-family: var(--mono); font-size: 1.45rem; font-weight: 800; color: var(--text); cursor: pointer; padding: 0; }
    .f-bit.on { background: var(--wire-on); border-color: var(--wire-on); color: var(--surface); }
    .f-rule { grid-column: 1 / -1; border-top: 3px solid var(--text); margin: 2px 0; }
    .f-sum { width: var(--fb); height: var(--fb); border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 1.45rem; font-weight: 800; border: 2px solid var(--text); background: var(--surface-3); color: var(--muted); }
    .f-sum.on { background: var(--led); color: var(--led-ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--led) 35%, transparent); }
    .f-c4.off { opacity: .35; }
    .f-dec { font-size: 1.3rem; font-weight: 800; text-align: start; padding-inline-start: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .f-total { color: var(--primary); }

    /* practice */
    .score-row { gap: 8px; }
    .score-row .badge { font-size: .92rem; padding: 4px 10px; }
    .q-ask { font-weight: 700; font-size: 1.1rem; margin: 0; }
    .q-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
    .q-sym .lg-svg { width: 210px; }
    .q-name { font-weight: 800; font-size: 1.2rem; }
    .q-tt td, .q-tt th { padding: 4px 16px; }
    .cell-btn { min-width: 56px; min-height: 42px; border-radius: 10px; border: 2px dashed var(--primary); background: var(--surface); color: var(--text); font: inherit; font-family: var(--mono); font-size: 1.25rem; font-weight: 800; cursor: pointer; }
    .cell-btn:hover { background: var(--primary-soft); }
    .cell-btn.ok { border: 2px solid var(--success); background: var(--success-soft); color: var(--success); }
    .cell-btn.bad { border: 2px solid var(--danger); background: var(--danger-soft); color: var(--danger); }
    .cell-btn.shown { border-style: solid; cursor: default; }
    .name-opts { gap: 8px; }
    .name-opt { min-width: 96px; font-family: var(--mono); letter-spacing: .03em; }
    .name-opt.ok, .name-opt.bad { opacity: 1 !important; }
    .name-opt.ok { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .name-opt.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

    .help { margin-top: 8px; }
    .help summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    .help li { margin-bottom: 6px; }
    details.card > summary { cursor: pointer; font-weight: 700; min-height: 32px; }

    :root[lang="ur"] .tt th, :root[lang="ur"] .tt td, :root[lang="ur"] .f-cell, :root[lang="ur"] .bit-t, :root[lang="ur"] .add-eq, :root[lang="ur"] .gx-read { font-family: "Noto Sans", var(--mono), sans-serif; line-height: 1.5; }

    .edu-fullscreen-on .edu-intro, .edu-fullscreen-on .help { display: none; }
    .edu-fullscreen-on .edu-main { max-width: none; }
    .edu-fullscreen-on .gx-svg .lg-svg { max-width: 900px; }

    #worksheet { display: none; }
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .lg-bar, .help, .x-keys, .x-ex, #x-toggles, .score-row, #eq-laws { display: none !important; }
      details.card:not([open]) { display: none; }
      .gx-grid, .ad-grid, .x-grid { grid-template-columns: 1fr 1fr; }
      .tt { font-size: .9rem; }
      body.print-ws #app > *:not(#worksheet) { display: none !important; }
      body.print-ws #worksheet { display: block !important; color: #000; }
      .ws-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid #000; padding-bottom: 4px; }
      .ws-h { margin: 0; font-size: 1.3rem; }
      .ws-meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 12px 0; }
      .ws-line { display: inline-block; min-width: 150px; border-bottom: 1px solid #000; }
      /* 3 columns + compact cells: all 8 questions fit on ONE sheet (the answer key is on the next page) */
      .ws-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .ws-q { border: 1px solid #888; border-radius: 8px; padding: 6px 8px; break-inside: avoid; }
      .ws-qt { font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
      .expr-ws { font-family: "Cambria Math", "STIX Two Math", serif; font-size: 1.02rem; font-weight: 700; }
      .ws-sym .lg-svg { width: 132px; }
      .ws-tt { border-collapse: collapse; margin-top: 4px; }
      .ws-tt th, .ws-tt td { border: 1px solid #555; padding: 1px 10px; text-align: center; font-family: var(--mono); font-size: .92rem; line-height: 1.35; }
      .ws-tt td.blank { min-width: 52px; }
      .ws-key { break-before: page; }
      .ws-keylist { font-family: var(--mono); line-height: 1.9; }
    }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="lg-bar no-print">
      <div class="tabs" role="tablist" data-i18n-aria-label="app_title">
        <button type="button" role="tab" id="tab-gates" aria-controls="p-gates" data-i18n="tab_gates"></button>
        <button type="button" role="tab" id="tab-expr" aria-controls="p-expr" data-i18n="tab_expr"></button>
        <button type="button" role="tab" id="tab-adders" aria-controls="p-adders" data-i18n="tab_adders"></button>
        <button type="button" role="tab" id="tab-practice" aria-controls="p-practice" data-i18n="tab_practice"></button>
      </div>
      <div class="lg-tools">
        <button type="button" class="btn btn-sm" id="btn-fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
        <button type="button" class="btn btn-sm btn-danger" id="btn-reset" data-i18n="reset"></button>
      </div>
    </div>

    <!-- ===================== gate explorer ===================== -->
    <section id="p-gates" role="tabpanel" aria-labelledby="tab-gates" class="stack">
      <div class="card stack no-print">
        <div class="pick-row">
          <span class="pick-lbl" id="pick-lbl" data-i18n="choose_gate"></span>
          <div class="row gchips" id="gate-chips" role="group" aria-labelledby="pick-lbl"></div>
        </div>
        <div class="pick-row" id="nin-row">
          <span class="pick-lbl" id="nin-lbl" data-i18n="inputs"></span>
          <div class="seg" id="nin-seg" role="group" aria-labelledby="nin-lbl">
            <button type="button" data-n="2"></button><button type="button" data-n="3"></button>
          </div>
        </div>
      </div>
      <div class="gx-grid">
        <div class="card">
          <h2 id="gx-name"></h2>
          <div id="gx-svg" class="gx-svg"></div>
          <p class="gx-read" id="gx-read" dir="ltr" aria-live="polite"></p>
          <p class="muted small mb0" data-i18n="tap_switch"></p>
          <p class="muted tiny mb0 no-print" data-i18n="kbd_hint"></p>
        </div>
        <div class="card stack">
          <div>
            <h3 data-i18n="expression"></h3>
            <div class="expr-big" id="gx-expr" dir="ltr"></div>
          </div>
          <div>
            <h3 data-i18n="rule"></h3>
            <p id="gx-rule" class="mb0"></p>
          </div>
          <div class="callout accent">
            <strong data-i18n="real_life"></strong>
            <p id="gx-life" class="mb0"></p>
          </div>
          <p id="gx-univ" class="callout small mb0" data-i18n="universal"></p>
          <div>
            <h3 data-i18n="truth_table"></h3>
            <div class="scroll-x tt-wrap" id="gx-tt" dir="ltr"></div>
          </div>
        </div>
      </div>
      <details class="card">
        <summary data-i18n="all_gates"></summary>
        <p class="muted small" data-i18n="all_gates_hint"></p>
        <div class="scroll-x tt-wrap" id="all-tt" dir="ltr"></div>
      </details>
    </section>

    <!-- ===================== expression lab ===================== -->
    <section id="p-expr" role="tabpanel" aria-labelledby="tab-expr" class="stack" hidden>
      <div class="card stack">
        <label for="expr-in" class="x-label" data-i18n="expr_label"></label>
        <input id="expr-in" class="expr-in no-i18n" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="250" placeholder="A·B + C'">
        <div class="row x-keys no-print" id="x-keys" dir="ltr">
          <button type="button" class="btn" data-ins="A">A</button>
          <button type="button" class="btn" data-ins="B">B</button>
          <button type="button" class="btn" data-ins="C">C</button>
          <button type="button" class="btn" data-ins="D">D</button>
          <button type="button" class="btn" data-ins="E">E</button>
          <button type="button" class="btn" data-ins="·" aria-label="AND">·</button>
          <button type="button" class="btn" data-ins=" + " aria-label="OR">+</button>
          <button type="button" class="btn" data-ins="'" aria-label="NOT">'</button>
          <button type="button" class="btn" data-ins=" ⊕ " aria-label="XOR">⊕</button>
          <button type="button" class="btn" data-ins="(">(</button>
          <button type="button" class="btn" data-ins=")">)</button>
          <button type="button" class="btn" data-ins="⌫" data-i18n-aria-label="backspace">⌫</button>
        </div>
        <p class="muted small mb0" data-i18n="expr_help"></p>
        <div class="row x-ex">
          <span class="small muted" data-i18n="examples"></span>
          <div class="row x-ex" id="x-examples"></div>
        </div>
        <div id="x-msg" class="callout" role="status" aria-live="polite" hidden></div>
      </div>

      <div id="x-result" class="card stack">
        <div class="result-head">
          <div class="expr-big" id="x-pretty" dir="ltr"></div>
          <div class="row no-print">
            <button type="button" class="btn btn-sm" id="x-copy"><span aria-hidden="true">🔗</span> <span data-i18n="copy_link"></span></button>
            <button type="button" class="btn btn-sm" id="x-print"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <div class="x-grid">
          <div class="stack">
            <h3 data-i18n="circuit"></h3>
            <div class="row" id="x-toggles" role="group" data-i18n-aria-label="inputs"></div>
            <div class="scroll-x circ-wrap" id="x-circ" dir="ltr"></div>
            <p id="x-big" class="callout warning small mb0" data-i18n="too_big" hidden></p>
            <p class="muted small mb0" data-i18n="circuit_hint"></p>
          </div>
          <div class="stack">
            <div class="row spread">
              <h3 class="mb0" data-i18n="truth_table"></h3>
              <label class="check small no-print"><input type="checkbox" id="steps-on"> <span data-i18n="show_steps"></span></label>
            </div>
            <div class="scroll-x tt-wrap" id="x-tt" dir="ltr"></div>
            <p class="small mb0" id="x-sum" aria-live="polite"></p>
            <p class="muted small mb0 no-print" data-i18n="row_hint"></p>
          </div>
        </div>
      </div>

      <div class="card stack" id="eq-card">
        <h2 class="panel-h" data-i18n="equiv_title"></h2>
        <p class="muted mb0" data-i18n="equiv_intro"></p>
        <div class="row no-print"><span class="small muted" data-i18n="try_law"></span></div>
        <div class="row" id="eq-laws"></div>
        <div class="grid-2">
          <div class="field">
            <label for="eq1" data-i18n="expr1"></label>
            <input id="eq1" class="expr-in no-i18n" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="250" placeholder="(A·B)'">
            <div class="eq-p" id="eq1-p" dir="ltr"></div>
          </div>
          <div class="field">
            <label for="eq2" data-i18n="expr2"></label>
            <input id="eq2" class="expr-in no-i18n" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="250" placeholder="A' + B'">
            <div class="eq-p" id="eq2-p" dir="ltr"></div>
          </div>
        </div>
        <div class="no-print"><button type="button" class="btn btn-primary" id="eq-check" data-i18n="check"></button></div>
        <div id="eq-res" class="callout" aria-live="polite"></div>
        <div class="scroll-x tt-wrap" id="eq-tt" dir="ltr"></div>
      </div>
    </section>

    <!-- ===================== adders ===================== -->
    <section id="p-adders" role="tabpanel" aria-labelledby="tab-adders" class="stack" hidden>
      <div class="card no-print">
        <div class="seg" id="adder-seg" role="group" data-i18n-aria-label="tab_adders">
          <button type="button" data-m="half" data-i18n="half_adder"></button>
          <button type="button" data-m="full" data-i18n="full_adder"></button>
          <button type="button" data-m="four" data-i18n="four_bit"></button>
        </div>
      </div>

      <div id="ad-half" class="ad-grid">
        <div class="card stack">
          <h2 class="panel-h" data-i18n="half_adder"></h2>
          <p class="mb0" data-i18n="ha_desc"></p>
          <div class="row no-print" id="ha-btns" role="group" data-i18n-aria-label="inputs"></div>
          <div id="ha-svg" class="ad-svg"></div>
          <p class="muted small mb0" data-i18n="legend_ha"></p>
        </div>
        <div class="card stack">
          <div class="eqs no-i18n" dir="ltr"><div>S = A ⊕ B</div><div>C = A·B</div></div>
          <div id="ha-read" class="stack" aria-live="polite"></div>
          <div class="scroll-x tt-wrap" id="ha-tt" dir="ltr"></div>
          <p class="callout small mb0" data-i18n="why_carry"></p>
        </div>
      </div>

      <div id="ad-full" class="ad-grid" hidden>
        <div class="card stack">
          <h2 class="panel-h" data-i18n="full_adder"></h2>
          <p class="mb0" data-i18n="fa_desc"></p>
          <div class="row no-print" id="fa-btns" role="group" data-i18n-aria-label="inputs"></div>
          <div id="fa-svg" class="ad-svg"></div>
          <p class="muted small mb0" data-i18n="legend_fa"></p>
        </div>
        <div class="card stack">
          <div class="eqs no-i18n" dir="ltr"><div>S = A ⊕ B ⊕ Cin</div><div>Cout = A·B + Cin·(A ⊕ B)</div></div>
          <div id="fa-read" class="stack" aria-live="polite"></div>
          <div class="scroll-x tt-wrap" id="fa-tt" dir="ltr"></div>
          <p class="callout small mb0" data-i18n="fa_how"></p>
        </div>
      </div>

      <div id="ad-four" class="card stack" hidden>
        <h2 class="panel-h" data-i18n="four_bit"></h2>
        <p class="mb0" data-i18n="four_desc"></p>
        <div class="four-wrap"><div id="four-grid" class="four-grid" dir="ltr"></div></div>
        <div class="add-eq center" id="four-read" dir="ltr" aria-live="polite"></div>
        <div class="mono muted center" id="four-bin" dir="ltr"></div>
        <p class="callout small mb0" id="four-c4note" data-i18n="final_carry"></p>
        <p class="muted small mb0" data-i18n="tap_bits"></p>
      </div>
    </section>

    <!-- ===================== practice ===================== -->
    <section id="p-practice" role="tabpanel" aria-labelledby="tab-practice" class="stack" hidden>
      <div class="card stack no-print">
        <div class="row spread">
          <div class="seg" id="pmode-seg" role="group" data-i18n-aria-label="tab_practice">
            <button type="button" data-m="fill" data-i18n="mode_fill"></button>
            <button type="button" data-m="name" data-i18n="mode_name"></button>
          </div>
          <div class="row">
            <span class="small muted" id="lvl-lbl" data-i18n="level"></span>
            <div class="seg" id="level-seg" role="group" aria-labelledby="lvl-lbl">
              <button type="button" data-l="easy" data-i18n="easy"></button>
              <button type="button" data-l="medium" data-i18n="medium"></button>
              <button type="button" data-l="hard" data-i18n="hard"></button>
            </div>
          </div>
        </div>
        <div class="row score-row" aria-live="polite">
          <span class="badge primary" id="sc-score"></span>
          <span class="badge accent" id="sc-streak"></span>
          <span class="badge" id="sc-best"></span>
        </div>
      </div>
      <div class="card stack" id="q-card">
        <div id="q-box" class="stack"></div>
        <div id="q-fb" class="callout" role="status" aria-live="polite" hidden></div>
      </div>
      <div class="card row spread no-print">
        <p class="mb0 small muted" data-i18n="ws_hint"></p>
        <button type="button" class="btn" id="ws-print"><span aria-hidden="true">🖨</span> <span data-i18n="print_ws"></span></button>
      </div>
    </section>

    <section id="worksheet" aria-hidden="true"></section>

    <details class="card help no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/logic-gates/../../shared/edu.js"></script>
  <script src="../../../apps/logic-gates/strings.js"></script>
  <script src="../../../apps/logic-gates/logic.js"></script>
  <script src="../../../apps/logic-gates/draw.js"></script>
  <script src="../../../apps/logic-gates/app.js"></script>
</body>
</html>
