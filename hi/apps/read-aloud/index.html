  <style>
    /* ---------- layout ---------- */
    .ra-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
    @media (max-width: 920px) { .ra-layout { grid-template-columns: minmax(0, 1fr); } }
    .ra-main, .ra-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .ra-side .card h2 { font-size: 1.08rem; }
    .lbl, .field > .lbl { font-weight: 600; font-size: .92rem; color: var(--text); }

    /* ---------- text card ---------- */
    .card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .card-head h2 { margin: 0; font-size: 1.15rem; }
    .samples-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sample-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .sample-btns .chip { min-height: 40px; text-align: start; }
    #sample-lang { margin-inline-start: auto; max-width: 100%; }
    #text { min-height: 104px; font-size: 1.05rem; }
    .detect-row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
    .detect-row select { max-width: 100%; min-width: 0; }
    #counts { margin-inline-start: auto; }

    /* ---------- player ---------- */
    .transport { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .tbtn { flex-direction: column; gap: 4px; min-height: 66px; padding: 7px 4px; font-size: .84rem; line-height: 1.15;
            white-space: normal; text-align: center; overflow-wrap: anywhere; }
    .tbtn .ic { font-size: 1.45rem; line-height: 1; }
    .tbtn:disabled { opacity: .45; }
    /* right-to-left pages: "back" points to the right, "next" to the left, like the reading direction */
    [dir="rtl"] #prev-btn .ic, [dir="rtl"] #next-btn .ic, [dir="rtl"] #echo-next .ic { display: inline-block; transform: scaleX(-1); }
    .reader-card > .transport { margin-top: 0; }   /* the hidden print header must not add a gap */
    @media (max-width: 560px) {
      /* phones: a big full-width Play button, the other four controls below it */
      .transport { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .transport #play-btn { grid-column: 1 / -1; flex-direction: row; gap: 10px; min-height: 54px; font-size: 1.05rem; }
      .tbtn { min-height: 60px; font-size: .8rem; }
      .tools-row .btn, #clear-btn { min-height: 40px; }   /* finger-sized */
      .samples-row #sample-lang { order: 1; }
      .samples-row .sample-btns { order: 2; flex-basis: 100%; }
    }
    .tools-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tools-row .sp { flex: 1 1 auto; }
    #echo-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .prog-row { height: 8px; }

    /* ---------- reading view ---------- */
    .reader { --ra-font: 28px; --ra-line: 1.8; font-size: var(--ra-font); line-height: var(--ra-line);
              max-height: min(66vh, 760px); min-height: 150px; overflow-y: auto; padding: 14px 18px;
              background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
              overflow-wrap: break-word; color: var(--text); }
    .reader:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .reader p { margin: 0 0 .55em; }
    .reader p:last-child { margin-bottom: 0; }
    .reader .w { cursor: pointer; border-radius: .18em; transition: background-color .12s, color .12s; }
    .reader .w:hover { text-decoration: underline; text-decoration-color: var(--primary); text-decoration-thickness: 2px; text-underline-offset: .22em; }
    .reader .s.cur { background: var(--primary-soft); border-radius: .22em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
                     box-shadow: 0 0 0 .08em var(--primary-soft); }
    .reader .w.on { background: #ffd43b; color: #14191b; box-shadow: 0 0 0 .1em #ffd43b; }
    .reader.hl-sentence .w.on:not(.tap) { background: transparent; color: inherit; box-shadow: none; }
    .reader:lang(ur) { line-height: calc(var(--ra-line) * 1.2); }
    .reader-empty { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }

    /* sticky: the "your turn" prompt stays on screen even when the reading view is taller than the window */
    .echo-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--radius-sm);
                background: var(--accent-soft); border: 2px solid var(--accent); position: sticky; bottom: 10px; z-index: 3;
                box-shadow: 0 6px 22px rgba(0, 0, 0, .18); }
    .echo-ic { font-size: 2rem; line-height: 1; }
    .echo-main { flex: 1 1 200px; min-width: 0; }
    .echo-msg { display: block; font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
    .echo-box .progress > span { background: var(--accent); width: 0; transition: none; }
    .status { margin: 0; font-weight: 600; }

    /* ---------- voice note ---------- */
    .nv h3 { margin: 0 0 .35em; font-size: 1.05rem; }
    .nv p { margin: 0 0 .5em; }
    .nv ul { margin: .3em 0 .6em; padding-inline-start: 1.2em; }
    .nv li { margin-bottom: .4em; }
    .nv details { margin: .2em 0 .6em; }
    .nv summary { cursor: pointer; font-weight: 600; }
    .nv .ui { display: inline-block; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom;
              unicode-bidi: isolate; direction: ltr; font-weight: 600; background: var(--surface); border: 1px solid var(--border);
              border-radius: 6px; padding: 0 5px; font-size: .92em; line-height: 1.5; margin: 1px 0; }
    .nv .badge { margin-inline-start: 6px; vertical-align: middle; }

    /* ---------- settings ---------- */
    .range-lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .range-lbl output { font-variant-numeric: tabular-nums; color: var(--primary); font-weight: 700; }
    .seg button { min-height: 40px; }
    .ra-side .seg { display: flex; }                   /* long labels (Tamil, Malayalam) wrap into full-width rows */
    .ra-side .seg button { flex: 1 1 auto; }
    #voice-sel { width: 100%; }
    #voice-info { overflow-wrap: anywhere; margin: 0; }

    /* ---------- help ---------- */
    details.help summary { cursor: pointer; font-size: 1.05rem; }
    details.help ul { padding-inline-start: 1.25em; margin: 12px 0; }
    details.help li { margin-bottom: 8px; }
    details.help .callout { margin: 0; }

    /* ---------- full screen (smartboard) ---------- */
    #reader-card:fullscreen { display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 0; overflow: auto; background: var(--bg); }
    #reader-card:fullscreen > * + * { margin-top: 0; }
    #reader-card:fullscreen .reader { max-height: none; flex: 1 1 auto; font-size: calc(var(--ra-font) * 1.4); }
    #reader-card:-webkit-full-screen { display: flex; flex-direction: column; gap: 14px; padding: 24px; overflow: auto; background: var(--bg); }
    #reader-card:-webkit-full-screen .reader { max-height: none; flex: 1 1 auto; font-size: calc(var(--ra-font) * 1.4); }

    /* ---------- print: a clean reading sheet ---------- */
    .print-head h2 { margin: 0 0 6px; }
    .print-head p { margin: 0 0 14px; }
    @media print {
      .edu-intro, #text-card, .ra-side, details.help, #voice-note, #boundary-note { display: none !important; }
      .ra-layout { display: block; }
      .reader-card { border: 0 !important; padding: 0 !important; }
      .reader { max-height: none !important; overflow: visible !important; border: 0; padding: 0; font-size: calc(var(--ra-font) * .8); color: #000; background: #fff; }
      .reader .w { transition: none !important; text-decoration: none !important; }
      .reader .s.cur, .reader .w.on { background: none !important; box-shadow: none !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="ra-layout">
      <div class="ra-main">
        <!-- 1) text to read -->
        <section class="card stack" id="text-card">
          <div class="card-head">
            <h2 data-i18n="text_h"></h2>
            <button class="btn btn-sm btn-ghost" id="clear-btn" type="button"><span aria-hidden="true">✕</span> <span data-i18n="clear"></span></button>
          </div>
          <div class="samples-row">
            <span class="lbl" data-i18n="samples"></span>
            <div class="sample-btns" id="sample-btns"></div>
            <select id="sample-lang" data-i18n-aria-label="sample_lang" data-i18n-title="sample_lang"></select>
          </div>
          <div class="field">
            <label for="text" data-i18n="text_label"></label>
            <textarea id="text" class="no-i18n" rows="4" dir="auto" maxlength="30000" spellcheck="false" data-i18n-placeholder="text_ph"></textarea>
          </div>
          <div class="detect-row">
            <label for="read-as" data-i18n="read_as"></label>
            <select id="read-as"></select>
            <span class="muted small" id="counts"></span>
          </div>
        </section>

        <!-- 2) reading view + player -->
        <section class="card stack reader-card" id="reader-card">
          <div class="print-only print-head">
            <h2 data-i18n="print_h"></h2>
            <p><span data-i18n="print_name"></span>: ______________________ &nbsp; <span data-i18n="print_date"></span>: ____________</p>
          </div>
          <div class="transport no-print" id="transport">
            <button class="btn btn-primary tbtn" id="play-btn" type="button"><span class="ic" id="play-ic" aria-hidden="true">▶</span><span id="play-lbl" data-i18n="b_play"></span></button>
            <button class="btn tbtn" id="stop-btn" type="button"><span class="ic" aria-hidden="true">■</span><span data-i18n="b_stop"></span></button>
            <button class="btn tbtn" id="prev-btn" type="button" data-i18n-title="prev_s" data-i18n-aria-label="prev_s"><span class="ic" aria-hidden="true">⏮</span><span data-i18n="b_back"></span></button>
            <button class="btn tbtn" id="repeat-btn" type="button" data-i18n-title="repeat_s" data-i18n-aria-label="repeat_s"><span class="ic" aria-hidden="true">↻</span><span data-i18n="b_again"></span></button>
            <button class="btn tbtn" id="next-btn" type="button" data-i18n-title="next_s" data-i18n-aria-label="next_s"><span class="ic" aria-hidden="true">⏭</span><span data-i18n="b_next"></span></button>
          </div>
          <div class="tools-row no-print">
            <button class="btn btn-sm" id="echo-btn" type="button" aria-pressed="false"><span aria-hidden="true">🗣️</span> <span data-i18n="echo_mode"></span></button>
            <span class="sp"></span>
            <button class="btn btn-sm" id="fs-btn" type="button" aria-pressed="false"><span aria-hidden="true">⛶</span> <span id="fs-lbl" data-i18n="fullscreen"></span></button>
            <button class="btn btn-sm" id="print-btn" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print_passage"></span></button>
          </div>
          <div class="progress no-print" aria-hidden="true"><span id="prog" style="width:0%"></span></div>
          <div id="voice-note" class="no-print" hidden></div>
          <div id="reader" class="reader no-i18n" role="region" tabindex="0" data-i18n-aria-label="reader_label"></div>
          <div id="echo-box" class="echo-box no-print" hidden>
            <div class="echo-ic" aria-hidden="true">🗣️</div>
            <div class="echo-main">
              <strong class="echo-msg" id="echo-msg" data-i18n="your_turn"></strong>
              <div class="progress" id="echo-prog-wrap"><span id="echo-prog"></span></div>
            </div>
            <button class="btn btn-accent" id="echo-next" type="button"><span data-i18n="b_next"></span> <span class="ic" aria-hidden="true">⏭</span></button>
          </div>
          <p id="status" class="status no-print" aria-live="polite"></p>
          <p id="boundary-note" class="muted small no-print mb0" hidden data-i18n="no_boundary"></p>
        </section>

        <details class="card help no-print" id="help">
          <summary><strong data-i18n="help_h"></strong></summary>
          <ul>
            <li data-i18n-html="tip1"></li>
            <li data-i18n-html="tip2"></li>
            <li data-i18n-html="tip3"></li>
            <li data-i18n-html="tip4"></li>
            <li data-i18n-html="tip5"></li>
            <li data-i18n-html="tip6"></li>
          </ul>
          <p class="callout" data-i18n-html="inside"></p>
        </details>
      </div>

      <!-- 3) settings -->
      <aside class="ra-side no-print">
        <section class="card stack" id="voice-card">
          <h2 data-i18n="voice_h"></h2>
          <div class="field">
            <label for="voice-sel" data-i18n="voice"></label>
            <select id="voice-sel" class="no-i18n"></select>
            <p class="muted tiny no-i18n" id="voice-info"></p>
          </div>
          <label class="check"><input type="checkbox" id="all-voices"> <span data-i18n="all_voices"></span></label>
          <div class="field">
            <label for="rate" class="range-lbl"><span data-i18n="speed"></span><output id="rate-out" for="rate"></output></label>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="1">
          </div>
          <div class="field">
            <label for="pitch" class="range-lbl"><span data-i18n="pitch"></span><output id="pitch-out" for="pitch"></output></label>
            <input type="range" id="pitch" min="0.5" max="1.5" step="0.05" value="1">
          </div>
        </section>

        <section class="card stack" id="look-card">
          <h2 data-i18n="look_h"></h2>
          <div class="field">
            <label for="font" class="range-lbl"><span data-i18n="font_size"></span><output id="font-out" for="font"></output></label>
            <input type="range" id="font" min="16" max="72" step="2" value="28">
          </div>
          <div class="field">
            <label for="line" class="range-lbl"><span data-i18n="line_space"></span><output id="line-out" for="line"></output></label>
            <input type="range" id="line" min="1.2" max="2.8" step="0.1" value="1.8">
          </div>
          <div class="field">
            <span class="lbl" id="hl-lbl" data-i18n="highlight"></span>
            <div class="seg" role="group" aria-labelledby="hl-lbl" id="hl-seg">
              <button type="button" data-hl="word" data-i18n="hl_word"></button>
              <button type="button" data-hl="sentence" data-i18n="hl_sentence"></button>
            </div>
          </div>
          <div class="field">
            <span class="lbl" id="tap-lbl" data-i18n="tap_word"></span>
            <div class="seg" role="group" aria-labelledby="tap-lbl" id="tap-seg">
              <button type="button" data-tap="hear" data-i18n="tap_hear"></button>
              <button type="button" data-tap="from" data-i18n="tap_from"></button>
            </div>
          </div>
        </section>

        <section class="card stack" id="echo-card">
          <h2><span aria-hidden="true">🗣️</span> <span data-i18n="echo_mode"></span></h2>
          <p class="muted small mb0" data-i18n="echo_help"></p>
          <div class="field">
            <span class="lbl" id="wait-lbl" data-i18n="echo_wait"></span>
            <div class="seg" role="group" aria-labelledby="wait-lbl" id="wait-seg">
              <button type="button" data-wait="auto" data-i18n="echo_auto"></button>
              <button type="button" data-wait="tap" data-i18n="echo_tap"></button>
            </div>
          </div>
        </section>

        <button class="btn btn-danger" id="reset-btn" type="button"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
      </aside>
    </div>
  </main>
  <script src="../../../apps/read-aloud/../../shared/edu.js"></script>
  <script src="../../../apps/read-aloud/strings.js"></script>
  <script src="../../../apps/read-aloud/content.js"></script>
  <script src="../../../apps/read-aloud/app.js"></script>
</body>
</html>
