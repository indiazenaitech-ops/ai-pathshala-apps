  <style>
    .intro-row { align-items: flex-start; margin-bottom: 14px; }
    .intro-row .edu-intro { flex: 1 1 320px; margin: 0; }
    #app > * + * { margin-top: 16px; }
    .card h2 { display: flex; align-items: center; gap: 10px; }
    .card h2 > span:not(.step-no) { flex: 1 1 auto; min-width: 0; }
    button.chip, .clue { font-family: inherit; }
    .step-no { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.05rem; flex: none; }
    .lbl { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
    .print-title { display: none; }

    /* ---------- step 1: labels + sentences ---------- */
    .labs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
    .lab-card { border: 1px solid var(--border); border-top: 5px solid var(--lc, var(--primary)); border-radius: var(--radius); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .lab-head { display: flex; align-items: center; gap: 8px; }
    .lab-emoji { font-size: 1.35rem; padding: 2px 4px; min-height: 42px; width: 3.6rem; flex: none; text-align: center; }
    .lab-name { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 1.08rem; }
    .lab-del { flex: none; width: 40px; height: 40px; padding: 0; }
    .lab-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--muted); }
    .lab-count { font-weight: 700; color: var(--text); }
    .add-row { display: flex; gap: 6px; }
    .add-row input { flex: 1 1 auto; min-width: 0; }
    .add-row .btn { white-space: nowrap; flex: none; }
    .sent-list { list-style: none; margin: 0; padding: 0; max-height: 15.5rem; overflow-y: auto; border-radius: var(--radius-sm); background: var(--surface-2); }
    .sent-list li { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; padding-inline: 10px 6px; border-bottom: 1px solid var(--border); font-size: .95rem; line-height: 1.4; }
    .sent-list li:last-child { border-bottom: 0; }
    .sent-list li.fresh { animation: st-flash 1.2s ease-out; }
    @keyframes st-flash { from { background: color-mix(in srgb, var(--lc) 30%, transparent); } to { background: transparent; } }
    .sent-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    /* User sentences keep their own direction (an English sentence inside the Urdu page, or the reverse),
       so punctuation and word order are not shuffled; alignment still follows the page. */
    .sent-text, .add-input, .lab-name, #test-input, #exp1-word, #peek-filter, .ba q, .mist-list li > span:first-child, .wd-word, .v-name { unicode-bidi: plaintext; }
    .sent-del { flex: none; border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    .sent-del:hover, .sent-del:focus-visible { background: var(--danger-soft); color: var(--danger); }
    .sent-empty { padding: 14px 10px; color: var(--muted); font-size: .9rem; }
    .data-tools { justify-content: space-between; }

    /* ---------- step 2: train ---------- */
    .train-row { align-items: center; }
    #train-btn { gap: 10px; }
    #train-btn.pulse { animation: st-pulse 1.6s ease-in-out infinite; }
    @keyframes st-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); } 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--primary) 0%, transparent); } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 118px), 1fr)); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; min-width: 0; }
    .stat b { display: block; font-size: 1.6rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .stat span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
    .lab-stats { display: grid; gap: 8px; }
    .lab-stat { border-inline-start: 5px solid var(--lc); background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; }
    .lab-stat .ls-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .lab-stat .ls-name { font-weight: 800; }
    .lab-stat .ls-nums { font-size: .85rem; color: var(--muted); }
    .clues { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
    .clue { font-size: .85rem; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--lc) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--lc) 45%, transparent); }
    .clue small { color: var(--muted); margin-inline-start: 4px; }
    details.sub > summary { cursor: pointer; font-weight: 700; min-height: 32px; padding: 4px 0; }
    .mist-list { margin: 6px 0 0; padding-inline-start: 1.2em; font-size: .9rem; }
    .mist-list li + li { margin-top: 4px; }
    .peek-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .peek-tools input { flex: 1 1 140px; max-width: 240px; }
    .peek-tools .seg button { min-height: 40px; }
    .peek td.n, .peek th.n { text-align: end; font-variant-numeric: tabular-nums; }
    .peek td.w { font-weight: 600; white-space: nowrap; }
    .peek th { white-space: normal; vertical-align: bottom; }
    .peek td.w.pair { font-style: italic; }
    .peek .zero { color: var(--muted); opacity: .6; }
    .lean { white-space: nowrap; }

    /* ---------- step 3: test ---------- */
    .test-row { display: flex; gap: 8px; }
    .test-row input { flex: 1 1 auto; min-width: 0; font-size: 1.15rem; min-height: 48px; }
    .test-row .btn { width: 48px; padding: 0; flex: none; }
    .tries { display: flex; flex-wrap: wrap; gap: 6px; }
    .tries .chip { font-weight: 500; text-align: start; min-height: 36px; border-radius: 14px; }
    .tries .chip .k { font-size: .75rem; font-weight: 700; color: var(--muted); }
    .verdict { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--lc, var(--primary)) 16%, var(--surface)); border: 2px solid color-mix(in srgb, var(--lc, var(--primary)) 55%, transparent); }
    .v-emoji { font-size: 3rem; line-height: 1; }
    .v-name { font-size: 1.5rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .v-sure { color: var(--muted); font-weight: 600; }
    .bars { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 3.4rem; gap: 10px; align-items: center; }
    .bar-lab { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 18px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar > span { display: block; height: 100%; width: 0; background: var(--lc); border-radius: inherit; transition: width .35s ease; }
    .bar-pct { text-align: end; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bar-row.win .bar-lab, .bar-row.win .bar-pct { color: var(--text); }
    .bar-row:not(.win) { opacity: .82; }
    .words { font-size: 1.2rem; line-height: 2.3; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); min-height: 3.4rem; overflow-wrap: anywhere; }
    .wtok { font: inherit; color: var(--text); border: 0; border-bottom: 3px solid var(--wc, var(--border)); padding: 0 5px; margin: 0 1px; border-radius: 6px 6px 2px 2px; cursor: pointer; line-height: 1.5;
      background: color-mix(in srgb, var(--wc, transparent) var(--wa, 0%), transparent); }
    .wtok.unk { border-bottom: 2px dashed var(--muted); color: var(--muted); background: transparent; }
    .wtok.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); align-items: center; }
    .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: color-mix(in srgb, var(--lc) 55%, transparent); border-bottom: 3px solid var(--lc); vertical-align: -2px; margin-inline-end: 4px; }
    .legend .sw.unk { background: transparent; border: 0; border-bottom: 2px dashed var(--muted); }
    .pairs-used { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
    .pairs-used .clue { font-style: italic; }
    .wd { font-size: .95rem; }
    .wd .table { margin-top: 6px; }
    .wd .table td:first-child { white-space: nowrap; }
    .wd-word { font-size: 1.15rem; font-weight: 800; }
    .maths td { white-space: nowrap; }
    .maths th { vertical-align: bottom; }
    /* Row names ("Starting chance (share of all sentences)") wrap, so the numbers stay on screen on a phone. */
    .maths td:first-child { white-space: normal; min-width: 7.5em; }
    .maths td.n { text-align: end; font-variant-numeric: tabular-nums; }
    .maths .frac { color: var(--muted); font-size: .8rem; display: block; }
    .maths tr.sum td { font-weight: 800; border-top: 2px solid var(--text); }
    .maths tr.win-row td.win { background: color-mix(in srgb, var(--lc) 22%, transparent); }

    /* ---------- step 4: experiments ---------- */
    .exps { align-items: stretch; }
    .exp { display: flex; flex-direction: column; gap: 10px; }
    .exp h3 { display: flex; gap: 8px; align-items: center; margin: 0; }
    .exp p { margin: 0; }
    .exp .grow-space { flex: 1 1 auto; }
    .exp-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .exp-word-row { display: flex; gap: 8px; }
    .exp-word-row input { flex: 1 1 auto; min-width: 0; }
    .ba { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 6px; }
    .ba q { font-weight: 600; }
    .ba-row { display: grid; grid-template-columns: minmax(4.5rem, auto) minmax(0, 1fr); gap: 8px; align-items: center; font-size: .92rem; }
    .ba-k { color: var(--muted); font-weight: 700; }
    .ba-v { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
    .sbar { display: flex; flex: 1 1 110px; height: 14px; min-width: 90px; border-radius: 999px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
    .sbar > span { display: block; height: 100%; background: var(--lc); }
    .sbar > span + span { border-inline-start: 2px solid var(--surface); }
    .ba-msg { font-size: .9rem; }

    /* ---------- inside ---------- */
    .inside-grid .panel h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; }
    .inside-grid .panel p { margin: 0; }
    .formula { font-family: var(--mono); font-size: .88rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 8px; margin-top: 8px !important; overflow-wrap: anywhere; direction: ltr; text-align: start; unicode-bidi: isolate; }
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.1rem; min-height: 32px; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.3em; }
    details.card li + li { margin-top: 8px; }

    /* ---------- projector / phone ---------- */
    .edu-fullscreen-on .test-row input { font-size: 1.6rem; }
    .edu-fullscreen-on .words { font-size: 1.7rem; }
    .edu-fullscreen-on .v-name { font-size: 2.2rem; }
    .edu-fullscreen-on .sent-list li { font-size: 1.1rem; }
    @media (max-width: 560px) {
      .bar-row { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr) 3rem; gap: 8px; }
      .v-emoji { font-size: 2.4rem; }
      .v-name { font-size: 1.3rem; }
      .stat b { font-size: 1.35rem; }
      .words { font-size: 1.1rem; }
      .peek th, .peek td, .maths th, .maths td { padding: 6px 7px; }
      .maths, .peek { font-size: .84rem; }
    }
    [dir="rtl"] .flip { display: inline-block; transform: scaleX(-1); }
    /* Nastaliq headings that wrap to two lines overlap at the shared line-height of 1.25 */
    :root[lang="ur"] #app h2, :root[lang="ur"] #app h3, :root[lang="ur"] details > summary { line-height: 2.05; }
    :root[lang="ur"] .v-name { line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) {
      #train-btn.pulse, .sent-list li.fresh { animation: none; }
      .bar > span { transition: none; }
    }

    @media print {
      .print-title { display: block; font-size: 1.5rem; margin-bottom: 6px; }
      #app > * + * { margin-top: 10px; }
      .sent-list { max-height: none; overflow: visible; background: none; }
      .sent-list li { padding: 2px 4px; }
      .lab-card, .lab-stat, .stat, .panel, .words, .verdict { background: none !important; }
      .lab-card .lab-name { border: 0; padding: 0; min-height: 0; background: none; }
      .lab-card .lab-emoji { border: 0; appearance: none; -webkit-appearance: none; background: none; }
      #test-input { border-color: #bbb; }
      .labs { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      #exp-card, #help, details.sub:not([open]) { display: none !important; }
      .wtok { border-bottom-width: 3px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <h1 class="print-title" data-i18n="app_title"></h1>
    <div class="row spread intro-row">
      <p class="edu-intro" data-i18n="intro"></p>
      <div class="row no-print">
        <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
        <button type="button" class="btn btn-sm" id="fs-btn" data-i18n="fullscreen"></button>
        <button type="button" class="btn btn-sm btn-danger" id="reset-btn" data-i18n="reset"></button>
      </div>
    </div>

    <!-- 1. Teach -->
    <section class="card stack" id="data-card">
      <h2><span class="step-no" aria-hidden="true">1</span><span data-i18n="step1"></span></h2>
      <p class="muted small mb0 no-print" data-i18n="step1_hint"></p>
      <p class="callout warning small mb0 no-print" id="lang-note" hidden></p>
      <div class="labs" id="labs"></div>
      <div class="row data-tools no-print">
        <button type="button" class="btn btn-accent" id="add-label-btn" data-i18n="add_label"></button>
        <div class="row">
          <button type="button" class="btn btn-sm" id="samples-btn" data-i18n="load_samples"></button>
          <button type="button" class="btn btn-sm" id="import-btn" data-i18n="import_csv"></button>
          <button type="button" class="btn btn-sm" id="export-btn" data-i18n="export_csv"></button>
          <button type="button" class="btn btn-sm btn-danger" id="clear-all-btn" data-i18n="clear_all"></button>
        </div>
      </div>
      <p class="muted tiny mb0 no-print" data-i18n="csv_hint"></p>
    </section>

    <div class="grid-2 main-grid">
      <!-- 2. Train -->
      <section class="card stack" id="train-card">
        <h2><span class="step-no" aria-hidden="true">2</span><span data-i18n="step2"></span></h2>
        <div class="row train-row no-print">
          <button type="button" class="btn btn-primary btn-lg" id="train-btn"><span aria-hidden="true">🧠</span><span data-i18n="train_btn"></span></button>
          <label class="check"><input type="checkbox" id="pairs-chk"><span data-i18n="pairs_label"></span></label>
        </div>
        <p class="callout small mb0" id="train-status" aria-live="polite"></p>
        <div id="model-view" class="stack" hidden>
          <div class="stats">
            <div class="stat"><b id="st-sentences">0</b><span data-i18n="st_sentences"></span></div>
            <div class="stat"><b id="st-vocab">0</b><span data-i18n="st_vocab"></span></div>
            <div class="stat"><b id="st-train-acc">0</b><span data-i18n="st_train_acc"></span></div>
            <div class="stat"><b id="st-fair-acc">0</b><span data-i18n="st_fair_acc"></span></div>
          </div>
          <p class="muted tiny mb0" data-i18n="fair_hint"></p>
          <div class="lab-stats" id="lab-stats"></div>
          <details class="sub" id="mistakes">
            <summary id="mist-sum"></summary>
            <ul class="mist-list no-i18n" id="mist-list"></ul>
          </details>
          <div class="stack" id="peek">
            <h3 class="mb0" data-i18n="peek_t"></h3>
            <p class="muted small mb0" data-i18n="peek_note"></p>
            <div class="peek-tools no-print">
              <input type="search" id="peek-filter" class="no-i18n" data-i18n-placeholder="peek_filter" data-i18n-aria-label="peek_filter" autocomplete="off">
              <div class="seg" role="group" data-i18n-aria-label="sort_by">
                <button type="button" id="sort-count" aria-pressed="true" data-i18n="sort_common"></button>
                <button type="button" id="sort-clue" aria-pressed="false" data-i18n="sort_clue"></button>
              </div>
            </div>
            <div class="peek-tools">
              <span class="muted small" id="peek-count"></span>
            </div>
            <div class="scroll-x"><table class="table peek" id="peek-table"></table></div>
            <button type="button" class="btn btn-sm no-print" id="peek-more" data-i18n="peek_more"></button>
          </div>
        </div>
      </section>

      <!-- 3. Test -->
      <section class="card stack" id="test-card">
        <h2><span class="step-no" aria-hidden="true">3</span><span data-i18n="step3"></span></h2>
        <div>
          <label for="test-input" class="lbl" data-i18n="test_label"></label>
          <div class="test-row">
            <input type="text" id="test-input" class="no-i18n" maxlength="300" autocomplete="off" spellcheck="false" data-i18n-placeholder="test_ph">
            <button type="button" class="btn no-print" id="test-clear" data-i18n-aria-label="clear" data-i18n-title="clear">✕</button>
          </div>
        </div>
        <div class="no-print" id="tries-wrap">
          <span class="lbl" data-i18n="try_t"></span>
          <div class="tries no-i18n" id="tries"></div>
        </div>
        <div id="result" class="stack" aria-live="polite"></div>
        <div id="explain" class="stack" hidden>
          <h3 class="mb0" data-i18n="words_t"></h3>
          <p class="muted small mb0" data-i18n="words_hint"></p>
          <div class="words no-i18n" id="words"></div>
          <div class="legend" id="legend"></div>
          <div class="pairs-used no-i18n" id="pairs-used" hidden></div>
          <div class="panel wd" id="word-detail" aria-live="polite"></div>
          <details class="sub" id="maths">
            <summary data-i18n="maths_t"></summary>
            <div class="scroll-x"><table class="table maths no-i18n" id="maths-table"></table></div>
            <p class="muted small" data-i18n="maths_note" style="margin-top:8px"></p>
          </details>
        </div>
      </section>
    </div>

    <!-- 4. Experiments -->
    <section class="card stack" id="exp-card">
      <h2><span class="step-no" aria-hidden="true">4</span><span data-i18n="step4"></span></h2>
      <p class="muted small mb0" data-i18n="step4_hint"></p>
      <div class="grid-3 exps">
        <div class="panel exp" id="exp1">
          <h3><span aria-hidden="true">✂️</span><span data-i18n="exp1_t"></span></h3>
          <p class="small" data-i18n="exp1_d"></p>
          <div>
            <label for="exp1-word" class="lbl" data-i18n="exp1_word"></label>
            <div class="exp-word-row">
              <input type="text" id="exp1-word" class="no-i18n" maxlength="60" autocomplete="off" spellcheck="false">
            </div>
          </div>
          <p class="small muted" id="exp1-info" aria-live="polite"></p>
          <div class="grow-space"></div>
          <div class="exp-btns"><button type="button" class="btn btn-accent" id="exp1-btn"></button></div>
          <div id="exp1-res" aria-live="polite"></div>
        </div>
        <div class="panel exp" id="exp2">
          <h3><span aria-hidden="true">⚖️</span><span data-i18n="exp2_t"></span></h3>
          <p class="small" id="exp2-d"></p>
          <ul class="small no-i18n mb0" id="exp2-list" style="margin:0;padding-inline-start:1.2em"></ul>
          <p class="callout warning small exp-need" hidden></p>
          <div class="grow-space"></div>
          <div class="exp-btns"><button type="button" class="btn btn-accent" id="exp2-btn" data-i18n="exp2_btn"></button></div>
          <div id="exp2-res" aria-live="polite"></div>
        </div>
        <div class="panel exp" id="exp3">
          <h3><span aria-hidden="true">🚫</span><span data-i18n="exp3_t"></span></h3>
          <p class="small" id="exp3-d"></p>
          <p class="callout warning small exp-need" hidden></p>
          <div class="grow-space"></div>
          <div class="exp-btns">
            <button type="button" class="btn" id="exp3-try" data-i18n="exp3_try"></button>
            <button type="button" class="btn btn-accent" id="exp3-btn"></button>
          </div>
          <div id="exp3-res" aria-live="polite"></div>
        </div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="undo-btn" hidden><span class="flip" aria-hidden="true">↩</span><span data-i18n="undo_exp"></span></button>
      </div>
    </section>

    <!-- inside -->
    <section class="card stack" id="inside-card">
      <h2 data-i18n="inside_t"></h2>
      <div class="grid-3 inside-grid">
        <div class="panel"><h3><span aria-hidden="true">🧮</span><span data-i18n="in1_t"></span></h3><p data-i18n="in1"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🎲</span><span data-i18n="in2_t"></span></h3><p data-i18n="in2"></p><p class="formula" data-i18n="formula"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🙈</span><span data-i18n="in3_t"></span></h3><p data-i18n="in3"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🙃</span><span data-i18n="in4_t"></span></h3><p data-i18n="in4"></p></div>
        <div class="panel"><h3><span aria-hidden="true">⚖️</span><span data-i18n="in5_t"></span></h3><p data-i18n="in5"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🔤</span><span data-i18n="in6_t"></span></h3><p data-i18n="in6"></p></div>
      </div>
    </section>

    <details class="card" id="help">
      <summary data-i18n="help_t"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/sentiment-trainer/../../shared/edu.js"></script>
  <script src="../../../apps/sentiment-trainer/strings.js"></script>
  <script src="../../../apps/sentiment-trainer/content.js"></script>
  <script src="../../../apps/sentiment-trainer/engine.js"></script>
  <script src="../../../apps/sentiment-trainer/app.js"></script>
</body>
</html>
