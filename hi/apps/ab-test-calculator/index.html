          <button class="btn btn-sm btn-danger" type="button" id="reset" data-i18n="reset"></button>
        </div>
      </section>

      <section class="card" aria-labelledby="res-h">

          </div>
        </label>
        <div class="field">
          <label for="pl-change" data-i18n="plan_change"></label>
          <input id="pl-change" type="text" inputmode="decimal" class="ab-num" autocomplete="off">

            <button type="button" id="pl-rel" data-i18n="plan_rel"></button>
          </div>
        </div>
        <div class="field">
          <span id="pl-pow-lbl" data-i18n="plan_power"></span>
          <div class="seg ab-seg" role="group" aria-labelledby="pl-pow-lbl">

            <button type="button" id="pl-p90" class="ab-num">90%</button>
          </div>

          <div class="seg ab-seg" role="group" aria-labelledby="pl-sig-lbl">
            <button type="button" id="pl-s5" class="ab-num">5%</button>
            <button type="button" id="pl-s1" class="ab-num">1%</button>

        </div>

            <button type="button" id="pl-v3" class="ab-num">3</button>

        </div>

        </div>
        <p class="muted ab-formula" id="pl-formula"></p>
        <p class="callout ab-formula" data-i18n="plan_note"></p>
      </div>

        <div><dt data-i18n="w_conv"></dt><dd data-i18n="d_conv"></dd></div>

        <div><dt data-i18n="w_ci"></dt><dd data-i18n="d_ci"></dd></div>
        <div><dt data-i18n="w_power"></dt><dd data-i18n="d_power"></dd></div>

        <div><dt data-i18n="w_peek"></dt><dd data-i18n="d_peek"></dd></div>
      </dl>

        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
