    .mp-stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .mp-stat { padding: 12px 10px; border-radius: 12px; background: var(--surface-2); text-align: center; }
    .mp-stat span { display: block; color: var(--muted); font-size: .85rem; font-weight: 600; }
    .mp-stat b { display: block; font-size: 1.75rem; font-weight: 800; line-height: 1.25; }
    .mp-stat.main { background: var(--primary-soft); }
    .mp-stat.main b { color: var(--primary); }
    .mp-mist td.q { font-weight: 700; white-space: nowrap; }
    .mp-mist td.y { color: var(--danger); text-decoration: line-through; }
    .mp-mist td.r { color: var(--success); font-weight: 800; }
    .mp-actions { justify-content: center; }
    .mp-summary h3 { margin-top: 20px; }
    :root[lang="ur"] .mp-setup h2 { margin-bottom: .8em; }
    :root[lang="ur"] .mp-sum-head h2, :root[lang="ur"] .mp-dres h2 { line-height: 2.1; margin-top: 14px; }
    .mp-recent .table td small { display: block; color: var(--muted); font-weight: 400; }
    .mp-recent .table td small.when { font-variant-numeric: tabular-nums; }
    .mp-print-meta { display: none; }

    /* ---------- Urdu (Nastaliq) needs taller lines ---------- */
    :root[lang="ur"] .mp-mode b, :root[lang="ur"] .mp-mode small { line-height: 1.9; }
    :root[lang="ur"] .btn, :root[lang="ur"] .chip, :root[lang="ur"] .seg button { line-height: 1.8; }
    :root[lang="ur"] .mp-seg3 button { line-height: 1.6; }
    :root[lang="ur"] .mp-pill { line-height: 1.9; align-items: center; }
    :root[lang="ur"] .mp-fb, :root[lang="ur"] .mp-sum-msg, :root[lang="ur"] .mp-phase { line-height: 2; }
    :root[lang="ur"] .mp-flip { line-height: 2; }

    /* ---------- worksheet (print only) ---------- */
    .mp-ws { display: none; }
    @media print {
      body:not(.mp-print-ws) .mp-ws { display: none !important; }
      body.mp-print-ws #app > :not(.mp-ws) { display: none !important; }
      body.mp-print-ws .mp-ws { display: block !important; color: #000; }
      .mp-ws h1 { font-size: 20pt; margin: 0 0 2pt; }
      .mp-ws-sub { font-size: 12pt; margin: 0 0 10pt; }
      .mp-ws-meta { display: flex; flex-wrap: wrap; gap: 6pt 22pt; font-size: 11pt; margin: 0 0 14pt; }
      .mp-ws-meta span { white-space: nowrap; }
      .mp-ws-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16pt 14pt; padding: 0; margin: 0; list-style: none; }
      .mp-ws-grid.wide { grid-template-columns: repeat(3, 1fr); }
      .mp-ws-q { font-size: 14pt; display: flex; align-items: baseline; gap: 6pt; break-inside: avoid; }
      .mp-ws-q bdi { white-space: nowrap; }
      .mp-ws-q .n { font-size: 9pt; color: #555; min-width: 16pt; }
      .mp-ws-q .line { flex: 1; border-bottom: 1px solid #000; min-width: 28pt; height: 1em; }
      .mp-ws-key { break-before: page; }
      .mp-ws-key h2 { font-size: 14pt; }
      .mp-ws-key ol { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4pt 12pt; font-size: 11pt; margin: 0; padding-inline-start: 20pt; }
      .mp-ws-foot { margin-top: 14pt; font-size: 9pt; color: #555; }
      /* summary print */
      .mp-summary { border: 0; padding: 0; }
      .mp-print-meta { display: flex !important; flex-wrap: wrap; gap: 6pt 22pt; justify-content: center; margin: 8pt 0; }
      .mp-stat { border: 1px solid #bbb; background: #fff !important; }
      .mp-newbest { border-color: #000; color: #000; background: #fff; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <!-- ================= SETUP ================= -->
    <div id="setup" class="mp-setup">
      <section class="card" aria-labelledby="h-game">
        <h2 id="h-game" data-i18n="choose_game"></h2>
        <div class="mp-modes" id="modes" role="group" aria-labelledby="h-game">
          <button type="button" class="mp-mode" data-mode="sprint"><span class="ico" aria-hidden="true">⚡</span><span class="txt"><b data-i18n="mode_sprint"></b><small data-i18n="mode_sprint_d"></small></span></button>
          <button type="button" class="mp-mode" data-mode="twenty"><span class="ico" aria-hidden="true">🎯</span><span class="txt"><b data-i18n="mode_twenty"></b><small data-i18n="mode_twenty_d"></small></span></button>
          <button type="button" class="mp-mode" data-mode="practice"><span class="ico" aria-hidden="true">🌱</span><span class="txt"><b data-i18n="mode_practice"></b><small data-i18n="mode_practice_d"></small></span></button>
          <button type="button" class="mp-mode" data-mode="table"><span class="ico" aria-hidden="true">📋</span><span class="txt"><b data-i18n="mode_table"></b><small data-i18n="mode_table_d"></small></span></button>
          <button type="button" class="mp-mode" data-mode="duel"><span class="ico" aria-hidden="true">🤝</span><span class="txt"><b data-i18n="mode_duel"></b><small data-i18n="mode_duel_d"></small></span></button>
        </div>
      </section>

      <section class="card" aria-labelledby="h-what">
        <h2 id="h-what" data-i18n="what_practise"></h2>

        <div class="mp-block" id="level-wrap">
          <span class="mp-label" id="lbl-level" data-i18n="level"></span>
          <div class="mp-chips" id="levels" role="group" aria-labelledby="lbl-level">
            <button type="button" class="chip" data-level="d1" data-i18n="lvl_d1"></button>
            <button type="button" class="chip" data-level="d2" data-i18n="lvl_d2"></button>
            <button type="button" class="chip" data-level="d3" data-i18n="lvl_d3"></button>
            <button type="button" class="chip" data-level="tables" data-i18n="lvl_tables"></button>
            <button type="button" class="chip" data-level="squares" data-i18n="lvl_squares"></button>
            <button type="button" class="chip" data-level="cubes" data-i18n="lvl_cubes"></button>
            <button type="button" class="chip" data-level="percent" data-i18n="lvl_percent"></button>
          </div>
        </div>

        <div class="mp-block" id="ops-wrap">
          <span class="mp-label" id="lbl-ops" data-i18n="operations"></span>
          <div class="mp-chips" id="ops" role="group" aria-labelledby="lbl-ops">
            <button type="button" class="chip" data-op="add"><span class="sym" aria-hidden="true">+</span><span data-i18n="op_add"></span></button>
            <button type="button" class="chip" data-op="sub"><span class="sym" aria-hidden="true">−</span><span data-i18n="op_sub"></span></button>
            <button type="button" class="chip" data-op="mul"><span class="sym" aria-hidden="true">×</span><span data-i18n="op_mul"></span></button>
            <button type="button" class="chip" data-op="div"><span class="sym" aria-hidden="true">÷</span><span data-i18n="op_div"></span></button>
          </div>
          <p class="muted small mb0" id="ops-hint" style="margin-top:8px"></p>
        </div>

        <div class="mp-block" id="table-wrap" hidden>
          <span class="mp-label" id="lbl-table" data-i18n="pick_table"></span>
          <div class="mp-tables" id="tables" role="group" aria-labelledby="lbl-table"></div>
        </div>

        <div class="mp-block" id="dur-wrap" hidden>
          <span class="mp-label" id="lbl-dur" data-i18n="duration"></span>
          <div class="seg mp-seg3" id="durs" role="group" aria-labelledby="lbl-dur"></div>
        </div>

        <div class="mp-block" id="duel-wrap" hidden>
          <span class="mp-label" id="lbl-target" data-i18n="race_to"></span>
          <div class="seg mp-seg3" id="targets" role="group" aria-labelledby="lbl-target"></div>
          <span class="mp-label" data-i18n="players" style="margin-top:14px"></span>
          <div class="mp-names">
            <label class="field"><span data-i18n="player1"></span><input type="text" id="name0" maxlength="20" autocomplete="off" data-i18n-placeholder="name_ph"></label>
            <label class="field"><span data-i18n="player2"></span><input type="text" id="name1" maxlength="20" autocomplete="off" data-i18n-placeholder="name_ph"></label>
          </div>
          <label class="check mp-flip"><input type="checkbox" id="flip"><span data-i18n="flip_p1"></span></label>
        </div>

        <div class="mp-block panel">
          <span class="mp-label mb0" data-i18n="sample"></span>
          <div class="mp-sample" id="sample"></div>
        </div>

        <div class="row mp-start-row">
          <button type="button" class="btn btn-primary btn-lg" id="start"><span aria-hidden="true">▶</span><span data-i18n="start"></span></button>
          <button type="button" class="btn" id="print-ws"><span aria-hidden="true">🖨</span><span data-i18n="print_ws"></span></button>
          <button type="button" class="edu-iconbtn mp-mute" id="mute-setup"></button>
        </div>
        <p class="callout mp-best" id="best-line" aria-live="polite"></p>
      </section>

      <section class="card mp-recent" aria-labelledby="h-recent">
        <div class="row spread">
          <h2 id="h-recent" class="mb0" data-i18n="recent"></h2>
          <button type="button" class="btn btn-sm btn-danger" id="reset" data-i18n="reset"></button>
        </div>
        <p class="muted mb0" id="recent-none" data-i18n="recent_none" style="margin-top:10px"></p>
        <div class="scroll-x" id="recent-wrap" style="margin-top:10px"><table class="table" id="recent"></table></div>
      </section>
    </div>

    <!-- ================= ONE-PLAYER GAME ================= -->
    <section id="play" class="card mp-play" hidden>
      <div class="mp-bar">
        <div class="mp-bar-l">
          <span class="badge primary" id="play-mode"></span>
          <span class="muted small mp-desc" id="play-desc"></span>
        </div>
        <div class="mp-bar-r">
          <button type="button" class="edu-iconbtn mp-mute"></button>
          <button type="button" class="edu-iconbtn mp-fs" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="btn btn-sm mp-end" id="end-play" data-i18n-title="end_game" data-i18n-aria-label="end_game"><span class="x" aria-hidden="true">✕</span><span class="txt" data-i18n="end_game"></span></button>
        </div>
      </div>
      <div class="mp-hud">
        <span class="mp-pill" id="time-pill" data-i18n-title="stat_time"><span aria-hidden="true">⏱</span><b id="play-time" class="mp-num">0:00</b></span>
        <span class="mp-pill" id="prog-pill"><span aria-hidden="true">📝</span><span class="lbl" data-i18n="col_q"></span><b id="play-prog" class="mp-num" dir="ltr"></b></span>
        <span class="mp-pill" data-i18n-title="points"><span aria-hidden="true">⭐</span><span class="lbl" data-i18n="points"></span><b id="play-points" class="mp-num">0</b></span>
        <span class="mp-pill" data-i18n-title="streak"><span aria-hidden="true">🔥</span><span class="lbl" data-i18n="streak"></span><b id="play-streak" class="mp-num">0</b></span>
      </div>
      <div class="progress" id="play-progress"><span id="play-bar" style="width:0%"></span></div>

      <div class="mp-stagewrap">
        <div class="mp-arena">
          <div class="mp-qa" id="qa" data-state="count" data-qid="0">
            <div class="mp-phase" id="phase" hidden></div>
            <div class="mp-qline" dir="ltr" aria-live="polite">
              <span class="mp-q" id="q"></span><span class="mp-eq" aria-hidden="true">=</span><output class="mp-ans empty" id="ans" data-i18n-aria-label="your_answer">?</output>
            </div>
            <div class="mp-fb" id="fb" role="status" aria-live="polite"></div>
            <div class="mp-facts" id="facts" dir="ltr"></div>
          </div>
          <div class="mp-padcol">
            <div class="mp-pad" id="pad" role="group" data-i18n-aria-label="your_answer"></div>
            <p class="tiny muted mp-keys" data-i18n="keys_hint"></p>
          </div>
        </div>
        <div class="mp-count" id="count" hidden><span data-i18n="get_ready"></span><b class="mp-num" id="count-n"></b></div>
      </div>
    </section>

    <!-- ================= TWO-PLAYER RACE ================= -->
    <section id="duel" class="mp-duelwrap" hidden>
      <div class="card mp-bar">
        <div class="mp-bar-l">
          <span class="badge primary" data-i18n="mode_duel"></span>
          <b id="duel-goal" class="mp-desc"></b>
        </div>
        <div class="mp-bar-r">
          <button type="button" class="edu-iconbtn mp-mute"></button>
          <button type="button" class="edu-iconbtn mp-fs" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="btn btn-sm mp-end" id="end-duel" data-i18n-title="end_game" data-i18n-aria-label="end_game"><span class="x" aria-hidden="true">✕</span><span class="txt" data-i18n="end_game"></span></button>
        </div>
      </div>
      <div class="mp-stagewrap">
        <div class="mp-duel" id="duel-grid"></div>
        <div class="mp-count" id="duel-count" hidden><span data-i18n="get_ready"></span><b class="mp-num" id="duel-count-n"></b></div>
      </div>
      <div class="card stack mp-dres" id="duel-result" hidden aria-live="polite">
        <div class="mp-emoji" id="dres-emoji" aria-hidden="true"></div>
        <h2 id="dres-title"></h2>
        <div class="scroll-x"><table class="table" id="dres-table"></table></div>
        <div class="row mp-actions">
          <button type="button" class="btn btn-primary btn-lg" id="rematch" data-i18n="rematch"></button>
          <button type="button" class="btn" id="duel-settings" data-i18n="change_settings"></button>
        </div>
      </div>
      <p class="tiny muted mp-keys" data-i18n="duel_keys"></p>
    </section>

    <!-- ================= SUMMARY ================= -->
    <section id="summary" class="card stack mp-summary" hidden>
      <div class="mp-sum-head">
        <div class="mp-emoji" id="sum-emoji" aria-hidden="true"></div>
        <h2 id="sum-title"></h2>
        <p class="muted mb0" id="sum-setting"></p>
        <p class="mp-sum-msg" id="sum-msg"></p>
        <div id="sum-best"></div>
      </div>
      <div class="mp-print-meta">
        <span><span data-i18n="ws_name"></span>: ____________________</span>
        <span><span data-i18n="ws_class"></span>: ________</span>
        <span><span data-i18n="ws_date"></span>: ____________</span>
      </div>
      <div class="mp-stats" id="sum-stats" aria-live="polite"></div>
      <h3 data-i18n="mistakes"></h3>
      <p class="callout success" id="sum-nomist" data-i18n="no_mistakes"></p>
      <div class="scroll-x" id="sum-mist-wrap"><table class="table mp-mist" id="sum-mistakes"></table></div>
      <div class="row mp-actions no-print">
        <button type="button" class="btn btn-primary btn-lg" id="again" data-i18n="play_again"></button>
        <button type="button" class="btn btn-accent" id="practise-mist" data-i18n="practise_mistakes"></button>
        <button type="button" class="btn" id="to-setup" data-i18n="change_settings"></button>
        <button type="button" class="btn" id="print-sum"><span aria-hidden="true">🖨</span><span data-i18n="print"></span></button>
      </div>
    </section>

    <!-- ================= WORKSHEET (only printed) ================= -->
    <div class="mp-ws" id="ws" aria-hidden="true"></div>

    <details class="card mp-help no-print">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="small muted mb0" data-i18n="points_rule"></p>
    </details>
  </main>
  <script src="../../../apps/math-practice/../../shared/edu.js"></script>
  <script src="../../../apps/math-practice/strings.js"></script>
  <script src="../../../apps/math-practice/app.js"></script>
</body>
</html>
