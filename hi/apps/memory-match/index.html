  <style>
    :root { --mm-back: #1d4f91; --mm-back-2: #163d72; --mm-edge: #f0b429; --mm-dot: rgba(255, 255, 255, .2); --mm-avail: 210px; }
    :root[data-theme="dark"] { --mm-back: #2c64ad; --mm-back-2: #224f8c; --mm-edge: #e9a92a; --mm-dot: rgba(255, 255, 255, .18); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mm-back: #2c64ad; --mm-back-2: #224f8c; --mm-edge: #e9a92a; --mm-dot: rgba(255, 255, 255, .18); } }

    .mm-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 960px) { :root { --mm-avail: 300px; } .mm-layout { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); } .mm-settings { position: sticky; top: 76px; } }
    .mt { margin-top: 16px; }
    .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- settings ---------- */
    .mm-settings { display: grid; gap: 12px; }
    .mm-pick { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 960px) { .mm-pick { grid-template-columns: minmax(0, 1fr); } }
    .mm-pick select { width: 100%; font-weight: 600; }
    .mm-seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; }
    .mm-seg button { min-height: 42px; padding: 6px 8px; line-height: 1.2; }
    .mm-hint { margin: -4px 0 0; }
    .mm-names { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mm-names input { width: 100%; }
    .mm-names .field { gap: 2px; }
    .mm-sym { font-weight: 800; }
    .mm-toggles { gap: 6px 16px; }
    .mm-toggles .check { min-height: 40px; }
    :root[lang="ur"] .mm-seg button, :root[lang="ur"] .mm-pick select { line-height: 1.9; }

    /* ---------- play bar ---------- */
    .mm-play { position: relative; min-width: 0; }
    .mm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; }
    .mm-stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .mm-stat { display: inline-flex; align-items: baseline; gap: 5px; background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: .9rem; white-space: nowrap; }
    .mm-stat b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
    .mm-stat span { color: var(--muted); }
    .mm-stat.best { background: var(--accent-soft); }
    .mm-tools { display: flex; gap: 6px; margin-inline-start: auto; }
    .mm-tools .btn { min-height: 40px; }
    .mm-players { display: flex; flex-wrap: wrap; gap: 6px; }
    .mm-pl { --pc: var(--c1); display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--border); border-radius: 12px; padding: 4px 10px; background: var(--surface); font-size: .92rem; min-height: 40px; max-width: 100%; }
    .mm-pl .mm-sym { color: var(--pc); font-size: 1.1rem; }
    .mm-pl .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 15em; min-width: 0; }
    .mm-pl b { font-variant-numeric: tabular-nums; font-size: 1.1rem; }
    .mm-pl.on { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 14%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--pc) 35%, transparent); }
    .mm-pl .arrow { visibility: hidden; color: var(--pc); }
    .mm-pl.on .arrow { visibility: visible; }
    [dir="rtl"] .mm-pl .arrow { display: inline-block; transform: scaleX(-1); }
    .p1 { --pc: var(--c1); } .p2 { --pc: var(--c2); } .p3 { --pc: var(--c3); } .p4 { --pc: var(--c5); }
    .mm-msg { min-height: 1.6em; margin: 10px 2px; font-weight: 600; text-align: center; }
    :root[lang="ur"] .mm-msg { min-height: 2em; }

    /* ---------- board + cards ---------- */
    .mm-board {
      --cols: 4; --rows: 3; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: clamp(5px, 1.3vw, 12px);
      width: min(100%, max(280px, calc((100vh - var(--mm-avail)) * var(--cols) / var(--rows) * .8)));
      width: min(100%, max(280px, calc((100dvh - var(--mm-avail)) * var(--cols) / var(--rows) * .8)));
      margin: 0 auto; touch-action: manipulation;
    }
    .mm-card {
      position: relative; aspect-ratio: 4 / 5; border: 0; padding: 0; margin: 0; background: none; color: var(--text); font: inherit;
      cursor: pointer; border-radius: 12px; perspective: 800px; container-type: inline-size; min-width: 0;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .mm-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .mm-card[aria-disabled="true"] { cursor: default; }
    .mm-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .36s cubic-bezier(.3, .7, .3, 1); border-radius: inherit; }
    .mm-card.up .mm-inner, .mm-card.done .mm-inner { transform: rotateY(180deg); }
    .mm-back, .mm-face {
      position: absolute; inset: 0; border-radius: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;
      -webkit-backface-visibility: hidden; backface-visibility: hidden; overflow: hidden;
    }
    /* face-down: blue with a gold edge, dotted pattern and a diamond motif (shape + pattern, not colour alone) */
    .mm-back {
      background-color: var(--mm-back);
      background-image: radial-gradient(circle, var(--mm-dot) 0 1.6px, transparent 2px), linear-gradient(135deg, var(--mm-back) 0 50%, var(--mm-back-2) 50% 100%);
      background-size: 11px 11px, 100% 100%; border: 3px solid var(--mm-edge); box-shadow: var(--shadow);
    }
    .mm-back::before { content: ""; width: 42%; aspect-ratio: 1; border: 3px solid rgba(255, 255, 255, .88); border-radius: 18%; transform: rotate(45deg); }
    .mm-back::after { content: ""; position: absolute; width: 13%; aspect-ratio: 1; border-radius: 50%; background: var(--mm-edge); }
    .mm-card:hover:not(.up):not(.done) .mm-back { filter: brightness(1.12); }
    .mm-face { transform: rotateY(180deg); background: var(--surface); border: 3px solid var(--accent); box-shadow: var(--shadow); padding: 4%; gap: 3cqi; }
    .mm-card.done .mm-face { border-color: var(--success); background: var(--success-soft); }
    .mm-card.done .mm-face::after { content: "✓"; position: absolute; inset-block-start: 3%; inset-inline-end: 6%; font-weight: 800; color: var(--success); font-size: 1rem; font-size: 17cqi; line-height: 1; }
    .mm-card.miss .mm-face { border-color: var(--danger); border-style: dashed; }
    .mm-by { position: absolute; inset-block-start: 3%; inset-inline-start: 6%; font-size: .9rem; font-size: 15cqi; line-height: 1; font-weight: 800; }
    .mm-emoji { font-size: 2.2rem; font-size: 58cqi; line-height: 1.05; }
    .mm-emoji.sm { font-size: 1.3rem; font-size: 30cqi; }
    .mm-txt { font-weight: 800; line-height: 1.15; text-align: center; overflow-wrap: normal; word-break: normal; max-width: 100%; overflow: hidden; unicode-bidi: plaintext; }
    .mm-txt.nw { white-space: nowrap; }
    .f-xl { font-size: 2rem; font-size: 50cqi; } .f-l { font-size: 1.5rem; font-size: 32cqi; } .f-m { font-size: 1.15rem; font-size: 22cqi; }
    .f-s { font-size: 1rem; font-size: 17cqi; } .f-xs { font-size: .85rem; font-size: 13.5cqi; } .f-xxs { font-size: .7rem; font-size: 11cqi; }
    :root[lang="ur"] .mm-txt { line-height: 1.6; }
    .mm-txt.lat { font-family: "Noto Sans", system-ui, sans-serif; }
    .mm-shape { width: 74%; height: auto; color: var(--c7); }
    .mm-face .mm-tag { position: absolute; inset-block-end: 4%; font-size: .6rem; font-size: 10cqi; color: var(--muted); font-weight: 700; }
    .mm-board.peek .mm-card { cursor: default; }
    @keyframes mm-shake { 0%, 100% { transform: rotateY(180deg); } 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
    .mm-card.miss .mm-inner { animation: mm-shake .35s; }
    @keyframes mm-pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.08); } 100% { transform: rotateY(180deg) scale(1); } }
    .mm-card.justdone .mm-inner { animation: mm-pop .4s; }
    .mm-kbd { text-align: center; margin: 10px 0 0; }
    @media (hover: none) { .mm-kbd { display: none; } }

    /* ---------- result ---------- */
    .mm-result { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 12px; overflow: hidden;
      background: color-mix(in srgb, var(--bg) 78%, transparent); border-radius: var(--radius); }
    .mm-result[hidden] { display: none; }
    .mm-res-box { position: relative; z-index: 1; width: min(440px, 100%); text-align: center; display: grid; gap: 10px; padding: 22px 18px; box-shadow: var(--shadow-lg); animation: edu-pop .25s ease-out; }
    .mm-res-ic { font-size: 3rem; line-height: 1; }
    .mm-res-box h2 { margin: 0; font-size: 1.6rem; }
    .mm-stars { font-size: 2.2rem; letter-spacing: .12em; color: var(--warning); line-height: 1; }
    .mm-stars .off { color: var(--border); }
    .mm-res-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .mm-res-stats div { background: var(--surface-2); border-radius: 10px; padding: 8px; }
    .mm-res-stats b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .mm-res-stats span { font-size: .85rem; color: var(--muted); }
    .mm-res-rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: start; }
    .mm-res-rank li { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; background: var(--surface-2); border-radius: 10px; padding: 6px 12px; }
    .mm-res-rank li .nm { flex: 1 1 0; overflow-wrap: break-word; font-weight: 600; }
    .mm-res-rank li b { margin-inline-start: auto; white-space: nowrap; }
    .mm-res-rank li.win { background: var(--warning-soft); font-weight: 800; }
    .mm-res-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .mm-newbest { color: var(--accent); font-weight: 800; margin: 0; }
    .mm-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .mm-confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; opacity: .9; animation: mm-fall 2.6s ease-in forwards; }
    @keyframes mm-fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .mm-inner { transition: none !important; animation: none !important; }
      .mm-card.miss .mm-inner, .mm-card.justdone .mm-inner { animation: none !important; }
      .mm-confetti { display: none; }
      .mm-res-box { animation: none; }
    }

    /* ---------- full screen (projector) ---------- */
    #play:fullscreen { background: var(--bg); padding: 2vh 2vw; overflow: auto; --mm-avail: 130px; }
    #play:fullscreen .mm-kbd { display: none; }

    /* ---------- best scores + help ---------- */
    .mm-best td, .mm-best th { white-space: nowrap; }

    .mm-help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 40px; display: flex; align-items: center; }
    .mm-help ul { padding-inline-start: 22px; margin: 10px 0 0; }

    /* ---------- printed cards ---------- */
    .pr-grid { display: grid; grid-template-columns: repeat(4, 42mm); gap: 0; }
    .pr-card { width: 42mm; height: 52mm; border: 1px dashed #777; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm; padding: 3mm; text-align: center; break-inside: avoid; overflow: hidden; }
    .pr-card .pe { font-size: 26pt; line-height: 1.1; }
    .pr-card .pt { font-size: 15pt; font-weight: 700; overflow-wrap: anywhere; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="mm-layout">
      <section class="card mm-settings no-print" aria-labelledby="setTitle">
        <h2 id="setTitle" class="sr" data-i18n="set_title"></h2>
        <div class="mm-pick">
          <label class="field"><span data-i18n="deck"></span><select id="deck"></select></label>
          <label class="field"><span data-i18n="size"></span><select id="size"></select></label>
        </div>
        <div class="field">
          <span id="modeLbl" data-i18n="mode"></span>
          <div class="seg mm-seg" id="modeSeg" role="group" aria-labelledby="modeLbl">
            <button type="button" data-mode="solo" data-i18n="m_solo"></button>
            <button type="button" data-mode="players" data-i18n="m_players"></button>
            <button type="button" data-mode="practice" data-i18n="m_practice"></button>
          </div>
        </div>
        <p class="small muted mm-hint" id="modeHint"></p>
        <div id="playersBox" class="stack" hidden>
          <div class="field">
            <span id="pcLbl" data-i18n="players_n"></span>
            <div class="seg mm-seg" id="countSeg" role="group" aria-labelledby="pcLbl">
              <button type="button" data-n="2">2</button><button type="button" data-n="3">3</button><button type="button" data-n="4">4</button>
            </div>
          </div>
          <div class="mm-names" id="names"></div>
        </div>
        <div class="row mm-toggles">
          <label class="check"><input type="checkbox" id="soundChk"> <span data-i18n="sound"></span></label>
          <label class="check"><input type="checkbox" id="speakChk"> <span data-i18n="read_aloud"></span></label>
        </div>
        <div class="row">
          <button type="button" class="btn" id="printBtn"><span aria-hidden="true">🖨️</span> <span data-i18n="print_cards"></span></button>
        </div>
      </section>

      <section id="play" class="mm-play" aria-labelledby="edu-title">
        <div class="card flat mm-bar">
          <div class="mm-stats" id="stats"></div>
          <div class="mm-tools no-print">
            <button type="button" class="btn" id="sayBtn" hidden data-i18n-aria-label="say_last" data-i18n-title="say_last"><span aria-hidden="true">🔊</span></button>
            <button type="button" class="btn" id="fsBtn" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><span aria-hidden="true">⛶</span></button>
            <button type="button" class="btn btn-primary" id="newGame"><span aria-hidden="true">🔄</span> <span data-i18n="new_game"></span></button>
          </div>
        </div>
        <p class="mm-msg" id="msg" aria-live="polite"></p>
        <div class="mm-board" id="board" role="group" data-i18n-aria-label="board_label"></div>
        <p class="tiny muted mm-kbd" data-i18n="kbd_hint"></p>

        <div class="mm-result" id="result" hidden>
          <div class="mm-confetti" id="confetti" aria-hidden="true"></div>
          <div class="card mm-res-box" role="dialog" aria-labelledby="resTitle" aria-describedby="resText">
            <div class="mm-res-ic" id="resIcon" aria-hidden="true">🎉</div>
            <h2 id="resTitle"></h2>
            <div class="mm-stars" id="resStars"></div>
            <p class="mb0" id="resText" aria-live="polite"></p>
            <div class="mm-res-stats" id="resStats"></div>
            <ol class="mm-res-rank" id="resRank"></ol>
            <p class="mm-newbest" id="resBest" hidden><span aria-hidden="true">🏆 </span><span data-i18n="res_new_best"></span></p>
            <p class="small muted mb0" id="resPractice" hidden data-i18n="res_practice"></p>
            <div class="mm-res-actions">
              <button type="button" class="btn btn-accent btn-lg" id="againBtn"><span aria-hidden="true">🔁</span> <span data-i18n="play_again"></span></button>
              <button type="button" class="btn" id="changeBtn" data-i18n="change_settings"></button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <section class="card mt stack no-print" id="bestCard" aria-labelledby="bestTitle">
      <div class="row spread">
        <h2 class="mb0" id="bestTitle"><span aria-hidden="true">🏆 </span><span data-i18n="best_title"></span></h2>
        <button type="button" class="btn btn-danger btn-sm" id="resetScores" data-i18n="reset_scores"></button>
      </div>
      <p class="muted mb0" id="bestEmpty" data-i18n="best_empty"></p>
      <div class="scroll-x"><table class="table mm-best" id="bestTable" hidden></table></div>
