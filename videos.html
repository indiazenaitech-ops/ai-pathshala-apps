<body>
  <main id="app">
    <section class="p-hero">
      <span class="kicker" data-i18n="hero_kicker"></span>
      <h2 data-i18n="vid_title"></h2>
      <p data-i18n="vid_sub"></p>
      <div class="p-cta">
        <a class="btn btn-yt btn-lg" id="subscribe" target="_blank" rel="noopener">▶ <span data-i18n="sub_btn"></span></a>
      </div>
    </section>
    <section class="sec" id="videos" aria-labelledby="edu-title"></section>
  </main>
  <script src="shared/edu.js"></script>
  <script src="shared/videos-strings.js"></script>
  <script src="shared/videos.js"></script>
  <script>
    EDU.init({ slug: 'videos', title: 'page_title', nav: 'videos', strings: window.VIDEOS_STRINGS, waKey: 'wa_videos', sharePath: 'videos.html' });
    EDUVideos.render(document.getElementById('videos'), { filter: true });
    (function () {
      function f() {
        document.getElementById('subscribe').href = (EDU.SITE && EDU.SITE.subscribe) || EDU.YOUTUBE;
        document.title = EDU.t('doc_title');
        var m = document.querySelector('meta[name="description"]'); if (m) m.setAttribute('content', EDU.t('doc_desc'));
      }
      f(); EDU.onLang(f);
    })();
  </script>
  <script src="shared/firebase-config.js"></script>
  <script src="shared/visits.js"></script>
</body>
