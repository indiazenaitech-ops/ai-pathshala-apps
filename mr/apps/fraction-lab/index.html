    .fl-nl .goal { stroke: var(--success); stroke-width: 7; stroke-linecap: round; }
    .fl-nl .goal-dot { fill: var(--success); }
    .fl-nl .goal-t text { fill: var(--success); } .fl-nl .goal-t line { stroke: var(--success); }
    .fl-fb { min-height: 1.6em; font-weight: 700; font-size: 1.12rem; margin: 0; }
    .fl-fb.ok { color: var(--success); } .fl-fb.bad { color: var(--danger); }
    .fl-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .fl-btns .btn-lg { min-width: 9rem; }
    .fl-over { text-align: center; }
    .fl-over .big-number { color: var(--accent); }

    /* ---------- practice ---------- */
    .fl-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .fl-chips .chip { min-height: 42px; font-size: .92rem; }
    .fl-score { display: flex; flex-wrap: wrap; gap: 8px; }
    .fl-q { display: flex; flex-direction: column; gap: 14px; min-height: 320px; }
    .fl-q > .fl-btns { justify-content: center; }
    .fl-qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .fl-qhead .badge { font-size: .85rem; padding: 4px 10px; }
    .fl-prompt { font-size: 1.2rem; font-weight: 700; margin: 0; line-height: 1.6; }
    .fl-qmath { text-align: center; }
    .fl-qmath .fl-math { font-size: clamp(1.8rem, 6vw, 2.8rem); justify-content: center; }
    .fl-pic { display: flex; justify-content: center; direction: ltr; }
    .fl-pic svg { width: 100%; max-width: 230px; }
    .fl-pic svg.fl-bars { max-width: 420px; }
    .fl-ans { display: flex; align-items: center; justify-content: center; gap: 12px; direction: ltr; flex-wrap: wrap; }
    .fl-ans-stack { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .fl-ans-stack .fl-ed-line { width: 5.6rem; }
    .fl-ans input { width: 5.6rem; min-height: 56px; text-align: center; font-size: 1.9rem; font-weight: 800; border-width: 2px; border-radius: 12px; }
    .fl-ans .fl-whole { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .fl-ans .fl-whole input { width: 4.6rem; }
    .fl-ans .fl-whole span { font-size: .78rem; color: var(--muted); text-align: center; max-width: 7rem; line-height: 1.3; }
    .fl-feedback { border-radius: 12px; padding: 12px 14px; border: 2px solid var(--border); }
    .fl-feedback:empty { display: none; }
    .fl-feedback.ok { background: var(--success-soft); border-color: var(--success); }
    .fl-feedback.bad { background: var(--danger-soft); border-color: var(--danger); }
    .fl-feedback.hint { background: var(--warning-soft); border-color: var(--warning); }
    .fl-feedback p { margin: 0 0 6px; }
    .fl-feedback .fl-fbt { font-size: 1.15rem; font-weight: 800; }

    /* ---------- help ---------- */
    .fl-help { margin-top: 16px; }
    .fl-help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 32px; }
    .fl-help ul { margin: 12px 0 0; padding-inline-start: 1.3em; }
    .fl-help li { margin-bottom: 8px; }

    /* ---------- Urdu (Nastaliq) needs taller lines ---------- */
    :root[lang="ur"] .fl-ed-txt, :root[lang="ur"] .fl-prompt, :root[lang="ur"] .fl-steps li p { line-height: 1.95; }
    :root[lang="ur"] .fl-toolbar .tabs button { line-height: 1.7; }

    /* ---------- smartboard / full screen ---------- */
    .edu-fullscreen-on .edu-main { max-width: none; }
    .edu-fullscreen-on .fl-view-pie svg { max-width: 420px; }
    .edu-fullscreen-on .fl-eqmodels figure svg { max-width: 380px; }
    .edu-fullscreen-on .edu-intro { display: none; }

    /* ---------- print ---------- */
    #worksheet { display: none; }
    @media print {
      .fl-toolbar, .fl-help, .fl-sb, .fl-modes, .fl-presets, .fl-opts, .fl-btns, .fl-guess, .fl-chips, .fl-score, .fl-range input { display: none !important; }
      input.fl-in { border: 0; }
      .fl-opseg button[aria-pressed="false"] { display: none; }   /* print only the chosen + or − */
      .fl-panel[hidden] { display: none !important; }
      body.fl-print-ws #app > :not(#worksheet) { display: none !important; }
      body.fl-print-ws #worksheet { display: block !important; color: #000; }
      .fl-ws h1 { font-size: 20pt; margin: 0 0 4pt; }
      .fl-ws-meta { display: flex; flex-wrap: wrap; gap: 6pt 24pt; font-size: 11pt; margin: 0 0 8pt; }
      .fl-ws-sub { font-size: 10pt; margin: 0 0 12pt; color: #333; }
      .fl-ws-list { columns: 2; column-gap: 28pt; margin: 0; padding-inline-start: 22pt; font-size: 12pt; }
      .fl-ws-list li { break-inside: avoid; margin: 0 0 9pt; }
      .fl-ws-list .fl-ws-p { margin: 0 0 4pt; font-size: 10.5pt; }
      .fl-ws-list .fl-math { font-size: 14pt; }
      .fl-ws-list .fl-pic { justify-content: flex-start; direction: inherit; margin: 2pt 0; }   /* under its question in RTL too */
      .fl-ws-list .fl-pic svg { max-width: 92px; }
      .fl-ws-list .fl-pic svg.fl-bars { max-width: 200px; }
      .fl-wsbox { display: inline-block; min-width: 2.6em; min-height: 1.6em; border: 1.5px solid #000; border-radius: 4px; vertical-align: middle; }
      .fl-ws-key { break-before: page; }
      .fl-ws-key h2 { font-size: 15pt; }
      .fl-ws-key ol { columns: 3; font-size: 12pt; padding-inline-start: 22pt; }
      .fl-ws-key li { margin-bottom: 8pt; break-inside: avoid; }
      .fl-ws .fl-svg .pt { fill: #fff; stroke: #000; }
      .fl-ws .fl-svg .s1 { fill: #9a9a9a; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="fl-toolbar no-print">
      <div class="tabs" role="tablist" id="tabs" data-i18n-aria-label="app_title">
        <button type="button" role="tab" id="tab-build" data-tab="build" aria-controls="p-build"><span aria-hidden="true">🍕</span><span data-i18n="tab_build"></span></button>
        <button type="button" role="tab" id="tab-compare" data-tab="compare" aria-controls="p-compare"><span aria-hidden="true">⚖️</span><span data-i18n="tab_compare"></span></button>
        <button type="button" role="tab" id="tab-equiv" data-tab="equiv" aria-controls="p-equiv"><span aria-hidden="true">🔁</span><span data-i18n="tab_equiv"></span></button>
        <button type="button" role="tab" id="tab-add" data-tab="add" aria-controls="p-add"><span aria-hidden="true">➕</span><span data-i18n="tab_add"></span></button>
        <button type="button" role="tab" id="tab-line" data-tab="line" aria-controls="p-line"><span aria-hidden="true">📏</span><span data-i18n="tab_line"></span></button>
        <button type="button" role="tab" id="tab-practice" data-tab="practice" aria-controls="p-practice"><span aria-hidden="true">✏️</span><span data-i18n="tab_practice"></span></button>
      </div>
      <div class="fl-tools">
        <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span><span data-i18n="fullscreen"></span></button>
        <button type="button" class="btn btn-sm btn-danger" id="reset-all"><span aria-hidden="true">↺</span><span data-i18n="reset"></span></button>
      </div>
    </div>

    <!-- ================= BUILD ================= -->
    <section class="fl-panel" id="p-build" role="tabpanel" aria-labelledby="tab-build">
      <div class="fl-two">
        <div class="card stack">
          <h2 data-i18n="build_h"></h2>
          <div id="b-editor"></div>
          <div>
            <span class="fl-lbl" id="b-model-lbl" data-i18n="show_as"></span>
            <div class="seg fl-modes" id="b-model" role="group" aria-labelledby="b-model-lbl">
              <button type="button" data-model="pie" data-i18n="m_pie"></button>
              <button type="button" data-model="bar" data-i18n="m_bar"></button>
              <button type="button" data-model="set" data-i18n="m_set"></button>
              <button type="button" data-model="line" data-i18n="m_line"></button>
            </div>
          </div>
          <div>
            <span class="fl-lbl" id="b-pre-lbl" data-i18n="try_these"></span>
            <div class="fl-presets" id="b-presets" role="group" aria-labelledby="b-pre-lbl"></div>
          </div>
        </div>
        <div class="card">
          <div class="fl-view" id="b-view" role="img"></div>
          <p class="fl-caption" id="b-caption" aria-live="polite"></p>
        </div>
      </div>
      <div class="fl-facts" id="b-facts"></div>
    </section>

    <!-- ================= COMPARE ================= -->
    <section class="fl-panel" id="p-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
      <div class="card stack">
        <h2 data-i18n="cmp_h"></h2>
        <div class="fl-cmp">
          <div class="fl-cmp-col"><span class="fl-lbl" data-i18n="first_frac"></span><div id="c-ed1"></div></div>
          <div class="fl-sign" id="c-sign" aria-live="polite"></div>
          <div class="fl-cmp-col"><span class="fl-lbl" data-i18n="second_frac"></span><div id="c-ed2"></div></div>
        </div>
        <div class="fl-guess" id="c-guess" hidden>
          <p data-i18n="guess_q"></p>
          <div class="fl-signs" id="c-gbtns">
            <button type="button" data-sign="&gt;" id="c-g-gt">&gt;</button>
            <button type="button" data-sign="=" id="c-g-eq">=</button>
            <button type="button" data-sign="&lt;" id="c-g-lt">&lt;</button>
          </div>
        </div>
        <p class="fl-fb center" id="c-gfb" aria-live="polite"></p>
        <div class="fl-opts">
          <label class="check"><input type="checkbox" id="c-cut"><span data-i18n="same_parts"></span></label>
          <label class="check"><input type="checkbox" id="c-guessmode"><span data-i18n="guess_mode"></span></label>
          <button type="button" class="btn" id="c-rand"><span aria-hidden="true">🎲</span><span data-i18n="random"></span></button>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="picture"></h3>
        <div class="fl-rows" id="c-rows"></div>
      </div>
      <div class="callout fl-explain" id="c-explain" aria-live="polite"></div>
    </section>

    <!-- ================= EQUIVALENT ================= -->
    <section class="fl-panel" id="p-equiv" role="tabpanel" aria-labelledby="tab-equiv" hidden>
      <div class="fl-two">
        <div class="card stack">
          <h2 data-i18n="eq_h"></h2>
          <span class="fl-lbl" data-i18n="eq_start"></span>
          <div id="e-editor"></div>
          <div>
            <label class="fl-lbl" for="e-k" data-i18n="eq_mult"></label>
            <div class="fl-range"><input type="range" id="e-k" min="1" max="6" step="1"><output id="e-kout" for="e-k" class="fl-math"></output></div>
          </div>
          <div>
            <span class="fl-lbl" id="e-model-lbl" data-i18n="show_as"></span>
            <div class="seg fl-modes" id="e-model" role="group" aria-labelledby="e-model-lbl">
              <button type="button" data-model="pie" data-i18n="m_pie"></button>
              <button type="button" data-model="bar" data-i18n="m_bar"></button>
            </div>
          </div>
          <div>
            <span class="fl-lbl" id="e-fam-lbl" data-i18n="eq_family"></span>
            <div class="fl-family" id="e-family" role="group" aria-labelledby="e-fam-lbl"></div>
          </div>
          <div class="callout" id="e-simp"></div>
        </div>
        <div class="card">
          <div class="fl-eqhead fl-big" id="e-eq"></div>
          <div class="fl-eqmodels" id="e-models"></div>
          <p class="fl-caption" id="e-explain" aria-live="polite"></p>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="eq_wall"></h3>
        <p class="muted small" id="e-wall-hint"></p>
        <div class="fl-wall" id="e-wall"></div>
      </div>
    </section>

    <!-- ================= ADD / SUBTRACT ================= -->
    <section class="fl-panel" id="p-add" role="tabpanel" aria-labelledby="tab-add" hidden>
      <div class="card stack">
        <h2 data-i18n="add_h"></h2>
        <div class="fl-cmp">
          <div class="fl-cmp-col"><span class="fl-lbl" data-i18n="first_frac"></span><div id="a-ed1"></div></div>
          <div class="fl-opseg" id="a-op" role="group">
            <button type="button" data-op="+" id="a-op-add">+</button>
            <button type="button" data-op="-" id="a-op-sub">−</button>
          </div>
          <div class="fl-cmp-col"><span class="fl-lbl" data-i18n="second_frac"></span><div id="a-ed2"></div></div>
          <div class="fl-eqres fl-big" id="a-result" aria-live="polite"></div>
        </div>
        <div class="callout warning" id="a-warn" hidden>
          <p class="mb0" data-i18n="sub_neg"></p>
          <button type="button" class="btn btn-sm" id="a-swap2" style="margin-top:8px"><span aria-hidden="true">⇄</span><span data-i18n="swap"></span></button>
        </div>
        <div class="fl-opts">
          <label class="check"><input type="checkbox" id="a-stepmode"><span data-i18n="step_mode"></span></label>
          <button type="button" class="btn" id="a-swap"><span aria-hidden="true">⇄</span><span data-i18n="swap"></span></button>
          <button type="button" class="btn" id="a-rand"><span aria-hidden="true">🎲</span><span data-i18n="random"></span></button>
        </div>
      </div>
      <div class="fl-two" id="a-work">
        <div class="card">
          <h3 data-i18n="steps_h"></h3>
          <ol class="fl-steps" id="a-steps" aria-live="polite"></ol>
          <div class="fl-btns" style="margin-top:12px">
            <button type="button" class="btn btn-primary" id="a-next"><span data-i18n="next_step"></span><span aria-hidden="true"> ▶</span></button>
            <button type="button" class="btn" id="a-all" data-i18n="show_all"></button>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="picture"></h3>
          <p class="muted small" id="a-vis-cap"></p>
          <div class="fl-rows" id="a-vis"></div>
          <div class="fl-legend" id="a-legend"></div>
        </div>
      </div>
    </section>

    <!-- ================= NUMBER LINE GAME ================= -->
    <section class="fl-panel" id="p-line" role="tabpanel" aria-labelledby="tab-line" hidden>
      <div class="card stack">
        <div class="row spread">
          <h2 class="mb0" data-i18n="nl_h"></h2>
          <div class="seg fl-modes" id="l-level" role="group">
            <button type="button" data-level="easy" data-i18n="lvl_easy"></button>
            <button type="button" data-level="medium" data-i18n="lvl_medium"></button>
            <button type="button" data-level="hard" data-i18n="lvl_hard"></button>
          </div>
        </div>
        <p class="muted small mb0" id="l-desc"></p>
        <div class="fl-hud" id="l-hud"></div>
        <div id="l-play">
          <div class="fl-target"><span data-i18n="nl_place"></span><span id="l-target"></span></div>
          <div class="fl-nlwrap" id="l-stage"></div>
          <p class="muted small" data-i18n="nl_help"></p>
        </div>
        <div class="fl-over" id="l-over" hidden></div>
        <p class="fl-fb" id="l-fb" aria-live="polite"></p>
        <div class="fl-btns">
          <button type="button" class="btn btn-primary btn-lg" id="l-check" data-i18n="check"></button>
          <button type="button" class="btn btn-accent btn-lg" id="l-next" hidden><span data-i18n="next"></span><span aria-hidden="true"> ▶</span></button>
          <button type="button" class="btn" id="l-restart"><span aria-hidden="true">↺</span><span data-i18n="new_game"></span></button>
        </div>
      </div>
    </section>

    <!-- ================= PRACTICE ================= -->
    <section class="fl-panel" id="p-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="fl-two">
        <div class="card stack">
          <h2 data-i18n="pr_h"></h2>
          <div>
            <span class="fl-lbl" id="p-types-lbl" data-i18n="pr_types"></span>
            <div class="fl-chips" id="p-types" role="group" aria-labelledby="p-types-lbl"></div>
          </div>
          <div>
            <span class="fl-lbl" id="p-level-lbl" data-i18n="pr_level"></span>
            <div class="seg fl-modes" id="p-level" role="group" aria-labelledby="p-level-lbl">
              <button type="button" data-level="junior" data-i18n="lvl_junior"></button>
              <button type="button" data-level="senior" data-i18n="lvl_senior"></button>
            </div>
          </div>
          <div class="fl-score" id="p-score" aria-live="polite"></div>
          <div class="fl-btns">
            <button type="button" class="btn" id="p-print"><span aria-hidden="true">🖨</span><span data-i18n="print_ws"></span></button>
            <button type="button" class="btn btn-danger btn-sm" id="p-reset" data-i18n="pr_reset"></button>
          </div>
          <p class="muted small mb0" data-i18n="saved_local"></p>
        </div>
        <div class="card fl-q" id="p-q">
          <div class="fl-qhead"><span class="badge primary" id="p-type"></span><span class="muted small" id="p-num-lbl"></span></div>
          <p class="fl-prompt" id="p-prompt"></p>
          <div class="fl-qmath" id="p-math"></div>
          <div class="fl-pic" id="p-pic"></div>
          <div class="fl-ans" id="p-fracans">
            <div class="fl-whole" id="p-whole-wrap">
              <input type="text" inputmode="numeric" autocomplete="off" id="p-whole" data-i18n-aria-label="whole_num">
              <span data-i18n="whole_opt"></span>
            </div>
            <div class="fl-ans-stack">
              <input type="text" inputmode="numeric" autocomplete="off" id="p-num" data-i18n-aria-label="numerator">
              <div class="fl-ed-line"></div>
              <input type="text" inputmode="numeric" autocomplete="off" id="p-den" data-i18n-aria-label="denominator">
            </div>
          </div>
          <div class="fl-signs" id="p-signs">
            <button type="button" data-sign="&gt;" id="p-s-gt">&gt;</button>
            <button type="button" data-sign="=" id="p-s-eq">=</button>
            <button type="button" data-sign="&lt;" id="p-s-lt">&lt;</button>
          </div>
          <div class="fl-btns">
            <button type="button" class="btn btn-primary btn-lg" id="p-check" data-i18n="check"></button>
            <button type="button" class="btn btn-accent btn-lg" id="p-next" hidden><span data-i18n="next_q"></span><span aria-hidden="true"> ▶</span></button>
          </div>
          <div class="fl-feedback" id="p-fb" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <details class="card fl-help no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>

    <div id="worksheet" class="fl-ws"></div>
  </main>
  <script src="../../../apps/fraction-lab/../../shared/edu.js"></script>
  <script src="../../../apps/fraction-lab/strings.js"></script>
  <script src="../../../apps/fraction-lab/app.js"></script>
</body>
</html>
