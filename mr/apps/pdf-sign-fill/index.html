            <button type="button" role="tab" data-tool="stamp" aria-controls="pStamp"><span class="i" aria-hidden="true">📮</span><span data-i18n="tool_stamp"></span></button>
            <button type="button" role="tab" data-tool="hide" aria-controls="pHide"><span class="i" aria-hidden="true">⬜</span><span data-i18n="tool_hide"></span></button>
            <button type="button" role="tab" data-tool="form" aria-controls="pForm"><span class="i" aria-hidden="true">📝</span><span data-i18n="tool_form"></span></button>
          </div>

          <!-- Signature -->
          <div class="sf-panel" id="pSign" role="tabpanel">
            <div class="seg w100" role="group" id="sigModeSeg">
              <button type="button" data-val="draw" data-i18n="sig_draw"></button>
              <button type="button" data-val="type" data-i18n="sig_type"></button>
              <button type="button" data-val="photo" data-i18n="sig_photo"></button>
            </div>
            <div id="sigDrawBox" class="stack">
              <div class="sf-pad-wrap">
                <canvas id="sigPad" data-i18n-aria-label="sig_pad_hint"></canvas>
                <span class="sf-pad-line" aria-hidden="true"></span><span class="sf-pad-x" aria-hidden="true">✕</span>
              </div>
              <div class="row spread">
                <span class="tiny muted" data-i18n="sig_pad_hint"></span>
                <button class="btn btn-sm" type="button" id="sigClear" data-i18n="clear"></button>
              </div>
            </div>
            <div id="sigTypeBox" class="stack" hidden>
              <label class="field"><span data-i18n="sig_type_label"></span><input type="text" id="sigTypeText" class="no-i18n" maxlength="60" autocomplete="name" data-i18n-placeholder="sig_type_ph"></label>
              <div class="sf-type-prev no-i18n" id="sigTypePrev" aria-hidden="true"></div>
            </div>
            <div id="sigPhotoBox" class="stack" hidden>
              <button class="btn" type="button" id="sigPhotoBtn"><span aria-hidden="true">🖼</span> <span data-i18n="sig_photo_pick"></span></button>
              <input type="file" id="sigPhotoInput" accept="image/*" hidden>
              <img id="sigPhotoPrev" class="sf-photo-prev" alt="" hidden>
              <p class="tiny muted mb0" data-i18n="sig_photo_hint"></p>
            </div>
            <div class="field"><span data-i18n="ink"></span>
              <div class="sf-colors" role="group" id="inkColors">
                <button type="button" data-val="#1a3fb5" aria-pressed="true"><i style="background:#1a3fb5"></i><span data-i18n="col_blue"></span></button>
                <button type="button" data-val="#111111"><i style="background:#111"></i><span data-i18n="col_black"></span></button>
                <button type="button" data-val="#c81e1e"><i style="background:#c81e1e"></i><span data-i18n="col_red"></span></button>
                <button type="button" data-val="#1b7f3b"><i style="background:#1b7f3b"></i><span data-i18n="col_green"></span></button>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary" type="button" id="sigUse"><span aria-hidden="true">＋</span> <span data-i18n="sig_use"></span></button>
              <button class="btn" type="button" id="sigUseInit" data-i18n="sig_use_init"></button>
            </div>
            <div id="savedBox" class="stack" hidden>
              <p class="small muted mb0" data-i18n="sig_saved_title"></p>
              <div class="sf-saved" id="savedSig" hidden>
                <img alt="" id="savedSigImg">
                <div><strong data-i18n="sig_saved_sig"></strong>
                  <div class="acts">
                    <button class="btn btn-sm btn-primary" type="button" data-slot="sig" data-act="add" data-i18n="sig_add"></button>
                    <button class="btn btn-sm" type="button" data-slot="sig" data-act="all" data-i18n="sig_add_all"></button>
                    <button class="btn btn-sm btn-ghost" type="button" data-slot="sig" data-act="forget" data-i18n="sig_forget"></button>
                  </div>
                </div>
              </div>
              <div class="sf-saved" id="savedInit" hidden>
                <img alt="" id="savedInitImg">
                <div><strong data-i18n="sig_saved_init"></strong>
                  <div class="acts">
                    <button class="btn btn-sm btn-primary" type="button" data-slot="init" data-act="add" data-i18n="sig_add"></button>
                    <button class="btn btn-sm" type="button" data-slot="init" data-act="all" data-i18n="sig_add_all"></button>
                    <button class="btn btn-sm btn-ghost" type="button" data-slot="init" data-act="forget" data-i18n="sig_forget"></button>
                  </div>
                </div>
              </div>
              <p class="tiny muted mb0" data-i18n="sig_saved_note"></p>
            </div>
          </div>

          <!-- Text -->
          <div class="sf-panel" id="pText" role="tabpanel" hidden>
            <label class="field"><span data-i18n="text_label"></span><input type="text" id="textIn" class="no-i18n" dir="auto" maxlength="200" data-i18n-placeholder="text_ph"></label>
            <div class="sf-two">
              <label class="field"><span data-i18n="text_size"></span><input type="number" id="textSize" min="6" max="72" step="1" inputmode="numeric" value="14"></label>
              <div class="field"><span data-i18n="text_style"></span>
                <div class="seg w100" role="group" id="fontSeg">
                  <button type="button" data-val="sans" data-i18n="font_normal"></button>
                  <button type="button" data-val="hand" data-i18n="font_hand"></button>
                </div>
              </div>
            </div>
            <p class="tiny muted mb0" data-i18n="text_ink_note"></p>
            <button class="btn btn-primary" type="button" id="textAdd"><span aria-hidden="true">＋</span> <span data-i18n="text_add"></span></button>
          </div>

          <!-- Date -->
          <div class="sf-panel" id="pDate" role="tabpanel" hidden>
            <div class="sf-two">
              <label class="field"><span data-i18n="date_label"></span><input type="date" id="dateIn"></label>
              <label class="field"><span data-i18n="date_fmt"></span><select id="dateFmt" class="no-i18n"></select></label>
            </div>
            <label class="field"><span data-i18n="text_size"></span><input type="number" id="dateSize" min="6" max="72" step="1" inputmode="numeric" value="12"></label>
            <button class="btn btn-primary" type="button" id="dateAdd"><span aria-hidden="true">＋</span> <span data-i18n="date_add"></span></button>
          </div>

          <!-- Tick / cross -->
          <div class="sf-panel" id="pMark" role="tabpanel" hidden>
            <p class="small muted mb0" data-i18n="mark_help"></p>
            <div class="sf-marks">
              <button class="btn btn-primary" type="button" id="tickAdd"><span aria-hidden="true">✔</span> <span data-i18n="mark_tick"></span></button>
              <button class="btn" type="button" id="crossAdd"><span aria-hidden="true">✘</span> <span data-i18n="mark_cross"></span></button>
            </div>
          </div>

          <!-- Self attested -->
          <div class="sf-panel" id="pSelf" role="tabpanel" hidden>
            <p class="small mb0" data-i18n="self_help"></p>
            <label class="field"><span data-i18n="self_text_label"></span><input type="text" id="selfText" class="no-i18n" dir="auto" maxlength="80"></label>
            <p class="tiny muted mb0" id="selfNeed" data-i18n="self_need_sig" hidden></p>
            <div class="row">
              <button class="btn btn-primary" type="button" id="selfAdd"><span aria-hidden="true">＋</span> <span data-i18n="self_add"></span></button>
              <button class="btn" type="button" id="selfAddAll" data-i18n="self_add_all"></button>
            </div>
          </div>

          <!-- Stamp / seal -->
          <div class="sf-panel" id="pStamp" role="tabpanel" hidden>
            <p class="small muted mb0" data-i18n="stamp_help"></p>
            <button class="btn btn-primary" type="button" id="stampBtn"><span aria-hidden="true">🖼</span> <span data-i18n="stamp_pick"></span></button>
            <input type="file" id="stampInput" accept="image/*" hidden>
            <div class="sf-saved" id="stampBox" hidden>
              <img alt="" id="stampImg">
              <div><strong data-i18n="stamp_last"></strong>
                <div class="acts">
                  <button class="btn btn-sm btn-primary" type="button" id="stampAdd" data-i18n="sig_add"></button>
                  <button class="btn btn-sm" type="button" id="stampAddAll" data-i18n="sig_add_all"></button>
                </div>
              </div>
            </div>
          </div>

          <!-- White-out -->
          <div class="sf-panel" id="pHide" role="tabpanel" hidden>
            <p class="small mb0" data-i18n="hide_help"></p>
            <button class="btn btn-primary" type="button" id="hideAdd"><span aria-hidden="true">＋</span> <span data-i18n="hide_add"></span></button>
          </div>

          <!-- Form fields -->
          <div class="sf-panel" id="pForm" role="tabpanel" hidden>
            <p class="small muted mb0" id="formHelp"></p>
            <div class="sf-form-list no-i18n" id="formList"></div>
            <label class="check" id="flattenBox" hidden><input type="checkbox" id="flatten" checked> <span data-i18n="form_flatten"></span></label>
          </div>
        </div>

        <div class="card stack sf-save">
          <label class="field">
            <span data-i18n="out_name"></span>
            <input type="text" id="outName" maxlength="80" autocomplete="off" spellcheck="false">
          </label>
          <button class="btn btn-primary btn-lg" id="saveBtn" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="save_btn"></span></button>
          <div id="progBox" class="row" hidden><span class="sf-spin" aria-hidden="true"></span><span class="small muted" id="progMsg" aria-live="polite"></span></div>
          <div class="callout success sf-result" id="result" role="status" hidden>
            <p class="mb0" id="resultMsg"></p>
            <div class="row">
              <button class="btn btn-sm" type="button" id="againBtn"><span aria-hidden="true">⬇</span> <span data-i18n="download_again"></span></button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="callout warning sf-legal" id="legal">
      <p><strong data-i18n="legal_title"></strong><span data-i18n="legal_body"></span></p>
    </div>

    <details class="card" id="helpBox">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="keys_title"></h3>
      <ul class="sf-keys small">
        <li data-i18n="key1"></li>
        <li data-i18n="key2"></li>
        <li data-i18n="key3"></li>
        <li data-i18n="key4"></li>
      </ul>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="reset_help"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/pdf-sign-fill/../../shared/edu.js"></script>
  <script src="../../../apps/pdf-sign-fill/strings.js"></script>
  <script src="../../../apps/pdf-sign-fill/app.js"></script>
</body>
</html>
