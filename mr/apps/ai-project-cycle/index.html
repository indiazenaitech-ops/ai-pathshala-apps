      #canvas .a-lines .ln, #canvas .blank-line { border-bottom-color: #777 !important; }
      #canvas .cv-head { border-bottom-color: #000 !important; }
      .cv-w-grid, .cv-stages { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      .cv-title { font-size: 16pt; }
      .cv-ps-text { font-size: 11.5pt; }
      .cv-box { padding: 6px 8px 8px; }
      /* let the long stage boxes continue on the next page instead of leaving half-empty pages;
         keep each question with its answer and each heading with what follows */
      #canvas .cv-stages > .cv-box { break-inside: auto; }
      #canvas .qa, #canvas .cv-checks li { break-inside: avoid; }
      #canvas .cv-h, #canvas .cv-wh, #canvas .qa > .q { break-after: avoid; }
      #canvas .qa + .qa { margin-top: 5px; }
      #canvas .cv-h { margin-bottom: 4px; }
      #canvas .cv-checks { gap: 1px; }
      /* tighter lines for every script except Nastaliq, whose tall letters need the room */
      :root:not([lang="ur"]) #canvas .cv-checks li { line-height: 1.3; }
      :root:not([lang="ur"]) #canvas .cv-ps-text { line-height: 1.55; }
      :root[lang="ur"] #canvas .q { font-size: .9em; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro no-print" data-i18n="intro"></p>

    <div class="help-grid no-print">
    <details class="card howto" id="howto">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
      </ul>
      <h3 data-i18n="inside_title"></h3>
      <p class="mb0" data-i18n="inside_text"></p>
    </details>

    <details class="card howto" id="teacher">
      <summary><strong data-i18n="teacher_title"></strong></summary>
      <ul>
        <li data-i18n="tt1"></li>
        <li data-i18n="tt2"></li>
        <li data-i18n="tt3"></li>
        <li data-i18n="tt4"></li>
        <li data-i18n="tt5"></li>
        <li data-i18n="tt6"></li>
      </ul>
    </details>
    </div>

    <section class="card no-print" id="proj-card">
      <div class="proj-row">
        <div class="field proj-pick">
          <label for="proj-select" data-i18n="project_label"></label>
          <select id="proj-select" class="no-i18n"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-new"><span aria-hidden="true">＋</span> <span data-i18n="new_project"></span></button>
        <button type="button" class="btn btn-danger" id="btn-del"><span aria-hidden="true">🗑</span> <span data-i18n="delete_project"></span></button>
      </div>
      <div class="samples-row">
        <span class="lbl" data-i18n="samples_label"></span>
        <span class="row" id="samples" style="gap:8px"></span>
      </div>
      <div class="callout accent small" id="sample-note" hidden><span data-i18n="sample_note"></span></div>
      <div class="proj-foot">
        <div class="row">
          <button type="button" class="btn btn-sm" id="btn-export"><span aria-hidden="true">⬇</span> <span data-i18n="export_json"></span></button>
          <button type="button" class="btn btn-sm" id="btn-import"><span aria-hidden="true">⬆</span> <span data-i18n="import_json"></span></button>
        </div>
        <span class="muted tiny" id="save-status" aria-live="polite"></span>
      </div>
    </section>

    <nav class="card no-print" id="stepper-card" data-i18n-aria-label="stages_label">
      <div class="overall-row">
        <strong id="overall" aria-live="polite"></strong>
      </div>
      <div class="progress" aria-hidden="true"><span id="overall-bar" style="width:0%"></span></div>
      <ol class="stepper" id="stepper"></ol>
    </nav>

    <section class="card" id="work">
      <header class="stage-head no-print">
        <span class="stage-ico" id="stage-ico" aria-hidden="true"></span>
        <div class="grow">
          <span class="badge primary" id="step-of"></span>
          <h2 id="stage-title" tabindex="-1"></h2>
          <p class="en-term no-i18n" id="stage-en" lang="en" hidden></p>
          <p class="desc" id="stage-desc"></p>
        </div>
      </header>

      <div id="stage-body" class="no-print">
        <!-- 1. Problem Scoping -->
        <section class="stage-sec" data-stage="1">
          <div class="panel">
            <h3 data-i18n="info_h"></h3>
            <div class="info-grid">
              <div class="field"><label for="f-title" data-i18n="f_title"></label><input type="text" id="f-title" data-field="title" dir="auto" maxlength="120" data-i18n-placeholder="f_title_ph"></div>
              <div class="field"><label for="f-team" data-i18n="f_team"></label><input type="text" id="f-team" data-field="team" dir="auto" maxlength="200" data-i18n-placeholder="f_team_ph"></div>
              <div class="field"><label for="f-cls" data-i18n="f_class"></label><input type="text" id="f-cls" data-field="cls" dir="auto" maxlength="40" data-i18n-placeholder="f_class_ph"></div>
              <div class="field"><label for="f-sdg" data-i18n="f_sdg"></label><select id="f-sdg"></select></div>
            </div>
          </div>

          <div class="w-grid">
            <div class="w-box w-who">
              <div class="w-head"><span class="w-badge" aria-hidden="true">👥</span><h3 data-i18n="w_who"></h3></div>
              <div class="field"><label for="f-who" data-i18n="q_who"></label><textarea id="f-who" data-field="who" dir="auto" rows="3"></textarea></div>
              <div class="field"><label for="f-who_know" data-i18n="q_who_know"></label><textarea id="f-who_know" data-field="who_know" dir="auto" rows="3"></textarea></div>
            </div>
            <div class="w-box w-what">
              <div class="w-head"><span class="w-badge" aria-hidden="true">❓</span><h3 data-i18n="w_what"></h3></div>
              <div class="field"><label for="f-what" data-i18n="q_what"></label><textarea id="f-what" data-field="what" dir="auto" rows="3"></textarea></div>
              <div class="field"><label for="f-what_evidence" data-i18n="q_what_evidence"></label><textarea id="f-what_evidence" data-field="what_evidence" dir="auto" rows="3"></textarea></div>
            </div>
            <div class="w-box w-where">
              <div class="w-head"><span class="w-badge" aria-hidden="true">📍</span><h3 data-i18n="w_where"></h3></div>
              <div class="field"><label for="f-where" data-i18n="q_where"></label><textarea id="f-where" data-field="where" dir="auto" rows="4"></textarea></div>
            </div>
            <div class="w-box w-why">
              <div class="w-head"><span class="w-badge" aria-hidden="true">💡</span><h3 data-i18n="w_why"></h3></div>
              <div class="field"><label for="f-why_value" data-i18n="q_why_value"></label><textarea id="f-why_value" data-field="why_value" dir="auto" rows="3"></textarea></div>
              <div class="field"><label for="f-why_improve" data-i18n="q_why_improve"></label><textarea id="f-why_improve" data-field="why_improve" dir="auto" rows="3"></textarea></div>
            </div>
          </div>

          <div class="ps-box">
            <h3 data-i18n="ps_h"></h3>
            <p class="small ps-tpl mb0" data-i18n="ps_help"></p>
            <div class="ps-grid">
              <div class="field"><label for="f-ps_who" data-i18n="ps_l_who"></label><textarea class="one-line" id="f-ps_who" data-field="ps_who" dir="auto" rows="1" maxlength="240"></textarea></div>
              <div class="field"><label for="f-ps_what" data-i18n="ps_l_what"></label><textarea class="one-line" id="f-ps_what" data-field="ps_what" dir="auto" rows="1" maxlength="240"></textarea></div>
              <div class="field"><label for="f-ps_where" data-i18n="ps_l_where"></label><textarea class="one-line" id="f-ps_where" data-field="ps_where" dir="auto" rows="1" maxlength="240"></textarea></div>
              <div class="field"><label for="f-ps_why" data-i18n="ps_l_why"></label><textarea class="one-line" id="f-ps_why" data-field="ps_why" dir="auto" rows="1" maxlength="240"></textarea></div>
            </div>
            <button type="button" class="btn btn-sm" id="ps-fill"><span aria-hidden="true">✨</span> <span data-i18n="ps_fill"></span></button>
            <div class="ps-out">
              <div class="tiny ps-out-label" data-i18n="ps_preview"></div>
              <p id="ps-preview" class="no-i18n" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <!-- 2. Data Acquisition -->
        <section class="stage-sec" data-stage="2" hidden>
          <div class="field">
            <label for="f-features" data-i18n="q_features"></label>
            <textarea id="f-features" data-field="features" dir="auto" rows="5"></textarea>
            <span class="hint" id="feat-count" aria-live="polite"></span>
          </div>
          <fieldset class="opt-set">
            <legend data-i18n="sources_h"></legend>
            <div class="opt-grid" id="opts-sources"></div>
          </fieldset>
          <div class="field"><label for="f-source_details" data-i18n="q_source_details"></label><textarea id="f-source_details" data-field="source_details" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-data_check" data-i18n="q_data_check"></label><textarea id="f-data_check" data-field="data_check" dir="auto" rows="3"></textarea></div>
          <div class="callout warning">
            <h3><span aria-hidden="true">🛡️</span> <span data-i18n="scrape_h"></span></h3>
            <ul>
              <li data-i18n="scrape1"></li>
              <li data-i18n="scrape2"></li>
              <li data-i18n="scrape3"></li>
              <li data-i18n="scrape4"></li>
            </ul>
          </div>
        </section>

        <!-- 3. Data Exploration -->
        <section class="stage-sec" data-stage="3" hidden>
          <fieldset class="opt-set">
            <legend data-i18n="charts_h"></legend>
            <div class="opt-grid" id="opts-charts"></div>
          </fieldset>
          <div class="field"><label for="f-explore_q" data-i18n="q_explore_q"></label><textarea id="f-explore_q" data-field="explore_q" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-explore_notes" data-i18n="q_explore_notes"></label><textarea id="f-explore_notes" data-field="explore_notes" dir="auto" rows="3"></textarea></div>
        </section>

        <!-- 4. Modelling -->
        <section class="stage-sec" data-stage="4" hidden>
          <fieldset class="opt-set">
            <legend data-i18n="approach_h"></legend>
            <div class="ap-grid">
              <button type="button" class="ap-card" id="ap-rule" data-ap="rule" aria-pressed="false"><span class="ap-ico" aria-hidden="true">📐</span><span class="ap-t" data-i18n="ap_rule"></span><span class="ap-d" data-i18n="ap_rule_d"></span></button>
              <button type="button" class="ap-card" id="ap-learn" data-ap="learn" aria-pressed="false"><span class="ap-ico" aria-hidden="true">🧠</span><span class="ap-t" data-i18n="ap_learn"></span><span class="ap-d" data-i18n="ap_learn_d"></span></button>
            </div>
          </fieldset>
          <div id="task-wrap" hidden>
            <div class="sub-h" id="task-h" data-i18n="task_h"></div>
            <div class="task-chips" role="group" aria-labelledby="task-h">
              <button type="button" class="chip" id="tk-class" data-task="class" aria-pressed="false" data-i18n="tk_class"></button>
              <button type="button" class="chip" id="tk-reg" data-task="reg" aria-pressed="false" data-i18n="tk_reg"></button>
              <button type="button" class="chip" id="tk-cluster" data-task="cluster" aria-pressed="false" data-i18n="tk_cluster"></button>
              <button type="button" class="chip" id="tk-unsure" data-task="unsure" aria-pressed="false" data-i18n="tk_unsure"></button>
            </div>
          </div>
          <div class="field"><label for="f-model_reason" data-i18n="q_model_reason"></label><textarea id="f-model_reason" data-field="model_reason" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-model_how" id="l-model_how"></label><textarea id="f-model_how" data-field="model_how" dir="auto" rows="4"></textarea></div>
          <p class="callout small mb0"><span aria-hidden="true">🧰</span> <span data-i18n="tools_tip"></span> <a id="lnk-tm" href="../../../apps/ai-project-cycle/../teachable-machine/index.html" data-i18n="tools_link"></a></p>
        </section>

        <!-- 5. Evaluation -->
        <section class="stage-sec" data-stage="5" hidden>
          <div class="field"><label for="f-test_plan" data-i18n="q_test_plan"></label><textarea id="f-test_plan" data-field="test_plan" dir="auto" rows="3"></textarea></div>
          <fieldset class="opt-set">
            <legend data-i18n="metrics_h"></legend>
            <div class="opt-grid" id="opts-metrics"></div>
          </fieldset>
          <p class="callout small mb0"><span aria-hidden="true">🎯</span> <span data-i18n="fpfn"></span> <a id="lnk-cm" href="../../../apps/ai-project-cycle/../confusion-matrix-lab/index.html" data-i18n="cm_link"></a></p>
          <div class="field"><label for="f-success" data-i18n="q_success"></label><textarea id="f-success" data-field="success" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-error_cost" data-i18n="q_error_cost"></label><textarea id="f-error_cost" data-field="error_cost" dir="auto" rows="3"></textarea></div>
        </section>

        <!-- 6. Deployment -->
        <section class="stage-sec" data-stage="6" hidden>
          <div class="field"><label for="f-deploy_how" data-i18n="q_deploy_how"></label><textarea id="f-deploy_how" data-field="deploy_how" dir="auto" rows="4"></textarea></div>
          <div class="field"><label for="f-deploy_care" data-i18n="q_deploy_care"></label><textarea id="f-deploy_care" data-field="deploy_care" dir="auto" rows="4"></textarea></div>
        </section>

        <!-- 7. Ethics check -->
        <section class="stage-sec" data-stage="7" hidden>
          <fieldset class="opt-set">
            <legend data-i18n="eth_checks_h"></legend>
            <ul class="checks" id="checks"></ul>
          </fieldset>
          <div class="callout eth-status" id="eth-status" aria-live="polite"><span id="eth-score"></span><span id="eth-msg"></span></div>
          <div class="field"><label for="f-eth_privacy" data-i18n="q_eth_privacy"></label><textarea id="f-eth_privacy" data-field="eth_privacy" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-eth_bias" data-i18n="q_eth_bias"></label><textarea id="f-eth_bias" data-field="eth_bias" dir="auto" rows="3"></textarea></div>
          <div class="field"><label for="f-eth_safety" data-i18n="q_eth_safety"></label><textarea id="f-eth_safety" data-field="eth_safety" dir="auto" rows="3"></textarea></div>
        </section>
      </div>

      <!-- 8. Full canvas (always printed) -->
      <div id="canvas-body" class="canvas-hide">
        <div class="cv-tools no-print">
          <button type="button" class="btn btn-primary" id="btn-print"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <button type="button" class="btn" id="btn-print-blank"><span aria-hidden="true">📄</span> <span data-i18n="print_blank"></span></button>
          <button type="button" class="btn" id="btn-txt"><span aria-hidden="true">⬇</span> <span data-i18n="download_txt"></span></button>
          <button type="button" class="btn" id="btn-copy"><span aria-hidden="true">📋</span> <span data-i18n="copy"></span></button>
          <button type="button" class="btn" id="btn-fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
        </div>
        <div id="canvas"></div>
      </div>

      <div class="stage-nav no-print">
        <button type="button" class="btn" id="btn-prev"><span class="flip" aria-hidden="true">←</span> <span data-i18n="previous"></span></button>
        <button type="button" class="btn btn-primary" id="btn-next"><span data-i18n="next"></span> <span class="flip" aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>
  <script src="../../../apps/ai-project-cycle/../../shared/edu.js"></script>
  <script src="../../../apps/ai-project-cycle/strings.js"></script>
  <script src="../../../apps/ai-project-cycle/content.js"></script>
  <script src="../../../apps/ai-project-cycle/app.js"></script>
</body>
</html>
