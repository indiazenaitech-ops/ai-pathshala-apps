  <style>
    #app { --board: #c9d6df; --cellbg: #e6edf2; --gap: 8px; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #app { --board: #24303a; --cellbg: #33414d; } }
    :root[data-theme="dark"] #app { --board: #24303a; --cellbg: #33414d; }
    #app .seg button, #app .btn-sm { min-height: 42px; }
    .gtabs button { min-height: 48px; font-size: 1rem; display: inline-flex; align-items: center; gap: 6px; }
    @media (max-width: 560px) { .gtabs button { flex: 1 1 calc(50% - 4px); justify-content: center; padding: 8px 6px; white-space: normal; text-align: center; line-height: 1.25; } }
    .lbl { font-weight: 600; font-size: .9rem; }
    .pg { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .pg { grid-template-columns: minmax(0, 1fr) 330px; } }
    .stage-card { display: flex; flex-direction: column; gap: 12px; }
    .status { margin: 0; font-weight: 700; min-height: 3em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .status.win { border-color: var(--success); background: var(--success-soft); }
    .status.lose { border-color: var(--warning); background: var(--warning-soft); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .btn { flex: 1 1 auto; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .side h2 { font-size: 1.1rem; margin: 0; }
    .scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .scores.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 560px) { .scores.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .sc { background: var(--surface-2); border-radius: 10px; padding: 6px 10px; min-width: 0; border-top: 4px solid var(--primary); }
    .sc:nth-child(2) { border-top-color: var(--accent); } .sc:nth-child(3) { border-top-color: var(--success); } .sc:nth-child(4) { border-top-color: var(--warning); }
    .sc .k { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
    .sc .v { font-size: 1.5rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
    .sc.flash .v { color: var(--success); }
    .rule { margin: 0; font-size: .92rem; }
    .opt { display: flex; flex-direction: column; gap: 6px; }
    .opt .seg { display: flex; }
    .opt .seg button { flex: 1 1 0; padding-inline: 6px; line-height: 1.2; flex-direction: column; display: inline-flex; align-items: center; justify-content: center; }
    .opt .seg small { font-size: .72rem; font-weight: 600; opacity: .85; }
    .check { min-height: 40px; }
    .hint { color: var(--muted); font-size: .86rem; margin: 0; }
    .board-host { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .num { font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

    /* shared square board */
    .sq { position: relative; direction: ltr; width: min(100%, 460px, max(270px, 100vh - 300px)); aspect-ratio: 1 / 1; background: var(--board);
      border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; container-type: inline-size; outline: none; }
    .sq:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
    .sq.n5 { --gap: 6px; }
    .sq .cells { position: absolute; inset: var(--gap); display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: var(--gap); }
    .sq .cells i { background: var(--cellbg); border-radius: 8px; }
    .tile { position: absolute; inset-block-start: var(--gap); inset-inline-start: var(--gap);
      width: calc((100% - (var(--n) + 1) * var(--gap)) / var(--n)); height: calc((100% - (var(--n) + 1) * var(--gap)) / var(--n));
      transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap)))); transition: transform .11s ease-in-out; will-change: transform; }
    .face { width: 100%; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: "Noto Sans", system-ui, sans-serif;
      font-weight: 800; font-size: 1.6rem; font-size: calc(40cqw / var(--n)); line-height: 1; font-variant-numeric: tabular-nums; }
    .tile.d3 .face { font-size: calc(32cqw / var(--n)); } .tile.d4 .face { font-size: calc(25cqw / var(--n)); } .tile.d5 .face { font-size: calc(20cqw / var(--n)); }

    /* 2048 colours (our own palette: sky → teal → saffron → plum) */
    .t2 .face { background: #eef4f8; color: #24425a; } .t4 .face { background: #d3e6f3; color: #1d3d55; }
    .t8 .face { background: #9ed8cc; color: #0f3d36; } .t16 .face { background: #5cbfae; color: #082f29; }
    .t32 .face { background: #2a9d8f; color: #fff; } .t64 .face { background: #1f776d; color: #fff; }
    .t128 .face { background: #f3cf6b; color: #3d2a00; } .t256 .face { background: #f4a261; color: #3a1d00; }
    .t512 .face { background: #e76f51; color: #fff; } .t1024 .face { background: #c8435a; color: #fff; }
    .t2048 .face { background: #8a4fd8; color: #fff; box-shadow: 0 0 0 3px #f3cf6b inset; } .tbig .face { background: #2b2d6e; color: #fff; }
    .tile.gone { z-index: 1; } .tile.merged { z-index: 2; }
    .tile.new .face { animation: appear .16s ease-out .1s both; }
    .tile.merged .face { animation: pop .16s ease-out .1s both; }
    @keyframes appear { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: none; } }
    .pad4 { display: flex; gap: 8px; direction: ltr; }
    .pad4 .btn { min-width: 56px; min-height: 48px; font-size: 1.3rem; padding: 0; }
    .sq.locked .tile { opacity: .55; }

    /* number slide */
    .bslide .tile { padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
    .bslide .face { background: #3d6f9e; color: #fff; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
    .bslide .tile.home .face { background: #2f8f6a; }
    .bslide.pic .face { background-color: #888; background-repeat: no-repeat; position: relative; align-items: flex-start; justify-content: flex-start;
      padding: 4px 6px; font-size: calc(15cqw / var(--n)); color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35); }
    .bslide.solved .face { box-shadow: 0 0 0 3px var(--success) inset; }
    .bslide.pic.solved .face { border-radius: 0; box-shadow: none; }
    .bslide.pic.solved .cells i { visibility: hidden; }

    /* memory sequence */
    .simon { direction: ltr; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, 420px, max(260px, 100vh - 320px)); aspect-ratio: 1 / 1; }
    .pad { border: 4px solid transparent; border-radius: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      filter: saturate(.55) brightness(.82); transition: filter .08s; position: relative; padding: 0; touch-action: manipulation; min-height: 40px; }
    .pad svg { width: 46%; height: 46%; }
    .pad .kn { position: absolute; inset-block-start: 6px; inset-inline-start: 10px; font: 800 .95rem "Noto Sans", system-ui, sans-serif; color: rgba(0, 0, 0, .55); }
    .pad.p0 { background: #e69f00; } .pad.p1 { background: #56b4e9; } .pad.p2 { background: #009e73; } .pad.p3 { background: #cc79a7; }
    .pad.on { filter: saturate(1.25) brightness(1.22); border-color: var(--text); box-shadow: 0 0 22px 4px color-mix(in srgb, var(--text) 35%, transparent); }
    .pad:disabled { cursor: default; opacity: 1; }
    .pad.bad { border-color: var(--danger); }
    .pad .shape { fill: #fff; stroke: rgba(0, 0, 0, .45); stroke-width: 4; }
    .simon-dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 14px; direction: ltr; }
    .simon-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
    .simon-dots i.ok { background: var(--success); }

    /* lights out */
    .blights { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: var(--gap); padding: var(--gap); touch-action: manipulation; }
    .blights button { border: 0; border-radius: 10px; background: #1d2633; cursor: pointer; padding: 0; min-width: 40px; min-height: 40px; position: relative;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08); transition: background-color .12s; display: flex; align-items: center; justify-content: center; }
    .blights button::after { content: ""; width: 26%; height: 26%; border-radius: 50%; background: #3a4656; }
    .blights button.on { background: #ffd43b; box-shadow: 0 0 14px 2px rgba(255, 212, 59, .55), inset 0 0 0 2px #fff3bf; }
    .blights button.on::after { background: #fff8db; width: 40%; height: 40%; box-shadow: 0 0 10px 4px #fff3bf; }
    .blights button.hint { outline: 4px dashed var(--accent); outline-offset: -6px; }
    .blights button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .blights.solved button { background: #2f8f6a; }

    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 8px; }
    .help summary { cursor: pointer; font-weight: 700; }
    :root[lang="ur"] .sc .k, :root[lang="ur"] .lbl { line-height: 2; }
    @media (prefers-reduced-motion: reduce) {
      .tile, .pad, .blights button { transition: none !important; }
      .tile .face { animation: none !important; }
    }
    @media (max-width: 560px) {
      .stage-card.card, .side.card { padding: 12px; }
      .sq { width: 100%; }
    }
    @media print { .gtabs, .actions, .side .opt, .pad4, .check, #reset-best { display: none !important; } .pg { display: block; } }
  </style>
