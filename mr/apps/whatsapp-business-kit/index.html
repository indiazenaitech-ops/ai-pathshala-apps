      display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center;

    .lnum { display: inline-block; min-width: 1.6em; color: var(--muted); font-weight: 600; font-family: system-ui, "Segoe UI", sans-serif; }

    }
    .bp:hover { transform: translateY(-2px); }
    .bp.round { width: 58px; height: 58px; border-radius: 50%; }
    .bp.pill { padding: 11px 18px 11px 14px; border-radius: 999px; }
    .bp svg { width: 28px; height: 28px; flex: none; }
    .bp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    pre.code {
      margin: 0; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
      font-size: .78rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; text-align: left;
    }

    .help-list li + li { margin-top: 8px; }

    /* printed customer list */
    .pl { color: #000; background: #fff; font-size: 11pt; }
    .pl h1 { font-size: 16pt; margin: 0 0 10pt; }
    .pl table { width: 100%; border-collapse: collapse; }
    .pl th, .pl td { border: 1px solid #999; padding: 4pt 6pt; text-align: start; vertical-align: top; }
    .pl th { background: #eee; }
    .pl tr { break-inside: avoid; page-break-inside: avoid; }
    .pl .box { font-size: 14pt; text-align: center; }
    @media print {
      #app > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="callout success small privacy no-print"><span class="ic" aria-hidden="true">🔒</span><span data-i18n="privacy"></span></p>

    <nav class="wk-tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-link" data-tab="link" aria-controls="p-link"><span class="ic" aria-hidden="true">🔗</span><span data-i18n="tab_link"></span></button>
      <button type="button" role="tab" id="tab-list" data-tab="list" aria-controls="p-list"><span class="ic" aria-hidden="true">👥</span><span data-i18n="tab_list"></span></button>
      <button type="button" role="tab" id="tab-button" data-tab="button" aria-controls="p-button"><span class="ic" aria-hidden="true">🌐</span><span data-i18n="tab_button"></span></button>
    </nav>

    <!-- ================= LINK & MESSAGE ================= -->
    <section id="p-link" role="tabpanel" aria-labelledby="tab-link" class="wk-split no-print" hidden>
      <div class="stack">
        <div class="card stack">
          <h2 class="wk-h mb0"><span class="step" aria-hidden="true">1</span><span data-i18n="h_number"></span></h2>
          <div class="num-row">
            <label class="field cc-field"><span data-i18n="cc_label"></span>
              <span class="cc-wrap"><span class="cc-plus" aria-hidden="true">+</span><input id="cc" type="text" inputmode="numeric" maxlength="4" autocomplete="off" dir="ltr" class="no-i18n" data-i18n-aria-label="cc_label"></span>
            </label>
            <label class="field grow"><span data-i18n="phone_label"></span>
              <input id="phone" type="tel" inputmode="tel" autocomplete="off" dir="ltr" class="no-i18n" placeholder="98765 43210">
            </label>
          </div>
          <p class="small muted mb0" data-i18n="phone_hint"></p>
          <p id="phoneStatus" class="status" aria-live="polite"></p>
          <p class="tiny muted mb0" data-i18n="cc_hint"></p>
        </div>

        <div class="card stack">
          <div class="msg-head">
            <h2 class="wk-h mb0"><span class="step" aria-hidden="true">2</span><span data-i18n="h_message"></span></h2>
            <label class="msglang"><span data-i18n="msg_lang"></span><select id="msgLang" class="no-i18n"></select></label>
          </div>
          <div class="field">
            <span data-i18n="templates"></span>
            <div class="tpl-chips" id="tplChips"></div>
          </div>
          <div class="field">
            <label for="msg" data-i18n="msg_label"></label>
            <div>
              <div class="fmt-bar" role="toolbar" id="fmtBar" data-i18n-aria-label="fmt_tools">
                <button type="button" id="fmt-bold" data-fmt="*" data-i18n-title="fmt_bold" data-i18n-aria-label="fmt_bold"><b>B</b></button>
                <button type="button" id="fmt-italic" data-fmt="_" class="b-i" data-i18n-title="fmt_italic" data-i18n-aria-label="fmt_italic">I</button>
                <button type="button" id="fmt-strike" data-fmt="~" class="b-s" data-i18n-title="fmt_strike" data-i18n-aria-label="fmt_strike">S</button>
                <button type="button" id="fmt-mono" data-fmt="```" class="b-m" data-i18n-title="fmt_mono" data-i18n-aria-label="fmt_mono">```</button>
                <button type="button" id="fmt-code" data-fmt="`" class="b-m" data-i18n-title="fmt_code" data-i18n-aria-label="fmt_code">&lt;/&gt;</button>
                <span class="sep" aria-hidden="true"></span>
                <button type="button" id="fmt-quote" data-line="quote" data-i18n-title="fmt_quote" data-i18n-aria-label="fmt_quote">❝</button>
                <button type="button" id="fmt-bullet" data-line="bullet" data-i18n-title="fmt_bullet" data-i18n-aria-label="fmt_bullet">•≡</button>
                <button type="button" id="fmt-number" data-line="number" data-i18n-title="fmt_number" data-i18n-aria-label="fmt_number">1.</button>
                <span class="sep" aria-hidden="true"></span>
                <button type="button" id="fmt-emoji" aria-expanded="false" aria-controls="emojiPop" data-i18n-title="fmt_emoji" data-i18n-aria-label="fmt_emoji">😊</button>
              </div>
              <textarea id="msg" rows="8" dir="auto" spellcheck="true" data-i18n-placeholder="msg_ph"></textarea>
              <div class="emoji-pop" id="emojiPop" hidden></div>
            </div>
          </div>
          <div class="ins-bar" id="insBar"><span class="small muted" data-i18n="insert"></span></div>
          <div class="counts small muted"><span id="charCount" aria-live="polite"></span><span id="linkLen"></span></div>
          <p class="tiny muted mb0" id="keysHint" data-i18n="keys_hint"></p>
        </div>

        <div class="card stack">
          <h2 class="wk-h mb0"><span class="step" aria-hidden="true">3</span><span data-i18n="h_details"></span></h2>
          <p class="small muted mb0" data-i18n="details_hint"></p>
          <div class="fill-grid">
            <label class="field"><span data-i18n="f_name"></span><input id="f-name" type="text" dir="auto" maxlength="80" autocomplete="off"></label>
            <label class="field"><span data-i18n="f_amount"></span><input id="f-amount" type="text" inputmode="decimal" dir="ltr" maxlength="20" autocomplete="off" class="no-i18n" placeholder="1250"></label>
            <label class="field"><span data-i18n="f_date"></span><input id="f-date" type="text" dir="auto" maxlength="60" autocomplete="off" data-i18n-placeholder="f_date_ph"></label>
            <label class="field"><span data-i18n="f_shop"></span><input id="f-shop" type="text" dir="auto" maxlength="80" autocomplete="organization"></label>
            <label class="field"><span data-i18n="f_upi"></span><input id="f-upi" type="text" dir="ltr" maxlength="60" autocomplete="off" spellcheck="false" class="no-i18n" placeholder="name@okaxis"></label>
            <label class="field"><span data-i18n="f_link"></span><input id="f-link" type="url" dir="ltr" maxlength="500" autocomplete="url" spellcheck="false" class="no-i18n" placeholder="https://…"></label>
          </div>
        </div>

        <details class="card" id="utmBox">
          <summary><strong data-i18n="utm_title"></strong></summary>
          <div class="stack" style="margin-top:12px">
            <label class="check"><input type="checkbox" id="utmOn"> <span data-i18n="utm_on"></span></label>
            <div class="utm-grid">
              <label class="field"><span data-i18n="utm_source"></span><input id="utm-source" type="text" dir="ltr" maxlength="40" spellcheck="false" class="no-i18n" placeholder="whatsapp"></label>
              <label class="field"><span data-i18n="utm_medium"></span><input id="utm-medium" type="text" dir="ltr" maxlength="40" spellcheck="false" class="no-i18n" placeholder="social"></label>
              <label class="field"><span data-i18n="utm_campaign"></span><input id="utm-campaign" type="text" dir="ltr" maxlength="60" spellcheck="false" class="no-i18n" placeholder="diwali_sale"></label>
            </div>
            <p class="small mb0" id="utmStatus" aria-live="polite"></p>
            <p class="small muted mb0" data-i18n="utm_help"></p>
          </div>
        </details>
      </div>

      <div class="stack side">
        <div class="card stack">
          <h2 class="wk-h mb0" data-i18n="h_preview"></h2>
          <div class="wa-phone">
            <div class="wa-head">
              <span class="wa-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg></span>
              <span class="wa-who" id="pvWho"></span>
            </div>
            <div class="wa-body">
              <div class="wa-bubble no-i18n" id="preview" aria-live="polite"></div>
            </div>
          </div>
          <p id="missingWarn" class="callout warning small mb0" hidden></p>
        </div>

        <div class="card stack">
          <h2 class="wk-h mb0"><label for="linkOut" data-i18n="h_link"></label></h2>
          <input id="linkOut" type="text" readonly class="no-i18n">
          <p id="longWarn" class="callout warning small mb0" hidden></p>
          <div class="link-actions">
            <a class="btn btn-wa" id="openWa" target="_blank" rel="noopener"><span class="wa-ic-svg" aria-hidden="true"></span><span data-i18n="open_wa"></span></a>
            <a class="btn" id="openWeb" target="wa_kit" rel="noopener" data-i18n="open_web"></a>
            <button class="btn btn-primary" id="copyLink" type="button"><span aria-hidden="true">⧉</span> <span data-i18n="copy_link"></span></button>
            <button class="btn" id="copyMsg" type="button" data-i18n="copy_msg"></button>
            <a class="btn btn-ghost" id="toQr" target="_blank" rel="noopener"><span aria-hidden="true">▦</span> <span data-i18n="make_qr"></span></a>
          </div>
          <p class="small muted mb0" id="openHint"></p>
          <p class="small muted mb0" data-i18n="where_use"></p>
        </div>
      </div>
    </section>

    <!-- ================= CUSTOMER LIST ================= -->
    <section id="p-list" role="tabpanel" aria-labelledby="tab-list" class="stack no-print" hidden>
      <p class="callout warning small mb0 privacy"><span class="ic" aria-hidden="true">✋</span><span data-i18n="consent"></span></p>
      <div class="list-grid">
        <div class="card stack">
          <h2 class="wk-h mb0"><label for="listIn" data-i18n="h_list"></label></h2>
          <p class="small muted mb0" data-i18n="list_help"></p>
          <textarea id="listIn" rows="7" dir="ltr" spellcheck="false" wrap="off" data-i18n-placeholder="list_ph"></textarea>
          <div class="row">
            <button class="btn" id="importCsv" type="button"><span aria-hidden="true">📂</span> <span data-i18n="import_csv"></span></button>
            <button class="btn btn-ghost" id="loadSample" type="button" data-i18n="load_sample"></button>
            <button class="btn btn-ghost" id="clearList" type="button" data-i18n="clear"></button>
          </div>
          <div class="panel stack">
            <div class="row spread">
              <strong data-i18n="columns"></strong>
              <button class="btn btn-sm" id="redetect" type="button" data-i18n="detect"></button>
            </div>
            <div class="map-grid">
              <label class="field"><span data-i18n="col_name"></span><select id="map-name" class="no-i18n"></select></label>
              <label class="field"><span data-i18n="col_phone"></span><select id="map-phone" class="no-i18n"></select></label>
              <label class="field"><span data-i18n="col_amount"></span><select id="map-amount" class="no-i18n"></select></label>
              <label class="field"><span data-i18n="col_date"></span><select id="map-date" class="no-i18n"></select></label>
            </div>
            <label class="check"><input type="checkbox" id="hasHeader"> <span data-i18n="has_header"></span></label>
            <label class="check"><input type="checkbox" id="firstName"> <span data-i18n="first_name"></span></label>
          </div>
        </div>
        <div class="card stack">
          <div class="row spread">
            <h2 class="wk-h mb0" data-i18n="list_msg"></h2>
            <button class="btn btn-sm" id="editMsg" type="button"><span aria-hidden="true">✏️</span> <span data-i18n="edit_msg"></span></button>
          </div>
          <div class="wa-mini"><div class="wa-bubble no-i18n" id="listTpl"></div></div>
          <p class="small muted mb0" data-i18n="unmapped"></p>
        </div>
      </div>

      <div class="card stack" id="peopleCard">
        <div class="people-top">
          <div>
            <h2 class="wk-h mb0" data-i18n="h_people"></h2>
            <p class="small muted mb0" id="rowsInfo" aria-live="polite"></p>
          </div>
          <label class="field"><span data-i18n="open_with"></span>
            <select id="openMode">
              <option value="wa" data-i18n="ow_wa"></option>
              <option value="web" data-i18n="ow_web"></option>
              <option value="app" data-i18n="ow_app"></option>
            </select>
          </label>
        </div>
        <div class="row spread"><span class="badge success" id="listProgress"></span></div>
        <div class="progress" aria-hidden="true"><span id="listBar" style="width:0"></span></div>
        <div class="next-row">
          <a class="btn btn-wa btn-lg" id="openNext" rel="noopener"><span class="wa-ic-svg" aria-hidden="true"></span><span id="openNextTxt"></span></a>
        </div>
        <p id="allDone" class="callout success mb0" hidden><span aria-hidden="true">🎉 </span><span data-i18n="all_done"></span></p>
        <p id="tooMany" class="callout warning small mb0" hidden></p>
        <div id="rows" class="rows" role="list"></div>
        <p id="listEmpty" class="empty" data-i18n="list_empty" hidden></p>
        <div class="row">
          <button class="btn" id="exportCsv" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="export_csv"></span></button>
          <button class="btn" id="printList" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print_list"></span></button>
          <button class="btn btn-ghost" id="clearTicks" type="button" data-i18n="clear_ticks"></button>
        </div>
      </div>
    </section>

    <!-- ================= WEBSITE BUTTON ================= -->
    <section id="p-button" role="tabpanel" aria-labelledby="tab-button" class="wk-split2 no-print" hidden>
      <div class="card stack">
        <h2 class="wk-h mb0" data-i18n="h_button"></h2>
        <p class="small muted mb0" data-i18n="btn_help"></p>
        <label class="field"><span data-i18n="btn_phone"></span>
          <input id="b-phone" type="tel" inputmode="tel" autocomplete="off" dir="ltr" class="no-i18n" placeholder="98765 43210">
        </label>
        <p id="bStatus" class="status" aria-live="polite"></p>
        <label class="field"><span data-i18n="btn_greet"></span><textarea id="b-greet" rows="2" dir="auto" maxlength="500" style="min-height:70px"></textarea></label>
        <label class="field"><span data-i18n="btn_text"></span><input id="b-text" type="text" dir="auto" maxlength="40"></label>
        <div class="field"><span data-i18n="btn_style"></span>
          <div class="seg" role="group" id="b-style">
            <button type="button" data-v="round" data-i18n="st_round"></button>
            <button type="button" data-v="pill" data-i18n="st_pill"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="btn_pos"></span>
          <div class="seg" role="group" id="b-pos">
            <button type="button" data-v="right" data-i18n="pos_right"></button>
            <button type="button" data-v="left" data-i18n="pos_left"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="btn_color"></span>
          <div class="color-row" id="b-swatches">
            <input type="color" id="b-color" data-i18n-aria-label="btn_color">
          </div>
        </div>
        <div class="field"><span data-i18n="btn_ink"></span>
          <div class="seg" role="group" id="b-ink">
            <button type="button" data-v="white" data-i18n="ink_white"></button>
            <button type="button" data-v="dark" data-i18n="ink_dark"></button>
          </div>
        </div>
        <label class="check" id="b-mobile-wrap"><input type="checkbox" id="b-mobile"> <span data-i18n="btn_mobile_icon"></span></label>
        <p id="contrastWarn" class="callout warning small mb0" data-i18n="contrast_warn" hidden></p>
      </div>
      <div class="stack">
        <div class="card stack">
          <h2 class="wk-h mb0" data-i18n="h_preview"></h2>
          <div class="mock" aria-hidden="false">
            <div class="mock-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="mock-url no-i18n">yourshop.in</span></div>
            <div class="mock-page">
              <div class="mock-h" data-i18n="mock_title"></div>
              <div class="sk w80"></div><div class="sk w60"></div><div class="sk w70"></div>
              <div class="mock-grid" aria-hidden="true"><div class="sk box"></div><div class="sk box"></div><div class="sk box"></div></div>
              <a id="bPreview" class="bp round no-i18n" target="_blank" rel="noopener"></a>
            </div>
          </div>
        </div>
        <div class="card stack">
          <h2 class="wk-h mb0" data-i18n="btn_code"></h2>
          <pre id="bCode" class="code" dir="ltr"></pre>
          <div class="row">
            <button class="btn btn-primary" id="copyCode" type="button"><span aria-hidden="true">⧉</span> <span data-i18n="copy_code"></span></button>
            <button class="btn" id="dlCode" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_code"></span></button>
          </div>
          <p class="small muted mb0" data-i18n="paste_where"></p>
        </div>
      </div>
    </section>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="help-list" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>

    <div id="printArea" class="print-only pl"></div>
  </main>
  <script src="../../../apps/whatsapp-business-kit/../../shared/edu.js"></script>
  <script src="../../../apps/whatsapp-business-kit/strings.js"></script>
  <script src="../../../apps/whatsapp-business-kit/content.js"></script>
  <script src="../../../apps/whatsapp-business-kit/app.js"></script>
</body>
</html>
