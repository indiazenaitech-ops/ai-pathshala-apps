              <label for="cess-rate" data-i18n="cess_rate_label"></label>
              <input id="cess-rate" class="gc-num" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
              <p class="muted tiny" data-i18n="cess_hint"></p>
            </div>
            <label class="check" id="round-wrap"><input type="checkbox" id="round-on"><span data-i18n="round_label"></span></label>
          </div>
        </div>
        <div class="card gc-result" id="calc-result" aria-live="polite"></div>
      </div>

      <section class="card">
        <div class="row spread">
          <h2 class="mb0" data-i18n="hist_title"></h2>
          <div class="row">
            <button type="button" class="btn btn-sm" id="hist-csv">⬇ <span data-i18n="bill_csv"></span></button>
            <button type="button" class="btn btn-sm btn-danger" id="hist-clear" data-i18n="clear"></button>
          </div>
        </div>
        <p class="muted small" data-i18n="enter_hint" style="margin-top:8px"></p>
        <ol class="gc-hist-list" id="hist-list"></ol>
        <p class="muted mb0" id="hist-empty" data-i18n="hist_empty"></p>
      </section>
    </section>

    <!-- 2. Quick bill -->
    <section id="p-bill" role="tabpanel" aria-labelledby="tab-bill" class="gc-panel" hidden>
      <section class="card stack">
        <h2 class="mb0" data-i18n="bill_details"></h2>
        <div class="gc-bill-head">
          <div class="field"><label for="b-seller" data-i18n="bill_seller"></label><input id="b-seller" type="text" autocomplete="organization" data-i18n-placeholder="bill_seller_ph" data-bf="seller"></div>
          <div class="field"><label for="b-sgstin" data-i18n="bill_seller_gstin"></label><input id="b-sgstin" class="gc-num" type="text" autocomplete="off" spellcheck="false" maxlength="20" data-i18n-placeholder="gstin_ph" data-bf="sgstin"><p class="gc-note bad" id="b-sgstin-note"></p></div>
          <div class="field"><label for="b-buyer" data-i18n="bill_buyer"></label><input id="b-buyer" type="text" autocomplete="off" data-i18n-placeholder="bill_buyer_ph" data-bf="buyer"></div>
          <div class="field"><label for="b-bgstin" data-i18n="bill_buyer_gstin"></label><input id="b-bgstin" class="gc-num" type="text" autocomplete="off" spellcheck="false" maxlength="20" data-i18n-placeholder="gstin_ph" data-bf="bgstin"><p class="gc-note bad" id="b-bgstin-note"></p></div>
          <div class="field"><label for="b-no" data-i18n="bill_no"></label><input id="b-no" type="text" autocomplete="off" data-bf="no"></div>
          <div class="field"><label for="b-date" data-i18n="bill_date"></label><input id="b-date" type="date" data-bf="date"></div>
        </div>
        <div class="field">
          <span class="gc-lbl" id="b-supply-lbl" data-i18n="supply_label"></span>
          <div class="seg gc-seg" id="b-supply" role="group" aria-labelledby="b-supply-lbl">
            <button type="button" data-supply="intra" data-i18n="supply_intra"></button>
            <button type="button" data-supply="inter" data-i18n="supply_inter"></button>
          </div>
          <p class="gc-note muted" id="b-auto"></p>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="b-incl"><span data-i18n="bill_incl"></span></label>
          <label class="check"><input type="checkbox" id="b-round"><span data-i18n="round_label"></span></label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="bill_items"></h2>
        <div class="bl-head" aria-hidden="true">
          <span>#</span><span data-i18n="col_item"></span><span data-i18n="col_hsn"></span><span data-i18n="col_qty"></span>
          <span data-i18n="col_rate"></span><span data-i18n="col_gst"></span><span class="v" data-i18n="col_amount"></span><span></span>
        </div>
        <div class="bl-rows" id="bill-rows"></div>
        <div class="row" style="margin-top:12px">
          <button type="button" class="btn btn-primary" id="bill-add">＋ <span data-i18n="bill_add_line"></span></button>
          <button type="button" class="btn" id="bill-sample" data-i18n="bill_sample"></button>
          <button type="button" class="btn btn-danger" id="bill-new" data-i18n="bill_new"></button>
        </div>
      </section>

      <section class="card" aria-live="polite">
        <div class="gc-totals">
          <div>
            <h2 data-i18n="bill_summary"></h2>
            <div class="scroll-x" id="bill-summary"></div>
          </div>
          <div id="bill-totals"></div>
        </div>
        <div class="row gc-actions">
          <button type="button" class="btn btn-primary" id="bill-print">🖨 <span data-i18n="bill_print"></span></button>
          <button type="button" class="btn" id="bill-csv">⬇ <span data-i18n="bill_csv"></span></button>
          <button type="button" class="btn" id="bill-copy">📋 <span data-i18n="copy"></span></button>
        </div>
        <p class="muted small" style="margin:12px 0 0" data-i18n="bill_note"></p>
      </section>
    </section>

    <!-- 3. Price planner -->
    <section id="p-price" role="tabpanel" aria-labelledby="tab-price" class="gc-panel" hidden>
      <div class="gc-two">
        <section class="card stack">
          <h2 class="mb0" data-i18n="pq_title"></h2>
          <p class="muted small mb0" data-i18n="pq_intro"></p>
          <div class="gc-in-row">
            <div class="field"><label for="pq-amt" data-i18n="pq_want"></label><input id="pq-amt" class="gc-num" type="text" inputmode="decimal" autocomplete="off" data-i18n-placeholder="amt_ph"></div>
            <div class="field"><label for="pq-round" data-i18n="pq_round"></label><select id="pq-round"></select></div>
          </div>
          <div class="field"><span class="gc-lbl" id="pq-rate-lbl" data-i18n="rate_label"></span><div class="gc-rates" id="pq-rates" role="group" aria-labelledby="pq-rate-lbl"></div></div>
          <div aria-live="polite" id="pq-out"></div>
        </section>

        <section class="card stack">
          <h2 class="mb0" data-i18n="sp_title"></h2>
          <p class="muted small mb0" data-i18n="sp_intro"></p>
          <div class="gc-in-row">
            <div class="field"><label for="sp-cost" data-i18n="sp_cost"></label><input id="sp-cost" class="gc-num" type="text" inputmode="decimal" autocomplete="off" aria-describedby="sp-cost-hint"></div>
            <div class="field"><label for="sp-profit" data-i18n="sp_profit"></label><input id="sp-profit" class="gc-num" type="text" inputmode="decimal" autocomplete="off"></div>
          </div>
          <p class="muted tiny mb0" id="sp-cost-hint" data-i18n="sp_cost_hint"></p>
          <div class="seg gc-seg" id="sp-kind" role="group" data-i18n-aria-label="sp_profit">
            <button type="button" data-kind="markup" data-i18n="sp_markup"></button>
            <button type="button" data-kind="margin" data-i18n="sp_margin"></button>
          </div>
          <div class="field"><span class="gc-lbl" id="sp-rate-lbl" data-i18n="rate_label"></span><div class="gc-rates" id="sp-rates" role="group" aria-labelledby="sp-rate-lbl"></div></div>
          <div class="field"><label for="sp-mrp" data-i18n="sp_mrp"></label><input id="sp-mrp" class="gc-num gc-small-in" style="width:100%" type="text" inputmode="decimal" autocomplete="off"></div>
          <div aria-live="polite" id="sp-out"></div>
        </section>
      </div>
    </section>

    <!-- 4. GSTIN checker -->
    <section id="p-gstin" role="tabpanel" aria-labelledby="tab-gstin" class="gc-panel" hidden>
      <section class="card">
        <div class="field">
          <label for="gstin" data-i18n="g_label"></label>
          <input id="gstin" class="gc-num" type="text" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="24" data-i18n-placeholder="g_ph">
        </div>
        <div class="gx-boxes" id="gx-boxes" aria-hidden="true"></div>
        <div class="gx-legend" id="gx-legend"></div>
        <div aria-live="polite">
          <p class="gx-status" id="gx-status"></p>
          <ul class="gx-list errs" id="gx-errs"></ul>
          <ul class="gx-list warns" id="gx-warns"></ul>
          <dl class="gc-kv" id="gx-info"></dl>
        </div>
        <div class="row gc-actions">
          <button type="button" class="btn" id="g-sample" data-i18n="g_sample"></button>
          <button type="button" class="btn" id="g-copy">📋 <span data-i18n="copy"></span></button>
          <button type="button" class="btn btn-ghost" id="g-clear" data-i18n="clear"></button>
        </div>
        <div class="callout warning" style="margin-top:14px">
          <p class="mb0"><span data-i18n="g_disclaimer"></span> <a class="no-i18n gc-ltr" href="https://services.gst.gov.in/services/searchtp" target="_blank" rel="noopener noreferrer">services.gst.gov.in</a></p>
        </div>
      </section>

      <section class="card stack">
        <h2 class="mb0" data-i18n="g_batch_title"></h2>
        <label for="batch-in" class="muted small" data-i18n="g_batch_hint"></label>
        <textarea id="batch-in" class="no-i18n" spellcheck="false" autocapitalize="characters"></textarea>
        <div class="row">
          <button type="button" class="btn btn-primary" id="batch-run" data-i18n="g_batch_run"></button>
          <button type="button" class="btn" id="batch-csv" disabled>⬇ <span data-i18n="bill_csv"></span></button>
          <strong id="batch-sum" aria-live="polite"></strong>
        </div>
        <div class="scroll-x" id="batch-out"></div>
      </section>
    </section>

    <section class="card no-print" style="margin-top:16px">
      <h2 data-i18n="rates_title"></h2>
      <ul class="gc-rate-list">
        <li><b>0%</b><span data-i18n="rate_0"></span></li>
        <li><b>5%</b><span data-i18n="rate_5"></span></li>
        <li><b>18%</b><span data-i18n="rate_18"></span></li>
        <li><b>40%</b><span data-i18n="rate_40"></span></li>
        <li><b>3%</b><span data-i18n="rate_3"></span></li>
        <li><b>0.25%</b><span data-i18n="rate_025"></span></li>
      </ul>
      <p class="small" style="margin:12px 0 4px" data-i18n="rate_old"></p>
      <p class="muted small mb0" id="rates-checked"></p>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
        <li data-i18n="how_6"></li>
      </ul>
    </details>

    <div id="print-area" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/gst-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/gst-calculator/strings.js"></script>
  <script src="../../../apps/gst-calculator/content.js"></script>
  <script src="../../../apps/gst-calculator/app.js"></script>
</body>
</html>
