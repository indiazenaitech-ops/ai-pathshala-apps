    .wl td.n { color: var(--muted); width: 2.5em; }
    .wl .btn { min-height: 36px; }
    .wl-wrap { max-height: 560px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .wl td { vertical-align: middle; }
    @media (max-width: 560px) { .wl-wrap { max-height: none; } }
    .seg-wrap { max-width: 100%; }

    /* ---------- help ---------- */
    details.help summary { cursor: pointer; font-size: 1.05rem; }
    details.help ul { padding-inline-start: 1.25em; margin: 12px 0 4px; }
    details.help li { margin-bottom: 8px; }

    /* ---------- print: word list or spelling test ---------- */
    .print-sheet h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .print-sub { color: #444; margin: 0 0 14px; font-size: .9rem; }
    .print-fill { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 12px; }
    .test-lines { padding-inline-start: 2em; margin: 0; }
    .test-lines li { padding: 9px 0 3px; border-bottom: 1px solid #999; break-inside: avoid; }
    .test-lines .tl { display: flex; justify-content: space-between; gap: 16px; min-height: 1.6em; }
    .test-lines .clue-p { color: #444; font-size: .85rem; }
    .key-list { columns: 3; padding-inline-start: 2em; font-family: "Noto Sans", system-ui, sans-serif; }
    .answer-key { break-before: page; margin-top: 20px; }
    .print-sheet .table td, .print-sheet .table th { padding: 5px 8px; }
    .test-sheet { display: none; }
    @media print {
      .view, .tabs, .edu-intro { display: none !important; }
      #print-area { display: block !important; }
      body.sb-print-test #print-area .list-sheet { display: none !important; }
      body.sb-print-test #print-area .test-sheet { display: block !important; }
      .print-sheet .table th { position: static; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-practise" data-view="practise" aria-controls="view-practise"><span aria-hidden="true">🐝</span> <span data-i18n="tab_practise"></span></button>
      <button type="button" role="tab" id="tab-bee" data-view="bee" aria-controls="view-bee"><span aria-hidden="true">🎤</span> <span data-i18n="tab_bee"></span></button>
      <button type="button" role="tab" id="tab-lists" data-view="lists" aria-controls="view-lists"><span aria-hidden="true">📝</span> <span data-i18n="tab_lists"></span></button>
    </div>

    <!-- ===================== PRACTISE ===================== -->
    <section id="view-practise" class="view no-print" role="tabpanel" aria-labelledby="tab-practise">
      <div id="p-setup" class="sb-layout">
        <div class="sb-main">
          <section class="card stack" id="level-card">
            <h2 id="lvl-h" data-i18n="choose_level"></h2>
            <div class="levels" id="p-levels" role="group" aria-labelledby="lvl-h"></div>
            <div class="opts">
              <label class="check"><input type="checkbox" id="opt-second"> <span data-i18n="opt_second"></span></label>
              <label class="check"><input type="checkbox" id="opt-auto"> <span data-i18n="opt_auto"></span></label>
            </div>
            <div class="start-row">
              <button type="button" class="btn btn-primary btn-lg" id="p-start"><span aria-hidden="true">▶</span> <span data-i18n="start_round"></span></button>
              <span class="muted small" id="p-round-info"></span>
            </div>
          </section>

          <details class="card help no-print" id="help">
            <summary><strong data-i18n="help_h"></strong></summary>
            <ul>
              <li data-i18n-html="tip1"></li>
              <li data-i18n-html="tip2"></li>
              <li data-i18n-html="tip3"></li>
              <li data-i18n-html="tip4"></li>
              <li data-i18n-html="tip5"></li>
              <li data-i18n-html="tip6"></li>
            </ul>
          </details>
        </div>

        <aside class="sb-side">
          <section class="card stack" id="voice-card">
            <h2 class="h3"><span aria-hidden="true">🔊</span> <span data-i18n="voice_h"></span></h2>
            <div class="field">
              <label for="voice-sel" data-i18n="voice_lbl"></label>
              <select id="voice-sel" class="no-i18n"></select>
            </div>
            <div class="field">
              <label for="rate" class="range-lbl"><span data-i18n="speed"></span><output id="rate-out" for="rate"></output></label>
              <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.9">
            </div>
            <div class="row">
              <button type="button" class="btn btn-sm" id="voice-test"><span aria-hidden="true">🔊</span> <span data-i18n="voice_test"></span></button>
            </div>
            <div id="voice-status" aria-live="polite"></div>
          </section>

          <section class="card stack" id="stats-card">
            <h2 class="h3"><span aria-hidden="true">📊</span> <span data-i18n="stats_h"></span></h2>
            <div class="stats" id="stats"></div>
            <p class="muted tiny mb0" data-i18n="saved_local"></p>
            <div class="row">
              <button type="button" class="btn btn-sm btn-danger" id="reset-btn"><span aria-hidden="true">↺</span> <span data-i18n="reset_progress"></span></button>
            </div>
          </section>
        </aside>
      </div>

      <section id="p-play" class="card play" hidden>
        <div class="play-head">
          <div class="grow">
            <strong class="count" id="p-count"></strong>
            <span class="badge primary" id="p-level-badge"></span>
          </div>
          <div class="ph-right">
            <span class="pill score" id="p-score-pill" data-i18n-title="score"><span aria-hidden="true">✔</span> <b id="p-score">0</b></span>
            <span class="pill streak" id="p-streak-pill" data-i18n-title="streak"><span aria-hidden="true">🔥</span> <b id="p-streak">0</b></span>
            <button type="button" class="btn btn-sm btn-ghost" id="p-quit"><span aria-hidden="true">✕</span> <span data-i18n="end_round"></span></button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><span id="p-prog" style="width:0%"></span></div>
        <div id="p-panel"></div>
        <div class="row next-row">
          <button type="button" class="btn btn-primary btn-lg" id="p-next" hidden><span id="p-next-lbl" data-i18n="next_word"></span> <span aria-hidden="true" class="fwd">→</span></button>
        </div>
      </section>

      <section id="p-summary" class="card stack summary" hidden>
        <div class="sum-top">
          <div class="sum-emoji" id="sum-emoji" aria-hidden="true">🎉</div>
          <div class="grow">
            <h2 data-i18n="sum_title"></h2>
            <p class="sum-score" id="sum-score" aria-live="polite"></p>
            <p class="sum-praise" id="sum-praise"></p>
          </div>
        </div>
        <div class="sum-stats" id="sum-stats"></div>
        <div id="sum-mist-wrap" class="stack">
          <h3 class="mb0" data-i18n="sum_mistakes"></h3>
          <ul class="mist" id="sum-mist"></ul>
        </div>
        <p class="callout success mb0" id="sum-perfect" data-i18n="sum_perfect" hidden></p>
        <div class="row">
          <button type="button" class="btn btn-accent" id="sum-redo"><span aria-hidden="true">🔁</span> <span data-i18n="practise_these"></span></button>
          <button type="button" class="btn btn-primary" id="sum-again"><span aria-hidden="true">▶</span> <span data-i18n="new_round"></span></button>
          <button type="button" class="btn" id="sum-levels"><span aria-hidden="true">☰</span> <span data-i18n="change_level"></span></button>
        </div>
      </section>
    </section>

    <!-- ===================== CLASS BEE ===================== -->
    <section id="view-bee" class="view no-print" role="tabpanel" aria-labelledby="tab-bee" hidden>
      <div id="b-setup" class="sb-layout">
        <section class="card stack">
          <h2 data-i18n="bee_setup_h"></h2>
          <p class="muted mb0" data-i18n="bee_help"></p>
          <div class="field">
            <span class="lbl" id="b-players-lbl" data-i18n="players"></span>
            <div class="players" id="b-players" role="group" aria-labelledby="b-players-lbl"></div>
            <div><button type="button" class="btn btn-sm" id="b-add"><span aria-hidden="true">＋</span> <span data-i18n="add_player"></span></button></div>
          </div>
          <div class="field">
            <span class="lbl" id="b-level-lbl" data-i18n="level_lbl"></span>
            <div class="seg seg-wrap" role="group" aria-labelledby="b-level-lbl" id="b-levels"></div>
          </div>
          <div class="field" id="b-per-field">
            <span class="lbl" id="b-per-lbl" data-i18n="per_player"></span>
            <div class="seg" role="group" aria-labelledby="b-per-lbl" id="b-per">
              <button type="button" data-per="2">2</button>
              <button type="button" data-per="3">3</button>
              <button type="button" data-per="5">5</button>
              <button type="button" data-per="10">10</button>
            </div>
          </div>
          <div class="field">
            <span class="lbl" id="b-type-lbl" data-i18n="game_type"></span>
            <div class="seg" role="group" aria-labelledby="b-type-lbl" id="b-type">
              <button type="button" data-type="points" data-i18n="type_points"></button>
              <button type="button" data-type="ko" data-i18n="type_ko"></button>
            </div>
            <p class="muted small mb0" id="b-type-help"></p>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg" id="b-start"><span aria-hidden="true">▶</span> <span data-i18n="start_bee"></span></button>
          </div>
        </section>
        <aside class="card stack">
          <h2 class="h3"><span aria-hidden="true">🧑‍🏫</span> <span data-i18n="bee_how_h"></span></h2>
          <ol class="steps">
            <li data-i18n="bee_step1"></li>
            <li data-i18n="bee_step2"></li>
            <li data-i18n="bee_step3"></li>
            <li data-i18n="bee_step4"></li>
          </ol>
        </aside>
      </div>

      <section id="b-stage" class="card bee-stage" hidden>
        <div class="bee-top">
          <div class="board" id="b-board" aria-live="polite"></div>
          <div class="bee-tools">
            <button type="button" class="btn btn-sm" id="b-fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            <button type="button" class="btn btn-sm btn-ghost" id="b-end"><span aria-hidden="true">✕</span> <span data-i18n="end_game"></span></button>
          </div>
        </div>
        <div class="turn">
          <span class="turn-name" id="b-turn"></span>
          <span class="turn-sub" id="b-turn-sub"></span>
        </div>
        <div id="b-panel"></div>
        <div class="row judge" id="b-judge">
          <span class="muted small" data-i18n="judge_help"></span>
          <button type="button" class="btn ok-b" id="b-ok"><span aria-hidden="true">✓</span> <span data-i18n="judge_ok"></span></button>
          <button type="button" class="btn bad-b" id="b-bad"><span aria-hidden="true">✗</span> <span data-i18n="judge_bad"></span></button>
        </div>
        <div class="row next-row">
          <button type="button" class="btn btn-primary btn-lg" id="b-next" hidden><span id="b-next-lbl" data-i18n="next_player"></span> <span aria-hidden="true" class="fwd">→</span></button>
        </div>
      </section>

      <section id="b-endcard" class="card stack bee-end" hidden>
        <div class="winner" id="b-winner" aria-live="polite"></div>
        <div class="scroll-x">
          <table class="table final" id="b-final"></table>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" id="b-again"><span aria-hidden="true">🔁</span> <span data-i18n="play_again"></span></button>
          <button type="button" class="btn" id="b-settings"><span aria-hidden="true">⚙</span> <span data-i18n="change_players"></span></button>
        </div>
      </section>
    </section>

    <!-- ===================== WORD LISTS ===================== -->
    <section id="view-lists" class="view no-print" role="tabpanel" aria-labelledby="tab-lists" hidden>
      <div class="callout accent stack" id="l-shared" hidden style="margin-bottom:16px">
        <p class="mb0" id="l-shared-msg"></p>
        <div class="row">
          <button type="button" class="btn btn-accent" id="l-shared-use"><span data-i18n="use_shared"></span></button>
          <button type="button" class="btn btn-ghost" id="l-shared-no"><span data-i18n="cancel"></span></button>
        </div>
      </div>
      <div class="sb-layout lists-layout">
        <section class="card stack" id="l-custom-card">
          <h2><span aria-hidden="true">✍️</span> <span data-i18n="my_list_h"></span></h2>
          <p class="muted small mb0" data-i18n="my_list_help"></p>
          <p class="small mb0"><span data-i18n="format_lbl"></span> <span class="fmt" dir="ltr" data-i18n="my_list_format"></span></p>
          <div class="field">
            <label for="l-text" data-i18n="words_box"></label>
            <textarea id="l-text" class="no-i18n" dir="ltr" lang="en" rows="9" spellcheck="false" autocapitalize="none" maxlength="20000"></textarea>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary" id="l-save"><span aria-hidden="true">💾</span> <span data-i18n="save_list"></span></button>
            <button type="button" class="btn" id="l-example"><span aria-hidden="true">🧪</span> <span data-i18n="example_list"></span></button>
            <button type="button" class="btn" id="l-share"><span aria-hidden="true">🔗</span> <span data-i18n="share_list"></span></button>
            <button type="button" class="btn btn-danger" id="l-clear"><span aria-hidden="true">🗑</span> <span data-i18n="clear"></span></button>
          </div>
          <div id="l-msg" class="small" aria-live="polite"></div>
        </section>

        <section class="card stack" id="l-view-card">
          <h2><span aria-hidden="true">🖨</span> <span data-i18n="print_h"></span></h2>
          <div class="seg seg-wrap" role="group" data-i18n-aria-label="level_lbl" id="l-levels"></div>
          <div class="row">
            <button type="button" class="btn btn-primary" id="l-print-list"><span aria-hidden="true">🖨</span> <span data-i18n="print_list"></span></button>
            <button type="button" class="btn" id="l-print-test"><span aria-hidden="true">📝</span> <span data-i18n="print_test"></span></button>
          </div>
          <p class="muted small mb0" id="l-count"></p>
          <div class="wl-wrap scroll-x">
            <table class="table wl" id="l-table"></table>
          </div>
        </section>
      </div>
    </section>

    <!-- filled by app.js; only this part is printed -->
    <section id="print-area" class="print-only" aria-hidden="true"></section>
  </main>
  <script src="../../../apps/spelling-bee/../../shared/edu.js"></script>
  <script src="../../../apps/spelling-bee/strings.js"></script>
  <script src="../../../apps/spelling-bee/words.js"></script>
  <script src="../../../apps/spelling-bee/content.js"></script>
  <script src="../../../apps/spelling-bee/app.js"></script>
</body>
</html>
