  <style>
    /* ---------- column: a phone-sized play area, also on a laptop or projector ---------- */
    .qj { max-width: 560px; margin-inline: auto; }
    .qj .edu-intro { text-align: center; margin-inline: auto; }
    .qj-banner { margin: 0 0 12px; padding: 8px 12px; font-size: .9rem; font-weight: 600; }
    .qj-card { text-align: center; padding: 22px 18px; }
    .qj-card h2, .qj-screen h2 { font-size: 1.5rem; margin-bottom: 12px; }
    .qj-screen h2[tabindex="-1"]:focus { outline: none; }
    .qj-lbl { display: block; font-weight: 700; font-size: .95rem; color: var(--muted); margin-bottom: 8px; }
    .qj-hint { color: var(--muted); font-size: .92rem; margin: 10px 0 0; }
    .qj-err { margin: 14px 0 0; text-align: start; font-weight: 700; }
    .qj-actions { display: flex; flex-direction: column; align-items: stretch; gap: 10px; margin-top: 18px; }
    .qj-actions .btn-lg { min-height: 56px; font-size: 1.15rem; }
    .btn-link { background: none; border: 0; color: var(--primary); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 6px 10px; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* ---------- 6-digit code: one real input over six visual boxes ---------- */
    .codebox { position: relative; width: min(100%, 380px); margin: 0 auto; }
    .codebox input {
      position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; margin: 0; padding: 0; min-height: 0;
      border: 0; border-radius: 12px; background: transparent; outline: none; font-size: 16px; text-align: center;
      color: transparent; -webkit-text-fill-color: transparent; caret-color: transparent; letter-spacing: 0;
    }
    .codebox input::selection { background: transparent; }
    .codebox input:focus { outline: none; }
    .slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .slots span {
      aspect-ratio: 5 / 6; display: grid; place-items: center; border-radius: 12px;
      border: 2px solid var(--border); background: var(--surface-2); color: var(--text);
      font-family: "Noto Sans", system-ui, sans-serif; font-size: clamp(1.7rem, 9vw, 2.6rem); font-weight: 800;
      font-variant-numeric: tabular-nums; line-height: 1; position: relative; transition: border-color .12s, box-shadow .12s;
    }
    .slots span.on { background: var(--surface); border-color: var(--primary); }
    .codebox:focus-within .slots span.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .codebox:focus-within .slots span.cur:empty::after { content: ''; width: 3px; height: 45%; border-radius: 2px; background: var(--accent); animation: qj-blink 1s steps(1) infinite; }
    .codebox.bad .slots span { border-color: var(--danger); }
    @keyframes qj-blink { 50% { opacity: 0; } }

    /* ---------- nickname ---------- */
    .quizname { margin: 0 0 6px; color: var(--muted); overflow-wrap: anywhere; }
    .quizname strong { color: var(--text); }
    #nameInput { width: 100%; min-height: 56px; font-size: 1.3rem; font-weight: 700; text-align: center; border-width: 2px; }

    /* ---------- in-game header ---------- */
    .gamebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .gamebar .chip { cursor: default; font-size: .95rem; max-width: 100%; }
    .gamebar .me-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
    .score-chip { background: var(--accent-soft); border-color: transparent; color: var(--text); font-variant-numeric: tabular-nums; }

    /* ---------- question ---------- */
    .qcard { padding: 14px 16px; margin-bottom: 10px; }
    .qmeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .qmeta .badge { font-size: .85rem; padding: 3px 10px; }
    .secs { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: end; font-family: "Noto Sans", system-ui, sans-serif; line-height: 1; }
    .timer { height: 12px; }
    .timer > span { transition: width .25s linear, background .3s; }
    .timer.low > span { background: var(--danger); }
    .qtext { font-size: 1.25rem; font-weight: 700; line-height: 1.45; margin: 12px 0 0; overflow-wrap: anywhere; white-space: pre-line; }
    .pick { text-align: center; font-weight: 600; margin: 4px 0 10px; }

    /* ---------- answer buttons: colour + shape + text ---------- */
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .answers.one { grid-template-columns: minmax(0, 1fr); }
    .answers:not(.one) .ans:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .ans {
      --ac: #c62828;
      display: flex; align-items: center; gap: 10px; width: 100%; min-height: clamp(88px, 17vh, 150px);
      padding: 12px 14px; border: 0; border-radius: 16px; background: var(--ac); color: #fff;
      font: inherit; font-size: 1.15rem; font-weight: 700; line-height: 1.3; text-align: start; cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .28); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: transform .06s, box-shadow .06s, opacity .2s;
    }
    .answers.one .ans { min-height: 72px; }
    .ans:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
    .ans:focus-visible { outline: 4px solid var(--text); outline-offset: 3px; }
    .ans .shape { flex: none; width: 34px; height: 34px; display: block; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
    /* the text box hugs its content, so it stays next to the shape even when its own direction differs (RTL page, LTR option) */
    .ans .ans-txt { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
    .ans.small-txt { font-size: 1rem; }
    .ans.c0 { --ac: #c62828; } .ans.c1 { --ac: #1565c0; } .ans.c2 { --ac: #b45309; }
    .ans.c3 { --ac: #2e7d32; } .ans.c4 { --ac: #6a1b9a; } .ans.c5 { --ac: #00695c; }
    .ans.mini { min-height: 58px; font-size: 1.05rem; cursor: default; box-shadow: none; margin-top: 6px; }
    .ans.mini .shape { width: 26px; height: 26px; }

    /* ---------- waiting / result / final ---------- */
    .big-emoji { font-size: 3.4rem; line-height: 1.1; margin-bottom: 6px; }
    .lead { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }
    .nick { display: inline-block; max-width: 100%; font-size: clamp(1.6rem, 8vw, 2.3rem); font-weight: 800; padding: 6px 18px; border-radius: 999px; background: var(--primary-soft); color: var(--text); overflow-wrap: anywhere; margin-bottom: 14px; }
    .waiting { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); margin: 6px 0 10px; text-align: center; }
    .dots { display: inline-flex; gap: 5px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); animation: qj-bounce 1.2s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes qj-bounce { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
    .spinner { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--surface-3); border-top-color: var(--primary); animation: qj-spin .9s linear infinite; margin: 6px auto 12px; }
    @keyframes qj-spin { to { transform: rotate(360deg); } }
    .sent-icon { width: 76px; height: 76px; margin: 4px auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); }
    .sent-icon .ico, .res-icon .ico { width: 58%; height: 58%; display: block; }
    .yours { text-align: start; margin: 12px 0 6px; }

    .res { text-align: center; border-radius: var(--radius); padding: 22px 16px; border: 2px solid var(--border); background: var(--surface-2); margin-bottom: 12px; }
    .res.correct { background: var(--success-soft); border-color: var(--success); }
    .res.wrong { background: var(--danger-soft); border-color: var(--danger); }
    .res-icon { width: 72px; height: 72px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); background: var(--muted); }
    .res.correct .res-icon { background: var(--success); }
    .res.wrong .res-icon { background: var(--danger); }
    .res h2 { font-size: 1.8rem; margin-bottom: 4px; }
    .pts { font-size: clamp(2.2rem, 11vw, 3.4rem); font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
    .pts.wait { font-size: 1.1rem; font-weight: 700; color: var(--muted); }
    .right-ans { text-align: start; margin-bottom: 12px; }
    .explain { text-align: start; margin-bottom: 12px; }
    .explain p { margin: 4px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
    .total { display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
    .total .big-number { font-size: clamp(2rem, 10vw, 3rem); }

    .final-card .rank-line { font-size: 1.35rem; font-weight: 800; margin: 2px 0 8px; }
    .final-card .score-line { display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .final-card .msg { font-size: 1.1rem; font-weight: 600; margin: 10px 0 0; }
    .remove-card { margin-top: 14px; text-align: start; }
    .remove-card h3 { font-size: 1rem; margin-bottom: 4px; }
    .remove-card p { color: var(--muted); font-size: .92rem; }

    .extras { margin-top: 18px; }
    .help summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }
    .privacy { text-align: center; margin: 14px 0 0; }

    /* Nastaliq needs taller lines in the big type */
    :root[lang="ur"] .qj-card h2, :root[lang="ur"] .qj-screen h2 { line-height: 1.9; }
    :root[lang="ur"] .lead, :root[lang="ur"] .pick, :root[lang="ur"] .rank-line { line-height: 2; }
    :root[lang="ur"] .pts { line-height: 1.9; }
    :root[lang="ur"] .res h2 { line-height: 2.1; }
    :root[lang="ur"] .edu-title { line-height: 1.9; }

    @media (max-width: 380px) {
      .ans { font-size: 1.05rem; gap: 8px; padding: 10px; }
      .ans .shape { width: 28px; height: 28px; }
      .slots { gap: 6px; }
    }
    @media (min-height: 760px) and (max-width: 560px) {
      .ans { min-height: clamp(96px, 16vh, 150px); }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="qj">
      <p class="edu-intro" id="intro" data-i18n="intro"></p>
      <p class="callout warning qj-banner" id="demoBanner" role="note" hidden data-i18n="demo_banner"></p>
      <p class="callout danger qj-banner" id="offlineBanner" role="status" hidden data-i18n="offline_banner"></p>

      <!-- 1) quiz code -->
      <section class="card qj-card" id="scrCode" hidden aria-labelledby="codeTitle">
        <h2 id="codeTitle" data-i18n="code_title"></h2>
        <label class="qj-lbl" for="codeInput" data-i18n="code_label"></label>
        <div class="codebox" id="codeBox" dir="ltr">
          <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-describedby="codeHint codeErr">
          <div class="slots" id="slots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <p class="qj-hint" id="codeHint" data-i18n="code_hint"></p>
        <p class="callout danger qj-err" id="codeErr" role="alert" hidden></p>
        <div class="qj-actions">
          <button class="btn btn-primary btn-lg" id="codeNext" type="button"></button>
        </div>
      </section>

      <!-- 2) nickname -->
      <section class="card qj-card" id="scrName" hidden aria-labelledby="nameTitle">
        <p class="quizname"><span data-i18n="quiz_label"></span> <strong class="no-i18n" id="quizTitle" dir="auto"></strong></p>
        <h2 id="nameTitle" data-i18n="name_title"></h2>
        <label class="qj-lbl" for="nameInput" data-i18n="name_label"></label>
        <input id="nameInput" type="text" maxlength="20" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" dir="auto" data-i18n-placeholder="name_ph" aria-describedby="nameHint nameErr">
        <p class="qj-hint" id="nameHint" data-i18n="name_hint"></p>
        <p class="callout danger qj-err" id="nameErr" role="alert" hidden></p>
        <div class="qj-actions">
          <button class="btn btn-primary btn-lg" id="joinBtn" type="button"></button>
          <button class="btn-link" id="changeCode" type="button" data-i18n="change_code"></button>
        </div>
      </section>

      <!-- 3) waiting room, questions, results, final (built by app.js) -->
      <section id="scrGame" hidden aria-live="polite"></section>

      <div class="extras" id="extras">
        <details class="card help no-print" id="helpBox">
          <summary><strong data-i18n="help_title"></strong></summary>
          <ul>
            <li data-i18n="tip1"></li>
            <li data-i18n="tip2"></li>
            <li data-i18n="tip3"></li>
            <li data-i18n="tip4"></li>
            <li data-i18n="tip5"></li>
            <li data-i18n="tip6"></li>
          </ul>
        </details>
        <p class="privacy small muted"><span data-i18n="privacy_note"></span> <a id="privacyLink" href="../../../apps/quiz-join/../../legal/privacy.html" data-i18n="privacy_link"></a></p>
      </div>
    </div>
  </main>
  <script src="../../../apps/quiz-join/../../shared/edu.js"></script>
  <script src="../../../apps/quiz-join/strings.js"></script>
  <script src="../../../apps/quiz-join/../../shared/firebase-config.js"></script>
  <script src="../../../apps/quiz-join/../../shared/cloud-mock.js"></script>
  <script src="../../../apps/quiz-join/../../shared/cloud.js"></script>
  <script src="../../../apps/quiz-join/app.js"></script>
</body>
