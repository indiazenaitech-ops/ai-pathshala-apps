              <div class="field"><span data-i18n="i_per"></span>
                <div class="seg" role="group" id="iPer">
                  <button type="button" data-v="1" id="iPer1" data-i18n="i_per1"></button>
                  <button type="button" data-v="2" id="iPer2" data-i18n="i_per2"></button>
                </div>
              </div>
              <div class="field pc-wide"><span data-i18n="i_look"></span>
                <div class="seg" role="group" id="iLook">
                  <button type="button" data-v="original" data-i18n="look_orig"></button>
                  <button type="button" data-v="scan" data-i18n="look_scan"></button>
                  <button type="button" data-v="gray" data-i18n="look_gray"></button>
                  <button type="button" data-v="bw" data-i18n="look_bw"></button>
                </div>
              </div>
              <label class="field"><span data-i18n="i_limit"></span>
                <select id="iLimit"></select>
              </label>
            </div>
            <label class="check" id="iCardRow"><input type="checkbox" id="iCard"> <span data-i18n="i_card"></span></label>
            <p class="small muted mb0 pc-msg" id="iFitNote"></p>
            <label class="field"><span data-i18n="i_name"></span>
              <span class="pc-name"><input type="text" id="iName" class="no-i18n" dir="auto" maxlength="80" autocomplete="off"><span aria-hidden="true" dir="ltr">.pdf</span></span>
            </label>
            <div class="row pc-go">
              <button class="btn btn-primary btn-lg" id="iGo" type="button"><span aria-hidden="true">📄</span> <span data-i18n="i_go"></span></button>
              <button class="btn" id="iStop" type="button" data-i18n="stop" hidden></button>
            </div>
            <div class="pc-prog" id="iProg" hidden>
              <div class="progress"><span id="iBar" style="width:0%"></span></div>
              <p class="small muted" id="iProgTxt" aria-live="polite"></p>
            </div>
          </div>

          <div class="stack">
            <div class="card stack">
              <div class="row spread"><h3 class="mb0" data-i18n="i_preview"></h3><span class="badge" id="iPagesBadge"></span></div>
              <canvas id="iLayout" class="pc-layout" width="600" height="300" role="img" data-i18n-aria-label="i_preview"></canvas>
            </div>
            <div class="card stack" id="iResult" aria-live="polite" data-state="empty" hidden></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= PDF TO JPG ================= -->
    <section id="p-jpg" role="tabpanel" aria-labelledby="tab-jpg" class="pc-panel" data-drop="pdf" hidden>
      <div class="stack">
        <div class="pc-cols">
          <div class="card stack">
            <div class="pc-head"><h2 data-i18n="j_title"></h2><p class="muted small mb0" data-i18n="j_desc"></p></div>
            <input type="file" id="jFile" class="pc-file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true">
            <div class="pc-drop" id="jDrop">
              <span class="pc-drop-ic" aria-hidden="true">📄</span>
              <button class="btn btn-primary btn-lg" id="jPick" type="button" data-i18n="choose_pdf"></button>
              <span class="small muted" data-i18n="or_drop"></span>
            </div>
            <div class="pc-fileinfo" id="jInfo" hidden></div>
            <div class="pc-opts">
              <div class="field"><span data-i18n="j_format"></span>
                <div class="seg" role="group" id="jFmt">
                  <button type="button" data-v="jpg">JPG</button>
                  <button type="button" data-v="png">PNG</button>
                </div>
              </div>
              <div class="field pc-wide"><span data-i18n="j_dpi"></span>
                <div class="seg" role="group" id="jDpi">
                  <button type="button" data-v="72" data-i18n="dpi_72"></button>
                  <button type="button" data-v="150" data-i18n="dpi_150"></button>
                  <button type="button" data-v="300" data-i18n="dpi_300"></button>
                </div>
              </div>
            </div>
            <div class="row pc-go">
              <button class="btn btn-primary btn-lg" id="jGo" type="button"><span aria-hidden="true">📸</span> <span data-i18n="j_go"></span></button>
              <button class="btn" id="jStop" type="button" data-i18n="stop" hidden></button>
            </div>
            <div class="pc-prog" id="jProg" hidden>
              <div class="progress"><span id="jBar" style="width:0%"></span></div>
              <p class="small muted" id="jProgTxt" aria-live="polite"></p>
            </div>
          </div>

          <div class="card stack" id="jPagesCard">
            <div class="row spread"><h3 class="mb0" data-i18n="j_pages"></h3><span class="badge primary" id="jSelCount"></span></div>
            <div class="pc-range">
              <input type="text" id="jRange" class="no-i18n" autocomplete="off" data-i18n-placeholder="j_range_ph" data-i18n-aria-label="j_pages">
              <button class="btn btn-sm" id="jAll" type="button" data-i18n="j_all"></button>
              <button class="btn btn-sm" id="jNone" type="button" data-i18n="j_none"></button>
            </div>
            <p class="small bad mb0 pc-msg" id="jRangeMsg" role="alert"></p>
            <div class="pc-pages" id="jPages"></div>
            <div class="pc-empty" id="jPagesEmpty"><span class="pc-drop-ic" aria-hidden="true">🗂️</span><span data-i18n="j_empty"></span></div>
          </div>
        </div>
        <div class="card stack" id="jResult" aria-live="polite" data-state="empty" hidden></div>
      </div>
    </section>

    <!-- ================= UNLOCK ================= -->
    <section id="p-unlock" role="tabpanel" aria-labelledby="tab-unlock" class="pc-panel" data-drop="pdf" hidden>
      <div class="pc-cols">
        <div class="card stack">
          <div class="pc-head"><h2 data-i18n="u_title"></h2><p class="muted small mb0" data-i18n="u_desc"></p></div>
          <p class="callout warning small mb0" data-i18n="u_warn"></p>
          <input type="file" id="uFile" class="pc-file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true">
          <div class="pc-drop" id="uDrop">
            <span class="pc-drop-ic" aria-hidden="true">🔐</span>
            <button class="btn btn-primary btn-lg" id="uPick" type="button" data-i18n="choose_pdf"></button>
            <span class="small muted" data-i18n="or_drop"></span>
          </div>
          <div class="pc-fileinfo" id="uInfo" hidden></div>
          <p class="mb0 pc-msg" id="uStatus" aria-live="polite"></p>
          <div class="stack" id="uSaveBox" hidden>
            <div class="field"><span data-i18n="u_quality"></span>
              <div class="seg" role="group" id="uDpi">
                <button type="button" data-v="150" data-i18n="q_std"></button>
                <button type="button" data-v="200" data-i18n="q_high"></button>
                <button type="button" data-v="300" data-i18n="q_print"></button>
              </div>
            </div>
            <div class="row pc-go">
              <button class="btn btn-primary btn-lg" id="uGo" type="button"><span aria-hidden="true">🔓</span> <span data-i18n="u_go"></span></button>
              <button class="btn" id="uStop" type="button" data-i18n="stop" hidden></button>
            </div>
            <div class="pc-prog" id="uProg" hidden>
              <div class="progress"><span id="uBar" style="width:0%"></span></div>
              <p class="small muted" id="uProgTxt" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <div class="card stack" id="uResult" aria-live="polite" data-state="empty"></div>
      </div>
    </section>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 data-i18n="inside_title"></h3>
      <p class="small" data-i18n="inside_body"></p>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="settings_saved"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/pdf-compress-convert/../../shared/edu.js"></script>
  <script src="../../../apps/pdf-compress-convert/strings.js"></script>
  <script src="../../../apps/pdf-compress-convert/app.js"></script>
</body>
</html>
