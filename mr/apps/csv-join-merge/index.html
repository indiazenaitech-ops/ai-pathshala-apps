<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="tabs" id="mode-tabs" role="tablist">
      <button type="button" role="tab" data-mode="join" data-i18n="mode_join"></button>
      <button type="button" role="tab" data-mode="stack" data-i18n="mode_stack"></button>
    </div>

    <!-- ============ JOIN ============ -->
    <div id="join-panel">
      <section class="card" aria-labelledby="h-files">
        <h2 class="cj-h" id="h-files" data-i18n="h_files"></h2>
        <div class="cj-samples">
          <span class="small muted" data-i18n="try_sample"></span>
          <div class="seg" id="sample-seg" role="group">
            <button type="button" data-s="students" data-i18n="sample_students"></button>
            <button type="button" data-s="orders" data-i18n="sample_orders"></button>
          </div>
          <button class="btn btn-sm btn-danger" id="reset" type="button" data-i18n="reset"></button>
        </div>
        <div class="cj-files">
          <div class="cj-file fa" id="file-a">
            <h3 data-i18n="file_a"></h3>
            <div class="cj-fname no-i18n"></div>
            <div class="cj-finfo small muted"></div>
            <div class="cj-fcols no-i18n"></div>
            <div class="row"><button class="btn btn-sm btn-primary cj-open" type="button" data-i18n="open_csv"></button></div>
            <details><summary data-i18n="paste_data"></summary>
              <textarea class="no-i18n" data-i18n-placeholder="paste_ph" data-i18n-aria-label="paste_data"></textarea>
              <button class="btn btn-sm cj-use" type="button" data-i18n="use_paste"></button></details>
          </div>
          <div class="cj-file fb" id="file-b">
            <h3 data-i18n="file_b"></h3>
            <div class="cj-fname no-i18n"></div>
            <div class="cj-finfo small muted"></div>
            <div class="cj-fcols no-i18n"></div>
            <div class="row"><button class="btn btn-sm btn-primary cj-open" type="button" data-i18n="open_csv"></button></div>
            <details><summary data-i18n="paste_data"></summary>
              <textarea class="no-i18n" data-i18n-placeholder="paste_ph" data-i18n-aria-label="paste_data"></textarea>
              <button class="btn btn-sm cj-use" type="button" data-i18n="use_paste"></button></details>
          </div>
        </div>
        <p class="small muted" data-i18n="drop_hint"></p>
      </section>

      <section class="card cj-sec" aria-labelledby="h-match">
        <h2 class="cj-h" id="h-match" data-i18n="h_match"></h2>
        <div class="cj-match">
          <div>
            <div class="cj-keys">
              <label class="field"><span data-i18n="key_a"></span><select id="key-a"></select></label>
              <label class="field"><span data-i18n="key_b"></span><select id="key-b"></select></label>
            </div>
            <div class="cj-opts">
              <label class="check"><input type="checkbox" id="opt-trim"> <span data-i18n="opt_trim"></span></label>
              <label class="check"><input type="checkbox" id="opt-icase"> <span data-i18n="opt_icase"></span></label>
              <label class="check"><input type="checkbox" id="opt-num"> <span data-i18n="opt_num"></span></label>
              <div><button class="btn btn-sm" id="swap" type="button" data-i18n="swap"></button></div>
            </div>
          </div>
          <div>
            <span class="small muted" data-i18n="join_type"></span>
            <div class="seg" id="type-seg" role="group" style="margin-top:5px">
              <button type="button" data-type="inner" data-i18n="type_inner"></button>
              <button type="button" data-type="left" data-i18n="type_left"></button>
              <button type="button" data-type="right" data-i18n="type_right"></button>
              <button type="button" data-type="full" data-i18n="type_full"></button>
            </div>
            <div class="cj-vennbox">
              <svg id="venn" class="cj-venn" viewBox="0 0 200 120" role="img" data-i18n-aria-label="venn_label" aria-label="Venn">
                <defs>
                  <clipPath id="clipA"><circle cx="78" cy="60" r="50"/></clipPath>
                  <mask id="notB"><rect width="200" height="120" fill="#fff"/><circle cx="122" cy="60" r="50" fill="#000"/></mask>
                  <mask id="notA"><rect width="200" height="120" fill="#fff"/><circle cx="78" cy="60" r="50" fill="#000"/></mask>
                </defs>
                <circle class="part pa" cx="78" cy="60" r="50" mask="url(#notB)"/>
                <circle class="part pb" cx="122" cy="60" r="50" mask="url(#notA)"/>
                <circle class="part mid" cx="122" cy="60" r="50" clip-path="url(#clipA)"/>
                <circle class="ring" cx="78" cy="60" r="50"/><circle class="ring" cx="122" cy="60" r="50"/>
                <text x="48" y="66" text-anchor="middle">A</text><text x="152" y="66" text-anchor="middle">B</text>
              </svg>
              <p id="type-help" class="small" aria-live="polite"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="card cj-sec" aria-labelledby="h-result">
        <h2 class="cj-h" id="h-result" data-i18n="h_result"></h2>
        <div class="cj-stats" aria-live="polite">
          <div class="cj-stat"><span class="lbl" data-i18n="st_matched"></span><span class="val" id="st-matched"></span></div>
          <div class="cj-stat"><span class="lbl no-i18n" id="lbl-onlya"></span><span class="val" id="st-onlya"></span></div>
          <div class="cj-stat"><span class="lbl no-i18n" id="lbl-onlyb"></span><span class="val" id="st-onlyb"></span></div>
          <div class="cj-stat main"><span class="lbl" data-i18n="st_rows"></span><span class="val" id="st-rows"></span></div>
        </div>
        <div id="warnings"></div>
        <span class="small muted" data-i18n="out_cols"></span>
        <div class="cj-cols no-i18n" id="out-cols"></div>
        <div class="cj-gridwrap no-i18n"><table class="table cj-grid" id="out-grid"></table></div>
        <p id="out-empty" class="muted" hidden data-i18n="no_rows"></p>
        <div class="cj-pager" id="out-pager"><button class="btn btn-sm pg-prev" type="button" data-i18n="previous"></button><span class="pg-info small"></span><button class="btn btn-sm pg-next" type="button" data-i18n="next"></button></div>
        <div class="cj-foot"><span class="small muted" data-i18n="legend_nm"></span><button class="btn btn-primary" id="dl-out" type="button" data-i18n="download_csv"></button></div>
      </section>

      <section class="card cj-sec" aria-labelledby="h-um">
        <h2 class="cj-h" id="h-um" data-i18n="h_unmatched"></h2>
        <p class="small muted" data-i18n="um_note"></p>
        <div class="tabs no-i18n" id="um-tabs" role="tablist">
          <button type="button" role="tab" data-side="a"></button>
          <button type="button" role="tab" data-side="b"></button>
        </div>
        <div class="cj-gridwrap no-i18n"><table class="table cj-grid" id="um-grid"></table></div>
        <p id="um-empty" class="muted" hidden data-i18n="um_none"></p>
        <div class="cj-pager" id="um-pager"><button class="btn btn-sm pg-prev" type="button" data-i18n="previous"></button><span class="pg-info small"></span><button class="btn btn-sm pg-next" type="button" data-i18n="next"></button></div>
        <div class="cj-foot"><span></span><button class="btn" id="dl-um" type="button" data-i18n="download_um"></button></div>
      </section>

      <section class="card cj-sec cj-lookup">
        <h2 class="cj-h" data-i18n="h_lookup"></h2>
        <p data-i18n-html="lookup_1"></p>
        <p data-i18n-html="lookup_2"></p>
      </section>
    </div>

    <!-- ============ STACK ============ -->
    <div id="stack-panel" hidden>
      <section class="card" aria-labelledby="h-stack">
        <h2 class="cj-h" id="h-stack" data-i18n="h_stack"></h2>
        <p class="small muted" data-i18n="stack_note"></p>
        <div id="st-drop">
          <ol id="st-files"></ol>
          <p id="st-empty" class="muted" hidden data-i18n="st_empty"></p>
          <div class="row">
            <button class="btn btn-primary" id="st-add" type="button" data-i18n="st_add"></button>
            <button class="btn" id="st-sample" type="button" data-i18n="st_sample"></button>
            <button class="btn btn-danger" id="st-clear" type="button" data-i18n="st_clear"></button>
          </div>
          <p class="small muted" style="margin-bottom:0" data-i18n="drop_hint"></p>
        </div>
        <div class="cj-opts">
          <label class="check"><input type="checkbox" id="st-loose"> <span data-i18n="st_loose"></span></label>
          <label class="check"><input type="checkbox" id="st-source"> <span data-i18n="st_source"></span></label>
        </div>
      </section>
      <section class="card cj-sec">
        <h2 class="cj-h" data-i18n="h_stacked"></h2>
        <p id="st-total" class="no-i18n" aria-live="polite" style="font-weight:600"></p>
        <div class="cj-gridwrap no-i18n"><table class="table cj-grid" id="st-grid"></table></div>
        <div class="cj-pager" id="st-pager"><button class="btn btn-sm pg-prev" type="button" data-i18n="previous"></button><span class="pg-info small"></span><button class="btn btn-sm pg-next" type="button" data-i18n="next"></button></div>
        <div class="cj-foot"><span class="small muted" data-i18n="legend_blank"></span><button class="btn btn-primary" id="st-dl" type="button" data-i18n="download_csv"></button></div>
      </section>
    </div>

    <details class="card cj-sec">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
    <details class="card cj-sec">
      <summary data-i18n="words_title"></summary>
      <ul>
        <li data-i18n-html="w_key"></li>
        <li data-i18n-html="w_inner"></li>
        <li data-i18n-html="w_outer"></li>
        <li data-i18n-html="w_many"></li>
        <li data-i18n-html="w_union"></li>
      </ul>
    </details>
  </main>

  <script src="../../../apps/csv-join-merge/content.js"></script>

  <script src="../../../apps/csv-join-merge/app.js"></script>
