    .hero img { width: 92px; height: 92px; border-radius: 22px; box-shadow: var(--shadow); }
    .hero h1 { font-size: clamp(1.5rem, 3.6vw, 2.3rem); margin: 0 0 6px; }
    .hero p { color: var(--muted); margin: 0; max-width: 70ch; }
    .hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero img { width: 64px; height: 64px; border-radius: 16px; } .hero-cta .btn { flex: 1 1 100%; } }
    .aud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 4px 0 18px; }
    .aud-label { font-weight: 700; color: var(--muted); font-size: .92rem; }
    .aud-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .aud-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; box-shadow: var(--shadow); text-align: start; }
    .aud-btn:hover { border-color: var(--primary); }
    .aud-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .aud-ic { font-size: 1.15rem; line-height: 1; flex: none; }
    .aud-n { flex: none; font-size: .74rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 1px 7px; font-family: "Noto Sans", system-ui, sans-serif; }
    .aud-btn[aria-pressed="true"] .aud-n { background: var(--surface); color: var(--text); }
    @media (max-width: 560px) {
      .aud { display: block; } .aud-label { display: block; margin-bottom: 8px; }
      .aud-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .aud-btn { border-radius: 14px; padding: 7px 10px; font-size: .9rem; } .aud-txt { flex: 1; min-width: 0; }
    }
    .ctas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); margin: 0 0 20px; }
    .cta-card { display: grid; grid-template-columns: auto 1fr auto; gap: 12px 18px; align-items: center; margin: 0; }
    .cta-card .big-ic { font-size: 2.4rem; line-height: 1; }
    .cta-card h2 { font-size: 1.15rem; margin: 0 0 4px; }
    .cta-card p { margin: 0; color: var(--muted); font-size: .93rem; }
    .cta-schools { border-inline-start: 5px solid var(--accent); background: linear-gradient(90deg, var(--accent-soft), var(--surface) 70%); }
    .cta-biz { border-inline-start: 5px solid var(--primary); background: linear-gradient(90deg, var(--primary-soft), var(--surface) 70%); }
    [dir="rtl"] .cta-schools { background: linear-gradient(270deg, var(--accent-soft), var(--surface) 70%); }
    [dir="rtl"] .cta-biz { background: linear-gradient(270deg, var(--primary-soft), var(--surface) 70%); }
    .ctas.two .cta-card { grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; align-items: start; }
    .ctas.two .cta-card .btn { grid-column: 1 / -1; justify-self: start; }
    @media (max-width: 720px) {
      .cta-card { grid-template-columns: auto 1fr; } .cta-card .btn { grid-column: 1 / -1; }
      .ctas.two .cta-card p { display: none; } .ctas.two .cta-card .big-ic { font-size: 2rem; } .ctas.two .cta-card h2 { font-size: 1.05rem; margin: 0; }
    }
    .search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .search input { flex: 1 1 260px; font-size: 1.05rem; min-height: 46px; }
    .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .apps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .app-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text); transition: transform .12s, box-shadow .12s, border-color .12s; }
    .app-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
    .app-card .ic { font-size: 2.1rem; line-height: 1; width: 56px; height: 56px; display: grid; place-items: center; background: var(--surface-2); border-radius: 14px; }
    .app-card h3 { margin: 0; font-size: 1.08rem; }
    .app-card p { margin: 0; color: var(--muted); font-size: .92rem; flex: 1; }
    .app-card .meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .section-title { margin: 30px 0 10px; }
    .how { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 8px; }
    .how ol { margin: 0; padding-inline-start: 1.2em; }
    .how li { margin-bottom: 8px; }
    .cat-head { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; }
    .cat-head h2 { margin: 0; }
    .yt-card .row .btn { flex: 1 1 auto; }
    [dir="rtl"] .arrow { display: inline-block; transform: scaleX(-1); }
    #schools-link { background: #c4461a; border-color: #c4461a; color: #fff; }
    #schools-link:hover { background: #a93b15; }
    #updates-link { border-color: var(--accent); }
    #updates { margin-top: 30px; }
    :root[lang="ur"] .hero h1, :root[lang="ur"] .cta-card h2, :root[lang="ur"] .aud-btn, :root[lang="ur"] .section-title, :root[lang="ur"] .cat-head h2, :root[lang="ur"] .app-card h3, :root[lang="ur"] .how h3 { line-height: 2.15; }

    .cat-tools { justify-content: flex-end; margin: 4px 0 0; }
    details.cat-group { border-bottom: 1px solid var(--border); }
    details.cat-group > summary { list-style: none; cursor: pointer; user-select: none; padding: 6px 0; border-radius: 10px; }
    details.cat-group > summary::-webkit-details-marker { display: none; }
    details.cat-group > summary:hover h2 { color: var(--primary); }
    details.cat-group > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    details.cat-group > .apps { margin-bottom: 18px; }
    .cat-chev { display: inline-block; width: 1.2em; font-size: 1.5rem; line-height: 1; color: var(--muted); transition: transform .15s; }
    details.cat-group[open] > summary .cat-chev { transform: rotate(90deg); }
    [dir="rtl"] details.cat-group:not([open]) > summary .cat-chev { transform: scaleX(-1); }
  </style>
</head>
<body>
  <main id="app">
    <section class="hero">
      <img src="shared/img/icon-192.png" alt="" width="92" height="92">
      <div>
        <h1 id="home-title" data-i18n="home_title"></h1>
        <p id="home-sub"></p>
        <div class="hero-cta">
          <a class="btn btn-wa" id="wa-home" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2.2a9.8 9.8 0 0 0-8.5 14.7L2.2 21.8l5-1.3A9.8 9.8 0 1 0 12 2.2zm0 1.8a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4z"/><path fill="currentColor" d="M8.7 7.3c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 1.9 3 4.7 4.1 2.3.9 2.8.7 3.3.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3l-1.9-.9c-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2z"/></svg><span data-i18n="shell_wa"></span></a>
          <a class="btn btn-yt" id="subscribe" target="_blank" rel="noopener">▶ <span data-i18n="subscribe_yt"></span></a>
          <a class="btn" id="updates-link" href="#updates"><span aria-hidden="true">✉️</span> <span data-i18n="updates_btn"></span></a>
        </div>
      </div>
    </section>

    <nav class="aud" aria-labelledby="aud-label">
      <span class="aud-label" id="aud-label" data-i18n="aud_label"></span>
      <div class="aud-chips" id="aud" role="group" aria-labelledby="aud-label"></div>
    </nav>

    <div class="ctas" id="ctas">
      <section class="card cta-card cta-schools" id="schools-cta" aria-labelledby="schools-h">
        <div class="big-ic" aria-hidden="true">🏫</div>
        <div>
          <h2 id="schools-h" data-i18n="schools_title"></h2>
          <p data-i18n="schools_text"></p>
        </div>
        <a class="btn btn-accent" id="schools-link" href="schools.html"><span data-i18n="schools_btn"></span> <span aria-hidden="true" class="arrow">→</span></a>
      </section>
      <section class="card cta-card cta-biz" id="biz-cta" aria-labelledby="biz-h">
        <div class="big-ic" aria-hidden="true">💼</div>
        <div>
          <h2 id="biz-h" data-i18n="biz_title"></h2>
          <p data-i18n="biz_text"></p>
        </div>
        <a class="btn btn-primary" id="biz-link" href="business.html"><span data-i18n="biz_btn"></span> <span aria-hidden="true" class="arrow">→</span></a>
      </section>
    </div>

    <div class="search">
      <input type="search" id="q" data-i18n-placeholder="search_ph" data-i18n-aria-label="search_ph" autocomplete="off">
      <button class="btn" id="share-lib" type="button">🔗 <span data-i18n="share_library"></span></button>
      <a class="btn" id="zip" hidden>⬇ <span data-i18n="download_zip"></span></a>
    </div>
    <div class="cats" id="cats" role="toolbar"></div>
    <div class="row cat-tools no-print" id="cat-tools">
      <button class="btn btn-sm" type="button" id="cat-expand">⊞ <span data-i18n="expand_all"></span></button>
      <button class="btn btn-sm" type="button" id="cat-collapse">⊟ <span data-i18n="collapse_all"></span></button>
    </div>
    <div id="list"></div>
    <p class="muted center" id="empty" hidden data-i18n="no_results"></p>

    <h2 class="section-title" data-i18n="how_title"></h2>
    <div class="how">
      <div class="card">
        <ol>
          <li data-i18n="how_1"></li>
          <li data-i18n="how_2"></li>
          <li data-i18n="how_3"></li>
          <li data-i18n="how_4"></li>
          <li data-i18n="how_5"></li>
        </ol>
      </div>
      <div class="card stack">
        <h3 data-i18n="privacy_title"></h3>
        <p class="muted" data-i18n="privacy_text"></p>
        <h3 data-i18n="request_title"></h3>
        <p class="muted" data-i18n="request_text"></p>
      </div>
      <div class="card stack yt-card">
        <h3>📺 <span data-i18n="yt_title"></span></h3>
        <p class="muted" data-i18n="yt_text"></p>
        <div class="row">
          <a class="btn btn-yt" id="subscribe-2" target="_blank" rel="noopener">▶ <span data-i18n="subscribe_yt"></span></a>
          <a class="btn" id="watch" target="_blank" rel="noopener">🎬 <span data-i18n="watch_how"></span></a>
        </div>
      </div>
    </div>

    <section class="card su" id="updates" data-signup="home"></section>
  </main>
  <script src="shared/edu.js"></script>
  <script src="shared/home-strings.js"></script>
  <script src="catalog.js"></script>
  <script src="shared/home.js"></script>
  <!-- "Stay updated" form: nothing goes online until someone ticks consent and presses the button -->
  <script src="shared/firebase-config.js"></script>
  <script src="shared/cloud-mock.js"></script>
  <script src="shared/cloud.js"></script>
  <script src="shared/signup-strings.js"></script>
  <script src="shared/signup.js"></script>
</body>
</html>
