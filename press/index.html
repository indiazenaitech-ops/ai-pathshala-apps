<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press kit · AI Pathshala</title>
  <meta name="description" content="Press kit for AI Pathshala Apps: logos, Hindi app screenshots, a one-page brochure for principals (Hindi and English PDF) and a WhatsApp flyer.">
  <meta property="og:title" content="Press kit · AI Pathshala Apps">
  <meta property="og:description" content="Logos, screenshots, brochures and a WhatsApp flyer for the free 12-language app library for Indian schools.">
  <link rel="canonical" href="https://apnipathshala.ai/press/index.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://apnipathshala.ai/press/index.html">
  <meta property="og:image" content="https://apnipathshala.ai/shared/img/og-home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../shared/img/icon-32.png">
  <link rel="apple-touch-icon" href="../shared/img/icon-192.png">
  <meta name="theme-color" content="#0b4f5c">
  <link rel="stylesheet" href="../shared/edu.css">
  <style>
    .pk-intro { color: var(--muted); max-width: 72ch; margin: 4px 0 18px; font-size: 1.05rem; }
    .pk-sec { margin: 28px 0 0; }
    .pk-sec > h2 { margin: 0 0 12px; }
    .pk-facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .pk-facts li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-weight: 600; }
    .pk-facts .ic { font-size: 1.5rem; line-height: 1; flex: 0 0 auto; }
    .pk-about p { margin: 0 0 12px; max-width: 80ch; }
    .pk-dl { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .pk-file { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; transition: border-color .12s, box-shadow .12s; }
    .pk-file:hover, .pk-file:focus-visible { border-color: var(--primary); box-shadow: var(--shadow); }
    .pk-prev { height: 180px; border-radius: var(--radius-sm); background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
    .pk-prev img { max-width: 100%; max-height: 180px; object-fit: contain; display: block; }
    .pk-prev.doc img { height: 100%; width: auto; box-shadow: var(--shadow); }
    .pk-prev.dark { background: #0b4f5c; }
    .pk-prev.light { background: #faf6f0; }
    .pk-prev.pad img { width: auto; height: auto; max-width: 86%; max-height: 140px; }
    .pk-file .lbl { font-weight: 600; line-height: 1.35; }
    .pk-file .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pk-shots { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .pk-shots figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .pk-shots a { display: block; }
    .pk-shots img { width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; display: block; background: var(--surface-2); }
    .pk-shots figcaption { padding: 10px 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .pk-two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .pk-two .card h2 { margin-top: 0; }
    .pk-links { display: flex; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
  <main id="app">
    <p class="pk-intro" data-i18n="intro"></p>

    <section class="pk-sec" aria-labelledby="pk-facts-h">
      <h2 id="pk-facts-h" data-i18n="facts_title"></h2>
      <ul class="pk-facts">
        <li><span class="ic" aria-hidden="true">📚</span><span id="pk-fact-apps"></span></li>
        <li><span class="ic" aria-hidden="true">🗣️</span><span data-i18n="fact_langs"></span></li>
        <li><span class="ic" aria-hidden="true">🆓</span><span data-i18n="fact_free"></span></li>
        <li><span class="ic" aria-hidden="true">📶</span><span data-i18n="fact_offline"></span></li>
        <li><span class="ic" aria-hidden="true">🔒</span><span data-i18n="fact_private"></span></li>
        <li><span class="ic" aria-hidden="true">🧾</span><span data-i18n="fact_open"></span></li>
      </ul>
    </section>

    <section class="pk-sec card pk-about" aria-labelledby="pk-about-h">
      <h2 id="pk-about-h" data-i18n="about_title"></h2>
      <p id="pk-about" data-i18n="about_text"></p>
      <button type="button" class="btn btn-sm" id="pk-copy">📋 <span data-i18n="copy"></span></button>
    </section>

    <section class="pk-sec" aria-labelledby="pk-dl-h">
      <h2 id="pk-dl-h" data-i18n="downloads_title"></h2>
      <div class="pk-dl">
        <a class="pk-file" href="onepager/ai-pathshala-onepager-hi.pdf" download>
          <span class="pk-prev doc"><img src="onepager/ai-pathshala-onepager-hi-preview.png" alt="" width="595" height="842" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_onepager_hi"></span>
          <span class="meta"><span class="badge">PDF · A4</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="onepager/ai-pathshala-onepager-en.pdf" download>
          <span class="pk-prev doc"><img src="onepager/ai-pathshala-onepager-en-preview.png" alt="" width="595" height="842" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_onepager_en"></span>
          <span class="meta"><span class="badge">PDF · A4</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="flyer/ai-pathshala-flyer-whatsapp-1080x1350.jpg" download>
          <span class="pk-prev doc"><img src="flyer/ai-pathshala-flyer-thumb.jpg" alt="" width="432" height="540" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_flyer"></span>
          <span class="meta"><span class="badge">JPG · 1080×1350</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="logo/ai-pathshala-logo.svg" download>
          <span class="pk-prev light pad"><img src="logo/ai-pathshala-logo.svg" alt="" width="560" height="530" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_logo_svg"></span>
          <span class="meta"><span class="badge">SVG</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="logo/ai-pathshala-logo-800.png" download>
          <span class="pk-prev light pad"><img src="logo/ai-pathshala-logo-800.png" alt="" width="800" height="800" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_logo_png"></span>
          <span class="meta"><span class="badge">PNG · 800×800</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="logo/ai-pathshala-lockup.png" download>
          <span class="pk-prev light pad"><img src="logo/ai-pathshala-lockup.png" alt="" width="1600" height="440" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_lockup"></span>
          <span class="meta"><span class="badge">PNG · 1600×440</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
        <a class="pk-file" href="logo/ai-pathshala-lockup-dark.png" download>
          <span class="pk-prev dark pad"><img src="logo/ai-pathshala-lockup-dark.png" alt="" width="1600" height="440" loading="lazy"></span>
          <span class="lbl" data-i18n="dl_lockup_dark"></span>
          <span class="meta"><span class="badge">PNG · 1600×440</span><span class="small muted">⬇ <span data-i18n="download"></span></span></span>
        </a>
      </div>
    </section>

    <section class="pk-sec" aria-labelledby="pk-shots-h">
      <h2 id="pk-shots-h" data-i18n="shots_title"></h2>
      <p class="muted small" data-i18n="shots_note"></p>
      <div class="pk-shots" id="pk-shots"></div>
    </section>

    <div class="pk-sec pk-two">
      <section class="card" aria-labelledby="pk-use-h">
        <h2 id="pk-use-h" data-i18n="usage_title"></h2>
        <p data-i18n="usage_text"></p>
      </section>
      <section class="card" aria-labelledby="pk-contact-h">
        <h2 id="pk-contact-h" data-i18n="contact_title"></h2>
        <p data-i18n="contact_text"></p>
        <p class="pk-links">
          <a class="btn btn-accent" href="https://www.youtube.com/@Apni_Pathshala_AI" target="_blank" rel="noopener">▶ <span data-i18n="yt_btn"></span></a>
          <a class="btn" href="https://github.com/indiazenaitech-ops/ai-pathshala-apps" target="_blank" rel="noopener">💻 <span data-i18n="gh_btn"></span></a>
        </p>
      </section>
    </div>
  </main>
  <script src="../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="../catalog.js"></script>
  <script src="press.js"></script>
</body>
</html>
