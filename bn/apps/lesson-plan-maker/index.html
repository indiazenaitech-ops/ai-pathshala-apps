              <label class="field span2"><span data-i18n="f_school"></span><input type="text" id="f-school" class="no-i18n" data-i18n-placeholder="f_school_ph" maxlength="120" autocomplete="organization"></label>
              <label class="field span2"><span data-i18n="f_teacher"></span><input type="text" id="f-teacher" class="no-i18n" data-i18n-placeholder="f_teacher_ph" maxlength="120" autocomplete="name"></label>
              <label class="field"><span data-i18n="f_class"></span><input type="text" id="f-class" class="no-i18n" data-i18n-placeholder="f_class_ph" maxlength="20"></label>
              <label class="field"><span data-i18n="f_section"></span><input type="text" id="f-section" class="no-i18n" data-i18n-placeholder="f_section_ph" maxlength="20"></label>
              <label class="field span2"><span data-i18n="f_subject"></span><input type="text" id="f-subject" class="no-i18n" data-i18n-placeholder="f_subject_ph" maxlength="120"></label>
              <label class="field span2 lesson-only"><span data-i18n="f_topic"></span><input type="text" id="f-topic" class="no-i18n" data-i18n-placeholder="f_topic_ph" maxlength="120"></label>
              <label class="field lesson-only"><span data-i18n="f_date"></span><input type="date" id="f-date" class="no-i18n"></label>
              <label class="field lesson-only"><span data-i18n="f_period"></span><input type="number" id="f-period" class="no-i18n" min="1" max="12" step="1" inputmode="numeric"></label>
              <label class="field lesson-only"><span data-i18n="f_duration"></span><input type="number" id="f-duration" class="no-i18n" min="5" max="480" step="5" inputmode="numeric"></label>
              <label class="field weekly-only"><span data-i18n="f_weekstart"></span><input type="date" id="f-weekstart" class="no-i18n"></label>
              <label class="field weekly-only"><span data-i18n="f_periods"></span><select id="f-periods" class="no-i18n"></select></label>
            </div>
          </section>

          <!-- learning outcomes + Bloom -->
          <section class="card stack lesson-only">
            <h2 class="h-sec" data-i18n="sec_outcomes"></h2>
            <label class="field"><span data-i18n="f_outcomes"></span><textarea id="f-outcomes" class="no-i18n tall" data-i18n-placeholder="outcomes_ph"></textarea></label>
            <div class="bloom">
              <p class="hint" style="margin-bottom:8px"><b data-i18n="bloom_title"></b> · <span data-i18n="bloom_hint"></span></p>
              <div class="seg" id="bloom-levels" role="group" data-i18n-aria-label="bloom_title"></div>
              <div class="verbs" id="bloom-verbs"></div>
            </div>
          </section>

          <!-- previous knowledge -->
          <section class="card stack lesson-only">
            <h2 class="h-sec" data-i18n="sec_prev"></h2>
            <label class="field"><span class="muted small" data-i18n="f_prev_hint"></span><textarea id="f-prev" class="no-i18n short" data-i18n-placeholder="f_prev_ph"></textarea></label>
          </section>

          <!-- CBSE body -->
          <div class="stack cbse-only" id="cbse-body" style="display:grid;gap:16px;margin:0">
            <section class="card stack">
              <h2 class="h-sec" data-i18n="sec_intro"></h2>
              <label class="field"><span class="muted small" data-i18n="f_intro_hint"></span><textarea id="f-intro" class="no-i18n short" data-i18n-placeholder="f_intro_ph"></textarea></label>
            </section>
            <section class="card stack">
              <h2 class="h-sec" data-i18n="sec_steps"></h2>
              <p class="hint" data-i18n="steps_hint"></p>
              <div class="stack" id="steps"></div>
              <div class="row">
                <button type="button" class="btn" id="step-add">＋ <span data-i18n="step_add"></span></button>
              </div>
              <div class="timing" id="timing" data-status="none" data-total="0" data-over="0">
                <div class="tbar-wrap"><div class="tbar" id="tbar" aria-hidden="true"></div></div>
                <p id="timing-text" aria-live="polite"></p>
              </div>
            </section>
            <section class="card stack">
              <div class="basic-grid">
                <label class="field span2"><span data-i18n="sec_recap"></span><textarea id="f-recap" class="no-i18n short" data-i18n-placeholder="f_recap_ph"></textarea></label>
                <label class="field span2"><span data-i18n="sec_assess"></span><textarea id="f-assess" class="no-i18n short" data-i18n-placeholder="f_assess_ph"></textarea></label>
                <label class="field span2"><span data-i18n="sec_hw"></span><textarea id="f-hw" class="no-i18n short" data-i18n-placeholder="f_hw_ph"></textarea></label>
                <label class="field span2"><span data-i18n="sec_reflect"></span><textarea id="f-reflect" class="no-i18n short" data-i18n-placeholder="f_reflect_ph"></textarea></label>
              </div>
            </section>
          </div>

          <!-- 5E body -->
          <section class="card stack e5-only" id="e5-card">
            <h2 class="h-sec" data-i18n="sec_5e"></h2>
            <p class="hint" data-i18n="e5_hint"></p>
            <div class="stack" id="e5"></div>
            <div class="timing" id="timing-5e" data-status="none" data-total="0" data-over="0">
              <div class="tbar-wrap"><div class="tbar" id="tbar-5e" aria-hidden="true"></div></div>
              <p id="timing-text-5e" aria-live="polite"></p>
            </div>
          </section>

          <!-- weekly body -->
          <section class="card stack weekly-only" id="week-card">
            <h2 class="h-sec" data-i18n="sec_week"></h2>
            <p class="hint" data-i18n="week_hint"></p>
            <div class="scroll-x"><table class="table week" id="week"></table></div>
          </section>

          <!-- differentiation -->
          <section class="card stack lesson-only">
            <h2 class="h-sec" data-i18n="sec_diff"></h2>
            <p class="hint" data-i18n="diff_hint"></p>
            <div class="grid-2">
              <label class="field"><span data-i18n="f_support"></span><textarea id="f-support" class="no-i18n short" data-i18n-placeholder="f_support_ph"></textarea></label>
              <label class="field"><span data-i18n="f_extension"></span><textarea id="f-extension" class="no-i18n short" data-i18n-placeholder="f_extension_ph"></textarea></label>
            </div>
          </section>
        </div>

        <aside class="aside-col">
          <!-- more actions -->
          <section class="card stack">
            <h2 class="h-sec" data-i18n="sec_actions"></h2>
            <div class="acts">
              <button type="button" class="btn" id="btn-new">🆕 <span data-i18n="btn_new"></span></button>
              <button type="button" class="btn" id="btn-dup">📑 <span data-i18n="btn_dup"></span></button>
              <a class="btn btn-wa" id="btn-wa" href="#" target="_blank" rel="noopener">💬 <span data-i18n="btn_wa"></span></a>
              <button type="button" class="btn" id="btn-copy">📋 <span data-i18n="btn_copy"></span></button>
              <button type="button" class="btn" id="btn-export">⬇ <span data-i18n="btn_export"></span></button>
              <button type="button" class="btn" id="btn-import">⬆ <span data-i18n="btn_import"></span></button>
              <button type="button" class="btn btn-danger span2" id="btn-reset">↺ <span data-i18n="reset"></span></button>
            </div>
            <p class="hint" data-i18n="actions_hint"></p>
          </section>

          <!-- NEP competencies -->
          <section class="card stack lesson-only">
            <h2 class="h-sec" data-i18n="sec_comp"></h2>
            <p class="hint" data-i18n="comp_hint"></p>
            <div class="chips" id="comp" role="group" data-i18n-aria-label="sec_comp"></div>
          </section>

          <!-- materials checklist -->
          <section class="card stack lesson-only">
            <h2 class="h-sec" data-i18n="sec_materials"></h2>
            <ul class="mat-list" id="mat-list"></ul>
            <p class="hint" id="mat-empty" data-i18n="mat_empty"></p>
            <div class="row nowrap">
              <input type="text" id="mat-input" class="grow no-i18n" data-i18n-placeholder="mat_ph" data-i18n-aria-label="mat_ph" maxlength="120">
              <button type="button" class="btn" id="mat-add" data-i18n="add"></button>
            </div>
            <p class="hint" data-i18n="mat_quick"></p>
            <div class="chips" id="mat-chips"></div>
          </section>

          <!-- student activity ideas -->
          <section class="card stack lesson-only" id="ideas-card">
            <h2 class="h-sec" data-i18n="sec_ideas"></h2>
            <label class="field"><span data-i18n="ideas_for"></span><select id="ideas-subject"></select></label>
            <div class="chips ideas" id="ideas"></div>
            <p class="hint" id="ideas-hint"></p>
          </section>
        </aside>
      </div>
    </section>

    <!-- ===================== PREVIEW ===================== -->
    <section id="panel-preview" role="tabpanel" aria-labelledby="tab-preview" hidden>
      <div class="row pv-tools no-print">
        <button type="button" class="btn btn-primary" id="pv-print">🖨 <span data-i18n="btn_print"></span></button>
        <a class="btn btn-wa" id="pv-wa" href="#" target="_blank" rel="noopener">💬 <span data-i18n="btn_wa"></span></a>
        <button type="button" class="btn" id="pv-copy">📋 <span data-i18n="btn_copy"></span></button>
        <button type="button" class="btn btn-ghost" id="pv-edit">✏️ <span data-i18n="tab_edit"></span></button>
      </div>
      <p class="hint no-print" style="margin-bottom:12px" data-i18n="print_hint"></p>
      <div class="a4" id="pv" aria-live="polite"></div>
    </section>

    <!-- ===================== SAVED PLANS ===================== -->
    <section id="panel-plans" role="tabpanel" aria-labelledby="tab-plans" hidden>
      <div class="card stack">
        <div class="row spread">
          <h2 class="h-sec" data-i18n="plans_title"></h2>
          <span class="badge" id="plans-count"></span>
        </div>
        <p class="hint" data-i18n="plans_hint"></p>
        <input type="search" id="plan-search" class="no-i18n" data-i18n-placeholder="plans_search_ph" data-i18n-aria-label="plans_search_ph">
        <div class="stack" id="plan-list" aria-live="polite"></div>
        <p class="hint" id="plans-empty"></p>
        <div class="row">
          <button type="button" class="btn" id="export-all">⬇ <span data-i18n="export_all"></span></button>
          <button type="button" class="btn" id="import-all">⬆ <span data-i18n="btn_import"></span></button>
        </div>
      </div>
    </section>
  </main>
  <script src="../../../apps/lesson-plan-maker/../../shared/edu.js"></script>
  <script src="../../../apps/lesson-plan-maker/strings.js"></script>
  <script src="../../../apps/lesson-plan-maker/content.js"></script>
  <script src="../../../apps/lesson-plan-maker/engine.js"></script>
  <script src="../../../apps/lesson-plan-maker/app.js"></script>
</body>
</html>
