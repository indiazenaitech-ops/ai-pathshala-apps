    <div class="callout success pm-privacy" id="privacy">
      <span class="ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong><span data-i18n="privacy_body"></span></p>
    </div>

    <div id="engine" class="pm-engine small" role="status" aria-live="polite">
      <span class="pm-spin" id="engSpin" aria-hidden="true"></span>
      <span id="engMsg"></span>
      <button class="btn btn-sm" id="engRetry" type="button" data-i18n="retry" hidden></button>
    </div>

    <div class="pm-layout">
      <section class="pm-work" aria-labelledby="dropTitle">
        <div class="card pm-drop" id="drop">
          <div class="big" aria-hidden="true">📄</div>
          <h2 id="dropTitle" data-i18n="drop_title"></h2>
          <p class="muted small mb0 pm-drop-hint" data-i18n="drop_hint"></p>
          <div class="row">
            <button class="btn btn-primary btn-lg" id="addBtn" type="button" data-act="add"><span aria-hidden="true">＋</span> <span data-i18n="add_files"></span></button>
            <button class="btn" id="sampleBtn" type="button" data-i18n="try_sample"></button>
          </div>
          <input type="file" id="fileInput" multiple accept=".pdf,application/pdf,.jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden>
        </div>

        <div id="fileList" class="pm-files" hidden></div>
        <div id="busy" class="pm-busy small muted" hidden><span class="pm-spin" aria-hidden="true"></span><span id="busyMsg"></span></div>
        <div id="msgs" class="pm-msgs stack" aria-live="polite"></div>

        <div class="card pm-toolbar" id="toolbar" hidden>
          <div class="grp">
            <button class="tb" type="button" data-act="selAll" data-i18n-title="sel_all" data-i18n-aria-label="sel_all"><span class="i" aria-hidden="true">☑</span><span class="lbl opt" data-i18n="sel_all"></span></button>
            <button class="tb" type="button" data-act="selNone" data-i18n-title="sel_none" data-i18n-aria-label="sel_none"><span class="i" aria-hidden="true">☐</span><span class="lbl opt" data-i18n="sel_none"></span></button>
            <span class="pm-count" id="countTxt" aria-live="polite"></span>
          </div>
          <span class="sep" aria-hidden="true"></span>
          <div class="grp">
            <button class="tb" type="button" data-act="rotL" data-i18n-title="rot_left" data-i18n-aria-label="rot_left"><span class="i" aria-hidden="true">⟲</span></button>
            <button class="tb" type="button" data-act="rotR" data-i18n-title="rot_right" data-i18n-aria-label="rot_right"><span class="i" aria-hidden="true">⟳</span></button>
            <button class="tb selonly" type="button" data-act="back" data-need="sel" data-i18n-title="move_back" data-i18n-aria-label="move_back"><span class="i flipx" aria-hidden="true">◀</span></button>
            <button class="tb selonly" type="button" data-act="fwd" data-need="sel" data-i18n-title="move_fwd" data-i18n-aria-label="move_fwd"><span class="i flipx" aria-hidden="true">▶</span></button>
            <button class="tb selonly" type="button" data-act="dup" data-need="sel" data-i18n-title="duplicate" data-i18n-aria-label="duplicate"><span class="i" aria-hidden="true">⧉</span><span class="lbl opt" data-i18n="duplicate"></span></button>
            <button class="tb selonly danger" type="button" data-act="del" data-need="sel" data-i18n-title="delete" data-i18n-aria-label="delete"><span class="i" aria-hidden="true">🗑</span><span class="lbl" data-i18n="delete"></span></button>
          </div>
          <span class="sep" aria-hidden="true"></span>
          <div class="grp">
            <button class="tb" type="button" data-act="blank" data-i18n-title="blank" data-i18n-aria-label="blank"><span class="i" aria-hidden="true">▭</span><span class="lbl opt" data-i18n="blank"></span></button>
            <button class="tb" type="button" data-act="reverse" data-i18n-title="reverse" data-i18n-aria-label="reverse"><span class="i" aria-hidden="true">⇅</span><span class="lbl opt" data-i18n="reverse"></span></button>
            <button class="tb" type="button" data-act="undo" id="undoBtn" data-i18n-title="undo" data-i18n-aria-label="undo"><span class="i flipx" aria-hidden="true">↶</span></button>
            <button class="tb" type="button" data-act="redo" id="redoBtn" data-i18n-title="redo" data-i18n-aria-label="redo"><span class="i flipx" aria-hidden="true">↷</span></button>
          </div>
          <label class="pm-zoom small"><span aria-hidden="true">🔍</span><span class="sr-only" data-i18n="zoom"></span><input type="range" id="zoom" min="110" max="240" step="10" data-i18n-aria-label="zoom" data-i18n-title="zoom"></label>
        </div>

        <div id="grid" class="pm-grid" role="list" data-i18n-aria-label="pages_label"></div>
        <p id="live" class="sr-only" aria-live="polite"></p>
      </section>

      <aside class="pm-side" id="side">
        <div class="card stack" id="exportCard">
          <div class="pm-tabs" role="tablist">
            <button type="button" role="tab" id="tabMerge" data-tab="merge" aria-controls="pMerge"><span aria-hidden="true">📑</span> <span data-i18n="tab_merge"></span></button>
            <button type="button" role="tab" id="tabSplit" data-tab="split" aria-controls="pSplit"><span aria-hidden="true">✂️</span> <span data-i18n="tab_split"></span></button>
          </div>

          <div id="pMerge" role="tabpanel" aria-labelledby="tabMerge">
            <p class="muted small mb0" data-i18n="merge_help"></p>
          </div>

          <div id="pSplit" role="tabpanel" aria-labelledby="tabSplit" class="stack" hidden>
            <div class="field">
              <span data-i18n="split_mode"></span>
              <div class="seg stack2" role="group" id="splitSeg">
                <button type="button" data-val="each" data-i18n="sm_each"></button>
                <button type="button" data-val="ranges" data-i18n="sm_ranges"></button>
                <button type="button" data-val="every" data-i18n="sm_every"></button>
                <button type="button" data-val="selected" data-i18n="sm_selected"></button>
              </div>
            </div>
            <div id="rangesBox" class="stack" hidden>
              <label class="field">
                <span data-i18n="ranges_label"></span>
                <input type="text" id="ranges" inputmode="numeric" autocomplete="off" spellcheck="false" data-i18n-placeholder="ranges_ph">
              </label>
              <p class="tiny muted mb0" data-i18n="ranges_hint"></p>
            </div>
            <label class="field" id="everyBox" hidden>
              <span data-i18n="every_label"></span>
              <input type="number" id="everyN" min="1" max="999" step="1" inputmode="numeric">
            </label>
            <label class="check" id="oneFileBox" hidden><input type="checkbox" id="oneFile"> <span id="oneFileTxt"></span></label>
          </div>

          <div class="pm-plan" id="plan" aria-live="polite"></div>

          <div>
            <p class="small muted mb0" style="margin-bottom:6px" data-i18n="extras"></p>
            <details class="pm-opt" id="optNum">
              <summary><span aria-hidden="true">#</span> <span data-i18n="opt_numbers"></span> <span class="badge" id="bNum"></span></summary>
              <div class="pm-opt-body">
                <label class="check"><input type="checkbox" id="numOn"> <span data-i18n="num_add"></span></label>
                <div class="pm-two">
                  <label class="field"><span data-i18n="position"></span>
                    <select id="numPos">
                      <option value="bc" data-i18n="pos_bc"></option>
                      <option value="br" data-i18n="pos_br"></option>
                      <option value="bl" data-i18n="pos_bl"></option>
                      <option value="tc" data-i18n="pos_tc"></option>
                      <option value="tr" data-i18n="pos_tr"></option>
                      <option value="tl" data-i18n="pos_tl"></option>
                    </select>
                  </label>
                  <label class="field"><span data-i18n="num_style"></span><select id="numFmt"></select></label>
                  <label class="field"><span data-i18n="num_start"></span><input type="number" id="numStart" min="0" max="99999" step="1" inputmode="numeric"></label>
                  <label class="field"><span data-i18n="text_size"></span><input type="number" id="numSize" min="6" max="36" step="1" inputmode="numeric"></label>
                </div>
                <label class="check"><input type="checkbox" id="numSkip"> <span data-i18n="num_skip"></span></label>
              </div>
            </details>

            <details class="pm-opt" id="optWm">
              <summary><span aria-hidden="true">💧</span> <span data-i18n="opt_watermark"></span> <span class="badge" id="bWm"></span></summary>
              <div class="pm-opt-body">
                <div class="seg w100" role="group" id="wmSeg">
                  <button type="button" data-val="none" data-i18n="wm_none"></button>
                  <button type="button" data-val="text" data-i18n="wm_text"></button>
                  <button type="button" data-val="image" data-i18n="wm_image"></button>
                </div>
                <div id="wmTextBox" class="stack">
                  <label class="field"><span data-i18n="wm_text_label"></span><input type="text" id="wmText" dir="auto" maxlength="120" data-i18n-placeholder="wm_text_ph"></label>
                  <div class="pm-kyc">
                    <h4><span aria-hidden="true">🪪</span> <span data-i18n="kyc_title"></span></h4>
                    <p class="small mb0" data-i18n="kyc_help"></p>
                    <label class="field"><span data-i18n="kyc_org"></span><input type="text" id="kycOrg" dir="auto" maxlength="60" data-i18n-placeholder="kyc_org_ph"></label>
                    <button class="btn btn-sm" type="button" id="kycBtn" data-i18n="kyc_make"></button>
                  </div>
                </div>
                <div id="wmImgBox" class="stack" hidden>
                  <div class="pm-wmimg">
                    <button class="btn btn-sm" type="button" id="wmPick"><span aria-hidden="true">🖼</span> <span data-i18n="wm_pick"></span></button>
                    <img id="wmImgPrev" alt="" hidden>
                  </div>
                  <p class="tiny muted mb0" data-i18n="wm_img_note"></p>
                </div>
                <div id="wmStyleBox" class="stack">
                  <div class="field"><span data-i18n="layout"></span>
                    <div class="seg w100" role="group" id="wmLayoutSeg">
                      <button type="button" data-val="center" data-i18n="wm_center"></button>
                      <button type="button" data-val="tile" data-i18n="wm_tile"></button>
                    </div>
                  </div>
                  <div class="field"><span data-i18n="angle"></span>
                    <div class="seg w100" role="group" id="wmAngleSeg">
                      <button type="button" data-val="diag" data-i18n="wm_diag"></button>
                      <button type="button" data-val="flat" data-i18n="wm_flat"></button>
                    </div>
                  </div>
                  <div class="field" id="wmColorBox"><span data-i18n="colour"></span>
                    <div class="pm-colors" role="group" id="wmColors">
                      <button type="button" data-val="grey"><i style="background:#808080"></i><span data-i18n="col_grey"></span></button>
                      <button type="button" data-val="red"><i style="background:#cc1a1a"></i><span data-i18n="col_red"></span></button>
                      <button type="button" data-val="blue"><i style="background:#1a4dcc"></i><span data-i18n="col_blue"></span></button>
                      <button type="button" data-val="black"><i style="background:#000"></i><span data-i18n="col_black"></span></button>
                    </div>
                  </div>
                  <label class="field"><span data-i18n="strength"></span>
                    <span class="range-row"><input type="range" id="wmOpacity" min="5" max="100" step="5"><output id="wmOpacityOut"></output></span>
                  </label>
                  <label class="field"><span data-i18n="size"></span>
                    <span class="range-row"><input type="range" id="wmSize" min="10" max="100" step="5"><output id="wmSizeOut"></output></span>
                  </label>
                </div>
              </div>
            </details>

            <details class="pm-opt" id="optMeta">
              <summary><span aria-hidden="true">🏷</span> <span data-i18n="opt_meta"></span> <span class="badge" id="bMeta"></span></summary>
              <div class="pm-opt-body">
                <div class="seg w100" role="group" id="metaSeg">
                  <button type="button" data-val="remove" data-i18n="meta_remove"></button>
                  <button type="button" data-val="keep" data-i18n="meta_keep"></button>
                  <button type="button" data-val="set" data-i18n="meta_set"></button>
                </div>
                <p class="tiny muted mb0" id="metaHelp"></p>
                <div id="metaFields" class="stack" hidden>
                  <label class="field"><span data-i18n="meta_title"></span><input type="text" id="mTitle" dir="auto" maxlength="200"></label>
                  <label class="field"><span data-i18n="meta_author"></span><input type="text" id="mAuthor" dir="auto" maxlength="120"></label>
                  <label class="field"><span data-i18n="meta_subject"></span><input type="text" id="mSubject" dir="auto" maxlength="200"></label>
                  <label class="field"><span data-i18n="meta_keywords"></span><input type="text" id="mKeywords" dir="auto" maxlength="200"></label>
                </div>
              </div>
            </details>

            <details class="pm-opt" id="optImg">
              <summary><span aria-hidden="true">🖼</span> <span data-i18n="opt_images"></span></summary>
              <div class="pm-opt-body">
                <label class="field"><span data-i18n="img_mode"></span>
                  <select id="imgMode">
                    <option value="a4" data-i18n="img_a4"></option>
                    <option value="a4p" data-i18n="img_a4p"></option>
                    <option value="fit" data-i18n="img_fit"></option>
                  </select>
                </label>
              </div>
            </details>
          </div>

          <div class="pm-prev" id="prevBox" hidden>
            <canvas id="stampPrev" width="240" height="340" role="img" data-i18n-aria-label="stamp_preview"></canvas>
            <p class="small muted mb0" data-i18n="stamp_preview"></p>
          </div>

          <div class="pm-gobar stack">
          <label class="field">
            <span data-i18n="out_name"></span>
            <input type="text" id="outName" maxlength="80" autocomplete="off" spellcheck="false">
          </label>
          <p class="small bad mb0" id="planErr" role="alert" hidden></p>
          <button class="btn btn-primary btn-lg pm-go" id="goBtn" type="button"><span aria-hidden="true">⬇</span> <span id="goTxt"></span></button>
          <div id="progBox" class="stack" hidden>
            <div class="progress"><span id="progBar" style="width:0%"></span></div>
            <div class="row spread"><span class="small muted" id="progMsg" aria-live="polite"></span><button class="btn btn-sm" type="button" id="stopBtn" data-i18n="stop"></button></div>
          </div>
          <div class="callout success pm-result" id="result" role="status" hidden>
            <p class="mb0" id="resultMsg"></p>
            <div class="row">
              <button class="btn btn-sm" type="button" id="againBtn"><span aria-hidden="true">⬇</span> <span data-i18n="download_again"></span></button>
              <button class="btn btn-sm" type="button" id="shareBtn" hidden><span aria-hidden="true">↗</span> <span data-i18n="share_file"></span></button>
            </div>
          </div>
          </div>
        </div>
      </aside>
    </div>

    <details class="card" id="helpBox">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="keys_title"></h3>
      <ul class="pm-keys small">
        <li data-i18n="key1"></li>
        <li data-i18n="key2"></li>
        <li data-i18n="key3"></li>
        <li data-i18n="key4"></li>
        <li data-i18n="key5"></li>
      </ul>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="reset_help"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>

    <div class="pm-mbar no-print" id="mbar">
      <div class="in">
        <span class="pm-count" id="mCount"></span>
        <div class="acts" id="mSelActs">
          <button class="tb" type="button" data-act="rotL" data-i18n-aria-label="rot_left" data-i18n-title="rot_left"><span class="i" aria-hidden="true">⟲</span></button>
          <button class="tb" type="button" data-act="rotR" data-i18n-aria-label="rot_right" data-i18n-title="rot_right"><span class="i" aria-hidden="true">⟳</span></button>
          <button class="tb" type="button" data-act="back" data-i18n-aria-label="move_back" data-i18n-title="move_back"><span class="i flipx" aria-hidden="true">◀</span></button>
          <button class="tb" type="button" data-act="fwd" data-i18n-aria-label="move_fwd" data-i18n-title="move_fwd"><span class="i flipx" aria-hidden="true">▶</span></button>
          <button class="tb" type="button" data-act="dup" data-i18n-aria-label="duplicate" data-i18n-title="duplicate"><span class="i" aria-hidden="true">⧉</span></button>
          <button class="tb danger" type="button" data-act="del" data-i18n-aria-label="delete" data-i18n-title="delete"><span class="i" aria-hidden="true">🗑</span></button>
          <button class="tb" type="button" data-act="selNone" data-i18n-aria-label="sel_none" data-i18n-title="sel_none"><span class="i" aria-hidden="true">✕</span></button>
        </div>
        <button class="tb primary" type="button" data-act="toExport" id="mExport"><span class="i" aria-hidden="true">⬇</span> <span data-i18n="to_export"></span></button>
      </div>
    </div>
  </main>
  <script src="../../../apps/pdf-merge-split/../../shared/edu.js"></script>
  <script src="../../../apps/pdf-merge-split/strings.js"></script>
  <script src="../../../apps/pdf-merge-split/app.js"></script>
</body>
</html>
