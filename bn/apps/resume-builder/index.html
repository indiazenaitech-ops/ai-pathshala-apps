        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <section class="card rb-bar no-print" aria-labelledby="resumeSelLbl">
      <label class="field">
        <span id="resumeSelLbl" data-i18n="my_resumes"></span>
        <select id="resumeSel" class="no-i18n"></select>
      </label>
      <div class="row">
        <button class="btn" id="newResume" type="button"><span aria-hidden="true">＋</span> <span data-i18n="new_resume"></span></button>
        <button class="btn" id="dupResume" type="button" data-i18n="duplicate"></button>
        <button class="btn btn-danger" id="delResume" type="button" data-i18n="delete_resume"></button>
      </div>
    </section>

    <div class="seg rb-viewseg no-print" role="group" id="viewSeg">
      <button type="button" id="viewEdit" aria-pressed="true"><span aria-hidden="true">✏️</span> <span data-i18n="view_edit"></span></button>
      <button type="button" id="viewPreview" aria-pressed="false"><span aria-hidden="true">👁</span> <span data-i18n="view_preview"></span></button>
    </div>

    <div class="rb-layout" id="layout" data-view="edit">
      <div class="rb-form stack no-print" id="formCol">
        <div class="callout accent stack" id="sampleNote" hidden>
          <p class="mb0" data-i18n="sample_note"></p>
          <div class="row"><button class="btn btn-sm" id="startBlank" type="button" data-i18n="start_blank"></button></div>
        </div>

        <section class="card stack" id="designCard">
          <label class="field">
            <span data-i18n="resume_label"></span>
            <input type="text" id="resumeName" dir="auto" maxlength="80" autocomplete="off" data-i18n-placeholder="untitled">
          </label>
          <div class="field">
            <span id="tplLbl" data-i18n="template"></span>
            <div class="rb-tpls" id="tplList" role="radiogroup" aria-labelledby="tplLbl"></div>
          </div>
          <label class="field">
            <span data-i18n="heading_lang"></span>
            <select id="headLang" class="no-i18n"></select>
            <span class="hint" data-i18n="heading_lang_hint"></span>
          </label>
          <fieldset class="rb-opts">
            <legend data-i18n="extras"></legend>
            <label class="check"><input type="checkbox" id="optPhoto"> <span data-i18n="opt_photo"></span></label>
            <label class="check"><input type="checkbox" id="optPersonal"> <span data-i18n="opt_personal"></span></label>
            <label class="check"><input type="checkbox" id="optJob"> <span data-i18n="opt_job"></span></label>
            <label class="check"><input type="checkbox" id="optDecl"> <span data-i18n="opt_decl"></span></label>
          </fieldset>
          <p class="small muted mb0" id="atsPhotoNote" data-i18n="ats_photo_note" hidden></p>
        </section>

        <p class="small muted mb0" data-i18n="order_hint"></p>
        <div id="sections" class="stack"></div>

        <details class="card" id="verbsCard">
          <summary class="rb-help"><b data-i18n="verbs_title"></b></summary>
          <p class="small muted" style="margin:8px 0 0" data-i18n="verbs_hint"></p>
          <div class="rb-verbs no-i18n" id="verbList"></div>
        </details>

        <section class="card stack" id="filesCard">
          <h2 class="mb0" data-i18n="files_title"></h2>
          <p class="small muted mb0" data-i18n="files_hint"></p>
          <div class="row">
            <button class="btn" id="exportJson" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="export_json"></span></button>
            <button class="btn" id="importJson" type="button"><span aria-hidden="true">📂</span> <span data-i18n="import_json"></span></button>
            <button class="btn" id="loadExample" type="button" data-i18n="load_example"></button>
          </div>
          <div class="row">
            <button class="btn btn-danger" id="clearPersonal" type="button"><span aria-hidden="true">🧹</span> <span data-i18n="clear_personal"></span></button>
            <button class="btn btn-ghost" id="resetAll" type="button" data-i18n="reset"></button>
          </div>
          <p class="tiny muted mb0" data-i18n="saved_local"></p>
        </section>
      </div>

      <div class="rb-previewcol" id="previewCol">
        <section class="card rb-fit no-print" aria-live="polite">
          <div class="row spread">
            <span id="fitText" class="small"></span>
            <button class="btn btn-primary" id="printBtn" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="pdf_btn"></span></button>
          </div>
          <div class="progress" aria-hidden="true"><span id="fitBar"></span></div>
          <p class="tiny muted mb0" data-i18n="print_tip"></p>
        </section>
        <div class="rb-stage" id="stage" role="region" data-i18n-aria-label="preview_aria">
          <p class="muted" id="emptyMsg" data-i18n="empty_preview" hidden></p>
          <div class="rb-scalewrap" id="scaleWrap" dir="ltr">
            <div class="rb-scale" id="scaleBox">
              <article class="rb-page no-i18n" id="page"></article>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="print-root" class="no-i18n" aria-hidden="true"></div>
  <script src="../../../apps/resume-builder/../../shared/edu.js"></script>
  <script src="../../../apps/resume-builder/strings.js"></script>
  <script src="../../../apps/resume-builder/content.js"></script>
  <script src="../../../apps/resume-builder/app.js"></script>
</body>
</html>
