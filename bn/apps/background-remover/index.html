  <style>
    .br-privacy { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
    .br-privacy .ic { font-size: 1.35rem; line-height: 1.3; flex: none; }
    .br-privacy p { margin: 0; }
    .br-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; }
    @media (max-width: 900px) { .br-grid { grid-template-columns: minmax(0, 1fr); } }
    .br-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 900px) {
      /* phones: 1. photo + AI, 2. result, 3. background + download */
      .br-col { display: contents; }
      #photoCard { order: 1; } #resultCard { order: 2; } #finishCard { order: 3; }
    }
    @media (min-width: 901px) { .br-col:last-child { align-self: stretch; } #resultCard { position: sticky; top: 72px; } }
    .br-step { font-size: 1.15rem; margin: 0; }

    .br-drop {
      border: 2px dashed color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius: var(--radius); padding: 20px 14px;
      text-align: center; background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: background .12s, border-color .12s;
    }
    .br-drop:hover, .br-drop.over, .br-drop:focus-visible { border-color: var(--primary); background: var(--primary-soft); }
    .br-drop-ic { font-size: 2rem; line-height: 1.1; }
    .br-drop strong { font-size: 1.02rem; }
    .br-add { display: flex; flex-wrap: wrap; gap: 8px; }
    .br-add .btn { flex: 1 1 auto; }

    .br-models { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
    .br-models legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
    .br-model { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--surface); }
    .br-model:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
    .br-model input { margin-top: 4px; flex: none; width: 18px; height: 18px; accent-color: var(--primary); }
    .br-model-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .br-model-body .small { color: var(--muted); }
    .br-saved { color: var(--success); font-weight: 600; }

    .br-run { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .br-run .btn-lg { flex: 1 1 220px; }
    .br-status { display: flex; flex-direction: column; gap: 6px; }
    .br-status .progress { height: 12px; }
    .progress > span.br-indet {
      background: linear-gradient(90deg, var(--primary-soft) 0%, var(--primary) 50%, var(--primary-soft) 100%);
      background-size: 200% 100%; animation: br-slide 1.3s linear infinite;
    }
    @keyframes br-slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    @media (prefers-reduced-motion: reduce) { .progress > span.br-indet { animation: none; } }

    /* result stage */
    .br-stage {
      position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; justify-content: center; align-items: center;
      background-color: var(--surface);
      background-image: conic-gradient(var(--surface-2) 25%, var(--surface) 0 50%, var(--surface-2) 0 75%, var(--surface) 0);
      background-size: 22px 22px; min-height: 220px;
    }
    .br-stage canvas { display: block; max-width: 100%; touch-action: pan-y; cursor: ew-resize; }
    .br-stage canvas.brush { cursor: crosshair; touch-action: none; }
    .br-stage.over { outline: 3px dashed var(--primary); outline-offset: -6px; }
    .br-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 16px; text-align: center; color: var(--muted); }
    .br-empty-ic { font-size: 2.6rem; }
    .br-busy {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
      background: color-mix(in srgb, var(--surface) 35%, transparent);
    }
    .br-busy span { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-weight: 700; box-shadow: var(--shadow); }
    .br-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .br-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .br-chips .chip { min-height: 40px; }
    .br-range { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .br-range input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--primary); }
    .br-range .lbl { font-weight: 600; font-size: .9rem; }
    .br-cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .br-cmp input { width: 100%; accent-color: var(--primary); }
    .br-cmp .tiny { font-weight: 700; color: var(--muted); }
    .br-info { display: flex; flex-wrap: wrap; gap: 6px; }

    .br-swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .br-sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
    .br-sw[aria-pressed="true"] { outline: 3px solid var(--primary); outline-offset: 2px; }
    .br-color { width: 48px; height: 40px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; }
    .br-dl { display: flex; flex-wrap: wrap; gap: 8px; }
    .br-dl .btn { flex: 1 1 160px; }
    .br-help ul { margin: 10px 0 0; padding-inline-start: 22px; display: grid; gap: 8px; }
    .br-storage { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success br-privacy">
      <span class="ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <div class="br-grid">
      <div class="br-col">
        <!-- 1. photo + AI -->
        <section class="card stack" id="photoCard" aria-labelledby="hPhoto">
          <h2 class="br-step" id="hPhoto" data-i18n="step_photo"></h2>
          <div class="br-drop" id="drop" tabindex="0" role="button" aria-describedby="dropHint">
            <span class="br-drop-ic" aria-hidden="true">🖼️</span>
            <strong data-i18n="drop_title"></strong>
            <span class="small muted" id="dropHint" data-i18n="drop_hint"></span>
          </div>
          <div class="br-add">
            <button class="btn btn-primary" id="pickBtn" type="button"><span aria-hidden="true">📂</span> <span data-i18n="choose_photo"></span></button>
            <button class="btn" id="samplePerson" type="button"><span aria-hidden="true">🧑</span> <span data-i18n="sample_person"></span></button>
            <button class="btn" id="sampleProduct" type="button"><span aria-hidden="true">🫖</span> <span data-i18n="sample_product"></span></button>
          </div>
          <fieldset class="br-models" id="models">
            <legend data-i18n="model_label"></legend>
            <label class="br-model">
              <input type="radio" name="model" value="isnet" id="mIsnet">
              <span class="br-model-body"><strong data-i18n="model_isnet"></strong><span class="small" id="noteIsnet"></span></span>
            </label>
            <label class="br-model">
              <input type="radio" name="model" value="modnet" id="mModnet">
              <span class="br-model-body"><strong data-i18n="model_modnet"></strong><span class="small" id="noteModnet"></span></span>
            </label>
          </fieldset>
          <div class="br-run">
            <button class="btn btn-primary btn-lg" id="runBtn" type="button" disabled><span aria-hidden="true">✨</span> <span data-i18n="remove_btn"></span></button>
            <button class="btn btn-danger" id="stopBtn" type="button" data-i18n="stop" hidden></button>
          </div>
          <p class="small muted mb0" id="firstTime"></p>
          <div class="br-status" id="statusBox" hidden>
            <span id="stText" aria-live="polite"></span>
            <div class="progress" id="stBarWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="stText"><span id="stBar" style="width:0%"></span></div>
            <span class="small muted" id="stNote" hidden></span>
          </div>
          <div class="callout danger stack" id="errBox" role="alert" hidden>
            <p class="mb0" id="errText"></p>
            <div><button class="btn btn-sm" id="retryBtn" type="button" data-i18n="try_again"></button></div>
          </div>
        </section>

        <!-- 3. background, size, download -->
        <section class="card stack" id="finishCard" aria-labelledby="hFinish" hidden>
          <h2 class="br-step" id="hFinish" data-i18n="step_finish"></h2>
          <div class="stack">
            <strong id="hBg" data-i18n="bg_label"></strong>
            <div class="br-chips" id="bgChips" role="group" aria-labelledby="hBg">
              <button class="chip" type="button" data-bg="none" data-i18n="bg_none"></button>
              <button class="chip" type="button" data-bg="white" data-i18n="bg_white"></button>
              <button class="chip" type="button" data-bg="color" data-i18n="bg_color"></button>
              <button class="chip" type="button" data-bg="blur" data-i18n="bg_blur"></button>
              <button class="chip" type="button" data-bg="photo" data-i18n="bg_photo"></button>
            </div>
            <div class="br-swatches no-i18n" id="swatches" hidden></div>
            <label class="br-range" id="blurRow" hidden><span class="lbl" data-i18n="blur_amount"></span><input type="range" id="blurAmt" min="2" max="40" step="1"></label>
            <div id="bgPhotoRow" hidden><button class="btn btn-sm" id="bgPickBtn" type="button"><span aria-hidden="true">🏞️</span> <span data-i18n="choose_bg"></span></button></div>
          </div>
          <div class="stack">
            <strong id="hSize" data-i18n="size_label"></strong>
            <div class="br-chips" id="sizeChips" role="group" aria-labelledby="hSize">
              <button class="chip" type="button" data-size="orig" data-i18n="size_orig"></button>
              <button class="chip" type="button" data-size="dp" data-i18n="size_dp"></button>
              <button class="chip" type="button" data-size="product" data-i18n="size_product"></button>
            </div>
            <p class="small muted mb0" id="sizeNote"></p>
          </div>
          <div class="br-dl">
            <button class="btn btn-primary" id="dlPng" type="button"><span aria-hidden="true">⬇️</span> <span data-i18n="dl_png"></span></button>
            <button class="btn" id="dlJpg" type="button"><span aria-hidden="true">⬇️</span> <span data-i18n="dl_jpg"></span></button>
          </div>
          <p class="small muted mb0" data-i18n="png_hint"></p>
          <p class="callout small mb0"><span data-i18n="resize_hint"></span> <a href="../../../apps/background-remover/../form-photo-resizer/index.html" data-i18n="resize_link"></a></p>
        </section>
      </div>

      <div class="br-col">
        <!-- 2. result + touch-up -->
        <section class="card stack" id="resultCard" aria-labelledby="hResult" data-state="empty">
          <h2 class="br-step" id="hResult" data-i18n="step_result"></h2>
          <div class="br-stage" id="stage">
            <div class="br-empty" id="emptyBox"><span class="br-empty-ic" aria-hidden="true">✂️</span><span data-i18n="empty_stage"></span></div>
            <canvas id="view" width="10" height="10" role="img" data-i18n-aria-label="preview_label" hidden></canvas>
            <div class="br-busy" id="busyOverlay" hidden><span id="busyText"></span></div>
          </div>
          <div class="br-info" id="infoRow"></div>
          <p class="callout warning small mb0" id="nothingNote" data-i18n="nothing_found" hidden></p>
          <div class="stack" id="toolsBox" hidden>
            <div class="br-chips" id="toolChips" role="group" data-i18n-aria-label="tools_label">
              <button class="chip" type="button" data-tool="compare"><span aria-hidden="true">↔️</span> <span data-i18n="tool_compare"></span></button>
              <button class="chip" type="button" data-tool="erase"><span aria-hidden="true">🧽</span> <span data-i18n="tool_erase"></span></button>
              <button class="chip" type="button" data-tool="restore"><span aria-hidden="true">🖌️</span> <span data-i18n="tool_restore"></span></button>
            </div>
            <!-- always left-to-right, like the picture: "before" is on the left of the photo in every language -->
            <div class="br-cmp" id="cmpRow" dir="ltr">
              <span class="tiny" data-i18n="before"></span>
              <input type="range" id="cmpRange" min="0" max="100" step="1" dir="ltr" data-i18n-aria-label="compare_label">
              <span class="tiny" data-i18n="after"></span>
            </div>
            <label class="br-range" id="brushRow" hidden><span class="lbl" data-i18n="brush_size"></span><input type="range" id="brushSize" min="4" max="80" step="1"></label>
            <div class="br-tools">
              <button class="btn btn-sm" id="undoBtn" type="button" disabled><span aria-hidden="true">↶</span> <span data-i18n="undo"></span></button>
              <button class="btn btn-sm btn-ghost" id="undoAllBtn" type="button" disabled data-i18n="undo_all"></button>
            </div>
            <p class="small muted mb0" id="toolHint"></p>
          </div>
        </section>
      </div>
    </div>

    <details class="card br-help no-print" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="inside_title"></h3>
      <p data-i18n="inside_body"></p>
      <p class="mb0" data-i18n="inside_models"></p>
      <div class="br-storage">
        <span class="small muted" id="storageText"></span>
        <button class="btn btn-sm btn-danger" id="storageClear" type="button" data-i18n="storage_clear" hidden></button>
      </div>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/background-remover/../../shared/edu.js"></script>
  <script src="../../../apps/background-remover/strings.js"></script>
  <script src="../../../apps/background-remover/samples.js"></script>
  <script src="../../../apps/background-remover/app.js"></script>
</body>
</html>
