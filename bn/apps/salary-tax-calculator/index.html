  <main id="app">

            <span class="prev" id="ctcPrev" aria-live="polite"></span>
          </label>
          <label class="stx-f" id="fHike" hidden>
            <span class="lbl" data-i18n="hike_pct"></span>
            <input type="number" id="hike" class="big" data-k="hike" min="-90" max="1000" step="0.5" inputmode="decimal">
            <span class="prev" id="hikePrev" aria-live="polite"></span>
          </label>
          <label class="stx-f" id="fTarget" hidden>
            <span class="lbl" data-i18n="target"></span>
            <input type="text" id="target" class="big" data-k="target" inputmode="decimal" autocomplete="off" data-i18n-placeholder="target_ph">
            <span class="prev" id="targetPrev" aria-live="polite"></span>
          </label>
          <label class="stx-f">
            <span class="lbl" data-i18n="bonus"></span>
            <input type="text" id="bonus" data-k="bonus" inputmode="decimal" autocomplete="off" data-i18n-placeholder="bonus_ph">
            <span class="hint" data-i18n="bonus_hint"></span>
            <span class="prev" id="bonusPrev" aria-live="polite"></span>
          </label>

            <span class="lbl" id="regLbl" data-i18n="regime"></span>

              <button type="button" id="regOld" data-regime="old" data-i18n="reg_old"></button>
            </div>
            <span class="hint" data-i18n="regime_hint"></span>
          </div>
          <label class="stx-f">
            <span class="lbl" data-i18n="age"></span>
            <select id="age" data-k="age">

              <option value="age60" data-i18n="age_60"></option>
              <option value="age80" data-i18n="age_80"></option>
            </select>
          </label>
        </div>

        <div class="grp">

                <button type="button" data-basic="50">50%</button>
              </div>
            </div>
            <span class="hint" data-i18n="basic_hint"></span>
          </div>

            <span class="lbl" id="cityLbl" data-i18n="city"></span>

            <label class="stx-f">

            <label class="stx-f">
              <span class="lbl" data-i18n="nps"></span>
              <input type="number" id="nps" data-k="nps" min="0" max="14" step="1" inputmode="decimal">

              <option value="full" data-i18n="pf_full"></option>
              <option value="cap" data-rk="pf_cap"></option>
              <option value="none" data-i18n="pf_none"></option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="grat" data-k="grat"> <span data-rk="grat"></span></label>
          <div class="two">
            <label class="stx-f">
              <span class="lbl" data-i18n="state"></span>
              <select id="state" data-k="state"></select>
            </label>
            <label class="stx-f">
              <span class="lbl" data-i18n="pt"></span>
              <input type="text" id="pt" data-k="pt" inputmode="numeric" autocomplete="off">

          <p class="hint" id="ptHint" data-i18n="pt_hint"></p>

                  <input type="text" id="d80s" data-k="d80s" inputmode="decimal" autocomplete="off">

                  <span class="lbl" data-i18n="d80p"></span>
                  <input type="text" id="d80p" data-k="d80p" inputmode="decimal" autocomplete="off">
                </label>
              </div>
              <label class="check"><input type="checkbox" id="par60" data-k="par60"> <span data-i18n="par60"></span></label>
              <label class="stx-f">
                <span class="lbl" data-rk="ccd"></span>
                <input type="text" id="ccd" data-k="ccd" inputmode="decimal" autocomplete="off">
              </label>
              <label class="stx-f">
                <span class="lbl" data-rk="hl"></span>
                <input type="text" id="hl" data-k="hl" inputmode="decimal" autocomplete="off">
