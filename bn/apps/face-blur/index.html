    .fb-privacy { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }

      .fb-grid { grid-template-columns: minmax(0, 1fr); }
      .fb-grid:not(.active) > .fb-col:first-child { display: none; }   /* phones: no empty photo card before a photo is chosen */

    .fb-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .fb-step { font-size: 1.15rem; margin: 0; }
    .fb-hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; inset-inline-start: -9999px; }

    .fb-drop {
      border: 2px dashed color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius: var(--radius); padding: 20px 16px;
      text-align: center; background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: background .12s, border-color .12s;
    }
    .fb-drop:hover, .fb-drop.over { border-color: var(--primary); background: var(--primary-soft); }
    .fb-drop:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .fb-drop-ic { font-size: 2rem; line-height: 1.1; }
    .fb-add { display: flex; flex-wrap: wrap; gap: 8px; }
    .fb-add .btn { flex: 1 1 auto; }

    /* editor */
    .fb-empty { display: flex; gap: 12px; align-items: center; justify-content: center; flex-direction: column; text-align: center;
      min-height: 220px; padding: 16px; border: 2px dashed var(--border); border-radius: var(--radius-sm); color: var(--muted); }
    .fb-empty .ic { font-size: 2.6rem; opacity: .7; line-height: 1; }
    .fb-stage { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px; display: flex; justify-content: center; }
    .fb-wrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
    #view { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; border-radius: 4px; box-shadow: var(--shadow); background: #fff; }
    .fb-layer { position: absolute; inset: 0; }
    .fb-layer.draw { cursor: crosshair; touch-action: none; }
    .fb-layer.draw .fb-box { pointer-events: none; }
    .fb-box {
      position: absolute; padding: 0; margin: 0; background: transparent; cursor: pointer; border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); line-height: 1;
    }
    .fb-box::before { content: ''; position: absolute; inset: -6px; }
    .fb-box[aria-pressed="false"] { border: 2px dashed #ffb020; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); background: rgba(255, 176, 32, .12); }
    .fb-box.manual { border-color: #7fd8ff; }
    .fb-box.manual[aria-pressed="false"] { border-color: #ffb020; }
    .fb-box:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .fb-box .no { position: absolute; top: -9px; left: -9px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;

    .fb-box[aria-pressed="false"] .no { background: #b26b00; }
    .fb-layer.orig .fb-box, .fb-layer.nolabels .fb-box .no { display: none; }
    .fb-stage:fullscreen { background: #111; border: 0; border-radius: 0; align-items: center; }
    .fb-stage:fullscreen #view { max-height: 100vh; }
    .fb-stage:-webkit-full-screen { background: #111; align-items: center; }
    @media (max-width: 600px) {
      .fb-stage { padding: 4px; }

    .fb-rubber { position: absolute; border: 2px dashed #7fd8ff; background: rgba(127, 216, 255, .18); pointer-events: none; }

    }
    @keyframes fb-slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success fb-privacy">
      <span class="ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <div class="fb-grid" id="grid">
      <div class="fb-col">
        <section class="card stack" aria-labelledby="hEdit">
          <div class="row spread">
            <h2 class="fb-step" id="hEdit" data-i18n="step_edit"></h2>
            <div class="fb-counts" id="counts" aria-live="polite"></div>
          </div>
          <div class="fb-empty" id="emptyBox">
            <span class="ic" aria-hidden="true">🖼️</span>
            <span data-i18n="empty_edit"></span>
          </div>
          <div id="editor" class="stack" hidden>
            <div class="fb-stage" id="stage">
              <div class="fb-wrap" id="wrap" dir="ltr">
                <canvas id="view" width="10" height="10" role="img" data-i18n-aria-label="photo_label"></canvas>
                <div class="fb-layer" id="layer"></div>
              </div>
            </div>
            <p class="small muted mb0" id="hint"></p>
            <div class="fb-tools" role="toolbar" data-i18n-aria-label="step_edit">
              <button class="btn" id="drawBtn" type="button" aria-pressed="false"><span aria-hidden="true">✏️</span> <span data-i18n="draw_box"></span></button>
              <button class="btn" id="fsBtn" type="button"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
              <button class="btn" id="origBtn" type="button" aria-pressed="false"><span aria-hidden="true">👁️</span> <span data-i18n="show_original"></span></button>
              <button class="btn" id="hideAll" type="button" data-i18n="hide_all"></button>
              <button class="btn" id="showAll" type="button" data-i18n="show_all"></button>
              <button class="btn" id="undoBtn" type="button"><span aria-hidden="true">↶</span> <span data-i18n="undo_box"></span></button>
              <button class="btn btn-ghost" id="clearMine" type="button" data-i18n="clear_mine"></button>
            </div>
            <div class="fb-tools">
              <button class="btn btn-primary" id="findBtn" type="button"><span aria-hidden="true">🔍</span> <span data-i18n="find_faces"></span></button>
              <button class="btn" id="harderBtn" type="button"><span aria-hidden="true">🔎</span> <span data-i18n="look_harder"></span></button>
              <button class="btn btn-danger" id="stopBtn" type="button" data-i18n="stop" hidden></button>
            </div>
            <div class="fb-status" id="statusBox" hidden>
              <span id="stText" aria-live="polite"></span>
              <div class="progress" id="stBarWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="stText"><span id="stBar" style="width:0%"></span></div>
            </div>
            <div class="callout danger stack" id="errBox" role="alert" hidden>
              <p class="mb0" id="errText"></p>
              <div><button class="btn btn-sm" id="retryBtn" type="button" data-i18n="try_again"></button></div>
            </div>
          </div>
        </section>
      </div>

      <div class="fb-col">
        <section class="card stack" aria-labelledby="hPick">
          <h2 class="fb-step" id="hPick" data-i18n="step_pick"></h2>
          <div class="fb-drop" id="drop" tabindex="0" role="button" aria-describedby="dropHint">
            <span class="fb-drop-ic" aria-hidden="true">📷</span>
            <strong data-i18n="drop_title"></strong>
            <span class="small muted" id="dropHint" data-i18n="drop_hint"></span>
          </div>
          <div class="fb-add">
            <button class="btn btn-primary" id="pickBtn" type="button"><span aria-hidden="true">📂</span> <span data-i18n="choose_photo"></span></button>
            <button class="btn" id="sampleBtn" type="button"><span aria-hidden="true">👧</span> <span data-i18n="try_sample"></span></button>
          </div>
          <input type="file" id="fileInput" class="fb-hidden-input" accept="image/jpeg,image/png,image/webp,image/*" tabindex="-1" aria-hidden="true">
          <p class="small muted mb0" id="modelNote"></p>
        </section>

        <section class="card stack" aria-labelledby="hStyle">
          <h2 class="fb-step" id="hStyle" data-i18n="step_style"></h2>
          <div class="fb-seg" id="styles" role="group" aria-labelledby="hStyle"></div>
          <label class="fb-range"><span id="strengthLabel"></span><input type="range" id="strength" min="1" max="10" step="1"></label>
          <label class="check small"><input type="checkbox" id="optNumbers"> <span data-i18n="opt_numbers"></span></label>
        </section>

        <section class="card stack" id="locCard" aria-labelledby="hLoc" hidden>
          <h2 class="fb-step" id="hLoc" data-i18n="step_loc"></h2>
          <div class="fb-loc" id="locBox" aria-live="polite"></div>
        </section>

        <section class="card stack" id="saveCard" aria-labelledby="hSave" hidden>
          <h2 class="fb-step" id="hSave" data-i18n="step_save"></h2>
          <p class="callout warning small mb0" data-i18n="check_before"></p>
          <div class="fb-save">
            <button class="btn btn-primary" id="saveJpg" type="button"><span aria-hidden="true">⬇️</span> <span data-i18n="save_jpg"></span></button>
            <button class="btn" id="savePng" type="button"><span aria-hidden="true">⬇️</span> <span data-i18n="save_png"></span></button>
            <button class="btn btn-wa" id="shareBtn" type="button" hidden><span aria-hidden="true">📤</span> <span data-i18n="share"></span></button>
          </div>
          <p class="small mb0" id="saveMsg" aria-live="polite"></p>
        </section>
      </div>
    </div>

    <details class="card fb-help no-print" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 data-i18n="dpdp_title"></h3>
      <p data-i18n="dpdp_body"></p>
      <h3 data-i18n="inside_title"></h3>
      <p id="insideBody"></p>
      <div class="callout warning small" style="margin-top:12px">
        <strong data-i18n="honest_title"></strong>
        <ul class="fb-honest">
          <li><span aria-hidden="true">✅</span><span data-i18n="honest_good"></span></li>
          <li><span aria-hidden="true">⚠️</span><span data-i18n="honest_bad"></span></li>
        </ul>
      </div>
      <p class="tiny muted fb-credit" style="margin-top:12px" data-i18n="sample_credit"></p>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/face-blur/../../shared/edu.js"></script>
  <script src="../../../apps/face-blur/strings.js"></script>
  <script src="../../../apps/face-blur/sample.js"></script>
  <script src="../../../apps/face-blur/app.js"></script>
