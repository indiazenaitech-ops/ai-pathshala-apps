  <style>
    /* ---------- board colours (light + dark) ---------- */
    :root {
      --ld-red: #e0352b; --ld-green: #1c9b4c; --ld-yellow: #f2c000; --ld-blue: #2468d0;
      --ld-red-soft: #fbd3cf; --ld-green-soft: #cdeedb; --ld-yellow-soft: #fcefb4; --ld-blue-soft: #d3e2fa;
      --ld-ink0: #ffffff; --ld-ink1: #ffffff; --ld-ink2: #4a3800; --ld-ink3: #ffffff;
      --ld-board: #ffffff; --ld-cell: #ffffff; --ld-line: #8f9ca2; --ld-yardin: #ffffff;
      --ld-star: #6f7c84; --ld-star-fill: #e9edef; --ld-tokline: #1a1d1f; --ld-ring: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ld-red: #ef5b52; --ld-green: #38b866; --ld-yellow: #f4c935; --ld-blue: #4f8fec;
        --ld-red-soft: #4a2321; --ld-green-soft: #183d28; --ld-yellow-soft: #44391a; --ld-blue-soft: #1d3150;
        --ld-ink2: #3a2c00;
        --ld-board: #13222a; --ld-cell: #1c2e36; --ld-line: #4b6670; --ld-yardin: #172930;
        --ld-star: #a9bcc3; --ld-star-fill: #263c45; --ld-tokline: #05090b; --ld-ring: #ffffff;
      }
    }
    :root[data-theme="dark"] {
      --ld-red: #ef5b52; --ld-green: #38b866; --ld-yellow: #f4c935; --ld-blue: #4f8fec;
      --ld-red-soft: #4a2321; --ld-green-soft: #183d28; --ld-yellow-soft: #44391a; --ld-blue-soft: #1d3150;
      --ld-ink2: #3a2c00;
      --ld-board: #13222a; --ld-cell: #1c2e36; --ld-line: #4b6670; --ld-yardin: #172930;
      --ld-star: #a9bcc3; --ld-star-fill: #263c45; --ld-tokline: #05090b; --ld-ring: #ffffff;
    }

    /* ---------- layout: phone = board, then dice; laptop = board | side panel ---------- */
    .ld-game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; --pc: var(--ld-red); }
    @media (min-width: 900px) { .ld-game { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); } }
    .ld-boardwrap { width: 100%; max-width: max(320px, calc(100vh - 150px)); margin-inline: auto; position: relative; }
    #board { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; touch-action: manipulation; user-select: none; -webkit-user-select: none;
      border-radius: 12px; box-shadow: var(--shadow); background: var(--ld-board); -webkit-tap-highlight-color: transparent; }
    .ld-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .ld-side .card { padding: 12px 14px; }
    .ld-side h2 { font-size: 1rem; margin: 0 0 8px; }

    /* ---------- board drawing ---------- */
    .b-bg { fill: var(--ld-board); }
    .cell { fill: var(--ld-cell); stroke: var(--ld-line); stroke-width: .04; }
    .f0 { fill: var(--ld-red); } .f1 { fill: var(--ld-green); } .f2 { fill: var(--ld-yellow); } .f3 { fill: var(--ld-blue); }
    .ink0 { fill: var(--ld-ink0); } .ink1 { fill: var(--ld-ink1); } .ink2 { fill: var(--ld-ink2); } .ink3 { fill: var(--ld-ink3); }
    .b-yardin { fill: var(--ld-yardin); }
    .spot { stroke-width: .07; }
    .s0 { fill: var(--ld-red-soft); stroke: var(--ld-red); } .s1 { fill: var(--ld-green-soft); stroke: var(--ld-green); }
    .s2 { fill: var(--ld-yellow-soft); stroke: var(--ld-yellow); } .s3 { fill: var(--ld-blue-soft); stroke: var(--ld-blue); }
    .b-mark { opacity: .9; }
    .b-star { fill: var(--ld-star-fill); stroke: var(--ld-star); stroke-width: .05; stroke-linejoin: round; }
    .b-tri { stroke: var(--ld-line); stroke-width: .04; stroke-linejoin: round; }
    .b-frame { fill: none; stroke: var(--ld-line); stroke-width: .08; }
    .dest { fill: none; stroke: var(--ld-ring); stroke-width: .1; stroke-dasharray: .22 .12; pointer-events: none; }

    /* ---------- tokens ---------- */
    .tok { outline: none; }
    .tok-hit { fill: transparent; pointer-events: none; }
    .tok-sh { fill: rgba(0, 0, 0, .28); }
    .tok-out { fill: var(--ld-tokline); }
    .tok-rim { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: .05; }
    .tok-ring { display: none; fill: none; stroke: var(--ld-ring); stroke-width: .1; transform-box: fill-box; transform-origin: center; }
    .tok.can { cursor: pointer; }
    .tok.can .tok-hit { pointer-events: all; }
    .tok.can .tok-ring { display: inline; animation: ld-pulse .85s ease-in-out infinite alternate; }
    .tok:focus-visible .tok-ring { display: inline; stroke: var(--accent); stroke-width: .16; }
    .tok-badge { display: none; }
    .tok.badge .tok-badge { display: inline; }
    .tok-badge circle { fill: var(--ld-tokline); stroke: #fff; stroke-width: .04; }
    .tok-badge text { fill: #fff; font-size: .27px; font-weight: 800; text-anchor: middle; font-family: "Noto Sans", system-ui, sans-serif; }
    @keyframes ld-pulse { from { opacity: .4; transform: scale(.9); } to { opacity: 1; transform: scale(1.08); } }

    /* ---------- turn card + dice ---------- */
    .ld-turn { display: flex; align-items: center; gap: 14px; border-inline-start: 6px solid var(--pc);
      background: color-mix(in srgb, var(--pc) 10%, var(--surface)); }
    .ld-dice { flex: none; width: 92px; height: 92px; padding: 6px; border-radius: 22px; border: 4px solid var(--pc);
      background: var(--surface); cursor: pointer; box-shadow: var(--shadow); display: grid; place-items: center; touch-action: manipulation; }
    .ld-dice:disabled { cursor: default; box-shadow: none; }
    .ld-dice:disabled .ld-die { opacity: .72; }
    .ld-dice.ready { animation: ld-glow 1s ease-in-out infinite alternate; }
    .ld-dice.rolling .ld-die { animation: ld-tumble .5s ease-out; }
    .ld-die { width: 100%; height: 100%; display: block; }
    .die-bg { fill: #ffffff; stroke: #2b2b2b; stroke-width: 3; }
    .pip { fill: #1b1b1b; }
    .ld-die.red .pip { fill: #c8102e; }
    @keyframes ld-glow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc) 55%, transparent); } to { box-shadow: 0 0 0 9px color-mix(in srgb, var(--pc) 0%, transparent); } }
    @keyframes ld-tumble { 0% { transform: rotate(0) scale(1); } 30% { transform: rotate(-24deg) scale(.86); } 65% { transform: rotate(18deg) scale(1.06); } 100% { transform: rotate(0) scale(1); } }
    .ld-msg { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .ld-msg strong { font-size: 1.12rem; line-height: 1.3; overflow-wrap: anywhere; }
    .ld-msg .sub { font-weight: 600; overflow-wrap: anywhere; }
    .ld-msg .sub:empty { display: none; }
    :root[lang="ur"] .ld-msg strong { line-height: 1.9; }

    /* ---------- players ---------- */
    .ld-plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .ld-p { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 6px 10px;
      border-radius: 10px; border: 2px solid transparent; background: var(--surface-2); }
    .ld-p.now { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, var(--surface)); }
    .ld-p.done { opacity: .9; }
    .ld-pinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    .ld-pn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ld-pt { font-size: .8rem; color: var(--muted); }
    .ld-ph, .ld-place { font-weight: 700; font-size: .9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ld-p .progress { grid-column: 1 / -1; height: 6px; }
    .ld-p .progress > span { background: var(--pc); }
    :root[lang="ur"] .ld-pinfo { line-height: 1.8; }
    .ld-chip { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; }
    .ld-chip svg { width: 28px; height: 28px; display: block; }
    .ld-chip.sm, .ld-chip.sm svg { width: 18px; height: 18px; }

    /* ---------- tools, rules, log, stats ---------- */
    .ld-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .ld-tools .btn { min-height: 42px; }
    .ld-tools .btn[aria-pressed="false"] { color: var(--muted); }
    .ld-keys { margin: 0; }
    .ld-rules ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    .ld-rules li { display: flex; gap: 6px; align-items: baseline; }
    .ld-rules li::before { content: "✓"; color: var(--success); font-weight: 800; }
    .ld-rules p { margin: 8px 0 0; }
    .ld-log ol { list-style: none; margin: 0; padding: 0; max-height: 188px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    .ld-log li { display: flex; gap: 8px; align-items: center; }
    .ld-log li:first-child { font-weight: 700; }
    .ld-stats summary, .help summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 700; }
    .ld-bars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 120px; position: relative; padding-top: 18px; direction: ltr; }
    .ld-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 2px; min-width: 0; }
    .ld-bar i { display: block; width: 100%; max-width: 38px; border-radius: 6px 6px 0 0; background: var(--primary); min-height: 2px; }
    .ld-bar.six i { background: var(--accent); }
    .ld-bar b { font-size: .8rem; font-variant-numeric: tabular-nums; }
    .ld-bar span { font-weight: 800; }
    .ld-exp { position: absolute; inset-inline: 0; border-top: 2px dashed var(--muted); pointer-events: none; }
    .ld-stats summary, .help summary { list-style: none; gap: 8px; }
    .ld-stats summary::-webkit-details-marker, .help summary::-webkit-details-marker { display: none; }
    .ld-stats summary::after, .help summary::after { content: "▾"; margin-inline-start: auto; color: var(--muted); transition: transform .2s; }
    .ld-stats[open] > summary::after, .help[open] > summary::after { transform: rotate(180deg); }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }

    /* ---------- dialogs ---------- */
    .ld-dlg { border: 0; border-radius: var(--radius); padding: 0; width: min(580px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); overflow: auto; overscroll-behavior: contain; }
    .ld-dlg::backdrop { background: rgba(5, 15, 20, .6); }
    .ld-dlg.ld-fallback { position: fixed; inset: 0; margin: auto; z-index: 1000; overflow: auto; height: fit-content; }
    .ld-dlg-in { padding: 16px 18px 18px; }
    .ld-dlg h2 { font-size: 1.3rem; }
    .ld-fs { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px 12px; margin: 0; min-width: 0; }
    .ld-fs legend { font-weight: 700; padding-inline: 4px; }
    .ld-presets { gap: 6px; }
    .ld-presets .btn { min-height: 40px; }
    .ld-seat { display: grid; grid-template-columns: 30px minmax(0, 1.1fr) minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 8px; }
    .ld-seat select, .ld-seat input { width: 100%; min-width: 0; }
    .ld-seat.off input { opacity: .55; }
    @media (max-width: 480px) {
      .ld-seat { grid-template-columns: 30px minmax(0, 1fr); }
      .ld-seat input { grid-column: 2; }
      .ld-seat + .ld-seat { border-top: 1px solid var(--border); padding-top: 8px; }
    }
    .ld-rulechecks { display: grid; gap: 4px 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
    .ld-rulechecks .check { min-height: 40px; align-items: center; line-height: 1.3; }
    .ld-rulechecks .check input { flex: none; }
    .ld-dlg-actions { justify-content: flex-start; }
    .ld-win { font-size: 1.5rem; font-weight: 800; margin: 0; }
    .ld-places { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .ld-places li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
    .ld-places .md { font-size: 1.4rem; width: 1.6em; text-align: center; }
    .ld-places .nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .ld-places .pl { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    :root[lang="ur"] .ld-places li, :root[lang="ur"] .ld-win { line-height: 1.9; }
    .ld-dlg h3 { font-size: 1.05rem; margin: 6px 0 0; }

    /* ---------- full screen (projector / smartboard) ---------- */
    #game:fullscreen { background: var(--bg); padding: 2vh 2vw; overflow: auto; align-content: center; justify-content: center;
      grid-template-columns: auto minmax(300px, 420px); width: 100vw; height: 100vh; max-width: none; }
    #game:fullscreen .ld-boardwrap { width: min(96vh, calc(100vw - 480px)); max-width: none; }
    #game:fullscreen .ld-dice { width: 132px; height: 132px; border-width: 6px; border-radius: 28px; }
    #game:fullscreen .ld-msg strong { font-size: 1.55rem; }
    #game:fullscreen .ld-msg .sub { font-size: 1.15rem; }
    #game:fullscreen .ld-p { padding: 8px 12px; font-size: 1.1rem; }
    #game:fullscreen .ld-rules, #game:fullscreen .ld-stats { display: none; }
    @media (orientation: portrait) {
      #game:fullscreen { grid-template-columns: minmax(0, 1fr); align-content: start; }
      #game:fullscreen .ld-boardwrap { width: min(100%, 62vh); }
    }

    @media print {
      .ld-side, .help, .edu-intro { display: none !important; }
      .ld-game { display: block; }
      .ld-boardwrap { width: 17cm; max-width: 100%; }
      #board { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .tok-ring, .tok-badge, .dest { display: none !important; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section id="game" class="ld-game" data-phase="roll">
      <div class="ld-boardwrap">
        <svg id="board" viewBox="0 0 15 15" role="group" data-i18n-aria-label="board_label">
          <g id="bgLayer"></g>
          <g id="hlLayer"></g>
          <g id="tokLayer"></g>
        </svg>
      </div>

      <div class="ld-side">
        <div class="card ld-turn" id="turnCard">
          <button type="button" class="ld-dice" id="rollBtn" data-i18n-aria-label="roll_aria" data-i18n-title="roll_aria">
            <svg class="ld-die" id="die" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <rect class="die-bg" x="5" y="5" width="90" height="90" rx="20"/>
              <circle class="pip" data-pip="tl" cx="29" cy="29" r="9"/>
              <circle class="pip" data-pip="tr" cx="71" cy="29" r="9"/>
              <circle class="pip" data-pip="ml" cx="29" cy="50" r="9"/>
              <circle class="pip" data-pip="c" cx="50" cy="50" r="9"/>
              <circle class="pip" data-pip="mr" cx="71" cy="50" r="9"/>
              <circle class="pip" data-pip="bl" cx="29" cy="71" r="9"/>
              <circle class="pip" data-pip="br" cx="71" cy="71" r="9"/>
            </svg>
          </button>
          <div class="ld-msg" role="status" aria-live="polite" aria-atomic="true">
            <strong id="msgMain"></strong>
            <span class="sub small" id="msgSub"></span>
            <span class="tiny muted" id="rollHint" data-i18n="roll_hint"></span>
          </div>
        </div>

        <div class="card">
          <h2 data-i18n="players_title"></h2>
          <ol class="ld-plist" id="players"></ol>
        </div>

        <div class="ld-tools">
          <button type="button" class="btn btn-primary" id="newBtn"><span aria-hidden="true">＋</span><span data-i18n="new_game"></span></button>
          <button type="button" class="btn" id="resultsBtn" hidden><span aria-hidden="true">🏆</span><span data-i18n="results_title"></span></button>
          <button type="button" class="btn" id="soundBtn" aria-pressed="false"><span aria-hidden="true" id="soundIc">🔇</span><span data-i18n="sound"></span></button>
          <button type="button" class="btn" id="autoBtn" aria-pressed="true" data-i18n-title="auto_title"><span aria-hidden="true">⚡</span><span data-i18n="auto_move"></span></button>
          <button type="button" class="btn" id="fsBtn"><span aria-hidden="true">⛶</span><span data-i18n="fullscreen"></span></button>
        </div>
        <p class="tiny muted ld-keys"><span data-i18n="keys_hint"></span> · <span aria-hidden="true">🔒 </span><span data-i18n="saved_local"></span></p>

        <div class="card ld-rules">
          <h2 data-i18n="rules_title"></h2>
          <ul id="rulesList"></ul>
          <p class="tiny muted" data-i18n="rules_variant"></p>
        </div>

        <div class="card ld-log">
          <h2 data-i18n="log_title"></h2>
          <ol id="log"></ol>
        </div>

        <details class="card ld-stats" id="statsBox">
          <summary data-i18n="stats_title"></summary>
          <div class="ld-bars" id="sideBars"></div>
          <p class="small mb0" id="sideStats"></p>
        </details>
      </div>
    </section>

    <details class="card help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <dialog class="ld-dlg" id="setupDlg" aria-labelledby="setupTitle">
      <div class="ld-dlg-in stack">
        <div class="row spread nowrap">
          <h2 class="mb0" id="setupTitle" data-i18n="setup_title"></h2>
          <button type="button" class="edu-iconbtn" id="setupX" data-i18n-aria-label="close">✕</button>
        </div>
        <div class="row ld-presets" id="presets">
          <button type="button" class="btn btn-sm" data-preset="cpu" data-i18n="preset_cpu"></button>
          <button type="button" class="btn btn-sm" data-preset="2"></button>
          <button type="button" class="btn btn-sm" data-preset="3"></button>
          <button type="button" class="btn btn-sm" data-preset="4"></button>
        </div>
        <fieldset class="ld-fs">
          <legend data-i18n="seats_title"></legend>
          <div id="seatRows"></div>
          <p class="small mb0" id="seatInfo" aria-live="polite" style="margin-top:8px"></p>
        </fieldset>
        <fieldset class="ld-fs">
          <legend data-i18n="house_rules"></legend>
          <div class="ld-rulechecks" id="ruleChecks"></div>
          <button type="button" class="btn btn-sm btn-ghost" id="usualRules" style="margin-top:6px"><span aria-hidden="true">↺ </span><span data-i18n="usual_rules"></span></button>
        </fieldset>
        <div class="row ld-dlg-actions">
          <button type="button" class="btn btn-primary btn-lg" id="startBtn"><span aria-hidden="true">🎲</span><span data-i18n="start_game"></span></button>
          <button type="button" class="btn" id="setupCancel" data-i18n="cancel"></button>
        </div>
      </div>
    </dialog>

    <dialog class="ld-dlg" id="resultsDlg" aria-labelledby="resTitle">
      <div class="ld-dlg-in stack">
        <div class="row spread nowrap">
          <h2 class="mb0" id="resTitle" data-i18n="results_title"></h2>
          <button type="button" class="edu-iconbtn" id="resX" data-i18n-aria-label="close">✕</button>
        </div>
        <p class="ld-win" id="resWin"></p>
        <ol class="ld-places" id="resPlaces"></ol>
        <h3 data-i18n="stats_title"></h3>
        <div class="ld-bars" id="resBars"></div>
        <p class="small" id="resStats"></p>
        <div class="row">
          <button type="button" class="btn btn-primary btn-lg" id="againBtn"><span aria-hidden="true">🔁</span><span data-i18n="play_again"></span></button>
          <button type="button" class="btn" id="resNew" data-i18n="new_game"></button>
        </div>
      </div>
    </dialog>
  </main>
  <script src="../../../apps/ludo/../../shared/edu.js"></script>
  <script src="../../../apps/ludo/strings.js"></script>
  <script src="../../../apps/ludo/engine.js"></script>
  <script src="../../../apps/ludo/app.js"></script>
</body>
</html>
