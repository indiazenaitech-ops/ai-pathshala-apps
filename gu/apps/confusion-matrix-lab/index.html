  <style>
    /* outcome colours (work in light + dark because they reuse theme tokens) */
    :root { --tp: var(--success); --fp: var(--danger); --fn: var(--c2); --tn: var(--c7); }
    .k-tp { --k: var(--tp); } .k-fp { --k: var(--fp); } .k-fn { --k: var(--fn); } .k-tn { --k: var(--tn); }

    .tabs button { min-height: 44px; font-size: 1rem; }
    @media (max-width: 560px) { .tabs button { flex: 1 1 0; white-space: normal; padding: 8px 6px; font-size: .92rem; line-height: 1.25; } }
    .help { margin-top: 16px; }
    .edu-fullscreen-on .edu-intro, .edu-fullscreen-on .help { display: none; }
    .h-sm { font-size: 1.05rem; }
    /* shared .chip buttons fall back to the browser font (Arial); use the app/script font instead */
    .chip { font-family: inherit; }
    .scen-list { gap: 8px; }
    .scen-list .chip { min-height: 42px; }
    @media (max-width: 560px) {
      .scen-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scen-list .chip { justify-content: center; text-align: center; padding: 6px 8px; font-size: .86rem; line-height: 1.25; }
    }
    .lab-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; }
    .lab-head h2 { margin: 0; font-size: 1.3rem; }
    .lab-tools { display: flex; flex-wrap: wrap; gap: 8px; }

    /* dot strip */
    .strip { width: 100%; min-height: 120px; }
    .strip svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; font-family: var(--font); overflow: visible; }
    .strip .region { fill: var(--k); opacity: .1; }
    .strip .lane-sep { stroke: var(--border); stroke-width: 1; }
    .strip .lane-title { fill: var(--text); font-weight: 700; font-size: 13px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
    .strip .tag { fill: var(--k); font-weight: 800; font-size: 12.5px; }
    .strip .dot { fill: var(--k); cursor: pointer; }
    .strip .xmark { stroke: var(--surface); stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
    .strip .sel-ring { fill: none; stroke: var(--text); stroke-width: 2.5; pointer-events: none; }
    .strip .thr-line { stroke: var(--text); stroke-width: 3; }
    .strip .thr-knob { fill: var(--text); }
    .strip .thr-knob-txt { fill: var(--bg); font-weight: 800; font-size: 13px; }
    .strip .axis { stroke: var(--muted); stroke-width: 1; }
    .strip .tick { fill: var(--muted); font-size: 11px; }
    .axis-ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; }
    .axis-ends span { max-width: 48%; }

    .thr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .thr-row label { font-size: 1rem; }
    .thr-ctrl { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; }
    .thr-ctrl input[type="range"] { flex: 1 1 auto; width: auto; min-width: 0; height: 34px; }
    @media (max-width: 560px) { .thr-ctrl { order: 5; flex-basis: 100%; } }
    .thr-val { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 3.4ch; text-align: center; }
    .thr-btn { min-width: 44px; font-size: 1.2rem; }
    .dot-info { min-height: 1.6em; }
    .dot-info .badge { vertical-align: middle; }

    /* layout: strip + matrix side by side on wide screens / smartboards */
    .lab-main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1100px) { .lab-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); } }

    /* confusion matrix */
    .cm { border-collapse: separate; border-spacing: 6px; width: 100%; table-layout: fixed; }
    .cm th { font-size: .86rem; font-weight: 700; color: var(--muted); padding: 4px; text-align: center; vertical-align: bottom; line-height: 1.3; }
    .cm th.rowh { text-align: start; vertical-align: middle; width: 27%; }
    .cm th.corner { width: 27%; text-align: start; font-weight: 600; font-size: .78rem; }
    .cm th .lbl { display: block; color: var(--text); }
    .cm th .sub { display: block; font-weight: 600; color: var(--muted); font-size: .8rem; }
    .cm td.cell { border: 2px solid var(--k); background: color-mix(in srgb, var(--k) 11%, var(--surface)); border-radius: 12px; padding: 8px 10px; vertical-align: top; }
    .cell-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .abbr { font-weight: 800; color: var(--k); font-size: .95rem; letter-spacing: .02em; }
    .cnt { font-size: clamp(1.7rem, 3.4vw, 2.5rem); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .cell-name { font-weight: 700; font-size: .84rem; line-height: 1.3; }
    .cell-mean { font-size: .8rem; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    [dir="rtl"] .flip { display: inline-block; transform: scaleX(-1); }
    .cm-small .cnt { font-size: 1.6rem; }
    .cm th, .cm td.cell { overflow-wrap: break-word; word-break: normal; }
    @media (max-width: 560px) {
      .cm { border-spacing: 4px; }
      .cm { table-layout: auto; }
      .cm th.rowh, .cm th.corner { width: 1%; }
      .cm td.cell, .cm td { width: 49%; overflow-wrap: anywhere; }
      .cm thead th:not(.corner) { overflow-wrap: anywhere; }
      .cm th { font-size: .78rem; padding: 2px; }
      .cm th .sub { font-size: .74rem; }
      .cm th.corner > span { display: none; }
      .cm td.cell { padding: 6px 7px; }
      .cell-mean { font-size: .76rem; }
      .cell-btn { padding: 6px 2px; }
      .cell-btn .cell-name { font-size: .8rem; }
    }
    .cell-btn { width: 100%; min-height: 64px; border: 2px solid var(--k); background: color-mix(in srgb, var(--k) 10%, var(--surface)); color: var(--text); border-radius: 12px; font: inherit; cursor: pointer; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .cell-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--k) 22%, var(--surface)); }
    .cell-btn:disabled { cursor: default; opacity: .55; }
    .cell-btn.is-right { opacity: 1; box-shadow: 0 0 0 3px var(--success); }
    .cell-btn.is-picked { opacity: 1; }
    .cell-btn.is-picked:not(.is-right) { box-shadow: 0 0 0 3px var(--danger); }

    /* metrics */
    .metrics { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 540px) { .metrics { grid-template-columns: minmax(0, 1fr); } }
    @media (min-width: 1100px) { .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .metric { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .metric.focus { border: 2px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .metric h3 { margin: 0; font-size: 1.05rem; }
    .metric .q { font-size: .84rem; color: var(--muted); margin: 0; line-height: 1.4; }
    .metric .mval { font-size: 2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .metric .mval.na { font-size: 1.2rem; color: var(--muted); }
    .formula { font-variant-numeric: tabular-nums; font-size: .9rem; direction: ltr; unicode-bidi: isolate; text-align: start; overflow-wrap: anywhere; line-height: 1.5; }
    .formula.big { font-size: 1rem; font-weight: 700; }
    .plug { color: var(--muted); }

    .which-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 620px) { .which-grid { grid-template-columns: minmax(0, 1fr); } }
    .which-box { border-inline-start: 5px solid var(--k); background: color-mix(in srgb, var(--k) 9%, var(--surface)); border-radius: 10px; padding: 10px 12px; }
    .which-box p { margin: 4px 0 0; }
    .res-badge { color: var(--k); border-color: var(--k); background: color-mix(in srgb, var(--k) 10%, var(--surface)); }
    .items-table td, .items-table th { white-space: nowrap; }
    details > summary { cursor: pointer; font-weight: 700; min-height: 32px; }

    /* learn */
    .cases { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 620px) { .cases { grid-template-columns: minmax(0, 1fr); } }
    .case { border: 2px solid var(--k); border-radius: 12px; padding: 12px; background: color-mix(in srgb, var(--k) 9%, var(--surface)); }
    .case p { margin: 6px 0 0; }
    .case .pr { font-size: .84rem; font-weight: 700; color: var(--muted); }
    .fcards { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 700px) { .fcards { grid-template-columns: minmax(0, 1fr); } }
    .fcard { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface-2); }
    .fcard h3 { margin: 0 0 4px; }
    .fcard p { margin: 4px 0 0; }
    .which-list li { margin-bottom: 8px; }

    /* practice */
    .q-scen { font-weight: 700; margin: 0; }
    .q-text { font-size: 1.15rem; font-weight: 600; margin: 0; }
    #q-cm { max-width: 760px; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .ans-row .field { flex: 0 1 200px; }
    .ans-row input { font-size: 1.2rem; width: 100%; }
    .fb { margin: 0; }
    .fb .formula { display: block; margin-top: 4px; }
    .score-badges { gap: 6px; }
    .score-badges .badge { font-size: .9rem; padding: 4px 10px; }
    .mode-list { gap: 8px; }

    /* Nastaliq needs taller lines */
    :root[lang="ur"] .tabs button { line-height: 1.8; }
    :root[lang="ur"] .chip { line-height: 1.8; padding-block: 4px; }
    :root[lang="ur"] .cm th, :root[lang="ur"] .cell-name, :root[lang="ur"] .cell-mean, :root[lang="ur"] .metric .q, :root[lang="ur"] .case p { line-height: 1.85; }

    #worksheet { display: none; }
    .edu-fullscreen-on .edu-main { max-width: none; }

    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      /* fixed, ink-friendly outcome colours (dark-theme tokens are too pale on white paper) */
      :root { --tp: #1b7a3a; --fp: #c0392b; --fn: #c25e00; --tn: #1f5fa8; }
      .tabs, .help, .lab-tools, .thr-row, .scen-list, #learn-actions, #practice-tools, #q-actions, .dot-info { display: none !important; }

      #items-details:not([open]) { display: none; }
      .ws-q { break-inside: avoid; border: 1px solid #999; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
      .ws-q h3 { margin: 0 0 4px; font-size: 1rem; }
      .ws-blanks { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 6px; font-size: .95rem; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs" role="tablist" id="tabs" data-i18n-aria-label="tabs_label">
      <button type="button" role="tab" id="tab-explore" data-tab="explore" aria-controls="panel-explore" data-i18n="tab_explore"></button>
      <button type="button" role="tab" id="tab-learn" data-tab="learn" aria-controls="panel-learn" data-i18n="tab_learn"></button>
      <button type="button" role="tab" id="tab-practice" data-tab="practice" aria-controls="panel-practice" data-i18n="tab_practice"></button>
    </div>

    <!-- ============ THRESHOLD LAB ============ -->
    <section id="panel-explore" role="tabpanel" aria-labelledby="tab-explore" class="stack">
      <div class="card stack" id="scen-card">
        <div>
          <h2 class="h-sm muted" data-i18n="choose_scenario"></h2>
          <div class="row scen-list" id="scen-list" role="group" data-i18n-aria-label="choose_scenario"></div>
        </div>
        <div class="lab-head">
          <div class="grow">
            <h2 id="scen-question"></h2>
            <p class="small muted mb0" id="scen-score"></p>
          </div>
          <div class="lab-tools">
            <button type="button" class="btn btn-sm" id="new-data"><span aria-hidden="true">🔀</span> <span data-i18n="new_data"></span></button>
            <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            <button type="button" class="btn btn-sm btn-danger" id="reset-all" data-i18n="reset"></button>
          </div>
        </div>
      </div>

      <div class="lab-main">
        <div class="card stack" id="lab-card">
          <p class="small mb0" id="data-info"></p>
          <div>
            <div class="strip" id="strip"><svg id="strip-svg" role="img" data-i18n-aria-label="strip_label" xmlns="http://www.w3.org/2000/svg"></svg></div>
            <div class="axis-ends small muted" dir="ltr"><span id="axis-low" dir="auto"></span><span id="axis-high" dir="auto"></span></div>
          </div>
          <div class="thr-row">
            <label for="thr" data-i18n="threshold"></label>
            <output id="thr-val" class="thr-val" for="thr"></output>
            <div class="thr-ctrl" dir="ltr">
              <button type="button" class="btn btn-sm thr-btn" id="thr-down" data-i18n-aria-label="thr_lower" data-i18n-title="thr_lower">−</button>
              <input type="range" id="thr" min="0" max="1" step="0.01" value="0.5">
              <button type="button" class="btn btn-sm thr-btn" id="thr-up" data-i18n-aria-label="thr_higher" data-i18n-title="thr_higher">+</button>
            </div>
            <button type="button" class="btn btn-sm" id="best-f1"><span aria-hidden="true">⭐</span> <span data-i18n="best_f1"></span></button>
          </div>
          <p class="mb0" id="thr-rule"></p>
          <p class="small mb0 dot-info" id="dot-info" aria-live="polite"></p>
          <div class="callout" id="insight" aria-live="polite"></div>
        </div>
        <div class="card stack" id="cm-card">
          <h2 class="mb0" data-i18n="matrix_title"></h2>
          <p class="small muted mb0" data-i18n="matrix_note"></p>
          <div class="scroll-x"><table class="cm" id="cm"></table></div>
          <p class="small muted mb0" id="cm-totals"></p>
        </div>
      </div>

      <div class="card stack" id="metrics-card">
        <h2 class="mb0" data-i18n="metrics_title"></h2>
        <div class="metrics" id="metrics"></div>
      </div>

      <div class="card stack" id="which-card">
        <h2 class="mb0" data-i18n="which_title"></h2>
        <div class="which-grid">
          <div class="which-box k-fp"><b data-i18n="fp_is"></b><p id="which-fp"></p></div>
          <div class="which-box k-fn"><b data-i18n="fn_is"></b><p id="which-fn"></p></div>
        </div>
        <p class="callout accent mb0" id="which-why"></p>
      </div>

      <details class="card" id="items-details">
        <summary id="items-summary"></summary>
        <div class="scroll-x" style="margin-top:10px"><table class="table items-table" id="items-table"></table></div>
      </details>
    </section>

    <!-- ============ LEARN ============ -->
    <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" class="stack" hidden>
      <div class="card stack">
        <h2 class="mb0" data-i18n="learn_h_why"></h2>
        <p class="mb0" data-i18n="learn_why"></p>
        <p class="callout warning small mb0" data-i18n="learn_overfit"></p>
      </div>
      <div class="card stack">
        <h2 class="mb0" data-i18n="learn_h_cases"></h2>
        <p class="mb0" data-i18n="learn_cases_intro"></p>
        <div class="cases" id="learn-cases"></div>
        <p class="callout accent mb0"><b data-i18n="trick_title"></b> <span data-i18n="trick"></span></p>
      </div>
      <div class="card stack">
        <h2 class="mb0" data-i18n="learn_h_matrix"></h2>
        <p class="mb0" data-i18n="learn_matrix"></p>
        <div class="scroll-x"><table class="cm" id="learn-cm"></table></div>
        <p class="callout warning small mb0" data-i18n="learn_swap"></p>
      </div>
      <div class="card stack">
        <h2 class="mb0" data-i18n="learn_h_formulas"></h2>
        <p class="mb0" id="learn-example"></p>
        <div class="fcards" id="learn-formulas"></div>
        <p class="small muted mb0" data-i18n="learn_pct"></p>
      </div>
      <div class="card stack">
        <h2 class="mb0" data-i18n="learn_h_which"></h2>
        <ul class="which-list mb0">
          <li data-i18n="which_fn"></li>
          <li data-i18n="which_fp"></li>
          <li data-i18n="which_both"></li>
          <li data-i18n="which_acc"></li>
        </ul>
      </div>
      <div class="row" id="learn-actions">
        <button type="button" class="btn btn-primary" id="go-lab"><span data-i18n="learn_try"></span> <span class="flip" aria-hidden="true">→</span></button>
        <button type="button" class="btn" id="print-learn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
      </div>
    </section>

    <!-- ============ PRACTICE ============ -->
    <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" class="stack" hidden>
      <div class="card stack">
        <div class="row spread">
          <h2 class="mb0" data-i18n="practice_title"></h2>
          <div class="row score-badges" aria-live="polite"><span class="badge primary" id="score-line"></span><span class="badge" id="streak-line"></span></div>
        </div>
        <div>
          <p class="small muted" style="margin-bottom:6px" data-i18n="ask_label"></p>
          <div class="row mode-list" id="mode-list" role="group" data-i18n-aria-label="ask_label"></div>
        </div>
      </div>
      <div class="card stack" id="q-card">
        <p class="q-scen" id="q-scen"></p>
        <p class="q-text" id="q-text"></p>
        <div class="scroll-x"><table class="cm cm-small" id="q-cm"></table></div>
        <div id="q-answer"></div>
        <div id="q-feedback" aria-live="polite"></div>
        <div class="row" id="q-actions">
          <button type="button" class="btn btn-primary" id="q-next"><span data-i18n="next_q"></span> <span class="flip" aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="row" id="practice-tools">
        <button type="button" class="btn" id="ws-print"><span aria-hidden="true">🖨</span> <span data-i18n="ws_print"></span></button>
        <button type="button" class="btn btn-danger" id="score-reset" data-i18n="reset_score"></button>
      </div>
    </section>

    <details class="card help">
      <summary data-i18n="help_summary"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <div id="worksheet"></div>
  </main>
  <script src="../../../apps/confusion-matrix-lab/../../shared/edu.js"></script>
  <script src="../../../apps/confusion-matrix-lab/strings.js"></script>
  <script src="../../../apps/confusion-matrix-lab/content.js"></script>
  <script src="../../../apps/confusion-matrix-lab/app.js"></script>
</body>
</html>
