  <!-- Python bootstrap: run once after Pyodide loads (output, input(), loop guard, charts). -->
  <script type="text/x-python" id="pp-boot">
import sys, builtins, time, json, traceback, linecache, os, io, warnings
os.environ["MPLBACKEND"] = "Agg"
import _pp

# matplotlib's font has no Indian-script letters. Instead of one red "Glyph ... missing" warning per
# letter, the app shows one friendly note in the student's language (key "mpl_glyph").
_PP_NOTES = set()
_pp_showwarning_orig = warnings.showwarning
def _pp_showwarning(message, category, filename, lineno, file=None, line=None):
    m = str(message)
    if ("Glyph" in m and "missing from" in m) or ("does not support" in m and "natively" in m):
        _PP_NOTES.add("mpl_glyph")
        return
    _pp_showwarning_orig(message, category, filename, lineno, file, line)
warnings.showwarning = _pp_showwarning

class _PPStream:
    encoding = "utf-8"
    errors = "strict"
    def __init__(self, kind):
        self.kind = kind
    def write(self, s):
        s = str(s)
        if s:
            _pp.write(self.kind, s)
        return len(s)
    def writelines(self, lines):
        for s in lines:
            self.write(s)
    def flush(self):
        pass
    def isatty(self):
        return False
    def readable(self):
        return False
    def writable(self):
        return True

_PP_OUT = _PPStream("out")
_PP_ERR = _PPStream("err")
_PP = {"t0": 0.0, "next": 0.0, "limit": 0.0, "n": 0, "why": "", "on": False}
_PP_TOOL = 3
_PP_MON = sys.monitoring

def _pp_ask(prompt):
    # A program that was already stopped (Cancel / loop guard) must not ask again,
    # even when a bare "except:" swallowed the first KeyboardInterrupt.
    if _PP["why"]:
        raise KeyboardInterrupt
    t = time.monotonic()
    ans = _pp.ask(prompt)
    waited = time.monotonic() - t
    _PP["t0"] += waited
    _PP["next"] += waited
    return ans

def _pp_stop(why):
    # Remember the stop and watch loop jumps, so "while True: try: ... except: ..." also ends.
    _PP["why"] = why
    if not _PP["on"]:
        _pp_guard_on(3600)
    raise KeyboardInterrupt

def _pp_input(prompt=""):
    prompt = str(prompt)
    ans = _pp_ask(prompt)
    if prompt:
        _PP_OUT.write(prompt)
    if ans is None:
        _pp.write("in", "\n")
        _pp_stop("cancel")
    ans = str(ans)
    _pp.write("in", ans + "\n")
    return ans

class _PPStdin:
    # sys.stdin for help(), sys.stdin.readline() and "for line in sys.stdin": each line is
    # asked with the same input box; Cancel means end of input.
    encoding = "utf-8"
    errors = "strict"
    closed = False
    def readable(self):
        return True
    def writable(self):
        return False
    def isatty(self):
        return False
    def flush(self):
        pass
    def close(self):
        pass
    def readline(self, size=-1):
        ans = _pp_ask("")
        if ans is None:
            return ""
        ans = str(ans)
        _pp.write("in", ans + "\n")
        return ans + "\n"
    def read(self, size=-1):
        return self.readline()
    def readlines(self, hint=-1):
        return list(self)
    def __iter__(self):
        return self
    def __next__(self):
        line = self.readline()
        if not line:
            raise StopIteration
        return line

_PP_IN = _PPStdin()
sys.stdin = _PP_IN

def _pp_jump(code, offset, dest):
    if code.co_filename != "main.py":
        return _PP_MON.DISABLE
    if _PP["why"]:
        raise KeyboardInterrupt
    _PP["n"] += 1
    if _PP["n"] & 1023:
        return None
    now = time.monotonic()
    if now < _PP["next"]:
        return None
    if _pp.stop_ask(int(now - _PP["t0"])):
        _PP["why"] = "guard"
        raise KeyboardInterrupt
    _PP["limit"] = _PP["limit"] * 2
    _PP["next"] = time.monotonic() + _PP["limit"]
    return None

def _pp_guard_on(secs):
    now = time.monotonic()
    _PP.update(t0=now, next=now + secs, limit=secs, n=0)
    if _PP_MON.get_tool(_PP_TOOL) is None:
        _PP_MON.use_tool_id(_PP_TOOL, "pp-loop-guard")
    _PP_MON.register_callback(_PP_TOOL, _PP_MON.events.JUMP, _pp_jump)
    _PP_MON.set_events(_PP_TOOL, _PP_MON.events.JUMP)
    _PP["on"] = True

def _pp_guard_off():
    if _PP["on"]:
        _PP["on"] = False
        try:
            _PP_MON.set_events(_PP_TOOL, 0)
        except Exception:
            pass

def _pp_only_main(te):
    todo, seen = [te], set()
    while todo:
        x = todo.pop()
        if x is None or id(x) in seen:
            continue
        seen.add(id(x))
        x.stack = traceback.StackSummary.from_list([f for f in x.stack if f.filename == "main.py"])
        todo.append(getattr(x, "__cause__", None))
        todo.append(getattr(x, "__context__", None))

def _pp_report(e):
    te = traceback.TracebackException(type(e), e, e.__traceback__, compact=True)
    _pp_only_main(te)
    _PP_ERR.write("".join(te.format()))
    line = 0
    if isinstance(e, SyntaxError) and e.filename == "main.py" and e.lineno:
        line = e.lineno
    elif te.stack:
        line = te.stack[-1].lineno or 0
    return line

def _pp_show(*args, **kwargs):
    plt = sys.modules.get("matplotlib.pyplot")
    if plt is None:
        return
    import base64
    for num in plt.get_fignums():
        fig = plt.figure(num)
        buf = io.BytesIO()
        with warnings.catch_warnings(record=True) as caught:
            warnings.simplefilter("always")
            fig.savefig(buf, format="png", dpi=110, bbox_inches="tight", facecolor="white")
        for w in caught:
            _pp_showwarning(w.message, w.category, "chart", 0)
        _pp.image(base64.b64encode(buf.getvalue()).decode("ascii"))
    plt.close("all")

def _pp_setup_mpl():
    import matplotlib
    matplotlib.use("Agg")
    old = sys.stderr
    sys.stderr = io.StringIO()
    try:
        import matplotlib.pyplot as plt
    finally:
        sys.stderr = old
    plt.show = _pp_show
    plt.close("all")

def _pp_run(src, guard_secs):
    sys.stdout = _PP_OUT
    sys.stderr = _PP_ERR
    sys.stdin = _PP_IN
    builtins.input = _pp_input
    _PP["why"] = ""
    _PP_NOTES.clear()
    res = {"ok": True, "type": "", "line": 0, "msg": "", "why": ""}
    linecache.cache["main.py"] = (len(src), None, src.splitlines(True), "main.py")
    try:
        code = compile(src, "main.py", "exec")
    except (SyntaxError, ValueError) as e:
        res.update(ok=False, type=type(e).__name__, msg=str(e)[:300], line=_pp_report(e))
        return json.dumps(res)
    g = {"__name__": "__main__", "__builtins__": builtins, "__file__": "main.py"}
    if guard_secs > 0:
        _pp_guard_on(guard_secs)
    try:
        exec(code, g)
    except SystemExit as e:
        _pp_guard_off()
        if isinstance(e.code, str):
            _PP_ERR.write(e.code + "\n")
    except BaseException as e:
        _pp_guard_off()
        res.update(ok=False, type=type(e).__name__, msg=str(e)[:300], line=_pp_report(e), why=_PP["why"])
    finally:
        _pp_guard_off()
        sys.stdout = _PP_OUT
        sys.stderr = _PP_ERR
        sys.stdin = _PP_IN
    try:
        _pp_show()
    except Exception as e:
        _PP_ERR.write("Chart error: " + str(e) + "\n")
    res["notes"] = sorted(_PP_NOTES)
    return json.dumps(res)

# A recursive function calls itself. It needs a base case to stop.
def factorial(n):
    if n == 0 or n == 1:      # base case
        return 1
    return n * factorial(n - 1)

for k in range(0, 8):
    print(f"{k}! = {factorial(k)}")

def fibonacci(n):
    if n <= 1:
        return n
    return fibonacci(n - 1) + fibonacci(n - 2)

print("First 10 Fibonacci numbers:")
print([fibonacci(i) for i in range(10)])

# Sum of digits using recursion
def digit_sum(n):
    if n < 10:
        return n
    return n % 10 + digit_sum(n // 10)

print("Digit sum of 98765 =", digit_sum(98765))

# Stack: Last In, First Out (LIFO) using a list
stack = []

def push(item):
    stack.append(item)
    print("Push", item, "->", stack)

def pop():
    if len(stack) == 0:          # underflow check
        print("Stack is empty (underflow)")
        return None
    item = stack.pop()
    print("Pop ", item, "->", stack)
    return item

def peek():
    if stack:
        return stack[-1]
    return None

push("Book 1")
push("Book 2")
push("Book 3")
print("Top of the stack:", peek())

pop()
pop()
pop()          # one extra pop shows underflow

nums = [34, 7, 23, 32, 5, 62]

# Linear search: check every item one by one
def linear_search(lst, key):
    for i in range(len(lst)):
        if lst[i] == key:
            return i
    return -1

print("Position of 23:", linear_search(nums, 23))
print("Position of 99:", linear_search(nums, 99))

# Bubble sort: swap neighbours that are in the wrong order
def bubble_sort(lst):
    a = lst[:]                 # work on a copy
    n = len(a)
    for i in range(n - 1):
        for j in range(n - 1 - i):
            if a[j] > a[j + 1]:
                a[j], a[j + 1] = a[j + 1], a[j]
        print("After pass", i + 1, ":", a)
    return a

sorted_nums = bubble_sort(nums)

# Binary search: works only on a sorted list
def binary_search(a, key):
    low, high = 0, len(a) - 1
    while low <= high:
        mid = (low + high) // 2
        if a[mid] == key:
            return mid
        elif a[mid] < key:
            low = mid + 1
        else:
            high = mid - 1
    return -1

print("Binary search for 32 ->", binary_search(sorted_nums, 32))
