  <style>
    #app .btn-sm, #app .seg button { min-height: 40px; }
    .rl h2 { font-size: 1.15rem; margin: 0 0 6px; }
    .rl h3 { font-size: 1.02rem; margin: 0; }
    .rl section.card { margin-bottom: 16px; }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
    .bar .field { flex: 0 1 12rem; }
    .bar .push { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .rated-line { font-weight: 700; margin: 4px 0 10px; }

    /* video list */
    .vlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 8px; max-height: 560px; overflow: auto; padding-inline-end: 4px; }
    .vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .vrow.rated { border-color: var(--primary); background: var(--primary-soft); }
    .vicon { font-size: 1.5rem; line-height: 1; width: 1.8rem; text-align: center; flex: none; }
    .vmain { flex: 1 1 12rem; min-width: 0; }
    .vtitle { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .vmeta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; align-items: center; }
    .tag { display: inline-block; padding: 0 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: .76rem; color: var(--text); }
    .stars { display: flex; gap: 0; flex: none; margin-inline-start: auto; }
    .stars button { width: 40px; height: 40px; border: 0; background: none; font-size: 1.45rem; line-height: 1; cursor: pointer; color: var(--border); padding: 0; border-radius: 8px; }
    .stars button.on { color: #f5a623; }
    .stars button:focus-visible { outline: 3px solid var(--primary); }
    .stars button:hover { background: var(--surface-2); }

    /* comparison */
    .cmp { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 980px) { .cmp { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .col { border: 2px solid var(--border); border-radius: 14px; padding: 12px; background: var(--surface); min-width: 0; }
    .col.pop { border-top: 6px solid var(--c3); }
    .col.cb { border-top: 6px solid var(--c1); }
    .col.cf { border-top: 6px solid var(--c2); }
    .col .sub { font-size: .85rem; color: var(--muted); margin: 2px 0 10px; }
    .recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rec { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); }
    .rec-top { display: flex; gap: 8px; align-items: flex-start; }
    .rank { font-weight: 800; min-width: 1.6rem; font-variant-numeric: tabular-nums; }
    .rec .vtitle { font-size: .95rem; }
    .score { font-size: .85rem; font-weight: 700; color: var(--text); }
    .score .muted { font-weight: 400; }
    .tie { display: inline-block; font-size: .72rem; font-weight: 800; padding: 0 6px; border-radius: 6px; background: var(--warning-soft); border: 1px solid var(--warning); margin-inline-start: 4px; }
    .why-btn { margin-top: 6px; min-height: 34px !important; padding: 4px 10px; }
    .why { margin: 8px 0 0; font-size: .86rem; line-height: 1.5; background: var(--surface); border-radius: 8px; padding: 8px; border: 1px dashed var(--border); overflow-wrap: anywhere; }
    .need { font-size: .9rem; }
    .extra { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .extra h4 { margin: 0 0 4px; font-size: .95rem; }
    .profile { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .pchip { padding: 2px 9px; border-radius: 999px; font-size: .82rem; font-weight: 700; border: 1px solid var(--border); background: var(--surface-2); }
    .pchip.pos { border-color: var(--success); background: var(--success-soft); }
    .pchip.neg { border-color: var(--danger); background: var(--danger-soft); }
    .nlist { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .nlist li { display: flex; flex-direction: column; font-size: .88rem; padding: 6px 8px; background: var(--surface-2); border-radius: 8px; }
    .nlist .nm { font-weight: 700; }
    .simbar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 4px; overflow: hidden; }
    .simbar span { display: block; height: 100%; background: var(--c2); }
    .tie-hint { font-size: .82rem; color: var(--muted); margin: 10px 0 0; }
    #cmpCard:fullscreen { overflow: auto; padding: 20px; background: var(--bg); }

    /* filter bubble */
    .bub { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .bub { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
    .now { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--text); color: var(--bg); min-height: 72px; }
    .now .vicon { font-size: 2.2rem; width: 2.6rem; }
    .now .lbl { font-size: .8rem; opacity: .8; font-weight: 700; }
    .now .tag { background: transparent; color: var(--bg); border-color: currentColor; }
    .next { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .next li { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
    .next li.explore { border-style: dashed; border-color: var(--accent); }
    .next .vmain { flex: 1 1 auto; }
    .next .watch { flex: none; white-space: nowrap; }
    html[lang="ur"] .vtitle, html[lang="ur"] .now .vtitle { line-height: 1.75; }
    html[lang="ur"] .why { line-height: 1.9; }
    .meter { height: 18px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin: 6px 0; }
    .meter span { display: block; height: 100%; transition: width .3s; }
    .meter-num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .feed-msg { font-weight: 600; }
    .hist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; font-size: 1.3rem; min-height: 1.6rem; }
    .gbar { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: .82rem; }
    .gbar div { display: flex; align-items: center; gap: 6px; }
    .gbar .gl { width: 5.5rem; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gbar .gb { height: 10px; border-radius: 5px; background: var(--c1); min-width: 2px; }

    /* learn */
    .learn { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
    .learn > div { background: var(--surface-2); border-radius: 12px; padding: 12px; }
    .learn h3 { margin-bottom: 4px; }
    .learn p { margin: 0; font-size: .92rem; }
    details.card summary { cursor: pointer; font-weight: 700; }
    details.card ul, .disc ol { margin: 10px 0 0; padding-inline-start: 1.3em; display: grid; gap: 6px; }
    @media print { .stars, .why-btn, .bar .push, #bubCard, .no-print { display: none !important; } .vlist { max-height: none; } }
  </style>
</head>
<body>
  <main id="app" class="rl">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="callout small"><span data-i18n="fiction_note"></span> 🔒 <span data-i18n="privacy_line"></span></p>

    <!-- 1. rate -->
    <section class="card" id="rateCard">
      <h2 data-i18n="step1"></h2>
      <p class="hint" data-i18n="step1_hint"></p>
      <div class="bar">
        <div class="field"><span data-i18n="rater_label"></span>
          <div class="seg" id="raterSeg">
            <button type="button" data-rater="you" data-i18n="rater_you"></button>
            <button type="button" data-rater="friend" data-i18n="rater_friend"></button>
          </div>
        </div>
        <label class="field"><span data-i18n="filter_label"></span><select id="filterSel"></select></label>
        <label class="check"><input type="checkbox" id="onlyRated"> <span data-i18n="only_rated"></span></label>
        <div class="push">
          <button class="btn btn-sm" id="exampleBtn" type="button" data-i18n="example_btn"></button>
          <button class="btn btn-sm" id="clearBtn" type="button" data-i18n="clear_btn"></button>
        </div>
      </div>
      <p class="small muted" id="friendHint" data-i18n="friend_hint"></p>
      <p class="rated-line" id="ratedLine" aria-live="polite"></p>
      <ul class="vlist" id="vlist"></ul>
    </section>

    <!-- 2. compare -->
    <section class="card" id="cmpCard">
      <div class="row spread">
        <h2 data-i18n="step2"></h2>
        <button class="btn btn-sm no-print" id="fsBtn" type="button">⛶ <span data-i18n="fullscreen"></span></button>
      </div>
      <p class="hint" data-i18n="step2_hint"></p>
      <h3 id="forWho" style="margin-bottom:10px"></h3>
      <div class="cmp" aria-live="polite">
        <div class="col pop" id="colPop">
          <h3>📈 <span data-i18n="rec_pop"></span></h3><p class="sub" data-i18n="rec_pop_sub"></p>
          <ol class="recs" id="recPop"></ol>
        </div>
        <div class="col cb" id="colCb">
          <h3>🏷️ <span data-i18n="rec_content"></span></h3><p class="sub" data-i18n="rec_content_sub"></p>
          <div id="cbNeed" class="callout warning need" hidden></div>
          <ol class="recs" id="recCb"></ol>
          <div class="extra">
            <h4 data-i18n="profile_title"></h4>
            <div class="profile" id="profile"></div>
            <p class="small muted" data-i18n="profile_hint"></p>
          </div>
        </div>
        <div class="col cf" id="colCf">
          <h3>👥 <span data-i18n="rec_cf"></span></h3><p class="sub" data-i18n="rec_cf_sub"></p>
          <div id="cfNeed" class="callout warning need" hidden></div>
          <ol class="recs" id="recCf"></ol>
          <div class="extra">
            <h4 data-i18n="neighbours_title"></h4>
            <p class="small muted" data-i18n="neighbours_hint"></p>
            <ul class="nlist" id="neighbours"></ul>
          </div>
        </div>
      </div>
      <p class="tie-hint" id="tieHint" data-i18n="tie_hint" hidden></p>
    </section>

    <!-- 3. filter bubble -->
    <section class="card" id="bubCard">
      <h2 data-i18n="step3"></h2>
      <p class="hint" data-i18n="step3_hint"></p>
      <div class="bub">
        <div>
          <div class="now" id="now"></div>
          <h3 style="margin-top:12px" data-i18n="up_next"></h3>
          <ul class="next" id="next"></ul>
          <label class="check" style="margin-top:10px"><input type="checkbox" id="exploreChk"> <span data-i18n="explore"></span></label>
        </div>
        <div>
          <h3 data-i18n="variety"></h3>
          <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="5" id="meter"><span id="meterFill"></span></div>
          <div><span class="meter-num" id="varietyNum"></span> <span id="varietyTxt"></span></div>
          <p class="feed-msg callout" id="feedMsg" aria-live="polite"></p>
          <h3 data-i18n="history"></h3>
          <p class="small muted" id="histCount"></p>
          <div class="hist" id="hist" aria-hidden="true"></div>
          <div class="gbar" id="gbar"></div>
          <p><button class="btn btn-sm" id="clearHist" type="button" data-i18n="clear_history"></button></p>
          <p class="small muted" data-i18n="feed_how"></p>
        </div>
      </div>
    </section>

    <!-- learn -->
    <section class="card">
      <h2 data-i18n="learn_title"></h2>
      <div class="learn">
        <div><h3 data-i18n="l1_t"></h3><p data-i18n="l1"></p></div>
        <div><h3 data-i18n="l2_t"></h3><p data-i18n="l2"></p></div>
        <div><h3 data-i18n="l3_t"></h3><p data-i18n="l3"></p></div>
        <div><h3 data-i18n="l4_t"></h3><p data-i18n="l4"></p></div>
        <div><h3 data-i18n="l5_t"></h3><p data-i18n="l5"></p></div>
        <div><h3 data-i18n="l6_t"></h3><p data-i18n="l6"></p></div>
      </div>
    </section>

    <section class="card disc">
      <h2 data-i18n="disc_title"></h2>
      <ol>
        <li data-i18n="q1"></li><li data-i18n="q2"></li><li data-i18n="q3"></li><li data-i18n="q4"></li><li data-i18n="q5"></li>
      </ol>
    </section>

    <details class="card">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li><li data-i18n="tip5"></li><li data-i18n="tip6"></li>
      </ul>
    </details>
    <p class="no-print" style="margin-top:16px"><button class="btn btn-danger" id="resetAll" type="button" data-i18n="reset_all"></button></p>
  </main>
  <script src="../../../apps/recommendation-lab/../../shared/edu.js"></script>
  <script src="../../../apps/recommendation-lab/strings.js"></script>
  <script src="../../../apps/recommendation-lab/content.js"></script>
  <script src="../../../apps/recommendation-lab/app.js"></script>
</body>
</html>
