  <style>
    /* ---- language picker row ---- */
    .pb-setup { padding-block: 14px; }
    .pb-langrow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
    .pb-langrow .field { min-width: 0; }
    .pb-speak { display: flex; flex-direction: column; gap: 2px; min-height: 42px; justify-content: center; }
    .pb-speak strong { font-size: 1.15rem; }
    .pb-speak .small { line-height: 1.2; }
    #target { font-size: 1.05rem; font-weight: 600; min-height: 42px; width: 100%; }
    #swap { min-width: 44px; min-height: 42px; font-size: 1.3rem; }
    .pb-stats { gap: 6px 14px; margin-top: 10px; }
    .pb-stats span { white-space: nowrap; }
    .pb-privacy { margin: 8px 0 0; }
    @media (max-width: 560px) {
      .pb-langrow { grid-template-columns: 1fr auto; }
      .pb-langrow .field:first-child { grid-column: 1 / -1; }
      .pb-langrow label.field { order: 2; }
      .pb-langrow .pb-swapwrap { order: 3; align-self: end; }
    }
    #tabs { flex-wrap: nowrap; max-width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
    #tabs button { padding-inline: 10px; flex: none; }
    @media (max-width: 420px) { #tabs button { padding-inline: 7px; font-size: .92rem; } }

    /* ---- tabs / panels ---- */
    .pb-panel[hidden] { display: none; }
    .pb-toolbar { gap: 8px; margin-bottom: 10px; }
    .pb-toolbar input[type="search"] { flex: 1 1 180px; min-width: 0; min-height: 42px; }

    /* ---- topic chips ---- */
    .pb-topics { display: flex; gap: 8px; padding-block: 4px 8px; margin-bottom: 8px; scroll-snap-type: x proximity; }
    .pb-topics .chip { flex: none; min-height: 40px; scroll-snap-align: start; }
    .pb-topics .chip .ic { font-size: 1.1rem; }
    .pb-topic-title { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; font-size: 1.3rem; flex-wrap: wrap; }
    .pb-topic-title .badge { font-size: .8rem; }

    /* ---- phrase cards ---- */
    .pb-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    @media (max-width: 420px) { .pb-cards { grid-template-columns: 1fr; } }
    .pb-card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; position: relative; }
    .pb-card.hidden { display: none; }
    .pb-num { position: absolute; inset-inline-end: 12px; inset-block-start: 10px; font-size: 1.6rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1; }
    .pb-target { font-size: 1.45rem; font-weight: 700; line-height: 1.45; word-break: break-word; text-align: start; }
    .pb-target bdi { font-family: var(--pb-font, inherit); }
    .pb-target[data-lang="ur"] bdi, .pb-letter[lang="ur"], .pb-opt[data-lang="ur"] { line-height: 1.9; }
    .pb-tr { color: var(--accent); font-weight: 600; font-size: 1rem; font-style: italic; text-align: start; }
    .pb-tr:empty { display: none; }
    .pb-meaning { color: var(--muted); font-size: 1rem; text-align: start; }
    .pb-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .pb-actions .btn { min-height: 40px; min-width: 40px; padding: 6px 10px; font-size: .95rem; }
    .pb-actions .btn .lbl { font-size: .85rem; }
    .pb-actions .btn-fav[aria-pressed="true"] { background: var(--warning-soft); border-color: var(--warning); }
    @media (max-width: 420px) { .pb-actions .btn .lbl { display: none; } .pb-actions .btn { padding: 6px 11px; } }
    .pb-empty { color: var(--muted); padding: 20px; text-align: center; }

    /* ---- practice ---- */
    .pb-practice-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: space-between; margin-bottom: 12px; }
    .pb-practice-head .seg button { min-height: 40px; }
    .pb-q { font-size: 1.1rem; margin: 0 0 12px; }
    .pb-big { font-size: 1.7rem; font-weight: 800; line-height: 1.45; margin: 6px 0 12px; text-align: start; word-break: break-word; }
    .pb-big bdi { font-family: var(--pb-font, inherit); }
    .pb-opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .pb-opt { text-align: start; min-height: 52px; font-size: 1.05rem; padding: 10px 14px; white-space: normal; line-height: 1.4; }
    .pb-opt bdi { font-family: var(--pb-font, inherit); }
    .pb-opt.ok { background: var(--success-soft); border-color: var(--success); }
    .pb-opt.bad { background: var(--danger-soft); border-color: var(--danger); }
    .pb-status { margin-top: 12px; min-height: 1.4em; font-weight: 600; }
    .pb-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--muted); font-size: .9rem; }
    .pb-progress .progress { flex: 1; }
    .pb-match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .pb-match .stack { min-width: 0; }
    .pb-match .btn .pb-tr { display: block; }
    .pb-match .btn { white-space: normal; overflow-wrap: anywhere; min-width: 0; max-width: 100%; text-align: start; min-height: 56px; line-height: 1.35; padding: 8px 12px; font-size: 1rem; }
    .pb-match .btn.sel { background: var(--primary-soft); border-color: var(--primary); }
    .pb-match .btn.matched { opacity: .45; background: var(--success-soft); border-color: var(--success); pointer-events: none; }
    .pb-match .btn.shake { animation: pbshake .3s; }
    @keyframes pbshake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .pb-type input { font-size: 1.1rem; min-height: 46px; width: 100%; }
    .pb-type .row { margin-top: 10px; }
    .pb-mic { font-size: 1.1rem; }
    .pb-mic[aria-pressed="true"] { background: var(--danger-soft); border-color: var(--danger); animation: pbpulse 1.2s infinite; }
    @keyframes pbpulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 25%, transparent); } }
    .pb-heard { margin-top: 10px; font-size: 1.1rem; }
    .pb-pct { font-size: 2rem; font-weight: 800; }
    .pb-numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .pb-numcell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 92px; padding: 8px 6px; white-space: normal; }
    .pb-numcell .d { font-size: 1.6rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .pb-numcell .w { font-size: 1.05rem; font-weight: 700; font-family: var(--pb-font, inherit); }
    .pb-numcell .r { font-size: .8rem; color: var(--muted); font-style: italic; }

    /* ---- script tables ---- */
    .pb-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
    .pb-letters[dir="rtl"] { direction: rtl; }
    .pb-letter { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 72px; padding: 6px 4px; white-space: normal; }
    .pb-letter .g { font-size: 1.7rem; font-weight: 700; font-family: var(--pb-font, inherit); line-height: 1.3; }
    .pb-letter .r { font-size: .78rem; color: var(--muted); }
    .pb-script h3 { margin: 18px 0 8px; }
    .pb-script h3:first-of-type { margin-top: 0; }

    /* ---- daily 10 ---- */
    .pb-flash { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; cursor: pointer; padding: 22px 16px; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface-2); }
    .pb-flash:focus-visible { outline: 3px solid var(--primary); }
    .pb-flash .pb-big, .pb-flash .pb-tr, .pb-flash .pb-meaning { text-align: center; }
    .pb-flash .hint { color: var(--muted); font-size: .9rem; }
    .pb-daily-stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; font-weight: 600; }
    .pb-daily-stats span { white-space: nowrap; }
    .pb-answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .pb-answer-row .btn { min-height: 50px; font-size: 1.05rem; }

    /* ---- help ---- */
    .pb-help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    .pb-help ul { margin: 10px 0 0; padding-inline-start: 20px; }
    .pb-help li { margin: 6px 0; }

    /* ---- print: only the phrase sheet ---- */
    #print-sheet { padding: 8px 0; }
    #print-sheet h1 { font-size: 1.4rem; margin: 0 0 4px; }
    #print-sheet .pb-sheet-sub { color: #444; font-size: .9rem; margin: 0 0 12px; }
    #print-sheet table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    #print-sheet th, #print-sheet td { border: 1px solid #999; padding: 6px 8px; text-align: start; vertical-align: top; }
    #print-sheet th { background: #eee; }
    #print-sheet td.n { width: 2.2em; color: #666; }
    #print-sheet td.t { font-weight: 700; font-size: 1.05rem; font-family: var(--pb-font, inherit); }
    #print-sheet td.r { font-style: italic; }
    #print-sheet tr { break-inside: avoid; }
    #print-sheet .pb-sheet-foot { margin-top: 12px; font-size: .8rem; color: #555; }
    @media print {
      #app > :not(#print-sheet) { display: none !important; }
      #print-sheet { display: block !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card pb-setup">
      <div class="pb-langrow">
        <div class="field">
          <span data-i18n="i_speak"></span>
          <div class="pb-speak">
            <strong id="speak-name" class="no-i18n"></strong>
            <span class="muted small" data-i18n="speak_hint"></span>
          </div>
        </div>
        <div class="pb-swapwrap">
          <button class="btn" id="swap" data-i18n-title="swap_title" data-i18n-aria-label="swap_title">⇄</button>
        </div>
        <label class="field" for="target">
          <span data-i18n="i_learn"></span>
          <select id="target" class="no-i18n"></select>
        </label>
      </div>
      <div class="pb-stats row small muted" id="stats" aria-live="polite"></div>
      <p class="tiny muted pb-privacy" data-i18n="privacy"></p>
    </section>

    <nav class="tabs" role="tablist" id="tabs" aria-label="Sections" data-i18n-aria-label="sections">
      <button role="tab" data-tab="phrases" aria-selected="true" aria-controls="panel-phrases" data-i18n="tab_phrases"></button>
      <button role="tab" data-tab="practice" aria-selected="false" aria-controls="panel-practice" data-i18n="tab_practice"></button>
      <button role="tab" data-tab="script" aria-selected="false" aria-controls="panel-script" data-i18n="tab_script"></button>
      <button role="tab" data-tab="daily" aria-selected="false" aria-controls="panel-daily" data-i18n="tab_daily"></button>
      <button role="tab" data-tab="favs" aria-selected="false" aria-controls="panel-favs" data-i18n="tab_favs"></button>
    </nav>

    <section id="panel-phrases" class="pb-panel" role="tabpanel">
      <div class="row pb-toolbar">
        <input id="search" type="search" data-i18n-placeholder="search_ph" data-i18n-aria-label="search" autocomplete="off">
        <button class="btn btn-sm" id="print-btn" data-i18n-title="print_sheet"><span aria-hidden="true">🖨️ </span><span data-i18n="print_sheet"></span></button>
      </div>
      <div class="pb-topics scroll-x no-i18n" id="topics" role="tablist" data-i18n-aria-label="all_topics"></div>
      <h2 class="pb-topic-title no-i18n" id="topic-title"></h2>
      <div id="cards" class="pb-cards no-i18n" aria-live="polite"></div>
    </section>

    <section id="panel-practice" class="pb-panel" role="tabpanel" hidden>
      <div class="pb-practice-head">
        <div class="seg" id="modes" role="group" data-i18n-aria-label="tab_practice">
          <button data-mode="listen" aria-pressed="true" data-i18n="mode_listen"></button>
          <button data-mode="match" aria-pressed="false" data-i18n="mode_match"></button>
          <button data-mode="type" aria-pressed="false" data-i18n="mode_type"></button>
          <button data-mode="speak" aria-pressed="false" data-i18n="mode_speak"></button>
          <button data-mode="numbers" aria-pressed="false" data-i18n="mode_numbers"></button>
        </div>
        <label class="field" for="ptopic"><span data-i18n="pick_topic"></span><select id="ptopic" class="no-i18n"></select></label>
      </div>
      <div id="practice" class="card"></div>
    </section>

    <section id="panel-script" class="pb-panel" role="tabpanel" hidden>
      <div id="script" class="card pb-script"></div>
    </section>

    <section id="panel-daily" class="pb-panel" role="tabpanel" hidden>
      <div id="daily" class="card"></div>
    </section>

    <section id="panel-favs" class="pb-panel" role="tabpanel" hidden>
      <div class="row pb-toolbar">
        <button class="btn btn-sm" id="print-favs" data-i18n-title="print_favs"><span aria-hidden="true">🖨️ </span><span data-i18n="print_favs"></span></button>
      </div>
      <div id="favs" class="pb-cards no-i18n"></div>
    </section>

    <details class="card pb-help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
      <p class="row" style="margin-top:12px"><button class="btn btn-sm btn-danger" id="reset-progress" data-i18n="reset_progress"></button></p>
    </details>

    <section id="print-sheet" class="print-only no-i18n" aria-hidden="true"></section>
  </main>
  <script src="../../../apps/indian-languages-phrasebook/../../shared/edu.js"></script>
  <script src="../../../apps/indian-languages-phrasebook/strings.js"></script>
  <script src="../../../apps/indian-languages-phrasebook/data.js"></script>
  <script src="../../../apps/indian-languages-phrasebook/content.js"></script>
  <script src="../../../apps/indian-languages-phrasebook/app.js"></script>
</body>
