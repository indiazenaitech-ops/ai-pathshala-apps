  <style>
    #app { --p1: #d9501c; --p1-soft: #fde6da; --p2: #0b7285; --p2-soft: #d6f0f3; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #app { --p1: #ff7a45; --p1-soft: #3a2218; --p2: #3bc9db; --p2-soft: #12333a; } }
    :root[data-theme="dark"] #app { --p1: #ff7a45; --p1-soft: #3a2218; --p2: #3bc9db; --p2-soft: #12333a; }
    #app .seg button, #app .btn-sm { min-height: 42px; }
    .gtabs button { min-height: 48px; font-size: 1rem; display: inline-flex; align-items: center; gap: 6px; }
    @media (max-width: 560px) { .gtabs button { flex: 1 1 calc(50% - 4px); justify-content: center; padding: 8px 6px; white-space: normal; text-align: center; line-height: 1.25; } }
    .setup { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; margin-bottom: 16px; }
    .setup .field { flex: 0 1 auto; }
    .setup .names { display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 260px; }
    .setup .names .field { flex: 1 1 120px; }
    .setup input { width: 100%; }
    .lbl { font-weight: 600; font-size: .9rem; }
    .pg { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .pg { grid-template-columns: minmax(0, 1fr) 330px; } }
    .stage-card { display: flex; flex-direction: column; gap: 12px; }
    .status { margin: 0; font-weight: 700; min-height: 3em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .status.win { border-color: var(--success); background: var(--success-soft); }
    .status.draw { border-color: var(--warning); background: var(--warning-soft); }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; vertical-align: middle; }
    .dot.p1 { background: var(--p1); } .dot.p2 { background: var(--p2); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .btn { flex: 1 1 auto; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .side h2 { font-size: 1.1rem; margin: 0; }
    .scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .sc { background: var(--surface-2); border-radius: 10px; padding: 6px 10px; min-width: 0; border-top: 4px solid var(--border); }
    .sc.p1 { border-top-color: var(--p1); } .sc.p2 { border-top-color: var(--p2); }
    .sc .k { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
    .sc .v { font-size: 1.6rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .rule { margin: 0; font-size: .92rem; }
    .opt { display: flex; flex-direction: column; gap: 6px; }
    .opt .seg { display: flex; }
    .opt .seg button { flex: 1 1 0; padding-inline: 6px; }
    .check { min-height: 40px; }
    .hint { color: var(--muted); font-size: .86rem; margin: 0; }
    .board-host { display: flex; justify-content: center; }
    .is-busy { cursor: progress; }

    /* tic-tac-toe */
    .ttt { direction: ltr; display: grid; gap: 6px; width: min(100%, 440px, max(280px, 100vh - 300px)); aspect-ratio: 1 / 1; }
    .ttt button { position: relative; border: 2px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 12px; font: inherit;
      font-family: "Noto Sans", system-ui, sans-serif; font-weight: 800; font-size: clamp(1.6rem, 9vw, 3.4rem); line-height: 1; cursor: pointer; min-width: 40px; min-height: 40px; padding: 0; }
    .ttt.n4 button { font-size: clamp(1.4rem, 7vw, 2.6rem); } .ttt.n5 button { font-size: clamp(1.2rem, 6vw, 2.2rem); }
    .ttt button:hover:not(:disabled) { border-color: var(--primary); }
    .ttt button:disabled { cursor: default; opacity: 1; }
    .ttt button.m1 { color: var(--p1); } .ttt button.m2 { color: var(--p2); }
    .ttt button.win { background: var(--success-soft); border-color: var(--success); animation: pulse .9s ease-in-out 2; }
    .ttt button.last { border-color: var(--text); }
    .ttt .rt { position: absolute; inset-block-start: 4px; inset-inline-end: 6px; font-size: .8rem; font-weight: 800; }
    .ttt button.r-win { background: var(--success-soft); border-color: var(--success); } .ttt button.r-win .rt { color: var(--success); }
    .ttt button.r-good { background: color-mix(in srgb, var(--success-soft) 55%, var(--surface-2)); border-color: color-mix(in srgb, var(--success) 50%, var(--border)); } .ttt button.r-good .rt { color: var(--success); }
    .ttt button.r-draw, .ttt button.r-even { background: var(--warning-soft); border-color: var(--warning); } .ttt button.r-draw .rt, .ttt button.r-even .rt { color: var(--warning); }
    .ttt button.r-bad { background: color-mix(in srgb, var(--danger-soft) 55%, var(--surface-2)); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); } .ttt button.r-bad .rt { color: var(--danger); }
    .ttt button.r-lose { background: var(--danger-soft); border-color: var(--danger); } .ttt button.r-lose .rt { color: var(--danger); }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .think-box { margin: 0; font-size: .9rem; }

    /* four in a row */
    .c4 { direction: ltr; width: min(100%, 520px, max(300px, (100vh - 330px) * 1.05)); }
    .c4-cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 6px; }
    .c4-cols button { min-height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font: inherit; font-weight: 800; cursor: pointer; padding: 0; }
    .c4-cols button:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
    .c4-cols button:disabled { opacity: .45; cursor: default; }
    .c4 svg { display: block; width: 100%; height: auto; touch-action: manipulation; cursor: pointer; }
    .c4 .frame { fill: var(--primary); }
    .c4 .hole { fill: var(--bg); }
    .c4 .pc.p1 { fill: var(--p1); } .c4 .pc.p2 { fill: var(--p2); }
    .c4 .pc.win { stroke: var(--surface); stroke-width: 8; }
    .c4 .ring { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 6 6; }
    .c4 .drop { animation: drop var(--dur, .3s) cubic-bezier(.5, 0, 1, 1) both; }
    @keyframes drop { from { transform: translateY(var(--dy, -300px)); } to { transform: none; } }

    /* dots and boxes */
    .dots { direction: ltr; width: min(100%, 520px, max(300px, 100vh - 300px)); }
    .dots svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
    .dots .dt { fill: var(--text); }
    .dots .ln { stroke: var(--border); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 12; }
    .dots .ln.p1 { stroke: var(--p1); stroke-dasharray: none; stroke-width: 10; }
    .dots .ln.p2 { stroke: var(--p2); stroke-dasharray: none; stroke-width: 10; }
    .dots .ln.last { stroke-width: 15; }
    .dots .hit { fill: transparent; cursor: pointer; pointer-events: all; }
    .dots .hit:hover:not(.on) { fill: color-mix(in srgb, var(--primary) 12%, transparent); }
    .dots .hit:focus { outline: none; }
    .dots .hit:focus-visible { fill: color-mix(in srgb, var(--accent) 30%, transparent); }
    .dots .hit.on { cursor: default; }
    .dots .bx.p1 { fill: var(--p1-soft); } .dots .bx.p2 { fill: var(--p2-soft); }
    .dots .bt { font: 800 40px "Noto Sans", system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .dots .bt.p1 { fill: var(--p1); } .dots .bt.p2 { fill: var(--p2); }

    /* bulls and cows */
    .bc { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .bc-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .bc-in { font-family: "Noto Sans", system-ui, sans-serif !important; font-size: 1.6rem !important; font-weight: 800; letter-spacing: .3em; text-align: center; width: 9.5em; direction: ltr; }
    .bc-pad { direction: ltr; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
    .bc-pad button { min-height: 48px; font-size: 1.3rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; padding: 0; }
    .bc-pad .go { grid-column: span 2; font-family: inherit; font-size: 1rem; }
    .bc-hists { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .bc-hist h3 { font-size: 1rem; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    .bc-hist .table td, .bc-hist .table th { padding: 5px 8px; }
    .num { font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    .gnum { font-weight: 800; letter-spacing: .15em; }
    .bc-hist tr.solved td { background: var(--success-soft); }
    .secret-note { font-weight: 600; }

    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 8px; }
    .help summary { cursor: pointer; font-weight: 700; }
    :root[lang="ur"] .sc .k, :root[lang="ur"] .lbl, :root[lang="ur"] .bc-hist h3 { line-height: 2; }
    @media (prefers-reduced-motion: reduce) { .c4 .drop, .ttt button.win { animation: none !important; } }
    @media (max-width: 560px) {
      .stage-card.card, .side.card { padding: 12px; }
      .setup { gap: 10px; }
      .setup > .field { flex: 1 1 100%; }
      .setup .seg { display: flex; width: 100%; }
      .setup .seg button { flex: 1 1 0; padding-inline: 6px; }
    }
    @media print { .setup, .gtabs, .actions, .side .opt, .bc-pad, .bc-row { display: none !important; } .pg { display: block; } }
  </style>
