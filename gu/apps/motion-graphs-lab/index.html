      body.printing-ws #worksheet { display: block !important; }
      body.printing-lab #app > :not(#panel-lab) { display: none !important; }
      .ws-key { break-before: page; padding-top: 3mm; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-lab" data-panel="panel-lab" aria-controls="panel-lab" aria-selected="true">🚗 <span data-i18n="tab_lab"></span></button>
      <button type="button" role="tab" id="tab-eq" data-panel="panel-eq" aria-controls="panel-eq" aria-selected="false">🧮 <span data-i18n="tab_eq"></span></button>
      <button type="button" role="tab" id="tab-quiz" data-panel="panel-quiz" aria-controls="panel-quiz" aria-selected="false">🧠 <span data-i18n="tab_quiz"></span></button>
      <button type="button" role="tab" id="tab-words" data-panel="panel-words" aria-controls="panel-words" aria-selected="false">📖 <span data-i18n="tab_words"></span></button>
    </div>

    <!-- ===================== LAB ===================== -->
    <section id="panel-lab" role="tabpanel" aria-labelledby="tab-lab">
      <div class="mg-top">
        <div class="card stack mg-ctrl" id="ctrl-card">
          <h2 class="mb0" data-i18n="scenario_title"></h2>
          <div class="field">
            <span class="lbl" data-i18n="presets"></span>
            <div class="mg-presets" id="presets"></div>
          </div>
          <div class="field">
            <span class="lbl" id="lbl-veh" data-i18n="vehicle"></span>
            <div class="seg" role="group" aria-labelledby="lbl-veh" id="vehicles"></div>
          </div>
          <div>
            <span class="lbl" data-i18n="segments"></span>
            <p class="muted small" data-i18n="segments_hint"></p>
            <div class="scroll-x">
              <table class="table mg-segs" id="seg-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th data-i18n="col_type"></th>
                    <th><span class="ltr" data-i18n="col_u"></span></th>
                    <th><span class="ltr" data-i18n="col_v"></span></th>
                    <th><span class="ltr" data-i18n="col_t"></span></th>
                    <th><span class="ltr" data-i18n="col_a"></span></th>
                    <th data-i18n="col_dist"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="seg-body"></tbody>
              </table>
            </div>
            <div class="row" id="seg-actions" style="margin-top:8px">
              <button type="button" class="btn btn-sm" id="add-const">+ <span data-i18n="add_const"></span></button>
              <button type="button" class="btn btn-sm" id="add-accel">+ <span data-i18n="add_accel"></span></button>
            </div>
            <p class="mg-note" id="seg-note"></p>
          </div>
          <div class="row no-print">
            <button type="button" class="btn" id="print-lab">🖨️ <span data-i18n="print_lab"></span></button>
            <button type="button" class="btn btn-danger" id="reset">↺ <span data-i18n="reset"></span></button>
          </div>
        </div>

        <div class="card mg-stagecard" id="stage-card">
          <div class="mg-bar">
            <button type="button" class="btn btn-primary" id="play">▶ <span id="play-txt"></span></button>
            <button type="button" class="btn" id="restart" data-i18n-title="restart" data-i18n-aria-label="restart">⏮</button>
            <div class="seg" role="group" id="rate" data-i18n-aria-label="rate_label">
              <button type="button" data-r="1" aria-pressed="true">1×</button>
              <button type="button" data-r="2" aria-pressed="false">2×</button>
              <button type="button" data-r="5" aria-pressed="false">5×</button>
            </div>
            <span class="grow"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="fs">⛶ <span data-i18n="fullscreen"></span></button>
          </div>
          <div class="stage mg-stage"><canvas id="road" aria-hidden="true"></canvas></div>
          <div class="mg-scrub">
            <label for="scrub" class="small" data-i18n="time_slider"></label>
            <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
          </div>
          <div class="mg-now no-i18n" id="readnow" aria-live="polite" aria-atomic="true"></div>
        </div>

        <div class="card mg-readcard" id="read-card">
          <h2 data-i18n="results_title"></h2>
          <div class="mg-stats" aria-live="polite">
            <div class="mg-stat"><b id="ro-time">–</b><span data-i18n="ro_time"></span></div>
            <div class="mg-stat"><b id="ro-dist">–</b><span data-i18n="ro_dist"></span></div>
            <div class="mg-stat hl"><b id="ro-disp">–</b><span data-i18n="ro_disp"></span><small id="ro-disp-f"></small></div>
            <div class="mg-stat"><b id="ro-avgs">–</b><span data-i18n="ro_avgs"></span><small id="ro-avgs-f"></small></div>
            <div class="mg-stat hl"><b id="ro-avgv">–</b><span data-i18n="ro_avgv"></span><small id="ro-avgv-f"></small></div>
          </div>
          <p class="callout small" id="ro-note" style="margin-top:10px"></p>
        </div>

        <div class="card mg-graphcard" id="graph-card">
          <h3><span data-i18n="g_dt"></span> <span class="muted" data-i18n="g_dt_hint"></span></h3>
          <svg id="svg-d" class="mg-graph" role="img" data-i18n-aria-label="g_dt"></svg>
          <h3><span data-i18n="g_vt"></span> <span class="muted" data-i18n="g_vt_hint"></span></h3>
          <svg id="svg-v" class="mg-graph" role="img" data-i18n-aria-label="g_vt"></svg>
          <p class="mg-legend" id="area-legend"></p>
          <h3><span data-i18n="g_at"></span> <span class="muted" data-i18n="g_at_hint"></span></h3>
          <svg id="svg-a" class="mg-graph" role="img" data-i18n-aria-label="g_at"></svg>
        </div>

        <div class="card mg-slopecard stack" id="slope-card">
          <div class="row spread">
            <h2 class="mb0" data-i18n="slope_title"></h2>
            <label class="check"><input type="checkbox" id="slope-on"> <span data-i18n="slope_on"></span></label>
          </div>
          <p class="muted small mb0" data-i18n="slope_hint"></p>
          <div id="slope-body" class="stack" hidden>
            <div class="row">
              <div class="seg" role="group" id="slope-kind" data-i18n-aria-label="slope_which">
                <button type="button" data-k="d" aria-pressed="true"><span data-i18n="slope_on_dt"></span></button>
                <button type="button" data-k="v" aria-pressed="false"><span data-i18n="slope_on_vt"></span></button>
              </div>
              <label>t₁ (s) <input type="number" id="slope-t1" step="0.5" min="0"></label>
              <label>t₂ (s) <input type="number" id="slope-t2" step="0.5" min="0"></label>
            </div>
            <div class="callout accent mg-sout" id="slope-out" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <details class="card" id="inside" style="margin-top:16px">
        <summary><strong data-i18n="inside_title"></strong></summary>
        <ul class="stack" style="padding-inline-start:20px;margin-top:12px">
          <li data-i18n="inside_1"></li>
          <li data-i18n="inside_2"></li>
          <li data-i18n="inside_3"></li>
          <li data-i18n="inside_4"></li>
        </ul>
      </details>
    </section>

    <!-- ===================== EQUATIONS ===================== -->
    <section id="panel-eq" role="tabpanel" aria-labelledby="tab-eq" hidden>
      <div class="grid-2">
        <div class="card stack">
          <h2 class="mb0" data-i18n="eq_title"></h2>
          <p class="muted small mb0" data-i18n="eq_intro"></p>
          <ul class="mg-eqlist no-i18n" aria-hidden="true"><li>v = u + at</li><li>s = ut + ½at²</li><li>v² = u² + 2as</li><li>s = (u + v)t / 2</li></ul>
          <div class="seg" role="group" id="eq-mode" data-i18n-aria-label="eq_mode">
            <button type="button" id="mode-general" aria-pressed="true" data-i18n="mode_general"></button>
            <button type="button" id="mode-ff" aria-pressed="false" data-i18n="mode_ff"></button>
          </div>
          <div id="ff-opts" class="stack" hidden>
            <div class="row">
              <span class="lbl" id="lbl-planet" data-i18n="ff_where"></span>
              <div class="seg" role="group" aria-labelledby="lbl-planet" id="planets">
                <button type="button" data-g="earth" aria-pressed="true"><span data-i18n="g_earth"></span> <span class="ltr">9.8</span></button>
                <button type="button" data-g="moon" aria-pressed="false"><span data-i18n="g_moon"></span> <span class="ltr">1.6</span></button>
                <button type="button" data-g="mars" aria-pressed="false"><span data-i18n="g_mars"></span> <span class="ltr">3.7</span></button>
              </div>
            </div>
            <div class="row">
              <span class="lbl" id="lbl-dir" data-i18n="ff_dir"></span>
              <div class="seg" role="group" aria-labelledby="lbl-dir" id="ff-dir">
                <button type="button" data-d="down" aria-pressed="true" data-i18n="ff_down"></button>
                <button type="button" data-d="up" aria-pressed="false" data-i18n="ff_up"></button>
              </div>
            </div>
            <p class="muted small mb0" id="ff-note"></p>
          </div>
          <p class="lbl mb0" data-i18n="knowns_label"></p>
          <div class="mg-knowns" id="knowns"></div>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg" id="solve">= <span data-i18n="solve"></span></button>
            <button type="button" class="btn" id="eq-clear" data-i18n="clear"></button>
          </div>
        </div>
        <div class="card stack" id="eq-out" aria-live="polite">
          <h2 class="mb0" data-i18n="eq_result"></h2>
          <div class="mg-vals" id="eq-vals"></div>
          <div id="eq-err" class="callout warning" hidden></div>
          <div id="eq-steps" class="stack"></div>
          <p class="muted small mb0" id="eq-sign"></p>
        </div>
      </div>
      <div class="grid-2" style="margin-top:16px">
        <div class="card stack">
          <h2 class="mb0" data-i18n="conv_title"></h2>
          <p class="muted small mb0" data-i18n="conv_hint"></p>
          <div class="mg-conv">
            <label class="field"><span data-i18n="conv_ms"></span><input type="number" id="conv-ms" step="any" value="20"></label>
            <span class="arrows" aria-hidden="true">⇄</span>
            <label class="field"><span data-i18n="conv_kmh"></span><input type="number" id="conv-kmh" step="any" value="72"></label>
          </div>
          <p class="callout small mb0" data-i18n="conv_examples"></p>
        </div>
        <div class="card stack mg-deriv">
          <h2 class="mb0" data-i18n="deriv_title"></h2>
          <p class="muted small mb0" data-i18n="deriv_intro"></p>
          <svg id="deriv-svg" role="img" data-i18n-aria-label="deriv_title"></svg>
          <ol class="stack" style="padding-inline-start:20px;margin:0">
            <li data-i18n="deriv_1"></li>
            <li data-i18n="deriv_2"></li>
            <li data-i18n="deriv_3"></li>
            <li data-i18n="deriv_4"></li>
          </ol>
        </div>
      </div>
    </section>

    <!-- ===================== QUIZ ===================== -->
    <section id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="card stack" id="quiz"></div>
      <div class="row no-print" style="margin-top:12px">
        <button type="button" class="btn" id="quiz-print">🖨️ <span data-i18n="quiz_print"></span></button>
        <button type="button" class="btn btn-ghost" id="quiz-restart">🔁 <span data-i18n="quiz_again"></span></button>
      </div>
    </section>

    <!-- ===================== WORDS TO KNOW ===================== -->
    <section id="panel-words" role="tabpanel" aria-labelledby="tab-words" hidden>
      <div class="card stack">
        <h2 class="mb0" data-i18n="words_title"></h2>
        <div class="mg-words">
          <div class="mg-word"><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p><p class="ex" data-i18n="w1_e"></p></div>
          <div class="mg-word"><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p><p class="ex" data-i18n="w2_e"></p></div>
          <div class="mg-word"><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p><p class="ex" data-i18n="w3_e"></p></div>
          <div class="mg-word"><h3 data-i18n="w4_t"></h3><p data-i18n="w4_d"></p><p class="ex" data-i18n="w4_e"></p></div>
          <div class="mg-word"><h3 data-i18n="w5_t"></h3><p data-i18n="w5_d"></p><p class="ex" data-i18n="w5_e"></p></div>
          <div class="mg-word"><h3 data-i18n="w6_t"></h3><p data-i18n="w6_d"></p><p class="ex" data-i18n="w6_e"></p></div>
        </div>
        <div class="panel">
          <h3 data-i18n="circ_title"></h3>
          <p class="small muted" data-i18n="circ_hint"></p>
          <div class="mg-circ">
            <label class="field"><span data-i18n="circ_r"></span><input type="number" id="circ-r" step="any" min="0" value="2"></label>
            <label class="field"><span data-i18n="circ_T"></span><input type="number" id="circ-T" step="any" min="0" value="4"></label>
            <div class="callout" id="circ-out" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="worksheet" aria-hidden="true"></section>

    <details class="card" id="howto" style="margin-top:18px">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
        <li data-i18n="how6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/motion-graphs-lab/../../shared/edu.js"></script>
  <script src="../../../apps/motion-graphs-lab/strings.js"></script>
  <script src="../../../apps/motion-graphs-lab/data.js"></script>
  <script src="../../../apps/motion-graphs-lab/content.js"></script>
  <script src="../../../apps/motion-graphs-lab/engine.js"></script>
  <script src="../../../apps/motion-graphs-lab/view.js"></script>
  <script src="../../../apps/motion-graphs-lab/app.js"></script>
</body>
</html>
