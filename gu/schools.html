    <section class="s-hero">
      <span class="kicker" data-i18n="hero_kicker"></span>

      <p id="hero-lead"></p>
      <div class="cta">
        <a class="btn btn-primary btn-lg" id="open-lib" href="../index.html">📚 <span data-i18n="open_lib"></span></a>
        <a class="btn btn-accent btn-lg" href="#updates"><span aria-hidden="true">✉️</span> <span data-i18n="get_updates"></span></a>
        <a class="btn btn-wa btn-lg" id="wa-page" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2.2a9.8 9.8 0 0 0-8.5 14.7L2.2 21.8l5-1.3A9.8 9.8 0 1 0 12 2.2zm0 1.8a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4z"/><path fill="currentColor" d="M8.7 7.3c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 1.9 3 4.7 4.1 2.3.9 2.8.7 3.3.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3l-1.9-.9c-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2z"/></svg><span data-i18n="shell_wa"></span></a>
      </div>
      <div class="stats">
        <div class="card stat"><b id="stat-apps"></b><span data-i18n="stat_apps"></span></div>
        <div class="card stat"><b>12</b><span data-i18n="stat_langs"></span></div>
        <div class="card stat"><b>₹0</b><span data-i18n="stat_cost"></span></div>
        <div class="card stat"><b>0</b><span data-i18n="stat_ads"></span></div>
      </div>
    </section>

    <section class="sec grid-2">
      <div class="card stack">
        <h2 data-i18n="what_title"></h2>
        <p data-i18n="what_text"></p>
      </div>
      <div class="card stack">
        <h2 data-i18n="safe_title"></h2>
        <ul class="safe-list">
          <li data-i18n="safe_1"></li>
          <li data-i18n="safe_2"></li>
          <li data-i18n="safe_3"></li>
          <li data-i18n="safe_4"></li>
          <li data-i18n="safe_5"></li>
          <li data-i18n="safe_6"></li>
        </ul>
      </div>
    </section>

    <section class="sec" aria-labelledby="day-h">
      <h2 id="day-h" data-i18n="day_title"></h2>
      <div class="steps">
        <div class="card step"><h3 data-i18n="day_1_t"></h3><p id="day-1"></p></div>
        <div class="card step"><h3 data-i18n="day_2_t"></h3><p data-i18n="day_2"></p></div>
        <div class="card step"><h3 data-i18n="day_3_t"></h3><p data-i18n="day_3"></p></div>
        <div class="card step"><h3 data-i18n="day_4_t"></h3><p data-i18n="day_4"></p></div>
      </div>
      <div class="card parents" style="margin-top:14px">
        <label for="parents-msg" data-i18n="parents_title"></label>
        <textarea id="parents-msg" readonly></textarea>
        <div class="row">
          <a class="btn btn-wa" id="wa-parents" target="_blank" rel="noopener">💬 <span data-i18n="shell_wa"></span></a>
          <button class="btn" id="copy-msg" type="button">📋 <span data-i18n="copy_msg"></span></button>
        </div>
      </div>
    </section>

    <section class="sec" aria-labelledby="align-h">
      <h2 id="align-h" data-i18n="align_title"></h2>
      <p class="callout small" data-i18n="align_note"></p>
      <div id="align" style="margin-top:14px"></div>
    </section>

    <div class="sec">
      <section class="card su" id="updates" data-signup="schools"></section>
    </div>

    <section class="sec end">
      <div class="card stack" id="flyer" hidden>
        <h3>🖨️ <span data-i18n="flyer_title"></span></h3>
        <p class="muted" data-i18n="flyer_text"></p>
        <p><a class="btn" id="flyer-link" target="_blank" rel="noopener" data-i18n="flyer_btn"></a></p>
      </div>
      <div class="card stack">
        <h3>📺 <span data-i18n="yt_title"></span></h3>
        <p class="muted" data-i18n="yt_text"></p>
        <p><a class="btn btn-yt" id="subscribe" target="_blank" rel="noopener">▶ <span data-i18n="subscribe_yt"></span></a></p>
      </div>
    </section>

    <section class="sec" aria-labelledby="faq-h">
      <h2 id="faq-h" data-i18n="faq_title"></h2>
      <div id="faq"></div>
    </section>

    <section class="sec end">
      <div class="card stack">
        <h3 data-i18n="share_title"></h3>
        <p class="muted" data-i18n="share_text"></p>
        <p><a class="btn btn-wa" id="wa-page-2" target="_blank" rel="noopener">💬 <span data-i18n="shell_wa"></span></a></p>
      </div>
    </section>
  </main>
