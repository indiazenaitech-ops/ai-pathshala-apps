    #app { --sf: "Noto Sans", system-ui, sans-serif; --sf-lh: 1.3; }

    .lat { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }

    /* ---------- script picker ---------- */
    .ae-pick h2 { margin: 0; }

    .script-bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .sc-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 12px; border-radius: 12px;
              border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
              font-size: .95rem; cursor: pointer; min-width: 0; text-align: start; }
    .sc-btn:hover { background: var(--surface-2); }

    /* ---------- vowel signs ---------- */

    .base-bar button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

    .chart td button:hover { background: var(--primary-soft); }

    /* ---------- tracing ---------- */
    .trace-wrap { display: grid; gap: 16px; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; }
    .trace-stage { aspect-ratio: 1 / 1; width: 100%; background: var(--surface); }

    .gopt { font-family: var(--sf); font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: var(--sf-lh); min-height: 110px; border: 2px solid var(--border);

    .gopt:hover { background: var(--surface-2); }

      body[data-print="sheet"] #panel-letters, body[data-print="sheet"] #panel-signs, body[data-print="sheet"] #panel-trace, body[data-print="sheet"] #panel-game { display: none !important; }
      body:not([data-print="sheet"]) #print-sheet { display: none !important; }
      body[data-print="sheet"] .print-head { display: none !important; }
      .ae-layout { display: block; }
      .groups { gap: 10px; }
      .lt { border-color: #999; min-height: 0; padding: 2px; break-inside: avoid; }
      .lt .ch { font-size: 1.6rem; color: #000; }
      .lt-row { grid-template-columns: repeat(var(--n, 5), 22mm); }
      .lt-auto { grid-template-columns: repeat(auto-fill, 22mm); }
      .lt[aria-current="true"] { background: none; box-shadow: none; border-color: #999; }
      .chart-box summary { display: none; }
      .chart td button { font-size: 1.15rem; min-height: 0; min-width: 0; color: #000; }
      .chart { font-size: 11pt; width: 100%; min-width: 0; }
      .chart tr { break-inside: avoid; }
      .scroll-x { overflow: visible !important; }   /* a scroll box would cut the last columns off the paper */
      .chart th, .chart td { padding: 2px 1px; }
      .chart th { position: static; }   /* edu.css makes table headers sticky: in print they landed mid-page */
      .chart td button { padding: 0; }
      /* edu.css keeps a .card on one page; these cards are longer than a page (left page 1 blank) */
      .card { border: 0; padding: 0; break-inside: auto; }
      .lt, .btn, .gopt { transition: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="print-only print-head"><h2 id="print-title"></h2></div>

    <!-- script picker -->
    <section class="card stack ae-pick" aria-labelledby="pick-h">
      <div class="pick-head">
        <h2 id="pick-h" data-i18n="pick_script"></h2>
        <span class="muted small" id="uses"></span>
      </div>
      <div class="script-bar" id="script-bar" role="group" data-i18n-aria-label="pick_script"></div>
      <div class="voice-line">
        <p class="small voice-status" id="voice-status" aria-live="polite"></p>
        <label class="check small"><input type="checkbox" id="slow"> <span data-i18n="slow"></span></label>
      </div>
    </section>

    <div class="tabs ae-tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-letters" data-tab="letters" aria-controls="panel-letters"><span aria-hidden="true">🔤</span>&nbsp;<span data-i18n="tab_letters"></span></button>
      <button type="button" role="tab" id="tab-signs" data-tab="signs" aria-controls="panel-signs"><span aria-hidden="true">🧩</span>&nbsp;<span id="tab-signs-lbl"></span></button>
      <button type="button" role="tab" id="tab-trace" data-tab="trace" aria-controls="panel-trace"><span aria-hidden="true">✍️</span>&nbsp;<span data-i18n="tab_trace"></span></button>
      <button type="button" role="tab" id="tab-game" data-tab="game" aria-controls="panel-game"><span aria-hidden="true">🎧</span>&nbsp;<span data-i18n="tab_game"></span></button>
    </div>

    <!-- 1) letters -->
    <section id="panel-letters" role="tabpanel" aria-labelledby="tab-letters">
      <div class="ae-layout">
        <div class="card stack">
          <p class="muted small tap-hint" data-i18n="tap_hint"></p>
          <div class="groups" id="groups"></div>
        </div>
        <aside class="card big-card" id="big-card" data-i18n-aria-label="big_aria">
          <div class="big-top">
            <span class="badge primary" id="big-group"></span>
            <span class="muted small" id="big-pos"></span>
          </div>
          <div class="big-ch no-i18n" id="big-ch" role="button" tabindex="0" data-i18n-title="hear"></div>
          <p class="tam-join no-i18n" id="tam-join" hidden></p>
          <p class="big-roman" id="big-roman-line"><span data-i18n="sounds_like"></span>: <b class="lat no-i18n" id="big-roman"></b></p>
          <div class="big-ex" id="big-ex">
            <span class="emo" id="big-emoji" aria-hidden="true"></span>
            <div class="grow">
              <div class="wd no-i18n" id="big-word"></div>
              <div class="muted small wr no-i18n" id="big-wroman"></div>
            </div>
          </div>
          <p class="small muted big-note" id="big-note"></p>
          <div class="forms" id="big-forms" hidden></div>
          <p class="small muted big-note" id="forms-note" hidden></p>
          <div class="big-acts">
            <button type="button" class="btn btn-primary" id="big-hear"><span aria-hidden="true">🔊</span> <span data-i18n="hear"></span></button>
            <button type="button" class="btn" id="big-hear-word"><span aria-hidden="true">🗣️</span> <span data-i18n="hear_word"></span></button>
            <button type="button" class="btn" id="big-trace"><span aria-hidden="true">✍️</span> <span data-i18n="trace_this"></span></button>
          </div>
          <div class="big-nav">
            <button type="button" class="btn" id="big-prev"><span aria-hidden="true" class="flip">◀</span> <span data-i18n="previous"></span></button>
            <button type="button" class="btn" id="big-next"><span data-i18n="next"></span> <span aria-hidden="true" class="flip">▶</span></button>
            <button type="button" class="btn" id="big-fs" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><span aria-hidden="true">⛶</span></button>
          </div>
        </aside>
      </div>
    </section>

    <!-- 2) vowel signs / matras (Urdu: vowel marks + letter shapes) -->
    <section id="panel-signs" role="tabpanel" aria-labelledby="tab-signs" hidden>
      <div class="card stack">
        <h2 id="signs-h"></h2>
        <p class="muted signs-intro" id="signs-help"></p>
        <p class="small signs-intro"><b data-i18n="pick_cons"></b></p>
        <div class="base-bar" id="base-bar" role="group" data-i18n-aria-label="pick_cons"></div>
        <div class="sign-row" id="sign-row" aria-live="polite"></div>
        <p class="muted small signs-intro" data-i18n="tap_cell"></p>
        <details class="chart-box" id="chart-box">
          <summary data-i18n="full_chart"></summary>
          <div class="row chart-tools">
            <button type="button" class="btn btn-sm" id="chart-print"><span aria-hidden="true">🖨</span> <span data-i18n="print_chart"></span></button>
          </div>
          <div class="scroll-x"><table class="table chart" id="chart"></table></div>
        </details>
        <div id="forms-box" hidden>
          <h3 data-i18n="forms_h"></h3>
          <p class="muted small" data-i18n="forms_help"></p>
          <div class="scroll-x"><table class="table chart forms-table" id="forms-table"></table></div>
        </div>
      </div>
    </section>

    <!-- 3) tracing -->
    <section id="panel-trace" role="tabpanel" aria-labelledby="tab-trace" hidden>
      <div class="card stack">
        <p class="muted" data-i18n="trace_help"></p>
        <div class="trace-wrap" id="trace-wrap">
          <div class="stage trace-stage" id="trace-stage">
            <canvas id="trace-canvas" data-i18n-aria-label="canvas_aria" role="img"></canvas>
          </div>
          <div class="trace-side">
            <div class="trace-now">
              <span class="sf no-i18n" id="trace-ch"></span>
              <span class="muted small" id="trace-pos"></span>
            </div>
            <p class="cover-txt" id="cover-txt" aria-live="polite"></p>
            <div class="progress" aria-hidden="true"><span id="cover-bar" style="width:0%"></span></div>
            <div class="stars" id="trace-stars" aria-hidden="true"></div>
            <p class="trace-msg" id="trace-msg" aria-live="polite"></p>
            <div class="trace-btns">
              <button type="button" class="btn" id="trace-prev"><span aria-hidden="true" class="flip">◀</span> <span data-i18n="previous"></span></button>
              <button type="button" class="btn btn-danger" id="trace-clear"><span aria-hidden="true">🧽</span> <span data-i18n="clear"></span></button>
              <button type="button" class="btn btn-primary" id="trace-next"><span data-i18n="next"></span> <span aria-hidden="true" class="flip">▶</span></button>
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" id="trace-guide" checked> <span data-i18n="show_guide"></span></label>
              <button type="button" class="btn btn-sm" id="trace-hear"><span aria-hidden="true">🔊</span> <span data-i18n="hear"></span></button>
              <button type="button" class="btn btn-sm" id="trace-fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            </div>
            <button type="button" class="btn" id="sheet-print"><span aria-hidden="true">🖨</span> <span data-i18n="print_sheet"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 4) listen & tap game -->
    <section id="panel-game" role="tabpanel" aria-labelledby="tab-game" hidden>
      <div class="card stack game-card">
        <p class="muted" data-i18n="game_help"></p>
        <div class="game-opts-row">
          <div class="seg" id="pool-seg" role="group" data-i18n-aria-label="pool"></div>
          <div class="seg" id="n-seg" role="group" data-i18n-aria-label="choices"></div>
          <label class="check"><input type="checkbox" id="hint-chk"> <span data-i18n="show_hint"></span></label>
        </div>
        <div id="game-play" class="stack" hidden>
          <div class="game-bar"><span id="game-round"></span><span id="game-score" aria-live="polite"></span></div>
          <div class="progress" aria-hidden="true"><span id="game-prog" style="width:0%"></span></div>
          <div class="game-q" id="game-q">
            <span class="muted" id="game-ask"></span>
            <button type="button" class="btn btn-lg btn-primary" id="game-hear"><span aria-hidden="true">🔊</span> <span data-i18n="hear_again"></span></button>
            <div class="game-hint no-i18n" id="game-hint"></div>
          </div>
          <div class="game-grid" id="game-opts"></div>
          <p class="game-fb" id="game-fb" aria-live="assertive"></p>
        </div>
        <div class="game-end" id="game-end" hidden>
          <div class="big-number" id="end-score"></div>
          <p class="stars" id="end-stars" aria-hidden="true"></p>
          <p id="end-msg"></p>
        </div>
        <div class="row">
          <button type="button" class="btn btn-lg btn-accent" id="game-start"><span aria-hidden="true">▶</span> <span id="game-start-lbl"></span></button>
          <span class="muted" id="game-best"></span>
        </div>
      </div>
    </section>

    <div class="row bottom-row no-print">
      <button type="button" class="btn" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
      <button type="button" class="btn btn-danger" id="reset-btn"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
      <span class="muted small" data-i18n="saved_local"></span>
    </div>

    <details class="card help no-print">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
      <p class="callout accent mb0" data-i18n="tip_class"></p>
    </details>

    <div class="print-only" id="print-sheet"></div>
  </main>
  <script src="../../../apps/alphabet-explorer/../../shared/edu.js"></script>
  <script src="../../../apps/alphabet-explorer/strings.js"></script>
  <script src="../../../apps/alphabet-explorer/data.js"></script>
  <script src="../../../apps/alphabet-explorer/app.js"></script>
</body>
</html>
