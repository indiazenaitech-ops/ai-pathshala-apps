        --warning: #a15c07; --info: #0b69a3; --info-soft: #e0f2fe; --c7: #1971c2;
      }
      .tabs, #howto, #words, #inside, .edu-intro, .no-print { display: none !important; }
      body { font-size: 11pt; }
      .detail-grid, .lab-grid, .titr-grid { display: block; }
      .swatch, .ph-seg, .disc, .game-swatch, .chart-mini span, .sub-chip .ph { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body.printing-summary #app > :not(#summary) { display: none !important; }
      body.printing-summary #summary { display: block !important; }
      #summary h2 { font-size: 16pt; margin: 0 0 4pt; }
      #summary h3 { font-size: 11.5pt; margin: 8pt 0 3pt; }
      #summary p, #summary li { font-size: 10pt; margin: 0 0 2pt; line-height: 1.35; }
      #summary ul { margin: 0; padding-inline-start: 16pt; }
      :root[lang="ur"] #summary p, :root[lang="ur"] #summary li { line-height: 1.8; }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs no-print" role="tablist" id="tabs" data-i18n-aria-label="tabs_label">
      <button type="button" role="tab" id="tab-scale" data-panel="panel-scale" aria-controls="panel-scale" aria-selected="true">🌈 <span data-i18n="tab_scale"></span></button>
      <button type="button" role="tab" id="tab-ind" data-panel="panel-ind" aria-controls="panel-ind" aria-selected="false">🧪 <span data-i18n="tab_ind"></span></button>
      <button type="button" role="tab" id="tab-titr" data-panel="panel-titr" aria-controls="panel-titr" aria-selected="false">⚗️ <span data-i18n="tab_titr"></span></button>
      <button type="button" role="tab" id="tab-salts" data-panel="panel-salts" aria-controls="panel-salts" aria-selected="false">🧂 <span data-i18n="tab_salts"></span></button>
      <button type="button" role="tab" id="tab-life" data-panel="panel-life" aria-controls="panel-life" aria-selected="false">🌍 <span data-i18n="tab_life"></span></button>
      <button type="button" role="tab" id="tab-quiz" data-panel="panel-quiz" aria-controls="panel-quiz" aria-selected="false">📝 <span data-i18n="tab_quiz"></span></button>
    </div>

    <!-- ===================== pH SCALE ===================== -->
    <section id="panel-scale" role="tabpanel" aria-labelledby="tab-scale" class="stack">
      <div class="card">
        <h2 data-i18n="scale_title"></h2>
        <p class="muted small" data-i18n="scale_hint"></p>
        <div class="ph-wrap">
          <div class="ph-marks" id="ph-marks"></div>
          <div class="ph-bar" id="ph-bar" role="img" data-i18n-aria-label="bar_aria"></div>
          <div class="ph-ends"><span>← <span data-i18n="scale_acid_end"></span></span><span class="mid" data-i18n="scale_neutral"></span><span><span data-i18n="scale_base_end"></span> →</span></div>
        </div>
        <div id="sub-list"></div>
      </div>
      <div class="card" id="sub-detail" aria-live="polite"></div>
    </section>

    <!-- ===================== INDICATORS ===================== -->
    <section id="panel-ind" role="tabpanel" aria-labelledby="tab-ind" class="stack" hidden>
      <div class="card">
        <h2 data-i18n="ind_title"></h2>
        <div class="lab-grid">
          <div class="stack">
            <div class="field">
              <label for="ind-sub" data-i18n="ind_pick_sub"></label>
              <select id="ind-sub"></select>
            </div>
            <div>
              <span class="lbl" id="ind-pick-lbl" data-i18n="ind_pick_ind"></span>
              <div class="ind-chips" role="group" aria-labelledby="ind-pick-lbl" id="ind-chips" style="margin-top:6px"></div>
            </div>
            <div class="callout" id="ind-why-box">
              <p class="lbl mb0" data-i18n="ind_why_label"></p>
              <p class="ind-why mb0" id="ind-why"></p>
            </div>
          </div>
          <div class="tube-wrap" aria-live="polite">
            <div id="tube"></div>
            <p class="ind-res" id="ind-result"></p>
            <p class="muted small mb0 center" id="ind-because"></p>
          </div>
        </div>
      </div>
      <div class="card stack" id="game"></div>
    </section>

    <!-- ===================== TITRATION ===================== -->
    <section id="panel-titr" role="tabpanel" aria-labelledby="tab-titr" class="stack" hidden>
      <div class="card">
        <h2 data-i18n="titr_title"></h2>
        <p class="muted small" data-i18n="titr_intro"></p>
        <div class="titr-grid">
          <div class="stack">
            <div class="titr-params">
              <label class="field"><span data-i18n="titr_va"></span><input type="number" id="t-va" min="1" max="100" step="1" inputmode="decimal" dir="ltr"></label>
              <label class="field"><span data-i18n="titr_ca"></span><input type="number" id="t-ca" min="0.01" max="2" step="0.01" inputmode="decimal" dir="ltr"></label>
              <label class="field"><span data-i18n="titr_cb"></span><input type="number" id="t-cb" min="0.01" max="2" step="0.01" inputmode="decimal" dir="ltr"></label>
            </div>
            <div class="field">
              <label for="t-ind" data-i18n="titr_ind"></label>
              <select id="t-ind"></select>
            </div>
            <div>
              <label for="t-vb" class="lbl" data-i18n="titr_vb"></label>
              <div class="titr-vb">
                <input type="range" id="t-vb" min="0" max="50" step="0.05" value="0">
                <input type="number" id="t-vb-num" min="0" max="50" step="0.05" inputmode="decimal" dir="ltr" data-i18n-aria-label="titr_vb">
              </div>
            </div>
            <div class="titr-btns">
              <button type="button" class="btn" id="t-drop" data-i18n="btn_drop"></button>
              <button type="button" class="btn" id="t-1ml" data-i18n="btn_1ml"></button>
              <button type="button" class="btn" id="t-5ml" data-i18n="btn_5ml"></button>
            </div>
            <div class="titr-btns">
              <button type="button" class="btn btn-primary" id="t-auto">▶ <span data-i18n="btn_auto"></span></button>
              <button type="button" class="btn btn-ghost" id="t-empty">↺ <span data-i18n="btn_empty"></span></button>
            </div>
            <p class="callout small mb0" id="t-veq"></p>
          </div>
          <div class="stack">
            <div class="flask-row">
              <div id="flask"></div>
              <div aria-live="polite">
                <div class="muted small" data-i18n="titr_ph_now"></div>
                <div class="ph-now" id="t-ph"></div>
                <p class="ph-state" id="t-state"></p>
                <p class="small mb0" id="t-hint"></p>
              </div>
            </div>
            <div class="curve-wrap stage"><canvas id="curve" width="600" height="300"></canvas></div>
            <div class="eq"><span class="formula no-i18n">HCl + NaOH → NaCl + H₂O</span><small data-i18n="eq_words"></small></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="titr_work_title"></h2>
        <div class="scroll-x"><table class="table work-tbl" id="work"><tbody></tbody></table></div>
        <p class="small muted mb0" id="work-note"></p>
      </div>
      <div class="card">
        <h2 data-i18n="stories_title"></h2>
        <div class="stories" id="stories"></div>
      </div>
    </section>

    <!-- ===================== SALTS ===================== -->
    <section id="panel-salts" role="tabpanel" aria-labelledby="tab-salts" class="stack" hidden>
      <div class="card">
        <h2 data-i18n="salts_title"></h2>
        <p class="callout" data-i18n="salts_rule"></p>
        <div class="salts-grid" id="salts-list"></div>
        <div class="row" style="margin-top:10px">
          <span class="pill" id="salts-score"></span>
          <button type="button" class="btn btn-sm" id="salts-show" data-i18n="salts_show"></button>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="uses_title"></h2>
        <div class="uses-grid" id="uses"></div>
      </div>
    </section>

    <!-- ===================== DAILY LIFE ===================== -->
    <section id="panel-life" role="tabpanel" aria-labelledby="tab-life" class="stack" hidden>
      <div class="row spread no-print">
        <h2 class="mb0" data-i18n="life_title"></h2>
        <button type="button" class="btn btn-primary" id="print-summary">🖨️ <span data-i18n="print_summary"></span></button>
      </div>
      <div class="life-grid" id="life"></div>
    </section>

    <!-- ===================== QUIZ ===================== -->
    <section id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" class="stack" hidden>
      <div class="card stack" id="quiz"></div>
    </section>

    <section id="summary" aria-hidden="true"></section>

    <details class="card" id="inside" style="margin-top:18px">
      <summary><strong data-i18n="inside_title"></strong></summary>
      <ol style="padding-inline-start:20px;margin:12px 0 0">
        <li data-i18n="inside_1"></li>
        <li data-i18n="inside_2"></li>
        <li data-i18n="inside_3"></li>
        <li data-i18n="inside_4"></li>
      </ol>
    </details>
    <details class="card" id="words" style="margin-top:12px">
      <summary><strong data-i18n="words_title"></strong></summary>
      <dl id="words-list" style="margin:12px 0 0"></dl>
    </details>
    <details class="card" id="howto" style="margin-top:12px">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul style="margin:12px 0 0">
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
      </ul>
    </details>
    <div class="row no-print" style="margin-top:14px">
      <button type="button" class="btn" id="print-summary-2">🖨️ <span data-i18n="print_summary"></span></button>
      <button type="button" class="btn btn-danger" id="reset">↺ <span data-i18n="reset"></span></button>
      <span class="muted small" data-i18n="saved_local"></span>
    </div>
  </main>
  <script src="../../../apps/acid-base-ph-lab/../../shared/edu.js"></script>
  <script src="../../../apps/acid-base-ph-lab/strings.js"></script>
  <script src="../../../apps/acid-base-ph-lab/content.js"></script>
  <script src="../../../apps/acid-base-ph-lab/engine.js"></script>
  <script src="../../../apps/acid-base-ph-lab/view.js"></script>
  <script src="../../../apps/acid-base-ph-lab/app.js"></script>
</body>
</html>
