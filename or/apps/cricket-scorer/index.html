  <style>
    :root { --board: #103b2c; --board-2: #164a38; --board-ink: #f2f5ea; --board-dim: #b9cdbf; --board-hot: #ffd447; --s1: #2a78d6; --s2: #eb6834; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --board: #0c3125; --board-2: #123f30; --s1: #3987e5; --s2: #d95926; } }
    :root[data-theme="dark"] { --board: #0c3125; --board-2: #123f30; --s1: #3987e5; --s2: #d95926; }
    .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    h2 { font-size: 1.15rem; margin: 0 0 12px; }
    h3 { font-size: 1rem; margin: 0 0 8px; }
    .privacy { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 14px; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- setup ---------- */
    .su-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .su-grid .wide { grid-column: 1 / -1; }
    @media (max-width: 560px) { .su-grid { grid-template-columns: minmax(0, 1fr); } }
    .field input, .field select, .field textarea { width: 100%; }
    .field input[type="checkbox"] { width: 18px; flex: none; }

    .su-rules { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
    .su-rules summary { font-weight: 700; cursor: pointer; min-height: 32px; }

    .su-btns { margin-top: 16px; }
    .check { min-height: 40px; }

    /* ---------- live layout ---------- */
    .lv { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }

    .lv-col { display: grid; gap: 16px; min-width: 0; }

    /* ---------- the scoreboard (the one bold thing: a painted ground scoreboard) ---------- */
    .board { background: var(--board); color: var(--board-ink); border-radius: 18px; padding: 16px 18px 14px; box-shadow: var(--shadow);
      background-image: repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.025) 46px 92px); }
    .b-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--board-dim); font-weight: 600; font-size: .9rem; }
    .b-top .grow { flex: 1 1 auto; }
    .b-fh { background: var(--board-hot); color: #1d1a05; border-radius: 6px; padding: 1px 8px; font-weight: 800; }
    .b-fsbtn { background: transparent; color: var(--board-ink); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; min-height: 40px; padding: 4px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
    .b-fsbtn:hover { background: rgba(255,255,255,.08); }

    .b-score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .b-total { font-size: clamp(3rem, 13vw, 4.6rem); font-weight: 800; line-height: 1; color: var(--board-hot); letter-spacing: -.02em; }
    .b-ov { font-size: 1.35rem; font-weight: 700; }
    .b-ov small { font-size: .8rem; color: var(--board-dim); font-weight: 600; }
    .b-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; }
    .b-stat span { display: block; font-size: .78rem; color: var(--board-dim); font-weight: 600; }
    .b-stat b { font-size: 1.2rem; }
    .b-need { margin-top: 10px; font-weight: 700; font-size: 1.05rem; }
    .b-need:empty, .b-result:empty, .b-toss:empty { display: none; }
    .b-toss { margin-top: 6px; font-size: .86rem; color: var(--board-dim); }
    .b-result { margin-top: 10px; background: var(--board-hot); color: #1d1a05; font-weight: 800; font-size: 1.15rem; border-radius: 10px; padding: 8px 12px; }
    .b-rows { display: grid; gap: 2px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 10px; }
    .b-row { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
    .b-row .nm { overflow-wrap: anywhere; min-width: 0; }
    .b-row.on .nm { font-weight: 800; }
    .b-row.on .nm::after { content: " *"; color: var(--board-hot); }
    .b-row .fig { font-weight: 700; white-space: nowrap; }
    .b-row.bw { color: var(--board-dim); margin-top: 4px; }
    .b-over { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .b-over > span { color: var(--board-dim); font-size: .82rem; font-weight: 600; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .bc { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; display: inline-grid; place-items: center; font-weight: 800; font-size: .82rem;
      background: rgba(255,255,255,.12); color: var(--board-ink); direction: ltr; }
    .bc.b4 { background: #2f80ed; color: #fff; } .bc.b6 { background: #8e44ef; color: #fff; }
    .bc.bw { background: #e5484d; color: #fff; } .bc.bx { background: transparent; border: 1px dashed rgba(255,255,255,.5); }
    .b-part { margin-top: 8px; font-size: .86rem; color: var(--board-dim); }
    .b-part:empty { display: none; }
    :root[lang="ur"] .b-total, :root[lang="ur"] .b-ov, :root[lang="ur"] .bc, :root[lang="ur"] .num { font-family: "Noto Sans", system-ui, sans-serif; }

    /* fullscreen / tripod mode */
    html.cs-noscroll, html.cs-noscroll body { overflow: hidden; }
    .board.is-fs { position: fixed; inset: 0; z-index: 800; border-radius: 0; padding: 4vh 5vw; display: flex; flex-direction: column; justify-content: center; overflow: auto; }
    .board.is-fs .b-top { font-size: 2.6vh; }
    .board.is-fs .b-team { font-size: 5vh; }
    .board.is-fs .b-total { font-size: min(24vh, 22vw); }
    .board.is-fs .b-ov { font-size: 5vh; }
    .board.is-fs .b-ov small { font-size: 2.6vh; }
    .board.is-fs .b-stat span { font-size: 2.2vh; } .board.is-fs .b-stat b { font-size: 4.2vh; }
    .board.is-fs .b-stats { gap: 1vh 5vw; }
    .board.is-fs .b-need, .board.is-fs .b-result { font-size: 4vh; }
    .board.is-fs .b-row { font-size: 3.4vh; }
    .board.is-fs .bc { min-width: 6vh; height: 6vh; border-radius: 3vh; font-size: 2.8vh; }
    .board.is-fs .b-toss, .board.is-fs .b-part { font-size: 2.4vh; }

    /* ---------- prompts ---------- */
    .prompt { border: 2px solid var(--accent); }
    .prompt:empty { display: none; }
    .prompt p { margin: 0 0 10px; font-weight: 700; }
    .picks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .pick { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-height: 48px; }
    .pick small { color: var(--muted); font-weight: 500; font-size: .76rem; }
    .pick.warnd { border-color: color-mix(in srgb, var(--warning) 60%, var(--border)); }
    .pick.warnd small { color: var(--warning); }
    .op-grid { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 12px; }
    @media (max-width: 640px) { .op-grid { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- scoring pad ---------- */
    .pad-runs { display: grid; gap: 8px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .key { min-height: 58px; font-size: 1.5rem; font-weight: 800; border-radius: 14px; padding: 4px; }
    .key.k4 { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .key.k6 { background: #c2410c; border-color: #c2410c; color: #fff; }
    .pad-x { display: grid; gap: 8px; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 8px; }
    .pad-x .btn { min-height: 50px; padding: 6px 4px; font-size: .9rem; overflow-wrap: anywhere; line-height: 1.15; }
    .pad-x .btn[aria-pressed="true"] { background: var(--warning-soft); border-color: var(--warning); border-width: 2px; }
    .btn-out { background: #b42318; border-color: #b42318; color: #fff; }
    .btn-out:hover { background: #b42318; filter: brightness(1.1); }
    @media (max-width: 420px) { .pad-runs { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pad-x { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pad-x .btn-out { grid-column: 1 / -1; } }
    .arm { min-height: 1.4em; margin: 8px 0 0; font-weight: 600; }
    .arm.on { color: var(--warning); }
    .pad-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .pad-tools .btn { flex: 1 1 auto; }
    .pad.off .pad-runs, .pad.off .pad-x { opacity: .45; }
    :root[lang="ta"] .pad-x .btn, :root[lang="ml"] .pad-x .btn { font-size: .78rem; }

    /* ---------- tables ---------- */
    .table td.n, .table th.n { text-align: end; white-space: nowrap; }
    .table .how { display: block; color: var(--muted); font-size: .8rem; }
    .table tr.on td:first-child { font-weight: 800; }
    .table tfoot td { font-weight: 700; background: var(--surface-2); }
    @media (max-width: 480px) { .table th, .table td { padding: 6px 5px; font-size: .84rem; } }
    .fow { margin: 6px 0 0; font-size: .88rem; line-height: 1.7; }
    .sc-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .sc-tabs .chip { min-height: 40px; }
    .sc-inn + .sc-inn { margin-top: 18px; }
    .sc-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .sc-head b { font-size: 1.1rem; }
    .sc-meta { font-size: .88rem; margin: 8px 0; }
    .result-line { font-weight: 800; font-size: 1.05rem; }
    .result-line:empty { display: none; }

    /* ---------- chart ---------- */
    .chart-box { margin-top: 18px; }
    .chart { width: 100%; min-height: 200px; }
    .chart svg { display: block; width: 100%; height: auto; }
    .chart .grid { stroke: var(--border); stroke-width: 1; }
    .chart .tick { fill: var(--muted); font-size: 11px; }
    .chart .s1 { fill: var(--s1); } .chart .s2 { fill: var(--s2); }
    .chart .wk { fill: var(--text); stroke: var(--surface); stroke-width: 2; }
    .chart rect.bar:hover, .chart rect.bar:focus { opacity: .8; outline: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; margin-top: 6px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
    .legend .wk-k { border-radius: 50%; background: var(--text); width: 9px; height: 9px; }
    .chart-tbl summary { cursor: pointer; font-weight: 600; min-height: 36px; margin-top: 6px; }

      .chart .grid { stroke: #ccc; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="callout success small privacy no-print"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>

    <!-- ============ SETUP ============ -->
    <section class="card" id="setupView" aria-labelledby="hSetup">
      <h2 id="hSetup" data-i18n="h_setup"></h2>
      <form id="setupForm" novalidate>
        <div class="su-grid">
          <div class="field"><label for="suT1" data-i18n="lbl_team1"></label><input id="suT1" type="text" class="no-i18n" maxlength="30" autocomplete="off"></div>
          <div class="field"><label for="suT2" data-i18n="lbl_team2"></label><input id="suT2" type="text" class="no-i18n" maxlength="30" autocomplete="off"></div>
          <div class="field">
            <label for="suPps" data-i18n="lbl_pps"></label>
            <div class="su-num"><input id="suPps" type="number" min="2" max="11" step="1" inputmode="numeric"><span class="hint">2–11</span></div>
          </div>
          <div class="field">
            <label for="suOvers" data-i18n="lbl_overs"></label>
            <div class="su-num"><input id="suOvers" type="number" min="1" max="50" step="1" inputmode="numeric">
              <label class="check"><input type="checkbox" id="suUnl"> <span data-i18n="lbl_unlimited"></span></label></div>
          </div>
          <div class="field"><label for="suP1" id="suP1L"></label><textarea id="suP1" class="no-i18n" rows="4" aria-describedby="suPH"></textarea><span class="hint" id="suP1C"></span></div>
          <div class="field"><label for="suP2" id="suP2L"></label><textarea id="suP2" class="no-i18n" rows="4" aria-describedby="suPH"></textarea><span class="hint" id="suP2C"></span></div>
          <p class="hint wide mb0" id="suPH" data-i18n="hint_players"></p>
          <div class="field"><label for="suToss" data-i18n="lbl_toss"></label><select id="suToss" class="no-i18n"></select></div>
          <div class="field"><span class="lbl" id="suDecL"><b data-i18n="lbl_decision"></b></span>
            <div class="seg" role="group" aria-labelledby="suDecL" id="suDec">
              <button type="button" data-v="bat" id="decBat" data-i18n="opt_bat"></button><button type="button" data-v="bowl" id="decBowl" data-i18n="opt_bowl"></button>
            </div>
          </div>
        </div>
        <details class="su-rules" id="suRules">
          <summary data-i18n="h_rules"></summary>
          <div class="su-grid">
            <div class="field"><label for="suWd" data-i18n="lbl_wide"></label>
              <select id="suWd"><option value="1" data-i18n="opt_run_reball"></option><option value="0" data-i18n="opt_norun_reball"></option></select></div>
            <div class="field"><label for="suNb" data-i18n="lbl_noball"></label>
              <select id="suNb"><option value="1" data-i18n="opt_run_reball"></option><option value="0" data-i18n="opt_norun_reball"></option></select></div>
            <label class="check"><input type="checkbox" id="suFh"> <span data-i18n="lbl_freehit"></span></label>
            <label class="check"><input type="checkbox" id="suAlone"> <span data-i18n="lbl_lastalone"></span></label>
            <div class="field"><label for="suMax" data-i18n="lbl_maxov"></label>
              <div class="su-num"><input id="suMax" type="number" min="0" max="50" step="1" inputmode="numeric"><span class="hint" data-i18n="hint_maxov"></span></div></div>
          </div>
          <p class="hint mb0" style="margin-top:10px" data-i18n="rules_note"></p>
        </details>
        <div class="row su-btns">
          <button type="submit" class="btn btn-primary btn-lg" id="btnStart"><span aria-hidden="true">🏏</span> <span data-i18n="btn_start"></span></button>
          <button type="button" class="btn" id="btnSample" data-i18n="btn_sample"></button>
        </div>
      </form>
    </section>

    <!-- ============ LIVE ============ -->
    <div class="lv" id="liveView" hidden>
      <div class="lv-col">
        <div class="board" id="board" aria-live="polite">
          <div class="b-top"><span id="bInn"></span><span class="b-fh" id="bFh" hidden data-i18n="free_hit"></span><span class="grow"></span>
            <button type="button" class="b-fsbtn no-print" id="btnBoard"></button></div>
          <div class="b-team no-i18n" id="bTeam"></div>
          <div class="b-score"><span class="b-total num" id="sTotal">0/0</span>
            <span class="b-ov"><bdi class="num" dir="ltr"><span id="sOvers">0</span><span id="sOvMax"></span></bdi> <small data-i18n="lbl_overs_word"></small></span></div>
          <div class="b-stats">
            <div class="b-stat"><span data-i18n="lbl_crr"></span><b class="num" id="sCrr">-</b></div>
            <div class="b-stat" id="stTarget" hidden><span data-i18n="lbl_target"></span><b class="num" id="sTarget"></b></div>
            <div class="b-stat" id="stRrr" hidden><span data-i18n="lbl_rrr"></span><b class="num" id="sRrr"></b></div>
          </div>
          <div class="b-need" id="bNeed"></div>
          <div class="b-result" id="bResult"></div>
          <div class="b-rows no-i18n" id="bRows"></div>
          <div class="b-over"><span data-i18n="lbl_this_over"></span><div class="chips no-i18n" id="bOver"></div></div>
          <div class="b-part" id="bPart"></div>
          <div class="b-toss" id="bToss"></div>
        </div>

        <div class="card prompt" id="prompt"></div>

        <section class="card pad" id="pad" aria-labelledby="padH">
          <h2 class="sr-only" id="padH" data-i18n="btn_wkt"></h2>
          <div class="pad-runs" id="padRuns">
            <button type="button" class="btn key" data-run="0" id="run0">0</button><button type="button" class="btn key" data-run="1" id="run1">1</button><button type="button" class="btn key" data-run="2" id="run2">2</button><button type="button" class="btn key" data-run="3" id="run3">3</button><button type="button" class="btn key k4" data-run="4" id="run4">4</button><button type="button" class="btn key" data-run="5" id="run5">5</button><button type="button" class="btn key k6" data-run="6" id="run6">6</button>
          </div>
          <div class="pad-x">
            <button type="button" class="btn" id="xWd" data-x="wd" aria-pressed="false" data-i18n="btn_wd"></button>
            <button type="button" class="btn" id="xNb" data-x="nb" aria-pressed="false" data-i18n="btn_nb"></button>
            <button type="button" class="btn" id="xB" data-x="b" aria-pressed="false" data-i18n="btn_bye"></button>
            <button type="button" class="btn" id="xLb" data-x="lb" aria-pressed="false" data-i18n="btn_lb"></button>
            <button type="button" class="btn btn-out" id="btnWkt" data-i18n="btn_wkt"></button>
          </div>
          <p class="arm hint" id="armHint" aria-live="polite"></p>
          <div class="pad-tools">
            <button type="button" class="btn" id="btnUndo"><span aria-hidden="true">↶</span> <span data-i18n="btn_undo"></span></button>
            <button type="button" class="btn" id="btnSwap"><span aria-hidden="true">⇄</span> <span data-i18n="btn_swap"></span></button>
            <button type="button" class="btn" id="btnChBowl" data-i18n="btn_chbowl"></button>
            <button type="button" class="btn" id="btnRetire" data-i18n="btn_retire"></button>
            <button type="button" class="btn btn-danger" id="btnEnd" data-i18n="btn_end"></button>
          </div>
          <p class="tiny muted mb0" style="margin-top:10px" data-i18n="key_hint"></p>
        </section>
      </div>

      <div class="lv-col" id="lvTables">
        <section class="card" aria-labelledby="hBat">
          <h2 id="hBat" data-i18n="sum_top_bat"></h2>
          <div class="scroll-x"><table class="table" id="tBat"></table></div>
          <h2 style="margin-top:16px" data-i18n="sum_top_bowl"></h2>
          <div class="scroll-x"><table class="table" id="tBowl"></table></div>
          <h3 style="margin-top:16px" data-i18n="lbl_fow"></h3>
          <p class="fow" id="lvFow"></p>
        </section>
        <div class="row">
          <button type="button" class="btn" id="btnNew"><span aria-hidden="true">＋</span> <span data-i18n="btn_newmatch"></span></button>
        </div>
      </div>
    </div>

    <!-- ============ SCORECARD ============ -->
    <section class="card" id="scCard" aria-labelledby="hSc">
      <h2 id="hSc" data-i18n="h_scorecard"></h2>
      <div class="callout warning small row spread" id="scSaved" hidden><span data-i18n="viewing_saved"></span><button type="button" class="btn btn-sm" id="btnCloseSaved" data-i18n="btn_back_live"></button></div>
      <p class="result-line" id="scResult" aria-live="polite"></p>
      <div id="scBody"></div>
      <div class="chart-box" id="chartBox">
        <h3 data-i18n="h_chart"></h3>
        <div class="chart" id="chart"></div>
        <div class="legend no-i18n" id="legend"></div>
        <details class="chart-tbl"><summary data-i18n="show_table"></summary><div class="scroll-x"><table class="table" id="chartTbl"></table></div></details>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btnCopy"><span aria-hidden="true">⧉</span> <span data-i18n="btn_copy_sum"></span></button>
        <a class="btn btn-wa" id="btnWa" href="#" target="_blank" rel="noopener"><span aria-hidden="true">💬</span> <span data-i18n="btn_wa_sum"></span></a>
        <button type="button" class="btn" id="btnPrint"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
      </div>
    </section>

    <!-- ============ HISTORY ============ -->
    <section class="card" id="histCard" aria-labelledby="hHist">
      <h2 id="hHist" data-i18n="h_history"></h2>
      <div class="hist" id="histList"></div>
    </section>

    <details class="card help no-print">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li><li data-i18n="tip5"></li><li data-i18n="tip6"></li>
      </ul>
    </details>

    <div class="foot-row no-print">
      <button type="button" class="btn btn-danger btn-sm" id="btnReset" data-i18n="reset"></button>
      <span class="tiny muted" data-i18n="saved_local"></span>
    </div>
  </main>
  <script src="../../../apps/cricket-scorer/../../shared/edu.js"></script>
  <script src="../../../apps/cricket-scorer/strings.js"></script>
  <script src="../../../apps/cricket-scorer/engine.js"></script>
  <script src="../../../apps/cricket-scorer/app.js"></script>
</body>
</html>
