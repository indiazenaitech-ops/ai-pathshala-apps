<body>
  <main id="app" data-state="empty">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success pe-privacy" role="note">
      <span class="pe-ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <section class="card pe-drop" id="drop" tabindex="0" role="button" aria-labelledby="dropTitle">
      <div class="pe-drop-ico" aria-hidden="true">🖼️</div>
      <div class="pe-drop-txt">
        <strong id="dropTitle" data-i18n="drop_title"></strong>
        <span class="small muted" data-i18n="drop_hint"></span>
      </div>
      <div class="pe-drop-btns">
        <button class="btn btn-primary btn-lg" id="pickBtn" type="button"><span aria-hidden="true">＋</span> <span data-i18n="pick_photo"></span></button>
        <button class="btn" id="sampleBtn" type="button" data-i18n="try_sample"></button>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </section>
    <div class="callout danger" id="fileErr" role="alert" hidden style="margin-top:12px"></div>

    <div class="pe-layout">
      <!-- ============ viewer ============ -->
      <section class="pe-col" aria-labelledby="hView">
        <div class="card" id="viewer" hidden>
          <div class="pe-vhead">
            <h2 id="hView" data-i18n="h_view"></h2>
            <label class="check small"><input type="checkbox" id="zoom1"> <span data-i18n="zoom_100"></span></label>
          </div>
          <div class="pe-cmpbox" id="cmpBox">
            <div class="pe-cmp" id="cmp" dir="ltr">
              <canvas id="cvAfter" width="10" height="10"></canvas>
              <canvas id="cvBefore" width="10" height="10"></canvas>
              <div class="pe-line" id="cmpLine"></div>
              <span class="pe-tag b" data-i18n="before"></span>
              <span class="pe-tag a" data-i18n="after"></span>
            </div>
          </div>
          <input type="range" id="cmpRange" min="0" max="100" value="50" data-i18n-aria-label="compare_aria" aria-label="compare">
          <div class="pe-vinfo">
            <span class="small pe-name no-i18n" id="fileName"></span>
            <span class="small muted" id="sizeInfo" aria-live="polite"></span>
          </div>
          <div class="pe-badge-row" id="badges" style="margin-top:8px"></div>
          <p class="small muted mb0" id="shrunkNote" hidden style="margin-top:8px"></p>
        </div>
        <div class="card pe-empty" id="empty">
          <div class="pe-big" aria-hidden="true">✨</div>
          <p class="mb0" data-i18n="empty"></p>
        </div>
        <p class="callout warning pe-note mb0" data-i18n="honest"></p>
      </section>

      <!-- ============ controls ============ -->
      <section class="card stack" id="controls" aria-label="settings" data-i18n-aria-label="settings">
        <div class="pe-sec">
          <h2><span class="pe-num" aria-hidden="true">1</span> <span data-i18n="h_ai"></span></h2>
          <div class="field">
            <span data-i18n="scale_label"></span>
            <div class="seg pe-seg no-i18n" role="group" id="scaleSeg" aria-label="scale" data-i18n-aria-label="scale_label">
              <button type="button" id="scale-2" data-scale="2" dir="ltr">2×</button>
              <button type="button" id="scale-4" data-scale="4" dir="ltr">4×</button>
            </div>
          </div>
          <div class="field">
            <span data-i18n="model_label"></span>
            <div class="seg pe-seg" role="group" id="modelSeg" aria-label="model" data-i18n-aria-label="model_label">
              <button type="button" id="model-best" data-model="best" data-i18n="m_best"></button>
              <button type="button" id="model-quick" data-model="quick" data-i18n="m_quick"></button>
            </div>
            <span class="hint" id="modelHint"></span>
          </div>
          <label class="pe-check small" id="gpuRow" hidden><input type="checkbox" id="gpu"> <span id="gpuLabel"></span></label>
          <p class="callout pe-note mb0" id="aiNote"></p>
          <div class="pe-actions">
            <button class="btn btn-primary btn-lg" id="enhanceBtn" type="button" disabled><span aria-hidden="true">✨</span> <span data-i18n="enhance_btn"></span></button>
          </div>
          <div class="pe-status" id="statusBox" hidden>
            <div class="progress" id="barWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="bar" style="width:0%"></span></div>
            <p class="small" id="statusText" aria-live="polite"></p>
            <div class="pe-actions"><button class="btn btn-sm" id="cancelBtn" type="button" data-i18n="cancel"></button></div>
          </div>
          <div class="callout danger pe-status" id="errBox" role="alert" hidden>
            <p class="small" id="errText"></p>
            <div class="pe-actions"><button class="btn btn-sm" id="retryBtn" type="button" data-i18n="try_again"></button></div>
          </div>
        </div>

        <div class="pe-sec">
          <h2><span class="pe-num" aria-hidden="true">2</span> <span data-i18n="h_fix"></span></h2>
          <label class="pe-check"><input type="checkbox" id="fixAuto"> <span data-i18n="fix_auto"></span></label>
          <label class="pe-check"><input type="checkbox" id="fixOld"> <span data-i18n="fix_old"></span></label>
          <div class="field">
            <span data-i18n="color_label"></span>
            <div class="seg pe-seg" role="group" id="colorSeg" aria-label="colour" data-i18n-aria-label="color_label">
              <button type="button" id="color-keep" data-color="keep" data-i18n="c_keep"></button>
              <button type="button" id="color-sepia" data-color="sepia" data-i18n="c_sepia"></button>
              <button type="button" id="color-bw" data-color="bw" data-i18n="c_bw"></button>
            </div>
          </div>
        </div>

        <div class="pe-sec">
          <h2><span class="pe-num" aria-hidden="true">3</span> <span data-i18n="h_save"></span></h2>
          <div class="field">
            <span data-i18n="save_size_label"></span>
            <div class="seg pe-seg" role="group" id="sizeSeg" aria-label="size" data-i18n-aria-label="save_size_label">
              <button type="button" id="size-enh" data-size="enh"></button>
              <button type="button" id="size-orig" data-size="orig"></button>
            </div>
          </div>
          <div class="field">
            <span data-i18n="fmt_label"></span>
            <div class="seg pe-seg no-i18n" role="group" id="fmtSeg" aria-label="format" data-i18n-aria-label="fmt_label">
              <button type="button" id="fmt-jpg" data-fmt="jpg">JPG</button>
              <button type="button" id="fmt-png" data-fmt="png">PNG</button>
            </div>
            <span class="hint" data-i18n="fmt_hint"></span>
          </div>
          <div class="pe-actions">
            <button class="btn btn-accent" id="dlBtn" type="button" disabled><span aria-hidden="true">⬇</span> <span data-i18n="download"></span></button>
          </div>
        </div>

        <div class="pe-sec row spread">
          <span class="tiny muted" data-i18n="settings_saved"></span>
          <button type="button" class="btn btn-sm btn-danger" id="resetBtn" data-i18n="reset_settings"></button>
        </div>
      </section>
    </div>

    <details class="card pe-help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
    <details class="card pe-help no-print">
      <summary data-i18n="inside_title"></summary>
      <ul>
        <li data-i18n="inside1"></li>
        <li data-i18n="inside2"></li>
        <li data-i18n="inside3"></li>
        <li id="inside4"></li>
        <li data-i18n="inside5"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/photo-enhancer/../../shared/edu.js"></script>
  <script src="../../../apps/photo-enhancer/strings.js"></script>
  <script src="../../../apps/photo-enhancer/data.js"></script>
  <script src="../../../apps/photo-enhancer/app.js"></script>
</body>
