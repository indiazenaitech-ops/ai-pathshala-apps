        <div class="st-dec">
          <span class="st-lbl" id="lbl-dec" data-i18n="decimals"></span>
          <div class="seg" role="group" aria-labelledby="lbl-dec">
            <button type="button" id="dec-1">1</button><button type="button" id="dec-2">2</button><button type="button" id="dec-3">3</button><button type="button" id="dec-4">4</button>
          </div>
        </div>
      </section>

      <div class="st-right">
        <!-- ================= results ================= -->
        <section class="card st-summary" aria-labelledby="h-res">
          <div class="st-head">
            <h2 id="h-res" data-i18n="results"></h2>
            <button type="button" class="btn btn-sm no-print" id="copy-res">⧉ <span data-i18n="copy_results"></span></button>
          </div>
          <p class="muted small st-sub-title" id="res-sub"></p>
          <div class="st-tiles" id="tiles" aria-live="polite"></div>
        </section>

        <!-- ================= chart ================= -->
        <section class="card st-chart" id="chart-card" aria-labelledby="h-chart">
          <div class="st-head">
            <h2 id="h-chart" data-i18n="graphs"></h2>
            <div class="row no-print">
              <button type="button" class="btn btn-sm" id="ch-dl" data-i18n-title="download" data-i18n-aria-label="download">⤓</button>
              <button type="button" class="btn btn-sm" id="ch-fs" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
            </div>
          </div>
          <div class="seg no-print" role="group" aria-labelledby="h-chart" style="margin-bottom:10px">
            <button type="button" id="ch-hist" data-i18n="ch_hist"></button>
            <button type="button" id="ch-poly" data-i18n="ch_poly"></button>
            <button type="button" id="ch-ogive" data-i18n="ch_ogive"></button>
          </div>
          <div class="stage" id="chart-stage"><canvas id="chart" role="img" data-i18n-aria-label="chart_label"></canvas></div>
          <p class="muted small" id="chart-note" aria-live="polite"></p>
        </section>
      </div>

      <!-- ================= working ================= -->
      <section class="card st-work" id="work-card" aria-labelledby="h-work">
        <div class="st-head">
          <h2 id="h-work" data-i18n="working"></h2>
          <div class="row no-print">
            <button type="button" class="btn btn-sm" id="print">🖨 <span data-i18n="print"></span></button>
            <button type="button" class="btn btn-sm" id="work-fs">⛶ <span data-i18n="fullscreen"></span></button>
          </div>
        </div>
        <div class="tabs" role="tablist" aria-labelledby="h-work">
          <button type="button" role="tab" id="tab-mean" aria-controls="panel-mean" data-i18n="tab_mean"></button>
          <button type="button" role="tab" id="tab-median" aria-controls="panel-median" data-i18n="tab_median"></button>
          <button type="button" role="tab" id="tab-mode" aria-controls="panel-mode" data-i18n="tab_mode"></button>
          <button type="button" role="tab" id="tab-quart" aria-controls="panel-quart" data-i18n="tab_quart"></button>
          <button type="button" role="tab" id="tab-spread" aria-controls="panel-spread" data-i18n="tab_spread"></button>
        </div>

        <div class="st-out-panel" role="tabpanel" id="panel-mean" aria-labelledby="tab-mean">
          <h3 class="print-only" data-i18n="tab_mean"></h3>
          <div class="st-ctl" id="mean-ctl">
            <div class="field">
              <span class="st-lbl" id="lbl-mm" data-i18n="method"></span>
              <div class="seg" role="group" aria-labelledby="lbl-mm">
                <button type="button" id="mm-direct" data-i18n="m_direct"></button>
                <button type="button" id="mm-assumed" data-i18n="m_assumed"></button>
                <button type="button" id="mm-step" data-i18n="m_step"></button>
              </div>
            </div>
            <div class="st-ah" id="ah-mean">
              <label class="field"><span data-i18n="a_label"></span><input type="text" inputmode="decimal" class="in-a" id="in-a" autocomplete="off"></label>
              <label class="field"><span class="lbl-h"></span><input type="text" inputmode="decimal" class="in-h" id="in-h" autocomplete="off"></label>
            </div>
          </div>
          <div class="st-out" id="out-mean" aria-live="polite"></div>
          <p class="no-print"><button type="button" class="btn btn-sm copy-tbl" data-panel="mean">⧉ <span data-i18n="copy_table"></span></button></p>
        </div>

        <div class="st-out-panel" role="tabpanel" id="panel-median" aria-labelledby="tab-median" hidden>
          <h3 class="print-only" data-i18n="tab_median"></h3>
          <div class="st-out" id="out-median"></div>
          <p class="no-print"><button type="button" class="btn btn-sm copy-tbl" data-panel="median">⧉ <span data-i18n="copy_table"></span></button></p>
        </div>

        <div class="st-out-panel" role="tabpanel" id="panel-mode" aria-labelledby="tab-mode" hidden>
          <h3 class="print-only" data-i18n="tab_mode"></h3>
          <div class="st-out" id="out-mode"></div>
          <p class="no-print"><button type="button" class="btn btn-sm copy-tbl" data-panel="mode">⧉ <span data-i18n="copy_table"></span></button></p>
        </div>

        <div class="st-out-panel" role="tabpanel" id="panel-quart" aria-labelledby="tab-quart" hidden>
          <h3 class="print-only" data-i18n="tab_quart"></h3>
          <div class="st-out" id="out-quart"></div>
          <p class="no-print"><button type="button" class="btn btn-sm copy-tbl" data-panel="quart">⧉ <span data-i18n="copy_table"></span></button></p>
        </div>

        <div class="st-out-panel" role="tabpanel" id="panel-spread" aria-labelledby="tab-spread" hidden>
          <h3 class="print-only" data-i18n="tab_spread"></h3>
          <div class="st-ctl" id="spread-ctl">
            <div class="field">
              <span class="st-lbl" id="lbl-vm" data-i18n="method"></span>
              <div class="seg" role="group" aria-labelledby="lbl-vm">
                <button type="button" id="vm-dev" data-i18n="vm_dev"></button>
                <button type="button" id="vm-short" data-i18n="vm_short"></button>
              </div>
            </div>
            <div class="st-ah" id="ah-spread">
              <label class="field"><span data-i18n="a_label"></span><input type="text" inputmode="decimal" class="in-a" id="in-a2" autocomplete="off"></label>
              <label class="field"><span class="lbl-h"></span><input type="text" inputmode="decimal" class="in-h" id="in-h2" autocomplete="off"></label>
            </div>
          </div>
          <div class="st-out" id="out-spread"></div>
          <p class="no-print"><button type="button" class="btn btn-sm copy-tbl" data-panel="spread">⧉ <span data-i18n="copy_table"></span></button></p>
        </div>
      </section>
    </div>
  </main>
  <script src="../../../apps/statistics-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/statistics-calculator/strings.js"></script>
  <script src="../../../apps/statistics-calculator/stats.js"></script>
  <script src="../../../apps/statistics-calculator/chart.js"></script>
  <script src="../../../apps/statistics-calculator/app.js"></script>
</body>
</html>
