          <h2 class="spr-h"><span class="num" aria-hidden="true">1</span> <span id="hSizes" data-i18n="h_sizes"></span></h2>
          <p class="small muted" data-i18n="sizes_hint"></p>
          <div class="seg spr-pf no-i18n" id="pfSeg" role="tablist" data-i18n-aria-label="h_sizes" aria-label="platform"></div>
          <div class="spr-presets" id="presetGrid"></div>
          <div class="spr-custom" id="customBox" hidden>
            <label class="field"><span data-i18n="custom_w"></span><input type="number" id="customW" min="16" max="4096" step="1" inputmode="numeric"></label>
            <label class="field"><span data-i18n="custom_h"></span><input type="number" id="customH" min="16" max="4096" step="1" inputmode="numeric"></label>
            <p class="tiny muted mb0" style="grid-column:1/-1" data-i18n="custom_hint"></p>
          </div>
          <div class="spr-selrow">
            <span class="small" id="selCount" aria-live="polite"></span>
            <span class="row" style="gap:6px">
              <button type="button" class="btn btn-sm" id="selAll" data-i18n="sel_all"></button>
              <button type="button" class="btn btn-sm" id="selNone" data-i18n="sel_none"></button>
            </span>
          </div>
        </section>

        <!-- ============ download ============ -->
        <section class="card stack spr-dl" id="exportCard" aria-labelledby="hExport">
          <h2 class="spr-h mb0"><span class="num" aria-hidden="true">3</span> <span id="hExport" data-i18n="h_export"></span></h2>
          <div class="field">
            <span data-i18n="fmt_label"></span>
            <div class="seg spr-seg no-i18n" role="group" id="fmtSeg" data-i18n-aria-label="fmt_label" aria-label="format">
              <button type="button" id="fmt-jpg" data-fmt="jpg">JPG</button>
              <button type="button" id="fmt-png" data-fmt="png">PNG</button>
            </div>
            <span class="hint" id="fmtHint"></span>
          </div>
          <label class="field" for="quality" id="qualityField"><span data-i18n="quality"></span>
            <span class="spr-rangerow"><input type="range" id="quality" min="50" max="100" step="1" value="90"><output id="qualityOut" for="quality" class="no-i18n">90</output></span>
          </label>
          <p class="small muted mb0" id="estSize" aria-live="polite"></p>
          <button class="btn btn-primary btn-lg" id="dlThis" type="button"><span aria-hidden="true">⬇</span> <span id="dlThisTxt"></span></button>
          <button class="btn btn-lg" id="dlAll" type="button"><span aria-hidden="true">⬇</span> <span id="dlAllTxt"></span></button>
          <button class="btn" id="shareBtn" type="button" hidden><span aria-hidden="true">↗</span> <span data-i18n="share_btn"></span></button>
          <p class="small muted spr-status no-i18n" id="status" aria-live="polite"></p>
          <p class="tiny muted mb0" data-i18n="dl_many_hint"></p>
          <div class="row spread">
            <span class="tiny muted" data-i18n="saved_local"></span>
            <button type="button" class="btn btn-sm btn-danger" id="resetAll" data-i18n="reset_all"></button>
          </div>
        </section>
      </div>
    </div>

    <details class="card spr-help no-print" id="helpBox" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/social-post-resizer/../../shared/edu.js"></script>
  <script src="../../../apps/social-post-resizer/strings.js"></script>
  <script src="../../../apps/social-post-resizer/app.js"></script>
</body>
</html>
