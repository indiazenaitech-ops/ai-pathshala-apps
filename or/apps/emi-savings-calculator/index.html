    <div class="fc-top no-print">

      <span class="badge"><span aria-hidden="true">⌨</span> <span data-i18n="kbd_hint"></span></span>
    </div>

    <div class="fc-tabs no-print" role="tablist" id="tabs" data-i18n-aria-label="tabs_label">
      <button type="button" role="tab" id="tab-emi" data-tab="emi" aria-controls="p-emi"><span class="ic" aria-hidden="true">🏠</span><span data-i18n="tab_emi"></span></button>
      <button type="button" role="tab" id="tab-sip" data-tab="sip" aria-controls="p-sip"><span class="ic" aria-hidden="true">📈</span><span data-i18n="tab_sip"></span></button>
      <button type="button" role="tab" id="tab-fd" data-tab="fd" aria-controls="p-fd"><span class="ic" aria-hidden="true">🏦</span><span data-i18n="tab_fd"></span></button>
      <button type="button" role="tab" id="tab-ppf" data-tab="ppf" aria-controls="p-ppf"><span class="ic" aria-hidden="true">🛡️</span><span data-i18n="tab_ppf"></span></button>
    </div>

    <!-- ============================================================ EMI -->
    <section id="p-emi" class="fc-panel" role="tabpanel" aria-labelledby="tab-emi">
      <div class="fc-split">
        <div class="card fc-form" id="emiForm">
          <h2 data-i18n="loan_details"></h2>
          <div class="fc-presets" id="presets" role="group" data-i18n-aria-label="loan_type">
            <button type="button" class="chip" data-preset="home"><span aria-hidden="true">🏠</span> <span data-i18n="preset_home"></span></button>
            <button type="button" class="chip" data-preset="car"><span aria-hidden="true">🚗</span> <span data-i18n="preset_car"></span></button>
            <button type="button" class="chip" data-preset="bike"><span aria-hidden="true">🛵</span> <span data-i18n="preset_bike"></span></button>
            <button type="button" class="chip" data-preset="personal"><span aria-hidden="true">👤</span> <span data-i18n="preset_personal"></span></button>
            <button type="button" class="chip" data-preset="edu"><span aria-hidden="true">🎓</span> <span data-i18n="preset_edu"></span></button>
          </div>
          <div data-f="emiAmt"></div>
          <div data-f="emiRate"></div>
          <div class="field">
            <span class="fc-lbl" data-i18n="f_tenure"></span>
            <div class="fc-pair"><div data-f="emiYrs"></div><div data-f="emiMos"></div></div>
            <input type="range" class="nf-range" id="emiYrsR" min="0" max="30" step="1" tabindex="-1" aria-hidden="true">
            <span class="nf-hint" id="tenureHint"></span>
          </div>
          <div class="field">
            <label for="emiStart" data-i18n="f_start"></label>
            <input type="month" id="emiStart">
          </div>
          <p class="tiny muted mb0" data-i18n="rate_check"></p>
        </div>

        <div class="fc-col">
          <div class="card" id="emiRes" aria-live="polite"></div>
          <div class="card">
            <div class="fc-chart-head">
              <h3 id="emiChartTitle"></h3>
              <div class="seg" id="emiChartSeg" role="group" data-i18n-aria-label="chart_view">
                <button type="button" data-v="balance" data-i18n="ch_balance"></button>
                <button type="button" data-v="split" data-i18n="ch_split"></button>
              </div>
            </div>
            <div class="fc-chart" id="emiChart" tabindex="0"></div>
            <div class="fc-legend" id="emiLegend"></div>
          </div>
        </div>
      </div>

      <div class="card stack" id="chgCard">
        <div>
          <h2 data-i18n="chg_title"></h2>
          <p class="muted small mb0" data-i18n="chg_help"></p>
        </div>
        <div class="grid-2">
          <div class="panel stack">
            <h3 data-i18n="pp_title"></h3>
            <div class="fc-rows" id="ppList"></div>
            <button type="button" class="btn btn-sm no-print" id="ppAdd"><span aria-hidden="true">＋</span> <span data-i18n="pp_add"></span></button>
            <div class="field">
              <span class="fc-lbl" id="ppModeLbl" data-i18n="pp_mode"></span>
              <div class="seg fc-seg-full" id="ppMode" role="group" aria-labelledby="ppModeLbl">
                <button type="button" data-v="tenure" data-i18n="mode_tenure"></button>
                <button type="button" data-v="emi" data-i18n="mode_emi"></button>
              </div>
            </div>
            <div data-f="ppCharge"></div>
          </div>
          <div class="panel stack">
            <h3 data-i18n="rc_title"></h3>
            <div class="fc-rows" id="rcList"></div>
            <button type="button" class="btn btn-sm no-print" id="rcAdd"><span aria-hidden="true">＋</span> <span data-i18n="rc_add"></span></button>
            <div class="field">
              <span class="fc-lbl" id="rcModeLbl" data-i18n="rc_mode"></span>
              <div class="seg fc-seg-full" id="rcMode" role="group" aria-labelledby="rcModeLbl">
                <button type="button" data-v="tenure" data-i18n="rc_keep_emi"></button>
                <button type="button" data-v="emi" data-i18n="rc_keep_tenure"></button>
              </div>
            </div>
            <p class="tiny muted mb0" data-i18n="rc_help"></p>
          </div>
        </div>
        <div id="chgOut" aria-live="polite"></div>
      </div>

      <div class="card stack" id="schCard">
        <div class="fc-sch-head">
          <h2 data-i18n="sch_title"></h2>
          <div class="fc-sch-tools no-print">
            <div class="seg" id="schView" role="group" data-i18n-aria-label="sch_title">
              <button type="button" data-v="monthly" data-i18n="view_monthly"></button>
              <button type="button" data-v="yearly" data-i18n="view_yearly"></button>
              <button type="button" data-v="fy" data-i18n="view_fy"></button>
            </div>
            <button type="button" class="btn btn-sm" id="emiCsv"><span aria-hidden="true">⬇</span> <span data-i18n="csv_btn"></span></button>
            <button type="button" class="btn btn-sm" id="emiPrint"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <p class="tiny muted mb0" id="schNote"></p>
        <div class="fc-table-wrap"><table class="table fc-table" id="schTable"></table></div>
      </div>

      <h2 class="fc-sec no-print" data-i18n="tools_title"></h2>
      <p class="muted small no-print" data-i18n="tools_help"></p>
      <div class="grid-2 fc-tools no-print">
        <div class="card fc-tool" id="aprCard">
          <h3><span aria-hidden="true">🧾</span> <span data-i18n="apr_title"></span></h3>
          <p class="small muted" data-i18n="apr_help"></p>
          <div class="grid-2"><div data-f="aprFee"></div><div data-f="aprOther"></div></div>
          <label class="check"><input type="checkbox" id="aprGst"> <span data-i18n="apr_gst"></span></label>
          <div id="aprOut" class="fc-out" aria-live="polite"></div>
        </div>

        <div class="card fc-tool" id="flatCard">
          <h3><span aria-hidden="true">🏷️</span> <span data-i18n="flat_title"></span></h3>
          <p class="small muted" data-i18n="flat_help"></p>
          <div data-f="flAmt"></div>
          <div class="grid-2">
            <div data-f="flRate"></div>
            <div class="field">
              <span class="fc-lbl" id="flPerLbl" data-i18n="flat_per"></span>
              <div class="seg fc-seg-full" id="flPer" role="group" aria-labelledby="flPerLbl">
                <button type="button" data-v="month" data-i18n="per_month"></button>
                <button type="button" data-v="year" data-i18n="per_year"></button>
              </div>
            </div>
          </div>
          <div data-f="flN"></div>
          <div id="flatOut" class="fc-out" aria-live="polite"></div>
        </div>

        <div class="card fc-tool" id="ncCard">
          <h3><span aria-hidden="true">🛍️</span> <span data-i18n="nc_title"></span></h3>
          <p class="small muted" data-i18n="nc_help"></p>
          <div class="grid-2"><div data-f="ncPrice"></div><div data-f="ncN"></div></div>
          <div class="grid-2"><div data-f="ncRate"></div><div data-f="ncFee"></div></div>
          <div data-f="ncCash"></div>
          <div id="ncOut" class="fc-out" aria-live="polite"></div>
        </div>

        <div class="card fc-tool" id="afCard">
          <h3><span aria-hidden="true">⚖️</span> <span data-i18n="af_title"></span></h3>
          <p class="small muted" data-i18n="af_help"></p>
          <div class="grid-2"><div data-f="afInc"></div><div data-f="afOth"></div></div>
          <div data-f="afFoir"></div>
          <div id="afOut" class="fc-out" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <!-- ============================================================ SIP -->
    <section id="p-sip" class="fc-panel" role="tabpanel" aria-labelledby="tab-sip" hidden>
      <div class="fc-split">
        <div class="card fc-form" id="sipForm">
          <h2 data-i18n="sip_title"></h2>
          <div class="seg fc-seg-full" id="sipMode" role="group" data-i18n-aria-label="sip_title">
            <button type="button" data-v="grow" data-i18n="sip_grow"></button>
            <button type="button" data-v="goal" data-i18n="sip_goal"></button>
          </div>
          <div id="sipGoalBox" class="fc-form">
            <div data-f="sipGoal"></div>
            <label class="check"><input type="checkbox" id="sipToday"> <span data-i18n="sip_today"></span></label>
          </div>
          <div data-f="sipAmt" id="sipAmtBox"></div>
          <div data-f="sipStep"></div>
          <div data-f="sipRet"></div>
          <div data-f="sipYrs"></div>
          <div data-f="sipLump"></div>
          <div data-f="sipInf"></div>
        </div>
        <div class="fc-col">
          <div class="card" id="sipRes" aria-live="polite"></div>
          <div class="card">
            <div class="fc-chart-head"><h3 data-i18n="ch_growth"></h3></div>
            <div class="fc-chart" id="sipChart" tabindex="0"></div>
            <div class="fc-axis-note" data-i18n="ax_years"></div>
            <div class="fc-legend" id="sipLegend"></div>
          </div>
        </div>
      </div>
      <div class="card stack">
        <div class="fc-sch-head">
          <h2 data-i18n="yearwise"></h2>
          <div class="fc-sch-tools no-print">
            <button type="button" class="btn btn-sm" id="sipCsv"><span aria-hidden="true">⬇</span> <span data-i18n="csv_btn"></span></button>
            <button type="button" class="btn btn-sm" id="sipPrint"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <div class="fc-table-wrap"><table class="table fc-table" id="sipTable"></table></div>
      </div>
    </section>

    <!-- ============================================================ FD / RD -->
    <section id="p-fd" class="fc-panel" role="tabpanel" aria-labelledby="tab-fd" hidden>
      <div class="fc-split">
        <div class="card fc-form" id="fdForm">
          <div class="seg fc-seg-full" id="fdKind" role="group" data-i18n-aria-label="tab_fd">
            <button type="button" data-v="fd" data-i18n="fd_kind_fd"></button>
            <button type="button" data-v="rd" data-i18n="fd_kind_rd"></button>
          </div>
          <div id="fdBox" class="fc-form">
            <div data-f="fdAmt"></div>
            <div data-f="fdRate"></div>
            <div class="field">
              <span class="fc-lbl" data-i18n="f_tenure"></span>
              <div class="fc-pair"><div data-f="fdYrs"></div><div data-f="fdMos"></div></div>
              <span class="nf-hint" id="fdTenureHint"></span>
            </div>
            <div class="field">
              <label for="fdPayout" data-i18n="fd_payout"></label>
              <select id="fdPayout">
                <option value="cum" data-i18n="payout_cum"></option>
                <option value="month" data-i18n="payout_month"></option>
                <option value="quarter" data-i18n="payout_quarter"></option>
              </select>
            </div>
          </div>
          <div id="rdBox" class="fc-form">
            <div data-f="rdAmt"></div>
            <div data-f="rdRate"></div>
            <div data-f="rdN"></div>
          </div>
          <label class="check"><input type="checkbox" id="fdSenior"> <span data-i18n="fd_senior"></span></label>
          <p class="tiny muted mb0" data-i18n="rate_check"></p>
        </div>
        <div class="fc-col">
          <div class="card" id="fdRes" aria-live="polite"></div>
          <div class="card">
            <div class="fc-chart-head"><h3 data-i18n="ch_growth"></h3></div>
            <div class="fc-chart" id="fdChart" tabindex="0"></div>
            <div class="fc-axis-note" data-i18n="ax_years"></div>
            <div class="fc-legend" id="fdLegend"></div>
          </div>
        </div>
      </div>
      <div class="card stack">
        <div class="fc-sch-head">
          <h2 data-i18n="yearwise"></h2>
          <div class="fc-sch-tools no-print">
            <button type="button" class="btn btn-sm" id="fdCsv"><span aria-hidden="true">⬇</span> <span data-i18n="csv_btn"></span></button>
            <button type="button" class="btn btn-sm" id="fdPrint"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <div class="fc-table-wrap"><table class="table fc-table" id="fdTable"></table></div>
        <p class="tiny muted mb0" data-i18n="fd_note"></p>
      </div>
    </section>

    <!-- ============================================================ PPF -->
    <section id="p-ppf" class="fc-panel" role="tabpanel" aria-labelledby="tab-ppf" hidden>
      <div class="fc-split">
        <div class="card fc-form" id="ppfForm">
          <h2 data-i18n="ppf_title"></h2>
          <div data-f="ppfAmt"></div>
          <div data-f="ppfRate"></div>
          <div class="field">
            <span class="fc-lbl" id="ppfModeLbl" data-i18n="ppf_how"></span>
            <div class="seg fc-seg-full" id="ppfMode" role="group" aria-labelledby="ppfModeLbl">
              <button type="button" data-v="yearly" data-i18n="ppf_yearly"></button>
              <button type="button" data-v="monthly" data-i18n="ppf_monthly"></button>
            </div>
          </div>
          <div class="field">
            <label for="ppfExt" data-i18n="ppf_ext"></label>
            <select id="ppfExt"></select>
          </div>
          <label class="check" id="ppfExtDepBox"><input type="checkbox" id="ppfExtDep"> <span data-i18n="ppf_ext_dep"></span></label>
          <p class="tiny muted mb0" data-i18n="ppf_rate_hint"></p>
        </div>
        <div class="fc-col">
          <div class="card" id="ppfRes" aria-live="polite"></div>
          <div class="card">
            <div class="fc-chart-head"><h3 data-i18n="ch_growth"></h3></div>
            <div class="fc-chart" id="ppfChart" tabindex="0"></div>
            <div class="fc-axis-note" data-i18n="ax_years"></div>
            <div class="fc-legend" id="ppfLegend"></div>
          </div>
        </div>
      </div>
      <div class="card stack">
        <div class="fc-sch-head">
          <h2 data-i18n="yearwise"></h2>
          <div class="fc-sch-tools no-print">
            <button type="button" class="btn btn-sm" id="ppfCsv"><span aria-hidden="true">⬇</span> <span data-i18n="csv_btn"></span></button>
            <button type="button" class="btn btn-sm" id="ppfPrint"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <div class="fc-table-wrap"><table class="table fc-table" id="ppfTable"></table></div>
        <p class="tiny muted mb0" data-i18n="ppf_note"></p>
      </div>
    </section>

    <p class="callout warning small fc-disc" role="note"><strong data-i18n="disc_title"></strong> <span data-i18n="disclaimer"></span></p>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="how_title"></h3>
      <div class="fc-how small">
        <p data-i18n="how_emi"></p>
        <p data-i18n="how_apr"></p>
        <p data-i18n="how_flat"></p>
        <p data-i18n="how_sip"></p>
        <p data-i18n="how_fd"></p>
        <p data-i18n="how_ppf"></p>
      </div>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/emi-savings-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/emi-savings-calculator/strings.js"></script>
  <script src="../../../apps/emi-savings-calculator/app.js"></script>
</body>
</html>
