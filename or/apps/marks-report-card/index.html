        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      #print-root .rc { box-shadow: none; max-width: none; margin: 0; border: 2px solid #000; min-height: 272mm; display: flex; flex-direction: column; break-after: page; page-break-after: always; break-inside: avoid; font-size: 13.5px; padding: 16px 20px; }
      #print-root .rc:last-child { break-after: auto; page-break-after: auto; }
      #print-root .rc-sigs { margin-top: auto; padding-top: 50px; }
      #print-root .rc-tablewrap { overflow: visible; }
      #print-root .rc-sname { font-size: 1.35rem; }
      #print-root .rc-rtext { font-size: 1.1em; }
      #print-root .rc-dense .rc-rtext { font-size: 1em; line-height: 1.4; }
      /* many subjects: tighter rows so one student's card still fits on one A4 page */
      #print-root .rc-dense { font-size: 12.5px; padding: 12px 16px; }
      #print-root .rc-dense .rc-table th, #print-root .rc-dense .rc-table td { padding: 3px 6px; }
      #print-root .rc-dense .rc-title { margin: 8px 0; padding: 4px 8px; }
      #print-root .rc-dense .rc-info { margin-bottom: 8px; }
      #print-root .rc-dense .rc-sum { margin: 8px 0; }
      #print-root .rc-dense .rc-box { padding: 3px 8px; }
      #print-root .rc-dense .rc-big { font-size: 1.1rem; }
      #print-root .rc-dense .rc-remarks { min-height: 56px; padding: 5px 8px; }
      #print-root .rc-dense .rc-sigs { padding-top: 34px; }
      #print-root .rc-dense .rc-logo, #print-root .rc-dense .rc-logo-pad { width: 60px; height: 60px; flex-basis: 60px; }
      #print-root .rc-xdense { font-size: 11px; }
      #print-root .rc-xdense .rc-table { line-height: 1.25; }
      #print-root .rc-xdense .rc-table th, #print-root .rc-xdense .rc-table td { padding: 1px 5px; }
      #print-root .rc-xdense .rc-sname { font-size: 1.15rem; }
      #print-root .rc-xdense .rc-scale { margin-top: 6px; }
      #print-root .rc-xdense .rc-sigs { padding-top: 22px; }
      #print-root .rc-xdense .rc-date { margin-top: 6px; }
      #print-root .rc-xdense .rc-head { padding-bottom: 6px; }
      #print-root .rc-xdense .rc-title { margin: 6px 0; }
      #print-root .rc-xdense .rc-remarks { min-height: 0; }
      #print-root .rc-xdense .rc-rtext { line-height: 1.3; }
      #print-root .rc-xdense .rc-info { gap: 2px 22px; margin-bottom: 6px; }
      #print-root .rc-xdense .rc-sum { margin: 6px 0; gap: 6px; }
      #print-root .rc-xdense .rc-big { font-size: 1rem; }
      #print-root .rc-xdense .rc-weak { margin-bottom: 6px; }
      #print-root .no-print { display: none !important; }
      #print-root .rc-head-empty { display: none; }
      .sheet { font-size: 11px; }
      .sheet .rc-head { border-bottom: 3px double #000; }
      .sheet-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
      .sheet-table th, .sheet-table td { border: 1px solid #000; padding: 3px 5px; text-align: start; }
      .sheet-table thead th { background: #ececec; }
      .sheet-table .num { text-align: center; }
      .sheet-table .strong { font-weight: 800; }
      .sheet-table .rc-lowc { font-weight: 800; text-decoration: underline; }
      .sheet-foot { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; break-inside: avoid; }
      .sheet-stats p { margin: 10px 0 0; }
      .sheet .rc-sigs { margin-top: 44px; grid-template-columns: repeat(2, minmax(0, 1fr)); break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <details class="card help no-print" id="help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
        <li data-i18n="tip7"></li>
      </ul>
      <p class="small mb0"><strong data-i18n="scale_title"></strong></p>
      <div class="scale" id="help-scale"></div>
    </details>
    <div style="height:12px"></div>

    <section class="card bar no-print" aria-labelledby="class-select-label">
      <div class="row">
        <div class="bar-cls">
          <label for="class-select" id="class-select-label" data-i18n="class_label"></label>
          <select id="class-select" class="no-i18n"></select>
        </div>
        <button class="btn" id="new-class" type="button"><span aria-hidden="true">＋</span><span data-i18n="new_class"></span></button>
        <button class="btn btn-danger" id="delete-class" type="button" data-i18n="delete_class"></button>
        <button class="btn" id="export-csv" type="button"><span aria-hidden="true">⬇</span><span data-i18n="export_csv"></span></button>
        <button class="btn" id="print-sheet" type="button"><span aria-hidden="true">🖨</span><span data-i18n="print_sheet"></span></button>
        <button class="btn btn-ghost" id="fs-btn" type="button" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><span aria-hidden="true">⛶</span></button>
        <p class="tiny muted saved-note" id="saved-note"></p>
      </div>
    </section>

    <div class="tabs no-print" role="tablist" data-i18n-aria-label="tabs_label">
      <button role="tab" type="button" id="tab-setup" aria-controls="panel-setup"><span class="ti" aria-hidden="true">⚙️</span><span data-i18n="tab_setup"></span></button>
      <button role="tab" type="button" id="tab-marks" aria-controls="panel-marks"><span class="ti" aria-hidden="true">✍️</span><span data-i18n="tab_marks"></span></button>
      <button role="tab" type="button" id="tab-analysis" aria-controls="panel-analysis"><span class="ti" aria-hidden="true">📊</span><span data-i18n="tab_analysis"></span></button>
      <button role="tab" type="button" id="tab-cards" aria-controls="panel-cards"><span class="ti" aria-hidden="true">📄</span><span data-i18n="tab_cards"></span></button>
    </div>

    <!-- SETUP -->
    <section id="panel-setup" role="tabpanel" aria-labelledby="tab-setup" hidden>
      <div class="setup-grid">
        <div class="card stack">
          <h2 data-i18n="class_details"></h2>
          <div class="field"><label for="cl-name" data-i18n="class_name"></label><input type="text" id="cl-name" class="no-i18n" maxlength="60" autocomplete="off" data-i18n-placeholder="class_name_ph"></div>
          <div class="field"><label for="cl-term" data-i18n="term"></label><input type="text" id="cl-term" class="no-i18n" maxlength="80" autocomplete="off" data-i18n-placeholder="term_ph"></div>
          <div class="two">
            <div class="field"><label for="cl-pass" data-i18n="pass_pct"></label><input type="number" id="cl-pass" min="0" max="100" step="any" inputmode="decimal"></div>
            <div class="field"><label for="cl-days" data-i18n="working_days"></label><input type="number" id="cl-days" min="0" max="400" step="1" inputmode="numeric"></div>
          </div>
          <p class="tiny muted mb0" data-i18n="working_days_hint"></p>
          <label class="check"><input type="checkbox" id="cl-each"><span data-i18n="rule_each"></span></label>
          <p class="tiny muted mb0" data-i18n="rule_hint"></p>
          <label class="check"><input type="checkbox" id="cl-rank"><span data-i18n="show_rank"></span></label>
        </div>

        <div class="card stack">
          <h2 data-i18n="subjects"></h2>
          <div class="subj-head" aria-hidden="true"><span>#</span><span data-i18n="subject_name"></span><span data-i18n="max_marks"></span><span></span></div>
          <div id="subj-list"></div>
          <button class="btn" id="add-subject" type="button"><span aria-hidden="true">＋</span><span data-i18n="add_subject"></span></button>
        </div>

        <div class="card stack">
          <div class="row spread"><h2 class="mb0" data-i18n="students"></h2><span class="badge primary" id="st-count"></span></div>
          <div class="field">
            <label for="paste" data-i18n="paste_label"></label>
            <textarea id="paste" data-i18n-placeholder="paste_ph" spellcheck="false"></textarea>
            <span class="hint" data-i18n="paste_help"></span>
          </div>
          <div class="row">
            <button class="btn btn-primary" id="add-students" type="button"><span aria-hidden="true">＋</span><span data-i18n="add_students"></span></button>
            <button class="btn" id="import-csv" type="button"><span aria-hidden="true">📂</span><span data-i18n="import_csv"></span></button>
            <button class="btn" id="template-csv" type="button"><span aria-hidden="true">⬇</span><span data-i18n="template_csv"></span></button>
          </div>
          <div class="row">
            <button class="btn btn-sm" id="sort-roll" type="button" data-i18n="sort_roll"></button>
            <button class="btn btn-sm" id="sort-az" type="button" data-i18n="sort_az"></button>
            <button class="btn btn-sm" id="renumber" type="button" data-i18n="renumber"></button>
          </div>
        </div>

        <div class="card stack" id="school-card">
          <h2 data-i18n="school"></h2>
          <div class="field"><label for="sc-name" data-i18n="school_name"></label><input type="text" id="sc-name" class="no-i18n" maxlength="90" autocomplete="off" data-i18n-placeholder="school_name_ph"></div>
          <div class="field"><label for="sc-addr" data-i18n="school_addr"></label><input type="text" id="sc-addr" class="no-i18n" maxlength="120" autocomplete="off" data-i18n-placeholder="school_addr_ph"></div>
          <div class="field">
            <span class="hint" data-i18n="logo"></span>
            <div class="logo-box">
              <img id="sc-logo-img" alt="" hidden>
              <button class="btn" id="sc-logo-up" type="button"><span aria-hidden="true">🖼</span><span data-i18n="upload_logo"></span></button>
              <button class="btn btn-danger btn-sm" id="sc-logo-rm" type="button" data-i18n="remove_logo" hidden></button>
            </div>
          </div>
        </div>

        <div class="card stack">
          <h2 data-i18n="backup_title"></h2>
          <p class="small muted mb0" data-i18n="backup_help"></p>
          <div class="row">
            <button class="btn" id="backup" type="button"><span aria-hidden="true">💾</span><span data-i18n="backup_btn"></span></button>
            <button class="btn" id="restore" type="button"><span aria-hidden="true">📂</span><span data-i18n="restore_btn"></span></button>
          </div>
          <div><button class="btn btn-danger btn-sm" id="reset-all" type="button" data-i18n="reset_app"></button></div>
        </div>
      </div>
    </section>

    <!-- MARKS -->
    <section id="panel-marks" role="tabpanel" aria-labelledby="tab-marks" hidden>
      <div class="card stack mk-card">
        <div class="mk-top">
          <h2 id="mk-title" class="no-i18n"></h2>
          <button class="btn" id="add-row" type="button"><span aria-hidden="true">＋</span><span data-i18n="add_row"></span></button>
        </div>
        <p class="small muted mb0" data-i18n="marks_help"></p>
        <div class="callout warning row spread" id="mk-empty" hidden>
          <span id="mk-empty-txt"></span>
          <button class="btn btn-sm" id="mk-goto-setup" type="button" data-i18n="goto_setup"></button>
        </div>
        <div class="grid-wrap" id="mk-wrap">
          <table class="marks" id="marks">
            <thead id="marks-head"></thead>
            <tbody id="marks-body"></tbody>
          </table>
        </div>
        <div class="legend small muted" id="mk-legend">
          <span class="lg"><i class="lg-bad" aria-hidden="true"></i><span data-i18n="legend_bad"></span></span>
          <span class="lg"><i class="lg-low" aria-hidden="true"></i><span data-i18n="legend_low"></span></span>
          <span class="lg"><i class="lg-ab" aria-hidden="true"></i><span data-i18n="legend_ab"></span></span>
        </div>
        <p class="mb0 strong" id="mk-summary" aria-live="polite"></p>
      </div>
    </section>

    <!-- ANALYSIS -->
    <section id="panel-analysis" role="tabpanel" aria-labelledby="tab-analysis" hidden>
      <div id="an-root" class="stack"></div>
    </section>

    <!-- REPORT CARDS -->
    <section id="panel-cards" role="tabpanel" aria-labelledby="tab-cards" hidden>
      <div class="rc-layout">
        <div class="card stack rc-editor no-print">
          <p class="callout warning mb0" id="rc-none" hidden></p>
          <div class="stack" id="rc-editor-body">
            <div class="field">
              <label for="rc-student" data-i18n="pick_student"></label>
              <div class="rc-nav">
                <button class="btn" id="rc-prev" type="button" data-i18n-aria-label="previous" data-i18n-title="previous"><span aria-hidden="true">‹</span></button>
                <select id="rc-student" class="no-i18n"></select>
                <button class="btn" id="rc-next" type="button" data-i18n-aria-label="next" data-i18n-title="next"><span aria-hidden="true">›</span></button>
              </div>
              <span class="hint" id="rc-pos"></span>
            </div>
            <div class="field">
              <label for="rc-present" data-i18n="days_present"></label>
              <input type="number" id="rc-present" min="0" max="400" step="1" inputmode="numeric">
              <span class="hint" id="rc-days"></span>
            </div>
            <div class="field">
              <label for="rc-remark" data-i18n="remarks"></label>
              <textarea id="rc-remark" maxlength="600" data-i18n-placeholder="remarks_ph"></textarea>
            </div>
            <div>
              <p class="small muted mb0" data-i18n="suggestions"></p>
              <div class="chips" id="rc-sugg"></div>
            </div>
            <button class="btn btn-sm" id="rc-auto" type="button"><span aria-hidden="true">✨</span><span data-i18n="auto_remarks"></span></button>
            <hr class="divider">
            <div class="row">
              <button class="btn btn-primary" id="rc-print" type="button"><span aria-hidden="true">🖨</span><span data-i18n="print_card"></span></button>
              <button class="btn btn-accent" id="rc-print-all" type="button"><span aria-hidden="true">🖨</span><span data-i18n="print_all"></span></button>
            </div>
            <p class="tiny muted mb0" data-i18n="print_tip"></p>
            <button class="btn btn-sm btn-ghost" id="goto-school" type="button"><span aria-hidden="true">🏫</span><span data-i18n="edit_school"></span></button>
          </div>
        </div>
        <div id="rc-preview" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="print-root"></div>

  <script src="../../../apps/marks-report-card/../../shared/edu.js"></script>
  <script src="../../../apps/marks-report-card/strings.js"></script>
  <script src="../../../apps/marks-report-card/content.js"></script>
  <script src="../../../apps/marks-report-card/app.js"></script>
</body>
</html>
