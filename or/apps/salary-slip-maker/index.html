      <span class="grow" data-i18n="sample_banner"></span>
      <button class="btn btn-sm btn-primary" id="goCompany" type="button" data-i18n="fill_company"></button>
    </div>

    <div class="ssm-tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-slip" data-tab="slip" aria-controls="p-slip"><span class="ic" aria-hidden="true">🧾</span><span data-i18n="tab_slip"></span></button>

    </div>

    <!-- ================= SLIP ================= -->
    <section id="p-slip" role="tabpanel" aria-labelledby="tab-slip" hidden>
      <div class="ssm-split">
        <div class="stack">
          <section class="card form">
            <div class="grp">
              <h2 data-i18n="sec_employee"></h2>
              <div class="emp-pick">
                <label class="f"><span class="lbl" data-i18n="saved_emps"></span><select id="empPick" class="no-i18n"></select></label>
                <button type="button" class="btn btn-danger btn-sm" id="empDel" data-i18n="delete_emp"></button>
              </div>
              <label class="f"><span class="lbl" data-i18n="emp_name"></span><input type="text" id="eName" data-e="name" maxlength="80" autocomplete="off" dir="auto" data-i18n-placeholder="sample_emp"></label>
              <div class="two">
                <label class="f"><span class="lbl" data-i18n="emp_id"></span><input type="text" id="eId" data-e="id" maxlength="30" autocomplete="off" dir="ltr" placeholder="EMP-014" class="no-i18n"></label>
                <label class="f"><span class="lbl" data-i18n="emp_doj"></span><input type="date" id="eDoj" data-e="doj"></label>
              </div>
              <div class="two">
                <label class="f"><span class="lbl" data-i18n="emp_desig"></span><input type="text" id="eDesig" data-e="desig" maxlength="60" autocomplete="off" dir="auto" data-i18n-placeholder="sample_desig"></label>
                <label class="f"><span class="lbl" data-i18n="emp_dept"></span><input type="text" id="eDept" data-e="dept" maxlength="60" autocomplete="off" dir="auto" data-i18n-placeholder="sample_dept"></label>
              </div>
              <div class="two">
                <label class="f"><span class="lbl" data-i18n="emp_bank"></span><input type="text" id="eBank" data-e="bank4" maxlength="4" inputmode="numeric" autocomplete="off" dir="ltr" placeholder="4821" class="no-i18n"></label>
                <label class="f"><span class="lbl" data-i18n="emp_uan"></span><input type="text" id="eUan" data-e="uan" maxlength="12" inputmode="numeric" autocomplete="off" dir="ltr" placeholder="100123456789" class="no-i18n"></label>
              </div>
              <label class="f"><span class="lbl" data-i18n="emp_pan"></span><input type="text" id="ePan" data-e="pan" maxlength="10" autocomplete="off" dir="ltr" placeholder="ABCPS1234K" class="no-i18n" style="text-transform:uppercase"></label>
              <div class="row">
                <button type="button" class="btn" id="empSave"><span aria-hidden="true">💾</span> <span data-i18n="save_emp"></span></button>
                <span class="muted small" data-i18n="saved_local"></span>
              </div>
            </div>

              </div>

              <div class="callout warning small" id="lopWarn" hidden data-i18n="lop_warn"></div>
              <span class="hint" data-i18n="prorate_hint"></span>
            </div>

            <div class="grp">

              <div class="amt-row"><label for="e_da" data-i18n="e_da"></label><input type="text" id="e_da" data-k="da" inputmode="decimal" autocomplete="off"></div>
              <div class="amt-row"><label for="e_conv" data-i18n="e_conv"></label><input type="text" id="e_conv" data-k="conv" inputmode="decimal" autocomplete="off"></div>
              <div class="amt-row"><label for="e_special" data-i18n="e_special"></label><input type="text" id="e_special" data-k="special" inputmode="decimal" autocomplete="off"></div>
              <div class="amt-row"><label for="e_ot" data-i18n="e_ot"></label><input type="text" id="e_ot" data-k="ot" inputmode="decimal" autocomplete="off"></div>
              <div class="amt-row"><label for="e_bonus" data-i18n="e_bonus"></label><input type="text" id="e_bonus" data-k="bonus" inputmode="decimal" autocomplete="off"></div>
              <div id="xEarn" class="stack"></div>
              <button type="button" class="btn btn-sm" id="addEarn">＋ <span data-i18n="add_row"></span></button>
              <p class="sum" id="grossLine" aria-live="polite"></p>
            </div>

            <div class="grp">
              <h2 data-i18n="sec_ded"></h2>
              <label class="check-wrap"><input type="checkbox" id="pfOn" data-p="pf"> <span data-i18n="pf_on"></span></label>
              <div class="two" id="pfBox">
                <div class="f">
                  <span class="lbl" id="pfBaseLbl" data-i18n="pf_base"></span>
                  <div class="seg full" role="group" aria-labelledby="pfBaseLbl">
                    <button type="button" data-pfbase="bd" data-i18n="pf_base_bd"></button>
                    <button type="button" data-pfbase="b" data-i18n="pf_base_b"></button>
                  </div>
                </div>
              </div>
              <label class="check-wrap"><input type="checkbox" id="pfCap" data-p="pfCap"> <span id="pfCapLbl"></span></label>
              <span class="hint" data-i18n="pf_hint"></span>
              <label class="check-wrap"><input type="checkbox" id="esiOn" data-p="esi"> <span id="esiLbl"></span></label>
              <span class="hint" id="esiHint"></span>
              <div class="amt-row"><label for="pt" data-i18n="d_pt"></label><input type="text" id="pt" inputmode="numeric" autocomplete="off"></div>
              <span class="hint" id="ptHint"></span>
              <span class="hint" id="ptWomen" hidden data-i18n="pt_mh_women"></span>
              <div class="amt-row"><label for="tds" data-i18n="d_tds"></label><input type="text" id="tds" data-p="tds" inputmode="decimal" autocomplete="off"></div>
              <span class="hint" data-i18n="tds_hint"></span>
              <div class="amt-row"><label for="adv" data-i18n="d_adv"></label><input type="text" id="adv" data-p="adv" inputmode="decimal" autocomplete="off"></div>
              <div id="xDed" class="stack"></div>
              <button type="button" class="btn btn-sm" id="addDed">＋ <span data-i18n="add_row"></span></button>
              <p class="sum" id="dedLine" aria-live="polite"></p>
            </div>

            <div class="grp">
              <h2 data-i18n="sec_slip"></h2>
              <div class="f">
                <span class="lbl" id="tplLbl" data-i18n="template"></span>
                <div class="seg full" role="group" aria-labelledby="tplLbl" id="tplSeg">
                  <button type="button" data-tpl="simple" data-i18n="tpl_simple"></button>
                  <button type="button" data-tpl="formal" data-i18n="tpl_formal"></button>
                  <button type="button" data-tpl="bi" data-i18n="tpl_bilingual"></button>
                </div>
                <span class="hint" data-i18n="bilingual_hint"></span>
              </div>
              <div class="two">
                <div class="f">
                  <span class="lbl" id="paperLbl" data-i18n="paper"></span>
                  <div class="seg full" role="group" aria-labelledby="paperLbl" id="paperSeg">
                    <button type="button" data-paper="A4">A4</button>
                    <button type="button" data-paper="A5">A5</button>
                  </div>
                </div>
                <label class="f"><span class="lbl" data-i18n="slip_lang"></span><select id="slipLang"></select></label>
              </div>
            </div>
          </section>

          <section class="card net-card" aria-live="polite">
            <span class="lbl" data-i18n="net_pay"></span>
            <div class="big-number" id="netPay"></div>
            <div class="w" id="wordsEn"></div>
            <div class="w2" id="wordsLocal"></div>
            <div class="callout danger small" id="netNeg" hidden data-i18n="net_negative"></div>
            <div class="actions no-print" style="margin-top:8px">
              <button type="button" class="btn btn-primary" id="printBtn"><span aria-hidden="true">🖨️</span> <span data-i18n="print_pdf"></span></button>
              <a class="btn btn-wa" id="waBtn" href="#" target="_blank" rel="noopener"><span aria-hidden="true">💬</span> <span data-i18n="wa_share"></span></a>
              <button type="button" class="btn" id="copyBtn"><span aria-hidden="true">📋</span> <span data-i18n="copy_text"></span></button>
              <button type="button" class="btn btn-danger" id="resetBtn" data-i18n="reset_all"></button>
            </div>
            <span class="hint" data-i18n="print_hint"></span>
            <span class="hint" data-i18n="wa_hint"></span>
          </section>
          <div class="quick no-print" id="quick">
            <span class="q-txt" id="quickTxt"></span>
            <a href="#preview" class="btn btn-sm btn-primary" data-i18n="see_slip"></a>
          </div>
        </div>

        <div class="pv-col" id="preview">
          <h2 class="small muted" style="margin:0 0 6px" data-i18n="preview_title"></h2>
          <div class="pv-wrap" id="pvWrap"><div class="pages a4 no-i18n" id="pages"></div></div>
        </div>
      </div>
    </section>

    <!-- ================= BATCH ================= -->
    <section id="p-batch" role="tabpanel" aria-labelledby="tab-batch" class="stack" hidden>
      <section class="card stack">
        <p class="mb0" data-i18n="batch_intro"></p>
        <p class="hint mb0" data-i18n="batch_cols"></p>
        <label class="f"><span class="lbl" data-i18n="batch_paste"></span><textarea id="csvText" class="csv no-i18n" rows="6" spellcheck="false"></textarea></label>
        <div class="row">
          <button type="button" class="btn" id="csvPick"><span aria-hidden="true">📂</span> <span data-i18n="batch_pick"></span></button>
          <button type="button" class="btn" id="csvSample"><span aria-hidden="true">⬇️</span> <span data-i18n="batch_sample"></span></button>
          <button type="button" class="btn btn-primary" id="batchMake"><span aria-hidden="true">🧾</span> <span data-i18n="batch_make"></span></button>
        </div>
        <p class="batch-msg" id="batchMsg" aria-live="polite"></p>
      </section>
      <section class="card stack" id="batchCard" hidden>
        <div class="row spread">
          <h2 class="mb0" id="batchCount"></h2>
          <button type="button" class="btn btn-primary" id="batchPrint"><span aria-hidden="true">🖨️</span> <span data-i18n="batch_print"></span></button>
        </div>
        <div class="pv-wrap" id="batchWrap"><div class="pages a4 no-i18n" id="batchPages"></div></div>
      </section>
    </section>

    <!-- ================= COMPANY ================= -->
    <section id="p-company" role="tabpanel" aria-labelledby="tab-company" hidden>
      <section class="card form" style="max-width:720px">
        <div class="grp">
          <h2 data-i18n="sec_company"></h2>
          <label class="f"><span class="lbl" data-i18n="co_name"></span><input type="text" id="cName" data-c="name" maxlength="120" autocomplete="off" dir="auto" data-i18n-placeholder="sample_co"></label>
          <label class="f"><span class="lbl" data-i18n="co_addr"></span><textarea id="cAddr" data-c="addr" rows="2" maxlength="300" dir="auto" data-i18n-placeholder="sample_addr"></textarea></label>
          <div class="two">
            <label class="f"><span class="lbl" data-i18n="co_gstin"></span><input type="text" id="cGstin" data-c="gstin" maxlength="15" autocomplete="off" dir="ltr" class="no-i18n" style="text-transform:uppercase"></label>
            <label class="f"><span class="lbl" data-i18n="co_pan"></span><input type="text" id="cPan" data-c="pan" maxlength="10" autocomplete="off" dir="ltr" class="no-i18n" style="text-transform:uppercase"></label>
          </div>
          <label class="f"><span class="lbl" data-i18n="co_state"></span><select id="cState" data-c="state"></select></label>
          <label class="f"><span class="lbl" data-i18n="co_sign"></span><input type="text" id="cSign" data-c="sign" maxlength="120" autocomplete="off" dir="auto" data-i18n-placeholder="sample_sign"></label>
          <div class="f">
            <span class="lbl" data-i18n="co_logo"></span>
            <div class="imgbox">
              <div class="thumb" id="logoThumb"></div>
              <button type="button" class="btn btn-sm" id="logoPick" data-i18n="pick_logo"></button>
              <button type="button" class="btn btn-sm btn-danger" id="logoDel" data-i18n="remove_logo" hidden></button>
            </div>
            <span class="hint" data-i18n="logo_hint"></span>
          </div>
          <label class="check-wrap"><input type="checkbox" id="cMask" data-c="mask"> <span data-i18n="mask_ids"></span></label>
          <p class="muted small mb0" data-i18n="saved_local"></p>
        </div>
      </section>
    </section>

    <details class="card" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li><li data-i18n="tip6"></li>
      </ul>
    </details>

    <div id="printRoot" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/salary-slip-maker/../../shared/edu.js"></script>
  <script src="../../../apps/salary-slip-maker/strings.js"></script>
  <script src="../../../apps/salary-slip-maker/data.js"></script>
  <script src="../../../apps/salary-slip-maker/words.js"></script>
  <script src="../../../apps/salary-slip-maker/app.js"></script>
</body>
</html>
