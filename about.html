<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About AI Pathshala: free AI tools and lessons for everyone</title>
  <meta name="description" content="AI Pathshala (AI की पाठशाला) is a free, non-commercial project: a library of simple AI and everyday web tools in 12 Indian languages, and a YouTube channel that teaches AI in Hindi and English.">
  <link rel="canonical" href="https://apnipathshala.ai/about.html">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="AI की पाठशाला (AI Pathshala)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI की पाठशाला · AI Pathshala">
  <meta property="og:url" content="https://apnipathshala.ai/about.html">
  <meta property="og:title" content="About AI Pathshala · AI की पाठशाला के बारे में">
  <meta property="og:description" content="Free AI tools and lessons for everyone in India, in 12 languages. No ads, no fees, no sign-up, open source.">
  <meta property="og:image" content="https://apnipathshala.ai/shared/img/og-everyone.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://apnipathshala.ai/shared/img/og-everyone.png">
  <link rel="icon" href="shared/img/icon-32.png">
  <link rel="apple-touch-icon" href="shared/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b4f5c">
  <link rel="stylesheet" href="shared/edu.css">
  <link rel="stylesheet" href="shared/site-pages.css">
</head>
<body>
  <main id="app">
    <section class="p-hero">
      <span class="kicker" data-i18n="hero_kicker"></span>
      <h2 data-i18n="hero_title"></h2>
      <p id="hero-lead"></p>
      <div class="p-cta">
        <a class="btn btn-primary btn-lg" id="browse" href="index.html">📚 <span data-i18n="browse_btn"></span></a>
        <a class="btn btn-lg" id="contact" href="contact.html">✉️ <span data-i18n="contact_btn"></span></a>
      </div>
    </section>

    <section class="sec grid-3" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr))">
      <div class="card stack lead-card">
        <h2 data-i18n="mission_title"></h2>
        <p data-i18n="mission_text"></p>
      </div>
      <div class="card stack lead-card">
        <h2 data-i18n="who_title"></h2>
        <p data-i18n="who_text"></p>
      </div>
    </section>

    <section class="sec" aria-labelledby="values-h">
      <h2 id="values-h" data-i18n="values_title"></h2>
      <div class="grid-3">
        <div class="card tile"><div class="big-ic" aria-hidden="true">🆓</div><h3 data-i18n="v1_t"></h3><p data-i18n="v1"></p></div>
        <div class="card tile"><div class="big-ic" aria-hidden="true">🔒</div><h3 data-i18n="v2_t"></h3><p data-i18n="v2"></p></div>
        <div class="card tile"><div class="big-ic" aria-hidden="true">🚪</div><h3 data-i18n="v3_t"></h3><p data-i18n="v3"></p></div>
        <div class="card tile"><div class="big-ic" aria-hidden="true">🗣️</div><h3 data-i18n="v4_t"></h3><p id="v4"></p></div>
        <div class="card tile"><div class="big-ic" aria-hidden="true">📶</div><h3 data-i18n="v5_t"></h3><p data-i18n="v5"></p></div>
        <div class="card tile"><div class="big-ic" aria-hidden="true">🧩</div><h3 data-i18n="v6_t"></h3><p data-i18n="v6"></p></div>
      </div>
    </section>

    <section class="sec" aria-labelledby="what-h">
      <h2 id="what-h" data-i18n="what_title"></h2>
      <div class="grid-3">
        <div class="card tile">
          <div class="big-ic" aria-hidden="true">🧰</div>
          <h3 id="w-apps-t"></h3>
          <p data-i18n="w_apps"></p>
          <a class="btn btn-primary" id="browse-2" href="index.html"><span data-i18n="browse_btn"></span> <span aria-hidden="true" class="arrow">→</span></a>
        </div>
        <div class="card tile">
          <div class="big-ic" aria-hidden="true">📺</div>
          <h3 data-i18n="w_videos_t"></h3>
          <p data-i18n="w_videos"></p>
          <a class="btn btn-yt" id="yt" target="_blank" rel="noopener">▶ <span data-i18n="w_videos_btn"></span></a>
        </div>
        <div class="card tile">
          <div class="big-ic" aria-hidden="true">📖</div>
          <h3 data-i18n="w_guides_t"></h3>
          <p data-i18n="w_guides"></p>
          <a class="btn" id="guides" href="guides/index.html"><span data-i18n="w_guides_btn"></span> <span aria-hidden="true" class="arrow">→</span></a>
        </div>
      </div>
    </section>

    <section class="sec card end-cta">
      <div>
        <h2 data-i18n="cta_title"></h2>
        <p data-i18n="cta_text"></p>
      </div>
      <a class="btn btn-accent btn-lg" id="contact-2" href="contact.html">✉️ <span data-i18n="contact_btn"></span></a>
    </section>
  </main>
  <script src="shared/edu.js"></script>
  <script src="shared/about-strings.js"></script>
  <script src="catalog.js"></script>
  <script src="shared/about.js"></script>
  <script src="shared/firebase-config.js"></script>
  <script src="shared/visits.js"></script>
</body>
</html>
