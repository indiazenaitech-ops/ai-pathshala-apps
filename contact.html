<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact AI Pathshala: request a free tool or report a problem</title>
  <meta name="description" content="Contact AI Pathshala to request a new free tool, report a bug or a wrong translation, or ask for help. Email or YouTube comments.">
  <link rel="canonical" href="https://apnipathshala.ai/contact.html">
  <meta name="robots" content="index, follow">
  <meta name="author" content="AI की पाठशाला (AI Pathshala)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI की पाठशाला · AI Pathshala">
  <meta property="og:url" content="https://apnipathshala.ai/contact.html">
  <meta property="og:title" content="Contact AI Pathshala · संपर्क करें">
  <meta property="og:description" content="Request a new free tool, report a problem or ask for help.">
  <meta property="og:image" content="https://apnipathshala.ai/shared/img/og-everyone.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://apnipathshala.ai/shared/img/og-everyone.png">
  <link rel="icon" href="shared/img/icon-32.png">
  <link rel="apple-touch-icon" href="shared/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b4f5c">
  <link rel="stylesheet" href="shared/edu.css">
  <link rel="stylesheet" href="shared/site-pages.css">
</head>
<body>
  <main id="app">
    <section class="p-hero">
      <span class="kicker" data-i18n="hero_kicker"></span>
      <h2 data-i18n="hero_title"></h2>
      <p data-i18n="hero_lead"></p>
    </section>

    <section class="grid-3">
      <div class="card tile" id="email-card">
        <div class="big-ic" aria-hidden="true">✉️</div>
        <h3 data-i18n="email_t"></h3>
        <p data-i18n="email_text"></p>
        <div class="mail-box">
          <span class="mail-addr" id="mail-addr"></span>
        </div>
        <div class="row">
          <a class="btn btn-primary" id="mail-btn">✉ <span data-i18n="email_btn"></span></a>
          <button class="btn" type="button" id="copy-mail">📋 <span data-i18n="copy_btn"></span></button>
        </div>
      </div>
      <div class="card tile">
        <div class="big-ic" aria-hidden="true">💬</div>
        <h3 data-i18n="yt_t"></h3>
        <p data-i18n="yt_text"></p>
        <a class="btn btn-yt" id="yt" target="_blank" rel="noopener">▶ <span data-i18n="yt_btn"></span></a>
      </div>
      <div class="card tile">
        <div class="big-ic" aria-hidden="true">🤝</div>
        <h3 data-i18n="share_t"></h3>
        <p data-i18n="share_text"></p>
        <a class="btn btn-wa" id="wa-page" target="_blank" rel="noopener">💬 <span data-i18n="shell_wa"></span></a>
      </div>
    </section>

    <section class="sec grid-3" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr))">
      <div class="card stack">
        <h2 data-i18n="topics_title"></h2>
        <ul class="ticks">
          <li data-i18n="t1"></li>
          <li data-i18n="t2"></li>
          <li data-i18n="t3"></li>
          <li data-i18n="t4"></li>
        </ul>
      </div>
      <div class="card stack">
        <h2 data-i18n="note_title"></h2>
        <p class="muted" data-i18n="note_text"></p>
        <p><a id="privacy" href="legal/privacy.html">🔒 <span data-i18n="privacy_link"></span></a></p>
      </div>
    </section>
  </main>
  <script src="shared/edu.js"></script>
  <script src="shared/contact-strings.js"></script>
  <script src="shared/contact.js"></script>
  <script src="shared/firebase-config.js"></script>
  <script src="shared/visits.js"></script>
</body>
</html>
