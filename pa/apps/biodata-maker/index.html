    .bd-v[dir="ltr"] { text-align: end; }
    .bd-sheet[lang="ur"] .bd-heading { line-height: 2; }
    .bd-sheet[lang="ur"] .bd-sec-t { line-height: 2.1; }
    .bd-sheet[lang="ur"] .bd-row { padding-block: calc(.3em * var(--sp)); }
    .bd-sheet[lang="ur"] .bd-l .en { line-height: 1.6; }

    /* ornament colours (the PNG painter reads the computed fill/stroke of every SVG part) */
    .bd-sheet .o-a { fill: var(--head); } .bd-sheet .o-b { fill: var(--line); } .bd-sheet .o-c { fill: var(--acc); }
    .bd-sheet .o-sa { fill: none; stroke: var(--head); } .bd-sheet .o-sb { fill: none; stroke: var(--line); } .bd-sheet .o-cs { fill: none; stroke: var(--acc); }
    .bd-sheet .o-p { fill: #e77f9c; } .bd-sheet .o-p2 { fill: #f3a9bb; } .bd-sheet .o-y { fill: #f6c453; }
    .bd-sheet .o-g { fill: #7aa95c; } .bd-sheet .o-gs { fill: none; stroke: #7aa95c; }
    .bd-sheet .o-or { fill: #f59e0b; } .bd-sheet .o-or2 { fill: #ea580c; } .bd-sheet .o-or3 { fill: #fcd34d; }
    .bd-sec-t svg { fill: var(--acc); }
    .bd-sym svg.x-cross { width: 1.7em; }
    .tpl-minimal .bd-sym svg, .tpl-sidebar .bd-sym svg { margin: 0; }
    .tpl-minimal .bd-sec-t svg, .bd-side .bd-sec-t svg { display: none; }
    .tpl-classic .bd-sec-t svg { fill: #000; }

    /* traditional */
    .tpl-traditional .bd-frame { inset: 22px; border: 3px solid #8b1a1a; }
    .tpl-traditional .bd-frame2 { inset: 31px; border: 1.5px solid #c9a227; }
    .tpl-traditional .bd-orn { width: 92px; height: 92px; }
    .tpl-traditional .bd-orn.tl, .tpl-traditional .bd-orn.tr { top: 31px; } .tpl-traditional .bd-orn.bl, .tpl-traditional .bd-orn.br { bottom: 31px; }
    .tpl-traditional .bd-orn.tl, .tpl-traditional .bd-orn.bl { inset-inline-start: 31px; } .tpl-traditional .bd-orn.tr, .tpl-traditional .bd-orn.br { inset-inline-end: 31px; }
    .tpl-traditional .bd-heading, .tpl-royal .bd-heading, .tpl-mandala .bd-heading, .tpl-classic .bd-heading,
    .tpl-traditional .bd-sec-t, .tpl-royal .bd-sec-t, .tpl-mandala .bd-sec-t, .tpl-classic .bd-sec-t { font-family: Georgia, "Times New Roman", var(--bd-font); }
    /* floral */
    .tpl-floral { --pt: 84px; --pi: 80px; }
    .tpl-floral .bd-frame { inset: 20px; border: 1.5px solid #eeb2c1; border-radius: 22px; }
    .tpl-floral .bd-orn { width: 130px; height: 130px; }
    .tpl-floral .bd-orn.tl, .tpl-floral .bd-orn.tr { top: 4px; } .tpl-floral .bd-orn.bl, .tpl-floral .bd-orn.br { bottom: 4px; }
    .tpl-floral .bd-orn.tl, .tpl-floral .bd-orn.bl { inset-inline-start: 4px; } .tpl-floral .bd-orn.tr, .tpl-floral .bd-orn.br { inset-inline-end: 4px; }
    .tpl-floral .bd-sec-t { background: #fde4ea; border: 0; border-radius: 999px; padding: .12em .9em; }
    .tpl-floral .bd-photo { border-color: #eeb2c1; }
    /* royal */
    .tpl-royal .bd-frame { inset: 18px; border: 7px solid #1f2a6b; }
    .tpl-royal .bd-frame2 { inset: 31px; border: 1.5px solid #b08d2e; }
    .tpl-royal .bd-orn { width: 64px; height: 64px; }
    .tpl-royal .bd-orn.tl, .tpl-royal .bd-orn.tr { top: 36px; } .tpl-royal .bd-orn.bl, .tpl-royal .bd-orn.br { bottom: 36px; }
    .tpl-royal .bd-orn.tl, .tpl-royal .bd-orn.bl { inset-inline-start: 36px; } .tpl-royal .bd-orn.tr, .tpl-royal .bd-orn.br { inset-inline-end: 36px; }
    .tpl-royal .bd-sec-t { background: #1f2a6b; color: #ffffff; border: 0; border-radius: 3px; padding: .14em .7em; }
    .tpl-royal .bd-sec-t svg { fill: #d9b65a; }
    /* modern minimal */
    .tpl-minimal { --pt: 64px; --pi: 64px; }
    .tpl-minimal .bd-frame { top: 0; left: 0; right: 0; height: 12px; background: #0b4f5c; }
    .tpl-minimal .bd-frame2 { top: 12px; left: 0; right: 0; height: 4px; background: #0b8a9a; }
    .tpl-minimal .bd-top { text-align: start; }
    .tpl-minimal .bd-heading { font-size: 2.3em; }
    .tpl-minimal .bd-sec-t { font-size: 1.02em; color: #0b8a9a; border-bottom: 1px solid #d3dcdf; }
    .tpl-minimal .bd-sheet[lang="en"] .bd-sec-t, .tpl-minimal[lang="en"] .bd-sec-t { text-transform: uppercase; letter-spacing: .08em; }
    .tpl-minimal .bd-l { font-weight: 500; }
    .tpl-minimal .bd-photo { border: 0; }
    /* marigold */
    .tpl-marigold { --pt: 104px; --pi: 76px; }
    .tpl-marigold .bd-frame { top: 70px; bottom: 22px; left: 22px; right: 22px; border: 2px solid #f2a516; border-top: 0; }
    .tpl-marigold .bd-frame2 { bottom: 30px; left: 30px; right: 30px; height: 0; border-bottom: 2px dotted #e07b00; }
    .tpl-marigold .bd-toran { position: absolute; top: 0; left: 0; width: 794px; height: 96px; }
    .tpl-marigold .bd-sec-t { border-bottom: 2px dotted #f2a516; }
    .tpl-marigold .bd-photo { border-color: #f2a516; }
    /* mandala */
    .tpl-mandala { --pt: 98px; --pb: 100px; --pi: 88px; }
    .tpl-mandala .bd-frame { inset: 26px; border: 1.5px solid #c08a3e; }
    .tpl-mandala .bd-orn { width: 150px; height: 150px; }
    .tpl-mandala .bd-orn.tl, .tpl-mandala .bd-orn.tr { top: -52px; } .tpl-mandala .bd-orn.bl, .tpl-mandala .bd-orn.br { bottom: -52px; }
    .tpl-mandala .bd-orn.tl, .tpl-mandala .bd-orn.bl { inset-inline-start: -52px; } .tpl-mandala .bd-orn.tr, .tpl-mandala .bd-orn.br { inset-inline-end: -52px; }
    .tpl-mandala .bd-sec-t { justify-content: center; border-bottom: 0; }
    .tpl-mandala .bd-photo { border-color: #c08a3e; }
    /* black & white */
    .tpl-classic .bd-frame { inset: 24px; border: 4px double #000; }
    .tpl-classic .bd-sec-t { border-bottom: 1.5px solid #000; }
    .tpl-classic .bd-photo { border: 1.5px solid #000; }
    /* modern sidebar */
    .tpl-sidebar { --pt: 54px; --pb: 48px; --pi: 34px; }
    .bd-sidebg { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 272px; background: #1e3a5f; }
    .tpl-sidebar .bd-frame { top: 0; bottom: 0; width: 6px; left: 272px; background: #d99a14; }
    .tpl-sidebar[dir="rtl"] .bd-frame { left: auto; right: 272px; }
    .tpl-sidebar .bd-inner { display: flex; gap: 60px; align-items: flex-start; }
    .bd-side { flex: 0 0 206px; min-width: 0; color: #ffffff; text-align: center; }
    .bd-main { flex: 1 1 auto; min-width: 0; }
    .bd-side .bd-photo { margin: 0 auto .8em; border-color: #ffffff; width: 10em; height: 12.5em; }
    .bd-side .bd-name { font-size: 1.45em; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .bd-side .bd-name .bd-v { overflow-wrap: inherit; }
    .bd-side .bd-sub { opacity: .85; margin-top: .2em; }
    .bd-side .bd-sec { text-align: start; margin-top: 1.4em; }
    .bd-side .bd-sec-t { color: #f2c14e; border-bottom-color: rgba(255, 255, 255, .35); }
    .bd-side .bd-row { grid-template-columns: minmax(0, 1fr); padding-block: .2em; }
    .bd-side .bd-c { display: none; }
    .bd-side .bd-l { color: #b9cde3; font-size: .86em; }
    .bd-side .bd-v { font-size: .94em; }
    .bd-main .bd-row { grid-template-columns: 38% .8em minmax(0, 1fr); }
    .tpl-sidebar .bd-top { text-align: start; }
    .tpl-sidebar .bd-heading { font-size: 2.2em; }
    .tpl-sidebar .bd-main .bd-sec-t { color: #1e3a5f; border-bottom: 2px solid #d99a14; }

    /* print: only the biodata, one A4 page */
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body > *:not(#printRoot) { display: none !important; }
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; }
      body { display: block !important; }
      #printRoot { position: static !important; width: auto !important; height: auto !important; overflow: visible !important; display: block !important; }
      #printRoot .bd-sheet { width: 210mm; height: 297mm; break-after: avoid; }
      #printRoot .bd-sheet.bd-grow { height: auto; min-height: 297mm; }
    }
  </style>
</head>
<body>
  <main id="app" class="v-edit">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="callout success bd-privacy"><span class="ic" aria-hidden="true">🔒</span><span data-i18n="privacy"></span></p>

    <details class="card help no-print" id="help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <div class="card bd-bar">
      <div class="field">
        <label for="profileSel" data-i18n="profile"></label>
        <select id="profileSel" class="no-i18n"></select>
      </div>
      <div class="row">
        <button class="btn" type="button" id="btnNew">＋ <span data-i18n="new_profile"></span></button>
        <button class="btn" type="button" id="btnDup" data-i18n="duplicate"></button>
        <button class="btn btn-danger" type="button" id="btnDel" data-i18n="delete_profile"></button>
      </div>
      <div class="row">
        <button class="btn btn-ghost" type="button" id="btnBlank" data-i18n="start_blank"></button>
        <button class="btn btn-ghost" type="button" id="btnSample" data-i18n="load_sample"></button>
      </div>
    </div>
    <p id="sampleNote" class="callout accent small" data-i18n="sample_note" hidden></p>

    <div class="seg bd-tabs" role="group">
      <button type="button" id="tabEdit" aria-pressed="true">✏️ <span data-i18n="tab_edit"></span></button>
      <button type="button" id="tabPreview" aria-pressed="false">👁 <span data-i18n="tab_preview"></span></button>
    </div>

    <div class="bd-layout">
      <section class="bd-form" id="formCol">
        <div class="card" id="cardDesign">
          <h2 data-i18n="sec_design"></h2>
          <p class="sub-h mt0" id="tplLbl" data-i18n="template"></p>
          <div class="tpls" id="tpls" role="group" aria-labelledby="tplLbl"></div>
          <p class="sub-h" id="symLbl" data-i18n="symbol"></p>
          <div class="syms" id="syms" role="group" aria-labelledby="symLbl"></div>
          <div class="field" id="symTextWrap" style="margin-top:10px" hidden>
            <label for="symText" data-i18n="symbol_text"></label>
            <input type="text" id="symText" class="no-i18n" maxlength="80" autocomplete="off">
          </div>
          <div class="two">
            <div class="field">
              <label for="heading" data-i18n="heading"></label>
              <input type="text" id="heading" class="no-i18n" maxlength="60" autocomplete="off">
            </div>
            <div class="field">
              <label for="labelLang" data-i18n="label_lang"></label>
              <select id="labelLang"></select>
            </div>
          </div>
          <label class="check" style="margin-top:8px"><input type="checkbox" id="bilingual"> <span data-i18n="bilingual"></span></label>
          <p class="hint" data-i18n="label_hint"></p>
        </div>

        <div class="card" id="cardPhoto">
          <div class="sec-h"><h2 data-i18n="sec_photo"></h2></div>
          <div class="photo-row">
            <img id="photoThumb" class="photo-thumb" alt="" hidden>
            <div class="photo-tools">
              <div class="row">
                <button class="btn btn-primary" type="button" id="btnPhoto"></button>
                <button class="btn" type="button" id="btnCrop" data-i18n="crop_photo"></button>
                <button class="btn btn-danger" type="button" id="btnPhotoDel" data-i18n="remove_photo"></button>
              </div>
              <p class="hint mt0" id="noPhoto" data-i18n="no_photo"></p>
              <div>
                <p class="sub-h mt0" id="shapeLbl" data-i18n="photo_shape"></p>
                <div class="seg sm" id="shapeSeg" role="group" aria-labelledby="shapeLbl">
                  <button type="button" data-shape="rect" data-i18n="shape_rect"></button>
                  <button type="button" data-shape="round" data-i18n="shape_round"></button>
                  <button type="button" data-shape="oval" data-i18n="shape_oval"></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="secCards"></div>

        <button class="btn btn-primary btn-lg w100 bd-gopv" type="button" id="goPreview" style="margin-top:14px">👁 <span data-i18n="see_preview"></span></button>

        <div class="card" id="cardBackup" style="margin-top:14px">
          <h2 data-i18n="backup_title"></h2>
          <p class="hint mt0" style="margin-bottom:10px" data-i18n="privacy"></p>
          <div class="bk-actions">
            <button class="btn" type="button" id="btnBackup">⬇ <span data-i18n="backup"></span></button>
            <button class="btn" type="button" id="btnRestore">⬆ <span data-i18n="restore"></span></button>
            <button class="btn btn-danger" type="button" id="btnClearAll">🗑 <span data-i18n="clear_all"></span></button>
          </div>
        </div>
      </section>

      <section class="bd-preview" id="previewCol">
        <div class="card pv-card" id="pvCard">
          <div class="sec-h mb0">
            <h2 data-i18n="preview_title"></h2>
            <span class="badge fit" id="fitStatus" aria-live="polite"></span>
            <button class="btn btn-sm btn-ghost" type="button" id="btnFs">⛶ <span data-i18n="fullscreen"></span></button>
          </div>
          <div class="pv-stage" id="pvStage"><div class="pv-scale" id="pvScale"></div></div>
          <div class="pv-actions">
            <button class="btn btn-primary" type="button" id="btnPrint">🖨 <span data-i18n="print_pdf"></span></button>
            <button class="btn btn-accent" type="button" id="btnPng">📱 <span data-i18n="png"></span></button>
          </div>
          <p class="hint" data-i18n="print_tip"></p>
        </div>
      </section>
    </div>

    <datalist id="dlRashi"></datalist>
    <datalist id="dlNak"></datalist>
  </main>
  <div id="printRoot" aria-hidden="true"></div>
  <div id="pngRoot" aria-hidden="true"></div>
  <script src="../../../apps/biodata-maker/../../shared/edu.js"></script>
  <script src="../../../apps/biodata-maker/strings.js"></script>
  <script src="../../../apps/biodata-maker/content.js"></script>
  <script src="../../../apps/biodata-maker/app.js"></script>
</body>
</html>
