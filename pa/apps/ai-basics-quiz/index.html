    .paper .p-key h2 { font-size: 15pt; }
    .paper .p-ans { padding-inline-start: 22pt; }
    .paper .p-ans li { margin-bottom: 6pt; break-inside: avoid; }
    .paper .p-foot { margin-top: 14pt; font-size: 9pt; color: #555; }
    @media print {
      /* Ctrl+P without the print buttons prints the screen as it is, never an old paper/certificate */
      body:not(.printing) #printArea { display: none !important; }
      body.printing #app > *:not(#printArea) { display: none !important; }
      body.printing #printArea { display: block !important; }
      #printArea .cert { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: linear-gradient(135deg, #fde6da, #dcefef 55%, #fef0c7); max-width: none; margin-top: 10mm; }
      #printArea .cert-in { background: #fff; color: #000; border-color: #0b4f5c; padding: 16mm 12mm; }
      #printArea .cert-brand { color: #0b4f5c; }
      #printArea .cert-title { color: #d9501c; font-size: 26pt; }
      #printArea .cert-name { font-size: 26pt; border-color: #555; }
      #printArea .cert-small, #printArea .cert-topics, #printArea .cert-foot { color: #333; }
      #printArea .cert-level { background: #fef0c7; color: #7a4504; border-color: #a15c07; }
      #printArea .cert-sign { border-color: #333; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <!-- ================= SETUP ================= -->
    <section id="setup" class="stack">
      <div id="resumeBox" class="callout accent" hidden>
        <div class="row spread">
          <span id="resumeMsg" style="font-weight:700"></span>
          <div class="row">
            <button class="btn btn-sm btn-primary" id="resumeBtn" type="button" data-i18n="resume"></button>
            <button class="btn btn-sm btn-ghost" id="discardBtn" type="button" data-i18n="discard"></button>
          </div>
        </div>
      </div>

      <div class="card stack">
        <h2 class="mb0" id="modeHead" data-i18n="choose_mode"></h2>
        <div class="modes" id="modes" role="group" aria-labelledby="modeHead">
          <button type="button" class="mode" id="mode-practice" data-mode="practice"><span class="mode-ic" aria-hidden="true">📝</span><span class="mode-name" data-i18n="mode_practice"></span><span class="mode-desc" data-i18n="mode_practice_d"></span></button>
          <button type="button" class="mode" id="mode-test" data-mode="test"><span class="mode-ic" aria-hidden="true">⏱️</span><span class="mode-name" data-i18n="mode_test"></span><span class="mode-desc" data-i18n="mode_test_d"></span></button>
          <button type="button" class="mode" id="mode-class" data-mode="class"><span class="mode-ic" aria-hidden="true">📽️</span><span class="mode-name" data-i18n="mode_class"></span><span class="mode-desc" data-i18n="mode_class_d"></span></button>
        </div>

        <div>
          <div class="row spread">
            <h3 class="mb0" id="topicHead" data-i18n="topics"></h3>
            <span id="availMsg" class="badge primary" aria-live="polite"></span>
          </div>
          <div class="chips" id="topicChips" role="group" aria-labelledby="topicHead"></div>
          <p id="topicErr" class="small bad mb0" style="margin-top:8px" role="alert" hidden data-i18n="pick_topic"></p>
        </div>

        <div class="opt-grid">
          <div class="field"><label for="numSel" data-i18n="num_questions"></label><select id="numSel"></select></div>
          <div class="field" data-for="test"><label for="testSecs" data-i18n="time_limit"></label><select id="testSecs"></select><span class="hint" id="testTotal"></span></div>
          <div class="field" data-for="class"><label for="classSecs" data-i18n="q_timer"></label><select id="classSecs"></select></div>
          <div class="field" data-for="class"><label for="teamCount" data-i18n="num_teams"></label><select id="teamCount"></select></div>
        </div>
        <div class="team-inputs" id="teamInputs" data-for="class"></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="shufQ"> <span data-i18n="shuffle_q"></span></label>
          <label class="check"><input type="checkbox" id="shufO"> <span data-i18n="shuffle_o"></span></label>
        </div>
        <div class="row start-row">
          <button class="btn btn-primary btn-lg" id="startBtn" type="button"><span data-i18n="start_quiz"></span> <span class="arr" aria-hidden="true">→</span></button>
          <button class="btn" id="paperBtn" type="button"><span aria-hidden="true">🖨️</span> <span data-i18n="print_paper"></span></button>
        </div>
      </div>

      <details class="card" id="help">
        <summary data-i18n="help_title"></summary>
        <ul class="tips">
          <li data-i18n="help_1"></li>
          <li data-i18n="help_2"></li>
          <li data-i18n="help_3"></li>
          <li data-i18n="help_4"></li>
          <li data-i18n="help_5"></li>
          <li data-i18n="help_6"></li>
        </ul>
        <div class="callout">
          <b data-i18n="formula_title"></b>
          <ul class="formulas">
            <li><span data-i18n="f_accuracy"></span> = <span class="mono no-i18n" dir="ltr">(TP + TN) ÷ (TP + TN + FP + FN)</span></li>
            <li><span data-i18n="f_precision"></span> = <span class="mono no-i18n" dir="ltr">TP ÷ (TP + FP)</span></li>
            <li><span data-i18n="f_recall"></span> = <span class="mono no-i18n" dir="ltr">TP ÷ (TP + FN)</span></li>
            <li><span data-i18n="f_f1"></span> = <span class="mono no-i18n" dir="ltr">2 × P × R ÷ (P + R)</span></li>
          </ul>
          <p class="small muted mb0" data-i18n="f_note"></p>
        </div>
      </details>

      <div class="card stack" id="historyCard">
        <div class="row spread">
          <h2 class="mb0" data-i18n="history_title"></h2>
          <span id="bestBadge" class="badge success" hidden></span>
        </div>
        <ol id="historyList" class="hist"></ol>
        <p id="historyEmpty" class="muted small mb0" data-i18n="history_empty"></p>
        <div class="row spread">
          <span class="tiny muted"><span aria-hidden="true">🔒</span> <span data-i18n="saved_local"></span></span>
          <div class="row">
            <button class="btn btn-sm" id="lastBtn" type="button" data-i18n="see_last" hidden></button>
            <button class="btn btn-sm btn-danger" id="resetBtn" type="button" data-i18n="reset_all"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= PRACTICE / TEST ================= -->
    <section id="quiz" class="card stack" hidden>
      <div class="qhead">
        <span class="badge primary" id="qProgress"></span>
        <span class="badge" id="qTopic"></span>
        <span class="grow"></span>
        <span class="badge success" id="qScore"></span>
        <span class="timer" id="qTimer" role="timer"></span>
      </div>
      <div class="progress"><span id="qBar"></span></div>
      <nav id="qNav" class="qnav" data-i18n-aria-label="question_list"></nav>
      <div class="row nowrap qrow">
        <h2 id="qText" class="qtext grow" tabindex="-1"></h2>
        <button class="edu-iconbtn" id="qSpeak" type="button" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button>
      </div>
      <div id="qOpts" class="opts" role="group" aria-labelledby="qText"></div>
      <div id="qFeedback" aria-live="polite"></div>
      <div class="navrow">
        <button class="btn" id="qPrev" type="button"><span class="arr" aria-hidden="true">←</span> <span data-i18n="previous"></span></button>
        <button class="btn btn-primary" id="qNext" type="button"><span id="qNextTxt"></span> <span class="arr" aria-hidden="true">→</span></button>
        <button class="btn btn-accent" id="qSubmit" type="button" data-i18n="submit_test"></button>
        <span class="grow"></span>
        <button class="btn btn-ghost btn-sm" id="qQuit" type="button" data-i18n="quit"></button>
      </div>
      <p class="tiny muted mb0" id="kbdHint" data-i18n="kbd_hint"></p>
    </section>

    <!-- ================= RESULTS ================= -->
    <section id="results" class="stack" hidden>
      <div class="card stack" id="resultCard">
        <div class="res-top">
          <div class="ring" id="rRing" role="img"><div><b id="rScore"></b><span id="rPct"></span></div></div>
          <div class="stack" aria-live="polite">
            <div class="row"><h2 class="mb0" data-i18n="result_title"></h2><span class="badge primary" id="rMode"></span></div>
            <p class="callout warning mb0" id="rTimeUp" hidden data-i18n="times_up"></p>
            <p class="rmsg" id="rMsg"></p>
            <div class="stats" id="rStats"></div>
          </div>
        </div>
        <h3 class="mb0" data-i18n="by_topic"></h3>
        <div class="topic-bars" id="rTopics"></div>
        <p class="callout mb0" id="rRevise" hidden></p>
        <div class="row">
          <button class="btn btn-primary" id="rMistakes" type="button" data-i18n="practice_mistakes"></button>
          <button class="btn" id="rAgain" type="button" data-i18n="new_quiz"></button>
          <button class="btn btn-ghost" id="rHome" type="button" data-i18n="back_setup"></button>
        </div>
      </div>

      <div class="card stack" id="certCard">
        <h2 class="mb0" data-i18n="cert_section"></h2>
        <div class="grid-2">
          <div class="field"><label for="certName" data-i18n="your_name"></label><input type="text" id="certName" maxlength="60" autocomplete="off" data-i18n-placeholder="name_ph"></div>
          <div class="field"><label for="certSchool" data-i18n="school_label"></label><input type="text" id="certSchool" maxlength="80" autocomplete="off" data-i18n-placeholder="school_ph"></div>
        </div>
        <div id="certBox"></div>
        <div class="row">
          <button class="btn btn-primary" id="certPrint" type="button"><span aria-hidden="true">🖨️</span> <span data-i18n="print_cert"></span></button>
          <span class="small muted" data-i18n="cert_hint"></span>
        </div>
      </div>

      <div class="card stack" id="reviewCard">
        <div class="row spread">
          <h2 class="mb0" data-i18n="review"></h2>
          <label class="check"><input type="checkbox" id="onlyWrong"> <span data-i18n="only_wrong"></span></label>
        </div>
        <ol id="rReview" class="review"></ol>
        <p id="rNoMistakes" class="callout success mb0" hidden data-i18n="no_mistakes"></p>
      </div>
    </section>

    <!-- ================= PROJECTOR QUIZ ================= -->
    <section id="classView" hidden>
      <div id="stage" class="card stage-q">
        <div id="cPlay">
          <div class="qhead">
            <span class="badge primary" id="cProgress"></span>
            <span class="badge" id="cTopic"></span>
            <span class="grow"></span>
            <span class="ctimer-box" id="cTimerBox">
              <span class="ctimer" id="cTimer" role="timer"></span>
              <button class="edu-iconbtn" id="cTimerBtn" type="button"></button>
            </span>
            <button class="edu-iconbtn" id="cSpeak" type="button" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button>
            <button class="edu-iconbtn" id="cFull" type="button" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen">⛶</button>
          </div>
          <div class="progress" style="margin-top:10px"><span id="cBar"></span></div>
          <h2 id="cText" class="ctext"></h2>
          <div id="cOpts" class="opts big" role="group" aria-labelledby="cText"></div>
          <div id="cExplain" class="callout success cexplain" aria-live="polite" hidden></div>
          <div class="cnav">
            <button class="btn btn-lg" id="cPrev" type="button"><span class="arr" aria-hidden="true">←</span> <span data-i18n="previous"></span></button>
            <button class="btn btn-lg btn-accent" id="cReveal" type="button"><span aria-hidden="true">👁️</span> <span data-i18n="reveal"></span></button>
            <button class="btn btn-lg btn-primary" id="cNext" type="button"><span id="cNextTxt"></span> <span class="arr" aria-hidden="true">→</span></button>
          </div>
        </div>
        <div id="cEnd" class="finish" hidden>
          <div class="trophy" aria-hidden="true">🏆</div>
          <h2 id="cWinner" aria-live="polite"></h2>
          <p class="muted mb0" data-i18n="final_scores"></p>
          <ol id="cRank" class="rank"></ol>
          <div class="cnav">
            <button class="btn btn-lg btn-primary" id="cAgain" type="button" data-i18n="play_again"></button>
            <button class="btn btn-lg" id="cHome" type="button" data-i18n="back_setup"></button>
          </div>
        </div>
        <div class="scoreboard" id="teams"></div>
        <div class="row spread small muted stage-foot" id="cFoot">
          <span data-i18n="class_tip"></span>
          <button class="btn btn-sm btn-ghost" id="cExit" type="button" data-i18n="quit"></button>
        </div>
      </div>
    </section>

    <div id="printArea" class="print-only"></div>
  </main>
  <script src="../../../apps/ai-basics-quiz/../../shared/edu.js"></script>
  <script src="../../../apps/ai-basics-quiz/strings.js"></script>
  <script src="../../../apps/ai-basics-quiz/content.js"></script>
  <script src="../../../apps/ai-basics-quiz/app.js"></script>
</body>
</html>
