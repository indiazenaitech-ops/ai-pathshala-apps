  <style>
    .cv-privacy { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
    .cv-privacy .cv-lock { font-size: 1.3rem; line-height: 1.3; flex: none; }
    .cv-privacy p { margin: 0; }
    .cv-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
    @media (max-width: 900px) { .cv-grid { grid-template-columns: minmax(0, 1fr); } }
    .cv-grid h2 { font-size: 1.15rem; }
    #paste { min-height: 190px; font-family: var(--mono); font-size: .88rem; white-space: pre; overflow: auto; tab-size: 10; line-height: 1.5; }
    .cv-map { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
    .cv-map select { width: 100%; min-width: 0; text-overflow: ellipsis; }
    .cv-opts { display: grid; gap: 10px; }
    .cv-opts .check { min-height: 32px; align-items: flex-start; }
    .cv-opts .check input { margin-top: 3px; flex: none; }
    .cv-cc input { width: 7rem; }
    .cv-tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 118px), 1fr)); }
    @media (max-width: 620px) { .cv-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .cv-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; }
    .cv-stat-l { color: var(--muted); font-size: .76rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
    .cv-stat-v { font-size: 1.5rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .cv-stat.good .cv-stat-v { color: var(--success); }
    .cv-stat.bad .cv-stat-v { color: var(--danger); }
    .cv-stat.warn .cv-stat-v { color: var(--warning); }
    .cv-tablewrap { max-height: 62vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .cv-table { font-size: .88rem; }
    .cv-table th, .cv-table td { white-space: nowrap; padding: 6px 9px; }
    .cv-table th { z-index: 1; }
    .cv-table td.cv-name { white-space: normal; min-width: 8rem; max-width: 15rem; overflow-wrap: anywhere; }
    .cv-table td.cv-status { white-space: normal; min-width: 11rem; max-width: 18rem; }
    .cv-line { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cv-num { display: block; direction: ltr; unicode-bidi: isolate; text-align: start; font-variant-numeric: tabular-nums; }
    .cv-badnum { color: var(--danger); text-decoration: line-through; }
    .cv-also { display: block; color: var(--muted); font-size: .78rem; }
    .cv-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-weight: 700; font-size: .78rem; white-space: nowrap; }
    .cv-chip.ok { background: var(--success-soft); color: var(--success); }
    .cv-chip.warn { background: var(--warning-soft); color: var(--warning); }
    .cv-chip.bad { background: var(--danger-soft); color: var(--danger); }
    .cv-reason { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
    tr.cv-bad td { color: var(--muted); }
    .seg button { min-height: 40px; }
    .cv-file input { max-width: 18rem; }
    .cv-count { font-weight: 800; }
    .cv-split { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
    #split-n { width: 6.5rem; }
    .cv-parts { display: flex; flex-wrap: wrap; gap: 8px; max-height: 230px; overflow: auto; }
    .cv-preview summary { cursor: pointer; font-weight: 600; }
    #preview { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: .8rem; white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; max-height: 300px; overflow: auto; }
    .cv-help summary { cursor: pointer; font-weight: 700; font-size: 1.02rem; }
    .cv-help ul { margin: 12px 0 4px; padding-inline-start: 1.3em; }
    .cv-help li + li { margin-top: 6px; }
    .cv-prog { display: flex; align-items: center; gap: 10px; }
    .cv-prog .progress { flex: 1 1 auto; }
    @media print {
      .edu-intro, .cv-privacy, .cv-left, .cv-export, .cv-help, .seg, #more, .cv-prog { display: none !important; }
      .cv-grid { grid-template-columns: minmax(0, 1fr); }
      .cv-tablewrap { max-height: none; overflow: visible; border: 0; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="callout success cv-privacy" role="note">
      <span class="cv-lock" aria-hidden="true">🔒</span>
      <p data-i18n="privacy"></p>
    </div>

    <div class="cv-grid">
      <div class="stack cv-left">
        <section class="card stack" aria-labelledby="h-input">
          <h2 id="h-input" data-i18n="h_input"></h2>
          <label class="field"><span data-i18n="paste_label"></span>
            <textarea id="paste" class="no-i18n" rows="8" spellcheck="false" dir="auto" data-i18n-placeholder="paste_ph"></textarea>
          </label>
          <div class="row">
            <button type="button" class="btn" id="open-csv"><span aria-hidden="true">📄</span> <span data-i18n="open_csv"></span></button>
            <button type="button" class="btn" id="open-vcf"><span aria-hidden="true">👤</span> <span data-i18n="open_vcf"></span></button>
            <button type="button" class="btn" id="load-example" data-i18n="load_example"></button>
            <button type="button" class="btn btn-ghost" id="clear" data-i18n="clear"></button>
          </div>
          <div class="callout accent small" id="example-note" hidden><span data-i18n="example_note"></span></div>
          <div class="callout small row" id="vcf-note" hidden><span id="vcf-note-txt"></span> <button type="button" class="btn btn-sm" id="dl-vcf-csv" data-i18n="dl_vcf_csv"></button></div>
          <p class="muted small mb0" data-i18n="excel_tip"></p>
        </section>

        <section class="card stack" aria-labelledby="h-map" id="map-card" hidden>
          <h2 id="h-map" data-i18n="h_map"></h2>
          <p class="muted small mb0" data-i18n="map_hint"></p>
          <label class="check"><input type="checkbox" id="has-header"> <span data-i18n="has_header"></span></label>
          <div class="cv-map" id="map"></div>
        </section>

        <section class="card stack" aria-labelledby="h-clean">
          <h2 id="h-clean" data-i18n="h_clean"></h2>
          <div class="cv-opts">
            <label class="field cv-cc"><span data-i18n="cc_label"></span><input type="text" id="cc" class="no-i18n" inputmode="numeric" maxlength="4" autocomplete="off"><span class="hint tiny" data-i18n="cc_hint"></span></label>
            <label class="check"><input type="checkbox" id="opt-title"> <span data-i18n="opt_title"></span></label>
            <label class="check"><input type="checkbox" id="opt-dedupe"> <span data-i18n="opt_dedupe"></span></label>
            <label class="check"><input type="checkbox" id="opt-landline"> <span data-i18n="opt_landline"></span></label>
            <label class="check"><input type="checkbox" id="opt-intl"> <span data-i18n="opt_intl"></span></label>
          </div>
          <div class="grid-2">
            <label class="field"><span data-i18n="prefix_label"></span><input type="text" id="prefix" class="no-i18n" maxlength="30" data-i18n-placeholder="prefix_ph"></label>
            <label class="field"><span data-i18n="suffix_label"></span><input type="text" id="suffix" class="no-i18n" maxlength="30" data-i18n-placeholder="suffix_ph"></label>
          </div>
          <p class="muted small mb0" data-i18n="prefix_hint"></p>
        </section>
      </div>

      <div class="stack">
        <section class="card stack" aria-labelledby="h-result">
          <h2 id="h-result" data-i18n="h_result"></h2>
          <div class="cv-tiles" id="stats" aria-live="polite"></div>
          <div class="cv-prog" id="prog" hidden><div class="progress"><span id="prog-bar" style="width:0%"></span></div><span class="small muted" id="prog-txt"></span></div>
          <div class="row spread">
            <div class="seg" role="group" id="filters" data-i18n-aria-label="filter_label"></div>
            <span class="muted small" id="showing"></span>
          </div>
          <div class="scroll-x cv-tablewrap" id="tablewrap" hidden><table class="table cv-table no-i18n" id="table" data-i18n-aria-label="aria_table"></table></div>
          <p class="muted" id="empty-msg"></p>
          <div class="row"><button type="button" class="btn" id="more" hidden></button></div>
        </section>

        <section class="card stack cv-export" aria-labelledby="h-export">
          <h2 id="h-export" data-i18n="h_export"></h2>
          <label class="field cv-file"><span data-i18n="file_label"></span><input type="text" id="fname" class="no-i18n" maxlength="40"></label>
          <div class="row">
            <button type="button" class="btn btn-primary btn-lg" id="dl-vcf"><span aria-hidden="true">⬇</span> <span data-i18n="dl_vcf"></span> <span class="badge cv-count" id="vcf-count">0</span></button>
            <button type="button" class="btn" id="dl-csv"><span aria-hidden="true">📊</span> <span data-i18n="dl_csv"></span></button>
            <button type="button" class="btn" id="dl-google"><span aria-hidden="true">👥</span> <span data-i18n="dl_google"></span></button>
            <button type="button" class="btn" id="copy-numbers"><span aria-hidden="true">📋</span> <span data-i18n="copy_numbers"></span></button>
          </div>
          <div class="panel stack">
            <div class="cv-split">
              <label for="split-n" data-i18n="split_label"></label>
              <input type="number" id="split-n" class="no-i18n" min="1" max="100000" step="1" inputmode="numeric">
              <button type="button" class="btn" id="dl-zip"><span aria-hidden="true">🗜</span> <span data-i18n="dl_parts_zip"></span></button>
            </div>
            <p class="muted small mb0" data-i18n="split_hint"></p>
            <p class="small mb0" id="parts-summary"></p>
            <div class="cv-parts" id="parts"></div>
          </div>
          <p class="muted small mb0" data-i18n="import_tip"></p>
          <details class="cv-preview"><summary data-i18n="preview_title"></summary><pre class="no-i18n" id="preview" dir="ltr"></pre></details>
        </section>
      </div>
    </div>

    <details class="card cv-help" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/contact-list-vcf/../../shared/edu.js"></script>
  <script src="../../../apps/contact-list-vcf/strings.js"></script>
  <script src="../../../apps/contact-list-vcf/app.js"></script>
</body>
