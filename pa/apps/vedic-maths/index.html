<body>
  <main id="app">
    <div class="vm-topline">
      <p class="edu-intro" data-i18n="intro"></p>
      <span class="vm-privacy" aria-hidden="false">🔒 <span data-i18n="privacy"></span></span>
    </div>

    <div class="vm-layout">
      <aside class="card vm-side">
        <h2 data-i18n="pick_trick"></h2>
        <div id="picker" role="group"></div>
      </aside>

      <section class="card vm-main">
        <div class="vm-head">
          <h2 id="trick-name" class="no-i18n"></h2>
          <button class="btn btn-sm btn-ghost no-print" id="present" aria-pressed="false" data-i18n="present"></button>
        </div>
        <p class="vm-tag no-i18n" id="trick-tag"></p>

        <div class="vm-controls no-print">
          <span class="vm-lbl" data-i18n="level"></span>
          <div class="seg" id="levels" role="group">
            <button type="button" data-level="1" data-i18n="level_1"></button>
            <button type="button" data-level="2" data-i18n="level_2"></button>
            <button type="button" data-level="3" data-i18n="level_3"></button>
          </div>
        </div>

        <div class="tabs vm-tabs no-print" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="learn" aria-selected="true" data-i18n="tab_learn"></button>
          <button type="button" role="tab" data-tab="try" aria-selected="false" data-i18n="tab_try"></button>
          <button type="button" role="tab" data-tab="drill" aria-selected="false" data-i18n="tab_drill"></button>
          <button type="button" role="tab" data-tab="worksheet" aria-selected="false" data-i18n="tab_worksheet"></button>
          <button type="button" role="tab" data-tab="progress" aria-selected="false" data-i18n="tab_progress"></button>
        </div>

        <!-- LEARN -->
        <div class="vm-tab" id="tab-learn">
          <div class="vm-stage" aria-live="polite">
            <p class="vm-q vm-math no-i18n" id="ex-q"></p>
            <ol class="vm-steps" id="ex-steps"></ol>
            <div class="vm-ex-ans vm-math no-i18n" id="ex-ans"></div>
          </div>
          <div class="vm-ex-ctl no-print">
            <button class="btn btn-primary" id="new-ex" data-i18n="new_example"></button>
            <button class="btn" id="replay" data-i18n="replay"></button>
            <button class="btn btn-ghost" id="show-all" data-i18n="show_all"></button>
            <label class="field" style="flex-direction: row; align-items: center; gap: 8px;">
              <span data-i18n="speed"></span>
              <select id="speed">
                <option value="slow" data-i18n="speed_slow"></option>
                <option value="normal" selected data-i18n="speed_normal"></option>
                <option value="fast" data-i18n="speed_fast"></option>
              </select>
            </label>
          </div>
          <div class="vm-own no-print">
            <h3 data-i18n="own_heading"></h3>
            <div class="vm-own-row">
              <div class="vm-own-row" id="own-fields" style="flex: 1 1 auto;"></div>
              <button class="btn btn-accent" id="own-go" data-i18n="own_go"></button>
            </div>
            <p class="vm-msg" id="own-msg" aria-live="polite"></p>
          </div>
          <div class="vm-how">
            <div class="callout"><h3 data-i18n="how_heading"></h3><ul id="trick-how" class="no-i18n"></ul></div>
            <div class="callout accent"><h3 data-i18n="why_heading"></h3><p id="trick-why" class="no-i18n" style="margin:0"></p></div>
          </div>
        </div>

        <!-- TRY -->
        <div class="vm-tab" id="tab-try" hidden>
          <p class="muted" data-i18n="try_intro"></p>
          <div class="vm-stage">
            <p class="vm-q vm-math no-i18n" id="try-q"></p>
            <div class="vm-ans-row">
              <label class="field"><span id="try-a-label"></span><input id="try-a" class="vm-math" type="text" inputmode="numeric" autocomplete="off" pattern="-?[0-9]*"></label>
              <label class="field" id="try-r-wrap" hidden><span data-i18n="remainder"></span><input id="try-r" class="vm-math" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*"></label>
              <button class="btn btn-primary" id="try-check" data-i18n="check"></button>
              <button class="btn" id="try-next" data-i18n="next_q"></button>
            </div>
            <p class="vm-fb" id="try-fb" aria-live="polite"></p>
            <ol class="vm-steps" id="try-steps" hidden></ol>
          </div>
          <p class="tiny muted" data-i18n="try_hint" id="try-hint"></p>
        </div>

        <!-- DRILL -->
        <div class="vm-tab" id="tab-drill" hidden>
          <div id="drill-setup">
            <p class="muted" data-i18n="drill_intro"></p>
            <div class="vm-controls">
              <span class="vm-lbl" data-i18n="questions_n"></span>
              <div class="seg" id="drill-n" role="group">
                <button type="button" data-n="5" class="vm-math">5</button>
                <button type="button" data-n="10" class="vm-math">10</button>
              </div>
            </div>
            <p class="muted small" id="drill-best"></p>
            <button class="btn btn-primary btn-lg" id="drill-start" data-i18n="drill_start"></button>
          </div>
          <div id="drill-play" hidden>
            <div class="vm-drill-top">
              <span class="badge primary" id="drill-count"></span>
              <span class="vm-clock" id="drill-clock" aria-live="off">0.0</span>
            </div>
            <div class="progress" aria-hidden="true"><span id="drill-bar" style="width:0"></span></div>
            <div class="vm-stage" style="margin-top:10px">
              <p class="vm-q vm-math no-i18n" id="drill-q"></p>
              <div class="vm-ans-row">
                <label class="field"><span id="drill-a-label"></span><input id="drill-a" class="vm-math" type="text" inputmode="numeric" autocomplete="off" pattern="-?[0-9]*"></label>
                <label class="field" id="drill-r-wrap" hidden><span data-i18n="remainder"></span><input id="drill-r" class="vm-math" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*"></label>
                <button class="btn btn-primary" id="drill-ok" data-i18n="check"></button>
                <button class="btn btn-ghost" id="drill-quit" data-i18n="stop"></button>
              </div>
              <p class="vm-fb warn" id="drill-fb" aria-live="polite"></p>
            </div>
          </div>
          <div id="drill-done" hidden aria-live="polite">
            <p class="vm-score" id="drill-score"></p>
            <p class="muted" id="drill-msg"></p>
            <div class="scroll-x">
              <table class="table vm-drill-table">
                <thead><tr><th data-i18n="col_question"></th><th data-i18n="col_yours"></th><th data-i18n="col_answer"></th><th data-i18n="col_ok"></th></tr></thead>
                <tbody id="drill-review"></tbody>
              </table>
            </div>
            <div class="row" style="margin-top:12px">
              <button class="btn btn-primary" id="drill-again" data-i18n="drill_again"></button>
              <button class="btn" id="drill-back" data-i18n="drill_back"></button>
            </div>
          </div>
        </div>

        <!-- WORKSHEET -->
        <div class="vm-tab" id="tab-worksheet" hidden>
          <p class="muted vm-ws-intro" data-i18n="ws_intro"></p>
          <div class="vm-controls vm-ws-ctl">
            <label class="field vm-ws-pick"><span data-i18n="ws_choose"></span><select id="ws-trick" class="no-i18n"></select></label>
            <button class="btn" id="ws-new" data-i18n="ws_new"></button>
            <button class="btn btn-primary" id="ws-print" data-i18n="ws_print"></button>
          </div>
          <div class="vm-ws-sheet">
            <div class="vm-ws-head">
              <h3><span data-i18n="app_title"></span> · <span id="ws-title" class="no-i18n"></span></h3>
              <span class="small"><span data-i18n="level"></span>: <span id="ws-level"></span></span>
            </div>
            <div class="vm-ws-meta small">
              <span><span data-i18n="ws_name"></span>: <span class="vm-ws-line"></span></span>
              <span><span data-i18n="ws_date"></span>: <span class="vm-ws-line"></span></span>
            </div>
            <ol class="vm-ws-list" id="ws-list"></ol>
            <p class="tiny muted" id="ws-legend" data-i18n="ws_legend" hidden></p>
            <details class="vm-ws-keywrap">
              <summary data-i18n="ws_key"></summary>
              <ol class="vm-ws-key" id="ws-key"></ol>
            </details>
          </div>
        </div>

        <!-- PROGRESS -->
        <div class="vm-tab" id="tab-progress" hidden>
          <p class="muted" data-i18n="prog_intro"></p>
          <p class="muted" id="prog-none" data-i18n="prog_none"></p>
          <div class="scroll-x" id="prog-table" hidden>
            <table class="table">
              <thead><tr><th data-i18n="col_trick"></th><th data-i18n="col_score"></th><th data-i18n="col_accuracy"></th><th data-i18n="col_best"></th></tr></thead>
              <tbody id="prog-body"></tbody>
            </table>
          </div>
          <button class="btn btn-danger btn-sm" id="prog-reset" style="margin-top:12px" data-i18n="prog_reset"></button>
        </div>
      </section>
    </div>

    <details class="card vm-help no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/vedic-maths/../../shared/edu.js"></script>
  <script src="../../../apps/vedic-maths/strings.js"></script>
  <script src="../../../apps/vedic-maths/content.js"></script>
  <script src="../../../apps/vedic-maths/app.js"></script>
</body>
</html>
