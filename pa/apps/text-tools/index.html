          <button type="button" role="tab" id="tab-clean" data-tab="clean" aria-controls="p-clean"><span class="ic" aria-hidden="true">🧹</span><span data-i18n="tab_clean"></span></button>
          <button type="button" role="tab" id="tab-lines" data-tab="lines" aria-controls="p-lines"><span class="ic" aria-hidden="true">📋</span><span data-i18n="tab_lines"></span></button>
          <button type="button" role="tab" id="tab-find" data-tab="find" aria-controls="p-find"><span class="ic" aria-hidden="true">🔍</span><span data-i18n="tab_find"></span></button>
          <button type="button" role="tab" id="tab-extract" data-tab="extract" aria-controls="p-extract"><span class="ic" aria-hidden="true">🧲</span><span data-i18n="tab_extract"></span></button>
          <button type="button" role="tab" id="tab-freq" data-tab="freq" aria-controls="p-freq"><span class="ic" aria-hidden="true">📊</span><span data-i18n="tab_freq"></span></button>
        </div>
        <p id="msg" class="tt-msg" role="status" aria-live="polite"></p>

        <!-- Case -->
        <div id="p-case" class="tt-panel" role="tabpanel" aria-labelledby="tab-case">
          <div class="tt-grid tt-case">
            <button type="button" class="btn" data-case="upper"><span class="demo no-i18n" aria-hidden="true">HELLO</span><span data-i18n="c_upper"></span></button>
            <button type="button" class="btn" data-case="lower"><span class="demo no-i18n" aria-hidden="true">hello</span><span data-i18n="c_lower"></span></button>
            <button type="button" class="btn" data-case="title"><span class="demo no-i18n" aria-hidden="true">Hello World</span><span data-i18n="c_title"></span></button>
            <button type="button" class="btn" data-case="sentence"><span class="demo no-i18n" aria-hidden="true">Hello world.</span><span data-i18n="c_sentence"></span></button>
            <button type="button" class="btn" data-case="alternate"><span class="demo no-i18n" aria-hidden="true">hElLo</span><span data-i18n="c_alt"></span></button>
            <button type="button" class="btn" data-case="inverse"><span class="demo no-i18n" aria-hidden="true">hELLO</span><span data-i18n="c_inverse"></span></button>
          </div>
          <div class="tt-opts">
            <label class="check"><input type="checkbox" id="o-small" checked> <span data-i18n="case_small"></span></label>
            <label class="check"><input type="checkbox" id="o-caps" checked> <span data-i18n="case_caps"></span></label>
          </div>
          <p class="small muted tt-note" data-i18n="case_note"></p>
        </div>

        <!-- Clean up -->
        <div id="p-clean" class="tt-panel" role="tabpanel" aria-labelledby="tab-clean" hidden>
          <button type="button" class="btn btn-primary tt-wide" data-op="quickClean"><span class="ic" aria-hidden="true">✨</span> <span data-i18n="cl_quick"></span></button>
          <h3 data-i18n="cl_g_spaces"></h3>
          <div class="tt-grid">
            <button type="button" class="btn" data-op="trimLines" data-i18n="cl_trim"></button>
            <button type="button" class="btn" data-op="collapseSpaces" data-i18n="cl_spaces"></button>
            <button type="button" class="btn" data-op="removeEmptyLines" data-i18n="cl_empty"></button>
            <button type="button" class="btn" data-op="squeezeEmptyLines" data-i18n="cl_squeeze"></button>
            <button type="button" class="btn" data-op="joinBroken" data-i18n="cl_join"></button>
            <button type="button" class="btn" data-op="removeBreaks" data-i18n="cl_breaks"></button>
          </div>
          <p class="tiny muted tt-note" data-i18n="cl_join_hint"></p>
          <h3 data-i18n="cl_g_remove"></h3>
          <div class="tt-grid">
            <button type="button" class="btn" data-op="stripHtml" data-i18n="cl_html"></button>
            <button type="button" class="btn" data-op="removeEmojis" data-i18n="cl_emoji"></button>
            <button type="button" class="btn" data-op="removeNumbers" data-i18n="cl_numbers"></button>
            <button type="button" class="btn" data-op="removePunct" data-i18n="cl_punct"></button>
          </div>
          <label class="check"><input type="checkbox" id="o-danda"> <span data-i18n="cl_keep_danda"></span></label>
          <h3 data-i18n="cl_g_quotes"></h3>
          <div class="tt-grid">
            <button type="button" class="btn" data-op="curlyQuotes"><span data-i18n="cl_curly"></span> <span class="no-i18n" aria-hidden="true">“ ”</span></button>
            <button type="button" class="btn" data-op="straightQuotes"><span data-i18n="cl_straight"></span> <span class="no-i18n" aria-hidden="true">" '</span></button>
            <button type="button" class="btn" data-op="tabsToSpaces" data-i18n="cl_tabs2sp"></button>
            <button type="button" class="btn" data-op="spacesToTabs" data-i18n="cl_sp2tabs"></button>
          </div>
          <div class="tt-row">
            <label class="field narrow"><span data-i18n="cl_tabsize"></span>
              <select id="o-tabsize"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select></label>
          </div>
        </div>

        <!-- Lines -->
        <div id="p-lines" class="tt-panel" role="tabpanel" aria-labelledby="tab-lines" hidden>
          <h3 data-i18n="ln_g_order"></h3>
          <div class="tt-row">
            <button type="button" class="btn btn-primary" data-op="dedupe" id="b-dedupe"><span class="ic" aria-hidden="true">🧽</span> <span data-i18n="ln_dedupe"></span></button>
            <label class="check"><input type="checkbox" id="o-dcase" checked> <span data-i18n="ln_case"></span></label>
          </div>
          <p class="tiny muted tt-note" data-i18n="ln_dedupe_hint"></p>
          <div class="tt-row">
            <label class="field"><span data-i18n="ln_sort_by"></span><select id="o-sort"></select></label>
            <button type="button" class="btn" data-op="sortLines" id="b-sort"><span class="ic" aria-hidden="true">↕️</span> <span data-i18n="ln_sort"></span></button>
            <button type="button" class="btn" data-op="reverseLines" data-i18n="ln_reverse"></button>
            <button type="button" class="btn" data-op="shuffleLines" data-i18n="ln_shuffle"></button>
          </div>
          <p class="tiny muted tt-note" id="sort-note"></p>

          <h3 data-i18n="ln_g_add"></h3>
          <div class="tt-row">
            <label class="field"><span data-i18n="ln_style"></span><select id="o-nstyle"></select></label>
            <label class="field narrow"><span data-i18n="ln_start"></span><input type="number" id="o-nstart" value="1" step="1" inputmode="numeric"></label>
            <button type="button" class="btn" data-op="numberLines" data-i18n="ln_number"></button>
            <button type="button" class="btn" data-op="unnumberLines" data-i18n="ln_unnumber"></button>
          </div>
          <div class="tt-row">
            <label class="field"><span data-i18n="ln_prefix"></span><input type="text" id="o-prefix" class="no-i18n" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span data-i18n="ln_suffix"></span><input type="text" id="o-suffix" class="no-i18n" autocomplete="off" spellcheck="false"></label>
            <button type="button" class="btn" data-op="affixLines" data-i18n="ln_affix"></button>
          </div>

          <h3 data-i18n="ln_g_filter"></h3>
          <div class="tt-row">
            <label class="field"><span data-i18n="ln_word"></span><input type="text" id="o-word" class="no-i18n" autocomplete="off"></label>
            <button type="button" class="btn" data-op="keepLines" data-i18n="ln_keep"></button>
            <button type="button" class="btn" data-op="dropLines" data-i18n="ln_remove"></button>
          </div>
          <label class="check"><input type="checkbox" id="o-wcase"> <span data-i18n="ln_wcase"></span></label>

          <h3 data-i18n="ln_g_split"></h3>
          <div class="tt-row">
            <label class="field narrow"><span data-i18n="ln_delim"></span><input type="text" id="o-delim" class="no-i18n" value=", " autocomplete="off" spellcheck="false"></label>
            <button type="button" class="btn" data-op="splitText" data-i18n="ln_split"></button>
            <button type="button" class="btn" data-op="joinText" data-i18n="ln_joinwith"></button>
          </div>
          <div class="tt-chips" id="delims" role="group" data-i18n-aria-label="ln_delim">
            <button type="button" class="chip" data-delim=", " data-i18n="dl_comma"></button>
            <button type="button" class="chip" data-delim="; " data-i18n="dl_semi"></button>
            <button type="button" class="chip" data-delim=" " data-i18n="dl_space"></button>
            <button type="button" class="chip" data-delim="\t" data-i18n="dl_tab"></button>
            <button type="button" class="chip" data-delim=" | " data-i18n="dl_pipe"></button>
            <button type="button" class="chip" data-delim="\n" data-i18n="dl_nl"></button>
          </div>
          <p class="tiny muted tt-note" data-i18n-html="ln_delim_hint"></p>
        </div>

        <!-- Find & replace -->
        <div id="p-find" class="tt-panel" role="tabpanel" aria-labelledby="tab-find" hidden>
          <label class="field"><span data-i18n="fr_find"></span><input type="text" id="f-find" class="no-i18n" dir="auto" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span data-i18n="fr_repl"></span><input type="text" id="f-repl" class="no-i18n" dir="auto" autocomplete="off" spellcheck="false"></label>
          <div class="tt-opts">
            <label class="check"><input type="checkbox" id="f-case"> <span data-i18n="fr_case"></span></label>
            <label class="check"><input type="checkbox" id="f-whole"> <span data-i18n="fr_whole"></span></label>
            <label class="check"><input type="checkbox" id="f-regex"> <span data-i18n="fr_regex"></span></label>
          </div>
          <div class="row">
            <button type="button" class="btn" id="f-go"><span class="ic" aria-hidden="true">🔍</span> <span data-i18n="fr_btn_find"></span></button>
            <button type="button" class="btn" id="f-next"><span data-i18n="fr_btn_next"></span> <span aria-hidden="true">↓</span></button>
            <button type="button" class="btn btn-primary" id="f-all"><span class="ic" aria-hidden="true">🔁</span> <span data-i18n="fr_btn_all"></span></button>
          </div>
          <p id="f-info" class="tt-info" aria-live="polite"></p>
          <p class="small muted tt-note" data-i18n-html="fr_help"></p>
        </div>

        <!-- Extract -->
        <div id="p-extract" class="tt-panel" role="tabpanel" aria-labelledby="tab-extract" hidden>
          <div class="tt-kinds" id="ex-kind" role="group" data-i18n-aria-label="tab_extract">
            <button type="button" class="chip" data-kind="emails"><span aria-hidden="true">✉️</span> <span data-i18n="ex_emails"></span></button>
            <button type="button" class="chip" data-kind="urls"><span aria-hidden="true">🔗</span> <span data-i18n="ex_urls"></span></button>
            <button type="button" class="chip" data-kind="phones"><span aria-hidden="true">📱</span> <span data-i18n="ex_phones"></span></button>
            <button type="button" class="chip" data-kind="tags"><span aria-hidden="true">#</span> <span data-i18n="ex_tags"></span></button>
            <button type="button" class="chip" data-kind="numbers"><span aria-hidden="true">🔢</span> <span data-i18n="ex_numbers"></span></button>
          </div>
          <label class="check"><input type="checkbox" id="ex-unique" checked> <span data-i18n="ex_unique"></span></label>
          <p id="ex-info" class="tt-info" aria-live="polite"></p>
          <textarea id="ex-out" class="tt-exout no-i18n" readonly dir="auto" data-i18n-aria-label="ex_list"></textarea>
          <div class="row">
            <button type="button" class="btn" id="ex-copy"><span class="ic" aria-hidden="true">📋</span> <span data-i18n="ex_copy"></span></button>
            <button type="button" class="btn" id="ex-use"><span class="ic" aria-hidden="true">⤴️</span> <span data-i18n="ex_use"></span></button>
          </div>
          <p class="tiny muted tt-note" id="ex-note"></p>
        </div>

        <!-- Top words -->
        <div id="p-freq" class="tt-panel" role="tabpanel" aria-labelledby="tab-freq" hidden>
          <div class="tt-row">
            <label class="field narrow"><span data-i18n="fq_show"></span><select id="fq-top"></select></label>
            <button type="button" class="btn" id="fq-csv"><span class="ic" aria-hidden="true">⬇️</span> <span data-i18n="fq_csv"></span></button>
          </div>
          <label class="check"><input type="checkbox" id="fq-skip" checked> <span data-i18n="fq_skip"></span></label>
          <p id="fq-info" class="tt-info"></p>
          <div class="tt-fqwrap" id="fq-wrap">
            <table class="table tt-fq">
              <thead><tr><th scope="col" class="n">#</th><th scope="col" data-i18n="fq_word"></th><th scope="col" class="n" data-i18n="fq_count"></th><th scope="col" data-i18n="fq_share"></th></tr></thead>
              <tbody id="fq-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <!-- Compare two texts -->
    <section class="card tt-cmp" id="cmp-card" aria-labelledby="h-cmp">
      <div class="tt-head">
        <h2 id="h-cmp"><span aria-hidden="true">⚖️</span> <span data-i18n="h_cmp"></span></h2>
        <div class="row">
          <button type="button" class="btn btn-sm" id="cmp-sample"><span aria-hidden="true">📄</span> <span data-i18n="example"></span></button>
          <button type="button" class="btn btn-sm" id="cmp-swap"><span aria-hidden="true">⇄</span> <span data-i18n="cmp_swap"></span></button>
          <button type="button" class="btn btn-sm" id="cmp-copy"><span aria-hidden="true">📋</span> <span data-i18n="cmp_copy"></span></button>
          <button type="button" class="btn btn-sm" id="cmp-print"><span aria-hidden="true">🖨️</span> <span data-i18n="print"></span></button>
        </div>
      </div>
      <p class="muted small" data-i18n="cmp_intro"></p>
      <div class="tt-cmp-in">
        <div class="field">
          <div class="tt-lbl"><label for="cmp-a" data-i18n="cmp_a"></label><button type="button" class="btn btn-sm" id="cmp-a-main" data-i18n="cmp_use_main"></button></div>
          <textarea id="cmp-a" class="no-i18n" dir="auto" spellcheck="false" autocomplete="off" data-i18n-placeholder="cmp_ph_a"></textarea>
        </div>
        <div class="field">
          <div class="tt-lbl"><label for="cmp-b" data-i18n="cmp_b"></label><button type="button" class="btn btn-sm" id="cmp-b-main" data-i18n="cmp_use_main"></button></div>
          <textarea id="cmp-b" class="no-i18n" dir="auto" spellcheck="false" autocomplete="off" data-i18n-placeholder="cmp_ph_b"></textarea>
        </div>
      </div>
      <div class="tt-cmp-bar">
        <div class="field"><span data-i18n="cmp_by"></span>
          <div class="seg" role="group" id="cmp-by" data-i18n-aria-label="cmp_by">
            <button type="button" data-by="line" data-i18n="by_line"></button>
            <button type="button" data-by="word" data-i18n="by_word"></button>
            <button type="button" data-by="letter" data-i18n="by_letter"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="cmp_view"></span>
          <div class="seg" role="group" id="cmp-view" data-i18n-aria-label="cmp_view">
            <button type="button" data-view="side" data-i18n="v_side"></button>
            <button type="button" data-view="inline" data-i18n="v_inline"></button>
          </div>
        </div>
        <div class="tt-cmp-checks">
          <label class="check"><input type="checkbox" id="cmp-icase"> <span data-i18n="cmp_icase"></span></label>
          <label class="check"><input type="checkbox" id="cmp-space"> <span data-i18n="cmp_space"></span></label>
        </div>
        <button type="button" class="btn btn-primary tt-go" id="cmp-go"><span aria-hidden="true">⚖️</span> <span data-i18n="cmp_btn"></span></button>
      </div>
      <div id="cmp-sum" class="tt-sum" aria-live="polite" data-state="idle"></div>
      <div class="tt-legend" id="cmp-legend" hidden>
        <span class="a"><i aria-hidden="true">+</i> <span data-i18n="leg_add"></span></span>
        <span class="d"><i aria-hidden="true">−</i> <span data-i18n="leg_del"></span></span>
      </div>
      <div id="cmp-out" class="tt-diff no-i18n"></div>
    </section>

    <details class="card tt-help no-print" id="help">
      <summary data-i18n="help_h"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/text-tools/../../shared/edu.js"></script>
  <script src="../../../apps/text-tools/strings.js"></script>
  <script src="../../../apps/text-tools/content.js"></script>
  <script src="../../../apps/text-tools/engine.js"></script>
  <script src="../../../apps/text-tools/app.js"></script>
</body>
</html>
