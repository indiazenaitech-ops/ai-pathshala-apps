  <style>
    #app { --code-size: 1rem; }
    .sqlp-loading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .sqlp-spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: sqlp-spin .8s linear infinite; flex: none; }
    @keyframes sqlp-spin { to { transform: rotate(360deg); } }

    .sqlp-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .sqlp-work { display: grid; gap: 16px; min-width: 0; }
    @media (min-width: 980px) {
      .sqlp-layout { grid-template-columns: minmax(0, 310px) minmax(0, 1fr); }
      .sqlp-side { grid-column: 1; grid-row: 1; }
      .sqlp-work { grid-column: 2; grid-row: 1; }
    }

    .sqlp-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sqlp-actions { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
    .sqlp-pickers { display: flex; gap: 8px; align-items: center; flex: 1 1 24rem; min-width: 0; }
    .sqlp-pickers select { min-width: 0; flex: 1 1 10rem; }
    .sqlp-run { min-width: 7.5rem; }
    .sqlp-iconbtn { font-weight: 700; }
    @media (max-width: 620px) {
      .sqlp-actions { flex: 1 1 100%; }
      .sqlp-run { flex: 1 1 auto; }
      .sqlp-pickers { flex-wrap: wrap; }
      .sqlp-pickers select { flex: 1 1 100%; }
    }
    .sqlp-editor, .sqlp-code, .sqlp-answer, .sqlp-stmt, .sqlp-err-msg, .sqlp-cols, .sqlp-tname, details.card code {
      font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
    }
    .sqlp-label { display: block; margin: 12px 0 6px; }
    .sqlp-editor {
      display: block; width: 100%; min-height: 9.5em; resize: vertical;
      font-family: var(--mono); font-size: var(--code-size); line-height: 1.5; tab-size: 2;
      background: var(--surface-2); text-align: left; direction: ltr;
    }
    .sqlp-hint-line { margin: 8px 0 0; }

    .sqlp-task { margin-top: 12px; }
    .sqlp-task p { margin: 6px 0; }
    .sqlp-answer, .sqlp-code {
      font-family: var(--mono); font-size: calc(var(--code-size) * .92); white-space: pre-wrap; word-break: break-word;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0;
      direction: ltr; text-align: left;
    }
    .sqlp-msg-ok { color: var(--success); font-weight: 700; }
    .sqlp-msg-bad { color: var(--danger); font-weight: 700; }

    .sqlp-block { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .sqlp-block:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
    .sqlp-block-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
    .sqlp-stmt { font-family: var(--mono); font-size: .85rem; color: var(--muted); direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; flex: 1 1 14rem; min-width: 0; }
    .sqlp-scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; width: fit-content; max-width: 100%; }
    .sqlp-table { font-size: var(--code-size); font-variant-numeric: tabular-nums; width: auto; min-width: 100%; }
    .sqlp-table th, .sqlp-table td { white-space: nowrap; padding: 6px 12px; }
    .sqlp-table th { z-index: 1; }
    .sqlp-table td.num, .sqlp-table th.num { text-align: end; }
    .sqlp-table .rn { color: var(--muted); text-align: end; width: 1%; background: var(--surface-2); }
    .sqlp-null { color: var(--muted); font-style: italic; }
    .sqlp-ok { color: var(--success); font-weight: 700; }
    .sqlp-err-msg { display: block; font-family: var(--mono); font-size: .9rem; margin: 6px 0; overflow-wrap: anywhere; direction: ltr; text-align: left; }
    .sqlp-empty { text-align: center; padding: 22px 8px; }
    /* a long misspelt name in an error/hint must wrap instead of widening the page on phones */
    .sqlp-block .callout, .sqlp-block > p, #checkMsg, #taskText { overflow-wrap: anywhere; }

    .sqlp-side .tabs { margin-bottom: 10px; }
    .sqlp-tbl { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .sqlp-tbl:last-child { border-bottom: 0; }
    .sqlp-tbl-head { display: flex; align-items: center; gap: 8px; }
    .sqlp-tname { font-family: var(--mono); font-weight: 800; font-size: 1rem; background: none; border: 0; color: var(--primary); padding: 6px 2px; cursor: pointer; min-height: 40px; }
    .sqlp-tname:hover { text-decoration: underline; }
    .sqlp-tdesc { margin: 0 0 6px; }
    .sqlp-cols { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; }
    .sqlp-col { font-family: var(--mono); font-size: .85rem; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 6px 8px; min-height: 36px; cursor: pointer; }
    .sqlp-col:hover { border-color: var(--primary); }
    .sqlp-col small { color: var(--muted); font-size: .72rem; margin-inline-start: 4px; }
    .sqlp-col.pk { border-color: var(--accent); }
    .sqlp-tasks { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
    .sqlp-tasks button { width: 100%; text-align: start; display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .9rem; cursor: pointer; min-height: 44px; }
    .sqlp-tasks button:hover { border-color: var(--primary); }
    .sqlp-tasks button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .sqlp-tasks .num { font-weight: 800; color: var(--muted); min-width: 1.6em; }
    .sqlp-tasks .done .num { color: var(--success); }

    .sqlp-more { margin-top: 16px; }
    .sqlp-more h2 { font-size: 1rem; margin: 0; flex-basis: 100%; }
    details.card { margin-top: 16px; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 32px; }
    details.card ul { padding-inline-start: 1.3em; }
    details.card li { margin: 6px 0; }
    details.card code { background: var(--surface-2); border-radius: 5px; padding: 1px 5px; font-size: .9em; }

    .edu-fullscreen-on .edu-main { max-width: none; }

    #printSheet h1 { font-size: 1.4rem; }
    #printSheet h3 { margin: 14px 0 6px; font-family: var(--mono); }
    #printSheet table { font-size: 9.5pt; width: auto; }
    #printSheet th, #printSheet td { padding: 2px 8px; border: 1px solid #999; white-space: nowrap; position: static; }
    #printSheet .sheet-pair { display: grid; grid-template-columns: auto auto; gap: 24px; justify-content: start; align-items: start; }
    #printSheet ol li { margin: 4px 0 26px; }
    @media print {
      .sqlp-side, .sqlp-toolbar, .sqlp-more, details.card, .sqlp-loading, .edu-intro, .sqlp-hint-line, .sqlp-label, .sqlp-editor, .sqlp-csv { display: none !important; }
      .sqlp-layout { display: block; }
      .sqlp-scroll { max-height: none; overflow: visible; border: 0; }
      .sqlp-table th { position: static; }
      #printSql { display: block !important; }
      body.sqlp-printing .edu-main > *:not(#printSheet) { display: none !important; }
      body:not(.sqlp-printing) #printSheet { display: none !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="loadBox" class="callout sqlp-loading" role="status" aria-live="polite">
      <span class="sqlp-spinner" id="loadSpin" aria-hidden="true"></span>
      <span id="loadMsg" data-i18n="loading_engine"></span>
      <button class="btn btn-sm" id="retryBtn" type="button" data-i18n="try_again" hidden></button>
    </div>

    <div class="sqlp-layout">
      <section class="sqlp-work">
        <div class="card">
          <div class="sqlp-toolbar no-print">
            <div class="sqlp-actions">
              <button class="btn btn-primary btn-lg sqlp-run" id="runBtn" type="button" disabled><span aria-hidden="true">▶</span> <span data-i18n="run"></span></button>
              <button class="btn" id="clearBtn" type="button" data-i18n="clear"></button>
              <button class="edu-iconbtn sqlp-iconbtn" id="sizeBtn" type="button" data-i18n-title="text_size" data-i18n-aria-label="text_size">A+</button>
              <button class="edu-iconbtn" id="fsBtn" type="button" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
            </div>
            <div class="sqlp-pickers">
              <select id="exSelect" data-i18n-aria-label="examples"></select>
              <select id="histSelect" class="no-i18n" data-i18n-aria-label="history"></select>
            </div>
          </div>

          <div id="taskBox" class="callout accent sqlp-task" hidden>
            <div class="row spread nowrap">
              <strong id="taskTitle"></strong>
              <button class="edu-iconbtn" id="taskClose" type="button" data-i18n-aria-label="close" data-i18n-title="close">✕</button>
            </div>
            <p id="taskText"></p>
            <div class="row">
              <button class="btn btn-accent" id="checkBtn" type="button" data-i18n="check" disabled></button>
              <button class="btn" id="answerBtn" type="button" data-i18n="show_answer"></button>
            </div>
            <pre id="answerCode" class="sqlp-answer no-i18n" hidden></pre>
            <p id="checkMsg" aria-live="polite" class="mb0"></p>
          </div>

          <label for="editor" class="sqlp-label" data-i18n="editor_label"></label>
          <textarea id="editor" class="sqlp-editor no-i18n" dir="ltr" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" rows="7"></textarea>
          <pre id="printSql" class="sqlp-code no-i18n" hidden></pre>
          <p class="muted small sqlp-hint-line" data-i18n="run_hint"></p>
        </div>

        <div class="card">
          <h2 data-i18n="results"></h2>
          <div id="results" aria-live="polite"></div>
        </div>
      </section>

      <aside class="card sqlp-side no-print">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tabTables" aria-controls="paneTables" aria-selected="true" data-i18n="tables"></button>
          <button type="button" role="tab" id="tabPractice" aria-controls="panePractice" aria-selected="false" data-i18n="practice"></button>
        </div>
        <div id="paneTables" role="tabpanel" aria-labelledby="tabTables">
          <p class="muted small" data-i18n="tap_to_insert"></p>
          <div id="schema"></div>
        </div>
        <div id="panePractice" role="tabpanel" aria-labelledby="tabPractice" hidden>
          <p class="muted small" data-i18n="practice_intro"></p>
          <div class="progress" aria-hidden="true"><span id="solvedBar" style="width:0"></span></div>
          <p class="small mb0" id="solvedTxt" style="margin-top:6px"></p>
          <ol class="sqlp-tasks" id="taskList"></ol>
        </div>
      </aside>
    </div>

    <div class="card row sqlp-more no-print">
      <h2 data-i18n="more_tools"></h2>
      <button class="btn" id="printBtn" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print_sheet"></span></button>
      <button class="btn" id="dumpBtn" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="download_sql"></span></button>
      <button class="btn" id="csvImportBtn" type="button"><span aria-hidden="true">⬆</span> <span data-i18n="import_csv"></span></button>
      <button class="btn btn-danger" id="resetBtn" type="button"><span aria-hidden="true">↺</span> <span data-i18n="reset_db"></span></button>
      <span class="muted small" data-i18n="saved_local"></span>
    </div>

    <details class="card" id="helpBox">
      <summary data-i18n="help"></summary>
      <ul id="tipsList"></ul>
      <h3 data-i18n="about_inside"></h3>
      <p class="mb0" data-i18n="inside_text"></p>
    </details>

    <details class="card" id="mysqlBox">
      <summary data-i18n="mysql_title"></summary>
      <p data-i18n="mysql_intro"></p>
      <ul id="mysqlList" class="mb0"></ul>
    </details>

    <section id="printSheet" class="print-only" aria-hidden="true"></section>
  </main>
  <script src="../../../apps/sql-playground/../../shared/edu.js"></script>
  <script src="../../../apps/sql-playground/strings.js"></script>
  <script src="../../../apps/sql-playground/content.js"></script>
  <script src="../../../apps/sql-playground/data.js"></script>
  <script src="../../../apps/sql-playground/app.js"></script>
</body>
</html>
