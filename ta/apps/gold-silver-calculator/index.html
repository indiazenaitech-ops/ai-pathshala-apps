              <span class="hint" data-i18n="own_hint"></span>
              <span class="gs-lbl" id="p-jw-lbl" data-i18n="jw_rate_label"></span>
              <div class="gs-chips" id="p-jw" role="group" aria-labelledby="p-jw-lbl">
                <button type="button" class="chip" data-jw="5">5%</button>
                <button type="button" class="chip" data-jw="18">18%</button>
              </div>
            </div>
          </div>
          <div class="field">
            <span class="gs-lbl" id="p-supply-lbl" data-i18n="supply_label"></span>
            <div class="seg gs-seg" id="p-supply" role="group" aria-labelledby="p-supply-lbl">
              <button type="button" data-supply="intra" data-i18n="supply_intra"></button>
              <button type="button" data-supply="inter" data-i18n="supply_inter"></button>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="p-round"><span data-i18n="round_label"></span></label>
          <div class="row"><button type="button" class="btn btn-sm btn-danger" id="p-reset" data-i18n="reset_tab"></button></div>
        </div>
        <div class="card gs-result" id="p-result" aria-live="polite"></div>
      </div>
      <div class="callout gs-note" id="p-note">
        <p><strong data-i18n="gst_rule_title"></strong></p>
        <p data-i18n="gst_rule_1"></p>
        <p data-i18n="gst_rule_2"></p>
        <p data-i18n="gst_rule_3"></p>
      </div>
    </section>

    <!-- 2. Old gold exchange -->
    <section id="panel-exch" role="tabpanel" aria-labelledby="tab-exch" class="gs-panel" hidden>
      <div class="gs-two">
        <div class="card stack">
          <h2 class="mb0" data-i18n="ex_title"></h2>
          <div class="field">
            <span class="gs-lbl" id="x-metal-lbl" data-i18n="metal_label"></span>
            <div class="seg gs-seg" id="x-metal" role="group" aria-labelledby="x-metal-lbl">
              <button type="button" data-metal="gold" data-i18n="m_gold"></button>
              <button type="button" data-metal="silver" data-i18n="m_silver"></button>
            </div>
          </div>
          <div class="gs-pair">
            <div class="field">
              <label for="x-w" data-i18n="ex_weight"></label>
              <div class="gs-in" id="x-w-wrap"><input id="x-w" class="gs-num" type="text" inputmode="decimal" autocomplete="off"><select id="x-wu" data-i18n-aria-label="wunit_aria"></select></div>
            </div>
            <div class="field">
              <label for="x-sw" data-i18n="stone_wt_label"></label>
              <div class="gs-in" id="x-sw-wrap"><input id="x-sw" class="gs-num" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><select id="x-swu" data-i18n-aria-label="wunit_aria"></select></div>
            </div>
          </div>
          <p class="gs-info" id="x-net"></p>
          <div class="field">
            <span class="gs-lbl" id="x-pur-lbl" data-i18n="ex_purity"></span>
            <div class="gs-chips" id="x-pur" role="group" aria-labelledby="x-pur-lbl"></div>
            <div class="gs-fine" id="x-fine-box" hidden>
              <label for="x-fine" data-i18n="fine_label"></label>
              <input id="x-fine" class="gs-num" type="text" inputmode="decimal" autocomplete="off" placeholder="912">
              <span class="hint" data-i18n="fine_hint"></span>
            </div>
            <span class="hint" data-i18n="ex_purity_hint"></span>
          </div>
          <div class="field">
            <label for="x-rate" data-i18n="rate_label"></label>
            <div class="gs-in" id="x-rate-wrap"><span class="gs-pfx" aria-hidden="true">₹</span><input id="x-rate" class="gs-num" type="text" inputmode="decimal" autocomplete="off"><select id="x-runit" data-i18n-aria-label="rate_unit_aria"></select></div>
            <span class="gs-sub" id="x-rfor-lbl" data-i18n="rate_for_label"></span>
            <div class="seg gs-seg" id="x-rfor" role="group" aria-labelledby="x-rfor-lbl">
              <button type="button" data-rfor="pur"></button>
              <button type="button" data-rfor="base"></button>
            </div>
            <p class="gs-derived" id="x-derived"></p>
          </div>
          <div class="field">
            <label for="x-ded" data-i18n="ex_ded"></label>
            <div class="gs-in" id="x-ded-wrap"><input id="x-ded" class="gs-num" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span class="gs-sfx" aria-hidden="true">%</span></div>
            <span class="hint" data-i18n="ex_ded_hint"></span>
          </div>
          <div class="field">
            <label for="x-new" data-i18n="ex_new_label"></label>
            <div class="gs-in" id="x-new-wrap"><span class="gs-pfx" aria-hidden="true">₹</span><input id="x-new" class="gs-num" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
            <div class="row"><button type="button" class="btn btn-sm" id="x-use" data-i18n="ex_use_price"></button></div>
          </div>
          <p class="gs-err" id="x-err" role="alert"></p>
          <div class="row"><button type="button" class="btn btn-sm btn-danger" id="x-reset" data-i18n="reset_tab"></button></div>
        </div>
        <div class="card gs-result" id="x-result" aria-live="polite"></div>
      </div>
      <div class="callout gs-note"><p data-i18n="ex_note"></p></div>
    </section>

    <!-- 3. Compare shops -->
    <section id="panel-cmp" role="tabpanel" aria-labelledby="tab-cmp" class="gs-panel" hidden>
      <div class="card stack">
        <h2 class="mb0" data-i18n="cmp_title"></h2>
        <p class="muted small mb0" data-i18n="cmp_intro"></p>
        <div class="gs-pair">
          <div class="field">
            <label for="c-w" data-i18n="cmp_weight"></label>
            <div class="gs-in" id="c-w-wrap"><input id="c-w" class="gs-num" type="text" inputmode="decimal" autocomplete="off"><span class="gs-sfx" aria-hidden="true" data-i18n="u_g"></span></div>
          </div>
          <div class="field">
            <label for="c-runit" data-i18n="cmp_unit"></label>
            <select id="c-runit"></select>
          </div>
        </div>
        <p class="gs-err" id="c-err" role="alert"></p>
      </div>
      <div class="gs-shops" id="c-shops"></div>
      <div class="card" id="c-result" aria-live="polite"></div>
    </section>

    <!-- 4. Rate converter -->
    <section id="panel-conv" role="tabpanel" aria-labelledby="tab-conv" class="gs-panel" hidden>
      <div class="gs-two">
        <div class="card stack">
          <h2 class="mb0" data-i18n="cv_title"></h2>
          <div class="field">
            <span class="gs-lbl" id="v-metal-lbl" data-i18n="metal_label"></span>
            <div class="seg gs-seg" id="v-metal" role="group" aria-labelledby="v-metal-lbl">
              <button type="button" data-metal="gold" data-i18n="m_gold"></button>
              <button type="button" data-metal="silver" data-i18n="m_silver"></button>
              <button type="button" data-metal="plat" data-i18n="m_plat"></button>
            </div>
          </div>
          <div class="field">
            <label for="v-rate" data-i18n="rate_label"></label>
            <div class="gs-in" id="v-rate-wrap"><span class="gs-pfx" aria-hidden="true">₹</span><input id="v-rate" class="gs-num" type="text" inputmode="decimal" autocomplete="off"><select id="v-runit" data-i18n-aria-label="rate_unit_aria"></select></div>
          </div>
          <div class="field">
            <span class="gs-lbl" id="v-pur-lbl" data-i18n="cv_for"></span>
            <div class="gs-chips" id="v-pur" role="group" aria-labelledby="v-pur-lbl"></div>
            <div class="gs-fine" id="v-fine-box" hidden>
              <label for="v-fine" data-i18n="fine_label"></label>
              <input id="v-fine" class="gs-num" type="text" inputmode="decimal" autocomplete="off" placeholder="958">
              <span class="hint" data-i18n="fine_hint"></span>
            </div>
          </div>
          <p class="gs-err" id="v-err" role="alert"></p>
          <p class="gs-info" data-i18n="cv_units_note"></p>
          <div class="row"><button type="button" class="btn btn-sm btn-danger" id="v-reset" data-i18n="reset_tab"></button></div>
        </div>
        <div class="card" id="v-result" aria-live="polite"></div>
      </div>
      <div class="callout gs-note"><p data-i18n="cv_method"></p></div>
    </section>

    <!-- 5. Buyer checklist -->
    <section id="panel-check" role="tabpanel" aria-labelledby="tab-check" class="gs-panel" hidden>
      <div class="card stack">
        <div class="row spread">
          <h2 class="mb0" data-i18n="ck_title"></h2>
          <strong id="ck-count" aria-live="polite"></strong>
        </div>
        <ul class="gs-ck" id="ck-list"></ul>
        <div class="row">
          <button type="button" class="btn" id="ck-print">🖨 <span data-i18n="print"></span></button>
          <button type="button" class="btn btn-danger" id="ck-clear" data-i18n="ck_clear"></button>
        </div>
        <p class="muted small mb0" data-i18n="ck_source"></p>
      </div>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
        <li data-i18n="how_6"></li>
      </ul>
    </details>
    <p class="muted small no-print" id="rules-checked" style="margin-top:12px"></p>

    <div id="print-area" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/gold-silver-calculator/../../shared/edu.js"></script>
  <script src="../../../apps/gold-silver-calculator/strings.js"></script>
  <script src="../../../apps/gold-silver-calculator/calc.js"></script>
  <script src="../../../apps/gold-silver-calculator/app.js"></script>
</body>
</html>
