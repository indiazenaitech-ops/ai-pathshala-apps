  <style>
    .tz-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -6px 0 14px; }
    .tz-top .badge { font-size: .82rem; padding: 4px 10px; white-space: normal; }
    .tz-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); align-items: start; }
    @media (max-width: 900px) { .tz-layout { grid-template-columns: minmax(0, 1fr); } }
    .tz-col > * + * { margin-top: 16px; }
    .card h2 { font-size: 1.15rem; }
    .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }

    /* ---------- meeting time controls ---------- */
    .ctl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
    .ctl-grid .field.wide { grid-column: 1 / -1; }
    .ctl-grid input, .ctl-grid select { width: 100%; min-height: 44px; }
    .ctl-grid .lbl { font-weight: 600; font-size: .92rem; color: var(--text); }
    .seg.fill { display: flex; width: 100%; }
    .seg.fill button { flex: 1 1 0; min-height: 42px; }
    .err { color: var(--danger); font-weight: 600; }

    /* ---------- people ---------- */
    #city-results { display: grid; gap: 4px; margin-top: 6px; }
    .cres { display: flex; justify-content: space-between; gap: 8px; align-items: center; text-align: start; padding: 8px 12px; min-height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
    .cres:hover, .cres:focus-visible { background: var(--surface-2); border-color: var(--primary); }
    .cres .cm { color: var(--muted); font-size: .8rem; font-weight: 500; white-space: nowrap; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .quick .chip { min-height: 36px; padding: 4px 11px; }
    .plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); border-inline-start: 5px solid var(--pc, var(--border)); }
    .prow .pname { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }
    .prow .pname b { overflow-wrap: anywhere; }
    .prow .del { grid-column: 2; grid-row: 1; width: 40px; min-height: 40px; padding: 0; color: var(--danger); font-size: 1.05rem; }
    .prow .phours { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: .86rem; color: var(--muted); }
    .prow .phours select { min-height: 38px; padding: 4px 8px; font-size: .9rem; direction: ltr; }
    .prow .pnow { grid-column: 1 / -1; color: var(--muted); font-size: .84rem; }
    .badge.tzb { font-size: .72rem; padding: 1px 7px; }

    /* ---------- results ---------- */
    .res { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .res li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border-inline-start: 5px solid var(--pc, var(--border)); }
    .res li.home { background: var(--primary-soft); }
    .res .rn { font-weight: 700; overflow-wrap: anywhere; }
    .res .rm { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
    .res .rt { grid-column: 2; grid-row: 1; font-weight: 800; font-size: 1.12rem; text-align: end; white-space: nowrap; }
    .res .rd { grid-column: 2; grid-row: 2; font-size: .84rem; color: var(--muted); text-align: end; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
    .rate { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
    .rate.good { background: var(--success-soft); color: var(--success); }
    .rate.ok { background: var(--warning-soft); color: var(--warning); }
    .rate.bad { background: var(--surface-3); color: var(--muted); }
    .shift { font-weight: 700; color: var(--accent); white-space: nowrap; }
    @media (max-width: 420px) { .res .rt { font-size: 1rem; } }

    /* ---------- 24-hour strip ---------- */
    .legend { display: flex; flex-wrap: wrap; gap: 6px; }
    .strip-wrap { direction: ltr; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; padding-bottom: 4px; }
    .strip { border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
    .strip th.who { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--surface); text-align: start; width: 118px; min-width: 118px; max-width: 118px; padding: 2px 8px 2px 2px; font-size: .8rem; line-height: 1.2; vertical-align: middle; border-inline-start: 4px solid var(--pc, var(--border)); border-radius: 6px; direction: inherit; }
    .strip th.who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .82rem; unicode-bidi: plaintext; }
    .strip th.who small { color: var(--muted); font-weight: 600; font-size: .7rem; white-space: nowrap; }
    .strip thead th.who { font-weight: 600; color: var(--muted); border-inline-start-color: transparent; }
    .strip th.hh { padding: 0; width: 46px; min-width: 46px; }
    .strip .hb { width: 100%; min-height: 42px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font: inherit; font-weight: 700; font-size: .8rem; line-height: 1.1; cursor: pointer; padding: 3px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .strip .hb small { font-weight: 600; font-size: .6rem; color: var(--muted); }
    .strip .hb:hover { background: var(--surface-3); }
    .strip .hb.now { box-shadow: inset 0 0 0 2px var(--accent); }
    .strip .hb.now small { color: var(--accent); }
    .strip td.hc { padding: 0; height: 44px; border-radius: 8px; text-align: center; font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; cursor: pointer; vertical-align: middle; }
    .strip td.hc small { display: block; font-size: .6rem; font-weight: 600; opacity: .9; }
    .strip td.good { background: var(--success-soft); color: var(--success); }
    .strip td.ok { background: var(--warning-soft); color: var(--warning); }
    .strip td.bad { background: var(--surface-2); color: var(--muted); }
    .strip td.sum { padding: 2px 0; text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); }
    .strip td.sum.all { color: var(--success); }
    .strip .sel { outline: 3px solid var(--primary); outline-offset: -2px; }
    .strip .drag { outline: 3px dashed var(--accent); outline-offset: -2px; }
    .strip thead .hb.sel { background: var(--primary); color: var(--primary-ink); }
    .strip thead .hb.sel small { color: var(--primary-ink); }

    /* ---------- best slots ---------- */
    .best { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .best li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
    .best li.all { border-color: color-mix(in srgb, var(--success) 60%, var(--border)); background: var(--success-soft); }
    .best .bt { font-weight: 800; min-width: 9.5rem; }
    .best .bn { font-size: .86rem; color: var(--muted); }
    .best li.all .bn { color: var(--success); font-weight: 700; }
    .best .dots { display: inline-flex; gap: 3px; }
    .best .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); }
    .best .dot.good { background: var(--success); } .best .dot.ok { background: var(--warning); } .best .dot.bad { background: var(--c8); opacity: .5; }
    .best .use { margin-inline-start: auto; }

    /* ---------- invite ---------- */
    #invite { width: 100%; font-family: var(--font); font-size: .92rem; line-height: 1.5; min-height: 190px; }
    :root[lang="ur"] #invite { line-height: 1.9; }
    #share-url { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* ---------- world clock ---------- */
    .clocks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .ck { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; border-inline-start: 5px solid var(--pc, var(--border)); min-width: 0; }
    .ck .ckn { font-weight: 700; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ck .ckt { font-size: 1.55rem; font-weight: 800; line-height: 1.25; white-space: nowrap; }
    .ck .ckd { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 3px 6px; }
    @media (max-width: 420px) { .clocks { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ck .ckt { font-size: 1.3rem; } }

    details.card summary { cursor: pointer; font-weight: 700; }
    details.card ul { padding-inline-start: 22px; margin: 10px 0 0; display: grid; gap: 6px; }

    /* Urdu (Nastaliq) needs taller lines */
    :root[lang="ur"] .prow .pname, :root[lang="ur"] .res .rn, :root[lang="ur"] .best li, :root[lang="ur"] .cres, :root[lang="ur"] .ck .ckn, :root[lang="ur"] .rate, :root[lang="ur"] .badge { line-height: 1.9; }
    :root[lang="ur"] .strip th.who { font-family: "Noto Sans", system-ui, sans-serif; line-height: 1.3; }

    @media print {
      .tz-layout { grid-template-columns: minmax(0, 1fr); }
      #invite { border: 1px solid #bbb; min-height: 0; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="tz-top no-print">
      <span class="badge success"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></span>
    </div>
    <p class="callout warning small no-print" id="fallback-note" hidden data-i18n="fallback_note"></p>

    <div class="tz-layout">
      <div class="tz-col">
        <!-- meeting time -->
        <section class="card stack" id="time-card">
          <h2 data-i18n="sec_time"></h2>
          <div class="ctl-grid">
            <div class="field"><label for="date" data-i18n="date"></label><input type="date" id="date"></div>
            <div class="field"><label for="dur" data-i18n="duration"></label>
              <select id="dur">
                <option value="30" data-i18n="dur_30"></option>
                <option value="45" data-i18n="dur_45"></option>
                <option value="60" data-i18n="dur_60"></option>
                <option value="90" data-i18n="dur_90"></option>
                <option value="120" data-i18n="dur_120"></option>
                <option value="180" data-i18n="dur_180"></option>
              </select>
            </div>
            <div class="field"><label for="time" data-i18n="start_time"></label><input type="time" id="time" step="300"></div>
            <div class="field"><label for="from" data-i18n="in_zone"></label><select id="from"></select></div>
            <div class="field wide">
              <span class="lbl" id="clock-lbl" data-i18n="clock_fmt"></span>
              <div class="seg fill" role="group" aria-labelledby="clock-lbl" id="hseg">
                <button type="button" data-h="12" data-i18n="h12"></button>
                <button type="button" data-h="24" data-i18n="h24"></button>
              </div>
            </div>
          </div>
          <p class="small err mb0" id="time-err" hidden data-i18n="err_time"></p>
        </section>

        <!-- people -->
        <section class="card stack" id="people-card">
          <h2 data-i18n="sec_people"></h2>
          <div class="field no-print">
            <label for="city-q" data-i18n="search_label"></label>
            <input type="search" id="city-q" autocomplete="off" data-i18n-placeholder="search_ph" aria-controls="city-results" aria-autocomplete="list">
            <div id="city-results" class="no-i18n" role="group" data-i18n-aria-label="search_label"></div>
            <p class="tiny muted mb0" id="no-match" hidden data-i18n="no_match"></p>
          </div>
          <div class="quick no-print" id="quick"></div>
          <ul class="plist" id="people"></ul>
          <p class="tiny muted mb0" data-i18n="wh_help"></p>
        </section>
      </div>

      <div class="tz-col">
        <!-- results -->
        <section class="card stack" id="res-card">
          <h2 data-i18n="sec_results"></h2>
          <p class="small muted mb0 num" id="res-date"></p>
          <ul class="res" id="results" aria-live="polite"></ul>
        </section>

        <!-- 24-hour strip -->
        <section class="card stack no-print" id="strip-card">
          <h2 data-i18n="sec_strip"></h2>
          <p class="small muted mb0" data-i18n="strip_help"></p>
          <div class="legend">
            <span class="rate good" data-i18n="good"></span>
            <span class="rate ok" data-i18n="ok"></span>
            <span class="rate bad" data-i18n="bad"></span>
          </div>
          <div class="scroll-x strip-wrap" id="strip-wrap"></div>
        </section>

        <!-- best slots -->
        <section class="card stack no-print" id="best-card">
          <h2 data-i18n="sec_best"></h2>
          <p class="small muted mb0" data-i18n="best_help"></p>
          <div id="best"></div>
        </section>

        <!-- invite -->
        <section class="card stack" id="invite-card">
          <h2 id="invite-h" data-i18n="sec_invite"></h2>
          <div class="field no-print"><label for="title" data-i18n="title_label"></label><input type="text" id="title" maxlength="80" data-i18n-placeholder="title_ph"></div>
          <textarea id="invite" class="no-i18n" readonly rows="9" aria-labelledby="invite-h"></textarea>
          <div class="row no-print">
            <button type="button" class="btn btn-primary" id="copy-invite"><span aria-hidden="true">📋</span> <span data-i18n="copy_text"></span></button>
            <a class="btn btn-wa" id="wa" href="#" target="_blank" rel="noopener"><span aria-hidden="true">💬</span> <span data-i18n="wa_send"></span></a>
            <button type="button" class="btn" id="ics"><span aria-hidden="true">📅</span> <span data-i18n="ics_dl"></span></button>
            <button type="button" class="btn" id="share"><span aria-hidden="true">🔗</span> <span data-i18n="share_link"></span></button>
            <input type="text" id="share-url" class="no-i18n" readonly tabindex="-1" aria-hidden="true">
          </div>
          <p class="tiny muted mb0" data-i18n="invite_help"></p>
        </section>
      </div>
    </div>

    <!-- world clock -->
    <section class="card stack no-print" id="clock-card" style="margin-top:16px">
      <h2 data-i18n="sec_clock"></h2>
      <p class="small muted mb0" data-i18n="clock_help"></p>
      <div class="clocks" id="clocks"></div>
    </section>

    <details class="card no-print" id="help" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted"><span aria-hidden="true">🔒</span> <span data-i18n="saved_local"></span></span>
        <button class="btn btn-sm btn-danger" id="reset-all" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/timezone-meeting-planner/../../shared/edu.js"></script>
  <script src="../../../apps/timezone-meeting-planner/strings.js"></script>
  <script src="../../../apps/timezone-meeting-planner/content.js"></script>
  <script src="../../../apps/timezone-meeting-planner/app.js"></script>
