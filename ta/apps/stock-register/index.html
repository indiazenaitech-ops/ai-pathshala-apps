                  <th scope="col" class="num" data-i18n="col_out"></th>
                  <th scope="col" class="num" data-i18n="col_purchase"></th>
                  <th scope="col" class="num" data-i18n="col_sales"></th>
                </tr>
              </thead>
              <tbody id="report-body"></tbody>
              <tfoot id="report-foot"></tfoot>
            </table>
          </div>
          <p class="muted center" id="m-empty" hidden data-i18n="no_moves"></p>
          <div class="center no-print"><button type="button" class="btn" id="m-more" data-i18n="show_more" hidden></button></div>
        </div>
      </section>

      <!-- ===================== EXPIRY ===================== -->
      <section id="pane-expiry" role="tabpanel" aria-labelledby="tab-expiry" hidden>
        <div class="card stack">
          <div class="row no-print">
            <label class="field"><span data-i18n="exp_window"></span>
              <select id="exp-days">
                <option value="7" data-i18n="days_7"></option>
                <option value="30" selected data-i18n="days_30"></option>
                <option value="60" data-i18n="days_60"></option>
                <option value="90" data-i18n="days_90"></option>
              </select>
            </label>
            <span class="badge primary" id="exp-count" aria-live="polite"></span>
          </div>
          <p class="muted small mb0" data-i18n="exp_help"></p>
          <div class="scroll-x">
            <table class="table exp">
              <thead>
                <tr>
                  <th scope="col" data-i18n="col_name"></th>
                  <th scope="col" data-i18n="col_sku"></th>
                  <th scope="col" class="num" data-i18n="col_stock"></th>
                  <th scope="col" data-i18n="col_expiry"></th>
                  <th scope="col" data-i18n="col_days"></th>
                  <th scope="col" class="no-print" data-i18n="col_actions"></th>
                </tr>
              </thead>
              <tbody id="exp-body"></tbody>
            </table>
          </div>
          <p class="muted center" id="exp-empty" hidden data-i18n="no_expiry"></p>
        </div>
      </section>

      <!-- ===================== DATA & BACKUP ===================== -->
      <section id="pane-data" role="tabpanel" aria-labelledby="tab-data" hidden>
        <div class="grid-2">
          <div class="card stack">
            <h2 data-i18n="settings"></h2>
            <label class="field"><span data-i18n="shop_name"></span><input type="text" id="shop" maxlength="80" dir="auto" autocomplete="off" data-i18n-placeholder="shop_ph"></label>
            <label class="field"><span data-i18n="default_gst"></span><input type="text" id="default-gst" inputmode="decimal" dir="ltr" list="gst-list" autocomplete="off" class="tnum"></label>
          </div>
          <div class="card stack">
            <h2 data-i18n="csv_title"></h2>
            <p class="muted small mb0" data-i18n="csv_help"></p>
            <code class="cols" data-i18n="csv_cols"></code>
            <label class="check"><input type="checkbox" id="csv-update" checked> <span data-i18n="csv_update"></span></label>
            <div class="row">
              <button type="button" class="btn btn-primary" id="import-csv"><span aria-hidden="true">⬆</span> <span data-i18n="import_items"></span></button>
              <button type="button" class="btn" id="export-items-2"><span aria-hidden="true">⬇</span> <span data-i18n="export_items"></span></button>
              <button type="button" class="btn" id="export-moves-2"><span aria-hidden="true">⬇</span> <span data-i18n="export_moves"></span></button>
            </div>
          </div>
          <div class="card stack">
            <h2 data-i18n="backup_title"></h2>
            <p class="muted small mb0" data-i18n="backup_help"></p>
            <div class="row">
              <button type="button" class="btn btn-primary" id="backup-btn"><span aria-hidden="true">💾</span> <span data-i18n="backup_dl"></span></button>
              <button type="button" class="btn" id="restore-btn"><span aria-hidden="true">📂</span> <span data-i18n="restore"></span></button>
            </div>
            <p class="small mb0" id="last-backup" aria-live="polite"></p>
          </div>
          <div class="card stack">
            <h2 data-i18n="storage_title"></h2>
            <p class="small mb0 tnum" id="storage-txt"></p>
            <div class="progress" aria-hidden="true"><span id="storage-bar" style="width:0%"></span></div>
            <p class="muted small mb0" id="persist-txt"></p>
          </div>
          <div class="card stack dz">
            <h2 data-i18n="danger_title"></h2>
            <label class="field"><span data-i18n="clear_old"></span><input type="date" id="old-date"></label>
            <div class="row">
              <button type="button" class="btn btn-danger" id="clear-old" data-i18n="clear_old_btn"></button>
              <button type="button" class="btn btn-danger" id="reset-btn" data-i18n="reset_all"></button>
            </div>
          </div>
        </div>
      </section>

      <details class="card help" style="margin-top:16px">
        <summary data-i18n="help"></summary>
        <ul>
          <li data-i18n="tip1"></li>
          <li data-i18n="tip2"></li>
          <li data-i18n="tip3"></li>
          <li data-i18n="tip4"></li>
          <li data-i18n="tip5"></li>
          <li data-i18n="tip6"></li>
        </ul>
        <h3 data-i18n="ideas_title"></h3>
        <ul>
          <li data-i18n="idea1"></li>
          <li data-i18n="idea2"></li>
          <li data-i18n="idea3"></li>
        </ul>
      </details>

      <datalist id="cat-list"></datalist>
      <datalist id="gst-list">
        <option value="0"></option><option value="0.25"></option><option value="3"></option><option value="5"></option>
        <option value="12"></option><option value="18"></option><option value="28"></option><option value="40"></option>
      </datalist>
    </div>
    <div id="sheet" class="no-i18n" aria-hidden="true"></div>
  </main>
  <script src="../../../apps/stock-register/../../shared/edu.js"></script>
  <script src="../../../apps/stock-register/strings.js"></script>
  <script src="../../../apps/stock-register/content.js"></script>
  <script src="../../../apps/stock-register/app.js"></script>
</body>
</html>
