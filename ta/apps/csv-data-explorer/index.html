      </div>

            <button type="button" class="btn btn-sm" id="export" data-i18n="export_csv"></button>

            <strong data-i18n="filter_title"></strong>

              <div class="field" id="f-a-wrap"><label for="f-a" id="f-a-lbl" data-i18n="f_value"></label><input id="f-a" type="text" autocomplete="off"></div>

              <button type="button" class="btn btn-primary" id="f-add" data-i18n="add_filter"></button>
            </div>
            <div class="row dx-chips" id="chips"></div>

          <div class="row dx-pager">
            <button type="button" class="btn btn-sm" id="prev" data-i18n="previous"></button>
            <span class="small" id="page"></span>
            <button type="button" class="btn btn-sm" id="next" data-i18n="next"></button>
          </div>
        </div>
      </section>

          <p class="muted small mb0" data-i18n="corr_intro"></p>

        </div>
