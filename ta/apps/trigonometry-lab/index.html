          <li data-i18n="inside_1"></li>
          <li data-i18n="inside_2"></li>
          <li data-i18n="inside_3"></li>
          <li data-i18n="inside_4"></li>
        </ol>
      </details>
    </section>

    <!-- ===================== TABLE + CALCULATOR ===================== -->
    <section id="panel-table" role="tabpanel" aria-labelledby="tab-table" hidden>
      <div class="tbl-grid">
        <div class="stack">
          <div class="card stack">
            <h2 data-i18n="table_title"></h2>
            <div class="scroll-x"><table class="table std-table no-i18n" id="std-table"></table></div>
            <p class="small muted mb0" data-i18n="table_note"></p>
          </div>
          <div class="card stack">
            <h3 data-i18n="trick_title"></h3>
            <p class="mb0" data-i18n="trick_text"></p>
          </div>
          <div class="card stack">
            <h3 data-i18n="comp_title"></h3>
            <p class="mb0" data-i18n="comp_text"></p>
            <div class="comp-f no-i18n ltr fx" id="comp-list"></div>
          </div>
        </div>
        <div class="stack">
          <div class="card stack">
            <h2 data-i18n="calc_title"></h2>
            <label for="calc-in" class="lbl" data-i18n="calc_label"></label>
            <div class="row">
              <input id="calc-in" type="text" class="no-i18n ltr fx grow" data-i18n-placeholder="calc_ph" autocomplete="off" spellcheck="false" style="min-width:9rem">
              <div class="seg" role="group" id="calc-unit" data-i18n-aria-label="calc_unit">
                <button type="button" id="calc-deg" data-v="deg" aria-pressed="true" data-i18n="unit_deg"></button>
                <button type="button" id="calc-rad" data-v="rad" aria-pressed="false" data-i18n="unit_rad"></button>
              </div>
            </div>
            <div class="chips no-i18n" id="calc-examples"></div>
            <div id="calc-out" class="stack" aria-live="polite"></div>
          </div>
          <div class="card stack">
            <h2 data-i18n="inv_title"></h2>
            <div class="row">
              <div class="field">
                <label for="inv-fn" data-i18n="inv_fn"></label>
                <select id="inv-fn" class="no-i18n ltr fx">
                  <option value="sin">sin⁻¹</option><option value="cos">cos⁻¹</option><option value="tan">tan⁻¹</option>
                  <option value="cosec">cosec⁻¹</option><option value="sec">sec⁻¹</option><option value="cot">cot⁻¹</option>
                </select>
              </div>
              <div class="field grow">
                <label for="inv-val" data-i18n="inv_val"></label>
                <input id="inv-val" type="text" class="no-i18n ltr fx" data-i18n-placeholder="inv_ph" autocomplete="off" spellcheck="false">
              </div>
            </div>
            <div class="chips no-i18n" id="inv-examples"></div>
            <div id="inv-out" aria-live="polite"></div>
            <p class="small muted mb0" data-i18n="inv_note"></p>
          </div>
          <div class="card stack">
            <h2 data-i18n="conv_title"></h2>
            <div class="conv-row">
              <div class="field"><label for="conv-deg" data-i18n="conv_deg"></label><input id="conv-deg" type="number" step="any" inputmode="decimal" class="no-i18n ltr fx" autocomplete="off"></div>
              <span class="conv-arrow" aria-hidden="true">⇄</span>
              <div class="field"><label for="conv-rad" data-i18n="conv_rad"></label><input id="conv-rad" type="text" inputmode="decimal" class="no-i18n ltr fx" data-i18n-placeholder="conv_rad_ph" autocomplete="off" spellcheck="false"></div>
            </div>
            <p class="conv-note no-i18n ltr fx mb0" id="conv-note" aria-live="polite"></p>
            <p class="small muted mb0" data-i18n="conv_formula"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== HEIGHTS AND DISTANCES ===================== -->
    <section id="panel-hd" role="tabpanel" aria-labelledby="tab-hd" hidden>
      <div class="hd-grid">
        <div class="card stack hd-form">
          <h2 data-i18n="hd_title"></h2>
          <div class="field">
            <label for="hd-case" data-i18n="hd_case"></label>
            <select id="hd-case">
              <option value="a" data-i18n="case_a"></option>
              <option value="b" data-i18n="case_b"></option>
              <option value="c" data-i18n="case_c"></option>
              <option value="d" data-i18n="case_d"></option>
              <option value="e" data-i18n="case_e"></option>
            </select>
          </div>
          <div class="hd-inputs" id="hd-inputs"></div>
          <p class="small muted mb0" data-i18n="hd_exact_note"></p>
        </div>
        <div class="stack hd-out">
          <div class="card"><svg id="hd-svg" class="hd-svg" viewBox="0 0 420 250" role="img" data-i18n-aria-label="hd_svg_aria"></svg></div>
          <div class="card stack" id="hd-result" aria-live="polite"></div>
        </div>
      </div>
      <section class="card stack" id="problems" style="margin-top:16px">
        <h2 data-i18n="problems_title"></h2>
        <p class="muted small" data-i18n="problems_hint"></p>
        <div class="grid" id="problem-list"></div>
      </section>
    </section>

    <!-- ===================== PRACTICE ===================== -->
    <section id="panel-practice" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="pr-grid">
        <div class="card stack" id="iq"></div>
        <div class="card stack">
          <h2 data-i18n="dr_title"></h2>
          <p class="muted mb0" data-i18n="dr_intro"></p>
          <div class="row">
            <span class="lbl" id="lbl-level" data-i18n="dr_level"></span>
            <div class="seg" role="group" aria-labelledby="lbl-level" id="dr-level">
              <button type="button" id="dr-l1" data-v="1" data-i18n="dr_lvl1"></button>
              <button type="button" id="dr-l2" data-v="2" data-i18n="dr_lvl2"></button>
            </div>
          </div>
          <div id="dr-box" class="stack"></div>
          <p class="muted small mb0" id="dr-best"></p>
          <div class="row no-print">
            <button type="button" class="btn" id="ws-print">🖨 <span data-i18n="ws_print"></span></button>
          </div>
        </div>
      </div>
    </section>

    <div id="worksheet" aria-hidden="true"></div>

    <details class="card" id="howto" style="margin-top:16px">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ol class="stack" style="padding-inline-start:20px;margin-top:12px">
        <li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li>
        <li data-i18n="how4"></li><li data-i18n="how5"></li><li data-i18n="how6"></li>
      </ol>
    </details>
    <details class="card" id="words" style="margin-top:16px">
      <summary><strong data-i18n="words_title"></strong></summary>
      <dl class="stack" style="margin:12px 0 0">
        <div><dt data-i18n="w1_t"></dt><dd data-i18n="w1_d"></dd></div>
        <div><dt data-i18n="w2_t"></dt><dd data-i18n="w2_d"></dd></div>
        <div><dt data-i18n="w3_t"></dt><dd data-i18n="w3_d"></dd></div>
        <div><dt data-i18n="w4_t"></dt><dd data-i18n="w4_d"></dd></div>
        <div><dt data-i18n="w5_t"></dt><dd data-i18n="w5_d"></dd></div>
        <div><dt data-i18n="w6_t"></dt><dd data-i18n="w6_d"></dd></div>
        <div><dt data-i18n="w7_t"></dt><dd data-i18n="w7_d"></dd></div>
      </dl>
    </details>
    <div class="row no-print" style="margin-top:16px">
      <button type="button" class="btn btn-danger" id="reset">↺ <span data-i18n="reset"></span></button>
      <span class="muted small" data-i18n="saved_local"></span>
    </div>
  </main>
  <script src="../../../apps/trigonometry-lab/../../shared/edu.js"></script>
  <script src="../../../apps/trigonometry-lab/strings.js"></script>
  <script src="../../../apps/trigonometry-lab/content.js"></script>
  <script src="../../../apps/trigonometry-lab/engine.js"></script>
  <script src="../../../apps/trigonometry-lab/app.js"></script>
</body>
</html>
