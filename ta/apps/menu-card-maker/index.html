        <button type="button" class="btn" id="btnRenameMenu" data-i18n="btn_rename_menu"></button>
        <button type="button" class="btn" id="btnDupMenu" data-i18n="btn_dup_menu"></button>
        <button type="button" class="btn btn-danger" id="btnDelMenu" data-i18n="btn_del_menu"></button>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button type="button" class="btn" id="btnSample"><span class="ic" aria-hidden="true">🍛</span> <span data-i18n="btn_sample"></span></button>
        <button type="button" class="btn" id="btnImportCsv"><span class="ic" aria-hidden="true">📥</span> <span data-i18n="btn_import_csv"></span></button>
        <button type="button" class="btn" id="btnExportCsv"><span class="ic" aria-hidden="true">📤</span> <span data-i18n="btn_export_csv"></span></button>
        <button type="button" class="btn btn-danger" id="btnReset" data-i18n="reset"></button>
      </div>
      <p class="hint" style="margin:8px 0 0" data-i18n="csv_hint"></p>
      <p class="msg callout small" id="msg" aria-live="polite" style="margin:8px 0 0"></p>
    </section>

    <div class="mc-layout">
      <section class="card no-print" aria-label="Editor">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-details" aria-selected="true" aria-controls="panel-details" data-i18n="tab_details"></button>
          <button type="button" role="tab" id="tab-items" aria-selected="false" aria-controls="panel-items" data-i18n="tab_items"></button>
          <button type="button" role="tab" id="tab-design" aria-selected="false" aria-controls="panel-design" data-i18n="tab_design"></button>
        </div>

        <div class="tabpanel stack" id="panel-details" role="tabpanel" aria-labelledby="tab-details">
          <label class="field"><span data-i18n="lbl_biz"></span><input id="fBiz" type="text" class="no-i18n" maxlength="60" data-i18n-placeholder="ph_biz"></label>
          <label class="field"><span data-i18n="lbl_tagline"></span><input id="fTag" type="text" class="no-i18n" maxlength="90" data-i18n-placeholder="ph_tagline"></label>
          <div class="field"><span data-i18n="lbl_logo"></span>
            <div class="row"><img id="logoPrev" class="logo-prev" alt="" hidden><button type="button" class="btn" id="btnLogo" data-i18n="btn_logo"></button><button type="button" class="btn btn-ghost" id="btnLogoRm" data-i18n="btn_logo_remove" hidden></button></div>
          </div>
          <div class="two">
            <label class="field"><span data-i18n="lbl_phone"></span><input id="fPhone" type="tel" class="no-i18n" dir="ltr" inputmode="tel" maxlength="20" data-i18n-placeholder="ph_phone"></label>
            <label class="field"><span data-i18n="lbl_fssai"></span><input id="fFssai" type="text" class="no-i18n" dir="ltr" inputmode="numeric" maxlength="14" data-i18n-placeholder="ph_fssai"><span class="hint" data-i18n="fssai_hint"></span><span class="hint" id="fssaiMsg" aria-live="polite"></span></label>
          </div>
          <label class="field"><span data-i18n="lbl_address"></span><input id="fAddr" type="text" class="no-i18n" maxlength="120" data-i18n-placeholder="ph_address"></label>
          <label class="field"><span data-i18n="lbl_upi"></span><input id="fUpi" type="text" class="no-i18n" dir="ltr" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="80" data-i18n-placeholder="ph_upi"><span class="hint" data-i18n="upi_hint"></span><span class="hint" id="upiMsg" aria-live="polite"></span></label>
          <label class="check"><input type="checkbox" id="fWaQr"> <span data-i18n="chk_wa_qr"></span></label>
          <p class="hint" style="margin:-6px 0 0 26px" data-i18n="wa_qr_hint"></p>
          <label class="check"><input type="checkbox" id="fGst"> <span data-i18n="chk_gst"></span></label>
          <label class="field"><span data-i18n="lbl_menu_link"></span><input id="fLink" type="url" class="no-i18n" dir="ltr" inputmode="url" maxlength="300" data-i18n-placeholder="ph_menu_link"><span class="hint" data-i18n="link_hint"></span></label>
          <label class="field"><span data-i18n="lbl_note"></span><input id="fNote" type="text" class="no-i18n" maxlength="120" data-i18n-placeholder="ph_note"></label>
        </div>

        <div class="tabpanel stack" id="panel-items" role="tabpanel" aria-labelledby="tab-items" hidden>
          <div class="row" style="justify-content:space-between"><h3 data-i18n="h_cats"></h3><span class="muted small" id="itemsStatus" aria-live="polite"></span></div>
          <div id="catList" class="stack"></div>
          <div class="row"><button type="button" class="btn" id="btnAddCat"><span class="ic" aria-hidden="true">＋</span> <span data-i18n="btn_add_cat"></span></button></div>
        </div>

        <div class="tabpanel stack" id="panel-design" role="tabpanel" aria-labelledby="tab-design" hidden>
          <h3 data-i18n="h_design"></h3>
          <div class="designs" id="designList" role="group"></div>
          <h3 data-i18n="h_layout"></h3>
          <div class="seg layouts" id="layoutSeg" role="group"></div>
          <p class="hint" id="layoutHint"></p>
        </div>
      </section>

      <section class="card pv-card pv-sticky" aria-labelledby="hPreview">
        <div class="pv-bar no-print">
          <h2 id="hPreview" style="margin:0" data-i18n="h_preview"></h2>
          <span class="muted small" id="pageInfo" aria-live="polite"></span>
        </div>
        <div class="pv-wrap" id="pvWrap"><div class="pv-scale" id="pvScale"></div></div>
        <div class="pv-pages" id="pvPages" hidden></div>
        <p class="hint no-print" style="margin:8px 0 0" data-i18n="preview_hint"></p>
        <div class="export no-print">
          <button type="button" class="btn btn-primary" id="btnPrint"><span class="ic" aria-hidden="true">🖨️</span> <span data-i18n="print"></span></button>
          <button type="button" class="btn" id="btnPng"><span class="ic" aria-hidden="true">🖼️</span> <span data-i18n="btn_png"></span></button>
          <button type="button" class="btn" id="btnJpg" data-i18n="btn_jpg"></button>
          <a class="btn btn-wa" id="btnWa" href="#" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">💬</span> <span data-i18n="btn_wa_text"></span></a>
          <button type="button" class="btn" id="btnCopy"><span class="ic" aria-hidden="true">⧉</span> <span data-i18n="btn_copy_text"></span></button>
        </div>
        <p class="hint no-print" style="margin:8px 0 0" data-i18n="print_hint"></p>
      </section>
    </div>

    <details class="card help no-print">
      <summary data-i18n="help_title"></summary>
      <ul class="stack" style="margin:10px 0 0; padding-inline-start:20px">
        <li data-i18n="tip_1"></li><li data-i18n="tip_2"></li><li data-i18n="tip_3"></li><li data-i18n="tip_4"></li><li data-i18n="tip_5"></li><li data-i18n="tip_6"></li>
      </ul>
      <p class="callout warning small" style="margin:12px 0 0" data-i18n="fssai_note"></p>
    </details>
  </main>
  <script src="../../../apps/menu-card-maker/../../shared/edu.js"></script>
  <script src="../../../apps/menu-card-maker/strings.js"></script>
  <script src="../../../apps/menu-card-maker/content.js"></script>
  <script src="../../../apps/menu-card-maker/qr.js"></script>
  <script src="../../../apps/menu-card-maker/render.js"></script>
  <script src="../../../apps/menu-card-maker/app.js"></script>
</body>
