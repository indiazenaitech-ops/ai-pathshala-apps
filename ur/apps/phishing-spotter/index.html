  <style>
    /* ---------- tabs / start ---------- */
    .hero { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr) minmax(0, 390px); align-items: center; }
    @media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
    .hero h2 { font-size: clamp(1.4rem, 3.2vw, 2rem); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 6px; text-align: center; min-width: 0; }
    .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .stat span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
    .field .seg { align-self: flex-start; }
    #verdict, #play-game, #play-results, #panel-class, #class-verdict { scroll-margin-top: 130px; }
    @media (max-width: 560px) { #tabs { flex-wrap: wrap; } #tabs button { padding: 8px 10px; } }
    .preview-cap { text-align: center; font-weight: 700; margin-top: 10px; }

    /* ---------- phone mock-up ---------- */
    .phone { --ch: var(--info); width: 100%; max-width: 420px; margin-inline: auto; border-radius: 30px; padding: 9px;
      background: #1d262b; border: 1px solid #3a4a52; box-shadow: var(--shadow-lg); }
    .phone.ch-wa { --ch: var(--success); }
    .phone.ch-email { --ch: var(--c7); }
    .phone.ch-dm { --ch: var(--c5); }
    .phone.ch-call { --ch: var(--c3); }
    .ph-inner { border-radius: 22px; overflow: hidden; background: var(--surface-2); }
    .ph-notch { height: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--ch) 16%, var(--surface)); }
    .ph-notch::before { content: ""; width: 64px; height: 6px; border-radius: 9px; background: #1d262b; opacity: .55; }
    .ph-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px; background: color-mix(in srgb, var(--ch) 16%, var(--surface)); border-bottom: 1px solid var(--border); }
    .ph-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 1.25rem;
      background: color-mix(in srgb, var(--ch) 32%, var(--surface)); }
    .ph-who { min-width: 0; flex: 1 1 auto; }
    .ph-name { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .ph-sub { font-size: .8rem; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
    .ph-screen { padding: 12px 12px 18px; min-height: 210px; }
    .ph-day { text-align: center; margin: 0 0 10px; }
    .ph-day span { font-size: .72rem; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 2px 10px; }
    .ph-bubble { background: var(--surface); border-radius: 16px; border-start-start-radius: 4px; padding: 10px 12px 6px; max-width: 95%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .ch-wa .ph-bubble { background: color-mix(in srgb, var(--success) 9%, var(--surface)); }
    .ch-call .ph-bubble { border-start-start-radius: 16px; border: 2px dashed color-mix(in srgb, var(--ch) 45%, var(--border)); }
    .ph-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.02rem; line-height: 1.65; }
    .ph-time { text-align: end; font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .ph-from { unicode-bidi: isolate; direction: ltr; }
    .lnk { font: inherit; color: var(--info); text-decoration: underline; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
      unicode-bidi: isolate; direction: ltr; overflow-wrap: anywhere; text-align: inherit; }
    .ph-qr { display: block; width: 132px; height: 132px; background: #fff; padding: 6px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #ccc; }
    .phone.big { max-width: 560px; }
    .phone.big .ph-text { font-size: clamp(1.1rem, 1.9vw, 1.45rem); }
    .phone.big .ph-name { font-size: 1.15rem; }
    mark.rf, mark.ok { color: inherit; border-radius: 4px; padding: 1px 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    mark.rf { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); border-bottom: 2px solid var(--danger); }
    mark.ok { background: color-mix(in srgb, var(--success) 16%, var(--surface)); border-bottom: 2px solid var(--success); }
    .fnum { display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; padding: 0 .25em; border-radius: 999px; background: var(--danger);
      color: var(--surface); font-size: .68rem; font-weight: 800; line-height: 1; margin-inline-start: 3px; vertical-align: super; font-style: normal; }
    .sender-rf { background: var(--danger-soft); border-bottom: 2px solid var(--danger); border-radius: 4px; padding: 0 3px; }

    /* ---------- game ---------- */
    .topbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
    .topbar .progress { flex: 1 1 150px; min-width: 120px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
    .pill b { font-variant-numeric: tabular-nums; font-size: 1.1rem; }
    .game { display: grid; gap: 18px; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); align-items: start; }
    .game.big { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); }
    @media (max-width: 900px) { .game, .game.big { grid-template-columns: minmax(0, 1fr); } }
    @media (min-width: 901px) and (min-height: 600px) { .game > :first-child { position: sticky; top: 72px; } }
    .ctx { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px; }
    .ctx .badge { flex: none; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ans { min-height: 84px; font-size: 1.3rem; font-weight: 800; border-width: 2px; flex-direction: column; gap: 2px; }
    .ans .ic { font-size: 1.7rem; line-height: 1; }
    .ans-safe { border-color: var(--success); color: var(--success); background: var(--success-soft); }
    .ans-scam { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    .ans-safe:hover { background: color-mix(in srgb, var(--success) 20%, var(--surface)); }
    .ans-scam:hover { background: color-mix(in srgb, var(--danger) 20%, var(--surface)); }
    .arr { display: inline-block; margin-inline-start: 4px; }
    [dir="rtl"] .arr { transform: scaleX(-1); }
    .verdict-big { font-size: 1.35rem; font-weight: 800; margin: 2px 0 0; }
    .flags { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .flags li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px;
      background: var(--danger-soft); border-radius: var(--radius-sm); }
    .flags li .fnum { vertical-align: baseline; margin: 2px 0 0; font-size: .8rem; min-width: 1.7em; height: 1.7em; }
    .flags li .fi { font-size: 1.2rem; line-height: 1.3; }
    .flags li small { display: block; color: var(--muted); font-size: .86rem; }
    .flags.safe li { background: var(--success-soft); grid-template-columns: auto minmax(0, 1fr); }
    .reveal h3 { margin-bottom: 6px; }
    .reveal .ok-head { color: var(--success); }
    .reveal .rf-head { color: var(--danger); }

    /* ---------- results ---------- */
    .review { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .review-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .review-row.good { border-inline-start: 5px solid var(--success); }
    .review-row.badr { border-inline-start: 5px solid var(--danger); }
    .review-row .mark { font-size: 1.3rem; }
    .review-row .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; color: var(--muted); }
    .review-row .who { font-weight: 700; overflow-wrap: anywhere; }
    .review-row .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    @media (max-width: 520px) { .review-row { grid-template-columns: auto minmax(0, 1fr); } .review-row .btn { grid-column: 1 / -1; } }

    /* ---------- class mode ---------- */
    .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .votes { grid-template-columns: minmax(0, 1fr); } }
    .vote-box { border: 2px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; min-width: 0; }
    .vote-box.safe { border-color: var(--success); background: var(--success-soft); }
    .vote-box.scam { border-color: var(--danger); background: var(--danger-soft); }
    .vote-box label { display: block; font-size: 1.05rem; margin-bottom: 6px; }
    .vote-ctrl { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .vote-ctrl input { width: 4.2em; text-align: center; font-size: 1.6rem; font-weight: 800; min-height: 52px; padding: 4px; }
    .vote-ctrl .btn { min-width: 52px; min-height: 52px; font-size: 1.5rem; padding: 0; }
    .bars { display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 700; }
    .bar { height: 26px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 8px; transition: width .4s; }
    .bar.safe > span { background: var(--success); }
    .bar.scam > span { background: var(--danger); }
    #panel-class:fullscreen { background: var(--bg); overflow: auto; padding: 24px; }
    #panel-class:fullscreen .game > :first-child { top: 0; }
    #ask:focus { outline: none; }
    #panel-class.present { font-size: clamp(1rem, 1.45vw, 1.3rem); }
    #panel-class.present h2 { font-size: 1.25em; }
    #panel-class.present h3 { font-size: 1.1em; }
    #panel-class.present .flags li small { font-size: .82em; }
    #panel-class.present .btn-sm { font-size: .85rem; }

    /* ---------- golden rules poster ---------- */
    .poster { padding: 22px; border: 3px solid var(--primary); }
    .poster-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .poster-head .shield { font-size: 2.6rem; line-height: 1; }
    .poster-head h2 { font-size: clamp(1.3rem, 3vw, 1.9rem); margin: 0; }
    .rules { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 700px) { .rules { grid-template-columns: minmax(0, 1fr); } }
    .rules .rule:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .rule { display: flex; gap: 12px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; min-width: 0; }
    .rule .ri { font-size: 1.8rem; line-height: 1.1; flex: none; }
    .rule h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .rule p { margin: 0; font-size: .93rem; }
    .helpline { border: 2px dashed var(--danger); border-radius: var(--radius); padding: 14px 16px; background: var(--danger-soft); }
    .helpline h3 { color: var(--danger); margin-bottom: 8px; }
    .hl-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; margin-bottom: 8px; }
    .hl-num { display: flex; align-items: center; gap: 10px; }
    .hl-big { font-size: 2.6rem; font-weight: 900; color: var(--danger); letter-spacing: 2px; line-height: 1; font-variant-numeric: tabular-nums; }
    .hl-web a { font-weight: 800; font-size: 1.25rem; }
    .poster-foot { margin-top: 12px; text-align: center; color: var(--muted); font-size: .85rem; }

    /* Urdu Nastaliq needs taller lines */
    :root[lang="ur"] .stat span, :root[lang="ur"] .ph-name, :root[lang="ur"] .ph-sub, :root[lang="ur"] .flags li small,
    :root[lang="ur"] .rule p, :root[lang="ur"] .review-row .snip { line-height: 2.1; }
    :root[lang="ur"] .stat b { margin-bottom: 8px; }
    :root[lang="ur"] .ph-text { line-height: 2.2; }
    :root[lang="ur"] .btn, :root[lang="ur"] .seg button { line-height: 1.8; }

    :root[lang="ur"] .edu-main { word-spacing: .14em; }
    :root[lang="ur"] .edu-main button { word-spacing: inherit; }

    @media print {
      @page { size: A4; margin: 10mm; }
      html:root:root:root { --bg: #fff; --surface: #fff; --surface-2: #f1f1f1; --text: #000; --muted: #333; --border: #999;
        --primary: #0b4f5c; --danger: #b42318; --danger-soft: #fff; --success: #15803d; --success-soft: #eefbf2; color-scheme: light; }
      .tabs, #howto, .edu-intro { display: none !important; }
      body { font-size: 12pt; }
      .poster-head h2 { font-size: 19pt; }
      .rule h3 { font-size: 12.5pt; }
      .rule p { font-size: 10.5pt; }
      .rule { padding: 10px 12px; }
      .hl-big { font-size: 34pt; }
      :root[lang="ta"] .poster, :root[lang="ml"] .poster { zoom: .9; }
      .poster { border: 3px solid #000; padding: 12px 14px; }
      .rules { grid-template-columns: 1fr 1fr !important; gap: 8px; margin: 10px 0; }
      .rule, .helpline, .review-row { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-play" aria-controls="panel-play" aria-selected="true">🎮 <span data-i18n="tab_play"></span></button>
      <button type="button" role="tab" id="tab-class" aria-controls="panel-class" aria-selected="false">🏫 <span data-i18n="tab_class"></span></button>
      <button type="button" role="tab" id="tab-rules" aria-controls="panel-rules" aria-selected="false">🛡️ <span data-i18n="tab_rules"></span></button>
    </div>

    <section id="panel-play" role="tabpanel" aria-labelledby="tab-play">
      <div id="play-start"></div>
      <div id="play-game" hidden></div>
      <div id="play-results" hidden></div>
    </section>

    <section id="panel-class" role="tabpanel" aria-labelledby="tab-class" hidden></section>

    <section id="panel-rules" role="tabpanel" aria-labelledby="tab-rules" hidden>
      <div class="row spread no-print" style="margin-bottom:12px">
        <p class="muted mb0" data-i18n="rules_sub"></p>
        <button type="button" class="btn btn-primary" id="print-poster">🖨️ <span data-i18n="print_poster"></span></button>
      </div>
      <article class="card poster" id="poster">
        <header class="poster-head">
          <span class="shield" aria-hidden="true">🛡️</span>
          <h2 data-i18n="rules_title"></h2>
        </header>
        <ol class="rules" id="rules">
          <li class="rule"><span class="ri" aria-hidden="true">🔑</span><div><h3 data-i18n="rule1_t"></h3><p data-i18n="rule1_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">📲</span><div><h3 data-i18n="rule2_t"></h3><p data-i18n="rule2_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">🔗</span><div><h3 data-i18n="rule3_t"></h3><p data-i18n="rule3_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">⏸️</span><div><h3 data-i18n="rule4_t"></h3><p data-i18n="rule4_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">☎️</span><div><h3 data-i18n="rule5_t"></h3><p data-i18n="rule5_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">💸</span><div><h3 data-i18n="rule6_t"></h3><p data-i18n="rule6_d"></p></div></li>
          <li class="rule"><span class="ri" aria-hidden="true">🗣️</span><div><h3 data-i18n="rule7_t"></h3><p data-i18n="rule7_d"></p></div></li>
        </ol>
        <div class="helpline">
          <h3 data-i18n="help_title"></h3>
          <div class="hl-grid">
            <div class="hl-num"><span class="hl-big" dir="ltr">1930</span><span data-i18n="helpline_name"></span></div>
            <div class="hl-web"><span data-i18n="help_web"></span> <a class="no-i18n" dir="ltr" href="https://cybercrime.gov.in" target="_blank" rel="noopener">cybercrime.gov.in</a></div>
          </div>
          <p class="mb0" data-i18n="help_fast"></p>
          <p class="small mb0" style="margin-top:6px"><span data-i18n="help_chakshu"></span> <a class="no-i18n" dir="ltr" href="https://sancharsaathi.gov.in" target="_blank" rel="noopener">sancharsaathi.gov.in</a></p>
        </div>
        <div class="poster-foot"><span data-i18n="brand"></span> · <span data-i18n="app_title"></span></div>
      </article>
    </section>
