    .pc-top { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 14px; }

    <!-- ============================================================ PERCENT BASICS -->
    <section id="p-basic" class="pc-panel" role="tabpanel" aria-labelledby="tab-basic">

            <button type="button" id="m-what" data-v="what" data-i18n="m_what"></button>
            <button type="button" id="m-change" data-v="change" data-i18n="m_change"></button>
            <button type="button" id="m-addsub" data-v="addsub" data-i18n="m_addsub"></button>
            <button type="button" id="m-reverse" data-v="reverse" data-i18n="m_reverse"></button>

            <div class="field"><label for="b-of-x" data-i18n="of_x"></label><div class="pc-in"><input type="text" id="b-of-x" data-k="basic.of.x" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
            <div class="field"><label for="b-of-y" data-i18n="of_y"></label><div class="pc-in"><input type="text" id="b-of-y" data-k="basic.of.y" inputmode="decimal" autocomplete="off"></div></div>
          </div>
          <div class="pc-pair" data-show="basic.mode=what">
            <div class="field"><label for="b-wh-x" data-i18n="what_x"></label><div class="pc-in"><input type="text" id="b-wh-x" data-k="basic.what.x" inputmode="decimal" autocomplete="off"></div></div>
            <div class="field"><label for="b-wh-y" data-i18n="what_y"></label><div class="pc-in"><input type="text" id="b-wh-y" data-k="basic.what.y" inputmode="decimal" autocomplete="off"></div></div>
          </div>
          <div class="pc-pair" data-show="basic.mode=change">
            <div class="field"><label for="b-ch-a" data-i18n="ch_a"></label><div class="pc-in"><input type="text" id="b-ch-a" data-k="basic.change.a" inputmode="decimal" autocomplete="off"></div></div>
            <div class="field"><label for="b-ch-b" data-i18n="ch_b"></label><div class="pc-in"><input type="text" id="b-ch-b" data-k="basic.change.b" inputmode="decimal" autocomplete="off"></div></div>

                <button type="button" id="rv-up" data-v="up" data-i18n="rv_up"></button>
              </div>
            </div>
            <div class="pc-pair">
              <div class="field"><label for="b-rv-x" data-i18n="rv_x"></label><div class="pc-in"><input type="text" id="b-rv-x" data-k="basic.reverse.x" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>

      <div class="pc-split wide">
        <div class="card pc-form">
          <h2 data-i18n="mk_title"></h2>
          <div class="pc-rhead" aria-hidden="true"><span data-i18n="col_subject"></span><span data-i18n="col_marks"></span><span data-i18n="col_outof"></span><span class="pc-rx">%</span><span></span></div>
          <div class="pc-rows" id="mk-rows"></div>
          <div class="row"><button type="button" class="btn" id="mk-add"><span aria-hidden="true">＋</span> <span data-i18n="add_subject"></span></button></div>
          <label class="check"><input type="checkbox" id="mk-best5" data-k="marks.best5"> <span data-i18n="best5"></span></label>
          <label class="check" data-show="marks.best5=true"><input type="checkbox" id="mk-keep" data-k="marks.keep"> <span data-i18n="keep_first"></span></label>
          <div class="pc-sec">
            <h3 data-i18n="need_title"></h3>
            <div class="pc-pair" style="margin-top:10px">
              <div class="field"><label for="mk-target" data-i18n="need_target"></label><div class="pc-in"><input type="text" id="mk-target" data-k="marks.target" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
              <div class="field"><label for="mk-rem" data-i18n="need_max"></label><div class="pc-in"><input type="text" id="mk-rem" data-k="marks.rem" inputmode="decimal" autocomplete="off"></div></div>
            </div>
          </div>
        </div>
        <div class="card pc-res" id="res-marks"><div class="pc-live" id="live-marks" aria-live="polite"></div><div id="work-marks"></div></div>
      </div>
    </section>

    <!-- ============================================================ CGPA / SGPA -->
    <section id="p-cgpa" class="pc-panel" role="tabpanel" aria-labelledby="tab-cgpa" hidden>
      <div class="pc-split wide">
        <div class="card pc-form">
          <div class="pc-modes" data-seg="cgpa.mode" role="group" data-i18n-aria-label="modes_label">
            <button type="button" id="m-c2p" data-v="c2p" data-i18n="m_c2p"></button>
            <button type="button" id="m-p2c" data-v="p2c" data-i18n="m_p2c"></button>
            <button type="button" id="m-sgpa" data-v="sgpa" data-i18n="m_sgpa"></button>
            <button type="button" id="m-sem" data-v="sem" data-i18n="m_sem"></button>
          </div>
          <div data-show="cgpa.mode=c2p|p2c" class="pc-form">
            <div class="field">
              <span class="pc-lbl" id="cg-meth-l" data-i18n="method"></span>
              <div class="seg pc-seg" data-seg="cgpa.method" role="group" aria-labelledby="cg-meth-l">
                <button type="button" id="meth-cbse" data-v="cbse" data-i18n="meth_cbse"></button>
                <button type="button" id="meth-custom" data-v="custom" data-i18n="meth_custom"></button>
              </div>
            </div>
            <div class="pc-pair" data-show="cgpa.mode=c2p">
              <div class="field"><label for="cg-g" data-i18n="cg_in"></label><div class="pc-in"><input type="text" id="cg-g" data-k="cgpa.g" inputmode="decimal" autocomplete="off"></div></div>
            </div>
            <div class="pc-pair" data-show="cgpa.mode=p2c">
              <div class="field"><label for="cg-p" data-i18n="pc_in"></label><div class="pc-in"><input type="text" id="cg-p" data-k="cgpa.p" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
            </div>
            <div data-show="cgpa.method=custom" class="pc-form">
              <p class="callout small" id="cu-formula" dir="auto"></p>
              <div class="pc-trio">
                <div class="field"><label for="cg-a" data-i18n="cu_a"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">−</span><input type="text" id="cg-a" data-k="cgpa.a" inputmode="decimal" autocomplete="off"></div></div>
                <div class="field"><label for="cg-m" data-i18n="cu_m"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">×</span><input type="text" id="cg-m" data-k="cgpa.m" inputmode="decimal" autocomplete="off"></div></div>
                <div class="field"><label for="cg-b" data-i18n="cu_b"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">+</span><input type="text" id="cg-b" data-k="cgpa.b" inputmode="decimal" autocomplete="off"></div></div>
              </div>
              <p class="pc-help" data-i18n="cu_help"></p>
            </div>
          </div>
          <div data-show="cgpa.mode=sgpa" class="pc-form">
            <h2 data-i18n="sg_title"></h2>
            <div class="pc-rhead" aria-hidden="true"><span data-i18n="col_subject"></span><span data-i18n="col_credits"></span><span data-i18n="col_gp"></span><span class="pc-rx" data-i18n="col_points"></span><span></span></div>
            <div class="pc-rows" id="sg-rows"></div>
            <div class="row"><button type="button" class="btn" id="sg-add"><span aria-hidden="true">＋</span> <span data-i18n="add_subject"></span></button></div>

          <div data-show="cgpa.mode=sem" class="pc-form">

            <div class="pc-rhead" aria-hidden="true"><span data-i18n="col_sem"></span><span data-i18n="col_sgpa"></span><span data-i18n="col_credits"></span><span class="pc-rx" data-i18n="col_points"></span><span></span></div>
            <div class="pc-rows" id="sm-rows"></div>
            <div class="row"><button type="button" class="btn" id="sm-add"><span aria-hidden="true">＋</span> <span data-i18n="add_sem"></span></button></div>
          </div>
        </div>
        <div class="card pc-res" id="res-cgpa"><div class="pc-live" id="live-cgpa" aria-live="polite"></div><div id="work-cgpa"></div></div>
      </div>
    </section>

    <!-- ============================================================ DISCOUNT & SHOPPING -->
    <section id="p-shop" class="pc-panel" role="tabpanel" aria-labelledby="tab-shop" hidden>
      <div class="pc-split wide">
        <div class="card pc-form">
          <div class="pc-modes" data-seg="shop.mode" role="group" data-i18n-aria-label="modes_label">
            <button type="button" id="m-disc" data-v="disc" data-i18n="m_disc"></button>
            <button type="button" id="m-stack" data-v="stack" data-i18n="m_stack"></button>
            <button type="button" id="m-bogo" data-v="bogo" data-i18n="m_bogo"></button>
            <button type="button" id="m-unit" data-v="unit" data-i18n="m_unit"></button>
          </div>
          <div data-show="shop.mode=disc" class="pc-form">
            <div class="field">
              <span class="pc-lbl" id="ds-kind-l" data-i18n="ds_kind"></span>
              <div class="seg pc-seg" data-seg="shop.disc.kind" role="group" aria-labelledby="ds-kind-l">
                <button type="button" id="ds-pct" data-v="pct" data-i18n="ds_k_pct"></button>
                <button type="button" id="ds-sale" data-v="sale" data-i18n="ds_k_sale"></button>
              </div>

              <div class="field"><label for="sd-p" data-i18n="ds_price"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">₹</span><input type="text" id="sd-p" data-k="shop.disc.p" inputmode="decimal" autocomplete="off"></div></div>

              <div class="field" data-show="shop.disc.kind=sale"><label for="sd-s" data-i18n="ds_sale"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">₹</span><input type="text" id="sd-s" data-k="shop.disc.s" inputmode="decimal" autocomplete="off"></div></div>
            </div>
            <div class="pc-chips" role="group" data-i18n-aria-label="quick_pick" data-show="shop.disc.kind=pct">
              <button type="button" class="chip" data-set="shop.disc.d" data-val="10">10%</button>
              <button type="button" class="chip" data-set="shop.disc.d" data-val="20">20%</button>
              <button type="button" class="chip" data-set="shop.disc.d" data-val="25">25%</button>
              <button type="button" class="chip" data-set="shop.disc.d" data-val="30">30%</button>
              <button type="button" class="chip" data-set="shop.disc.d" data-val="40">40%</button>
              <button type="button" class="chip" data-set="shop.disc.d" data-val="50">50%</button>
            </div>
          </div>
          <div data-show="shop.mode=stack" class="pc-form">
            <div class="pc-pair">
              <div class="field"><label for="ss-p" data-i18n="st_price"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">₹</span><input type="text" id="ss-p" data-k="shop.stack.p" inputmode="decimal" autocomplete="off"></div></div>
            </div>
            <div class="pc-trio">
              <div class="field"><label for="ss-1" data-i18n="st_d1"></label><div class="pc-in"><input type="text" id="ss-1" data-k="shop.stack.d1" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
              <div class="field"><label for="ss-2" data-i18n="st_d2"></label><div class="pc-in"><input type="text" id="ss-2" data-k="shop.stack.d2" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
              <div class="field"><label for="ss-3" data-i18n="st_d3"></label><div class="pc-in"><input type="text" id="ss-3" data-k="shop.stack.d3" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>
            </div>
          </div>
          <div data-show="shop.mode=bogo" class="pc-form">
            <div class="pc-pair">
              <div class="field"><label for="sb-b" data-i18n="bg_buy"></label><div class="pc-in"><input type="text" id="sb-b" data-k="shop.bogo.b" inputmode="numeric" autocomplete="off"></div></div>
              <div class="field"><label for="sb-g" data-i18n="bg_get"></label><div class="pc-in"><input type="text" id="sb-g" data-k="shop.bogo.g" inputmode="numeric" autocomplete="off"></div></div>
              <div class="field"><label for="sb-o" data-i18n="bg_off"></label><div class="pc-in"><input type="text" id="sb-o" data-k="shop.bogo.o" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>

            </div>
            <div class="pc-chips" role="group" data-i18n-aria-label="quick_pick">
              <button type="button" class="chip" data-offer="1,1,100" data-i18n="bg_q11"></button>
              <button type="button" class="chip" data-offer="2,1,100" data-i18n="bg_q21"></button>
              <button type="button" class="chip" data-offer="3,2,100" data-i18n="bg_q32"></button>
              <button type="button" class="chip" data-offer="1,1,50" data-i18n="bg_q150"></button>
            </div>
          </div>
          <div data-show="shop.mode=unit" class="pc-form">
            <div class="pc-packs" id="su-packs"></div>
            <p class="pc-help" data-i18n="un_help"></p>

        </div>
        <div class="card pc-res" id="res-shop"><div class="pc-live" id="live-shop" aria-live="polite"></div><div id="work-shop"></div></div>

    <!-- ============================================================ PROFIT & LOSS -->
    <section id="p-pl" class="pc-panel" role="tabpanel" aria-labelledby="tab-pl" hidden>

            <div class="field">
              <span class="pc-lbl" id="tg-kind-l" data-i18n="tg_kind"></span>
              <div class="seg pc-seg" data-seg="pl.target.kind" role="group" aria-labelledby="tg-kind-l">
                <button type="button" id="tg-markup" data-v="markup" data-i18n="tg_markup"></button>
                <button type="button" id="tg-margin" data-v="margin" data-i18n="tg_margin"></button>
              </div>
            </div>
            <div class="pc-pair">
              <div class="field"><label for="pt-cp" data-i18n="pl_cp"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">₹</span><input type="text" id="pt-cp" data-k="pl.target.cp" inputmode="decimal" autocomplete="off"></div></div>
              <div class="field"><label for="pt-p" data-i18n="tg_pct"></label><div class="pc-in"><input type="text" id="pt-p" data-k="pl.target.p" inputmode="decimal" autocomplete="off"><span class="pc-suf" aria-hidden="true">%</span></div></div>

            <div class="field">
              <span class="pc-lbl" id="cp-kind-l" data-i18n="cp_kind"></span>
              <div class="seg pc-seg" data-seg="pl.cp.kind" role="group" aria-labelledby="cp-kind-l">
                <button type="button" id="cp-profit" data-v="profit" data-i18n="lbl_profit"></button>
                <button type="button" id="cp-loss" data-v="loss" data-i18n="lbl_loss"></button>
              </div>
            </div>
            <div class="pc-pair">
              <div class="field"><label for="pc-sp" data-i18n="pl_sp"></label><div class="pc-in"><span class="pc-pre" aria-hidden="true">₹</span><input type="text" id="pc-sp" data-k="pl.cp.sp" inputmode="decimal" autocomplete="off"></div></div>

            </div>
          </div>
          <p class="callout small" data-i18n="mm_note"></p>
        </div>
        <div class="card pc-res" id="res-pl"><div class="pc-live" id="live-pl" aria-live="polite"></div><div id="work-pl"></div></div>
      </div>
    </section>

    <!-- ============================================================ ATTENDANCE -->
    <section id="p-att" class="pc-panel" role="tabpanel" aria-labelledby="tab-att" hidden>
      <div class="pc-split">
        <div class="card pc-form">
          <div class="pc-pair">
            <div class="field"><label for="at-a" data-i18n="at_a"></label><div class="pc-in"><input type="text" id="at-a" data-k="att.a" inputmode="numeric" autocomplete="off"></div></div>
            <div class="field"><label for="at-h" data-i18n="at_h"></label><div class="pc-in"><input type="text" id="at-h" data-k="att.h" inputmode="numeric" autocomplete="off"></div></div>

            <div class="field"><label for="at-l" data-i18n="at_left"></label><div class="pc-in"><input type="text" id="at-l" data-k="att.l" inputmode="numeric" autocomplete="off"></div></div>

            <button type="button" class="chip" data-set="att.t" data-val="60">60%</button>
            <button type="button" class="chip" data-set="att.t" data-val="65">65%</button>

    </section>

      <ul class="stack" style="margin-top:10px">

        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:12px">

      </div>
    </details>
