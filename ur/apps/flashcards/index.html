    .pr-table th, .pr-table td { border: 1px solid #999; padding: 8pt 10pt; vertical-align: middle; text-align: start; font-size: 13pt; overflow-wrap: anywhere; }
    .pr-table th { background: #eee; font-size: 11pt; }
    .pr-table .pr-n { width: 30pt; text-align: center; color: #555; font-size: 10pt; white-space: nowrap; overflow-wrap: normal; padding-inline: 4pt; }
    .pr-table .pr-b { border-inline-start: 2px dashed #000; width: 48%; }
    .pr-table .pr-f { font-weight: 700; }
    .pr-table img { max-height: 60pt; max-width: 90pt; display: block; margin-bottom: 4pt; }
    .pr-table tr { break-inside: avoid; page-break-inside: avoid; }
    @media print {
      #app > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; color: #000; background: #fff; }
      #printArea h1 { font-size: 18pt; margin: 0 0 4pt; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="badLink" class="callout danger" role="alert" hidden style="margin-bottom:14px"><span data-i18n="bad_link"></span></div>

    <section id="importPreview" class="card stack" hidden aria-labelledby="impTitle" style="margin-bottom:16px">
      <h2 id="impTitle" class="mb0"><span aria-hidden="true">📥 </span><span data-i18n="import_title"></span></h2>
      <div>
        <h3 id="impName" class="no-i18n mb0" dir="auto"></h3>
        <p id="impCount" class="muted mb0"></p>
      </div>
      <div id="impDup" class="callout warning row spread" hidden>
        <span data-i18n="import_dup"></span>
        <button type="button" class="btn btn-sm" id="openCopy" data-i18n="open_copy"></button>
      </div>
      <div class="scroll-x"><table class="table" id="impTable"></table></div>
      <p id="impMore" class="small muted mb0"></p>
      <div class="row">
        <button type="button" class="btn btn-primary" id="importSave" data-i18n="import_save"></button>
        <button type="button" class="btn" id="importMerge" data-i18n="import_merge"></button>
        <button type="button" class="btn btn-ghost" id="importCancel" data-i18n="cancel"></button>
      </div>
    </section>

    <section class="card fc-deckbar" id="deckBar">
      <div class="fc-deckrow">
        <label class="field"><span data-i18n="deck"></span><select id="deckSel" class="no-i18n"></select></label>
        <button type="button" class="btn" id="newDeck"><span aria-hidden="true">＋</span> <span data-i18n="new_deck"></span></button>
      </div>
      <div class="fc-dash">
        <div class="fc-stats" id="deckStats" aria-live="polite"></div>
        <div class="fc-boxwrap">
          <div class="fc-boxes" id="boxes"></div>
          <p class="tiny muted fc-cap" data-i18n="boxes_caption"></p>
        </div>
      </div>
    </section>

    <div class="fc-tabs no-print" role="tablist" data-i18n-aria-label="modes">
      <button type="button" role="tab" id="tab-study" aria-controls="p-study"><span class="ic" aria-hidden="true">🧠</span><span data-i18n="tab_study"></span></button>
      <button type="button" role="tab" id="tab-quiz" aria-controls="p-quiz"><span class="ic" aria-hidden="true">✍️</span><span data-i18n="tab_quiz"></span></button>
      <button type="button" role="tab" id="tab-match" aria-controls="p-match"><span class="ic" aria-hidden="true">🧩</span><span data-i18n="tab_match"></span></button>
      <button type="button" role="tab" id="tab-edit" aria-controls="p-edit"><span class="ic" aria-hidden="true">🛠️</span><span data-i18n="tab_edit"></span></button>
    </div>

    <!-- ================= STUDY ================= -->
    <section id="p-study" role="tabpanel" aria-labelledby="tab-study">
      <div id="studyStart" class="card stack fc-start">
        <div id="studyEmpty" class="stack" hidden>
          <p class="mb0" data-i18n="no_cards"></p>
          <div><button type="button" class="btn btn-primary btn-lg" id="goEdit"><span aria-hidden="true">＋ </span><span data-i18n="go_edit"></span></button></div>
        </div>
        <div id="studyReady" class="stack">
          <div class="fc-due">
            <span class="big-number" id="dueCount" aria-live="polite"></span>
            <span class="muted" data-i18n="due_label"></span>
          </div>
          <p id="allDone" class="fc-alldone" data-i18n="all_done" hidden></p>
          <p id="nextDue" class="muted mb0" hidden></p>
          <div class="fc-opts">
            <div class="field"><span data-i18n="session_size"></span>
              <div class="seg" id="sizeSeg">
                <button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="50">50</button><button type="button" data-v="0" data-i18n="all"></button>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="reverseChk"> <span data-i18n="reverse"></span></label>
          </div>
          <div class="fc-go">
            <button type="button" class="btn btn-primary btn-lg" id="startStudy"><span aria-hidden="true">▶ </span><span data-i18n="start_study"></span></button>
            <button type="button" class="btn" id="cramBtn"><span aria-hidden="true">🔁 </span><span data-i18n="cram"></span></button>
          </div>
        </div>
      </div>

      <div id="studySession" class="card stack" hidden>
        <div class="fc-sesshead">
          <span class="badge accent" id="cramBadge" hidden data-i18n="cram_badge"></span>
          <span class="fc-count" id="sessCount"></span>
          <div class="progress" id="sessProg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="sessBar" style="width:0%"></span></div>
          <button type="button" class="edu-iconbtn" id="speakBtn" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button>
          <button type="button" class="edu-iconbtn" id="fsStudy" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen">⛶</button>
        </div>
        <div class="fc-stage">
          <button type="button" class="fc-card" id="card">
            <span class="fc-inner">
              <span class="fc-face fc-front" id="faceFront"></span>
              <span class="fc-face fc-back" id="faceBack" aria-hidden="true"></span>
            </span>
          </button>
          <div id="flipRow" class="stack center">
            <p class="fc-hint muted small" data-i18n="flip_hint"></p>
            <button type="button" class="btn btn-primary btn-lg" id="flipBtn"><span data-i18n="show_answer"></span> <kbd class="fc-kbd no-i18n">Space</kbd></button>
          </div>
          <div class="fc-rate" id="rateRow" hidden>
            <button type="button" class="btn fc-knew" id="knewBtn"><span aria-hidden="true">✓</span> <span data-i18n="knew"></span> <kbd class="fc-kbd no-i18n">1</kbd></button>
            <button type="button" class="btn fc-again" id="againBtn"><span aria-hidden="true">↻</span> <span data-i18n="again"></span> <kbd class="fc-kbd no-i18n">2</kbd></button>
          </div>
        </div>
        <div class="fc-sessfoot">
          <span id="boxInfo" class="small muted"></span>
          <button type="button" class="btn btn-sm" id="endStudy" data-i18n="end_session"></button>
        </div>
      </div>

      <div id="studySummary" class="card stack" hidden>
        <h2 class="mb0"><span aria-hidden="true">🎉 </span><span data-i18n="sum_title"></span></h2>
        <div class="fc-sum" aria-live="polite">
          <div class="s-ok"><b id="sumKnew"></b><span data-i18n="sum_knew"></span></div>
          <div class="s-again"><b id="sumAgain"></b><span data-i18n="sum_again"></span></div>
          <div class="s-score"><b id="sumScore"></b><span data-i18n="sum_score"></span></div>
        </div>
        <p id="sumMoved" class="mb0"></p>
        <p id="sumNext" class="muted mb0"></p>
        <div class="row">
          <button type="button" class="btn btn-accent" id="studyAgain"><span aria-hidden="true">🔁 </span><span data-i18n="study_again"></span></button>
          <button type="button" class="btn btn-primary" id="studyDone" data-i18n="done"></button>
        </div>
      </div>
    </section>

    <!-- ================= QUIZ ================= -->
    <section id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div id="quizStart" class="card stack">
        <h2 class="mb0" data-i18n="quiz_title"></h2>
        <p class="muted mb0" data-i18n="quiz_help"></p>
        <div class="row" style="gap:16px 24px">
          <div class="field"><span data-i18n="answer_side"></span>
            <div class="seg" id="sideSeg"><button type="button" data-side="b" data-i18n="side_back"></button><button type="button" data-side="f" data-i18n="side_front"></button></div>
          </div>
          <div class="field"><span data-i18n="questions"></span>
            <div class="seg" id="qcountSeg"><button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="0" data-i18n="all"></button></div>
          </div>
        </div>
        <p class="callout" id="quizEmpty" hidden></p>
        <div><button type="button" class="btn btn-primary btn-lg" id="startQuiz"><span aria-hidden="true">▶ </span><span data-i18n="start_quiz"></span></button></div>
      </div>

      <div id="quizRun" class="card stack" hidden>
        <div class="fc-sesshead">
          <span class="fc-count" id="quizCount"></span>
          <div class="progress" aria-hidden="true"><span id="quizBar" style="width:0%"></span></div>
          <span class="badge success" id="quizScore"></span>
          <button type="button" class="edu-iconbtn" id="quizSpeak" data-i18n-aria-label="read_aloud" data-i18n-title="read_aloud">🔊</button>
        </div>
        <div class="fc-qprompt">
          <img id="quizImg" alt="" hidden>
          <div id="quizPrompt" class="fc-qprompt-t no-i18n" dir="auto"></div>
        </div>
        <label class="field"><span id="quizAsk"></span>
          <input type="text" id="quizInput" class="no-i18n" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="your_answer">
        </label>
        <div class="row" id="askRow">
          <button type="button" class="btn btn-primary" id="quizCheck" data-i18n="check"></button>
          <button type="button" class="btn" id="quizSkip" data-i18n="dont_know"></button>
        </div>
        <div id="quizFeedback" aria-live="polite"></div>
        <div class="row" id="nextRow" hidden>
          <button type="button" class="btn btn-primary" id="quizNext"><span data-i18n="next"></span> <span aria-hidden="true" class="arr">→</span></button>
          <button type="button" class="btn btn-ghost" id="quizOverride"><span aria-hidden="true">✓ </span><span data-i18n="override"></span></button>
        </div>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-sm" id="quizEnd" data-i18n="quiz_end"></button></div>
      </div>

      <div id="quizResult" class="card stack fc-result" hidden>
        <h2 class="mb0" data-i18n="quiz_done"></h2>
        <div class="big-number" id="quizFinal" aria-live="polite"></div>
        <p id="quizMsg" class="mb0"></p>
        <h3 id="reviewHead" class="mb0" data-i18n="mistakes" style="text-align:start"></h3>
        <ul class="fc-review-list" id="quizReview" style="text-align:start"></ul>
        <div class="row" style="justify-content:center">
          <button type="button" class="btn btn-accent" id="quizRetry"><span aria-hidden="true">🔁 </span><span data-i18n="retry_mistakes"></span></button>
          <button type="button" class="btn btn-primary" id="quizNew" data-i18n="new_quiz"></button>
        </div>
      </div>
    </section>

    <!-- ================= MATCH ================= -->
    <section id="p-match" role="tabpanel" aria-labelledby="tab-match" hidden>
      <div id="matchWrap" class="card stack">
        <div class="fc-matchbar">
          <div class="field"><span data-i18n="pairs"></span>
            <div class="seg" id="pairsSeg"><button type="button" data-v="4">4</button><button type="button" data-v="6">6</button><button type="button" data-v="8">8</button></div>
          </div>
          <div class="fc-matchstats" id="matchStats" aria-live="off">
            <span class="badge" id="matchTime"></span>
            <span class="badge" id="matchTries"></span>
            <span class="badge success" id="matchBest" hidden></span>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary" id="startMatch"><span aria-hidden="true">🔀 </span><span data-i18n="new_game"></span></button>
            <button type="button" class="edu-iconbtn" id="fsMatch" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen">⛶</button>
          </div>
        </div>
        <p class="muted small mb0" data-i18n="match_help"></p>
        <p class="callout" id="matchEmpty" hidden></p>
        <div id="matchDone" class="callout success" hidden role="status"></div>
        <div class="fc-tiles" id="tiles"></div>
      </div>
    </section>

    <!-- ================= EDIT ================= -->
    <section id="p-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
      <div class="grid-2">
        <div class="card stack" id="cardForm">
          <label class="field"><span data-i18n="deck_name"></span><input type="text" id="deckName" class="no-i18n" dir="auto" maxlength="80"></label>
          <hr class="divider">
          <h3 id="formTitle" class="mb0"></h3>
          <label class="field"><span data-i18n="front"></span><input type="text" id="cardFront" class="no-i18n" dir="auto" maxlength="400" data-i18n-placeholder="front_ph"></label>
          <label class="field"><span data-i18n="back"></span><textarea id="cardBack" class="no-i18n" dir="auto" rows="2" maxlength="400" data-i18n-placeholder="back_ph"></textarea></label>
          <div class="fc-imgrow">
            <button type="button" class="btn btn-sm" id="cardImgBtn"><span aria-hidden="true">🖼️ </span><span data-i18n="add_picture"></span></button>
            <img id="cardImgPrev" alt="" hidden>
            <button type="button" class="btn btn-sm btn-ghost" id="cardImgDel" hidden data-i18n="remove_picture"></button>
          </div>
          <p class="tiny muted mb0" data-i18n="img_note"></p>
          <div class="row">
            <button type="button" class="btn btn-primary" id="addCard"><span aria-hidden="true">＋ </span><span id="addCardTxt" data-i18n="add_card"></span></button>
            <button type="button" class="btn" id="cancelEdit" hidden data-i18n="cancel"></button>
          </div>
        </div>
        <div class="card stack">
          <h3 class="mb0" data-i18n="bulk_title"></h3>
          <p class="small muted mb0" data-i18n="bulk_help"></p>
          <textarea id="bulkText" class="no-i18n" dir="auto" rows="6" data-i18n-placeholder="bulk_ph" data-i18n-aria-label="bulk_title"></textarea>
          <div class="row spread">
            <span id="bulkCount" class="small muted" aria-live="polite"></span>
            <button type="button" class="btn btn-primary" id="bulkAdd" data-i18n="bulk_add"></button>
          </div>
        </div>
      </div>

      <div class="card stack mt">
        <div class="fc-listhead">
          <h3 class="mb0" id="cardsTitle"></h3>
          <input type="search" id="cardSearch" class="no-i18n" data-i18n-placeholder="search_cards" data-i18n-aria-label="search_cards">
        </div>
        <div id="undoBar" class="callout warning" hidden role="status">
          <span data-i18n="card_deleted"></span>
          <button type="button" class="btn btn-sm" id="undoBtn"><span aria-hidden="true">↶ </span><span data-i18n="undo"></span></button>
        </div>
        <ol class="fc-list" id="cardList"></ol>
        <p id="listEmpty" class="empty mb0" hidden></p>
      </div>

      <div class="grid-2 mt">
        <div class="card stack">
          <h3 class="mb0" data-i18n="share_title"></h3>
          <div class="fc-actions">
            <button type="button" class="btn btn-primary" id="shareBtn"><span aria-hidden="true">🔗 </span><span data-i18n="make_link"></span></button>
            <button type="button" class="btn" id="exportCsv"><span aria-hidden="true">⬇ </span><span data-i18n="export_csv"></span></button>
            <button type="button" class="btn" id="importBtn"><span aria-hidden="true">⬆ </span><span data-i18n="import_file"></span></button>
            <button type="button" class="btn" id="printBtn"><span aria-hidden="true">🖨 </span><span data-i18n="print_sheet"></span></button>
          </div>
          <div id="shareBox" class="stack" hidden>
            <input type="text" id="shareUrl" class="no-i18n" readonly data-i18n-aria-label="make_link">
            <div class="fc-actions">
              <button type="button" class="btn btn-sm" id="copyShare" data-i18n="copy"></button>
              <a class="btn btn-sm" id="waLink" href="#" target="_blank" rel="noopener" data-i18n="whatsapp"></a>
              <button type="button" class="btn btn-sm" id="nativeShare" data-i18n="share" hidden></button>
            </div>
            <ul class="fc-notes" id="shareNotes"></ul>
          </div>
          <p class="tiny muted mb0" data-i18n="csv_note"></p>
        </div>
        <div class="card stack">
          <h3 class="mb0" data-i18n="more_title"></h3>
          <div class="fc-actions">
            <button type="button" class="btn" id="backupBtn"><span aria-hidden="true">💾 </span><span data-i18n="backup"></span></button>
            <button type="button" class="btn" id="addSamples"><span aria-hidden="true">📚 </span><span data-i18n="add_samples"></span></button>
            <button type="button" class="btn btn-danger" id="resetProgress"><span aria-hidden="true">↺ </span><span data-i18n="reset_progress"></span></button>
            <button type="button" class="btn btn-danger" id="deleteDeck"><span aria-hidden="true">🗑 </span><span data-i18n="delete_deck"></span></button>
          </div>
          <p class="tiny muted mb0"><span aria-hidden="true">🔒 </span><span data-i18n="saved_local"></span></p>
        </div>
      </div>
    </section>

    <details class="card fc-help mt" id="help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
      <h3 data-i18n="inside_title"></h3>
      <p class="mb0" data-i18n="inside_text"></p>
    </details>

    <div id="printArea" class="print-only"></div>
  </main>
  <script src="../../../apps/flashcards/../../shared/edu.js"></script>
  <script src="../../../apps/flashcards/strings.js"></script>
  <script src="../../../apps/flashcards/content.js"></script>
  <script src="../../../apps/flashcards/app.js"></script>
</body>
</html>
