    <!-- 3. Savings coach -->
    <section id="p-save" role="tabpanel" aria-labelledby="tab-save" class="eb-panel" hidden>
      <div class="eb-two">
        <section class="card stack">
          <h2 class="mb0" data-i18n="save_title"></h2>
          <p class="eb-note" data-i18n="save_hint"></p>
          <div class="sw-list">
            <label class="check"><input type="checkbox" id="sw-led"><span><span data-i18n="sw_led"></span><small data-i18n="sw_led_h"></small></span></label>
            <label class="check"><input type="checkbox" id="sw-ac24"><span><span data-i18n="sw_ac24"></span><small data-i18n="sw_ac24_h"></small></span></label>
            <label class="check"><input type="checkbox" id="sw-fridge5"><span><span data-i18n="sw_fridge5"></span><small data-i18n="sw_fridge5_h"></small></span></label>
            <label class="check"><input type="checkbox" id="sw-bldc"><span><span data-i18n="sw_bldc"></span><small data-i18n="sw_bldc_h"></small></span></label>
            <label class="check"><input type="checkbox" id="sw-standby"><span><span data-i18n="sw_standby"></span><small data-i18n="sw_standby_h"></small></span></label>
          </div>
          <div class="eb-in-row">
            <div class="field"><label for="sv-rate" data-i18n="sv_rate"></label><input id="sv-rate" class="eb-num" type="number" inputmode="decimal" min="0" step="0.1"></div>
            <button type="button" class="btn" id="sv-rate-auto" data-i18n="sv_rate_auto"></button>
          </div>
        </section>
        <section class="card eb-result" id="save-result" aria-live="polite"></section>
      </div>
    </section>

    <!-- 4. Meter & solar -->
    <section id="p-meter" role="tabpanel" aria-labelledby="tab-meter" class="eb-panel" hidden>
      <div class="eb-two">
        <section class="card stack">
          <h2 class="mb0" data-i18n="meter_title"></h2>
          <p class="eb-note" data-i18n="meter_hint"></p>
          <div class="eb-in-row">
            <div class="field"><label for="m-prev" data-i18n="m_prev"></label><input id="m-prev" class="eb-num" type="number" inputmode="decimal" min="0" step="1"></div>
            <div class="field"><label for="m-cur" data-i18n="m_cur"></label><input id="m-cur" class="eb-num" type="number" inputmode="decimal" min="0" step="1"></div>
          </div>
          <div id="meter-result" aria-live="polite"></div>
        </section>
        <section class="card stack">
          <h2 class="mb0" data-i18n="solar_title"></h2>
          <p class="eb-note" data-i18n="solar_hint"></p>
          <div class="eb-in-row">
            <div class="field"><label for="s-kw" data-i18n="s_kw"></label><input id="s-kw" class="eb-num" type="number" inputmode="decimal" min="0" step="0.5"></div>
            <div class="field"><label for="s-per" data-i18n="s_per"></label><input id="s-per" class="eb-num" type="number" inputmode="decimal" min="0" step="0.1"></div>
          </div>
          <div id="solar-result" aria-live="polite"></div>
        </section>
      </div>
    </section>

    <!-- 5. Science corner -->
    <section id="p-science" role="tabpanel" aria-labelledby="tab-science" class="eb-panel" hidden>
      <section class="card">
        <h2 data-i18n="sci_title"></h2>
        <p class="eb-note" data-i18n="sci_hint"></p>
        <div class="sc-formulas" style="margin-top:12px">
          <div class="sc-f"><div class="f eb-ltr">P = V × I</div><p data-i18n="f_power"></p></div>
          <div class="sc-f"><div class="f eb-ltr">E = P × t</div><p data-i18n="f_energy"></p></div>
          <div class="sc-f"><div class="f eb-ltr">1 kWh = 3.6 × 10<sup>6</sup> J</div><p data-i18n="f_unit"></p></div>
        </div>
      </section>
      <div class="eb-two">
        <section class="card stack">
          <h2 class="mb0" data-i18n="sci_calc"></h2>
          <div class="eb-in-row">
            <div class="field"><label for="sc-v" data-i18n="sc_v"></label><input id="sc-v" class="eb-num" type="number" inputmode="decimal" min="0" step="1"></div>
            <div class="field"><label for="sc-i" data-i18n="sc_i"></label><input id="sc-i" class="eb-num" type="number" inputmode="decimal" min="0" step="0.1"></div>
          </div>
          <p class="eb-note" id="sc-p-out" aria-live="polite"></p>
          <div class="eb-in-row">
            <div class="field"><label for="sc-pw" data-i18n="sc_pw"></label><input id="sc-pw" class="eb-num" type="number" inputmode="decimal" min="0" step="1"></div>
            <div class="field"><label for="sc-h" data-i18n="sc_h"></label><input id="sc-h" class="eb-num" type="number" inputmode="decimal" min="0" step="0.5"></div>
            <div class="field"><label for="sc-d" data-i18n="sc_d"></label><input id="sc-d" class="eb-num" type="number" inputmode="numeric" min="1" step="1"></div>
          </div>
          <div id="sc-e-out" aria-live="polite"></div>
        </section>
        <section class="card">
          <h2 data-i18n="sci_practice"></h2>
          <ol class="sc-q" id="sc-q"></ol>
        </section>
      </div>
    </section>

    <details class="card no-print">
      <summary data-i18n="howto_title"></summary>
      <ul>
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li>
      </ul>
    </details>
    <details class="card no-print">
      <summary data-i18n="words_title"></summary>
      <ul>
        <li data-i18n="word_unit"></li><li data-i18n="word_watt"></li><li data-i18n="word_slab"></li><li data-i18n="word_tele"></li><li data-i18n="word_load"></li><li data-i18n="word_duty"></li>
      </ul>
    </details>
    <p class="muted small no-print" data-i18n="disclaimer"></p>
    <div class="row no-print">
      <button type="button" class="btn" id="print-btn">🖨 <span data-i18n="print_audit"></span></button>
      <button type="button" class="btn btn-danger" id="reset-btn" data-i18n="reset"></button>
    </div>
    <div id="print-area" aria-hidden="true"></div>
  </main>
