              <div class="field">
                <label for="exAmount" data-i18n="f_amount"></label>
                <div class="nf"><span class="nf-pfx" aria-hidden="true">₹</span><input id="exAmount" type="text" class="no-i18n" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="0"></div>
                <span class="hint" id="amountHint" hidden data-i18n="amount_auto"></span>
              </div>
              <div class="field">
                <label for="exPayer" data-i18n="f_payer"></label>
                <select id="exPayer" class="no-i18n"></select>
              </div>
              <div class="field">
                <label for="exDate" data-i18n="f_date"></label>
                <input id="exDate" type="date">
              </div>
            </div>
            <div class="field">
              <span class="lbl" id="splitLbl" data-i18n="f_split"></span>
              <div class="seg modes" id="segMode" role="group" aria-labelledby="splitLbl">
                <button type="button" data-mode="equal" id="mode-equal" data-i18n="mode_equal"></button><button type="button" data-mode="shares" id="mode-shares" data-i18n="mode_shares"></button><button type="button" data-mode="exact" id="mode-exact" data-i18n="mode_exact"></button><button type="button" data-mode="percent" id="mode-percent" data-i18n="mode_percent"></button><button type="button" data-mode="items" id="mode-items" data-i18n="mode_items"></button>
              </div>
              <span class="hint" id="modeHint"></span>
            </div>
            <div id="splitArea"></div>
            <div class="callout danger small msg" id="expMsg" role="alert"></div>
            <div class="row">
              <button type="submit" class="btn btn-primary" id="btnSaveExpense"></button>
              <button type="button" class="btn" id="btnCancelExpense" data-i18n="cancel"></button>
            </div>
          </form>
          <div id="expList" class="exp-list"></div>
        </section>
      </div>

      <div class="sb-col">
        <!-- ---------- balances ---------- -->
        <section class="card" aria-labelledby="hBalances">
          <div class="card-head"><h2 id="hBalances"><span class="ic" aria-hidden="true">⚖️</span> <span data-i18n="h_balances"></span></h2></div>
          <div id="balList" class="bal-list" aria-live="polite"></div>
          <div class="legend"><span><i style="background: var(--c1)"></i><span data-i18n="col_paid"></span></span><span><i style="background: var(--c2)"></i><span data-i18n="col_share"></span></span></div>
        </section>

        <!-- ---------- settle up ---------- -->
        <section class="card" aria-labelledby="hSettle">
          <div class="card-head"><h2 id="hSettle"><span class="ic" aria-hidden="true">🤝</span> <span data-i18n="h_settle"></span></h2></div>
          <p class="small muted" id="settleInfo" aria-live="polite" style="margin: 0 0 10px"></p>
          <div id="settleList" class="settle-list" aria-live="polite"></div>
          <p class="tiny muted" style="margin: 10px 0 0" data-i18n="upi_phone_hint"></p>
        </section>

        <!-- ---------- share & export ---------- -->
        <section class="card" aria-labelledby="hShare">
          <div class="card-head"><h2 id="hShare"><span class="ic" aria-hidden="true">📤</span> <span data-i18n="h_share"></span></h2></div>
          <div class="acts">
            <button type="button" class="btn" id="btnCopySummary"><span class="ic" aria-hidden="true">⧉</span> <span data-i18n="btn_copy_summary"></span></button>
            <a class="btn btn-wa" id="btnWaSummary" href="#" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">💬</span> <span data-i18n="btn_wa_summary"></span></a>
            <button type="button" class="btn" id="btnPng"><span class="ic" aria-hidden="true">🖼</span> <span data-i18n="btn_png"></span></button>
            <button type="button" class="btn" id="btnCsv"><span class="ic" aria-hidden="true">⬇</span> <span data-i18n="btn_csv"></span></button>
            <button type="button" class="btn wide" id="btnPrint"><span class="ic" aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
          <canvas id="pngCanvas" class="no-i18n" width="1080" height="1350" aria-hidden="true"></canvas>
        </section>
      </div>
    </div>

    <details class="card help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip_1"></li>
        <li data-i18n="tip_2"></li>
        <li data-i18n="tip_3"></li>
        <li data-i18n="tip_4"></li>
        <li data-i18n="tip_5"></li>
        <li data-i18n="tip_6"></li>
      </ul>
    </details>

    <div class="reset-row no-print">
      <button type="button" class="btn btn-danger btn-sm" id="btnReset" data-i18n="reset"></button>
      <span class="tiny muted" data-i18n="saved_local"></span>
    </div>
  </main>
  <script src="../../../apps/split-bill/../../shared/edu.js"></script>
  <script src="../../../apps/split-bill/strings.js"></script>
  <script src="../../../apps/split-bill/app.js"></script>
</body>
</html>
