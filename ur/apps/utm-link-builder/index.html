            <button class="btn btn-primary" id="copyLink" type="button"><span aria-hidden="true">⧉</span> <span data-i18n="copy_link"></span></button>
            <button class="btn" id="copyParams" type="button" data-i18n="copy_params"></button>
            <a class="btn" id="openLink" target="_blank" rel="noopener" data-i18n="open_link"></a>
            <button class="btn btn-accent" id="saveHist" type="button"><span aria-hidden="true">★</span> <span data-i18n="save_hist"></span></button>
          </div>
          <p class="tiny muted mb0" data-i18n="params_hint"></p>
        </div>

        <div class="card stack">
          <h2 class="ub-h mb0" data-i18n="anat_title"></h2>
          <div class="anat no-i18n ltr" id="anat" aria-hidden="true"></div>
          <div class="legend">
            <span class="l-utm"><i aria-hidden="true"></i><span data-i18n="anat_utm"></span></span>
            <span class="l-keep"><i aria-hidden="true"></i><span data-i18n="anat_keep"></span></span>
            <span class="l-frag"><i aria-hidden="true"></i><span data-i18n="anat_frag"></span></span>
          </div>
        </div>

        <details class="card sub" id="qrBox">
          <summary data-i18n="qr_title"></summary>
          <div class="stack">
            <div class="qr-wrap">
              <canvas id="qr" width="1" height="1" data-ok="0"></canvas>
              <div class="qr-side stack">
                <p class="small muted mb0" id="qrMsg" data-i18n="qr_hint"></p>
                <button class="btn" id="qrDl" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="qr_dl"></span></button>
              </div>
            </div>
          </div>
        </details>
      </div>
    </section>

    <!-- ================= MANY LINKS ================= -->
    <section id="p-bulk" role="tabpanel" aria-labelledby="tab-bulk" class="stack" hidden>
      <div class="seg" role="group" id="bulkMode">
        <button type="button" data-v="matrix" data-i18n="bulk_matrix"></button>
        <button type="button" data-v="csv" data-i18n="bulk_csv"></button>
      </div>

      <div class="card stack" id="matrixCard">
        <p class="small muted mb0" data-i18n="matrix_hint"></p>
        <p class="status info ltr no-i18n" id="matrixBase" dir="ltr" hidden></p>
        <div class="row">
          <button class="btn btn-sm" id="pickAll" type="button" data-i18n="pick_all"></button>
          <button class="btn btn-sm btn-ghost" id="pickNone" type="button" data-i18n="pick_none"></button>
        </div>
        <div class="chips" id="pickChips" role="group"></div>
      </div>

      <div class="card stack" id="csvCard" hidden>
        <h2 class="ub-h mb0"><label for="csvIn" data-i18n="csv_label"></label></h2>
        <p class="small muted mb0" data-i18n="csv_hint"></p>
        <textarea id="csvIn" rows="7" dir="ltr" spellcheck="false" wrap="off" data-i18n-placeholder="csv_ph"></textarea>
        <div class="row">
          <button class="btn" id="importCsv" type="button"><span aria-hidden="true">📂</span> <span data-i18n="import_csv"></span></button>
          <button class="btn btn-ghost" id="loadExample" type="button" data-i18n="load_example"></button>
          <button class="btn btn-ghost" id="clearCsv" type="button" data-i18n="clear"></button>
        </div>
      </div>

      <div class="card stack">
        <div class="bulk-head">
          <span class="badge primary" id="bulkCount"></span>
          <div class="row">
            <button class="btn" id="copyAll" type="button"><span aria-hidden="true">⧉</span> <span data-i18n="copy_all"></span></button>
            <button class="btn" id="dlCsv" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_csv"></span></button>
            <button class="btn btn-accent" id="saveAll" type="button"><span aria-hidden="true">★</span> <span data-i18n="save_all"></span></button>
          </div>
        </div>
        <p class="status warn" id="bulkMsg" hidden></p>
        <div class="scroll-x"><table class="table" id="bulkTable"></table></div>
        <p class="empty" id="bulkEmpty" hidden></p>
      </div>
    </section>

    <!-- ================= HISTORY ================= -->
    <section id="p-history" role="tabpanel" aria-labelledby="tab-history" class="stack" hidden>
      <div class="card stack">
        <div class="bulk-head">
          <div>
            <h2 class="ub-h mb0" data-i18n="tab_history"></h2>
            <p class="small muted mb0" data-i18n="hist_hint"></p>
          </div>
          <span class="badge primary" id="histCount"></span>
        </div>
        <div class="row">
          <button class="btn btn-primary" id="dlSheet" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_sheet"></span></button>
          <button class="btn" id="copyHist" type="button"><span aria-hidden="true">⧉</span> <span data-i18n="copy_all"></span></button>
          <button class="btn btn-ghost btn-danger" id="clearHist" type="button" data-i18n="clear_hist"></button>
        </div>
        <div class="hrows" id="hrows" role="list"></div>
        <p class="empty" id="histEmpty" data-i18n="hist_empty" hidden></p>
      </div>
    </section>

    <details class="card no-print" id="helpBox" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="help-list" style="margin-top:10px">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="callout small" style="margin-top:10px"><strong data-i18n="inside_title"></strong><br><span data-i18n="inside_text"></span></p>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/utm-link-builder/../../shared/edu.js"></script>
  <script src="../../../apps/utm-link-builder/strings.js"></script>
  <script src="../../../apps/utm-link-builder/qr.js"></script>
  <script src="../../../apps/utm-link-builder/app.js"></script>
</body>
</html>
