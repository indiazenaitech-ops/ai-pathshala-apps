    /* ---------- board colours (light) ---------- */
    :root {

        --sl-num: #f1e7d6; --sl-halo: #1c2b31; --sl-frame: #7d6649; --sl-goal: #9c7a12; --sl-petal: rgba(255, 236, 170, .35);
        --sl-wood: #c88a52; --sl-wood-2: #a96f3d; --sl-wood-3: #f3c993; --sl-shadow: rgba(0, 0, 0, .45);
        --sl-start: #1b2d35; --sl-start-line: #3d5660; --sl-die: #f4efe6; --sl-die-edge: #8f8576;
      }
    }

      --sl-cell: #1c2b31; --sl-k0: #4a3f1c; --sl-k1: #1f4330; --sl-k2: #1f3a57; --sl-k3: #4c2638;
      --sl-num: #f1e7d6; --sl-halo: #1c2b31; --sl-frame: #7d6649; --sl-goal: #9c7a12; --sl-petal: rgba(255, 236, 170, .35);
      --sl-wood: #c88a52; --sl-wood-2: #a96f3d; --sl-wood-3: #f3c993; --sl-shadow: rgba(0, 0, 0, .45);
      --sl-start: #1b2d35; --sl-start-line: #3d5660; --sl-die: #f4efe6; --sl-die-edge: #8f8576;

    /* ---------- game card ---------- */
    .game { padding: 14px; }
    .g-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; }
    .banner { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 14rem; padding: 6px 12px; border-radius: 12px;
      background: var(--surface-2); border-inline-start: 6px solid var(--pc, var(--primary)); min-height: 52px; }
    .banner .tok-ic { flex: none; }
    .banner-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .banner-name { font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
    .banner-sub { font-size: .86rem; color: var(--muted); }
    .g-tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .g-tools .btn { min-height: 40px; }
    .g-tools .btn svg { width: 18px; height: 18px; }
    .g-main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .g-main { grid-template-columns: minmax(0, 1fr) minmax(280px, 350px); } }
    .g-board { position: relative; width: 100%; max-width: 680px; margin-inline: auto; }
    @media (min-width: 900px) { .g-board { width: max(340px, min(100%, calc((100vh - 170px) * .917))); } }
    #board { direction: ltr; unicode-bidi: isolate; display: block; width: 100%; height: auto; aspect-ratio: 1000 / 1090; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .board-info { margin: 8px 0 0; text-align: center; }

    /* board drawing */
    #board .cell { fill: var(--sl-cell); }
    #board .ck0 { fill: var(--sl-k0); } #board .ck1 { fill: var(--sl-k1); } #board .ck2 { fill: var(--sl-k2); } #board .ck3 { fill: var(--sl-k3); }
    #board .goal { fill: var(--sl-goal); }
    #board .goal-mark ellipse { fill: var(--sl-petal); }
    #board .frame { fill: none; stroke: var(--sl-frame); stroke-width: 3; }
    #board .start-strip { fill: var(--sl-start); stroke: var(--sl-start-line); stroke-width: 2.5; stroke-dasharray: 10 8; }
    #board .start-lbl { fill: var(--muted); font: 700 34px "Noto Sans", system-ui, sans-serif; }
    :root[lang="ur"] #board .start-lbl, :root:not([lang="en"]) #board .start-lbl { font-family: var(--font); }
    #board .num { fill: var(--sl-num); font: 700 27px "Noto Sans", system-ui, sans-serif; paint-order: stroke; stroke: var(--sl-halo); stroke-width: 6px; stroke-linejoin: round; pointer-events: none; }
    #board .goal-num { font-size: 30px; }
    #board .l-shadow { fill: none; stroke: var(--sl-shadow); stroke-width: 10; stroke-linecap: round; }
    #board .l-rail { fill: none; stroke: var(--sl-wood); stroke-width: 10; stroke-linecap: round; }
    #board .l-rung { fill: none; stroke: var(--sl-wood-2); stroke-width: 8; stroke-linecap: round; }
    #board .l-shine { fill: none; stroke: var(--sl-wood-3); stroke-width: 2.6; stroke-linecap: round; opacity: .85; }
    #board .s-shadow { fill: var(--sl-shadow); }
    #board .s-body { fill: var(--sk); stroke: rgba(0, 0, 0, .42); stroke-width: 3; stroke-linejoin: round; }
    #board .s-spots { fill: var(--sk2); }
    #board .s-headshape { fill: var(--sk); stroke: rgba(0, 0, 0, .45); stroke-width: 3; }
    #board .s-eye { fill: var(--sl-eye); }
    #board .s-pupil { fill: var(--sl-pupil); }
    #board .s-tongue { fill: none; stroke: var(--sl-tongue); stroke-width: 3.5; stroke-linecap: round; }
    #board .sn0 { --sk: #2f9e44; --sk2: #b2f2bb; } #board .sn1 { --sk: #e8590c; --sk2: #ffd8a8; } #board .sn2 { --sk: #7048e8; --sk2: #d0bfff; }
    #board .sn3 { --sk: #0c8599; --sk2: #99e9f2; } #board .sn4 { --sk: #c92a2a; --sk2: #ffc9c9; } #board .sn5 { --sk: #e67700; --sk2: #fff3bf; }
    #board .sn6 { --sk: #c2255c; --sk2: #fcc2d7; } #board .sn7 { --sk: #1971c2; --sk2: #a5d8ff; } #board .sn8 { --sk: #5c940d; --sk2: #e9fac8; }
    #board .ladder.hot .l-rail, #board .ladder.hot .l-rung { stroke: var(--success); }
    #board .snake.hot .s-body, #board .snake.hot .s-headshape { stroke: var(--text); stroke-width: 5; }
    /* tokens */
    #board .token { pointer-events: none; }
    #board .t-shadow { fill: rgba(0, 0, 0, .28); }
    #board .t-body { stroke: #fff; stroke-width: 5; stroke-linejoin: round; }
    #board .t-line { fill: none; stroke: rgba(0, 0, 0, .55); stroke-width: 2; stroke-linejoin: round; }
    #board .t-ring { fill: none; stroke: var(--text); stroke-width: 4; stroke-dasharray: 9 7; opacity: 0; }
    #board .token.cur .t-ring { opacity: .9; animation: sl-spin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sl-spin { to { transform: rotate(360deg); } }

    /* ---------- dice + side panel ---------- */
    .g-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .dice-row { display: flex; align-items: center; gap: 14px; }
    .dice-btn { flex: none; width: 96px; height: 96px; padding: 4px; border-radius: 24px; border: 0; cursor: pointer; background: transparent;
      box-shadow: 0 0 0 4px var(--pc, var(--primary)); transition: box-shadow .2s, opacity .2s; touch-action: manipulation; }
    .dice-btn:disabled { cursor: default; opacity: .55; box-shadow: 0 0 0 2px var(--border); }
    .dice-btn:not(:disabled):hover .die { transform: scale(1.04); }
    .die { width: 100%; height: 100%; display: block; transition: transform .12s; }
    .die-body { fill: var(--sl-die); stroke: var(--sl-die-edge); stroke-width: 3; }
    .die-pip { fill: var(--sl-pip); }
    .die.red .die-pip { fill: var(--sl-pip-red); }
    .die.rolling { animation: sl-tumble .32s ease-in-out infinite; }
    @keyframes sl-tumble { 0% { transform: rotate(0) } 25% { transform: rotate(-16deg) scale(.92) translateY(-5px) } 50% { transform: rotate(12deg) scale(1.05) } 75% { transform: rotate(-7deg) scale(.96) translateY(-2px) } 100% { transform: rotate(0) } }
    .dice-txt { min-width: 0; }
    .dice-lbl { font-weight: 800; font-size: 1.2rem; }
    .msg { margin: 0; min-height: 3.2em; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-weight: 600; overflow-wrap: anywhere; }
    .msg.up { background: var(--success-soft); }
    .msg.down { background: var(--danger-soft); }
    .msg.win { background: var(--warning-soft); }
    .msg .big { display: block; font-size: 1.12rem; font-weight: 800; }
    .plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .plist li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); min-width: 0; }
    .plist li.cur { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc) inset; }
    .plist .tok-ic { flex: none; }
    .p-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .p-name { font-weight: 700; overflow-wrap: anywhere; }
    .p-pos { font-size: .82rem; color: var(--muted); }
    .hist h2, .legend h2 { font-size: 1rem; margin: 0 0 6px; }
    .hist ol { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
    .hist li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; font-size: .88rem; border-bottom: 1px solid var(--border); }
    .hist li:last-child { border-bottom: 0; }
    .hist li .tok-ic { flex: none; margin-top: 2px; }
    .hist li.up { background: color-mix(in srgb, var(--success-soft) 60%, transparent); }
    .hist li.down { background: color-mix(in srgb, var(--danger-soft) 60%, transparent); }
    .hist .empty { color: var(--muted); }
    .rule-line { margin: 0; }

    /* values legend (Moksha Patam) */
    .legend { margin-top: 14px; }
    .legend-grid { display: grid; gap: 6px 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); list-style: none; margin: 0; padding: 0; }
    .legend li { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 8px; font-size: .9rem; }
    .legend li.v { background: var(--success-soft); }
    .legend li.x { background: var(--danger-soft); }
    .legend .sq { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    :root[lang="ur"] .legend .sq { direction: rtl; }

    /* winner overlay (inside the card so it also shows in full screen) */
    .win { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; border-radius: 12px; overflow: hidden;
      background: color-mix(in srgb, var(--bg) 72%, transparent); }
    .win-in { position: relative; z-index: 2; width: min(100%, 420px); text-align: center; background: var(--surface); border: 3px solid var(--pc, var(--accent));
      border-radius: 18px; padding: 16px; box-shadow: var(--shadow-lg); animation: sl-pop .45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes sl-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
    .win-trophy { font-size: 2.6rem; line-height: 1.1; }
    .win h2 { font-size: 1.5rem; margin: 4px 0; overflow-wrap: anywhere; }
    .win p { margin: 0 0 8px; color: var(--muted); }
    .win-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; }
    .win-list li { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .92rem; }
    .win .row { justify-content: center; }
    .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 3px; opacity: .9; animation: sl-fall 2.6s ease-in forwards; }
    @keyframes sl-fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

    /* ---------- set-up ---------- */
    .below { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; align-items: start; }
    @media (min-width: 900px) { .below { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
    .side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .setup h2 { margin-bottom: 12px; }
    .lbl { font-weight: 700; font-size: .95rem; display: block; margin-bottom: 6px; }
    .boards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
    .bopt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start; padding: 10px 12px; border-radius: 12px;
      border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; min-height: 44px; }
    .bopt:hover { background: var(--surface-2); }
    .bopt[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .bopt b { font-size: 1rem; }
    .bopt span { font-size: .82rem; color: var(--muted); }
    #app .seg button { min-height: 40px; min-width: 44px; }
    .prow { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 12px; margin: 0; min-width: 0; }
    .prow + .prow { margin-top: 10px; }
    .prow legend { display: flex; align-items: center; gap: 8px; font-weight: 800; padding-inline: 6px; }
    .prow-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); align-items: end; }
    .prow-grid input[type="text"] { width: 100%; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0;
      display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 1.05rem; }
    .sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--text); }
    .sw[aria-checked="true"]::after { content: "✓"; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
    .rules { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 12px; margin: 14px 0 0; display: grid; gap: 8px; }
    .rules legend { font-weight: 800; padding-inline: 6px; }
    .rules .check { align-items: flex-start; min-height: 40px; padding-block: 6px; }
    .rules .check input { flex: none; margin-top: 3px; }
    .rules .check small { display: block; color: var(--muted); font-weight: 400; }
    .rules .sub { margin-inline-start: 28px; }
    .rules .check.off { opacity: .55; }
    .start-row { margin-top: 14px; }
    .dyk p:last-child { margin-bottom: 0; }
    .dyk .src { font-size: .8rem; color: var(--muted); }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }
    .help summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }

    :root[lang="ur"] .banner-name, :root[lang="ur"] .p-name, :root[lang="ur"] .win h2 { line-height: 1.9; }
    :root[lang="ur"] .msg, :root[lang="ur"] .hist li { line-height: 2; }

    /* ---------- phones ---------- */
    @media (max-width: 560px) {
      .game { padding: 8px; margin-inline: -8px; }
      .g-head { margin-bottom: 8px; }
      .banner { flex-basis: 100%; }
      .g-tools { width: 100%; justify-content: flex-end; }
      .g-tools .btn { padding-inline: 10px; }
      .g-tools .btn .lbl-txt { display: none; }
      .dice-btn { width: 88px; height: 88px; }
      .plist { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* ---------- full screen / projector ---------- */
    #gameCard:fullscreen { width: 100vw; height: 100vh; max-width: none; margin: 0; border: 0; border-radius: 0; overflow: auto; padding: 2vh 2vw; background: var(--bg); display: flex; flex-direction: column; }
    #gameCard:fullscreen .g-main { grid-template-columns: minmax(0, auto) minmax(300px, 1fr); flex: 1; min-height: 0; }
    #gameCard:fullscreen .g-board { width: min(100%, calc((100vh - 4vh - 80px) * .917)); max-width: none; margin: 0; }
    #gameCard:fullscreen .banner-name { font-size: 1.8rem; }
    #gameCard:fullscreen .dice-btn { width: 150px; height: 150px; border-radius: 34px; }
    #gameCard:fullscreen .dice-lbl { font-size: 1.6rem; }
    #gameCard:fullscreen .msg { font-size: 1.35rem; }

    #gameCard:fullscreen .plist li { font-size: 1.15rem; }
    #gameCard:fullscreen .hist ol { max-height: 26vh; }
    #gameCard:fullscreen .legend { display: none; }

    /* ---------- print: the board (and its values list) only ---------- */
    @media print {
      .edu-intro, .g-head, .g-side, .below, .win, .board-info, .help { display: none !important; }
      .game { border: 0; box-shadow: none; padding: 0; margin: 0; }
      .g-main { display: block; }
      .g-board { width: 17cm; max-width: 100%; margin: 0 auto; }
      #board .token { display: none; }
      #board, .legend li { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .print-only { display: block !important; text-align: center; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <!-- ===================== GAME ===================== -->
    <section class="card game" id="gameCard" data-state="idle" aria-labelledby="bannerName">
      <h2 class="print-only" id="printTitle"></h2>
      <div class="g-head">
        <div class="banner" id="banner">
          <span id="bannerIcon"></span>
          <div class="banner-txt"><span class="banner-name no-i18n" id="bannerName"></span><span class="banner-sub" id="bannerSub"></span></div>
        </div>
        <div class="g-tools">
          <button type="button" class="btn btn-sm" id="soundBtn" aria-pressed="false">
            <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
            <span class="lbl-txt" data-i18n="sound"></span>
          </button>
          <button type="button" class="btn btn-sm" id="printBtn" data-i18n-title="print_board" data-i18n-aria-label="print_board">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
            <span class="lbl-txt" data-i18n="print_board"></span>
          </button>
          <button type="button" class="btn btn-sm" id="fsBtn" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
            <span class="lbl-txt" data-i18n="fullscreen"></span>
          </button>
        </div>
      </div>

      <div class="g-main">
        <div class="g-board" id="boardWrap">
          <svg id="board" role="img" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="win" id="winBox" hidden>
            <div class="confetti" id="confetti" aria-hidden="true"></div>
            <div class="win-in" role="dialog" aria-modal="false" aria-labelledby="winTitle">
              <div class="win-trophy" aria-hidden="true">🏆</div>
              <h2 id="winTitle" class="no-i18n"></h2>
              <p id="winSub"></p>
              <ol class="win-list" id="winList"></ol>
              <div class="row">
                <button type="button" class="btn btn-primary btn-lg" id="againBtn"><span aria-hidden="true">🔁</span><span data-i18n="play_again"></span></button>
                <button type="button" class="btn" id="toSetupBtn" data-i18n="change_setup"></button>
              </div>
            </div>
          </div>
          <p class="muted small board-info" id="boardInfo"></p>
        </div>

        <div class="g-side">
          <div class="dice-row">
            <button type="button" class="dice-btn" id="rollBtn" data-i18n-aria-label="roll_aria" data-i18n-title="roll_aria">
              <svg class="die" id="die" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <rect class="die-body" x="4" y="4" width="92" height="92" rx="20"/>
                <circle class="die-pip" data-pip="tl" cx="29" cy="29" r="8.5"/><circle class="die-pip" data-pip="tr" cx="71" cy="29" r="8.5"/>
                <circle class="die-pip" data-pip="ml" cx="29" cy="50" r="8.5"/><circle class="die-pip" data-pip="c" cx="50" cy="50" r="8.5"/>
                <circle class="die-pip" data-pip="mr" cx="71" cy="50" r="8.5"/><circle class="die-pip" data-pip="bl" cx="29" cy="71" r="8.5"/>
                <circle class="die-pip" data-pip="br" cx="71" cy="71" r="8.5"/>
              </svg>
            </button>
            <div class="dice-txt">
              <div class="dice-lbl" id="diceLbl"></div>
              <div class="muted small" id="diceHint"></div>
            </div>
          </div>
          <p class="msg" id="msg" aria-live="polite" aria-atomic="true"></p>
          <ul class="plist" id="players"></ul>
          <p class="muted tiny rule-line" id="ruleLine"></p>
          <div class="hist">
            <h2 data-i18n="history_title"></h2>
            <ol id="history"></ol>
          </div>
        </div>
      </div>

      <div class="legend" id="legend" hidden>
        <h2 data-i18n="values_title"></h2>
        <ul class="legend-grid" id="legendList"></ul>
      </div>
    </section>

    <div class="below">
      <!-- ===================== SET-UP ===================== -->
      <section class="card setup" id="setupCard">
        <h2 data-i18n="setup_title"></h2>
        <span class="lbl" id="boardLbl" data-i18n="board_label"></span>
        <div class="boards" role="group" aria-labelledby="boardLbl" id="boardOpts">
          <button type="button" class="bopt" data-board="classic" aria-pressed="true"><b><span aria-hidden="true">🎲 </span><span data-i18n="board_classic"></span></b><span id="hintClassic"></span></button>
          <button type="button" class="bopt" data-board="moksha" aria-pressed="false"><b><span aria-hidden="true">🪷 </span><span data-i18n="board_moksha"></span></b><span data-i18n="board_moksha_hint"></span></button>
          <button type="button" class="bopt" data-board="random" aria-pressed="false"><b><span aria-hidden="true">🔀 </span><span data-i18n="board_random"></span></b><span data-i18n="board_random_hint"></span></button>
        </div>

        <div style="margin-top:14px">
          <span class="lbl" id="countLbl" data-i18n="players_label"></span>
          <div class="seg" role="group" aria-labelledby="countLbl" id="countSeg">
            <button type="button" data-n="2" aria-pressed="true">2</button>
            <button type="button" data-n="3" aria-pressed="false">3</button>
            <button type="button" data-n="4" aria-pressed="false">4</button>
          </div>
        </div>
        <div id="playerRows" style="margin-top:12px"></div>

        <fieldset class="rules">
          <legend data-i18n="rules_label"></legend>
          <p class="small muted mb0" data-i18n="rules_note"></p>
          <label class="check"><input type="checkbox" id="ruleExact"> <span><span data-i18n="rule_exact"></span><small data-i18n="rule_exact_hint"></small></span></label>
          <label class="check sub" id="bounceWrap"><input type="checkbox" id="ruleBounce"> <span><span data-i18n="rule_bounce"></span><small data-i18n="rule_bounce_hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ruleSix"> <span data-i18n="rule_six"></span></label>
          <label class="check sub" id="threeWrap"><input type="checkbox" id="ruleThree"> <span><span data-i18n="rule_three"></span><small data-i18n="rule_three_hint"></small></span></label>
          <label class="check"><input type="checkbox" id="ruleStart6"> <span><span data-i18n="rule_start6"></span><small data-i18n="rule_start6_hint"></small></span></label>
        </fieldset>

        <p class="callout warning small" id="dirtyNote" hidden data-i18n="setup_dirty"></p>
        <div class="row start-row">
          <button type="button" class="btn btn-primary btn-lg" id="startBtn"><span aria-hidden="true">▶</span><span data-i18n="start_game"></span></button>
          <button type="button" class="btn btn-danger" id="resetBtn" data-i18n="reset_all"></button>
        </div>
        <p class="tiny muted mb0" style="margin-top:10px"><span aria-hidden="true">🔒 </span><span data-i18n="saved_note"></span></p>
      </section>

      <div class="side-col">
        <!-- ===================== DID YOU KNOW ===================== -->
        <section class="card dyk" id="dyk">
          <h2><span aria-hidden="true">🪷 </span><span data-i18n="dyk_title"></span></h2>
          <p data-i18n="dyk_1"></p>
          <p data-i18n="dyk_2"></p>
          <p data-i18n="dyk_3"></p>
        </section>

        <details class="card help">
          <summary><strong data-i18n="help"></strong></summary>
          <ul>
            <li data-i18n="help_1"></li>
            <li data-i18n="help_2"></li>
            <li data-i18n="help_3"></li>
            <li data-i18n="help_4"></li>
            <li data-i18n="help_5"></li>
            <li data-i18n="help_6"></li>
          </ul>
        </details>
      </div>
    </div>
  </main>
  <script src="../../../apps/snakes-ladders/../../shared/edu.js"></script>
  <script src="../../../apps/snakes-ladders/strings.js"></script>
  <script src="../../../apps/snakes-ladders/content.js"></script>
  <script src="../../../apps/snakes-ladders/engine.js"></script>
  <script src="../../../apps/snakes-ladders/board.js"></script>
  <script src="../../../apps/snakes-ladders/app.js"></script>
</body>
</html>
