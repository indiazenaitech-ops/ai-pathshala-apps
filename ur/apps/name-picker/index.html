  <style>
    /* ---------- top line: class picker + tabs ---------- */
    .topline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .topline .tabs { border-bottom: 0; margin-bottom: -1px; }
    .topline .tabs button { min-height: 46px; font-size: 1rem; display: inline-flex; align-items: center; gap: 6px; }
    .classbox { order: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding-bottom: 8px; }
    .classbox select { max-width: 15rem; font-weight: 600; }
    @media (max-width: 760px) {
      .classbox { order: 0; width: 100%; }
      .classbox select { flex: 1 1 9rem; }
      .topline .tabs { width: 100%; }
      .topline .tabs button { flex: 1 1 0; justify-content: center; white-space: normal; text-align: center; padding: 8px 6px; line-height: 1.25; font-size: .95rem; }
    }

    /* ---------- picker ---------- */
    .pick-main { display: grid; gap: 18px 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); align-items: start; }
    @media (max-width: 820px) { .pick-main { grid-template-columns: minmax(0, 1fr); } }
    .pick-stage { min-width: 0; }
    .wheel-wrap { display: grid; width: min(100%, 64vh, 560px); margin-inline: auto; container-type: inline-size; }
    .wheel-wrap > * { grid-area: 1 / 1; }
    #wheel { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; cursor: pointer; touch-action: manipulation; }
    .hub {
      place-self: center; width: 24%; aspect-ratio: 1 / 1; border-radius: 50%;
      border: 4px solid var(--surface); background: var(--primary); color: var(--primary-ink);
      font: inherit; font-weight: 800; font-size: 1rem; font-size: clamp(.8rem, 5cqw, 1.8rem); line-height: 1.1;
      padding: 4px; cursor: pointer; box-shadow: var(--shadow-lg); display: grid; place-items: center;
      overflow: hidden; white-space: nowrap; transition: transform .15s;
    }
    .hub:hover { transform: scale(1.05); }
    .hub:disabled { cursor: progress; transform: none; }

    .pick-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .side-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .side-tools .btn svg { width: 18px; height: 18px; }
    .winner {
      min-height: 7.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
      padding: 14px; border-radius: var(--radius); text-align: center;
      background: var(--accent-soft); border: 2px dashed color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .winner-hint { color: var(--muted); font-weight: 600; }
    .winner-name { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; color: var(--text); animation: np-pop .5s cubic-bezier(.2, 1.5, .4, 1); }
    .winner.multi .winner-name { font-size: clamp(1.25rem, 2.6vw, 1.9rem); background: var(--surface); padding: 4px 12px; border-radius: 10px; box-shadow: var(--shadow); }
    .winner.many .winner-name { font-size: clamp(1rem, 1.8vw, 1.3rem); padding: 3px 10px; }
    @keyframes np-pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    .spin-btn { width: 100%; font-size: 1.25rem; min-height: 56px; }
    .remain { display: flex; flex-direction: column; gap: 8px; }
    .remain .row { justify-content: space-between; }
    .pick-settings { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); padding-top: 12px; }

    .stepper { display: inline-flex; align-items: stretch; }
    .stepper .btn { min-width: 44px; padding: 0 8px; font-size: 1.3rem; line-height: 1; }
    .stepper .btn:first-child { border-start-end-radius: 0; border-end-end-radius: 0; }
    .stepper .btn:last-child { border-start-start-radius: 0; border-end-start-radius: 0; }
    .stepper input { width: 4.4em; text-align: center; border-radius: 0; border-inline-width: 0; font-weight: 700; -moz-appearance: textfield; appearance: textfield; }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .lbl { font-weight: 600; font-size: .92rem; }
    /* touch targets: at least 40px everywhere in this app */
    #app .btn-sm, #app .seg button { min-height: 40px; }
    .h-sm { font-size: 1.05rem; margin-bottom: 10px; }

    /* card flip mode */
    .cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-content: center; min-height: 300px; padding: 8px; perspective: 1200px; cursor: pointer; }
    .flip { width: min(100%, 380px); aspect-ratio: 3 / 2; container-type: inline-size; }
    .cards.few .flip { width: calc(50% - 7px); max-width: 280px; }
    .cards.many .flip { width: calc(33.33% - 10px); max-width: 210px; }
    @media (max-width: 560px) {
      .cards { min-height: 220px; gap: 10px; }
      .cards.many .flip { width: calc(50% - 5px); }
    }
    .flip-in { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
    .flip.flipped .flip-in { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); display: grid; place-items: center; padding: 6px; text-align: center; font-weight: 800; }
    .face.back {
      color: var(--primary-ink); font-size: 3rem; border: 4px solid var(--surface); box-shadow: var(--shadow);
      background: repeating-linear-gradient(45deg, var(--primary) 0 14px, color-mix(in srgb, var(--primary) 78%, var(--accent)) 14px 28px);
    }
    .cards.many .face.back { font-size: 2rem; }
    .face.front { background: var(--surface); color: var(--text); border: 3px solid var(--accent); box-shadow: var(--shadow); transform: rotateY(180deg); font-size: 1.3rem; font-size: clamp(.95rem, 12.5cqw, 3.2rem); line-height: 1.2; overflow-wrap: break-word; min-width: 0; }
    :root[lang="ur"] .face.front { line-height: 1.9; font-size: 1.2rem; font-size: clamp(.95rem, 11cqw, 2.8rem); }
    .cards.shuffling .flip { animation: np-wobble .3s ease-in-out infinite alternate; }
    .cards.shuffling .flip:nth-child(2n) { animation-delay: -.15s; }
    @keyframes np-wobble { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-8px); } }

    /* history + attendance chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pchip { cursor: default; }
    .pchip b { color: var(--muted); font-size: .8em; }
    .chip.att { min-height: 40px; font-size: .95rem; }
    .chip.att[aria-pressed="true"] { background: var(--success-soft); color: var(--text); border-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
    .chip.att[aria-pressed="false"] { background: var(--surface-2); color: var(--muted); text-decoration: line-through; border-style: dashed; }
    .chip.att .ic { font-size: .85em; text-decoration: none; }
    .chip.att[aria-pressed="true"] .ic { color: var(--success); }
    .chip.att[aria-pressed="false"] .ic { color: var(--danger); }

    /* groups */
    .groups { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .gcard { border-radius: var(--radius); border: 1px solid var(--border); border-top: 8px solid var(--gc, var(--c1)); background: color-mix(in srgb, var(--gc, var(--c1)) 10%, var(--surface)); padding: 12px 14px; min-width: 0; animation: np-pop .35s ease-out both; }
    .ghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .ghead h3 { margin: 0; font-size: 1.15rem; }
    .gmembers { margin: 0; padding-inline-start: 1.5em; font-size: 1.05rem; line-height: 1.65; overflow-wrap: anywhere; }
    :root[lang="ur"] .gmembers, :root[lang="ur"] .pairs li { line-height: 2.1; }
    :root[lang="ur"] .winner-name { line-height: 1.8; }
    .apart summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
    .pairs { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .pairs li { display: inline-flex; align-items: center; gap: 2px; padding-inline-start: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; font-size: .92rem; }
    .pairs button { min-width: 40px; min-height: 40px; border: 0; background: transparent; color: var(--danger); cursor: pointer; font-size: 1rem; border-radius: 999px; }
    .pairs button:hover { background: var(--danger-soft); }
    .group-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .print-head { margin-bottom: 8px; }

    /* list */
    #panel-list .grid-2 { align-items: start; }
    .roll { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }
    .help summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
    .apart summary, .help summary { gap: 8px; list-style: none; }
    .apart summary::-webkit-details-marker, .help summary::-webkit-details-marker { display: none; }
    .apart summary::after, .help summary::after { content: "▾"; margin-inline-start: auto; color: var(--muted); font-size: 1.1em; transition: transform .2s; }
    .apart[open] > summary::after, .help[open] > summary::after { transform: rotate(180deg); }
    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* ---------- projector / full screen ---------- */
    #pickCard:fullscreen { background: var(--bg); width: 100vw; height: 100vh; max-width: none; border: 0; border-radius: 0; overflow: auto; padding: 3vh 3vw; display: flex; flex-direction: column; justify-content: center; }
    #pickCard:fullscreen .pick-main { grid-template-columns: minmax(0, 1fr) minmax(0, 34vw); }
    #pickCard:fullscreen .wheel-wrap { width: min(100%, 86vh); }
    #pickCard:fullscreen .winner { min-height: 32vh; }
    #pickCard:fullscreen .winner-name { font-size: clamp(2.5rem, 6.5vw, 7rem); }
    #pickCard:fullscreen .winner.multi .winner-name { font-size: clamp(1.6rem, 3.4vw, 3.2rem); }
    #pickCard:fullscreen .winner.many .winner-name { font-size: clamp(1.2rem, 2.2vw, 2rem); }
    #pickCard:fullscreen .pick-main { align-items: center; }
    #pickCard:fullscreen .cards { min-height: 75vh; }
    #pickCard:fullscreen .cards .flip { max-width: none; }
    #pickCard:fullscreen .cards.one .flip { width: min(100%, 60vw); }
    #pickCard:fullscreen .face.front { font-size: 2.6rem; font-size: clamp(1.2rem, 13cqw, 6rem); }

    @media print {

    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="topline">
      <div class="classbox">
        <label for="classSel" data-i18n="class_label"></label>
        <select id="classSel" class="no-i18n"></select>
        <span class="badge primary" id="classInfo"></span>
      </div>
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" id="tab-pick" data-tab="pick" aria-controls="panel-pick" aria-selected="true"><span aria-hidden="true">🎡</span><span data-i18n="tab_pick"></span></button>
        <button type="button" role="tab" id="tab-groups" data-tab="groups" aria-controls="panel-groups" aria-selected="false" tabindex="-1"><span aria-hidden="true">👥</span><span data-i18n="tab_groups"></span></button>
        <button type="button" role="tab" id="tab-list" data-tab="list" aria-controls="panel-list" aria-selected="false" tabindex="-1"><span aria-hidden="true">📋</span><span data-i18n="tab_list"></span></button>
      </div>
    </div>

    <!-- ===================== PICK ===================== -->
    <section id="panel-pick" role="tabpanel" aria-labelledby="tab-pick" class="stack">
      <div class="card" id="pickCard">
        <div class="pick-main">
          <div class="pick-stage">
            <div class="wheel-wrap" id="wheelWrap">
              <canvas id="wheel" width="560" height="560" role="img"></canvas>
              <button type="button" class="hub" id="hubBtn" tabindex="-1" data-i18n="spin"></button>
            </div>
            <div class="cards one" id="cardsWrap" hidden></div>
          </div>

          <div class="pick-side">
            <div class="side-tools">
              <button type="button" class="btn btn-sm" id="soundBtn" aria-pressed="true">
                <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
                <span data-i18n="sound"></span>
              </button>
              <button type="button" class="btn btn-sm" id="fsBtn" data-i18n-title="fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
                <span data-i18n="fullscreen"></span>
              </button>
            </div>

            <div class="winner" id="winner" aria-live="polite" aria-atomic="true"></div>

            <button type="button" class="btn btn-primary btn-lg spin-btn" id="spinBtn"><span aria-hidden="true" id="spinIc">🎡</span><span id="spinLbl" data-i18n="spin"></span></button>
            <p class="muted tiny mb0 center" id="wheelTip" data-i18n="wheel_tip"></p>

            <div class="remain">
              <div class="small" id="remaining" aria-live="polite"></div>
              <div class="progress" id="remainBar"><span style="width:100%"></span></div>
              <div><button type="button" class="btn btn-sm" id="restoreBtn"><span aria-hidden="true">↺</span><span id="restoreLbl" data-i18n="restore"></span></button></div>
            </div>

            <div class="pick-settings">
              <div class="field">
                <span class="lbl" id="modeLbl" data-i18n="mode_label"></span>
                <div class="seg" role="group" aria-labelledby="modeLbl" id="modeSeg">
                  <button type="button" data-mode="wheel" aria-pressed="true"><span aria-hidden="true">🎡 </span><span data-i18n="mode_wheel"></span></button>
                  <button type="button" data-mode="cards" aria-pressed="false"><span aria-hidden="true">🃏 </span><span data-i18n="mode_cards"></span></button>
                </div>
              </div>
              <div class="field">
                <label for="pickN" data-i18n="how_many"></label>
                <div class="stepper">
                  <button type="button" class="btn" data-step="-1" data-for="pickN" aria-label="−">−</button>
                  <input type="number" id="pickN" min="1" max="20" step="1" value="1" inputmode="numeric">
                  <button type="button" class="btn" data-step="1" data-for="pickN" aria-label="+">+</button>
                </div>
              </div>
              <label class="check"><input type="checkbox" id="noRepeat" checked> <span data-i18n="no_repeat"></span></label>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="h-sm" data-i18n="picked_so_far"></h2>
        <div class="chips" id="history"></div>
      </div>
    </section>

    <!-- ===================== GROUPS ===================== -->
    <section id="panel-groups" role="tabpanel" aria-labelledby="tab-groups" hidden>
      <div class="split">
        <div class="card stack" id="groupSettings">
          <div class="field">
            <span class="lbl" id="groupByLbl" data-i18n="group_by"></span>
            <div class="seg" role="group" aria-labelledby="groupByLbl" id="groupBySeg">
              <button type="button" data-by="count" aria-pressed="true" data-i18n="by_count"></button>
              <button type="button" data-by="size" aria-pressed="false" data-i18n="by_size"></button>
            </div>
          </div>
          <div class="field">
            <label for="groupVal" id="groupValLabel"></label>
            <div class="stepper">
              <button type="button" class="btn" data-step="-1" data-for="groupVal" aria-label="−">−</button>
              <input type="number" id="groupVal" min="2" max="60" step="1" value="4" inputmode="numeric">
              <button type="button" class="btn" data-step="1" data-for="groupVal" aria-label="+">+</button>
            </div>
            <span class="hint" data-i18n="size_hint"></span>
          </div>
          <div class="field">
            <label for="groupTheme" data-i18n="group_names"></label>
            <select id="groupTheme"></select>
          </div>
          <button type="button" class="btn btn-primary btn-lg w100" id="makeGroups"><span aria-hidden="true">👥</span><span data-i18n="make_groups"></span></button>

          <details class="apart" id="apartBox">
            <summary data-i18n="apart_title"></summary>
            <div class="stack">
              <p class="muted small mb0" data-i18n="apart_hint"></p>
              <div class="field"><label for="apartA" data-i18n="student_a"></label><select id="apartA" class="no-i18n"></select></div>
              <div class="field"><label for="apartB" data-i18n="student_b"></label><select id="apartB" class="no-i18n"></select></div>
              <button type="button" class="btn" id="addPair"><span aria-hidden="true">＋</span><span data-i18n="add_pair"></span></button>
              <ul class="pairs" id="pairs"></ul>
            </div>
          </details>
        </div>

        <div class="card stack" id="groupsOut">
          <div class="print-only print-head"><h2 id="printTitle" class="no-i18n"></h2><p id="printDate" class="mb0"></p></div>
          <div class="row spread no-print">
            <strong id="groupsSummary" aria-live="polite"></strong>
            <div class="group-actions" id="groupActions">
              <button type="button" class="btn btn-sm" id="reshuffleBtn"><span aria-hidden="true">🔀</span><span data-i18n="reshuffle"></span></button>
              <button type="button" class="btn btn-sm" id="copyGroups"><span aria-hidden="true">📋</span><span data-i18n="copy"></span></button>
              <button type="button" class="btn btn-sm" id="printGroups"><span aria-hidden="true">🖨</span><span data-i18n="print"></span></button>
              <button type="button" class="btn btn-sm" id="csvGroups"><span aria-hidden="true">⬇</span><span data-i18n="download_csv"></span></button>
              <button type="button" class="btn btn-sm" id="fsGroups"><span data-i18n="fullscreen"></span></button>
            </div>
          </div>
          <div class="callout warning no-print" id="apartWarn" hidden data-i18n="apart_failed"></div>
          <p class="muted" id="groupsEmpty" data-i18n="groups_empty"></p>
          <div class="groups" id="groups"></div>
        </div>
      </div>
    </section>

    <!-- ===================== CLASS LIST ===================== -->
    <section id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden>
      <div class="grid-2">
        <div class="card stack">
          <div class="row">
            <button type="button" class="btn" id="newClass"><span aria-hidden="true">＋</span><span data-i18n="new_class"></span></button>
            <button type="button" class="btn btn-danger" id="delClass"><span aria-hidden="true">🗑</span><span data-i18n="delete_class"></span></button>
          </div>
          <div class="field">
            <label for="className" data-i18n="class_name"></label>
            <input type="text" id="className" maxlength="40" data-i18n-placeholder="class_name_ph" autocomplete="off">
          </div>
          <div class="field">
            <label for="namesInput" data-i18n="names_label"></label>
            <textarea id="namesInput" rows="12" data-i18n-placeholder="names_ph" spellcheck="false"></textarea>
          </div>
          <div class="row">
            <button type="button" class="btn btn-primary" id="saveList"><span aria-hidden="true">💾</span><span data-i18n="save_list"></span></button>
            <button type="button" class="btn" id="importBtn"><span aria-hidden="true">📄</span><span data-i18n="import_csv"></span></button>
            <button type="button" class="btn btn-ghost" id="sampleBtn" data-i18n="load_sample"></button>
          </div>
          <p class="small muted mb0" id="listStatus" aria-live="polite"></p>
          <div class="roll">
            <div class="field">
              <label for="rollN" data-i18n="roll_label"></label>
              <div class="stepper">
                <button type="button" class="btn" data-step="-1" data-for="rollN" aria-label="−">−</button>
                <input type="number" id="rollN" min="1" max="500" step="1" value="40" inputmode="numeric">
                <button type="button" class="btn" data-step="1" data-for="rollN" aria-label="+">+</button>
              </div>
            </div>
            <button type="button" class="btn" id="rollFill" data-i18n="roll_fill"></button>
          </div>
          <p class="small muted mb0" data-i18n="import_hint"></p>
          <p class="tiny muted mb0"><span aria-hidden="true">🔒 </span><span data-i18n="saved_local"></span></p>
        </div>

        <div class="card stack">
          <h2 data-i18n="attendance_title"></h2>
          <p class="muted small" data-i18n="attendance_hint"></p>
          <div class="chips" id="attendance"></div>
          <div><button type="button" class="btn btn-sm" id="allPresent"><span aria-hidden="true">✓</span><span data-i18n="all_present"></span></button></div>
        </div>
      </div>
    </section>

    <details class="card help no-print" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../../apps/name-picker/../../shared/edu.js"></script>
  <script src="../../../apps/name-picker/strings.js"></script>
  <script src="../../../apps/name-picker/content.js"></script>
  <script src="../../../apps/name-picker/app.js"></script>
</body>
</html>
