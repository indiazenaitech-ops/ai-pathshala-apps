<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essay &amp; Word Counter · AI Pathshala</title>
  <meta name="description" content="Live word, character and sentence counts in any Indian language, with CBSE word-limit bars, long-sentence checks and format guides.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- layout ---------- */
    .wc-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto 1fr;
                 grid-template-areas: "main side" "guides side"; align-items: start; }
    .wc-main { grid-area: main; } .wc-side { grid-area: side; } .wc-guides { grid-area: guides; }
    .wc-main, .wc-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 960px) {
      .wc-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "main" "side" "guides"; }
      .wc-side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    }
    @media (max-width: 640px) { .wc-side { grid-template-columns: minmax(0, 1fr); } }
    .wc-side .card h2 { font-size: 1.08rem; }
    .wc-side .card > :last-child { margin-bottom: 0; }

    /* ---------- help ---------- */
    details.wc-help { margin-bottom: 16px; }
    details.wc-help summary { cursor: pointer; font-size: 1.02rem; min-height: 28px; }
    details.wc-help ul { padding-inline-start: 1.25em; margin: 12px 0; }
    details.wc-help li { margin-bottom: 8px; }
    details.wc-help .callout { margin: 0; }

    /* ---------- editor ---------- */
    .wc-editor { --wc-fs: 18px; }
    .wc-head { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
    .wc-head h2 { margin: 0; font-size: 1.15rem; flex: 1 1 auto; }
    .wc-head .seg button { min-height: 40px; padding-inline: 14px; }
    .wc-font { display: inline-flex; gap: 6px; }
    .wc-font .btn { min-width: 46px; }
    #text, .wc-check { font-size: var(--wc-fs); line-height: 1.7; }
    #text { height: 320px; min-height: 160px; padding: 12px 14px; }
    :root[lang="ur"] #text, :root[lang="ur"] .wc-check { line-height: 2.1; }
    .wc-check { min-height: 160px; max-height: 70vh; overflow: auto; padding: 12px 14px; border: 1px solid var(--border);
                border-radius: 10px; background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere; }
    .wc-check .snt { border-radius: 4px; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .wc-check .snt:hover { text-decoration: underline; text-decoration-color: var(--primary); text-underline-offset: .2em; }
    .wc-check .s-long { background: color-mix(in srgb, var(--warning) 26%, transparent); }
    .wc-check .s-vlong { background: color-mix(in srgb, var(--danger) 24%, transparent); }
    .wc-check .flash { animation: wc-flash 1.8s ease-out; }
    @keyframes wc-flash { 0%, 45% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
    .wc-check mark { background: #ffd43b; color: #14191b; border-radius: 3px; padding: 0 1px; }
    .wc-check .muted { white-space: normal; }
    .wc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--muted); align-items: center; }
    .wc-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-inline-end: 6px; border: 1px solid var(--border); }
    .wc-legend .k-long { background: color-mix(in srgb, var(--warning) 45%, transparent); }
    .wc-legend .k-vlong { background: color-mix(in srgb, var(--danger) 40%, transparent); }
    .wc-legend .k-rep { background: #ffd43b; }

    /* ---------- word-limit meter ---------- */
    .wc-meter { border-top: 1px solid var(--border); padding-top: 12px; --wc-col: var(--text); }
    .wc-meter[data-state="short"] { --wc-col: var(--info); }
    .wc-meter[data-state="near"] { --wc-col: var(--warning); }
    .wc-meter[data-state="ok"] { --wc-col: var(--success); }
    .wc-meter[data-state="over"] { --wc-col: var(--warning); }
    .wc-meter[data-state="way"] { --wc-col: var(--danger); }
    .wc-meter-top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; }
    .wc-count { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .wc-big { font-size: clamp(2.3rem, 6vw, 3.3rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--wc-col); }
    :root[lang="ur"] .wc-big, :root[lang="ur"] .wc-stat .v, :root[lang="ur"] .wc-fre .score { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }
    .wc-unit { font-weight: 700; color: var(--muted); font-size: 1.05rem; }
    .wc-preset { flex: 0 1 330px; min-width: min(100%, 230px); }
    .wc-preset select { width: 100%; }
    .wc-custom { align-items: flex-end; margin-top: 10px; }
    .wc-custom input { width: 7.5rem; }
    .wc-custom .seg button { min-height: 40px; }
    .wc-bar { position: relative; height: 18px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
              margin: 18px 6px 30px; }
    .wc-fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; border-radius: 999px; background: var(--wc-col); transition: width .2s; }
    .wc-zone { position: absolute; inset-block: -5px; border: 2px dashed var(--success); border-radius: 6px;
               background: color-mix(in srgb, var(--success) 14%, transparent); }
    .wc-zone span { position: absolute; top: calc(100% + 4px); font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .wc-zone .lo { inset-inline-end: calc(100% - 4px); }
    .wc-zone .hi { inset-inline-start: calc(100% - 4px); }
    .wc-msg { font-weight: 700; color: var(--wc-col); margin: 0; }
    .wc-meter[data-state="none"] .wc-msg { color: var(--muted); font-weight: 600; }

    /* ---------- toolbar ---------- */
    .wc-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .wc-tools .sp { flex: 1 1 auto; }
    @media (max-width: 560px) {
      .wc-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .wc-tools .sp { display: none; }
      .wc-tools .btn { flex-direction: column; gap: 2px; min-height: 58px; padding: 6px 2px; font-size: .78rem; letter-spacing: -.01em; white-space: normal; text-align: center; overflow-wrap: break-word; }
      .wc-head h2 { flex-basis: 100%; }
      #text { height: 260px; }
    }
    .wc-tools .ic { font-size: 1.1rem; line-height: 1; }
    .wc-status { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0; min-height: 32px; }

    /* ---------- side cards ---------- */
    .wc-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .wc-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 11px; min-width: 0; }
    .wc-stat.wide { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .wc-stat .v { font-size: 1.45rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .wc-stat.wide .v { font-size: 2rem; }
    .wc-stat .l { font-size: .84rem; font-weight: 600; color: var(--muted); line-height: 1.3; }
    .wc-stat .h { font-size: .75rem; color: var(--muted); line-height: 1.3; }
    .wc-stat .v.time { font-size: 1.15rem; }
    :root[lang="ur"] .wc-stat .l, :root[lang="ur"] .wc-stat .h, :root[lang="ur"] .wc-long button { line-height: 2; }

    .wc-fre { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .wc-fre .score { font-size: 2.5rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .wc-scale { position: relative; height: 10px; border-radius: 999px; margin: 6px 8px 8px;
                background: linear-gradient(to right, var(--danger), var(--warning), var(--success)); }
    [dir="rtl"] .wc-scale { background: linear-gradient(to left, var(--danger), var(--warning), var(--success)); }
    .wc-scale .dot { position: absolute; top: -5px; width: 20px; height: 20px; margin-inline-start: -10px; border-radius: 50%;
                     background: var(--surface); border: 4px solid var(--text); }

    .wc-long { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .wc-long button { width: 100%; text-align: start; display: block; border: 1px solid var(--border); border-inline-start-width: 5px;
                      background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--text);
                      font: inherit; font-size: .9rem; line-height: 1.5; min-height: 44px; }
    .wc-long button:hover { background: var(--surface-2); }
    .wc-long button[data-level="long"] { border-inline-start-color: var(--warning); }
    .wc-long button[data-level="vlong"] { border-inline-start-color: var(--danger); }
    .wc-long .badge { margin-inline-end: 6px; }
    .wc-long .badge.warn { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
    .wc-long .ex { overflow-wrap: anywhere; }
    .wc-note { margin: 10px 0 0; }

    .wc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .wc-chips .chip { min-height: 40px; }
    .wc-chips .chip .n { font-variant-numeric: tabular-nums; font-size: .8rem; opacity: .85; }

    /* ---------- format guides ---------- */
    .wc-guides .tabs button { min-height: 44px; }
    .wc-guide-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .wc-guide-head h2 { margin: 0; }
    .wc-guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 18px; align-items: start; }
    .wc-guide h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .wc-guide h4 { margin: 0 0 6px; font-size: 1rem; }
    .wc-points { padding-inline-start: 1.3em; margin: 10px 0 12px; }
    .wc-points li { margin-bottom: 6px; }
    .wc-limit { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; margin: 0; }
    .wc-outline { font-family: var(--font); white-space: pre-wrap; background: var(--surface-2); border: 1px dashed var(--border);
                  border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; font-size: .95rem; line-height: 1.6; overflow-wrap: anywhere; }
    .wc-guide-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .wc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

    /* ---------- smartboard / full screen ---------- */
    .edu-fullscreen-on #text { height: 58vh; }
    .edu-fullscreen-on .wc-check { max-height: 58vh; }

    /* ---------- print ---------- */
    .wc-print h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .wc-print-lines { margin: 0 0 8px; }
    .wc-print-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13pt; line-height: 1.75; border-top: 1px solid #999; padding-top: 10px; }
    @media print {
      .wc-main, .wc-side, .wc-guides, details.wc-help, .edu-intro, .wc-sr { display: none !important; }
      .wc-layout { display: block !important; }
      body.wc-pg .wc-print { display: none !important; }
      body.wc-pg .wc-guides { display: block !important; border: 0; padding: 0; }
      body.wc-pg .wc-guides .tabs, body.wc-pg .wc-guide-actions, body.wc-pg .wc-guide-head button, body.wc-pg #guide-intro { display: none !important; }
      body.wc-pg .wc-guide { grid-template-columns: minmax(0, 1fr); }
      .wc-outline { border-color: #999; background: #fff; }
    }
  </style>
</head>
<body>
  <main id="app">
    <!-- printed sheet (filled just before printing) -->
    <div class="print-only wc-print" id="print-sheet">
      <h1 data-i18n="app_title"></h1>
      <p class="wc-print-lines"><span data-i18n="print_name"></span>: ______________________ &nbsp; <span data-i18n="print_class"></span>: ________ &nbsp; <span data-i18n="print_date"></span>: ____________</p>
      <p id="print-stats"></p>
      <div id="print-text" class="wc-print-text no-i18n" dir="auto"></div>
    </div>

    <p class="edu-intro" data-i18n="intro"></p>

    <details class="card wc-help no-print" id="help">
      <summary><strong data-i18n="help_h"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="callout"><strong data-i18n="count_h"></strong> <span id="count-how"></span></p>
    </details>

    <div class="wc-layout">
      <div class="wc-main">
        <section class="card stack wc-editor" id="editor-card" aria-labelledby="h-writing">
          <div class="wc-head">
            <h2 id="h-writing" data-i18n="h_writing"></h2>
            <div class="seg" role="group" id="view-seg" data-i18n-aria-label="view_label">
              <button type="button" id="view-write" aria-pressed="true"><span aria-hidden="true">✏️</span> <span data-i18n="view_write"></span></button>
              <button type="button" id="view-check" aria-pressed="false"><span aria-hidden="true">🔍</span> <span data-i18n="view_check"></span></button>
            </div>
            <div class="wc-font">
              <button type="button" class="btn btn-sm" id="font-down" dir="ltr" data-i18n-aria-label="font_smaller" data-i18n-title="font_smaller">A−</button>
              <button type="button" class="btn btn-sm" id="font-up" dir="ltr" data-i18n-aria-label="font_bigger" data-i18n-title="font_bigger">A+</button>
            </div>
          </div>

          <textarea id="text" class="no-i18n" dir="auto" spellcheck="true" data-i18n-placeholder="placeholder" data-i18n-aria-label="h_writing"></textarea>
          <div id="check" class="wc-check no-i18n" dir="auto" hidden></div>
          <div id="check-legend" class="wc-legend" hidden>
            <span><i class="k-long"></i><span id="leg-long"></span></span>
            <span><i class="k-vlong"></i><span id="leg-vlong"></span></span>
            <span><i class="k-rep"></i><span data-i18n="leg_rep"></span></span>
            <span data-i18n="check_hint"></span>
          </div>

          <div class="wc-meter" id="meter" data-state="none">
            <div class="wc-meter-top">
              <div class="wc-count"><span id="m-value" class="wc-big">0</span> <span id="m-unit" class="wc-unit"></span></div>
              <label class="field wc-preset"><span data-i18n="target_label"></span><select id="preset"></select></label>
            </div>
            <div class="row wc-custom" id="custom-row" hidden>
              <label class="field"><span data-i18n="min_label"></span><input type="number" id="cmin" min="0" max="100000" step="1" inputmode="numeric"></label>
              <label class="field"><span data-i18n="max_label"></span><input type="number" id="cmax" min="1" max="100000" step="1" inputmode="numeric"></label>
              <div class="field"><span data-i18n="unit_label"></span>
                <div class="seg" role="group" id="unit-seg" data-i18n-aria-label="unit_label">
                  <button type="button" id="unit-w" aria-pressed="true" data-i18n="unit_words"></button>
                  <button type="button" id="unit-c" aria-pressed="false" data-i18n="unit_chars"></button>
                </div>
              </div>
            </div>
            <div class="wc-bar" id="bar" role="progressbar" aria-valuemin="0" data-i18n-aria-label="target_label" hidden>
              <div class="wc-fill" id="fill"></div>
              <div class="wc-zone" id="zone"><span class="lo" id="zone-lo"></span><span class="hi" id="zone-hi"></span></div>
            </div>
            <p class="wc-msg" id="target-msg"></p>
          </div>

          <div class="wc-tools">
            <button type="button" class="btn" id="example"><span class="ic" aria-hidden="true">📄</span> <span data-i18n="btn_example"></span></button>
            <button type="button" class="btn" id="copy"><span class="ic" aria-hidden="true">📋</span> <span data-i18n="copy"></span></button>
            <button type="button" class="btn" id="download"><span class="ic" aria-hidden="true">⬇️</span> <span data-i18n="btn_txt"></span></button>
            <button type="button" class="btn" id="print"><span class="ic" aria-hidden="true">🖨️</span> <span data-i18n="print"></span></button>
            <button type="button" class="btn" id="fullscreen"><span class="ic" aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            <span class="sp"></span>
            <button type="button" class="btn btn-danger" id="clear"><span class="ic" aria-hidden="true">🗑️</span> <span data-i18n="clear"></span></button>
          </div>
          <p class="muted small wc-status" id="status"><span id="status-txt"></span> <button type="button" class="btn btn-sm" id="undo" hidden data-i18n="btn_undo"></button></p>
          <p class="wc-sr" id="sr-live" aria-live="polite"></p>
        </section>
      </div>

      <aside class="wc-side">
        <section class="card" id="stats-card" aria-labelledby="h-stats">
          <h2 id="h-stats" data-i18n="stats_h"></h2>
          <div class="wc-stats" id="stats"></div>
        </section>

        <section class="card" id="long-card" aria-labelledby="h-long">
          <h2 id="h-long" data-i18n="long_h"></h2>
          <p class="muted small" data-i18n="long_tip"></p>
          <ol class="wc-long" id="long-list"></ol>
          <p class="small wc-note" id="long-msg"></p>
        </section>

        <section class="card" id="rep-card" aria-labelledby="h-rep">
          <h2 id="h-rep" data-i18n="rep_h"></h2>
          <label class="check"><input type="checkbox" id="skip-small" checked> <span data-i18n="rep_skip"></span></label>
          <div class="wc-chips" id="rep-list"></div>
          <p class="muted small" data-i18n="rep_tip"></p>
        </section>

        <section class="card" id="read-card" data-state="na" aria-labelledby="h-read">
          <h2 id="h-read" data-i18n="read_h"></h2>
          <div id="read-body"></div>
        </section>
      </aside>

      <section class="card stack wc-guides" id="guide-card" aria-labelledby="h-guides">
        <div class="wc-guide-head">
          <h2 id="h-guides" data-i18n="guide_h"></h2>
          <button type="button" class="btn btn-sm no-print" id="print-guide"><span aria-hidden="true">🖨️</span> <span data-i18n="g_print"></span></button>
        </div>
        <p class="muted small mb0" id="guide-intro" data-i18n="guide_intro"></p>
        <div class="tabs" role="tablist" id="guide-tabs" data-i18n-aria-label="guide_h"></div>
        <div id="guide-panel" role="tabpanel"></div>
      </section>
    </div>

  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
