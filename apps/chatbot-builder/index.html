<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a Chatbot · AI Pathshala</title>
  <meta name="description" content="Build a rule-based chatbot with intents and example phrases, chat with it, and see how it decides what to say. Free, offline, 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .cb-toolbar { gap: 8px; }
    @media (max-width: 560px) { .cb-toolbar .btn { padding: 7px 10px; font-size: .88rem; min-height: 40px; } }
    .cb-toolbar .btn .ic { font-size: 1.05em; line-height: 1; }
    .help > summary, .inside-more > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 32px; }
    .help ol { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }

    /* layout: editor | chat (chat first on phones) */
    .cb-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); align-items: start; }
    .cb-chat-col { position: sticky; top: 66px; }
    @media (max-width: 900px) {
      .cb-layout { grid-template-columns: minmax(0, 1fr); }
      .cb-chat-col { position: static; order: -1; }
    }

    /* chat */
    .chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; height: calc(100vh - 150px); min-height: 470px; max-height: 860px; }
    @media (max-width: 900px) { .chat { height: 74vh; min-height: 460px; } }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--primary); color: var(--primary-ink); }
    .chat-av { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.55rem; flex: none; }
    .chat-name { font-weight: 800; font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
    .chat-status { font-size: .8rem; opacity: .9; display: flex; align-items: center; gap: 6px; }
    .dot-on { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
    .chat-head .edu-iconbtn { flex: none; }
    .chat-opts { padding: 6px 12px; border-bottom: 1px solid var(--border); gap: 4px 16px; font-size: .88rem; background: var(--surface); }
    .chat-opts .check { min-height: 34px; }
    .chat-log { flex: 1; overflow-y: auto; padding: 14px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
    .msg.user { justify-content: flex-end; }
    .msg-av { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; font-size: 1rem; }
    .msg-body { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; max-width: min(86%, 560px); min-width: 0; }
    .msg.user .msg-body { align-items: flex-end; }
    .bubble { padding: 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow); max-width: 100%; }
    .msg.bot .bubble { border-end-start-radius: 4px; }
    .msg.user .bubble { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); border-end-end-radius: 4px; }
    .msg.fallback .bubble { border-style: dashed; border-color: var(--warning); }
    .why { font: inherit; font-size: .78rem; font-weight: 700; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--text); border-radius: 999px; padding: 3px 11px; cursor: pointer; min-height: 30px; max-width: 100%; text-align: start; overflow-wrap: anywhere; }
    .why.miss { border-color: var(--warning); background: var(--warning-soft); }
    .why-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: .84rem; width: 100%; min-width: min(300px, 70vw); }
    .why-panel > div + div { margin-top: 6px; }
    .wchip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--primary-soft); border: 1px solid var(--border); margin: 2px; font-weight: 600; }
    .wchip.off { background: transparent; color: var(--muted); text-decoration: line-through; font-weight: 400; }
    .wchip.hit { background: var(--success-soft); border-color: var(--success); }
    .bars { display: grid; gap: 4px; margin-top: 4px; }
    .bar-row { display: grid; grid-template-columns: minmax(0, 8em) minmax(40px, 1fr) 3.2em; gap: 6px; align-items: center; }
    .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { position: relative; height: 12px; background: var(--surface-2); border-radius: 999px; }
    .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--c8); }
    .bar-row.win .bar > span { background: var(--success); }
    .bar-row.win .bar-name { font-weight: 700; }
    .bar .thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--danger); }
    .bar-pct { text-align: end; font-variant-numeric: tabular-nums; }
    .typing-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
    .dots { display: inline-flex; gap: 4px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: cb-bounce 1s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes cb-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
    .suggest { padding: 8px 12px 0; gap: 6px; flex-wrap: nowrap; overflow-x: auto; background: var(--surface); scrollbar-width: thin; }
    .suggest .chip { white-space: nowrap; flex: none; min-height: 34px; }
    .suggest-lbl { flex: none; }
    .chat-form { padding: 10px 12px; gap: 8px; background: var(--surface); }
    .chat-form input { flex: 1 1 auto; min-width: 0; min-height: 44px; }
    .chat-form .btn { min-height: 44px; }
    .missed { border-top: 1px solid var(--border); padding: 8px 12px; font-size: .88rem; background: var(--surface); }
    .missed > summary { cursor: pointer; font-weight: 700; min-height: 30px; display: flex; align-items: center; }
    .missed-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 28vh; overflow-y: auto; }
    .missed-item { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
    .missed-q { flex: 1 1 100%; font-weight: 600; overflow-wrap: anywhere; }
    .missed-item select { flex: 1 1 140px; min-height: 36px; padding: 4px 8px; }
    #chatCard:fullscreen { height: 100vh; max-height: none; border-radius: 0; font-size: clamp(1.05rem, 2vw, 1.5rem); }
    #chatCard:-webkit-full-screen { height: 100vh; max-height: none; border-radius: 0; }

    /* editor */
    .av-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .av-pick button { width: 42px; height: 42px; font-size: 1.35rem; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 0; }
    .av-pick button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 2px var(--primary) inset; }
    .av-custom { width: 100%; max-width: 15em; }
    .field > b { font-weight: 600; }
    .intent { border: 1px solid var(--border); border-inline-start: 6px solid var(--ic, var(--c1)); border-radius: var(--radius-sm); background: var(--surface); }
    .intent + .intent { margin-top: 10px; }
    .intent > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; min-height: 46px; }
    .intent > summary::-webkit-details-marker { display: none; }
    .intent > summary::before { content: '▸'; color: var(--muted); width: 1em; flex: none; }
    [dir="rtl"] .intent > summary::before { content: '◂'; }
    .intent[open] > summary::before { content: '▾'; }
    .in-title { font-weight: 700; overflow-wrap: anywhere; }
    .intent-body { padding: 0 12px 12px; }
    .intent-body textarea { min-height: 128px; }
    .warn-txt { color: var(--warning); font-size: .82rem; font-weight: 600; }
    .health-list { margin: 8px 0 0; padding: 0; list-style: none; }
    .health-list li + li { margin-top: 4px; }
    .health-big { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stop-area { min-height: 110px; font-size: .88rem; }
    :root[lang="ur"] textarea, :root[lang="ur"] input[type="text"] { line-height: 2.1; }
    :root[lang="ur"] #greeting, :root[lang="ur"] #fallback { min-height: 120px !important; }

    /* explanation */
    .steps { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); counter-reset: s; }
    .steps li { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; padding-top: 38px; position: relative; }
    .steps li::before { counter-increment: s; content: counter(s); position: absolute; top: 8px; inset-inline-start: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
    .tricks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .tricks .btn { justify-content: flex-start; text-align: start; flex-direction: column; align-items: flex-start; height: auto; padding: 10px 14px; }
    .tricks .btn q { font-weight: 400; color: var(--muted); }
    .vs th:first-child { width: 22%; }

    /* play mode (shared link) */
    .cb-play #toolbar, .cb-play #editCol, .cb-play #howTo, .cb-play #inside, .cb-play #missedBox { display: none !important; }
    .cb-play .cb-layout { grid-template-columns: minmax(0, 1fr); max-width: 820px; margin: 0 auto; }
    .cb-play .cb-chat-col { position: static; }
    .cb-play .chat { height: calc(100vh - 190px); font-size: 1.06rem; }
    #playBar { margin-bottom: 14px; }

    /* print: bot design sheet only */
    #printSheet h1 { font-size: 1.5rem; }
    #printSheet .table td, #printSheet .table th { font-size: .9rem; }
    #printSheet ul { margin: 0; padding-inline-start: 1.1em; }
    @media print {
      #app > :not(#printSheet) { display: none !important; }
      #printSheet { display: block !important; color: #000; }
      #printSheet .table th { background: #eee; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="playBar" class="callout accent row spread" hidden>
      <span><b data-i18n="play_text"></b></span>
      <span class="row">
        <button class="btn btn-sm" id="playEdit" type="button" data-i18n="play_edit"></button>
        <button class="btn btn-sm btn-primary" id="playMake" type="button" data-i18n="play_make"></button>
      </span>
    </div>

    <div class="cb-layout">
      <div class="stack" id="editCol">
        <details class="card help no-print" id="howTo">
          <summary data-i18n="how_title"></summary>
          <ol>
            <li data-i18n-html="how_1"></li>
            <li data-i18n-html="how_2"></li>
            <li data-i18n-html="how_3"></li>
            <li data-i18n-html="how_4"></li>
            <li data-i18n-html="how_5"></li>
            <li data-i18n-html="how_6"></li>
          </ol>
        </details>

        <div class="row cb-toolbar no-print" id="toolbar">
          <button class="btn" id="sampleBtn" type="button"><span class="ic" aria-hidden="true">📋</span><span data-i18n="tb_sample"></span></button>
          <button class="btn" id="newBtn" type="button"><span class="ic" aria-hidden="true">✨</span><span data-i18n="tb_new"></span></button>
          <button class="btn" id="exportBtn" type="button"><span class="ic" aria-hidden="true">⬇</span><span data-i18n="export"></span></button>
          <button class="btn" id="importBtn" type="button"><span class="ic" aria-hidden="true">⬆</span><span data-i18n="import"></span></button>
          <button class="btn" id="printBtn" type="button"><span class="ic" aria-hidden="true">🖨</span><span data-i18n="print"></span></button>
          <button class="btn btn-accent" id="shareBtn" type="button"><span class="ic" aria-hidden="true">🔗</span><span data-i18n="tb_share"></span></button>
          <span class="badge" data-i18n="saved_local"></span>
        </div>
        <section class="card stack" id="botCard">
          <h2 class="mb0" data-i18n="ed_title"></h2>
          <div class="grid-2">
            <label class="field"><b data-i18n="bot_name"></b>
              <input type="text" id="botName" maxlength="60" class="no-i18n" autocomplete="off">
            </label>
            <div class="field">
              <b id="avLbl" data-i18n="avatar"></b>
              <div class="av-pick" id="avPick" role="group" aria-labelledby="avLbl"></div>
              <input type="text" id="avCustom" class="av-custom" maxlength="16" autocomplete="off" data-i18n-placeholder="avatar_custom" data-i18n-aria-label="avatar_custom">
            </div>
          </div>
          <label class="field"><b data-i18n="greeting"></b>
            <textarea id="greeting" rows="2" maxlength="600" class="no-i18n" style="min-height:70px"></textarea>
          </label>
          <label class="field"><b data-i18n="fallback"></b>
            <span data-i18n="fallback_hint"></span>
            <textarea id="fallback" rows="3" class="no-i18n" style="min-height:80px"></textarea>
          </label>
        </section>

        <section class="card stack" id="intentsCard">
          <div class="row spread">
            <h2 class="mb0" data-i18n="intents_title"></h2>
            <span class="badge primary" id="intentCount"></span>
          </div>
          <p class="muted small mb0" data-i18n="intents_help"></p>
          <div id="intentList"></div>
          <div class="row">
            <button class="btn btn-primary" id="addIntent" type="button"><span aria-hidden="true">＋</span><span data-i18n="add_intent"></span></button>
          </div>
        </section>

        <section class="card stack" id="brainCard">
          <h2 class="mb0" data-i18n="brain_title"></h2>
          <label class="field"><b id="thrLabel"></b>
            <input type="range" id="threshold" min="10" max="100" step="5" value="50">
            <span data-i18n="threshold_hint"></span>
          </label>
          <div>
            <label class="check"><input type="checkbox" id="useStop"><span data-i18n="use_stop"></span></label>
            <p class="muted small mt0" style="margin:4px 0 0" data-i18n="stop_hint"></p>
            <details class="panel" style="margin-top:8px">
              <summary style="cursor:pointer;font-weight:600" data-i18n="stop_edit"></summary>
              <textarea id="stopList" class="stop-area no-i18n" style="margin-top:8px" data-i18n-aria-label="stop_edit"></textarea>
              <button class="btn btn-sm" id="stopRestore" type="button" style="margin-top:6px" data-i18n="stop_restore"></button>
            </details>
          </div>
          <label class="check"><input type="checkbox" id="useFuzzy"><span data-i18n="use_fuzzy"></span></label>
          <label class="field"><b data-i18n="bot_lang"></b>
            <select id="botLang" class="no-i18n"></select>
          </label>
        </section>

        <section class="card" id="healthCard" aria-live="polite">
          <div class="row spread">
            <h2 class="mb0" data-i18n="health_title"></h2>
            <span class="health-big" id="healthScore"></span>
          </div>
          <p class="muted small mb0" id="healthCounts"></p>
          <ul class="health-list" id="healthList"></ul>
        </section>
      </div>

      <div class="cb-chat-col">
        <section class="card chat" id="chatCard" data-i18n-aria-label="chat_label">
          <div class="chat-head">
            <span class="chat-av" id="chatAvatar" aria-hidden="true"></span>
            <div class="grow">
              <div class="chat-name no-i18n" id="chatName"></div>
              <div class="chat-status"><span class="dot-on" aria-hidden="true"></span><span data-i18n="online"></span></div>
            </div>
            <button class="edu-iconbtn" id="restartBtn" type="button" data-i18n-title="restart_chat" data-i18n-aria-label="restart_chat">↺</button>
            <button class="edu-iconbtn" id="fsBtn" type="button" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
          </div>
          <div class="chat-opts row">
            <label class="check"><input type="checkbox" id="thinkToggle"><span data-i18n="show_thinking"></span></label>
            <label class="check"><input type="checkbox" id="voiceToggle"><span data-i18n="voice_reply"></span></label>
          </div>
          <div class="chat-log no-i18n" id="chatLog" role="log" aria-live="polite"></div>
          <div class="typing-row" id="typingRow" hidden style="padding:0 12px 6px;background:var(--surface-2)">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="typingTxt"></span>
          </div>
          <div class="suggest row" id="suggest">
            <span class="tiny muted suggest-lbl" data-i18n="try_asking"></span>
            <span class="row no-i18n" id="suggestChips" style="flex-wrap:nowrap;gap:6px"></span>
          </div>
          <form class="chat-form row nowrap" id="chatForm" autocomplete="off">
            <label class="sr-only" for="chatInput" data-i18n="type_msg"></label>
            <input type="text" id="chatInput" maxlength="300" data-i18n-placeholder="type_msg" enterkeyhint="send">
            <button class="btn btn-primary" id="sendBtn" type="submit" data-i18n="send"></button>
          </form>
          <details class="missed" id="missedBox">
            <summary id="missedTitle"></summary>
            <p class="muted small" style="margin:6px 0 0" id="missedHint"></p>
            <ul class="missed-list" id="missedList"></ul>
          </details>
        </section>
      </div>
    </div>

    <section class="card stack" id="inside" style="margin-top:16px">
      <h2 class="mb0" data-i18n="inside_title"></h2>
      <p class="mb0" data-i18n="inside_intro"></p>
      <ol class="steps">
        <li data-i18n-html="step_1"></li>
        <li data-i18n-html="step_2"></li>
        <li data-i18n-html="step_3"></li>
        <li data-i18n-html="step_4"></li>
        <li data-i18n-html="step_5"></li>
      </ol>
      <h3 data-i18n="trick_title" style="margin-top:8px"></h3>
      <p class="muted small mt0" data-i18n="trick_hint"></p>
      <div class="tricks" id="tricks"></div>
      <h3 data-i18n="vs_title" style="margin-top:8px"></h3>
      <div class="scroll-x">
        <table class="table vs">
          <thead><tr><th></th><th data-i18n="vs_col_rule"></th><th data-i18n="vs_col_ai"></th></tr></thead>
          <tbody>
            <tr><th data-i18n="vs_how"></th><td data-i18n="vs_how_rule"></td><td data-i18n="vs_how_ai"></td></tr>
            <tr><th data-i18n="vs_new"></th><td data-i18n="vs_new_rule"></td><td data-i18n="vs_new_ai"></td></tr>
            <tr><th data-i18n="vs_wrong"></th><td data-i18n="vs_wrong_rule"></td><td data-i18n="vs_wrong_ai"></td></tr>
            <tr><th data-i18n="vs_why"></th><td data-i18n="vs_why_rule"></td><td data-i18n="vs_why_ai"></td></tr>
            <tr><th data-i18n="vs_needs"></th><td data-i18n="vs_needs_rule"></td><td data-i18n="vs_needs_ai"></td></tr>
          </tbody>
        </table>
      </div>
      <div class="grid-2">
        <div class="callout warning">
          <h3 data-i18n="limits_title"></h3>
          <ul class="mb0" style="padding-inline-start:1.2em;margin-top:0">
            <li data-i18n="limit_1"></li><li data-i18n="limit_2"></li><li data-i18n="limit_3"></li><li data-i18n="limit_4"></li>
          </ul>
        </div>
        <div class="callout success">
          <h3 data-i18n="improve_title"></h3>
          <ul class="mb0" style="padding-inline-start:1.2em;margin-top:0">
            <li data-i18n="improve_1"></li><li data-i18n="improve_2"></li><li data-i18n="improve_3"></li><li data-i18n="improve_4"></li><li data-i18n="improve_5"></li>
          </ul>
        </div>
      </div>
    </section>

    <section id="printSheet" class="print-only"></section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
