<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probability Lab · AI Pathshala</title>
  <meta name="description" content="Toss coins, roll dice, spin a spinner, draw balls and cards thousands of times and compare experimental and theoretical probability. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    :root { --pl-red: #c92a2a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pl-red: #ff8787; } }
    :root[data-theme="dark"] { --pl-red: #ff8787; }
    .red-ink { color: var(--pl-red); }

    /* ---------- layout: phone = picture first; laptop = set-up | lab ---------- */
    .pl-tabs { margin-bottom: 14px; }
    .pl-tabs button { min-height: 44px; font-size: 1rem; display: inline-flex; align-items: center; gap: 6px; }
    .pl-tabs .ic { font-size: 1.15rem; }
    .pl-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .pl-col { display: contents; }
    .pl-run { order: 1; } .pl-setup { order: 2; } .pl-event { order: 3; } .pl-pe { order: 4; } .pl-bars { order: 5; } .pl-lines { order: 6; }
    @media (min-width: 980px) {
      .pl-grid { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); }
      .pl-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .pl-col > .card { order: 0; }
    }
    .pl-grid .card h2, .pl-below h2 { font-size: 1.12rem; margin: 0 0 10px; }
    .pl-below { margin-top: 14px; }
    .pl-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .pl-head h2 { margin: 0 !important; }

    /* ---------- stage + run ---------- */
    .pl-stage { background: var(--surface-2); }
    .pl-stage canvas { touch-action: auto; }
    .pl-last { margin: 10px 0 6px; font-weight: 700; font-size: 1.05rem; min-height: 1.6em; }
    .pl-recent { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; margin-bottom: 10px; }
    .pl-rc { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; background: var(--surface-2);
      border: 1px solid var(--border); font-weight: 600; font-size: .85rem; font-variant-numeric: tabular-nums; }
    .pl-rc.in { border-color: var(--accent); background: var(--accent-soft); }
    .pl-runrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .pl-runrow .btn { min-width: 0; padding-inline: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
    .pl-runlbl { font-weight: 700; grid-column: 1 / -1; }
    .pl-cap { margin: 10px 0 0; }
    .pl-opts { margin-top: 10px; gap: 8px 14px; }
    .pl-trials { font-size: .95rem; padding: 4px 12px; }
    .pl-run:fullscreen, .pl-run:-webkit-full-screen { overflow: auto; background: var(--bg); padding: 20px; border-radius: 0; }
    .pl-run:fullscreen .pl-last { font-size: 1.6rem; }
    .pl-run:fullscreen .pl-runrow .btn { font-size: 1.25rem; min-height: 56px; min-width: 90px; }

    /* ---------- set-up ---------- */
    .pl-note { margin: 8px 0 0; }
    .pl-sec-list { display: flex; flex-direction: column; gap: 8px; }
    .pl-sec { display: grid; grid-template-columns: auto minmax(0, 1fr) 76px auto; gap: 6px; align-items: center; }
    .pl-sec input[type="color"] { width: 44px; height: 40px; }
    .pl-sec input[type="number"] { width: 100%; }
    .pl-sec-head { display: grid; grid-template-columns: 44px minmax(0, 1fr) 76px 40px; gap: 6px; font-size: .8rem; color: var(--muted); font-weight: 700; }
    .pl-iconbtn { min-width: 40px; padding-inline: 8px; }
    .pl-balls { display: flex; flex-direction: column; gap: 8px; }
    .pl-ball-row { display: flex; align-items: center; gap: 8px; }
    .pl-ball-row .nm { flex: 1 1 auto; min-width: 0; font-weight: 600; }
    .pl-ball-row .ct { min-width: 2.4ch; text-align: center; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .pl-ball-row .btn { min-width: 44px; font-size: 1.2rem; }
    .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--dot, var(--c1)); flex: none;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); vertical-align: middle; }
    .dot.big { width: 22px; height: 22px; }
    .pl-sub { font-weight: 700; margin: 12px 0 6px; font-size: .92rem; }
    .pl-warn { margin-top: 8px; }

    /* ---------- event builder ---------- */
    .pl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pl-chips .chip { min-height: 40px; min-width: 44px; justify-content: center; font-variant-numeric: tabular-nums; }
    .pl-chips .chip .sym { font-size: 1.1rem; }
    .chip.red-suit .sym { color: var(--pl-red); }
    .chip[aria-pressed="true"].red-suit .sym { color: inherit; }
    .pl-presets { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pl-presets .lbl { font-size: .88rem; color: var(--muted); font-weight: 700; width: 100%; }
    .pl-presets .btn { min-height: 40px; }
    .pl-rowhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 6px; flex-wrap: wrap; }
    .pl-rowhead .pl-sub { margin: 0; }

    /* ---------- P(E) ---------- */
    .pl-edesc { margin-bottom: 10px; overflow-wrap: anywhere; }
    .pl-epreset { font-weight: 800; font-size: 1.12rem; margin-bottom: 6px; }
    .pl-eset { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; }
    .pl-eq { font-weight: 800; direction: ltr; unicode-bidi: isolate; font-family: "Noto Sans", system-ui, sans-serif; }
    /* Urdu: "E =" must have its "=" facing the outcomes that follow on the left */
    :root[dir="rtl"] .pl-eset > .pl-eq:first-child { direction: rtl; }
    .pl-ltr { direction: ltr; unicode-bidi: isolate; }
    :root[dir="rtl"] .pl-ltr { text-align: right; }
    .pl-pgrid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 620px), (min-width: 980px) { .pl-pgrid { grid-template-columns: minmax(0, 1fr); } }
    .pl-pbox { border-radius: var(--radius-sm); padding: 12px; background: var(--surface-2); border-inline-start: 5px solid var(--c2); min-width: 0; }
    .pl-pbox.exp { border-inline-start-color: var(--c1); }
    .pl-pbox .lbl { font-weight: 700; font-size: .9rem; color: var(--muted); }
    .pl-math { direction: ltr; unicode-bidi: isolate; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      font-size: clamp(1.05rem, 2.4vw, 1.32rem); font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    :root[dir="rtl"] .pl-math { justify-content: flex-end; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; vertical-align: middle; }
    .frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em 1px; }
    .frac > span:last-child { padding: 1px .2em 0; }
    .pl-pe .small { margin: 0; }
    .pl-extra { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }

    /* ---------- charts ---------- */
    .pl-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--muted); margin-bottom: 8px; }
    .pl-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; background: var(--sw); }
    .sw.dash { height: 0; border-top: 3px dashed var(--sw); background: none; }
    .sw.band { background: var(--accent-soft); border: 1px solid var(--accent); }
    .pl-chart { background: var(--surface); }
    .pl-chart canvas { touch-action: auto; }

    /* ---------- table ---------- */
    .pl-table td { white-space: nowrap; }
    .pl-table th { min-width: 6.5em; }
    .pl-table th:first-child { min-width: 0; }
    .pl-table td.num, .pl-table th.num { text-align: end; font-variant-numeric: tabular-nums; }
    .pl-table td.num { direction: ltr; text-align: right; }
    :root[dir="rtl"] .pl-table th.num { text-align: right; }   /* line up with the right-aligned LTR numbers */
    .pl-table tr.in td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
    :root[dir="rtl"] .pl-table tr.in td:first-child { box-shadow: inset -4px 0 0 var(--accent); }
    .pl-table tr.tot td { font-weight: 800; background: var(--surface-2); }
    .pl-table tr.ev td { font-weight: 700; background: var(--accent-soft); }
    .pl-oc { display: inline-flex; align-items: center; gap: 6px; }
    .pl-table .math { direction: ltr; unicode-bidi: isolate; }

    /* ---------- learn ---------- */
    .pl-learn dl { margin: 0; display: grid; gap: 10px; }
    .pl-learn dt { font-weight: 800; color: var(--primary); }
    .pl-learn dd { margin: 2px 0 0; }
    .pl-formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); font-weight: 700; direction: ltr; }
    :root[dir="rtl"] .pl-formula { justify-content: flex-end; }
    .pl-formula > span:first-child { font-family: "Noto Sans", system-ui, sans-serif; white-space: nowrap; }
    .pl-formula .frac { font-size: .95rem; text-align: center; line-height: 1.5; }
    .pl-formula .frac > span { unicode-bidi: isolate; }
    /* Urdu: the formula row is LTR maths, but the words in the fraction read right-to-left
       ("plaintext" picked LTR when a line started with the Latin letter E) */
    :root[dir="rtl"] .pl-formula .frac > span { direction: rtl; }
    :root[lang="ur"] .pl-formula .frac { line-height: 2.1; }
    .pl-formula .frac > span { max-width: 32ch; }
    .pl-learn ul { margin: 6px 0 0; padding-inline-start: 1.3em; }
    .pl-learn li + li { margin-top: 4px; }
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    details.card li + li { margin-top: 6px; }

    @media (max-width: 420px) {
      .pl-tabs button { padding: 8px 10px; font-size: .92rem; }
      .pl-runrow .btn { font-size: .88rem; }
    }

    /* ---------- print: results sheet ---------- */
    @media print {
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) { --c1: #0b7285; --c2: #e8590c; --accent: #d9501c; --pl-red: #c92a2a; }
      .pl-grid { display: block; }
      .pl-col { display: block; }
      .pl-setup, .pl-event, .pl-tabs, .pl-runrow, .pl-opts, .pl-recent, details.card, .pl-run { display: none !important; }
      .pl-grid .card, .pl-below { margin-top: 10px; }
      .pl-chart canvas { max-width: 100%; }
      .pl-print-head { display: block !important; font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
      .pl-table th { position: static; }
      /* legend swatches and colour dots are backgrounds: browsers drop them in print unless asked */
      .sw, .dot, .pl-pbox, .pl-table tr.tot td, .pl-table tr.ev td, .pl-rc { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="print-only pl-print-head" id="print-head"></div>

    <div class="tabs pl-tabs" role="tablist" id="tabs" data-i18n-aria-label="exp_label"></div>

    <div class="pl-grid">
      <div class="pl-col">
        <section class="card pl-setup" aria-labelledby="setup-h">
          <h2 id="setup-h" data-i18n="setup_h"></h2>
          <div id="setup"></div>
        </section>
        <section class="card pl-event" aria-labelledby="event-h">
          <h2 id="event-h" data-i18n="event_h"></h2>
          <p class="muted small" data-i18n="event_hint"></p>
          <div id="event-builder"></div>
          <div id="presets" class="pl-presets"></div>
        </section>
        <section class="card pl-pe" id="pe"></section>
      </div>

      <div class="pl-col">
        <section class="card pl-run" id="run-card">
          <div class="stage pl-stage"><canvas id="stage" role="img" data-i18n-aria-label="stage_aria"></canvas></div>
          <p class="pl-last" id="last" aria-live="polite"></p>
          <div class="pl-recent" id="recent" aria-hidden="true"></div>
          <div class="row pl-runrow" id="run-row">
            <span class="pl-runlbl" data-i18n="run_label"></span>
          </div>
          <p class="callout warning small pl-cap" id="cap-note" role="status" hidden></p>
          <div class="row spread pl-opts">
            <label class="check"><input type="checkbox" id="anim"> <span data-i18n="animate"></span></label>
            <span class="badge primary pl-trials" id="trials" aria-live="polite"></span>
          </div>
          <div class="row pl-opts">
            <button class="btn btn-danger btn-sm" id="reset" type="button" data-i18n="reset_results"></button>
            <button class="btn btn-sm" id="fs" type="button" data-i18n="fullscreen"></button>
          </div>
        </section>

        <section class="card pl-bars" aria-labelledby="bar-h">
          <h2 id="bar-h" data-i18n="bar_h"></h2>
          <div class="pl-legend" id="bar-legend">
            <span><i class="sw" style="--sw: var(--c1)"></i><span data-i18n="leg_exp"></span></span>
            <span><i class="sw" style="--sw: var(--c2)"></i><span data-i18n="leg_theory"></span></span>
            <span><i class="sw band"></i><span data-i18n="leg_event"></span></span>
          </div>
          <div class="stage pl-chart"><canvas id="bar" role="img" data-i18n-aria-label="bar_aria"></canvas></div>
        </section>

        <section class="card pl-lines" aria-labelledby="line-h">
          <h2 id="line-h" data-i18n="line_h"></h2>
          <p class="muted small" data-i18n="line_note"></p>
          <div class="pl-legend">
            <span><i class="sw" style="--sw: var(--c1)"></i><span data-i18n="axis_relfreq"></span></span>
            <span><i class="sw dash" style="--sw: var(--c2)"></i><span data-i18n="leg_theory"></span></span>
          </div>
          <div class="stage pl-chart"><canvas id="line" role="img" data-i18n-aria-label="line_aria"></canvas></div>
        </section>
      </div>
    </div>

    <section class="card pl-below" aria-labelledby="table-h">
      <div class="pl-head">
        <h2 id="table-h" data-i18n="table_h"></h2>
        <div class="row no-print">
          <button class="btn btn-sm" id="csv" type="button" data-i18n="dl_csv"></button>
          <button class="btn btn-sm" id="print" type="button" data-i18n="print"></button>
        </div>
      </div>
      <div class="scroll-x"><table class="table pl-table" id="results"></table></div>
    </section>

    <section class="card pl-below pl-learn" aria-labelledby="learn-h">
      <h2 id="learn-h" data-i18n="learn_h"></h2>
      <dl>
        <div><dt data-i18n="term_experiment"></dt><dd data-i18n="def_experiment"></dd></div>
        <div><dt data-i18n="term_outcome"></dt><dd data-i18n="def_outcome"></dd></div>
        <div><dt data-i18n="term_space"></dt><dd data-i18n="def_space"></dd></div>
        <div><dt data-i18n="term_event"></dt><dd data-i18n="def_event"></dd></div>
        <div>
          <dt data-i18n="term_exp_p"></dt>
          <dd>
            <div class="pl-formula"><span>P(E) =</span><span class="frac"><span data-i18n="exp_formula_num"></span><span data-i18n="exp_formula_den"></span></span></div>
            <span data-i18n="exp_example"></span>
          </dd>
        </div>
        <div>
          <dt data-i18n="term_th_p"></dt>
          <dd>
            <div class="pl-formula"><span>P(E) =</span><span class="frac"><span data-i18n="th_formula_num"></span><span data-i18n="th_formula_den"></span></span></div>
            <span data-i18n="th_condition"></span> <span data-i18n="th_example"></span>
          </dd>
        </div>
        <div>
          <dt data-i18n="term_rules"></dt>
          <dd><ul>
            <li data-i18n="rule_range"></li>
            <li data-i18n="rule_compl"></li>
            <li data-i18n="rule_sum"></li>
            <li data-i18n="rule_lln"></li>
            <li data-i18n="cards_fact"></li>
          </ul></dd>
        </div>
      </dl>
    </section>

    <details class="card pl-below no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
