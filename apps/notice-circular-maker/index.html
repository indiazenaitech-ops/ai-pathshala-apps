<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notice &amp; Circular Maker · AI Pathshala</title>
  <meta name="description" content="Free notice and circular maker for schools, coaching classes, housing societies and offices in India. Ready formats in 12 Indian languages, live A4 preview, print or save as PDF, download as a picture for WhatsApp. Works offline, no sign-up.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>@page { size: A4 portrait; margin: 15mm; }</style>
  <style>
    [hidden] { display: none !important; }
    .privacy { margin: -6px 0 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    @media (min-width: 1040px) { .layout { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); align-items: start; } }
    .h-sec { font-size: 1.05rem; margin: 0; }
    .hint { color: var(--muted); font-size: .86rem; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips .chip { min-height: 40px; text-align: start; }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .seg button { min-height: 42px; }
    .field input, .field select, .field textarea { width: 100%; }
    #f-body { min-height: 150px; }
    #f-points, #f-copy { min-height: 84px; }
    .logo-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #logo-thumb { height: 44px; max-width: 120px; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 2px; }
    .actions .btn { min-height: 44px; }
    .look { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-end; }
    #howto summary { cursor: pointer; font-weight: 700; }
    #howto ul { margin: 8px 0 0; padding-inline-start: 20px; }
    #howto li { margin: 4px 0; }
    #howto { margin-top: 16px; }

    /* ---------- the A4 page ---------- */
    #print-area { margin-top: 14px; }
    .a4 { background: #fff; color: #111; border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0, 0, 0, .1); max-width: 794px; margin: 0 auto;
      container-type: inline-size; font-family: inherit; }
    .n-in { --k: 1; box-sizing: border-box; padding: 8cqw 9cqw; min-height: 141.4cqw; font-size: 13px; font-size: max(11px, calc(1.95cqw * var(--k)));
      line-height: 1.6; display: flex; flex-direction: column; overflow-wrap: anywhere; }
    .a4.sz-s .n-in { --k: .88; }
    .a4.sz-l .n-in { --k: 1.14; }
    .a4.bordered .n-in { border: .35cqw solid #111; margin: 3.4cqw; min-height: 134.6cqw; padding: 5cqw 6cqw; }
    .a4[lang="ur"] .n-in { line-height: 2.15; }
    .n-head { text-align: center; }
    .n-logo { max-height: 4.6em; max-width: 42%; display: block; margin: 0 auto .4em; }
    .n-org { font-size: 1.65em; font-weight: 800; line-height: 1.35; }
    .a4[lang="ur"] .n-org { line-height: 1.9; }
    .n-addr { font-size: .9em; color: #333; }
    .n-rule { border: 0; border-top: .14em solid #111; margin: .7em 0 .9em; width: 100%; }
    .n-meta { display: flex; justify-content: space-between; gap: .3em 1.5em; flex-wrap: wrap; font-size: .92em; }
    .n-heading { text-align: center; font-size: 1.45em; font-weight: 800; margin: 1em 0 .8em; text-decoration: underline; text-underline-offset: .24em; letter-spacing: .02em; }
    .a4[lang="ur"] .n-heading { text-decoration: none; letter-spacing: 0; }
    .n-subject { font-weight: 700; margin-bottom: .8em; }
    .n-body p { margin: 0 0 .7em; white-space: pre-wrap; }
    .n-points { margin: .1em 0 .8em; padding-inline-start: 1.6em; }
    .n-points li { margin: .25em 0; }
    .n-sign { margin-top: 3.4em; text-align: end; break-inside: avoid; }
    .n-sign-name { font-weight: 700; }
    .n-copy { margin-top: 2em; font-size: .9em; break-inside: avoid; }
    .n-copy ol { margin: .2em 0 0; padding-inline-start: 1.7em; }

    @media print {
      .layout { display: block; }
      #print-area { margin: 0; }
      .a4 { border: 0; box-shadow: none; max-width: none; margin: 0; }
      .n-in { font-size: calc(12.5pt * var(--k)); padding: 0; min-height: 0; }
      .a4.bordered .n-in { border: 1.5pt solid #000; margin: 0; padding: 9mm 11mm; min-height: 258mm; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro no-print" data-i18n="intro"></p>
    <p class="privacy muted small no-print">🔒 <span data-i18n="privacy"></span></p>

    <div class="layout">
      <div class="stack no-print" id="form">
        <section class="card stack" id="sec-formats">
          <h2 class="h-sec" data-i18n="sec_formats"></h2>
          <p class="hint" data-i18n="formats_hint"></p>
          <div class="chips" id="tpl-chips"></div>
          <label class="field"><span data-i18n="lbl_nlang"></span>
            <select id="f-nlang" class="no-i18n"></select>
            <span class="hint" data-i18n="nlang_hint"></span>
          </label>
        </section>

        <section class="card stack">
          <h2 class="h-sec" data-i18n="sec_org"></h2>
          <label class="field"><span data-i18n="lbl_org"></span><input type="text" id="f-org" maxlength="160" dir="auto" autocomplete="off"></label>
          <label class="field"><span data-i18n="lbl_addr"></span><input type="text" id="f-addr" maxlength="240" dir="auto" autocomplete="off"></label>
          <div class="logo-row">
            <img id="logo-thumb" alt="" hidden>
            <button type="button" class="btn btn-sm" id="btn-logo">🖼️ <span data-i18n="btn_logo"></span></button>
            <button type="button" class="btn btn-sm btn-ghost" id="btn-logo-remove" data-i18n="btn_logo_remove" hidden></button>
            <span class="hint" data-i18n="logo_hint"></span>
          </div>
        </section>

        <section class="card stack">
          <h2 class="h-sec" data-i18n="sec_details"></h2>
          <div class="two">
            <label class="field"><span data-i18n="lbl_ref"></span><input type="text" id="f-ref" maxlength="80" dir="auto" autocomplete="off"></label>
            <label class="field"><span data-i18n="lbl_date"></span><input type="date" id="f-date"></label>
          </div>
          <div class="field"><span data-i18n="lbl_heading"></span>
            <div class="seg" id="f-kind" role="group">
              <button type="button" data-kind="notice" data-i18n="head_notice"></button>
              <button type="button" data-kind="circular" data-i18n="head_circular"></button>
              <button type="button" data-kind="custom" data-i18n="head_custom"></button>
            </div>
          </div>
          <label class="field" id="wrap-custom"><span data-i18n="lbl_custom"></span><input type="text" id="f-custom" maxlength="80" dir="auto" autocomplete="off"></label>
          <label class="field"><span data-i18n="lbl_subject"></span><input type="text" id="f-subject" maxlength="240" dir="auto" autocomplete="off"></label>
          <label class="field"><span data-i18n="lbl_body"></span><textarea id="f-body" dir="auto"></textarea></label>
          <label class="field"><span data-i18n="lbl_points"></span><textarea id="f-points" dir="auto"></textarea></label>
        </section>

        <section class="card stack">
          <h2 class="h-sec" data-i18n="sec_sign"></h2>
          <div class="two">
            <label class="field"><span data-i18n="lbl_sign"></span><input type="text" id="f-sign" maxlength="120" dir="auto" autocomplete="off"></label>
            <label class="field"><span data-i18n="lbl_desig"></span><input type="text" id="f-desig" maxlength="120" dir="auto" autocomplete="off"></label>
          </div>
          <label class="field"><span data-i18n="lbl_copy"></span><textarea id="f-copy" dir="auto"></textarea></label>
        </section>
      </div>

      <div id="side">
        <section class="card stack no-print" id="sec-preview">
          <h2 class="h-sec" data-i18n="sec_preview"></h2>
          <p class="callout small" id="sample-note" data-i18n="sample_note"></p>
          <div class="look">
            <div class="field"><span data-i18n="lbl_size"></span>
              <div class="seg" id="f-size" role="group">
                <button type="button" data-size="s" data-i18n="size_s"></button>
                <button type="button" data-size="m" data-i18n="size_m"></button>
                <button type="button" data-size="l" data-i18n="size_l"></button>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="opt-border"><span data-i18n="opt_border"></span></label>
          </div>
          <div class="row actions">
            <button type="button" class="btn btn-primary" id="btn-pdf">🖨️ <span data-i18n="btn_pdf"></span></button>
            <button type="button" class="btn btn-accent" id="btn-png">🖼️ <span data-i18n="btn_png"></span></button>
            <button type="button" class="btn" id="btn-copy">📋 <span data-i18n="btn_copy"></span></button>
            <button type="button" class="btn btn-ghost" id="btn-reset" data-i18n="reset"></button>
          </div>
          <p class="hint" data-i18n="pdf_hint"></p>
        </section>
        <div id="print-area"><div class="a4 no-i18n" id="notice"></div></div>
      </div>
    </div>

    <details class="card no-print" id="howto">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
