<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Tutor · AI Pathshala</title>
  <meta name="description" content="Free touch-typing tutor for Indian schools: 18 step-by-step English lessons with a colour-coded keyboard and hands, live WPM and accuracy, stars, free practice and typing practice in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .tt-num, .tt-stat b, .tt-res-grid b, .tt-stars, .tt-lesson .num, .key { font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
    .tt-tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
    .tt-tabs .ico { font-size: 1.1rem; line-height: 1; }
    @media (max-width: 560px) {
      .tt-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 6px; }
      .tt-tabs button { justify-content: center; text-align: center; white-space: normal; line-height: 1.25; padding: 8px 6px; }
      .tt-head #fs { display: none; }
    }
    .tt-panel h2 { font-size: 1.2rem; }
    .tt-sub { margin: 0 0 12px; }

    /* ---------- lesson list ---------- */
    .tt-top-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
    .tt-stage { margin-top: 18px; }
    .tt-stage h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 1rem; color: var(--muted); margin-bottom: 8px; }
    .tt-stage h3 .badge { font-size: .74rem; }
    .tt-lessons { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
    .tt-lesson { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 64px; padding: 9px 12px; text-align: start;
      border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
      transition: background .12s, border-color .12s; }
    .tt-lesson:hover { background: var(--surface-2); }
    .tt-lesson.is-next { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .tt-lesson .num { flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center;
      background: var(--primary-soft); color: var(--primary); font-weight: 800; }
    .tt-lesson.done .num { background: var(--success-soft); color: var(--success); }
    .tt-lesson .txt { flex: 1 1 auto; min-width: 0; }
    .tt-lesson b { display: block; line-height: 1.3; font-size: .97rem; overflow-wrap: break-word; }
    .tt-lesson small { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; color: var(--muted); font-size: .8rem; margin-top: 3px; }
    .tt-lesson kbd { font-size: .78rem; padding: 0 5px; }
    .tt-keys { display: inline-flex; flex-wrap: wrap; gap: 3px; direction: ltr; }
    .tt-stars { flex: none; white-space: nowrap; font-size: 1.15rem; letter-spacing: 1px; line-height: 1; }
    .tt-stars .on { color: #e0a100; }
    .tt-stars .off { color: var(--border); }
    :root[data-theme="dark"] .tt-stars .off { color: #3a525c; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tt-stars .off { color: #3a525c; } }
    .tt-upnext { font-size: .7rem; }

    /* ---------- trainer ---------- */
    .tt-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; }
    .tt-head h2 { margin: 0; font-size: 1.2rem; }
    .tt-head .tt-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .tt-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .tt-stat { background: var(--surface-2); border-radius: 10px; padding: 7px 8px; text-align: center; min-width: 0; }
    .tt-stat b { display: block; font-size: clamp(1.35rem, 3.6vw, 2.3rem); font-weight: 800; line-height: 1.15; }
    .tt-stat span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
    .tt-stat b.bad { color: var(--danger); }
    .tt-bar { margin-top: 8px; }
    .tt-target { position: relative; margin-top: 12px; padding: 12px 16px; background: var(--surface-2); border: 2px solid var(--border);
      border-radius: 12px; font-family: var(--mono); font-size: clamp(1.25rem, 2.5vw, 2.05rem); line-height: 1.75;
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 44vh; overflow-y: auto; cursor: text; color: var(--text); }
    .tt-target.lang { font-family: var(--tt-font, inherit); line-height: 2; }
    .tt-target[dir="rtl"] { line-height: 2.3; }
    .tt-target.focus { border-color: var(--primary); }
    .tt-target .ch { border-radius: 3px; }
    .tt-target .ch.ok { color: var(--success); }
    .tt-target .ch.bad { color: var(--danger); background: var(--danger-soft); text-decoration: underline wavy var(--danger); text-decoration-skip-ink: none; }
    .tt-target .ch.bad.sp { background: color-mix(in srgb, var(--danger) 55%, transparent); }
    .tt-target .ch.pend { color: var(--info); background: var(--info-soft); }
    .tt-target .ch.cur { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
    .tt-target.done .ch.cur { background: none; box-shadow: none; }
    .tt-typelabel { display: block; margin-top: 12px; margin-bottom: 4px; }
    #typein { width: 100%; min-height: 62px; font-size: 1.2rem; font-family: var(--mono); resize: none; }
    #typein.lang { font-family: var(--tt-font, inherit); }
    /* the hint text is UI language, not the monospace drill font (Urdu letters would not join) */
    #typein::placeholder { font-family: var(--font); font-size: 1rem; }
    #typein:disabled { opacity: .6; }
    .tt-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 2.6em; margin-top: 8px; font-weight: 600; }
    .tt-hint kbd { font-size: 1.05rem; padding: 2px 9px; min-width: 2em; text-align: center; font-family: "Noto Sans", system-ui, sans-serif; }
    .tt-hint .fing { display: inline-flex; align-items: center; gap: 6px; }
    .tt-hint .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--fc); flex: none; }
    .tt-hint .warn { color: var(--danger); }
    .tt-hint .muted { font-weight: 400; }

    /* ---------- keyboard ---------- */
    .tt-kbarea { margin-top: 10px; }
    .tt-kbd { direction: ltr; display: flex; flex-direction: column; gap: clamp(3px, .55vw, 6px); max-width: 940px; margin: 8px auto 0;
      padding: clamp(5px, 1vw, 10px); background: var(--surface-2); border-radius: 12px; user-select: none; }
    .kb-row { display: flex; gap: clamp(3px, .55vw, 6px); }
    .key { flex: var(--w, 1) 1 0; min-width: 0; height: clamp(30px, 7vw, 54px); border-radius: 7px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; white-space: nowrap;
      border: 1px solid color-mix(in srgb, var(--fc) 55%, var(--border)); color: var(--text);
      background: color-mix(in srgb, var(--fc) 20%, var(--surface)); box-shadow: 0 2px 0 color-mix(in srgb, var(--fc) 45%, var(--border));
      font-weight: 700; font-size: clamp(.66rem, 1.9vw, 1.08rem); line-height: 1.05; transition: background .1s, transform .1s; }
    .key .sh { font-size: .72em; opacity: .7; font-weight: 600; }
    .key.wordy { flex-direction: row; gap: 4px; font-size: clamp(.5rem, 1.25vw, .82rem); font-weight: 600; }
    .key .sym { font-size: 1.25em; line-height: 1; }
    @media (max-width: 640px) { .key .kw { display: none; } .key .sym { font-size: 1.6em; } }
    .key.gap { visibility: hidden; }
    .key.home::after { content: ""; position: absolute; bottom: 10%; width: 28%; height: 2px; border-radius: 2px; background: currentColor; opacity: .8; }
    .key.next { background: var(--fc); border-color: var(--fc); color: var(--bg); transform: translateY(1px); box-shadow: 0 0 0 3px var(--accent); animation: tt-pulse 1.1s ease-in-out infinite; z-index: 1; }
    @keyframes tt-pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent); } }
    .key.hit-ok { outline: 3px solid var(--success); outline-offset: 1px; }
    .key.hit-bad { outline: 3px solid var(--danger); outline-offset: 1px; background: var(--danger-soft); }
    .tt-handrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 20px; align-items: center; max-width: 940px; margin: 12px auto 0; }
    @media (max-width: 700px) { .tt-handrow { grid-template-columns: minmax(0, 1fr); } }
    .tt-hands { direction: ltr; }
    .tt-hands svg { display: block; width: 100%; max-width: 440px; height: auto; margin-inline: auto; }
    .tt-hands .hand-lbls { display: flex; justify-content: space-around; max-width: 440px; margin: 2px auto 0; font-size: .82rem; color: var(--muted); font-weight: 600; }
    .tt-hands .palm { fill: var(--surface-3); stroke: color-mix(in srgb, var(--muted) 45%, var(--border)); stroke-width: 2; }
    .tt-hands .finger { fill: color-mix(in srgb, var(--fc) 32%, var(--surface)); stroke: var(--fc); stroke-width: 2.5; transition: opacity .15s, fill .15s; }
    .tt-hands.active .finger { opacity: .35; }
    .tt-hands .finger.on { opacity: 1; fill: var(--fc); stroke: var(--text); stroke-width: 3; }
    .tt-hands text { fill: var(--text); font: 700 15px "Noto Sans", system-ui, sans-serif; text-anchor: middle; }
    .tt-legend h3 { font-size: .95rem; margin-bottom: 6px; }
    /* two columns when there is room, one on phones (long finger names in Malayalam / Tamil never spill out) */
    .tt-legend ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11.5rem), 1fr)); gap: 6px 12px; }
    .tt-legend li { display: flex; align-items: center; gap: 8px; font-size: .9rem; line-height: 1.3; min-width: 0; }
    .tt-legend li > span + span { min-width: 0; overflow-wrap: anywhere; }
    .sw { flex: none; width: 16px; height: 16px; border-radius: 5px; background: var(--fc); border: 1px solid color-mix(in srgb, var(--fc) 60%, #000); }
    .tt-legend p { margin: 8px 0 0; }

    /* ---------- result ---------- */
    .tt-result { margin-top: 12px; padding: 16px; border-radius: 12px; background: var(--primary-soft); border: 2px solid var(--primary); text-align: center; }
    .tt-result h3 { font-size: 1.25rem; margin-bottom: 4px; }
    .tt-result .tt-stars { font-size: clamp(2.4rem, 8vw, 3.8rem); letter-spacing: 4px; display: block; margin: 4px 0 8px; }
    .tt-res-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 720px; margin: 8px auto; }
    .tt-res-grid > div { background: var(--surface); border-radius: 10px; padding: 8px 6px; min-width: 0; }
    .tt-res-grid b { display: block; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 800; line-height: 1.2; }
    .tt-res-grid span { display: block; font-size: .8rem; color: var(--muted); }
    .tt-result .row { justify-content: center; margin-top: 10px; }
    .tt-newbest { display: inline-block; margin: 4px 0; }
    [dir="rtl"] .tt-fwd { display: inline-block; transform: scaleX(-1); }
    @media (max-width: 560px) {
      .tt-res-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /* phones: one compact row of stats and a shorter text box, so the text and the input
         both stay visible above the on-screen keyboard */
      .tt-stats { gap: 5px; margin-top: 10px; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); }
      .tt-stat { padding: 5px 3px; border-radius: 8px; }
      .tt-stat b { font-size: 1.3rem; }
      .tt-stat span { font-size: .68rem; line-height: 1.2; }
      .tt-target { padding: 8px 12px; max-height: 32vh; }
      #typein { min-height: 54px; }
    }

    /* ---------- free practice / language ---------- */
    #free-text { min-height: 130px; }
    .tt-opts { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-top: 12px; }
    .tt-opts .lbl { font-weight: 700; font-size: .92rem; margin-inline-end: 8px; }
    .tt-opts .seg button { min-height: 40px; }
    .tt-passages { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); margin-top: 12px; }
    .tt-passage { display: block; width: 100%; text-align: start; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .tt-passage:hover { background: var(--surface-2); border-color: var(--primary); }
    .tt-passage b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
    .tt-passage .pv { display: block; color: var(--muted); font-size: .95rem; line-height: 1.7; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .tt-passage .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tt-tips ol { margin: 0; padding-inline-start: 1.3em; }
    .tt-tips li + li { margin-top: 8px; }
    .tt-langnote { margin-top: 10px; }

    /* ---------- progress ---------- */
    .tt-sumgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 700px) { .tt-sumgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .tt-sumgrid > div { background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
    .tt-sumgrid b { display: block; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; line-height: 1.2; font-family: "Noto Sans", system-ui, sans-serif; }
    .tt-sumgrid span { font-size: .82rem; color: var(--muted); }
    .tt-table td.n, .tt-table th.n { text-align: end; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tt-table td .tt-stars { font-size: 1rem; }
    .tt-name { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .tt-name .field { flex: 1 1 260px; }
    .tt-name input { width: 100%; }

    .tt-help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .tt-help li + li { margin-top: 6px; }
    .tt-help summary { cursor: pointer; }
    #app > * + * { margin-top: 14px; }
    #app > .edu-intro + .tabs { margin-top: 0; }

    /* ---------- print (report card + wall chart) ---------- */
    #print-area { display: none; }
    @media print {
      body.tt-printing #app > :not(#print-area) { display: none !important; }
      body.tt-printing #print-area { display: block !important; }
      #print-area h1 { font-size: 20pt; margin: 0 0 4pt; }
      #print-area .pmeta { display: flex; flex-wrap: wrap; gap: 4pt 24pt; margin: 6pt 0 10pt; font-size: 11pt; }
      #print-area .tt-kbd { max-width: none; background: #fff; border: 1px solid #999; }
      #print-area .key { height: 40pt; font-size: 15pt; }
      #print-area .key.wordy { font-size: 9pt; }
      #print-area .tt-handrow { max-width: none; }
      #print-area .table { font-size: 10.5pt; }
      #print-area .table th { position: static; }
      #print-area .tt-stars .on { color: #b57d00; }
      #print-area .tt-stars .off { color: #ccc; }
      .key, .finger, .palm, .sw, .tt-stars { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .tt-posture { columns: 2; margin-top: 10pt; font-size: 12pt; }
    }
    @media (prefers-reduced-motion: reduce) { .key.next { animation: none; } }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs tt-tabs no-print" role="tablist" id="tabs" data-i18n-aria-label="tabs_aria">
      <button type="button" role="tab" id="tab-lessons" data-tab="lessons" aria-controls="panel-lessons"><span class="ico" aria-hidden="true">⌨️</span><span data-i18n="tab_lessons"></span></button>
      <button type="button" role="tab" id="tab-free" data-tab="free" aria-controls="panel-free"><span class="ico" aria-hidden="true">📝</span><span data-i18n="tab_free"></span></button>
      <button type="button" role="tab" id="tab-lang" data-tab="lang" aria-controls="panel-lang"><span class="ico" aria-hidden="true">🌐</span><span data-i18n="tab_lang"></span></button>
      <button type="button" role="tab" id="tab-progress" data-tab="progress" aria-controls="panel-progress"><span class="ico" aria-hidden="true">⭐</span><span data-i18n="tab_progress"></span></button>
    </div>

    <!-- ================= LESSONS ================= -->
    <section class="card tt-panel" role="tabpanel" id="panel-lessons" aria-labelledby="tab-lessons">
      <div class="tt-top-row">
        <div>
          <h2 data-i18n="lessons_h"></h2>
          <p class="muted small mb0" data-i18n="lessons_hint"></p>
        </div>
        <button type="button" class="btn btn-primary btn-lg" id="continue"></button>
      </div>
      <div id="lesson-list"></div>
      <p class="small muted mt0" id="star-rule" style="margin-top:14px"></p>
    </section>

    <!-- ================= FREE PRACTICE ================= -->
    <section class="card tt-panel" role="tabpanel" id="panel-free" aria-labelledby="tab-free" hidden>
      <h2 data-i18n="free_h"></h2>
      <p class="muted small tt-sub" data-i18n="free_hint"></p>
      <div class="field">
        <label for="free-text" data-i18n="free_label"></label>
        <textarea id="free-text" class="no-i18n" rows="5" spellcheck="false" dir="auto"></textarea>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn btn-sm" id="free-sample" data-i18n="use_sample"></button>
        <button type="button" class="btn btn-sm" id="free-clear" data-i18n="clear"></button>
        <span class="small muted" id="free-count" aria-live="polite"></span>
      </div>
      <div class="tt-opts">
        <div class="row" style="gap:6px">
          <span class="lbl" id="limit-lbl" data-i18n="time_limit"></span>
          <div class="seg" id="limit" role="group" aria-labelledby="limit-lbl">
            <button type="button" data-limit="0" data-i18n="no_limit"></button>
            <button type="button" data-limit="60"></button>
            <button type="button" data-limit="120"></button>
            <button type="button" data-limit="300"></button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="easy"><span data-i18n="easy_mode"></span></label>
      </div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn btn-primary btn-lg" id="free-start"><span aria-hidden="true">▶</span><span data-i18n="start_typing"></span></button>
      </div>
    </section>

    <!-- ================= TYPE IN YOUR LANGUAGE ================= -->
    <section class="tt-panel" role="tabpanel" id="panel-lang" aria-labelledby="tab-lang" hidden>
      <div class="card">
        <h2 data-i18n="lang_h"></h2>
        <p class="muted small tt-sub" data-i18n="lang_hint"></p>
        <div class="field" style="max-width:320px">
          <label for="lang-sel" data-i18n="lang_pick"></label>
          <select id="lang-sel"></select>
        </div>
        <h3 style="margin-top:16px" data-i18n="passage_pick"></h3>
        <div class="tt-passages" id="passages"></div>
        <p class="small muted" style="margin-top:12px" id="lang-best"></p>
      </div>
      <div class="card tt-tips" style="margin-top:14px">
        <h2 data-i18n="how_enable_h"></h2>
        <div id="tips-main"></div>
      </div>
    </section>

    <!-- ================= PROGRESS ================= -->
    <section class="tt-panel" role="tabpanel" id="panel-progress" aria-labelledby="tab-progress" hidden>
      <div class="card">
        <h2 data-i18n="prog_h"></h2>
        <div class="tt-sumgrid" id="prog-sum"></div>
        <div class="scroll-x" style="margin-top:14px">
          <table class="table tt-table" id="prog-table"></table>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2 data-i18n="recent_h"></h2>
        <div class="scroll-x"><table class="table tt-table" id="hist-table"></table></div>
        <p class="muted small" id="hist-none" data-i18n="recent_none"></p>
      </div>
      <div class="card no-print" style="margin-top:14px">
        <div class="tt-name">
          <div class="field">
            <label for="student-name" data-i18n="student_name"></label>
            <input type="text" id="student-name" class="no-i18n" maxlength="60" data-i18n-placeholder="name_ph">
          </div>
          <button type="button" class="btn" id="print-report"><span aria-hidden="true">🖨</span><span data-i18n="print_report"></span></button>
          <button type="button" class="btn" id="print-chart"><span aria-hidden="true">🖨</span><span data-i18n="print_chart"></span></button>
        </div>
        <div class="row spread" style="margin-top:14px">
          <span class="small muted" data-i18n="saved_local"></span>
          <button type="button" class="btn btn-danger btn-sm" id="reset-progress" data-i18n="reset_progress"></button>
        </div>
      </div>
    </section>

    <!-- ================= TRAINER (shared by all modes) ================= -->
    <section class="card" id="trainer" hidden>
      <div class="tt-head">
        <div class="grow">
          <h2 id="run-title"></h2>
          <div class="small muted" id="run-sub"></div>
        </div>
        <div class="tt-actions">
          <button type="button" class="btn btn-sm" id="back"><span class="edu-back-arrow" aria-hidden="true">←</span><span data-i18n="back"></span></button>
          <button type="button" class="btn btn-sm" id="restart"><span aria-hidden="true">↺</span><span data-i18n="restart"></span></button>
          <button type="button" class="btn btn-sm" id="fs" data-i18n-aria-label="fullscreen" data-i18n-title="fullscreen"><span aria-hidden="true">⛶</span></button>
        </div>
      </div>

      <div class="tt-stats">
        <div class="tt-stat"><b id="st-speed">0</b><span id="st-speed-lbl"></span></div>
        <div class="tt-stat"><b id="st-acc">100%</b><span data-i18n="accuracy"></span></div>
        <div class="tt-stat"><b id="st-err">0</b><span data-i18n="errors"></span></div>
        <div class="tt-stat"><b id="st-time">0:00</b><span id="st-time-lbl" data-i18n="time"></span></div>
      </div>
      <div class="progress tt-bar" role="presentation"><span id="st-bar" style="width:0%"></span></div>

      <div id="result" class="tt-result" hidden aria-live="polite">
        <h3 id="res-title"></h3>
        <span class="tt-stars" id="res-stars"></span>
        <div id="res-best"></div>
        <div class="tt-res-grid">
          <div><b id="res-speed"></b><span id="res-speed-lbl"></span></div>
          <div><b id="res-acc"></b><span data-i18n="accuracy"></span></div>
          <div><b id="res-err"></b><span data-i18n="errors"></span></div>
          <div><b id="res-time"></b><span data-i18n="time"></span></div>
        </div>
        <p class="mb0" id="res-msg"></p>
        <p class="small muted mb0" id="res-detail"></p>
        <div class="row">
          <button type="button" class="btn btn-primary" id="again" data-i18n="try_again"></button>
          <button type="button" class="btn btn-accent" id="next-lesson"><span data-i18n="next_lesson"></span><span class="tt-fwd" aria-hidden="true">→</span></button>
          <button type="button" class="btn" id="new-text" data-i18n="new_text"></button>
        </div>
      </div>

      <div id="target" class="tt-target no-i18n" role="textbox" aria-readonly="true" data-i18n-aria-label="target_aria"></div>
      <label for="typein" class="tt-typelabel" data-i18n="type_here"></label>
      <textarea id="typein" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="no-i18n" data-i18n-placeholder="type_ph"></textarea>
      <p class="tiny muted mb0" data-i18n="start_hint"></p>
      <div class="tt-hint" id="hint" aria-live="off"></div>

      <div class="tt-kbarea" id="kb-area">
        <label class="check"><input type="checkbox" id="show-kbd" checked><span data-i18n="show_kbd"></span></label>
        <div id="kb-box">
          <div class="tt-kbd no-i18n" id="kbd" aria-hidden="true"></div>
          <div class="tt-handrow">
            <div class="tt-hands" id="hands" role="img" data-i18n-aria-label="hands_label"></div>
            <div class="tt-legend" id="legend"></div>
          </div>
        </div>
      </div>
      <div class="tt-langnote" id="lang-note" hidden>
        <p class="callout small" data-i18n="lang_note"></p>
        <details class="tt-tips">
          <summary><strong data-i18n="how_enable_h"></strong></summary>
          <div id="tips-mini" style="margin-top:8px"></div>
        </details>
      </div>
    </section>

    <details class="card tt-help no-print">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="small muted mb0" data-i18n="wpm_explain"></p>
    </details>

    <div id="print-area" class="print-only"></div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
