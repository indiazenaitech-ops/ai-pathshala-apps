<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Cleaning Lab · AI Pathshala</title>
  <meta name="description" content="Clean messy CSV data: trim spaces, remove duplicates, fix dates, Indian mobile numbers and ₹ amounts, and save the steps as a recipe you can replay. Free, works offline, your file stays on your device.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .dc-h { margin: 0 0 10px; font-size: 1.15rem; }
    .dc-sub { margin: -4px 0 12px; }
    #data-info { font-weight: 600; margin: 10px 0 0; overflow-wrap: anywhere; }
    #paste { width: 100%; min-height: 120px; font-family: var(--mono); font-size: .9rem; direction: ltr; text-align: left; }
    #paste-box { margin-top: 10px; }
    #paste-box summary { cursor: pointer; font-weight: 600; color: var(--primary); padding: 6px 0; }
    .dc-drop { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; }
    body.dc-drag .dc-drop { border-color: var(--primary); background: var(--primary-soft); }
    body.dc-drag::after { content: ''; position: fixed; inset: 0; border: 4px dashed var(--primary); pointer-events: none; z-index: 50; }

    /* quality */
    .dc-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .dc-score { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 14px; min-width: 0; }
    .dc-score .lbl { display: block; font-weight: 700; color: var(--muted); font-size: .9rem; }
    .dc-score .big { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .dc-score .big small { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .dc-score.after { background: var(--primary-soft); }
    .dc-score .progress { margin-top: 6px; }
    #bar-after { background: var(--success); }
    #bar-before { background: var(--warning); }
    .dc-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .dc-stat { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; min-width: 0; }
    .dc-stat .lbl { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; line-height: 1.3; }
    .dc-stat .val { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .dc-stat .b { color: var(--muted); }
    .up { color: var(--success); }
    .down { color: var(--danger); }
    .dc-qt td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dc-qt th[scope="row"] { font-weight: 600; background: none; position: static; overflow-wrap: anywhere; min-width: 7rem; }
    .dc-new { margin-inline-start: 6px; }

    /* steps */
    .dc-add { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); align-items: end; }
    #step-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-items: end; }
    #step-form .dc-wide { grid-column: 1 / -1; }
    #step-form select, #step-form input[type="text"], .dc-add > .field select { width: 100%; }
    .dc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .dc-chips .chip { min-height: 36px; cursor: pointer; }
    .dc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #recipe { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .dc-step { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; background: var(--surface); }
    .dc-step.off { opacity: .6; }
    .dc-step.off .dc-what b { text-decoration: line-through; }
    .dc-on input { width: 20px; height: 20px; }
    .dc-on { display: inline-flex; min-width: 32px; min-height: 40px; align-items: center; justify-content: center; cursor: pointer; }
    .dc-num { font-weight: 800; color: var(--primary); min-width: 1.4em; text-align: center; }
    .dc-what { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
    .dc-detail { overflow-wrap: anywhere; font-size: .9rem; }
    .dc-res.success { color: var(--success); }
    .dc-res.warning { color: var(--warning); }
    .dc-res.danger { color: var(--danger); }
    .dc-btns { display: flex; gap: 2px; }
    .dc-btns .btn { min-width: 36px; min-height: 40px; padding: 4px 8px; font-size: 1rem; }
    .dc-x:hover { color: var(--danger); }
    @media (max-width: 520px) {
      .dc-step { grid-template-columns: auto auto minmax(0, 1fr); }
      .dc-btns { grid-column: 1 / -1; justify-content: flex-end; }
    }

    /* data grid */
    .dc-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .dc-bar .seg button { min-height: 40px; }
    #filter { min-height: 40px; }
    .dc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; margin-bottom: 8px; }
    .dc-legend span::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 5px; }
    .dc-legend .lg-chg::before { background: var(--success-soft); border: 1px solid var(--success); }
    .dc-legend .lg-bad::before { background: var(--danger-soft); border: 1px solid var(--danger); }
    .dc-gridwrap { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    #grid { font-size: .88rem; }
    #grid th, #grid td { padding: 6px 9px; white-space: nowrap; max-width: 22rem; overflow: hidden; text-overflow: ellipsis; }
    #grid td.chg { background: var(--success-soft); }
    #grid td.bad { background: var(--danger-soft); box-shadow: inset 0 -2px 0 var(--danger); }
    #grid td.chg.bad { background: var(--danger-soft); }
    #grid .dc-rn { color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; width: 1%; }
    #grid th.dc-newcol { color: var(--accent); }
    #grid .sp { color: var(--danger); font-weight: 700; }
    #grid td { direction: ltr; unicode-bidi: plaintext; text-align: start; }
    .dc-pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
    .dc-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; }
    #busy { margin-top: 8px; }

    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.02rem; }
    details.card ul { margin: 12px 0 4px; padding-inline-start: 1.3em; }
    details.card li + li { margin-top: 6px; }
    .dc-sec { margin-top: 16px; }
    @media print { .dc-gridwrap { max-height: none; overflow: visible; } }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card" aria-labelledby="h-load">
      <h2 class="dc-h" id="h-load" data-i18n="h_load"></h2>
      <div class="row">
        <button class="btn" id="load-sample" type="button" data-i18n="load_sample"></button>
        <button class="btn btn-primary" id="open-file" type="button" data-i18n="open_file"></button>
        <button class="btn btn-danger" id="reset" type="button" data-i18n="reset"></button>
      </div>
      <details id="paste-box">
        <summary data-i18n="paste_data"></summary>
        <textarea id="paste" class="no-i18n" data-i18n-placeholder="paste_ph" aria-label="CSV" data-i18n-aria-label="paste_data"></textarea>
        <button class="btn btn-sm" id="use-paste" type="button" data-i18n="use_paste"></button>
      </details>
      <p class="dc-drop small muted" data-i18n="drop_hint"></p>
      <p id="data-info" class="no-i18n" aria-live="polite"></p>
      <p id="busy" class="muted" hidden data-i18n="loading"></p>
    </section>

    <section class="card dc-sec" aria-labelledby="h-quality">
      <h2 class="dc-h" id="h-quality" data-i18n="h_quality"></h2>
      <div class="dc-scores" aria-live="polite">
        <div class="dc-score">
          <span class="lbl" data-i18n="score_before"></span>
          <span class="big"><span id="score-before"></span> <small>/ 100</small></span>
          <div class="progress"><span id="bar-before"></span></div>
        </div>
        <div class="dc-score after">
          <span class="lbl" data-i18n="score_after"></span>
          <span class="big"><span id="score-after"></span> <small>/ 100</small></span>
          <div class="progress"><span id="bar-after"></span></div>
        </div>
      </div>
      <div class="dc-tiles" id="q-tiles"></div>
      <div class="scroll-x">
        <table class="table dc-qt">
          <thead><tr>
            <th scope="col" data-i18n="th_column"></th><th scope="col" data-i18n="th_type"></th>
            <th scope="col" data-i18n="q_missing"></th><th scope="col" data-i18n="q_invalid"></th><th scope="col" data-i18n="q_spaces"></th>
          </tr></thead>
          <tbody id="q-body"></tbody>
        </table>
      </div>
      <p class="tiny muted" data-i18n="quality_note"></p>
    </section>

    <section class="card dc-sec" aria-labelledby="h-steps">
      <h2 class="dc-h" id="h-steps" data-i18n="h_steps"></h2>
      <div class="panel stack">
        <div class="dc-add">
          <label class="field"><span data-i18n="step_type"></span><select id="step-type"></select></label>
        </div>
        <div id="step-form"></div>
        <div class="dc-actions">
          <button class="btn btn-primary" id="step-add" type="button" data-i18n="add_step"></button>
          <button class="btn btn-accent" id="suggest" type="button" data-i18n="suggest"></button>
        </div>
      </div>
      <ol id="recipe" aria-live="polite"></ol>
      <p id="recipe-empty" class="muted" data-i18n="recipe_empty"></p>
      <div class="dc-actions" style="margin-top:12px">
        <button class="btn btn-sm" id="undo" type="button" data-i18n="undo"></button>
        <button class="btn btn-sm" id="export-recipe" type="button" data-i18n="export_recipe"></button>
        <button class="btn btn-sm" id="import-recipe" type="button" data-i18n="import_recipe"></button>
        <button class="btn btn-sm btn-danger" id="clear-steps" type="button" data-i18n="clear_steps"></button>
      </div>
      <p class="callout small" style="margin-top:12px" data-i18n-html="pipeline_note"></p>
    </section>

    <section class="card dc-sec" aria-labelledby="h-preview">
      <h2 class="dc-h" id="h-preview" data-i18n="h_preview"></h2>
      <div class="dc-bar">
        <div class="seg" id="view-seg" role="group">
          <button type="button" data-v="clean" data-i18n="view_clean"></button>
          <button type="button" data-v="orig" data-i18n="view_orig"></button>
        </div>
        <label class="row" style="gap:6px"><span class="small muted" data-i18n="show"></span>
          <select id="filter">
            <option value="all" data-i18n="show_all"></option>
            <option value="changed" data-i18n="show_changed"></option>
            <option value="problems" data-i18n="show_problems"></option>
          </select>
        </label>
      </div>
      <div class="dc-legend"><span class="lg-chg" data-i18n="legend_changed"></span><span class="lg-bad" data-i18n="legend_bad"></span></div>
      <div class="dc-gridwrap no-i18n"><table class="table" id="grid"></table></div>
      <p id="no-rows" class="muted" hidden data-i18n="no_rows"></p>
      <div class="dc-pager" id="pager">
        <button class="btn btn-sm" id="pg-prev" type="button" data-i18n="previous"></button>
        <span id="page-info" class="small"></span>
        <button class="btn btn-sm" id="pg-next" type="button" data-i18n="next"></button>
      </div>
      <div class="dc-foot">
        <span id="out-count" class="small muted"></span>
        <button class="btn btn-primary" id="download" type="button" data-i18n="download_csv"></button>
      </div>
    </section>

    <details class="card dc-sec">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
    <details class="card dc-sec">
      <summary data-i18n="words_title"></summary>
      <ul>
        <li data-i18n-html="w_dataset"></li>
        <li data-i18n-html="w_missing"></li>
        <li data-i18n-html="w_dup"></li>
        <li data-i18n-html="w_standard"></li>
        <li data-i18n-html="w_mean"></li>
        <li data-i18n-html="w_pipeline"></li>
        <li data-i18n-html="w_score"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="clean.js"></script>
  <script src="app.js"></script>
</body>
</html>
