<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Games: Dumb Charades · AI Pathshala</title>
  <meta name="description" content="Free Dumb Charades word cards, Antakshari letters, Draw &amp; Guess and icebreakers with a round timer and team scoreboard. 12 Indian languages, works offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    #app .btn-sm, #app .seg button { min-height: 40px; }
    .lbl { font-weight: 600; font-size: .92rem; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .num { font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

    /* ---------- scoreboard ---------- */
    .board { margin-bottom: 14px; }
    .board-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; }
    .board-head h2 { margin: 0; font-size: 1.15rem; }
    .board-tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .board-tools .btn { gap: 6px; }
    .scores { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
    .score-tile { --tc: var(--c1); position: relative; border: 2px solid color-mix(in srgb, var(--tc) 35%, var(--border)); border-top: 7px solid var(--tc); border-radius: var(--radius);
      background: color-mix(in srgb, var(--tc) 9%, var(--surface)); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 6px; min-width: 0; }
    .score-tile.turn { border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 30%, transparent); }
    .st-name { grid-column: 1 / -1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: flex; align-items: center; gap: 6px; }
    .st-name .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--tc); }
    .st-name .nm { overflow: hidden; text-overflow: ellipsis; }
    .st-score { text-align: center; font-size: 2.3rem; font-weight: 800; line-height: 1.1; }
    .st-btn { min-width: 40px; min-height: 40px; padding: 0; font-size: 1.3rem; line-height: 1; }
    .turn-badge { font-size: .72rem; font-weight: 800; color: var(--tc); margin-inline-start: auto; flex: none; }
    .team-edit { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; display: grid; gap: 10px; }
    .team-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .team-row input[type="text"] { flex: 1 1 10rem; min-width: 0; font-weight: 600; }
    .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text); }
    .stepper { display: inline-flex; align-items: stretch; }
    .stepper .btn { min-width: 44px; padding: 0 8px; font-size: 1.3rem; line-height: 1; }
    .stepper .btn:first-child { border-start-end-radius: 0; border-end-end-radius: 0; }
    .stepper .btn:last-child { border-start-start-radius: 0; border-end-start-radius: 0; }
    .stepper output { min-width: 3em; display: grid; place-items: center; border: 1px solid var(--border); border-inline-width: 0; font-weight: 800; font-size: 1.1rem; background: var(--surface); }

    /* ---------- tabs ---------- */
    .pg-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; padding: 5px; margin: 0 0 14px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; }
    .pg-tabs button { display: flex; align-items: center; justify-content: center; gap: 2px 8px; flex-wrap: wrap; min-height: 48px; padding: 8px 8px;
      border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 1rem; line-height: 1.2; text-align: center; cursor: pointer; min-width: 0; }
    .pg-tabs button:hover { color: var(--text); }
    .pg-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .pg-tabs .ico { font-size: 1.3rem; line-height: 1; }
    @media (max-width: 640px) { .pg-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pg-tabs button { font-size: .95rem; } }

    /* ---------- layout ---------- */
    .pg-layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .pg-layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }
    .setup h2, .pad-card h2 { font-size: 1.05rem; margin: 0; }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .cats .chip { min-height: 40px; font-size: .9rem; }
    .used { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-weight: 600; font-size: .92rem; }
    .setup textarea { min-height: 120px; }

    /* ---------- the stage (what everyone sees) ---------- */
    .stage { display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .stage-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .turn { --tc: var(--c1); display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; padding: 4px 14px 4px 10px; border-radius: 999px;
      background: color-mix(in srgb, var(--tc) 14%, var(--surface)); border: 2px solid var(--tc); max-width: 100%; min-width: 0; text-align: start; }
    .turn .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--tc); }
    .turn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timer { font-size: 2.6rem; font-weight: 800; line-height: 1; padding: 4px 14px; border-radius: 12px; background: var(--surface-2); margin-inline-start: auto; }
    .timer.warn { color: var(--c2); }
    .timer.done { color: var(--danger); background: var(--danger-soft); }
    .timebar { height: 12px; }
    .timebar > span { transition: width .2s linear; }
    .timebar.warn > span { background: var(--c2); }
    .wordcard { width: 100%; min-height: 210px; border-radius: 18px; border: 3px solid var(--primary); background: var(--surface); color: var(--text); font: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px 14px; cursor: pointer; position: relative; overflow: hidden; }
    .wordcard.covered { border-style: dashed; background: repeating-linear-gradient(45deg, var(--primary-soft) 0 16px, var(--surface) 16px 32px); }
    .wordcard:disabled { cursor: default; }
    .wc-hint { font-weight: 700; font-size: 1.15rem; color: var(--muted); max-width: 30ch; }
    .wordcard.covered .wc-hint { color: var(--text); font-size: 1.35rem; background: var(--surface); padding: 6px 14px; border-radius: 10px; }
    .wc-word { font-size: 2.2rem; font-size: clamp(2rem, 7.5vw, 4.2rem); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; max-width: 100%; }
    .wc-cat { font-size: .9rem; font-weight: 700; color: var(--muted); }
    :root[lang="ur"] .wc-word { line-height: 1.9; }
    :root[lang="ur"] .btn, :root[lang="ur"] .pg-tabs button { line-height: 1.7; }
    .round-stats { font-weight: 800; font-size: 1.15rem; min-height: 1.6em; }
    .controls { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); }
    .controls .btn { min-height: 64px; font-size: 1.2rem; padding-inline: 8px; white-space: normal; }
    .ctl-ok { background: var(--success); border-color: var(--success); color: #fff; }
    .ctl-ok:hover { background: var(--success); filter: brightness(1.07); }
    :root[data-theme="dark"] .ctl-ok { color: #06260f; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ctl-ok { color: #06260f; } }
    .ctl-skip { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
    .controls.idle { grid-template-columns: minmax(0, 1fr); }
    .controls.idle .ctl-ok, .controls.idle .ctl-skip { display: none; }
    @media (max-width: 600px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls .ctl-main { grid-column: 1 / -1; order: 3; min-height: 54px; }
      .timer { font-size: 2.1rem; }
    }
    .stage-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .keys { margin: 0; }
    @media (pointer: coarse) { .keys { display: none; } }
    .summary { text-align: start; border-radius: var(--radius); background: var(--surface-2); padding: 14px; }
    .summary h3 { font-size: 1.3rem; margin-bottom: 8px; text-align: center; }
    .sum-cols { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 420px) { .sum-cols { grid-template-columns: minmax(0, 1fr); } }
    .sum-cols h4 { margin: 0 0 4px; font-size: .95rem; }
    .sum-cols ul { margin: 0; padding-inline-start: 1.2em; }
    .summary .btn { margin-top: 12px; width: 100%; }

    /* ---------- drawing pad ---------- */
    .pad-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pad-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    #dw-pad { display: block; width: 100%; height: 340px; touch-action: none; cursor: crosshair; }
    .pen { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; }
    .pen[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text); }

    /* ---------- antakshari ---------- */
    .ak-box { border-radius: 18px; border: 3px solid var(--accent); background: var(--accent-soft); padding: 14px; }
    .ak-lbl { font-weight: 700; font-size: 1.1rem; }
    .ak-letter { font-size: 7rem; font-size: clamp(6rem, 24vw, 11rem); font-weight: 800; line-height: 1.2; color: var(--text); }
    :root[lang="ur"] .ak-letter { line-height: 1.6; }
    .ak-letter.pop { animation: pg-pop .35s ease-out; }
    @keyframes pg-pop { from { transform: scale(.6); opacity: .2; } to { transform: none; opacity: 1; } }
    .ak-msg { font-weight: 700; min-height: 1.6em; }
    .ak-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
    .ak-grid button { min-height: 46px; font: inherit; font-size: 1.3rem; font-weight: 700; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; padding: 0; }
    .ak-grid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ak-grid.nudge { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
    .rules ol, .help ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    .rules li + li, .help li + li { margin-top: 6px; }
    .rules summary, .help summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 700; }

    /* ---------- icebreakers ---------- */
    .ice-text { font-size: 1.6rem; font-size: clamp(1.5rem, 4.6vw, 2.6rem); font-weight: 800; line-height: 1.3; min-height: 5.2em; display: grid; place-items: center; margin: 0;
      padding: 18px; border-radius: 18px; background: var(--primary-soft); border: 3px solid var(--primary); }
    :root[lang="ur"] .ice-text { line-height: 1.9; }
    .ice-text.pop { animation: pg-pop .3s ease-out; }
    .ice-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .ice-actions .btn { min-width: min(100%, 16rem); }

    /* ---------- full screen (TV / projector) ---------- */
    html.pg-noscroll, html.pg-noscroll body { overflow: hidden; }
    #party:fullscreen, #party.is-fs { background: var(--bg); overflow: auto; padding: 2vh 2.5vw; }
    #party.is-fs { position: fixed; inset: 0; z-index: 800; }
    #party:fullscreen .fs-hide, #party.is-fs .fs-hide { display: none !important; }
    #party:fullscreen .pg-layout, #party.is-fs .pg-layout { grid-template-columns: minmax(0, 1fr); }
    #party:fullscreen .wc-word, #party.is-fs .wc-word { font-size: clamp(2.6rem, 9vw, 8rem); }
    #party:fullscreen .wordcard, #party.is-fs .wordcard { min-height: 38vh; }
    #party:fullscreen .timer, #party.is-fs .timer { font-size: clamp(2.6rem, 7vh, 5rem); }
    #party:fullscreen .ak-letter, #party.is-fs .ak-letter { font-size: clamp(7rem, 34vh, 20rem); }
    #party:fullscreen .ice-text, #party.is-fs .ice-text { font-size: clamp(1.8rem, 5vw, 4rem); min-height: 50vh; }
    #party:fullscreen .st-score, #party.is-fs .st-score { font-size: clamp(2.3rem, 6vh, 4rem); }
    #party:fullscreen .pg-tabs, #party.is-fs .pg-tabs { margin-bottom: 1.5vh; }

    @media print {
      .pg-tabs, .board-tools, .controls, .stage-foot, .setup, .pad-card, .st-btn, .help { display: none !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="party">
      <!-- ============ shared scoreboard ============ -->
      <section class="card board" id="board" aria-labelledby="boardTitle">
        <div class="board-head">
          <h2 id="boardTitle" data-i18n="board_title"></h2>
          <div class="board-tools">
            <button type="button" class="btn btn-sm" id="soundBtn" aria-pressed="false"><span aria-hidden="true" id="soundIc">🔇</span><span data-i18n="sound"></span></button>
            <button type="button" class="btn btn-sm fs-hide" id="teamsBtn" aria-expanded="false" aria-controls="teamEdit"><span aria-hidden="true">👥</span><span data-i18n="teams_btn"></span></button>
            <button type="button" class="btn btn-sm" id="fsBtn"><span aria-hidden="true">⛶</span><span id="fsLbl" data-i18n="fullscreen"></span></button>
            <button type="button" class="btn btn-sm btn-danger fs-hide" id="newGame"><span aria-hidden="true">↺</span><span data-i18n="new_game"></span></button>
          </div>
        </div>
        <div class="scores" id="scores"></div>
        <p class="small muted mb0 leader" id="leader" aria-live="polite"></p>
        <div class="team-edit fs-hide" id="teamEdit" hidden>
          <div class="row">
            <span class="lbl" id="teamCountLbl" data-i18n="team_count"></span>
            <div class="stepper" role="group" aria-labelledby="teamCountLbl">
              <button type="button" class="btn" id="teamMinus" aria-label="−">−</button>
              <output id="teamCount" class="num" aria-live="polite">2</output>
              <button type="button" class="btn" id="teamPlus" aria-label="+">+</button>
            </div>
          </div>
          <div id="teamRows" class="stack"></div>
        </div>
      </section>

      <div class="pg-tabs" role="tablist" id="tabs" data-i18n-aria-label="tabs_label">
        <button type="button" role="tab" id="tab-ch" data-tab="ch" aria-controls="panel-ch" aria-selected="true"><span class="ico" aria-hidden="true">🎭</span><span data-i18n="tab_ch"></span></button>
        <button type="button" role="tab" id="tab-ak" data-tab="ak" aria-controls="panel-ak" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">🎵</span><span data-i18n="tab_ak"></span></button>
        <button type="button" role="tab" id="tab-dw" data-tab="dw" aria-controls="panel-dw" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">✏️</span><span data-i18n="tab_dw"></span></button>
        <button type="button" role="tab" id="tab-ice" data-tab="ice" aria-controls="panel-ice" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">💬</span><span data-i18n="tab_ice"></span></button>
      </div>

      <!-- ============ DUMB CHARADES ============ -->
      <section id="panel-ch" role="tabpanel" aria-labelledby="tab-ch">
        <div class="pg-layout">
          <div class="card stage" id="ch-stage">
            <div class="stage-top">
              <span class="turn" id="ch-turn"></span>
              <span class="timer num" id="ch-timer" role="timer" aria-atomic="true">1:00</span>
            </div>
            <div class="progress timebar" id="ch-barbox"><span id="ch-bar" style="width:100%"></span></div>
            <button type="button" class="wordcard" id="ch-card"><span class="wc-hint" id="ch-hint"></span><span class="wc-word no-i18n" id="ch-word"></span><span class="wc-cat" id="ch-cat"></span></button>
            <div class="round-stats" id="ch-stats" aria-live="polite"></div>
            <div class="controls idle" id="ch-controls">
              <button type="button" class="btn btn-lg ctl-skip" id="ch-skip"><span aria-hidden="true">⏭</span><span data-i18n="skip_btn"></span></button>
              <button type="button" class="btn btn-primary btn-lg ctl-main" id="ch-start"></button>
              <button type="button" class="btn btn-lg ctl-ok" id="ch-correct"><span aria-hidden="true">✓</span><span data-i18n="got_it"></span></button>
            </div>
            <div class="summary" id="ch-summary" hidden aria-live="polite"></div>
            <div class="stage-foot">
              <button type="button" class="btn btn-sm btn-ghost" id="ch-end" data-i18n="end_round"></button>
            </div>
            <p class="keys tiny muted" data-i18n="keys_hint"></p>
          </div>

          <div class="card setup stack fs-hide" id="ch-setup">
            <div class="field">
              <span class="lbl" id="ch-cat-lbl" data-i18n="category"></span>
              <div class="cats" id="ch-cats" role="group" aria-labelledby="ch-cat-lbl"></div>
            </div>
            <div class="field" id="ch-customBox" hidden>
              <label for="ch-custom" data-i18n="custom_label"></label>
              <textarea id="ch-custom" rows="6" spellcheck="false" data-i18n-placeholder="custom_ph"></textarea>
              <span class="hint" data-i18n="custom_hint"></span>
            </div>
            <div class="field">
              <span class="lbl" id="ch-time-lbl" data-i18n="round_time"></span>
              <div class="seg" id="ch-time" role="group" aria-labelledby="ch-time-lbl"></div>
            </div>
            <div class="field">
              <label for="ch-skips" data-i18n="skip_limit"></label>
              <select id="ch-skips"></select>
            </div>
            <label class="check"><input type="checkbox" id="ch-autohide" checked> <span data-i18n="autohide"></span></label>
            <div class="used"><span id="ch-used"></span><button type="button" class="btn btn-sm" id="ch-reuse" data-i18n="reset_deck"></button></div>
          </div>
        </div>
      </section>

      <!-- ============ ANTAKSHARI ============ -->
      <section id="panel-ak" role="tabpanel" aria-labelledby="tab-ak" hidden>
        <div class="pg-layout">
          <div class="card stage" id="ak-stage">
            <div class="stage-top">
              <span class="turn" id="ak-turn"></span>
              <span class="timer num" id="ak-timer" role="timer" aria-atomic="true">0:30</span>
            </div>
            <div class="progress timebar" id="ak-barbox"><span id="ak-bar" style="width:100%"></span></div>
            <div class="ak-box">
              <div class="ak-lbl" data-i18n="ak_letter_label"></div>
              <div class="ak-letter no-i18n" id="ak-letter" aria-live="polite"></div>
            </div>
            <div class="ak-msg" id="ak-msg" aria-live="polite"></div>
            <div class="controls" id="ak-controls">
              <button type="button" class="btn btn-lg ctl-skip" id="ak-pass"><span aria-hidden="true">⏭</span><span data-i18n="ak_pass"></span></button>
              <button type="button" class="btn btn-primary btn-lg ctl-main" id="ak-start"></button>
              <button type="button" class="btn btn-lg ctl-ok" id="ak-point"><span aria-hidden="true">✓</span><span data-i18n="ak_point"></span></button>
            </div>
            <div class="stage-foot">
              <button type="button" class="btn" id="ak-next"><span aria-hidden="true">🎲</span><span data-i18n="ak_next"></span></button>
            </div>
            <p class="keys tiny muted" data-i18n="ak_keys"></p>
          </div>

          <div class="card setup stack fs-hide">
            <div class="field">
              <span class="lbl" id="ak-time-lbl" data-i18n="ak_turn_time"></span>
              <div class="seg" id="ak-time" role="group" aria-labelledby="ak-time-lbl"></div>
            </div>
            <div class="field">
              <span class="lbl" id="ak-grid-lbl" data-i18n="ak_pick"></span>
              <div class="ak-grid" id="ak-grid" role="group" aria-labelledby="ak-grid-lbl"></div>
            </div>
          </div>
        </div>
        <details class="card rules fs-hide" id="ak-rules" style="margin-top:14px">
          <summary data-i18n="ak_rules_title"></summary>
          <ol>
            <li data-i18n="ak_rule_1"></li>
            <li data-i18n="ak_rule_2"></li>
            <li data-i18n="ak_rule_3"></li>
            <li data-i18n="ak_rule_4"></li>
            <li data-i18n="ak_rule_5"></li>
            <li data-i18n="ak_rule_6"></li>
          </ol>
        </details>
      </section>

      <!-- ============ DRAW & GUESS ============ -->
      <section id="panel-dw" role="tabpanel" aria-labelledby="tab-dw" hidden>
        <div class="pg-layout">
          <div class="card stage" id="dw-stage">
            <div class="stage-top">
              <span class="turn" id="dw-turn"></span>
              <span class="timer num" id="dw-timer" role="timer" aria-atomic="true">1:30</span>
            </div>
            <div class="progress timebar" id="dw-barbox"><span id="dw-bar" style="width:100%"></span></div>
            <button type="button" class="wordcard" id="dw-card"><span class="wc-hint" id="dw-hint"></span><span class="wc-word no-i18n" id="dw-word"></span><span class="wc-cat" id="dw-cat"></span></button>
            <div class="round-stats" id="dw-stats" aria-live="polite"></div>
            <div class="controls idle" id="dw-controls">
              <button type="button" class="btn btn-lg ctl-skip" id="dw-skip"><span aria-hidden="true">⏭</span><span data-i18n="skip_btn"></span></button>
              <button type="button" class="btn btn-primary btn-lg ctl-main" id="dw-start"></button>
              <button type="button" class="btn btn-lg ctl-ok" id="dw-correct"><span aria-hidden="true">✓</span><span data-i18n="got_it"></span></button>
            </div>
            <div class="summary" id="dw-summary" hidden aria-live="polite"></div>
            <div class="stage-foot">
              <button type="button" class="btn btn-sm btn-ghost" id="dw-end" data-i18n="end_round"></button>
            </div>
            <p class="keys tiny muted" data-i18n="keys_hint"></p>
          </div>

          <div class="card setup stack fs-hide" id="dw-setup">
            <div class="field">
              <span class="lbl" id="dw-time-lbl" data-i18n="round_time"></span>
              <div class="seg" id="dw-time" role="group" aria-labelledby="dw-time-lbl"></div>
            </div>
            <div class="field">
              <label for="dw-skips" data-i18n="skip_limit"></label>
              <select id="dw-skips"></select>
            </div>
            <label class="check"><input type="checkbox" id="dw-autohide" checked> <span data-i18n="autohide"></span></label>
            <div class="used"><span id="dw-used"></span><button type="button" class="btn btn-sm" id="dw-reuse" data-i18n="reset_deck"></button></div>
            <p class="small muted mb0" data-i18n="dw_hint"></p>
          </div>
        </div>

        <div class="card stack pad-card" style="margin-top:14px">
          <div class="row spread">
            <h2 data-i18n="pad_title"></h2>
            <div class="pad-tools">
              <div class="swatches" id="dw-pens" role="group" data-i18n-aria-label="pen_color"></div>
              <div class="seg" id="dw-size" role="group" data-i18n-aria-label="pen_size">
                <button type="button" data-size="4" aria-pressed="true" data-i18n="pen_thin"></button>
                <button type="button" data-size="12" aria-pressed="false" data-i18n="pen_thick"></button>
              </div>
              <button type="button" class="btn btn-sm" id="dw-undo"><span aria-hidden="true">↶</span><span data-i18n="pad_undo"></span></button>
              <button type="button" class="btn btn-sm btn-danger" id="dw-clear"><span aria-hidden="true">🧽</span><span data-i18n="pad_clear"></span></button>
            </div>
          </div>
          <div class="pad-wrap"><canvas id="dw-pad" role="img" data-i18n-aria-label="pad_aria"></canvas></div>
        </div>
      </section>

      <!-- ============ ICEBREAKERS ============ -->
      <section id="panel-ice" role="tabpanel" aria-labelledby="tab-ice" hidden>
        <div class="card stage" id="ice-stage">
          <div class="stage-top">
            <div class="seg fs-hide" id="ice-filter" role="group" data-i18n-aria-label="ice_kind">
              <button type="button" data-kind="all" aria-pressed="true" data-i18n="ice_all"></button>
              <button type="button" data-kind="wyr" aria-pressed="false" data-i18n="ice_wyr"></button>
              <button type="button" data-kind="tell" aria-pressed="false" data-i18n="ice_tell"></button>
            </div>
            <span class="badge primary" id="ice-left"></span>
          </div>
          <p class="ice-text" id="ice-text" aria-live="polite"></p>
          <div class="ice-actions">
            <button type="button" class="btn btn-primary btn-lg" id="ice-next"><span data-i18n="ice_next"></span><span aria-hidden="true">→</span></button>
          </div>
          <p class="small muted mb0" data-i18n="ice_hint"></p>
        </div>
      </section>
    </div>

    <details class="card help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
      <p class="tiny muted mb0"><span aria-hidden="true">🔒 </span><span data-i18n="saved_local"></span></p>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
