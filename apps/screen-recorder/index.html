    .sr-mock .side i { height: 6%; border-radius: 99px; background: #d6cab8; }
    .sr-mock .side i:first-child { background: #0b4f5c; opacity: .75; }

    .sr-mock .kpis i:nth-child(2) { border-top-color: #e8590c; } .sr-mock .kpis i:nth-child(3) { border-top-color: #2b8a3e; }

    .sr-mock .chart i { flex: 1; border-radius: 4px 4px 0 0; background: #0b7285; opacity: .85; }

    .sr-caption {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(78%, 520px);
      background: rgba(9, 20, 24, .86); color: #f4f8f9; border-radius: 14px; padding: 12px 16px; text-align: center;

<body>
  <main id="app" data-state="idle">
    <p class="edu-intro" data-i18n="intro"></p>

              <button class="btn btn-primary" id="camStart" type="button"></button>
            </div>
            <div class="sr-pill" id="recPill" hidden><span class="sr-dot"></span><span id="pillLabel"></span><span class="t" id="pillTime">0:00</span></div>
          </div>

          <!-- recording the screen -->
          <div class="sr-layer" id="layerLive" hidden>
            <div class="sr-live">
              <span class="sr-recline"><span class="sr-dot"></span><span id="liveLabel"></span></span>
              <div class="sr-big" id="bigTime">0:00</div>
              <span class="badge" id="liveMuted" hidden data-i18n="mic_muted"></span>
              <span class="badge" id="liveNoMic" hidden data-i18n="no_mic_rec"></span>
              <div class="sr-meter" aria-hidden="true"><span></span></div>
              <p data-i18n="live_hint_screen"></p>
            </div>
            <div class="sr-bubble sr-livebubble c-br s-m" id="liveBubble" hidden>
              <video class="sr-camvid" muted autoplay playsinline aria-hidden="true"></video>
            </div>
          </div>

          <div class="sr-layer" id="layerSaving" hidden>
            <div class="sr-ph"><span class="sr-spin" aria-hidden="true"></span><p data-i18n="saving"></p></div>
          </div>

          <div class="sr-layer" id="layerResult" hidden>
            <video id="player" controls playsinline preload="metadata" data-i18n-aria-label="result_title"></video>
          </div>

          <div class="sr-count" id="layerCount" hidden>
            <p data-i18n="count_title"></p>
            <div class="sr-num" id="countNum" aria-live="assertive"></div>
            <button class="btn btn-sm" id="countCancel" type="button" data-i18n="cancel"></button>
          </div>
        </div>

        <!-- controls -->
        <div class="card sr-ctl">
          <div class="row" id="ctlIdle">
            <button class="btn sr-recbtn" id="recBtn" type="button"><span class="sr-rdot" aria-hidden="true"></span><span data-i18n="start_rec"></span></button>
            <div class="sr-sum">
              <span class="s1 no-i18n" id="sumLine" dir="ltr"></span>
              <span class="small muted" id="estLine"></span>
            </div>
          </div>
          <div class="row" id="ctlBusy" hidden>
            <span class="sr-spin" aria-hidden="true"></span>
            <span id="busyText"></span>
            <button class="btn btn-sm" id="busyCancel" type="button" data-i18n="cancel"></button>
          </div>
          <div class="row" id="ctlCount" hidden>
            <span class="sr-spin" aria-hidden="true"></span>
            <span data-i18n="count_hint"></span>
          </div>
          <div class="row" id="ctlRec" hidden>
            <button class="btn btn-lg" id="pauseBtn" type="button"></button>
            <button class="btn btn-lg sr-stop" id="stopBtn" type="button"><span class="sq" aria-hidden="true"></span><span data-i18n="stop"></span></button>
            <button class="btn btn-lg" id="muteBtn" type="button" aria-pressed="false"><span class="sr-ic" id="muteIc" aria-hidden="true">🎙</span><span id="muteText"></span></button>
            <div class="sr-meter" aria-hidden="true"><span></span></div>
            <span class="sr-clock"><span class="sr-dot" aria-hidden="true"></span><span class="t" id="liveTime">0:00</span><span class="sz" id="liveSize"></span></span>
          </div>
          <div class="stack sr-done" id="ctlDone" hidden>
            <div class="row spread">
              <strong data-i18n="result_title"></strong>
              <span class="row" style="gap:8px"><span class="small muted sr-meta no-i18n" id="resultMeta" dir="ltr"></span><span class="badge" id="dlState"></span></span>
            </div>
            <div class="row">
              <div class="field sr-fname">
                <label for="fileName" data-i18n="file_name"></label>
                <div class="sr-name"><input type="text" id="fileName" class="no-i18n" spellcheck="false" autocomplete="off"><span class="ext no-i18n" id="fileExt">.mp4</span></div>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-lg" id="dlBtn" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="download"></span></button>
              <button class="btn" id="shareBtn" type="button" hidden><span aria-hidden="true">↗</span> <span data-i18n="share"></span></button>
              <button class="btn" id="frameBtn" type="button"><span aria-hidden="true">🖼</span> <span data-i18n="save_frame"></span></button>
              <button class="btn" id="newBtn" type="button"><span aria-hidden="true">＋</span> <span data-i18n="new_rec"></span></button>
              <button class="btn btn-danger" id="delBtn" type="button" data-i18n="delete"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- settings -->
      <aside class="card sr-settings" aria-labelledby="setTitle">
        <h2 class="sr-only" id="setTitle" data-i18n="settings"></h2>
        <fieldset id="settings">
          <div class="sr-sec">
            <h2 id="modeTitle" data-i18n="mode_label"></h2>
            <div class="sr-modes" role="group" aria-labelledby="modeTitle">
              <button class="sr-mode" id="modeScreen" type="button" data-mode="screen"><span class="ic" aria-hidden="true">🖥️</span><span data-i18n="mode_screen"></span></button>
              <button class="sr-mode" id="modeCam" type="button" data-mode="cam"><span class="ic" aria-hidden="true">🎥</span><span data-i18n="mode_cam"></span></button>
            </div>
            <p class="sr-hint" id="modeHint"></p>
          </div>

          <div class="sr-sec" id="grpBubble">
            <label class="check"><input type="checkbox" id="camOn"><span data-i18n="cam_bubble"></span></label>
            <div class="sr-sub" id="bubbleOpts" hidden>
              <div id="bubbleTypeRow">
                <span class="sr-lbl" id="btTitle" data-i18n="bubble_type"></span>
                <div class="seg w100" role="group" aria-labelledby="btTitle">
                  <button type="button" data-bubble="float" data-i18n="bubble_float"></button>
                  <button type="button" data-bubble="inside" data-i18n="bubble_inside"></button>
                </div>
              </div>
              <p class="sr-hint" id="bubbleHint"></p>
              <div id="pipRow"><button class="btn w100" id="pipBtn" type="button"></button></div>
              <div class="stack" id="insideOpts">
                <div>
                  <span class="sr-lbl" id="cnTitle" data-i18n="bubble_corner"></span>
                  <div class="seg w100 sr-corners" role="group" aria-labelledby="cnTitle" dir="ltr">
                    <button type="button" data-corner="tl" data-i18n-aria-label="corner_tl" data-i18n-title="corner_tl">↖</button>
                    <button type="button" data-corner="tr" data-i18n-aria-label="corner_tr" data-i18n-title="corner_tr">↗</button>
                    <button type="button" data-corner="bl" data-i18n-aria-label="corner_bl" data-i18n-title="corner_bl">↙</button>
                    <button type="button" data-corner="br" data-i18n-aria-label="corner_br" data-i18n-title="corner_br">↘</button>
                  </div>
                </div>
                <div>
                  <span class="sr-lbl" id="bsTitle" data-i18n="bubble_size"></span>
                  <div class="seg w100" role="group" aria-labelledby="bsTitle">
                    <button type="button" data-bsize="s" data-i18n="size_s"></button>
                    <button type="button" data-bsize="m" data-i18n="size_m"></button>
                    <button type="button" data-bsize="l" data-i18n="size_l"></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="sr-sec" id="grpCamera">
            <label class="field"><span class="sr-lbl" data-i18n="camera_label"></span><select id="camSel"></select></label>
            <label class="check"><input type="checkbox" id="mirror"><span data-i18n="mirror"></span></label>
          </div>

          <div class="sr-sec">
            <h2 data-i18n="sound_label"></h2>
            <div>
              <label class="sr-lbl" for="micSel" data-i18n="mic_label"></label>
              <div class="sr-mic"><select id="micSel"></select><button class="btn btn-sm" id="micTest" type="button" data-i18n="mic_test"></button></div>
            </div>
            <div class="sr-meter" role="img" data-i18n-aria-label="mic_level"><span></span></div>
            <div id="sysRow">
              <label class="check"><input type="checkbox" id="sysAudio"><span data-i18n="sys_audio"></span></label>
              <p class="sr-hint" data-i18n="sys_audio_hint"></p>
            </div>
          </div>

          <div class="sr-sec">
            <h2 data-i18n="video_label"></h2>
            <div>
              <span class="sr-lbl" id="qTitle" data-i18n="quality_label"></span>
              <div class="seg w100 sr-num-seg" role="group" aria-labelledby="qTitle">
                <button type="button" data-q="720" class="no-i18n">720p</button>
                <button type="button" data-q="1080" class="no-i18n">1080p</button>
              </div>
            </div>
            <div>
              <span class="sr-lbl" id="brTitle" data-i18n="filesize_label"></span>
              <div class="seg w100" role="group" aria-labelledby="brTitle">
                <button type="button" data-br="small" data-i18n="br_small"></button>
                <button type="button" data-br="balanced" data-i18n="br_balanced"></button>
                <button type="button" data-br="high" data-i18n="br_high"></button>
              </div>
            </div>
            <div class="sr-two">
              <div>
                <span class="sr-lbl" id="fpsTitle" data-i18n="fps_label"></span>
                <div class="seg w100 sr-num-seg" role="group" aria-labelledby="fpsTitle">
                  <button type="button" data-fps="15" class="no-i18n">15</button>
                  <button type="button" data-fps="30" class="no-i18n">30</button>
                  <button type="button" data-fps="60" class="no-i18n">60</button>
                </div>
              </div>
              <div>
                <span class="sr-lbl" id="fmtTitle" data-i18n="format_label"></span>
                <div class="seg w100 sr-num-seg" role="group" aria-labelledby="fmtTitle">
                  <button type="button" data-fmt="mp4" id="fmtMp4" class="no-i18n">MP4</button>
                  <button type="button" data-fmt="webm" class="no-i18n">WebM</button>
                </div>
              </div>
            </div>
            <p class="sr-hint" data-i18n="fps_hint"></p>
            <p class="sr-hint" id="fmtHint"></p>
            <label class="check"><input type="checkbox" id="optCountdown"><span data-i18n="countdown_label"></span></label>
            <p class="small muted" id="storageLine" hidden></p>
          </div>
        </fieldset>
      </aside>

      <section class="card sr-session" aria-labelledby="sessTitle">
        <div class="row spread">
          <h2 class="mb0" id="sessTitle" data-i18n="session_title"></h2>
          <div id="dlAllRow" hidden><button class="btn btn-sm" id="dlAll" type="button" data-i18n="download_all"></button></div>
        </div>
        <p class="muted small mb0" id="sessionEmpty" data-i18n="session_empty"></p>
        <ul class="sr-list" id="sessionList"></ul>
      </section>
    </div>

    <details class="card" id="helpBox">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul class="stack">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="keys_title"></h3>
      <ul class="sr-keys small">
        <li data-i18n-html="key_r"></li>
        <li data-i18n-html="key_p"></li>
        <li data-i18n-html="key_m"></li>
        <li data-i18n-html="key_esc"></li>
      </ul>
      <p class="small muted mb0" data-i18n="keys_note"></p>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="webm-duration.js"></script>
  <script src="app.js"></script>
</body>
</html>
