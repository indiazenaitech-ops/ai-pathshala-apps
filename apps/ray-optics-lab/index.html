<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lens &amp; Mirror Ray Lab · AI Pathshala</title>
  <meta name="description" content="Drag an object in front of a concave or convex mirror or lens and watch the ray diagram, image, mirror and lens formula and NCERT tables. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- page layout ---------- */
    .rl-top, .rl-mid, .rl-bottom { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .rl-mid, .rl-bottom, .rl-help { margin-top: 16px; }
    @media (min-width: 980px) {
      .rl-top, .rl-mid { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
      .rl-bottom { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .rl-wrap .card h2 { font-size: 1.15rem; }
    .rl-lbl { font-weight: 700; font-size: .9rem; color: var(--muted); }

    /* ---------- device picker ---------- */
    .rl-devs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 620px) { .rl-devs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .rl-dev { display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 6px 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); border-radius: 10px; font: inherit; font-weight: 600; font-size: .92rem;
      cursor: pointer; text-align: start; line-height: 1.25; min-width: 0; }
    .rl-dev svg { flex: none; width: 26px; height: 34px; }
    .rl-dev:hover { background: var(--surface-2); }
    .rl-dev[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

    /* ---------- canvas ---------- */
    .rl-stage canvas { cursor: ew-resize; touch-action: pan-y; }
    .rl-stage canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .rl-note { min-height: 1.5em; margin: 8px 0 0; font-weight: 600; font-size: .88rem; color: var(--info); }
    .rl-scale { margin: 2px 0 0; }

    /* ---------- rays + sliders ---------- */
    .rl-rays { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; }
    .rl-ray { min-height: 40px; }
    .rl-ray .dot { width: 18px; height: 4px; border-radius: 2px; background: var(--col); display: inline-block; flex: none; }
    .chip.rl-ray[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--col); box-shadow: inset 0 0 0 1px var(--col); }
    .chip.rl-ray[aria-pressed="false"] { color: var(--muted); }
    .chip.rl-ray[aria-pressed="false"] .dot { background: var(--border); }
    .chip.rl-ray.rl-miss { border-style: dashed; box-shadow: none; opacity: .75; }
    .rl-sliders { display: grid; gap: 10px; margin-top: 12px; }
    .rl-sl { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; }
    .rl-sl input[type="range"] { min-height: 40px; }
    .rl-numwrap { display: inline-flex; align-items: center; gap: 4px; direction: ltr; }
    .rl-numwrap input { width: 4.8rem; font-variant-numeric: tabular-nums; }
    .rl-unit { color: var(--muted); font-size: .88rem; }
    @media (max-width: 620px) {
      .rl-sl { grid-template-columns: minmax(0, 1fr) auto auto; }
      .rl-sl label { grid-column: 1 / -1; }
      .rl-sl #far { grid-column: 1 / -1; justify-self: start; }
    }
    .rl-actions { margin-top: 12px; }
    .rl-lab:fullscreen { background: var(--bg); padding: 14px; overflow: auto; border-radius: 0; }
    .rl-lab:-webkit-full-screen { background: var(--bg); padding: 14px; overflow: auto; }

    /* ---------- results ---------- */
    .rl-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    @media (min-width: 621px) and (max-width: 979px) { .rl-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .rl-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; }
    .rl-stat .k { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; line-height: 1.3; }
    .rl-stat .val { display: block; font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr;
      unicode-bidi: isolate; text-align: start; font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; white-space: nowrap; }
    [dir="rtl"] .rl-stat .val { text-align: end; }
    .rl-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .rl-badges .badge { font-size: .92rem; padding: 4px 12px; white-space: normal; }
    .rl-pos { margin: 12px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
    .rl-pos dt { color: var(--muted); font-weight: 600; font-size: .9rem; }
    .rl-pos dd { margin: 0; font-weight: 700; }
    .rl-why { margin: 10px 0 0; padding-inline-start: 1.2rem; font-size: .92rem; }
    .rl-why li + li { margin-top: 4px; }
    .rl-results h3 { margin-top: 14px; font-size: 1rem; }
    .rl-formula { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-family: var(--mono);
      font-size: .98rem; line-height: 1.75; overflow-x: auto; text-align: left; }
    .rl-formula .fh { font-family: var(--font); font-weight: 700; color: var(--primary); font-size: .88rem; margin-top: 6px; }
    .rl-formula .fh:first-child { margin-top: 0; }
    .rl-formula .ans { font-weight: 800; color: var(--accent); }

    /* ---------- NCERT table + sign convention ---------- */
    .rl-table { min-width: 540px; }
    .rl-table tbody tr { cursor: pointer; }
    .rl-table tr.cur td { background: var(--accent-soft); font-weight: 700; }
    .rl-rowbtn { border: 0; background: none; font: inherit; font-weight: 700; color: var(--primary); cursor: pointer;
      text-align: start; padding: 6px 0; min-height: 36px; text-decoration: underline; text-underline-offset: 3px; }
    .rl-sign ul, .rl-help ul { margin: 0; padding-inline-start: 1.2rem; }
    .rl-sign li + li, .rl-help li + li { margin-top: 6px; }

    /* ---------- quiz ---------- */
    .rl-qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .rl-qtext { font-size: 1.05rem; font-weight: 600; margin: 10px 0; }
    .rl-qgrid { display: grid; gap: 10px; }
    .rl-qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .rl-qrow .rl-lbl { min-width: 9.5rem; }
    .rl-qrow select { flex: 1 1 14rem; min-width: 0; width: 100%; max-width: 100%; text-overflow: ellipsis; }
    .rl-qrow .seg { max-width: 100%; }
    .rl-quiz .seg button { min-height: 40px; }
    .rl-quiz .seg button.is-right { box-shadow: inset 0 0 0 3px var(--success); }
    .rl-quiz .seg button.is-wrong { box-shadow: inset 0 0 0 3px var(--danger); }
    .rl-quiz select.is-right { border-color: var(--success); box-shadow: 0 0 0 2px var(--success); }
    .rl-quiz select.is-wrong { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
    .rl-qbtns { margin-top: 12px; }
    #q-feedback { margin-top: 12px; }
    #q-feedback:empty { display: none; }
    #q-feedback p { margin: 0 0 4px; }
    #q-feedback p:first-child { font-weight: 700; }

    /* ---------- uses ---------- */
    .rl-use-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .rl-use { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
    .rl-use h3 { font-size: .98rem; margin: 0; display: flex; gap: 8px; align-items: center; }
    .rl-use p { margin: 0; font-size: .9rem; }
    .rl-use .btn { align-self: flex-start; margin-top: auto; }
    details.rl-help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.rl-help ul { margin-top: 12px; }

    /* ---------- print: diagram, results, formula, NCERT table, sign convention ---------- */
    .rl-print-cap { font-weight: 700; font-size: 1.1rem; margin: 0 0 8px; }
    @media print {
      /* edu.css resets only some tokens for print; keep dark-theme accents off paper too */
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
        --primary: #0b4f5c; --primary-ink: #ffffff; --accent: #c2410c; --info: #0b69a3;
        --success: #15803d; --success-soft: #dcfce7; --danger: #b42318; --danger-soft: #fee4e2;
        --warning: #a15c07; --warning-soft: #fef0c7;
      }
      .rl-stage canvas { height: auto !important; }
      .rl-top, .rl-mid { display: block; }
      .edu-intro, .rl-devs { display: none !important; }
      .rl-results, .rl-mid > .card { margin-top: 10px; }
      .rl-stage { border-color: #999; }
      .rl-table { min-width: 0; }
      .scroll-x { overflow: visible; }
      .rl-table tr.cur td { background: #eee; }
      .rl-rowbtn { color: #000; text-decoration: none; }
      .rl-formula { overflow: visible; }
    }
  </style>

<body>
  <main id="app" class="rl-wrap">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="print-only rl-print-cap" id="print-cap"></p>

    <div class="rl-top">
      <section class="card rl-lab" id="lab">
        <div class="rl-devs" role="group" id="devs" data-i18n-aria-label="dev_label">
          <button type="button" class="rl-dev" id="dev-concave_mirror" data-dev="concave_mirror" aria-pressed="true">
            <svg viewBox="0 0 26 34" aria-hidden="true"><path d="M9 2 Q19 17 9 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M15 6 l5 -4 M16 12 l5 -4 M16.5 18 l5 -4 M16 24 l5 -4 M15 30 l5 -4" stroke="currentColor" stroke-width="1.4"/></svg>
            <span data-i18n="dev_concave_mirror"></span></button>
          <button type="button" class="rl-dev" id="dev-convex_mirror" data-dev="convex_mirror" aria-pressed="false">
            <svg viewBox="0 0 26 34" aria-hidden="true"><path d="M15 2 Q5 17 15 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M16 6 l5 -4 M13 12 l5 -4 M12.5 18 l5 -4 M13 24 l5 -4 M16 30 l5 -4" stroke="currentColor" stroke-width="1.4"/></svg>
            <span data-i18n="dev_convex_mirror"></span></button>
          <button type="button" class="rl-dev" id="dev-convex_lens" data-dev="convex_lens" aria-pressed="false">
            <svg viewBox="0 0 26 34" aria-hidden="true"><path d="M13 2 Q23 17 13 32 Q3 17 13 2Z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2"/></svg>
            <span data-i18n="dev_convex_lens"></span></button>
          <button type="button" class="rl-dev" id="dev-concave_lens" data-dev="concave_lens" aria-pressed="false">
            <svg viewBox="0 0 26 34" aria-hidden="true"><path d="M6 2 H20 Q12 17 20 32 H6 Q14 17 6 2Z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2"/></svg>
            <span data-i18n="dev_concave_lens"></span></button>
        </div>

        <div class="stage rl-stage" id="stage">
          <canvas id="rl-canvas" tabindex="0" role="slider" data-i18n-aria-label="canvas_label"></canvas>
        </div>
        <p class="rl-note" id="note" aria-live="polite"></p>
        <p class="tiny muted rl-scale"><span class="no-print" data-i18n="drag_hint"></span> <span data-i18n="not_to_scale"></span></p>

        <div class="rl-rays no-print" id="rays" role="group" aria-labelledby="rays-lbl">
          <span class="rl-lbl" id="rays-lbl" data-i18n="rays_label"></span>
        </div>

        <div class="rl-sliders no-print">
          <div class="rl-sl">
            <label for="f-range" data-i18n="f_label"></label>
            <input type="range" id="f-range" min="5" max="30" step="1">
            <span class="rl-numwrap"><input type="number" id="f-num" min="5" max="30" step="1" inputmode="numeric" data-i18n-aria-label="f_label"><span class="rl-unit">cm</span></span>
          </div>
          <div class="rl-sl">
            <label for="u-range" data-i18n="u_label"></label>
            <input type="range" id="u-range" min="1" max="34" step="1">
            <span class="rl-numwrap"><input type="number" id="u-num" min="1" max="34" step="1" inputmode="numeric" data-i18n-aria-label="u_label"><span class="rl-unit">cm</span></span>
            <button type="button" class="btn btn-sm" id="far" aria-pressed="false" data-i18n="far_btn"></button>
          </div>
          <div class="rl-sl">
            <label for="h-range" data-i18n="h_label"></label>
            <input type="range" id="h-range" min="1" max="8" step="0.5">
            <span class="rl-numwrap"><input type="number" id="h-num" min="1" max="8" step="0.5" inputmode="decimal" data-i18n-aria-label="h_label"><span class="rl-unit">cm</span></span>
          </div>
        </div>

        <div class="row rl-actions no-print">
          <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          <button type="button" class="btn btn-sm" id="png-btn"><span aria-hidden="true">⬇</span> <span data-i18n="save_png"></span></button>
          <button type="button" class="btn btn-sm" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <button type="button" class="btn btn-sm btn-danger" id="reset-btn" data-i18n="reset"></button>
        </div>
      </section>

      <section class="card rl-results" id="results" aria-labelledby="res-h">
        <h2 id="res-h" data-i18n="res_h"></h2>
        <div class="rl-stats" id="stats"></div>
        <div class="rl-badges" id="badges" aria-live="polite"></div>
        <dl class="rl-pos" id="pos"></dl>
        <ul class="rl-why" id="why"></ul>
        <h3 data-i18n="form_h"></h3>
        <div class="rl-formula" id="formula" dir="ltr"></div>
      </section>
    </div>

    <div class="rl-mid">
      <section class="card rl-table-card" id="table-card" aria-labelledby="table-h">
        <h2 id="table-h"><span data-i18n="table_h"></span> <span class="badge primary" id="table-dev"></span></h2>
        <p class="small muted no-print" data-i18n="table_tip"></p>
        <div class="scroll-x">
          <table class="table rl-table" id="ncert">
            <thead><tr><th data-i18n="th_obj"></th><th data-i18n="th_img"></th><th data-i18n="th_size"></th><th data-i18n="th_nature"></th></tr></thead>
            <tbody id="ncert-body"></tbody>
          </table>
        </div>
      </section>
      <section class="card rl-sign" aria-labelledby="sign-h">
        <h2 id="sign-h" data-i18n="sign_h"></h2>
        <ul>
          <li data-i18n="sign_1"></li>
          <li data-i18n="sign_2"></li>
          <li data-i18n="sign_3"></li>
          <li data-i18n="sign_4"></li>
          <li data-i18n="sign_5"></li>
        </ul>
      </section>
    </div>

    <div class="rl-bottom no-print">
      <section class="card rl-quiz" id="quiz" aria-labelledby="quiz-h">
        <div class="rl-qhead">
          <h2 id="quiz-h" class="mb0" data-i18n="quiz_h"></h2>
          <span class="badge" id="q-score"></span>
        </div>
        <p class="rl-qtext"><span class="badge primary" id="q-dev"></span> <span id="q-text"></span></p>
        <div class="rl-qgrid">
          <div class="rl-qrow"><label class="rl-lbl" for="q-pos" data-i18n="q_pos"></label><select id="q-pos"></select></div>
          <div class="rl-qrow"><span class="rl-lbl" id="q-nat-l" data-i18n="q_nature"></span>
            <div class="seg" role="group" aria-labelledby="q-nat-l">
              <button type="button" id="q-nat-real" data-k="nat" data-v="real" data-i18n="nat_real"></button>
              <button type="button" id="q-nat-virtual" data-k="nat" data-v="virtual" data-i18n="nat_virtual"></button>
            </div></div>
          <div class="rl-qrow"><span class="rl-lbl" id="q-ori-l" data-i18n="q_orient"></span>
            <div class="seg" role="group" aria-labelledby="q-ori-l">
              <button type="button" id="q-ori-erect" data-k="ori" data-v="erect" data-i18n="nat_erect"></button>
              <button type="button" id="q-ori-inverted" data-k="ori" data-v="inverted" data-i18n="nat_inverted"></button>
            </div></div>
          <div class="rl-qrow"><span class="rl-lbl" id="q-size-l" data-i18n="q_size"></span>
            <div class="seg" role="group" aria-labelledby="q-size-l">
              <button type="button" id="q-size-big" data-k="size" data-v="big" data-i18n="size_big"></button>
              <button type="button" id="q-size-same" data-k="size" data-v="same" data-i18n="size_same"></button>
              <button type="button" id="q-size-dim" data-k="size" data-v="dim" data-i18n="size_dim"></button>
            </div></div>
        </div>
        <div class="row rl-qbtns">
          <button type="button" class="btn btn-primary" id="q-check" data-i18n="q_check"></button>
          <button type="button" class="btn" id="q-next" data-i18n="q_next"></button>
          <button type="button" class="btn btn-ghost" id="q-show" data-i18n="q_show"></button>
        </div>
        <div id="q-feedback" aria-live="polite"></div>
      </section>
