<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Class Quiz · AI Pathshala</title>
  <meta name="description" content="Host a free live quiz on the classroom projector. Students join on their phones with a 6-digit code and a nickname. Leaderboard, podium and CSV results, in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* answer colours + shapes (fixed, white text, readable in light and dark) */
    .t0 { --tc: #c62828; } .t1 { --tc: #1565c0; } .t2 { --tc: #b45309; }
    .t3 { --tc: #2e7d32; } .t4 { --tc: #6a1b9a; } .t5 { --tc: #00695c; }

    .lq-banner { margin-bottom: 14px; }
    #howto { margin-top: 18px; }
    #howto summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    #howto ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    #howto li + li { margin-top: 6px; }
    .legal-links a { font-weight: 600; }

    /* ---------- sign in ---------- */
    .signin { max-width: 640px; margin: 4px auto 0; text-align: center; padding: 28px 20px; }
    .signin-icon { font-size: 3rem; line-height: 1; margin-bottom: 10px; }
    .signin h2 { font-size: clamp(1.25rem, 3.5vw, 1.6rem); }
    .signin-btn { min-width: min(100%, 320px); gap: 10px; margin: 6px 0 4px; }
    .btn-google { background: #fff; color: #1f1f1f; border-color: #747775; }
    .btn-google:hover { background: #f1f3f4; }
    .gicon { width: 20px; height: 20px; flex: none; }
    #signinErr, #inappHint { text-align: start; margin: 12px 0 0; }

    /* ---------- dashboard ---------- */
    .dash-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .who h2 { margin: 0; overflow-wrap: anywhere; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--primary); color: var(--primary-ink); font-weight: 800; font-size: 1.2rem; flex: none; }
    .dash-acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .import-hint { margin: 2px 0 14px; }
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 16px; align-items: start; margin-bottom: 16px; }
    @media (max-width: 860px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
    .dash-card + .dash-card { margin-top: 16px; }
    .qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--border); }
    .qrow:first-child { border-top: 0; }
    .qrow.sample { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 12px; border: 0; margin-bottom: 4px; }
    .qrow.sample + .qrow, .qrow.sample + p { border-top: 0; }
    .qinfo { flex: 1 1 220px; min-width: 0; }
    .qname { font-weight: 700; overflow-wrap: anywhere; }
    .qmeta { margin-top: 2px; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; }
    .qrow .badge { vertical-align: middle; }
    #timeSeg button { min-height: 40px; }
    #settingsCard .check { display: flex; }
    .acc-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .acc-row b { overflow-wrap: anywhere; }
    .err-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .qm-item { display: flex; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .qm-item span { overflow-wrap: anywhere; }

    /* ---------- editor ---------- */
    .ed-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .qcard { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
    .qcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .qcard-head h3 { margin: 0; }
    .qcard-head .row { gap: 6px; }
    .qcard textarea { min-height: 64px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .orow { display: flex; align-items: center; gap: 8px; }
    .orow input[type="text"] { flex: 1 1 auto; min-width: 0; }
    .orow input[type="radio"] { width: 24px; height: 24px; flex: none; cursor: pointer; margin: 0; }
    .oshape { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--tc); font-size: 1rem; flex: none; }
    .orow.is-correct input[type="text"] { border-color: var(--success); box-shadow: 0 0 0 2px var(--success-soft); }
    .ed-extra { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: 10px; }
    .ed-extra textarea { min-height: 44px; }
    @media (max-width: 600px) { .ed-extra { grid-template-columns: minmax(0, 1fr); } }
    .ed-actions { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--border); }
    .ed-msg { color: var(--danger); font-weight: 700; margin: 0; }

    /* ---------- host (projector) ---------- */
    .host { display: flex; flex-direction: column; gap: 12px; }
    .hbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .htitle { font-weight: 700; font-size: 1.05rem; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
    .hcode { font-size: .85rem; }
    .hstage { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(12px, min(3vw, 3.5vh), 36px) clamp(14px, 3vw, 36px); min-height: min(62vh, 640px); display: flex; flex-direction: column; gap: clamp(10px, min(2vw, 2.4vh), 24px); font-size: clamp(1rem, 1.5vw, 1.4rem); min-width: 0; }
    .hctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .hctrl #nextBtn { min-width: min(100%, 13em); }
    @media (pointer: coarse), (max-width: 560px) { #hKeys { display: none !important; } }
    @media (max-width: 560px) { .hctrl .btn-lg { flex: 1 1 100%; } .hctrl .grow { display: none; } }
    .edu-fullscreen-on .edu-main { max-width: none; padding: 10px 18px; }
    .edu-fullscreen-on .hstage { min-height: calc(100vh - 130px); }
    .stage-title { text-align: center; font-size: clamp(1.4rem, min(3vw, 5vh), 2.4rem); margin: 0; }
    .big-msg { font-size: clamp(1.1rem, 2vw, 1.6rem); text-align: center; color: var(--muted); margin: auto 0; }

    /* lobby */
    .lobby { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 3vw, 40px); align-items: center; }
    @media (max-width: 720px) { .lobby { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
    .join-box { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .join-line { font-size: clamp(1.1rem, 2.3vw, 1.9rem); margin: 0; font-weight: 600; }
    .join-url { color: var(--primary); font-weight: 800; white-space: nowrap; unicode-bidi: isolate; }
    .join-code { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; font-size: clamp(3.2rem, min(10.5vw, 17vh), 8.5rem); font-weight: 900; letter-spacing: .05em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .qr-box { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .qr-img { width: clamp(150px, min(21vw, 36vh), 290px); aspect-ratio: 1 / 1; background: #fff; color: #333; border-radius: 14px; padding: 10px; display: grid; place-items: center; text-align: center; font-size: .9rem; box-shadow: var(--shadow); }
    .qr-img svg { width: 100%; height: 100%; display: block; }
    .qr-box figcaption { font-weight: 600; color: var(--muted); font-size: clamp(.9rem, 1.3vw, 1.1rem); }
    .demo-open { align-self: flex-start; }
    @media (max-width: 720px) { .demo-open { align-self: center; } }
    .players-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); padding-top: 14px; }
    .players-head h2 { margin: 0; font-size: clamp(1.2rem, 2.2vw, 1.8rem); }
    .lock-note { color: var(--warning); font-weight: 700; margin: 0; }
    .pchips { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; min-height: 3rem; }
    .pchip { display: inline-flex; align-items: center; gap: 4px; padding-block: 4px; padding-inline: 16px 4px; border-radius: 999px; background: var(--primary-soft); font-weight: 700; font-size: clamp(1rem, 1.7vw, 1.4rem); max-width: 100%; animation: lq-pop .35s cubic-bezier(.2, 1.4, .4, 1); }
    .pchip .pname { overflow-wrap: anywhere; }
    .pchip .kick { border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; flex: none; }
    .pchip .kick:hover, .pchip .kick:focus-visible { background: var(--danger-soft); color: var(--danger); }
    .lobby-hint { color: var(--muted); font-size: clamp(1rem, 1.7vw, 1.4rem); margin: 0; }
    @keyframes lq-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

    /* question */
    .qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .qnum { font-size: clamp(.95rem, 1.5vw, 1.2rem); padding: 4px 12px; }
    .qtext { font-size: clamp(1.3rem, min(3.2vw, 5.4vh), 2.7rem); font-weight: 800; text-align: center; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.3; }
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); }
    .tiles.n3, .tiles.n5, .tiles.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 600px) { .tiles, .tiles.n3, .tiles.n5, .tiles.n6 { grid-template-columns: minmax(0, 1fr); } }
    .tile { display: flex; align-items: center; gap: .6em; color: #fff; background: var(--tc); border-radius: 14px; padding: clamp(8px, min(1.6vw, 2vh), 20px) clamp(12px, 2vw, 24px); min-height: clamp(56px, 11vh, 130px); font-weight: 700; font-size: clamp(1.05rem, min(2.1vw, 3.6vh), 1.9rem); line-height: 1.3; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); overflow-wrap: anywhere; min-width: 0; }
    .tile .shape { font-size: 1.25em; width: 1.3em; text-align: center; flex: none; line-height: 1; }
    .ring { position: relative; width: clamp(64px, min(9vw, 14vh), 124px); aspect-ratio: 1 / 1; flex: none; }
    .ring svg { width: 100%; height: 100%; display: block; }
    .ring .rtrack { fill: none; stroke: var(--surface-2); stroke-width: 10; }
    .ring .rbar { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    .ring.low .rbar { stroke: var(--danger); }
    .ring .rnum { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Noto Sans", system-ui, sans-serif; font-weight: 900; font-size: clamp(1.5rem, 3vw, 2.7rem); font-variant-numeric: tabular-nums; }
    .ring.low .rnum { color: var(--danger); }
    .answered { text-align: center; font-size: clamp(1.1rem, 2vw, 1.7rem); font-weight: 700; color: var(--muted); margin: 0; }
    .answered.done { color: var(--success); }

    /* reveal */
    .bars { display: flex; flex-direction: column; gap: clamp(6px, min(1.2vw, 1.4vh), 14px); }
    .barrow { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(80px, 1.4fr) 3.2ch 1.4em; align-items: center; gap: 12px; padding: clamp(4px, 1vh, 8px) 12px; border-radius: 12px; border: 3px solid transparent; background: var(--surface-2); font-size: clamp(1rem, min(1.9vw, 3.2vh), 1.6rem); font-weight: 700; }
    .barrow .bshape { color: var(--tc); font-size: 1.2em; width: 1.3em; text-align: center; }
    .barrow .btext { overflow-wrap: anywhere; }
    .btrack { height: clamp(18px, 2.4vw, 30px); background: var(--surface); border-radius: 999px; overflow: hidden; }
    .bfill { display: block; height: 100%; width: 0; background: var(--tc); border-radius: inherit; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
    .bcount { text-align: end; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .barrow .tick { color: var(--success); font-size: 1.2em; text-align: center; }
    .barrow.is-correct { border-color: var(--success); background: var(--success-soft); }
    .barrow.is-wrong { opacity: .62; }
    @media (max-width: 600px) { .barrow { grid-template-columns: auto minmax(0, 1fr) auto 1.4em; } .btrack { grid-column: 1 / -1; grid-row: 2; } }
    .explain { font-size: clamp(.95rem, min(1.7vw, 2.8vh), 1.4rem); margin: 0; padding-block: 8px; }
    .explain p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

    /* leaderboard */
    .board { list-style: none; margin: 0 auto; padding: 0; display: flex; flex-direction: column; gap: 10px; width: min(100%, 880px); }
    .board li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: clamp(6px, min(1.4vw, 1.6vh), 16px) clamp(12px, 2vw, 22px); border-radius: 14px; background: var(--surface-2); font-size: clamp(1.1rem, min(2.3vw, 3.8vh), 2rem); font-weight: 700; animation: lq-slide .55s both cubic-bezier(.2, .9, .3, 1.2); animation-delay: calc(var(--i, 0) * 130ms); }
    .board li:first-child { background: var(--accent-soft); outline: 2px solid var(--accent); }
    .board .rk { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); font-size: .75em; font-family: "Noto Sans", system-ui, sans-serif; }
    .board .nm { overflow-wrap: anywhere; min-width: 0; }
    .board .plus { color: var(--success); font-size: .72em; font-family: "Noto Sans", system-ui, sans-serif; }
    .board .sc { text-align: end; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; min-width: 3.5ch; }
    .board.no-anim li { animation: none; }
    @keyframes lq-slide { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    /* final */
    .podium { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 24px); padding-top: 8px; }
    .pod { display: flex; flex-direction: column; align-items: center; gap: 6px; width: clamp(92px, 18vw, 230px); text-align: center; min-width: 0; }
    .pod.p1 { order: 2; } .pod.p2 { order: 1; } .pod.p3 { order: 3; }
    .pod .pname { font-weight: 800; font-size: clamp(1rem, 2vw, 1.6rem); overflow-wrap: anywhere; line-height: 1.25; }
    .pod .pscore { color: var(--muted); font-weight: 700; font-size: clamp(.85rem, 1.4vw, 1.1rem); }
    .pod .pblock { width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: start center; padding-top: 10px; color: #fff; font-weight: 900; font-size: clamp(1.8rem, 4vw, 3.4rem); font-family: "Noto Sans", system-ui, sans-serif; transform-origin: bottom; animation: lq-rise .8s both cubic-bezier(.2, .9, .3, 1); }
    .pod.p1 .pblock { height: clamp(110px, 21vh, 200px); background: #a87a00; animation-delay: .5s; }
    .pod.p2 .pblock { height: clamp(84px, 15vh, 150px); background: #5f6b7a; animation-delay: .25s; }
    .pod.p3 .pblock { height: clamp(64px, 11vh, 110px); background: #9a4a22; }
    .podium.no-anim .pblock { animation: none; }
    @keyframes lq-rise { from { transform: scaleY(0); } to { transform: none; } }
    .final-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .final-table { max-width: 880px; margin: 0 auto; width: 100%; }
    .final-table td:nth-child(n+3), .final-table th:nth-child(n+3) { text-align: end; }

    @media print {
      #howto, .hbar, .hctrl, .podium, .final-acts, .lq-banner, .edu-intro { display: none !important; }
      .hstage { border: 0; box-shadow: none; min-height: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" id="intro" data-i18n="intro"></p>
    <div class="callout warning lq-banner" id="demoBanner" hidden><span aria-hidden="true">🧪 </span><span data-i18n="demo_banner"></span></div>
    <div class="callout danger lq-banner" id="offlineBanner" role="status" hidden><span data-i18n="offline_banner"></span></div>

    <section id="v-loading" class="card center muted" aria-busy="true"><span data-i18n="loading"></span></section>

    <!-- signed out -->
    <section id="v-signin" hidden>
      <div class="card signin">
        <div class="signin-icon" aria-hidden="true">📡</div>
        <h2 data-i18n="signin_title"></h2>
        <p class="muted" data-i18n="signin_text"></p>
        <button class="btn btn-lg signin-btn" id="signIn" type="button"></button>
        <p class="callout warning" id="inappHint" hidden data-i18n="inapp_hint"></p>
        <div class="callout danger" id="signinErr" role="alert" hidden></div>
        <p class="small muted legal-links"><a class="lnk-privacy" href="../../legal/privacy.html" data-i18n="privacy"></a> · <a class="lnk-terms" href="../../legal/terms.html" data-i18n="terms"></a></p>
      </div>
    </section>

    <!-- dashboard -->
    <section id="v-dash" hidden>
      <div class="dash-top">
        <div class="who"><span class="avatar" id="avatar" aria-hidden="true"></span><h2 id="hello"></h2></div>
        <div class="dash-acts">
          <button class="btn btn-primary" id="newQuiz" type="button"><span aria-hidden="true">+</span><span data-i18n="new_quiz"></span></button>
          <button class="btn" id="importQm" type="button"><span aria-hidden="true">❓</span><span data-i18n="import_qm"></span></button>
          <button class="btn" id="importFile" type="button"><span aria-hidden="true">📄</span><span data-i18n="import_file"></span></button>
        </div>
      </div>
      <p class="tiny muted import-hint" data-i18n="import_hint"></p>
      <div class="dash-grid">
        <section class="card stack" id="quizCard">
          <h2 data-i18n="my_quizzes"></h2>
          <div id="quizList" aria-live="polite"></div>
        </section>
        <div>
          <section class="card stack dash-card" id="settingsCard">
            <h3 data-i18n="settings_title"></h3>
            <div class="field"><span data-i18n="time_per_q"></span><div class="seg" id="timeSeg" role="group"></div></div>
            <label class="check"><input type="checkbox" id="shufQ"><span data-i18n="shuffle_q"></span></label>
            <label class="check"><input type="checkbox" id="shufO"><span data-i18n="shuffle_o"></span></label>
          </section>
          <section class="card stack dash-card" id="accountCard">
            <h3 data-i18n="account"></h3>
            <div class="acc-row"><span class="avatar" id="avatar2" aria-hidden="true"></span><div><b id="accName"></b><div class="small muted no-i18n" id="accEmail"></div></div></div>
            <p class="small muted mb0" id="dataNote"></p>
            <div class="row">
              <button class="btn" id="signOut" type="button" data-i18n="sign_out"></button>
              <button class="btn btn-danger" id="deleteAccount" type="button" data-i18n="delete_account"></button>
            </div>
            <p class="small mb0 legal-links"><a class="lnk-privacy" href="../../legal/privacy.html" data-i18n="privacy"></a> · <a class="lnk-terms" href="../../legal/terms.html" data-i18n="terms"></a></p>
          </section>
        </div>
      </div>
      <section class="card stack" id="sessCard">
        <h2 data-i18n="past_sessions"></h2>
        <p class="small muted mb0" data-i18n="keep_note"></p>
        <div id="sessList" aria-live="polite"></div>
      </section>
    </section>

    <!-- quiz editor (built by app.js) -->
    <section id="v-edit" hidden></section>

    <!-- host a live session: projector first -->
    <section id="v-host" hidden>
      <div class="host" id="host">
        <div class="hbar">
          <span class="htitle no-i18n" id="hTitle"></span>
          <span class="badge primary hcode" id="hCode"></span>
          <span class="grow"></span>
          <button class="btn btn-sm" id="fsBtn" type="button"><span aria-hidden="true">⛶</span><span data-i18n="fullscreen"></span></button>
          <button class="btn btn-sm" id="hBack" type="button" data-i18n="back_dash"></button>
        </div>
        <div class="callout danger" id="hMsg" role="alert" hidden></div>
        <div class="hstage" id="hStage" aria-live="polite"></div>
        <div class="hctrl">
          <span class="small muted" id="hKeys" data-i18n="keys_hint"></span>
          <span class="grow"></span>
          <button class="btn btn-danger" id="endBtn" type="button" data-i18n="end_quiz" hidden></button>
          <button class="btn" id="skipBtn" type="button" data-i18n="skip_q" hidden></button>
          <button class="btn btn-primary btn-lg" id="nextBtn" type="button"></button>
        </div>
      </div>
    </section>

    <!-- results of a past session (built by app.js) -->
    <section id="v-results" hidden></section>

    <details class="card" id="howto">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="../../shared/firebase-config.js"></script>
  <script src="../../shared/cloud-mock.js"></script>
  <script src="../../shared/cloud.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
