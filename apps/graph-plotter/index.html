<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph Plotter · AI Pathshala</title>
  <meta name="description" content="Plot y = f(x), move sliders, and find zeroes, intersections and turning points. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- layout: phones = graph first; laptops = editor | graph ---------- */
    .gp { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .gp-col { display: contents; }
    .gp-graph { order: 1; } .gp-fns { order: 2; } .gp-params { order: 3; } .gp-points { order: 4; } .gp-presets { order: 5; }
    @media (min-width: 980px) {
      .gp { grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); }
      .gp-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .gp-col > .card { order: 0; }
    }
    .gp .card { padding: 14px; }
    .gp .card h2 { font-size: 1.1rem; margin: 0; }
    .gp-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .below { margin-top: 14px; }

    /* ---------- graph card ---------- */
    .gp-toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
    .gp-toolbar .grow { flex: 1 1 0; min-width: 0; }
    .gp-toolbar .btn { min-height: 40px; }
    .gp-icon { min-width: 42px; font-size: 1.25rem; padding-inline: 10px; }
    .gp-stage { background: var(--surface); }
    .gp-stage canvas { cursor: crosshair; }
    .gp-stage canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .gp-under { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }
    .gp-under .lbl { font-size: .88rem; color: var(--muted); font-weight: 600; }
    .gp-under .seg button { min-height: 40px; }
    .gp-readout { margin: 10px 0 0; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-2);
      font-weight: 600; min-height: 2.6em; display: flex; align-items: center; font-variant-numeric: tabular-nums; }
    .gp-graph:fullscreen { background: var(--bg); padding: 14px; overflow: auto; border-radius: 0; }
    .gp-graph:-webkit-full-screen { background: var(--bg); padding: 14px; overflow: auto; }
    .gp-graph:fullscreen .gp-readout { font-size: 1.25rem; }

    /* ---------- function list ---------- */
    .gp-fn { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center;
      padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .gp-fn + .gp-fn { margin-top: 8px; }
    .gp-fn.is-off { background: var(--surface-2); }
    .gp-fn.is-off .gp-in { color: var(--muted); }
    .gp-swatch { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
      display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
    .gp-swatch span { width: 20px; height: 20px; border-radius: 999px; border: 4px solid var(--col); background: var(--col); display: block; }
    .gp-swatch[aria-pressed="false"] span { background: transparent; }
    .gp-name { font-family: var(--mono); font-weight: 700; font-size: 1rem; white-space: nowrap; direction: ltr; }
    .gp-in { width: 100%; font-family: var(--mono); font-size: 1.05rem; direction: ltr; text-align: left; }
    .gp-in[aria-invalid="true"] { border-color: var(--danger); outline-color: var(--danger); }
    .gp-del { min-width: 40px; min-height: 40px; }
    .gp-msg { grid-column: 1 / -1; margin: 0; font-size: .88rem; }
    .gp-msg.err { color: var(--danger); font-weight: 600; }
    .gp-msg:empty { display: none; }
    .gp-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; direction: ltr; }
    .gp-keys button { min-width: 44px; min-height: 40px; font-family: var(--mono); font-size: 1rem; padding: 6px 9px; }

    /* ---------- sliders ---------- */
    .gp-param { display: grid; grid-template-columns: 2rem minmax(0, 1fr) 6.2rem; gap: 10px; align-items: center; }
    .gp-param + .gp-param { margin-top: 8px; }
    .gp-param .pname { font-family: var(--mono); font-size: 1.35rem; font-weight: 800; text-align: center; }
    .gp-param input[type="range"] { min-height: 40px; }
    .gp-param input[type="number"] { width: 100%; font-family: var(--mono); text-align: start; }
    .gp-param.unused .pname { color: var(--muted); }

    /* ---------- presets / notes ---------- */
    .gp-presets .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .gp-presets .chip { min-height: 40px; }
    .gp-note { margin-top: 12px; }

    /* ---------- tables ---------- */
    .gp-dot { display: inline-block; width: 12px; height: 12px; border-radius: 999px; background: var(--col); margin-inline-end: 6px; vertical-align: -1px; }
    .gp-dot.ring { background: transparent; border: 3px solid var(--col); }
    .gp-dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(.85); }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
    .gp-points .table td, .gp-points .table th { padding: 6px 8px; }
    .gp-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; }
    .gp-checks .check { min-height: 36px; }
    .gp-tv-form { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
    @media (max-width: 620px) { .gp-tv-form { grid-template-columns: repeat(3, minmax(0, 1fr)); } .gp-tv-form .field-fn { grid-column: 1 / -1; } }
    .gp-tv-form input, .gp-tv-form select { width: 100%; }
    .gp-tv-wrap { max-height: 420px; overflow: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .gp-tv-wrap .table th { text-align: center; }
    .gp-tv-wrap .table td { text-align: center; }
    .gp-tv-wrap .undef { color: var(--muted); font-style: italic; font-family: var(--font); }

    /* ---------- syllabus links ---------- */
    .gp-learn-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    @media (min-width: 1180px) { .gp-learn-list { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .gp-learn-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
    .gp-learn-item h3 { font-size: 1rem; margin: 0; color: var(--primary); }
    .gp-learn-item p { margin: 0; font-size: .93rem; }
    .gp-learn-item .btn { align-self: flex-start; margin-top: auto; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.2rem; }
    details.card li + li { margin-top: 6px; }

    @media print {
      .gp { display: block; }
      .gp-col { display: block; }
      .gp-fns, .gp-params, .gp-presets, .gp-toolbar, .gp-under, .gp-learn, details.card, .gp-checks, .gp-tv-form, .gp-readout { display: none !important; }
      .gp-graph, .gp-points, .gp-table { margin-top: 10px; }
      .gp-stage { border-color: #999; }
      .gp-stage canvas { height: auto !important; }   /* keep the graph's shape when the paper is narrower than the screen */
      .gp-tv-wrap { max-height: none; overflow: visible; }
      .edu-intro { display: none; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="gp" id="gp">
      <div class="gp-col gp-col-a">
        <!-- functions -->
        <section class="card gp-fns" aria-labelledby="fns-h">
          <div class="gp-head">
            <h2 id="fns-h" data-i18n="functions_h"></h2>
            <div class="row" style="gap:6px">
              <button class="btn btn-sm btn-primary" id="add-fn" type="button">+ <span data-i18n="add_fn"></span></button>
              <button class="btn btn-sm btn-danger" id="reset-all" type="button" data-i18n="reset"></button>
            </div>
          </div>
          <div id="fn-list"></div>
          <div class="gp-keys no-i18n" id="keys" role="group" data-i18n-aria-label="keypad_label"></div>
          <p class="tiny muted mb0" style="margin-top:10px" data-i18n="syntax_hint"></p>
        </section>

        <!-- sliders -->
        <section class="card gp-params" aria-labelledby="params-h">
          <h2 id="params-h" data-i18n="params_h" style="margin-bottom:6px"></h2>
          <p class="small muted" data-i18n="params_hint"></p>
          <div id="params"></div>
        </section>

        <!-- ready examples -->
        <section class="card gp-presets" aria-labelledby="presets-h">
          <h2 id="presets-h" data-i18n="presets_h" style="margin-bottom:10px"></h2>
          <div class="chips" id="presets"></div>
          <div class="callout gp-note" id="note" aria-live="polite" hidden></div>
        </section>
      </div>

      <div class="gp-col gp-col-b">
        <!-- graph -->
        <section class="card gp-graph" id="graph-card">
          <div class="gp-toolbar">
            <button class="btn gp-icon" id="zoom-in" type="button" data-i18n-title="zoom_in" data-i18n-aria-label="zoom_in">+</button>
            <button class="btn gp-icon" id="zoom-out" type="button" data-i18n-title="zoom_out" data-i18n-aria-label="zoom_out">−</button>
            <button class="btn" id="reset-view" type="button" data-i18n="reset_view"></button>
            <span class="grow"></span>
            <button class="btn gp-icon" id="fs-btn" type="button" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
            <button class="btn" id="save-png" type="button" data-i18n="save_png"></button>
            <button class="btn" id="share-btn" type="button" data-i18n="share_link"></button>
          </div>
          <div class="stage gp-stage" id="stage">
            <canvas id="plot" dir="ltr" tabindex="0" role="img" data-i18n-aria-label="graph_aria"></canvas>
          </div>
          <div class="gp-under">
            <span class="lbl" id="angle-lbl" data-i18n="angle_label"></span>
            <div class="seg" role="group" aria-labelledby="angle-lbl">
              <button type="button" id="mode-rad" aria-pressed="true" data-i18n="radians"></button>
              <button type="button" id="mode-deg" aria-pressed="false" data-i18n="degrees"></button>
            </div>
            <label class="check"><input type="checkbox" id="pi-axis"> <span data-i18n="pi_axis"></span></label>
          </div>
          <p class="gp-readout" id="readout" aria-live="polite"></p>
        </section>

        <!-- special points -->
        <section class="card gp-points" aria-labelledby="points-h">
          <h2 id="points-h" data-i18n="points_h" style="margin-bottom:6px"></h2>
          <p class="small muted" data-i18n="points_hint"></p>
          <div class="gp-checks">
            <label class="check"><input type="checkbox" id="show-roots"> <span class="gp-dot" style="--col:var(--text)"></span><span data-i18n="show_roots"></span></label>
            <label class="check"><input type="checkbox" id="show-inter"> <span class="gp-dot ring" style="--col:var(--text)"></span><span data-i18n="show_inter"></span></label>
            <label class="check"><input type="checkbox" id="show-turn"> <span class="gp-dot diamond" style="--col:var(--text)"></span><span data-i18n="show_turn"></span></label>
          </div>
          <div class="scroll-x">
            <table class="table" id="points-table">
              <thead><tr><th data-i18n="col_point"></th><th class="num">x</th><th class="num">y</th></tr></thead>
              <tbody id="points-body"></tbody>
            </table>
          </div>
          <p class="small muted mb0" id="points-note" aria-live="polite"></p>
        </section>
      </div>
    </div>

    <!-- table of values -->
    <section class="card gp-table below" aria-labelledby="tv-h">
      <div class="gp-head">
        <h2 id="tv-h" data-i18n="table_h"></h2>
        <div class="row no-print" style="gap:6px">
          <button class="btn btn-sm" id="tv-csv" type="button" data-i18n="tv_csv"></button>
          <button class="btn btn-sm" id="tv-print" type="button" data-i18n="print"></button>
        </div>
      </div>
      <div class="gp-tv-form">
        <label class="field field-fn"><span data-i18n="tv_fn"></span><select id="tv-fn" class="no-i18n"></select></label>
        <label class="field"><span data-i18n="tv_from"></span><input type="number" id="tv-from" dir="ltr" step="any" inputmode="decimal"></label>
        <label class="field"><span data-i18n="tv_to"></span><input type="number" id="tv-to" dir="ltr" step="any" inputmode="decimal"></label>
        <label class="field"><span data-i18n="tv_step"></span><input type="number" id="tv-step" dir="ltr" step="any" min="0" inputmode="decimal"></label>
      </div>
      <div class="gp-tv-wrap" id="tv-wrap">
        <table class="table" id="tv-table">
          <thead><tr><th class="num">x</th><th class="num" id="tv-head-y">y</th></tr></thead>
          <tbody id="tv-body"></tbody>
        </table>
      </div>
      <p class="small muted mb0" id="tv-note" aria-live="polite" style="margin-top:8px"></p>
    </section>

    <!-- syllabus links -->
    <section class="card gp-learn below" aria-labelledby="learn-h">
      <h2 id="learn-h" data-i18n="learn_h"></h2>
      <div class="gp-learn-list" id="learn"></div>
    </section>

    <details class="card below">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <p class="tiny muted mb0" style="margin-top:10px" data-i18n="saved_local"></p>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="parser.js"></script>
  <script src="maths.js"></script>
  <script src="plot.js"></script>
  <script src="app.js"></script>
</body>
