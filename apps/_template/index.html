<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App · AI Pathshala</title>
  <meta name="description" content="A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* app-specific styles only; use tokens from edu.css and logical properties */
    .counter { font-size: 3rem; font-weight: 800; }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <section class="card stack">
      <div class="counter" id="count" aria-live="polite"></div>
      <div class="row">
        <button class="btn btn-primary" id="plus" data-i18n="add_one"></button>
        <button class="btn" id="say" data-i18n="say_it"></button>
        <button class="btn btn-danger" id="reset" data-i18n="reset"></button>
      </div>
      <p class="muted small" id="status"></p>
    </section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
