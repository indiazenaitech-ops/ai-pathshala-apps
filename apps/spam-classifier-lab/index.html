<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spam Classifier Lab · AI Pathshala</title>
  <meta name="description" content="Train a Naive Bayes spam filter on 40 SMS messages, see every step of the maths word by word (Laplace smoothing, log-odds, confusion matrix), then try to fool it. A free classroom app from AI Pathshala for CBSE AI.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* class colours reuse theme tokens so they work in light and dark mode */
    :root { --spam: var(--danger); --ham: var(--success); }
    .intro-row { align-items: flex-start; margin-bottom: 14px; }
    .intro-row .edu-intro { flex: 1 1 320px; margin: 0; }
    #app > * + * { margin-top: 16px; }
    .card h2 { display: flex; align-items: center; gap: 10px; }
    .card h2 > span:not(.step-no) { flex: 1 1 auto; min-width: 0; }
    .step-no { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.05rem; flex: none; }
    .lbl { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
    .mb0 { margin-bottom: 0; }
    .print-title { display: none; }
    button.chip { font-family: inherit; }
    details > summary { cursor: pointer; font-weight: 700; min-height: 32px; padding: 4px 0; }
    details.card > summary { font-size: 1.1rem; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.3em; }
    details.card li + li { margin-top: 8px; }
    .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
    /* User text keeps its own writing direction inside any UI language */
    .msg-text, #msg, #add-input, .ev-word, .peek td.w, .maths td.w, .mist-text, #peek-filter { unicode-bidi: plaintext; }

    /* ---------- 1. check ---------- */
    #msg { width: 100%; font-size: 1.15rem; min-height: 3.4em; resize: vertical; line-height: 1.45; }
    .tries { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tries .chip { min-height: 38px; }
    .verdict { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--radius); border: 2px solid var(--vc, var(--border)); background: color-mix(in srgb, var(--vc, var(--border)) 14%, var(--surface)); }
    .verdict[data-label="spam"] { --vc: var(--spam); }
    .verdict[data-label="ham"] { --vc: var(--ham); }
    .verdict[data-label="tie"] { --vc: var(--warning); }
    .v-icon { font-size: 2.6rem; line-height: 1; flex: none; }
    .v-name { font-size: 1.7rem; font-weight: 800; line-height: 1.15; color: var(--vc, var(--text)); letter-spacing: .01em; }
    .v-sure { color: var(--muted); font-weight: 600; margin-top: 2px; }
    .pbars { display: grid; gap: 7px; }
    .pbar-row { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr) 3.6rem; gap: 10px; align-items: center; }
    .pbar-lab { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pbar { height: 18px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .pbar > span { display: block; height: 100%; width: 0; background: var(--bc); border-radius: inherit; transition: width .3s ease; }
    .pbar.spam { --bc: var(--spam); } .pbar.ham { --bc: var(--ham); }
    .pbar-pct { text-align: end; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ev-list { display: grid; gap: 5px; }
    .ev-row { display: grid; grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr) minmax(0, 8.5rem); gap: 10px; align-items: center; font-size: .95rem; }
    .ev-word { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev-word small { color: var(--muted); font-weight: 600; }
    .ev-track { position: relative; height: 16px; background: var(--surface-2); border-radius: 6px; border: 1px solid var(--border); }
    .ev-track::before { content: ""; position: absolute; top: -3px; bottom: -3px; inset-inline-start: 50%; width: 2px; margin-inline-start: -1px; background: var(--muted); opacity: .6; }
    .ev-fill { position: absolute; top: 0; bottom: 0; background: var(--fc); border-radius: 4px; }
    .ev-fill.spam { --fc: var(--spam); inset-inline-start: 50%; }
    .ev-fill.ham { --fc: var(--ham); inset-inline-end: 50%; }
    .ev-val { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .ev-row.spam .ev-val { color: var(--spam); } .ev-row.ham .ev-val { color: var(--ham); }
    .ev-row.unk .ev-word { color: var(--muted); font-weight: 600; }
    .ev-row.unk .ev-track { opacity: .45; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
    .legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 5px; background: var(--sc, var(--border)); }
    .maths-step { font-weight: 600; margin: 0; }
    .maths-step b { color: var(--accent); }
    .formula { font-family: var(--mono); font-size: .88rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; direction: ltr; text-align: start; unicode-bidi: isolate; display: block; }
    :root[lang="ur"] .formula { font-family: var(--mono); line-height: 1.6; }
    .maths th { vertical-align: bottom; white-space: normal; }
    .maths td { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .maths td.w { font-weight: 700; }
    .maths td .frac { color: var(--muted); font-size: .82rem; display: block; direction: ltr; unicode-bidi: isolate; }
    .push { display: inline-block; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--pc, var(--border)) 20%, transparent); color: var(--pc, var(--muted)); font-size: .85rem; white-space: nowrap; }
    .push.spam { --pc: var(--spam); } .push.ham { --pc: var(--ham); }
    .score-box { display: grid; gap: 8px; }
    .score-row { background: var(--surface-2); border-inline-start: 5px solid var(--sc); border-radius: var(--radius-sm); padding: 8px 12px; font-size: .95rem; }
    .score-row.spam { --sc: var(--spam); } .score-row.ham { --sc: var(--ham); }
    .score-row .k { font-weight: 800; }
    .score-row .chain { display: block; font-family: var(--mono); font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; direction: ltr; text-align: start; unicode-bidi: isolate; margin-top: 2px; }
    .final { font-size: 1.1rem; font-weight: 800; }

    /* ---------- 2. teach ---------- */
    .labs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
    .lab-card { border: 1px solid var(--border); border-top: 5px solid var(--lc); border-radius: var(--radius); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .lab-card.spam { --lc: var(--spam); } .lab-card.ham { --lc: var(--ham); }
    .lab-head { display: flex; align-items: center; gap: 8px; }
    .lab-emoji { font-size: 1.4rem; flex: none; }
    .lab-name { flex: 1 1 auto; min-width: 0; font-weight: 800; font-size: 1.1rem; }
    .lab-count { font-weight: 700; color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .msg-list { list-style: none; margin: 0; padding: 0; max-height: 17rem; overflow-y: auto; border-radius: var(--radius-sm); background: var(--surface-2); }
    .msg-list li { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; padding-inline: 10px 6px; border-bottom: 1px solid var(--border); font-size: .92rem; line-height: 1.4; }
    .msg-list li:last-child { border-bottom: 0; }
    .msg-list li.fresh { animation: sc-flash 1.2s ease-out; }
    @keyframes sc-flash { from { background: color-mix(in srgb, var(--lc) 30%, transparent); } to { background: transparent; } }
    .msg-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .msg-list .badge { flex: none; }
    .msg-del { flex: none; border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    .msg-del:hover, .msg-del:focus-visible { background: var(--danger-soft); color: var(--danger); }
    .msg-empty { padding: 14px 10px; color: var(--muted); font-size: .9rem; }
    .add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .add-row .seg button { min-height: 40px; }
    .add-row input { flex: 1 1 200px; min-width: 0; }
    .add-row .btn { white-space: nowrap; }
    .data-tools { justify-content: space-between; }
    .exp { display: flex; flex-direction: column; gap: 10px; }
    .exp h3 { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 1.05rem; }
    .exp p { margin: 0; }
    .exp-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .ba { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 6px; }
    .ba-row { display: grid; grid-template-columns: minmax(4.5rem, auto) minmax(0, 1fr); gap: 8px; align-items: center; font-size: .92rem; }
    .ba-k { color: var(--muted); font-weight: 700; }
    .ba-v { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
    .sbar { display: flex; flex: 1 1 110px; height: 14px; min-width: 90px; border-radius: 999px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
    .sbar > span { display: block; height: 100%; background: var(--spam); }
    .ba-msg { font-size: .9rem; }
    .tricky-q { font-style: italic; }

    /* ---------- 3. fair test ---------- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 118px), 1fr)); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; min-width: 0; }
    .stat b { display: block; font-size: 1.6rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .stat span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
    .eval-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .eval-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
    .cm { border-collapse: separate; border-spacing: 5px; width: 100%; table-layout: fixed; }
    .cm th { font-size: .82rem; font-weight: 700; color: var(--muted); padding: 2px 4px; text-align: center; vertical-align: bottom; line-height: 1.3; }
    .cm th.rowh { text-align: start; vertical-align: middle; width: 24%; }
    .cm th .lbl2 { display: block; color: var(--text); font-weight: 800; }
    .cm td.cell { border: 2px solid var(--k); background: color-mix(in srgb, var(--k) 11%, var(--surface)); border-radius: 12px; padding: 8px 10px; vertical-align: top; }
    .cm td.good { --k: var(--ham); } .cm td.bad { --k: var(--spam); }
    .cm .cnt { font-size: clamp(1.6rem, 3.2vw, 2.3rem); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; display: block; }
    .cm .cell-name { font-weight: 700; font-size: .82rem; line-height: 1.3; display: block; margin-top: 2px; }
    .cm .abbr { font-weight: 800; color: var(--k); font-size: .85rem; }
    .pr-lines { display: grid; gap: 6px; font-size: .92rem; }
    .pr-lines b { font-variant-numeric: tabular-nums; }
    .mist-list { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .mist-list li { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; font-size: .92rem; display: grid; gap: 4px; }
    .mist-text { font-weight: 600; overflow-wrap: anywhere; }
    .mist-meta { color: var(--muted); }
    .mist-list .btn { justify-self: start; }

    /* ---------- 4. peek ---------- */
    .peek-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .peek-tools input { flex: 1 1 140px; max-width: 240px; }
    .peek-tools .seg button { min-height: 40px; }
    .peek td.n, .peek th.n { text-align: end; font-variant-numeric: tabular-nums; }
    .peek td.w { font-weight: 600; white-space: nowrap; }
    .peek th { white-space: normal; vertical-align: bottom; }
    .peek .zero { color: var(--muted); opacity: .6; }

    /* ---------- 5. inside ---------- */
    .inside-grid .panel h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; }
    .inside-grid .panel p { margin: 0; }
    .inside-grid .formula { margin-top: 8px; }

    /* ---------- projector / phone / RTL ---------- */
    .present #msg { font-size: 1.5rem; }
    .present .v-name { font-size: 2.3rem; }
    .present .v-icon { font-size: 3.4rem; }
    .present .ev-row { font-size: 1.15rem; }
    .present .ev-track { height: 22px; }
    .present .msg-list li { font-size: 1.1rem; }
    .present .stat b { font-size: 2rem; }
    .present .maths, .present .peek { font-size: 1.05rem; }
    .edu-fullscreen-on #help, .edu-fullscreen-on .edu-intro { display: none; }
    @media (max-width: 560px) {
      .pbar-row { grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) 3.2rem; gap: 8px; }
      .ev-row { grid-template-columns: minmax(0, 6rem) minmax(0, 1fr) minmax(0, 5.6rem); gap: 6px; font-size: .9rem; }
      .ev-val { font-size: .76rem; }
      .v-icon { font-size: 2.1rem; }
      .v-name { font-size: 1.4rem; }
      .stat b { font-size: 1.35rem; }
      .peek th, .peek td, .maths th, .maths td { padding: 6px 7px; }
      .maths, .peek { font-size: .84rem; }
      .cm { border-spacing: 3px; }
      .cm th { font-size: .74rem; padding: 2px; }
      .cm th.rowh { width: 22%; }
      .cm td.cell { padding: 6px 6px; }
      .cm .cell-name { font-size: .74rem; }
      .present .ev-row { font-size: 1rem; }
    }
    [dir="rtl"] .flip { display: inline-block; transform: scaleX(-1); }
    /* Nastaliq needs taller lines so wrapped headings do not overlap */
    :root[lang="ur"] #app h2, :root[lang="ur"] #app h3, :root[lang="ur"] details > summary { line-height: 2.05; }
    :root[lang="ur"] .v-name { line-height: 1.7; }
    :root[lang="ur"] .msg-list li, :root[lang="ur"] .mist-list li { line-height: 1.9; }
    @media (prefers-reduced-motion: reduce) {
      .msg-list li.fresh { animation: none; }
      .pbar > span { transition: none; }
    }

    @media print {
      .print-title { display: block; font-size: 1.5rem; margin-bottom: 6px; }
      #app > * + * { margin-top: 10px; }
      .msg-list { max-height: none; overflow: visible; background: none; }
      .msg-list li { padding: 2px 4px; }
      .lab-card, .stat, .panel, .verdict, .score-row, .mist-list li { background: none !important; }
      #help, #exp, .no-print, details:not([open]) { display: none !important; }
      .msg-del { display: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <h1 class="print-title" data-i18n="app_title"></h1>
    <div class="row spread intro-row">
      <p class="edu-intro" data-i18n="intro"></p>
      <div class="row no-print">
        <button type="button" class="btn btn-sm" id="proj-btn" aria-pressed="false"><span aria-hidden="true">📽️ </span><span data-i18n="projector"></span></button>
        <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
        <button type="button" class="btn btn-sm btn-danger" id="reset-btn" data-i18n="reset"></button>
      </div>
    </div>

    <!-- 1. Check a message -->
    <section class="card stack" id="check-card">
      <h2><span class="step-no" aria-hidden="true">1</span><span data-i18n="step1"></span></h2>
      <div>
        <label for="msg" class="lbl" data-i18n="msg_label"></label>
        <textarea id="msg" class="no-i18n" rows="2" maxlength="300" autocomplete="off" spellcheck="false" data-i18n-placeholder="msg_ph"></textarea>
      </div>
      <div class="tries no-print" id="tries-wrap">
        <span class="lbl mb0" data-i18n="try_t"></span>
        <button type="button" class="chip try-chip" data-kind="spam" data-i18n="try_spam"></button>
        <button type="button" class="chip try-chip" data-kind="ham" data-i18n="try_ham"></button>
        <button type="button" class="chip try-chip" data-kind="tricky" data-i18n="try_tricky"></button>
        <button type="button" class="chip" id="msg-clear" data-i18n="clear"></button>
      </div>
      <p class="callout small mb0" id="check-status" hidden></p>
      <div id="result" class="stack" aria-live="polite">
        <div class="verdict" id="verdict" data-label="" data-p="">
          <div class="v-icon" id="v-icon" aria-hidden="true"></div>
          <div class="v-main"><div class="v-name" id="v-name"></div><div class="v-sure" id="v-sure"></div></div>
        </div>
        <div class="pbars">
          <div class="pbar-row"><span class="pbar-lab" data-i18n="chance_spam"></span><div class="pbar spam"><span id="pbar-spam"></span></div><b class="pbar-pct num" id="p-spam"></b></div>
          <div class="pbar-row"><span class="pbar-lab" data-i18n="chance_ham"></span><div class="pbar ham"><span id="pbar-ham"></span></div><b class="pbar-pct num" id="p-ham"></b></div>
        </div>
      </div>
      <div id="explain" class="stack">
        <h3 class="mb0" data-i18n="evidence_t"></h3>
        <p class="muted small mb0" data-i18n="evidence_hint"></p>
        <div class="ev-list no-i18n" id="bars"></div>
        <div class="legend">
          <span><span class="sw" style="--sc: var(--spam)"></span><span data-i18n="lbl_spam"></span></span>
          <span><span class="sw" style="--sc: var(--ham)"></span><span data-i18n="lbl_ham"></span></span>
          <span><span class="sw" style="--sc: var(--border)"></span><span data-i18n="new_word"></span></span>
        </div>
        <details id="maths" open>
          <summary data-i18n="maths_t"></summary>
          <div class="stack" id="maths-body"></div>
        </details>
      </div>
      <p class="muted tiny mb0" data-i18n="privacy"></p>
    </section>

    <!-- 2. Teach it -->
    <section class="card stack" id="data-card">
      <h2><span class="step-no" aria-hidden="true">2</span><span data-i18n="step2"></span></h2>
      <p class="muted small mb0" data-i18n="step2_hint"></p>
      <div class="labs">
        <div class="lab-card spam">
          <div class="lab-head"><span class="lab-emoji" aria-hidden="true">🚫</span><span class="lab-name" data-i18n="lbl_spam"></span><span class="lab-count" id="cnt-spam" data-n="0"></span></div>
          <ul class="msg-list no-i18n" id="list-spam"></ul>
        </div>
        <div class="lab-card ham">
          <div class="lab-head"><span class="lab-emoji" aria-hidden="true">✅</span><span class="lab-name" data-i18n="lbl_ham"></span><span class="lab-count" id="cnt-ham" data-n="0"></span></div>
          <ul class="msg-list no-i18n" id="list-ham"></ul>
        </div>
      </div>
      <div class="no-print">
        <label for="add-input" class="lbl" data-i18n="add_as"></label>
        <div class="add-row">
          <div class="seg" role="group" data-i18n-aria-label="add_as">
            <button type="button" id="add-spam" aria-pressed="true" data-i18n="lbl_spam"></button>
            <button type="button" id="add-ham" aria-pressed="false" data-i18n="lbl_ham"></button>
          </div>
          <input type="text" id="add-input" class="no-i18n" maxlength="300" autocomplete="off" spellcheck="false" data-i18n-placeholder="add_ph">
          <button type="button" class="btn btn-primary" id="add-btn" data-i18n="add"></button>
        </div>
      </div>
      <div class="row data-tools no-print">
        <button type="button" class="btn btn-accent" id="samples-btn" data-i18n="load_samples"></button>
        <div class="row">
          <button type="button" class="btn btn-sm" id="import-btn" data-i18n="import_csv"></button>
          <button type="button" class="btn btn-sm" id="export-btn" data-i18n="export_csv"></button>
          <button type="button" class="btn btn-sm btn-danger" id="clear-btn" data-i18n="clear_all"></button>
        </div>
      </div>
      <p class="muted tiny mb0 no-print" data-i18n="samples_note"></p>
      <p class="muted tiny mb0 no-print" data-i18n="csv_hint"></p>
      <div class="panel exp" id="exp">
        <h3><span aria-hidden="true">🎯</span><span data-i18n="exp_t"></span></h3>
        <p class="small" data-i18n="exp_d"></p>
        <p class="small tricky-q no-i18n" id="exp-msg"></p>
        <div class="exp-btns">
          <button type="button" class="btn btn-accent" id="exp-btn" data-i18n="exp_btn"></button>
          <button type="button" class="btn" id="undo-btn" hidden><span class="flip" aria-hidden="true">↩ </span><span data-i18n="undo_exp"></span></button>
        </div>
        <div id="exp-res" aria-live="polite"></div>
      </div>
    </section>

    <!-- 3. How good is it? -->
    <section class="card stack" id="eval-card">
      <h2><span class="step-no" aria-hidden="true">3</span><span data-i18n="step3"></span></h2>
      <label class="check no-print"><input type="checkbox" id="holdout-chk"><span data-i18n="holdout_label"></span></label>
      <div class="stats">
        <div class="stat"><b id="st-train">0</b><span data-i18n="st_train"></span></div>
        <div class="stat"><b id="st-test">0</b><span data-i18n="st_test"></span></div>
        <div class="stat"><b id="st-vocab">0</b><span data-i18n="st_vocab"></span></div>
        <div class="stat"><b id="st-acc" data-v="">–</b><span data-i18n="st_acc"></span></div>
      </div>
      <p class="callout warning small mb0" id="cheat-note" data-i18n="cheat_note" hidden></p>
      <p class="callout small mb0" id="acc-none" data-i18n="acc_none" hidden></p>
      <div class="eval-grid" id="eval-grid">
        <div class="stack">
          <h3 class="mb0" data-i18n="cm_t"></h3>
          <table class="cm" id="cm">
            <thead>
              <tr>
                <th></th>
                <th><span data-i18n="cm_said"></span><span class="lbl2" data-i18n="lbl_spam"></span></th>
                <th><span data-i18n="cm_said"></span><span class="lbl2" data-i18n="lbl_ham"></span></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th class="rowh"><span data-i18n="cm_real"></span><span class="lbl2" data-i18n="lbl_spam"></span></th>
                <td class="cell good" id="cm-tp" data-n="0"><span class="abbr">TP</span><span class="cnt num">0</span><span class="cell-name" data-i18n="cm_tp"></span></td>
                <td class="cell bad" id="cm-fn" data-n="0"><span class="abbr">FN</span><span class="cnt num">0</span><span class="cell-name" data-i18n="cm_fn"></span></td>
              </tr>
              <tr>
                <th class="rowh"><span data-i18n="cm_real"></span><span class="lbl2" data-i18n="lbl_ham"></span></th>
                <td class="cell bad" id="cm-fp" data-n="0"><span class="abbr">FP</span><span class="cnt num">0</span><span class="cell-name" data-i18n="cm_fp"></span></td>
                <td class="cell good" id="cm-tn" data-n="0"><span class="abbr">TN</span><span class="cnt num">0</span><span class="cell-name" data-i18n="cm_tn"></span></td>
              </tr>
            </tbody>
          </table>
          <div class="pr-lines"><div id="pr-line"></div><div id="rc-line"></div></div>
          <div class="row no-print"><button type="button" class="btn btn-sm" id="reshuffle-btn" data-i18n="reshuffle"></button></div>
        </div>
        <div class="stack">
          <h3 class="mb0" id="mist-sum"></h3>
          <p class="callout success small mb0" id="no-mist" data-i18n="no_mistakes" hidden></p>
          <ul class="mist-list" id="mist-list"></ul>
        </div>
      </div>
    </section>

    <!-- 4. Peek inside -->
    <section class="card stack" id="peek-card">
      <h2><span class="step-no" aria-hidden="true">4</span><span data-i18n="peek_t"></span></h2>
      <p class="muted small mb0" data-i18n="peek_note"></p>
      <p class="formula" data-i18n="formula_word"></p>
      <p class="muted small mb0" id="vocab-line"></p>
      <div class="peek-tools no-print">
        <input type="search" id="peek-filter" class="no-i18n" data-i18n-placeholder="peek_filter" data-i18n-aria-label="peek_filter" autocomplete="off">
        <div class="seg" role="group" data-i18n-aria-label="sort_by">
          <button type="button" id="sort-count" aria-pressed="true" data-i18n="sort_common"></button>
          <button type="button" id="sort-spam" aria-pressed="false" data-i18n="sort_spam"></button>
          <button type="button" id="sort-ham" aria-pressed="false" data-i18n="sort_ham"></button>
        </div>
      </div>
      <p class="muted small mb0" id="peek-count"></p>
      <div class="scroll-x"><table class="table peek no-i18n" id="peek-table"></table></div>
      <button type="button" class="btn btn-sm no-print" id="peek-more" data-i18n="peek_more"></button>
    </section>

    <!-- 5. What is happening inside -->
    <section class="card stack" id="inside-card">
      <h2 data-i18n="inside_t"></h2>
      <div class="grid-3 inside-grid">
        <div class="panel"><h3><span aria-hidden="true">🧮</span><span data-i18n="in1_t"></span></h3><p data-i18n="in1"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🎲</span><span data-i18n="in2_t"></span></h3><p data-i18n="in2"></p><p class="formula" data-i18n="formula"></p></div>
        <div class="panel"><h3><span aria-hidden="true">➕</span><span data-i18n="in3_t"></span></h3><p data-i18n="in3"></p></div>
        <div class="panel"><h3><span aria-hidden="true">📉</span><span data-i18n="in4_t"></span></h3><p data-i18n="in4"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🙈</span><span data-i18n="in5_t"></span></h3><p data-i18n="in5"></p></div>
        <div class="panel"><h3><span aria-hidden="true">📬</span><span data-i18n="in6_t"></span></h3><p data-i18n="in6"></p></div>
      </div>
    </section>

    <details class="card" id="help">
      <summary data-i18n="help_t"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
