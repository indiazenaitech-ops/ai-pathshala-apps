<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Calculator · AI Pathshala</title>
  <meta name="description" content="Free attendance calculator for college and school students: your attendance percentage, how many classes you must attend to reach 75%, how many you can still miss, subject-wise tracking and a term planner. Works offline, nothing leaves your device.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .num { font-variant-numeric: tabular-nums; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; }
    h3 { font-size: 1rem; margin: 0 0 8px; }
    .field input { width: 100%; }
    .lbl { font-weight: 600; font-size: .92rem; }
    .privacy { margin: 0 0 14px; }
    .ex-note { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .ex-note p { margin: 0; flex: 1 1 220px; }
    .target { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
    .target .field { flex: 0 1 190px; }
    .target-in { display: flex; align-items: center; gap: 6px; }
    .target-in input { width: 100%; min-width: 0; font-weight: 700; font-size: 1.1rem; }
    .target-in b { font-size: 1.1rem; }
    .target .seg button { min-height: 40px; }
    .two { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }
    .three { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; }
    .msg:empty, .work:empty { display: none; }
    .tabs button { min-height: 44px; }

    /* result */
    .res { margin-top: 14px; }
    .res-top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
    .res-pct { font-size: clamp(2.2rem, 9vw, 3.6rem); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; direction: ltr; }
    .res-msg { font-size: 1.08rem; font-weight: 600; margin: 8px 0 0; }
    .ok { color: var(--success); }
    .low { color: var(--danger); }
    .bar { position: relative; height: 14px; border-radius: 999px; background: var(--surface-2); margin: 14px 0 22px; border: 1px solid var(--border); }
    .bar-fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 999px; background: var(--success); max-width: 100%; }
    .bar-fill.low { background: var(--danger); }
    .bar-mark { position: absolute; inset-block: -5px; width: 3px; background: var(--text); border-radius: 2px; }
    .bar-mark span { position: absolute; top: 100%; inset-inline-start: 50%; transform: translateX(-50%); font-size: .74rem; font-weight: 700; white-space: nowrap; color: var(--muted); direction: ltr; }
    [dir="rtl"] .bar-mark span { transform: translateX(50%); }
    .work { margin: 12px 0 0; padding: 0; list-style: none; }
    .work li { padding: 6px 0; border-top: 1px dashed var(--border); font-size: .95rem; }
    .work bdi { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .work-h { margin: 16px 0 0; font-size: .86rem; font-weight: 700; color: var(--muted); text-transform: none; }

    /* subjects */
    .sub-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
    .sub { min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm, 10px); padding: 10px; background: var(--surface); border-inline-start: 5px solid var(--border); }
    .sub.is-ok { border-inline-start-color: var(--success); }
    .sub.is-low { border-inline-start-color: var(--danger); }
    .sub-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .sub-top input { flex: 1 1 auto; min-width: 0; font-weight: 600; }
    .sub-top .btn { flex: none; min-width: 40px; min-height: 40px; padding: 0; }
    .sub .field > span { font-size: .78rem; line-height: 1.25; }
    .sub-res { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 8px; min-height: 26px; }
    .sub-pct { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; direction: ltr; }
    .sub-msg { font-size: .92rem; }
    .sub-err { color: var(--danger); font-size: .88rem; }
    .tot { margin-top: 14px; }
    .tot .res-pct { font-size: clamp(1.8rem, 7vw, 2.6rem); }
    @media (min-width: 760px) {
      .sub { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr); gap: 10px 14px; align-items: end; }
      .sub-top { margin-bottom: 0; }
      .sub-res { grid-column: 1 / -1; margin-top: 0; }
    }

    /* planner */
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
    .tile { background: var(--surface-2); border-radius: var(--radius-sm, 10px); padding: 10px 12px; min-width: 0; }
    .tile-l { color: var(--muted); font-weight: 600; font-size: .82rem; line-height: 1.3; }
    .tile-v { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
    [dir="rtl"] .tile-v { text-align: end; }
    @media (max-width: 480px) { .tiles { grid-template-columns: minmax(0, 1fr); } .tile { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .tile-v { font-size: 1.25rem; } #pPlanner .three { grid-template-columns: minmax(0, 1fr); } .sub .three { gap: 8px; } }
    details.card summary { cursor: pointer; font-weight: 700; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 20px; }
    details.card li { margin: 6px 0; }
    .gap { margin-top: 16px; }
    @media print { .tabs, .ex-note, .target .seg { display: none !important; } [role="tabpanel"][hidden] { display: block !important; } [role="tabpanel"] + [role="tabpanel"] { margin-top: 18px; padding-top: 14px; border-top: 1px solid #999; } }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="muted small privacy">🔒 <span data-i18n="saved_local"></span></p>

    <div class="callout ex-note no-print" id="exNote" hidden>
      <p data-i18n="ex_note"></p>
      <button class="btn btn-sm" id="btnClearEx" data-i18n="ex_clear"></button>
    </div>

    <section class="card">
      <div class="target">
        <label class="field">
          <span class="lbl" data-i18n="target_label"></span>
          <span class="target-in"><input id="target" type="text" inputmode="decimal" maxlength="5" dir="ltr" autocomplete="off"><b>%</b></span>
        </label>
        <div class="seg no-print" id="targetSeg" role="group" data-i18n-aria-label="target_label">
          <button type="button" data-t="60">60%</button>
          <button type="button" data-t="65">65%</button>
          <button type="button" data-t="75">75%</button>
          <button type="button" data-t="80">80%</button>
          <button type="button" data-t="85">85%</button>
        </div>
      </div>
      <p class="muted small" style="margin:8px 0 0" data-i18n="target_hint"></p>
      <p class="callout danger msg small" id="targetErr" role="alert" style="margin:8px 0 0"></p>
    </section>

    <section class="card gap">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabOverall" data-tab="overall" aria-controls="pOverall" data-i18n="tab_overall"></button>
        <button type="button" role="tab" id="tabSubjects" data-tab="subjects" aria-controls="pSubjects" data-i18n="tab_subjects"></button>
        <button type="button" role="tab" id="tabPlanner" data-tab="planner" aria-controls="pPlanner" data-i18n="tab_planner"></button>
      </div>

      <!-- overall -->
      <div id="pOverall" role="tabpanel" aria-labelledby="tabOverall">
        <div class="two">
          <label class="field"><span class="lbl" data-i18n="held_label"></span>
            <input id="held" type="text" inputmode="numeric" maxlength="7" dir="ltr" autocomplete="off" placeholder="40"></label>
          <label class="field"><span class="lbl" data-i18n="att_label"></span>
            <input id="att" type="text" inputmode="numeric" maxlength="7" dir="ltr" autocomplete="off" placeholder="30"></label>
        </div>
        <div class="res" id="ovRes" aria-live="polite">
          <p class="callout danger msg" id="ovErr"></p>
          <p class="muted msg" id="ovEmpty"></p>
          <div id="ovBody" hidden>
            <div class="res-top"><span class="res-pct" id="ovPct"></span><span class="badge" id="ovBadge"></span></div>
            <div class="bar" aria-hidden="true"><div class="bar-fill" id="ovFill"></div><div class="bar-mark" id="ovMark"><span id="ovMarkT"></span></div></div>
            <p class="res-msg" id="ovMsg"></p>
            <p class="work-h" data-i18n="work_title"></p>
            <ul class="work" id="ovWork"></ul>
          </div>
        </div>
      </div>

      <!-- subject-wise -->
      <div id="pSubjects" role="tabpanel" aria-labelledby="tabSubjects" hidden>
        <p class="muted small" id="subIntro" style="margin-top:0"></p>
        <div class="sub-list" id="subList"></div>
        <p class="muted msg" id="subEmpty"></p>
        <div class="row no-print">
          <button class="btn btn-primary" id="btnAddSub" type="button">＋ <span data-i18n="add_subject"></span></button>
          <button class="btn" id="btnSample" type="button" data-i18n="load_sample"></button>
          <button class="btn btn-danger" id="btnClearSubs" type="button" data-i18n="clear_all"></button>
        </div>
        <div class="panel tot" id="subTotal" aria-live="polite" hidden>
          <h3 data-i18n="sub_total"></h3>
          <div class="res-top"><span class="res-pct" id="totPct"></span><span class="badge" id="totBadge"></span><span class="muted num" id="totCount"></span></div>
          <p class="res-msg" id="totMsg"></p>
          <p class="muted small" id="totNote" style="margin:6px 0 0"></p>
        </div>
      </div>

      <!-- planner -->
      <div id="pPlanner" role="tabpanel" aria-labelledby="tabPlanner" hidden>
        <div class="three">
          <label class="field"><span class="lbl" data-i18n="held_label"></span>
            <input id="pHeld" type="text" inputmode="numeric" maxlength="7" dir="ltr" autocomplete="off" placeholder="40"></label>
          <label class="field"><span class="lbl" data-i18n="att_label"></span>
            <input id="pAtt" type="text" inputmode="numeric" maxlength="7" dir="ltr" autocomplete="off" placeholder="30"></label>
          <label class="field"><span class="lbl" data-i18n="plan_left"></span>
            <input id="left" type="text" inputmode="numeric" maxlength="7" dir="ltr" autocomplete="off" placeholder="30"></label>
        </div>
        <div class="res" id="plRes" aria-live="polite">
          <p class="callout danger msg" id="plErr"></p>
          <p class="muted msg" id="plEmpty"></p>
          <div id="plBody" hidden>
            <p class="callout res-msg" id="plMsg"></p>
            <div class="tiles">
              <div class="tile"><div class="tile-l" id="plBestL"></div><div class="tile-v" id="plBest"></div></div>
              <div class="tile"><div class="tile-l" id="plLimitL"></div><div class="tile-v" id="plLimit"></div></div>
              <div class="tile"><div class="tile-l" id="plWorstL"></div><div class="tile-v" id="plWorst"></div></div>
            </div>
            <p class="work-h" data-i18n="work_title"></p>
            <ul class="work" id="plWork"></ul>
          </div>
        </div>
      </div>
    </section>

    <div class="row gap no-print">
      <button class="btn" id="btnPrint" type="button">🖨️ <span data-i18n="print"></span></button>
      <button class="btn btn-danger" id="btnReset" type="button" data-i18n="reset"></button>
    </div>

    <details class="card gap no-print">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
