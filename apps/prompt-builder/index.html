<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Builder · AI Pathshala</title>
  <meta name="description" content="Write clear, complete prompts for any free AI chatbot. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .howto summary { cursor: pointer; padding: 2px 0; }
    .howto ul { margin: 12px 0 10px; padding-inline-start: 1.3em; }
    .howto li + li { margin-top: 6px; }
    .howto h3 { margin-top: 14px; }

    .tpl-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
    .tpl {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      font: inherit; color: var(--text); cursor: pointer; min-height: 44px; min-width: 0;
      transition: border-color .12s, background .12s;
    }
    .tpl:hover { border-color: var(--primary); }
    .tpl[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .tpl-ico { font-size: 1.35rem; line-height: 1.2; }
    .tpl-t { font-weight: 700; font-size: .95rem; line-height: 1.3; }
    .tpl-d { font-size: .8rem; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    @media (max-width: 560px) {
      .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .tpl { padding: 9px 10px; }
    }

    .pb-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
    @media (min-width: 980px) {
      .pb-layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
    }
    .pb-side > * + * { margin-top: 16px; }
    .head-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .jump-btn {
      position: fixed; inset-inline-end: 14px; bottom: 14px; z-index: 40;
      display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 16px;
      border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-ink);
      font: inherit; font-weight: 700; box-shadow: var(--shadow-lg); cursor: pointer;
    }
    @media (min-width: 980px) { .jump-btn { display: none !important; } }

    .settings { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings .wide { grid-column: 1 / -1; }
    @media (max-width: 520px) { .settings { grid-template-columns: minmax(0, 1fr); } }
    .settings select, .field input[type="text"] { width: 100%; }
    .field textarea { min-height: 76px; }
    #f-task { min-height: 64px; }
    #f-role { min-height: 44px; resize: none; overflow: hidden; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chips .chip { min-height: 36px; font-size: .84rem; padding: 5px 11px; }
    .chips .chip[aria-pressed="true"]::before { content: "✓"; }
    .opt-row { display: flex; flex-direction: column; gap: 8px; }
    .check { align-items: flex-start; }
    .check input { margin-top: 3px; flex: 0 0 auto; }

    .prompt-box {
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
      background: var(--surface-2); border: 1px dashed var(--border); border-radius: 12px;
      padding: 14px 16px; font-size: 1rem; line-height: 1.65; text-align: start;
    }
    @media (min-width: 980px) { .prompt-box { max-height: 62vh; overflow-y: auto; } }
    .prompt-box mark { background: var(--warning-soft); color: var(--text); border-radius: 4px; padding: 0 2px; outline: 1px solid color-mix(in srgb, var(--warning) 45%, transparent); }
    .prompt-box:focus-visible { outline: 3px solid var(--accent); }
    .copy-btn { flex: 1 1 220px; }
    .save-row input { flex: 1 1 160px; min-width: 0; }

    #preview-card:fullscreen { overflow: auto; padding: 4vh 5vw; font-size: clamp(1.1rem, 2.2vw, 1.7rem); border-radius: 0; }
    #preview-card:fullscreen .prompt-box { max-height: none; font-size: inherit; }
    #preview-card:fullscreen h2 { font-size: 1.4em; }
    #preview-card:fullscreen .badge, #preview-card:fullscreen #preview-note { font-size: .8em; }
    /* Phones and touch screens: every button at least 40 px tall. */
    @media (max-width: 560px), (pointer: coarse) {
      #btn-reset, #preview-card .btn-sm, .fav .btn-sm { min-height: 40px; padding-inline: 12px; }
    }
    #preview-card:-webkit-full-screen { overflow: auto; padding: 4vh 5vw; font-size: clamp(1.1rem, 2.2vw, 1.7rem); }

    .score-wrap { display: flex; align-items: baseline; gap: 4px; }
    .score-num { font-size: 2.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .lvl-0 { color: var(--danger); } .lvl-1 { color: var(--warning); } .lvl-2 { color: var(--primary); } .lvl-3 { color: var(--success); }
    .progress { height: 12px; }
    .progress > span.lvl-0 { background: var(--danger); } .progress > span.lvl-1 { background: var(--warning); }
    .progress > span.lvl-2 { background: var(--primary); } .progress > span.lvl-3 { background: var(--success); }
    .checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px 12px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .checklist li { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .checklist .ic { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .85rem; flex: 0 0 auto; border: 2px solid var(--border); color: var(--muted); }
    .checklist li.ok .ic { background: var(--success); border-color: var(--success); color: #fff; }
    .checklist li.half .ic { border-color: var(--warning); color: var(--warning); }
    .checklist li.miss { color: var(--muted); }
    .tips { margin: 0; padding-inline-start: 1.2em; }
    .tips li + li { margin-top: 4px; }

    .safety-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .safety-list li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
    .safety-list .s-ic { font-size: 1.3rem; line-height: 1.3; flex: 0 0 auto; }

    .fav-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .fav { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
    .fav-name { font-weight: 700; overflow-wrap: anywhere; }
    .fav-snip { margin: 0; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .fav .row { gap: 6px; }

    section.card { margin-top: 16px; }
    .pb-layout section.card, .pb-side .card { margin-top: 0; }

    @media print {
      .pb-layout { display: block; margin: 0; }
      .pb-side { position: static; max-height: none; overflow: visible; }
      .prompt-box { max-height: none; overflow: visible; background: #fff; border: 1px solid #999; font-size: 12pt; color: #000; }
      .prompt-box mark { background: none; outline: none; text-decoration: underline; }
      .safety-list li { background: #fff; border: 1px solid #ccc; }
      .print-head { display: block !important; margin: 0 0 8px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <h1 class="print-only print-head" data-i18n="app_title"></h1>
    <p class="edu-intro" data-i18n="intro"></p>

    <details class="card howto no-print" id="howto">
      <summary><strong data-i18n="howto_title"></strong></summary>
      <ul>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
      </ul>
      <h3 data-i18n="inside_title"></h3>
      <p class="mb0" data-i18n="inside_text"></p>
    </details>

    <section class="card no-print" id="tpl-card" aria-labelledby="tpl-h">
      <h2 id="tpl-h" data-i18n="templates_h"></h2>
      <p class="muted small" data-i18n="templates_hint"></p>
      <div class="tpl-grid" id="tpls"></div>
    </section>

    <div class="pb-layout">
      <section class="card stack no-print" id="builder" aria-labelledby="builder-h">
        <div class="row spread">
          <h2 id="builder-h" class="mb0" data-i18n="builder_h"></h2>
          <button class="btn btn-sm btn-danger" id="btn-reset" type="button" data-i18n="clear_form"></button>
        </div>

        <div class="field">
          <label for="f-role" data-i18n="f_role"></label>
          <textarea id="f-role" dir="auto" rows="1" maxlength="400" data-i18n-placeholder="ph_role"></textarea>
          <span class="hint" data-i18n="f_role_hint"></span>
        </div>
        <div class="field">
          <label for="f-task" data-i18n="f_task"></label>
          <textarea id="f-task" dir="auto" rows="2" maxlength="4000" data-i18n-placeholder="ph_task"></textarea>
        </div>
        <div class="field">
          <label for="f-context" data-i18n="f_context"></label>
          <textarea id="f-context" dir="auto" rows="3" maxlength="8000" data-i18n-placeholder="ph_context"></textarea>
        </div>

        <div class="settings">
          <div class="field">
            <label for="f-aud" data-i18n="f_aud"></label>
            <select id="f-aud">
              <option value="" data-i18n="opt_none"></option>
              <option value="c1_5" data-i18n="aud_c1_5"></option>
              <option value="c6_8" data-i18n="aud_c6_8"></option>
              <option value="c9_10" data-i18n="aud_c9_10"></option>
              <option value="c11_12" data-i18n="aud_c11_12"></option>
              <option value="ug" data-i18n="aud_ug"></option>
              <option value="teachers" data-i18n="aud_teachers"></option>
              <option value="parents" data-i18n="aud_parents"></option>
              <option value="general" data-i18n="aud_general"></option>
            </select>
          </div>
          <div class="field">
            <label for="f-fmt" data-i18n="f_fmt"></label>
            <select id="f-fmt">
              <option value="" data-i18n="opt_none"></option>
              <option value="list" data-i18n="fmt_list"></option>
              <option value="table" data-i18n="fmt_table"></option>
              <option value="paragraph" data-i18n="fmt_paragraph"></option>
              <option value="quiz" data-i18n="fmt_quiz"></option>
              <option value="steps" data-i18n="fmt_steps"></option>
              <option value="letter" data-i18n="fmt_letter"></option>
            </select>
          </div>
          <div class="field">
            <label for="f-tone" data-i18n="f_tone"></label>
            <select id="f-tone">
              <option value="" data-i18n="opt_none"></option>
              <option value="friendly" data-i18n="tone_friendly"></option>
              <option value="formal" data-i18n="tone_formal"></option>
              <option value="encouraging" data-i18n="tone_encouraging"></option>
              <option value="simple" data-i18n="tone_simple"></option>
              <option value="fun" data-i18n="tone_fun"></option>
              <option value="neutral" data-i18n="tone_neutral"></option>
            </select>
          </div>
          <div class="field">
            <label for="f-len" data-i18n="f_len"></label>
            <select id="f-len">
              <option value="" data-i18n="opt_none"></option>
              <option value="vshort" data-i18n="len_vshort"></option>
              <option value="short" data-i18n="len_short"></option>
              <option value="medium" data-i18n="len_medium"></option>
              <option value="long" data-i18n="len_long"></option>
            </select>
          </div>
          <div class="field wide">
            <label for="f-lang" data-i18n="f_lang"></label>
            <select id="f-lang"></select>
          </div>
        </div>

        <div class="field">
          <label for="f-cons" data-i18n="f_cons"></label>
          <textarea id="f-cons" dir="auto" rows="4" maxlength="6000" data-i18n-placeholder="ph_cons"></textarea>
          <div class="chips" id="chips" role="group" aria-labelledby="chips-lbl">
            <span class="hint" id="chips-lbl" data-i18n="quick_add"></span>
          </div>
        </div>

        <div class="field">
          <label for="f-ex" data-i18n="f_ex"></label>
          <textarea id="f-ex" dir="auto" rows="3" maxlength="6000" data-i18n-placeholder="ph_ex"></textarea>
        </div>

        <div class="opt-row">
          <label class="check"><input type="checkbox" id="f-ask"> <span data-i18n="opt_ask"></span></label>
          <label class="check"><input type="checkbox" id="f-unsure"> <span data-i18n="opt_unsure"></span></label>
        </div>
      </section>

      <div class="pb-side">
        <section class="card stack" id="preview-card" aria-labelledby="preview-h">
          <div class="row spread">
            <h2 id="preview-h" class="mb0" data-i18n="preview_h"></h2>
            <div class="head-badges"><span class="badge primary" id="lang-badge"></span><span class="badge no-print" id="score-pill"></span></div>
          </div>
          <p class="muted small mb0 no-print" id="preview-note"></p>
          <div id="preview-empty" class="panel muted" data-i18n="empty_preview" hidden></div>
          <div id="preview" class="prompt-box no-i18n" tabindex="0" role="region" data-i18n-aria-label="preview_h"></div>
          <p class="tiny muted mb0 no-print" id="counts"></p>
          <div class="row no-print">
            <button class="btn btn-primary btn-lg copy-btn" id="btn-copy" type="button"><span aria-hidden="true">📋</span> <span data-i18n="copy_prompt"></span></button>
          </div>
          <div class="row no-print">
            <button class="btn btn-sm" id="btn-share" type="button"><span aria-hidden="true">🔗</span> <span data-i18n="share_link"></span></button>
            <button class="btn btn-sm" id="btn-dl" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="download_txt"></span></button>
            <button class="btn btn-sm" id="btn-print" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
            <button class="btn btn-sm" id="btn-fs" type="button"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          </div>
          <div class="row save-row no-print">
            <input id="fav-name" type="text" dir="auto" maxlength="80" autocomplete="off" data-i18n-placeholder="fav_name_ph" data-i18n-aria-label="fav_name_label">
            <button class="btn btn-accent" id="btn-save" type="button"><span aria-hidden="true">★</span> <span data-i18n="save_fav"></span></button>
          </div>
        </section>

        <section class="card stack no-print" id="quality-card" aria-labelledby="quality-h">
          <div class="row spread">
            <h2 id="quality-h" class="mb0" data-i18n="quality_h"></h2>
            <div class="score-wrap"><span class="score-num" id="q-score">0</span><span class="muted">/100</span></div>
          </div>
          <div class="progress" aria-hidden="true"><span id="q-bar" style="width:0"></span></div>
          <p class="mb0" id="q-level" aria-live="polite"><strong></strong></p>
          <ul class="checklist" id="q-list"></ul>
          <ul class="tips small" id="q-tips"></ul>
          <div id="pii" class="callout danger" role="alert" hidden></div>
        </section>
      </div>
    </div>

    <section class="card" id="safety-card" aria-labelledby="safety-h">
      <h2 id="safety-h"><span aria-hidden="true">🛡️</span> <span data-i18n="safety_h"></span></h2>
      <ul class="safety-list">
        <li><span class="s-ic" aria-hidden="true">🔒</span><span data-i18n="safe1"></span></li>
        <li><span class="s-ic" aria-hidden="true">✅</span><span data-i18n="safe2"></span></li>
        <li><span class="s-ic" aria-hidden="true">⚖️</span><span data-i18n="safe3"></span></li>
        <li><span class="s-ic" aria-hidden="true">📚</span><span data-i18n="safe4"></span></li>
        <li><span class="s-ic" aria-hidden="true">✍️</span><span data-i18n="safe5"></span></li>
        <li><span class="s-ic" aria-hidden="true">👨‍👩‍👧</span><span data-i18n="safe6"></span></li>
      </ul>
    </section>

    <section class="card stack no-print" id="favs-card" aria-labelledby="favs-h">
      <div class="row spread">
        <h2 id="favs-h" class="mb0"><span aria-hidden="true">★</span> <span data-i18n="favs_h"></span></h2>
        <span class="badge" id="favs-count"></span>
      </div>
      <p class="muted small mb0" data-i18n="saved_local"></p>
      <p class="muted" id="favs-empty" data-i18n="favs_empty"></p>
      <div class="fav-list" id="favs"></div>
    </section>
    <button type="button" class="jump-btn no-print" id="jump" hidden><span aria-hidden="true">⬇</span> <span data-i18n="preview_h"></span> <span id="jump-score"></span></button>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
