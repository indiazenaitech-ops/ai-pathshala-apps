<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Poll &amp; Voting · AI Pathshala</title>
  <meta name="description" content="Run a free live poll on the big screen. Participants vote on their phones with a 6-digit code or QR code, no account. Live bar chart and CSV, in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .o0 { --oc: #1565c0; } .o1 { --oc: #c62828; } .o2 { --oc: #b45309; }
    .o3 { --oc: #2e7d32; } .o4 { --oc: #6a1b9a; } .o5 { --oc: #00695c; }
    .lp-banner { margin-bottom: 14px; }
    #howto { margin-top: 18px; }
    #howto summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    #howto ul { margin: 10px 0 0; padding-inline-start: 1.3em; }
    #howto li + li { margin-top: 6px; }
    .privacy-line { margin: 10px 0 0; }

    /* sign in / landing */
    .land { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (max-width: 760px) { .land { grid-template-columns: minmax(0, 1fr); } }
    .signin { text-align: center; padding: 24px 18px; }
    .signin-icon { font-size: 3rem; line-height: 1; margin-bottom: 8px; }
    .signin-btn { min-width: min(100%, 300px); gap: 10px; margin: 6px 0; }
    .btn-google { background: #fff; color: #1f1f1f; border-color: #747775; }
    .gicon { width: 20px; height: 20px; flex: none; }
    #signinErr, #inappHint { text-align: start; margin: 12px 0 0; }
    .code-in { font-size: 1.6rem; letter-spacing: .2em; text-align: center; font-variant-numeric: tabular-nums; }

    /* dashboard */
    .dash-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .dash-top h2 { margin: 0; overflow-wrap: anywhere; }
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 16px; align-items: start; margin-bottom: 16px; }
    @media (max-width: 860px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
    .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--border); }
    .prow:first-child { border-top: 0; }
    .prow.sample { background: var(--accent-soft); border-radius: var(--radius-sm, 10px); padding: 12px; border: 0; margin-bottom: 4px; }
    .pinfo { flex: 1 1 200px; min-width: 0; }
    .pname { font-weight: 700; overflow-wrap: anywhere; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; }
    .err-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

    /* editor */
    .ed-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .qcard { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
    .qcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .qcard-head h3 { margin: 0; }
    .qcard textarea { min-height: 56px; }
    .orow { display: flex; align-items: center; gap: 8px; }
    .orow input { flex: 1 1 auto; min-width: 0; }
    .odot { width: 14px; height: 14px; border-radius: 50%; background: var(--oc); flex: none; }
    .ed-actions { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; background: var(--surface); border-top: 1px solid var(--border); }
    .ed-msg { color: var(--danger); font-weight: 700; margin: 0; }

    /* host (projector) */
    .host { display: flex; flex-direction: column; gap: 12px; }
    .hbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .htitle { font-weight: 700; font-size: 1.05rem; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hstage { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(12px, 3vw, 36px); min-height: min(60vh, 620px); display: flex; flex-direction: column; gap: clamp(10px, 2vw, 22px); min-width: 0; }
    .hctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    @media (pointer: coarse), (max-width: 560px) { #hKeys { display: none !important; } }
    @media (max-width: 560px) { .hctrl .btn { flex: 1 1 100%; } .hctrl .grow { display: none; } }
    .edu-fullscreen-on .edu-main { max-width: none; padding: 10px 18px; }
    .edu-fullscreen-on .hstage { min-height: calc(100vh - 140px); }
    .big-msg { font-size: clamp(1.1rem, 2vw, 1.6rem); text-align: center; color: var(--muted); margin: auto 0; }
    .stage-title { text-align: center; font-size: clamp(1.4rem, 3vw, 2.4rem); margin: 0; }
    .lobby { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 3vw, 40px); align-items: center; }
    @media (max-width: 720px) { .lobby { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
    .join-box { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .join-line { font-size: clamp(1.05rem, 2.2vw, 1.8rem); margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .join-url { color: var(--primary); font-weight: 800; unicode-bidi: isolate; overflow-wrap: anywhere; }
    .join-code { font-family: "Noto Sans", system-ui, sans-serif; font-size: clamp(3rem, min(10vw, 16vh), 8rem); font-weight: 900; letter-spacing: .05em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .qr-box { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .qr-img { width: clamp(150px, min(21vw, 36vh), 290px); aspect-ratio: 1 / 1; background: #fff; border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
    .qr-img svg { width: 100%; height: 100%; display: block; }
    .qr-box figcaption { font-weight: 600; color: var(--muted); }
    .players-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); padding-top: 14px; }
    .players-head h2 { margin: 0; font-size: clamp(1.2rem, 2.2vw, 1.8rem); }
    .lock-note { color: var(--warning); font-weight: 700; margin: 0; }
    .pchips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pchip { display: inline-flex; align-items: center; gap: 4px; padding-block: 2px; padding-inline: 14px 2px; border-radius: 999px; background: var(--primary-soft); font-weight: 700; max-width: 100%; }
    .pchip .nm { overflow-wrap: anywhere; }
    .pchip .kick { border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    .pchip .kick:hover, .pchip .kick:focus-visible { background: var(--danger-soft); color: var(--danger); }
    .qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .qtext { font-size: clamp(1.3rem, min(3.2vw, 5.4vh), 2.7rem); font-weight: 800; text-align: center; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.3; }
    .votes-line { text-align: center; font-size: clamp(1rem, 1.8vw, 1.5rem); font-weight: 700; color: var(--muted); margin: 0; }
    .avg { text-align: center; font-size: clamp(1.1rem, 2vw, 1.7rem); font-weight: 800; color: var(--primary); margin: 0; }
    .bars { display: flex; flex-direction: column; gap: clamp(6px, 1.2vw, 14px); }
    .barrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 1.6fr) auto; align-items: center; gap: 12px; padding: 6px 12px; border-radius: 12px; background: var(--surface-2); font-size: clamp(1rem, min(1.9vw, 3.2vh), 1.6rem); font-weight: 700; }
    .barrow .btext { overflow-wrap: anywhere; }
    .btrack { height: clamp(18px, 2.4vw, 32px); background: var(--surface); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bfill { display: block; height: 100%; width: 0; background: var(--oc); border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
    .bnum { text-align: end; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; white-space: nowrap; min-width: 5.5em; }
    .bnum small { color: var(--muted); font-weight: 600; }
    @media (max-width: 600px) { .barrow { grid-template-columns: minmax(0, 1fr) auto; } .btrack { grid-column: 1 / -1; grid-row: 2; } }
    .bars.hidden-res .bfill { width: 0 !important; }
    .hidden-box { text-align: center; padding: 18px; border: 2px dashed var(--border); border-radius: var(--radius); font-weight: 700; font-size: clamp(1.1rem, 2vw, 1.6rem); color: var(--muted); }
    .opt-list { display: grid; gap: 8px; }
    .opt-list .chip { justify-content: flex-start; font-size: clamp(1rem, 1.8vw, 1.4rem); }
    .final-block { border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .final-block h3 { margin: 0; overflow-wrap: anywhere; }
    .final-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

    /* participant (phone) */
    .pp { max-width: 560px; margin: 0 auto; }
    .pp .card { text-align: center; }
    .pp h2 { overflow-wrap: anywhere; }
    .big-emoji { font-size: 3rem; line-height: 1; }
    .nick { font-size: 1.4rem; font-weight: 800; overflow-wrap: anywhere; }
    .vote-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .vote-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--oc); background: var(--surface); color: var(--text); font: inherit; font-size: 1.15rem; font-weight: 700; text-align: start; cursor: pointer; }
    .vote-btn:hover, .vote-btn:focus-visible { background: var(--surface-2); outline: 3px solid var(--oc); outline-offset: 1px; }
    .vote-btn[disabled] { opacity: .6; cursor: default; }
    .vote-btn .vt { overflow-wrap: anywhere; min-width: 0; }
    .vote-btn.picked { background: var(--oc); color: #fff; opacity: 1; }
    .p-q { font-size: 1.35rem; font-weight: 800; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
    .pp-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
    .linkbtn { background: none; border: 0; color: var(--primary); text-decoration: underline; cursor: pointer; font: inherit; min-height: 40px; }

    @media print {
      #howto, .hbar, .hctrl, .final-acts, .lp-banner, .edu-intro, .privacy-line { display: none !important; }
      .hstage { border: 0; box-shadow: none; min-height: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" id="intro" data-i18n="intro"></p>
    <div class="callout warning lp-banner" id="demoBanner" hidden><span aria-hidden="true">🧪 </span><span data-i18n="demo_banner"></span></div>
    <div class="callout danger lp-banner" id="offlineBanner" role="status" hidden><span data-i18n="offline_banner"></span></div>

    <section id="v-loading" class="card center muted" aria-busy="true"><span data-i18n="loading"></span></section>

    <!-- landing: host sign-in + join with a code -->
    <section id="v-signin" hidden>
      <div class="land">
        <div class="card signin">
          <div class="signin-icon" aria-hidden="true">📊</div>
          <h2 data-i18n="host_title"></h2>
          <p class="muted" data-i18n="host_text"></p>
          <button class="btn btn-lg signin-btn" id="signIn" type="button"></button>
          <div><button class="btn" id="runSampleNow" type="button" data-i18n="run_sample_now"></button></div>
          <p class="callout warning" id="inappHint" hidden data-i18n="inapp_hint"></p>
          <div class="callout danger" id="signinErr" role="alert" hidden></div>
          <p class="small muted"><a class="lnk-privacy" href="../../legal/privacy.html" data-i18n="privacy"></a> · <a class="lnk-terms" href="../../legal/terms.html" data-i18n="terms"></a></p>
        </div>
        <form class="card stack" id="joinForm" novalidate>
          <h2 data-i18n="join_title"></h2>
          <p class="muted mb0" data-i18n="join_text"></p>
          <label class="field"><span data-i18n="code_label"></span>
            <input id="joinCode" class="code-in" inputmode="numeric" autocomplete="off" maxlength="7" dir="ltr" placeholder="123456"></label>
          <p class="callout danger" id="joinCodeErr" role="alert" hidden data-i18n="err_bad_code"></p>
          <button class="btn btn-primary" type="submit" data-i18n="join_go"></button>
        </form>
      </div>
    </section>

    <!-- host dashboard -->
    <section id="v-dash" hidden>
      <div class="dash-top">
        <h2 id="hello"></h2>
        <button class="btn btn-primary" id="newPoll" type="button"><span aria-hidden="true">+</span> <span data-i18n="new_poll"></span></button>
      </div>
      <div class="dash-grid">
        <section class="card stack">
          <h2 data-i18n="my_polls"></h2>
          <div id="pollList" aria-live="polite"></div>
        </section>
        <section class="card stack" id="accountCard">
          <h3 data-i18n="account"></h3>
          <p class="mb0"><b id="accName"></b></p>
          <p class="small muted mb0" id="dataNote"></p>
          <div class="row">
            <button class="btn" id="signOut" type="button" data-i18n="sign_out"></button>
            <button class="btn btn-danger" id="deleteAccount" type="button" data-i18n="delete_account"></button>
          </div>
          <p class="small mb0"><a class="lnk-privacy" href="../../legal/privacy.html" data-i18n="privacy"></a> · <a class="lnk-terms" href="../../legal/terms.html" data-i18n="terms"></a></p>
        </section>
      </div>
      <section class="card stack">
        <h2 data-i18n="past_sessions"></h2>
        <p class="small muted mb0" data-i18n="keep_note"></p>
        <div id="sessList" aria-live="polite"></div>
      </section>
    </section>

    <section id="v-edit" hidden></section>

    <!-- host a live poll (projector) -->
    <section id="v-host" hidden>
      <div class="host" id="host">
        <div class="hbar">
          <span class="htitle no-i18n" id="hTitle"></span>
          <span class="badge primary" id="hCode"></span>
          <span class="grow"></span>
          <button class="btn btn-sm" id="hideBtn" type="button" aria-pressed="false"></button>
          <button class="btn btn-sm" id="fsBtn" type="button"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          <button class="btn btn-sm" id="hBack" type="button" data-i18n="back_dash"></button>
        </div>
        <div class="callout danger" id="hMsg" role="alert" hidden></div>
        <div class="hstage" id="hStage" aria-live="polite"></div>
        <div class="hctrl">
          <span class="small muted" id="hKeys" data-i18n="keys_hint"></span>
          <span class="grow"></span>
          <button class="btn" id="prevBtn" type="button" data-i18n="prev_q" hidden></button>
          <button class="btn btn-danger" id="endBtn" type="button" data-i18n="end_poll" hidden></button>
          <button class="btn btn-primary btn-lg" id="nextBtn" type="button"></button>
        </div>
      </div>
    </section>

    <section id="v-results" hidden></section>

    <!-- participant (phone) -->
    <section id="v-part" class="pp" hidden></section>

    <details class="card" id="howto">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
    <p class="small muted privacy-line" id="privacyLine"><span aria-hidden="true">🔒 </span><span data-i18n="privacy_line"></span></p>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="../../shared/firebase-config.js"></script>
  <script src="../../shared/cloud-mock.js"></script>
  <script src="../../shared/cloud.js"></script>
  <script src="content.js"></script>
  <script src="qr.js"></script>
  <script src="app.js"></script>
</body>
</html>
