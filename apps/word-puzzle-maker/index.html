<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Puzzle Maker · AI Pathshala</title>
  <meta name="description" content="Free word search, crossword and word scramble maker for teachers and parents. Use your own words in Hindi, Tamil, Urdu, English or any Indian language. Printable A4 with answer key. Works offline, no sign-up.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>@page { size: A4 portrait; margin: 14mm; }</style>
  <style>
    [hidden] { display: none !important; }
    .privacy { margin: -6px 0 14px; }
    #mode { display: flex; }
    #mode button { flex: 1 1 0; min-height: 46px; padding-inline: 6px; }
    .seg button { min-height: 42px; min-width: 46px; }
    #words { min-height: 190px; font-size: 1.02rem; }
    .field .hint { font-size: .86rem; }
    .opts { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-start; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .checks .check { min-height: 40px; }
    .actions .btn { min-height: 44px; }
    #status p { margin: 0; overflow-wrap: anywhere; }
    #status p + p { margin-top: 4px; }
    #status .warn { font-size: .92rem; }
    #howto summary { cursor: pointer; font-weight: 700; }
    #howto ul { margin: 8px 0 0; padding-inline-start: 20px; }
    #howto li { margin: 4px 0; }

    /* ---------- the paper ---------- */
    .sheet { background: #fff; color: #111; border: 1px solid var(--border); border-radius: 10px; padding: clamp(14px, 4vw, 34px);
      max-width: 820px; margin: 0 auto 18px; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); overflow-wrap: anywhere; }
    .sh-head { display: flex; justify-content: space-between; gap: 6px 12px; align-items: baseline; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 6px; }
    .sh-title { margin: 0; font-size: 1.4rem; line-height: 1.3; color: #111; }
    .sh-tag { font-weight: 700; border: 1.5px solid #111; border-radius: 6px; padding: 1px 8px; font-size: .85rem; white-space: nowrap; }
    .sh-name { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 14px 0 2px; font-size: .95rem; }
    .sh-name .ln { display: inline-block; border-bottom: 1px solid #111; width: 190px; max-width: 46vw; height: 1.1em; vertical-align: bottom; margin-inline-start: 6px; }
    .sh-name .ln.short { width: 110px; }
    .sh-ins { margin: 12px 0 14px; font-size: .98rem; }
    .gwrap { container-type: inline-size; width: 100%; max-width: calc(var(--n) * var(--cell, 42px)); margin: 0 auto; }
    .ws-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border: 2px solid #111; }
    .ws-grid .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 600; line-height: 1; min-width: 0;
      white-space: nowrap; border: 1px solid #ddd; font-size: 14px; font-size: calc(100cqw / var(--n) * var(--f, .55)); }
    .ws-grid.is-key .cell { color: #9a9a9a; font-weight: 400; }
    .ws-grid.is-key .cell.hit { color: #000; font-weight: 800; background: #ffe08a; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wlist { display: flex; flex-wrap: wrap; gap: 6px 24px; list-style: none; padding: 0; margin: 18px 0 0; font-weight: 600; }
    .wlist li::before { content: ''; display: inline-block; width: .8em; height: .8em; border: 1.5px solid #111; border-radius: 2px; margin-inline-end: 6px; vertical-align: -1px; }
    .is-keylist li::before { background: #111; }

    .cw-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding-inline-end: 1.5px; padding-block-end: 1.5px; }
    .cw-cell { aspect-ratio: 1; border: 1.5px solid #111; margin-inline-end: -1.5px; margin-block-end: -1.5px; position: relative; display: flex; align-items: center;
      justify-content: center; background: #fff; font-weight: 700; line-height: 1; min-width: 0; white-space: nowrap; font-size: 14px; font-size: calc(100cqw / var(--n) * var(--f, .5)); }
    .cw-cell .num { position: absolute; inset-block-start: 1px; inset-inline-start: 2px; font-weight: 600; line-height: 1; font-size: 8px; font-size: max(7px, calc(100cqw / var(--n) * .25)); }
    .cw-cell .ch { padding-block-start: 12%; }
    .cw-gap { aspect-ratio: 1; }
    .clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 30px; margin-top: 18px; }
    .clues h3 { margin: 0 0 4px; font-size: 1rem; border-bottom: 1px solid #111; padding-bottom: 2px; color: #111; }
    .clues ul { list-style: none; margin: 0; padding: 0; }
    .clues li { margin: 5px 0; display: flex; gap: 6px; }
    .clues .n { font-weight: 700; min-width: 1.6em; }
    .clues .len { color: #555; white-space: nowrap; }
    .clues .ans { font-weight: 700; }

    .sc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 0; border-bottom: 1px dashed #bbb; break-inside: avoid; }
    .sc-n { font-weight: 700; min-width: 1.8em; }
    .sc-j { font-weight: 700; font-size: 1.15rem; word-spacing: .3em; min-width: 7em; }
    .sc-boxes { display: inline-flex; flex-wrap: wrap; padding-inline-end: 1.5px; row-gap: 4px; }
    .sc-box { width: 30px; height: 32px; border: 1.5px solid #111; margin-inline-end: -1.5px; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
    .sc-hint { flex-basis: 100%; color: #444; font-size: .9rem; font-style: italic; }

    /* Urdu: single letters sit better in boxes in a plain Naskh face than in Nastaliq */
    .sc-arab { font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif; }
    html[lang="ur"] .clues h3 { line-height: 2.2; }
    html[lang="ur"] .sh-title { line-height: 2; }

    @media print {
      #app > :not(#preview) { display: none !important; }
      .sheet { border: 0; box-shadow: none; border-radius: 0; padding: 0; max-width: none; margin: 0; }
      .sheet + .sheet { break-before: page; page-break-before: always; }
      .sh-name .ln { max-width: none; }
      .gwrap { max-width: min(calc(var(--n) * var(--cell, 42px)), 150mm); }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="privacy muted small">🔒 <span data-i18n="privacy"></span></p>

    <section class="card stack" id="controls">
      <div class="seg" id="mode" role="group">
        <button type="button" id="tab-search" data-mode="search" data-i18n="tab_search"></button>
        <button type="button" id="tab-cross" data-mode="cross" data-i18n="tab_cross"></button>
        <button type="button" id="tab-scramble" data-mode="scramble" data-i18n="tab_scramble"></button>
      </div>

      <label class="field"><span data-i18n="lbl_title"></span>
        <input type="text" id="title" maxlength="80" dir="auto" autocomplete="off">
      </label>
      <label class="field"><span data-i18n="lbl_words"></span>
        <textarea id="words" rows="9" dir="auto" spellcheck="false" autocomplete="off" data-i18n-placeholder="ph_words"></textarea>
        <span class="hint" data-i18n="hint_words"></span>
      </label>
      <div class="row">
        <button type="button" class="btn btn-sm" id="btn-sample" data-i18n="btn_sample"></button>
        <button type="button" class="btn btn-sm" id="btn-clear" data-i18n="clear"></button>
      </div>

      <div class="opts" id="opts-search">
        <div class="field"><span data-i18n="lbl_size"></span>
          <div class="seg" id="size" role="group">
            <button type="button" data-size="0" data-i18n="size_auto"></button>
            <button type="button" data-size="8">8</button>
            <button type="button" data-size="10">10</button>
            <button type="button" data-size="12">12</button>
            <button type="button" data-size="15">15</button>
            <button type="button" data-size="20">20</button>
          </div>
        </div>
        <div class="field"><span data-i18n="lbl_level"></span>
          <div class="seg" id="level" role="group">
            <button type="button" data-level="0" data-i18n="lvl_easy"></button>
            <button type="button" data-level="1" data-i18n="lvl_medium"></button>
            <button type="button" data-level="2" data-i18n="lvl_hard"></button>
          </div>
          <span class="hint" id="level-hint"></span>
        </div>
      </div>

      <div class="checks">
        <label class="check" id="wrap-list"><input type="checkbox" id="opt-list"><span data-i18n="opt_list"></span></label>
        <label class="check" id="wrap-hints"><input type="checkbox" id="opt-hints"><span data-i18n="opt_hints"></span></label>
        <label class="check"><input type="checkbox" id="opt-name"><span data-i18n="opt_name"></span></label>
        <label class="check"><input type="checkbox" id="opt-key"><span data-i18n="opt_key"></span></label>
      </div>

      <div class="row actions">
        <button type="button" class="btn btn-accent" id="btn-new">🔀 <span data-i18n="btn_new"></span></button>
        <button type="button" class="btn btn-primary" id="btn-print">🖨️ <span data-i18n="print"></span></button>
        <button type="button" class="btn btn-ghost" id="btn-reset" data-i18n="reset"></button>
      </div>
      <div id="status" class="callout" aria-live="polite"></div>
    </section>

    <section id="preview">
      <div class="sheet" id="sheet"></div>
      <div class="sheet" id="sheet-key"></div>
    </section>

    <details class="card" id="howto">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
