<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Recorder & Trimmer · AI Pathshala</title>
  <meta name="description" content="Free audio recorder and trimmer: record with the microphone or open a file, cut the part you want, add fades, download WAV or a smaller file. Nothing is uploaded.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .ar-card { margin-bottom: 16px; }
    .ar-card h2 { font-size: 1.15rem; margin: 0; }
    .ar-btns { display: flex; flex-wrap: wrap; gap: 10px; }
    .ar-btns .btn { min-height: 46px; flex: 1 1 200px; min-width: 0; white-space: normal; }
    .ar-small .btn { flex: 0 1 auto; min-height: 42px; }
    .ar-rec { border: 2px solid var(--danger); border-radius: var(--radius); padding: 12px; }
    .ar-rec-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .ar-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); margin-inline-end: 8px; animation: ar-blink 1s infinite alternate; }
    [data-state="paused"] .ar-dot { animation: none; background: var(--muted); }
    @keyframes ar-blink { from { opacity: 1; } to { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .ar-dot { animation: none; } }
    .ar-time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; font-family: system-ui, "Segoe UI", "Noto Sans", sans-serif; }
    .ar-level { height: 14px; border-radius: 99px; background: var(--surface-2); overflow: hidden; direction: ltr; }
    .ar-level span { display: block; height: 100%; width: 0; background: var(--success); transition: width .08s linear; }
    .ar-level span.hot { background: var(--danger); }
    .ar-wavewrap { direction: ltr; }
    .ar-wave { display: block; width: 100%; height: 170px; border: 1px solid var(--border); border-radius: var(--radius-sm, 10px); background: var(--surface-2); touch-action: none; cursor: ew-resize; }
    .ar-sliders { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 10px; }
    .ar-sl { display: grid; grid-template-columns: minmax(64px, auto) minmax(0, 1fr) 70px; gap: 8px; align-items: center; }
    .ar-sl input[type=range] { width: 100%; min-height: 40px; margin: 0; }
    .ar-sl label { font-weight: 700; font-size: .9rem; }
    .ar-num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: end; direction: ltr; font-family: system-ui, "Segoe UI", "Noto Sans", sans-serif; }
    .ar-info { font-weight: 700; margin: 0; }
    .ar-fx { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .ar-fx select, .ar-fx input[type=range] { width: 100%; min-height: 40px; }
    .ar-name { display: flex; gap: 6px; align-items: center; }
    .ar-name input { flex: 1 1 auto; min-width: 0; }
    .ar-privacy { margin: 0; padding: 8px 12px; border-radius: var(--radius-sm, 10px); background: var(--surface-2); color: var(--muted); }
    .ar-help summary { cursor: pointer; font-size: 1.05rem; }
    .ar-help ul { margin: 12px 0 0; padding-inline-start: 22px; }
    .ar-help li { margin-bottom: 8px; }
    :root[lang="ur"] .ar-card h2 { line-height: 2; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="app" data-state="idle">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card stack ar-card" id="srcCard">
      <h2 data-i18n="src_title"></h2>
      <div class="ar-btns" id="srcBtns">
        <button type="button" class="btn btn-primary" id="recBtn"><span aria-hidden="true">🎙️</span> <span data-i18n="btn_record"></span></button>
        <button type="button" class="btn" id="openBtn"><span aria-hidden="true">📂</span> <span data-i18n="btn_open"></span></button>
        <button type="button" class="btn" id="sampleBtn"><span aria-hidden="true">🎵</span> <span data-i18n="btn_sample"></span></button>
      </div>
      <input type="file" id="file" accept="audio/*,video/mp4,video/webm,.mp3,.wav,.m4a,.ogg,.oga,.opus,.aac,.flac,.webm,.amr" hidden>
      <div class="ar-rec stack" id="recPanel" hidden>
        <div class="ar-rec-top">
          <b><span class="ar-dot" aria-hidden="true"></span><span id="recState" role="status"></span></b>
          <span class="ar-time" id="recTime">0:00</span>
        </div>
        <div>
          <div class="small muted" data-i18n="level"></div>
          <div class="ar-level" id="levelBar" role="img" data-i18n-aria-label="level"><span id="levelFill"></span></div>
        </div>
        <div class="ar-btns">
          <button type="button" class="btn" id="pauseBtn"></button>
          <button type="button" class="btn btn-danger" id="stopBtn"><span aria-hidden="true">⏹</span> <span data-i18n="btn_stop_rec"></span></button>
        </div>
      </div>
      <div class="callout" id="msg" role="alert" hidden></div>
      <p class="muted small" id="permHint" data-i18n="perm_hint" style="margin-bottom:0"></p>
      <p class="muted small" id="limitNote" style="margin:0"></p>
      <p class="ar-privacy small"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>
    </section>

    <section class="card stack ar-card" id="edCard" hidden>
      <h2 data-i18n="ed_title"></h2>
      <p class="muted small" data-i18n="ed_hint" style="margin-bottom:0"></p>
      <div class="ar-wavewrap">
        <canvas class="ar-wave" id="wave" role="img" data-i18n-aria-label="wave_label"></canvas>
        <div class="ar-sliders">
          <div class="ar-sl"><label for="selA" data-i18n="sel_start"></label><input type="range" id="selA" min="0" max="1" step="0.01" value="0"><span class="ar-num" id="numA">0:00.0</span></div>
          <div class="ar-sl"><label for="selB" data-i18n="sel_end"></label><input type="range" id="selB" min="0" max="1" step="0.01" value="1"><span class="ar-num" id="numB">0:00.0</span></div>
        </div>
      </div>
      <p class="ar-info" id="selInfo" aria-live="polite"></p>
      <div class="ar-btns ar-small">
        <button type="button" class="btn btn-primary" id="playBtn"></button>
        <button type="button" class="btn" id="trimBtn"><span aria-hidden="true">✂️</span> <span data-i18n="btn_trim"></span></button>
        <button type="button" class="btn" id="cutBtn"><span aria-hidden="true">🗑️</span> <span data-i18n="btn_cut"></span></button>
        <button type="button" class="btn btn-ghost" id="allBtn" data-i18n="btn_all"></button>
        <button type="button" class="btn btn-ghost" id="undoBtn" disabled><span aria-hidden="true">↩</span> <span data-i18n="btn_undo"></span></button>
      </div>
      <div class="callout" id="edMsg" role="status" hidden></div>
    </section>

    <section class="card stack ar-card" id="fxCard" hidden>
      <h2 data-i18n="fx_title"></h2>
      <div class="ar-fx">
        <div class="field"><label for="fadeIn" data-i18n="fade_in"></label><select id="fadeIn"></select></div>
        <div class="field"><label for="fadeOut" data-i18n="fade_out"></label><select id="fadeOut"></select></div>
        <div class="field"><label for="vol"><span data-i18n="volume"></span> <b class="ar-num" id="volNum">100%</b></label><input type="range" id="vol" min="25" max="400" step="5" value="100"></div>
      </div>
      <p class="muted small" id="volNote" aria-live="polite" style="margin-bottom:0"></p>
      <p class="muted small" data-i18n="fx_note" style="margin:0"></p>
    </section>

    <section class="card stack ar-card" id="dlCard" hidden>
      <h2 data-i18n="dl_title"></h2>
      <div class="field">
        <label for="fileName" data-i18n="file_name"></label>
        <div class="ar-name"><input type="text" id="fileName" class="no-i18n" maxlength="60" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="ar-btns">
        <button type="button" class="btn btn-accent" id="wavBtn"><span aria-hidden="true">⬇️</span> <span data-i18n="dl_wav"></span></button>
        <button type="button" class="btn" id="smallBtn"><span aria-hidden="true">⬇️</span> <span id="smallTxt"></span></button>
        <button type="button" class="btn btn-danger" id="cancelBtn" data-i18n="cancel" hidden></button>
      </div>
      <p class="muted small" data-i18n="wav_note" style="margin-bottom:0"></p>
      <p class="muted small" id="smallNote" style="margin:0"></p>
      <div class="callout success" id="dlMsg" role="status" hidden></div>
      <div><button type="button" class="btn btn-ghost" id="newBtn"><span aria-hidden="true">↺</span> <span data-i18n="btn_new"></span></button></div>
    </section>

    <details class="card ar-help">
      <summary><b data-i18n="how_title"></b></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
