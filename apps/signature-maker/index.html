<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signature Maker · AI Pathshala</title>
  <meta name="description" content="Make a clean signature image: draw it, take it from a photo of paper, or type your name. Transparent or white background, PNG or JPG, exact pixel size and KB limit for forms. Free and private: nothing leaves your device.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .sm-priv { margin-bottom: 16px; }
    .sm-priv strong { display: block; }
    .sm-priv p { margin: 2px 0 0; font-size: .9rem; }
    .sm-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
    .sm-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 900px) { .sm-layout { grid-template-columns: minmax(0, 1fr); } }
    .sm-h { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; margin: 0; }
    .sm-h .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink, #fff); font-size: .9rem; font-weight: 800; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .sm-seg { display: flex; flex-wrap: wrap; width: 100%; }
    .sm-seg button { flex: 1 1 auto; min-height: 44px; padding-inline: 8px; }
    .sm-padwrap { border: 2px dashed var(--border); border-radius: var(--radius-sm, 10px); background: #fff; overflow: hidden; }
    #pad { display: block; width: 100%; aspect-ratio: 1000 / 420; touch-action: none; cursor: crosshair; background: #fff; }
    #pad:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    @media (max-width: 600px) { #pad { aspect-ratio: 1000 / 520; } }
    .sm-rangerow { display: flex; align-items: center; gap: 10px; }
    .sm-rangerow input[type="range"] { flex: 1 1 auto; min-width: 0; min-height: 40px; }
    .sm-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .sm-tools .field { flex: 1 1 180px; }
    .sm-tools .btn { min-height: 42px; }
    .sm-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .sm-styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .sm-styles button { min-height: 64px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: #111; cursor: pointer; padding: 6px 8px; font-size: 1.5rem; line-height: 1.3; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sm-styles button[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    .sm-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .sm-chips .chip { min-height: 40px; }
    .sm-chips .chip i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(128,128,128,.6); flex: none; }
    .sm-size { border: 1px solid var(--border); border-radius: var(--radius-sm, 10px); padding: 8px 12px; }
    .sm-size > summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
    .sm-sizegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; align-items: end; }
    .sm-sizegrid input { width: 100%; min-height: 42px; }
    @media (max-width: 420px) { .sm-sizegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .sm-stage { display: grid; place-items: center; min-height: 150px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm, 10px); background: repeating-conic-gradient(#d9d9d9 0 25%, #f6f6f6 0 50%) 0 0 / 18px 18px; }
    .sm-stage canvas { display: block; max-width: 100%; max-height: 260px; height: auto; }
    .sm-stage p { margin: 0; color: #444; background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 8px; text-align: center; }
    .sm-lines { margin: 0; padding: 0; list-style: none; }
    .sm-lines li { padding: 3px 0; font-size: .92rem; }
    .sm-lines .ok { color: var(--success); font-weight: 600; }
    .sm-lines .bad { color: var(--danger); font-weight: 600; }
    .sm-dl { display: grid; gap: 8px; }
    .sm-dl .btn { width: 100%; min-height: 48px; }
    .sm-help ul { margin: 10px 0 0; padding-inline-start: 20px; }
    .sm-help li + li { margin-top: 8px; }
    .sm-help summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    #photoThumb { max-width: 100%; max-height: 150px; border: 1px solid var(--border); border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <main id="app" data-busy="0" data-has="0">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="callout success sm-priv">
      <strong data-i18n="priv_title"></strong>
      <p data-i18n="priv_text"></p>
    </div>

    <div class="sm-layout">
      <section class="card stack" id="makeCard" aria-labelledby="hMake">
        <h2 class="sm-h"><span class="num" aria-hidden="true">1</span> <span id="hMake" data-i18n="h_make"></span></h2>
        <div class="seg sm-seg" id="modeSeg" role="group" aria-labelledby="hMake">
          <button type="button" id="mode-draw" data-mode="draw" data-i18n="mode_draw"></button>
          <button type="button" id="mode-photo" data-mode="photo" data-i18n="mode_photo"></button>
          <button type="button" id="mode-type" data-mode="type" data-i18n="mode_type"></button>
        </div>

        <div id="panel-draw" class="stack">
          <p class="small muted mb0" data-i18n="draw_hint"></p>
          <div class="sm-padwrap"><canvas id="pad" tabindex="0" role="img" data-i18n-aria-label="pad_label" aria-label="Signature pad"></canvas></div>
          <div class="sm-tools">
            <label class="field" for="pen"><span data-i18n="pen_size"></span>
              <span class="sm-rangerow"><input type="range" id="pen" min="3" max="26" step="1" value="9"></span>
            </label>
            <button type="button" class="btn" id="undo"><span aria-hidden="true">↶</span> <span data-i18n="undo"></span></button>
            <button type="button" class="btn" id="clearPad" data-i18n="clear"></button>
          </div>
        </div>

        <div id="panel-photo" class="stack" hidden>
          <p class="small muted mb0" data-i18n="photo_hint"></p>
          <div class="row">
            <button type="button" class="btn btn-primary" id="pickPhoto"><span aria-hidden="true">📷</span> <span data-i18n="pick_photo"></span></button>
            <button type="button" class="btn" id="samplePhoto" data-i18n="try_sample"></button>
            <input type="file" id="photoIn" class="sm-file" accept="image/*" tabindex="-1" aria-hidden="true">
          </div>
          <p class="small mb0" id="photoMsg" aria-live="polite"></p>
          <div id="photoCtl" class="stack" hidden>
            <canvas id="photoThumb" width="10" height="10" aria-hidden="true"></canvas>
            <div class="sm-tools">
              <label class="field" for="thr"><span data-i18n="thr_label"></span>
                <span class="sm-rangerow"><input type="range" id="thr" min="20" max="245" step="1" value="150"></span>
              </label>
              <button type="button" class="btn" id="thrAuto" data-i18n="auto"></button>
              <button type="button" class="btn" id="rotate"><span aria-hidden="true">⟳</span> <span data-i18n="rotate"></span></button>
            </div>
            <p class="tiny muted mb0" data-i18n="thr_hint"></p>
          </div>
        </div>

        <div id="panel-type" class="stack" hidden>
          <label class="field" for="nameIn"><span data-i18n="type_label"></span>
            <input type="text" id="nameIn" class="no-i18n" maxlength="40" autocomplete="off" data-i18n-placeholder="type_ph" placeholder="">
          </label>
          <div class="field">
            <span data-i18n="style_label"></span>
            <div class="sm-styles no-i18n" id="styleGrid" role="group" data-i18n-aria-label="style_label" aria-label="Style"></div>
          </div>
          <p class="tiny muted mb0" data-i18n="type_note"></p>
        </div>
      </section>

      <div class="sm-side">
        <section class="card stack" id="lookCard" aria-labelledby="hLook">
          <h2 class="sm-h"><span class="num" aria-hidden="true">2</span> <span id="hLook" data-i18n="h_look"></span></h2>
          <div class="field">
            <span data-i18n="ink_label"></span>
            <div class="sm-chips" id="inkChips" role="group" data-i18n-aria-label="ink_label" aria-label="Ink colour">
              <button type="button" class="chip" data-ink="black"><i style="background:#111111"></i><span data-i18n="ink_black"></span></button>
              <button type="button" class="chip" data-ink="blue"><i style="background:#1d4ed8"></i><span data-i18n="ink_blue"></span></button>
              <button type="button" class="chip" data-ink="dark"><i style="background:#0b2a6b"></i><span data-i18n="ink_dark"></span></button>
            </div>
          </div>
          <div class="field">
            <span data-i18n="bg_label"></span>
            <div class="seg sm-seg" id="bgSeg" role="group" data-i18n-aria-label="bg_label" aria-label="Background">
              <button type="button" id="bg-clear" data-bg="clear" data-i18n="bg_clear"></button>
              <button type="button" id="bg-white" data-bg="white" data-i18n="bg_white"></button>
            </div>
          </div>
          <details class="sm-size" id="sizeBox">
            <summary data-i18n="size_title"></summary>
            <div class="sm-sizegrid">
              <label class="field" for="tw"><span data-i18n="size_w"></span><input type="number" id="tw" min="20" max="4000" step="1" inputmode="numeric"></label>
              <label class="field" for="th"><span data-i18n="size_h"></span><input type="number" id="th" min="20" max="4000" step="1" inputmode="numeric"></label>
              <label class="field" for="kb"><span data-i18n="size_kb"></span><input type="number" id="kb" min="1" max="5000" step="1" inputmode="numeric"></label>
            </div>
            <p class="tiny muted" style="margin:8px 0 0" data-i18n="size_hint"></p>
          </details>
        </section>

        <section class="card stack" id="saveCard" aria-labelledby="hSave">
          <h2 class="sm-h"><span class="num" aria-hidden="true">3</span> <span id="hSave" data-i18n="h_save"></span></h2>
          <div class="sm-stage" id="stage">
            <canvas id="out" width="10" height="10" hidden></canvas>
            <p id="emptyMsg"></p>
          </div>
          <ul class="sm-lines" id="lines" aria-live="polite"></ul>
          <div class="sm-dl">
            <button type="button" class="btn btn-primary" id="dlPng" disabled><span aria-hidden="true">⬇</span> <span data-i18n="dl_png"></span></button>
            <button type="button" class="btn" id="dlJpg" disabled><span aria-hidden="true">⬇</span> <span data-i18n="dl_jpg"></span></button>
          </div>
          <p class="tiny muted mb0" data-i18n="jpg_note"></p>
          <p class="small mb0" id="status" aria-live="polite"></p>
          <div class="callout warning">
            <strong data-i18n="private_title"></strong>
            <p class="small" style="margin:2px 0 0" data-i18n="private_text"></p>
          </div>
          <div class="row spread">
            <span class="tiny muted" data-i18n="settings_saved"></span>
            <button type="button" class="btn btn-sm btn-danger" id="resetAll" data-i18n="reset"></button>
          </div>
        </section>
      </div>
    </div>

    <details class="card sm-help" style="margin-top:16px">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
