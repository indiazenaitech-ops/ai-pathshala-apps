<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number System Converter · AI Pathshala</title>
  <meta name="description" content="Free number system converter for CBSE Class 11 Computer Science: binary, octal, decimal and hexadecimal with step-by-step working, 8-bit switches, binary addition with carries, Unicode and UTF-8 explorer and a practice quiz. Works offline in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* numbers, bits and code always use a clean Latin font (Indic / Nastaliq line boxes are very tall) */
    .ns-mono, .ns-val, .ns-big-in, .ns-div, .ns-mul, .ns-place, .ns-formula, .ns-groups, .ns-bits, .ns-add, .ns-q,
    .ns-tile b, .ns-enc-table .c, .ns-ch .h, .ns-how .ns-bitrow, .ns-chart td, .ns-ws li, #q-ans, .ns-sumline {
      font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .ns-ltr { direction: ltr; unicode-bidi: isolate; }
    .ns-tabbar { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .ns-tabbar .tabs { border-bottom: 0; margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
    .ns-tabbar .tabs button { font-size: 1rem; }
    .ns-tabbar #fs-btn { margin-bottom: 4px; flex: 0 0 auto; }
    .ns-panel > * + * { margin-top: 16px; }
    .ns-h { font-size: 1.15rem; margin: 0 0 10px; }
    .ns-label { display: block; font-weight: 700; margin-bottom: 6px; }

    /* ---------- converter ---------- */
    .ns-conv-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .ns-conv-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
    .ns-big-in { width: 100%; font-size: 1.7rem !important; font-weight: 700; letter-spacing: .03em; padding: 10px 14px !important; }
    .ns-big-in.bad { border-color: var(--danger); outline-color: var(--danger); }
    .ns-pick { display: grid; gap: 6px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .ns-pick.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 520px) { .ns-pick { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ns-pick.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .ns-pick .btn { flex-direction: column; gap: 0; padding: 6px 6px; min-height: 52px; min-width: 0; overflow-wrap: anywhere; }
    .ns-pick .btn .sh { display: none; }
    @media (max-width: 560px) { .ns-pick .btn .lg { display: none; } .ns-pick .btn .sh { display: inline; } }
    :root[lang="ur"] .ns-panel h2, :root[lang="ur"] .ns-panel h3, :root[lang="ur"] #help summary { line-height: 1.9; }
    #help { margin-top: 16px; }
    #matra-note { margin-top: 12px; }
    @media (max-width: 560px) { .ns-tabbar .tabs button { padding: 8px 10px; font-size: .95rem; } }
    .ns-pick .btn small { font-weight: 500; font-size: .76rem; color: var(--muted); }
    .ns-pick .btn[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .ns-pick .btn[aria-pressed="true"] small { color: inherit; opacity: .85; }
    .ns-msg { min-height: 1.6em; margin: 0; }
    .ns-msg.bad { color: var(--danger); font-weight: 600; }
    .ns-examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .ns-examples .chip { font-family: var(--mono); }
    .ns-res { display: grid; gap: 8px; }
    .ns-res-row { display: grid; grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr) auto; gap: 10px; align-items: center;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .ns-res-row.src { border-color: var(--primary); background: var(--primary-soft); }
    .ns-res-name { font-weight: 700; line-height: 1.25; }
    .ns-res-name small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
    .ns-val { font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; }
    .ns-val sub, .ns-q sub, .ns-sub { font-size: .6em; color: var(--muted); font-weight: 600; }
    .ns-approx { color: var(--warning); font-weight: 800; }
    @media (max-width: 560px) {
      .ns-res-row { grid-template-columns: minmax(0, 1fr) auto; }
      .ns-res-row .ns-res-name { grid-column: 1 / -1; }
      .ns-res-name small { display: inline; margin-inline-start: 6px; }
    }

    /* ---------- working ---------- */
    .ns-steps-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .ns-steps-head h2 { margin: 0; }
    .ns-target { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ns-target .ns-pick { min-width: min(100%, 340px); }
    .ns-step { border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 14px; }
    .ns-step:first-child { border-top: 0; margin-top: 4px; padding-top: 0; }
    .ns-step-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .ns-step-h h3 { margin: 0 0 4px; }
    .ns-step-n { background: var(--accent); color: var(--surface); border-radius: 999px; padding: 1px 10px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .ns-div, .ns-mul, .ns-place { border-collapse: collapse; font-size: 1.15rem; direction: ltr; margin-block: 8px; }
    .ns-div th, .ns-mul th, .ns-place th { font-family: var(--font); font-size: .78rem; font-weight: 600; color: var(--muted); padding: 2px 10px; text-align: center; vertical-align: bottom; }
    .ns-div td { padding: 3px 12px; text-align: end; white-space: nowrap; }
    .ns-div td.dv { border-right: 3px solid var(--text); color: var(--muted); font-weight: 700; }
    .ns-div tr:not(.last) td.n { border-bottom: 2px solid var(--text); }
    .ns-div td.r, .ns-mul td.d { color: var(--accent); font-weight: 800; text-align: center; }
    .ns-div td.r small { color: var(--muted); font-weight: 600; }
    .ns-arrow { position: relative; width: 26px; padding: 0 !important; }
    .ns-arrow::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 10px; border-left: 3px solid var(--accent); }
    .ns-arrow::after { content: ""; position: absolute; left: 5px; border: 7.5px solid transparent; }
    .ns-arrow.up::after { top: 0; border-bottom: 12px solid var(--accent); border-top: 0; }
    .ns-arrow.down::before { top: 10px; bottom: 14px; }
    .ns-arrow.down::after { bottom: 0; border-top: 12px solid var(--accent); border-bottom: 0; }
    .ns-mul td, .ns-place td { padding: 4px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: end; }
    .ns-mul td b, .ns-place td b { color: var(--accent); }
    .ns-mul td:nth-child(2) { text-align: start; }
    .ns-place tr.zero td { color: var(--muted); }
    .ns-place td.dg { text-align: center; font-weight: 800; color: var(--primary); }
    .ns-formula, .ns-sumline { font-size: 1.1rem; line-height: 2; direction: ltr; unicode-bidi: isolate; word-break: break-word; }
    .ns-formula .t { white-space: nowrap; }
    .ns-groups { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; direction: ltr; margin-block: 10px; }
    .ns-g { border: 2px solid var(--gc, var(--c1)); border-radius: 10px; padding: 4px 8px; text-align: center; min-width: 3.4em; background: var(--surface); }
    .ns-g:nth-child(even) { --gc: var(--c3); }
    .ns-g .bits { font-size: 1.25rem; font-weight: 700; letter-spacing: .08em; }
    .ns-g .pad { color: var(--muted); opacity: .55; }
    .ns-g .ar { color: var(--muted); font-size: .8rem; line-height: 1; }
    .ns-g .dig { font-size: 1.45rem; font-weight: 800; color: var(--accent); line-height: 1.3; }
    .ns-g.top .dig { order: -2; }
    .ns-g.top .ar { order: -1; }
    .ns-g.top { display: flex; flex-direction: column; }
    .ns-pt { align-self: center; font-size: 2rem; font-weight: 800; padding-inline: 2px; }
    .ns-answer { font-size: 1.15rem; }
    .ns-answer .ns-val { font-size: 1.25rem; }

    /* ---------- chart ---------- */
    .ns-chart { max-width: 520px; }
    .ns-chart td, .ns-chart th { text-align: center !important; padding: 5px 8px; }
    .ns-chart td { font-size: 1.05rem; }
    details > summary { cursor: pointer; font-weight: 700; }
    details[open] > summary { margin-bottom: 10px; }

    /* ---------- 8-bit switches ---------- */
    .ns-bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; direction: ltr; max-width: 680px; margin-inline: auto; }
    .ns-bit { display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: center; min-width: 0; }
    .ns-bit:nth-child(5) { margin-left: 8px; }
    .ns-bit .pv { font-size: .85rem; color: var(--muted); font-weight: 700; }
    .ns-bit button { min-height: 66px; font: 800 1.9rem var(--mono); border-radius: 12px; border: 2px solid var(--border);
      background: var(--surface-2); color: var(--muted); cursor: pointer; padding: 0; touch-action: manipulation; }
    .ns-bit button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); box-shadow: 0 0 0 3px var(--primary-soft); }
    .ns-bit .ix { font-size: .72rem; color: var(--muted); }
    .ns-nib { grid-column: span 4; text-align: center; border-top: 3px solid var(--c3); color: var(--c3); font-weight: 800; font-size: 1.25rem; padding-top: 2px; }
    .ns-nib + .ns-nib { margin-left: 8px; }
    .ns-sumline { text-align: center; font-size: 1.2rem; color: var(--muted); margin-top: 10px; }
    .ns-sumline b { color: var(--text); }
    .ns-tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .ns-tile { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; min-width: 0; }
    .ns-tile span { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
    .ns-tile b { display: block; font-size: 2rem; line-height: 1.3; word-break: break-all; }
    .ns-tile .note { font-size: .78rem; color: var(--muted); }
    .ns-tile.char b { font-family: var(--font); color: var(--accent); }
    :root[lang="ur"] .ns-tile.char b { font-family: "Noto Sans", system-ui, sans-serif; }
    .ns-toyctl { justify-content: center; }
    .ns-toyctl .btn { min-width: 52px; }

    /* ---------- binary addition ---------- */
    .ns-add { border-collapse: collapse; font-size: 1.6rem; direction: ltr; margin: 6px auto; }
    .ns-add td { width: 1.25em; text-align: center; padding: 1px 0; }
    .ns-add td.lab { width: auto; padding-right: 12px; font-family: var(--font); font-size: .85rem; color: var(--muted); text-align: right; white-space: nowrap; }
    .ns-add td.dec { width: auto; padding-left: 16px; font-size: 1rem; color: var(--muted); text-align: left; white-space: nowrap; }
    .ns-add tr.cy td.d { color: var(--accent); font-size: 1.05rem; font-weight: 800; }
    .ns-add tr.sum td { border-top: 3px solid var(--text); }
    .ns-add tr.sum td.d { font-weight: 800; color: var(--primary); }
    .ns-add td.hl { background: var(--accent-soft); }
    .ns-cols { margin: 0; padding-inline-start: 1.3em; }
    .ns-cols li { margin-bottom: 4px; border-radius: 6px; padding-inline: 4px; cursor: pointer; }
    .ns-cols li.on { background: var(--accent-soft); }
    .ns-cols li:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ns-rules { display: flex; flex-wrap: wrap; gap: 6px; }
    .ns-rules .badge { font-family: var(--mono); font-size: .9rem; padding: 4px 10px; }

    /* ---------- text encoding ---------- */
    .ns-strip { display: flex; flex-wrap: wrap; gap: 6px; }
    .ns-ch { border: 2px solid var(--b, var(--border)); border-radius: 10px; padding: 4px 8px; text-align: center; background: var(--surface);
      cursor: pointer; min-width: 3.4em; color: var(--text); font: inherit; }
    .ns-ch .g { display: block; font-size: 1.5rem; line-height: 1.5; min-height: 1.5em; }
    .ns-ch .h { display: block; font-size: .74rem; color: var(--muted); white-space: nowrap; direction: ltr; }
    .n1 { --b: var(--c4); } .n2 { --b: var(--c7); } .n3 { --b: var(--c2); } .n4 { --b: var(--c5); }
    .ns-ch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .ns-legend { display: flex; flex-wrap: wrap; gap: 8px; }
    .ns-legend .badge { border: 2px solid var(--b); background: var(--surface); color: var(--text); font-size: .82rem; }
    .ns-enc-table td { white-space: nowrap; }
    .ns-enc-table .g { font-size: 1.3rem; }
    .ns-pfx { color: var(--accent); font-weight: 800; }
    .p0 { color: var(--c1); } .p1 { color: var(--c3); } .p2 { color: var(--c4); } .p3 { color: var(--c7); }
    .ns-how .ns-bitrow { font-size: 1.15rem; line-height: 1.9; direction: ltr; unicode-bidi: isolate; word-break: break-word; }
    .ns-how .ns-bitrow b { font-weight: 800; }
    .ns-byte { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; margin: 2px 4px 2px 0; background: var(--surface); }
    .ns-sample { display: flex; flex-wrap: wrap; gap: 6px; }
    .ns-sample .chip { font-size: .95rem; }
    #enc-text { font-size: 1.3rem; min-height: 80px; }

    /* ---------- quiz ---------- */
    .ns-q { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 800; text-align: center; overflow-wrap: anywhere; direction: ltr; padding: 10px 0; }
    .ns-q .qm { color: var(--accent); }
    .ns-ansrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .ns-ansrow .field { flex: 1 1 220px; }
    #q-ans { font-size: 1.5rem; font-weight: 700; width: 100%; direction: ltr; }
    .ns-score { display: flex; flex-wrap: wrap; gap: 8px; }
    .ns-score .badge { font-size: .88rem; padding: 4px 10px; }
    .ns-fb { min-height: 1.5em; font-weight: 700; font-size: 1.1rem; }

    /* ---------- worksheet / print ---------- */
    #print-area { display: none; }
    .ns-ws h2 { margin-bottom: 4px; }
    .ns-ws ol { columns: 2; column-gap: 40px; font-size: 1.15rem; line-height: 2.6; padding-inline-start: 2.6em; margin: 0; }
    .ns-ws .key ol { line-height: 1.8; font-size: 1rem; }
    .ns-ws .key { break-before: page; }
    .edu-fullscreen-on .ns-panel { font-size: 1.12rem; }
    .edu-fullscreen-on .ns-val { font-size: 1.7rem; }

    @media print {
      .ns-tabbar, .ns-steps-head .ns-target, #fs-btn { display: none !important; }
      body.ns-printing .edu-main > :not(#print-area) { display: none !important; }
      body.ns-printing #print-area { display: block !important; padding: 0 6px; }
      .ns-g, .ns-tile, .ns-res-row { break-inside: avoid; }
      .ns-bit button[aria-pressed="true"] { background: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      /* light text on a coloured chip: keep the chip colour, or the text prints white on white */
      .ns-step-n, .ns-pick .btn[aria-pressed="true"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      details.card:not([open]) { display: none; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="ns-tabbar no-print">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" id="tab-convert" data-tab="convert" aria-controls="p-convert" data-i18n="tab_convert"></button>
        <button type="button" role="tab" id="tab-bits" data-tab="bits" aria-controls="p-bits" data-i18n="tab_bits"></button>
        <button type="button" role="tab" id="tab-add" data-tab="add" aria-controls="p-add" data-i18n="tab_add"></button>
        <button type="button" role="tab" id="tab-text" data-tab="text" aria-controls="p-text" data-i18n="tab_text"></button>
        <button type="button" role="tab" id="tab-quiz" data-tab="quiz" aria-controls="p-quiz" data-i18n="tab_quiz"></button>
      </div>
      <button type="button" class="btn btn-sm" id="fs-btn" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">⛶</button>
    </div>

    <!-- ================= converter ================= -->
    <section id="p-convert" class="ns-panel" role="tabpanel" aria-labelledby="tab-convert">
      <div class="ns-conv-grid">
        <div class="card stack">
          <div>
            <label class="ns-label" for="num-in" data-i18n="number_in"></label>
            <input id="num-in" class="ns-big-in" type="text" aria-describedby="conv-msg" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="48" dir="ltr">
          </div>
          <div>
            <span class="ns-label" id="from-l" data-i18n="from_base"></span>
            <div class="ns-pick" id="from" role="group" aria-labelledby="from-l"></div>
          </div>
          <p class="ns-msg small" id="conv-msg" aria-live="polite"></p>
          <label class="field" id="places-wrap">
            <span data-i18n="places_label"></span>
            <input id="places" type="number" min="1" max="24" step="1" value="8" style="max-width: 7rem">
          </label>
          <div class="no-print">
            <span class="ns-label small" data-i18n="try_these"></span>
            <div class="ns-examples" id="examples"></div>
          </div>
        </div>
        <div class="card">
          <h2 class="ns-h" data-i18n="all_bases"></h2>
          <div class="ns-res" id="results" aria-live="polite"></div>
        </div>
      </div>

      <section class="card" id="steps-card">
        <div class="ns-steps-head">
          <h2 data-i18n="steps_title"></h2>
          <div class="ns-target">
            <span class="small muted" id="target-l" data-i18n="steps_for"></span>
            <div class="ns-pick three" id="target" role="group" aria-labelledby="target-l"></div>
          </div>
        </div>
        <div id="steps"></div>
      </section>

      <details class="card" id="chart-card">
        <summary data-i18n="chart_title"></summary>
        <div class="scroll-x"><table class="table ns-chart" id="chart"></table></div>
        <p class="no-print"><button type="button" class="btn btn-sm" id="chart-print" data-i18n="print"></button></p>
      </details>
    </section>

    <!-- ================= 8-bit switches ================= -->
    <section id="p-bits" class="ns-panel" role="tabpanel" aria-labelledby="tab-bits" hidden>
      <div class="card stack">
        <p class="muted mb0" data-i18n="bits_hint"></p>
        <div class="ns-bits" id="bits"></div>
        <div class="ns-sumline" id="bit-sum" aria-live="polite"></div>
        <div class="ns-tiles">
          <div class="ns-tile"><span data-i18n="base10"></span><b id="bit-dec"></b></div>
          <div class="ns-tile"><span data-i18n="base16"></span><b id="bit-hex"></b></div>
          <div class="ns-tile"><span data-i18n="base8"></span><b id="bit-oct"></b></div>
          <div class="ns-tile char"><span data-i18n="ascii_char"></span><b id="bit-char" class="no-i18n"></b><div class="note" id="bit-note"></div></div>
        </div>
        <div class="row ns-toyctl no-print">
          <button type="button" class="btn" id="bit-clear" data-i18n="clear"></button>
          <button type="button" class="btn" id="bit-dec1" data-i18n-aria-label="sub_one" data-i18n-title="sub_one" dir="ltr">−1</button>
          <button type="button" class="btn btn-primary" id="bit-inc" data-i18n-aria-label="add_one" data-i18n-title="add_one" dir="ltr">+1</button>
          <button type="button" class="btn" id="bit-shl" data-i18n="shift_left"></button>
          <button type="button" class="btn" id="bit-shr" data-i18n="shift_right"></button>
          <button type="button" class="btn" id="bit-not" data-i18n="flip_all"></button>
        </div>
        <div class="grid-2 no-print">
          <label class="field"><span data-i18n="type_dec"></span><input id="bit-dec-in" type="number" min="0" max="255" step="1" inputmode="numeric"></label>
          <label class="field"><span data-i18n="type_char"></span><input id="bit-char-in" type="text" maxlength="4" autocomplete="off" class="no-i18n"></label>
        </div>
        <p class="small muted mb0" id="bit-msg" aria-live="polite"></p>
      </div>
    </section>

    <!-- ================= binary addition ================= -->
    <section id="p-add" class="ns-panel" role="tabpanel" aria-labelledby="tab-add" hidden>
      <div class="card stack">
        <p class="muted mb0" data-i18n="add_hint"></p>
        <div class="grid-2">
          <label class="field"><span data-i18n="num_a"></span><input id="add-a" class="ns-big-in" type="text" maxlength="40" autocomplete="off" spellcheck="false" inputmode="numeric" dir="ltr"></label>
          <label class="field"><span data-i18n="num_b"></span><input id="add-b" class="ns-big-in" type="text" maxlength="40" autocomplete="off" spellcheck="false" inputmode="numeric" dir="ltr"></label>
        </div>
        <div class="row no-print"><button type="button" class="btn" id="add-rand" data-i18n="new_example"></button></div>
        <p class="ns-msg small" id="add-msg" aria-live="polite"></p>
        <div class="scroll-x" id="add-out" aria-live="polite"></div>
        <div class="callout success" id="add-check"></div>
        <details class="panel" id="add-cols-wrap" open>
          <summary data-i18n="explain_cols"></summary>
          <ol class="ns-cols" id="add-cols"></ol>
        </details>
        <div>
          <span class="ns-label small" data-i18n="add_rules"></span>
          <div class="ns-rules ns-ltr"><span class="badge">0 + 0 = 0</span><span class="badge">0 + 1 = 1</span><span class="badge">1 + 0 = 1</span><span class="badge">1 + 1 = 10</span><span class="badge">1 + 1 + 1 = 11</span></div>
        </div>
      </div>
    </section>

    <!-- ================= text encoding ================= -->
    <section id="p-text" class="ns-panel" role="tabpanel" aria-labelledby="tab-text" hidden>
      <div class="card stack">
        <p class="muted mb0" data-i18n="enc_hint"></p>
        <label class="ns-label" for="enc-text" data-i18n="enc_label"></label>
        <textarea id="enc-text" class="no-i18n" maxlength="500" spellcheck="false"></textarea>
        <div class="ns-sample no-i18n no-print" id="enc-samples"></div>
        <div class="ns-tiles" aria-live="polite">
          <div class="ns-tile"><span data-i18n="enc_chars"></span><b id="enc-n"></b></div>
          <div class="ns-tile"><span data-i18n="enc_utf8"></span><b id="enc-bytes"></b></div>
          <div class="ns-tile"><span data-i18n="enc_utf32"></span><b id="enc-u32"></b></div>
        </div>
        <div class="ns-legend" id="enc-legend"></div>
        <p class="small muted mb0" data-i18n="enc_pick"></p>
        <div class="ns-strip" id="enc-strip"></div>
        <p class="small muted mb0" id="enc-limit"></p>
      </div>
      <div class="card ns-how" id="enc-how" aria-live="polite"></div>
      <div class="card">
        <h2 class="ns-h" data-i18n="why_title"></h2>
        <p data-i18n="why_text"></p>
        <div class="scroll-x">
          <table class="table" id="utf8-rules">
            <thead><tr><th data-i18n="col_range"></th><th data-i18n="col_bytes"></th><th data-i18n="col_pattern"></th><th data-i18n="example"></th></tr></thead>
            <tbody class="ns-mono no-i18n"></tbody>
          </table>
        </div>
        <p class="small" id="matra-note"></p>
        <p class="small muted mb0" data-i18n="enc_history"></p>
      </div>
      <details class="card">
        <summary data-i18n="enc_table"></summary>
        <div class="scroll-x">
          <table class="table ns-enc-table" id="enc-table">
            <thead><tr><th data-i18n="col_char"></th><th data-i18n="col_code"></th><th data-i18n="col_script"></th><th data-i18n="col_hex"></th><th data-i18n="col_bin"></th><th data-i18n="col_bytes"></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <!-- ================= practice ================= -->
    <section id="p-quiz" class="ns-panel" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="card stack">
        <div>
          <span class="ns-label" id="lvl-l" data-i18n="quiz_level"></span>
          <div class="ns-pick" id="levels" role="group" aria-labelledby="lvl-l"></div>
        </div>
        <div class="ns-score" id="q-score" aria-live="polite"></div>
        <p class="mb0 center" id="q-text"></p>
        <div class="ns-q" id="q-show"></div>
        <div class="ns-ansrow">
          <label class="field"><span id="q-ans-l"></span><input id="q-ans" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" dir="ltr"></label>
          <button type="button" class="btn btn-primary btn-lg" id="q-check" data-i18n="check"></button>
          <button type="button" class="btn btn-lg" id="q-next" data-i18n="next"></button>
        </div>
        <div class="ns-fb" id="q-fb" aria-live="polite"></div>
        <div class="row no-print"><button type="button" class="btn btn-sm" id="q-show-work" data-i18n="show_working" hidden></button></div>
        <div id="q-work" hidden></div>
        <p class="small muted mb0" data-i18n="quiz_hint"></p>
      </div>
      <div class="row no-print">
        <button type="button" class="btn" id="ws-print" data-i18n="print_ws"></button>
        <button type="button" class="btn btn-danger" id="q-reset" data-i18n="reset_score"></button>
      </div>
    </section>

    <details class="card no-print" id="help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
      </ul>
    </details>

    <section id="print-area"></section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
