<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Computers See · AI Pathshala</title>
  <meta name="description" content="See that a picture is a grid of numbers and how filters find edges, like the first layer of a CNN. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- picture source ---------- */
    .src-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .src-head h2 { margin: 0; font-size: 1.15rem; }
    .samples { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
    .sample-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 7px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; cursor: pointer; font: inherit; font-size: .82rem; font-weight: 600; line-height: 1.2; text-align: center; min-height: 40px; }
    .sample-btn:hover { background: var(--surface-2); }
    .sample-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .sample-btn canvas { width: 52px; height: 52px; border-radius: 8px; display: block; image-rendering: auto; }
    .src-actions { margin-top: 10px; }
    #src-name { font-weight: 600; }
    .cam-box { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .cam-box video { width: min(320px, 100%); aspect-ratio: 4 / 3; background: #000; border-radius: 10px; object-fit: cover; }
    .src-grid { display: grid; gap: 4px 28px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) {
      .src-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
      .src-grid .res-field { margin-top: 0; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
    }
    .res-field { margin-top: 14px; display: grid; gap: 4px 14px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .res-field label { grid-column: 1 / -1; }
    .res-field output { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .res-field .hint { grid-column: 1 / -1; color: var(--muted); font-size: .84rem; margin: 0; }
    .res-field input[type="range"] { min-height: 36px; }

    /* ---------- workspace + tabs ---------- */
    #workspace { margin-top: 16px; }
    #workspace:fullscreen { background: var(--bg); padding: 16px; overflow: auto; }
    #workspace:-webkit-full-screen { background: var(--bg); padding: 16px; overflow: auto; }
    .tab-bar { display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .tab-bar .tabs { border-bottom: 0; margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
    .tab-bar .tabs button { min-height: 44px; }
    .tab-bar .tool { flex: none; margin-bottom: 4px; }
    .panel-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .panel-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
    .card h2 { font-size: 1.12rem; margin-bottom: 10px; }
    .pic { width: 100%; max-width: 560px; aspect-ratio: 1 / 1; height: auto; display: block; margin: 0 auto; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); touch-action: none; cursor: crosshair; image-rendering: pixelated; }
    .pic:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 12px; }
    .opts .check { min-height: 40px; }
    .seg button { min-height: 40px; }
    .hint { color: var(--muted); font-size: .84rem; margin: 4px 0 0; }

    /* selected pixel */
    .sel-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .swatch { width: 72px; height: 72px; border-radius: 12px; border: 2px solid var(--border); flex: none; }
    .sel-pos { font-weight: 700; font-size: 1.05rem; }
    .hex { font-family: var(--mono); font-weight: 700; direction: ltr; unicode-bidi: isolate; }
    .rgb-rows { display: grid; gap: 6px; margin-top: 12px; }
    .rgb-row { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) 3rem; gap: 10px; align-items: center; }
    .rgb-row .nm { font-weight: 700; font-size: .9rem; }
    .rgb-row .bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; direction: ltr; }
    .rgb-row .bar span { display: block; height: 100%; border-radius: inherit; }
    .rgb-row .num { font-family: var(--mono); font-weight: 800; font-size: 1.1rem; text-align: end; font-variant-numeric: tabular-nums; }
    .formula { font-family: var(--mono); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 10px; direction: ltr; text-align: start; font-size: .9rem; overflow-wrap: anywhere; }
    .formula-lbl { font-size: .88rem; color: var(--muted); margin: 10px 0 0; }
    .nb-wrap { margin-top: 14px; }
    .nb-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 46px)); gap: 2px; direction: ltr; margin-top: 6px; }
    .nb-cell { aspect-ratio: 1 / 1; display: grid; place-items: center; font-family: var(--mono); font-size: .82rem; font-weight: 700; border-radius: 4px; font-variant-numeric: tabular-nums; }
    .nb-cell.center { outline: 3px solid var(--accent); outline-offset: -1px; }
    .count-box { margin-top: 16px; }
    .count-box p { margin: 0; }
    .count-box p + p { margin-top: 6px; }
    details.inside { margin-top: 12px; }
    details.inside summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
    details.inside[open] summary { margin-bottom: 8px; }

    /* ---------- filters ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips .chip { min-height: 40px; }
    .pair { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
    .pair figure { margin: 0; min-width: 0; }
    .pair figcaption { font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
    .f-desc { margin-top: 12px; }
    .kernel-wrap { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
    .kgrid { display: grid; grid-template-columns: repeat(3, 62px); gap: 4px; direction: ltr; }
    .kgrid input { width: 62px; min-height: 46px; text-align: center; font-family: var(--mono); font-weight: 800; font-size: 1.05rem; padding: 4px; }
    .kgrid input.neg { color: var(--accent); }
    .kgrid input::-webkit-inner-spin-button, .kgrid input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .kgrid input { -moz-appearance: textfield; appearance: textfield; }
    .kgrid input.pos { color: var(--primary); }
    .kstatic { display: grid; grid-template-columns: repeat(3, 46px); gap: 3px; direction: ltr; }
    .kstatic span { display: grid; place-items: center; min-height: 40px; font-family: var(--mono); font-weight: 800; border-radius: 6px; background: var(--surface-2); }
    .ksub { font-weight: 700; font-size: .88rem; margin-bottom: 4px; }
    .k-extra { display: flex; flex-direction: column; gap: 10px; }
    .k-extra input[type="number"] { width: 6rem; }
    .math { direction: ltr; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 8px; }
    .mblock { display: flex; flex-direction: column; gap: 4px; }
    .mblock .ttl { font-size: .78rem; color: var(--muted); font-weight: 700; text-align: center; }
    .mgrid { display: grid; grid-template-columns: repeat(3, minmax(40px, auto)); gap: 2px; }
    .mcell { min-height: 34px; padding: 2px 5px; display: grid; place-items: center; font-family: var(--mono); font-size: .8rem; font-weight: 700; border-radius: 4px; background: var(--surface-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mcell.neg { color: var(--accent); }
    .mop { font-size: 1.4rem; font-weight: 800; color: var(--muted); }
    .steps { margin-top: 12px; display: grid; gap: 6px; }
    .step { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    .step .lbl { font-weight: 600; font-size: .9rem; }
    .step .val { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; font-size: .9rem; }
    .step.final .val { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
    .step.final .lbl { font-size: 1rem; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    #slide-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .warn-txt { color: var(--danger); font-weight: 600; font-size: .88rem; }

    /* ---------- CNN ---------- */
    .fm-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 14px; }
    .fm-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .fm-card h3 { font-size: .95rem; margin: 0; }
    .fm-card canvas { width: 100%; aspect-ratio: 1 / 1; height: auto; display: block; border-radius: 6px; image-rendering: pixelated; background: #000; }
    .fm-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; }
    .fm-size { white-space: nowrap; }
    .heat { display: grid; grid-template-columns: repeat(3, 20px); gap: 2px; direction: ltr; }
    .heat span { width: 20px; height: 20px; border-radius: 3px; display: grid; place-items: center; font-family: var(--mono); font-size: .62rem; font-weight: 700; color: var(--text); }
    .fm-size { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
    .legend-sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }
    .pipe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .pipe .box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: .9rem; flex: 1 1 130px; text-align: center; }
    .pipe .box .ico { display: block; font-size: 1.5rem; }
    .pipe .box.last { background: var(--success-soft); border-color: var(--success); }
    .pipe .arr { font-weight: 800; color: var(--muted); font-size: 1.2rem; }
    [dir="rtl"] .pipe .arr { display: inline-block; transform: scaleX(-1); }
    @media (max-width: 620px) {
      .pipe { flex-direction: column; align-items: stretch; gap: 4px; }
      .pipe .box { flex: none; }
      .pipe .arr, [dir="rtl"] .pipe .arr { align-self: center; transform: rotate(90deg); line-height: 1; }
    }

    /* ---------- game ---------- */
    .g-layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 4px; }
    .g-layout .pair { margin-top: 0; }
    @media (min-width: 900px) {
      .g-layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: end; gap: 20px; }
      .g-layout .g-opts { grid-template-columns: minmax(0, 1fr); }
    }
    .g-opts { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: end; }
    .g-opts .btn:disabled { opacity: 1; cursor: default; }
    .g-opts .btn:disabled:not(.right):not(.wrongpick) { opacity: .5; }
    .g-opts .btn { min-height: 52px; white-space: normal; }
    .g-opts .btn.right { background: var(--success-soft); border-color: var(--success); }
    .g-opts .btn.wrongpick { background: var(--danger-soft); border-color: var(--danger); }
    .g-score { font-weight: 800; font-size: 1.2rem; }
    #g-feedback:empty { display: none; }

    details.help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    details.help li + li { margin-top: 6px; }
    .help { margin-top: 16px; }

    @media (max-width: 620px) {
      .tab-bar { border-bottom: 0; }
      .tab-bar .tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; overflow: visible; }
      .tab-bar .tabs button { white-space: normal; border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 10px; background: var(--surface); color: var(--text); text-align: center; padding: 8px 6px; line-height: 1.3; }
      .tab-bar .tabs button[aria-selected="true"] { background: var(--primary-soft); border-color: var(--primary); border-bottom-color: var(--accent); }
      #fs-btn { display: none; }
    }
    @media (max-width: 560px) {
      .fs-lbl { display: none; }
      .nb-cell { font-size: .74rem; }
      .kgrid { grid-template-columns: repeat(3, 54px); }
      .kgrid input { width: 54px; }
      .rgb-row { grid-template-columns: 3.8rem minmax(0, 1fr) 2.8rem; }
    }

    /* ---------- print: "be the computer" worksheet ---------- */
    .ws h1 { font-size: 20pt; margin: 0 0 4pt; }
    .ws .ws-name { margin: 6pt 0 10pt; }
    .ws table { border-collapse: collapse; direction: ltr; }
    .ws td { border: 1.2pt solid #000; text-align: center; font-family: var(--mono); font-weight: 700; }
    .ws .t-in td { width: 1.25cm; height: 1.05cm; font-size: 12pt; }
    .ws .t-in td.edge { color: #555; background: #eee; }
    .ws .t-k td { width: 1.1cm; height: 1cm; font-size: 13pt; }
    .ws .t-out td { width: 1.6cm; height: 1.3cm; }
    .ws .t-key td { width: 1.05cm; height: .75cm; font-size: 10pt; }
    .ws-row { display: flex; flex-wrap: wrap; gap: 18pt 28pt; align-items: flex-start; margin: 10pt 0; }
    .ws h2 { font-size: 13pt; margin: 0 0 4pt; }
    .ws .ws-key { margin-top: 16pt; border-top: 1.5pt dashed #000; padding-top: 8pt; }
    .ws .small { font-size: 10pt; }
    @media print {
      .edu-intro, #src-card, #workspace, .help { display: none !important; }
      .ws { display: block !important; color: #000; }
      .ws td { color: #000; }
      @page { margin: 1.2cm; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <!-- 1. choose a picture -->
    <section class="card no-print" id="src-card">
      <div class="src-head">
        <h2 data-i18n="src_title"></h2>
        <button class="btn btn-sm btn-danger" id="reset-btn" type="button" data-i18n="reset"></button>
      </div>
      <div class="src-grid">
      <div>
      <div class="samples" id="samples" role="group" data-i18n-aria-label="samples_label"></div>
      <div class="row src-actions">
        <button class="btn" id="upload-btn" type="button"><span aria-hidden="true">🖼️</span> <span data-i18n="upload_photo"></span></button>
        <input type="file" id="upload-input" accept="image/*" hidden>
        <button class="btn" id="cam-btn" type="button"><span aria-hidden="true">📷</span> <span data-i18n="camera"></span></button>
        <span id="src-name" class="small" aria-live="polite"></span>
      </div>
      <p class="tiny muted mb0" style="margin-top:8px" data-i18n="src_note"></p>
      <div class="cam-box" id="cam-box" hidden>
        <video id="cam-video" playsinline muted autoplay></video>
        <div class="row">
          <button class="btn btn-primary" id="cam-snap" type="button" disabled><span aria-hidden="true">📸</span> <span data-i18n="cam_snap"></span></button>
          <button class="btn" id="cam-close" type="button" data-i18n="close"></button>
        </div>
        <p class="small mb0" id="cam-msg" aria-live="polite"></p>
      </div>
      </div>
      <div class="res-field">
        <label for="res" data-i18n="res_label"></label>
        <input type="range" id="res" min="0" max="9" step="1" value="5">
        <output id="res-out" for="res" class="no-i18n"></output>
        <p class="hint" data-i18n="res_hint"></p>
      </div>
      </div>
    </section>

    <div id="workspace">
      <div class="tab-bar">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" id="tab-pixels" data-tab="pixels" aria-controls="panel-pixels" type="button"><span aria-hidden="true">🔍</span> <span data-i18n="tab_pixels"></span></button>
          <button role="tab" id="tab-filters" data-tab="filters" aria-controls="panel-filters" type="button"><span aria-hidden="true">🧮</span> <span data-i18n="tab_filters"></span></button>
          <button role="tab" id="tab-cnn" data-tab="cnn" aria-controls="panel-cnn" type="button"><span aria-hidden="true">🧠</span> <span data-i18n="tab_cnn"></span></button>
          <button role="tab" id="tab-game" data-tab="game" aria-controls="panel-game" type="button"><span aria-hidden="true">🎯</span> <span data-i18n="tab_game"></span></button>
        </div>
        <button class="btn btn-sm tool" id="fs-btn" type="button" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen"><span aria-hidden="true">⛶</span> <span class="fs-lbl" data-i18n="fullscreen"></span></button>
      </div>

      <!-- Panel 1: pixels are numbers -->
      <section id="panel-pixels" role="tabpanel" aria-labelledby="tab-pixels">
        <div class="panel-grid">
          <div class="card">
            <h2 data-i18n="px_title"></h2>
            <canvas id="px-canvas" class="pic" width="512" height="512" tabindex="0" role="img" data-i18n-aria-label="px_canvas_label"></canvas>
            <div class="opts">
              <span class="small muted" data-i18n="ch_label"></span>
              <div class="seg" id="ch-seg" role="group" data-i18n-aria-label="ch_label">
                <button type="button" data-ch="rgb" data-i18n="ch_rgb"></button>
                <button type="button" data-ch="grey" data-i18n="ch_grey"></button>
                <button type="button" data-ch="r" data-i18n="ch_r"></button>
                <button type="button" data-ch="g" data-i18n="ch_g"></button>
                <button type="button" data-ch="b" data-i18n="ch_b"></button>
              </div>
            </div>
            <div class="opts">
              <label class="check"><input type="checkbox" id="opt-grid"> <span data-i18n="opt_grid"></span></label>
              <label class="check"><input type="checkbox" id="opt-nums"> <span data-i18n="opt_nums"></span></label>
            </div>
            <p class="hint" id="nums-hint" data-i18n="nums_hint"></p>
          </div>

          <div class="card" aria-live="polite" id="sel-card">
            <h2 data-i18n="sel_title"></h2>
            <div class="sel-top">
              <div class="swatch" id="swatch"></div>
              <div>
                <div class="sel-pos" id="sel-pos"></div>
                <div class="small muted"><span data-i18n="hex_label"></span>: <span class="hex" id="hex"></span></div>
              </div>
            </div>
            <div class="rgb-rows">
              <div class="rgb-row"><span class="nm" data-i18n="ch_r"></span><span class="bar"><span id="bar-r" style="background:#e03131"></span></span><span class="num" id="val-r"></span></div>
              <div class="rgb-row"><span class="nm" data-i18n="ch_g"></span><span class="bar"><span id="bar-g" style="background:#2f9e44"></span></span><span class="num" id="val-g"></span></div>
              <div class="rgb-row"><span class="nm" data-i18n="ch_b"></span><span class="bar"><span id="bar-b" style="background:#1c7ed6"></span></span><span class="num" id="val-b"></span></div>
            </div>
            <p class="formula-lbl" data-i18n="grey_formula"></p>
            <div class="formula no-i18n" id="val-grey"></div>
            <div class="nb-wrap">
              <h3 class="mb0" data-i18n="nb_title"></h3>
              <p class="hint" id="nb-hint"></p>
              <div class="nb-grid no-i18n" id="nb-grid"></div>
            </div>
            <div class="tool-row">
              <button class="btn btn-sm" id="dl-csv" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_csv"></span></button>
            </div>
          </div>
        </div>
        <div class="callout count-box">
          <p id="count-line"></p>
          <p class="small" data-i18n="count_fact"></p>
        </div>
        <details class="card inside">
          <summary data-i18n="inside_title"></summary>
          <p class="mt0" data-i18n="px_inside"></p>
        </details>
      </section>

      <!-- Panel 2: filters -->
      <section id="panel-filters" role="tabpanel" aria-labelledby="tab-filters" hidden>
        <div class="card">
          <h2 data-i18n="f_title"></h2>
          <div class="chips" id="f-chips" role="group" data-i18n-aria-label="f_title"></div>
          <div class="opts">
            <span class="small muted" data-i18n="work_on"></span>
            <div class="seg" id="mode-seg" role="group" data-i18n-aria-label="work_on">
              <button type="button" data-mode="grey" data-i18n="ch_grey"></button>
              <button type="button" data-mode="rgb" data-i18n="ch_rgb"></button>
            </div>
          </div>
          <p class="callout f-desc mb0" id="f-desc"></p>
        </div>
        <div class="panel-grid" style="margin-top:16px">
          <div class="card">
            <div class="pair">
              <figure><figcaption data-i18n="in_label"></figcaption><canvas id="in-canvas" class="pic" width="512" height="512" tabindex="0" role="img" data-i18n-aria-label="in_label"></canvas></figure>
              <figure><figcaption data-i18n="out_label"></figcaption><canvas id="out-canvas" class="pic" width="512" height="512" tabindex="0" role="img" data-i18n-aria-label="out_label"></canvas></figure>
            </div>
            <p class="hint" data-i18n="tap_hint"></p>
            <div class="tool-row">
              <button class="btn btn-accent" id="slide-btn" type="button" aria-pressed="false"><span aria-hidden="true">▶</span> <span id="slide-lbl"></span></button>
              <button class="btn" id="print-btn" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print_ws"></span></button>
              <label class="check"><input type="checkbox" id="ws-answers"> <span data-i18n="ws_answers"></span></label>
              <button class="btn btn-sm" id="dl-png" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_png"></span></button>
            </div>
            <p class="hint" data-i18n="slide_hint"></p>
          </div>
          <div class="card">
            <h2 data-i18n="kernel_title"></h2>
            <div id="kernel-area"></div>
            <hr class="divider">
            <h2 class="mb0" data-i18n="math_title"></h2>
            <p class="small muted" id="math-pos"></p>
            <div id="math-area" aria-live="polite"></div>
            <p class="tiny muted" data-i18n="m_border"></p>
          </div>
        </div>
      </section>

      <!-- Panel 3: what a CNN sees -->
      <section id="panel-cnn" role="tabpanel" aria-labelledby="tab-cnn" hidden>
        <div class="card">
          <h2 data-i18n="cnn_title"></h2>
          <p data-i18n="cnn_intro"></p>
          <div class="opts">
            <span class="small muted" data-i18n="act_label"></span>
            <div class="seg" id="act-seg" role="group" data-i18n-aria-label="act_label">
              <button type="button" data-act="relu" data-i18n="act_relu"></button>
              <button type="button" data-act="abs" data-i18n="act_abs"></button>
            </div>
            <label class="check"><input type="checkbox" id="opt-pool"> <span data-i18n="pool_opt"></span></label>
          </div>
          <p class="hint" id="act-hint"></p>
          <div class="fm-grid" id="fm-grid"></div>
          <p class="small muted" style="margin-top:10px"><span class="legend-sw" style="background:var(--c7)"></span> / <span class="legend-sw" style="background:var(--c2)"></span> <span data-i18n="kernel_legend"></span></p>
        </div>
        <div class="card" style="margin-top:16px">
          <h2 data-i18n="pipe_title"></h2>
          <div class="pipe" id="pipe">
            <div class="box"><span class="ico" aria-hidden="true">🔢</span><span data-i18n="pipe_1"></span></div><span class="arr" aria-hidden="true">→</span>
            <div class="box"><span class="ico" aria-hidden="true">📐</span><span data-i18n="pipe_2"></span></div><span class="arr" aria-hidden="true">→</span>
            <div class="box"><span class="ico" aria-hidden="true">◐</span><span data-i18n="pipe_3"></span></div><span class="arr" aria-hidden="true">→</span>
            <div class="box"><span class="ico" aria-hidden="true">👁️</span><span data-i18n="pipe_4"></span></div><span class="arr" aria-hidden="true">→</span>
            <div class="box last"><span class="ico" aria-hidden="true">🥭</span><span data-i18n="pipe_5"></span></div>
          </div>
          <p class="callout accent" style="margin-top:12px" data-i18n="pipe_note"></p>
        </div>
      </section>

      <!-- Panel 4: guess the filter -->
      <section id="panel-game" role="tabpanel" aria-labelledby="tab-game" hidden>
        <div class="card" id="g-card">
          <div class="row spread">
            <h2 class="mb0" data-i18n="g_title"></h2>
            <span class="g-score" id="g-score" aria-live="polite"></span>
          </div>
          <p data-i18n="g_intro"></p>
          <div class="g-layout">
            <div class="pair">
              <figure><figcaption data-i18n="in_label"></figcaption><canvas id="g-in" class="pic" width="512" height="512" role="img" data-i18n-aria-label="in_label"></canvas></figure>
              <figure><figcaption data-i18n="g_mystery"></figcaption><canvas id="g-out" class="pic" width="512" height="512" role="img" data-i18n-aria-label="g_mystery"></canvas></figure>
            </div>
            <div class="g-opts" id="g-options"></div>
          </div>
          <p class="callout" id="g-feedback" aria-live="polite" style="margin-top:12px"></p>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-primary" id="g-next" type="button" data-i18n="next"></button>
            <span class="small muted" data-i18n="g_tip"></span>
          </div>
        </div>
      </section>
    </div>

    <details class="card help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <section class="ws print-only" id="worksheet"></section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
