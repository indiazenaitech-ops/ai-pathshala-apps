<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Study Planner · AI Pathshala</title>
  <meta name="description" content="Free exam revision timetable maker for Indian students: enter your date sheet and chapters, get a day-by-day plan with Pomodoro breaks, two revision rounds, a light day before each paper, countdown, progress, print, CSV and calendar export. Works offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    @page { size: A4 portrait; margin: 10mm; }
    h2 { font-size: 1.2rem; }
    .h-sm { font-size: .95rem; color: var(--muted); margin: 0 0 4px; font-weight: 700; }

    /* ---------- sample note ---------- */
    #sample-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
    #sample-note > span { flex: 1 1 260px; min-width: 0; }

    /* ---------- tabs ---------- */
    .tabs button { font-size: 1rem; min-height: 46px; padding-inline: 14px; }
    .tabs .ti { margin-inline-end: 6px; }
    .tabs .tdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-inline-start: 6px; vertical-align: middle; }
    @media (max-width: 620px) {
      .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; overflow: visible; }
      .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; white-space: normal; font-size: .76rem; line-height: 1.2; text-align: center; min-height: 58px; }
      .tabs .ti { margin: 0; font-size: 1.25rem; }
      .tabs .tdot { margin: 0; }
    }
    .tabpanel > * + * { margin-top: 14px; }

    /* ---------- summary ---------- */
    .sum-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-areas: "today cd" "today prog"; grid-template-rows: auto 1fr; align-items: start; }
    .cd-card { grid-area: cd; }
    .prog-card { grid-area: prog; }
    .today-card { grid-area: today; }
    @media (max-width: 860px) { .sum-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cd" "today" "prog"; grid-template-rows: none; } }
    .cd-row { display: flex; align-items: center; gap: 14px; }
    .cd-num { font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: center; }
    .cd-txt { min-width: 0; }
    .cd-txt b { display: block; font-size: 1.05rem; }
    .cd-later { margin: 8px 0 0; }
    .pct-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .pct-num { font-size: 2.2rem; font-weight: 800; line-height: 1.1; color: var(--primary); font-variant-numeric: tabular-nums; }
    .progress { height: 12px; margin: 6px 0; }
    .sp-list { display: grid; gap: 7px; margin-top: 12px; }
    .sp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: .9rem; }
    .sp-row .progress { grid-column: 1 / -1; height: 7px; margin: 0; }
    .sp-row .progress > span { background: var(--sc); }
    .sp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .today-card h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .today-card h2 .muted { font-size: .9rem; font-weight: 600; }

    /* ---------- messages + toolbar ---------- */
    #plan-msgs { display: grid; gap: 10px; }
    #plan-msgs:empty { display: none; }
    .msg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .msg > span { flex: 1 1 240px; min-width: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar .seg button { min-height: 42px; }
    .toolbar .spacer { flex: 1 1 auto; }
    .count-badge { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .78rem; font-weight: 800; }
    .count-badge:empty { display: none; }

    /* ---------- day cards ---------- */
    .days { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
    .day { padding: 12px 14px; border-inline-start: 6px solid var(--border); }
    .day.is-today { border-inline-start-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
    .day.is-exam { border-inline-start-color: var(--danger); }
    .day.is-light { border-inline-start-color: var(--info); }
    .day.is-free { padding-block: 8px; box-shadow: none; background: var(--surface-2); }
    .day-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 8px; }
    .day.is-free .day-h { margin: 0; }
    .day-date { font-weight: 800; font-size: 1.05rem; }
    .day-sum { margin-inline-start: auto; color: var(--muted); font-size: .85rem; }
    .day-note { margin: 8px 0 0; font-size: .88rem; }
    .exam-line { font-weight: 700; color: var(--danger); margin: 0 0 6px; }
    .badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
    .sess-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .sess { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding-block: 5px; border-radius: 10px; min-height: 50px;
      background: color-mix(in srgb, var(--sc) 10%, var(--surface)); border-inline-start: 4px solid var(--sc); padding-inline: 10px 6px; }
    .sess-main { flex: 1 1 210px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .sess-txt { flex: 1 1 auto; min-width: 0; font-weight: 500; font-size: .95rem; overflow-wrap: anywhere; line-height: 1.35; }
    .sess-subj { font-weight: 700; }
    .sess-meta { display: block; color: var(--muted); font-size: .8rem; font-weight: 500; }
    .sess-meta > span { unicode-bidi: isolate; }
    .sess.done .sess-subj, .sess.done .sess-ch { text-decoration: line-through; color: var(--muted); }
    .sess.done { background: color-mix(in srgb, var(--success) 8%, var(--surface)); }
    .sess.missed { background: var(--danger-soft); }
    .sess .badge { flex: none; }
    .sess-acts { display: flex; align-items: center; gap: 4px; margin-inline-start: auto; flex-wrap: wrap; justify-content: flex-end; }
    .pips { display: flex; flex-wrap: wrap; gap: 0; }
    .pip { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; border-radius: 8px; }
    .pip:hover { background: color-mix(in srgb, var(--sc) 20%, transparent); }
    .pip input[type="checkbox"] { width: 24px; height: 24px; margin: 0; cursor: pointer; }
    .sess-timer { flex: none; min-width: 42px; min-height: 42px; font-size: 1rem; }
    #show-past { justify-self: start; }
    .empty-plan { text-align: center; padding: 26px 16px; }
    .empty-plan p { margin-inline: auto; max-width: 52ch; }

    /* ---------- calendar ---------- */
    .cal-month h3 { margin: 6px 0 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .cal-wd { text-align: center; font-size: .78rem; color: var(--muted); font-weight: 700; padding-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-day { min-height: 70px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
      font: inherit; padding: 4px 5px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; cursor: pointer; text-align: start; min-width: 0; }
    .cal-day:hover:not([disabled]) { border-color: var(--primary); }
    .cal-day[disabled] { opacity: .4; cursor: default; background: transparent; }
    .cal-n { font-weight: 800; font-size: .95rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
    .cal-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); display: block; }
    .cal-c { font-size: .72rem; color: var(--muted); margin-top: auto; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .cal-day.all-done .cal-c { color: var(--success); font-weight: 700; }
    .cal-day.is-exam { background: var(--danger-soft); border-color: var(--danger); }
    .cal-day.is-light { background: var(--info-soft); border-color: var(--info); }
    .cal-day.is-today { outline: 3px solid var(--accent); outline-offset: -1px; }
    .cal-day[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--primary); }
    .cal-ex { font-size: .8rem; line-height: 1; }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cal-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--border); }
    #cal-detail { margin-top: 14px; }
    @media (max-width: 560px) {
      .cal-day { min-height: 54px; padding: 3px; gap: 2px; border-radius: 8px; }
      .cal-dots i { width: 7px; height: 7px; }
      .cal-c { font-size: .64rem; }
      .cal-n { font-size: .85rem; }
    }

    /* ---------- exams + chapters ---------- */
    .who { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
    .subj-list { display: grid; gap: 14px; }
    .subj { border-top: 6px solid var(--sc); }
    .subj-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: end; }
    .subj-head input[type="text"] { width: 100%; font-weight: 700; }
    .subj-info { margin: 8px 0 0; }
    .subj-warn { margin: 8px 0 0; }
    .ch-head, .ch-row { display: grid; gap: 8px; align-items: center;
      grid-template-columns: 1.7em minmax(0, 1fr) 8.6rem 8.6rem 5.6rem 44px; grid-template-areas: "num name d c est del"; }
    .ch-head { margin-top: 12px; font-size: .8rem; color: var(--muted); font-weight: 700; line-height: 1.25; }
    .ch-head .h-name { grid-area: name; } .ch-head .h-d { grid-area: d; } .ch-head .h-c { grid-area: c; } .ch-head .h-est { grid-area: est; }
    .ch-list { list-style: none; margin: 6px 0 10px; padding: 0; display: grid; gap: 8px; }
    .ch-num { grid-area: num; color: var(--muted); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .ch-row .in-cname { grid-area: name; width: 100%; }
    .ch-row .in-d { grid-area: d; width: 100%; }
    .ch-row .in-c { grid-area: c; width: 100%; }
    .ch-row .ch-est { grid-area: est; font-size: .82rem; color: var(--muted); }
    .ch-row .del-ch { grid-area: del; min-width: 44px; padding-inline: 0; }
    @media (max-width: 720px) {
      .ch-head, .ch-row { grid-template-columns: 1.4em minmax(0, 1fr) minmax(0, 1fr) 44px; grid-template-areas: "num name name del" ". d c c"; row-gap: 6px; column-gap: 6px; }
      .ch-head { grid-template-areas: ". d c c"; }
      .ch-head .h-name, .ch-head .h-est, .ch-row .ch-est { display: none; }
      .ch-row { padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
      .ch-row select { padding-inline: 6px 2px; font-size: .92rem; }
    }
    @media (max-width: 560px) {
      .subj-head { grid-template-columns: minmax(0, 1fr) auto; }
      .subj-head .f-name { grid-column: 1 / -1; }
      .who { grid-template-columns: minmax(0, 1fr); }
    }
    .sdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--sc); flex: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    /* ---------- study time ---------- */
    .hours-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
    .hours-grid .field input { width: 100%; }
    .hours-grid .hint { font-size: .78rem; }
    .opt-list { display: grid; gap: 12px; }
    .opt-list .check { align-items: flex-start; }
    .opt-list .check input { margin-top: 3px; flex: none; }
    #cap-box .progress { margin-top: 8px; }
    #cap-box .progress > span { background: var(--sc, var(--primary)); }

    /* ---------- tips ---------- */
    .tips { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
    .tip { display: flex; gap: 12px; align-items: flex-start; }
    .tip .em { font-size: 1.8rem; line-height: 1.2; flex: none; }
    .tip p { margin: 0; }
    .how ol { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 6px; }
    details.help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.help ul { margin: 10px 0 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }

    /* ---------- focus timer ---------- */
    .timer-box { text-align: center; }
    .timer-what { font-weight: 700; font-size: 1.05rem; }
    .timer-num { font-size: clamp(3.4rem, 14vw, 6rem); color: var(--primary); }
    .timer-box.on-break .timer-num { color: var(--success); }
    .timer-lab { font-weight: 700; color: var(--muted); margin: 0; }
    .timer-box .row { justify-content: center; }

    /* ---------- print ---------- */
    .print-area h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .print-area .table { font-size: 10pt; margin-bottom: 10px; }
    .print-area .table th, .print-area .table td { padding: 4px 6px; border: 1px solid #999; }
    .print-area .table th { position: static; }
    .print-area thead { display: table-header-group; }
    .print-area .pbox { font-family: "Noto Sans", sans-serif; }
    .print-area .p-exam td { background: #fde4e4; font-weight: 700; }
    .print-area .p-light td { background: #e6f1fb; }
    .print-area ul { margin: 0; padding-inline-start: 0; list-style: none; }
    @media print {
      .edu-main > *:not(.print-area) { display: none !important; }
      .print-area { display: block !important; }
      .print-area tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div id="sample-note" class="callout accent no-print" hidden>
      <span data-i18n="sample_note"></span>
      <button class="btn btn-sm btn-primary" id="start-empty-2" type="button" data-i18n="start_empty"></button>
      <button class="btn btn-sm" id="hide-note" type="button" data-i18n="got_it"></button>
    </div>

    <div class="tabs no-print" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-plan" data-tab="plan" aria-controls="p-plan"><span class="ti" aria-hidden="true">📅</span><span data-i18n="tab_plan"></span></button>
      <button type="button" role="tab" id="tab-exams" data-tab="exams" aria-controls="p-exams"><span class="ti" aria-hidden="true">📝</span><span data-i18n="tab_exams"></span></button>
      <button type="button" role="tab" id="tab-time" data-tab="time" aria-controls="p-time"><span class="ti" aria-hidden="true">⏰</span><span data-i18n="tab_time"></span></button>
      <button type="button" role="tab" id="tab-tips" data-tab="tips" aria-controls="p-tips"><span class="ti" aria-hidden="true">💡</span><span data-i18n="tab_tips"></span></button>
    </div>

    <!-- ================= PLAN ================= -->
    <section id="p-plan" class="tabpanel no-print" role="tabpanel" aria-labelledby="tab-plan">
      <div id="plan-empty" class="card empty-plan" hidden>
        <p class="big-number" aria-hidden="true">📅</p>
        <p data-i18n="empty_plan"></p>
        <div class="row" style="justify-content:center">
          <button class="btn btn-primary btn-lg" id="go-exams" type="button" data-i18n="go_exams"></button>
        </div>
      </div>

      <div id="plan-main">
        <div class="sum-grid">
          <section class="card cd-card" aria-live="polite">
            <h2 class="h-sm" data-i18n="next_exam"></h2>
            <div class="cd-row">
              <span class="cd-num" id="cd-days"></span>
              <div class="cd-txt"><b id="cd-unit"></b><span id="cd-what" class="muted small"></span></div>
            </div>
            <p id="cd-later" class="cd-later small muted"></p>
          </section>

          <section class="card today-card">
            <h2><span id="today-h"></span><span class="muted" id="today-sub"></span></h2>
            <div id="today-body"></div>
          </section>

          <section class="card prog-card" aria-live="polite">
            <h2 class="h-sm" data-i18n="progress_label"></h2>
            <div class="pct-row"><span class="pct-num" id="pct"></span><span id="done-of" class="muted small"></span></div>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pct-bar-wrap" data-i18n-aria-label="progress_label"><span id="pct-bar"></span></div>
            <div class="sp-list" id="subj-prog"></div>
          </section>
        </div>

        <div id="plan-msgs" aria-live="polite"></div>

        <div class="card toolbar">
          <div class="seg" role="group" data-i18n-aria-label="view_label" id="view-seg">
            <button type="button" id="view-list" data-v="list"><span aria-hidden="true">☰ </span><span data-i18n="view_list"></span></button>
            <button type="button" id="view-cal" data-v="cal"><span aria-hidden="true">▦ </span><span data-i18n="view_cal"></span></button>
          </div>
          <button class="btn" id="reschedule" type="button"><span aria-hidden="true">↻</span> <span data-i18n="reschedule"></span> <span class="count-badge" id="missed-badge"></span></button>
          <span class="spacer"></span>
          <button class="btn" id="print-btn" type="button"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <button class="btn" id="csv-btn" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="export_csv"></span></button>
          <button class="btn" id="ics-btn" type="button"><span aria-hidden="true">📆</span> <span data-i18n="export_ics"></span></button>
        </div>

        <div id="plan-list" class="stack"></div>
        <div id="plan-cal" hidden></div>
      </div>
    </section>

    <!-- ================= EXAMS + CHAPTERS ================= -->
    <section id="p-exams" class="tabpanel no-print" role="tabpanel" aria-labelledby="tab-exams" hidden>
      <div class="card who">
        <label class="field"><span data-i18n="your_name"></span><input type="text" id="in-name" maxlength="60" autocomplete="off" class="no-i18n"></label>
        <label class="field"><span data-i18n="your_class"></span><input type="text" id="in-class" maxlength="30" autocomplete="off" data-i18n-placeholder="class_ph" class="no-i18n"></label>
      </div>
      <div class="callout">
        <b data-i18n="datesheet_title"></b>
        <p class="small mb0" data-i18n="exams_help"></p>
      </div>
      <div id="subj-list" class="subj-list"></div>
      <div class="actions">
        <button class="btn" id="add-subject" type="button"><span aria-hidden="true">＋</span> <span data-i18n="add_subject"></span></button>
        <button class="btn btn-primary btn-lg" id="make-plan" type="button"><span aria-hidden="true">✨</span> <span data-i18n="make_plan"></span></button>
      </div>
      <div class="actions">
        <button class="btn btn-sm" id="start-empty" type="button" data-i18n="start_empty"></button>
        <button class="btn btn-sm btn-danger" id="reset-all" type="button" data-i18n="reset_sample"></button>
        <span class="muted small" data-i18n="saved_local"></span>
      </div>
    </section>

    <!-- ================= STUDY TIME ================= -->
    <section id="p-time" class="tabpanel no-print" role="tabpanel" aria-labelledby="tab-time" hidden>
      <div class="grid-2">
        <div class="card stack">
          <h2 data-i18n="time_title"></h2>
          <label class="field"><span data-i18n="start_date"></span><input type="date" id="in-start"></label>
          <div>
            <h3 class="mb0" data-i18n="hours_title"></h3>
            <p class="muted small" data-i18n="hours_help"></p>
            <div class="hours-grid" id="hours-grid"></div>
          </div>
          <div class="panel stack">
            <h3 class="mb0" data-i18n="leave_title"></h3>
            <p class="muted small mb0" data-i18n="leave_help"></p>
            <div class="row">
              <label class="field grow"><span data-i18n="leave_from"></span><input type="date" id="in-leave"></label>
              <label class="field"><span data-i18n="leave_hours"></span><input type="number" id="in-leave-h" min="0" max="16" step="0.5" inputmode="decimal"></label>
            </div>
          </div>
        </div>
        <div class="card stack">
          <h2 data-i18n="pomo_title"></h2>
          <div class="seg" role="group" id="pomo-seg" data-i18n-aria-label="pomo_title">
            <button type="button" id="pomo-25" data-v="25" data-i18n="pomo_25"></button>
            <button type="button" id="pomo-50" data-v="50" data-i18n="pomo_50"></button>
          </div>
          <p class="muted small" data-i18n="pomo_help"></p>
          <div class="opt-list">
            <label class="check"><input type="checkbox" id="opt-light"><span data-i18n="opt_light"></span></label>
            <label class="check"><input type="checkbox" id="opt-rest"><span data-i18n="opt_rest"></span></label>
            <label class="check"><input type="checkbox" id="opt-prac"><span data-i18n="opt_prac"></span></label>
          </div>
          <div id="cap-box" class="callout" aria-live="polite"></div>
          <div class="actions">
            <button class="btn btn-primary btn-lg" id="make-plan-2" type="button"><span aria-hidden="true">✨</span> <span data-i18n="make_plan"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= TIPS ================= -->
    <section id="p-tips" class="tabpanel no-print" role="tabpanel" aria-labelledby="tab-tips" hidden>
      <h2 data-i18n="tips_title"></h2>
      <div class="tips" id="tips"></div>
      <div class="card how">
        <h2 data-i18n="how_title"></h2>
