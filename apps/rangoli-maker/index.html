<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rangoli &amp; Kolam Maker · AI Pathshala</title>
  <meta name="description" content="Design rangoli and kolam with mirror and turning symmetry, colour in mandala patterns, then print them to draw at your doorstep. Free, offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .rm-tabs { margin-bottom: 12px; }
    .rm-tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
    :root[lang="ur"] .rm-tabs button { line-height: 1.9; }

    .rm-work { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .rm-work { grid-template-columns: minmax(0, 1fr) 360px; } }
    .rm-left { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .rm-side { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

    .rm-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
    .rm-group { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
    .rm-ib { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      min-width: 46px; min-height: 46px; padding: 3px 6px; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--text); font: inherit; cursor: pointer; line-height: 1.1; }
    .rm-ib:hover { background: var(--surface); border-color: var(--border); }
    .rm-ib[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .rm-ib:disabled { opacity: .38; cursor: not-allowed; background: transparent; border-color: transparent; }
    .rm-ic { font-size: 1.25rem; line-height: 1.1; }
    .rm-lbl { font-size: .7rem; font-weight: 600; max-width: 6.2rem; text-align: center; overflow-wrap: anywhere; }
    :root[lang="ur"] .rm-lbl { line-height: 1.7; }

    .rm-stage { position: relative; display: flex; justify-content: center; min-width: 0; }
    .rm-cwrap { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), var(--shadow); max-width: 100%; }
    .rm-cwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #rm-live { touch-action: none; cursor: crosshair; }
    .rm-svgwrap { width: 100%; max-width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), var(--shadow); background: #fff; }
    .rm-svgwrap svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
    .rm-svgwrap path { cursor: pointer; }
    .rm-svgwrap path:focus { outline: none; }
    .rm-svgwrap path:focus-visible { stroke: #e85d04; stroke-width: 7; }
    .rm-status { margin: 0; font-weight: 600; min-height: 1.6em; }
    .rm-sub { margin: 0; }

    .rm-pal { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .rm-sw { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; }
    .rm-sw::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.5); pointer-events: none; }
    .rm-sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .rm-custom { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      background: conic-gradient(#ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444); }
    .rm-custom[data-on="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .rm-custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
    .rm-custom i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; }

    .rm-side h3 { font-size: 1rem; margin: 0 0 6px; }
    .rm-field { display: flex; flex-direction: column; gap: 6px; }
    .rm-field > .lbl { font-weight: 600; font-size: .92rem; }
    :root[lang="ur"] .rm-field > .lbl, :root[lang="ur"] .check { line-height: 2; }
    .seg.rm-seg { display: flex; flex-wrap: wrap; }
    .seg.rm-seg button { min-height: 42px; flex: 1 1 auto; line-height: 1.25; }
    :root[lang="ur"] .seg.rm-seg button { line-height: 1.8; }
    .check { min-height: 40px; }

    .rm-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .rm-thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px; border: 2px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; line-height: 1.25; text-align: center; }
    .rm-thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .rm-thumb canvas, .rm-thumb svg { width: 100%; height: auto; aspect-ratio: 1; border-radius: 6px; display: block; background: #fff; }
    :root[lang="ur"] .rm-thumb { line-height: 1.8; }

    .rm-export .btn { flex: 1 1 auto; }
    .rm-export input { width: 100%; }

    .rm-gal { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
    .rm-design { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
    .rm-design img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
    .rm-design .row .btn { flex: 1 1 auto; }
    .rm-dname { font-weight: 700; overflow-wrap: anywhere; }

    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card { margin-top: 14px; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 1.2rem; }
    details.card li { margin-bottom: 6px; }
    :root[lang="ur"] details.card summary { line-height: 2; }
    .rm-learn-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 10px; }
    .rm-learn-grid svg { width: 120px; height: 120px; display: block; margin: 0 auto 6px; }
    .rm-orders { font-variant-numeric: tabular-nums; }

    /* full screen (smartboard / tablet) */
    .rm-work:fullscreen { background: var(--bg); padding: 10px; overflow: auto; width: 100vw; height: 100vh; }
    .rm-work:-webkit-full-screen { background: var(--bg); padding: 10px; overflow: auto; width: 100vw; height: 100vh; }
    @media (min-width: 761px) { .rm-work:fullscreen .rm-ib { min-width: 54px; min-height: 54px; } .rm-work:fullscreen .rm-ic { font-size: 1.5rem; } }

    @media (max-width: 560px) {
      .rm-ib { min-width: 42px; min-height: 44px; padding: 2px 3px; }
      .rm-lbl { font-size: .64rem; max-width: 4.6rem; }
      .rm-sw { width: 34px; height: 34px; }
      .rm-sw::before { content: ""; position: absolute; inset: -4px; }
      .rm-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
      .rm-tabs button { padding: 8px 6px; justify-content: center; white-space: normal; text-align: center; line-height: 1.25; }
    }

    .rm-print { text-align: center; }
    .rm-print img { display: block; width: 100%; max-width: 180mm; max-height: 235mm; object-fit: contain; margin: 0 auto 4mm; }
    .rm-print p { font-size: 11pt; margin: 0; }
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      #app > *:not(#rm-print) { display: none !important; }
      #rm-print { display: block !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs rm-tabs no-print" id="rm-tabs" role="tablist" data-i18n-aria-label="app_title">
      <button type="button" role="tab" id="tab-studio" data-tab="studio" aria-controls="rm-work"><span aria-hidden="true">🌸</span><span data-i18n="tab_studio"></span></button>
      <button type="button" role="tab" id="tab-kolam" data-tab="kolam" aria-controls="rm-work"><span aria-hidden="true">⚬</span><span data-i18n="tab_kolam"></span></button>
      <button type="button" role="tab" id="tab-color" data-tab="color" aria-controls="rm-work"><span aria-hidden="true">🖍️</span><span data-i18n="tab_color"></span></button>
      <button type="button" role="tab" id="tab-gallery" data-tab="gallery" aria-controls="rm-galsec"><span aria-hidden="true">📁</span><span data-i18n="tab_gallery"></span></button>
    </div>

    <section class="rm-work no-print" id="rm-work" role="tabpanel">
      <div class="rm-left">
        <div class="rm-bar" id="rm-bar" role="toolbar" data-i18n-aria-label="grp_tools">
          <div class="rm-group" id="rm-tools" role="group" data-i18n-aria-label="grp_tools"></div>
          <div class="rm-group" role="group" data-i18n-aria-label="grp_edit">
            <button type="button" class="rm-ib" id="rm-undo" data-i18n-title="undo" data-i18n-aria-label="undo"><span class="rm-ic" aria-hidden="true">↶</span><span class="rm-lbl" data-i18n="undo"></span></button>
            <button type="button" class="rm-ib" id="rm-redo" data-i18n-title="redo" data-i18n-aria-label="redo"><span class="rm-ic" aria-hidden="true">↷</span><span class="rm-lbl" data-i18n="redo"></span></button>
            <button type="button" class="rm-ib" id="rm-clear" data-i18n-title="clear" data-i18n-aria-label="clear"><span class="rm-ic" aria-hidden="true">🗑️</span><span class="rm-lbl" data-i18n="clear"></span></button>
            <button type="button" class="rm-ib" id="rm-fs" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen"><span class="rm-ic" aria-hidden="true">⛶</span><span class="rm-lbl" data-i18n="fullscreen"></span></button>
          </div>
        </div>
        <div class="rm-stage" id="rm-stage">
          <div class="rm-cwrap" id="rm-cwrap" dir="ltr">
            <canvas id="rm-bg" aria-hidden="true"></canvas>
            <canvas id="rm-art" aria-hidden="true"></canvas>
            <canvas id="rm-live" role="img" data-i18n-aria-label="canvas_label"></canvas>
          </div>
          <div class="rm-svgwrap" id="rm-svgwrap" dir="ltr" hidden></div>
        </div>
        <p class="rm-status" id="rm-status" aria-live="polite"></p>
        <p class="rm-sub small muted" id="rm-hint"></p>
      </div>

      <aside class="rm-side">
        <div class="card stack">
          <div class="rm-field" data-for="studio kolam color">
            <span class="lbl" id="lbl-pal" data-i18n="grp_colors"></span>
            <div class="rm-pal" id="rm-pal" role="group" aria-labelledby="lbl-pal"></div>
          </div>
          <div class="rm-field" data-for="studio kolam">
            <span class="lbl" id="lbl-size" data-i18n="size"></span>
            <div class="seg rm-seg" id="rm-size" role="group" aria-labelledby="lbl-size"></div>
          </div>

          <!-- studio -->
          <div class="rm-field" data-for="studio" id="rm-stampbox">
            <span class="lbl" id="lbl-stamp" data-i18n="stamps"></span>
            <div class="seg rm-seg" id="rm-stamps" role="group" aria-labelledby="lbl-stamp"></div>
          </div>
          <div class="rm-field" data-for="studio">
            <span class="lbl" id="lbl-fold" data-i18n="symmetry"></span>
            <div class="seg rm-seg" id="rm-fold" role="group" aria-labelledby="lbl-fold"></div>
            <label class="check"><input type="checkbox" id="rm-mirror"> <span data-i18n="mirror"></span></label>
          </div>
          <div class="rm-field" data-for="studio">
            <span class="lbl" id="lbl-guides" data-i18n="guides"></span>
            <div class="seg rm-seg" id="rm-guides" role="group" aria-labelledby="lbl-guides"></div>
          </div>

          <!-- kolam -->
          <div class="rm-field" data-for="kolam">
            <span class="lbl" id="lbl-grid" data-i18n="grid_type"></span>
            <div class="seg rm-seg" id="rm-grid" role="group" aria-labelledby="lbl-grid"></div>
            <label class="rm-field"><span class="lbl" data-i18n="grid_size"></span>
              <select id="rm-gsize"></select></label>
          </div>
          <div class="rm-field" data-for="kolam">
            <span class="lbl" id="lbl-kfold" data-i18n="ksymmetry"></span>
            <div class="seg rm-seg" id="rm-kfold" role="group" aria-labelledby="lbl-kfold"></div>
            <label class="check"><input type="checkbox" id="rm-snap"> <span data-i18n="snap"></span></label>
          </div>

          <div class="rm-field" data-for="studio kolam">
            <span class="lbl" id="lbl-bg" data-i18n="background"></span>
            <div class="seg rm-seg" id="rm-bgs" role="group" aria-labelledby="lbl-bg"></div>
          </div>

          <!-- colour-in -->
          <div class="rm-field" data-for="color">
            <span class="lbl" id="lbl-tpl" data-i18n="template"></span>
            <div class="rm-thumbs" id="rm-tpls" role="group" aria-labelledby="lbl-tpl"></div>
            <label class="check"><input type="checkbox" id="rm-symfill"> <span data-i18n="sym_fill"></span></label>
          </div>
        </div>

        <div class="card stack" data-for="kolam">
          <h3 data-i18n="starters"></h3>
          <div class="seg rm-seg" id="rm-smode" role="group" data-i18n-aria-label="starters">
            <button type="button" data-sm="use" data-i18n="st_use"></button>
            <button type="button" data-sm="trace" data-i18n="st_trace"></button>
          </div>
          <div class="rm-thumbs" id="rm-starters" role="group" data-i18n-aria-label="starters"></div>
          <div class="row">
            <button type="button" class="btn btn-accent" id="rm-surprise"><span aria-hidden="true">✨</span> <span data-i18n="surprise"></span></button>
            <button type="button" class="btn btn-sm" id="rm-ghostoff" hidden data-i18n="ghost_off"></button>
          </div>
        </div>

        <div class="card stack rm-export">
          <h3 data-i18n="export_title"></h3>
          <label class="rm-field"><span class="lbl" data-i18n="design_name"></span>
            <input type="text" id="rm-name" class="no-i18n" maxlength="40" data-i18n-placeholder="name_ph"></label>
          <div class="row">
            <button type="button" class="btn btn-primary" id="rm-save"><span aria-hidden="true">💾</span> <span data-i18n="save_design"></span></button>
            <button type="button" class="btn" id="rm-png"><span aria-hidden="true">🖼️</span> <span data-i18n="png"></span></button>
          </div>
          <div class="row">
            <button type="button" class="btn" id="rm-print-c"><span aria-hidden="true">🖨️</span> <span data-i18n="print_color"></span></button>
            <button type="button" class="btn" id="rm-print-o"><span aria-hidden="true">✏️</span> <span data-i18n="print_outline"></span></button>
          </div>
          <p class="tiny muted mb0" data-i18n="saved_local"></p>
        </div>
      </aside>
    </section>

    <section class="card stack no-print" id="rm-galsec" role="tabpanel" hidden>
      <div class="row spread">
        <h2 class="mb0" data-i18n="tab_gallery"></h2>
        <span class="badge" id="rm-gcount" aria-live="polite"></span>
      </div>
      <p class="muted mb0" id="rm-gempty" data-i18n="gallery_empty"></p>
      <div class="rm-gal" id="rm-gallery"></div>
    </section>

    <details class="card no-print" id="rm-learn">
      <summary data-i18n="learn_title"></summary>
      <div class="rm-learn-grid">
        <div class="panel">
          <svg viewBox="0 0 120 120" aria-hidden="true"><g id="rm-demo-rot"></g></svg>
          <h3 data-i18n="learn_rot_h"></h3>
          <p class="mb0" data-i18n="learn_rot"></p>
        </div>
        <div class="panel">
          <svg viewBox="0 0 120 120" aria-hidden="true"><g id="rm-demo-mir"></g></svg>
          <h3 data-i18n="learn_mir_h"></h3>
          <p class="mb0" data-i18n="learn_mir"></p>
        </div>
      </div>
      <p class="rm-orders" style="margin-top:12px" data-i18n="learn_order"></p>
      <p data-i18n="learn_try"></p>
      <div class="callout accent">
        <strong data-i18n="learn_class_h"></strong>
        <p class="mb0" data-i18n="learn_class"></p>
      </div>
    </details>

    <details class="card no-print" id="rm-culture">
      <summary data-i18n="culture_title"></summary>
      <p style="margin-top:10px" data-i18n="culture_p1"></p>
      <ul id="rm-names"></ul>
      <p class="mb0" data-i18n="culture_p2"></p>
    </details>

    <details class="card no-print" id="rm-help">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row spread" style="margin-top:10px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button type="button" class="btn btn-sm btn-danger" id="rm-reset" data-i18n="reset"></button>
      </div>
    </details>

    <div id="rm-print" class="print-only rm-print"><img id="rm-print-img" alt=""><p id="rm-print-cap"></p></div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
