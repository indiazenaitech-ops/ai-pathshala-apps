<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indian Board Games · AI Pathshala</title>
  <meta name="description" content="Play Aadu Puli Attam (Goats and Tigers), Pallanguzhi and Navakankari with a friend or the computer. Free, offline, 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .ibg-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .ibg-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 8px 6px;
      border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; text-align: center; }
    .ibg-tab .ic { font-size: 1.4rem; line-height: 1; }
    .ibg-tab b { font-size: .95rem; line-height: 1.2; }
    .ibg-tab small { color: var(--muted); font-size: .76rem; line-height: 1.2; }
    .ibg-tab[aria-selected="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .ibg-tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .ibg-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 980px) { .ibg-layout { grid-template-columns: minmax(0, 1fr) 360px; } }
    .ibg-play { display: flex; flex-direction: column; gap: 10px; }
    .ibg-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .ibg-tools .btn { min-height: 42px; }
    .ibg-status { min-height: 3.2em; font-weight: 600; display: flex; align-items: center; }
    .ibg-status.win { border-color: var(--success); background: var(--success-soft); }
    .ibg-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .ibg-score { border: 1px solid var(--border); border-radius: var(--radius-sm, 8px); padding: 6px 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .ibg-score.turn { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft) inset; }
    .ibg-score .who { font-weight: 700; display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
    .ibg-score .who i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #555; }
    .ibg-score .nums { font-size: .86rem; color: var(--muted); }
    .ibg-score .nums b { color: var(--text); font-size: 1.05rem; }
    .ibg-board { padding: 6px; display: flex; justify-content: center; background: var(--surface); }
    .ibg-board svg { display: block; width: 100%; max-width: 620px; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .ibg-board svg .pt { cursor: pointer; outline: none; }
    .ibg-board svg .pt:focus-visible .hit { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 1.2; }
    .ibg-board svg .hit { fill: transparent; }
    .ibg-sets { display: flex; flex-direction: column; gap: 12px; }
    .ibg-set { display: flex; flex-direction: column; gap: 5px; }
    .ibg-set > span { font-size: .86rem; color: var(--muted); font-weight: 600; }
    .ibg-set .seg button { min-height: 40px; }
    .ibg-rules { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 6px; }
    .ibg-extra:empty { display: none; }
    details.card > summary { cursor: pointer; font-weight: 700; }
    .ibg-side { display: flex; flex-direction: column; gap: 16px; }
    :fullscreen .ibg-play, .ibg-play:fullscreen { background: var(--bg); padding: 16px; overflow: auto; }
    .ibg-play:fullscreen .ibg-board svg { max-width: min(96vw, 128vh); }
    @media print { .ibg-tools, .ibg-tabs, .ibg-side .card:first-child { display: none; } }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="ibg-tabs" role="tablist" data-i18n-aria-label="games_aria" id="tabs">
      <button class="ibg-tab" role="tab" id="tab-apl" data-game="apl" aria-controls="playCard"><span class="ic" aria-hidden="true">🐅</span><b data-i18n="g_apl"></b><small data-i18n="g_apl_sub"></small></button>
      <button class="ibg-tab" role="tab" id="tab-pal" data-game="pal" aria-controls="playCard"><span class="ic" aria-hidden="true">🌰</span><b data-i18n="g_pal"></b><small data-i18n="g_pal_sub"></small></button>
      <button class="ibg-tab" role="tab" id="tab-nav" data-game="nav" aria-controls="playCard"><span class="ic" aria-hidden="true">⚪</span><b data-i18n="g_nav"></b><small data-i18n="g_nav_sub"></small></button>
    </div>
    <div class="ibg-layout">
      <section class="card ibg-play" id="playCard" role="tabpanel">
        <div class="ibg-tools">
          <button class="btn btn-primary" id="newGame" data-i18n="new_game"></button>
          <button class="btn" id="undo" data-i18n="undo"></button>
          <button class="btn" id="hint" data-i18n="hint"></button>
          <button class="btn btn-ghost" id="fs" data-i18n="fullscreen"></button>
        </div>
        <div class="callout ibg-status" id="status" aria-live="polite"></div>
        <div class="ibg-scores" id="scores"></div>
        <div class="stage ibg-board" id="boardWrap"><svg id="board" role="group" data-i18n-aria-label="board_aria"></svg></div>
        <div class="ibg-extra" id="extra"></div>
      </section>
      <div class="ibg-side">
        <section class="card">
          <h2 data-i18n="settings_title" style="margin-top:0;font-size:1.1rem"></h2>
          <div class="ibg-sets" id="sets"></div>
          <p class="muted small" data-i18n="settings_note" style="margin-bottom:0"></p>
        </section>
        <details class="card" id="rulesBox" open>
          <summary data-i18n="rules_title"></summary>
          <ol class="ibg-rules" id="rules"></ol>
        </details>
        <details class="card" id="historyBox">
          <summary data-i18n="history_title"></summary>
          <p id="history" style="margin-bottom:0"></p>
        </details>
        <details class="card">
          <summary data-i18n="howto_title"></summary>
          <ul class="ibg-rules">
            <li data-i18n="tip1"></li>
            <li data-i18n="tip2"></li>
            <li data-i18n="tip3"></li>
            <li data-i18n="tip4"></li>
            <li data-i18n="tip5"></li>
          </ul>
        </details>
      </div>
    </div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
