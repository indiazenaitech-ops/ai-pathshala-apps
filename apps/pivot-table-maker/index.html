    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .pv-privacy { display: flex; gap: 8px; align-items: center; margin: -6px 0 14px; color: var(--muted); font-size: .9rem; }
    .pv-help summary { cursor: pointer; font-weight: 700; font-size: 1.02rem; }

    .pv-help li + li { margin-top: 6px; }
    .pv-help h3 { margin: 16px 0 8px; font-size: 1rem; }
    .pv-words { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 0; }

    .pv-words dt { font-weight: 700; }
    .pv-words dd { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }

    @media (min-width: 640px) { .pv-what .pv-ex { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; } }

    :root[dir="rtl"] .pv-what .arrow { transform: scaleX(-1); }

    .pv-what td.n, .pv-what th.n { text-align: end; }

    .pv-drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
    .pv-drop.over { border-color: var(--primary); background: var(--primary-soft); }

    .pv-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1000px) { .pv-layout { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); } }
    .pv-layout > * { min-width: 0; }
    .pv-fields { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
    .pv-fields .field select { width: 100%; }
    .pv-pair { display: flex; flex-wrap: wrap; gap: 8px; }
    .pv-pair > .field { flex: 1 1 130px; min-width: 0; }
    .pv-pair .field select { width: 100%; }
    .pv-role { display: inline-block; width: 1.4em; text-align: center; }
    .pv-chips { gap: 6px; }
    .pv-chip { cursor: default; font-weight: 500; max-width: 100%; }
    .pv-chip button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; min-width: 28px; min-height: 28px; border-radius: 50%; font-weight: 800; }
    .pv-chip button:hover { background: var(--surface-2); }
    .pv-chip .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: underline dotted; }

    .pv-out-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .pv-out-head h2 { margin: 0; font-size: 1.15rem; overflow-wrap: anywhere; }
    .pv-tablewrap { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .pv-table { font-size: .9rem; }
    .pv-table th, .pv-table td { white-space: nowrap; }
    .pv-table td { text-align: end; font-variant-numeric: tabular-nums; }
    .pv-table thead th { text-align: end; z-index: 1; }
    .pv-table thead th.corner { text-align: start; color: var(--muted); font-weight: 600; }
    .pv-table tbody th { text-align: start; font-weight: 600; max-width: 280px; overflow: hidden; text-overflow: ellipsis; background: var(--surface); }
    .pv-table .tot { font-weight: 800; background: var(--surface-2); }
    .pv-table tfoot th, .pv-table tfoot td { font-weight: 800; background: var(--surface-2); border-top: 2px solid var(--border); position: sticky; bottom: 0; }
    .pv-table .blank { font-style: italic; color: var(--muted); }
    .pv-table td.heat { position: relative; }
    .pv-notes p { margin: 4px 0; }
    .pv-chart svg { width: 100%; height: auto; display: block; }
    .pv-chart .bar-label { fill: var(--text); }
    .pv-chart .muted-t { fill: var(--muted); }
    .pv-chart .gridl { stroke: var(--border); }
    .pv-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; margin-top: 6px; }
    .pv-legend span { display: inline-flex; gap: 6px; align-items: center; }
    .pv-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .pv-vals { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .pv-vallist { max-height: 46vh; overflow: auto; display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin: 8px 0; }
    .pv-vallist label { font-weight: 500; overflow-wrap: anywhere; }
  </style>

  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

        <div><dt data-i18n="w_blank"></dt><dd data-i18n="w_blank_d"></dd></div>
      </dl>

    <details class="card pv-what no-print" id="what">
      <summary class="pv-help" style="cursor:pointer;font-weight:700" data-i18n="what_title"></summary>
      <p class="mb0" style="margin-top:10px" data-i18n="what_text"></p>
      <div class="pv-ex" id="what-ex"></div>
      <p class="muted small mb0" data-i18n="what_after"></p>
    </details>

    <section class="card stack no-print" aria-labelledby="h-load">
      <h2 id="h-load" class="sr-only" data-i18n="load_title"></h2>
      <div class="pv-drop" id="drop">
        <p data-i18n="drop_here"></p>
        <div class="row">
          <button type="button" class="btn btn-primary" id="open" data-i18n="open_csv"></button>
          <button type="button" class="btn" id="paste-btn" aria-expanded="false" aria-controls="paste-box" data-i18n="paste_data"></button>
        </div>
        <p class="muted small mb0" data-i18n="excel_hint"></p>
      </div>
      <div id="paste-box" class="stack" hidden>
        <label for="paste" data-i18n="paste_label"></label>
        <textarea id="paste" class="no-i18n" rows="6" spellcheck="false" data-i18n-placeholder="paste_ph"></textarea>
        <div class="row"><button type="button" class="btn btn-primary" id="paste-use" data-i18n="paste_use"></button></div>
      </div>
      <div class="row pv-samples">
        <span class="muted small" data-i18n="samples"></span>
        <button type="button" class="chip" data-sample="sales" data-i18n="sample_sales"></button>
        <button type="button" class="chip" data-sample="shop" data-i18n="sample_shop"></button>
        <button type="button" class="chip" data-sample="marks" data-i18n="sample_marks"></button>
      </div>
      <div class="row spread">
        <p class="pv-dsline" id="dsline" aria-live="polite"></p>
        <button type="button" class="btn btn-sm btn-danger" id="reset" data-i18n="reset"></button>
      </div>
      <div id="msg" class="callout warning" role="alert" hidden></div>
    </section>

    <div class="pv-layout" id="work">
      <section class="card stack" aria-labelledby="h-build">
        <h2 id="h-build" class="mb0" data-i18n="build_title"></h2>
        <div class="pv-fields">
          <div class="pv-pair">
            <div class="field"><label for="f-rows"><span class="pv-role" aria-hidden="true">↕</span><span data-i18n="f_rows"></span></label><select id="f-rows" class="no-i18n"></select></div>
            <div class="field" id="g-rows-wrap" hidden><label for="g-rows" data-i18n="f_group"></label><select id="g-rows"></select></div>
          </div>
          <div class="pv-pair">
            <div class="field"><label for="f-cols"><span class="pv-role" aria-hidden="true">↔</span><span data-i18n="f_cols"></span></label><select id="f-cols" class="no-i18n"></select></div>
            <div class="field" id="g-cols-wrap" hidden><label for="g-cols" data-i18n="f_group"></label><select id="g-cols"></select></div>
          </div>
          <div class="pv-pair">
            <div class="field"><label for="f-val"><span class="pv-role" aria-hidden="true">Σ</span><span data-i18n="f_val"></span></label><select id="f-val" class="no-i18n"></select></div>
            <div class="field"><label for="f-agg" data-i18n="f_agg"></label><select id="f-agg"></select></div>
          </div>
          <div class="pv-pair">
            <div class="field"><label for="f-show" data-i18n="f_show"></label><select id="f-show"></select></div>
            <div class="field"><label for="f-sort" data-i18n="f_sort"></label><select id="f-sort"></select></div>
          </div>
          <div class="pv-pair">
            <div class="field"><label for="f-top" data-i18n="f_top"></label><select id="f-top"></select></div>
            <div class="field" style="justify-content:flex-end"><label class="check"><input type="checkbox" id="f-lakh"><span data-i18n="f_lakh"></span></label></div>
          </div>
          <div class="panel stack">
            <strong data-i18n="filters_title"></strong>
            <div class="row" style="gap:8px">
              <label class="sr-only" for="f-filter" data-i18n="filter_add"></label>
              <select id="f-filter" class="no-i18n" style="flex:1 1 140px;min-width:0"></select>
              <button type="button" class="btn btn-sm" id="filter-add" data-i18n="filter_add"></button>
            </div>
            <div class="row pv-chips" id="fchips"></div>
          </div>
        </div>
      </section>

      <div>
        <section class="card stack" aria-labelledby="h-out">
          <div class="pv-out-head">
            <h2 id="h-out"></h2>
            <div class="row" style="gap:8px">
              <button type="button" class="btn btn-sm" id="copy" data-i18n="copy_excel"></button>
              <button type="button" class="btn btn-sm" id="export" data-i18n="export_csv"></button>
            </div>
          </div>
          <div class="pv-notes small muted" id="notes" aria-live="polite"></div>
          <div class="pv-tablewrap"><table class="table pv-table" id="ptable"></table></div>
        </section>
        <section class="card stack pv-chart" aria-labelledby="h-chart">
          <h2 id="h-chart" class="mb0" data-i18n="chart_title"></h2>
          <div id="chart"></div>
        </section>
      </div>
    </div>
