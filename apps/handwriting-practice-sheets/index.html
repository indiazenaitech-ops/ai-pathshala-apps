<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handwriting Practice Sheets · AI Pathshala</title>
  <meta name="description" content="Free printable handwriting and tracing worksheets for young children: English letters, numbers, Hindi and 9 more Indian alphabets, or a child's own name. A4, works offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .hp-privacy { display: flex; gap: 8px; align-items: flex-start; margin: -6px 0 14px; font-weight: 600; color: var(--success); max-width: 75ch; }
    .hp-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 980px) { .hp-layout { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); } }
    .hp-form .field select, .hp-form .field input[type="text"], .hp-form .field textarea { width: 100%; }
    .hp-form .seg { display: flex; }
    .hp-form .seg button { flex: 1 1 auto; min-height: 40px; }
    .hp-letters { display: flex; flex-wrap: wrap; gap: 6px; max-height: 232px; overflow-y: auto; padding: 2px; }
    .hp-letters button {
      font: inherit; font-size: 1.15rem; font-weight: 600; min-width: 42px; min-height: 42px; padding: 2px 6px; cursor: pointer;
      color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; line-height: 1.2;
    }
    .hp-letters button[aria-pressed="true"] { color: var(--primary-ink); background: var(--primary); border: 1px solid var(--primary); }
    .hp-checks { display: grid; gap: 10px; }
    .hp-checks .check { align-items: flex-start; }
    .hp-checks .check input { flex: none; margin-top: 2px; }
    .hp-actions .btn-primary { flex: 1 1 200px; }
    .hp-prev-head { margin: 0 0 10px; }
    .hp-prev-head h2 { font-size: 1.12rem; margin: 0; }
    #msg:empty { display: none; }
    #msg { margin-bottom: 10px; }
    #pages { display: grid; gap: 16px; justify-items: center; }
    #pages svg.page { display: block; width: 100%; max-width: 794px; height: auto; background: #fff; border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
    @media print {
      #app > *:not(.hp-layout), .hp-form, .hp-prev-head, #msg { display: none !important; }
      .hp-layout { display: block; }
      .hp-prev { margin: 0; padding: 0; }
      #pages { display: block; }
      #pages svg.page { width: 210mm; height: 296.5mm; max-width: none; border: 0; border-radius: 0; box-shadow: none; margin: 0; break-after: page; page-break-after: always; break-inside: avoid; }
      #pages svg.page:last-child { break-after: auto; page-break-after: auto; }
      html, body { background: #fff; margin: 0; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @page { size: A4; margin: 0; }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="hp-privacy no-print"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>

    <div class="hp-layout">
      <section class="card stack hp-form no-print" id="form">
        <label class="field"><span data-i18n="what"></span>
          <select id="script"></select>
        </label>

        <div class="stack" id="lettersBox">
          <div class="row spread">
            <strong class="small" id="lettersLbl" data-i18n="letters_lbl"></strong>
            <div class="row" id="quick" style="gap:6px">
              <button type="button" class="btn btn-sm" id="selAll" data-i18n="all_btn"></button>
              <button type="button" class="btn btn-sm" id="selVow" data-i18n="g_vowels"></button>
              <button type="button" class="btn btn-sm" id="selCon" data-i18n="g_consonants"></button>
              <button type="button" class="btn btn-sm" id="selNone" data-i18n="none_btn"></button>
            </div>
          </div>
          <div class="hp-letters no-i18n" id="letters" role="group" aria-labelledby="lettersLbl"></div>
        </div>

        <label class="field" id="customBox" hidden><span data-i18n="custom_lbl"></span>
          <textarea id="customText" class="no-i18n" rows="4" maxlength="1500" spellcheck="false" dir="auto"></textarea>
        </label>

        <label class="field"><span data-i18n="title_lbl"></span>
          <input type="text" id="title" class="no-i18n" maxlength="60" autocomplete="off" dir="auto">
        </label>

        <div class="field"><span id="sizeLbl" data-i18n="size_lbl"></span>
          <div class="seg" id="size" role="group" aria-labelledby="sizeLbl">
            <button type="button" data-v="s" data-i18n="size_s"></button>
            <button type="button" data-v="m" data-i18n="size_m"></button>
            <button type="button" data-v="l" data-i18n="size_l"></button>
            <button type="button" data-v="xl" data-i18n="size_xl"></button>
          </div>
        </div>

        <div class="field"><span id="styleLbl" data-i18n="style_lbl"></span>
          <div class="seg" id="style" role="group" aria-labelledby="styleLbl">
            <button type="button" data-v="dot" data-i18n="style_dot"></button>
            <button type="button" data-v="grey" data-i18n="style_grey"></button>
          </div>
        </div>

        <label class="field"><span data-i18n="fill_lbl"></span>
          <select id="fill">
            <option value="half" data-i18n="fill_half"></option>
            <option value="full" data-i18n="fill_full"></option>
            <option value="model" data-i18n="fill_model"></option>
          </select>
        </label>

        <div class="grid-2" style="gap:12px">
          <label class="field"><span data-i18n="rows_lbl"></span>
            <select id="rows"></select>
          </label>
          <label class="field"><span data-i18n="repeat_lbl"></span>
            <select id="repeat" class="no-i18n"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
          </label>
        </div>

        <label class="field" id="fontBox"><span data-i18n="font_lbl"></span>
          <select id="font">
            <option value="round" data-i18n="font_round"></option>
            <option value="plain" data-i18n="font_plain"></option>
          </select>
        </label>

        <div class="hp-checks">
          <label class="check"><input type="checkbox" id="startDot"> <span><span data-i18n="dot_lbl"></span><br><span class="muted small" data-i18n="dot_note"></span></span></label>
          <label class="check"><input type="checkbox" id="nameLine"> <span data-i18n="name_line"></span></label>
        </div>

        <div class="row hp-actions">
          <button type="button" class="btn btn-primary btn-lg" id="printBtn"><span aria-hidden="true">🖨️</span> <span data-i18n="print_btn"></span></button>
          <button type="button" class="btn btn-danger" id="resetBtn" data-i18n="reset"></button>
        </div>
        <p class="muted small" data-i18n="print_tip" style="margin:0"></p>
      </section>

      <section class="hp-prev">
        <div class="row spread hp-prev-head no-print">
          <h2 data-i18n="preview"></h2>
          <span class="badge primary" id="status" aria-live="polite"></span>
        </div>
        <div id="msg" class="stack no-print" aria-live="polite"></div>
        <div id="pages" class="no-i18n"></div>
      </section>
    </div>

    <details class="card no-print" style="margin-top:16px">
      <summary><strong data-i18n="help"></strong></summary>
      <ul class="stack" style="margin-top:10px">
        <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li><li data-i18n="tip_class"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
