<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Compressor &amp; Resizer · AI Pathshala</title>
  <meta name="description" content="Resize, compress and watermark up to 100 photos at once for Instagram, WhatsApp status, YouTube, Amazon, Flipkart and websites. Free, private: photos never leave your device.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .ic-privacy { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
    .ic-privacy .ic-lock { font-size: 1.4rem; line-height: 1.2; }
    .ic-privacy p { margin: 0; }

    /* drop zone */
    .ic-drop { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; border: 2px dashed var(--border); background: var(--surface); }
    .ic-drop.over { border-color: var(--primary); background: var(--primary-soft); }
    .ic-drop:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .ic-drop-ico { font-size: 2.2rem; line-height: 1; }
    .ic-drop-txt { flex: 1 1 260px; min-width: 0; }
    .ic-drop-txt strong { font-size: 1.1rem; display: block; }
    .ic-drop-btns { display: flex; flex-wrap: wrap; gap: 8px; }

    .ic-layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; }
    @media (max-width: 900px) { .ic-layout { grid-template-columns: minmax(0, 1fr); } }

    .ic-settings h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; margin: 0; }
    .ic-settings { counter-reset: icsec; }
    .ic-num::before { counter-increment: icsec; content: counter(icsec); }
    .ic-num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: .85rem; flex: none; }
    .ic-sec + .ic-sec { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
    .ic-sec > * + * { margin-top: 10px; }
    .ic-sec details > summary { cursor: pointer; list-style: none; }
    .ic-sec details > summary::-webkit-details-marker { display: none; }
    .ic-sum { display: flex; align-items: center; gap: 8px; min-height: 40px; }
    .ic-sum::after { content: '▾'; margin-inline-start: auto; color: var(--muted); transition: transform .15s; }
    details[open] > .ic-sum::after { transform: rotate(180deg); }
    .ic-sum .badge { font-weight: 600; }
    details.ic-det > div { margin-top: 10px; }
    details.ic-det > div > * + * { margin-top: 10px; }

    /* presets */
    .ic-group { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; }
    :root[lang="ur"] .ic-group, :root:not([lang="en"]) .ic-group { text-transform: none; letter-spacing: 0; font-size: .85rem; }
    .ic-presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    @media (max-width: 900px) and (min-width: 560px) { .ic-presets { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .ic-preset { display: flex; align-items: center; gap: 8px; text-align: start; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; min-height: 48px; cursor: pointer; }
    .ic-preset:hover { background: var(--surface-2); }
    .ic-preset[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .ic-shape { flex: none; width: 30px; height: 30px; display: grid; place-items: center; }
    .ic-shape i { display: block; border: 2px solid var(--primary); border-radius: 3px; background: color-mix(in srgb, var(--primary) 14%, transparent); }
    .ic-shape b { font-size: 1rem; color: var(--primary); }
    .ic-ptxt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .ic-plab { font-weight: 600; font-size: .86rem; overflow-wrap: anywhere; }
    .ic-pdim { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    .ic-note { font-size: .86rem; }
    /* Nastaliq (Urdu) needs taller lines or the words overlap */
    :root[lang="ur"] .ic-ptxt, :root[lang="ur"] .ic-badges .badge, :root[lang="ur"] .ic-sizes, :root[lang="ur"] .ic-tag { line-height: 2; }
    :root[lang="ur"] .ic-plab { font-size: .82rem; }
    :root[lang="ur"] .ic-pdim, :root[lang="ur"] .ic-stat, :root[lang="ur"] .ic-name, :root[lang="ur"] .ic-vname { font-family: "Noto Sans", system-ui, sans-serif; line-height: 1.4; }

    .ic-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .ic-two input { width: 100%; }
    .ic-rangerow { display: flex; align-items: center; gap: 10px; }
    .ic-rangerow input[type="range"] { flex: 1 1 auto; }
    .ic-rangerow output { min-width: 3.2em; text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ic-seg { display: flex; width: 100%; }
    .ic-seg button { flex: 1 1 0; min-height: 40px; padding-inline: 8px; }
    .ic-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ic-chips .chip { min-height: 34px; }
    .ic-colorrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .ic-pos { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; direction: ltr; }
    .ic-pos button { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 1rem; }
    .ic-pos button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .ic-logo-prev { width: 64px; height: 64px; border: 1px solid var(--border); border-radius: 8px; object-fit: contain; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 14px 14px; }

    /* results */
    .ic-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 480px) { .ic-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .ic-stat { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    .ic-stat.ok { color: var(--success); }
    .ic-stat.bad { color: var(--warning); }
    .ic-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .ic-status { min-height: 1.4em; margin: 0; }

    .ic-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .ic-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
    .ic-item.sel { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .ic-item[data-status="error"] { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .ic-tbtn { width: 72px; height: 72px; padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; display: grid; place-items: center;
      background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 14px 14px; }
    .ic-tbtn img { max-width: 72px; max-height: 72px; display: block; }
    .ic-tbtn .ic-spin { font-size: 1.3rem; color: var(--muted); }
    .ic-name { font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; unicode-bidi: plaintext; text-align: start; }
    .ic-sizes { font-size: .84rem; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
    .ic-sizes .ic-dim { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
    [dir="rtl"] .ic-arrow { display: inline-block; transform: scaleX(-1); }
    .ic-pct { direction: ltr; unicode-bidi: isolate; }
    .ic-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .ic-badges .badge { white-space: normal; }
    .badge.warn { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
    .badge.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
    .ic-acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
    .ic-acts .btn { white-space: nowrap; }
    @media (max-width: 480px) {
      .ic-item { grid-template-columns: 60px minmax(0, 1fr); }
      .ic-tbtn { width: 60px; height: 60px; }
      .ic-tbtn img { max-width: 60px; max-height: 60px; }
      .ic-acts { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; }
    }
    .ic-empty { text-align: center; padding: 26px 16px; }
    .ic-empty .ic-big { font-size: 2.6rem; }

    /* viewer */
    .ic-vhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .ic-vname { font-size: 1rem; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; unicode-bidi: plaintext; }
    .ic-cmpbox { margin-top: 10px; overflow: auto; max-height: 72vh; border-radius: 10px; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
    .ic-cmp { position: relative; margin-inline: auto; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
    .ic-cmp canvas, .ic-cmp img { display: block; width: 100%; height: 100%; }
    .ic-cmp img { position: absolute; inset: 0; }
    .ic-line { position: absolute; top: 0; bottom: 0; width: 3px; margin-inline-start: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
    .ic-line::after { content: '⇆'; position: absolute; top: 50%; inset-inline-start: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #123; display: grid; place-items: center; font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
    .ic-tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: .8rem; font-weight: 700; pointer-events: none; }
    .ic-tag.b { inset-inline-start: 8px; }
    .ic-tag.a { inset-inline-end: 8px; }
    .ic-vinfo { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; margin-top: 8px; }
    .ic-crop { position: relative; display: inline-block; overflow: hidden; border-radius: 8px; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
    .ic-crop img { display: block; max-width: 100%; max-height: 56vh; }
    .ic-frame { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0,0,0,.4); cursor: move; touch-action: none; }
    .ic-frame:focus-visible { outline: 3px solid var(--accent); }
    .ic-frame::before, .ic-frame::after { content: ''; position: absolute; inset: 33.33% 0; border-block: 1px solid rgba(255,255,255,.45); pointer-events: none; }
    .ic-frame::after { inset: 0 33.33%; border-block: 0; border-inline: 1px solid rgba(255,255,255,.45); }
    .ic-cropwrap { text-align: center; margin-top: 10px; }

    .ic-mbar { display: none; }
    @media (max-width: 900px) {
      .ic-mbar:not([hidden]) { display: flex; position: sticky; bottom: 0; z-index: 40; margin: 14px -16px -32px; padding: 10px 16px; gap: 10px; align-items: center; justify-content: space-between;
        background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
      .ic-mbar .ic-mtxt { font-weight: 700; font-size: .9rem; min-width: 0; }
    }
    .ic-help ul { margin: 10px 0 0; padding-inline-start: 20px; }
    .ic-help li + li { margin-top: 8px; }
    .ic-help summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    .ic-help + .ic-help { margin-top: 12px; }
    .ic-kbd { margin-top: 8px; }
  </style>
</head>
<body>
  <main id="app" data-busy="0">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success ic-privacy" role="note">
      <span class="ic-lock" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <section class="card ic-drop" id="drop" tabindex="0" aria-labelledby="dropTitle">
      <div class="ic-drop-ico" aria-hidden="true">🖼️</div>
      <div class="ic-drop-txt">
        <strong id="dropTitle" data-i18n="drop_title"></strong>
        <span class="small muted" data-i18n="drop_hint"></span>
        <div class="tiny muted ic-kbd" data-i18n-html="drop_keys"></div>
      </div>
      <div class="ic-drop-btns">
        <button class="btn btn-primary btn-lg" id="pickBtn" type="button"><span aria-hidden="true">＋</span> <span data-i18n="pick_photos"></span></button>
        <button class="btn" id="sampleBtn" type="button" data-i18n="try_samples"></button>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.avif,.webp" hidden>
    </section>

    <div class="callout" id="heicBox" hidden role="status" style="margin-top:12px">
      <span id="heicMsg"></span>
      <button class="btn btn-sm" id="heicRetry" type="button" hidden data-i18n="try_again"></button>
    </div>

    <div class="ic-layout">
      <!-- ============ settings ============ -->
      <section class="card ic-settings" aria-label="settings" data-i18n-aria-label="settings_aria">
        <div class="ic-sec">
          <h2><span class="ic-num" aria-hidden="true"></span> <span data-i18n="h_size"></span></h2>
          <div id="presetGrid"></div>
          <div id="customBox" hidden>
            <div class="ic-two">
              <label class="field"><span data-i18n="custom_w"></span><input type="number" id="customW" min="1" max="20000" inputmode="numeric"></label>
              <label class="field"><span data-i18n="custom_h"></span><input type="number" id="customH" min="1" max="20000" inputmode="numeric"></label>
            </div>
            <p class="tiny muted mb0" data-i18n="custom_hint"></p>
          </div>
          <p class="callout ic-note mb0" id="presetNote"></p>
        </div>

        <div class="ic-sec" id="modeSec">
          <h2><span class="ic-num" aria-hidden="true"></span> <span data-i18n="h_fit"></span></h2>
          <div class="seg ic-seg" role="group" data-i18n-aria-label="h_fit" aria-label="fit">
            <button type="button" id="mode-fit" data-mode="fit" data-i18n="mode_fit"></button>
            <button type="button" id="mode-fill" data-mode="fill" data-i18n="mode_fill"></button>
            <button type="button" id="mode-exact" data-mode="exact" data-i18n="mode_exact"></button>
          </div>
          <p class="small muted mb0" id="modeHint"></p>
          <div id="fitOpts" class="stack">
            <div class="field">
              <span data-i18n="bg_label"></span>
              <div class="seg ic-seg" role="group" data-i18n-aria-label="bg_label" aria-label="background">
                <button type="button" id="bg-color" data-bg="color" data-i18n="bg_color"></button>
                <button type="button" id="bg-blur" data-bg="blur" data-i18n="bg_blur"></button>
                <button type="button" id="bg-transparent" data-bg="transparent" data-i18n="bg_transparent"></button>
              </div>
            </div>
            <div class="ic-colorrow" id="colorRow">
              <label class="check" for="bgColor"><span data-i18n="bg_pick"></span></label>
              <input type="color" id="bgColor" value="#ffffff">
              <button type="button" class="chip" data-color="#ffffff" data-i18n="c_white"></button>
              <button type="button" class="chip" data-color="#000000" data-i18n="c_black"></button>
            </div>
            <label class="field"><span><span data-i18n="margin_label"></span></span>
              <span class="ic-rangerow"><input type="range" id="margin" min="0" max="30" step="1"><output id="marginOut" for="margin"></output></span>
            </label>
          </div>
        </div>
        <div class="ic-sec" id="enlargeSec" hidden>
          <label class="check"><input type="checkbox" id="noEnlarge"> <span data-i18n="no_enlarge"></span></label>
        </div>

        <div class="ic-sec">
          <h2><span class="ic-num" aria-hidden="true"></span> <span data-i18n="h_format"></span></h2>
          <div class="seg ic-seg no-i18n" role="group" id="fmtSeg" aria-label="format" data-i18n-aria-label="h_format">
            <button type="button" id="fmt-jpg" data-fmt="jpg">JPG</button>
            <button type="button" id="fmt-webp" data-fmt="webp">WebP</button>
            <button type="button" id="fmt-png" data-fmt="png">PNG</button>
            <button type="button" id="fmt-avif" data-fmt="avif" hidden>AVIF</button>
          </div>
          <p class="small muted mb0" id="fmtHint"></p>
          <div class="seg ic-seg" role="group" data-i18n-aria-label="cm_label" aria-label="compress">
            <button type="button" id="cm-quality" data-cm="quality" data-i18n="cm_quality"></button>
            <button type="button" id="cm-size" data-cm="size" data-i18n="cm_size"></button>
          </div>
          <div id="qualityBox" class="field">
            <span data-i18n="quality_label"></span>
            <span class="ic-rangerow"><input type="range" id="quality" min="10" max="100" step="1"><output id="qualityOut" for="quality"></output></span>
            <span class="hint" data-i18n="quality_hint"></span>
          </div>
          <div id="sizeBox" class="stack" hidden>
            <label class="field"><span data-i18n="target_label"></span>
              <input type="number" id="targetKB" min="10" max="50000" step="10" inputmode="numeric">
            </label>
            <div class="ic-chips no-i18n" id="kbChips">
              <button type="button" class="chip" data-kb="100">100 KB</button>
              <button type="button" class="chip" data-kb="200">200 KB</button>
              <button type="button" class="chip" data-kb="500">500 KB</button>
              <button type="button" class="chip" data-kb="1000">1 MB</button>
              <button type="button" class="chip" data-kb="2000">2 MB</button>
            </div>
            <p class="small muted mb0" id="sizeHint"></p>
          </div>
        </div>

        <div class="ic-sec">
          <details class="ic-det" id="wmDet">
            <summary class="ic-sum"><h2><span class="ic-num" aria-hidden="true"></span> <span data-i18n="h_wm"></span></h2> <span class="badge" id="wmBadge"></span></summary>
            <div>
              <div class="seg ic-seg" role="group" data-i18n-aria-label="h_wm" aria-label="watermark">
                <button type="button" id="wm-none" data-wm="none" data-i18n="wm_none"></button>
                <button type="button" id="wm-text" data-wm="text" data-i18n="wm_text"></button>
                <button type="button" id="wm-logo" data-wm="logo" data-i18n="wm_logo"></button>
              </div>
              <div id="wmTextBox" class="stack" hidden>
                <label class="field"><span data-i18n="wm_text_label"></span>
                  <input type="text" id="wmText" class="no-i18n" maxlength="80" data-i18n-placeholder="wm_placeholder">
                </label>
                <div class="ic-colorrow">
                  <label class="check" for="wmColor"><span data-i18n="wm_color"></span></label>
                  <input type="color" id="wmColor" value="#ffffff">
                </div>
                <label class="field"><span data-i18n="wm_size"></span>
                  <span class="ic-rangerow"><input type="range" id="wmSize" min="2" max="20" step="0.5"><output id="wmSizeOut" for="wmSize"></output></span>
                </label>
              </div>
              <div id="wmLogoBox" class="stack" hidden>
                <div class="row">
                  <img class="ic-logo-prev" id="logoPrev" alt="" hidden>
                  <button type="button" class="btn" id="logoPick" data-i18n="wm_logo_pick"></button>
                  <button type="button" class="btn btn-sm btn-danger" id="logoDel" data-i18n="delete" hidden></button>
                </div>
                <p class="tiny muted mb0" data-i18n="wm_logo_hint"></p>
                <label class="field"><span data-i18n="wm_lsize"></span>
                  <span class="ic-rangerow"><input type="range" id="wmLsize" min="5" max="60" step="1"><output id="wmLsizeOut" for="wmLsize"></output></span>
                </label>
              </div>
              <div id="wmCommon" class="stack" hidden>
                <label class="field"><span data-i18n="wm_opacity"></span>
                  <span class="ic-rangerow"><input type="range" id="wmOpacity" min="10" max="100" step="1"><output id="wmOpacityOut" for="wmOpacity"></output></span>
                </label>
                <div class="field">
                  <span data-i18n="wm_pos"></span>
                  <div class="ic-pos" id="posGrid" role="group" data-i18n-aria-label="wm_pos" aria-label="position"></div>
                </div>
                <label class="check"><input type="checkbox" id="wmTile"> <span data-i18n="wm_tile"></span></label>
                <p class="tiny muted mb0" data-i18n="wm_hint"></p>
              </div>
            </div>
          </details>
        </div>

        <div class="ic-sec">
          <details class="ic-det" id="nameDet">
            <summary class="ic-sum"><h2><span class="ic-num" aria-hidden="true"></span> <span data-i18n="h_names"></span></h2></summary>
            <div>
              <label class="field"><span data-i18n="name_label"></span>
                <input type="text" id="pattern" class="no-i18n" maxlength="80" spellcheck="false" autocomplete="off">
              </label>
              <div class="ic-chips no-i18n" id="tokChips">
                <button type="button" class="chip" data-tok="{name}">{name}</button>
                <button type="button" class="chip" data-tok="{w}">{w}</button>
                <button type="button" class="chip" data-tok="{h}">{h}</button>
                <button type="button" class="chip" data-tok="{n}">{n}</button>
                <button type="button" class="chip" data-tok="{date}">{date}</button>
              </div>
              <p class="tiny muted mb0" data-i18n="name_hint"></p>
              <p class="small mb0"><span data-i18n="name_example"></span> <code class="no-i18n" id="nameEx"></code></p>
            </div>
          </details>
        </div>

        <div class="ic-sec row spread">
          <span class="tiny muted" data-i18n="settings_saved"></span>
          <button type="button" class="btn btn-sm btn-danger" id="resetSettings" data-i18n="reset_settings"></button>
        </div>
      </section>

      <!-- ============ results ============ -->
      <section class="stack ic-results" aria-labelledby="hResults">
        <div class="card stack" id="summary">
          <h2 id="hResults" class="mb0" data-i18n="h_results"></h2>
          <div class="ic-stats" aria-live="polite">
            <div><div class="tiny muted" data-i18n="st_photos"></div><div class="ic-stat" id="stCount">0</div></div>
            <div><div class="tiny muted" data-i18n="st_before"></div><div class="ic-stat" id="stBefore">0</div></div>
            <div><div class="tiny muted" data-i18n="st_after"></div><div class="ic-stat" id="stAfter">0</div></div>
            <div><div class="tiny muted" data-i18n="st_saved"></div><div class="ic-stat" id="stSaved">0%</div></div>
          </div>
          <div class="progress" id="prog" hidden><span style="width:0%"></span></div>
          <p class="small muted ic-status" id="status" aria-live="polite"></p>
          <div class="ic-actions">
            <button class="btn btn-primary" id="zipBtn" type="button" disabled><span aria-hidden="true">⬇</span> <span data-i18n="dl_zip"></span></button>
            <button class="btn" id="eachBtn" type="button" disabled data-i18n="dl_each"></button>
            <button class="btn" id="shareBtn" type="button" hidden disabled><span aria-hidden="true">↗</span> <span data-i18n="share_files"></span></button>
            <button class="btn btn-danger" id="clearBtn" type="button" disabled data-i18n="clear_all"></button>
          </div>
        </div>

        <div class="card" id="viewer" hidden>
          <div class="ic-vhead">
            <h3 class="ic-vname no-i18n" id="vName"></h3>
            <div class="seg" role="group" id="viewSeg" aria-label="view" data-i18n-aria-label="view_aria">
              <button type="button" id="vCompare" data-view="compare" data-i18n="v_compare"></button>
              <button type="button" id="vCrop" data-view="crop" data-i18n="v_crop"></button>
            </div>
          </div>
          <div id="cmpPane">
            <div class="ic-cmpbox" id="cmpBox">
              <div class="ic-cmp" id="cmp" dir="ltr">
                <canvas id="cmpBefore" width="10" height="10"></canvas>
                <img id="cmpAfter" alt="">
                <div class="ic-line" id="cmpLine"></div>
                <span class="ic-tag b" data-i18n="before"></span>
                <span class="ic-tag a" data-i18n="after"></span>
              </div>
            </div>
            <input type="range" id="cmpRange" min="0" max="100" value="50" data-i18n-aria-label="v_compare" aria-label="compare">
            <div class="ic-vinfo">
              <span class="small muted" id="cmpInfo"></span>
              <label class="check small"><input type="checkbox" id="zoom1"> <span data-i18n="zoom_100"></span></label>
            </div>
          </div>
          <div id="cropPane" hidden>
            <p class="small muted" data-i18n="crop_hint"></p>
            <div class="ic-cropwrap">
              <div class="ic-crop" id="crop" dir="ltr">
                <img id="cropImg" alt="">
                <div class="ic-frame" id="cropFrame" tabindex="0" role="group" data-i18n-aria-label="crop_aria" aria-label="crop"></div>
              </div>
            </div>
            <div class="row" style="margin-top:10px">
              <button type="button" class="btn btn-sm" id="cropCenter" data-i18n="crop_center"></button>
              <button type="button" class="btn btn-sm" id="cropAll" data-i18n="crop_all"></button>
            </div>
          </div>
        </div>

        <div class="card ic-empty" id="empty">
          <div class="ic-big" aria-hidden="true">📷</div>
          <p class="mb0" data-i18n="empty"></p>
        </div>
        <ul class="ic-list" id="list" aria-labelledby="hResults"></ul>
      </section>
    </div>

    <details class="card ic-help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
    <details class="card ic-help no-print">
      <summary data-i18n="inside_title"></summary>
      <ul>
        <li data-i18n="inside1"></li>
        <li data-i18n="inside2"></li>
        <li data-i18n="inside3"></li>
        <li data-i18n="inside4"></li>
      </ul>
    </details>

    <div class="ic-mbar" id="mbar" hidden>
      <span class="ic-mtxt" id="mbarTxt"></span>
      <button class="btn btn-primary btn-sm" id="mbarZip" type="button"><span aria-hidden="true">⬇</span> <span data-i18n="dl_zip_short"></span></button>
    </div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
