<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projectile Motion Lab · AI Pathshala</title>
  <meta name="description" content="Launch a cricket ball at any speed, angle and height, on Earth or other planets, and check time of flight, range and maximum height with the Class 11 formulas. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* phones: picture first; laptops and smartboards: settings | picture */
    .pm-top { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1000px) {
      .pm-top { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); }
      .pm-stagecard { grid-column: 2; grid-row: 1; }
      .pm-ctrl { grid-column: 1; grid-row: 1; }
    }
    .pm-top:fullscreen { background: var(--bg); padding: 12px; overflow: auto; }
    .pm-top:-webkit-full-screen { background: var(--bg); padding: 12px; overflow: auto; }
    .pm-below { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-top: 14px; align-items: start; }
    @media (min-width: 1000px) { .pm-below { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
    .pm-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .card h2 { font-size: 1.12rem; margin: 0 0 10px; }

    /* stage */
    .pm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .pm-bar .seg button { min-height: 40px; }
    .pm-bar .grow { flex: 1 1 0; }
    .pm-stage { background: var(--surface); }
    .pm-stage canvas { display: block; width: 100%; touch-action: pan-y; }
    .pm-actions { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }
    .pm-launch { min-width: 9.5rem; }
    .pm-actions .check { min-height: 40px; }
    .pm-scrub { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; margin-top: 8px; }
    .pm-scrub input[type="range"] { min-height: 36px; }
    @media (max-width: 560px) { .pm-scrub { grid-template-columns: minmax(0, 1fr); } }
    .pm-readout { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 16px; font-family: var(--mono); font-size: .92rem;
      background: var(--surface-2); padding: 7px 12px; border-radius: var(--radius-sm); min-height: 2.5em; align-items: center;
      direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
    .pm-readout b { font-weight: 700; }
    .pm-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .pm-stat { background: var(--primary-soft); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; }
    .pm-stat .lbl { display: block; font-size: .8rem; color: var(--muted); font-weight: 700; line-height: 1.3; }
    .pm-stat .val { display: block; font-size: clamp(1.15rem, 3.2vw, 1.6rem); font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; text-align: start; }
    .pm-top:fullscreen .pm-stat .val { font-size: 1.9rem; }

    /* game */
    .pm-game { margin-bottom: 10px; }
    .pm-game h2 { font-size: 1.05rem; margin: 0; }
    .pm-game .row { gap: 8px 14px; }
    .pm-game .seg button { min-height: 38px; }
    .pm-gstats { display: flex; flex-wrap: wrap; gap: 6px; }
    .pm-gstats .badge { font-size: .85rem; padding: 4px 10px; }
    .pm-gmsg { font-weight: 700; margin: 0; }
    .pm-gmsg.hit { color: var(--success); }
    .pm-gmsg.miss { color: var(--warning); }

    /* settings */
    .pm-param { display: grid; grid-template-columns: minmax(0, 1fr) 6.3rem 2.6rem; gap: 4px 8px; align-items: center; }
    .pm-param + .pm-param { margin-top: 12px; }
    .pm-param > .pm-plabel { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
    .pm-param input[type="range"] { min-height: 40px; }
    .pm-param input[type="number"] { width: 100%; font-variant-numeric: tabular-nums; }
    .pm-unit { color: var(--muted); font-weight: 600; font-size: .9rem; direction: ltr; unicode-bidi: isolate; }
    .pm-kmh { color: var(--muted); font-size: .84rem; direction: ltr; unicode-bidi: isolate; }
    .pm-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pm-chips .chip { min-height: 40px; }
    .pm-chips .chip .gv { opacity: .8; font-weight: 500; direction: ltr; unicode-bidi: isolate; }
    .pm-custom { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .pm-custom input { width: 7rem; }
    .pm-sub { margin-top: 16px; }
    .pm-ctrl .callout { font-size: .9rem; margin-top: 8px; }
    .pm-ctrl [disabled] { opacity: .6; cursor: not-allowed; }
    fieldset.pm-fs { border: 0; padding: 0; margin: 0; min-width: 0; }
    fieldset.pm-fs > legend { padding: 0; font-weight: 600; font-size: .92rem; }

    /* results */
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
    .pm-res td.num, .pm-res th.num { text-align: end; }
    /* long column titles (Tamil, Malayalam, Telugu, Kannada) wrap so the formula column stays on screen on phones */
    .pm-res th, .pm-res th.num { white-space: normal; overflow-wrap: break-word; }
    @media (max-width: 480px) { .pm-res th, .pm-res td { padding: 7px 5px; } .pm-res { font-size: .86rem; } .pm-res th { font-size: .8rem; } .pm-res td:first-child { overflow-wrap: anywhere; } }
    .pm-res td.diff { color: var(--warning); font-weight: 700; }
    .pm-work { margin-top: 12px; display: grid; gap: 10px; }
    .pm-wlbl { font-weight: 700; font-size: .92rem; }
    .pm-eq { margin: 4px 0 0; font-family: var(--mono); font-size: .92rem; background: var(--surface-2); border-radius: var(--radius-sm);
      padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; direction: ltr; text-align: left; line-height: 1.6; }
    .pm-note { margin: 10px 0 0; }
    .card h3.pm-sub { margin-top: 18px; }
    :root[lang="ur"] .pm-stat .val, :root[lang="ur"] .num, :root[lang="ur"] .pm-unit, :root[lang="ur"] .pm-kmh,
    :root[lang="ur"] .pm-chips .gv, :root[lang="ur"] .pm-param input[type="number"], :root[lang="ur"] .pm-dot, :root[lang="ur"] .pm-tl .pt.lat { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }

    /* trails */
    .pm-trails { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .pm-trails li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .pm-trails li.latest { border-color: var(--primary); background: var(--primary-soft); }
    .pm-dot { width: 26px; height: 26px; border-radius: 999px; background: var(--col); color: #fff; font-weight: 800; font-size: .85rem; display: inline-grid; place-items: center; font-family: "Noto Sans", system-ui, sans-serif; }
    .pm-tl { font-size: .9rem; min-width: 0; }
    .pm-tl .r { font-weight: 700; }
    .pm-tl .pt { unicode-bidi: isolate; white-space: nowrap; }
    .pm-tl .pt.lat { direction: ltr; }
    .pm-del { min-width: 40px; min-height: 40px; }

    /* learn */
    .pm-learn-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .pm-learn-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }
    .pm-learn-item h3 { font-size: .98rem; margin: 0 0 4px; color: var(--primary); }
    .pm-learn-item p { margin: 0; font-size: .93rem; }
    .pm-demos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pm-best { margin-top: 10px; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 32px; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.2rem; }
    details.card li + li { margin-top: 6px; }

    @media (max-width: 420px) {
      .pm-param { grid-template-columns: minmax(0, 1fr) 5.4rem 2.4rem; }
      .pm-stat { padding: 7px 8px; }
      .pm-stat .lbl { font-size: .74rem; }
    }

    @media print {
      .pm-top, .pm-below { display: block; }
      .pm-ctrl, .pm-learn, .pm-help, .edu-intro, .pm-del { display: none !important; }
      .pm-trails li { grid-template-columns: auto minmax(0, 1fr); }
      .pm-stagecard, .pm-col > .card { margin-top: 10px; }
      .pm-stage { border-color: #999; }
      .pm-stage canvas { height: auto !important; }
      .pm-game { background: #fff; }
      .pm-trails li.latest { background: #fff; }
      .pm-print-h { display: block; font-size: 1.3rem; margin: 0 0 8px; }
      /* printing from dark mode: the shared print reset keeps the dark "soft" callout and badge colours
         (dark green / brown boxes with dark text on paper), so use the light palette here */
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
        --primary: #0b4f5c; --primary-ink: #fff; --accent: #d9501c;
        --success: #15803d; --success-soft: #e9f9ee; --danger: #b42318; --danger-soft: #fee4e2;
        --warning: #a15c07; --warning-soft: #fdf5dd; --info: #0b69a3; --info-soft: #e8f4fd;
        --c1: #0b7285; --c2: #e8590c; --c3: #5f3dc4; --c4: #2b8a3e; --c5: #c2255c; --c6: #b08900; --c7: #1971c2; --c8: #868e96;
      }
      .callout { color: #000; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <h2 class="print-only pm-print-h" data-i18n="app_title"></h2>

    <div class="pm-top" id="pm-top">
      <!-- picture -->
      <section class="card pm-stagecard" aria-labelledby="h-stage">
        <h2 id="h-stage" hidden data-i18n="app_title"></h2>
        <div class="pm-bar no-print">
          <div class="seg" role="group" data-i18n-aria-label="mode_label">
            <button type="button" id="mode-explore" aria-pressed="true" data-i18n="mode_explore"></button>
            <button type="button" id="mode-game" aria-pressed="false" data-i18n="mode_game"></button>
          </div>
          <span class="grow"></span>
          <button type="button" class="btn btn-sm" id="save-png"><span aria-hidden="true">🖼</span> <span data-i18n="save_png"></span></button>
          <button type="button" class="btn btn-sm" id="print"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          <button type="button" class="btn btn-sm" id="fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
        </div>

        <div class="callout accent pm-game stack" id="game-panel" hidden>
          <div class="row spread">
            <h2 data-i18n="h_game"></h2>
            <div class="row no-print">
              <span class="small muted" data-i18n="level"></span>
              <div class="seg" role="group" data-i18n-aria-label="level">
                <button type="button" id="lvl-easy" aria-pressed="true" data-i18n="level_easy"></button>
                <button type="button" id="lvl-hard" aria-pressed="false" data-i18n="level_hard"></button>
              </div>
              <button type="button" class="btn btn-sm btn-primary" id="new-target"><span aria-hidden="true">🎯</span> <span data-i18n="new_target"></span></button>
            </div>
          </div>
          <p class="mb0" id="target-info"></p>
          <div class="pm-gstats"><span class="badge accent" id="g-attempts"></span><span class="badge success" id="g-hits"></span><span class="badge" id="g-avg"></span></div>
          <p class="pm-gmsg" id="game-msg" aria-live="polite"></p>
          <p class="small muted mb0" id="game-tip"></p>
        </div>

        <div class="stage pm-stage"><canvas id="cv" dir="ltr" role="img" data-i18n-aria-label="cv_aria" data-busy="0"></canvas></div>

        <div class="pm-actions no-print">
          <button type="button" class="btn btn-accent btn-lg pm-launch" id="launch"><span aria-hidden="true">🏏</span> <span data-i18n="launch"></span></button>
          <button type="button" class="btn" id="clear"><span aria-hidden="true">🧹</span> <span data-i18n="clear_trails"></span></button>
          <label class="check"><input type="checkbox" id="vectors"> <span data-i18n="vectors"></span></label>
          <label class="check"><input type="checkbox" id="slow"> <span data-i18n="slow"></span></label>
        </div>
        <div class="pm-scrub no-print">
          <label for="scrub" data-i18n="scrub"></label>
          <input type="range" id="scrub" dir="ltr" min="0" max="1000" step="1" value="1000">
          <div class="pm-readout no-i18n" id="readout" aria-live="off"></div>
        </div>
        <div class="pm-stats" id="stats" aria-live="polite">
          <div class="pm-stat"><span class="lbl" data-i18n="r_time"></span><span class="val" id="st-T">–</span></div>
          <div class="pm-stat"><span class="lbl" data-i18n="r_range"></span><span class="val" id="st-R">–</span></div>
          <div class="pm-stat"><span class="lbl" data-i18n="r_height"></span><span class="val" id="st-H">–</span></div>
        </div>
      </section>

      <!-- settings -->
      <section class="card pm-ctrl no-print" aria-labelledby="h-settings">
        <h2 id="h-settings" data-i18n="h_settings"></h2>
        <div class="pm-param">
          <div class="pm-plabel"><label for="speed-num" data-i18n="speed"></label><span class="pm-kmh" id="kmh"></span></div>
          <input type="range" id="speed" min="1" max="60" step="0.5" data-i18n-aria-label="speed">
          <input type="number" id="speed-num" min="0.1" max="100" step="0.1" inputmode="decimal">
          <span class="pm-unit">m/s</span>
        </div>
        <div class="pm-param">
          <div class="pm-plabel"><label for="angle-num" data-i18n="angle"></label></div>
          <input type="range" id="angle" min="0" max="90" step="1" data-i18n-aria-label="angle">
          <input type="number" id="angle-num" min="0" max="90" step="0.1" inputmode="decimal">
          <span class="pm-unit">°</span>
        </div>
        <fieldset class="pm-fs" id="fixed-fs">
          <div class="pm-param">
            <div class="pm-plabel"><label for="height-num" data-i18n="height"></label></div>
            <input type="range" id="height" min="0" max="100" step="1" data-i18n-aria-label="height">
            <input type="number" id="height-num" min="0" max="500" step="0.1" inputmode="decimal">
            <span class="pm-unit">m</span>
          </div>
          <div class="pm-sub">
            <div class="pm-plabel"><span class="small" style="font-weight:600" id="g-label" data-i18n="gravity"></span></div>
            <div class="pm-chips" role="group" aria-labelledby="g-label" id="g-chips">
              <button type="button" class="chip" id="g-earth" data-g="earth"><span aria-hidden="true">🌍</span> <span data-i18n="g_earth"></span> <span class="gv">9.8</span></button>
              <button type="button" class="chip" id="g-moon" data-g="moon"><span aria-hidden="true">🌕</span> <span data-i18n="g_moon"></span> <span class="gv">1.6</span></button>
              <button type="button" class="chip" id="g-mars" data-g="mars"><span aria-hidden="true">🔴</span> <span data-i18n="g_mars"></span> <span class="gv">3.7</span></button>
              <button type="button" class="chip" id="g-jupiter" data-g="jupiter"><span aria-hidden="true">🪐</span> <span data-i18n="g_jupiter"></span> <span class="gv">24.8</span></button>
              <button type="button" class="chip" id="g-custom" data-g="custom"><span aria-hidden="true">✏️</span> <span data-i18n="g_custom"></span></button>
            </div>
            <div class="pm-custom" id="custom-row" hidden>
              <label for="g-custom-val" data-i18n="custom_g"></label>
              <input type="number" id="g-custom-val" min="0.1" max="100" step="0.1" inputmode="decimal">
              <span class="pm-unit">m/s²</span>
            </div>
          </div>
          <div class="pm-sub">
            <label class="check"><input type="checkbox" id="air"> <span data-i18n="air"></span></label>
            <p class="callout small mb0" id="air-note"></p>
          </div>
        </fieldset>
        <p class="callout warning small" id="game-locked" hidden data-i18n="game_locked"></p>
        <div class="row pm-sub">
          <button type="button" class="btn btn-danger btn-sm" id="reset"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
        </div>
      </section>
    </div>

    <div class="pm-below">
      <div class="pm-col">
        <section class="card pm-results" aria-labelledby="h-results">
          <h2 id="h-results" data-i18n="h_results"></h2>
          <p class="muted" id="res-none" data-i18n="res_none"></p>
          <div id="res-wrap" hidden>
            <div class="scroll-x">
              <table class="table pm-res">
                <thead><tr><th data-i18n="col_qty"></th><th class="num" data-i18n="col_sim"></th><th class="num" id="col-formula" data-i18n="col_formula"></th></tr></thead>
                <tbody id="res-body"></tbody>
              </table>
            </div>
            <p class="callout pm-note small" id="res-note" aria-live="polite"></p>
            <h3 class="pm-sub" data-i18n="h_working"></h3>
            <p class="small muted mb0" id="work-intro"></p>
            <div class="pm-work" id="work"></div>
          </div>
        </section>
        <section class="card pm-trails-card" aria-labelledby="h-trails">
          <h2 id="h-trails" data-i18n="h_trails"></h2>
          <p class="small muted" id="trails-hint"></p>
          <ol class="pm-trails" id="trails"></ol>
          <p class="muted mb0" id="trails-empty" data-i18n="trails_empty"></p>
        </section>
      </div>
      <div class="pm-col">
        <section class="card pm-learn" aria-labelledby="h-learn">
          <h2 id="h-learn" data-i18n="h_learn"></h2>
          <div class="pm-learn-grid">
            <div class="pm-learn-item"><h3 data-i18n="learn_45_t"></h3><p data-i18n="learn_45"></p></div>
            <div class="pm-learn-item"><h3 data-i18n="learn_comp_t"></h3><p data-i18n="learn_comp"></p></div>
            <div class="pm-learn-item"><h3 data-i18n="learn_ind_t"></h3><p data-i18n="learn_ind"></p></div>
            <div class="pm-learn-item"><h3 data-i18n="learn_real_t"></h3><p data-i18n="learn_real"></p></div>
          </div>
          <div class="pm-demos">
            <button type="button" class="btn" id="demo-45"><span aria-hidden="true">📐</span> <span data-i18n="demo_45"></span></button>
            <button type="button" class="btn" id="demo-comp"><span aria-hidden="true">⚖️</span> <span data-i18n="demo_comp"></span></button>
            <button type="button" class="btn" id="find-best"><span aria-hidden="true">🔍</span> <span data-i18n="find_best"></span></button>
          </div>
          <div class="callout success pm-best row" id="best-box" hidden>
            <span class="grow" id="best-out" aria-live="polite"></span>
            <button type="button" class="btn btn-sm btn-primary" id="use-best" data-i18n="use_best"></button>
          </div>
        </section>
        <details class="card pm-help">
          <summary data-i18n="h_help"></summary>
          <ul>
            <li data-i18n="tip1"></li>
            <li data-i18n="tip2"></li>
            <li data-i18n="tip3"></li>
            <li data-i18n="tip4"></li>
            <li data-i18n="tip5"></li>
            <li data-i18n="tip6"></li>
          </ul>
        </details>
      </div>
    </div>
  </main>
