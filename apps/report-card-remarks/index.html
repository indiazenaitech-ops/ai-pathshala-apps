<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Card Remarks · AI Pathshala</title>
  <meta name="description" content="A kind, ready-to-use comment bank for report cards and progress reports in 12 Indian languages. Free, private, works offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .rcr-h { margin: 6px 0 2px; font-size: 1.05rem; }
    @media (min-width: 720px) { .rcr-act { flex-direction: row; align-items: center; } .rcr-act button { flex: none; } }
    .rcr-top { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .rcr-top input, .rcr-top select { width: 100%; min-height: 42px; }
    .rcr-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .rcr-chips .chip { min-height: 40px; }
    .rcr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .rcr-item { display: flex; gap: 6px; align-items: stretch; }
    .rcr-text { flex: 1 1 auto; min-width: 0; text-align: start; font: inherit; line-height: 1.6; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; overflow-wrap: anywhere; }
    .rcr-text:hover, .rcr-text:focus-visible { border-color: var(--primary); background: var(--primary-soft); }
    .rcr-act { display: flex; flex-direction: column; gap: 6px; }
    .rcr-act button { min-width: 42px; min-height: 40px; flex: 1 1 auto; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; font-size: 1.1rem; cursor: pointer; }
    .rcr-act button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .rcr-act button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink, #fff); }
    #comboText { width: 100%; min-height: 110px; font: inherit; line-height: 1.6; overflow-wrap: anywhere; }
    .rcr-picks { display: flex; flex-wrap: wrap; gap: 6px; }
    .rcr-picks .chip { max-width: 100%; }
    .rcr-picks .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; unicode-bidi: plaintext; }
    .rcr-printhead { font-weight: 700; margin: 0; }
    @media print {
      .rcr-noprint, details { display: none !important; }
      .rcr-act { display: none; }
      .rcr-text { border: 0; background: none; padding: 2px 0; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card stack rcr-noprint">
      <div class="rcr-top">
        <label class="field"><span data-i18n="name_label"></span><input type="text" id="name" class="no-i18n" maxlength="60" autocomplete="off" data-i18n-placeholder="name_ph"></label>
        <label class="field"><span data-i18n="rlang_label"></span><select id="rlang"></select></label>
      </div>
      <div class="stack" id="pronBox">
        <div class="muted small" data-i18n="pron_label"></div>
        <div class="seg" id="pron" role="group" data-i18n-aria-label="pron_label">
          <button data-g="2" data-i18n="pron_they"></button>
          <button data-g="1" data-i18n="pron_she"></button>
          <button data-g="0" data-i18n="pron_he"></button>
        </div>
      </div>
      <h2 class="rcr-h" data-i18n="area_label"></h2>
      <div class="rcr-chips" id="areas" role="group" data-i18n-aria-label="area_label"></div>
      <div class="stack" id="levelBox">
        <h2 class="rcr-h" data-i18n="level_label"></h2>
        <div class="rcr-chips" id="levels" role="group" data-i18n-aria-label="level_label"></div>
      </div>
    </section>

    <section class="card stack">
      <div class="row spread">
        <h2 class="rcr-h" data-i18n="list_title"></h2>
        <span class="badge" id="count"></span>
      </div>
      <p class="print-only rcr-printhead no-i18n" id="printHead"></p>
      <p class="muted small rcr-noprint" data-i18n="list_hint"></p>
      <ul class="rcr-list" id="list"></ul>
      <p class="muted small" id="status" aria-live="polite"></p>
    </section>

    <section class="card stack rcr-noprint">
      <h2 class="rcr-h" data-i18n="combo_title"></h2>
      <p class="muted small" data-i18n="combo_hint"></p>
      <div class="rcr-picks" id="picks"></div>
      <textarea id="comboText" class="no-i18n" data-i18n-aria-label="combo_title" data-i18n-placeholder="combo_empty"></textarea>
      <div class="row">
        <button class="btn btn-primary" id="comboCopy" data-i18n="combo_copy"></button>
        <button class="btn" id="comboClear" data-i18n="clear"></button>
        <button class="btn btn-ghost" id="printBtn" data-i18n="print"></button>
      </div>
    </section>

    <section class="card stack rcr-noprint">
      <div class="row spread">
        <h2 class="rcr-h" data-i18n="favs_title"></h2>
        <span class="badge" id="favCount"></span>
      </div>
      <p class="muted small" id="favEmpty" data-i18n="favs_empty"></p>
      <ul class="rcr-list" id="favs"></ul>
      <div class="row"><button class="btn btn-danger btn-sm" id="resetBtn" data-i18n="reset"></button></div>
    </section>

    <div class="callout rcr-noprint" data-i18n="kind_note"></div>

    <details class="card">
      <summary data-i18n="how_title"></summary>
      <ul class="stack">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="data-en.js"></script>
  <script src="data-hi.js"></script>
  <script src="data-bn.js"></script>
  <script src="data-mr.js"></script>
  <script src="data-gu.js"></script>
  <script src="data-pa.js"></script>
  <script src="data-or.js"></script>
  <script src="data-ta.js"></script>
  <script src="data-te.js"></script>
  <script src="data-kn.js"></script>
  <script src="data-ml.js"></script>
  <script src="data-ur.js"></script>
  <script src="app.js"></script>
</body>
</html>
