<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Equation Balancer · AI Pathshala</title>
  <meta name="description" content="Free chemical equation balancer for CBSE Class 9-12: balances any equation (brackets, hydrates, ions) with step-by-step algebra, an atom count table and 15 NCERT Class 10 practice reactions. Works offline in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* chemistry is always written left-to-right in a clean Latin face (Indic / Nastaliq line boxes are very tall) */
    :root { --eqfont: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .eb-tabbar { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .eb-tabbar .tabs { border-bottom: 0; margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
    .eb-tabbar .tabs button { font-size: 1rem; }
    .eb-tabbar #fs-btn { margin-bottom: 4px; flex: 0 0 auto; font-size: 1.1rem; }
    @media (max-width: 560px) { .eb-tabbar .tabs button { padding-inline: 9px; font-size: .95rem; } .eb-tabbar .tabs { gap: 2px; } }
    .eb-panel > * + * { margin-top: 16px; }
    .eb-label { display: block; font-weight: 700; margin-bottom: 6px; }

    /* ---------- input ---------- */
    .eb-inrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
    .eb-in { flex: 1 1 280px; min-width: 0; width: 100%; font-family: var(--eqfont) !important; font-size: 1.3rem !important; padding: 10px 14px !important; line-height: 1.4 !important; }
    .eb-inrow .btn-lg { flex: 0 0 auto; }
    .eb-keys { gap: 6px; }
    .eb-key { min-width: 44px; min-height: 40px; font-family: var(--eqfont); font-size: 1.05rem; padding-inline: 10px; }
    .eb-examples { display: flex; flex-wrap: wrap; gap: 8px; }
    .eb-ex { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 .3em; font-family: var(--eqfont); font-weight: 500;
      border-radius: 12px; max-width: 100%; min-height: 40px; line-height: 1.5; }
    .eb-ex .eb-arrow small { display: none; }
    #eq-msg { font-weight: 600; }

    /* ---------- equations ---------- */
    .eb-eq { font-family: var(--eqfont); display: flex; flex-wrap: wrap; align-items: baseline; gap: .25em .4em; line-height: 1.7; direction: ltr; unicode-bidi: isolate; }
    .eb-term { white-space: nowrap; display: inline-flex; align-items: baseline; }
    .eb-co { color: var(--accent); font-weight: 800; margin-inline-end: .06em; }
    .eb-f sub { font-size: .62em; vertical-align: -.3em; line-height: 0; }
    .eb-f sup { font-size: .62em; vertical-align: .62em; line-height: 0; }
    .eb-st { font-size: .62em; color: var(--muted); margin-inline-start: .08em; }
    .eb-plus { color: var(--muted); }
    .eb-arrow { position: relative; display: inline-block; padding-inline: .15em; font-weight: 400; }
    .eb-arrow small { position: absolute; bottom: 72%; left: 50%; transform: translateX(-50%); font-family: var(--font); font-size: .5em;
      font-weight: 700; color: var(--info); white-space: nowrap; line-height: 1.2; }
    .eb-big { font-size: clamp(1.5rem, 4.6vw, 2.6rem); font-weight: 600; padding: 4px 0; }
    .eb-eq-md { font-size: 1.3rem; }
    .eb-eq-sm { font-size: 1.15rem; }
    .eb-var { color: var(--c3); font-weight: 700; font-style: italic; margin-inline-end: .12em; font-family: var(--eqfont); }
    .eb-frac { white-space: nowrap; }
    .eb-result-card .row.spread { align-items: center; }
    .eb-result-card .badge { font-size: .9rem; padding: 4px 12px; }
    #yours .eb-eq { margin-block: 4px; }

    /* ---------- atom table ---------- */
    .eb-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 980px) { .eb-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
    /* "more than one answer" has no method card: let the atom table use the full width */
    @media (min-width: 980px) { .eb-grid:has(> #steps-card[hidden]) { grid-template-columns: minmax(0, 760px); } }
    .eb-atoms { min-width: 300px; }
    .eb-atoms th, .eb-atoms td { text-align: center; vertical-align: middle; }
    .eb-atoms thead th { font-size: .85rem; line-height: 1.3; }
    .eb-atoms tbody th.eb-elcell { position: static; background: transparent; text-align: start; font-family: var(--eqfont); font-size: 1.2rem; font-weight: 800; }
    .eb-sym { font-family: var(--eqfont); }
    .eb-qlab { font-family: var(--font); font-size: .95rem; }
    .eb-iso { unicode-bidi: isolate; white-space: nowrap; font-family: var(--eqfont); }
    .eb-atoms .eb-n { display: block; font-size: 1.35rem; font-family: var(--eqfont); line-height: 1.3; }
    .eb-parts { display: block; color: var(--muted); font-size: .76rem; font-family: var(--eqfont); line-height: 1.35; }
    @media (max-width: 520px) {
      .eb-atoms { min-width: 0; }
      .eb-atoms th, .eb-atoms td { padding: 6px 5px; }
      .eb-atoms thead th { font-size: .76rem; overflow-wrap: anywhere; }
      .eb-atoms thead th:first-child, .eb-atoms thead th.eb-okcol { white-space: nowrap; overflow-wrap: normal; }
      .eb-atoms .eb-n { font-size: 1.2rem; }
    }
    .eb-mark { font-size: 1.35rem; font-weight: 900; }
    .eb-mark.ok { color: var(--success); }
    .eb-mark.bad { color: var(--danger); }
    .eb-atoms tr.eb-no td, .eb-atoms tr.eb-no th { background: var(--danger-soft); }
    .eb-law { margin-top: 10px; }

    /* ---------- steps ---------- */
    .eb-step { border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 14px; }
    .eb-step:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .eb-step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .eb-step-h h3 { margin: 0; }
    .eb-step-n { background: var(--accent); color: #fff; border-radius: 999px; min-width: 1.9em; height: 1.9em; display: inline-grid; place-items: center;
      font-weight: 800; font-size: .85rem; flex: none; font-family: var(--eqfont); }
    .eb-step p { margin-bottom: 8px; }
    .eb-els { display: flex; flex-wrap: wrap; gap: 6px; }
    .eb-el { border: 2px solid var(--c1); border-radius: 8px; padding: 1px 10px; font-weight: 800; font-family: var(--eqfont); background: var(--surface); }
    .eb-el-q { border-color: var(--c5); font-family: inherit; }
    .eb-mgrid { display: grid; gap: 6px; margin-bottom: 8px; }
    .eb-mrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 6px 12px; background: var(--surface-2); border-radius: 8px; }
    .eb-mlab { font-weight: 800; min-width: 2.4em; }
    .eb-math { font-family: var(--eqfont); font-size: 1.15rem; direction: ltr; unicode-bidi: isolate; }
    .eb-then { color: var(--accent); font-weight: 800; padding-inline: .2em; }
    .eb-vals { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--eqfont); font-size: 1.15rem; margin-bottom: 8px; direction: ltr; }
    .eb-final b { color: var(--accent); font-size: 1.25rem; }
    .eb-f-inline { font-family: var(--eqfont); font-weight: 700; white-space: nowrap; unicode-bidi: isolate; }
    .eb-f-inline sub { font-size: .7em; }

    /* ---------- practice ---------- */
    .eb-prnav { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .eb-prnav .field { flex: 1 1 260px; }
    .eb-prnav select { width: 100%; font-family: var(--eqfont); font-size: 1rem; }
    .eb-prnav .row { flex: 0 0 auto; }
    .eb-progress-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .eb-progress-row .progress { flex: 1 1 160px; }
    .eb-desc { font-size: 1.08rem; }
    .eb-pr-eq { font-size: clamp(1.35rem, 4.4vw, 2.2rem); gap: .55em .45em; padding-top: .7em; align-items: center; }
    .eb-pr-eq .eb-term { align-items: center; }
    .eb-coef-in { width: 2.4em; min-height: 1.75em !important; font-size: .8em !important; text-align: center; padding: 2px 4px !important;
      margin-inline-end: .18em; font-weight: 800; color: var(--accent) !important; font-family: var(--eqfont) !important; line-height: 1.2 !important; }
    .eb-coef-in::placeholder { color: var(--muted); opacity: .5; font-weight: 400; }
    .eb-coef-in.eb-hinted { border-color: var(--warning); background: var(--warning-soft); }
    .eb-fb { min-height: 1.5em; font-weight: 700; margin: 0; font-size: 1.05rem; }
    .eb-fb.ok { color: var(--success); }
    .eb-fb.bad { color: var(--danger); }
    .eb-fb.info { color: var(--info); }
    .eb-types { display: flex; flex-wrap: wrap; gap: 8px; }
    .eb-type { min-height: 40px; }
    .chip.eb-type-ok { background: var(--success-soft); border-color: var(--success); color: var(--text); box-shadow: inset 0 0 0 1px var(--success); }
    .chip.eb-type-bad { background: var(--danger-soft); border-color: var(--danger); color: var(--text); }
    .eb-tybadges { gap: 6px; margin-bottom: 6px; }
    .eb-tybadges .badge { font-size: .85rem; padding: 3px 10px; }
    #pr-type-info { border-top: 1px dashed var(--border); padding-top: 10px; }
    details > summary { cursor: pointer; font-weight: 700; }
    details[open] > summary { margin-bottom: 10px; }
    details ul { margin: 0; padding-inline-start: 1.3em; }
    details li { margin-bottom: 6px; }

    /* ---------- projector ---------- */
    .edu-fullscreen-on .eb-big { font-size: clamp(2.2rem, 6vw, 4.2rem); }
    .edu-fullscreen-on .eb-pr-eq { font-size: clamp(2rem, 5vw, 3.3rem); }
    .edu-fullscreen-on .eb-panel { font-size: 1.12rem; }
    .edu-fullscreen-on .eb-math, .edu-fullscreen-on .eb-vals { font-size: 1.4rem; }

    /* ---------- worksheet / print ---------- */
    #print-area { display: none; }
    .eb-blank { display: inline-block; width: 1.9em; height: 1.1em; border-bottom: 1.5px solid currentColor; margin-inline-end: .2em; }
    .eb-line { display: inline-block; width: 5em; border-bottom: 1px solid currentColor; vertical-align: baseline; }
    .eb-line.long { width: 11em; }
    .eb-ws h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .eb-ws-meta { line-height: 2.2; }
    .eb-ws-list { padding-inline-start: 1.6em; }
    .eb-ws-list li { margin-bottom: 14px; break-inside: avoid; }
    .eb-eq-ws { font-size: 1.3rem; padding-top: .7em; }
    .eb-ws-type { font-size: .95rem; margin-top: 2px; }
    .eb-ws-key ol { padding-inline-start: 1.6em; }
    .eb-ws-key li { margin-bottom: 6px; }
    .eb-ws-key .eb-eq { display: inline-flex; font-size: 1.05rem; }

    @media print {
      .eb-tabbar, #in-card, #help { display: none !important; }
      body.eb-printing .edu-main > :not(#print-area) { display: none !important; }
      body.eb-printing #print-area { display: block !important; }
      .eb-ws-key { break-before: page; }
      .eb-grid { grid-template-columns: minmax(0, 1fr); }
      .eb-step, .eb-mrow, .eb-atoms tr { break-inside: avoid; }
      .eb-co, .eb-final b, .eb-var { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #pr-type-box { break-inside: avoid; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="eb-tabbar no-print">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" id="tab-balance" data-tab="balance" aria-controls="p-balance" data-i18n="tab_balance"></button>
        <button type="button" role="tab" id="tab-practice" data-tab="practice" aria-controls="p-practice" data-i18n="tab_practice"></button>
      </div>
      <button type="button" class="btn btn-sm" id="fs-btn" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">&#x26F6;</button>
    </div>

    <!-- ================= balancer ================= -->
    <section id="p-balance" class="eb-panel" role="tabpanel" aria-labelledby="tab-balance">
      <div class="card stack" id="in-card">
        <div>
          <label class="eb-label" for="eq-in" data-i18n="eq_label"></label>
          <div class="eb-inrow">
            <input id="eq-in" class="eb-in no-i18n" type="text" dir="ltr" placeholder="Fe + H2O -> Fe3O4 + H2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="300">
            <button type="button" class="btn btn-primary btn-lg" id="balance-btn" data-i18n="balance_btn"></button>
          </div>
        </div>
        <div class="row eb-keys no-i18n" id="keys" role="group" data-i18n-aria-label="keys_aria"></div>
        <p class="small muted mb0" data-i18n="eq_hint"></p>
        <p class="callout danger mb0" id="eq-msg" role="alert" hidden></p>
        <div>
          <span class="eb-label small" data-i18n="try_these"></span>
          <div class="eb-examples no-i18n" id="examples"></div>
        </div>
        <div class="row"><button type="button" class="btn btn-sm" id="clear-btn" data-i18n="clear"></button></div>
      </div>

      <section id="result" class="eb-panel" aria-live="polite" hidden>
        <div class="card stack eb-result-card">
          <div class="row spread">
            <h2 class="mb0" data-i18n="result_title"></h2>
            <span class="badge success" id="eb-status"></span>
          </div>
          <div class="eb-eq eb-big no-i18n" id="result-eq" dir="ltr"></div>
          <p class="callout warning mb0" id="many" hidden></p>
          <div class="callout" id="yours" hidden></div>
          <div class="row no-print">
            <button type="button" class="btn btn-sm" id="copy-btn" data-i18n="copy"></button>
            <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
          </div>
        </div>
        <div class="eb-grid">
          <div class="card">
            <h2 data-i18n="atoms_title"></h2>
            <div class="scroll-x" id="atoms-wrap"></div>
            <p class="small muted mb0 eb-law" data-i18n="law"></p>
          </div>
          <div class="card" id="steps-card">
            <h2 data-i18n="steps_title"></h2>
            <div id="steps"></div>
          </div>
        </div>
      </section>
    </section>

    <!-- ================= practice ================= -->
    <section id="p-practice" class="eb-panel" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="card stack no-print">
        <div class="eb-prnav">
          <label class="field"><span data-i18n="pr_pick"></span><select id="pr-select" class="no-i18n" dir="ltr"></select></label>
          <div class="row nowrap">
            <button type="button" class="btn" id="pr-prev" data-i18n="previous"></button>
            <button type="button" class="btn" id="pr-next" data-i18n="next"></button>
          </div>
        </div>
        <div class="eb-progress-row">
          <span class="small" id="pr-solved" aria-live="polite"></span>
          <div class="progress"><span id="pr-bar" style="width:0"></span></div>
        </div>
      </div>

      <div class="card stack" id="pr-card">
        <div class="row">
          <span class="badge primary" id="pr-num"></span>
          <span class="badge" id="pr-state" hidden></span>
        </div>
        <p class="eb-desc mb0" id="pr-desc"></p>
        <p class="small muted mb0 no-print" data-i18n="pr_enter"></p>
        <div class="eb-eq eb-pr-eq no-i18n" id="pr-eq" dir="ltr"></div>
        <p class="tiny muted mb0" data-i18n="states_note"></p>
        <div class="row no-print">
          <button type="button" class="btn btn-primary btn-lg" id="pr-check" data-i18n="check"></button>
          <button type="button" class="btn btn-lg" id="pr-hint" data-i18n="hint"></button>
          <button type="button" class="btn btn-lg" id="pr-show" data-i18n="show_answer"></button>
          <button type="button" class="btn btn-lg" id="pr-next2" data-i18n="next"></button>
        </div>
        <p class="eb-fb" id="pr-fb" aria-live="polite"></p>
        <div class="scroll-x" id="pr-tally" hidden></div>
        <div class="panel stack" id="pr-type-box">
          <p class="eb-label mb0" data-i18n="type_q"></p>
          <div class="eb-types no-print" id="pr-types"></div>
          <p class="eb-fb" id="pr-type-fb" aria-live="polite"></p>
          <div id="pr-type-info" hidden></div>
        </div>
      </div>

      <div class="row no-print">
        <button type="button" class="btn" id="ws-print" data-i18n="print_ws"></button>
        <button type="button" class="btn btn-danger" id="pr-reset" data-i18n="reset_progress"></button>
      </div>
    </section>

    <details class="card no-print" id="help">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>

    <section id="print-area"></section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="chem.js"></script>
  <script src="app.js"></script>
</body>
</html>
