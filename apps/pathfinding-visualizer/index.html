<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze Solver (Search) · AI Pathshala</title>
  <meta name="description" content="Draw walls and mud, then watch BFS, DFS, Dijkstra, Greedy and A* search a grid. Compare cells explored, path length and cost. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- layout: board + side panel ---------- */
    .pf { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .pf { grid-template-columns: minmax(0, 1fr) 320px; } }
    .pf-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .pf h2 { font-size: 1.12rem; margin-bottom: 4px; }
    .pf-stage { display: flex; flex-direction: column; gap: 12px; container-type: inline-size; }
    .pf-stage:fullscreen { background: var(--bg); padding: 16px 20px; overflow: auto; border-radius: 0; border: 0; }
    .pf-stage:-webkit-full-screen { background: var(--bg); padding: 16px 20px; overflow: auto; }
    /* the controls, stats and message: part of the board card's column normally... */
    .pf-panel { display: contents; }
    /* ...but beside the board in full screen on a wide smartboard / projector, so the board can be as big as possible */
    .pf-stage:fullscreen #draw-tip { display: none; }
    @media (min-width: 1000px) and (min-height: 940px) {
      .pf-stage:fullscreen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 27%); grid-template-rows: auto 1fr; gap: 12px 24px; align-items: start; }
      .pf-stage:fullscreen > .pf-top { grid-column: 1 / -1; }
      .pf-stage:fullscreen > .board-wrap { grid-column: 1; grid-row: 2; }
      .pf-stage:fullscreen > .pf-panel { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .pf-stage:fullscreen .pf-ctrl .chips, .pf-stage:fullscreen .pf-ctrl2 .push { margin-inline-start: 0; }
      .pf-stage:fullscreen .pf-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pf-stage:fullscreen .pf-stats .stat:last-child { grid-column: span 2; }
    }
    .lbl { font-size: .85rem; color: var(--muted); font-weight: 700; }
    .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

    /* algorithm + tool chips */
    .pf-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chips .chip { min-height: 40px; padding: 6px 14px; font-size: .95rem; }
    .chips .lbl { margin-inline-end: 2px; }
    .alg-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1px solid rgba(0,0,0,.15); }
    .chip[aria-pressed="true"] .alg-dot { border-color: var(--primary-ink); }

    /* the board */
    .board-wrap { display: flex; justify-content: center; min-width: 0; }
    #board { display: block; touch-action: none; border-radius: 8px; border: 1px solid var(--border); cursor: crosshair; background: var(--surface); max-width: 100%; }
    #board:focus { outline: none; }
    #board:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* controls */
    .pf-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pf-ctrl .chips { margin-inline-start: auto; }
    #run { min-width: 8.2rem; transition: none; }
    #run[data-mode="run"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pf-ctrl2 { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .pf-ctrl2 .seg button { min-height: 40px; padding: 6px 12px; }
    .pf-ctrl2 .push { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }

    /* stats */
    .pf-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: 10px; padding: 6px 10px; min-width: 0; }
    .stat .lbl { display: block; font-size: .78rem; line-height: 1.3; overflow-wrap: anywhere; }
    .stat .num { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* a narrow board card (side panel on a small laptop, or a phone): 3 + 2 stats, the time gets a double box */
    @container (max-width: 660px) {
      .pf-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pf-stats .stat:last-child { grid-column: span 2; }
    }
    .pf-msg { margin: 0; min-height: 3.2em; font-weight: 600; display: flex; align-items: center; }
    .pf-msg[data-kind="good"] { border-color: var(--success); background: var(--success-soft); }
    .pf-msg[data-kind="warn"] { border-color: var(--warning); background: var(--warning-soft); }
    .pf-msg[data-kind="bad"] { border-color: var(--danger); background: var(--danger-soft); }
    .pf-msg[data-kind="step"] { border-color: var(--accent); background: var(--accent-soft); }

    /* legend */
    .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .legend canvas { width: 20px; height: 20px; border-radius: 4px; display: block; flex: none; }
    .nums-note { margin: 0; }

    /* side panel */
    .ai-name { font-size: 1.15rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .ai-name .alg-dot { width: 14px; height: 14px; }
    .ai-p { margin: 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badges .badge { font-size: .8rem; padding: 3px 9px; white-space: normal; }
    .gen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .gen-grid .btn { flex-direction: column; gap: 2px; padding: 8px 10px; justify-content: center; text-align: center; overflow-wrap: anywhere; }
    .gen-grid .btn > span[aria-hidden] { font-size: 1.15rem; line-height: 1.2; }
    .seg.full { display: flex; }
    .seg.full button { flex: 1 1 0; min-height: 40px; }
    .sub-lbl { font-size: .86rem; color: var(--muted); font-weight: 700; margin: 0 0 5px; }
    .hint { color: var(--muted); font-size: .84rem; margin: 6px 0 0; font-weight: 400; }
    .side-foot { display: flex; flex-wrap: wrap; gap: 8px; }
    /* touch targets: at least 40 px tall */
    #fs-btn, #reset-all, .cmp-table .show-btn { min-height: 40px; }
    .pf label.check { min-height: 40px; }
    .help summary { padding-block: 8px; }

    /* compare */
    .page-sec { margin-top: 16px; }
    .cmp-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .cmp-table td, .cmp-table th { vertical-align: middle; }
    .cmp-table td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .aname { white-space: nowrap; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .glance .full { display: block; font-size: .82rem; color: var(--muted); font-weight: 400; margin-top: 2px; min-width: 8rem; }
    .cmp-table .bar { height: 7px; border-radius: 4px; margin-top: 4px; min-width: 3px; }
    .cmp-table tr.cur td { background: var(--primary-soft); }
    .cmp-table .best { font-weight: 800; }
    .yes { color: var(--success); font-weight: 800; }
    .no { color: var(--danger); font-weight: 800; }
    .ins { margin: 0; padding-inline-start: 1.2em; }
    .ins li { margin-bottom: 4px; }

    /* learn */
    .learn-p { max-width: 80ch; }
    .where-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .where-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
    .where-box h3 { font-size: 1rem; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
    .where-box p { margin: 0; font-size: .93rem; }
    .glance td { vertical-align: middle; }
    .help summary { cursor: pointer; font-weight: 700; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 6px; }

    @media (max-width: 560px) {
      .pf-stage.card, .pf-side .card { padding: 12px; }
      .pf-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stat .num { font-size: 1.2rem; }
      .pf-stats .stat:last-child { grid-column: span 2; }   /* the time ("0.0075 ms") needs more room */
      .pf-ctrl .btn-lg { flex: 1 1 auto; padding-inline: 12px; font-size: 1rem; }
      .pf-ctrl .chips { margin-inline-start: 0; }
      .chips .chip { padding: 6px 12px; }
      .pf-ctrl2 .push { margin-inline-start: 0; }
      .pf-ctrl2 .seg { display: flex; flex: 1 1 100%; }
      .pf-ctrl2 .seg button { flex: 1 1 auto; padding-inline: 8px; }
    }

    @media print {
      /* edu.css resets only some tokens for print; force the rest light so callouts/badges print clearly from dark mode */
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
        --primary: #0b4f5c; --primary-ink: #ffffff; --accent: #d9501c;
        --success: #15803d; --success-soft: #e6f6ec; --danger: #b42318; --danger-soft: #fdecea;
        --warning: #a15c07; --warning-soft: #fef4dc; --info: #0b69a3; --info-soft: #e0f2fe;
        --c1: #0b7285; --c2: #e8590c; --c3: #5f3dc4; --c4: #2b8a3e; --c5: #c2255c; --c6: #b08900; --c7: #1971c2; --c8: #868e96;
      }
      .pf { display: block; }
      .pf-side .card { margin-top: 12px; }
      #board { width: 100% !important; height: auto !important; max-width: 16cm; border-color: #999; }
      .page-sec { margin-top: 12px; }
      .cmp-table .show-col { display: none; }
      .where-box { border: 1px solid #bbb; break-inside: avoid; }
      .pf-msg { min-height: 0; }
    }
  </style>

<body>
  <main id="app">
    <div class="print-only"><h2 class="mb0" data-i18n="app_title"></h2></div>
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="pf" id="pf">
      <!-- ============ the board ============ -->
      <section class="card pf-stage" id="stage" aria-labelledby="alg-lbl">
        <div class="pf-top">
          <div class="chips" id="algs" role="group" aria-labelledby="alg-lbl">
            <span class="lbl" id="alg-lbl" data-i18n="alg_label"></span>
            <button type="button" class="chip" id="alg-bfs" data-alg="bfs"><span class="alg-dot" aria-hidden="true"></span><span data-i18n="alg_bfs"></span></button>
            <button type="button" class="chip" id="alg-dfs" data-alg="dfs"><span class="alg-dot" aria-hidden="true"></span><span data-i18n="alg_dfs"></span></button>
            <button type="button" class="chip" id="alg-dij" data-alg="dij"><span class="alg-dot" aria-hidden="true"></span><span data-i18n="alg_dij"></span></button>
            <button type="button" class="chip" id="alg-greedy" data-alg="greedy"><span class="alg-dot" aria-hidden="true"></span><span data-i18n="alg_greedy"></span></button>
            <button type="button" class="chip" id="alg-astar" data-alg="astar"><span class="alg-dot" aria-hidden="true"></span><span data-i18n="alg_astar"></span></button>
          </div>
        </div>

        <div class="board-wrap" id="board-wrap">
          <canvas id="board" tabindex="0" role="application" aria-describedby="draw-tip"></canvas>
        </div>
        <p class="vh" id="kb-live" aria-live="polite"></p>

        <div class="pf-panel" id="pf-panel">
        <div class="pf-ctrl no-print">
          <button type="button" class="btn btn-primary btn-lg" id="run" data-mode="idle"><span aria-hidden="true" id="run-ico">▶</span> <span id="run-txt"></span></button>
          <button type="button" class="btn btn-lg" id="step"><span aria-hidden="true">⏭</span> <span data-i18n="step"></span></button>
          <button type="button" class="btn btn-lg" id="clear-path"><span aria-hidden="true">🧹</span> <span data-i18n="clear_path"></span></button>
          <div class="chips" id="tools" role="group" aria-labelledby="tool-lbl">
            <span class="lbl" id="tool-lbl" data-i18n="tool_label"></span>
            <button type="button" class="chip" id="tool-wall" data-tool="wall"><span aria-hidden="true">🧱</span> <span data-i18n="tool_wall"></span></button>
            <button type="button" class="chip" id="tool-mud" data-tool="mud"><span aria-hidden="true">🟫</span> <span data-i18n="tool_mud"></span></button>
            <button type="button" class="chip" id="tool-erase" data-tool="erase"><span aria-hidden="true">🧽</span> <span data-i18n="tool_erase"></span></button>
          </div>
        </div>
        <p class="hint mt0 no-print" id="draw-tip" data-i18n="draw_tip"></p>

        <div class="pf-ctrl2 no-print">
          <span class="lbl" id="speed-lbl" data-i18n="speed"></span>
          <div class="seg" id="speed" role="group" aria-labelledby="speed-lbl">
            <button type="button" data-speed="slow" data-i18n="speed_slow"></button>
            <button type="button" data-speed="normal" data-i18n="speed_normal"></button>
            <button type="button" data-speed="fast" data-i18n="speed_fast"></button>
            <button type="button" data-speed="instant" data-i18n="speed_instant"></button>
          </div>
          <label class="check"><input type="checkbox" id="nums"> <span data-i18n="show_nums"></span></label>
          <div class="push">
            <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          </div>
        </div>

        <div class="pf-stats">
          <div class="stat"><span class="lbl" data-i18n="st_explored"></span><span class="num" id="st-explored" data-value="0">0</span></div>
          <div class="stat"><span class="lbl" data-i18n="st_waiting"></span><span class="num" id="st-waiting" data-value="0">0</span></div>
          <div class="stat"><span class="lbl" data-i18n="st_steps"></span><span class="num" id="st-steps" data-value="">–</span></div>
          <div class="stat"><span class="lbl" data-i18n="st_cost"></span><span class="num" id="st-cost" data-value="">–</span></div>
          <div class="stat"><span class="lbl" data-i18n="st_time"></span><span class="num" id="st-time" data-value="">–</span></div>
        </div>
        <p class="callout pf-msg" id="msg" aria-live="polite"></p>
        <ul class="legend" id="legend">
          <li><canvas width="40" height="40" data-sw="start" aria-hidden="true"></canvas><span data-i18n="lg_start"></span></li>
          <li><canvas width="40" height="40" data-sw="goal" aria-hidden="true"></canvas><span data-i18n="lg_goal"></span></li>
          <li><canvas width="40" height="40" data-sw="wall" aria-hidden="true"></canvas><span data-i18n="lg_wall"></span></li>
          <li><canvas width="40" height="40" data-sw="mud" aria-hidden="true"></canvas><span data-i18n="lg_mud"></span></li>
          <li><canvas width="40" height="40" data-sw="frontier" aria-hidden="true"></canvas><span data-i18n="lg_frontier"></span></li>
          <li><canvas width="40" height="40" data-sw="visited" aria-hidden="true"></canvas><span data-i18n="lg_visited"></span></li>
          <li><canvas width="40" height="40" data-sw="current" aria-hidden="true"></canvas><span data-i18n="lg_current"></span></li>
          <li><canvas width="40" height="40" data-sw="path" aria-hidden="true"></canvas><span data-i18n="lg_path"></span></li>
        </ul>
        <p class="small muted nums-note" id="nums-note" hidden></p>
        </div>
      </section>

      <!-- ============ side panel ============ -->
      <aside class="pf-side">
        <section class="card stack" id="info-card" aria-labelledby="ai-name">
          <h2 class="ai-name" id="ai-name"><span class="alg-dot" id="ai-dot" aria-hidden="true"></span><span id="ai-name-txt"></span></h2>
          <p class="ai-p" id="ai-idea"></p>
          <p class="ai-p small"><b data-i18n="how_label"></b> <span id="ai-pick"></span></p>
          <div class="badges" id="ai-badges"></div>
          <p class="ai-p small"><b data-i18n="used_label"></b> <span id="ai-used"></span></p>
        </section>

        <section class="card stack no-print" aria-labelledby="grid-h">
          <h2 id="grid-h" data-i18n="grid_h"></h2>
          <div class="gen-grid">
            <button type="button" class="btn" id="gen-maze"><span aria-hidden="true">🌀</span> <span data-i18n="gen_maze"></span></button>
            <button type="button" class="btn" id="gen-walls"><span aria-hidden="true">🎲</span> <span data-i18n="gen_walls"></span></button>
            <button type="button" class="btn" id="gen-mud"><span aria-hidden="true">🟤</span> <span data-i18n="gen_mud"></span></button>
            <button type="button" class="btn btn-danger" id="clear-all"><span aria-hidden="true">🧽</span> <span data-i18n="clear_all"></span></button>
          </div>
          <label class="check"><input type="checkbox" id="loops"> <span data-i18n="loops"></span></label>
          <div>
            <p class="sub-lbl" id="size-lbl" data-i18n="size_label"></p>
            <div class="seg full" id="size" role="group" aria-labelledby="size-lbl">
              <button type="button" data-size="s" data-i18n="size_s"></button>
              <button type="button" data-size="m" data-i18n="size_m"></button>
              <button type="button" data-size="l" data-i18n="size_l"></button>
            </div>
            <p class="hint" id="size-info"></p>
          </div>
          <div class="side-foot">
            <button type="button" class="btn btn-sm btn-danger" id="reset-all"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
          </div>
        </section>
      </aside>
    </div>

    <!-- ============ compare ============ -->
    <section class="card stack page-sec" id="cmp-card" aria-labelledby="cmp-h">
      <div class="cmp-head">
        <h2 id="cmp-h" class="mb0" data-i18n="cmp_h"></h2>
        <div class="row no-print">
          <button type="button" class="btn btn-accent" id="cmp-btn"><span aria-hidden="true">📊</span> <span data-i18n="cmp_btn"></span></button>
          <button type="button" class="btn" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
        </div>
      </div>
      <p class="mb0" data-i18n="cmp_intro"></p>
      <p class="muted small mb0" id="cmp-empty" data-i18n="cmp_empty"></p>
      <div class="scroll-x" id="cmp-wrap" hidden>
        <table class="table cmp-table" id="cmp-table">
          <thead><tr>
            <th data-i18n="col_alg"></th>
            <th data-i18n="col_explored"></th>
            <th data-i18n="col_steps"></th>
            <th data-i18n="col_cost"></th>
            <th data-i18n="col_best"></th>
            <th data-i18n="col_mem"></th>
            <th data-i18n="col_time"></th>
            <th class="show-col"><span class="vh" data-i18n="cmp_show"></span></th>
          </tr></thead>
          <tbody id="cmp-body"></tbody>
        </table>
      </div>
      <div class="callout success" id="cmp-ins-box" hidden>
        <ul class="ins" id="cmp-ins" aria-live="polite"></ul>
      </div>
      <p class="tiny muted mb0" id="cmp-notes" hidden><span data-i18n="cmp_auto"></span> <span data-i18n="mem_note"></span> <span data-i18n="time_note"></span></p>
    </section>

    <!-- ============ learn ============ -->
    <section class="card stack page-sec" aria-labelledby="learn-h">
      <h2 id="learn-h" data-i18n="learn_h"></h2>
      <p class="learn-p" data-i18n="learn_p"></p>
      <h3 data-i18n="glance_h"></h3>
      <div class="scroll-x">
        <table class="table glance">
          <thead><tr>
            <th data-i18n="col_alg"></th>
            <th data-i18n="col_picks"></th>
            <th data-i18n="g_plain"></th>
            <th data-i18n="g_mud"></th>
