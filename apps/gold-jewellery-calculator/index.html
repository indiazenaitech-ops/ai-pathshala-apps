<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Jewellery Price Calculator · AI Pathshala</title>
  <meta name="description" content="Free gold and silver jewellery price calculator for India: today's rate, purity (22K, 18K, 925), weight, making charge, wastage, GST 3 % and hallmarking, with a fair-price check, old-gold exchange and resale value. Offline, private, 12 languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* numbers and amounts always read left to right, also in Urdu */
    .gj-n, input.gj-n, .gj-ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
    [dir="rtl"] input.gj-n { text-align: right; }
    .gj-privacy { display: flex; gap: 8px; align-items: flex-start; margin: -6px 0 14px; padding: 8px 12px; border-radius: var(--radius-sm);
      background: var(--success-soft); color: var(--text); font-size: .92rem; font-weight: 600; max-width: 75ch; }
    .gj-two { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .gj-two { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
    .gj-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; align-items: start; }
    @media (min-width: 760px) { .gj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1100px) { .gj-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .card h2 { font-size: 1.2rem; margin: 0 0 4px; }
    .card h2 .ic { margin-inline-end: 6px; }
    .gj-lbl { font-weight: 600; font-size: .92rem; }
    .gj-seg { display: flex; width: 100%; }
    .gj-seg button { flex: 1 1 0; min-height: 44px; line-height: 1.25; padding: 8px 8px; overflow-wrap: anywhere; }
    .gj-inrow { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
    .gj-inrow input { flex: 1 1 auto; min-width: 0; width: 100%; }
    .gj-inrow select { flex: 0 1 auto; max-width: 46%; min-height: 44px; }
    .gj-unit { display: grid; place-items: center; padding-inline: 10px; font-weight: 700; color: var(--muted); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 10px; min-width: 40px; }
    .gj-in { min-height: 44px; }
    #rate { font-size: 1.4rem; font-weight: 700; min-height: 54px; }
    .gj-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .gj-chips .chip { min-height: 42px; min-width: 56px; justify-content: center; font-size: .98rem; }
    .gj-chips .chip small { font-weight: 500; opacity: .85; }
    .gj-custom { display: inline-flex; align-items: center; gap: 4px; }
    .gj-custom input { width: 92px; min-height: 42px; }
    .gj-pair { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gj-pair .field input { width: 100%; }
    .gj-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .gj-opt input[type="text"] { width: 90px; min-height: 42px; }
    .gj-opt .check { min-height: 40px; }
    .gj-err { color: var(--danger); font-weight: 600; margin: 0; font-size: .92rem; }
    .gj-err:empty { display: none; }
    .hint { color: var(--muted); font-size: .84rem; }
    .gj-datehint { margin: 0; font-size: .84rem; }
    .gj-datehint.sample { color: var(--warning); font-weight: 600; }

    /* estimate */
    .gj-result { background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .gj-big { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.15; margin: 4px 0 10px; overflow-wrap: anywhere; color: var(--primary); }
    .gj-break { font-size: 1rem; width: 100%; }
    .gj-break th { background: transparent; font-weight: 500; position: static; text-align: start; }
    .gj-break td.v { text-align: end; white-space: nowrap; font-weight: 600; }
    .gj-break tr.sum th, .gj-break tr.sum td { font-weight: 800; font-size: 1.08rem; border-bottom: 0; }
    .gj-break tr.sub th, .gj-break tr.sub td { border-top: 2px solid var(--border); }
    .gj-break tr:hover td { background: transparent; }
    @media (max-width: 560px) { .gj-break td.v { white-space: normal; } .gj-break th, .gj-break td { padding: 7px 6px; } }
    .gj-words { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px dashed var(--border); }
    .gj-words .lbl { display: block; color: var(--muted); font-size: .82rem; font-weight: 600; }
    .gj-words p { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    .gj-words p[lang="hi"] { font-family: "Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif; }
    .gj-actions { margin-top: 12px; }
    .gj-actions .btn { min-height: 42px; }
    .gj-note { margin: 12px 0 0; font-size: .86rem; }
    .gj-kv { display: grid; gap: 8px; margin: 10px 0 0; }
    .gj-kv > div { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .gj-kv dt { color: var(--muted); font-weight: 600; flex: 1 1 auto; min-width: 0; }
    .gj-kv dd { margin: 0; font-weight: 700; text-align: end; flex: 0 0 auto; white-space: nowrap; max-width: 60%; }
    .gj-kv dd bdi { white-space: nowrap; }
    .gj-kv .big dd { font-size: 1.4rem; color: var(--primary); }
    .gj-msg { margin: 10px 0 0; }
    .gj-msg:empty { display: none; }
    .gj-pure { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .gj-pure li { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: .88rem; }
    .gj-pure b { color: var(--primary); }

    /* recent */
    .gj-hist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .gj-hist-item { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface); min-height: 44px; }
    .gj-hist-item:hover { background: var(--surface-2); }
    .gj-hist-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .gj-hist-main { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px; font-weight: 700; font-size: 1.05rem; }
    .gj-hist-main .out { color: var(--primary); }
    .gj-hist-sub { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }

    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 40px; display: flex; align-items: center; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 22px; }
    details.card li + li { margin-top: 6px; }
    .gj-ex { margin: 12px 0 0; }
    .gj-ex dt { font-weight: 700; margin-top: 10px; }
    .gj-ex dd { margin: 2px 0 0; }

    /* print: only the generated #print-area */
    #print-area { display: none; }
    @media print {
      #app > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; font-size: 12pt; color: #000; }
      #print-area h1 { font-size: 18pt; margin: 0 0 8pt; }
      #print-area table { width: 100%; border-collapse: collapse; margin: 8pt 0; }
      #print-area th, #print-area td { border: 1px solid #999; padding: 4pt 6pt; text-align: start; vertical-align: top; }
      #print-area td.v { text-align: end; white-space: nowrap; }
      #print-area .pa-grand td { font-weight: 800; font-size: 13pt; }
      #print-area .pa-small { font-size: 9pt; color: #444; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="gj-privacy no-print"><span aria-hidden="true">🔒</span><span data-i18n="privacy"></span></p>

    <div class="gj-two">
      <!-- inputs -->
      <section class="card stack" aria-labelledby="inputs-h">
        <h2 id="inputs-h" data-i18n="inputs_title"></h2>
        <div class="field">
          <span class="gj-lbl" id="metal-lbl" data-i18n="metal_label"></span>
          <div class="seg gj-seg" id="metal" role="group" aria-labelledby="metal-lbl">
            <button type="button" data-metal="gold">🪙 <span data-i18n="metal_gold"></span></button>
            <button type="button" data-metal="silver">⚪ <span data-i18n="metal_silver"></span></button>
          </div>
        </div>
        <div class="field">
          <label for="rate" data-i18n="rate_label"></label>
          <div class="gj-inrow">
            <span class="gj-unit" aria-hidden="true">₹</span>
            <input id="rate" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="72,000" aria-describedby="rate-err rate-hint">
            <select id="rate-unit" data-i18n-aria-label="rate_unit_aria"></select>
          </div>
          <p class="gj-err" id="rate-err" role="alert"></p>
          <p class="gj-datehint" id="rate-datehint"></p>
          <span class="hint" id="rate-hint" data-i18n="rate_hint"></span>
        </div>
        <div class="field">
          <span class="gj-lbl" id="purity-lbl" data-i18n="purity_label"></span>
          <div class="gj-chips" id="purity" role="group" aria-labelledby="purity-lbl"></div>
        </div>
        <div class="gj-pair">
          <div class="field">
            <label for="weight" data-i18n="weight_label"></label>
            <div class="gj-inrow"><input id="weight" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="10"><span class="gj-unit gj-ltr" aria-hidden="true">g</span></div>
          </div>
          <div class="field">
            <label for="tola" data-i18n="tola_label"></label>
            <div class="gj-inrow"><input id="tola" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="0.857"><span class="gj-unit" aria-hidden="true" data-i18n="tola_unit"></span></div>
            <span class="hint"><span data-i18n="tola_hint"></span></span>
          </div>
        </div>
        <div class="field">
          <span class="gj-lbl" id="mk-lbl" data-i18n="mk_label"></span>
          <div class="seg gj-seg" id="mk-mode" role="group" aria-labelledby="mk-lbl">
            <button type="button" data-mode="pct" data-i18n="mk_pct"></button>
            <button type="button" data-mode="gram" data-i18n="mk_gram"></button>
            <button type="button" data-mode="flat" data-i18n="mk_flat"></button>
          </div>
          <div class="gj-inrow"><input id="mk" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="12" data-i18n-aria-label="mk_label"><span class="gj-unit gj-ltr" id="mk-unit" aria-hidden="true">%</span></div>
        </div>
        <div class="gj-pair">
          <div class="field">
            <label for="wastage" data-i18n="wastage_label"></label>
            <div class="gj-inrow"><input id="wastage" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span class="gj-unit gj-ltr" aria-hidden="true">%</span></div>
            <span class="hint" data-i18n="wastage_hint"></span>
          </div>
          <div class="field">
            <label for="stones" data-i18n="stones_label"></label>
            <div class="gj-inrow"><span class="gj-unit" aria-hidden="true">₹</span><input id="stones" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
          </div>
        </div>
        <div class="field">
          <label for="gst" data-i18n="gst_label"></label>
          <div class="gj-inrow"><input id="gst" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="3" style="max-width:140px"><span class="gj-unit gj-ltr" aria-hidden="true">%</span></div>
          <div class="gj-opt">
            <label class="check"><input type="checkbox" id="mk-sep"><span data-i18n="mk_sep"></span></label>
            <input id="mk-gst" class="gj-n" type="text" inputmode="decimal" autocomplete="off" placeholder="5" data-i18n-aria-label="mk_gst_aria"><span class="gj-ltr" aria-hidden="true">%</span>
          </div>
        </div>
        <div class="field">
          <div class="gj-opt">
            <label class="check"><input type="checkbox" id="hallmark-on"><span data-i18n="hallmark_label"></span></label>
            <span aria-hidden="true">₹</span><input id="hallmark" class="gj-n" type="text" inputmode="decimal" autocomplete="off" placeholder="53" data-i18n-aria-label="hallmark_label">
          </div>
          <span class="hint" data-i18n="hallmark_hint"></span>
        </div>
        <div class="row">
          <button type="button" class="btn btn-danger" id="reset" data-i18n="reset"></button>
        </div>
      </section>

      <!-- estimate -->
      <section class="card gj-result" aria-labelledby="est-h">
        <h2 id="est-h" data-i18n="est_title"></h2>
        <div id="result" aria-live="polite"></div>
        <div class="row gj-actions no-print">
          <button type="button" class="btn btn-primary" id="save-est">💾 <span data-i18n="save_est"></span></button>
          <button type="button" class="btn" id="copy">📋 <span data-i18n="copy"></span></button>
          <button type="button" class="btn" id="print">🖨 <span data-i18n="print"></span></button>
          <a class="btn btn-wa" id="wa" href="#" target="_blank" rel="noopener noreferrer">💬 <span data-i18n="whatsapp"></span></a>
        </div>
        <p class="gj-note muted" data-i18n="estimate_note"></p>
      </section>
    </div>

    <div class="gj-grid">
      <!-- fair-price check -->
      <section class="card" aria-labelledby="fp-h">
        <h2 id="fp-h"><span class="ic" aria-hidden="true">🔍</span><span data-i18n="fp_title"></span></h2>
        <p class="muted small" data-i18n="fp_intro"></p>
        <div class="field">
          <label for="quote" data-i18n="fp_quote"></label>
          <div class="gj-inrow"><span class="gj-unit" aria-hidden="true">₹</span><input id="quote" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="80,000"></div>
        </div>
        <div id="fp-out" aria-live="polite"></div>
      </section>

      <!-- old gold exchange -->
      <section class="card" aria-labelledby="og-h">
        <h2 id="og-h"><span class="ic" aria-hidden="true">♻️</span><span data-i18n="og_title"></span></h2>
        <p class="muted small" data-i18n="og_intro"></p>
        <div class="gj-pair">
          <div class="field">
            <label for="og-weight" data-i18n="og_weight"></label>
            <div class="gj-inrow"><input id="og-weight" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="8"><span class="gj-unit gj-ltr" aria-hidden="true">g</span></div>
          </div>
          <div class="field">
            <label for="og-ded" data-i18n="og_ded"></label>
            <div class="gj-inrow"><input id="og-ded" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="5"><span class="gj-unit gj-ltr" aria-hidden="true">%</span></div>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <span class="gj-lbl" id="og-purity-lbl" data-i18n="og_purity"></span>
          <div class="gj-chips" id="og-purity" role="group" aria-labelledby="og-purity-lbl"></div>
        </div>
        <span class="hint" data-i18n="og_ded_hint"></span>
        <div id="og-out" aria-live="polite"></div>
      </section>

      <!-- resale + purity helper -->
      <section class="card" aria-labelledby="rs-h">
        <h2 id="rs-h"><span class="ic" aria-hidden="true">🏷️</span><span data-i18n="rs_title"></span></h2>
        <p class="muted small" data-i18n="rs_intro"></p>
        <div class="field">
          <label for="rs-ded" data-i18n="rs_ded"></label>
          <div class="gj-inrow"><input id="rs-ded" class="gj-n gj-in" type="text" inputmode="decimal" autocomplete="off" placeholder="3" style="max-width:140px"><span class="gj-unit gj-ltr" aria-hidden="true">%</span></div>
        </div>
        <div id="rs-out" aria-live="polite"></div>
        <h2 style="margin-top:18px"><span class="ic" aria-hidden="true">⚖️</span><span data-i18n="ph_title"></span></h2>
        <div id="ph-out" aria-live="polite"></div>
      </section>
    </div>

    <section class="card no-print" style="margin-top:16px" aria-labelledby="recent-h">
      <div class="row spread">
        <h2 id="recent-h" class="mb0" data-i18n="recent_title"></h2>
        <button type="button" class="btn btn-sm btn-danger" id="recent-clear" data-i18n="clear"></button>
      </div>
      <ol class="gj-hist" id="recent-list"></ol>
      <p class="muted mb0" id="recent-empty" data-i18n="recent_empty" style="margin-top:8px"></p>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="ex_title"></summary>
      <dl class="gj-ex">
        <dt data-i18n="ex_huid_t"></dt><dd data-i18n="ex_huid"></dd>
        <dt data-i18n="ex_stamp_t"></dt><dd data-i18n="ex_stamp"></dd>
        <dt data-i18n="ex_22k_t"></dt><dd data-i18n="ex_22k"></dd>
        <dt data-i18n="ex_making_t"></dt><dd data-i18n="ex_making"></dd>
        <dt data-i18n="ex_buyback_t"></dt><dd data-i18n="ex_buyback"></dd>
      </dl>
    </details>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
      </ul>
    </details>
    <p class="muted small no-print" id="rules-checked" style="margin-top:12px"></p>

    <div id="print-area" aria-hidden="true"></div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
