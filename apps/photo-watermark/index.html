<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Watermark · AI Pathshala</title>
  <meta name="description" content="Add a text or logo watermark to one or many photos at once. Choose position, size, opacity and colour, preview, then download JPGs at original size. Free and private: photos never leave your device, and GPS details are removed.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .pw-priv { margin-bottom: 16px; }
    .pw-priv strong { display: block; }
    .pw-priv p { margin: 2px 0 0; font-size: .9rem; }
    .pw-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; }
    .pw-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    @media (max-width: 900px) { .pw-layout { grid-template-columns: minmax(0, 1fr); } }
    .pw-h { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; margin: 0; }
    .pw-h .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink, #fff); font-size: .9rem; font-weight: 800; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .pw-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #photosCard.over { outline: 3px dashed var(--accent); outline-offset: -3px; }
    .pw-seg { display: flex; width: 100%; }
    .pw-seg button { flex: 1 1 0; min-width: 0; min-height: 44px; padding-inline: 6px; }
    #wmText { width: 100%; min-height: 44px; }
    .pw-logorow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #logoPrev { width: 56px; height: 56px; border: 1px solid var(--border); border-radius: 8px; background: repeating-conic-gradient(#d9d9d9 0 25%, #f6f6f6 0 50%) 0 0 / 14px 14px; }
    .pw-posrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .pw-pos { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; direction: ltr; }
    .pw-pos button { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; padding: 0; display: grid; place-items: center; }
    .pw-pos button::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .pw-pos button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); }
    .pw-pos button[aria-pressed="true"]::before { background: var(--primary-ink, #fff); }
    #posTile { min-height: 44px; flex: 1 1 150px; }
    #posTile[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink, #fff); border-color: var(--primary); }
    .pw-rangerow { display: flex; align-items: center; gap: 10px; }
    .pw-rangerow input[type="range"] { flex: 1 1 auto; min-width: 0; min-height: 40px; }
    .pw-rangerow output { min-width: 3.2em; text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .pw-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pw-chips .chip { min-height: 40px; }
    .pw-chips .chip i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(128,128,128,.7); flex: none; }
    .pw-chips label.chip { cursor: pointer; }
    .pw-chips input[type="color"] { width: 30px; height: 26px; padding: 0; border: 0; background: none; }
    .pw-stage { display: grid; place-items: center; min-height: 160px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm, 9px); padding: 8px; }
    #prev { display: block; max-width: 100%; max-height: 62vh; height: auto; border-radius: 4px; }
    .pw-nav { display: flex; align-items: center; gap: 8px; direction: ltr; }
    .pw-nav .btn { min-width: 46px; min-height: 44px; font-size: 1.2rem; padding-inline: 10px; }
    .pw-nav .mid { flex: 1 1 auto; min-width: 0; text-align: center; }
    .pw-nav .mid b { display: block; font-family: system-ui, "Segoe UI", Roboto, sans-serif; direction: ltr; }
    .pw-nav .mid span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
    .pw-big { width: 100%; }
    .pw-results { list-style: none; margin: 0; padding: 0; }
    .pw-results li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
    .pw-results li:first-child { border-top: 0; }
    #doneLine { font-weight: 600; }
    .pw-results .nm { flex: 1 1 auto; min-width: 0; }
    .pw-results .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; font-weight: 600; }
    .pw-results .btn { flex: none; min-height: 42px; }
    .pw-results .bad { color: var(--danger); }
    .pw-help ul { margin: 10px 0 0; padding-inline-start: 20px; }
    .pw-help li + li { margin-top: 8px; }
    .pw-help summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  </style>
</head>
<body>
  <main id="app" data-busy="1" data-count="0" data-sample="1" data-done="0">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="callout success pw-priv">
      <strong data-i18n="priv_title"></strong>
      <p data-i18n="priv_text"></p>
    </div>

    <div class="pw-layout">
      <div class="pw-col">
        <section class="card stack" id="photosCard" aria-labelledby="hPhotos">
          <h2 class="pw-h"><span class="num" aria-hidden="true">1</span> <span id="hPhotos" data-i18n="h_photos"></span></h2>
          <div class="row">
            <button type="button" class="btn btn-primary" id="pick"><span aria-hidden="true">🖼️</span> <span data-i18n="pick_photos"></span></button>
            <button type="button" class="btn" id="clearPhotos" data-i18n="clear_photos" hidden></button>
            <input type="file" id="fileIn" class="pw-file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
          </div>
          <p class="small mb0" id="countLine" aria-live="polite"></p>
          <p class="small mb0" id="pickMsg" aria-live="polite" style="color:var(--danger)" hidden></p>
          <p class="tiny muted mb0" data-i18n="drop_hint"></p>
        </section>

        <section class="card stack" id="markCard" aria-labelledby="hMark">
          <h2 class="pw-h"><span class="num" aria-hidden="true">2</span> <span id="hMark" data-i18n="h_mark"></span></h2>
          <div class="seg pw-seg" id="typeSeg" role="group" aria-labelledby="hMark">
            <button type="button" id="type-text" data-type="text" data-i18n="type_text"></button>
            <button type="button" id="type-logo" data-type="logo" data-i18n="type_logo"></button>
          </div>
          <label class="field" for="wmText" id="textField"><span data-i18n="text_label"></span>
            <input type="text" id="wmText" class="no-i18n" maxlength="80" autocomplete="off" dir="auto">
          </label>
          <div id="logoField" class="stack" hidden>
            <div class="pw-logorow">
              <canvas id="logoPrev" width="56" height="56" aria-hidden="true"></canvas>
              <button type="button" class="btn" id="pickLogo" data-i18n="logo_pick"></button>
              <input type="file" id="logoIn" class="pw-file" accept="image/*" tabindex="-1" aria-hidden="true">
            </div>
            <p class="small mb0" id="logoMsg" aria-live="polite"></p>
            <p class="tiny muted mb0" data-i18n="logo_hint"></p>
          </div>

          <div class="field">
            <span data-i18n="pos_label"></span>
            <div class="pw-posrow">
              <div class="pw-pos" id="posGrid" role="group" data-i18n-aria-label="pos_label" aria-label="Position">
                <button type="button" data-pos="tl" data-i18n-aria-label="pos_tl" aria-label="tl"></button>
                <button type="button" data-pos="tc" data-i18n-aria-label="pos_tc" aria-label="tc"></button>
                <button type="button" data-pos="tr" data-i18n-aria-label="pos_tr" aria-label="tr"></button>
                <button type="button" data-pos="ml" data-i18n-aria-label="pos_ml" aria-label="ml"></button>
                <button type="button" data-pos="mc" data-i18n-aria-label="pos_mc" aria-label="mc"></button>
                <button type="button" data-pos="mr" data-i18n-aria-label="pos_mr" aria-label="mr"></button>
                <button type="button" data-pos="bl" data-i18n-aria-label="pos_bl" aria-label="bl"></button>
                <button type="button" data-pos="bc" data-i18n-aria-label="pos_bc" aria-label="bc"></button>
                <button type="button" data-pos="br" data-i18n-aria-label="pos_br" aria-label="br"></button>
              </div>
              <button type="button" class="btn" id="posTile" data-pos="tile"><span aria-hidden="true">▦</span> <span data-i18n="pos_tile"></span></button>
            </div>
          </div>

          <label class="field" for="size"><span data-i18n="size_label"></span>
            <span class="pw-rangerow"><input type="range" id="size" min="5" max="90" step="1" value="30"><output id="sizeOut" for="size" class="no-i18n"></output></span>
          </label>
          <label class="field" for="opacity"><span data-i18n="op_label"></span>
            <span class="pw-rangerow"><input type="range" id="opacity" min="5" max="100" step="1" value="60"><output id="opacityOut" for="opacity" class="no-i18n"></output></span>
          </label>
          <div class="field" id="colorField">
            <span data-i18n="color_label"></span>
            <div class="pw-chips" id="colorChips" role="group" data-i18n-aria-label="color_label" aria-label="Colour">
              <button type="button" class="chip" data-color="#ffffff"><i style="background:#ffffff"></i><span data-i18n="col_white"></span></button>
              <button type="button" class="chip" data-color="#000000"><i style="background:#000000"></i><span data-i18n="col_black"></span></button>
              <button type="button" class="chip" data-color="#ffd400"><i style="background:#ffd400"></i><span data-i18n="col_yellow"></span></button>
              <button type="button" class="chip" data-color="#e11d2e"><i style="background:#e11d2e"></i><span data-i18n="col_red"></span></button>
              <label class="chip" for="colorPick" id="colorOther"><input type="color" id="colorPick" value="#1d4ed8"><span data-i18n="col_other"></span></label>
            </div>
          </div>
          <label class="field" for="margin"><span data-i18n="margin_label"></span>
            <span class="pw-rangerow"><input type="range" id="margin" min="0" max="15" step="1" value="3"><output id="marginOut" for="margin" class="no-i18n"></output></span>
          </label>
        </section>
      </div>

      <div class="pw-col">
        <section class="card stack" id="prevCard" aria-labelledby="hPrev">
          <h2 class="pw-h"><span class="num" aria-hidden="true">3</span> <span id="hPrev" data-i18n="h_preview"></span></h2>
          <div class="pw-stage"><canvas id="prev" width="16" height="10" role="img" data-i18n-aria-label="h_preview" aria-label="Preview"></canvas></div>
          <p class="small mb0" id="prevMsg" aria-live="polite" style="color:var(--danger)" hidden></p>
          <div class="pw-nav">
            <button type="button" class="btn" id="prevBtn" data-i18n-aria-label="previous" aria-label="Previous">‹</button>
            <div class="mid no-i18n"><b id="navCount"></b><span class="tiny muted" id="navName"></span></div>
            <button type="button" class="btn" id="nextBtn" data-i18n-aria-label="next" aria-label="Next">›</button>
          </div>
        </section>

        <section class="card stack" id="saveCard" aria-labelledby="hSave">
          <h2 class="pw-h"><span class="num" aria-hidden="true">4</span> <span id="hSave" data-i18n="h_save"></span></h2>
          <button type="button" class="btn btn-primary btn-lg pw-big" id="process"></button>
          <div id="progBox" hidden>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progBar"><span id="progFill" style="width:0%"></span></div>
            <div class="row spread" style="margin-top:8px">
              <span class="small" id="progLine" aria-live="polite"></span>
              <button type="button" class="btn btn-sm" id="stopBtn" data-i18n="stop"></button>
            </div>
          </div>
          <p class="small mb0" id="doneLine" aria-live="polite"></p>
          <button type="button" class="btn pw-big" id="dlAll" hidden><span aria-hidden="true">⬇</span> <span data-i18n="dl_all"></span></button>
          <p class="tiny muted mb0" id="dlAllHint" data-i18n="dl_all_hint" hidden></p>
          <ul class="pw-results" id="results"></ul>
          <p class="tiny muted mb0" data-i18n="exif_note"></p>
          <div class="row spread">
            <span class="tiny muted" data-i18n="settings_saved"></span>
            <button type="button" class="btn btn-sm btn-danger" id="resetAll" data-i18n="reset"></button>
          </div>
        </section>
      </div>
    </div>

    <details class="card pw-help" style="margin-top:16px">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
