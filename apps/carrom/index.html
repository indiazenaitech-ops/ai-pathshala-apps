<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrom · AI Pathshala</title>
  <meta name="description" content="Play carrom on your phone or computer: 2 players on one device, against the computer, or solo practice. Real physics, simple Indian rules. A free game from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .cr-wrap { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 980px) { .cr-wrap { grid-template-columns: minmax(0, 660px) minmax(300px, 1fr); } }
    .cr-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .card h2 { font-size: 1.1rem; margin: 0 0 10px; }
    .cr-play { padding: 12px; }
    .cr-play:fullscreen { background: var(--bg); padding: 12px; overflow: auto; }
    .cr-play:-webkit-full-screen { background: var(--bg); padding: 12px; overflow: auto; }
    @media (max-width: 480px) { .cr-play { padding: 8px; } }

    /* score bar */
    .cr-score { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 8px; }
    .cr-pl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 10px;
      border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); min-width: 0; }
    .cr-pl.turn { border-color: var(--accent); background: var(--accent-soft); }
    .cr-pl .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .cr-pl .pts { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; grid-row: span 2; direction: ltr; unicode-bidi: isolate; }
    .cr-pl .sub { grid-column: 2; font-size: .8rem; color: var(--muted); font-weight: 600; min-width: 0; }
    .cr-dot { width: 22px; height: 22px; border-radius: 999px; grid-row: span 2; border: 2px solid #8a7458; }
    .cr-dot.w { background: #f7f1e3; } .cr-dot.b { background: #262626; border-color: #777; } .cr-dot.n { background: transparent; border-style: dashed; }
    .cr-status { font-weight: 700; margin: 0 0 4px; min-height: 1.6em; }
    .cr-msg { margin: 0 0 8px; min-height: 2.9em; font-size: .93rem; }
    .cr-msg.good { color: var(--success); } .cr-msg.bad { color: var(--danger); }
    :root[lang="ur"] .cr-msg { min-height: 3.8em; }

    /* board */
    .cr-stage { position: relative; background: transparent; border: 0; border-radius: 12px; overflow: hidden; touch-action: none; }
    .cr-stage canvas { display: block; width: 100%; height: auto; touch-action: none; border-radius: 12px; cursor: crosshair; }
    .cr-stage canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .cr-end { position: absolute; inset-inline: 8%; top: 50%; transform: translateY(-50%); text-align: center; box-shadow: var(--shadow-lg);
      background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; }
    .cr-end h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .cr-end p { margin: 0 0 10px; }
    .cr-end .row { justify-content: center; }

    /* controls */
    .cr-ctrl { display: grid; grid-template-columns: auto minmax(0, 1fr) 3.6rem; gap: 6px 10px; align-items: center; margin-top: 10px; }
    .cr-ctrl input[type="range"] { min-height: 40px; }
    .cr-ctrl output { font-variant-numeric: tabular-nums; font-weight: 700; text-align: end; direction: ltr; unicode-bidi: isolate; }
    .cr-meter { grid-column: 2 / 4; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .cr-meter > span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2b8a3e, #e8a400 60%, #d9480f); }
    .cr-acts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
    .cr-acts .grow { flex: 1 1 0; }
    .cr-strike { min-width: 9rem; }
    .cr-acts .check { min-height: 40px; }
    .cr-hint { margin: 8px 0 0; }
    .cr-thinking { display: inline-flex; align-items: center; gap: 6px; }

    /* game panel */
    .cr-set { display: grid; gap: 12px; }
    .cr-set .seg button { min-height: 40px; }
    .cr-names { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .cr-names input { width: 100%; }
    .cr-set select { width: 100%; }
    .cr-pending { margin: 0; }
    .cr-boards { width: 100%; }
    .cr-boards td.num, .cr-boards th.num { text-align: end; font-variant-numeric: tabular-nums; }
    .cr-target { margin: 0 0 8px; }
    .cr-phys dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 0; }
    .cr-phys dt { color: var(--muted); font-weight: 600; font-size: .9rem; }
    .cr-phys dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; direction: ltr; unicode-bidi: isolate; }
    .cr-phys .head { grid-column: 1 / -1; font-weight: 700; margin-top: 6px; color: var(--text); }
    .cr-rules ol { margin: 0; padding-inline-start: 1.3rem; }
    .cr-rules li + li { margin-top: 6px; }
    .cr-src { margin: 10px 0 0; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 32px; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.2rem; }
    details.card li + li { margin-top: 6px; }
    @media (max-width: 420px) { .cr-ctrl { grid-template-columns: auto minmax(0, 1fr) 3.2rem; } .cr-pl .pts { font-size: 1.3rem; } }
    @media print {
      .cr-play .cr-ctrl, .cr-acts, .cr-hint, .cr-set, .edu-intro { display: none !important; }
      .cr-wrap { display: block; }
      .cr-col > .card { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="cr-wrap">
      <div class="cr-col">
        <section class="card cr-play" id="play" aria-labelledby="h-play">
          <h2 id="h-play" class="edu-sr" data-i18n="app_title"></h2>
          <div class="cr-score" id="scorebar">
            <div class="cr-pl" id="pl0"><span class="cr-dot" id="dot0"></span><span class="nm no-i18n" id="nm0"></span><span class="pts" id="pts0">0</span><span class="sub" id="sub0"></span></div>
            <div class="cr-pl" id="pl1"><span class="cr-dot" id="dot1"></span><span class="nm no-i18n" id="nm1"></span><span class="pts" id="pts1">0</span><span class="sub" id="sub1"></span></div>
          </div>
          <p class="cr-status" id="status" aria-live="polite"></p>
          <p class="cr-msg" id="msg" aria-live="polite"></p>
          <div class="stage cr-stage" id="stage">
            <canvas id="cv" tabindex="0" role="img" data-i18n-aria-label="cv_aria" data-phase="aim"></canvas>
            <div class="cr-end" id="end" hidden>
              <h3 id="end-h"></h3>
              <p id="end-p"></p>
              <div class="row">
                <button type="button" class="btn btn-primary" id="next-board" data-i18n="next_board"></button>
                <button type="button" class="btn btn-primary" id="again" data-i18n="play_again" hidden></button>
              </div>
            </div>
          </div>
          <div class="cr-ctrl no-print">
            <label for="pos" data-i18n="pos"></label>
            <input type="range" id="pos" min="-100" max="100" step="1" value="0" dir="ltr">
            <output id="pos-out" for="pos"></output>
            <label for="angle" data-i18n="aim"></label>
            <input type="range" id="angle" min="-88" max="88" step="0.5" value="0" dir="ltr">
            <output id="angle-out" for="angle"></output>
            <label for="power" data-i18n="power"></label>
            <input type="range" id="power" min="0" max="100" step="1" value="60" dir="ltr">
            <output id="power-out" for="power"></output>
            <span></span><div class="cr-meter" aria-hidden="true"><span id="meter"></span></div>
          </div>
          <div class="cr-acts no-print">
            <button type="button" class="btn btn-accent btn-lg cr-strike" id="strike"><span aria-hidden="true">🎯</span> <span data-i18n="strike"></span></button>
            <span class="grow small muted cr-thinking" id="thinking" hidden><span aria-hidden="true">🤔</span> <span data-i18n="thinking"></span></span>
            <span class="grow"></span>
            <button type="button" class="btn btn-sm" id="fs"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
          </div>
          <div class="cr-acts no-print">
            <label class="check"><input type="checkbox" id="guide" checked> <span data-i18n="guide"></span></label>
            <label class="check"><input type="checkbox" id="paths"> <span data-i18n="paths"></span></label>
            <label class="check"><input type="checkbox" id="sound"> <span data-i18n="sound"></span></label>
          </div>
          <p class="small muted cr-hint no-print" id="hint" data-i18n="hint"></p>
        </section>

        <section class="card cr-phys" aria-labelledby="h-phys">
          <h2 id="h-phys" data-i18n="h_phys"></h2>
          <p class="muted small mb0" id="phys-none" data-i18n="phys_none"></p>
          <dl id="phys" hidden></dl>
        </section>
      </div>

      <div class="cr-col">
        <section class="card" aria-labelledby="h-game">
          <h2 id="h-game" data-i18n="h_game"></h2>
          <div class="cr-set no-print">
            <div class="seg" role="group" data-i18n-aria-label="mode">
              <button type="button" id="mode-pvp" aria-pressed="true" data-i18n="mode_pvp"></button>
              <button type="button" id="mode-cpu" aria-pressed="false" data-i18n="mode_cpu"></button>
              <button type="button" id="mode-practice" aria-pressed="false" data-i18n="mode_practice"></button>
            </div>
            <div class="row" id="level-row">
              <span class="small" style="font-weight:600" id="lvl-label" data-i18n="level"></span>
              <div class="seg" role="group" aria-labelledby="lvl-label">
                <button type="button" id="lvl-easy" aria-pressed="false" data-i18n="lvl_easy"></button>
                <button type="button" id="lvl-medium" aria-pressed="true" data-i18n="lvl_medium"></button>
                <button type="button" id="lvl-hard" aria-pressed="false" data-i18n="lvl_hard"></button>
              </div>
            </div>
            <div class="cr-names" id="names-row">
              <div class="field"><label for="name1" data-i18n="name1"></label><input type="text" id="name1" maxlength="20" class="no-i18n" autocomplete="off"></div>
              <div class="field" id="name2-f"><label for="name2" data-i18n="name2"></label><input type="text" id="name2" maxlength="20" class="no-i18n" autocomplete="off"></div>
            </div>
            <div class="field" id="match-f">
              <label for="match" data-i18n="match_len"></label>
              <select id="match">
                <option value="short" data-i18n="m_short"></option>
                <option value="icf" data-i18n="m_icf"></option>
                <option value="club" data-i18n="m_club"></option>
              </select>
            </div>
            <label class="check" id="qf-row"><input type="checkbox" id="queen-first" checked> <span data-i18n="queen_first"></span></label>
            <p class="callout warning small cr-pending" id="pending" hidden data-i18n="pending"></p>
            <div class="row">
              <button type="button" class="btn btn-primary" id="new-match"><span aria-hidden="true">↺</span> <span data-i18n="new_match"></span></button>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="h-match">
          <h2 id="h-match" data-i18n="h_match"></h2>
          <p class="small muted cr-target" id="target"></p>
          <div class="scroll-x" id="boards-wrap">
            <table class="table cr-boards">
              <thead><tr><th data-i18n="col_board"></th><th data-i18n="col_winner"></th><th class="num" data-i18n="col_points"></th></tr></thead>
              <tbody id="boards"></tbody>
            </table>
          </div>
          <p class="small muted mb0" id="saved" data-i18n="saved_note"></p>
        </section>

        <section class="card cr-rules" aria-labelledby="h-rules">
          <h2 id="h-rules" data-i18n="h_rules"></h2>
          <ol>
            <li data-i18n="r1"></li><li data-i18n="r2"></li><li data-i18n="r3"></li><li data-i18n="r4"></li>
            <li data-i18n="r5"></li><li data-i18n="r6"></li><li data-i18n="r7"></li><li data-i18n="r8"></li><li data-i18n="r9"></li>
          </ol>
          <p class="small muted cr-src mb0" data-i18n="r_src"></p>
        </section>

        <details class="card">
          <summary data-i18n="help"></summary>
          <ul>
            <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li>
            <li data-i18n="tip4"></li><li data-i18n="tip5"></li><li data-i18n="tip6"></li>
          </ul>
        </details>
      </div>
    </div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="physics.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
