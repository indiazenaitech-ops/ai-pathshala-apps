<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Learns by Reward · AI Pathshala</title>
  <meta name="description" content="Watch a robot learn to find the treasure by trial and error: reinforcement learning (Q-learning) with rewards, a Q-table and live charts. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- main layout: board + side panel ---------- */
    .ql { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .ql { grid-template-columns: minmax(0, 1fr) 340px; } }
    .ql-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .ql h2 { font-size: 1.12rem; margin-bottom: 4px; }
    .ql-stage { display: flex; flex-direction: column; gap: 12px; }
    .ql:fullscreen { background: var(--bg); padding: 16px; overflow: auto; align-content: start; }
    .ql:-webkit-full-screen { background: var(--bg); padding: 16px; overflow: auto; }

    /* stats strip */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stat { display: flex; flex-direction: column; min-width: 0; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; }
    .stat .lbl { font-size: .78rem; font-weight: 700; color: var(--muted); line-height: 1.3; }
    .stat .num { font-size: 1.45rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }
    .stat .num.good { color: var(--success); }
    .stat .num.bad { color: var(--danger); }

    /* the board */
    .board-wrap { display: flex; justify-content: center; }
    #board { display: block; width: min(100%, calc(100vh - 330px)); min-width: min(100%, 280px); aspect-ratio: 1 / 1; height: auto;
      border-radius: 12px; border: 1px solid var(--border); touch-action: none; cursor: pointer; background: var(--surface); }
    #board:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .ql:fullscreen #board { width: min(100%, calc(100vh - 230px)); }

    /* controls */
    .ql-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ql-ctrl .btn { flex: 1 1 auto; }
    #btn-episode { min-width: 9.5rem; }
    #btn-episode[aria-pressed="true"], #btn-play[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ql-ctrl2 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .ql-ctrl2 .lbl { font-size: .85rem; color: var(--muted); font-weight: 700; }
    .ql-ctrl2 .seg button { min-height: 38px; padding: 6px 12px; }
    .ql-ctrl2 .push { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .ql-msg { margin: 0; min-height: 3.3em; font-weight: 600; display: flex; align-items: center; }
    .ql-msg[data-code="good"] { border-color: var(--success); background: var(--success-soft); }
    .ql-msg[data-code="bad"] { border-color: var(--danger); background: var(--danger-soft); }
    .ql-msg[data-code="warn"] { border-color: var(--warning); background: var(--warning-soft); }
    .ql-msg[data-code="step"] { border-color: var(--accent); background: var(--accent-soft); }
    .ql-msg[data-code="look"] { border-color: var(--primary); background: var(--primary-soft); }

    /* side cards */
    .sub-lbl { font-size: .86rem; color: var(--muted); font-weight: 700; margin: 0 0 5px; }
    .hint { color: var(--muted); font-size: .84rem; margin: 6px 0 0; font-weight: 400; }
    .pre-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .pre-btn { display: flex; flex-direction: row; align-items: center; gap: 7px; padding: 5px 7px; border: 2px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; line-height: 1.25; min-height: 48px; text-align: start; min-width: 0; }
    .pre-btn span { min-width: 0; overflow-wrap: anywhere; }
    .pre-btn:hover { background: var(--surface-2); }
    .pre-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .pre-btn canvas { width: 36px; height: 36px; border-radius: 6px; display: block; flex: none; }
    .seg.full { display: flex; }
    .seg.full button { flex: 1 1 0; min-height: 40px; padding-inline: 6px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font-size: .86rem; }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .legend canvas { width: 26px; height: 26px; border-radius: 5px; flex: none; }

    .slider { display: flex; flex-direction: column; gap: 2px; }
    .slider .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .slider label { font-size: .92rem; }
    .slider output { font-weight: 800; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; min-width: 3.2em; text-align: end; }
    .slider input[type="range"] { min-height: 32px; }
    .slider .hint { margin: 0; }
    .checks { display: flex; flex-direction: column; gap: 2px; }
    .checks .check { min-height: 36px; font-size: .92rem; }

    /* results */
    .ql-results { margin-top: 16px; align-items: start; }
    .ql-results h2 { font-size: 1.12rem; margin-bottom: 4px; }
    .ql-results h3 { font-size: 1rem; margin: 6px 0 2px; }
    #chart { display: block; width: 100%; height: 230px; border-radius: 10px; background: var(--surface); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--muted); }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; flex: none; }
    .chart-legend i.thin { border-top-width: 2px; opacity: .6; }
    .chart-legend i.dash { border-top-style: dashed; }

    /* robot's brain */
    .compass { direction: ltr; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-width: 380px; margin-inline: auto; }
    .compass .qbox { border-radius: 10px; padding: 6px 4px; text-align: center; border: 2px solid var(--border); min-height: 58px; display: flex; flex-direction: column; justify-content: center; }
    .compass .qbox .an { font-size: .8rem; font-weight: 700; line-height: 1.2; }
    .compass .qbox .qv { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .compass .qbox.best { border-color: var(--text); }
    .compass .mid { display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .compass .empty { visibility: hidden; }
    :root[dir="rtl"] .compass .qbox .an { direction: rtl; }
    .formula { display: block; direction: ltr; unicode-bidi: isolate; text-align: start; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: .92rem; overflow-wrap: anywhere; white-space: normal; }
    :root[dir="rtl"] .formula { text-align: end; }
    .rule { font-weight: 600; }
    #upd-box p { margin: 0 0 6px; }

    /* learn + calc + quiz */
    .page-sec { margin-top: 16px; }
    .learn-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    .learn-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
    .learn-box h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .learn-box p { margin: 0; font-size: .94rem; }
    .calc-given { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .calc-fb .formula { max-width: 520px; }
    .calc-given div { background: var(--surface-2); border-radius: 10px; padding: 6px 10px; }
    .calc-given .k { display: block; font-size: .8rem; color: var(--muted); font-weight: 700; }
    .calc-given .v { font-size: 1.25rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    #calc-input { width: 9rem; font-size: 1.1rem; font-weight: 700; direction: ltr; text-align: center; }
    .calc-fb { margin: 0; font-weight: 600; }
    .quiz-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    .quiz-q { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); }
    .quiz-q .q { font-weight: 700; margin-bottom: 8px; }
    .quiz-q .opts { display: flex; flex-direction: column; gap: 6px; }
    .quiz-q .opt { justify-content: flex-start; text-align: start; white-space: normal; font-weight: 500; }
    .quiz-q .opt:disabled { opacity: 1; cursor: default; }
    .quiz-q .opt:disabled:not(.right):not(.picked-wrong) { color: var(--muted); }
    .quiz-q .opt.right { background: var(--success-soft); border-color: var(--success); }
    .quiz-q .opt.picked-wrong { background: var(--danger-soft); border-color: var(--danger); }
    .quiz-q .why { margin: 8px 0 0; font-size: .9rem; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 6px; }
    .help summary { cursor: pointer; font-weight: 700; }
    /* Nastaliq (Urdu) needs taller lines for headings and small labels */
    :root[lang="ur"] main h2, :root[lang="ur"] main h3 { line-height: 1.9; }
    :root[lang="ur"] .stat .lbl, :root[lang="ur"] .sub-lbl, :root[lang="ur"] .compass .qbox .an, :root[lang="ur"] .calc-given .k { line-height: 1.9; }

    @media (max-width: 560px) {
      .ql-stage.card, .ql-side .card { padding: 12px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat .num { font-size: 1.25rem; }
      .ql-ctrl .btn { flex: 1 1 calc(50% - 8px); padding-inline: 8px; }
      .ql-ctrl2 .push { margin-inline-start: 0; }
    }

    @media print {
      .ql { display: block; }
      .ql-side, .ql-ctrl, .ql-ctrl2, .ql-msg, #quiz, .help, .calc-actions, .calc-fb, #brain-card, .edu-intro { display: none !important; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      #board { width: 11cm !important; min-width: 0; }
      .ql-results { display: block; }
      .ql-results .card { margin-bottom: 12px; }
      #chart { max-width: 16cm; height: 6cm; }
      .learn-box { break-inside: avoid; border: 1px solid #bbb; }
      .print-line { display: inline-block !important; border-bottom: 1px solid #000; min-width: 4cm; height: 1.2em; }
      .print-head { margin-bottom: 10px; }
    }
    .print-line { display: none; }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="print-only print-head"><h2 class="mb0" data-i18n="app_title"></h2><p class="mb0" id="print-sum"></p></div>

    <div class="ql" id="ql">
      <!-- ============ the board ============ -->
      <section class="card ql-stage" aria-labelledby="board-h">
        <h2 id="board-h" class="mb0" hidden data-i18n="board_title"></h2>
        <div class="stats">
          <div class="stat"><span class="lbl" data-i18n="stat_episodes"></span><span class="num" id="st-ep">0</span></div>
          <div class="stat" data-i18n-title="eps_hint"><span class="lbl" data-i18n="stat_eps"></span><span class="num" id="st-eps">0.30</span></div>
          <div class="stat"><span class="lbl" data-i18n="stat_last"></span><span class="num" id="st-last">–</span></div>
          <div class="stat"><span class="lbl" data-i18n="stat_success"></span><span class="num" id="st-succ">–</span></div>
        </div>

        <div class="board-wrap"><canvas id="board" tabindex="0" role="img"></canvas></div>

        <div class="ql-ctrl no-print">
          <button type="button" class="btn" id="btn-step"><span aria-hidden="true">👣</span> <span data-i18n="btn_step"></span></button>
          <button type="button" class="btn btn-primary" id="btn-episode" aria-pressed="false"><span aria-hidden="true" id="ep-ico">▶</span> <span id="ep-txt"></span></button>
          <button type="button" class="btn" id="btn-fast100"><span aria-hidden="true">⏩</span> <span id="fast100-txt"></span></button>
          <button type="button" class="btn" id="btn-fast1000"><span aria-hidden="true">⏩</span> <span id="fast1000-txt"></span></button>
        </div>
        <div class="ql-ctrl no-print">
          <button type="button" class="btn btn-accent" id="btn-play" aria-pressed="false"><span aria-hidden="true" id="play-ico">🏁</span> <span id="play-txt"></span></button>
          <button type="button" class="btn btn-danger" id="btn-reset"><span aria-hidden="true">↺</span> <span data-i18n="btn_reset"></span></button>
        </div>
        <div class="ql-ctrl2 no-print">
          <span class="lbl" id="speed-lbl" data-i18n="speed"></span>
          <div class="seg" id="speed" role="group" aria-labelledby="speed-lbl">
            <button type="button" data-speed="slow" data-i18n="speed_slow"></button>
            <button type="button" data-speed="normal" data-i18n="speed_normal"></button>
            <button type="button" data-speed="fast" data-i18n="speed_fast"></button>
          </div>
          <div class="push">
            <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            <button type="button" class="btn btn-sm" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <p class="callout ql-msg" id="msg" aria-live="polite"></p>
      </section>

      <!-- ============ side panel ============ -->
      <aside class="ql-side">
        <section class="card stack" aria-labelledby="world-h">
          <h2 id="world-h" data-i18n="world_title"></h2>
          <div>
            <p class="sub-lbl" id="pre-lbl" data-i18n="preset_label"></p>
            <div class="pre-grid" role="group" aria-labelledby="pre-lbl">
              <button type="button" class="pre-btn" id="preset-simple" data-preset="simple"><canvas width="98" height="98" aria-hidden="true"></canvas><span data-i18n="preset_simple"></span></button>
              <button type="button" class="pre-btn" id="preset-maze" data-preset="maze"><canvas width="98" height="98" aria-hidden="true"></canvas><span data-i18n="preset_maze"></span></button>
              <button type="button" class="pre-btn" id="preset-cliff" data-preset="cliff"><canvas width="98" height="98" aria-hidden="true"></canvas><span data-i18n="preset_cliff"></span></button>
              <button type="button" class="pre-btn" id="preset-empty" data-preset="empty"><canvas width="98" height="98" aria-hidden="true"></canvas><span data-i18n="preset_empty"></span></button>
            </div>
            <p class="hint" id="preset-hint"></p>
          </div>
          <div>
            <p class="sub-lbl" id="tool-lbl" data-i18n="tool_label"></p>
            <div class="seg full" id="tools" role="group" aria-labelledby="tool-lbl">
              <button type="button" id="tool-cycle" data-tool="cycle"><span aria-hidden="true">🧱</span> <span data-i18n="tool_cycle"></span></button>
              <button type="button" id="tool-start" data-tool="start"><span aria-hidden="true">🤖</span> <span data-i18n="tool_start"></span></button>
              <button type="button" id="tool-look" data-tool="look"><span aria-hidden="true">🔍</span> <span data-i18n="tool_look"></span></button>
            </div>
            <p class="hint" id="tool-hint"></p>
          </div>
          <ul class="legend">
            <li><canvas width="52" height="52" data-ico="robot" aria-hidden="true"></canvas><span data-i18n="legend_robot"></span></li>
            <li><canvas width="52" height="52" data-ico="goal" aria-hidden="true"></canvas><span data-i18n="legend_goal"></span></li>
            <li><canvas width="52" height="52" data-ico="pit" aria-hidden="true"></canvas><span data-i18n="legend_pit"></span></li>
            <li><canvas width="52" height="52" data-ico="wall" aria-hidden="true"></canvas><span data-i18n="legend_wall"></span></li>
            <li><canvas width="52" height="52" data-ico="start" aria-hidden="true"></canvas><span data-i18n="legend_start"></span></li>
          </ul>
        </section>

        <section class="card stack" aria-labelledby="set-h">
          <h2 id="set-h" data-i18n="settings_title"></h2>
          <div class="slider">
            <div class="top"><label for="sl-alpha" data-i18n="alpha_label"></label><output id="out-alpha" for="sl-alpha"></output></div>
            <input type="range" id="sl-alpha" min="0.01" max="1" step="0.01">
            <p class="hint" data-i18n="alpha_hint"></p>
          </div>
          <div class="slider">
            <div class="top"><label for="sl-gamma" data-i18n="gamma_label"></label><output id="out-gamma" for="sl-gamma"></output></div>
            <input type="range" id="sl-gamma" min="0" max="0.99" step="0.01">
            <p class="hint" data-i18n="gamma_hint"></p>
          </div>
          <div class="slider">
            <div class="top"><label for="sl-eps" data-i18n="eps_label"></label><output id="out-eps" for="sl-eps"></output></div>
            <input type="range" id="sl-eps" min="0" max="1" step="0.01">
            <p class="hint" data-i18n="eps_hint"></p>
            <label class="check"><input type="checkbox" id="chk-decay"> <span data-i18n="decay_label"></span></label>
          </div>
          <div class="slider">
            <div class="top"><label for="sl-cost" data-i18n="cost_label"></label><output id="out-cost" for="sl-cost"></output></div>
            <input type="range" id="sl-cost" min="0" max="2" step="0.05">
            <p class="hint" data-i18n="cost_hint"></p>
          </div>
          <div><button type="button" class="btn btn-sm" id="btn-defaults"><span aria-hidden="true">⚙</span> <span data-i18n="defaults_btn"></span></button></div>
        </section>

        <section class="card stack" aria-labelledby="view-h">
          <h2 id="view-h" data-i18n="view_title"></h2>
          <div class="checks">
            <label class="check"><input type="checkbox" id="v-heat"> <span data-i18n="view_heat"></span></label>
            <label class="check"><input type="checkbox" id="v-arrows"> <span data-i18n="view_arrows"></span></label>
            <label class="check"><input type="checkbox" id="v-q"> <span data-i18n="view_q"></span></label>
            <label class="check"><input type="checkbox" id="v-nums"> <span data-i18n="view_nums"></span></label>
          </div>
        </section>
      </aside>
    </div>

    <!-- ============ results ============ -->
    <div class="grid-2 ql-results">
      <section class="card stack" aria-labelledby="chart-h">
        <h2 id="chart-h" data-i18n="chart_title"></h2>
        <canvas id="chart" role="img" data-i18n-aria-label="chart_title"></canvas>
        <div class="chart-legend" id="chart-legend">
          <span><i class="thin" id="lg-raw"></i><span data-i18n="chart_raw"></span></span>
          <span><i id="lg-avg"></i><span data-i18n="chart_avg"></span></span>
          <span><i class="dash" id="lg-best"></i><span data-i18n="chart_best"></span></span>
        </div>
        <p class="small muted mb0" data-i18n="chart_note"></p>
      </section>

      <section class="card stack" id="brain-card" aria-labelledby="brain-h">
        <h2 id="brain-h" data-i18n="brain_title"></h2>
        <p class="mb0" id="brain-cell"></p>
        <div class="compass" id="compass" aria-live="polite"></div>
        <p class="small mb0" id="brain-note"></p>
        <h3 data-i18n="upd_title"></h3>
        <p class="small rule mb0" data-i18n="upd_rule"></p>
        <div id="upd-box" aria-live="polite"></div>
      </section>
    </div>

    <!-- ============ learn ============ -->
    <section class="card stack page-sec" aria-labelledby="learn-h">
      <h2 id="learn-h" data-i18n="learn_title"></h2>
      <div class="learn-grid">
        <div class="learn-box"><h3><span aria-hidden="true">🤖</span> <span data-i18n="l1_t"></span></h3><p data-i18n="l1"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🗺️</span> <span data-i18n="l2_t"></span></h3><p data-i18n="l2"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">📍</span> <span data-i18n="l3_t"></span></h3><p data-i18n="l3"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🕹️</span> <span data-i18n="l4_t"></span></h3><p data-i18n="l4"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🎁</span> <span data-i18n="l5_t"></span></h3><p data-i18n="l5"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🧮</span> <span data-i18n="l6_t"></span></h3><p data-i18n="l6"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">⚖️</span> <span data-i18n="l7_t"></span></h3><p data-i18n="l7"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🎚️</span> <span data-i18n="l8_t"></span></h3><p data-i18n="l8"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🌍</span> <span data-i18n="l9_t"></span></h3><p data-i18n="l9"></p></div>
      </div>
    </section>

    <!-- ============ by hand ============ -->
    <section class="card stack page-sec" id="calc" aria-labelledby="calc-h">
      <h2 id="calc-h" data-i18n="calc_title"></h2>
      <p class="small mb0" data-i18n="calc_intro"></p>
      <div class="calc-given" id="calc-given"></div>
      <div class="row">
        <label for="calc-input" data-i18n="calc_ask"></label>
        <input type="text" id="calc-input" autocomplete="off" spellcheck="false" class="no-print">
        <span class="print-line" aria-hidden="true"></span>
        <span class="row calc-actions">
          <button type="button" class="btn btn-primary" id="calc-check" data-i18n="calc_check"></button>
          <button type="button" class="btn" id="calc-show" data-i18n="calc_show"></button>
          <button type="button" class="btn" id="calc-new"><span aria-hidden="true">🎲</span> <span data-i18n="calc_new"></span></button>
        </span>
      </div>
      <div class="calc-fb" id="calc-fb" aria-live="polite"></div>
    </section>

    <!-- ============ quiz ============ -->
    <section class="card stack page-sec" id="quiz" aria-labelledby="quiz-h">
      <div class="row spread">
        <h2 id="quiz-h" class="mb0" data-i18n="quiz_title"></h2>
        <div class="row">
          <span class="badge primary" id="quiz-score" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="quiz-again" data-i18n="try_again"></button>
        </div>
      </div>
      <div class="quiz-list" id="quiz-list"></div>
    </section>

    <details class="card help page-sec">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="ql.js"></script>
  <script src="app.js"></script>
</body>
</html>
