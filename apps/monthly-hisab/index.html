<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly Hisab: Milk, Maid, Paper · AI Pathshala</title>
  <meta name="description" content="Free monthly hisab for your home: milk, newspaper, house help, cook, driver, water cans and tiffin. Tap the days, get the bill, dues and balance, share it on WhatsApp or print it. Stays on your device.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
    .flip { display: inline-block; font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    [dir="rtl"] .flip { transform: scaleX(-1); }
    .field input, .field select { width: 100%; }
    .mh-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .mh-head h3 { margin: 0; }
    .sample-box { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
    .sample-box p { margin: 0; flex: 1 1 240px; }

    /* month bar */
    .mh-month { display: flex; align-items: center; gap: 10px; }
    .mh-month h2 { margin: 0; flex: 1 1 auto; text-align: center; font-size: 1.35rem; min-width: 0; }
    .mh-nav { min-width: 48px; min-height: 48px; font-size: 1.5rem; padding: 0 10px; }
    .mh-month-sub { display: flex; justify-content: center; margin-top: 6px; }

    /* items */
    .mh-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .mh-chip { display: flex; flex-direction: column; align-items: flex-start; padding: 7px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; cursor: pointer; min-height: 52px; text-align: start; max-width: 100%; min-width: 0; }
    .mh-chip:hover { border-color: var(--primary); }
    .mh-chip b { font-weight: 700; overflow-wrap: anywhere; }
    .mh-chip small { color: var(--muted); font-size: .82rem; }
    .mh-chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .mh-chip.skip { opacity: .65; border-style: dashed; }
    .mh-chip .badge { margin-inline-start: 6px; vertical-align: middle; }
    .inactive { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .inactive .lbl { color: var(--muted); }
    .inactive span.in-it { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* item card */
    .it-title { font-size: 1.3rem; margin: 0; overflow-wrap: anywhere; }
    .it-plan { margin: 2px 0 0; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tool-row .btn { flex: 0 1 auto; }
    @media (max-width: 520px) { .tool-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } .tool-row .btn { white-space: normal; } }
    .mh-brush { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .brush { min-height: 44px; min-width: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font: inherit; font-weight: 700; padding: 6px 11px; cursor: pointer; }
    .brush[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .brush .num { font-weight: 800; }
    .other-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
    .other-row input { width: 7.5rem; }

    .mh-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .mh-wd { text-align: center; font-size: .76rem; color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mh-wd.sun { color: var(--accent); }
    .day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; min-width: 0; padding: 2px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; touch-action: manipulation; }
    .day:hover { border-color: var(--primary); }
    .day .dn { font-size: .72rem; color: var(--muted); line-height: 1.15; font-family: "Noto Sans", system-ui, sans-serif; }
    .day .dv { font-size: 1.08rem; font-weight: 800; line-height: 1.2; font-family: "Noto Sans", system-ui, sans-serif; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .day.sun .dn { color: var(--accent); font-weight: 700; }
    .day.chg { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .day.zero .dv { color: var(--danger); }
    .day.dim .dv { color: var(--muted); font-weight: 600; }
    .day.s-p .dv { color: var(--success); }
    .day.s-a { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
    .day.s-a .dv { color: var(--danger); }
    .day.s-h { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
    .day.s-h .dv { color: var(--warning); }
    .day.s-o { background: var(--surface-2); }
    .day.s-o .dv { color: var(--muted); }
    .day.today { box-shadow: inset 0 0 0 2px var(--primary); }
    .day.off-month { visibility: hidden; }
    @media (max-width: 400px) { .mh-cal { gap: 3px; } .day { min-height: 50px; border-radius: 8px; } .day .dv { font-size: .98rem; } }

    .mh-bill { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }
    .mh-bill h4 { margin: 0 0 6px; font-size: 1rem; }
    .mh-bill .ln { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 3px 0; }
    .mh-bill .ln + .ln { border-top: 1px dashed var(--border); }
    .mh-bill .ln.tot { font-weight: 800; font-size: 1.05rem; }
    .mh-bill .note { color: var(--muted); font-size: .86rem; padding: 2px 0; }
    .mh-bill .rule { color: var(--muted); font-size: .82rem; margin-top: 6px; }
    .pay-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 560px) { .pay-grid { grid-template-columns: minmax(0, 1fr); } }
    .err { color: var(--danger); font-size: .86rem; margin: 2px 0 0; min-height: 0; }
    .err:empty { display: none; }
    .bal { font-size: 1.35rem; font-weight: 800; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--primary-soft); }
    .bal.adv { background: var(--success-soft); color: var(--success); }
    .bal.zero { background: var(--surface-2); color: var(--muted); }
    .rates-box summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; }
    .rate-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; }
    .rate-list li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

    /* summary */
    table.sum { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .sum th, .sum td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }
    .sum thead th { background: var(--surface-2); font-size: .84rem; }
    .sum td.a, .sum th.a { text-align: end; white-space: nowrap; }
    .sum tfoot td { font-weight: 800; border-top: 2px solid var(--border); }
    .sum td small { display: block; color: var(--muted); font-weight: 400; }
    @media (max-width: 560px) { .sum th, .sum td { padding: 6px 4px; font-size: .8rem; } .sum th.a { white-space: normal; } .sum td small { font-size: .74rem; } }
    .big-total { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .big-total div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; min-width: 0; }
    .big-total span { display: block; color: var(--muted); font-size: .82rem; font-weight: 600; }
    .big-total b { font-size: 1.2rem; overflow-wrap: anywhere; }
    @media (max-width: 420px) { .big-total { grid-template-columns: minmax(0, 1fr); } }
    .act-row { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 520px) { .act-row .btn { flex: 1 1 100%; } }
    :root[lang="ur"] .mh-chip, :root[lang="ur"] .brush { line-height: 1.8; }
    #sh-text { min-height: 220px; font-family: inherit; }

    /* one-page print */
    #printSum h1 { font-size: 16pt; margin: 0 0 2mm; }
    #printSum .p-sub { margin: 0 0 3mm; color: #333; }
    #printSum table { width: 100%; border-collapse: collapse; margin-bottom: 4mm; }
    #printSum th, #printSum td { border: 1px solid #999; padding: 2px 4px; text-align: start; vertical-align: top; }
    #printSum td.a, #printSum th.a { text-align: end; white-space: nowrap; }
    #printSum .g31 th, #printSum .g31 td { font-size: 7pt; padding: 1px; text-align: center; }
    #printSum .g31 td.nm, #printSum .g31 th.nm { text-align: start; padding: 1px 3px; font-size: 8pt; }
    #printSum .p-rule { font-size: 8.5pt; color: #333; }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      #printSum { font-size: 10pt; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro no-print" data-i18n="intro"></p>
    <p class="callout small no-print" data-i18n="privacy"></p>
    <div class="callout accent no-print sample-box" id="sampleNote" hidden>
      <p data-i18n="sample_note"></p>
      <button class="btn btn-sm" id="btnClearSample" type="button" data-i18n="clear_sample"></button>
    </div>

    <section class="card no-print">
      <div class="mh-month">
        <button class="btn mh-nav" id="btnPrev" type="button" data-i18n-aria-label="prev_month" data-i18n-title="prev_month"><span class="flip" aria-hidden="true">‹</span></button>
        <h2 id="monthLabel" aria-live="polite"></h2>
        <button class="btn mh-nav" id="btnNext" type="button" data-i18n-aria-label="next_month" data-i18n-title="next_month"><span class="flip" aria-hidden="true">›</span></button>
      </div>
      <div class="mh-month-sub"><button class="btn btn-sm btn-ghost" id="btnToday" type="button" data-i18n="this_month"></button></div>
    </section>

    <section class="card stack no-print">
      <div class="mh-head">
        <h3 data-i18n="h_items"></h3>
        <button class="btn btn-primary" id="btnAdd" type="button" data-i18n="add_item"></button>
      </div>
      <div id="itemChips" class="mh-chips"></div>
      <p id="noItems" class="muted mb0" data-i18n="no_items" hidden></p>
      <div id="inactive" class="inactive small" hidden></div>
    </section>

    <section class="card stack no-print" id="itemCard" hidden>
      <div>
        <h3 class="it-title"><span id="itName" class="no-i18n"></span> <span class="badge accent" id="itEx" data-i18n="badge_example" hidden></span></h3>
        <p class="it-plan muted small" id="itPlan"></p>
      </div>
      <div class="tool-row">
        <button class="btn btn-sm" id="btnEdit" type="button" data-i18n="edit_item"></button>
        <button class="btn btn-sm" id="btnShareItem" type="button" data-i18n="share_item"></button>
        <button class="btn btn-sm" id="btnSkip" type="button"></button>
        <button class="btn btn-sm" id="btnStop" type="button" data-i18n="stop_item"></button>
        <button class="btn btn-sm btn-danger" id="btnDel" type="button" data-i18n="delete_item"></button>
      </div>
      <p class="callout warning small mb0" id="skipNote" hidden></p>

      <div id="calWrap" class="stack">
        <div>
          <p class="small mb0" style="margin-bottom:6px" data-i18n="tap_to_set"></p>
          <div id="brushes" class="mh-brush" role="group" data-i18n-aria-label="tap_to_set"></div>
          <div class="other-row" id="otherRow" hidden style="margin-top:6px">
            <label class="field"><span data-i18n="other_qty"></span><input type="text" inputmode="decimal" id="otherQty" maxlength="8" autocomplete="off"></label>
            <button class="btn" id="otherUse" type="button" data-i18n="use_qty"></button>
          </div>
          <p class="err" id="otherErr" role="alert"></p>
        </div>
        <div id="cal" class="mh-cal"></div>
        <p class="tiny muted mb0" id="legend"></p>
        <div class="row"><button class="btn btn-sm" id="btnResetMarks" type="button" data-i18n="reset_marks"></button></div>
      </div>

      <div class="mh-bill" id="bill" aria-live="polite"></div>

      <div class="pay-grid">
        <label class="field"><span data-i18n="f_prev"></span><input type="text" inputmode="decimal" id="inPrev" maxlength="16" autocomplete="off"><span class="hint" id="prevHint"></span><span class="err" id="prevErr" role="alert"></span></label>
        <label class="field"><span data-i18n="f_paid"></span><input type="text" inputmode="decimal" id="inPaid" maxlength="16" autocomplete="off"><span class="err" id="paidErr" role="alert"></span></label>
        <label class="field"><span data-i18n="f_extra"></span><input type="text" inputmode="decimal" id="inAdj" maxlength="16" autocomplete="off"><span class="err" id="adjErr" role="alert"></span></label>
        <label class="field"><span data-i18n="f_extra_note"></span><input type="text" id="inAdjNote" class="no-i18n" maxlength="40" autocomplete="off"></label>
      </div>
      <div class="bal" id="itBal" aria-live="polite"></div>

      <details class="rates-box" id="ratesBox">
        <summary data-i18n="h_rates"></summary>
        <ul class="rate-list" id="rateList"></ul>
        <div class="row" id="rateForm">
          <label class="field"><span data-i18n="r_from"></span><input type="date" id="rcDate"></label>
          <label class="field"><span data-i18n="r_new"></span><input type="text" inputmode="decimal" id="rcRate" maxlength="12" autocomplete="off"></label>
          <button class="btn" id="rcSave" type="button" data-i18n="r_add" style="align-self:flex-end"></button>
        </div>
        <p class="err" id="rcErr" role="alert"></p>
        <p class="small muted mb0" id="rcMonthOnly" data-i18n="r_month_only" hidden></p>
      </details>
    </section>

    <section class="card stack no-print">
      <h3 data-i18n="h_summary"></h3>
      <div class="big-total" aria-live="polite">
        <div><span data-i18n="c_bill"></span><b class="num" id="totBill"></b></div>
        <div><span data-i18n="c_paid"></span><b class="num" id="totPaid"></b></div>
        <div><span data-i18n="c_bal"></span><b class="num" id="totBal"></b></div>
      </div>
      <div class="scroll-x"><table class="sum" id="sumTable"></table></div>
      <p class="muted small mb0" id="sumEmpty" data-i18n="sum_empty" hidden></p>
      <div class="act-row">
        <button class="btn btn-wa" id="btnShareMonth" type="button" data-i18n="share_month"></button>
        <button class="btn" id="btnPrint" type="button" data-i18n="print_sum"></button>
        <button class="btn" id="btnCsv" type="button" data-i18n="csv_month"></button>
      </div>
    </section>

    <section class="card stack no-print">
      <h3 data-i18n="h_data"></h3>
      <label class="field" style="max-width:420px"><span data-i18n="f_house"></span><input type="text" id="inHouse" class="no-i18n" maxlength="50" autocomplete="off" data-i18n-placeholder="ph_house"></label>
      <div class="act-row">
        <button class="btn" id="btnBackup" type="button" data-i18n="backup"></button>
        <button class="btn" id="btnRestore" type="button" data-i18n="restore"></button>
        <button class="btn btn-danger" id="btnReset" type="button" data-i18n="reset"></button>
      </div>
      <p class="tiny muted mb0" data-i18n="saved_local"></p>
    </section>

    <details class="card no-print">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <h4 data-i18n="help_rule_h"></h4>
      <p class="small" data-i18n="rule_month"></p>
      <p class="small" data-i18n="rule_30"></p>
      <p class="small" data-i18n="rule_day"></p>
      <p class="small mb0" data-i18n="rule_qty"></p>
    </details>

    <section id="printSum" class="print-only"></section>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
