<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clustering Lab (k-means) · AI Pathshala</title>
  <meta name="description" content="Watch k-means find groups in data with no labels: assign, update, inertia and the elbow chart. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- main layout: picture + side panel ---------- */
    .km { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .km { grid-template-columns: minmax(0, 1fr) 330px; } }
    .km-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .km h2 { font-size: 1.12rem; margin-bottom: 4px; }
    .km-stage { display: flex; flex-direction: column; gap: 12px; }
    .km:fullscreen { background: var(--bg); padding: 16px; overflow: auto; align-content: start; }
    .km:-webkit-full-screen { background: var(--bg); padding: 16px; overflow: auto; }

    /* stats strip */
    .km-stats { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-end; }
    .stat { display: flex; flex-direction: column; min-width: 4.2rem; }
    .stat .lbl, .phase-box .lbl { font-size: .8rem; font-weight: 700; color: var(--muted); line-height: 1.3; }
    .stat .num { font-size: 1.55rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }
    .phase-box { margin-inline-start: auto; display: flex; flex-direction: column; gap: 4px; }
    .phases { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .phase { padding: 4px 11px; border-radius: 999px; border: 2px solid var(--border); font-weight: 700; font-size: .88rem; color: var(--muted); background: var(--surface); white-space: nowrap; }
    .phase.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .phase.done { border-color: var(--success); background: var(--success-soft); color: var(--text); }
    .phase-arrow { color: var(--muted); font-weight: 700; }
    [dir="rtl"] .phase-arrow { display: inline-block; transform: scaleX(-1); }

    /* the board */
    .board-wrap { display: flex; justify-content: center; }
    #board { display: block; width: min(100%, calc(100vh - 290px)); min-width: min(100%, 280px); aspect-ratio: 1 / 1; height: auto;
      border-radius: 12px; border: 1px solid var(--border); touch-action: none; cursor: crosshair; background: var(--surface); }
    #board.erase { cursor: cell; }
    .km:fullscreen #board { width: min(100%, calc(100vh - 210px)); }

    /* controls */
    .km-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .km-ctrl .btn-lg { padding-inline: 18px; }
    #step { min-width: 11.5rem; }
    #run { min-width: 7.5rem; transition: none; }
    #run[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .km-ctrl2 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .km-ctrl2 .lbl { font-size: .85rem; color: var(--muted); font-weight: 700; }
    .km-ctrl2 .seg button { min-height: 38px; padding: 6px 12px; }
    .km-ctrl2 .push { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .km-msg { margin: 0; min-height: 3.3em; font-weight: 600; display: flex; align-items: center; }
    .km-msg[data-code="done"] { border-color: var(--success); background: var(--success-soft); }
    .km-msg[data-code="need"] { border-color: var(--warning); background: var(--warning-soft); }
    .km-msg[data-code="assign"] { border-color: var(--accent); background: var(--accent-soft); }

    /* data presets */
    .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
    .ds-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 7px; border: 2px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; line-height: 1.25; min-height: 40px; text-align: center; }
    .ds-btn:hover { background: var(--surface-2); }
    .ds-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .ds-btn canvas { width: 52px; height: 52px; border-radius: 8px; background: var(--surface-2); display: block; }
    .sub-lbl { font-size: .86rem; color: var(--muted); font-weight: 700; margin: 0 0 5px; }
    .seg.full { display: flex; }
    .seg.full button { flex: 1 1 0; min-height: 40px; }
    .count-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* settings */
    .stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stepper .btn { width: 44px; height: 44px; padding: 0; font-size: 1.35rem; }
    .stepper output { min-width: 1.6em; text-align: center; font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .k-dots { display: flex; gap: 4px; flex-wrap: wrap; }
    .k-dots span { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
    .checks { display: flex; flex-direction: column; gap: 4px; }
    .checks .check { min-height: 36px; font-size: .92rem; }
    .hint { color: var(--muted); font-size: .84rem; margin: 6px 0 0; font-weight: 400; }

    /* results */
    .km-results { margin-top: 16px; align-items: start; }
    .km-results h2 { font-size: 1.12rem; margin-bottom: 4px; }
    .km-results h3 { font-size: 1rem; margin: 6px 0 2px; }
    .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-inline-end: 6px; flex: none; }
    #groups td { vertical-align: middle; }
    #groups td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #groups .gname { white-space: nowrap; font-weight: 700; }
    #groups input { min-width: 9rem; }
    .chart { display: block; width: 100%; border-radius: 10px; background: var(--surface); }
    #history { height: 150px; }
    #elbow { height: 240px; cursor: pointer; touch-action: manipulation; }
    .elbow-out { font-weight: 600; margin: 0; }
    .elbow-out[data-stale="true"] { color: var(--warning); }
    details.nums summary { cursor: pointer; font-weight: 600; color: var(--primary); }
    details.nums .table { margin-top: 8px; }

    /* learn + quiz */
    .learn-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .learn-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
    .learn-box h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .learn-box p { margin: 0; font-size: .94rem; }
    .learn-box code { direction: ltr; unicode-bidi: isolate; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; font-size: .88em; overflow-wrap: anywhere; }
    .quiz-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .quiz-q { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); }
    .quiz-q .q { font-weight: 700; margin-bottom: 8px; }
    .quiz-q .opts { display: flex; flex-direction: column; gap: 6px; }
    .quiz-q .opt { justify-content: flex-start; text-align: start; white-space: normal; font-weight: 500; }
    .quiz-q .opt.right { background: var(--success-soft); border-color: var(--success); }
    .quiz-q .opt.picked-wrong { background: var(--danger-soft); border-color: var(--danger); }
    .quiz-q .why { margin: 8px 0 0; font-size: .9rem; }
    .help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    .help li { margin-bottom: 6px; }
    .help summary { cursor: pointer; font-weight: 700; }
    .page-sec { margin-top: 16px; }

    @media (max-width: 560px) {
      .km-stage.card, .km-side .card { padding: 12px; }
      #step { min-width: 0; flex: 1 1 100%; }
      #run, #new-start { flex: 1 1 0; }
      .phase-box { margin-inline-start: 0; flex-basis: 100%; }
      .stat .num { font-size: 1.35rem; }
      #groups input { min-width: 7rem; }
    }

    @media print {
      .km { display: block; }
      .km-side, .km-ctrl, .km-ctrl2, #quiz, .help, #elbow-btn, #use-k { display: none !important; }
      #board { width: 12cm !important; min-width: 0; }
      .km-results { display: block; }
      .km-results .card { margin-bottom: 12px; }
      .chart { max-width: 15cm; }
      details.nums { display: block; }
      .learn-box { break-inside: avoid; border: 1px solid #bbb; }
      #groups input { border: 0; padding: 0; }
      .print-head { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="print-only print-head"><h2 class="mb0" data-i18n="app_title"></h2><p class="mb0" id="print-sum"></p></div>

    <div class="km" id="km">
      <!-- ============ the board ============ -->
      <section class="card km-stage" aria-labelledby="board-h">
        <h2 id="board-h" class="mb0" hidden data-i18n="board_title"></h2>
        <div class="km-stats">
          <div class="stat"><span class="lbl" data-i18n="stat_round"></span><span class="num" id="round" data-value="0">0</span></div>
          <div class="stat" data-i18n-title="inertia_tip"><span class="lbl" data-i18n="stat_inertia"></span><span class="num" id="inertia" data-value="">–</span></div>
          <div class="stat"><span class="lbl" data-i18n="stat_points"></span><span class="num" id="npoints" data-value="0">0</span></div>
          <div class="phase-box">
            <span class="lbl" id="next-lbl" data-i18n="next_step"></span>
            <div class="phases" role="group" aria-labelledby="next-lbl">
              <span class="phase" id="ph-assign" data-i18n="phase_assign"></span>
              <span class="phase-arrow" aria-hidden="true">→</span>
              <span class="phase" id="ph-update" data-i18n="phase_update"></span>
            </div>
          </div>
        </div>

        <div class="board-wrap"><canvas id="board" role="img"></canvas></div>

        <div class="km-ctrl no-print">
          <button type="button" class="btn btn-primary btn-lg" id="step"></button>
          <button type="button" class="btn btn-lg" id="run" aria-pressed="false"><span aria-hidden="true" id="run-ico">▶</span> <span id="run-txt"></span></button>
          <button type="button" class="btn btn-lg" id="new-start" data-i18n-title="new_start_tip"><span aria-hidden="true">🎲</span> <span data-i18n="new_start"></span></button>
        </div>
        <div class="km-ctrl2 no-print">
          <span class="lbl" id="speed-lbl" data-i18n="speed"></span>
          <div class="seg" id="speed" role="group" aria-labelledby="speed-lbl">
            <button type="button" data-speed="slow" data-i18n="speed_slow"></button>
            <button type="button" data-speed="normal" data-i18n="speed_normal"></button>
            <button type="button" data-speed="fast" data-i18n="speed_fast"></button>
          </div>
          <div class="push">
            <button type="button" class="btn btn-sm" id="fs-btn"><span aria-hidden="true">⛶</span> <span data-i18n="fullscreen"></span></button>
            <button type="button" class="btn btn-sm" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
          </div>
        </div>
        <p class="callout km-msg" id="msg" aria-live="polite"></p>
      </section>

      <!-- ============ side panel ============ -->
      <aside class="km-side">
        <section class="card stack" aria-labelledby="data-h">
          <h2 id="data-h" data-i18n="data_title"></h2>
          <div class="ds-grid" id="ds-grid" role="group" aria-labelledby="data-h">
            <button type="button" class="ds-btn" id="ds-blobs3" data-ds="blobs3"><canvas width="104" height="104" aria-hidden="true"></canvas><span data-i18n="ds_blobs3"></span></button>
            <button type="button" class="ds-btn" id="ds-blobs5" data-ds="blobs5"><canvas width="104" height="104" aria-hidden="true"></canvas><span data-i18n="ds_blobs5"></span></button>
            <button type="button" class="ds-btn" id="ds-ring" data-ds="ring"><canvas width="104" height="104" aria-hidden="true"></canvas><span data-i18n="ds_ring"></span></button>
            <button type="button" class="ds-btn" id="ds-random" data-ds="random"><canvas width="104" height="104" aria-hidden="true"></canvas><span data-i18n="ds_random"></span></button>
            <button type="button" class="ds-btn" id="ds-customers" data-ds="customers"><canvas width="104" height="104" aria-hidden="true"></canvas><span data-i18n="ds_customers"></span></button>
          </div>
          <p class="callout small mb0" id="cust-note" hidden></p>
          <div>
            <p class="sub-lbl" id="tool-lbl" data-i18n="tool_title"></p>
            <div class="seg full" id="tools" role="group" aria-labelledby="tool-lbl">
              <button type="button" id="tool-add" data-tool="add"><span aria-hidden="true">➕</span> <span data-i18n="tool_add"></span></button>
              <button type="button" id="tool-erase" data-tool="erase"><span aria-hidden="true">🧽</span> <span data-i18n="tool_erase"></span></button>
            </div>
            <p class="hint" data-i18n="drag_tip"></p>
          </div>
          <div class="count-line">
            <span class="small muted" id="count-line"></span>
            <button type="button" class="btn btn-sm btn-danger" id="clear-pts" data-i18n="clear_all"></button>
          </div>
        </section>

        <section class="card stack" aria-labelledby="set-h">
          <h2 id="set-h" data-i18n="settings_title"></h2>
          <div>
            <p class="sub-lbl" id="k-lbl" data-i18n="k_label"></p>
            <div class="stepper" role="group" aria-labelledby="k-lbl">
              <button type="button" class="btn" id="k-minus" data-i18n-aria-label="k_less" data-i18n-title="k_less">−</button>
              <output id="k-val" aria-live="polite">3</output>
              <button type="button" class="btn" id="k-plus" data-i18n-aria-label="k_more" data-i18n-title="k_more">+</button>
              <span class="k-dots" id="k-dots" aria-hidden="true"></span>
            </div>
          </div>
          <div>
            <p class="sub-lbl" id="init-lbl" data-i18n="init_label"></p>
            <div class="seg full" id="init" role="group" aria-labelledby="init-lbl">
              <button type="button" id="init-random" data-init="random" data-i18n="init_random"></button>
              <button type="button" id="init-pp" data-init="pp" data-i18n="init_pp"></button>
            </div>
            <p class="hint" id="init-hint"></p>
          </div>
          <div class="checks">
            <label class="check"><input type="checkbox" id="opt-regions"> <span data-i18n="show_regions"></span></label>
            <label class="check"><input type="checkbox" id="opt-lines"> <span data-i18n="show_lines"></span></label>
            <label class="check"><input type="checkbox" id="opt-trails"> <span data-i18n="show_trails"></span></label>
          </div>
          <div><button type="button" class="btn btn-sm btn-danger" id="reset-all"><span aria-hidden="true">↺</span> <span data-i18n="reset_all"></span></button></div>
        </section>
      </aside>
    </div>

    <!-- ============ results ============ -->
    <div class="grid-2 km-results">
      <section class="card stack" aria-labelledby="groups-h">
        <h2 id="groups-h" data-i18n="groups_title"></h2>
        <p class="small muted mb0" id="groups-empty" data-i18n="groups_empty"></p>
        <div class="scroll-x"><table class="table" id="groups"></table></div>
        <p class="small muted mb0" data-i18n="names_hint"></p>
        <h3 data-i18n="history_title"></h3>
        <canvas id="history" class="chart" role="img" data-i18n-aria-label="history_title"></canvas>
      </section>

      <section class="card stack" aria-labelledby="elbow-h">
        <h2 id="elbow-h" data-i18n="elbow_title"></h2>
        <p class="small mb0" data-i18n="elbow_desc"></p>
        <div class="row">
          <button type="button" class="btn btn-accent" id="elbow-btn"><span aria-hidden="true">📉</span> <span data-i18n="elbow_btn"></span></button>
          <button type="button" class="btn btn-primary" id="use-k" hidden></button>
        </div>
        <canvas id="elbow" class="chart" role="img" data-i18n-aria-label="elbow_title"></canvas>
        <p class="elbow-out" id="elbow-out" aria-live="polite"></p>
        <p class="tiny muted mb0" id="elbow-tip" data-i18n="elbow_click" hidden></p>
        <details class="nums" id="elbow-nums" hidden>
          <summary data-i18n="show_numbers"></summary>
          <div class="scroll-x"><table class="table" id="elbow-table"></table></div>
        </details>
      </section>
    </div>

    <!-- ============ learn ============ -->
    <section class="card stack page-sec" aria-labelledby="learn-h">
      <h2 id="learn-h" data-i18n="learn_title"></h2>
      <div class="learn-grid">
        <div class="learn-box"><h3><span aria-hidden="true">🏷️</span> <span data-i18n="l1_t"></span></h3><p data-i18n-html="l1"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🔁</span> <span data-i18n="l2_t"></span></h3><p data-i18n-html="l2"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">📏</span> <span data-i18n="l3_t"></span></h3><p data-i18n-html="l3"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🔢</span> <span data-i18n="l4_t"></span></h3><p data-i18n-html="l4"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🎲</span> <span data-i18n="l5_t"></span></h3><p data-i18n-html="l5"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">⚠️</span> <span data-i18n="l6_t"></span></h3><p data-i18n-html="l6"></p></div>
        <div class="learn-box"><h3><span aria-hidden="true">🛒</span> <span data-i18n="l7_t"></span></h3><p data-i18n-html="l7"></p></div>
      </div>
    </section>

    <!-- ============ quiz ============ -->
    <section class="card stack page-sec" id="quiz" aria-labelledby="quiz-h">
      <div class="row spread">
        <h2 id="quiz-h" class="mb0" data-i18n="quiz_title"></h2>
        <div class="row">
          <span class="badge primary" id="quiz-score" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="quiz-again" data-i18n="try_again"></button>
        </div>
      </div>
      <div class="quiz-list" id="quiz-list"></div>
    </section>

    <details class="card help page-sec">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n-html="tip1"></li>
        <li data-i18n-html="tip2"></li>
        <li data-i18n-html="tip3"></li>
        <li data-i18n-html="tip4"></li>
        <li data-i18n-html="tip5"></li>
        <li data-i18n-html="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="kmeans.js"></script>
  <script src="app.js"></script>
</body>
</html>
