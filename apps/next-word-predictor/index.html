<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next-Word Predictor · AI Pathshala</title>
  <meta name="description" content="See how AI language models predict the next word: train a tiny model on a story and watch it write. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    .intro-row { align-items: flex-start; margin-bottom: 14px; }
    .intro-row .edu-intro { flex: 1 1 320px; margin: 0; }
    #app > .card + .card, #app > .card + .main-grid, #app > .main-grid + .card { margin-top: 16px; }
    .main-grid { align-items: stretch; }
    .peek-h { margin-top: 22px !important; }
    .peek { max-width: 820px; }
    .card h2 { display: flex; align-items: center; gap: 10px; }
    .step-no { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.05rem; flex: none; }
    .train-split { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); }
    @media (max-width: 860px) { .train-split { grid-template-columns: minmax(0, 1fr); } }
    .lbl { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
    .seg.big button { padding: 9px 16px; min-height: 42px; font-size: .95rem; }
    .seg.num button { min-width: 48px; font-size: 1.05rem; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; min-width: 0; }
    .stat b { display: block; font-size: 1.65rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .stat span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
    .stat .tiny { margin-top: 2px; }
    #train-text { min-height: 230px; font-size: 1rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tok { padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-weight: 600; }
    .tok.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .tok.skip { text-decoration: line-through; opacity: .8; }
    .tok.unk { border: 2px dashed var(--danger); }
    .start-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .start-row input { flex: 1 1 100px; min-width: 0; font-size: 1.1rem; }
    .start-row .btn { white-space: nowrap; }
    .start-row .icon-btn { width: 44px; padding: 0; font-size: 1.05rem; }
    .cands { display: flex; flex-direction: column; gap: 8px; }
    .cand { display: grid; grid-template-columns: minmax(6rem, 38%) minmax(0, 1fr) 3.6rem; align-items: center; gap: 10px; width: 100%;
      text-align: start; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px;
      padding: 7px 12px; font: inherit; cursor: pointer; min-height: 50px; }
    .cand:hover, .cand:focus-visible { border-color: var(--primary); background: var(--primary-soft); }
    .cand-word { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
    .cand-w { font-weight: 800; font-size: 1.15rem; }
    .cand-word small { display: block; font-weight: 500; font-size: .76rem; color: var(--muted); }
    .cand-bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .cand-bar > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .25s; }
    .cand:first-child .cand-bar > span { background: var(--accent); }
    .cand-pct { font-weight: 800; text-align: end; font-variant-numeric: tabular-nums; }
    .range-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .range-ends { display: flex; justify-content: space-between; gap: 8px; }
    .output { font-size: 1.25rem; line-height: 2.15; min-height: 7rem; background: var(--surface-2); border-radius: var(--radius-sm);
      padding: 12px 14px; overflow-wrap: anywhere; }
    .w { padding: 1px 4px; border-radius: 6px; border-bottom: 3px solid transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .w-start { color: var(--muted); }
    .p-high { background: color-mix(in srgb, var(--success) 20%, transparent); border-bottom-color: var(--success); }
    .p-mid { background: color-mix(in srgb, var(--c7) 20%, transparent); border-bottom-color: var(--c7); }
    .p-low { background: color-mix(in srgb, var(--warning) 22%, transparent); border-bottom-color: var(--warning); }
    .p-rare { background: color-mix(in srgb, var(--danger) 20%, transparent); border-bottom-color: var(--danger); }
    .sent-new { outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: .85rem; align-items: center; }
    .legend .w { line-height: 1.9; }
    .legend .sent-new { padding: 0 6px; }
    .inside-grid .panel h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; }
    .inside-grid .panel p { margin: 0; }
    .peek td.n { text-align: end; font-variant-numeric: tabular-nums; width: 5rem; }
    .peek td.arrow { color: var(--muted); width: 1.5rem; text-align: center; }
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 1.1rem; min-height: 32px; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.3em; }
    details.card li + li { margin-top: 8px; }
    .edu-fullscreen-on .output { font-size: 1.7rem; }
    .edu-fullscreen-on .cand-w { font-size: 1.5rem; }
    .edu-fullscreen-on .start-row input { font-size: 1.5rem; }
    @media (max-width: 560px) {
      .output { font-size: 1.12rem; }
      .stat b { font-size: 1.35rem; }
      .cand { grid-template-columns: minmax(5rem, 42%) minmax(0, 1fr) 3.2rem; gap: 8px; padding: 7px 10px; }
    }
    @media print {
      .main-grid { grid-template-columns: 1fr 1fr; }
      .output, .stat, .panel { background: none !important; border: 1px solid #bbb; }
      .cand { break-inside: avoid; }
      #train-print { white-space: pre-wrap; font-size: .85rem; }
      details.card { display: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="row spread intro-row">
      <p class="edu-intro" data-i18n="intro"></p>
      <div class="row no-print">
        <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
        <button type="button" class="btn btn-sm" id="fs-btn" data-i18n="fullscreen"></button>
        <button type="button" class="btn btn-sm btn-danger" id="reset-btn" data-i18n="reset"></button>
      </div>
    </div>

    <!-- 1. Train -->
    <section class="card stack" id="train-card">
      <h2><span class="step-no" aria-hidden="true">1</span><span data-i18n="step1"></span></h2>
      <div class="split train-split">
        <div class="stack">
          <div class="no-print">
            <span class="lbl" id="src-lbl" data-i18n="src_label"></span>
            <div class="seg big" role="group" aria-labelledby="src-lbl">
              <button type="button" id="src-sample" data-i18n="src_sample"></button>
              <button type="button" id="src-custom" data-i18n="src_custom"></button>
            </div>
            <p class="muted small mb0" id="src-note" style="margin-top:6px"></p>
          </div>
          <div>
            <span class="lbl" id="mem-lbl" data-i18n="mem_label"></span>
            <div class="seg num no-print" role="group" aria-labelledby="mem-lbl">
              <button type="button" id="n-0">0</button>
              <button type="button" id="n-1">1</button>
              <button type="button" id="n-2">2</button>
              <button type="button" id="n-3">3</button>
            </div>
            <p class="muted small mb0" id="n-hint" style="margin-top:6px"></p>
          </div>
          <div class="stats" aria-live="polite">
            <div class="stat"><b id="stat-words">0</b><span data-i18n="stat_words"></span></div>
            <div class="stat"><b id="stat-vocab">0</b><span data-i18n="stat_vocab"></span></div>
            <div class="stat"><b id="stat-ngrams">0</b><span data-i18n="stat_ngrams"></span><span class="tiny" id="stat-ngrams-sub"></span></div>
          </div>
          <p class="callout warning small mb0" id="need-text" hidden></p>
        </div>
        <div class="stack">
          <label for="train-text" class="lbl" data-i18n="train_label"></label>
          <textarea id="train-text" class="no-i18n no-print" rows="9" spellcheck="false" data-i18n-placeholder="train_ph"></textarea>
          <div id="train-print" class="print-only no-i18n"></div>
          <div class="row no-print">
            <button type="button" class="btn btn-primary" id="train-btn" data-i18n="train_btn"></button>
            <button type="button" class="btn" id="open-btn" data-i18n="open_txt"></button>
            <button type="button" class="btn btn-ghost" id="clear-text" data-i18n="clear"></button>
          </div>
        </div>
      </div>
    </section>

    <div class="grid-2 main-grid">
      <!-- 2. Predict -->
      <section class="card stack" id="predict-card">
        <h2><span class="step-no" aria-hidden="true">2</span><span data-i18n="step2"></span></h2>
        <div>
          <label for="start-input" class="lbl" data-i18n="start_label"></label>
          <div class="start-row">
            <input type="text" id="start-input" class="no-i18n" autocomplete="off" spellcheck="false" data-i18n-placeholder="start_ph">
            <button type="button" class="btn no-print" id="undo-btn" data-i18n="undo"></button>
            <button type="button" class="btn no-print icon-btn" id="clear-start" data-i18n-aria-label="clear" data-i18n-title="clear">✕</button>
          </div>
        </div>
        <div class="row">
          <span class="small muted" data-i18n="looks_at"></span>
          <div class="chips no-i18n" id="ctx-chips"></div>
        </div>
        <p class="small mb0" id="ctx-note" aria-live="polite"></p>
        <div class="row spread">
          <h3 class="mb0" data-i18n="top5"></h3>
          <button type="button" class="btn btn-accent btn-sm no-print" id="pick-btn" data-i18n="ai_pick"></button>
        </div>
        <p class="muted small mb0 no-print" data-i18n="tap_hint"></p>
        <div class="cands no-i18n" id="cands" aria-live="polite"></div>
        <p class="muted small mb0" id="explain"></p>
      </section>

      <!-- 3. Auto-write -->
      <section class="card stack" id="write-card">
        <h2><span class="step-no" aria-hidden="true">3</span><span data-i18n="step3"></span></h2>
        <p class="muted small mb0" data-i18n="cont_hint"></p>
        <div class="no-print">
          <div class="range-head"><label for="len" id="len-label"></label></div>
          <input type="range" id="len" min="5" max="80" step="1">
        </div>
        <div class="no-print">
          <div class="range-head"><label for="temp" id="temp-label"></label></div>
          <input type="range" id="temp" min="0" max="2" step="0.1">
          <div class="range-ends small muted"><span data-i18n="temp_safe"></span><span data-i18n="temp_wild"></span></div>
        </div>
        <div class="row no-print">
          <button type="button" class="btn btn-primary btn-lg" id="write-btn" data-i18n="write_btn"></button>
          <button type="button" class="btn" id="speak-btn" data-i18n="speak_btn"></button>
          <button type="button" class="btn" id="copy-btn" data-i18n="copy"></button>
        </div>
        <div class="output no-i18n" id="output" aria-live="polite"></div>
        <div class="legend">
          <span class="muted" data-i18n="legend"></span>
          <span class="w p-high" data-i18n="p_high"></span>
          <span class="w p-mid" data-i18n="p_mid"></span>
          <span class="w p-low" data-i18n="p_low"></span>
          <span class="w p-rare" data-i18n="p_rare"></span>
          <span class="sent-new" data-i18n="sent_new"></span>
        </div>
        <p class="callout small mb0" id="sent-summary" hidden></p>
        <p class="muted small mb0" id="top-rate"></p>
      </section>
    </div>

    <!-- inside -->
    <section class="card stack" id="inside-card">
      <h2 data-i18n="inside"></h2>
      <div class="grid-3 inside-grid">
        <div class="panel"><h3><span aria-hidden="true">🧮</span><span data-i18n="inside_1t"></span></h3><p data-i18n="inside_1"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🎲</span><span data-i18n="inside_2t"></span></h3><p data-i18n="inside_2"></p></div>
        <div class="panel"><h3><span aria-hidden="true">🧠</span><span data-i18n="inside_3t"></span></h3><p data-i18n="inside_3"></p></div>
      </div>
      <div class="grid-2">
        <div class="callout"><h3 data-i18n="llm_t"></h3><p class="mb0" data-i18n="llm_1"></p></div>
        <div class="callout warning"><h3 data-i18n="hallu_t"></h3><p class="mb0" id="hallu-text"></p></div>
      </div>
      <h3 class="mb0 peek-h" data-i18n="peek_t"></h3>
      <div class="scroll-x">
        <table class="table peek">
          <thead><tr><th data-i18n="peek_after"></th><th aria-hidden="true"></th><th data-i18n="peek_next"></th><th data-i18n="peek_times"></th></tr></thead>
          <tbody id="peek-body" class="no-i18n"></tbody>
        </table>
      </div>
    </section>

    <details class="card" id="help">
      <summary data-i18n="help_t"></summary>
      <ul>
        <li data-i18n="tip_1"></li>
        <li data-i18n="tip_2"></li>
        <li data-i18n="tip_3"></li>
        <li data-i18n="tip_4"></li>
        <li data-i18n="tip_5"></li>
        <li data-i18n="tip_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
