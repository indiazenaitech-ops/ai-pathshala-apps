<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Noise Meter · AI Pathshala</title>
  <meta name="description" content="Free live noise meter for classrooms: big gauge, emoji face, bouncing balls and a quiet challenge with stars. Nothing is recorded. Works offline.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- layout ---------- */
    .nm-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; margin-bottom: 16px; }
    @media (min-width: 980px) { .nm-layout { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); } }
    .nm-lower { margin-bottom: 16px; align-items: start; }
    .nm-help { margin-bottom: 14px; }
    .nm-help summary { cursor: pointer; font-size: 1.05rem; padding: 2px 0; }
    .nm-help ul { margin: 12px 0 0; padding-inline-start: 22px; }
    .nm-help li { margin-bottom: 8px; }
    .nm-help p { margin: 12px 0 0; }
    .nm-help h3.nm-sub { margin: 16px 0 8px; }
    :root[lang="ur"] .nm-num, :root[lang="ur"] .nm-tile b, :root[lang="ur"] .nm-val, :root[lang="ur"] .nm-jar-num { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }

    /* ---------- stage (the part children look at) ---------- */
    .nm-stage { display: flex; flex-direction: column; gap: 10px; text-align: center; border-width: 2px;
      transition: background-color .35s, border-color .35s; }
    .nm-stage[data-zone="green"] { border-color: var(--success); background: color-mix(in srgb, var(--success-soft) 40%, var(--surface)); }
    .nm-stage[data-zone="yellow"] { border-color: var(--warning); background: color-mix(in srgb, var(--warning-soft) 65%, var(--surface)); }
    .nm-stage[data-zone="red"] { border-color: var(--danger); background: color-mix(in srgb, var(--danger-soft) 75%, var(--surface)); }
    .nm-stage-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .nm-stage-top .seg button { min-height: 38px; }
    @media (max-width: 560px) {
      .nm-stage-top .seg { order: 3; width: 100%; flex-wrap: nowrap; }
      .nm-stage-top .seg button { flex: 1 1 0; min-width: 0; }
    }
    .nm-status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: .92rem; color: var(--muted); }
    .nm-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
    .nm-stage[data-state="live"] .nm-dot { background: var(--success); box-shadow: 0 0 0 0 var(--success); animation: nm-pulse 1.6s infinite; }
    .nm-stage[data-state="live"] .nm-status { color: var(--text); }
    .nm-stage[data-state="wait"] .nm-dot { background: var(--warning); }
    @keyframes nm-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

    .nm-face-row { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nm-face { font-size: clamp(3.6rem, 13vw, 6rem); line-height: 1.1; transition: transform .2s; }
    .nm-stage.nm-alert .nm-face { animation: nm-wobble .5s ease-in-out infinite alternate; }
    @keyframes nm-wobble { from { transform: rotate(-8deg) scale(1.05); } to { transform: rotate(8deg) scale(1.1); } }
    .nm-face-label { font-size: clamp(1.15rem, 3.2vw, 1.55rem); font-weight: 800; min-height: 1.6em; line-height: 1.3; }
    .nm-face-label[data-k="face_loud"], .nm-face-label[data-k="face_alert"] { color: var(--danger); }
    :root[lang="ur"] .nm-face-label { line-height: 2.1; margin-top: 6px; }
    :root[lang="ur"] .nm-tile span, :root[lang="ur"] .nm-chline, :root[lang="ur"] .nm-presets .chip { line-height: 1.9; }

    .nm-meter-view svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
    .nm-arc { fill: none; stroke-width: 22; }
    .nm-arc.g { stroke: var(--success); }
    .nm-arc.y { stroke: var(--warning); }
    .nm-arc.r { stroke: var(--danger); }
    .nm-tick { stroke: var(--muted); stroke-width: 2; }
    .nm-thmark { stroke: var(--text); stroke-width: 4; stroke-linecap: round; }
    .nm-scale { fill: var(--muted); font: 700 13px system-ui, "Segoe UI", sans-serif; }
    #nm-needle line { stroke: var(--text); stroke-width: 6; stroke-linecap: round; }
    #nm-needle circle { fill: var(--text); }
    .nm-num { font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin-top: -4px; }
    .nm-unit { color: var(--muted); font-size: .9rem; }

    .nm-balls-view canvas { display: block; width: 100%; height: clamp(230px, 44vh, 420px); border-radius: var(--radius-sm);
      background: var(--surface-2); }
    .nm-balls-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; font-weight: 700; }
    .nm-balls-foot b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }

    .nm-strip { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
    .nm-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 18px; background: var(--surface);
      border: 1px solid var(--border); font-weight: 700; line-height: 1.3; }
    .nm-pill b { font-size: 1.25rem; line-height: 1; font-variant-numeric: tabular-nums; }
    .nm-chstrip { flex-direction: column; align-items: stretch; border-radius: 14px; min-width: min(100%, 280px); padding: 8px 14px; }
    .nm-chstrip .progress { height: 9px; }
    .nm-chstrip .progress > span { background: var(--accent); transition: width .3s linear; }
    .nm-stars { font-size: 1.45rem; letter-spacing: 2px; line-height: 1.3; }
    .nm-stars .off { filter: grayscale(1); opacity: .28; }
    .nm-chline { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; font-weight: 600; }
    .nm-banner { font-weight: 700; text-align: start; }
    .nm-actions { display: flex; justify-content: center; }
    .nm-mic { min-width: min(100%, 300px); font-size: 1.2rem; min-height: 56px; }
    .nm-msg { text-align: start; }
    .nm-hint { margin: 0; }
    .nm-privacy { margin: 0; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--muted); text-align: start; }

    .nm-stage.nm-flash { animation: nm-flash .45s ease-in-out 6 alternate; }
    @keyframes nm-flash { from { box-shadow: inset 0 0 0 0 var(--danger); } to { box-shadow: inset 0 0 0 14px var(--danger); background: var(--danger-soft); } }

    /* ---------- full screen (real or pseudo) ---------- */
    .nm-stage.nm-big { border-radius: 0; border-width: 0; padding: 2vh clamp(16px, 4vw, 56px); overflow: auto; justify-content: safe center; gap: 1.2vh; }
    .nm-stage.nm-pseudo { position: fixed; inset: 0; z-index: 300; }
    body.nm-noscroll { overflow: hidden; }
    .nm-big .nm-face { font-size: clamp(4rem, 13vh, 10rem); }
    .nm-big .nm-face-label { font-size: clamp(1.4rem, 4.2vh, 3rem); }
    .nm-big .nm-meter-view svg { max-width: none; width: 100%; height: auto; max-height: 38vh; }
    .nm-big .nm-num { font-size: clamp(2.8rem, 10vh, 7.5rem); }
    .nm-big .nm-balls-view canvas { height: 42vh; }
    .nm-big .nm-pill { font-size: clamp(1rem, 2.3vh, 1.5rem); }
    .nm-big .nm-stars { font-size: clamp(1.5rem, 4vh, 2.8rem); }
    .nm-big .nm-hint, .nm-big .nm-privacy, .nm-big .nm-msg { display: none; }
    .nm-big .nm-mic { min-height: 46px; font-size: 1.05rem; }
    /* landscape projector / smartboard: face + counters on one side, meter on the other */
    @media (orientation: landscape) {
      .nm-stage.nm-big { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); column-gap: 4vw; row-gap: 1.5vh;
        grid-template-rows: auto 1fr auto auto auto; grid-template-areas: "top top" "face vis" "strip vis" "banner vis" "act act";
        align-content: safe center; align-items: center; }
      .nm-big .nm-stage-top { grid-area: top; }
      .nm-big .nm-face-row { grid-area: face; align-self: end; }
      .nm-big .nm-visual { grid-area: vis; }
      .nm-big .nm-strip { grid-area: strip; flex-direction: column; }
      .nm-big .nm-banner { grid-area: banner; }
      .nm-big .nm-actions { grid-area: act; }
      .nm-big .nm-face { font-size: clamp(5rem, 22vh, 14rem); }
      .nm-big .nm-face-label { font-size: clamp(1.6rem, 5.2vh, 3.6rem); }
      .nm-big .nm-meter-view svg { max-height: 54vh; }
      .nm-big .nm-num { font-size: clamp(3rem, 13vh, 9rem); }
      .nm-big .nm-balls-view canvas { height: 62vh; }
    }

    /* ---------- settings ---------- */
    .nm-settings h2, .nm-challenge h2, .nm-session h2 { font-size: 1.15rem; }
    .nm-presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .nm-presets .chip { justify-content: flex-start; min-height: 44px; border-radius: 12px; text-align: start; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
    .nm-presets .chip .nm-th { margin-inline-start: auto; font-variant-numeric: tabular-nums; opacity: .8; font-size: .8rem; }
    .nm-val { font-variant-numeric: tabular-nums; color: var(--primary); white-space: nowrap; }
    .nm-settings .field label { display: flex; justify-content: space-between; gap: 10px; }
    .nm-checks { display: flex; flex-wrap: wrap; gap: 10px 22px; }
    .nm-checks .check { min-height: 40px; }

    /* ---------- challenge + session ---------- */
    .nm-chrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .nm-chrow select { min-width: 110px; }
    .nm-jar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nm-jar-num { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
    .nm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
    .nm-tile { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 11px; min-width: 0; }
    .nm-tile b { display: block; font-size: 1.45rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
    .nm-tile span { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
    .nm-zonebar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .nm-zonebar span { display: block; height: 100%; transition: width .4s; }
    .nm-zonebar .g, .nm-key.g::before { background: var(--success); }
    .nm-zonebar .y, .nm-key.y::before { background: var(--warning); }
    .nm-zonebar .r, .nm-key.r::before { background: var(--danger); }
    .nm-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .86rem; }
    .nm-key::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
    .nm-chart-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .nm-chart-wrap canvas { display: block; width: 100%; height: 120px; }
    .nm-axis { display: flex; justify-content: space-between; margin-top: 4px; }
    .nm-sub { font-size: .95rem; margin: 4px 0 0; }

    /* ---------- decibel table ---------- */
    .nm-dbcell { display: flex; align-items: center; gap: 8px; }
    .nm-dbbar { flex: none; height: 10px; border-radius: 99px; background: var(--c7); width: calc((100% - 70px) * var(--w) / 80); }
    .nm-dbbar.hot { background: var(--danger); }
    .nm-db td:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; width: 50%; }

    @media (max-width: 420px) {
      .nm-stage { padding: 12px; }
      .nm-presets { grid-template-columns: minmax(0, 1fr); gap: 6px; }
      .nm-presets .chip { min-height: 42px; }
    }

    /* ---------- print: a one-page session report ---------- */
    .nm-print-head { margin-bottom: 12px; }
    @media print {
      .nm-stage, .nm-settings, .nm-help, .edu-intro, .nm-chrow, #nm-jar-empty { display: none !important; }
      .nm-layout { display: block; margin: 0; }
      .nm-lower { display: block; }
      .nm-lower > .card { margin-bottom: 12px; }
      .nm-print-head.print-only { display: block !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="print-only nm-print-head">
      <h2 data-i18n="report_title"></h2>
      <p id="nm-print-meta"></p>
    </div>

    <div class="nm-layout">
      <!-- the meter the class looks at -->
      <section class="card nm-stage" id="nm-stage" data-zone="idle" data-state="idle">
        <div class="nm-stage-top">
          <span class="nm-status" role="status"><span class="nm-dot" aria-hidden="true"></span><span id="nm-status-txt"></span></span>
          <div class="seg" id="nm-view" role="group" data-i18n-aria-label="view_label">
            <button type="button" data-view="meter" aria-pressed="true"><span aria-hidden="true">🎯</span> <span data-i18n="view_meter"></span></button>
            <button type="button" data-view="balls" aria-pressed="false"><span aria-hidden="true">⚽</span> <span data-i18n="view_balls"></span></button>
          </div>
          <button type="button" class="btn btn-sm" id="nm-fs"><span aria-hidden="true">⛶</span> <span id="nm-fs-txt"></span></button>
        </div>

        <div class="nm-face-row">
          <div class="nm-face" id="nm-face" aria-hidden="true">🎙️</div>
          <div class="nm-face-label" id="nm-face-label" aria-live="polite"></div>
        </div>

        <div class="nm-visual">
          <div class="nm-meter-view" id="nm-meter-view">
            <svg id="nm-gauge" viewBox="0 0 240 144" role="img" data-i18n-aria-label="level_label">
              <path class="nm-arc g" id="nm-arc-g"></path>
              <path class="nm-arc y" id="nm-arc-y"></path>
              <path class="nm-arc r" id="nm-arc-r"></path>
              <g id="nm-ticks"></g>
              <line class="nm-thmark" id="nm-thmark" x1="0" y1="0" x2="0" y2="0"></line>
              <g id="nm-needle" transform="rotate(-90 120 120)">
                <line x1="120" y1="120" x2="120" y2="38"></line>
                <circle cx="120" cy="120" r="10"></circle>
              </g>
              <text class="nm-scale" x="24" y="142" text-anchor="middle">0</text>
              <text class="nm-scale" x="120" y="9" text-anchor="middle">50</text>
              <text class="nm-scale" x="216" y="142" text-anchor="middle">100</text>
            </svg>
            <div class="nm-num" id="nm-level">0</div>
            <div class="nm-unit" data-i18n="level_label"></div>
          </div>
          <div class="nm-balls-view" id="nm-balls-view" hidden>
            <canvas id="nm-balls" aria-hidden="true"></canvas>
            <div class="nm-balls-foot"><span data-i18n="balls_hint"></span><b id="nm-level2">0</b></div>
          </div>
        </div>

        <div class="nm-strip">
          <div class="nm-pill" id="nm-counter"><span aria-hidden="true">🔔</span> <span data-i18n="times_loud"></span> <b id="nm-count">0</b></div>
          <div class="nm-pill nm-chstrip" id="nm-chstrip" data-sec="0" hidden>
            <div class="nm-stars" id="nm-stars" aria-hidden="true"></div>
            <div class="nm-chline"><span id="nm-stars-txt"></span><span id="nm-ch-next"></span></div>
            <div class="progress"><span id="nm-ch-bar" style="width:0%"></span></div>
          </div>
        </div>

        <div class="callout success nm-banner" id="nm-banner" role="status" hidden></div>

        <div class="nm-actions">
          <button type="button" class="btn btn-lg btn-primary nm-mic" id="nm-mic"><span id="nm-mic-ico" aria-hidden="true">🎤</span> <span id="nm-mic-txt"></span></button>
        </div>
        <div class="callout warning nm-msg" id="nm-msg" role="alert" hidden></div>
        <p class="nm-hint muted small" id="nm-perm" data-i18n="perm_hint"></p>
        <p class="nm-privacy small"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>
      </section>

      <!-- teacher settings -->
      <section class="card stack nm-settings" id="nm-settings">
        <h2>⚙️ <span data-i18n="set_title"></span></h2>
        <div class="field">
          <label id="nm-act-lbl"><span data-i18n="activity"></span><span class="nm-val" id="nm-act-val"></span></label>
          <div class="nm-presets" id="nm-presets" role="group" aria-labelledby="nm-act-lbl"></div>
        </div>
        <div class="field">
          <label for="nm-threshold"><span data-i18n="threshold"></span><b class="nm-val" id="nm-threshold-val"></b></label>
          <input type="range" id="nm-threshold" min="20" max="95" step="5">
          <span class="hint" data-i18n="threshold_hint"></span>
        </div>
        <div class="field">
          <label for="nm-sens"><span data-i18n="sens"></span><b class="nm-val" id="nm-sens-val"></b></label>
          <input type="range" id="nm-sens" min="1" max="20" step="1">
          <span class="hint" data-i18n="sens_hint"></span>
        </div>
        <div class="panel stack">
          <button type="button" class="btn" id="nm-calib"><span aria-hidden="true">🎚️</span> <span data-i18n="calib"></span></button>
          <p class="small muted mb0" id="nm-calib-msg" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="nm-delay"><span data-i18n="delay"></span><b class="nm-val" id="nm-delay-val"></b></label>
          <input type="range" id="nm-delay" min="1" max="10" step="1">
        </div>
        <div class="nm-checks">
          <label class="check"><input type="checkbox" id="nm-sound"> <span data-i18n="opt_sound"></span></label>
          <label class="check"><input type="checkbox" id="nm-flash"> <span data-i18n="opt_flash"></span></label>
        </div>
        <div class="field" id="nm-device-field" hidden>
          <label for="nm-device" data-i18n="mic_pick"></label>
          <select id="nm-device" class="no-i18n"></select>
        </div>
      </section>
    </div>

    <div class="grid-2 nm-lower">
      <!-- quiet challenge -->
      <section class="card stack nm-challenge" id="nm-challenge">
        <h2>⭐ <span data-i18n="ch_title"></span></h2>
        <p class="small muted mb0" data-i18n="ch_desc"></p>
        <div class="nm-chrow">
          <label for="nm-goal" data-i18n="ch_goal"></label>
          <select id="nm-goal"></select>
          <button type="button" class="btn btn-accent" id="nm-ch-btn"></button>
        </div>
        <p class="small mb0" id="nm-ch-status" aria-live="polite"></p>
        <div class="panel nm-jar">
          <div>
            <div class="small muted" data-i18n="jar"></div>
            <div class="nm-jar-num"><span aria-hidden="true">⭐</span> <span id="nm-jar">0</span></div>
          </div>
          <button type="button" class="btn btn-sm btn-danger" id="nm-jar-empty" data-i18n="jar_empty"></button>
        </div>
      </section>

      <!-- this session -->
      <section class="card stack nm-session" id="nm-session">
        <div>
          <h2 class="mb0">📊 <span data-i18n="sess_title"></span></h2>
          <div class="muted small" id="nm-s-when"></div>
        </div>
        <div class="nm-stats">
          <div class="nm-tile"><b id="nm-s-time">0:00</b><span data-i18n="s_time"></span></div>
          <div class="nm-tile"><b id="nm-s-alerts">0</b><span data-i18n="times_loud"></span></div>
          <div class="nm-tile"><b id="nm-s-avg">–</b><span data-i18n="s_avg"></span></div>
          <div class="nm-tile"><b id="nm-s-peak">–</b><span data-i18n="s_peak"></span></div>
          <div class="nm-tile"><b id="nm-s-stars">0</b><span data-i18n="s_stars"></span></div>
        </div>
        <div class="nm-zonebar" id="nm-zonebar" aria-hidden="true"><span class="g" id="nm-zb-g"></span><span class="y" id="nm-zb-y"></span><span class="r" id="nm-zb-r"></span></div>
        <div class="nm-legend" id="nm-legend"></div>
        <h3 class="nm-sub" data-i18n="chart_title"></h3>
        <div>
          <div class="nm-chart-wrap"><canvas id="nm-chart" aria-hidden="true"></canvas></div>
          <div class="nm-axis tiny muted"><span data-i18n="chart_ago"></span><span data-i18n="chart_now"></span></div>
        </div>
        <div class="row no-print">
          <button type="button" class="btn" id="nm-print"><span aria-hidden="true">🖨️</span> <span data-i18n="print_report"></span></button>
          <button type="button" class="btn btn-danger" id="nm-new"><span aria-hidden="true">↺</span> <span data-i18n="new_session"></span></button>
        </div>
      </section>
    </div>

    <details class="card nm-help">
      <summary><b data-i18n="how_title"></b></summary>
      <ul>
        <li data-i18n-html="tip1"></li>
        <li data-i18n-html="tip2"></li>
        <li data-i18n-html="tip3"></li>
        <li data-i18n-html="tip4"></li>
        <li data-i18n-html="tip5"></li>
        <li data-i18n-html="tip6"></li>
      </ul>
    </details>

    <details class="card nm-help">
      <summary><b data-i18n="about_title"></b></summary>
      <p data-i18n="about_p1"></p>
      <p class="callout warning" data-i18n="about_p2"></p>
      <h3 class="nm-sub" data-i18n="db_title"></h3>
      <div class="scroll-x">
        <table class="table nm-db">
          <thead><tr><th data-i18n="db_src"></th><th data-i18n="db_level"></th></tr></thead>
          <tbody>
            <tr><td data-i18n="db_breath"></td><td><div class="nm-dbcell"><span class="nm-dbbar" style="--w:10"></span><span>10 dB</span></div></td></tr>
            <tr><td data-i18n="db_whisper"></td><td><div class="nm-dbcell"><span class="nm-dbbar" style="--w:30"></span><span>30 dB</span></div></td></tr>
