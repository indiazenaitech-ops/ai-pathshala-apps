<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGPA &amp; Percentage Calculator · AI Pathshala</title>
  <meta name="description" content="Free CGPA, SGPA, percentage and grade calculator for Indian students: CBSE 9.5 rule and 9-point grades, university SGPA/CGPA with credits, percentage formulas (×10, ×9.5, VTU, Mumbai), 4.0 GPA bands, best-of-five and 'what do I need in the final exam'. Offline, private, 12 languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* numbers, formulas and grades are always written left to right, also in Urdu */
    .num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
    :root[lang="ur"] .num, :root[lang="ur"] .ltr, :root[lang="ur"] input.num { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }
    input.num { text-align: start; }
    .privacy { display: flex; gap: 8px; align-items: flex-start; margin: -6px 0 14px; padding: 8px 12px; border-radius: var(--radius-sm);
      background: var(--success-soft); color: var(--text); font-size: .92rem; font-weight: 600; max-width: 75ch; }

    /* tabs */
    .cg-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
    .cg-tabs button {
      font: inherit; font-weight: 700; font-size: .95rem; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; min-height: 50px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 1.2;
    }
    .cg-tabs button:hover { background: var(--surface-2); }
    .cg-tabs button[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .cg-tabs .ic { font-size: 1.2rem; }
    @media (max-width: 620px) { .cg-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cg-tabs button { font-size: .9rem; } }

    .cg-panel > * + * { margin-top: 16px; }
    .cg-two { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 900px) { .cg-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
    .card h2 { font-size: 1.15rem; }
    .card h3 { font-size: 1rem; margin: 0 0 6px; }
    .cg-fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-items: end; }
    .cg-fields.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cg-fields input, .cg-fields select { width: 100%; }
    .field > label { font-weight: 600; font-size: .9rem; }
    .cg-in-big { font-size: 1.35rem; font-weight: 700; min-height: 52px; }
    .cg-unit { display: flex; align-items: stretch; min-width: 0; }
    .cg-unit input { flex: 1 1 auto; min-width: 0; border-start-end-radius: 0; border-end-end-radius: 0; }
    .cg-unit .u { display: grid; place-items: center; padding-inline: 10px; font-weight: 700; color: var(--muted); background: var(--surface-2);
      border: 1px solid var(--border); border-inline-start: 0; border-start-end-radius: 10px; border-end-end-radius: 10px; white-space: nowrap; }

    /* results */
    .cg-res { background: color-mix(in srgb, var(--primary-soft) 55%, var(--surface)); border: 1px solid color-mix(in srgb, var(--primary) 30%, var(--border));
      border-radius: var(--radius-sm); padding: 12px 14px; min-width: 0; }
    .cg-res-lbl { font-weight: 700; color: var(--muted); font-size: .88rem; display: block; }
    .cg-big { font-size: clamp(1.7rem, 5vw, 2.5rem); font-weight: 800; line-height: 1.15; color: var(--primary); overflow-wrap: anywhere; }
    .cg-mid { font-size: 1.25rem; font-weight: 800; }
    .cg-grade { display: inline-grid; place-items: center; min-width: 58px; padding: 4px 12px; border-radius: 12px; background: var(--primary); color: var(--primary-ink);
      font-weight: 800; font-size: 1.5rem; line-height: 1.3; }
    .cg-grade.fail { background: var(--danger); color: #fff; }
    .cg-grade.sm { font-size: 1rem; min-width: 42px; padding: 2px 8px; border-radius: 8px; }
    .cg-pair { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .cg-formula { display: inline-block; font-family: var(--mono); font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px 10px; }
    .cg-status { border-inline-start: 4px solid var(--primary); background: var(--primary-soft); padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 600; }
    .cg-status[data-status="possible"] { border-color: var(--success); background: var(--success-soft); }
    .cg-status[data-status="done"] { border-color: var(--info); background: var(--info-soft); }
    .cg-status[data-status="impossible"] { border-color: var(--danger); background: var(--danger-soft); }
    .cg-status[data-status="bad_input"] { border-color: var(--warning); background: var(--warning-soft); }
    .cg-status .cg-big { font-size: clamp(1.5rem, 4.5vw, 2.1rem); }
    .cg-bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; display: flex; direction: ltr; }
    .cg-bar span { display: block; height: 100%; }
    .cg-bar .have { background: var(--c1); } .cg-bar .need { background: var(--c2); }
    .cg-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; margin-top: 6px; }
    .cg-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 6px; }

    /* tables */
    .cg-table { width: 100%; }
    .cg-table th { position: static; white-space: nowrap; font-size: .85rem; }
    .cg-table td { vertical-align: middle; }
    .cg-table input, .cg-table select { min-height: 40px; width: 100%; }
    .cg-table td.v, .cg-table th.v { text-align: end; white-space: nowrap; }
    .cg-table td.c, .cg-table th.c { text-align: center; }
    .cg-table tr.sum td { font-weight: 800; border-bottom: 0; background: var(--surface-2); }
    .cg-table tr.drop td { opacity: .55; text-decoration: line-through; }
    .cg-table tr.drop td:last-child, .cg-table tr.drop td:first-child { text-decoration: none; }
    .cg-table tr:hover td { background: transparent; }
    .cg-table .w-name { min-width: 150px; } .cg-table .w-num { width: 88px; } .cg-table .w-sel { width: 104px; } .cg-table .w-del { width: 48px; }
    .cg-table input[type="number"] { min-width: 72px; } .cg-table select { min-width: 88px; } .cg-table input[type="text"] { min-width: 130px; }
    @media (max-width: 560px) { .cg-table th, .cg-table td { padding: 6px 6px; } .cg-table .w-name { min-width: 130px; } }
    .cg-del { width: 40px; height: 40px; min-height: 40px; padding: 0; color: var(--danger); font-size: 1.05rem; }
    .cg-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .cg-chips .chip { min-height: 40px; }
    .cg-chips .chip.add { border-style: dashed; }
    .cg-scale9 td.g { font-weight: 800; }
    .cg-approx { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warning-soft); color: var(--warning); }
    .cg-note { margin: 0; font-size: .88rem; color: var(--muted); }
    .cg-conv-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); }
    .cg-conv-grid .cg-res { text-align: center; }
    .cg-src { outline: 2px solid var(--accent); }
    details.card summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    details.card ul { margin: 10px 0 0; padding-inline-start: 1.3em; display: grid; gap: 8px; }
    details.card dl { margin: 10px 0 0; display: grid; gap: 6px; }
    details.card dt { font-weight: 700; } details.card dd { margin: 0 0 4px; color: var(--muted); }
    .cg-foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 16px; }
    .cg-hint-row { font-size: .85rem; color: var(--muted); }

    /* print: only the generated result sheet */
    #print-area { display: none; }
    @media print {
      #app > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; color: #000; font-size: 12pt; }
      #print-area h1 { font-size: 18pt; margin: 0 0 4pt; }
      #print-area h2 { font-size: 13pt; margin: 12pt 0 4pt; }
      #print-area .pa-head { display: flex; justify-content: space-between; gap: 12pt; flex-wrap: wrap; border-bottom: 2px solid #000; padding-bottom: 6pt; margin-bottom: 8pt; }
      #print-area .pa-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2pt 16pt; margin-bottom: 8pt; }
      #print-area table { width: 100%; border-collapse: collapse; margin: 4pt 0 8pt; }
      #print-area th, #print-area td { border: 1px solid #999; padding: 4pt 6pt; text-align: start; vertical-align: top; }
      #print-area td.v, #print-area th.v { text-align: end; white-space: nowrap; }
      #print-area tr.sum td { font-weight: 800; background: #f0f0f0; }
      #print-area .pa-boxes { display: flex; gap: 12pt; flex-wrap: wrap; margin: 8pt 0; }
      #print-area .pa-box { border: 2px solid #000; border-radius: 6pt; padding: 6pt 12pt; min-width: 110pt; }
      #print-area .pa-box b { display: block; font-size: 18pt; }
      #print-area .pa-box span { font-size: 9pt; color: #333; }
      #print-area .pa-sign { margin-top: 36pt; display: flex; justify-content: space-between; gap: 24pt; }
      #print-area .pa-sign div { border-top: 1px solid #000; padding-top: 4pt; min-width: 140pt; text-align: center; font-size: 10pt; }
      #print-area .pa-small { font-size: 9pt; color: #444; margin-top: 10pt; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <p class="privacy no-print"><span aria-hidden="true">🔒</span><span data-i18n="privacy"></span></p>

    <nav class="cg-tabs no-print" role="tablist" id="tabs" data-i18n-aria-label="tabs_label">
      <button type="button" role="tab" id="tab-cbse" data-tab="cbse" aria-controls="p-cbse"><span class="ic" aria-hidden="true">🏫</span><span data-i18n="tab_cbse"></span></button>
      <button type="button" role="tab" id="tab-uni" data-tab="uni" aria-controls="p-uni"><span class="ic" aria-hidden="true">🎓</span><span data-i18n="tab_uni"></span></button>
      <button type="button" role="tab" id="tab-conv" data-tab="conv" aria-controls="p-conv"><span class="ic" aria-hidden="true">🔁</span><span data-i18n="tab_conv"></span></button>
      <button type="button" role="tab" id="tab-marks" data-tab="marks" aria-controls="p-marks"><span class="ic" aria-hidden="true">📝</span><span data-i18n="tab_marks"></span></button>
    </nav>

    <!-- ============================== 1. CBSE ============================== -->
    <section id="p-cbse" role="tabpanel" aria-labelledby="tab-cbse" class="cg-panel" hidden>
      <div class="cg-two">
        <div class="card stack">
          <h2 data-i18n="cb_title"></h2>
          <div class="cg-fields two">
            <div class="field">
              <label for="cb-cgpa" data-i18n="cb_cgpa_label"></label>
              <input id="cb-cgpa" class="num cg-in-big" type="number" inputmode="decimal" step="0.01" min="0" max="10" dir="ltr" autocomplete="off">
            </div>
            <div class="cg-res" aria-live="polite">
              <span class="cg-res-lbl" data-i18n="res_pct"></span>
              <div class="cg-big num" id="cb-cgpa-pct">–</div>
              <span class="tiny muted ltr">CGPA × 9.5</span>
            </div>
          </div>
          <div class="cg-fields two">
            <div class="field">
              <label for="cb-pct" data-i18n="cb_pct_label"></label>
              <input id="cb-pct" class="num cg-in-big" type="number" inputmode="decimal" step="0.01" min="0" max="100" dir="ltr" autocomplete="off">
            </div>
            <div class="cg-res" aria-live="polite">
              <span class="cg-res-lbl" data-i18n="res_cgpa"></span>
              <div class="cg-big num" id="cb-pct-cgpa">–</div>
              <span class="tiny muted ltr">% ÷ 9.5</span>
            </div>
          </div>
          <p class="cg-note" data-i18n="cb_note"></p>
        </div>

        <div class="card stack">
          <h2 data-i18n="cb_grade_title"></h2>
          <div class="cg-fields two">
            <div class="field">
              <label for="cb-marks" data-i18n="cb_marks_label"></label>
              <input id="cb-marks" class="num cg-in-big" type="number" inputmode="decimal" step="0.5" min="0" dir="ltr" autocomplete="off">
            </div>
            <div class="field">
              <label for="cb-max" data-i18n="cb_max_label"></label>
              <input id="cb-max" class="num" type="number" inputmode="numeric" step="1" min="1" max="1000" dir="ltr" autocomplete="off">
            </div>
          </div>
          <div class="cg-res row" aria-live="polite" style="gap:16px">
            <span class="cg-grade ltr" id="cb-grade">–</span>
            <div>
              <span class="cg-res-lbl" data-i18n="res_gp"></span>
              <div class="cg-mid num" id="cb-gp">–</div>
            </div>
            <div>
              <span class="cg-res-lbl" data-i18n="res_subject_pct"></span>
              <div class="cg-mid num" id="cb-subject-pct">–</div>
            </div>
          </div>
          <div class="scroll-x">
            <table class="table cg-table cg-scale9" id="cb-scale">
              <thead><tr><th data-i18n="col_grade"></th><th data-i18n="col_marks_range"></th><th class="v" data-i18n="col_gp"></th><th class="v" data-i18n="col_indicative_pct"></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card stack">
        <div class="row spread">
          <h2 class="mb0" data-i18n="cb_five_title"></h2>
          <div class="seg" id="cb-mode" role="group" data-i18n-aria-label="cb_mode_label">
            <button type="button" data-mode="marks" data-i18n="cb_mode_marks"></button>
            <button type="button" data-mode="grades" data-i18n="cb_mode_grades"></button>
          </div>
        </div>
        <div class="scroll-x">
          <table class="table cg-table" id="cb-five">
            <thead><tr><th class="w-name" data-i18n="col_subject"></th><th class="w-num" id="cb-five-h2"></th><th class="c" data-i18n="col_grade"></th><th class="v" data-i18n="col_gp"></th></tr></thead>
            <tbody id="cb-rows"></tbody>
          </table>
        </div>
        <div class="cg-pair" aria-live="polite">
          <div class="cg-res">
            <span class="cg-res-lbl" data-i18n="res_cgpa"></span>
            <div class="cg-big num" id="cb-overall">–</div>
            <span class="tiny muted" id="cb-overall-how"></span>
          </div>
          <div class="cg-res">
            <span class="cg-res-lbl" data-i18n="res_pct"></span>
            <div class="cg-big num" id="cb-overall-pct">–</div>
            <span class="tiny muted ltr">CGPA × 9.5</span>
          </div>
        </div>
      </div>

      <div class="card stack">
        <h2 data-i18n="tg_title"></h2>
        <p class="cg-note" data-i18n="tg_intro"></p>
        <div class="cg-fields">
          <div class="field"><label for="tg-done" data-i18n="tg_done"></label><input id="tg-done" class="num" type="number" inputmode="numeric" step="1" min="0" max="50" dir="ltr"></div>
          <div class="field"><label for="tg-avg" data-i18n="tg_avg"></label><div class="cg-unit"><input id="tg-avg" class="num" type="number" inputmode="decimal" step="0.1" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          <div class="field"><label for="tg-total" data-i18n="tg_total"></label><input id="tg-total" class="num" type="number" inputmode="numeric" step="1" min="1" max="50" dir="ltr"></div>
          <div class="field"><label for="tg-target" data-i18n="tg_target"></label><div class="cg-unit"><input id="tg-target" class="num" type="number" inputmode="decimal" step="0.1" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
        </div>
        <div class="cg-status" id="tg-status" data-status="" aria-live="polite">
          <span class="cg-res-lbl" id="tg-lbl"></span>
          <div class="cg-big num" id="tg-need">–</div>
          <p class="mb0 small" id="tg-text"></p>
        </div>
      </div>
    </section>

    <!-- ============================== 2. University ============================== -->
    <section id="p-uni" role="tabpanel" aria-labelledby="tab-uni" class="cg-panel" hidden>
      <div class="card stack">
        <h2 data-i18n="un_sem_title"></h2>
        <div class="cg-chips" id="sem-list" role="group" data-i18n-aria-label="un_sem_pick"></div>
        <div class="row" style="align-items:flex-end">
          <div class="field grow" style="max-width:320px"><label for="sem-name" data-i18n="un_sem_name"></label><input id="sem-name" class="no-i18n" type="text" maxlength="40" autocomplete="off"></div>
          <button type="button" class="btn btn-danger" id="sem-del">🗑 <span data-i18n="un_sem_delete"></span></button>
        </div>
        <div class="scroll-x">
          <table class="table cg-table" id="subj-table">
            <thead><tr><th class="w-name" data-i18n="col_subject"></th><th class="w-num" data-i18n="col_credits"></th><th class="w-sel" data-i18n="col_grade"></th><th class="v" data-i18n="col_gp"></th><th class="v" data-i18n="col_credit_points"></th><th class="w-del"></th></tr></thead>
            <tbody id="subj-rows"></tbody>
            <tfoot><tr class="sum"><td data-i18n="total"></td><td class="num" id="sem-credits">0</td><td></td><td></td><td class="v num" id="sem-points">0</td><td></td></tr></tfoot>
          </table>
        </div>
        <div class="row">
          <button type="button" class="btn" id="subj-add">＋ <span data-i18n="un_add_subject"></span></button>
          <span class="cg-hint-row" data-i18n="un_sgpa_how"></span>
          <span class="cg-hint-row" id="sem-scale-hint"></span>
        </div>
        <div class="cg-res" aria-live="polite">
          <span class="cg-res-lbl" id="sgpa-lbl"></span>
          <div class="cg-big num" id="sgpa">–</div>
          <span class="tiny muted ltr" id="sgpa-how"></span>
        </div>
      </div>

      <div class="cg-two">
        <div class="card stack">
          <h2 data-i18n="un_cgpa_title"></h2>
          <div class="scroll-x">
            <table class="table cg-table" id="cgpa-table">
              <thead><tr><th data-i18n="col_semester"></th><th class="v" data-i18n="col_credits"></th><th class="v" data-i18n="col_credit_points"></th><th class="v" data-i18n="col_sgpa"></th></tr></thead>
              <tbody id="cgpa-rows"></tbody>
            </table>
          </div>
          <div class="cg-res" aria-live="polite">
            <span class="cg-res-lbl" id="cgpa-lbl"></span>
            <div class="cg-big num" id="cgpa">–</div>
            <span class="tiny muted" id="cgpa-how"></span>
          </div>
          <button type="button" class="btn" id="sem-add">＋ <span data-i18n="un_add_sem"></span></button>
        </div>

        <div class="card stack">
          <h2 data-i18n="un_pct_title"></h2>
          <div class="field" id="formula-field">
            <label for="formula" data-i18n="un_formula_label"></label>
            <select id="formula"></select>
          </div>
          <div class="cg-fields two" id="custom-fields" hidden>
            <div class="field"><label for="f-a" class="ltr">a</label><input id="f-a" class="num" type="number" inputmode="decimal" step="0.01" dir="ltr"></div>
            <div class="field"><label for="f-b" class="ltr">b</label><input id="f-b" class="num" type="number" inputmode="decimal" step="0.01" dir="ltr"></div>
          </div>
          <div class="cg-res" aria-live="polite">
            <span class="cg-res-lbl" data-i18n="res_pct"></span>
            <div class="cg-big num" id="uni-pct">–</div>
            <div class="small" style="margin-top:6px"><span data-i18n="un_formula_used"></span> <span class="cg-formula ltr" id="uni-formula"></span></div>
            <p class="small mb0" id="uni-pct-note" style="margin-top:6px"></p>
          </div>
          <p class="callout warning small mb0" data-i18n="un_check_rule"></p>
        </div>
      </div>

      <div class="card stack">
        <div class="row spread">
          <h2 class="mb0" data-i18n="un_scale_title"></h2>
          <div class="seg" id="scale-preset" role="group" data-i18n-aria-label="un_scale_pick">
            <button type="button" id="scale-10" data-kind="10" data-i18n="un_scale_10"></button>
            <button type="button" id="scale-4" data-kind="4" data-i18n="un_scale_4"></button>
          </div>
        </div>
        <p class="cg-note" data-i18n="un_scale_note"></p>
        <div class="scroll-x">
          <table class="table cg-table" id="scale-table">
            <thead><tr><th data-i18n="col_grade_letter"></th><th class="w-num" data-i18n="col_gp"></th><th class="w-del"></th></tr></thead>
            <tbody id="scale-rows"></tbody>
          </table>
        </div>
        <div class="row">
          <button type="button" class="btn btn-sm" id="scale-add">＋ <span data-i18n="un_scale_add"></span></button>
          <button type="button" class="btn btn-sm" id="scale-reset">↺ <span data-i18n="un_scale_reset"></span></button>
        </div>
      </div>

      <div class="card stack">
        <h2 data-i18n="un_sheet_title"></h2>
        <div class="cg-fields">
          <div class="field"><label for="student-name" data-i18n="un_student"></label><input id="student-name" class="no-i18n" type="text" maxlength="60" autocomplete="off"></div>
          <div class="field"><label for="college-name" data-i18n="un_college"></label><input id="college-name" class="no-i18n" type="text" maxlength="80" autocomplete="off"></div>
          <div class="field"><label for="course-name" data-i18n="un_course"></label><input id="course-name" class="no-i18n" type="text" maxlength="60" autocomplete="off"></div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" id="print-sheet">🖨 <span data-i18n="un_print"></span></button>
          <button type="button" class="btn" id="csv-export">⬇ <span data-i18n="un_csv"></span></button>
        </div>
        <p class="cg-note" data-i18n="un_saved_note"></p>
      </div>
    </section>

    <!-- ============================== 3. Conversions ============================== -->
    <section id="p-conv" role="tabpanel" aria-labelledby="tab-conv" class="cg-panel" hidden>
      <div class="card stack">
        <h2 data-i18n="cv_title"></h2>
        <p class="cg-note" data-i18n="cv_intro"></p>
        <div class="cg-fields">
          <div class="field"><label for="cv-pct" data-i18n="cv_pct"></label><div class="cg-unit"><input id="cv-pct" class="num cg-in-big" type="number" inputmode="decimal" step="0.01" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          <div class="field"><label for="cv-cgpa" data-i18n="cv_cgpa"></label><div class="cg-unit"><input id="cv-cgpa" class="num cg-in-big" type="number" inputmode="decimal" step="0.01" min="0" max="10" dir="ltr"><span class="u ltr">/10</span></div></div>
          <div class="field"><label for="cv-gpa" data-i18n="cv_gpa"></label><div class="cg-unit"><input id="cv-gpa" class="num cg-in-big" type="number" inputmode="decimal" step="0.1" min="0" max="4" dir="ltr"><span class="u ltr">/4</span></div></div>
          <div class="field"><label for="cv-formula" data-i18n="un_formula_label"></label><select id="cv-formula"></select></div>
        </div>
        <div class="cg-fields two" id="cv-custom-fields" hidden>
          <div class="field"><label for="cv-a" class="ltr">a</label><input id="cv-a" class="num" type="number" inputmode="decimal" step="0.01" dir="ltr"></div>
          <div class="field"><label for="cv-b" class="ltr">b</label><input id="cv-b" class="num" type="number" inputmode="decimal" step="0.01" dir="ltr"></div>
        </div>
        <div class="cg-conv-grid" aria-live="polite">
          <div class="cg-res"><span class="cg-res-lbl" data-i18n="cv_pct"></span><div class="cg-big num" id="cv-out-pct">–</div><span class="tiny muted" id="cv-out-pct-note"></span></div>
          <div class="cg-res"><span class="cg-res-lbl" data-i18n="cv_cgpa"></span><div class="cg-big num" id="cv-out-cgpa">–</div><span class="tiny muted ltr" id="cv-out-cgpa-note"></span></div>
          <div class="cg-res"><span class="cg-res-lbl" data-i18n="cv_gpa"></span><div class="cg-big num" id="cv-out-gpa">–</div><span class="tiny muted" id="cv-out-gpa-note"></span></div>
          <div class="cg-res"><span class="cg-res-lbl" data-i18n="cv_letter"></span><div class="cg-big ltr" id="cv-out-letter">–</div><span class="cg-approx" data-i18n="approx"></span></div>
        </div>
        <p class="callout warning small mb0" data-i18n="cv_warn"></p>
      </div>
      <div class="card stack">
        <div class="row"><h2 class="mb0" data-i18n="cv_band_title"></h2><span class="cg-approx" data-i18n="approx"></span></div>
        <div class="scroll-x">
          <table class="table cg-table" id="band-table">
            <thead><tr><th data-i18n="cv_pct"></th><th data-i18n="cv_cgpa_band"></th><th class="v" data-i18n="cv_gpa"></th><th class="c" data-i18n="cv_letter"></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="cg-note" data-i18n="cv_band_note"></p>
      </div>
    </section>

    <!-- ============================== 4. Marks ============================== -->
    <section id="p-marks" role="tabpanel" aria-labelledby="tab-marks" class="cg-panel" hidden>
      <div class="card stack">
        <h2 data-i18n="mk_title"></h2>
        <div class="scroll-x">
          <table class="table cg-table" id="mk-table">
            <thead><tr><th class="w-name" data-i18n="col_subject"></th><th class="w-num" data-i18n="col_obtained"></th><th class="w-num" data-i18n="col_max"></th><th class="v" data-i18n="col_pct"></th><th class="w-del"></th></tr></thead>
            <tbody id="mk-rows"></tbody>
            <tfoot><tr class="sum"><td data-i18n="total"></td><td class="num" id="mk-obt">0</td><td class="num" id="mk-max">0</td><td class="v num" id="mk-pct-cell">–</td><td></td></tr></tfoot>
          </table>
        </div>
        <button type="button" class="btn" id="mk-add" style="align-self:start">＋ <span data-i18n="un_add_subject"></span></button>
        <div class="cg-pair" aria-live="polite">
          <div class="cg-res">
            <span class="cg-res-lbl" data-i18n="mk_all_pct"></span>
            <div class="cg-big num" id="mk-pct">–</div>
            <span class="tiny muted num" id="mk-pct-how"></span>
          </div>
          <div class="cg-res">
            <div class="field" style="margin-bottom:6px"><label for="mk-best" data-i18n="mk_best_label"></label><select id="mk-best"></select></div>
            <span class="cg-res-lbl" id="mk-best-lbl"></span>
            <div class="cg-big num" id="mk-best-pct">–</div>
            <span class="tiny muted num" id="mk-best-how"></span>
          </div>
        </div>
        <p class="cg-note" data-i18n="mk_best_note"></p>
      </div>

      <div class="cg-two">
        <div class="card stack">
          <h2 data-i18n="wt_title"></h2>
          <p class="cg-note" data-i18n="wt_intro"></p>
          <h3 data-i18n="wt_internal"></h3>
          <div class="cg-fields">
            <div class="field"><label for="wt-io" data-i18n="col_obtained"></label><input id="wt-io" class="num" type="number" inputmode="decimal" step="0.5" min="0" dir="ltr"></div>
            <div class="field"><label for="wt-im" data-i18n="col_max"></label><input id="wt-im" class="num" type="number" inputmode="decimal" step="1" min="1" dir="ltr"></div>
            <div class="field"><label for="wt-iw" data-i18n="wt_weight"></label><div class="cg-unit"><input id="wt-iw" class="num" type="number" inputmode="decimal" step="1" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          </div>
          <h3 data-i18n="wt_final"></h3>
          <div class="cg-fields">
            <div class="field"><label for="wt-fo" data-i18n="col_obtained"></label><input id="wt-fo" class="num" type="number" inputmode="decimal" step="0.5" min="0" dir="ltr"></div>
            <div class="field"><label for="wt-fm" data-i18n="col_max"></label><input id="wt-fm" class="num" type="number" inputmode="decimal" step="1" min="1" dir="ltr"></div>
            <div class="field"><label for="wt-fw" data-i18n="wt_weight"></label><div class="cg-unit"><input id="wt-fw" class="num" type="number" inputmode="decimal" step="1" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          </div>
          <div class="cg-res" aria-live="polite">
            <span class="cg-res-lbl" data-i18n="wt_overall"></span>
            <div class="cg-big num" id="wt-overall">–</div>
            <span class="tiny muted" id="wt-how"></span>
          </div>
        </div>

        <div class="card stack">
          <h2 data-i18n="fn_title"></h2>
          <p class="cg-note" data-i18n="fn_intro"></p>
          <h3 data-i18n="wt_internal"></h3>
          <div class="cg-fields">
            <div class="field"><label for="fn-io" data-i18n="col_obtained"></label><input id="fn-io" class="num" type="number" inputmode="decimal" step="0.5" min="0" dir="ltr"></div>
            <div class="field"><label for="fn-im" data-i18n="col_max"></label><input id="fn-im" class="num" type="number" inputmode="decimal" step="1" min="1" dir="ltr"></div>
            <div class="field"><label for="fn-iw" data-i18n="wt_weight"></label><div class="cg-unit"><input id="fn-iw" class="num" type="number" inputmode="decimal" step="1" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          </div>
          <h3 data-i18n="wt_final"></h3>
          <div class="cg-fields">
            <div class="field"><label for="fn-fm" data-i18n="col_max"></label><input id="fn-fm" class="num" type="number" inputmode="decimal" step="1" min="1" dir="ltr"></div>
            <div class="field"><label for="fn-fw" data-i18n="wt_weight"></label><div class="cg-unit"><input id="fn-fw" class="num" type="number" inputmode="decimal" step="1" min="1" max="100" dir="ltr"><span class="u">%</span></div></div>
            <div class="field"><label for="fn-target" data-i18n="fn_target"></label><div class="cg-unit"><input id="fn-target" class="num" type="number" inputmode="decimal" step="0.5" min="0" max="100" dir="ltr"><span class="u">%</span></div></div>
          </div>
          <div class="cg-status" id="fn-status" data-status="" aria-live="polite">
            <span class="cg-res-lbl" id="fn-lbl"></span>
            <div class="cg-big num" id="fn-need-pct">–</div>
            <p class="mb0 small" id="fn-text"></p>
            <div class="cg-bar" id="fn-bar" aria-hidden="true"><span class="have" id="fn-bar-have"></span><span class="need" id="fn-bar-need"></span></div>
            <div class="cg-legend"><span><i style="background:var(--c1)"></i><span data-i18n="fn_leg_have"></span></span><span><i style="background:var(--c2)"></i><span data-i18n="fn_leg_need"></span></span></div>
          </div>
        </div>
      </div>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="how_title"></summary>
      <ul>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
        <li data-i18n="how_6"></li>
      </ul>
    </details>
    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="words_title"></summary>
      <dl>
        <dt data-i18n="w_cgpa_t"></dt><dd data-i18n="w_cgpa_d"></dd>
        <dt data-i18n="w_sgpa_t"></dt><dd data-i18n="w_sgpa_d"></dd>
        <dt data-i18n="w_credit_t"></dt><dd data-i18n="w_credit_d"></dd>
        <dt data-i18n="w_gp_t"></dt><dd data-i18n="w_gp_d"></dd>
        <dt data-i18n="w_gpa_t"></dt><dd data-i18n="w_gpa_d"></dd>
      </dl>
    </details>

    <div class="cg-foot no-print">
      <button type="button" class="btn btn-danger" id="reset">↺ <span data-i18n="reset"></span></button>
      <span class="small muted" data-i18n="checked_note"></span>
    </div>

    <div id="print-area" aria-hidden="true"></div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
