<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seating Chart Maker · AI Pathshala</title>
  <meta name="description" content="Free classroom and exam seating planner: drag to swap, keep students apart, boy-girl alternate, mixed ability, A/B paper sets, desk slips. Works offline in 12 Indian languages.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style id="pageSize"></style>
  <style>
    #app .btn-sm, #app .seg button { min-height: 40px; }
    .topline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .topline .tabs { border-bottom: 0; margin-bottom: -1px; }
    .topline .tabs button { min-height: 46px; font-size: 1rem; }
    .pickers { display: flex; flex-wrap: wrap; gap: 8px 14px; padding-bottom: 8px; align-items: flex-end; }
    .pickers .field { flex: 1 1 11rem; }
    .pickers .inline { display: flex; gap: 6px; align-items: center; }
    .pickers select { min-width: 0; flex: 1 1 auto; max-width: 16rem; font-weight: 600; }
    @media (max-width: 760px) { .topline .tabs { width: 100%; } .topline .tabs button { flex: 1 1 0; } .pickers { width: 100%; } .pickers select { max-width: none; } }

    .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
    .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .side h2, .chart-card h2, .card h2 { font-size: 1.1rem; margin: 0 0 10px; }
    .num-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .num-row .field { flex: 1 1 7rem; }
    .num-row input { width: 100%; }

    .chart-card { min-width: 0; }
    .chart-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .chart-head h2 { margin: 0; }
    .room-scroll { overflow: auto; max-width: 100%; max-height: 72vh; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); padding: 10px; -webkit-overflow-scrolling: touch; }
    .board { text-align: center; font-weight: 700; padding: 8px; border-radius: 8px; background: var(--text); color: var(--bg); margin-bottom: 12px; min-width: max-content; }
    .room { display: grid; gap: 8px; width: max-content; min-width: 100%; }
    .room.exam { gap: 22px 26px; }
    .seat {
      position: relative; min-height: 64px; width: 100%; padding: 16px 6px 6px; border-radius: 10px; font: inherit; cursor: grab;
      border: 2px solid var(--border); background: var(--surface); color: var(--text); text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; touch-action: manipulation; user-select: none;
    }
    .seat.empty { border-style: dashed; color: var(--muted); background: transparent; cursor: pointer; }
    .seat .nm { font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; font-size: .95rem; }
    .seat .rl { font-size: .75rem; color: var(--muted); }
    .seat .no { position: absolute; top: 2px; inset-inline-start: 6px; font-size: .7rem; color: var(--muted); }
    .seat .st { position: absolute; top: 2px; inset-inline-end: 4px; font-size: .72rem; font-weight: 800; padding: 0 5px; border-radius: 6px; background: var(--primary-soft); color: var(--text); }
    .seat .st.B { background: var(--accent-soft); }
    .seat .ic { font-size: .75rem; }
    .seat.g-M { border-inline-start: 6px solid var(--c1); }
    .seat.g-F { border-inline-start: 6px solid var(--c2); }
    .seat.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
    .seat.bad { box-shadow: 0 0 0 3px var(--danger); }
    .seat.drop { background: var(--primary-soft); border-color: var(--primary); }
    .seat:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .ghost { position: fixed; z-index: 1000; pointer-events: none; padding: 8px 12px; border-radius: 10px; background: var(--primary); color: var(--primary-ink); font-weight: 700; box-shadow: var(--shadow-lg); transform: translate(-50%, -60%); }
    .chart-card:fullscreen { overflow: auto; padding: 20px; background: var(--bg); }
    .chart-card:fullscreen .room-scroll { max-height: none; }
    .chart-card:fullscreen .seat { min-height: 90px; }
    .chart-card:fullscreen .seat .nm { font-size: 1.35rem; }

    .unseated { margin-top: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chips button { min-height: 40px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .85rem; color: var(--muted); }
    .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-inline-end: 4px; }
    #warn:empty { display: none; }

    .stu-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .stu-table th, .stu-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: start; }
    .stu-table tbody tr { cursor: pointer; }
    .stu-table tbody tr:hover { background: var(--surface-2); }
    .stu-table td button { min-height: 36px; }
    textarea#names { width: 100%; min-height: 12rem; font-family: inherit; }
    .pairs { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
    .pairs li { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--surface-2); padding: 4px 4px 4px 10px; padding-inline: 10px 4px; border-radius: 8px; }
    .apart-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .apart-row .field { flex: 1 1 9rem; }
    details.help summary { cursor: pointer; font-weight: 700; }
    details.help ul { margin: 10px 0 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }
    .modal-form { display: flex; flex-direction: column; gap: 10px; min-width: min(80vw, 340px); }
    .checks { display: flex; flex-direction: column; gap: 6px; }

    /* ---------- print (black on white, never dark) ---------- */
    #printArea { display: none; }
    @media print {
      body > *:not(.edu-main):not(main) { display: none !important; }
      #app > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; color: #000; background: #fff; font-family: inherit; }
      #printArea * { color: #000 !important; background: #fff !important; border-color: #000 !important; box-shadow: none !important; }
      .pr-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 20px; margin-bottom: 6mm; font-size: 12pt; }
      .pr-head h1 { font-size: 18pt; margin: 0; }
      .pr-board { border: 2px solid #000; text-align: center; font-weight: 700; padding: 2mm; margin-bottom: 5mm; }
      .pr-room { display: grid; gap: 3mm; }
      .pr-room.exam { gap: 6mm; }
      .pr-seat { border: 1.5px solid #000; border-radius: 2mm; padding: 1.5mm; text-align: center; min-height: 14mm; display: flex; flex-direction: column; justify-content: center; break-inside: avoid; }
      .pr-seat .nm { font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
      .pr-seat .sm { font-size: 8pt; }
      .pr-seat.empty { border-style: dashed; }
      .slips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
      .slip { border: 1px dashed #000; padding: 4mm; min-height: 34mm; break-inside: avoid; font-size: 10pt; }
      .slip .big { font-size: 20pt; font-weight: 800; }
      .slip .nm { font-size: 14pt; font-weight: 700; }
      .labels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; }
      .label { border: 1px dashed #000; padding: 6mm 4mm; min-height: 30mm; text-align: center; break-inside: avoid; display: flex; flex-direction: column; justify-content: center; }
      .label .nm { font-size: 24pt; font-weight: 800; overflow-wrap: anywhere; }
      .pr-table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
      .pr-table th, .pr-table td { border: 1px solid #000; padding: 1.8mm 2mm; text-align: start; }
      .pr-table td.sign { width: 35mm; }
      .pr-note { font-size: 9pt; margin-top: 4mm; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="topline">
      <div class="pickers">
        <label class="field"><span data-i18n="class_label"></span>
          <span class="inline"><select id="classSel" class="no-i18n"></select><button class="btn btn-sm" id="newClass" type="button">+ <span data-i18n="new_class"></span></button></span>
        </label>
        <label class="field"><span data-i18n="room_label"></span>
          <span class="inline"><select id="roomSel" class="no-i18n"></select><button class="btn btn-sm" id="newRoom" type="button">+ <span data-i18n="new_room"></span></button></span>
        </label>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabChart" data-tab="chart" data-i18n="tab_chart"></button>
        <button type="button" role="tab" id="tabStudents" data-tab="students" data-i18n="tab_students"></button>
      </div>
    </div>

    <p class="callout small" id="sampleNote" data-i18n="sample_note"></p>

    <!-- ===== chart view ===== -->
    <div id="viewChart" class="layout">
      <section class="card chart-card" id="chartCard">
        <div class="chart-head">
          <h2 data-i18n="chart_title"></h2>
          <div class="row">
            <button class="btn btn-sm" id="undoBtn" type="button">↶ <span data-i18n="undo"></span></button>
            <button class="btn btn-sm" id="fsBtn" type="button">⛶ <span data-i18n="fullscreen"></span></button>
          </div>
        </div>
        <p class="small muted" data-i18n="swap_help"></p>
        <div class="room-scroll" id="roomScroll">
          <div class="board" data-i18n="board_label"></div>
          <div class="room" id="room" role="group"></div>
        </div>
        <div class="unseated" id="unseatedBox" hidden>
          <strong data-i18n="unseated_title"></strong> <span class="small muted" data-i18n="unseated_help"></span>
          <div class="chips no-i18n" id="unseated"></div>
        </div>
        <div class="legend" id="legend"></div>
        <p class="small" id="status" aria-live="polite"></p>
        <div class="callout warning small" id="warn" aria-live="polite"></div>
      </section>

      <div class="side">
        <section class="card">
          <h2 data-i18n="arrange_title"></h2>
          <div class="stack">
            <label class="field"><span data-i18n="order_label"></span>
              <select id="orderSel">
                <option value="roll" data-i18n="ord_roll"></option>
                <option value="alpha" data-i18n="ord_alpha"></option>
                <option value="random" data-i18n="ord_random"></option>
                <option value="mixed" data-i18n="ord_mixed"></option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="optBoyGirl"> <span data-i18n="opt_boygirl"></span></label>
            <label class="check"><input type="checkbox" id="optFront"> <span data-i18n="opt_front"></span></label>
            <div class="row">
              <button class="btn btn-primary" id="arrangeBtn" type="button" data-i18n="arrange_btn"></button>
              <button class="btn" id="clearBtn" type="button" data-i18n="clear_seats"></button>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="room_title"></h2>
          <div class="stack">
            <label class="field"><span data-i18n="room_name"></span><input id="roomName" class="no-i18n" data-i18n-placeholder="room_name_ph"></label>
            <div class="field"><span data-i18n="layout_label"></span>
              <div class="seg" id="layoutSeg">
                <button type="button" data-lay="pairs" data-i18n="lay_pairs"></button>
                <button type="button" data-lay="rows" data-i18n="lay_rows"></button>
                <button type="button" data-lay="groups" data-i18n="lay_groups"></button>
                <button type="button" data-lay="ushape" data-i18n="lay_ushape"></button>
                <button type="button" data-lay="exam" data-i18n="lay_exam"></button>
              </div>
            </div>
            <div class="num-row">
              <label class="field"><span data-i18n="rows_label"></span><input type="number" id="rowsIn" min="1" max="20"></label>
              <label class="field"><span data-i18n="cols_label"></span><input type="number" id="colsIn" min="1" max="14"></label>
            </div>
            <p class="small muted" id="capacity"></p>
            <label class="check"><input type="checkbox" id="setsChk"> <span data-i18n="sets_label"></span></label>
            <p class="small muted" data-i18n="sets_hint"></p>
            <div><button class="btn btn-danger btn-sm" id="delRoom" type="button" data-i18n="delete_room"></button></div>
          </div>
        </section>

        <section class="card">
          <h2 data-i18n="print_title"></h2>
          <div class="row">
            <button class="btn" id="prChart" type="button" data-i18n="print_chart"></button>
            <button class="btn" id="prSlips" type="button" data-i18n="print_slips"></button>
            <button class="btn" id="prLabels" type="button" data-i18n="print_labels"></button>
            <button class="btn" id="prList" type="button" data-i18n="print_list"></button>
            <button class="btn" id="csvBtn" type="button" data-i18n="export_csv"></button>
            <button class="btn" id="copyBtn" type="button" data-i18n="copy_text"></button>
          </div>
          <p class="small muted" data-i18n="print_help"></p>
        </section>
      </div>
    </div>

    <!-- ===== students view ===== -->
    <div id="viewStudents" hidden>
      <div class="layout">
        <section class="card">
          <h2 data-i18n="students_title"></h2>
          <div class="stack">
            <label class="field"><span data-i18n="class_name"></span><input id="className" class="no-i18n" data-i18n-placeholder="class_name_ph"></label>
            <label class="field"><span data-i18n="names_label"></span>
              <textarea id="names" class="no-i18n" data-i18n-placeholder="names_ph" spellcheck="false"></textarea>
              <span class="hint" data-i18n="names_hint"></span>
            </label>
            <div class="row">
              <button class="btn btn-primary" id="useList" type="button" data-i18n="use_list"></button>
              <button class="btn" id="importCsv" type="button" data-i18n="import_csv"></button>
              <button class="btn" id="addStudent" type="button">+ <span data-i18n="add_student"></span></button>
              <button class="btn" id="loadSample" type="button" data-i18n="load_sample"></button>
            </div>
            <p class="small" id="stuCount" aria-live="polite"></p>
            <div class="scroll-x"><table class="stu-table" id="stuTable">
              <thead><tr><th>#</th><th data-i18n="col_name"></th><th data-i18n="col_roll"></th><th data-i18n="col_gender"></th><th data-i18n="col_marks"></th><th data-i18n="col_needs"></th></tr></thead>
              <tbody></tbody>
            </table></div>
            <div><button class="btn btn-danger btn-sm" id="delClass" type="button" data-i18n="delete_class"></button></div>
          </div>
        </section>
        <section class="card">
          <h2 data-i18n="apart_title"></h2>
          <p class="small muted" data-i18n="apart_hint"></p>
          <div class="apart-row">
            <label class="field"><span data-i18n="student_a"></span><select id="apartA" class="no-i18n"></select></label>
            <label class="field"><span data-i18n="student_b"></span><select id="apartB" class="no-i18n"></select></label>
            <button class="btn" id="addPair" type="button" data-i18n="add_pair"></button>
          </div>
          <ul class="pairs" id="pairs"></ul>
        </section>
      </div>
    </div>

    <details class="card help no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="help_1"></li><li data-i18n="help_2"></li><li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li><li data-i18n="help_5"></li><li data-i18n="help_6"></li>
      </ul>
    </details>
    <p class="small muted no-print">🔒 <span data-i18n="privacy_note"></span></p>
    <section class="card no-print">
      <h2 data-i18n="reset_title"></h2>
      <p class="small muted" data-i18n="reset_help"></p>
      <button class="btn btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
    </section>

    <div id="printArea" class="print-only"></div>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
