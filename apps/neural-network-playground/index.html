<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Network Playground · AI Pathshala</title>
  <meta name="description" content="Watch a tiny neural network learn to separate orange and blue dots. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    /* ---------- playground layout ---------- */
    /* phones: one column, picture first (column wrappers vanish via display: contents) */
    .nnp { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .nnp-col { display: contents; }
    .nnp-tool { order: 1; } .nnp-out { order: 2; } .nnp-chart { order: 3; } .nnp-data { order: 4; } .nnp-model { order: 5; } .nnp-net { order: 6; }
    /* tablets: settings | picture, then network + chart */
    @media (min-width: 760px) {
      .nnp { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-areas: "tool tool" "a c" "b b"; }
      .nnp-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .nnp-col > .card { order: 0; }
      .nnp-tool { grid-area: tool; }
      .nnp-col-a { grid-area: a; }
      .nnp-col-b { grid-area: b; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
      .nnp-col-c { grid-area: c; }
    }
    /* laptops, projectors, smartboards: three columns */
    @media (min-width: 1140px) {
      .nnp { grid-template-columns: 300px minmax(0, 1fr) minmax(360px, 480px); grid-template-areas: "tool tool tool" "a b c"; }
      .nnp-col-b { display: flex; align-items: stretch; }   /* cards fill the column width */
    }
    .nnp:fullscreen { background: var(--bg); padding: 16px; overflow: auto; align-content: start; }
    .nnp:-webkit-full-screen { background: var(--bg); padding: 16px; overflow: auto; }
    .nnp .card h2 { font-size: 1.1rem; margin-bottom: 10px; }
    .nnp .card { padding: 14px; }

    /* toolbar */
    .tool-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .tool-row .grow { flex: 1 1 auto; }
    .epoch-box { display: flex; flex-direction: column; align-items: flex-start; min-width: 7.5rem; padding-inline: 6px; }
    .epoch-box .lbl { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .epoch-box .num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    #play { min-width: 8.5rem; transition: none; }
    #play[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .speed-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .speed-wrap .lbl { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .seg button { min-height: 40px; }
    .coach { margin: 12px 0 0; font-weight: 600; min-height: 2.6em; display: flex; align-items: center; gap: 10px; }
    .coach .ico { font-size: 1.3rem; flex: none; }
    .coach[data-code="explode"], .coach[data-code="overfit"] { border-color: var(--danger); background: var(--danger-soft); }
    .coach[data-code="great"], .coach[data-code="great_draw"] { border-color: var(--success); background: var(--success-soft); }
    .coach[data-code="line"], .coach[data-code="linear"], .coach[data-code="big_lr"], .coach[data-code="slow"], .coach[data-code="stuck"], .coach[data-code="need_points"] { border-color: var(--warning); background: var(--warning-soft); }

    /* data sets */
    .ds-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); }
    .ds-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 7px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 600; line-height: 1.2; text-align: center; min-height: 40px; }
    .ds-btn:hover { background: var(--surface-2); }
    .ds-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
    .ds-btn canvas, .ds-btn .ds-ico { width: 52px; height: 52px; border-radius: 8px; display: block; }
    .ds-btn .ds-ico { display: grid; place-items: center; font-size: 1.7rem; background: var(--surface-2); }
    .draw-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; flex: none; }
    .sw-orange { background: var(--c2); }
    .sw-blue { background: var(--c7); }
    .slider-field label { display: flex; justify-content: space-between; gap: 8px; }
    .slider-field input[type="range"] { min-height: 32px; }
    .hint { color: var(--muted); font-size: .84rem; margin: 2px 0 0; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .checks .check { min-height: 36px; }

    /* model */
    .feat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .feat-chips .chip { min-height: 36px; font-family: var(--mono); font-size: .9rem; }
    .stepper { display: inline-flex; align-items: center; gap: 6px; }
    .stepper .btn { width: 40px; padding: 0; font-size: 1.2rem; }
    .stepper output { min-width: 1.6em; text-align: center; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .layer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
    .layer-row + .layer-row { margin-top: 6px; }
    .layer-row .lname { font-weight: 700; }
    .layer-row .unit { color: var(--muted); font-size: .85rem; }
    .two { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two select { width: 100%; }

    /* output */
    .out-wrap { position: relative; max-width: 560px; margin: 0 auto; }
    #out { width: 100%; aspect-ratio: 1 / 1; height: auto; display: block; border-radius: 10px; border: 1px solid var(--border); touch-action: manipulation; background: var(--surface); }
    #out.drawing { cursor: crosshair; touch-action: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: .85rem; color: var(--muted); }
    .legend .it { display: inline-flex; align-items: center; gap: 6px; }
    .line-sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; }
    .line-sw.dash { border-top-style: dashed; }
    .preview-bar { position: absolute; top: 8px; inset-inline: 8px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 6px 10px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--accent); box-shadow: var(--shadow); font-weight: 600; font-size: .9rem; pointer-events: none; }
    .preview-bar .btn { pointer-events: auto; }
    .stats { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; min-width: 0; }
    .stat .lbl { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; line-height: 1.25; }
    .stat .val { display: block; font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
    #chart { width: 100%; height: 130px; display: block; }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .chart-head h2 { margin: 0 !important; }
    .inspector { margin-top: 10px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
    .inspector .ins-name { font-weight: 700; font-size: .92rem; }
    .inspector .formula { text-align: start; margin: 6px 0; overflow-wrap: anywhere; font-size: .9rem; }

    /* network diagram (kept left-to-right in every language, like a picture) */
    .net-wrap { position: relative; width: 100%; min-height: 220px; margin-top: 10px; }
    .net-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .net-wrap svg text { fill: var(--muted); font-family: var(--font); font-weight: 600; }
    .net-wrap svg .feat-lbl { fill: var(--text); font-family: var(--mono); font-weight: 700; }
    .link { fill: none; stroke-linecap: round; }
    .link.pos { stroke: var(--c7); }
    .link.neg { stroke: var(--c2); }
    .nn-node { position: absolute; padding: 0; border: 2px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; overflow: hidden; display: block; }
    .nn-node canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
    .nn-node:hover { border-color: var(--primary); }
    .nn-node.is-out { border-color: var(--text); }
    .nn-node[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* learning content */
    .ch-grid, .ex-grid { gap: 12px; }
    .ch-card { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; }
    .ch-card h3 { margin: 0; font-size: 1.02rem; display: flex; gap: 8px; align-items: baseline; }
    .ch-num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: .85rem; flex: none; }
    .ch-card p { margin: 0; }
    .ch-card details summary { cursor: pointer; font-weight: 600; color: var(--primary); min-height: 32px; display: flex; align-items: center; }
    .ch-card details p { margin-top: 4px; }
    .ch-card .btn { align-self: flex-start; margin-top: auto; }
    .ex-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; }
    .ex-card h3 { font-size: 1.02rem; }
    .ex-card p { margin: 0; }
    .formula { font-family: var(--mono); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin-top: 8px; direction: ltr; text-align: center; font-size: .95rem; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .head-row h2 { margin: 0; }
    details.help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.help ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    details.help li + li { margin-top: 6px; }
    .section-gap { margin-top: 16px; }
    .ws-lines { display: none; }

    @media (max-width: 560px) {
      .fs-lbl { display: none; }
      #fs { width: 44px; padding: 0; font-size: 1.2rem; }
      .tool-row { gap: 8px; }
    }
    @media (max-width: 420px) {
      #play { min-width: 0; flex: 1 1 auto; }
      .epoch-box { min-width: 5rem; }
      .tool-row .grow { display: none; }
    }

    /* ---------- print: a worksheet ---------- */
    @media print {
      .nnp, .help, .ch-card .btn, .ch-card details, .edu-intro { display: none !important; }
      .ws-head { display: block !important; margin-bottom: 12px; }
      .ws-head h1 { font-size: 1.4rem; margin: 0 0 8px; }
      .ws-fields { display: flex; gap: 24px; flex-wrap: wrap; }
      .ws-fields > span { flex: 1 1 160px; border-bottom: 1px solid #000; padding-bottom: 2px; }
      .muted, .hint { color: #444 !important; }
      .ch-grid, .ex-grid { display: block; }
      .ch-card, .ex-card { background: #fff; border: 1px solid #999; margin-bottom: 8px; break-inside: avoid; }
      .ws-lines { display: block; }
      .ws-lines div { border-bottom: 1px solid #555; min-height: 2.2em; padding-top: 4px; font-size: .9rem; }
      .ch-num { background: #000; color: #fff; }
      .card { padding: 10px; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="print-only ws-head">
      <h1 id="ws-title"></h1>
      <div class="ws-fields">
        <span><span data-i18n="ws_name"></span>:</span>
        <span><span data-i18n="ws_class"></span>:</span>
        <span><span data-i18n="ws_date"></span>:</span>
      </div>
    </div>

    <section class="nnp" id="playground">
      <!-- toolbar -->
      <div class="card nnp-tool">
        <div class="tool-row">
          <button class="btn btn-primary btn-lg" id="play" type="button" aria-pressed="false"><span id="play-ico" aria-hidden="true">▶</span> <span id="play-lbl"></span></button>
          <button class="btn btn-lg" id="step" type="button" data-i18n-title="step_title"><span aria-hidden="true">⏭</span> <span data-i18n="step"></span></button>
          <button class="btn btn-lg" id="reset" type="button" data-i18n-title="reset_title"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
          <div class="epoch-box">
            <span class="lbl" data-i18n="epoch"></span>
            <span class="num" id="epoch" data-value="0">0</span>
          </div>
          <div class="grow"></div>
          <div class="speed-wrap">
            <span class="lbl" id="speed-lbl" data-i18n="speed"></span>
            <div class="seg" role="group" aria-labelledby="speed-lbl" id="speed">
              <button type="button" data-speed="slow" data-i18n="speed_slow"></button>
              <button type="button" data-speed="normal" data-i18n="speed_normal"></button>
              <button type="button" data-speed="fast" data-i18n="speed_fast"></button>
            </div>
          </div>
          <button class="btn btn-ghost" id="fs" type="button" data-i18n-aria-label="fullscreen"><span aria-hidden="true">⛶</span> <span class="fs-lbl" data-i18n="fullscreen"></span></button>
        </div>
        <p class="callout coach" id="coach" aria-live="polite"><span class="ico" id="coach-ico" aria-hidden="true">💡</span><span id="coach-txt"></span></p>
      </div>

      <div class="nnp-col nnp-col-a">
        <!-- data -->
        <div class="card nnp-data stack">
          <h2 data-i18n="data"></h2>
          <div class="ds-grid" id="ds-grid" role="group" data-i18n-aria-label="dataset"></div>
          <div id="draw-box" class="panel stack" hidden>
            <p class="hint mt0" data-i18n="draw_hint"></p>
            <div class="draw-tools">
              <div class="seg" role="group" id="tools" data-i18n-aria-label="ds_draw">
                <button type="button" data-tool="orange" id="tool-orange"><span class="swatch sw-orange" aria-hidden="true"></span> <span data-i18n="tool_orange"></span></button>
                <button type="button" data-tool="blue" id="tool-blue"><span class="swatch sw-blue" aria-hidden="true"></span> <span data-i18n="tool_blue"></span></button>
                <button type="button" data-tool="erase" id="tool-erase"><span aria-hidden="true">⌫</span> <span data-i18n="tool_erase"></span></button>
              </div>
            </div>
            <div class="row spread">
              <span class="badge" id="point-count" data-value="0"></span>
              <button class="btn btn-sm btn-danger" type="button" id="clear-points" data-i18n="clear_points"></button>
            </div>
          </div>
          <div id="gen-box" class="stack">
            <div class="field slider-field">
              <label for="noise" id="noise-lbl"></label>
              <input type="range" id="noise" min="0" max="50" step="5">
              <p class="hint" data-i18n="noise_hint"></p>
            </div>
            <div class="field slider-field">
              <label for="split" id="split-lbl"></label>
              <input type="range" id="split" min="10" max="90" step="10">
              <p class="hint" id="split-hint"></p>
            </div>
            <button class="btn btn-sm" type="button" id="new-data"><span aria-hidden="true">🎲</span> <span data-i18n="new_data"></span></button>
          </div>
          <div class="checks">
            <label class="check" id="show-test-lbl"><input type="checkbox" id="show-test"> <span data-i18n="show_test"></span></label>
            <label class="check"><input type="checkbox" id="sharp"> <span data-i18n="sharp"></span></label>
          </div>
        </div>

        <!-- network settings -->
        <div class="card nnp-model stack">
          <h2 data-i18n="network"></h2>
          <div class="field">
            <span class="lbl-strong"><strong data-i18n="inputs"></strong></span>
            <div class="feat-chips no-i18n" id="feats" role="group" data-i18n-aria-label="inputs"></div>
            <p class="hint" data-i18n="inputs_hint"></p>
          </div>
          <div>
            <div class="row spread">
              <strong id="layers-lbl" data-i18n="hidden_layers"></strong>
              <div class="stepper">
                <button class="btn" type="button" id="layers-minus" data-i18n-aria-label="remove_layer">−</button>
                <output id="layers-count" aria-live="polite" aria-labelledby="layers-lbl">0</output>
                <button class="btn" type="button" id="layers-plus" data-i18n-aria-label="add_layer">+</button>
              </div>
            </div>
            <div id="layer-rows" class="section-gap" style="margin-top:8px"></div>
          </div>
          <div class="two">
            <div class="field">
              <label for="act" data-i18n="activation"></label>
              <select id="act">
                <option value="relu" data-i18n="act_relu"></option>
                <option value="tanh" data-i18n="act_tanh"></option>
                <option value="sigmoid" data-i18n="act_sigmoid"></option>
                <option value="linear" data-i18n="act_linear"></option>
              </select>
            </div>
            <div class="field">
              <label for="lr" data-i18n="lr"></label>
              <select id="lr" class="no-i18n"></select>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-sm" type="button" id="share"><span aria-hidden="true">🔗</span> <span data-i18n="share_setup"></span></button>
            <button class="btn btn-sm btn-danger" type="button" id="defaults"><span aria-hidden="true">⟲</span> <span data-i18n="defaults"></span></button>
          </div>
        </div>

      </div>
      <div class="nnp-col nnp-col-b">
        <!-- network diagram -->
        <div class="card nnp-net">
          <h2 data-i18n="inside"></h2>
          <p class="hint mt0" data-i18n="inside_hint"></p>
          <div class="net-wrap" id="net-wrap" dir="ltr"></div>
          <div class="legend" style="margin-top:8px">
            <span class="it"><span class="line-sw" style="border-color: var(--c7)"></span><span data-i18n="w_pos"></span></span>
            <span class="it"><span class="line-sw" style="border-color: var(--c2)"></span><span data-i18n="w_neg"></span></span>
            <span class="it" data-i18n="w_thick"></span>
          </div>
          <div class="inspector" aria-live="off">
            <div class="ins-name" id="ins-name"></div>
            <div class="formula no-i18n" id="ins-formula" dir="ltr"></div>
            <p class="hint mt0" id="ins-hint"></p>
          </div>
        </div>

        <!-- loss chart -->
        <div class="card nnp-chart">
          <div class="chart-head">
            <h2 data-i18n="loss_chart"></h2>
            <div class="legend">
              <span class="it"><span class="line-sw" style="border-color: var(--c1)"></span><span data-i18n="legend_train"></span></span>
              <span class="it"><span class="line-sw dash" style="border-color: var(--c5)"></span><span data-i18n="legend_test"></span></span>
            </div>
          </div>
          <canvas id="chart" role="img" data-i18n-aria-label="chart_label"></canvas>
          <p class="hint" data-i18n="chart_hint"></p>
        </div>
      </div>
      <div class="nnp-col nnp-col-c">
        <!-- output -->
        <div class="card nnp-out stack">
          <h2 data-i18n="output"></h2>
          <div class="out-wrap">
            <div class="preview-bar" id="preview-bar" hidden>
              <span id="preview-txt"></span>
              <button class="btn btn-sm" type="button" id="preview-close" data-i18n="show_output"></button>
            </div>
            <canvas id="out" width="400" height="400" role="img" data-i18n-aria-label="canvas_label"></canvas>
          </div>
          <div class="legend">
            <span class="it"><span class="swatch sw-orange"></span><span data-i18n="tool_orange"></span></span>
            <span class="it"><span class="swatch sw-blue"></span><span data-i18n="tool_blue"></span></span>
            <span data-i18n="output_hint"></span>
          </div>
          <div class="stats" aria-live="off">
            <div class="stat"><span class="lbl" data-i18n="train_loss"></span><span class="val" id="train-loss" data-value="">–</span></div>
            <div class="stat"><span class="lbl" data-i18n="test_loss"></span><span class="val" id="test-loss" data-value="">–</span></div>
            <div class="stat"><span class="lbl" data-i18n="train_acc"></span><span class="val" id="train-acc" data-value="">–</span></div>
            <div class="stat"><span class="lbl" data-i18n="test_acc"></span><span class="val" id="test-acc" data-value="">–</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- challenges -->
    <section class="card section-gap" id="challenges">
      <div class="head-row">
        <h2 data-i18n="challenges"></h2>
        <button class="btn btn-sm no-print" type="button" id="print"><span aria-hidden="true">🖨</span> <span data-i18n="print_ws"></span></button>
      </div>
      <p class="muted" data-i18n="challenges_intro"></p>
      <div class="ch-grid grid-3" id="ch-grid"></div>
    </section>

    <!-- explanations -->
    <section class="card section-gap" id="explain">
      <h2 data-i18n="explain"></h2>
      <div class="ex-grid grid-3" id="ex-grid"></div>
    </section>

    <!-- help -->
    <details class="card section-gap help no-print">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n-html="tip1"></li>
        <li data-i18n-html="tip2"></li>
        <li data-i18n-html="tip3"></li>
        <li data-i18n-html="tip4"></li>
        <li data-i18n-html="tip5"></li>
        <li data-i18n-html="tip6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="content.js"></script>
  <script src="nn.js"></script>
  <script src="app.js"></script>
</body>
</html>
