<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Register · AI Pathshala</title>
  <meta name="description" content="Free digital attendance register for teachers: daily marking, monthly %, CSV export and printable register. Data stays on your device. A free classroom app from AI Pathshala.">
  <link rel="icon" href="../../shared/img/icon-32.png">
  <link rel="stylesheet" href="../../shared/edu.css">
  <style>
    @page { size: A4 landscape; margin: 8mm; }
    .strong { font-weight: 700; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .bar { padding: 10px 14px; margin-bottom: 12px; }
    .bar-cls { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; }
    .bar-cls label { white-space: nowrap; }
    #class-sel { flex: 1 1 auto; min-width: 0; width: 100%; font-weight: 700; }
    .saved-note { flex-basis: 100%; margin: 0; }
    @media (max-width: 620px) {
      .bar .row { flex-wrap: nowrap; }
      .bar .saved-note { display: none; }
      #fs-btn { flex: none; padding-inline: 10px; }
      #fs-btn .fs-txt { display: none; }
    }
    .tabs button { font-size: 1rem; min-height: 46px; padding-inline: 16px; }
    .tabs button .ti { margin-inline-end: 6px; }
    @media (max-width: 620px) {
      .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; overflow: visible; }
      .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; white-space: normal; font-size: .9rem; line-height: 1.2; text-align: center; min-height: 54px; }
      .tabs button .ti { margin: 0; font-size: 1.15rem; }
    }
    .tabpanel.off { display: none; }
    .flip { display: inline-block; font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    [dir="rtl"] .flip { transform: scaleX(-1); }

    /* ---------- daily ---------- */
    .day-nav { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
    .day-nav .navbtn { min-width: 44px; font-size: 1.3rem; padding: 4px 10px; flex: none; }
    #day-date { font-weight: 700; min-height: 44px; flex: 0 1 11rem; min-width: 0; }
    #day-today { flex: none; }
    .day-long { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .sum { display: flex; flex-wrap: wrap; gap: 8px; }
    .sum-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
    .sum-chip b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .sum-chip.st-P { background: var(--success-soft); border-color: transparent; color: var(--success); }
    .sum-chip.st-A { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
    .sum-chip.st-T { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
    .sum-chip.st-V { background: var(--info-soft); border-color: transparent; color: var(--info); }
    .day-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .day-actions .search { flex: 1 1 200px; min-width: 0; }
    .search input { width: 100%; }
    .day-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
    .stu {
      position: relative; display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 6px 8px;
      border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text);
      font: inherit; text-align: start; cursor: pointer; touch-action: manipulation; user-select: none;
      -webkit-tap-highlight-color: transparent; transition: background .1s, border-color .1s; min-width: 0;
    }
    .stu:hover { border-color: var(--primary); }
    .stu:active { transform: scale(.98); }
    .stu-roll { flex: none; min-width: 2.2ch; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; text-align: center; }
    .stu-name { flex: 1 1 auto; min-width: 0; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
    /* a pill that grows for wide letters such as Malayalam "വൈ"; a circle for one-letter marks */
    .stu-mark { flex: none; min-width: 40px; height: 40px; padding-inline: 5px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; border: 2px dashed var(--border); color: var(--muted); line-height: 1; white-space: nowrap; }
    .stu[data-st="P"] { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 50%, transparent); }
    .stu[data-st="A"] { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
    .stu[data-st="T"] { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
    .stu[data-st="V"] { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 55%, transparent); }
    .stu[data-st="P"] .stu-mark { background: var(--success); border: 0; color: var(--surface); }
    .stu[data-st="A"] .stu-mark { background: var(--danger); border: 0; color: var(--surface); }
    .stu[data-st="T"] .stu-mark { background: var(--warning); border: 0; color: var(--surface); }
    .stu[data-st="V"] .stu-mark { background: var(--info); border: 0; color: var(--surface); }
    :root[lang="ur"] .stu-name { line-height: 1.95; padding-block: 2px; }
    @media (max-width: 560px) {
      .day-card { padding: 12px 10px; }
      .day-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .stu { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "roll . mark" "name name name"; align-items: center; gap: 2px 6px; padding: 6px 8px 7px; min-height: 64px; }
      .stu-roll { grid-area: roll; text-align: start; }
      .stu-mark { grid-area: mark; min-width: 30px; height: 30px; padding-inline: 4px; font-size: .9rem; }
      .stu-name { grid-area: name; font-size: .95rem; }
      .day-actions #all-present { flex: 1 1 100%; }
      .sum-chip { padding: 4px 10px; font-size: .92rem; }
      .sum-chip b { font-size: 1.1rem; }
    }
    .edu-fullscreen-on .stu { min-height: 72px; font-size: 1.2rem; }
    .edu-fullscreen-on .stu-mark { min-width: 50px; height: 50px; font-size: 1.3rem; }
    .edu-fullscreen-on .edu-main { max-width: none; }

    /* ---------- monthly ---------- */
    .m-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .m-nav .navbtn { min-width: 44px; font-size: 1.3rem; padding: 4px 10px; }
    .m-label { font-size: 1.25rem; font-weight: 800; margin: 0; min-width: 9rem; text-align: center; }
    .m-opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    .m-opts .check { min-height: 40px; }
    .minpct { display: inline-flex; align-items: center; gap: 8px; }
    .minpct input { width: 5.2rem; }
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
    .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 14px; min-width: 0; }
    .stat-l { color: var(--muted); font-weight: 600; font-size: .88rem; }
    .stat-v { font-size: 1.8rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .stat-v.bad { color: var(--danger); }
    @media (max-width: 620px) {
      .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .stat { padding: 8px 8px; }
      .stat-l { font-size: .76rem; line-height: 1.3; }
      .stat-v { font-size: 1.35rem; margin-top: 2px; }
      .m-label { min-width: 0; font-size: 1.15rem; }
    }
    .reg-wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin-top: 12px; }
    table.reg { border-collapse: separate; border-spacing: 0; font-size: .86rem; }
    .reg th, .reg td { border-bottom: 1px solid var(--border); border-inline-end: 1px solid var(--border); padding: 0; text-align: center; background: var(--surface); white-space: nowrap; vertical-align: middle; }
    .reg thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-weight: 700; }
    .reg .nm { position: sticky; inset-inline-start: 0; z-index: 1; text-align: start; padding: 4px 8px; min-width: 10rem; max-width: 13rem; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .reg thead .nm { z-index: 3; }
    .reg tfoot .nm, .reg tfoot td { background: var(--surface-2); font-weight: 700; }
    .reg .rl { display: inline-block; min-width: 2.2ch; color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-end: 6px; text-align: center; }
    .reg .dh { width: 34px; min-height: 42px; border: 0; background: transparent; font: inherit; color: inherit; cursor: pointer; padding: 3px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
    .reg .dh small { font-weight: 500; font-size: .7rem; color: var(--muted); }
    .reg th.today { box-shadow: inset 0 -3px 0 var(--accent); }
    .reg .mc { min-width: 34px; width: 100%; height: 36px; border: 0; background: transparent; font: inherit; font-weight: 700; cursor: pointer; color: var(--text); padding: 0 3px; display: block; white-space: nowrap; }
    .reg .mc:hover { outline: 2px solid var(--primary); outline-offset: -2px; }
    .reg .mc.P { color: var(--success); }
    .reg .mc.A { color: var(--danger); background: var(--danger-soft); }
    .reg .mc.T { color: var(--warning); background: var(--warning-soft); }
    .reg .mc.V { color: var(--info); background: var(--info-soft); }
    .reg .hol { background: var(--surface-3); color: var(--muted); }
    .reg thead th.hol { background: var(--surface-3); }
    .reg td.hol .ghost { opacity: .45; font-weight: 600; font-size: .78rem; }
    .reg .fut { opacity: .55; }
    .reg .tot { padding: 4px 7px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .reg .tot.pct { min-width: 4.2rem; position: sticky; inset-inline-end: 0; z-index: 1; border-inline-start: 2px solid var(--border); }
    .reg thead .tot.pct { z-index: 3; }
    .reg td.low { color: var(--danger); background: var(--danger-soft); }
    .reg tr.low .nm { color: var(--danger); }
    .reg tbody tr:hover > * { background-image: linear-gradient(color-mix(in srgb, var(--primary) 7%, transparent), color-mix(in srgb, var(--primary) 7%, transparent)); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 10px; }
    .lg { display: inline-flex; align-items: center; gap: 6px; }
    .lg b { display: inline-grid; place-items: center; min-width: 26px; height: 24px; border-radius: 6px; padding-inline: 4px; font-size: .85rem; }
    .lg .P { color: var(--success); background: var(--success-soft); }
    .lg .A { color: var(--danger); background: var(--danger-soft); }
    .lg .T { color: var(--warning); background: var(--warning-soft); }
    .lg .V { color: var(--info); background: var(--info-soft); }
    .lg .H { color: var(--muted); background: var(--surface-3); }
    @media (max-width: 620px) {
      .reg .nm { min-width: 7.5rem; max-width: 8.5rem; padding: 4px 6px; font-size: .84rem; }
      .reg .rl { margin-inline-end: 3px; }
    }
    .print-head, .sign-row { display: none; }

    /* ---------- students ---------- */
    .st-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
    .field input, .field textarea { width: 100%; }
    .field > .name-row { font-size: 1rem; color: var(--text); font-weight: 400; }
    .inline-form { display: grid; grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .name-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
    #paste-box { min-height: 130px; font-size: .95rem; }
    .slist { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; padding: 2px; }
    .srow { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr) 42px; gap: 6px; align-items: center; }
    .srow input { width: 100%; min-height: 40px; }
    .srow .r { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
    .srow .del { min-height: 40px; padding: 0; color: var(--muted); }
    .srow .del:hover { color: var(--danger); }
    .help summary { cursor: pointer; font-weight: 700; font-size: 1.02rem; }
    .help ul { margin: 12px 0 4px; padding-inline-start: 1.3em; }
    .help li + li { margin-top: 6px; }

    /* ---------- print: always the monthly register ---------- */
    @media print {
      .tabpanel { display: none !important; }
      #p-month { display: block !important; }
      .m-controls, .tabs, .bar, .help, .edu-intro, .legend-hint { display: none !important; }
      .print-head { display: flex !important; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 6px; color: #000; }
      .print-head h2 { margin: 0; font-size: 14pt; }
      .print-head .ph-school { font-size: 12pt; font-weight: 800; }
      .print-head p { margin: 0; font-size: 9pt; }
      .reg-wrap { max-height: none; overflow: visible; border: 0; margin: 0; }
      /* fixed layout: 31 equal day columns, a name column that wraps, narrow totals */
      table.reg { width: 100%; font-size: 7pt; border-collapse: collapse; table-layout: fixed; }
      .reg thead .nm { width: 40mm; }
      .reg thead .tot { width: 7mm; }
      .reg thead .tot.pct { width: 11mm; min-width: 0; }
      .reg th, .reg td { position: static !important; border: .5pt solid #666 !important; background: #fff !important; color: #000 !important; background-image: none !important; overflow: hidden; }
      .reg .nm { min-width: 0; max-width: none; padding: 1px 3px; white-space: normal; overflow-wrap: anywhere; text-overflow: clip; }
      .reg .rl { color: #000; }
      /* a register is never printed half: rows hidden by the search box are printed too */
      .reg tbody tr[hidden] { display: table-row !important; }
      /* totals row once, at the end (not repeated at the foot of every page) */
      .reg tfoot { display: table-row-group; }
      .reg th.today { box-shadow: none; }
      .reg .dh, .reg .mc { display: block; width: 100%; min-width: 0; height: auto; min-height: 0; padding: 1px 0; font-size: 7pt; text-align: center; color: #000 !important; background: transparent !important; white-space: nowrap; }
      .reg .dh small { display: block; font-size: 5.5pt; color: #000; }
      .reg .pd { padding: 1px 0; font-size: 7pt; line-height: 1.15; text-align: center; font-weight: 700; white-space: nowrap; }
      .reg .pd small { display: block; font-size: 5.5pt; font-weight: 500; }
      .reg .tot { padding: 1px 1px; }
      .reg .mc.A { font-weight: 900; }
      .reg .hol, .reg thead th.hol { background: #e6e6e6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .reg td.low { font-weight: 900; text-decoration: underline; }
      .reg tr { break-inside: avoid; }
      .reg .tot { padding: 1px 2px; }
      .legend, .legend span { font-size: 8pt !important; color: #000 !important; margin-top: 4px; }
      .lg b { background: none !important; color: #000 !important; border: .5pt solid #666; height: auto; min-width: 0; }
      .sign-row { display: flex !important; justify-content: space-between; gap: 40px; margin-top: 16mm; font-size: 9pt; color: #000; }
      .sign-row span { flex: 0 1 60mm; border-top: .5pt solid #000; padding-top: 3px; text-align: center; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <section class="card bar">
      <div class="row">
        <div class="bar-cls">
          <label for="class-sel" data-i18n="class_label"></label>
          <select id="class-sel" class="no-i18n"></select>
        </div>
        <button type="button" class="btn" id="fs-btn" data-i18n-title="fullscreen"><span aria-hidden="true">⛶</span> <span class="fs-txt" data-i18n="fullscreen"></span></button>
        <p class="tiny muted saved-note">🔒 <span data-i18n="saved_local"></span></p>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-day" data-tab="day" aria-controls="p-day"><span class="ti" aria-hidden="true">✅</span><span data-i18n="tab_day"></span></button>
      <button type="button" role="tab" id="tab-month" data-tab="month" aria-controls="p-month"><span class="ti" aria-hidden="true">📅</span><span data-i18n="tab_month"></span></button>
      <button type="button" role="tab" id="tab-students" data-tab="students" aria-controls="p-students"><span class="ti" aria-hidden="true">👥</span><span data-i18n="tab_students"></span></button>
    </div>

    <!-- DAILY -->
    <section class="tabpanel" id="p-day" role="tabpanel" aria-labelledby="tab-day">
      <div class="card stack day-card">
        <div class="day-nav">
          <button type="button" class="btn navbtn" id="day-prev" data-i18n-aria-label="prev_day" data-i18n-title="prev_day"><span class="flip" aria-hidden="true">‹</span></button>
          <input type="date" id="day-date" data-i18n-aria-label="date_label">
          <button type="button" class="btn navbtn" id="day-next" data-i18n-aria-label="next_day" data-i18n-title="next_day"><span class="flip" aria-hidden="true">›</span></button>
          <button type="button" class="btn" id="day-today" data-i18n="today"></button>
        </div>
        <p class="day-long" id="day-long"></p>
        <div class="callout" id="sample-note" hidden><span data-i18n="sample_note"></span></div>
        <div class="callout warning" id="day-future" hidden><span data-i18n="future_note"></span></div>
        <div class="callout accent row spread" id="day-holiday" hidden>
          <strong id="day-holiday-txt"></strong>
          <button type="button" class="btn btn-sm" id="day-unholiday" data-i18n="take_anyway"></button>
        </div>
        <div class="callout row spread" id="day-empty" hidden>
          <span data-i18n="no_students"></span>
          <button type="button" class="btn btn-primary btn-sm" id="day-go-students" data-i18n="go_students"></button>
        </div>
        <div id="day-work" class="stack">
          <div class="sum" id="day-sum" aria-live="polite"></div>
          <div class="day-actions">
            <button type="button" class="btn btn-primary btn-lg" id="all-present"><span aria-hidden="true">✓</span> <span data-i18n="mark_all"></span></button>
            <button type="button" class="btn" id="copy-absent"><span aria-hidden="true">📋</span> <span data-i18n="copy_absent"></span></button>
            <button type="button" class="btn" id="day-make-holiday" data-i18n="make_holiday"></button>
            <button type="button" class="btn btn-danger" id="clear-day" data-i18n="clear_day"></button>
          </div>
          <div class="search"><input type="search" id="day-search" data-i18n-placeholder="search_ph" data-i18n-aria-label="search"></div>
          <p class="muted small mb0" data-i18n="tap_hint"></p>
          <div class="day-grid" id="day-grid"></div>
          <p class="muted" id="day-nomatch" hidden></p>
        </div>
      </div>
    </section>

    <!-- MONTHLY -->
    <section class="tabpanel off" id="p-month" role="tabpanel" aria-labelledby="tab-month">
      <div class="card stack m-controls">
        <div class="row spread">
          <div class="m-nav">
            <button type="button" class="btn navbtn" id="m-prev" data-i18n-aria-label="prev_month" data-i18n-title="prev_month"><span class="flip" aria-hidden="true">‹</span></button>
            <h2 class="m-label" id="m-label" aria-live="polite"></h2>
            <button type="button" class="btn navbtn" id="m-next" data-i18n-aria-label="next_month" data-i18n-title="next_month"><span class="flip" aria-hidden="true">›</span></button>
          </div>
          <div class="row">
            <button type="button" class="btn" id="export-csv"><span aria-hidden="true">⬇</span> <span data-i18n="export_csv"></span></button>
            <button type="button" class="btn btn-primary" id="print-btn"><span aria-hidden="true">🖨</span> <span data-i18n="print_register"></span></button>
          </div>
        </div>
        <div class="tiles" aria-live="polite">
          <div class="stat"><div class="stat-l" data-i18n="stat_days"></div><div class="stat-v" id="m-days"></div></div>
          <div class="stat"><div class="stat-l" data-i18n="stat_avg"></div><div class="stat-v" id="m-avg"></div></div>
          <div class="stat"><div class="stat-l" id="m-below-l"></div><div class="stat-v" id="m-below"></div></div>
        </div>
        <div class="m-opts">
          <label class="check"><input type="checkbox" id="opt-sun"> <span data-i18n="sundays_off"></span></label>
          <label class="check"><input type="checkbox" id="opt-leave"> <span data-i18n="leave_counts"></span></label>
          <label class="minpct"><span data-i18n="min_pct"></span> <input type="number" id="opt-min" min="1" max="100" step="1" inputmode="numeric"></label>
        </div>
        <div class="search"><input type="search" id="m-search" data-i18n-placeholder="search_ph" data-i18n-aria-label="search"></div>
        <p class="muted small mb0" data-i18n="month_hint"></p>
      </div>
      <div class="print-head">
        <div><div class="ph-school no-i18n" id="ph-school"></div><h2 data-i18n="app_title"></h2></div>
        <div><p class="strong" id="ph-meta"></p><p id="ph-date"></p></div>
      </div>
      <div class="reg-wrap"><table class="reg" id="month-table"></table></div>
      <div class="legend" id="m-legend"></div>
      <div class="sign-row"><span data-i18n="sign_teacher"></span><span data-i18n="sign_principal"></span></div>
    </section>

    <!-- STUDENTS -->
    <section class="tabpanel off" id="p-students" role="tabpanel" aria-labelledby="tab-students">
      <div class="st-grid">
        <div class="stack">
          <div class="card stack">
            <h2 data-i18n="class_settings"></h2>
            <label class="field"><span data-i18n="class_name"></span>
              <span class="name-row"><input type="text" id="cls-name" class="no-i18n" maxlength="60" data-i18n-placeholder="class_ph"><button type="button" class="btn" id="cls-save" data-i18n="save"></button></span>
            </label>
            <div class="row">
              <button type="button" class="btn btn-danger" id="cls-del" data-i18n="delete_class"></button>
            </div>
          </div>
          <div class="card stack">
            <h2 data-i18n="new_class"></h2>
            <label class="field"><span data-i18n="class_name"></span>
              <span class="name-row"><input type="text" id="new-class-name" class="no-i18n" maxlength="60" data-i18n-placeholder="class_ph"><button type="button" class="btn btn-primary" id="add-class" data-i18n="add_class"></button></span>
            </label>
          </div>
          <div class="card stack">
            <h2 data-i18n="paste_title"></h2>
            <p class="muted small mb0" data-i18n="paste_help"></p>
            <textarea id="paste-box" class="no-i18n" data-i18n-placeholder="paste_ph" data-i18n-aria-label="paste_title"></textarea>
            <div class="row">
              <button type="button" class="btn btn-primary" id="paste-add" data-i18n="paste_add"></button>
              <button type="button" class="btn" id="import-csv"><span aria-hidden="true">📄</span> <span data-i18n="import_csv"></span></button>
            </div>
            <p class="muted small mb0" data-i18n="csv_help"></p>
          </div>
        </div>
        <div class="stack">
          <div class="card stack">
            <div class="row spread"><h2 class="mb0" data-i18n="tab_students"></h2><span class="badge primary" id="stu-count"></span></div>
            <form class="inline-form" id="one-form">
              <label class="field"><span data-i18n="roll_ph"></span><input type="text" id="one-roll" class="no-i18n" maxlength="8" inputmode="numeric"></label>
              <label class="field"><span data-i18n="name_ph"></span><input type="text" id="one-name" class="no-i18n" maxlength="80"></label>
              <button type="submit" class="btn btn-primary" id="one-add" data-i18n="add"></button>
            </form>
            <div class="callout warning" id="dup-warn" hidden></div>
            <div class="slist" id="stu-list"></div>
          </div>
          <div class="card stack">
            <label class="field"><span data-i18n="school_name"></span>
              <input type="text" id="school" class="no-i18n" maxlength="100" data-i18n-placeholder="school_ph"></label>
          </div>
          <div class="card stack">
            <h2 data-i18n="backup_title"></h2>
            <p class="muted small mb0" data-i18n="backup_help"></p>
            <div class="row">
              <button type="button" class="btn btn-primary" id="backup-btn"><span aria-hidden="true">💾</span> <span data-i18n="backup_dl"></span></button>
              <button type="button" class="btn" id="restore-btn" data-i18n="restore"></button>
              <button type="button" class="btn btn-danger" id="reset-btn" data-i18n="reset"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <details class="card help" style="margin-top:16px">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ul>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
</html>
