<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="sc-tabs" role="tablist">
      <button type="button" role="tab" id="tab-disc" data-tab="disc"><span class="ic" aria-hidden="true">🏷️</span><span data-i18n="tab_disc"></span></button>
      <button type="button" role="tab" id="tab-pack" data-tab="pack"><span class="ic" aria-hidden="true">⚖️</span><span data-i18n="tab_pack"></span></button>
      <button type="button" role="tab" id="tab-offer" data-tab="offer"><span class="ic" aria-hidden="true">🎁</span><span data-i18n="tab_offer"></span></button>
      <button type="button" role="tab" id="tab-fuel" data-tab="fuel"><span class="ic" aria-hidden="true">⛽</span><span data-i18n="tab_fuel"></span></button>
    </div>

    <!-- 1. Discount -->
    <section class="sc-split" id="pane-disc" role="tabpanel" aria-labelledby="tab-disc">
      <div class="card sc-form">
        <div class="seg sc-seg three" id="d-modes">
          <button type="button" id="d-mode-pct" data-set="d.mode" data-val="pct" data-i18n="d_pct_mode"></button>
          <button type="button" id="d-mode-flat" data-set="d.mode" data-val="flat" data-i18n="d_flat_mode"></button>
          <button type="button" id="d-mode-rev" data-set="d.mode" data-val="rev" data-i18n="d_rev_mode"></button>
        </div>
        <div class="sc-grid">
          <label class="field"><span data-i18n="l_mrp"></span><input type="text" inputmode="decimal" autocomplete="off" id="d-mrp" data-k="d.mrp"></label>
          <label class="field" data-show="d.mode=pct"><span data-i18n="l_dpct"></span><input type="text" inputmode="decimal" autocomplete="off" id="d-pct" data-k="d.pct"></label>
          <label class="field" data-show="d.mode=pct"><span data-i18n="l_extra"></span><input type="text" inputmode="decimal" autocomplete="off" id="d-extra" data-k="d.extra"></label>
          <label class="field" data-show="d.mode=flat"><span data-i18n="l_flat"></span><input type="text" inputmode="decimal" autocomplete="off" id="d-flat" data-k="d.flat"></label>
          <label class="field" data-show="d.mode=rev"><span data-i18n="l_paid"></span><input type="text" inputmode="decimal" autocomplete="off" id="d-paid" data-k="d.paid"></label>
        </div>
      </div>
      <div class="card sc-res" aria-live="polite">
        <p class="callout warning" id="d-err" hidden></p>
        <div id="d-ok" class="stack">
          <p class="lbl" id="d-lbl"></p>
          <p class="sc-big" id="d-out"></p>
          <p class="sc-sub" id="d-save"></p>
          <div class="panel sc-work" id="d-work"></div>
        </div>
      </div>
    </section>

    <!-- 2. Which pack is cheaper -->
    <section class="sc-split" id="pane-pack" role="tabpanel" aria-labelledby="tab-pack" hidden>
      <div class="card sc-form">
        <p class="muted" data-i18n="pack_hint" style="margin:0"></p>
        <div id="pk-rows" class="stack"></div>
        <button type="button" class="btn" id="pk-add">＋ <span data-i18n="add_pack"></span></button>
      </div>
      <div class="card sc-res" aria-live="polite">
        <p class="callout warning" id="pk-err" hidden></p>
        <div id="pk-ok" class="stack">
          <p class="lbl" data-i18n="cheapest"></p>
          <p class="sc-big" id="pk-out"></p>
          <p class="sc-sub" id="pk-best"></p>
          <div id="pk-cmp" class="sc-work"></div>
          <div class="panel sc-work" id="pk-work"></div>
        </div>
      </div>
    </section>

    <!-- 3. Offers -->
    <section class="sc-split" id="pane-offer" role="tabpanel" aria-labelledby="tab-offer" hidden>
      <div class="card sc-form">
        <div class="seg sc-seg">
          <button type="button" id="o-mode-bogo" data-set="o.mode" data-val="bogo" data-i18n="o_bogo_mode"></button>
          <button type="button" id="o-mode-second" data-set="o.mode" data-val="second" data-i18n="o_second_mode"></button>
        </div>
        <div class="sc-grid">
          <label class="field"><span data-i18n="l_item"></span><input type="text" inputmode="decimal" autocomplete="off" id="o-price" data-k="o.price"></label>
          <label class="field" data-show="o.mode=bogo"><span data-i18n="l_buy"></span><input type="text" inputmode="numeric" autocomplete="off" id="o-x" data-k="o.x"></label>
          <label class="field" data-show="o.mode=bogo"><span data-i18n="l_free"></span><input type="text" inputmode="numeric" autocomplete="off" id="o-y" data-k="o.y"></label>
          <label class="field" data-show="o.mode=second"><span data-i18n="l_z"></span><input type="text" inputmode="decimal" autocomplete="off" id="o-z" data-k="o.z"></label>
        </div>
      </div>
      <div class="card sc-res" aria-live="polite">
        <p class="callout warning" id="o-err" hidden></p>
        <div id="o-ok" class="stack">
          <p class="lbl" data-i18n="r_eff"></p>
          <p class="sc-big" id="o-out"></p>
          <p class="sc-sub" id="o-per"></p>
          <div class="panel sc-work" id="o-work"></div>
        </div>
      </div>
    </section>

    <!-- 4. Fuel and trip -->
    <section class="sc-split" id="pane-fuel" role="tabpanel" aria-labelledby="tab-fuel" hidden>
      <div class="card sc-form">
        <div class="seg sc-seg">
          <button type="button" id="f-mode-trip" data-set="f.mode" data-val="trip" data-i18n="f_trip_mode"></button>
          <button type="button" id="f-mode-mil" data-set="f.mode" data-val="mil" data-i18n="f_mil_mode"></button>
        </div>
        <div class="seg sc-seg">
          <button type="button" id="f-unit-l" data-set="f.unit" data-val="l" data-i18n="f_l"></button>
          <button type="button" id="f-unit-kg" data-set="f.unit" data-val="kg" data-i18n="f_kg"></button>
        </div>
        <div class="sc-grid" data-show="f.mode=trip">
          <label class="field"><span data-i18n="l_dist"></span><input type="text" inputmode="decimal" autocomplete="off" id="f-dist" data-k="f.dist"></label>
          <label class="field"><span id="f-mil-lbl"></span><input type="text" inputmode="decimal" autocomplete="off" id="f-mil" data-k="f.mil"></label>
          <label class="field"><span id="f-price-lbl"></span><input type="text" inputmode="decimal" autocomplete="off" id="f-price" data-k="f.price"></label>
          <label class="field"><span data-i18n="l_people"></span><input type="text" inputmode="numeric" autocomplete="off" id="f-n" data-k="f.n"></label>
        </div>
        <div data-show="f.mode=mil" class="stack">
          <p class="muted small" data-i18n="mil_tip" style="margin:0"></p>
          <div class="sc-grid">
            <label class="field"><span data-i18n="l_odo1"></span><input type="text" inputmode="decimal" autocomplete="off" id="m-odo1" data-k="f.odo1"></label>
            <label class="field"><span data-i18n="l_odo2"></span><input type="text" inputmode="decimal" autocomplete="off" id="m-odo2" data-k="f.odo2"></label>
            <label class="field"><span id="m-fuel-lbl"></span><input type="text" inputmode="decimal" autocomplete="off" id="m-fuel" data-k="f.fuel"></label>
          </div>
        </div>
      </div>
      <div class="card sc-res" aria-live="polite">
        <p class="callout warning" id="f-err" hidden></p>
        <div id="f-ok" class="stack">
          <p class="lbl" id="f-lbl"></p>
          <p class="sc-big" id="f-out"></p>
          <p class="sc-sub" id="f-fuel"></p>
          <p class="sc-sub" id="f-perkm"></p>
          <p class="sc-sub" id="f-each"></p>
          <div class="panel sc-work" id="f-work"></div>
          <button type="button" class="btn btn-primary" id="m-use" data-i18n="use_mil" hidden></button>
        </div>
      </div>
    </section>

    <details class="card" id="helpBox" style="margin-top:16px">
      <summary data-i18n="help"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
      </ul>
      <p class="muted small">🔒 <span data-i18n="saved_local"></span></p>
      <button type="button" class="btn btn-danger btn-sm" id="resetAll" data-i18n="reset"></button>
    </details>
  </main>
  <script src="../../shared/edu.js"></script>
  <script src="strings.js"></script>
  <script src="app.js"></script>
</body>
