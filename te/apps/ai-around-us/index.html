  <style>
    /* ---------- top bar: tabs + stats ---------- */
    .topline { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
    .topline .tabs { margin-bottom: 0; flex: 1 1 auto; border-bottom: 0; }
    .tabs button { font-size: 1rem; min-height: 44px; }
    .statbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .statbar .badge { font-size: .82rem; padding: 4px 10px; }

    /* ---------- play: tray ---------- */
    .hint { display: flex; gap: 8px; align-items: center; margin: 0; }
    .tray-wrap { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }
    .tray-label { font-weight: 700; font-size: .92rem; color: var(--muted); margin: 0 0 8px; }
    .tray { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); min-height: 60px; }
    @media (min-width: 900px) { .tray { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .tray-done { grid-column: 1 / -1; text-align: center; margin: 12px 0; font-weight: 600; color: var(--success); }
    .sort-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      text-align: center; padding: 12px 8px; min-height: 108px; min-width: 0;
      border: 2px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
      font: inherit; font-weight: 600; cursor: grab; box-shadow: var(--shadow);
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
      transition: transform .12s, border-color .12s, box-shadow .12s;
    }
    .sort-card:hover { border-color: var(--primary); }
    .sort-card .emo { font-size: 2.5rem; line-height: 1.15; }
    .sort-card .nm { font-size: .95rem; line-height: 1.3; overflow-wrap: anywhere; }
    @media (max-width: 560px) {
      .tray { gap: 8px; }
      .sort-card { flex-direction: row; justify-content: flex-start; text-align: start; min-height: 52px; padding: 6px 12px; gap: 12px; }
      .sort-card .emo { font-size: 1.7rem; flex: none; }
      .sort-card .nm { font-size: .95rem; overflow-wrap: break-word; }
    }
    .sort-card[aria-pressed="true"], .chip-card[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); transform: scale(1.03); }
    .dragging { opacity: .35; }
    .drag-ghost { position: fixed; top: 0; left: 0; z-index: 1000; pointer-events: none; opacity: .92; box-shadow: var(--shadow-lg); margin: 0; transform-origin: 0 0; }
    body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

    /* ---------- play: bins ---------- */
    .bins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .bin {
      border: 3px dashed var(--primary); background: var(--primary-soft); border-radius: var(--radius);
      padding: 8px; min-height: 160px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
      transition: box-shadow .15s, transform .15s;
    }
    .bin.no { border-color: var(--muted); background: var(--surface-2); }
    .bin.ready { border-style: solid; animation: binpulse 1.2s ease-in-out infinite; }
    @keyframes binpulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 35%, transparent); } }
    .bin.hover { box-shadow: 0 0 0 5px var(--accent); transform: scale(1.01); animation: none; }
    .bin-head {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      border: 0; border-radius: 10px; padding: 8px 10px; min-height: 50px;
      font: inherit; font-weight: 800; font-size: 1.12rem; cursor: pointer;
      background: var(--primary); color: var(--primary-ink);
    }
    .bin.no .bin-head { background: var(--text); color: var(--bg); }
    .bin-head .emo { font-size: 1.5rem; line-height: 1; }
    .bin-head .cnt { font-size: .85rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, currentColor 18%, transparent); }
    .bin-body { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; flex: 1; min-height: 70px; cursor: pointer; }
    .bin-empty { color: var(--muted); font-size: .88rem; margin: auto; text-align: center; padding: 8px; }
    .chip-card {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font: inherit; font-size: .86rem; font-weight: 600; cursor: grab; max-width: 100%; min-width: 0;
      text-align: start; min-height: 40px; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    .chip-card .emo { font-size: 1.25rem; flex: none; }
    .chip-card .nm { overflow-wrap: anywhere; }
    .chip-card.ok { border-color: var(--success); background: var(--success-soft); cursor: default; }
    .chip-card.bad { border-color: var(--danger); background: var(--danger-soft); cursor: default; }
    .chip-card .mark { font-weight: 800; flex: none; }
    .chip-card.ok .mark { color: var(--success); }
    .chip-card.bad .mark { color: var(--danger); }
    @media (min-width: 760px) { .sort-card, .chip-card { touch-action: none; } }
    @media (max-width: 480px) { .bin-head { font-size: 1rem; padding: 6px 8px; gap: 6px; flex-wrap: wrap; } .bin-head .emo { display: none; } }

    .play-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .play-actions .grow { flex: 1 1 auto; }
    .status { font-weight: 600; margin: 0; }

    /* ---------- tap-to-choose bar (phones) ---------- */
    .choose-bar {
      position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
      background: var(--surface); border-top: 2px solid var(--accent); box-shadow: var(--shadow-lg);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .choose-bar p { margin: 0 0 8px; font-weight: 700; }
    .choose-bar .row { gap: 8px; }
    .choose-bar .btn { flex: 1 1 0; min-height: 48px; min-width: 0; padding-inline: 8px; }
    .choose-bar .btn-x { flex: 0 0 auto; min-width: 44px; padding-inline: 6px; }
    @media (min-width: 760px) { .choose-bar { display: none !important; } }

    /* ---------- results ---------- */
    .score-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    .score-big { font-size: clamp(2.6rem, 8vw, 4rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .stars { font-size: 2.3rem; line-height: 1; color: var(--warning); letter-spacing: 3px; }
    .stars .off { color: var(--border); }
    #results > h3 { margin-top: 22px; }
    .res-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
    .res {
      display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px;
      border: 1px solid var(--border); border-inline-start: 6px solid var(--success); background: var(--surface); min-width: 0;
    }
    .res.bad { border-inline-start-color: var(--danger); background: color-mix(in srgb, var(--danger-soft) 45%, var(--surface)); }
    .res .emo { font-size: 2.1rem; line-height: 1.1; flex: none; }
    .res h3 { font-size: 1rem; margin: 0 0 4px; }
    .res p { margin: 6px 0 0; font-size: .93rem; }
    .res .badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .ans-ai { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
    .ans-no { background: var(--surface-3); color: var(--text); border-color: transparent; }
    /* Long reason tags (e.g. Tamil "நிலையான விதிகளைப் பின்பற்றுகிறது") must wrap instead of pushing the page sideways on phones. */
    .res .badge, .g-card .badge, .class-stage .badge { white-space: normal; max-width: 100%; text-align: start; }
    .res h3, .res p, .g-card h3, .g-card p, .class-answer p, .big-name, .answer-banner { overflow-wrap: anywhere; }
    #results, .class-answer, .big-card { scroll-margin-top: 30px; }

    /* ---------- class vote (projector) ---------- */
    .class-stage { display: flex; flex-direction: column; gap: 14px; }
    .class-stage:focus { outline: none; }
    /* "safe" keeps the top of the card reachable when the content is taller than the screen. */
    .class-stage:fullscreen { background: var(--bg); padding: 3vh 4vw; overflow: auto; justify-content: safe center; font-size: 1.2rem; }
    .class-stage:-webkit-full-screen { background: var(--bg); padding: 3vh 4vw; overflow: auto; }
    .big-card { text-align: center; padding: 18px 12px 22px; border-radius: 20px; background: var(--surface-2); border: 2px solid var(--border); }
    /* Capped by screen height too, so on a 1280x800 smartboard the answer fits below the card. */
    .big-emoji { font-size: clamp(3.5rem, min(13vw, 15vh), 9rem); line-height: 1.15; }
    .big-name { font-size: clamp(1.45rem, 4vw, 2.8rem); font-weight: 800; line-height: 1.3; margin-top: 6px; }
    .votes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .vote { border-radius: 16px; padding: 10px 12px; text-align: center; border: 2px solid var(--primary); background: var(--primary-soft); min-width: 0; }
    .vote.no { border-color: var(--muted); background: var(--surface-2); }
    .vote-title { font-weight: 800; font-size: 1.15rem; }
    .vote-sub { font-size: .8rem; color: var(--muted); }
    .vote-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
    .vote-count { font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; min-width: 2ch; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: "Noto Sans", system-ui, sans-serif; }
    .vote-btn { width: 48px; height: 48px; border-radius: 50%; font-size: 1.6rem; font-weight: 800; padding: 0; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; line-height: 1; }
    .vote-btn:hover { background: var(--surface-3); }
    @media (max-width: 480px) {
      .votes { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .vote { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: start; }
      .vote-row { margin-top: 0; }
      .vote-count { font-size: 2rem; }
      .vote-btn { width: 44px; height: 44px; }
    }
    .class-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .class-answer { border-radius: 16px; padding: 14px 16px; border-inline-start: 8px solid var(--primary); background: var(--primary-soft); }
    .class-answer.no { border-inline-start-color: var(--muted); background: var(--surface-2); }
    .answer-banner { font-size: clamp(1.4rem, 3.6vw, 2.4rem); font-weight: 800; margin: 0 0 6px; }
    .class-answer p { font-size: clamp(1rem, 2.2vw, 1.35rem); margin: 6px 0 0; }
    .verdict { font-weight: 700; }
    .class-answer .badge { font-size: clamp(.8rem, 1.6vw, 1rem); padding: 3px 10px; }
    .deck-done { text-align: center; padding: 20px 10px; }
    @media (max-width: 560px), (pointer: coarse) and (hover: none) { .keys-hint { display: none; } }
    .deck-done .big-emoji { font-size: 5rem; }

    /* ---------- all cards ---------- */
    .g-card { display: flex; flex-direction: column; gap: 6px; }
    .g-top { display: flex; gap: 10px; align-items: center; }
    .g-top .emo { font-size: 2.2rem; line-height: 1.1; flex: none; }
    .g-top h3 { margin: 0; font-size: 1.02rem; }

    /* ---------- summary ---------- */
    .sum-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .sum-pt p { margin: 0; font-size: .93rem; }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 10px 0; padding-inline-start: 22px; }
    details.card li { margin-bottom: 6px; }

    /* ---------- Urdu (Nastaliq needs taller lines) ---------- */
    :root[lang="ur"] .sort-card .nm, :root[lang="ur"] .chip-card .nm, :root[lang="ur"] h2, :root[lang="ur"] h3,

    /* ---------- printable worksheet ---------- */
    .ws-table { width: 100%; border-collapse: collapse; font-size: 10pt; line-height: 1.3; }
    .ws-table th, .ws-table td { border: 1px solid #999; padding: 3px 6px; text-align: start; vertical-align: middle; }
    .ws-table th { background: #eee; }

    .ws-write { width: 30%; }
    .ws-small { font-size: 8.5pt; }

      #print-sheet { display: block !important; color: #000; }
      #print-sheet h1 { font-size: 16pt; margin: 0 0 4px; }
      #print-sheet h2 { font-size: 13pt; margin: 0 0 6px; }
      #print-sheet > p { margin: 0 0 6px; }
      .ws-key { break-before: page; }
      .ws-sum { border: 1px solid #999; padding: 8px 10px; margin-top: 10px; border-radius: 6px; break-inside: avoid; }
      .ws-sum ul { margin: 4px 0; padding-inline-start: 20px; }
      .ws-table tr { break-inside: avoid; }

<body>
  <main id="app">
    <div class="no-print">
      <p class="edu-intro" data-i18n="intro"></p>

      <div class="topline">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-play" data-tab="play" aria-controls="panel-play"><span aria-hidden="true">🎮 </span><span data-i18n="tab_play"></span></button>
          <button type="button" role="tab" id="tab-class" data-tab="class" aria-controls="panel-class"><span aria-hidden="true">🙋 </span><span data-i18n="tab_class"></span></button>
          <button type="button" role="tab" id="tab-cards" data-tab="cards" aria-controls="panel-cards"><span aria-hidden="true">🗂️ </span><span data-i18n="tab_cards"></span></button>
        </div>
        <div class="statbar">
          <span class="badge primary" id="best"></span>
          <span class="badge" id="rounds"></span>
        </div>
      </div>

      <!-- PLAY -->
      <section class="card stack" id="panel-play" role="tabpanel" aria-labelledby="tab-play">
        <p class="hint muted"><span aria-hidden="true">👆</span><span data-i18n="play_hint"></span></p>
        <div class="tray-wrap" id="tray-wrap">
          <p class="tray-label" data-i18n="tray_label"></p>
          <div class="tray" id="tray"></div>
        </div>
        <div class="bins">
          <div class="bin ai" id="bin-ai" data-bin="ai">
            <button type="button" class="bin-head" id="bin-ai-btn" data-bin="ai"><span class="emo" aria-hidden="true">🤖</span><span class="bin-label" data-i18n="bin_ai"></span><span class="cnt" id="cnt-ai">0</span></button>
            <div class="bin-body" data-bin="ai"></div>
          </div>
          <div class="bin no" id="bin-no" data-bin="no">
            <button type="button" class="bin-head" id="bin-no-btn" data-bin="no"><span class="emo" aria-hidden="true">⚙️</span><span class="bin-label" data-i18n="bin_no"></span><span class="cnt" id="cnt-no">0</span></button>
            <div class="bin-body" data-bin="no"></div>
          </div>
        </div>
        <div class="play-actions">
          <p class="status grow" id="play-status" aria-live="polite"></p>
          <button type="button" class="btn btn-primary btn-lg" id="check" data-i18n="check"></button>
          <button type="button" class="btn btn-lg" id="new-round"><span aria-hidden="true">🔀</span><span data-i18n="new_round"></span></button>
          <button type="button" class="btn btn-danger btn-sm" id="reset" data-i18n="reset"></button>
        </div>
        <div id="results" class="stack" aria-live="polite" hidden></div>
      </section>

      <!-- CLASS VOTE -->
      <section class="card stack" id="panel-class" role="tabpanel" aria-labelledby="tab-class" hidden>
        <p class="callout mt0 small"><span aria-hidden="true">🙋 </span><span data-i18n="class_hint"></span></p>
        <div class="class-stage" id="class-stage" tabindex="-1"></div>
      </section>

      <!-- ALL CARDS -->
      <section class="card stack" id="panel-cards" role="tabpanel" aria-labelledby="tab-cards" hidden>
        <div class="row spread">
          <div class="seg" role="group" id="filters">
            <button type="button" id="f-all" data-f="all" data-i18n="filter_all"></button>
            <button type="button" id="f-ai" data-f="ai"><span aria-hidden="true">🤖 </span><span data-i18n="bin_ai"></span></button>
            <button type="button" id="f-no" data-f="no"><span aria-hidden="true">⚙️ </span><span data-i18n="bin_no"></span></button>
          </div>
          <button type="button" class="btn" id="print-btn"><span aria-hidden="true">🖨️</span><span data-i18n="print_sheet"></span></button>
        </div>
        <div class="grid" id="gallery"></div>
      </section>

      <!-- SUMMARY -->
      <section class="card stack" id="summary" style="margin-top:16px">
        <h2 data-i18n="sum_title"></h2>
        <div class="sum-grid">
          <div class="sum-pt"><div class="emo" aria-hidden="true">📚</div><h3 data-i18n="tag_learn"></h3><p data-i18n="sum_learn"></p></div>
          <div class="sum-pt"><div class="emo" aria-hidden="true">🔍</div><h3 data-i18n="tag_pattern"></h3><p data-i18n="sum_pattern"></p></div>
          <div class="sum-pt"><div class="emo" aria-hidden="true">🔮</div><h3 data-i18n="sum_predict_h"></h3><p data-i18n="sum_predict"></p></div>
        </div>
        <p class="callout warning mb0"><span aria-hidden="true">⚙️ </span><span data-i18n="sum_not"></span></p>
      </section>

      <details class="card" style="margin-top:16px">
        <summary data-i18n="help_summary"></summary>
        <ul>
          <li data-i18n="tip1"></li>
          <li data-i18n="tip2"></li>
          <li data-i18n="tip3"></li>
          <li data-i18n="tip4"></li>
          <li data-i18n="tip5"></li>
        </ul>
        <h3 data-i18n="inside_title"></h3>
        <p class="mb0" data-i18n="inside"></p>
      </details>
    </div>

    <section id="print-sheet" class="print-only"></section>

    <div class="choose-bar no-print" id="choose-bar" hidden>
      <p id="choose-text"></p>
      <div class="row nowrap">
        <button type="button" class="btn btn-primary" id="choose-ai"><span aria-hidden="true">🤖</span><span data-i18n="bin_ai"></span></button>
        <button type="button" class="btn" id="choose-no"><span aria-hidden="true">⚙️</span><span data-i18n="bin_no"></span></button>
        <button type="button" class="btn btn-sm btn-x" id="choose-back" data-i18n-aria-label="back_to_tray" data-i18n-title="back_to_tray">↩</button>
        <button type="button" class="btn btn-sm btn-x" id="choose-x" data-i18n-aria-label="cancel" data-i18n-title="cancel">✕</button>
      </div>
    </div>
  </main>
  <script src="../../../apps/ai-around-us/../../shared/edu.js"></script>
  <script src="../../../apps/ai-around-us/strings.js"></script>
  <script src="../../../apps/ai-around-us/content.js"></script>
  <script src="../../../apps/ai-around-us/app.js"></script>
</body>
</html>
