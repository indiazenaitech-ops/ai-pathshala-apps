        <div class="mm-group">
          <button type="button" class="mm-ib" id="mm-keys" data-i18n-title="shortcuts" data-i18n-aria-label="shortcuts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span class="mm-lbl" data-i18n="keys_short"></span></button>
          <button type="button" class="mm-ib" id="mm-full" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg><span class="mm-lbl" data-i18n="fullscreen"></span></button>
        </div>
      </div>
      <div class="mm-colors" id="mm-colors" role="group" data-i18n-aria-label="color" hidden></div>

      <div class="mm-body" id="mm-body" data-view="both">
        <div class="mm-stage" id="mm-stage" tabindex="0" dir="ltr" role="application" data-i18n-aria-label="canvas_label">
          <svg id="mm-svg" aria-hidden="true" class="no-i18n" xmlns="http://www.w3.org/2000/svg"><g id="mm-vp"><g id="mm-edges"></g><g id="mm-nodes"></g></g></svg>
          <div class="mm-hint" id="mm-hint"><span dir="auto" data-i18n="canvas_hint"></span></div>
          <textarea id="mm-editor" class="mm-edit no-i18n" rows="1" spellcheck="false" dir="auto" hidden data-i18n-aria-label="edit_tip" data-i18n-placeholder="edit_ph"></textarea>
          <div class="mm-zoom" id="mm-zoom">
            <button type="button" class="mm-ib" id="mm-zout" data-i18n-title="zoom_out" data-i18n-aria-label="zoom_out">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg></button>
            <span class="mm-zpct" id="mm-zpct" aria-hidden="true">100%</span>
            <button type="button" class="mm-ib" id="mm-zin" data-i18n-title="zoom_in" data-i18n-aria-label="zoom_in">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6M10.5 7.5v6"/></svg></button>
            <button type="button" class="mm-ib" id="mm-fit" data-i18n-title="fit" data-i18n-aria-label="fit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="8.5" width="9" height="7" rx="1.5"/><path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5"/></svg></button>
          </div>
        </div>

        <aside class="mm-side" aria-labelledby="ol-title">
          <h2 id="ol-title" data-i18n="outline_title"></h2>
          <p class="hint tiny muted" data-i18n="outline_hint"></p>
          <div class="mm-ol no-i18n" id="mm-outline" role="list" data-i18n-aria-label="outline_title"></div>
        </aside>
      </div>

      <div class="mm-bar mm-bar2">
        <div class="row" style="gap:8px">
          <span class="small mm-laylbl" id="lbl-layout" data-i18n="layout_label"></span>
          <div class="seg mm-layout" id="mm-layout" role="group" aria-labelledby="lbl-layout">
            <button type="button" data-layout="both" data-i18n="lay_both"></button>
            <button type="button" data-layout="radial" data-i18n="lay_radial"></button>
            <button type="button" data-layout="tree" data-i18n="lay_tree"></button>
            <button type="button" data-layout="list" data-i18n="lay_list"></button>
          </div>
        </div>
        <div class="mm-status" id="mm-status" aria-live="polite"></div>
      </div>
    </section>

    <section class="card mm-io no-print stack" style="margin-top:16px">
      <h2 data-i18n="export_title"></h2>
      <div class="row">
        <button type="button" class="btn btn-primary" id="mm-png" data-i18n="png"></button>
        <button type="button" class="btn" id="mm-print-btn" data-i18n="print_map"></button>
        <button type="button" class="btn" id="mm-copytext" data-i18n="copy_text"></button>
        <button type="button" class="btn" id="mm-fromtext" data-i18n="from_text"></button>
      </div>
      <div class="row">
        <button type="button" class="btn" id="mm-json" data-i18n="save_file"></button>
        <button type="button" class="btn" id="mm-open" data-i18n="open_file"></button>
        <button type="button" class="btn btn-danger" id="mm-reset" data-i18n="reset_all"></button>
      </div>
      <p class="muted small mb0"><b data-i18n="saved_local"></b> · <span data-i18n="file_note"></span></p>
    </section>

    <details class="card no-print" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <button type="button" class="btn btn-sm" id="mm-keys2" data-i18n="shortcuts" style="margin-top:6px"></button>
    </details>

    <div class="mm-print print-only no-i18n" id="mm-print"></div>
  </main>
  <script src="../../../apps/mind-map/../../shared/edu.js"></script>
  <script src="../../../apps/mind-map/strings.js"></script>
  <script src="../../../apps/mind-map/content.js"></script>
  <script src="../../../apps/mind-map/app.js"></script>
</body>
</html>
