  <style>
    .ml-pane { margin-top: 4px; }
    .ml-calc { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }

    .ml-opts .field > .lbl { font-weight: 600; font-size: .9rem; color: var(--text); }
    .ml-ltr { direction: ltr; unicode-bidi: isolate; font-family: "Noto Sans", system-ui, sans-serif; }

    .ml-view-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; }
    .ml-view-head h2 { margin: 0; }
    .ml-real { margin: 2px 0 0; }
    .ml-given { margin: 8px 0 0; font-weight: 600; }

    .fig { display: block; width: 100%; height: auto; max-height: 380px; }
    .fig .f1 { fill: color-mix(in srgb, var(--c1) 20%, var(--surface)); stroke: var(--c1); stroke-width: 2.5; stroke-linejoin: round; }
    .fig .f2 { fill: color-mix(in srgb, var(--c1) 9%, var(--surface)); stroke: var(--c1); stroke-width: 2.5; stroke-linejoin: round; }
    .fig .f3 { fill: color-mix(in srgb, var(--c1) 36%, var(--surface)); stroke: var(--c1); stroke-width: 2.5; stroke-linejoin: round; }
    .fig .edge { fill: none; stroke: var(--c1); stroke-width: 2; }
    .fig .hid { fill: none; stroke: var(--c1); stroke-width: 1.8; stroke-dasharray: 6 5; opacity: .8; }
    .fig .aux { fill: none; stroke: var(--c8); stroke-width: 1.3; stroke-dasharray: 3 5; }
    .fig .dim { stroke: var(--accent); stroke-width: 2.3; stroke-dasharray: 7 5; }
    .fig .dim2 { stroke: var(--c3); stroke-width: 2.3; stroke-dasharray: 7 5; }
    .fig .mark { fill: none; stroke: var(--text); stroke-width: 1.4; }
    .fig .dot { fill: var(--text); }
    .fig .shine { fill: #fff; opacity: .35; }
    .fig .lab { font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; font-weight: 700; fill: var(--text);
      paint-order: stroke; stroke: var(--surface-2); stroke-width: .32em; stroke-linejoin: round; }
    .fig .lab.acc { fill: var(--accent); }
    .fig .lab.acc2 { fill: var(--c3); }

    .ml-res { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
    .ml-tile { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
    .ml-tile.main { background: var(--primary-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 35%, transparent); }
    .ml-tile .k { font-size: .85rem; color: var(--muted); font-weight: 600; line-height: 1.35; }
    .ml-tile .v { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere;
      font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .ml-steps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .ml-step { border-inline-start: 4px solid var(--c1); background: var(--surface); padding: 6px 12px; min-width: 0; }
    .ml-step h4 { margin: 0 0 4px; font-size: .95rem; }
    .math { font-family: "Noto Sans", system-ui, sans-serif; font-size: 1.02rem; line-height: 1.7; overflow-wrap: anywhere; }
    .math.f { color: var(--primary); font-weight: 700; }
    .math.ans { font-weight: 800; }
    .ml-cap { color: var(--muted); font-size: .9rem; }
    .ml-notes { display: grid; gap: 8px; }
    .ml-notes p { margin: 0; }
    .ml-conv td.n, .ml-conv th.n { font-family: "Noto Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .ml-conv td.u { font-weight: 700; white-space: nowrap; }
    #view-card:fullscreen { overflow: auto; background: var(--bg); padding: 22px; font-size: 1.25rem; }
    #view-card:fullscreen .fig { max-height: 52vh; }
    #view-card:-webkit-full-screen { overflow: auto; background: var(--bg); padding: 22px; }

    /* practice */
    .ml-prac { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 920px) { .ml-prac { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
    .ml-score { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    .ml-score .badge { font-size: .9rem; padding: 4px 12px; }
    .ml-q .ml-fig { max-width: 520px; }
    .ml-q dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; }
    .ml-q dt { font-weight: 700; color: var(--muted); }
    .ml-q dd { margin: 0; font-weight: 600; }
    .ml-q dd div + div { margin-top: 2px; }
    .ml-answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; }
    .ml-answer .field { flex: 1 1 160px; }
    .ml-answer input { width: 100%; font-size: 1.2rem; direction: ltr; text-align: start; font-family: "Noto Sans", system-ui, sans-serif; }
    [dir="rtl"] .ml-answer input { text-align: right; }
    #q-feedback:empty { display: none; }
    .ws-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); counter-reset: ws; }
    .ws-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; break-inside: avoid; counter-increment: ws; }
    .ws-item h4 { margin: 0 0 4px; font-size: .98rem; }
    .ws-item h4::before { content: counter(ws) ". "; }
    .ws-item .fig { max-height: 150px; }
    .ws-item p { margin: 0; font-size: .92rem; }
    .ws-line { margin-top: 8px !important; color: var(--muted); }
    .ws-key { margin: 10px 0 0; padding-inline-start: 1.4rem; columns: 2 200px; }
    .ws-head { font-weight: 600; margin: 4px 0 10px; }
    .ml-sheet { margin-top: 16px; }
    .ws-keybox { margin-top: 6px; }
    .ws-keybox > summary { cursor: pointer; min-height: 40px; display: list-item; padding-top: 8px; }

    /* converter */
    .ml-cv-in { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 12px 0; }
    .ml-cv-in input { width: 12rem; max-width: 100%; font-size: 1.15rem; direction: ltr; text-align: start; font-family: "Noto Sans", system-ui, sans-serif; }
    [dir="rtl"] .ml-cv-in input { text-align: right; }
    .ml-conv tr.from td { background: var(--primary-soft); }

    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 1.2rem; }
    details.card li + li { margin-top: 6px; }
    .ml-help { margin-top: 18px; }

    @media print {
      .ml-tabs, .edu-intro, details.card, #pick-card, .ml-view-tools, #prac-card, #ws-card, .ml-score, .ws-tools { display: none !important; }
      #view-card, #ws-sheet { border: 0 !important; padding: 0 !important; box-shadow: none !important; break-inside: auto !important; margin: 0; }
      .fig { max-height: 260px; }
      .ws-item .fig { max-height: 125px; }
      .ml-step, .ml-res, .ws-key, .ml-conv, #conv-wrap { break-inside: avoid; }
      .ml-sub { break-after: avoid; }
      .ws-keybox { break-before: page; }
      .ws-keybox > summary { list-style: none; }
      .ws-keybox > summary::-webkit-details-marker { display: none; }
      .ml-sheet .ml-sub { margin-top: 12px; }
      .ml-calc { grid-template-columns: minmax(0, 1fr); }
      .ml-fig { background: none; }
      .fig .lab { stroke: #fff; }
      .ml-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ws-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .ml-print-ws #pane-calc, .ml-print-ws #pane-units { display: none !important; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="tabs ml-tabs" role="tablist">
      <button type="button" role="tab" id="tab-calc" aria-controls="pane-calc" data-tab="calc" data-i18n="tab_calc"></button>
      <button type="button" role="tab" id="tab-practice" aria-controls="pane-practice" data-tab="practice" data-i18n="tab_practice"></button>
      <button type="button" role="tab" id="tab-units" aria-controls="pane-units" data-tab="units" data-i18n="tab_units"></button>
    </div>

    <!-- ============ calculator ============ -->
    <section id="pane-calc" class="ml-pane" role="tabpanel" aria-labelledby="tab-calc">
      <div class="ml-calc">
        <div class="card" id="pick-card">
          <h2 data-i18n="choose_shape"></h2>
          <div class="seg" role="group" data-i18n-aria-label="choose_shape">
            <button type="button" id="grp-2d" data-grp="2" data-i18n="grp_2d"></button>
            <button type="button" id="grp-3d" data-grp="3" data-i18n="grp_3d"></button>
          </div>
          <p class="muted small ml-hint" id="grp-hint"></p>
          <div class="ml-chips" id="shape-list"></div>

          <h3 class="ml-sub" data-i18n="measurements"></h3>
          <div class="ml-fields" id="fields"></div>

          <div class="ml-opts">
            <div class="field">
              <span class="lbl" id="unit-lbl" data-i18n="unit"></span>
              <div class="seg ml-ltr" role="group" aria-labelledby="unit-lbl" id="unit-seg">
                <button type="button" data-unit="mm">mm</button><button type="button" data-unit="cm">cm</button><button type="button" data-unit="m">m</button><button type="button" data-unit="km">km</button>
              </div>
            </div>
            <div class="field">
              <span class="lbl" id="pi-lbl" data-i18n="pi_value"></span>
              <div class="seg ml-ltr pi-seg" role="group" aria-labelledby="pi-lbl">
                <button type="button" id="pi-227" data-pi="227">22/7</button><button type="button" id="pi-314" data-pi="314">3.14</button>
              </div>
            </div>
            <button type="button" class="btn" id="sample" data-i18n="sample"></button>
          </div>
        </div>

        <div class="card" id="view-card">
          <div class="ml-view-head">
            <div class="grow">
              <h2 id="shape-name"></h2>
              <p class="muted small ml-real" id="shape-real"></p>
            </div>
            <div class="row ml-view-tools">
              <button type="button" class="btn btn-sm" id="fs-btn" data-i18n="fullscreen"></button>
              <button type="button" class="btn btn-sm" id="print-btn" data-i18n="print"></button>
            </div>
          </div>
          <p class="ml-given" id="given-line"></p>
          <div class="ml-fig" id="figure"></div>
          <p class="tiny muted" data-i18n="fig_note"></p>
          <div class="callout danger" id="calc-error" role="alert" hidden></div>
          <div id="calc-out">
            <h3 class="ml-sub" data-i18n="results"></h3>
            <div class="ml-res" id="results" aria-live="polite"></div>
            <h3 class="ml-sub" data-i18n="working"></h3>
            <div class="ml-steps" id="working"></div>
            <p class="tiny muted" id="approx-note" data-i18n="approx_note" hidden></p>
            <div id="conv-wrap">
              <h3 class="ml-sub" id="conv-title"></h3>
              <div class="scroll-x"><table class="table ml-conv" id="conv"></table></div>
            </div>
            <div class="ml-notes" id="notes" style="margin-top:14px"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ practice ============ -->
    <section id="pane-practice" class="ml-pane" role="tabpanel" aria-labelledby="tab-practice" hidden>
      <div class="ml-prac">
        <div class="card ml-q" id="prac-card">
          <div class="row spread">
            <h2 class="mt0 mb0" data-i18n="pr_title"></h2>
            <div class="ml-score" aria-live="polite">
              <span class="badge success" id="score"></span>
              <span class="badge accent" id="streak"></span>
            </div>
          </div>
          <div class="ml-opts" style="margin-top:8px">
            <div class="field">
              <span class="lbl" id="pg-lbl" data-i18n="pr_which"></span>
              <div class="seg" role="group" aria-labelledby="pg-lbl">
                <button type="button" id="pg-2" data-pg="2" data-i18n="grp_2d"></button><button type="button" id="pg-3" data-pg="3" data-i18n="grp_3d"></button><button type="button" id="pg-b" data-pg="b" data-i18n="pr_both"></button>
              </div>
            </div>
            <div class="field">
              <span class="lbl" id="ppi-lbl" data-i18n="pi_value"></span>
              <div class="seg ml-ltr pi-seg" role="group" aria-labelledby="ppi-lbl">
                <button type="button" id="ppi-227" data-pi="227">22/7</button><button type="button" id="ppi-314" data-pi="314">3.14</button>
              </div>
            </div>
          </div>
          <h3 class="ml-sub" id="q-shape"></h3>
          <p class="muted small ml-real" id="q-real"></p>
          <div class="ml-fig" id="q-fig"></div>
          <dl>
            <dt data-i18n="pr_given"></dt><dd id="q-given"></dd>
            <dt data-i18n="pr_find"></dt><dd id="q-find"></dd>
          </dl>
          <p class="small muted" id="q-round" style="margin-top:10px"></p>
          <div class="ml-answer">
            <label class="field" for="q-ans"><span data-i18n="pr_answer"></span>
              <input type="text" id="q-ans" inputmode="decimal" autocomplete="off"></label>
            <button type="button" class="btn btn-primary" id="q-check" data-i18n="pr_check"></button>
            <button type="button" class="btn" id="q-show" data-i18n="pr_show"></button>
            <button type="button" class="btn btn-accent" id="q-new" data-i18n="pr_new"></button>
          </div>
          <div class="callout" id="q-feedback" aria-live="polite" style="margin-top:12px"></div>
          <div class="ml-steps" id="q-solution" style="margin-top:12px" hidden></div>
          <div class="row" style="margin-top:12px">
            <button type="button" class="btn btn-sm btn-danger" id="score-reset" data-i18n="reset"></button>
          </div>
        </div>

        <div class="card" id="ws-card">
          <h2 data-i18n="ws_title"></h2>
          <p class="muted small" id="ws-note"></p>
          <div class="row ws-tools">
            <button type="button" class="btn btn-primary" id="ws-make" data-i18n="ws_make"></button>
            <button type="button" class="btn" id="ws-print" data-i18n="ws_print" disabled></button>
          </div>
        </div>
      </div>
      <div class="card ml-sheet" id="ws-sheet" hidden><div id="ws-out"></div></div>
    </section>

    <!-- ============ unit converter ============ -->
    <section id="pane-units" class="ml-pane" role="tabpanel" aria-labelledby="tab-units" hidden>
      <div class="card">
        <h2 data-i18n="cv_title"></h2>
        <div class="seg" role="group" data-i18n-aria-label="cv_title">
          <button type="button" id="cv-len" data-kind="len" data-i18n="cv_length"></button><button type="button" id="cv-area" data-kind="area" data-i18n="cv_area"></button><button type="button" id="cv-vol" data-kind="vol" data-i18n="cv_volume"></button>
