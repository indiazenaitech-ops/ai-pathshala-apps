  <style>
    /* ---------- element colours (light) ---------- */
    :root {
      --k-alkali: #e03131; --k-alkaline: #e67700; --k-transition: #1c7ed6; --k-post: #748094; --k-metalloid: #a39200;
      --k-nonmetal: #2f9e44; --k-halogen: #0c8599; --k-noble: #7048e8; --k-lanthanoid: #d6336c; --k-actinoid: #ae3ec9;

      --k-solid: #748094; --k-liquid: #1c7ed6; --k-gas: #e8590c; --k-unknown: #adb5bd;
      --tile-mix: 22%;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --k-alkali: #ff8787; --k-alkaline: #ffa94d; --k-transition: #74c0fc; --k-post: #adb5bd; --k-metalloid: #e3d34a;
        --k-nonmetal: #8ce99a; --k-halogen: #66d9e8; --k-noble: #b197fc; --k-lanthanoid: #faa2c1; --k-actinoid: #e599f7;
        --k-s: #ff8787; --k-p: #8ce99a; --k-d: #74c0fc; --k-f: #faa2c1;
        --k-solid: #adb5bd; --k-liquid: #74c0fc; --k-gas: #ffa94d; --k-unknown: #5c6b73;
        --tile-mix: 26%;
      }
    }
    :root[data-theme="dark"] {
      --k-alkali: #ff8787; --k-alkaline: #ffa94d; --k-transition: #74c0fc; --k-post: #adb5bd; --k-metalloid: #e3d34a;
      --k-nonmetal: #8ce99a; --k-halogen: #66d9e8; --k-noble: #b197fc; --k-lanthanoid: #faa2c1; --k-actinoid: #e599f7;
      --k-s: #ff8787; --k-p: #8ce99a; --k-d: #74c0fc; --k-f: #faa2c1;
      --k-solid: #adb5bd; --k-liquid: #74c0fc; --k-gas: #ffa94d; --k-unknown: #5c6b73;
      --tile-mix: 26%;
    }

    #howto summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
    #howto ul { margin: 10px 0 0; padding-inline-start: 1.2em; }
    #howto li + li { margin-top: 6px; }

    /* ---------- toolbar ---------- */
    .pt-toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
    .pt-toolbar .pt-search-f { flex: 1 1 240px; }
    .pt-toolbar .pt-search-f input { width: 100%; }
    .pt-toolbar select { min-width: 11rem; }
    .pt-actions { margin-inline-start: auto; }
    #pt-status { min-height: 1.4em; margin: 8px 0 4px; }

    /* ---------- grid ---------- */
    /* the periodic table always reads left to right (group 1 first), also in Urdu */
    .pt-scroll { padding-bottom: 6px; direction: ltr; }
    .pt-sizer { min-width: 820px; container-type: inline-size; }
    .pt-grid {
      direction: ltr; display: grid; gap: 3px;
      grid-template-columns: 22px repeat(18, minmax(0, 1fr));
    }
    .pt-gl, .pt-pl { display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
    .pt-gl { padding-block: 2px; }
    .pt-spacer { grid-row: 9; height: 10px; }
    .pt-frow-label {
      grid-column: 2 / 5; display: flex; align-items: center; justify-content: flex-end; text-align: end;
      font-size: clamp(9px, 1cqi, 14px); font-weight: 700; color: var(--muted); padding-inline-end: 6px; line-height: 1.25;
    }
    .pt-tile {
      --k: var(--k-unknown);
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      aspect-ratio: 1 / 1.08; min-height: 40px; min-width: 0; padding: 2px; margin: 0;
      font: inherit; line-height: 1.1; color: var(--text); cursor: pointer;
      background: color-mix(in srgb, var(--k) var(--tile-mix), var(--surface));
      border: 1px solid color-mix(in srgb, var(--k) 60%, var(--surface)); border-radius: 6px;
      transition: transform .08s, opacity .15s, filter .15s; touch-action: manipulation;
    }
    /* only real pointers zoom on hover; on phones a tapped tile would otherwise stay enlarged */
    @media (hover: hover) { .pt-tile:hover { transform: scale(1.08); z-index: 2; box-shadow: var(--shadow); } }
    .pt-tile:focus-visible { z-index: 3; }
    .pt-tile.sel { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }
    .pt-tile.hit { box-shadow: 0 0 0 3px var(--accent); z-index: 2; }
    .pt-tile.dim { opacity: .18; filter: grayscale(1); }
    .pt-num { position: absolute; top: 2px; inset-inline-start: 4px; font-size: clamp(8px, .95cqi, 13px); color: var(--muted); font-variant-numeric: tabular-nums; }
    .pt-sym { font-weight: 800; font-size: clamp(14px, 2.05cqi, 30px); margin-top: .35em; font-family: "Noto Sans", system-ui, sans-serif; }
    .pt-name, .pt-mass { display: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(8px, .78cqi, 12px); }
    .pt-mass { color: var(--muted); font-variant-numeric: tabular-nums; }
    @container (min-width: 1000px) { .pt-name { display: block; } }
    @container (min-width: 1150px) { .pt-mass { display: block; } }
    :root[lang="ur"] .pt-name { line-height: 1.7; }

    /* featured box inside the empty top-middle of the table */
    .pt-feat {
      grid-column: 4 / 14; grid-row: 2 / 5; align-self: stretch;
      display: flex; gap: 12px; align-items: center; padding: 6px 10px; min-width: 0;
      border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--border);
    }
    .pt-feat-tile, .pt-big {
      --k: var(--k-unknown);
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--k) 30%, var(--surface)); border: 2px solid var(--k); border-radius: 10px; color: var(--text);
    }
    .pt-feat-tile { width: clamp(84px, 11cqi, 150px); aspect-ratio: 1; }
    .pt-feat-num { font-size: clamp(11px, 1.3cqi, 18px); font-weight: 700; }
    .pt-feat-sym { font-size: clamp(28px, 4.4cqi, 64px); font-weight: 800; line-height: 1.05; font-family: "Noto Sans", system-ui, sans-serif; }
    .pt-feat-mass { font-size: clamp(10px, 1.1cqi, 15px); color: var(--muted); }
    .pt-feat-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pt-feat-name { font-size: clamp(16px, 2.3cqi, 32px); font-weight: 800; line-height: 1.2; }
    .pt-feat-en { font-size: clamp(11px, 1.2cqi, 16px); color: var(--muted); }
    .pt-feat-cat { font-size: clamp(11px, 1.25cqi, 17px); font-weight: 600; }
    .pt-feat-cfg { font-size: clamp(11px, 1.25cqi, 17px); }
    .pt-feat .muted { margin: 0; font-size: clamp(12px, 1.4cqi, 18px); }
    sup { font-size: .68em; line-height: 0; }

    /* legend */
    .pt-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .pt-legend .chip { min-height: 40px; }
    .pt-sw { width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto; background: color-mix(in srgb, var(--k) 45%, var(--surface)); border: 2px solid var(--k); }
    .pt-legend .chip[aria-pressed="true"] .pt-sw { border-color: var(--primary-ink); }

    .pt-card:fullscreen { overflow: auto; background: var(--bg); padding: 2vh 2vw; }
    /* full screen on a smartboard: size the table by the screen height so all rows (with the f-block)
       and the legend fit without scrolling; the grid is about 0.56 × as tall as it is wide */
    .pt-card:fullscreen .pt-sizer { min-width: 0; max-width: max(640px, calc((100vh - 250px) * 1.75)); margin-inline: auto; }
    .pt-card:fullscreen .pt-legend { justify-content: center; margin-top: 6px; }
    .pt-card:fullscreen .pt-legend .chip { min-height: 34px; padding-block: 4px; }

    /* ---------- detail ---------- */
    .pt-detail { margin-top: 16px; }
    .pt-dhead { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .pt-big { width: 96px; height: 96px; }
    .pt-big .b-num { font-size: .95rem; font-weight: 700; }
    .pt-big .b-sym { font-size: 2.6rem; font-weight: 800; line-height: 1; font-family: "Noto Sans", system-ui, sans-serif; }
    .pt-big .b-mass { font-size: .78rem; color: var(--muted); }
    .pt-dhead h2 { font-size: 1.7rem; margin: 0; }
    .pt-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pt-dnav { margin-inline-start: auto; }
    .pt-dbody { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); margin-top: 16px; align-items: start; }
    @media (max-width: 760px) { .pt-dbody { grid-template-columns: minmax(0, 1fr); } }
    dl.pt-facts { display: grid; grid-template-columns: minmax(7.5em, 40%) minmax(0, 1fr); gap: 0; margin: 0; }
    dl.pt-facts dt, dl.pt-facts dd { padding: 7px 8px; border-bottom: 1px solid var(--border); margin: 0; }
    dl.pt-facts dt { color: var(--muted); font-size: .9rem; }
    dl.pt-facts dd { font-weight: 600; overflow-wrap: anywhere; }
    .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    .pt-bohr { text-align: center; }
    .pt-bohr svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
    .bohr-ring { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .bohr-nuc { fill: color-mix(in srgb, var(--k) 45%, var(--surface)); stroke: var(--k); stroke-width: 2; }
    .bohr-nuc-t { fill: var(--text); font: 700 11px "Noto Sans", system-ui, sans-serif; }
    .bohr-e { fill: var(--primary); stroke: var(--surface); stroke-width: 1.5; }
    .bohr-lbl { fill: var(--muted); font: 700 11px "Noto Sans", system-ui, sans-serif; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
    .pt-kl { margin-inline-start: .5em; }

    /* ---------- quiz ---------- */
    .q-bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
    .q-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .q-stage { background: var(--surface-2); border-radius: var(--radius); padding: 18px; }
    .q-text { font-size: clamp(1.25rem, 3.4vw, 2rem); font-weight: 800; margin: 0 0 14px; line-height: 1.35; }
    :root[lang="ur"] .q-text { line-height: 2; }
    .q-options { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .q-opt { min-height: 64px; font-size: 1.15rem; text-align: center; flex-direction: column; gap: 2px; position: relative; padding-inline: 28px; }
    .q-opt .q-key { position: absolute; top: 6px; inset-inline-start: 8px; font-size: .75rem; color: var(--muted); font-weight: 700; }
    .q-opt .q-big { font-size: 1.6rem; font-weight: 800; font-family: "Noto Sans", system-ui, sans-serif; }
    .q-opt .q-sub { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .q-opt:disabled { opacity: .55; cursor: default; }
    .q-opt.ok, .q-opt.bad { opacity: 1; }
    .q-opt.ok { border: 2px solid var(--success); background: var(--success-soft); }
    .q-opt.bad { border: 2px solid var(--danger); background: var(--danger-soft); }
    .q-end-msg { font-size: clamp(1.05rem, 2.4vw, 1.35rem); font-weight: 700; margin: 6px 0; }
    #q-feedback { min-height: 1.6em; margin: 12px 0 8px; font-size: 1.05rem; }
    #q-feedback strong.ok { color: var(--success); } #q-feedback strong.bad { color: var(--danger); }
    .q-end { text-align: center; }
    .q-end .big-number { color: var(--primary); }

    /* ---------- class 9–10 corner ---------- */
    #first20 td, #first20 th { text-align: center; white-space: nowrap; }
    #first20 td.nm, #first20 th.nm { text-align: start; }
    #first20 .linkbtn { background: none; border: 0; padding: 4px 0; min-height: 32px; font: inherit; font-weight: 600; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    #trends li + li, .cbse-list li + li { margin-top: 8px; }
    #trends { padding-inline-start: 1.2em; margin: 0; }
    #mend td:first-child { font-weight: 700; }
    #triads td { white-space: nowrap; }
    @media (max-width: 620px) {
      #mend thead { display: none; }
      #mend, #mend tbody, #mend tr, #mend td { display: block; width: 100%; }
      #mend tr { border-bottom: 2px solid var(--border); padding: 6px 0; }
      #mend td { border: 0; padding: 3px 4px; }
      #mend td:first-child { font-size: 1.05rem; color: var(--primary); }
      #mend td[data-label]::before { content: attr(data-label); display: block; font-size: .78rem; font-weight: 700; color: var(--muted); }
    }
    .cbse-gap { margin-top: 16px; }

    /* ---------- worksheet (print only) ---------- */
    #ws h1 { font-size: 20pt; margin: 0 0 6px; }
    #ws .ws-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11pt; }
    #ws .ws-table th, #ws .ws-table td { border: 1px solid #555; padding: 6px 8px; text-align: center; height: 30px; }
    #ws .ws-key { break-before: page; }
    #ws .ws-key .ws-table td { height: auto; padding: 3px 6px; }

    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
        --k-alkali: #e03131; --k-alkaline: #e67700; --k-transition: #1c7ed6; --k-post: #748094; --k-metalloid: #a39200;
        --k-nonmetal: #2f9e44; --k-halogen: #0c8599; --k-noble: #7048e8; --k-lanthanoid: #d6336c; --k-actinoid: #ae3ec9;
        --k-s: #e03131; --k-p: #2f9e44; --k-d: #1c7ed6; --k-f: #d6336c;
        --k-solid: #748094; --k-liquid: #1c7ed6; --k-gas: #e8590c; --k-unknown: #adb5bd; --tile-mix: 22%;
      }
      .pt-scroll { overflow: visible; }
      /* A4 landscape: keep the whole chart (title, 10 rows, legend) on ONE page */
      .pt-sizer { min-width: 0; max-width: 255mm; margin-inline: auto; }
      .pt-name, .pt-mass { display: block; }   /* a wall chart shows names and masses at any width */
      .pt-tile { min-height: 0; }
      .pt-tile:hover { transform: none; box-shadow: none; }
      .pt-legend { gap: 4px 6px; margin-top: 4px; justify-content: center; }
      .pt-legend .chip { min-height: 0; padding: 2px 8px; font-size: 8.5pt; }
      .pt-legend .pt-sw { width: 11px; height: 11px; }
      body:not([data-print="ws"]) #ws { display: none !important; }
      body[data-print="ws"] .edu-main > :not(#ws) { display: none !important; }
      body[data-print="ws"] #ws { display: block !important; }
      body[data-print="table"] .edu-main > :not(#p-table) { display: none !important; }
      body[data-print="table"] #p-table { display: block !important; page: ptwide; }
      body[data-print="table"] #detail, body[data-print="table"] .pt-toolbar, body[data-print="table"] #pt-status { display: none !important; }
      body[data-print="table"] .pt-card { border: 0; padding: 0; }
      .pt-print-title { display: block !important; margin: 0 0 6px; font-size: 16pt; }
    }
    @page ptwide { size: A4 landscape; margin: 8mm; }
    .pt-print-title { display: none; }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <details class="card no-print" id="howto">
      <summary><strong data-i18n="how_title"></strong></summary>
      <ul id="tips"></ul>
    </details>

    <div class="tabs no-print" role="tablist" id="tabs" style="margin-top:16px">
      <button type="button" role="tab" id="tab-table" data-tab="table" aria-controls="p-table" data-i18n="tab_table"></button>
      <button type="button" role="tab" id="tab-quiz" data-tab="quiz" aria-controls="p-quiz" data-i18n="tab_quiz"></button>
      <button type="button" role="tab" id="tab-cbse" data-tab="cbse" aria-controls="p-cbse" data-i18n="tab_cbse"></button>
    </div>

    <!-- ===== Periodic table ===== -->
    <section id="p-table" role="tabpanel" aria-labelledby="tab-table">
      <div class="card pt-card" id="pt-card">
        <h2 class="pt-print-title" data-i18n="app_title"></h2>
        <div class="pt-toolbar no-print">
          <div class="field pt-search-f">
            <label for="pt-search" data-i18n="search_label"></label>
            <input type="search" id="pt-search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search_ph">
          </div>
          <div class="field">
            <span id="lbl-colour" data-i18n="colour_by"></span>
            <div class="seg" role="group" aria-labelledby="lbl-colour" id="pt-colour">
              <button type="button" data-v="family" data-i18n="by_family"></button>
              <button type="button" data-v="block" data-i18n="by_block"></button>
              <button type="button" data-v="state" data-i18n="by_state"></button>
            </div>
          </div>
          <div class="field">
            <label for="pt-hl" data-i18n="highlight"></label>
            <select id="pt-hl"></select>
          </div>
          <div class="row pt-actions">
            <button type="button" class="btn" id="pt-fs" data-i18n="fullscreen"></button>
            <button type="button" class="btn" id="pt-print" data-i18n="print_table"></button>
          </div>
        </div>
        <p class="small muted" id="pt-status" aria-live="polite"></p>
        <div class="scroll-x pt-scroll">
          <div class="pt-sizer">
            <div class="pt-grid" id="pt-grid" dir="ltr" role="group" data-i18n-aria-label="pt_aria"></div>
          </div>
        </div>
        <p class="tiny muted" data-i18n="axis_hint" style="margin:6px 0 0"></p>
        <div class="pt-legend" id="pt-legend"></div>
        <p class="tiny muted no-print" data-i18n="legend_hint" style="margin:6px 0 0"></p>
      </div>
      <div class="card pt-detail" id="detail" aria-live="polite"></div>
    </section>

    <!-- ===== Quiz ===== -->
    <section id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="card stack">
        <div class="q-bar">
          <div class="field">
            <span id="lbl-qmode" data-i18n="quiz_mode"></span>
            <div class="seg" role="group" aria-labelledby="lbl-qmode" id="q-mode">
              <button type="button" id="qm-sym2name" data-v="sym2name" data-i18n="q_sym2name"></button>
              <button type="button" id="qm-name2sym" data-v="name2sym" data-i18n="q_name2sym"></button>
              <button type="button" id="qm-num2sym" data-v="num2sym" data-i18n="q_num2sym"></button>
              <button type="button" id="qm-valency" data-v="valency" data-i18n="q_valency"></button>
            </div>
          </div>
          <div class="field">
            <label for="q-range" data-i18n="quiz_range"></label>
            <select id="q-range"></select>
          </div>
        </div>
        <div class="q-meta">
          <span class="badge primary" id="q-progress"></span>
          <span><span data-i18n="score"></span>: <strong id="q-score" aria-live="polite"></strong></span>
          <span class="muted small" id="q-best"></span>
        </div>
        <div class="progress"><span id="q-bar" style="width:0%"></span></div>
        <div class="q-stage" id="q-stage">
          <p class="q-text" id="q-text"></p>
          <div class="q-options" id="q-options"></div>
          <p id="q-feedback" aria-live="polite"></p>
          <div class="row"><button type="button" class="btn btn-primary btn-lg" id="q-next" data-i18n="next" disabled></button></div>
        </div>
        <div class="q-stage q-end" id="q-end" hidden>
          <div class="big-number" id="q-end-score"></div>
          <p id="q-end-msg" class="q-end-msg"></p>
          <p id="q-end-best" class="muted"></p>
          <button type="button" class="btn btn-primary btn-lg" id="q-again" data-i18n="play_again"></button>
        </div>
        <div class="row spread">
          <span class="tiny muted" data-i18n="quiz_keys"></span>
          <button type="button" class="btn btn-danger btn-sm" id="reset" data-i18n="reset"></button>
        </div>
      </div>
    </section>

    <!-- ===== Class 9-10 corner ===== -->
    <section id="p-cbse" role="tabpanel" aria-labelledby="tab-cbse" hidden>
      <div class="card">
        <div class="row spread">
          <h2 class="mb0" data-i18n="cbse_first20"></h2>
          <button type="button" class="btn btn-primary" id="ws-print" data-i18n="print_ws"></button>
        </div>
        <p class="small muted" data-i18n="first20_hint"></p>
        <div class="scroll-x"><table class="table" id="first20"></table></div>
      </div>
      <div class="grid-2 cbse-gap">
        <div class="stack">
          <div class="card">
            <h3 data-i18n="how_valency_title"></h3>
            <p data-i18n="how_valency"></p>
            <p class="callout mb0" data-i18n="valency_eg"></p>
          </div>
          <div class="card">
            <h3 data-i18n="triads_title"></h3>
            <p class="small" data-i18n="triads_desc"></p>
            <div class="scroll-x"><table class="table" id="triads"></table></div>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="trends_title"></h3>
          <ul id="trends"></ul>
        </div>
      </div>
      <div class="card cbse-gap">
        <h2 data-i18n="mend_title"></h2>
        <div class="scroll-x"><table class="table" id="mend"></table></div>
      </div>
    </section>

    <!-- worksheet: printed only -->
    <section id="ws" class="print-only"></section>
  </main>
  <script src="../../../apps/periodic-table/../../shared/edu.js"></script>
  <script src="../../../apps/periodic-table/strings.js"></script>
  <script src="../../../apps/periodic-table/data.js"></script>
  <script src="../../../apps/periodic-table/names.js"></script>
  <script src="../../../apps/periodic-table/content.js"></script>
  <script src="../../../apps/periodic-table/app.js"></script>
</body>
</html>
