  <style>
    .mb0 { margin-bottom: 0; }
    [hidden] { display: none !important; }
    .an-privacy { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; }
    .an-privacy .ic { font-size: 1.3rem; line-height: 1.3; flex: none; }
    .an-privacy p { margin: 0; }
    .an-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; }
    @media (max-width: 900px) { .an-grid { grid-template-columns: minmax(0, 1fr); } }
    .an-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .an-step { font-size: 1.15rem; margin: 0; }

    /* notes */
    #notesCard.over { outline: 3px dashed var(--primary); outline-offset: 3px; }
    .an-src { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .an-src .btn { min-height: 42px; }
    .an-sample { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .an-sample select { min-height: 42px; max-width: 150px; }
    #notes {
      width: 100%; min-height: 230px; max-height: 60vh; resize: vertical; font: inherit; font-size: .98rem; line-height: 1.6;
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      unicode-bidi: plaintext; text-align: start;
    }
    @media (min-width: 901px) { #notes { min-height: 400px; } }
    #notes:focus { outline: 2px solid var(--primary); outline-offset: 0; }
    .an-stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .an-hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; inset-inline-start: -9999px; }
    .an-status { display: flex; flex-direction: column; gap: 6px; }
    .an-status .progress { height: 12px; }
    .progress > span.an-indet {
      background: linear-gradient(90deg, var(--primary-soft) 0%, var(--primary) 50%, var(--primary-soft) 100%);
      background-size: 200% 100%; animation: an-slide 1.3s linear infinite;
    }
    @keyframes an-slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }

    /* ask */
    .an-ask { display: flex; gap: 8px; flex-wrap: wrap; }
    .an-ask input { flex: 1 1 150px; min-width: 0; min-height: 46px; font-size: 1.05rem; unicode-bidi: plaintext; }
    .an-ask .btn { flex: 0 0 auto; min-height: 46px; }
    .an-try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .an-try .chip { text-align: start; white-space: normal; line-height: 1.35; min-height: 40px; }
    .an-mode { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .an-mode button {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 12px; min-height: 52px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; text-align: start; line-height: 1.3;
    }
    .an-mode button:hover { background: var(--surface-2); }
    .an-mode button .nm { font-weight: 700; }
    .an-mode button .sub { font-size: .8rem; color: var(--muted); }
    .an-mode button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .an-mode button[aria-pressed="true"] .sub { color: var(--primary-ink); opacity: .9; }
    .an-opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .an-opts .seg button { min-height: 40px; }
    #aiBox .row .btn { min-height: 42px; }
    .an-ok { color: var(--success); font-weight: 700; }

    /* results */
    .an-reshead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .an-reshead h3 { margin: 0; font-size: 1.02rem; overflow-wrap: anywhere; }
    .an-results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .an-hit { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
    .an-hit.top { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .an-hitbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .an-hitbar .grow { flex: 1 1 auto; }
    @media (max-width: 480px) { .an-meter { display: none !important; } }
    .an-meter { display: inline-block; width: 64px; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; vertical-align: middle; border: 1px solid var(--border); }
    .an-meter > span { display: block; height: 100%; background: var(--success); }
    .an-head { font-weight: 700; font-size: .92rem; color: var(--muted); margin: 0 0 4px; overflow-wrap: anywhere; }
    .an-text { margin: 0; line-height: 1.7; font-size: 1.02rem; overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: start; }
    :root[lang="ur"] .an-text { line-height: 1.9; }
    /* Nastaliq needs taller lines, or the two lines of a mode button and small help text overlap */
    :root[lang="ur"] .an-mode button, :root[lang="ur"] .an-mode button .sub { line-height: 1.8; }
    :root[lang="ur"] #app .small, :root[lang="ur"] #app .tiny { line-height: 1.8; }
    .an-text mark { background: color-mix(in srgb, var(--warning) 32%, transparent); color: inherit; border-radius: 3px; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .an-text b { color: var(--primary); }
    .an-hit .btn-sm { min-height: 36px; }
    .an-empty { display: flex; gap: 12px; align-items: center; padding: 14px; border: 2px dashed var(--border); border-radius: var(--radius-sm); }
    .an-empty .ic { font-size: 1.6rem; opacity: .7; flex: none; }

    /* inside */
    .an-inside .panel h3 { font-size: 1rem; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
    .an-inside .panel p { margin: 0; }
    .an-viz { display: grid; gap: 8px; margin-top: 10px; }
    .an-vrow { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 8px; align-items: center; }
    .an-vrow .lbl { font-size: .84rem; font-weight: 700; overflow-wrap: anywhere; }
    .an-cells { max-width: 560px; display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; direction: ltr; }
    .an-cells i { display: block; aspect-ratio: 1; border-radius: 2px; }
    .an-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--muted); align-items: center; }
    .an-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-inline-end: 4px; }
    .an-facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .92rem; }
    .an-facts dt { font-weight: 700; }
    .an-facts dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 560px) { .an-vrow { grid-template-columns: minmax(0, 1fr); } .an-facts { grid-template-columns: minmax(0, 1fr); } .an-facts dd { margin-bottom: 6px; } }
    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.card ul { margin: 12px 0 0; padding-inline-start: 22px; }
    details.card li + li { margin-top: 6px; }
    @media print {
      .an-src, .an-ask, .an-try, .an-mode, .an-opts, #aiBox, .an-hit .btn, #copyAll, #notesCard { display: none !important; }
      .an-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success an-privacy">
      <span class="ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <div class="an-grid">
      <!-- 1. notes -->
      <div class="an-col">
        <section class="card stack" id="notesCard" aria-labelledby="hNotes">
          <h2 class="an-step" id="hNotes" data-i18n="step_notes"></h2>
          <div class="an-src">
            <button class="btn btn-primary" id="openBtn" type="button"><span aria-hidden="true">📂</span> <span data-i18n="open_file"></span></button>
            <span class="an-sample">
              <button class="btn" id="sampleBtn" type="button"><span aria-hidden="true">📗</span> <span data-i18n="load_sample"></span></button>
              <select id="sampleLang" class="no-i18n" data-i18n-aria-label="sample_lang"></select>
            </span>
          </div>
          <input type="file" id="fileInput" class="an-hidden-input" accept=".txt,.text,.md,.csv,.pdf,text/plain,application/pdf" tabindex="-1" aria-hidden="true">
          <label class="field" for="notes">
            <span data-i18n="notes_label"></span>
            <textarea id="notes" class="no-i18n" spellcheck="false" data-i18n-placeholder="notes_ph"></textarea>
          </label>
          <div class="row spread"><div class="an-stats" id="stats" aria-live="polite"></div><button class="btn btn-sm btn-ghost" id="clearBtn" type="button"><span aria-hidden="true">🗑️</span> <span data-i18n="clear"></span></button></div>
          <div class="an-status" id="fileStatus" hidden>
            <span id="fileText" class="small"></span>
            <div class="progress" id="fileBarWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="fileBar" style="width:0%"></span></div>
          </div>
          <div class="callout danger stack" id="fileErr" hidden role="alert">
            <p class="mb0" id="fileErrText"></p>
            <div id="ocrLinkWrap" hidden><a class="btn btn-sm" href="../../../apps/ask-your-notes/../image-to-text/index.html" data-i18n="open_ocr"></a></div>
          </div>
          <p class="small muted mb0" data-i18n="drop_hint"></p>
        </section>
      </div>

      <!-- 2. ask -->
      <div class="an-col">
        <section class="card stack" id="askCard" aria-labelledby="hAsk">
          <h2 class="an-step" id="hAsk" data-i18n="step_ask"></h2>
          <form class="an-ask" id="askForm" autocomplete="off">
            <label class="an-hidden-input" for="q" data-i18n="q_label"></label>
            <input id="q" type="search" class="no-i18n" enterkeyhint="search" data-i18n-placeholder="q_ph">
            <button class="btn btn-primary" id="askBtn" type="submit"><span aria-hidden="true">🔎</span> <span data-i18n="find"></span></button>
          </form>
          <div class="an-try" id="tryRow" hidden>
            <span class="small muted" data-i18n="try_label"></span>
            <span id="tryChips" class="an-try no-i18n"></span>
          </div>
          <div class="an-mode" role="group" data-i18n-aria-label="mode_label">
            <button type="button" id="modeKw" aria-pressed="true"><span class="nm"><span aria-hidden="true">🔤</span> <span data-i18n="mode_kw"></span></span><span class="sub" data-i18n="mode_kw_sub"></span></button>
            <button type="button" id="modeAi" aria-pressed="false"><span class="nm"><span aria-hidden="true">🧠</span> <span data-i18n="mode_ai"></span></span><span class="sub" data-i18n="mode_ai_sub"></span></button>
          </div>

          <!-- AI model: ask before downloading -->
          <div class="callout stack" id="aiBox" hidden>
            <div id="aiAsk" class="stack">
              <p class="mb0" id="aiBody"></p>
              <p class="mb0 small an-ok" id="aiCachedNote" hidden data-i18n="ai_cached_note"></p>
              <div class="row"><button class="btn btn-primary" id="aiGet" type="button"></button></div>
            </div>
            <div class="an-status" id="aiStatus" hidden>
              <span id="aiText" class="small" aria-live="polite"></span>
              <div class="progress" id="aiBarWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="aiBar" style="width:0%"></span></div>
              <span class="tiny muted" id="aiPhone" data-i18n="ai_phone"></span>
              <div class="row"><button class="btn btn-sm" id="aiCancel" type="button" data-i18n="cancel"></button></div>
            </div>
            <div class="callout danger stack" id="aiErr" hidden role="alert">
              <p class="mb0" id="aiErrText"></p>
              <div class="row"><button class="btn btn-sm btn-primary" id="aiRetry" type="button" data-i18n="try_again"></button></div>
            </div>
          </div>
          <p class="small an-ok mb0" id="aiOn" hidden></p>

          <div class="an-opts">
            <span class="small muted" id="searchInfo" aria-live="polite"></span>
            <div class="seg" role="group" data-i18n-aria-label="show_label" id="kSeg">
              <button type="button" data-k="3" aria-pressed="true"></button>
              <button type="button" data-k="5" aria-pressed="false"></button>
            </div>
          </div>
        </section>

        <section class="card stack" id="resCard" aria-labelledby="hRes" aria-live="polite">
          <div class="an-reshead">
            <h3 id="hRes"></h3>
            <button class="btn btn-sm" id="copyAll" type="button" hidden><span aria-hidden="true">📋</span> <span data-i18n="copy_all"></span></button>
          </div>
          <div id="resMsg"></div>
          <ol class="an-results" id="results"></ol>
        </section>
      </div>
    </div>

    <!-- what's happening inside -->
    <section class="card stack an-inside" id="inside" aria-labelledby="hInside" style="margin-top:16px">
      <h2 id="hInside" data-i18n="inside_title"></h2>
      <div class="grid-3 an-inside-grid">
        <div class="panel">
          <h3><span aria-hidden="true">🔤</span> <span data-i18n="in_kw_h"></span></h3>
          <p class="small" data-i18n="in_kw_p"></p>
        </div>
        <div class="panel">
          <h3><span aria-hidden="true">🧠</span> <span data-i18n="in_ai_h"></span></h3>
          <p class="small" data-i18n="in_ai_p"></p>
        </div>
        <div class="panel">
          <h3><span aria-hidden="true">✅</span> <span data-i18n="in_find_h"></span></h3>
          <p class="small" data-i18n="in_find_p"></p>
        </div>
      </div>
      <div class="panel">
        <h3 class="mb0" style="font-size:1rem" data-i18n="viz_title"></h3>
        <p class="small muted mb0" id="vizEmpty" data-i18n="viz_empty"></p>
        <div id="viz" class="an-viz" hidden>
          <div class="an-vrow"><span class="lbl" data-i18n="viz_q"></span><div class="an-cells" id="vizQ"></div></div>
          <div class="an-vrow"><span class="lbl" data-i18n="viz_p"></span><div class="an-cells" id="vizP"></div></div>
          <div class="an-legend">
            <span><i id="lgPos"></i><span data-i18n="viz_pos"></span></span>
            <span><i id="lgNeg"></i><span data-i18n="viz_neg"></span></span>
            <span id="vizNote"></span>
          </div>
          <p class="mb0"><strong id="vizSim"></strong></p>
        </div>
      </div>
      <div class="panel">
        <h3 style="font-size:1rem;margin:0 0 8px" data-i18n="model_h"></h3>
        <dl class="an-facts">
          <dt data-i18n="model_name"></dt><dd class="no-i18n" id="fModel" dir="auto"></dd>
          <dt data-i18n="model_lic"></dt><dd id="fLic"></dd>
          <dt data-i18n="model_size"></dt><dd id="fSize"></dd>
          <dt data-i18n="model_dims"></dt><dd id="fDims"></dd>
          <dt data-i18n="model_run"></dt><dd id="fRun"></dd>
        </dl>
      </div>
    </section>

    <details class="card" id="help" style="margin-top:16px">
      <summary data-i18n="help_title"></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
        <li data-i18n="tip6"></li>
      </ul>
      <div class="row" style="margin-top:12px"><button class="btn btn-danger btn-sm" id="resetBtn" type="button" data-i18n="reset"></button></div>
    </details>
  </main>
  <script src="../../../apps/ask-your-notes/../../shared/edu.js"></script>
  <script src="../../../apps/ask-your-notes/strings.js"></script>
  <script src="../../../apps/ask-your-notes/content.js"></script>
  <script src="../../../apps/ask-your-notes/search.js"></script>
  <script src="../../../apps/ask-your-notes/app.js"></script>
</body>
</html>
