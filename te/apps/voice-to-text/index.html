    .vt-privacy .ic { font-size: 1.35rem; line-height: 1.3; flex: none; }

    .vt-drop {
      border: 2px dashed color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius: var(--radius); padding: 20px 16px;

    .vt-drop-ic { font-size: 2.1rem; line-height: 1.1; }

    .vt-samples .lbl { font-size: .9rem; color: var(--muted); font-weight: 600; }

    .vt-rec .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--danger); flex: none; animation: vt-pulse 1s ease-in-out infinite; }
    @keyframes vt-pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .vt-rec .dot { animation: none; } }
    .vt-rec .time { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
    .vt-rec .lvl { flex: 1 1 80px; height: 10px; border-radius: 6px; background: var(--surface); overflow: hidden; min-width: 60px; }
    .vt-rec .lvl span { display: block; height: 100%; width: 0; background: var(--danger); transition: width .08s; }

    .vt-file { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
    .vt-file-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .vt-file-name { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .vt-file audio { width: 100%; height: 40px; }

    .vt-models { display: grid; gap: 8px; }
    .vt-model {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; text-align: start;
      padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font: inherit; cursor: pointer; min-height: 48px; width: 100%;
    }
    .vt-model:hover { background: var(--surface-2); }
    .vt-model .ic { font-size: 1.3rem; grid-row: span 2; }
    .vt-model .nm { font-weight: 800; }
    .vt-model .sz { font-weight: 700; font-size: .85rem; white-space: nowrap; justify-self: end; }
    .vt-model .ds { font-size: .82rem; color: var(--muted); grid-column: 2 / 4; line-height: 1.4; }
    .vt-model .ok { color: var(--success); font-weight: 700; }
    .vt-model .vt-best { grid-column: 2 / 4; justify-self: start; margin-top: 4px; white-space: normal; font-size: .8rem; padding: 2px 10px; min-height: 0; line-height: 1.5; }

    #modeSeg, #viewSeg { display: flex; }
    #modeSeg button, #viewSeg button { flex: 1 1 auto; min-height: 40px; }

    .vt-run .btn-lg { flex: 1 1 220px; }

    .vt-status .progress { height: 12px; }

    }
    @keyframes vt-slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }

    .vt-stats { display: flex; flex-wrap: wrap; gap: 6px; }

      background: var(--surface-2); color: var(--primary); cursor: pointer;

    .vt-ts:hover { background: var(--primary-soft); }
    .vt-txt { flex: 1 1 auto; min-width: 0; padding: 6px 4px; line-height: 1.6; font-size: 1.05rem; overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: start; border-radius: 6px; }

    :root[lang="ur"] .vt-txt, :root[lang="ur"] .vt-plain { line-height: 1.9; }
    .vt-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 560px) { .vt-actions .btn { flex: 1 1 calc(50% - 8px); } }

    .vt-help ul { margin: 10px 0 0; padding-inline-start: 22px; display: grid; gap: 8px; }
    .vt-steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }

    .vt-steps .arr { color: var(--muted); }
    [dir="rtl"] .vt-steps .arr { transform: scaleX(-1); display: inline-block; }

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>

    <div class="callout success vt-privacy">
      <span class="ic" aria-hidden="true">🔒</span>
      <p><strong data-i18n="privacy_title"></strong> <span data-i18n="privacy_body"></span></p>
    </div>

    <div class="vt-grid">
      <!-- 1. audio -->
      <section class="card stack" id="inCard" aria-labelledby="hIn">
        <h2 class="vt-step" id="hIn" data-i18n="step_add"></h2>
        <div class="vt-drop" id="drop" tabindex="0" role="button" aria-describedby="dropHint">
          <span class="vt-drop-ic" aria-hidden="true">🎧</span>
          <strong data-i18n="drop_title"></strong>
          <span class="small muted" id="dropHint" data-i18n="drop_hint"></span>
        </div>
        <div class="vt-add">
          <button class="btn btn-primary" id="pickBtn" type="button"><span aria-hidden="true">📂</span> <span data-i18n="choose_file"></span></button>
          <button class="btn" id="recBtn" type="button"><span aria-hidden="true">🎙️</span> <span data-i18n="record"></span></button>
        </div>
        <div class="vt-samples">
          <span class="lbl" data-i18n="try_sample"></span>
          <button class="btn btn-sm" id="sampleHi" type="button"><span aria-hidden="true">▶</span> <span data-i18n="sample_hi"></span></button>
          <button class="btn btn-sm" id="sampleEn" type="button"><span aria-hidden="true">▶</span> <span data-i18n="sample_en"></span></button>
        </div>
        <input type="file" id="fileInput" class="vt-hidden-input" accept="audio/*,video/*,.opus,.ogg,.oga,.m4a,.mp3,.wav,.aac,.flac,.webm,.mp4,.mov,.3gp" tabindex="-1" aria-hidden="true">

        <div class="vt-rec" id="recBox" hidden>
          <span class="dot" aria-hidden="true"></span>
          <span class="time no-i18n" id="recTime" aria-live="off">0:00</span>
          <span class="lvl" aria-hidden="true"><span id="recLvl"></span></span>
          <button class="btn btn-danger btn-sm" id="recStop" type="button"><span aria-hidden="true">⏹</span> <span data-i18n="rec_stop"></span></button>
          <button class="btn btn-ghost btn-sm" id="recCancel" type="button" data-i18n="cancel"></button>
        </div>

        <div class="vt-file" id="fileBox" hidden>
          <div class="vt-file-head">
            <span class="vt-file-name no-i18n" id="fileName"></span>
            <span class="badge" id="fileDur"></span>
          </div>
          <audio id="player" controls preload="metadata"></audio>
          <p class="small muted mb0" id="fileNote" hidden></p>
          <div><button class="btn btn-sm btn-ghost" id="clearFile" type="button" data-i18n="remove_audio"></button></div>
        </div>
        <div class="callout danger" id="fileErr" role="alert" hidden></div>
      </section>

      <!-- 2. settings + run -->
      <section class="card stack" id="setCard" aria-labelledby="hSet">
        <h2 class="vt-step" id="hSet" data-i18n="step_settings"></h2>
        <label class="field">
          <span data-i18n="spoken_lang"></span>
          <select id="langSel"></select>
        </label>
        <p class="small muted mb0" id="langNote"></p>
        <div class="field">
          <span id="modeLbl" data-i18n="mode_label"></span>
          <div class="seg" role="group" aria-labelledby="modeLbl" id="modeSeg">
            <button type="button" data-mode="transcribe" data-i18n="mode_transcribe"></button>
            <button type="button" data-mode="translate" data-i18n="mode_translate"></button>
          </div>
        </div>
        <div class="field">
          <span id="modelLbl" data-i18n="model_label"></span>
          <div class="vt-models" id="models" role="group" aria-labelledby="modelLbl"></div>
        </div>
        <p class="callout warning small mb0" id="scriptNote" hidden></p>
        <div class="vt-run">
          <button class="btn btn-primary btn-lg" id="runBtn" type="button" disabled><span aria-hidden="true">📝</span> <span data-i18n="run_btn"></span></button>
          <button class="btn btn-danger" id="stopBtn" type="button" data-i18n="stop" hidden></button>
        </div>
        <div class="vt-status" id="statusBox" hidden>
          <span id="stText" aria-live="polite"></span>
          <div class="progress" id="stBarWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="stText"><span id="stBar" style="width:0%"></span></div>
          <span class="small muted" id="stSub"></span>
        </div>
        <div class="callout danger stack" id="errBox" role="alert" hidden>
          <p class="mb0" id="errText"></p>
          <div><button class="btn btn-sm" id="retryBtn" type="button" data-i18n="try_again"></button></div>
        </div>
        <p class="small muted mb0" id="firstNote"></p>
        <p class="small muted mb0" data-i18n="phone_note"></p>
      </section>
    </div>

    <!-- 3. result -->
    <section class="card stack" id="resCard" aria-labelledby="hRes" style="margin-top:16px" hidden>
      <div class="vt-resbar">
        <h2 class="vt-step" id="hRes" data-i18n="step_result"></h2>
        <div class="vt-stats" id="stats"></div>
      </div>
      <p class="callout small mb0" id="restoredNote" data-i18n="restored" hidden></p>
      <div class="row spread">
        <div class="seg" role="group" data-i18n-aria-label="view_label" id="viewSeg">
          <button type="button" data-view="times" data-i18n="view_times"></button>
          <button type="button" data-view="plain" data-i18n="view_plain"></button>
        </div>
        <span class="small muted" id="editHint" data-i18n="edit_hint"></span>
      </div>
      <div class="vt-segs no-i18n" id="segs" aria-live="polite"></div>
      <div class="vt-plain no-i18n" id="plain" tabindex="0" hidden></div>
      <div class="vt-actions">
        <button class="btn btn-primary" id="copyBtn" type="button"><span aria-hidden="true">📋</span> <span data-i18n="copy"></span></button>
        <button class="btn" id="dlTxt" type="button"><span aria-hidden="true">⬇️</span> <span data-i18n="dl_txt"></span></button>
        <button class="btn" id="dlSrt" type="button"><span aria-hidden="true">🎬</span> <span data-i18n="dl_srt"></span></button>
        <button class="btn" id="dlVtt" type="button"><span aria-hidden="true">🌐</span> <span data-i18n="dl_vtt"></span></button>
        <button class="btn btn-danger" id="clearText" type="button" data-i18n="clear_text"></button>
      </div>
    </section>

    <details class="card vt-help no-print" style="margin-top:16px">
      <summary><strong data-i18n="help_title"></strong></summary>
      <ul>
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
      <h3 style="margin-top:14px" data-i18n="ideas_title"></h3>
      <p class="mb0" data-i18n="ideas_body"></p>
      <h3 style="margin-top:14px" data-i18n="inside_title"></h3>
      <div class="vt-steps" aria-hidden="true">
        <span class="chip" data-i18n="in_sound"></span><span class="arr">→</span>
        <span class="chip" data-i18n="in_picture"></span><span class="arr">→</span>
        <span class="chip" data-i18n="in_tokens"></span><span class="arr">→</span>
        <span class="chip" data-i18n="in_text"></span>
      </div>
      <p data-i18n="inside_body"></p>
      <p data-i18n="inside_mistakes"></p>
      <p class="small muted mb0" data-i18n="inside_models"></p>
      <div class="vt-storage">
        <span class="small muted" id="storageText"></span>
        <button class="btn btn-sm btn-danger" id="storageClear" type="button" data-i18n="storage_clear" hidden></button>
      </div>
      <div class="row spread" style="margin-top:12px">
        <span class="small muted" data-i18n="saved_local"></span>
        <button class="btn btn-sm btn-danger" id="resetAll" type="button" data-i18n="reset"></button>
      </div>
    </details>
  </main>
  <script src="../../../apps/voice-to-text/../../shared/edu.js"></script>
  <script src="../../../apps/voice-to-text/strings.js"></script>
  <script src="../../../apps/voice-to-text/sample.js"></script>
  <script src="../../../apps/voice-to-text/worker.js"></script>
  <script src="../../../apps/voice-to-text/translit.js"></script>
  <script src="../../../apps/voice-to-text/app.js"></script>
</body>
