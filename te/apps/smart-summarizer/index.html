    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .ss-privacy { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
    .ss-privacy .ic { font-size: 1.3rem; line-height: 1.3; flex: none; }
    .ss-privacy p { margin: 0; }

    .ss-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; margin-bottom: 16px; }
    @media (min-width: 980px) { .ss-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

    .ss-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
    .ss-head h2 { margin: 0; font-size: 1.2rem; }
    .ss-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .ss-tools .btn { flex: 0 1 auto; }
    @media (max-width: 520px) {
      .ss-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .ss-tools .btn { flex-direction: column; gap: 2px; min-height: 56px; padding: 6px 4px; font-size: .82rem; white-space: normal; text-align: center; }
    }
    .ss-tools .ic { font-size: 1.1rem; line-height: 1; }
    #text { min-height: 240px; height: 380px; font-size: 1rem; line-height: 1.7; padding: 12px 14px; }
    :root[lang="ur"] #text { line-height: 2.1; }
    @media (max-width: 620px) { #text { height: 300px; } }
    @media (min-width: 980px) { #text { height: 560px; } }
    #inCard.ss-drag { outline: 3px dashed var(--primary); outline-offset: 3px; }
    .ss-hint { margin: 0; }

    .ss-file { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .ss-file .msg { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
    .ss-file .progress { flex: 1 1 100%; }
    .ss-spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--primary); animation: ss-rot .8s linear infinite; flex: none; }
    @keyframes ss-rot { to { transform: rotate(360deg); } }

    /* settings */
    .ss-opts { display: flex; flex-direction: column; gap: 12px; padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); }
    .ss-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .ss-opt > .lbl { font-weight: 700; min-width: 4.5em; }
    .ss-opt .seg button { min-height: 40px; }
    .ss-range { display: flex; align-items: center; gap: 12px; flex: 1 1 100%; }
    .ss-range input { flex: 1 1 auto; min-height: 32px; }
    .ss-range output { white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; text-align: end; }
    .ss-ai { display: flex; flex-direction: column; gap: 8px; flex: 1 1 100%; }
    .ss-ai p { margin: 0; }
    .ss-ai .seg { align-self: flex-start; }
    #goBtn { width: 100%; }
    .ss-aibox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .ss-aibox .msg { flex: 1 1 200px; }
    .ss-aibox .progress { flex: 1 1 100%; }

    /* output */
    .ss-outhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
    .ss-outhead h2 { margin: 0; font-size: 1.2rem; }
    .ss-empty { margin: 0; padding: 24px 12px; text-align: center; color: var(--muted); border: 2px dashed var(--border); border-radius: var(--radius-sm); }
    #outTabs { margin-bottom: 10px; }
    #outTabs button { min-height: 44px; }
    #outNote { margin: 0 0 8px; }

    .ss-points li { padding-inline-start: 4px; line-height: 1.6; }
    .ss-points li::marker { font-weight: 800; color: var(--primary); }
    .ss-points.ss-para { list-style: none; padding-inline-start: 0; }
    .ss-pt { all: unset; display: block; cursor: pointer; border-radius: 8px; padding: 6px 8px; margin-inline-start: -8px; line-height: 1.6; overflow-wrap: anywhere; }
    .ss-pt:hover { background: var(--surface-2); }
    .ss-pt:focus-visible { outline: 2px solid var(--primary); }
    .ss-mark:focus { outline: 3px solid var(--primary); outline-offset: 1px; }
    :root[lang="ur"] .ss-points li, :root[lang="ur"] .ss-pt, :root[lang="ur"] .ss-hl { line-height: 2.2; }
    .ss-hl { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; max-height: 70vh; overflow: auto; padding: 12px 14px;
             border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .ss-mark { background: #fff1a8; color: #14191b; border-radius: 4px; padding: 1px 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .ss-num { display: inline-block; min-width: 1.5em; margin-inline-end: 4px; padding: 0 4px; border-radius: 999px; background: #b45309; color: #fff;
              font-size: .78em; text-align: center; line-height: 1.5; vertical-align: .1em; font-family: system-ui, sans-serif; }
    .ss-flash { animation: ss-flash 1.8s ease-out; }
    @keyframes ss-flash { 0%, 45% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
    #hlNote { margin: 0 0 8px; }

    .ss-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .ss-stat { background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: .88rem; font-weight: 600; }
    .ss-save { background: var(--success-soft); color: var(--success); }
    .ss-kw h3 { font-size: 1rem; margin: 14px 0 8px; }
    #kw { display: flex; flex-wrap: wrap; gap: 6px; }
    .ss-kwchip { cursor: default; max-width: 100%; overflow-wrap: anywhere; }
    .ss-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .ss-actions .sp { flex: 1 1 auto; }
    @media (max-width: 520px) {
      .ss-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ss-actions .sp { display: none; }

    details.card summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; min-height: 28px; }
    details.card ul, details.card ol { padding-inline-start: 1.3em; margin: 12px 0 0; }
    details.card li { margin-bottom: 8px; }
    :root[lang="ur"] details.card li { line-height: 2; }

    @media print {
      .ss-privacy, #inCard, .ss-opts, #outTabs, #pane-hl, .ss-actions, details.card, #outNote { display: none !important; }
      #pane-points { display: block !important; }
      .ss-layout { display: block; }
      .ss-pt { padding: 2px 0; margin: 0; }
      .ss-kwchip { border: 1px solid #999; }
      #printTitle { font-size: 1.4rem; margin: 0 0 12px; }
    }
  </style>

<body>
  <main id="app">
    <p class="edu-intro" data-i18n="intro"></p>
    <div class="ss-privacy callout success small"><span class="ic" aria-hidden="true">🔒</span><p data-i18n="privacy"></p></div>

    <h1 class="print-only" id="printTitle"></h1>
    <div class="ss-layout">
      <section class="card stack" id="inCard" aria-labelledby="inH">
        <div class="ss-head">
          <h2 id="inH" data-i18n="input_h"></h2>
          <span class="muted small" id="inStats" aria-live="polite"></span>
        </div>
        <div class="ss-tools">
          <button class="btn" type="button" id="sampleBtn"><span class="ic" aria-hidden="true">📄</span><span data-i18n="btn_sample"></span></button>
          <label class="btn" for="fileIn" id="openBtn"><span class="ic" aria-hidden="true">📂</span><span data-i18n="btn_open"></span></label>
          <input type="file" id="fileIn" class="sr-only" accept=".txt,.text,.md,.csv,.srt,.vtt,.pdf,text/plain,application/pdf" data-i18n-aria-label="btn_open">
          <button class="btn btn-ghost" type="button" id="clearBtn"><span class="ic" aria-hidden="true">🧹</span><span data-i18n="clear"></span></button>
        </div>
        <label for="text" class="sr-only" data-i18n="aria_input"></label>
        <textarea id="text" class="no-i18n" dir="auto" spellcheck="false" data-i18n-placeholder="input_ph"></textarea>
        <p class="tiny muted ss-hint" data-i18n="drop_hint"></p>
        <div id="fileBox" class="callout small ss-file" role="status" hidden>
          <span class="ss-spin" id="fileSpin" aria-hidden="true"></span>
          <span class="msg" id="fileMsg"></span>
          <button class="btn" type="button" id="fileRetry" data-i18n="try_again" hidden></button>
          <a class="btn" id="fileOcr" href="../../../apps/smart-summarizer/../image-to-text/index.html" data-i18n="link_ocr" hidden></a>
          <div class="progress" id="fileProg" hidden><span id="fileBar"></span></div>
        </div>
      </section>

      <section class="card stack" id="outCard" aria-labelledby="outH">
        <div class="ss-opts">
          <div class="ss-opt">
            <span class="lbl" id="lenLbl" data-i18n="len_label"></span>
            <div class="seg" id="modeSeg" role="group" aria-labelledby="lenLbl">
              <button type="button" data-mode="points" data-i18n="mode_points"></button>
              <button type="button" data-mode="pct" data-i18n="mode_pct"></button>
            </div>
            <div class="ss-range">
              <input type="range" id="lenRange" min="3" max="10" step="1" value="5" data-i18n-aria-label="len_label">
              <output id="lenOut" for="lenRange"></output>
            </div>
          </div>
          <div class="ss-opt" id="engRow" hidden>
            <span class="lbl" id="engLbl" data-i18n="engine_label"></span>
            <div class="seg" id="engSeg" role="group" aria-labelledby="engLbl">
              <button type="button" data-eng="quick" data-i18n="eng_quick"></button>
              <button type="button" data-eng="chrome" data-i18n="eng_chrome"></button>
            </div>
            <div class="ss-ai" id="aiOpts" hidden>
              <p class="small" data-i18n="eng_chrome_note"></p>
              <div class="seg" id="typeSeg" role="group" data-i18n-aria-label="ai_type_label">
                <button type="button" data-type="key-points" data-i18n="type_points"></button>
                <button type="button" data-type="tldr" data-i18n="type_tldr"></button>
              </div>
              <p class="tiny muted" id="aiFirst" data-i18n="ai_first_dl"></p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg" type="button" id="goBtn"></button>
          <div class="ss-aibox callout small" id="aiBox" role="status" hidden>
            <span class="ss-spin" aria-hidden="true"></span>
            <span class="msg" id="aiMsg"></span>
            <button class="btn" type="button" id="aiCancel" data-i18n="cancel"></button>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><span id="aiBar"></span></div>
          </div>
        </div>

        <div class="ss-outhead" id="outHead">
          <h2 id="outH" data-i18n="out_h"></h2>
          <span class="badge primary" id="engBadge" hidden></span>
        </div>
        <p class="ss-empty" id="outEmpty"></p>
        <div id="outBody" hidden>
          <div class="tabs" id="outTabs" role="tablist">
            <button type="button" role="tab" data-tab="points" aria-controls="pane-points" data-i18n="tab_points"></button>
            <button type="button" role="tab" data-tab="hl" aria-controls="pane-hl" data-i18n="tab_highlight"></button>
          </div>
          <div id="pane-points" role="tabpanel">
            <p class="muted small" id="outNote"></p>
            <ol class="ss-points no-i18n" id="points" aria-live="polite"></ol>
          </div>
          <div id="pane-hl" role="tabpanel" hidden>
            <p class="muted small" id="hlNote"></p>
            <div class="ss-hl no-i18n" id="hl" dir="auto"></div>
          </div>
          <div class="ss-stats" id="stats" aria-live="polite"></div>
          <div class="ss-kw">
            <h3 data-i18n="keywords_h"></h3>
            <div id="kw" class="no-i18n"></div>
          </div>
        </div>
        <div class="ss-actions">
          <button class="btn" type="button" id="copyBtn"><span aria-hidden="true">📋</span> <span data-i18n="copy"></span></button>
          <button class="btn" type="button" id="dlBtn"><span aria-hidden="true">⬇️</span> <span data-i18n="btn_download_txt"></span></button>
          <button class="btn" type="button" id="printBtn"><span aria-hidden="true">🖨️</span> <span data-i18n="print"></span></button>
          <span class="sp"></span>
          <button class="btn btn-danger" type="button" id="resetBtn" data-i18n="reset"></button>
        </div>
      </section>
    </div>

    <details class="card">
      <summary data-i18n="help_h"></summary>
      <ul>
        <li data-i18n-html="help1"></li>
        <li data-i18n="help2"></li>
        <li data-i18n="help3"></li>
        <li data-i18n="help4"></li>
        <li data-i18n="help5"></li>
      </ul>
    </details>
    <details class="card">
      <summary data-i18n="inside_h"></summary>
      <ol>
        <li data-i18n="inside1"></li>
        <li data-i18n="inside2"></li>
        <li data-i18n="inside3"></li>
        <li data-i18n="inside4"></li>
      </ol>
      <p class="small" data-i18n-html="inside_gen"></p>
      <p class="small" data-i18n-html="inside_chrome"></p>
      <p class="small muted" data-i18n="inside_limits"></p>
    </details>
  </main>
  <script src="../../../apps/smart-summarizer/../../shared/edu.js"></script>
  <script src="../../../apps/smart-summarizer/strings.js"></script>
  <script src="../../../apps/smart-summarizer/content.js"></script>
  <script src="../../../apps/smart-summarizer/app.js"></script>
