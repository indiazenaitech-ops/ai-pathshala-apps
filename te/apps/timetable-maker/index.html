    .tt td.tc.clash { border: 3px solid var(--danger); background: var(--danger-soft); }
    .tt td.tc.now { box-shadow: inset 0 0 0 3px var(--accent); }
    .tcell { display: flex; flex-direction: column; gap: 1px; padding: 4px 3px; border-radius: 7px; background: color-mix(in srgb, var(--sc) 18%, var(--surface)); border-inline-start: 4px solid var(--sc); font-size: .85rem; line-height: 1.2; overflow-wrap: anywhere; }
    .tcell + .tcell { margin-top: 3px; }
    .tcell .sn { font-weight: 700; } .tcell .st { font-size: .75rem; color: var(--muted); }
    .tt td.tc .warn-ic { position: absolute; top: 0; inset-inline-end: 3px; color: var(--danger); }
    .tt.compact td.tc { height: 46px; } .tt.compact .tcell { font-size: .74rem; }
    .teach-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .teach-head .row { flex: 1 1 260px; justify-content: flex-end; }
    #teacher-sel { flex: 1 1 180px; min-width: 0; max-width: 22rem; font-weight: 700; }
    .free-pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .free-pick select { flex: 1 1 200px; min-width: 0; }
    #free-list { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 4px; }

    /* ---------- today ---------- */
    .today-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .today-head h2 { margin: 0; }
    .today-head h2 .td-day { display: block; font-size: .95rem; color: var(--accent); }
    #today-days button.is-today { text-decoration: underline; text-underline-offset: 3px; }
    .now-card { border-radius: 14px; padding: 14px 16px; background: color-mix(in srgb, var(--sc, var(--primary)) 14%, var(--surface)); border: 2px solid var(--sc, var(--primary)); display: grid; gap: 6px; }
    .now-card.idle { --sc: var(--muted); }
    .now-k { font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; font-size: .85rem; }
    .now-v { font-size: clamp(1.3rem, 4vw, 2.2rem); font-weight: 800; line-height: 1.2; }
    .now-t { font-weight: 600; color: var(--muted); font-size: 1.05rem; }
    .now-left { font-weight: 700; font-variant-numeric: tabular-nums; }
    .now-card .progress { height: 12px; }
    .now-card .progress > span { background: var(--sc, var(--primary)); }
    .now-next { margin: 8px 0 0; font-size: 1.05rem; }
    .day-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .dl-row { display: grid; grid-template-columns: 7.6rem 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); border-inline-start: 6px solid var(--sc, var(--border)); background: color-mix(in srgb, var(--sc, var(--surface)) 10%, var(--surface)); }
    .dl-row.is-brk { background: var(--surface-2); border-inline-start-color: var(--surface-3); color: var(--muted); padding-block: 6px; }
    .dl-row.free .dl-s { color: var(--muted); font-weight: 600; }
    .dl-row.past { opacity: .55; }
    .dl-row.now { box-shadow: 0 0 0 3px var(--accent); opacity: 1; }
    .dl-time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .9rem; color: var(--muted); white-space: nowrap; }
    .dl-p { font-weight: 800; text-align: center; font-size: 1.05rem; }
    .dl-main { display: flex; flex-direction: column; min-width: 0; }
    .dl-s { font-weight: 800; font-size: 1.08rem; overflow-wrap: anywhere; }
    .dl-t { font-size: .85rem; color: var(--muted); }
    @media (max-width: 480px) {
      .dl-row { grid-template-columns: 2rem minmax(0, 1fr) auto; grid-template-areas: "p main badge" "p time badge"; row-gap: 0; }
      .dl-row .dl-p { grid-area: p; } .dl-row .dl-main { grid-area: main; } .dl-row .dl-time { grid-area: time; font-size: .8rem; } .dl-row .tbadge { grid-area: badge; }
    }
    #today-card:fullscreen { overflow: auto; padding: 28px; background: var(--bg); font-size: 1.35rem; }
    #today-card:fullscreen .dl-s { font-size: 1.5rem; }

    /* ---------- misc ---------- */
    .share-row .btn { flex: 1 1 auto; }
    details.help summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; }
    details.help ul { margin: 10px 0 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }
    :root[lang="ur"] .tt th .tm, :root[lang="ur"] .dl-time, :root[lang="ur"] .pc, :root[lang="ur"] .stat-v { font-family: "Noto Sans", system-ui, sans-serif; }
    :root[lang="ur"] .cell, :root[lang="ur"] .pchip { line-height: 1.6; }
    :root[lang="ur"] .now-v, :root[lang="ur"] .today-head h2, :root[lang="ur"] .tcell, :root[lang="ur"] .dl-s, :root[lang="ur"] .tabs button, :root[lang="ur"] .tt th, :root[lang="ur"] .new-opt .nt, :root[lang="ur"] .stat-l { line-height: 1.8; }
    @media (max-width: 620px) {
      #grid-card { padding: 10px 8px; }
      .hide-sm { display: none; }
      .toolbar .seg button { padding-inline: 9px; font-size: .86rem; }
      .tt-rows th.corner { width: 64px; }
      .palette { gap: 5px; }
      .pchip { padding: 3px 9px; font-size: .86rem; gap: 5px; min-height: 40px; }
      .pchip .pc { padding: 0 5px; font-size: .72rem; }
      .barcol { min-width: 56px; }
      #sum-table .barcol { display: none; }
      #sum-table, #sum-teach-t, #load-table, .spread-t { font-size: .86rem; }
      #sum-table th, #sum-table td, #sum-teach-t th, #sum-teach-t td { padding: 7px 5px; }
      .spread-t td, .spread-t th { padding: 5px 4px; }
      #sum-table .sub-tm { display: block; font-size: .8rem; padding-inline-start: 18px; }
    }

    /* ---------- print ---------- */
    #print-area { display: none; }
    @media print {
      #print-area { display: block !important; }
      .pblock { break-after: page; color: #000; }
      .pblock:last-child { break-after: auto; }
      .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
      .phead h2 { margin: 0; font-size: 15pt; }
      .pschool { font-size: 12pt; font-weight: 800; }
      .pmeta { font-size: 9pt; text-align: end; }
      .tt.ptab { border-collapse: collapse; border-spacing: 0; width: 100%; table-layout: fixed; }
      .tt.ptab th, .tt.ptab td { border: 1px solid #555; padding: 4px 3px; text-align: center; vertical-align: middle; height: auto; color: #000; }
      .tt.ptab th { font-size: 9pt; background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .tt.ptab th .pnum { font-size: 11pt; color: #000; }
      .tt.ptab th .tm, .tt.ptab .brk .tm { font-size: 7.5pt; color: #333; }
      .tt.ptab th.corner { width: 22mm; }
      .tt.ptab th.bh { width: 9mm; }
      .tt.ptab th.dh { font-size: 10pt; text-align: start; padding-inline: 5px; }
      .tt.ptab td { height: 15mm; font-size: 9.5pt; }
      .tt.ptab td.pc { background: color-mix(in srgb, var(--sc) 24%, #fff) !important; box-shadow: inset 4px 0 0 var(--sc); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      [dir="rtl"] .tt.ptab td.pc { box-shadow: inset -4px 0 0 var(--sc); }
      .tt.ptab td .sn { font-weight: 700; font-size: 10pt; line-height: 1.15; }
      .tt.ptab td .st { font-size: 7.5pt; color: #333; }
      .tt.ptab .brk { background: #e9e9e9 !important; color: #222; font-size: 9pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .tt.ptab td.tc { border: 1px solid #555; border-radius: 0; background: #fff; height: 15mm; }
      .tt.ptab td.tc.clash { border: 2px solid #b42318; background: #fee4e2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .tt.ptab .tcell { background: color-mix(in srgb, var(--sc) 24%, #fff) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 9pt; }
      .pfoot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 8px; break-inside: avoid; }
      .plegend { border-collapse: collapse; font-size: 8.5pt; }
      .plegend th, .plegend td { border: 1px solid #999; padding: 2px 8px; text-align: start; }
      .plegend .gsep { border-inline-start: 2px solid #555; }
      .pblock { line-height: 1.3; }
      :root[lang="ur"] .pblock { line-height: 1.65; }
      .pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .psign { display: flex; gap: 40px; font-size: 9pt; }
      .psign span { border-top: 1px solid #000; padding-top: 3px; min-width: 42mm; text-align: center; }
    }
  </style>
</head>
<body>
  <main id="app">
    <p class="edu-intro no-print" data-i18n="intro"></p>
    <div id="live" class="sr-only" aria-live="polite"></div>

    <div class="no-print" id="ui">
      <section class="card bar">
        <div class="bar-row">
          <label for="tt-sel" data-i18n="tt_label"></label>
          <select id="tt-sel" class="no-i18n"></select>
          <button type="button" class="btn btn-primary" id="new-tt"><span aria-hidden="true">＋</span> <span data-i18n="new_tt"></span></button>
        </div>
        <p class="tiny muted saved-note"><span aria-hidden="true">🔒</span> <span data-i18n="saved_local"></span></p>
      </section>

      <div class="callout" id="sample-note" hidden>
        <span data-i18n="sample_note"></span>
        <button type="button" class="btn btn-sm btn-ghost" id="sample-x" data-i18n-aria-label="close" data-i18n-title="close">✕</button>
      </div>

      <div class="tabs" role="tablist" data-i18n-aria-label="app_title">
        <button type="button" role="tab" id="tab-grid" aria-controls="p-grid"><span class="ti" aria-hidden="true">📅</span><span data-i18n="tab_grid"></span></button>
        <button type="button" role="tab" id="tab-setup" aria-controls="p-setup"><span class="ti" aria-hidden="true">⚙️</span><span data-i18n="tab_setup"></span></button>
        <button type="button" role="tab" id="tab-summary" aria-controls="p-summary"><span class="ti" aria-hidden="true">📊</span><span data-i18n="tab_summary"></span></button>
        <button type="button" role="tab" id="tab-teachers" aria-controls="p-teachers"><span class="ti" aria-hidden="true">🧑‍🏫</span><span data-i18n="tab_teachers"></span></button>
        <button type="button" role="tab" id="tab-today" aria-controls="p-today"><span class="ti" aria-hidden="true">⏰</span><span data-i18n="tab_today"></span></button>
      </div>

      <!-- TIMETABLE -->
      <section class="tabpanel" id="p-grid" role="tabpanel" aria-labelledby="tab-grid">
        <div class="card stack" id="grid-card">
          <div class="toolbar">
            <div class="seg" id="mode-seg" role="group" data-i18n-aria-label="mode_label">
              <button type="button" id="mode-paint" data-mode="paint"><span aria-hidden="true">🖌</span> <span data-i18n="mode_paint"></span></button>
              <button type="button" id="mode-swap" data-mode="swap"><span aria-hidden="true">⇄</span> <span data-i18n="mode_swap"></span></button>
              <button type="button" id="mode-pick" data-mode="pick"><span aria-hidden="true">☰</span> <span data-i18n="mode_pick"></span></button>
            </div>
            <span class="grow"></span>
            <button type="button" class="btn" id="undo-btn" data-i18n-title="undo" data-i18n-aria-label="undo"><span aria-hidden="true">↶</span> <span class="hide-sm" data-i18n="undo"></span></button>
            <button type="button" class="btn" id="fs-btn" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen"><span aria-hidden="true">⛶</span></button>
          </div>
          <div class="palette" id="palette" role="group" data-i18n-aria-label="subjects"></div>
          <p class="muted small mb0" id="mode-help"></p>
          <div class="callout danger" id="clash-note" hidden></div>
          <div class="scroll-x grid-wrap" id="grid"></div>
          <div class="grid-foot">
            <p class="small mb0" id="grid-status" aria-live="polite"></p>
            <div class="row">
              <button type="button" class="btn" id="autofill"><span aria-hidden="true">✨</span> <span data-i18n="autofill"></span></button>
              <button type="button" class="btn btn-danger" id="clear-all"><span data-i18n="clear_all"></span></button>
            </div>
          </div>
        </div>

        <div class="card stack" id="subj-card">
          <div class="row spread">
            <h2 class="mb0" data-i18n="subjects"></h2>
            <button type="button" class="btn" id="add-subj"><span aria-hidden="true">＋</span> <span data-i18n="add_subject"></span></button>
          </div>
          <p class="muted small mb0" data-i18n="subj_help"></p>
          <div id="subj-list"></div>
          <datalist id="teacher-dl" class="no-i18n"></datalist>
        </div>

        <div class="card stack">
          <h2 class="mb0" data-i18n="share_title"></h2>
          <div class="row share-row">
            <button type="button" class="btn btn-primary" id="print-tt"><span aria-hidden="true">🖨</span> <span data-i18n="print_tt"></span></button>
            <button type="button" class="btn" id="print-all"><span aria-hidden="true">🖨</span> <span data-i18n="print_all"></span></button>
            <button type="button" class="btn" id="export-csv"><span aria-hidden="true">⬇</span> <span data-i18n="export_csv"></span></button>
            <button type="button" class="btn" id="copy-text"><span aria-hidden="true">📋</span> <span data-i18n="copy_text"></span></button>
          </div>
          <div class="row share-row">
            <button type="button" class="btn" id="backup"><span aria-hidden="true">💾</span> <span data-i18n="backup"></span></button>
            <button type="button" class="btn" id="restore"><span aria-hidden="true">📂</span> <span data-i18n="restore"></span></button>
          </div>
          <p class="muted small mb0" data-i18n="backup_help"></p>
        </div>
      </section>

      <!-- SETUP -->
      <section class="tabpanel" id="p-setup" role="tabpanel" aria-labelledby="tab-setup" hidden>
        <div class="grid-2">
          <div class="card stack">
            <h2 class="mb0" data-i18n="this_tt"></h2>
            <div class="field"><label for="tt-name" data-i18n="tt_name"></label><input type="text" id="tt-name" maxlength="60" data-i18n-placeholder="name_ph"></div>
            <div class="field">
              <span class="lbl" data-i18n="tt_kind"></span>
              <div class="seg" id="kind-seg" role="group" data-i18n-aria-label="tt_kind">
                <button type="button" data-kind="class"><span aria-hidden="true">🏫</span> <span data-i18n="kind_class"></span></button>
                <button type="button" data-kind="study"><span aria-hidden="true">🎒</span> <span data-i18n="kind_study"></span></button>
              </div>
            </div>
            <div class="field" id="ct-field"><label for="tt-ct" data-i18n="class_teacher"></label><input type="text" id="tt-ct" maxlength="60" list="teacher-dl" data-i18n-placeholder="teacher_ph"></div>
            <div class="row">
              <button type="button" class="btn" id="dup-tt"><span aria-hidden="true">📑</span> <span data-i18n="duplicate"></span></button>
              <button type="button" class="btn btn-danger" id="del-tt"><span data-i18n="delete_tt"></span></button>
            </div>
          </div>
          <div class="card stack">
            <h2 class="mb0" data-i18n="days_title"></h2>
            <div class="days-box" id="days-box" role="group" data-i18n-aria-label="days_title"></div>
            <hr class="divider">
            <h2 class="mb0" data-i18n="display_title"></h2>
            <div class="field">
              <span class="lbl" data-i18n="clock_label"></span>
              <div class="seg" id="clock-seg" role="group" data-i18n-aria-label="clock_label">
                <button type="button" data-h24="0" data-i18n="clock_12"></button>
                <button type="button" data-h24="1" data-i18n="clock_24"></button>
              </div>
            </div>
            <div class="field">
              <span class="lbl" data-i18n="layout_label"></span>
              <div class="seg" id="layout-seg" role="group" data-i18n-aria-label="layout_label">
                <button type="button" data-layout="auto" data-i18n="layout_auto"></button>
                <button type="button" data-layout="rows" data-i18n="layout_rows"></button>
                <button type="button" data-layout="cols" data-i18n="layout_cols"></button>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="show-t"> <span data-i18n="show_teachers"></span></label>
            <div class="field"><label for="school" data-i18n="school_name"></label><input type="text" id="school" maxlength="160" data-i18n-placeholder="school_ph"></div>
          </div>
        </div>

        <div class="card stack">
          <h2 class="mb0" data-i18n="times_title"></h2>
          <p class="muted small mb0" data-i18n="times_help"></p>
          <div id="slots"></div>
          <datalist id="brk-dl"></datalist>
          <p class="callout danger small mb0" id="slot-warn" hidden data-i18n="time_bad"></p>
          <div class="row">
            <button type="button" class="btn" id="add-period"><span aria-hidden="true">＋</span> <span data-i18n="add_period"></span></button>
            <button type="button" class="btn" id="add-break"><span aria-hidden="true">＋</span> <span data-i18n="add_break"></span></button>
          </div>
          <hr class="divider">
          <h3 class="mb0" data-i18n="recalc_title"></h3>
          <div class="form-row">
            <div class="field"><label for="auto-start" data-i18n="start_at"></label><input type="time" id="auto-start"></div>
            <div class="field"><label for="auto-len" data-i18n="period_len"></label><input type="number" id="auto-len" min="5" max="240" step="5" inputmode="numeric"></div>
            <button type="button" class="btn btn-primary" id="recalc"><span data-i18n="recalc"></span></button>
          </div>
          <p class="muted small mb0" data-i18n="recalc_help"></p>
        </div>

        <div class="card stack">
          <h2 class="mb0" data-i18n="reset_title"></h2>
          <p class="muted small mb0" data-i18n="reset_help"></p>
          <div class="row"><button type="button" class="btn btn-danger" id="reset-all"><span data-i18n="reset"></span></button></div>
        </div>
      </section>

      <!-- SUMMARY -->
      <section class="tabpanel" id="p-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
        <div class="card stack">
          <h2 class="mb0 no-i18n" id="sum-name"></h2>
          <div class="tiles" id="sum-tiles" aria-live="polite"></div>
        </div>
        <div class="card stack">
          <h2 class="mb0" data-i18n="sum_subjects"></h2>
          <div class="scroll-x"><table class="table" id="sum-table"></table></div>
        </div>
        <div class="grid-2">
          <div class="card stack">
            <h2 class="mb0" data-i18n="sum_days"></h2>
            <div class="scroll-x" id="spread"></div>
            <p class="muted small mb0" data-i18n="spread_help"></p>
          </div>
          <div class="card stack" id="sum-teach-card">
            <h2 class="mb0" data-i18n="sum_teachers"></h2>
            <div class="scroll-x" id="sum-teach"></div>
          </div>
        </div>
      </section>

      <!-- TEACHERS -->
      <section class="tabpanel" id="p-teachers" role="tabpanel" aria-labelledby="tab-teachers" hidden>
        <p class="callout" id="no-teachers" hidden data-i18n="no_teachers"></p>
        <div id="teach-main" class="stack">
          <div class="card stack">
            <h2 class="mb0" data-i18n="clashes_title"></h2>
            <p class="muted small mb0" data-i18n="clash_help"></p>
            <div id="clash-list" aria-live="polite"></div>
          </div>
          <div class="card stack">
            <div class="teach-head">
              <h2 class="mb0" data-i18n="teacher_view"></h2>
              <div class="row">
                <label for="teacher-sel" class="sr-only" data-i18n="pick_teacher"></label>
                <select id="teacher-sel" class="no-i18n"></select>
                <button type="button" class="btn" id="print-teacher"><span aria-hidden="true">🖨</span> <span data-i18n="print"></span></button>
              </div>
            </div>
            <p class="small mb0" id="teacher-sum"></p>
            <div class="scroll-x grid-wrap" id="teacher-grid"></div>
          </div>
          <div class="grid-2">
            <div class="card stack">
              <h2 class="mb0" data-i18n="teachers_title"></h2>
              <div class="scroll-x"><table class="table" id="load-table"></table></div>
            </div>
            <div class="card stack">
              <h2 class="mb0" data-i18n="free_title"></h2>
              <p class="muted small mb0" data-i18n="free_help"></p>
              <div class="free-pick">
                <label class="sr-only" for="free-day" data-i18n="col_day"></label>
                <select id="free-day"></select>
                <label class="sr-only" for="free-slot" data-i18n="col_time"></label>
                <select id="free-slot"></select>
              </div>
              <ul id="free-list" aria-live="polite"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- TODAY -->
      <section class="tabpanel" id="p-today" role="tabpanel" aria-labelledby="tab-today" hidden>
        <div class="card stack" id="today-card">
          <div class="today-head">
            <h2><span class="no-i18n" id="today-name"></span> <span class="td-day" id="today-day"></span></h2>
            <div class="row">
              <button type="button" class="btn" id="copy-day"><span aria-hidden="true">📋</span> <span data-i18n="copy_day"></span></button>
              <button type="button" class="btn" id="today-fs" data-i18n-title="fullscreen" data-i18n-aria-label="fullscreen"><span aria-hidden="true">⛶</span></button>
            </div>
          </div>
          <div class="seg" id="today-days" role="group" data-i18n-aria-label="pick_day"></div>
          <p class="callout warning mb0" id="today-note" hidden></p>
          <div id="now-box" aria-live="polite"></div>
          <ol class="day-list" id="day-list"></ol>
        </div>
      </section>

      <details class="card help">
        <summary data-i18n="help_title"></summary>
